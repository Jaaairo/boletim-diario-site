resso em 4 de agosto sobre a intenção de transferir 725 milhões de dólares para a ONU. Essa informação foi fornecida pela Reuters.", "titulo_pt": "Mídia, EUA prontos a versar 725 milhões de dólares para a ONU", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 117559, "titulo": "The gang boss accused of killing rapper Tupac blames his nephew in murder trial", "url": "https://www.france24.com/en/the-gang-boss-accused-of-killing-rapper-tupac-blames-his-nephew-in-murder-trial", "fonte_id": "france24", "data_pub": "2026-08-22T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O homem acusado no julgamento pelo assassinato do rapper Tupac Shakur afirma que foram os disparos fatais disparados pelo sobrinho que o colocaram no centro do caso. Este é o último desenvolvimento em uma das maiores investigações da história de Las Vegas.", "titulo_pt": "Líder da facção acusado do assassinato do rapper Tupac culpa sobrinho em julgamento", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 117560, "titulo": "Children among wounded in Zelensky's hometown, struck by Russian drones", "url": "https://www.france24.com/en/children-among-wounded-in-zelensky-s-hometown-struck-by-russian-drones", "fonte_id": "france24", "data_pub": "2026-08-22T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Zaporizhzhia, uma aeronave não tripulada (drone) atingiu uma pessoa e feriu quatro. Em Kyiv, um depósito pegou fogo. Esses incidentes ocorreram após um ataque russo em Kryvyi Rih que deixou pelo menos 20 mortos, 16 deles em dois ataques consecutivos em um centro comercial lotado.", "titulo_pt": "Crianças entre os feridos na cidade natal de Zelensky, atingida por drones russos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 117681, "titulo": "Mainland Chinese research ship spotted near Taiwan’s largest naval base", "url": "https://www.scmp.com/news/china/diplomacy/article/3364922/mainland-chinese-research-ship-spotted-near-taiwans-largest-naval-base?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio de pesquisa chinês, o Tong Ji, foi avistado perto da base naval principal de Taiwan. O navio estava localizado a 28 milhas náuticas (52km) ao sul-oeste da ilha de Liuchiu, próxima à cidade de Kaohsiung e Zuoying.", "titulo_pt": "Navio de pesquisa chinês avistado perto da base naval principal de Taiwan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117682, "titulo": "Government still weighing decision on restricting proxy voters, Hong Kong official says", "url": "https://www.scmp.com/news/hong-kong/society/article/3364921/government-still-weighing-decision-restricting-proxy-voters-hong-kong-official-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Hong Kong ainda não decidiram se devem limitar os votantes de mandato (votos por procuração) em reuniões de moradores aos parentes ou a outros proprietários de unidades do mesmo condomínio, conforme propostas de alterações na lei. Essa medida poderia ser considerada excessivamente rígida, segundo a diretora de Assuntos Internos, Priscilla To Kit-lai.", "titulo_pt": "Governo ainda pondera restrições a votantes de mandato em reuniões de condomínio, diz oficial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117617, "titulo": "Iran says new US sanctions violate sovereignty of other states", "url": "https://www.aljazeera.com/news/2026/8/22/iran-says-new-us-sanctions-violate-sovereignty-of-other-states?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O porta-voz do Ministério das Relações Exteriores do Irã, Esmaeil Baghaei, criticou as novas sanções dos Estados Unidos, considerando-as uma volta a uma forma de colonialismo clássico. O Irã afirma que as sanções violam a soberania de outros estados.", "titulo_pt": "Irã diz que novas sanções dos EUA violam a soberania de outros estados", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 117601, "titulo": "Muslim World League denounces new Israeli E1 settlement tender", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/muslim-world-league-denounces-new-israeli-e1-settlement-tender", "fonte_id": "middle_east_eye", "data_pub": "2026-08-22T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Liga do Mundo Muçulmano condenou a anúncio israelense de um leilão para a construção de 1.234 unidades de assentamento na área E1 da Cisjordânia Ocidental ocupada. Segundo o secretário-geral e presidente da Associação de Muçulmanos Scholaros, Mohammed Al-Issa, o projeto representa uma ameaça à soberania palestiniana e visa alterar a característica geográfica e demográfica da território ocupado.", "titulo_pt": "Liga do mundo muçulmano condena novo leilão israelense de assentamento E1", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 117442, "titulo": "Former British and French diplomats urge action over Israel’s ‘erasure’ of Palestine", "url": "https://www.theguardian.com/world/2026/aug/22/uk-france-diplomats-israel-palestine", "fonte_id": "guardian_world", "data_pub": "2026-08-22T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de cem ex-diplomatas britânicos e franceses enviaram uma carta a Macron e Burnham acusando Israel de limpeza étnica e pedindo medidas como banimento de comércio e vendas de armas para pressionar Israel a aceitar um Estado palestino. Os ex-diplomatas afirmam que o Estado palestino está sendo eliminado diante dos olhos da comunidade internacional.", "titulo_pt": "Ex-diplomatas britânicos e franceses acusam Israel de limpeza étnica e pedem medidas para pressionar o país a aceitar um estado palestino", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 117215, "titulo": "Trump diz que considera o Estreito de Ormuz \"território americano\"", "url": "https://www.metropoles.com/mundo/trump-diz-que-considera-o-estreito-de-ormuz-territorio-americano", "fonte_id": "metropoles", "data_pub": "2026-08-22T08:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou considerar o Estreito de Ormuz território americano durante uma conversa com jornalistas, em meio a um bloqueio iraniano.", "titulo_pt": "Trump diz que considera o Estreito de Ormuz território americano", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117602, "titulo": "Tehran says Iraqi oil tankers allowed passage through Hormuz", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/tehran-says-iraqi-oil-tankers-allowed-passage-through-hormuz", "fonte_id": "middle_east_eye", "data_pub": "2026-08-22T08:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Téhéran permitiu que navios petroleiros iraquianos passem pelo Estreito de Ormuz. A decisão foi solicitada pelo presidente do parlamento iraquiano, Haibat al-Halbousi, durante uma visita ao Irã.", "titulo_pt": "Téhéran permite passagem de navios petroleiros iraquianos pelo estreito de Ormuz", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 117620, "titulo": "How will Trump’s tariffs affect Canada’s economy?", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/22/how-will-trumps-tariffs-affect-canadas-economy?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos aplicaram tarifas de 50% em setores-chave do Canadá após falhas nas negociações, mas isso não é provável de enfraquecer significativamente a economia canadense.", "titulo_pt": "Como os tarifas de Trump afetarão a economia canadense?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 117621, "titulo": "Panama Canal to reduce shipping as ‘extreme’ El Nino approaches", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/22/panama-canal-to-reduce-shipping-as-extreme-el-nino-approaches?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Canal do Panamá reduzirá a quantidade diária de navios transitando de 40 para 32 a partir do dia 15 de setembro, o que pode levar a um atraso na entrega e aumentar os custos. Essa medida será tomada em face da aproximação do 'extremo' El Niño.", "titulo_pt": "Canal do panamá reduzirá transbordos diários para enfrentar 'extremo' El niño", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 117234, "titulo": "Produtores de gado dos EUA criticam flexibilização na importação de carne", "url": "https://www.cnnbrasil.com.br/agro/produtores-de-gado-dos-eua-criticam-flexibilizacao-na-importacao-de-carne/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Produtores de gado dos Estados Unidos criticam a flexibilização na importação de carne por parte do governo Trump, que busca conter a inflação antes das eleições. Eles alertam para o desestímulo à produção local e o risco de enfraquecer a já em baixa pecuária norte-americana.", "titulo_pt": "Produtores de gado dos EUA criticam flexibilização na importação de carne", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117160, "titulo": "Tarifas de 50% dos EUA sobre Canadá entram em vigor após fracasso em negociações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/tarifas-de-50-dos-eua-sobre-canada-entram-em-vigor-apos-fracasso-em-negociacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos começaram a aplicar neste sábado uma tarifa de 50% sobre produtos canadenses, afetando aproximadamente 20 bilhões de dólares em mercadorias. As negociações para evitar essa medida fracassaram.", "titulo_pt": "Tarifas de 50% dos EUA sobre Canadá entram em vigor após falha nas negociações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 117161, "titulo": "Após conquistar o mundo, Shein sofre para dar o passo seguinte", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/apos-conquistar-o-mundo-shein-sofre-para-dar-o-passo-seguinte.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Shein foi uma das empresas mais comentadas do varejo, conseguindo identificar rapidamente as tendências que a geração Z gostava e transformando-as em produtos baratos em curto prazo.", "titulo_pt": "Após conquistar o mundo, Shein luta para dar o próximo passo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 117357, "titulo": "Da remoção individual à gestão de riscos sistêmicos", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/da-remocao-individual-a-gestao-de-riscos-sistemicos", "fonte_id": "jota", "data_pub": "2026-08-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova arquitetura de responsabilização das plataformas digitais no Brasil se concentra na gestão de riscos sistêmicos, passando da responsabilização individual para uma abordagem mais ampla e coletiva.", "titulo_pt": "Da responsabilização individual às plataformas digitais na gestão de riscos sistêmicos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 117624, "titulo": "World Bank projects war-hit Lebanon’s economy to contract by 6.4 percent", "url": "https://www.aljazeera.com/news/2026/8/22/world-bank-projects-war-hit-lebanons-economy-to-contract-by-6-4-percent?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A World Bank projeta que a economia de Lebanon, afetada pela guerra, contrairá 6,4% no ano. O conflito com Israel está impedindo a recuperação econômica do país, além de aumentar a inflação e os preços dos consumíveis.", "titulo_pt": "Banco mundial projeta contratação de 6,4% na economia de Lebanon devido ao conflito com israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 117583, "titulo": "Six investors reveal the biggest market risks — and one strategy they agree on", "url": "https://www.cnbc.com/2026/08/22/investors-market-risks-diversification-stocks-kospi.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores identificam diferentes riscos para os mercados, mas concordam em diversificar os investimentos além das atuais vencedoras.", "titulo_pt": "Seis investidores revelam os maiores riscos dos mercados — e uma estratégia comum", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 117722, "titulo": "Bitcoin jumps, stocks bounce as traders weigh US Treasury action", "url": "https://www.koreaherald.com/article/10848718", "fonte_id": "korea_herald", "data_pub": "2026-08-22T04:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações globais recuperaram parte das perdas recentes e o Bitcoin subiu mais de 6%, chegando a cerca de $77.188, enquanto os juros das dívidas americanas se mantiveram estáveis e os preços do petróleo aumentaram. A estagnação nas negociações entre Estados Unidos e Irã sobre o reinício do Estreito de Ormuz permitiu essa recuperação.", "titulo_pt": "Bitcoin e ações se recuperam com esforços do tesouro americano e impasse entre EUA e Irã", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 117593, "titulo": "Trump’s challenge: $40tn debt, 6.7% mortgages and $5 diesel", "url": "https://www.ft.com/content/6cb399fa-9fba-4806-98a3-9572fe319622?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-22T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano do presidente enfrenta dificuldades devido ao aumento dos preços devido à guerra com a Irã e aos piores resultados das finanças americanas nos últimos anos.", "titulo_pt": "Desafios para trump: dívida de $40 trilhões, taxas de juros de 6,7% e diesel a $5", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 117594, "titulo": "Bossing the bond market around never works", "url": "https://www.ft.com/content/b9e7a620-1018-4004-a3b0-3c85d494d21d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-22T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Embora Scott Bessent tenha tentado influenciar, os investidores continuam preocupados com a possibilidade de alguma mudança no mercado de títulos.", "titulo_pt": "Comandar o mercado de títulos nunca funciona", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 117162, "titulo": "Zaffari prepara complexo com residencial e passarela ligado ao Bourbon em São Paulo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/zaffari-prepara-complexo-com-residencial-e-passarela-ligado-ao-bourbon-em-sao-paulo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Zaffari planeja iniciar a construção de um complexo imobiliário ainda neste ano, integrado ao Bourbon Shopping, na zona oeste de São Paulo. O complexo incluirá um residencial e uma passarela ligada ao shopping.", "titulo_pt": "Zaffari prepara complexo com residencial e passarela ligado ao Bourbon em São Paulo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 117163, "titulo": "Barretos amplia estrutura do Parque do Peão e busca atrair grandes eventos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/barretos-amplia-estrutura-do-parque-do-peao-e-busca-atrair-grandes-eventos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Festa do Peão de Barretos investiu R$ 30 milhões em infraestrutura para a edição deste ano, criou um novo modelo de hospedagem e projeta uma receita de R$ 600 milhões, buscando atrair outros grandes eventos.", "titulo_pt": "Barretos expande estrutura do Parque do Peão e almeja atração de grandes eventos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 117167, "titulo": "TikTok faz acordo e vai pagar US$ 400 milhões após processo sobre privacidade infantil nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/tiktok-faz-acordo-e-vai-pagar-us-400-milhoes-apos-processo-sobre-privacidade-infantil-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TikTok e a ByteDance concordaram em pagar US$ 400 milhões para encerrar o processo do Departamento de Justiça dos Estados Unidos sobre violação de privacidade de crianças no aplicativo. O acordo foi anunciado nesta sexta-feira (21).", "titulo_pt": "Tiktok concorda em pagar US$ 400 milhões após processo sobre privacidade infantil nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 117177, "titulo": "Dólar cai a R$ 5,14 com alívio no mercado externo", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/dolar-cai-r-514-com-alivio-no-mercado-externo", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-21T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar fechou no valor de R$ 5,142, o menor nível em mais de 10 dias, devido ao alívio no mercado externo e ao enfraquecimento da moeda americana. A bolsa de valores subiu quase 2%.", "titulo_pt": "Dólar cai a R$ 5,14 com alívio no mercado externo", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 116685, "titulo": "Brasil e EUA marcam reunião sobre tarifaço para a próxima semana", "url": "https://www.metropoles.com/mundo/brasil-e-eua-marcam-reuniao-sobre-tarifaco-para-a-proxima-semana", "fonte_id": "metropoles", "data_pub": "2026-08-21T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há um encontro marcado entre representantes dos EUA e do Brasil para a próxima semana, focado em discutir o problema das tarifas. A reunião seguirá após um contato entre o presidente Lula e o presidente Trump, que resultou em uma ligação entre eles.", "titulo_pt": "Brasil e EUA marcam reunião sobre tarifaço para a próxima semana", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116980, "titulo": "Anthropic IPO filing will show AI backlash as a risk factor, sources say", "url": "https://www.cnbc.com/2026/08/21/-anthropic-ipo-filing-will-show-ai-backlash-as-risk-sources-say.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-21T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic está prestes a realizar sua oferta inicial de ações em um momento em que o público está cada vez mais insatisfeito com os centros de dados e tem medo de que a inteligência artificial leve embora empregos.", "titulo_pt": "IPO da anthropic mostrará risco de rejeição à IA, dizem fontes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 116729, "titulo": "Petz Cobasi deve faturar R$ 8 bi em 2026, diz presidente do conselho de administração", "url": "https://www.infomoney.com.br/business/petz-cobasi-deve-faturar-r-8-bi-em-2026-diz-presidente-do-conselho-de-administracao/", "fonte_id": "infomoney", "data_pub": "2026-08-21T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do conselho de administração da Petz Cobasi afirmou que a empresa deve faturar R$ 8 bilhões em 2026. O setor tem enfrentado dificuldades devido a juros altos, concorrência de importados e a presença de apostas online.", "titulo_pt": "Petz Cobasi deve faturar R$ 8 bi em 2026, diz presidente do conselho de administração", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 117571, "titulo": "TikTok agrees to pay $400 million to settle US children's privacy lawsuit", "url": "http://www.euronews.com/2026/08/22/tiktok-agrees-to-pay-400-million-to-settle-us-childrens-privacy-lawsuit", "fonte_id": "euronews", "data_pub": "2026-08-22T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TikTok concordou em pagar 400 milhões de dólares para resolver uma ação judicial nos Estados Unidos sobre a privacidade de crianças. Este acordo é considerado uma vitória importante para os americanos e seus pais.", "titulo_pt": "Tiktok concorda em pagar 400 milhões para resolver ação judicial sobre privacidade de crianças nos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 117735, "titulo": "NASA Cancels Its Rescue Mission for the Aging Swift Telescope", "url": "https://www.wired.com/story/nasa-cancels-its-rescue-mission-for-the-aging-swift-telescope/", "fonte_id": "wired", "data_pub": "2026-08-22T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão de resgate da antiga telescopeira Swift, planejada pela NASA com o auxílio do probe LINK, foi cancelada devido a problemas no sistema de controle do probe.", "titulo_pt": "NASA cancela missão de resgate para a antiga telescopeira Swift", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 117259, "titulo": "Para um dos maiores grupos de publicidade do mundo, IA não é pretexto para abandonar legado", "url": "https://exame.com/exame-in/para-um-dos-maiores-grupos-de-publicidade-do-mundo-ia-nao-e-pretexto-para-abandonar-legado/", "fonte_id": "exame", "data_pub": "2026-08-22T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Angela Tangas, CEO da Oliver e CSO do Brandtech Group, avaliou a transformação digital na comunicação da empresa. O Brandtech Group, avaliado em mais de 4 bilhões de dólares, está passando por mudanças digitais significativas.", "titulo_pt": "Para um dos maiores grupos de publicidade do mundo, IA não é pretexto para abandonar legado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 117724, "titulo": "TikTok to pay $400m settlement in US children's privacy case", "url": "https://www.koreaherald.com/article/10848714", "fonte_id": "korea_herald", "data_pub": "2026-08-22T04:09:00Z", "idioma": "en", "provavel_duplicata_de": 117592, "texto_pt": "TikTok concordou em pagar US$ 400 milhões para resolver uma ação judicial com o Departamento de Justiça dos EUA, que alegava que a plataforma de compartilhamento de vídeos violou leis federais de privacidade infantil. Reguladores de todo o mundo têm aumentado a fiscalização contra as empresas de mídia social que violam leis de proteção de dados, privacidade e segurança de crianças.", "titulo_pt": "Tiktok concorda em pagar US$ 400 milhões em acordo de privacidade infantil nos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 117705, "titulo": "AI memory windfall: Samsung to hand back up to US$79 billion in 2026", "url": "https://www.digitimes.com/news/a20260822VL200/samsung-2026-sk-hynix-policy-cash-flow.html", "fonte_id": "digitimes", "data_pub": "2026-08-22T01:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretoria da Samsung aprovou um plano de retorno aos acionistas para 2026, estimado em KRW90 trilhões a KRW110 trilhões (aproximadamente US$64-79 bilhões), que a empresa afirma será o maior já realizado por uma empresa sul-coreana.", "titulo_pt": "Lucro de memória AI: samsung deve devolver até US$79 bilhões aos acionistas em 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 117730, "titulo": "Michael Polansky is training an AI model on skin that’s still alive", "url": "https://techcrunch.com/2026/08/21/michael-polansky-is-training-an-ai-model-on-skin-thats-still-alive/", "fonte_id": "techcrunch", "data_pub": "2026-08-22T01:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michael Polansky, conhecido publicamente como o parceiro de Lady Gaga e ex-subordinado direto de Sean Parker, tem desenvolvido um startup de IA que mantém tecido cutâneo vivo por semanas fora do corpo para descobrir novos composto para cuidados com a pele. A empresa só está sendo anunciada agora.", "titulo_pt": "Michael Polansky está treinando um modelo de IA em pele que ainda está viva", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 117706, "titulo": "Automation Taipei 2026: If AI is advancing so fast, why is the factory floor still so hard to automate?", "url": "https://www.digitimes.com/news/a20260821VL211/taipei-2026-automation-industrial-taiwan.html", "fonte_id": "digitimes", "data_pub": "2026-08-22T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar do progresso extraordinário da inteligência artificial, a automação na realidade física permanece extremamente difícil.", "titulo_pt": "Automation Taipei 2026: apesar do avanço rápido da IA, a automação na linha de produção ainda é difícil", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 117707, "titulo": "Supermicro's internal probe clears senior management in export-control case", "url": "https://www.digitimes.com/news/a20260821VL217/supermicro-investigation-sales.html", "fonte_id": "digitimes", "data_pub": "2026-08-22T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Supermicro informou que uma investigação interna, conduzida por diretores independentes, não encontrou evidências de que quaisquer gerentes sêniores atuais tivessem conhecimento de um suposto esquema para desviar produtos controlados por exportação. Este esquema foi o centro de uma acusação federal feita contra dois empregados e um contratado da Supermicro em março.", "titulo_pt": "Investigação interna da supermicro exime gerentes sêniores em caso de controle de exportação", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 117708, "titulo": "America's launch boom runs into a capacity problem as White House targets 1,000 annual space launches", "url": "https://www.digitimes.com/news/a20260821VL218/launch-commercial-capacity-infrastructure-transportation.html", "fonte_id": "digitimes", "data_pub": "2026-08-22T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O setor comercial espacial dos Estados Unidos está entrando em uma fase onde a capacidade de lançar mais foguetes não é mais o único teste de escala industrial. Com a frequência de voo aumentando e múltiplos fornecedores se movendo para maior produtividade, a infraestrutura associada a cada missão está se tornando a restrição mais difícil.", "titulo_pt": "Boom de lançamentos dos EUA enfrenta problema de capacidade enquanto casa branca almeja 1.000 lançamentos anuais", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 117709, "titulo": "Interview: Arbe Robotics on why radar is needed for autonomous driving and beyond", "url": "https://www.digitimes.com/news/a20260820VL214/autonomous-driving-technology-tesla.html", "fonte_id": "digitimes", "data_pub": "2026-08-22T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de direção autônoma está se aperfeiçoando, e um futuro onde os carros se dirigem sozinhos está rapidamente se aproximando. No entanto, a segurança e a confiança ainda são barreiras cruciais que precisam ser superadas antes que a direção autônoma total se torne realidade, e uma parte fundamental disso são os 'olhos' do carro, que incluem a utilização de radares.", "titulo_pt": "Entrevista: arbe Robotics sobre a necessidade de radares para a direção autônoma e além", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 117711, "titulo": "Manz Asia says yield is key to glass core mass production", "url": "https://www.digitimes.com/news/a20260819PD227/manz-asia-advanced-packaging-equipment-production.html", "fonte_id": "digitimes", "data_pub": "2026-08-22T01:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crescente tamanho de chips de IA está impulsionando a adoção de novas tecnologias de embalagem, como FOPLP, CoPoS e Glass Core, que são desenvolvidas em paralelo com a mudança do uso de wafers de 300 mm para painéis quadrados. Segundo o gerente geral da Manz Asia, Robert Lin, a taxa de produção será o fator decisivo para o Glass Core entrar em produção em massa.", "titulo_pt": "Manz Asia diz que a produtividade é crucial para a produção em massa do glass core", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 117731, "titulo": "Japanese space tech startup Letara expands beyond satellite thrusters with $16M", "url": "https://techcrunch.com/2026/08/21/japanese-space-tech-startup-letara-expands-beyond-satellite-thrusters-with-16m/", "fonte_id": "techcrunch", "data_pub": "2026-08-22T01:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup japonesa Letara está investindo sua tecnologia de foguetes híbridos em mercados além dos reatores de pequenos satélites, incluindo espaço, defesa e segurança, após levantar 2,6 bilhões de ienes (aproximadamente 16 milhões de dólares).", "titulo_pt": "Startup japonesa Letara expande tecnologia de foguetes híbridos com financiamento de 16 milhões de dólares", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 116378, "titulo": "Report outlines AI’s workplace effects", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/22/2003862907", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório descreve os efeitos do inteligência artificial no ambiente de trabalho. Ele aborda como a AI está alterando as dinâmicas de trabalho em diversas indústrias.", "titulo_pt": "Relatório detalha os efeitos da IA no ambiente de trabalho", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 117665, "titulo": "Takaichi eyes Cabinet reshuffle in mid-to-late September", "url": "https://www.japantimes.co.jp/news/2026/08/22/japan/politics/takaichi-cabinet-reshuffle-september/", "fonte_id": "japan_times", "data_pub": "2026-08-21T23:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira-ministra Sanae Takaichi está considerando uma reforma do gabinete entre setembro e outubro. Ela busca criar um ambiente favorável para sua reeleição como presidente do Partido Liberal Democrata (LDP).", "titulo_pt": "Takaichi considera reforma do gabinete no meio ou final de setembro", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 117736, "titulo": "The Unlikely Place at the Center of China’s AI Boom", "url": "https://www.wired.com/story/the-unlikely-place-at-the-center-of-chinas-ai-boom/", "fonte_id": "wired", "data_pub": "2026-08-21T23:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma cidade na Mongólia Interior se tornou um centro crucial para os dados centrais devido a energia barata, terra abundante e proximidade com Beijing.", "titulo_pt": "O improbável local no centro do Boom de inteligência artificial da China", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 117737, "titulo": "Tesla’s Door Handles Lead to Its Biggest Recall Yet", "url": "https://www.wired.com/story/teslas-door-handles-lead-to-its-biggest-recall-yet/", "fonte_id": "wired", "data_pub": "2026-08-21T23:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tesla está realizando duas chamadas de atenção afetando cerca de 3 milhões de veículos, que podem ser corrigidas principalmente por atualizações remotos, mas também exigirão adesivos de aviso físicos e atualizações relacionadas a câmeras.", "titulo_pt": "Portas de tesla lideram sua maior chamada de atenção até agora", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 117150, "titulo": "China fará missão em busca de água no polo sul da Lua; lançamento é previsto para este domingo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/china-fara-missao-em-busca-de-agua-no-polo-sul-da-lua-lancamento-e-previsto-para-este-domingo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China está prestes a lançar a missão Chang'e-7, que busca água na superfície da Lua. O lançamento está programado para este domingo (23) às 21h (horário de Brasília).", "titulo_pt": "China fará missão em busca de água no polo sul da Lua; lançamento previsto para este domingo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 117649, "titulo": "NASA-led study shows some Earth microbes could survive on the moon", "url": "https://www.japantimes.co.jp/news/2026/08/22/world/science-health/nasa-earth-microbes-survive-moon/", "fonte_id": "japan_times", "data_pub": "2026-08-22T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado pela NASA sugere que algumas microorganismos terrestres poderiam sobreviver na superfície da Lua. Isso levanta preocupações sobre a possibilidade de uma transferência não intencional de vida da Terra para a Lua.", "titulo_pt": "Estudo liderado pela nasa indica que alguns microrganismos terrestres poderiam sobreviver na lua", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 117743, "titulo": "APOD: 2026 August 22 – Mostly Perseids", "url": "https://science.nasa.gov/image-article/apod/apod-2026-august-22-mostly-perseids/", "fonte_id": "nasa_news", "data_pub": "2026-08-22T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD para 22 de agosto de 2026 focará principalmente nos Perseides. A explicação completa será escrita por um astrônomo profissional.", "titulo_pt": "APOD: 22 de agosto de 2026 – principalmente perseides", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 117655, "titulo": "In U.S., rare earths extracted from coal mine wastewater", "url": "https://www.japantimes.co.jp/business/2026/08/22/us-rare-earths-coal-mine-wastewater/", "fonte_id": "japan_times", "data_pub": "2026-08-22T02:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo projeto piloto atinge dois objetivos: a limpeza do ambiente e a recuperação de minerais críticos como um produto secundário valioso.", "titulo_pt": "Nos estados unidos, raramente extraídos, minerais de terra rara são recuperados da água residual de minas de carvão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 117741, "titulo": "Bipartisan majorities in US favor banning glyphosate", "url": "https://phys.org/news/2026-08-bipartisan-majorities-favor-glyphosate.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com uma pesquisa nacional realizada pelo Centro de Política Pública Annenberg da Universidade da Pensilvânia, dois terços dos americanos apoiam a proibição do uso do herbicida glyphosate em cultivos nos Estados Unidos.", "titulo_pt": "Maioria bipartidária nos EUA apoia proibição de glyphosate", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116363, "titulo": "Exhibition showcases heat adaptation technologies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862933", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma exposição está apresentando tecnologias de adaptação ao calor. O evento destaca inovações relacionadas à mitigação do efeito do calor em ambientes diversos.", "titulo_pt": "Exposição apresenta tecnologias de adaptação ao calor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 116364, "titulo": "Institute introduces plan for conserving three plant species", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862934", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O instituto apresentou um plano para conservar três espécies de plantas. O objetivo é proteger essas espécies de plantas em perigo de extinção.", "titulo_pt": "Instituto apresenta plano para conservar três espécies de plantas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 117065, "titulo": "Hydrogel platform uses vitamin B2 and blue light to simplify living tissue models", "url": "https://phys.org/news/2026-08-hydrogel-platform-vitamin-b2-blue.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Universidade de Tampere desenvolveram uma plataforma de hidrogel versátil que facilita a criação de biomateriais personalizados para engenharia de tecidos, modelagem de doenças, descoberta de fármacos e medicina regenerativa. A tecnologia de cruzamento plug-and-play permite o design de uma ampla gama de hidrogels em que podem ser incorporados moléculas biológicas sob condições suaves e amigáveis para células.", "titulo_pt": "Plataforma de hidrogel utiliza vitamina B2 e luz azul para simplificar modelos de tecidos vivos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116833, "titulo": "“Foliares inteligentes”: lograron respuestas de hasta 465 kilos por hectárea en trigo con una estrategia que integra nutrición y bioestimulación", "url": "https://www.lanacion.com.ar/economia/campo/foliares-inteligentes-lograron-respuestas-de-hasta-465-kilos-por-hectarea-en-trigo-con-una-nid21082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T21:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os testes realizados em quatro áreas de trigo com uma tecnologia de Rizobacter resultaram em aumentos de produtividade e uma resposta superior aos tratamentos convencionais de zinco foliar.", "titulo_pt": "Foliar inteligente: tecnologia de rizobacter gerou rendimentos superiores em trigo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 117066, "titulo": "Climate change could triple the price of wheat", "url": "https://phys.org/news/2026-08-climate-triple-price-wheat.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento das mudanças climáticas pode triplicar o preço do trigo. A escassez de água em várias regiões importantes para a produção de trigo global pode afetar significativamente os preços no mercado mundial, impactando produtos como pão, massa e cereal.", "titulo_pt": "Mudanças climáticas podem triplicar o preço do trigo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116649, "titulo": "Onda de vacinas contra câncer pode ser inaugurada em breve", "url": "https://www.cnnbrasil.com.br/saude/onda-de-vacinas-contra-o-cancer-pode-ser-inaugurada-em-breve-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um imunizante personalizado baseado em mRNA está mantendo o melanoma sob controle e pode abrir caminho para novos métodos de tratamento de outros tipos de tumores.", "titulo_pt": "Onda de vacinas contra câncer pode ser inaugurada em breve", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117067, "titulo": "Your high school friends may shape whether you become an entrepreneur decades later", "url": "https://phys.org/news/2026-08-high-school-friends-entrepreneur-decades.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por programas de empreendedorismo está aumentando no Canadá, com mais jovens considerando a autossustentação devido a uma alta taxa de desemprego juvenil. O número de aplicativos para a Futurpreneur, uma organização nacional que financia empreendedores jovens canadenses, aumentou 50% no último trimestre, em comparação com um crescimento de 15% no ano anterior.", "titulo_pt": "Seus amigos da escola podem influenciar se você se tornará um empreendedor décadas depois", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 117068, "titulo": "Complex odors prove easier to map than expected with machine learning", "url": "https://phys.org/news/2026-08-complex-odors-easier-machine.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descrição de odores complexos não possui um equivalente ao Pantone para cores, mas a aprendizagem de máquina pode facilitar essa tarefa. Até agora, não havia um sistema similar para complexos odores como existe para as cores.", "titulo_pt": "Odores complexos podem ser mapeados com mais facilidade do que se pensava usando aprendizagem de máquina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 117097, "titulo": "What happens when a galaxy's supermassive black hole turns off? These dying radio galaxies could show us", "url": "https://www.space.com/astronomy/black-holes/what-happens-when-a-galaxys-supermassive-black-hole-turns-off-these-dying-radio-galaxies-could-show-us", "fonte_id": "space_com", "data_pub": "2026-08-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram uma população de galáxias com lóbulos de rádio que estão se apagando, revelando o que acontece com essas vastas jatos quando os motores de seus buracos negros supermassivos param de funcionar.", "titulo_pt": "O que acontece quando o superburaco negro de uma galáxia para de funcionar? Essas galáxias moribundas de rádio poderiam nos mostrar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 117266, "titulo": "Estrela mais rápida da Via Láctea atinge 25 mil km/s ao redor de buraco negro", "url": "https://exame.com/ciencia/estrela-mais-rapida-da-via-lactea-atinge-25-mil-km-s-ao-redor-de-buraco-negro/", "fonte_id": "exame", "data_pub": "2026-08-21T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estrela mais rápida da Via Láctea atinge 25 mil km/s ao redor de Sagitário A*, permitindo pela primeira vez medir diretamente a rotação deste buraco negro e testar previsões da teoria de Einstein.", "titulo_pt": "Estrela mais rápida da Via Láctea atinge 25 mil km/s ao redor de buraco negro sagitário a*", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 116652, "titulo": "Marte ganhou uma batata como lua depois de um impacto violento modificar o formato original de Deimos; cientistas agora recriaram como tudo aconteceu", "url": "https://www.cnnbrasil.com.br/ciencia/marte-ganhou-uma-batata-como-lua-depois-de-um-impacto-violento-modificar-o-formato-original-de-deimos-cientistas-agora-recriaram-como-tudo-aconteceu/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um único impacto de asteroide mudou a forma da lua de Marte, criando sua cratera polar e camada de poeira. Marte ganhou uma 'batata' como lua devido a um impacto violento que remodelou Deimos.", "titulo_pt": "Marte ganhou uma 'batata' como lua após impacto de asteroide", "veiculo": "C veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 117754, "titulo": "Elouise Eftos: Aphrodite review – ‘Australia’s first attractive comedian’ asks if love is real", "url": "https://www.theguardian.com/stage/2026/aug/22/elouise-eftos-aphrodite-review", "fonte_id": "guardian_culture", "data_pub": "2026-08-22T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aphrodite é um espetáculo de stand-up de Elouise Eftos que questiona se o amor é real, continuando o trabalho provocativo de sua estreia. O show aborda temas como sexo e expectativas de forma inteligente e direta.", "titulo_pt": "Aphrodite: a primeira comediante atraente da austrália questiona se o amor é real", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 117755, "titulo": "Dirty Dancer review – Swayze stan is like a whirlwind as she replays 80s favourite", "url": "https://www.theguardian.com/stage/2026/aug/22/dirty-dancer-review-melissa-firlit", "fonte_id": "guardian_culture", "data_pub": "2026-08-22T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Melissa Firlit apresenta uma performance de 'Dirty Dancing' em formato de show solo, misturando trivia, memórias pessoais e um sing-along. A peça recria a experiência do filme, desde a viagem até o resort até os momentos icônicos, como o levantamento de Patrick Swayze e Jennifer Grey.", "titulo_pt": "Revisão de dirty Dancer – a paixão de firlit é como uma tempestade enquanto ela recria o filme dos anos 80", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 117756, "titulo": "Courtney Büchner: One of the Girls review – all aboard for a rollercoaster relationship", "url": "https://www.theguardian.com/stage/2026/aug/22/courtney-buchner-one-of-the-girls-review-pleasance-edinburgh", "fonte_id": "guardian_culture", "data_pub": "2026-08-22T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Courtney Büchner narra su ontológico prepara o bebê para a amamentação, dizem dentistas", "url": "https://www.cnnbrasil.com.br/saude/pre-natal-odontologico-prepara-o-bebe-para-a-amamentacao-dizem-dentistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas da Faculdade de Odontologia de Ribeirão Preto (FORP) da USP afirmam que o pré-natal odontológico pode prevenir problemas bucais durante a gestação, esclarecer dúvidas e preparar a família para os cuidados com a boca do recém-nascido.", "titulo_pt": "Pré-natal odontológico prepara o bebê para a amamentação, dizem dentistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116647, "titulo": "Campo de society financiado pelo tráfico é alvo de operação da PF", "url": "https://www.cnnbrasil.com.br/nacional/norte/ro/campo-de-society-financiado-pelo-trafico-e-alvo-de-operacao-da-pf/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma operação da Polícia Federal investiga um esquema de tráfico de drogas e lavagem de dinheiro associado a um campo de society. Cinco imóveis foram sequestrados por determinação da Justiça.", "titulo_pt": "Campo de society financiado pelo tráfico é alvo de operação da PF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116924, "titulo": "Gobierno da inicio a ronda de diálogos ciudadanos para sociabilizar agenda de seguridad", "url": "https://www.latercera.com/nacional/noticia/gobierno-da-inicio-a-ronda-de-dialogos-ciudadanos-para-sociabilizar-agenda-de-seguridad/", "fonte_id": "la_tercera", "data_pub": "2026-08-21T20:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo iniciou uma série de reuniões com a população em Colina para discutir a agenda de segurança. Essas sessões serão realizadas em outras regiões do país, com a próxima prevista para Valparaíso na próxima semana.", "titulo_pt": "Governo inicia rodada de diálogos com cidadãos sobre agenda de segurança", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 116615, "titulo": "Relatório enviado ao STF mostra avanço na automação de câmeras corporais em SP", "url": "https://veja.abril.com.br/brasil/relatorio-enviado-ao-stf-mostra-avanco-na-automacao-de-cameras-corporais-em-sp/", "fonte_id": "veja", "data_pub": "2026-08-21T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório enviado ao STF (Supremo Tribunal Federal) indica que a automação de câmeras corporais em São Paulo avançou, com 15 mil novos equipamentos. O sistema de acionamento remoto está ativo em mais de 93% das gravações.", "titulo_pt": "Relatório mostra avanço na automação de câmeras corporais em SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 116929, "titulo": "Alcaldesa San Martín destaca resultados de programa de reinserción de Las Condes: 92% se mantiene alejado del delito", "url": "https://www.latercera.com/nacional/noticia/alcaldesa-san-martin-destaca-resultados-de-programa-de-reinsercion-de-las-condes-92-se-mantiene-alejado-del-delito/", "fonte_id": "la_tercera", "data_pub": "2026-08-21T20:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O programa de reinserção social de Las Condes, implementado pelo município, combina capacitação em ofícios e acompanhamento integral. A prefeita destacou que 92% dos participantes se mantêm afastados do delito após o programa.", "titulo_pt": "Prefeita de Las Condes destaca sucesso do programa de reinserção social: 92% evitam delito", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 116768, "titulo": "Por que a definição sobre o autismo virou ponto central de uma batalha", "url": "https://www.bbc.com/portuguese/articles/c1w1rg95er9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-21T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A discussão continua sobre a validade de definir indivíduos tão diversos quanto autistas como um grupo único. O debate se centra na definição do autismo e suas implicações.", "titulo_pt": "Por que a definição do autismo se tornou o centro de uma disputa", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 115806, "titulo": "Entregador é preso por espancamento de homem em Copacabana", "url": "https://veja.abril.com.br/brasil/entregador-e-preso-por-espancamento-de-homem-em-copacabana/", "fonte_id": "veja", "data_pub": "2026-08-21T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram detidas pela morte de Cláudio Rafael Landeiro Moreira, ocorrida em Copacabana. Um indivíduo ainda está foragido.", "titulo_pt": "Entregador é preso por espancamento que resultou na morte de homem em Copacabana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115810, "titulo": "Polícia investiga ‘ranking’ com fotos de estudantes e ‘avaliações’ de teor sexual", "url": "https://veja.abril.com.br/brasil/policia-investiga-ranking-com-fotos-de-estudantes-e-avaliacoes-de-teor-sexual/", "fonte_id": "veja", "data_pub": "2026-08-21T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes da Unoeste em Presidente Prudente são vítimas de uma montagem criminosa que envolve fotos deles e avaliações com conteúdo sexual. A polícia está investigando o caso.", "titulo_pt": "Polícia investiga montagem com fotos de estudantes e avaliações sexuais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 117679, "titulo": "Customs seizes endangered turtles and parrots in 2 cases, arrests woman", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3364924/customs-seizes-endangered-turtles-and-parrots-2-cases-arrests-woman?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alfândega de Hong Kong apreendeu tartarugas e papagaios em dois casos de contrabando separados, resultando na prisão de uma mulher. Foram encontradas 17 tartarugas vivas em uma embalagem declarada como contendo um casaco que chegou do Aeroporto Internacional de Hong Kong dos Estados Unidos.", "titulo_pt": "Alfândega apreende tartarugas e papagaios e prende mulher em dois casos de contrabando", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117241, "titulo": "“Super El Niño”: ONG avalia risco para moradias vulneráveis no Brasil", "url": "https://www.cnnbrasil.com.br/ciencia/super-el-nino-ong-avalia-risco-para-moradias-vulneraveis-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Não-Governamental Habitat para a Humanidade Brasil alerta para o risco de aumento de eventos como enchentes, deslizamentos de terra, estiagens e queimadas devido à elevação das temperaturas e mudanças nas chuvas associadas ao fenômeno 'Super El Niño'.", "titulo_pt": "Super El Niño: ONG avalia risco para moradias vulneráveis no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117547, "titulo": "Climatologist Jean Jouzel: 'None of France's presidential candidates truly grasp the reality of global warming'", "url": "https://www.lemonde.fr/en/environment/article/2026/08/22/climatologist-jean-jouzel-none-of-france-s-presidential-candidates-truly-grasp-the-reality-of-global-warming_6756754_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O paleoclimatologista e ex-vice-presidente do painel científico do IPCC, Jean Jouzel, expressou preocupação sobre a possibilidade de que os candidatos presidenciais franceses não compreendam plenamente a gravidade do aquecimento global. Ele incentiva os candidatos a reconhecerem a escala deste desafio global.", "titulo_pt": "Cientista do clima Jean Jouzel: 'nenhum dos candidatos presidenciais franceses realmente compreende a realidade do aquecimento global'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 117699, "titulo": "China banned ivory, but Vietnamese gangs keep the trade alive", "url": "https://www.scmp.com/week-asia/health-environment/article/3364858/china-banned-ivory-vietnamese-gangs-keep-trade-alive?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três meses após deixar uma porta fluvial interna do Congo, uma remessa de madeira que chegou à Vietnam neste verão escondia 1,2 toneladas quase de ossos de elefante de ivoire, contrabandeado por metade do mundo. A carga viajou cerca de 9.000 náuticos com paradas em Sri Lanka e Singapura antes de chegar a Quy Nhon, um porto na costa central do Vietnam.", "titulo_pt": "China proibiu o ivoire, mas gangues vietnamitas mantêm o comércio vivo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117664, "titulo": "Heat wave-hit Europe logs over 30,000 excess summer deaths", "url": "https://www.japantimes.co.jp/environment/2026/08/22/heat-wave-europe-30000-deaths/", "fonte_id": "japan_times", "data_pub": "2026-08-22T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre julho e agosto, o EuroMomo, plataforma de monitoramento da Europa, estima que mais de 32.000 mortes a mais ocorreram na região. O verão ainda não terminou.", "titulo_pt": "Onslaught de calor na Europa registra mais de 30.000 mortes a mais no verão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 116371, "titulo": "Indigenous groups unequally affected by energy poverty", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862942", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos indígenas são afetados de forma desigual pela pobreza energética.", "titulo_pt": "Grupos indígenas afetados de forma desigual pela pobreza energética", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 116638, "titulo": "Após ciclone, Brasil terá extremos de “calor sufocante” e geadas; entenda", "url": "https://www.cnnbrasil.com.br/nacional/brasil/apos-ciclone-brasil-tera-extremos-de-calor-sufocante-e-geadas-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil enfrentará condições climáticas extremas, com temperaturas baixas e geadas no Sul, e calor extremo, conhecido como 'calor sufocante', em outras regiões. Uma massa de ar frio está se movendo pelo centro-sul do país, afetando principalmente o Sul, partes do Sudeste e Centro-Oeste.", "titulo_pt": "Após ciclone, Brasil terá extremos de calor e geadas; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116076, "titulo": "“Súper Niño”: adelantan que el fenómeno será uno de los más fuertes desde 1950 y dónde ya hay riesgos", "url": "https://www.lanacion.com.ar/economia/campo/super-nino-adelantan-que-el-fenomeno-sera-uno-de-los-mas-fuertes-desde-1950-y-donde-ya-hay-riesgos-nid20082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um informe do Ministério de Infraestrutura e Serviços Públicos indica que há mais de 90% de probabilidade de o fenômeno 'Súper Niño' se tornar 'Muito Forte'. Até o momento, 58 dos 92 municípios analisados já superaram suas médias históricas de precipitação e dez apresentam excedentes hídricos superiores a 50%.", "titulo_pt": "Super Niño: fenômeno será um dos mais fortes desde 1950 e já há riscos em vários municípios", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 116077, "titulo": "Amenaza de inundación en Florida: tras las tormentas en Nueva York, avanza el mal tiempo hacia el sur", "url": "https://www.lanacion.com.ar/estados-unidos/florida/amenaza-de-inundacion-en-florida-tras-las-tormentas-en-nueva-york-avanza-el-mal-tiempo-hacia-el-sur-nid21082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Há ameaça de inundações na Flórida, com a chegada de tempestades após fortes chuvas em Nova York. As áreas com mais calor e possíveis fortes chuvas também serão monitoradas.", "titulo_pt": "Ameaça de inundações na flórida após tormentas em nova York", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 115988, "titulo": "Recuperaron un bosque para las tortugas de tierra y 20 años después el mismo hábitat se convirtió en un lugar de liberación para casi 500 ranas excavadoras en peligro de extinción y otras especies", "url": "https://www.clarin.com/estados-unidos/recuperaron-bosque-tortugas-tierra-20-anos-despues-mismo-habitat-convirtio-lugar-liberacion-500-ranas-excavadoras-peligro-extincion-especies_0_N6qpy4VXnN.html", "fonte_id": "clarin", "data_pub": "2026-08-21T17:06:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jim e Laura Currie iniciaram a restauração de um terreno degradado em Mississippi, Estados Unidos, 20 anos atrás. Como resultado, a primeira população ativa da espécie de tartaruga de terra local foi registrada no condado de Hancock.", "titulo_pt": "Restauraram um bosque para tartarugas de terra e 20 anos depois, 500 rãs excavadoras em perigo de extinção foram liberadas no mesmo local", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 115851, "titulo": "Vírus letal provoca redução de 83% de pererecas em reserva de SC", "url": "https://www.cnnbrasil.com.br/ciencia/virus-letal-provoca-reducao-de-83-de-pererecas-em-reserva-de-sc/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo demonstrou uma mortandade massiva de pererecas em uma reserva da Mata Atlântica localizada em São Paulo e Santa Catarina, devido à ranavirose, um vírus letal que afeta anfíbios.", "titulo_pt": "Vírus letal provoca redução de 83% de pererecas em reserva de SC", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 115934, "titulo": "MPF se posiciona contra projeto que reduz APA da Baleia Franca em Santa Catarina", "url": "https://www.brasildefato.com.br/2026/08/21/mpf-se-posiciona-contra-projeto-que-reduz-apa-da-baleia-franca-em-santa-catarina/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-21T14:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) expressou sua oposição a um projeto de lei que visa reduzir a Área de Proteção Ambiental (APA) da Baleia Franca no litoral de Santa Catarina, podendo retirar cerca de 34 mil hectares da área protegida.", "titulo_pt": "MPF se posiciona contra projeto que reduz APA da Baleia Franca em Santa Catarina", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 115752, "titulo": "Expansão da energia solar na China reduz diversidade de aves, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/expansao-da-energia-solar-na-china-reduz-diversidade-de-aves-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado na China e publicado na revista Journal indica que a expansão global da energia solar pode afetar a biodiversidade, especialmente reduzindo a diversidade de aves. O estudo foi divulgado na quinta-feira (20).", "titulo_pt": "Expansão da energia solar na China pode reduzir diversidade de aves, sugere estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116269, "titulo": "New videos show deadly landslide burying gold miners in Central African Republic", "url": "http://www.euronews.com/video/2026/08/21/new-videos-show-deadly-landslide-burying-gold-miners-in-central-african-republic", "fonte_id": "euronews", "data_pub": "2026-08-21T13:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vídeos recentemente filmados no local de mineração de Zamboye, no Central African Republic, mostram um deslizamento de terra que sepultou mineradores em um ouvinte de ouro artesanal no dia 18 de agosto.", "titulo_pt": "Novos vídeos mostram deslizamento de terra sepultando mineradores de ouro no Central African Republic", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 115883, "titulo": "El Niño eleva alerta para incêndios, e governo articula prevenção com estados", "url": "https://exame.com/esg/el-nino-eleva-alerta-para-incendios-e-governo-articula-prevencao-com-estados/", "fonte_id": "exame", "data_pub": "2026-08-21T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo articula medidas de prevenção para incêndios florestais em virtude do El Niño, recebendo estratégias de 11 estados para orientar equipes e recursos em áreas mais vulneráveis.", "titulo_pt": "El Niño aumenta alerta para incêndios e governo articula prevenção com estados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 115084, "titulo": "Casal planta 34 mil árvores e transforma área em refúgio para coalas", "url": "https://www.metropoles.com/colunas/e-o-bicho/casal-planta-34-mil-arvores-e-transforma-area-em-refugio-para-coalas", "fonte_id": "metropoles", "data_pub": "2026-08-21T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os australianos Brett e Lisa Vercoe estão plantando 34 mil árvores em uma fazenda de 30 hectares, transformando a área em um refúgio para coalas e outros animais.", "titulo_pt": "Casal planta 34 mil árvores e transforma área em refúgio para coalas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 116361, "titulo": "Indonesian workers allege forced labor, salary cuts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862931", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores indonésios acusam empregadores de usar trabalho forçado e reduzir salários. Os relatos indicam violações de direitos trabalhistas em operações de empregos temporários.", "titulo_pt": "Trabalhadores indonésios acusam trabalho forçado e cortes salariais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 117013, "titulo": "Indian workers in Israel demand accountability after murder of Indian caregiver", "url": "https://www.middleeasteye.net/news/indian-workers-israel-demand-accountability-after-murder-indian-caregiver", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores indianos em Israel exigem responsabilização após o assassinato de uma cuidadora indiana. Rajeev Acharya, um cuidador indiano, foi morto a facadas por um cidadão israelense, levantando preocupações sobre a vulnerabilidade de milhares de trabalhadores indianos no país.", "titulo_pt": "Trabalhadores indianos em Israel exigem responsabilização após assassinato de cuidadora", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 116993, "titulo": "Can a humanitarian disaster be averted in Somalia?", "url": "https://www.aljazeera.com/video/inside-story/2026/8/21/can-a-humanitarian-disaster-be-averted-in-somalia-2?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T20:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU alerta para uma nova crise de fome, com a ameaça de estação de fome a milhões de pessoas em Somalia.", "titulo_pt": "Uma nova crise de fome pode ameaçar milhões em Somalia?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 116250, "titulo": "'My way of fighting is by giving women work': Afghan women turn to entrepreneurship", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/21/my-way-of-fighting-is-by-giving-women-work-afghan-women-turn-to-entrepreneurship_6756738_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres afegãs estão recorrendo à empreendedorismo como forma de luta, aprendendo os fundamentos através de cursos online e promovendo suas atividades nas redes sociais. No entanto, não está claro por quanto tempo essa possibilidade continuará disponível.", "titulo_pt": "Minha forma de luta é dar trabalho a mulheres: mulheres afegãs apostam no empreendedorismo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 117024, "titulo": "'Bloodline punishment': Iranian family faces ongoing punitive ICE detention", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/bloodline-punishment-iranian-family-faces-ongoing-punitive-ice-detention", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma família iraniana com sede em Los Angeles tem sido detida pela ICE há mais de 130 dias devido a atividades políticas de um parente há cerca de 50 anos. Os três membros permanentes da família, incluindo o marido Maryam Tahmasebi, seu filho de 16 anos e ela mesma, tiveram seus cartões verdes revogados após uma campanha online.", "titulo_pt": "Punição pelo sangue: família iraniana enfrenta detenção ICE prolongada", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 116124, "titulo": "Home Office could be blocked from deporting trafficking victims to Albania", "url": "https://www.theguardian.com/uk-news/2026/aug/21/home-office-albanian-trafficking-victims-deport", "fonte_id": "guardian_world", "data_pub": "2026-08-21T12:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal majoritário decidiu que o Home Office pode ser impedido de deportar muitos jovens e masculinos vítimas de tráfico para Albânia. Muitos homens albaneses identificados como vítimas potenciais de tráfico no Reino Unido foram devolvidos ao seu país mesmo se forem considerados seguros lá.", "titulo_pt": "Governo britânico pode ser impedido de deportar vítimas de tráfico para albânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 115087, "titulo": "Justiça mantém condenação de mulher que fingiu próprio sequestro no DF", "url": "https://www.metropoles.com/distrito-federal/justica-mantem-condenacao-de-mulher-que-fingiu-proprio-sequestro-no-df", "fonte_id": "metropoles", "data_pub": "2026-08-21T11:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi condenada por ter fingido seu próprio sequestro no Distrito Federal. Ela usou o celular de um conhecido para enviar mensagens falsas, exigindo resgate de R$ 5 mil ao seu companheiro.", "titulo_pt": "Justiça mantém condenação de mulher que fingiu próprio sequestro no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115454, "titulo": "Who does the law serve in the occupied West Bank?", "url": "https://www.aljazeera.com/video/by-the-numbers-3/2026/8/21/who-does-the-law-serve-in-the-occupied-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os colonos israelenses atacam seis vezes por dia na Cisjordânia ocupada. AJLabs investiga como o território palestino é apropriado.", "titulo_pt": "Quem a lei serve na cisjordânia ocupada?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 115540, "titulo": "Outrage as China programmer’s toilet death ruled non-work-related for being ‘not at desk’", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3364847/outrage-china-programmers-toilet-death-ruled-non-work-related-being-not-desk?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T10:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xing Zhi, um programador de 39 anos de Shenzhen, morreu no banheiro da empresa em abril após ir diretamente ao banheiro em vez de ir para seu escritório. As autoridades não classificaram a morte como relacionada ao trabalho, alegando que ele não estava à mesa de trabalho.", "titulo_pt": "Ira na China após morte de programador no banheiro não ser classificada como relacionada ao trabalho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 114975, "titulo": "‘É uma das maiores crises humanitárias do país’, diz Damares sobre mortes de Yanomamis", "url": "https://veja.abril.com.br/brasil/e-uma-das-maiores-crises-humanitarias-do-pais-diz-damares-sobre-mortes-de-yanomamis/", "fonte_id": "veja", "data_pub": "2026-08-21T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Damares afirmou que as mortes de Yanomamis representam uma das maiores crises humanitárias do país. Uma comissão está solicitando investigação sobre o destino de uma verba bilionária destinada à assistência aos Yanomamis.", "titulo_pt": "É uma das maiores crises humanitárias do país', diz Damares sobre mortes de Yanomamis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115673, "titulo": "Hundreds of health and nutrition facilities closed as Somalia’s child crisis deepens", "url": "https://www.unicef.org/press-releases/hundreds-health-and-nutrition-facilities-closed-somalias-child-crisis-deepens", "fonte_id": "unicef", "data_pub": "2026-08-21T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas instalações de saúde e nutrição foram fechadas em Somalia à medida que a crise infantil se agrava. Esta é uma síntese das declarações feitas pelo porta-voz do UNICEF, James Elder, durante uma coletiva de imprensa no Palácio das Nações em Genebra.", "titulo_pt": "Muitas instalações de saúde e nutrição fechadas em Somalia à medida que a crise infantil se agrava", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 115508, "titulo": "The Hong Kong Tiananmen vigil activists convicted in national security trial", "url": "https://www.japantimes.co.jp/news/2026/08/21/asia-pacific/hong-kong-tiananmen-activists-convicted/", "fonte_id": "japan_times", "data_pub": "2026-08-21T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Hong Kong condenou dois ativistas pró-democracia que organizavam vigílias anuais para marcar o massacre de Tiananmen à subversão nacional em uma audiência de segurança nacional.", "titulo_pt": "Ativistas de Hong Kong que organizavam vigílias de Tiananmen condenados por incitação à subversão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 115389, "titulo": "Hong Kong court convicts activists who organized Tiananmen vigil", "url": "https://www.lemonde.fr/en/international/article/2026/08/21/hong-kong-court-convicts-activists-who-organized-tiananmen-vigil_6756724_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lee Cheuk-yan, de 69 anos, e Chow Hang-tung, de 41 anos, ativistas pró-democracia, foram condenados por organizar uma vigília em Hong Kong. Eles podem enfrentar até 10 anos de prisão.", "titulo_pt": "Juízo condena ativistas pró-democracia que organizaram vigília em hong Kong", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 114345, "titulo": "Four out of every five families in Gaza face 'critical or catastrophic' hunger levels, UN warns", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/four-out-every-five-families-gaza-face-critical-or-catastrophic-hunger", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T01:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) alerta que 94% da população de Gaza, que ultrapassa 2,1 milhões de pessoas, necessita de abrigo e assistência básica. Além disso, quatro em cada cinco famílias enfrentam níveis 'críticos ou catastróficos' de fome em seus abrigos, que carecem de combustível, energia e itens essenciais domésticos.", "titulo_pt": "Quatro em cada cinco famílias em Gaza enfrentam 'níveis críticos ou catastróficos' de fome, avisa a ONU", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 114024, "titulo": "Court ends case against police charged over use of Taser and pepper spray on ‘vulnerable’ First Nations man", "url": "https://www.theguardian.com/australia-news/2026/aug/21/court-ends-case-queensland-police-officers-tasered-vulnerable-man-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-21T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O caso contra dois policiais, Andrew David Couchman e Ulrich Weiss, que foram acusados de cometer crimes relacionados ao uso de spray pimenta, Taser e restrições em um homem indígena 'cognitivamente e emocionalmente vulnerável' em custódia policial, foi permanentemente arquivado após uma corte identificar 'defeitos' na investigação subsequente.", "titulo_pt": "Juízo arquiva processo contra policiais acusados de uso excessivo de força em homem indígena vulnerável", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 113867, "titulo": "Datos bancarios y placas de carros: el temor de los migrantes por información compartida al ICE", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/datos-bancarios-y-placas-de-carros-el-temor-de-los-migrantes-por-informacion-compartida-al-ice-nid20082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T00:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ICE pode utilizar informações bancárias e placas de veículos para localizar pessoas, mas há limites le const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
