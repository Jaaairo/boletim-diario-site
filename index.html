o título de 10 anos. As obrigações do governo de França, Itália e do Reino Unido estavam sob pressão em um mercado volátil.", "titulo_pt": "Obrigações do governo dos EUA em patamar estável após leilão do título de 10 anos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 200908, "titulo": "Com bloqueios, exportações brasileiras de carnes caem 15%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/10/com-bloqueios-exportacoes-brasileiras-de-carnes-caem-15.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T19:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras de carnes, incluindo bovina, suína e de frango, caíram 15% em receita e 12% em volume em setembro de 2026, devido aos bloqueios impostos pela China e pela União Europeia.", "titulo_pt": "Exportações brasileiras de carnes caem 15% devido a bloqueios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200910, "titulo": "Anfavea revisa para cima números de produção e vendas em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/anfavea-revisa-para-cima-numeros-de-producao-e-vendas-e-evita-comentarios-sobre-eleicoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T19:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anfavea revisou as projeções de produção e vendas de veículos leves e pesados para 2026, aumentando as expectativas para um crescimento de 15,2% nas vendas e 6,7% na produção.", "titulo_pt": "Anfavea revisa para cima projeções de produção e vendas de veículos em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 201738, "titulo": "Samsung sees Q3 profit jump 783% to record W107.4tr", "url": "https://www.koreaherald.com/article/10896336", "fonte_id": "korea_herald", "data_pub": "2026-10-07T22:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Electronics relatou um lucro operacional de R$ 1,074 trilhão no terceiro trimestre, um aumento de 782,5% em comparação com o mesmo período do ano anterior. As receitas da empresa aumentaram 126,6% para R$ 1,95 trilhões.", "titulo_pt": "Samsung registra lucro operacional de r$ 1,074 trilhão no terceiro trimestre, aumento de 782,5%", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 201591, "titulo": "Trump awarding medals to Musk, Dell, Nadella and other tech execs at science summit", "url": "https://www.cnbc.com/2026/10/07/trump-awarding-medals-to-musk-dell-nadella-at-science-summit.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-07T22:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump está concedendo medalhas a vários executivos de tecnologia notáveis em um summit sobre ciência nesta quinta-feira.", "titulo_pt": "Trump concedendo medalhas a executivos de tecnologia no summit de ciência", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 201669, "titulo": "Trump to give Musk top US science medal", "url": "https://www.scmp.com/news/world/united-states-canada/article/3370106/trump-give-musk-top-us-science-medal?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T22:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump concederá a medalha nacional de ciência a Elon Musk e outros executivos de tecnologia em uma cerimônia. A cerimônia será parte do 'Science: A New Golden Age' summit e incluirá também a entrega da Medalha Nacional de Tecnologia e Inovação.", "titulo_pt": "Trump vai presentear Musk com maior medalha científica dos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 201739, "titulo": "BMW’s iX4 SUV is a 428-mile defensive weapon against China’s EV takeover", "url": "https://www.theverge.com/transportation/1006837/bmw-ix4-ev-range-price-specs-tesla-china", "fonte_id": "the_verge", "data_pub": "2026-10-07T22:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O BMW iX4 é um SUV coupé que representa uma resposta tecnologicamente avançada da BMW à dominância chinesa no mercado de veículos elétricos. O veículo impressiona tanto pela qualidade de condução quanto pelo preço.", "titulo_pt": "Bmw's ix4 SUV é uma arma defensiva de 428 quilômetros contra a dominação chinesa em veículos elétricos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 201769, "titulo": "Tropical Storm Isaias Set to Be First Atlantic Hurricane of 2026 Season", "url": "https://www.wired.com/story/tropical-storm-isaias-first-atlantic-hurricane-2026/", "fonte_id": "wired", "data_pub": "2026-10-07T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tropical Storm Isaias está prestes a se tornar o primeiro furacão da temporada no Oceano Atlântico de 2026, trazendo chuva letal e ondas de marejada para a costa do Golfo.", "titulo_pt": "Tropical Storm Isaias vai ser o primeiro furacão da temporada atlântica de 2026", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 200897, "titulo": "Como a IA seduz a mente preguiçosa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/como-a-ia-seduz-a-mente-preguicosa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pessoa comentou sobre como a inteligência artificial (IA) pode seduzir a mente preguiçosa. Cita um exemplo de um livro de C.S. Lewis sobre um demônio que tenta corromper uma pessoa usando uma invenção moderna, neste caso, um telefone.", "titulo_pt": "Como a IA atrai a mente preguiçosa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 201770, "titulo": "Shaq Got Hacked. Now He’s Pitching for a VPN", "url": "https://www.wired.com/story/how-a-weirdly-chill-celebrity-thinks-about-personal-cybersecurity/", "fonte_id": "wired", "data_pub": "2026-10-07T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-jogador de basquete Shaquille O'Neal revelou recentemente que foi vítima de um ataque cibernético durante um evento de uma empresa de segurança chamada NordVPN. Ele alertou a público sobre a importância de controlar suas informações pessoais.", "titulo_pt": "Shaq foi hackeado. Agora ele promove um serviço de VPN", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 200898, "titulo": "Microsoft e Nvidia lançam laptop com IA para deixar de onerar data centers", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/microsoft-e-nvidia-lancam-laptop-com-ia-para-deixar-de-onerar-data-centers.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft lançou um novo laptop equipado com chips da Nvidia, visando transformar o Windows em uma plataforma para tarefas de inteligência artificial, permitindo que agentes de IA realizem tarefas como escrever código localmente, sem a necessidade de acesso à nuvem.", "titulo_pt": "Microsoft e Nvidia lançam laptop com IA para reduzir dependência de data centers", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 201773, "titulo": "Elon Musk’s America PAC Is Quietly Funding November’s Most Consequential Elections", "url": "https://www.wired.com/story/elon-musks-america-pac-is-quietly-funding-novembers-most-consequential-elections/", "fonte_id": "wired", "data_pub": "2026-10-07T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PAC de Elon Musk tem investido de forma incomum, gastando aproximadamente três dólares para apoiar candidatos republicanos ao Senado por cada dólar gasto criticando candidatos democratas.", "titulo_pt": "PAC de elon Musk financia eleições cruciais, priorizando críticas aos democratas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 201370, "titulo": "How Long Until AI Hacks Everything?", "url": "https://www.theatlantic.com/technology/2026/10/ai-hacking-cybersecurity-race/688911/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-07T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Se acreditarmos que apenas a inteligência artificial (IA) pode nos salvar da IA, o mundo está em perigo. A preocupação é que a IA possa ser usada para ataques, mesmo que seu objetivo seja ser útil e benéfico.", "titulo_pt": "Quanto tempo até a IA hackear tudo?", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 201741, "titulo": "Android’s physical navigation buttons are back on Googlebooks, but not the way you think", "url": "https://www.theverge.com/tech/1007409/androids-physical-navigation-buttons-are-back-on-googlebooks-but-not-the-way-you-think", "fonte_id": "the_verge", "data_pub": "2026-10-07T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os botões físicos de inserção rápida e logotipo do Google já existem em alguns Chromebooks há alguns anos. No entanto, um novo recurso foi adicionado aos Chromebooks do Google, similar aos botões F1, F2 e outros encontrados em smartphones Android de 2014.", "titulo_pt": "Botões físicos de inserção rápida e logotipo do google voltam aos chromebooks do google, mas com novidades", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 201774, "titulo": "The Science Behind the Nobel-Winning Technology That Controls Neurons With Light", "url": "https://www.wired.com/story/the-science-behind-the-nobel-winning-technology-that-controls-neurons-with-light/", "fonte_id": "wired", "data_pub": "2026-10-07T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A optogenética revolucionou a neurociência, mas suas origens se devem a uma organização sem cérebro — uma algas.", "titulo_pt": "A ciência por trás da tecnologia premiada que controla neurônios com luz", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 201333, "titulo": "FMI alerta que una decepción con la IA podría desatar un shock global y ampliar la desigualdad", "url": "https://www.latercera.com/pulso/noticia/fmi-alerta-que-una-decepcion-con-la-ia-podria-desatar-un-shock-global-y-ampliar-la-desigualdad/", "fonte_id": "la_tercera", "data_pub": "2026-10-07T20:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diretora-geral do FMI, Kristalina Georgieva, afirmou que a inteligência artificial bem implementada poderia contribuir com até meio ponto percentual de crescimento global anual. O FMI alertou que uma decepção com a IA poderia causar um choque global e aumentar as desigualdades.", "titulo_pt": "FMI avisa que decepção com IA poderia causar choque global e aumentar desigualdades", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 200911, "titulo": "Agentes de IA podem custar US$ 500 bilhões aos bancos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/agentes-de-ia-podem-custar-us-500-bilhoes-aos-bancos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial com agentes pode custar US$ 500 bilhões aos bancos. As instituições financeiras ganham lucros investindo o dinheiro deixado parado pelos clientes, mas a adoção de IA pode alterar esse cenário.", "titulo_pt": "Agentes de IA podem custar US$ 500 bilhões aos bancos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 201776, "titulo": "Meet the Vendors Selling ‘Cornell Seven’ Merch", "url": "https://www.wired.com/story/meet-the-vendors-selling-cornell-seven-merch/", "fonte_id": "wired", "data_pub": "2026-10-07T19:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias marcas, influenciadores e vendedores no Etsy estão vendendo itens como camisetas, canecas e botões em solidariedade à mulher que acusou sete ex-alunos de assédio sexual. Alguns consideram essa ação como sem sentido.", "titulo_pt": "Conheça os vendedores vendendo 'Cornell Seven'", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 201744, "titulo": "ChatGPT’s ‘Intelligent UI’ update fills its responses with pictures, charts, and buttons", "url": "https://www.theverge.com/ai-artificial-intelligence/1007276/openai-chatgpt-intelligent-ui-gpt-6", "fonte_id": "the_verge", "data_pub": "2026-10-07T19:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI está lançando uma nova funcionalidade chamada 'Inteligente UI' no ChatGPT, permitindo que o assistente responda com visualizações interativas como imagens, gráficos e botões. Essa atualização, que está sendo implementada junto com o GPT-6, permite que as respostas textuais do ChatGPT sejam acompanhadas por elementos visuais interativos.", "titulo_pt": "Nova funcionalidade 'inteligente UI' do chatgpt adiciona imagens, gráficos e botões às respostas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 200889, "titulo": "Impacto da IA na matemática ainda gera mais perguntas que respostas, segundo especialistas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/impacto-da-ia-na-matematica-ainda-gera-mais-perguntas-que-respostas-segundo-especialistas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-07T22:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O impacto da inteligência artificial na matemática ainda gera mais perguntas do que respostas, de acordo com especialistas. Apesar do avanço das ferramentas de IA, há preocupações sobre o treinamento de futuros pesquisadores e a possibilidade de aumentar as desigualdades no campo da matemática.", "titulo_pt": "Impacto da IA na matemática ainda gera mais perguntas que respostas, segundo especialistas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 200890, "titulo": "Vinho em cuba, talidomida e nanomateriais mostram importância do Nobel de Química de 2026", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/vinho-em-cuba-talidomida-e-nanomateriais-mostram-importancia-do-nobel-de-quimica-de-2026.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-07T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nobel de Química de 2026 foi inspirado por uma cuba de vinho. Uma substância gerada durante o processo de produção de vinho levou a descobertas que resultaram no prêmio, mais de 170 anos depois.", "titulo_pt": "Vinho em cuba, talidomida e nanomateriais mostram importância do Nobel de Química de 2026", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 201887, "titulo": "NASA Sets Coverage for SpaceX 35th Station Resupply Launch, Arrival", "url": "https://www.nasa.gov/news-release/nasa-sets-coverage-for-spacex-35th-station-resupply-launch-arrival/", "fonte_id": "nasa_news", "data_pub": "2026-10-07T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA e a SpaceX agendaram a próxima missão de lançamento para 6:33 da manhã de terça-feira, 13 de outubro, com o objetivo de levar experimentos científicos, suprimentos e equipamentos, incluindo o último conjunto de Painéis Solares Desdobráveis da Estação Espacial Internacional, para a estação. Esta missão é a 35ª missão comercial de reabastecimento da SpaceX para a NASA.", "titulo_pt": "NASA e SpaceX agendam lançamento para 35ª missão de reabastecimento da SpaceX à estação espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 201823, "titulo": "STAT+: In small trial, optogenetics restores some vision lost to retinitis pigmentosa", "url": "https://www.statnews.com/2026/10/07/optogenetics-restores-some-vision-retinitis-pigmentosa/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-07T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que metade dos pacientes com retinitis pigmentosa recuperou a sensibilidade à luz com a utilização de optogenética, indicando potencial para esse método.", "titulo_pt": "Em pequeno estudo, optogenética restaura visão parcialmente perdida por retinitis pigmentosa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 201867, "titulo": "Gene therapy and special goggles give some blind people limited sight", "url": "https://www.sciencenews.org/article/gene-therapy-cells-light-blind-vision", "fonte_id": "science_news", "data_pub": "2026-10-07T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tratamento genético combinado com óculos especiais permite a alguns cegos uma visão limitada. A técnica optogenética, que será reconhecida pelo Prêmio Nobel de Medicina em 2026, faz células responderem à luz, incluindo células do olho que normalmente transmitem sinais para o cérebro.", "titulo_pt": "Terapia genética e óculos especiais dão visão limitada a alguns cegos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 201888, "titulo": "NASA’s SpaceX 35th Commercial Resupply Mission Overview", "url": "https://www.nasa.gov/general/nasas-spacex-35th-commercial-resupply-mission-overview/", "fonte_id": "nasa_news", "data_pub": "2026-10-07T20:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA e a SpaceX programaram a lançamento para não ser antes de terça-feira, 13 de outubro, com o objetivo de enviar experimentos científicos, suprimentos e equipamentos para a Estação Espacial Internacional.", "titulo_pt": "Operação de lançamento da 35ª missão de transporte comercial da SpaceX para a estação espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 201889, "titulo": "NASA’s PRIMA Spacecraft (Artist’s Concept)", "url": "https://science.nasa.gov/photojournal/nasas-prima-spacecraft-artists-concept/", "fonte_id": "nasa_news", "data_pub": "2026-10-07T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PRIMA, uma missão proposta da NASA para observar luz infravermelha longa, será o primeiro observatório dessa nova classe de missões de astronomia da agência, chamada Probe Explorers, dentro do programa Explorers da NASA. A missão permitirá que os cientistas estudem o cosmos através da observação de luz infravermelha longa.", "titulo_pt": "Conceito artístico do espaço nave PRIMA da nasa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 201062, "titulo": "Alzheimer e Parkinson: cientistas identificam alvo para reduzir inflamação no cérebro", "url": "https://exame.com/ciencia/alzheimer-e-parkinson-cientistas-identificam-alvo-para-reduzir-inflamacao-no-cerebro/", "fonte_id": "exame", "data_pub": "2026-10-07T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram um alvo para reduzir a inflamação no cérebro, o que pode auxiliar na investigação de medicamentos para doenças neurodegenerativas como Alzheimer e Parkinson. O estudo foi realizado com tecido cerebral humano.", "titulo_pt": "Alzheimer e Parkinson: cientistas identificam alvo para reduzir inflamação no cérebro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 201870, "titulo": "A suspected case of pneumonic plague is raising fears of an outbreak. Should you be worried?", "url": "https://www.scientificamerican.com/article/a-suspected-case-of-pneumonic-plague-is-raising-fears-of-an-outbreak-should-you-be-worried/", "fonte_id": "scientific_american", "data_pub": "2026-10-07T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades russas relataram nesta semana que um funcionário de um laboratório em Sibéria, que estuda peste e outras doenças infecciosas, morreu de pneumonia de causa desconhecida. Isso levanta preocupações sobre a possibilidade de uma possível epidemia de peste pneumônica.", "titulo_pt": "Caso suspeito de peste pneumônica em laboratório na sibéria está causando preocupações de possível epidemia. Você deve se preocupar?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 201121, "titulo": "Vida fora da Terra? Telescópio capta ondas de rádio de outra galáxia", "url": "https://braziljournal.com/vida-fora-da-terra-telescopio-capta-ondas-de-radio-de-outra-galaxia/", "fonte_id": "brazil_journal", "data_pub": "2026-10-07T18:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um telescópio na África do Sul captou ondas de rádio de um planeta a 63 anos-luz de distância da Terra. Embora não se saiba se há vida fora da Terra, essas descobertas podem indicar que não estamos sozinhos no universo.", "titulo_pt": "Vida fora da Terra? Telescópio capta ondas de rádio de outra galáxia", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 201871, "titulo": "Scientists unlock the longevity secrets of 194-year-old Jonathan the giant tortoise", "url": "https://www.scientificamerican.com/article/scientists-unlock-the-longevity-secrets-of-194-year-old-jonathan-the-giant-tortoise/", "fonte_id": "scientific_american", "data_pub": "2026-10-07T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas sugerem que a longevidade extremada de Jonathan, a tartaruga gigante, pode estar relacionada à manutenção ordenada dos genes.", "titulo_pt": "Cientistas descobrem possíveis segredos de longevidade de Jonathan, a tartaruga gigante de 194 anos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 201890, "titulo": "NASA’s Curiosity Looks Back After Reaching Elevation Milestone", "url": "https://science.nasa.gov/photojournal/nasas-curiosity-looks-back-after-reaching-elevation-milestone/", "fonte_id": "nasa_news", "data_pub": "2026-10-07T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Curiosity da NASA capturou uma imagem olhando para trás para o fundo do Crater Gale, com o horizonte visível, no dia 5 de setembro de 2026, que foi o 5.006º dia do missionário na Terra marcana. No dia anterior, 26 de agosto (sol 4.996), o Curiosity atingiu uma marca importante ao chegar a 1 quilômetro de altitude.", "titulo_pt": "Curiosity da nasa olha para trás após marcar altitude", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 201891, "titulo": "NASA’s Curiosity Captures Dawn Breaking on Wind-Carved Cliffs", "url": "https://science.nasa.gov/photojournal/nasas-curiosity-captures-dawn-breaking-on-wind-carved-cliffs/", "fonte_id": "nasa_news", "data_pub": "2026-10-07T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rover Curiosity da NASA capturou esta panorâmica do amanhecer iluminando distantes características formadas pelo vento chamadas yardangs em 11 de agosto de 2026, no 4.982º dia marciano da missão. Os cientistas estão ansiosos para aprender mais sobre como a camada de yardangs foi formada.", "titulo_pt": "Curiosity da nasa captura amanhecer iluminando yardangs esculpidos pelo vento", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 201872, "titulo": "The Atlantic hurricane season has been eerily quiet—Tropical Storm Isaias could change that", "url": "https://www.scientificamerican.com/article/the-atlantic-hurricane-season-has-been-eerily-quiet-tropical-storm-isaias-could-change-that/", "fonte_id": "scientific_american", "data_pub": "2026-10-07T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tropical Storm Isaias está previsto para se tornar um furacão na quinta-feira, de acordo com meteorologistas.", "titulo_pt": "A temporada hurricânica do atlântico tem sido estranhamente calma—Tropical Storm Isaias poderia mudar isso", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 201892, "titulo": "Artemis II Crew Moon Photo Annotations", "url": "https://www.nasa.gov/image-article/artemis-ii-crew-moon-photo-annotations/", "fonte_id": "nasa_news", "data_pub": "2026-10-07T15:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma captura de tela do tablet de um membro da tripulação da Artemis II em 6 de abril de 2026, os astronautas Reid Wiseman, Victor 'Ike' Glover e Jeremy Hansen anotaram observações de impactos luminosos durante um eclipse lunar.", "titulo_pt": "Anotações de tripulantes da artemis II sobre eclipse lunar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 201868, "titulo": "A quake on Mars may have set these rocks rolling", "url": "https://www.sciencenews.org/article/mars-quakes-falling-boulders", "fonte_id": "science_news", "data_pub": "2026-10-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rastros recentes de rochas rolando em Marte podem fornecer informações sobre um terremoto que afetou o planeta e auxiliar cientistas a detectarem futuros abalos sísmicos por satélite.", "titulo_pt": "Rastros de rochas em marte podem revelar efeitos de um terremoto", "veiculo": "Science News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 201269, "titulo": "Si yo viviera en Brasil, ¿cómo tomaría las decisiones?", "url": "https://www.lanacion.com.ar/economia/si-yo-viviera-en-brasil-como-tomaria-las-decisiones-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T22:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "É difícil imaginar que, nos últimos meses de sua presidência, Lula tenha que lidar com alguma corrida cambial ou bancária, desconsiderando o que seu sucessor possa fazer eventualmente.", "titulo_pt": "Se eu vivesse no Brasil, como tomaria as decisões?", "veiculo": "La Nación (Argentina)", "pais": ", "classe": "A"}, {"id": 201371, "titulo": "Something Like People", "url": "https://www.theatlantic.com/books/2026/10/poem-alexandra-petri-something-like-people/688908/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-07T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto original é um poema sem um contexto adicional. Sem mais informações, não é possível fornecer um resumo mais detalhado.", "titulo_pt": "Algo semelhante a pessoas", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 200963, "titulo": "'Profundezas' e 'Hit para Dois': o que ver na TV e no streaming na quinta-feira", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/profundezas-e-hit-para-dois-o-que-ver-na-tv-e-no-streaming-na-quinta-feira.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T20:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma pequena cidade no extremo leste do Canadá, um pescador chamado Calvin Penney tenta esclarecer a morte misteriosa do pai, ocorrida décadas atrás, enquanto uma criatura marinha aterroriza a comunidade. A história mistura elementos de mistério familiar e de suspense envolvendo um monstro marinheiro.", "titulo_pt": "Profundezas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 201003, "titulo": "Exposição em São Paulo celebra os 90 anos de Tom Zé", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-10/exposicao-em-sao-paulo-celebra-os-90-anos-de-tom-ze", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-10-07T18:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Cultural de São Paulo realizou uma exposição para celebrar os 90 anos de Tom Zé, cantor e compositor baiano. O evento, sensorial e interativo, aborda a trajetória, referências e invenções do artista.", "titulo_pt": "Exposição em São Paulo comemora 90 anos de Tom Zé", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 200964, "titulo": "Spotify passa a oferecer audiolivros no Brasil e pode mudar mercado de patamar", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/spotify-passa-a-oferecer-audiolivros-no-brasil-e-pode-mudar-mercado-de-patamar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T18:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Spotify começou a oferecer audiolivros no Brasil, conforme anunciado pela empresa durante a Feira do Livro de Frankfurt em 7 de outubro de 2026.", "titulo_pt": "Spotify começa a oferecer audiolivros no Brasil", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 200965, "titulo": "Orquestras de São Paulo fazem concertos dedicados ao rock clássico e à cultura pop", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/musica-em-letras/2026/10/orquestras-de-sao-paulo-fazem-concertos-dedicados-ao-rock-classico-e-a-cultura-pop.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T18:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas orquestras de São Paulo apresentam concertos neste fim de semana, combinando clássicos do rock internacional, trilhas sonoras de cinema, animes e videogames em repertórios inusitados para orquestras tradicionais.", "titulo_pt": "Orquestras de São Paulo realizam concertos com rock clássico e cultura pop", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 200966, "titulo": "Os dois sentidos da 'democracia'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/caetano-w-galindo/2026/10/os-dois-sentidos-da-democracia.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A palav olha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/socorro-acioli/2026/10/brasil-tem-vocacao-para-a-alegria-e-nao-ha-pais-alegre-sem-justica-social.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A autora tem se dedicado à leitura de textos sobre saúde mental, manicômios, relatos de internação por pacientes e médicos, diários e reportagens, como parte da pesquisa para seu novo romance.", "titulo_pt": "Brasil tem vocação para a alegria, e não há país alegre sem justiça social", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 200970, "titulo": "Como Rosa von Praunheim, com retrospectiva, foi radical ao mostrar vida gay nas telas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/como-rosa-von-praunheim-com-retrospectiva-foi-radical-ao-mostrar-vida-gay-nas-telas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rosa von Praunheim, cineasta e ativista alemão, criou filmes que retratavam a vida gay em tempos em que isso era incomum. A narração de sua obra mais importante afirma que ser gay não é apenas um tema cinematográfico.", "titulo_pt": "Como Rosa von Praunheim, com retrospectiva, foi radical ao mostrar a vida gay nas telas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 201504, "titulo": "French wine grape harvest set to hit historic low", "url": "https://www.lemonde.fr/en/environment/article/2026/10/07/french-wine-grape-harvest-set-to-hit-historic-low_6758356_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-07T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A colheita de uvas para vinho na França em 2026 está prevista para atingir cerca de 35 milhões de hectolitros, uma diminuição de 14% em relação à média de 2021-2025, devido a several summer heatwaves e a redução nas áreas cultivadas.", "titulo_pt": "Colheita de uvas para vinho na França deve atingir nível histórico baixo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 200971, "titulo": "Skydance vai manter estúdios de Warner e Paramount e separar produção de cinema e TV", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/skydance-vai-manter-estudios-de-warner-e-paramount-e-separar-producao-de-cinema-e-tv.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-07T15:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Ellison anunciou que a Skydance manterá os estúdios de filmagens da Warner Bros. e da Paramount em operação após a fusão. A empresa planeja separar as produções de cinema de um lado e as de TV e streaming do outro.", "titulo_pt": "Skydance mantém estúdios de Warner e Paramount após fusão", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 201701, "titulo": "Groups urge ministry to expand menstrual leave", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/08/2003865602", "fonte_id": "taipei_times", "data_pub": "2026-10-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos estão pedindo ao ministério que amplie o período de licença menstrual. Atualmente, não está claro quais são as reivindicações específicas dos grupos envolvidos.", "titulo_pt": "Grupos pressionam ministério para ampliar licença menstrual", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 201124, "titulo": "Homem invade casa, agride idoso é preso pela PCGO no Entorno do DF", "url": "https://www.metropoles.com/distrito-federal/homem-invade-casa-agride-idoso-e-preso-pela-pcgo-no-entorno-do-df", "fonte_id": "metropoles", "data_pub": "2026-10-07T23:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem invadiu uma casa, agrediu uma vítima de 75 anos, danificou o carro dela e desobedeceu ordens policiais. O suspeito já tem antecedentes por roubo e homicídio e foi preso pela PCGO no Entorno do DF.", "titulo_pt": "Homem invade casa, agride idoso e é preso pela PCGO no Entorno do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 201026, "titulo": "Morre idosa que virou símbolo da crise habitacional na Espanha", "url": "https://www.poder360.com.br/poder-internacional/morre-idosa-que-virou-simbolo-da-crise-habitacional-na-espanha/", "fonte_id": "poder360", "data_pub": "2026-10-07T22:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, uma idosa que se tornou símbolo da crise habitacional na Espanha, faleceu após ser despejada. Ela estava internada desde o ocorrido, mas a causa exata da morte não foi divulgada.", "titulo_pt": "Morre idosa símbolo da crise habitacional na Espanha", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 201127, "titulo": "Policiais são presos acusados de fazer acordo milionário com membro do PCC", "url": "https://www.metropoles.com/sao-paulo/policiais-sao-presos-acusados-de-fazer-acordo-milionario-com-membro-do-pcc", "fonte_id": "metropoles", "data_pub": "2026-10-07T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais foram presos acusados de terem aceitado um acordo de R$ 1 milhão para interromper um inquérito que revelaria mais nomes do PCC.", "titulo_pt": "Policiais são presos acusados de fazer acordo milionário com membro do PCC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 201273, "titulo": "“Es insólito haber llegado a este punto”: los rectores universitarios convocaron desde el Cabildo a la Quinta Marcha Federal", "url": "https://www.lanacion.com.ar/sociedad/es-insolito-haber-llegado-a-este-punto-los-rectores-universitarios-convocaron-desde-el-cabildo-a-la-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T22:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rectores universitários convocaram para a Quinta Marcha Federal a partir do Cabildo. Isso ocorre 24 horas antes do julgamento que declarou inconstitucional o decreto de Milei que suspendeu a aplicação da lei de financiamento universitário.", "titulo_pt": "É insólito chegar a este ponto: rectores convocam para a Quinta Marcha Federal", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 201275, "titulo": "Murió Maricarmen, la anciana inquilina desalojada en Madrid: los datos de un problema que crece cada vez más en la Argentina", "url": "https://www.lanacion.com.ar/propiedades/casas-y-departamentos/murio-maricarmen-la-anciana-inquilina-desalojada-en-madrid-como-su-caso-refleja-un-problema-que-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T22:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Maricarmen, uma inquilina de 87 anos desalojada em Madrid por não conseguir pagar o aluguel integral, reflete uma situação crescente entre os aposentados na Argentina. O caso mostra como o problema de desalojamento de idosos por questões financeiras é uma realidade no país.", "titulo_pt": "Morreu Maricarmen, a idosa inquilina desalojada em Madrid: os detalhes de um problema que aumenta cada vez mais no Brasil", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 201261, "titulo": "Gobierno recorta $34 mil millones en siete programas de ayuda a infancia vulnerable, niños en proceso de adopción y recién nacidos", "url": "https://www.ciperchile.cl/2026/10/07/gobierno-recorta-34-mil-millones-en-siete-programas-de-ayuda-a-infancia-vulnerable-ninos-en-proceso-de-adopcion-y-recien-nacidos/?utm_source=rss&utm_medium=rss&utm_campaign=gobierno-recorta-34-mil-millones-en-siete-programas-de-ayuda-a-infancia-vulnerable-ninos-en-proceso-de-adopcion-y-recien-nacidos", "fonte_id": "ciper_chile", "data_pub": "2026-10-07T22:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo cortou R$ 34 milhões em sete programas que auxiliam crianças vulneráveis, crianças em processo de adoção e recém-nascidos. Este corte foi anunciado recentemente.", "titulo_pt": "Governo corta r$ 34 milhões em sete programas de assistência a crianças vulneráveis, em processo de adoção e recém-nascidas", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 201283, "titulo": "Estudiantes ingresaron a la Secretaría de Educación e hicieron una “sentada” para exigir por el financiamiento universitario", "url": "https://www.lanacion.com.ar/sociedad/estudiantes-ingresaron-a-la-secretaria-de-educacion-e-hicieron-una-sentada-para-exigir-por-el-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T22:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Estudantes entraram na Secretaria de Educação e realizaram uma 'sentada' para exigir financiamento universitário. A PFA ameaça desalojar os protestantes, ocorrendo pouco tempo após a Justiça declarar inconstitucional o decreto que havia paralisado a aplicação da lei.", "titulo_pt": "Estudantes realizam 'sentada' na secretaria de educação por financiamento universitário", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 201531, "titulo": "Student protest unrest spreads across Europe", "url": "https://www.axios.com/2026/10/07/europe-student-protests-france-belgium", "fonte_id": "axios", "data_pub": "2026-10-07T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos estudantis e confrontos com a polícia ocorreram em Liège, Bélgica, refletindo a crescente ira dos estudantes sobre custos educacionais e condições escolares. Esses protestos se juntam a uma movimentação nacional na França, que começou como uma demonstração local em Paris em setembro e se transformou em uma demanda por mais financiamento para a educação.", "titulo_pt": "Protestos estudantis se espalham pela Europa", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 201020, "titulo": "Morre aos 87 anos idosa que foi despejada e virou símbolo de protestos na Espanha", "url": "https://veja.abril.com.br/mundo/morre-aos-87-anos-idosa-que-foi-despejada-e-virou-simbolo-de-protestos-na-espanha/", "fonte_id": "veja", "data_pub": "2026-10-07T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, uma idosa de 87 anos, faleceu. Ela foi despejada após 71 anos morando em um apartamento em Madri, Espanha, e se tornou um símbolo dos protestos contra despejos.", "titulo_pt": "Morre idosa que foi despejada e se tornou símbolo de protestos na Espanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 201674, "titulo": "Evicted 87-year-old woman Maricarmen, heart of Spain’s housing protests, has died", "url": "https://www.scmp.com/news/world/europe/article/3370103/evicted-87-year-old-woman-maricarmen-heart-spains-housing-protests-has-died?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, uma idosa de 87 anos cuja expulsão dramática do seu lar de mais de 70 anos desencadeou protestos de moradores em toda a Espanha, levando a um novo pleito eleitoral, faleceu. Ela estava hospitalizada desde a sua expulsão em 23 de setembro.", "titulo_pt": "Idosa de 87 anos, coração dos protestos de moradores na Espanha, faleceu", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 200995, "titulo": "Morre idosa que inspirou onda de protestos na Espanha após despejo", "url": "https://www.cartacapital.com.br/mundo/morre-idosa-que-inspirou-onda-de-protestos-na-espanha-apos-despejo/", "fonte_id": "cartacapital", "data_pub": "2026-10-07T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maricarmen, de 87 anos, foi internada em Madri após ser despejada do apartamento onde residia há quase sete décadas. O caso levantou revolta e gerou uma crise política no país.", "titulo_pt": "Idosa de 87 anos que inspirou onda de protestos na Espanha após despejo morre", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 201181, "titulo": "Morre idosa que foi despejada e provocou onda de protestos na Espanha", "url": "https://www.bbc.com/portuguese/articles/cmvgxr52xjw2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-07T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, de 87 anos, foi internada após ser despejada do apartamento onde viveu por 70 anos, no centro de Madri, e morreu antes de conseguir retornar para casa.", "titulo_pt": "Idosa de 87 anos morre após ser despejada e tentar retornar para casa", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 201304, "titulo": "Flávio Bolsonaro’s advance in Brazil’s election is grim jolt for climate campaigners", "url": "https://www.theguardian.com/world/2026/oct/07/flavio-bolsonaro-advance-brazil-election-jolt-climate-campaigners", "fonte_id": "guardian_world", "data_pub": "2026-10-07T19:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro está à frente nas primárias do primeiro turno da eleição presidencial no Brasil, o que preocupa os defensores do clima, pois isso pode levar a um aumento da degradação da floresta amazônica nos próximos quatro anos. O exterior parece mais preocupado com essa possibilidade do que os eleitores brasileiros.", "titulo_pt": "Avanço de flávio Bolsonaro na eleição brasileira é golpe preocupante para defensores do clima", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 201636, "titulo": "Maricarmen dies at 87 after eviction sparked Spain housing protests", "url": "https://www.aljazeera.com/news/2026/10/7/spanish-unions-call-general-strike-over-housing-before-snap-election?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-07T18:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Maricarmen, de 87 anos, faleceu após ser expulsa de sua casa em Madri, se tornando um símbolo da crise habitacional em Espanha. Ela foi removida em maca durante a expulsão, ocorrida durante protestos imobiliários.", "titulo_pt": "Maricarmen morre aos 87 anos após expulsão que inspirou protestos imobiliários em Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 201680, "titulo": "France halts use of stun grenades in policing of student protests", "url": "https://www.scmp.com/news/world/europe/article/3370096/france-halts-use-stun-grenades-policing-student-protests?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T15:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França suspendeu o uso de granadas de choque na repressão a protestos estudantis após um adolescente de 15 anos ter perdido a mão em um confronto com a polícia. As manifestações não mostraram sinais de diminuição, com mais de 500 escolas fechadas e novos protestos programados para o dia seguinte.", "titulo_pt": "França suspende uso de granadas de choque em protestos estudantis", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 201319, "titulo": "¿Cuántas reservas de emergencia de petróleo les quedan a los países de la AIE?", "url": "https://www.latercera.com/pulso/noticia/cuantas-reservas-de-emergencia-de-petroleo-les-quedan-a-los-paises-de-la-aie/", "fonte_id": "la_tercera", "data_pub": "2026-10-07T22:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os governos do organismo respaldaram a conclusão rápida da entrega de reservas de petróleo comprometida em março devido à crise do Estreito de Ormuz, priorizando o diésel.", "titulo_pt": "Quantas reservas de emergência de petróleo os países da AIE ainda têm?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 201010, "titulo": "Maior colônia de pinguins do mundo perde posto após declínio populacional", "url": "https://veja.abril.com.br/mundo/maior-colonia-de-pinguins-do-mundo-perde-posto-apos-declinio-populacional/", "fonte_id": "veja", "data_pub": "2026-10-07T22:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores observaram uma diminuição significativa da população de pinguins-de-barbicha nas Ilhas Sandwich do Sul, com uma perda de mais de meio milhão desses animais. Como resultado, essa colônia perdeu o título de maior colônia mundial de pinguins.", "titulo_pt": "Maior colônia de pinguins do mundo perde posto após declínio populacional", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 201572, "titulo": "Southern right whales return to South Africa, drawing crowds to the coast", "url": "https://www.euronews.com/video/2026/10/07/southern-right-whales-return-to-south-africa-drawing-crowds-to-the-coast", "fonte_id": "euronews", "data_pub": "2026-10-07T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Baleias-jubarte retornaram à África do Sul, atraíndo multidões aos penhascos e ao festival de baleias em Hermanus, enquanto as mães amamentam seus recém-nascidos na Baía Walker.", "titulo_pt": "Baleias-jubarte retornam à áfrica do sul, atraindo multidões e festival", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 201573, "titulo": "Unexpected beach guest: Elephant seal draws crowds in Rio", "url": "https://www.euronews.com/video/2026/10/07/unexpected-beach-guest-elephant-seal-draws-crowds-in-rio", "fonte_id": "euronews", "data_pub": "2026-10-07T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um foca-dos-sul surpreendeu banhistas na praia de Copacabana no Rio de Janeiro, atraindo multidões, fotos e buzz nas redes sociais. Autoridades estabeleceram barreiras para proteger o animal.", "titulo_pt": "Surpreso na praia: foca-dos-sul atrai multidões no Rio de janeiro", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 201309, "titulo": "‘Catastrophic wildfire loop’ after colonisation left parts of Australia more at risk from bushfires, study finds", "url": "https://www.theguardian.com/environment/2026/oct/08/colonisation-wildfire-loop-australia-climate-bushfires", "fonte_id": "guardian_world", "data_pub": "2026-10-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo descobriu que a mudança de floresta aberta para floresta densa após 1788 aumentou o risco de incêndios mais intensos, coincidindo com a perda das práticas de queima cultural. Essa transformação do uso do solo causada pela colonização criou um 'loop de incêndios catastróficos' que tornou a Austrália sudeste mais propensa a incêndios florestais alimentados pelo clima.", "titulo_pt": "Ciclo de incêndios catastróficos após a colonização aumentou o risco de grandes focos de fogo na austrália sudeste", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 201681, "titulo": "Singapore’s air pollution worst in world as haze shuts Malaysia schools", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3370091/singapores-air-pollution-worst-world-haze-shuts-malaysia-schools?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A poluição do ar em Singapura atingiu o nível mais alto do mundo devido à fuligem proveniente das queimadas na Indonésia, fechando escolas em Kuala Lumpur, Malásia. As condições de qualidade do ar em Singapura foram classificadas como 'muito indesejáveis' até a tarde de quarta-feira, conforme relatado pelo IQAir.", "titulo_pt": "Poluição do ar em singapura é a mais alta do mundo devido a fuligem, fechando escolas em kuala lumpur", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 201185, "titulo": "A ansiedade com chegada do Super El Niño em quem já foi vítima de tragédias climáticas: 'Vai ser pior?'", "url": "https://www.bbc.com/portuguese/articles/cwp84zp54p5lo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-07T12:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Populações que já enfrentaram eventos climáticos extremos podem experimentar um 'estresse climático antecipatório' com a chegada do Super El Niño.", "titulo_pt": "Ansiedade com chegada do Super El Niño em quem já foi vítima de tragédias climáticas: 'vai ser pior?'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 200052, "titulo": "Fumaça de queimadas pode alcançar alvéolos e entrar na corrente sanguínea", "url": "https://www.metropoles.com/saude/fumaca-de-queimadas-pode-alcancar-alveolos-e-entrar-na-corrente-sanguinea", "fonte_id": "metropoles", "data_pub": "2026-10-07T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Médicos enfatizam que lavagens nasais e umidificadores aliviam os sintomas locais, mas não impedem a inalação de poluentes mais graves provenientes de queimadas.", "titulo_pt": "Fumaça de queimadas pode alcançar alvéolos e entrar na corrente sanguínea", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 200413, "titulo": "America's changing disaster risk hits energy", "url": "https://www.axios.com/2026/10/07/extreme-weather-thunderstorms-insurance-energy-grid", "fonte_id": "axios", "data_pub": "2026-10-07T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os severos temporais estão se tornando uma crescente ameaça para a infraestrutura energética nos Estados Unidos, superando as hurricânes em riscos de catástrofe segurada. Novas instalações de energia e centrais de dados estão sendo construídas em áreas de risco, aumentando as perdas potenciais durante tempestades.", "titulo_pt": "A mudança no risco de desastres afeta a energia nos estados unidos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 200278, "titulo": "‘Lawyers should be running to courts’ to stop coal approvals after landmark ruling, NSW MP says", "url": "https://www.theguardian.com/australia-news/2026/oct/07/mount-pleasant-hunter-valley-coalmine-high-court-ruling-community-advocates", "fonte_id": "guardian_world", "data_pub": "2026-10-07T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal australiano decidiu que a aprovação do aumento da mina de carvão de MACH Energy em Hunter Valley, NSW, é inválida, estabelecendo um precedente importante para casos ambientais. Um parlamentar australiano acredita que advogados devem aproveitar este julgamento para intervir judicialmente contra aprovações de carvão.", "titulo_pt": "Advogados devem correr para os tribunais para impedir aprovações de carvão após decisao histórica, diz parlamentar australiano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 200498, "titulo": "The Caspian Sea has been shrinking for decades. Now, a new island has emerged", "url": "https://www.euronews.com/2026/10/07/the-caspian-sea-has-been-shrinking-for-decades-now-a-new-island-has-emerged", "fonte_id": "euronews", "data_pub": "2026-10-07T05:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ciência alerta que partes do Mar do Cáspio do norte podem enfrentar uma situação semelhante ao Mar Aral. O aquecimento global e o uso humano da água estão aumentando a pressão sobre a região.", "titulo_pt": "Novo ilhote surge no mar do cáspio, que vem encolhendo há décadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 201330, "titulo": "Abogado Jorge Barrera es elegido como experto independiente del Comité Asesor del Consejo de Derechos Humanos de la ONU", "url": "https://www.latercera.com/nacional/noticia/abogado-jorge-barrera-es-elegido-como-experto-independiente-del-comite-asesor-del-consejo-de-derechos-humanos-de-la-onu/", "fonte_id": "la_tercera", "data_pub": "2026-10-07T21:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O jurista chileno Jorge Barrera foi eleito como experto independente do Comitê Asesor do Conselho de Direitos Humanos da ONU. Este é o primeiro chileno a integrar essa instância em mais de uma década.", "titulo_pt": "Jorge Barrera é eleito como experto independente do comitê Asesor do conselho de direitos Humanos da ONU", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 201091, "titulo": "‘Gaza segue bloqueada’: Fepal denuncia fracasso de acordos de paz, fome imposta aos palestinos e impunidade a Israel", "url": "https://www.brasildefato.com.br/2026/10/07/gaza-segue-bloqueada-fepal-denuncia-fracasso-de-acordos-de-paz-fome-imposta-aos-palestinos-e-impunidade-a-israel/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-07T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação Palestina denuncia o fracasso dos acordos de paz, a fome imposta aos palestinos e a impunidade do Israel. Ualid Rabah desmonta a narrativa dos EUA e Israel, afirmando que o cessar-fogo nunca ocorreu.", "titulo_pt": "Gaza segue bloqueada: fepal denuncia fracasso de acordos de paz, fome imposta aos palestinos e impunidade a Israel", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 201623, "titulo": "Former Catholic bishop sentenced for abusing indigenous men in Australia", "url": "https://www.aljazeera.com/news/2026/10/7/former-catholic-bishop-sentenced-for-abusing-indigenous-men-in-australia?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-07T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-bispo católico foi condenado por abusar de homens indígenas na Austrália. A Igreja Católica na Austrália tem enfrentado acusações de abuso em anos recentes.", "titulo_pt": "Ex-bispo católico condenado por abusar de homens indígenas na austrália", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 201503, "titulo": "France and US shut down platform selling sexual images of women and girls", "url": "https://www.lemonde.fr/en/france/article/2026/10/07/france-and-us-shut-down-platform-selling-sexual-images-of-women-and-girls_6758354_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-07T15:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma operação conjunta entre França e EUA encerrou um plataforma online que vendia conteúdo sexual privado de mais de 17.000 mulheres em todo o mundo. Os responsáveis, dois irmãos da França do Norte, foram presos e mais de 700.000 euros em bitcoin foram apreendidos.", "titulo_pt": "França e EUA fecham plataforma que vendia imagens sexuais de mulheres e meninas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 200005, "titulo": "Disney diz que Trump pratica censura e viola Constituição", "url": "https://www.poder360.com.br/poder-midia/disney-diz-que-trump-pratica-censura-e-viola-constituicao/", "fonte_id": "poder360", "data_pub": "2026-10-07T11:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Disney afirmou em julgamento que o ex-presidente Trump praticava censura e violava a Constituição ao pressionar a empresa a alterar decisões editoriais, alegando medo de represálias e dano irreparável.", "titulo_pt": "Disney diz que Trump praticava censura e violava a Constituição", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 200526, "titulo": "Girl pleads for world leaders to save her country from climate change", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/7/girl-pleads-for-world-leaders-to-save-her-country-from-climate-change?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-07T10:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma garota de 13 anos pediu aos líderes mundiais que agirem sobre o clima e salvem seu país, Tuvalu.", "titu function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
