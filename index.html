<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "01/11/2026 19:20", "stats": {"noticias_novas": 381, "resumos_gerados": 187}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva afirmou que os programas sociais não serão extintos e que novos podem ser criados, conforme declarou em suas redes sociais. Lula reiterou que pretende manter a continuidade das promessas feitas durante a campanha eleitoral. Em outro evento, a Universidade do Paraná expulsou estudantes que compartilharam mensagens ofensivas sobre a reeleição de Lula. A violência política aumentou durante o período eleitoral, com denúncias que quase quadruplicaram em comparação com o ano anterior. Além disso, Cleitinho, aliado de Flávio Bolsonaro, publicou um vídeo criticando campanhas de boicote e mostrando uma cliente que vota no presidente Lula. A Polícia Federal (PF) realizou uma operação no Rio de Janeiro contra o narcotráfico internacional, encontrando materiais para o transporte de drogas e pinos com cocaína em um imóvel em Copacabana.", "mundo": "Os principais eventos internacionais desta edição incluem a intensificação das atividades militares na Ucrânia, com ataques russos interrompendo o fornecimento de energia em várias cidades, incluindo Kherson, onde o cessar-fogo acabou. Além disso, um acidente aéreo no sul da Flórida resultou em nove mortes, e a Justiça rejeitou o pedido do governo Trump para contestar o resultado da eleição para o Senado no Alasca. Na política, os democratas buscam assumir o controle do Congresso para contrapor-se politicamente a Trump, enquanto o presidente Lula negou que os programas sociais do governo serão extintos em seu próximo mandato. No cenário político nos Estados Unidos, há intensas mobilizações de Trump e republicanos para impedir a vitória democrata nas eleições de meio de mandato, com Trump criticando as eleições brasileiras, chamando-as de 'fraudulentes'.\n\nAs tensões geopolíticas continuam a se intensificar em diversos cenários. Em primeiro lugar, a Coreia do Norte é acusada pelo FBI de estar por trás de um roubo de criptomoedas no valor de US$6 bilhões, o que aumenta a preocupação sobre a escalada de tensões na região. Em segundo lugar, a Ucrânia desafia as pressões dos Estados Unidos e continua seus ataques a refinarias de petróleo russas, desafiando a política externa americana. Paralelamente, a Coreia do Sul expressa temores com a aproximação entre Estados Unidos e Coreia do Norte, o que poderia perturbar a segurança regional. Em outros locais, a Letônia relata invasões de espaço aéreo por drones ucranianos, levantando preocupações sobre a expansão da guerra na Ucrânia para outros países da Otan. Na América Latina, o conflito israelense-palestino continua com o cerco em Hebron que se estende por 10 dias, enquanto a ONU reafirma seu compromisso com uma solução pacífica para o conflito do Saara Ocidental. Em um contexto mais amplo, o Irã e mediadores do Catar continuam negociando para um fim da guerra, enquanto a França investiga uma tentativa de homicídio durante protestos contra o aumento do custo de vida. Estas são algumas das principais notícias na área de geopolítica que vêm sendo discutidas nos últimos dias.", "economia": "A economia global enfrenta diversos desafios e oportunidades, com destaque para as exportações da Coreia do Sul, que quase dobraram devido à alta demanda por tecnologia de inteligência artificial. Em um desenvolvimento econômico importante, as exportações do agronegócio brasileiro para a União Europeia aumentaram em 14,8% nos últimos seis meses, graças a um acordo de livre comércio entre Mercosul e UE. No Brasil, a Petrobras reajustou o preço do querosene de aviação em 7,2%, correspondendo a um aumento de R$ 0,45 por litro, em face das tensões geopolíticas. Após sua reeleição, o presidente Lula enfrenta pressões para definir a equipe econômica e as medidas de ajuste fiscal, enquanto a Binance registrou saídas líquidas de US$ 3,64 bilhões após a retomada de saques. Além disso, a Petrobras anunciou um reajuste de 7,2% no preço do querosene de aviação, equivalente a R$ 0,45 por litro, em novembro, refletindo tensões geopolíticas e políticas no Oriente Médio e Europa.", "tecnologia": "A Standard & Poor's revisou para negativo a perspectiva de Meta, a empresa propriedade do Facebook, sem detalhar as razões específicas. A NASA está buscando propostas da indústria espacial comercial para manter o telescópio Hubble em operação, uma vez que a gravidade lentamente puxa o telescópio para sua eventual desativação. A Binance retomou as saques após um furto de 6,3 bilhões de dólares, recuperando 95% dos ativos roubados. A OpenAI estendeu as restrições no uso do ChatGPT para evitar discussões sobre armas e violência, implementando novas medidas de proteção para menores e mecanismos para denúncias policiais. A startup Everbloom desenvolveu um novo material chamado renoa, que é a primeira fibra inovadora em 25 anos, proporcionando uma sensação familiar. Além disso, a Binance, após o maior hack de criptomoedas, viu um aumento significativo nas retiradas de clientes, totalizando 3,64 bilhões de dólares, enquanto a NASA aprimorou seus satélites para registrar com maior precisão o dióxido de carbono na atmosfera.", "ciencia": "Um estudo controverso da psicologia social, a prisão de Stanford e os experimentos de Stanley Milgram, que foram criticados e podem ter sido fraudados, ainda exercem influência significativa na pesquisa e na compreensão da psicologia social. Em outro desenvolvimento, a NASA anunciou que a missão SR-1 Freedom, a primeira nave com propulsão nuclear para viagens interplanetárias com destino a Marte, está programada para um lançamento até o final de 2028. Além disso, cientistas da Universidade da Virgínia desenvolveram uma estratégia promissora para combater o glioblastoma, um dos cânceres cerebrais mais letais, usando ondas sonoras focadas, nanopartículas pequenas e moléculas genéticas chamadas microRNAs. Por fim, uma breve assinatura ou fórmula de conclusão em maia, escrita nas paredes de uma possível biblioteca pré-colombiana, pode representar a assinatura de um dos primeiros astrônomos do Novo Mundo, anterior aos europeus, cuja identidade foi reconhecida pela ciência.", "cultura": "A Nuit Blanche em Taipei trouxe uma noite repleta de arte para o bairro de Yuanshan, com diversas formas de expressão artística. Em outro evento, a instalação artística 'Heroes of Taiwanese Baseball' celebrou os heróis do beisebol local. No exterior, a Comic-Con Lucca comemorou seu 60º aniversário com a presença de criadores de conteúdo, artistas e fãs de quadrinhos e anime. Em Buenos Aires, a feria ArteBA comemorou seus 35 anos, registrando grandes compras e um público diversificado. No Brasil, o techno perdeu um de seus pioneiros, Juan Atkins, aos 64 anos. Ainda na música, My Chemical Romance atingiu o topo da Billboard 200 com 'The Black Parade', 20 anos após seu lançamento. No cinema, Sofia Demetriades venceu o concurso BBC Young Musician 2026, em uma final totalmente composta por mulheres, com uma impressionante performance do Concerto para Violino de Tchaikovsky. No documentário, James Longley, vencedor do Oscar, discutiu seu próximo projeto sobre o genocídio dos rohingyas. No teatro, Gerald Thomas, diretor de teatro, se internou em uma UTI no Rio de Janeiro, sem detalhar o motivo da internação. No Brasil, o Ministério Público Federal investiga um possível desvio de telas do acervo da Igreja da Ordem Terceira de São Francisco.", "sociedade": "Em vários países, a sociedade enfrenta diversos desafios. Na França, protestos contra o aumento do custo de vida continuam, com 779 pessoas detidas no fim de semana, e centenas de milhares de jovens europeus se manifestam em vários países, incluindo a Alemanha, onde manifestações da Geração Z agitam as ruas. Em Bangladesh, trabalhadores da indústria de confecção entraram em conflito com a polícia em protesto contra salários baixos. Na França, a Binance retomou os saques após um ataque hacker que causou um prejuízo de 6,3 bilhões de dólares. No Brasil, a Prefeitura de São Paulo promove uma campanha de vacinação antirrábica e microchipagem para cães e gatos, enquanto a campanha 'Novembro Azul' destaca o câncer de próstata como o segundo tipo mais comum em homens. Em Taiwan, o Ministério da Educação estabeleceu diretrizes para proteger professores. No Brasil, relatos de assédio e intimidação a funcionários após as eleições 2022 levam o governo a investigar esses casos. Em Hong Kong, uma mulher foi condenada a três anos de prisão por não prestar assistência médica ao filho gravemente doente e por obter seguros de vida em seu lugar. No exterior, a crise de assistência para crianças em casas de cuidados no Reino Unido é debatida, enquanto um tiroteio em um laboratório de drogas deixa um policial baleado, duas mortes e cinco pessoas presas no interior do estado.", "meio_ambiente": "Em dezembro, o estado da Califórnia inaugurará o maior puente para animais do mundo, que cruza uma autopista de dez pistas perto das Montanhas de Santa Mônica. A estrutura, coberta com terra e vegetação típica da região, visa facilitar o deslocamento de animais e preservar a biodiversidade local. No Brasil, o presidente Luiz Inácio Lula da Silva visitou um viveiro de araras reformado na Granja do Torto, onde as aves retornaram ao espaço após passarem pelo Zoológico de Brasília. No Pantanal de Mato Grosso do Sul, uma barcaça com mil toneladas de minério afundou no rio Paraguai, causando um vazamento e levando a investigações do Ibama sobre as possíveis consequências ambientais. No Território do Norte do Brasil, o governo planeja eliminar uma exigência legal que determina a reserva de água para a natureza, o que é visto por grupos ambientais como um 'ataque escancarado e sem vergonha' ao meio ambiente. Diante desses eventos, questões ambientais também podem ser abordadas no Enem e vestibulares devido à sua relevância atual, enquanto um adolescente de 14 anos da Flórida construiu jardins submarinos verticais de ostras para limpar a água, resultando na purificação de 950.000 litros por dia.", "direitos_humanos": "O aumento da população carcerária tem levado a várias consequências, incluindo a falta de atendimento à saúde mental nos presídios, conforme um relatório do Comitê de Prevenção à Tortura. Entre 2020 e 2025, a taxa de suicídios foi de 51,2 por 100.000 detentos anualmente. Além disso, o ICE (Immigration and Customs Enforcement) dos Estados Unidos lançou um vídeo em que debocha de migrantes presos, iniciando com a música 'Thriller', de Michael Jackson, e mostrando imagens de prisões e migrantes detidos, acompanhadas por ícones de filmes de terror. Em outro desenvolvimento, a artista Pitjantjatjara Sally Scales afirmou que a tecnologia está usando arte indígena australiana e criando 'Temu slop', o que representa uma 'falta de respeito' pela cultura e diminui a autonomia dos artistas indígenas. Finalmente, o governo brasileiro anunciou no sábado, 31, que aumentará a presença da Força Nacional em aldeias indígenas de Mato Grosso do Sul, em resposta a denúncias de violência, incluindo reforço no efetivo e monitoramento das comunidades Guarani Kaiowá."}, "resumo_do_dia": {"politica_nacional": [{"id": 239436, "titulo": "Lula garante que programas sociais serão mantidos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-garante-que-programas-sociais-serao-mantidos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-01T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva assegurou que programas sociais não serão extintos em seu próximo governo. Segundo ele, novos programas podem ser criados ou os existentes aperfeiçoados.", "titulo_pt": "Lula garante que programas sociais serão mantidos", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 239504, "titulo": "Tudo o que foi prometido na campanha vai acontecer, podem ter certeza, diz Lula", "url": "https://www.infomoney.com.br/politica/tudo-o-que-foi-prometido-na-campanha-vai-acontecer-podem-ter-certeza-diz-lula/", "fonte_id": "infomoney", "data_pub": "2026-11-01T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma publicação nas redes sociais no dia 1º de novembro, Lula declarou que tudo o que foi prometido durante a campanha eleitoral será realizado. O presidente afirmou com certeza que as promessas serão cumpridas.", "titulo_pt": "Tudo o que foi prometido na campanha vai acontecer, diz Lula", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 239460, "titulo": "O empresário recebido por Lula logo após a vitória histórica nas urnas", "url": "https://veja.abril.com.br/brasil/o-empresario-recebido-por-lula-logo-apos-a-vitoria-historica-nas-urnas/", "fonte_id": "veja", "data_pub": "2026-11-01T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Joesley Batista foi recebido por Lula logo após este ter confirmado sua reeleição para o quarto mandato.", "titulo_pt": "Empresário recebe Lula após vitória nas urnas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239479, "titulo": "GCM é investigado por violência doméstica contra a esposa no interior de SP", "url": "https://www.metropoles.com/sao-paulo/gcm-e-investigado-por-violencia-domestica-contra-a-esposa-no-interior-de-sp", "fonte_id": "metropoles", "data_pub": "2026-11-01T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um agente da Guarda Civil Municipal (GCM) está sendo investigado por supostas violências domésticas contra sua esposa em Mairinque, interior de São Paulo. A mulher relatou que o suspeito teria apontado a arma para o próprio rosto, e o caso está sendo apurado pela Corregedoria da GCM local.", "titulo_pt": "GCM é investigado por violência doméstica contra a esposa no interior de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239422, "titulo": "Aliados avisaram Flávio Bolsonaro sobre risco de prisão e de ele virar novo Jair", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/aliados-avisaram-flavio-bolsonaro-sobre-risco-de-prisao-e-de-ele-virar-novo-jair.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-01T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro se reuniu com seus advogados e aliados políticos após a derrota na disputa presidencial, sentindo-se injustiçado e inconformado. Aliados haviam avisado sobre o risco de prisão e que ele poderia se tornar o novo Jair Bolsonaro (presumindo-se referência a Jair Bolsonaro).", "titulo_pt": "Aliados alertaram Flávio Bolsonaro sobre risco de prisão e possibilidade de se tornar novo Jair", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 239449, "titulo": "Maior erro da minha vida, diz Felipe Neto sobre publicidade de bets", "url": "https://www.poder360.com.br/poder-brasil/maior-erro-da-minha-vida-diz-felipe-neto-sobre-publicidade-de-bets/", "fonte_id": "poder360", "data_pub": "2026-11-01T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Felipe Neto afirmou que cometer um erro grave ao promover publicidades de apostas esportivas. Ele classificou as apostas como um 'câncer social' em uma publicação no aplicativo X.", "titulo_pt": "Maior erro da minha vida, diz Felipe Neto sobre publicidade de apostas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239450, "titulo": "Fux inclui ministérios da Saúde e da Justiça em audiência sobre bets", "url": "https://www.poder360.com.br/poder-justica/fux-inclui-ministerios-da-saude-e-da-justica-em-audiencia-sobre-bets/", "fonte_id": "poder360", "data_pub": "2026-11-01T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Supremo Tribunal Federal (STF), Roberto Fux, incluiu ministérios da Saúde e da Justiça em uma audiência sobre bets. A decisão atendeu a um pedido da Advocacia-Geral da União (AGU), que argumentou que a lista de participantes anteriormente incluía clubes de futebol e empresas de apostas.", "titulo_pt": "Fux inclui ministérios da Saúde e da Justiça em audiência sobre apostas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239464, "titulo": "Governo reclama e STF permite que ministérios da Saúde e da Justiça participem de audiência sobre bets", "url": "https://veja.abril.com.br/politica/governo-reclama-e-stf-permite-que-ministerios-da-saude-e-da-justica-participem-de-audiencia-sobre-bets/", "fonte_id": "veja", "data_pub": "2026-11-01T20:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Audiência pública sobre bets está marcada para o próximo dia 3 e contará com a participação de clubes de futebol, entidades da sociedade civil e representantes do governo. O STF permitiu que ministérios da Saúde e da Justiça participassem da audiência.", "titulo_pt": "Governo participa de audiência sobre bets", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239452, "titulo": "Chef Julio Ritta rebate Nikolas e defende ação social em vídeo", "url": "https://www.poder360.com.br/poder-eleicoes-2026/chef-julio-ritta-rebate-nikolas-e-defende-acao-social-em-video/", "fonte_id": "poder360", "data_pub": "2026-11-01T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundador do Cozinheiros do Bem, Julio Ritta, respondeu a críticas feitas pelo deputado Nikolas sobre a perda de patrocinadores e doadores da iniciativa social.", "titulo_pt": "Julio Ritta rebate Nikolas sobre perda de patrocinadores do cozinheiros do bem", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239439, "titulo": "Universidade do Paraná expulsa estudantes após ataques políticos contra bolsistas", "url": "https://www.cartacapital.com.br/educacao/universidade-do-parana-expulsa-estudantes-apos-ataques-politicos-contra-bolsistas/", "fonte_id": "cartacapital", "data_pub": "2026-11-01T20:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes foram expulsos da Universidade do Paraná após compartilhar mensagens ofensivas em um grupo do WhatsApp sobre a reeleição do presidente Lula (PT).", "titulo_pt": "Universidade do Paraná expulsa estudantes após ataques políticos contra bolsistas", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 239437, "titulo": "Denúncias de violência política quadriplicam em outubro no Disque 100", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/violencia-politica-disque-100-recebeu-189-denuncias-durante-eleicao", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-01T20:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério dos Direitos Humanos e da Cidadania recebeu 189 denúncias de violência política durante o período eleitoral deste ano, que foram encaminhadas para diversas instituições federais. Estas denúncias, que dobraram em comparação com o mesmo período do ano passado, foram feitas ao Disque 100 e diretamente à pasta ou a outros ministérios.", "titulo_pt": "Denúncias de violência política triplicam em outubro no Disque 100", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 239454, "titulo": "“Nenhum programa social será extinto nesse país”, diz Lula", "url": "https://www.poder360.com.br/poder-governo/nenhum-programa-social-sera-extinto-nesse-pais-diz-lula/", "fonte_id": "poder360", "data_pub": "2026-11-01T20:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que nenhum programa social será extinto durante seu governo. Ele disse que pode criar novas iniciativas ou aprimorar as existentes.", "titulo_pt": "Nenhum programa social será extinto nesse país", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239514, "titulo": "Ministério da Educação quer que PF e AGU apurem denúncias de violência política durante e após eleições", "url": "https://www.brasildefato.com.br/2026/11/01/ministerio-da-educacao-quer-que-pf-e-agu-apurem-denuncias-de-violencia-politica-durante-e-apos-eleicoes/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-01T19:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Educação está coletando denúncias de violência política durante e após as eleições de 2026, encaminhando-as à Polícia Federal e à Advocacia-Geral da União. Essa medida visa apurar ameaças contra universidades federais, estudantes e outros envolvidos.", "titulo_pt": "Ministério da Educação quer que PF e AGU apurem denúncias de violência política durante e após eleições", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 239466, "titulo": "O maior desafio de Janones com o “Exército do Lula” após as eleições", "url": "https://veja.abril.com.br/politica/o-maior-desafio-de-janones-com-o-exercito-do-lula-apos-as-eleicoes/", "fonte_id": "veja", "data_pub": "2026-11-01T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio para Janones será manter a mobilização do 'Exército do Lula' após as eleições, uma tarefa complicada devido ao desgaste do grupo.", "titulo_pt": "O maior desafio de Janones com o 'Exército do Lula' após as eleições", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239423, "titulo": "Filho de Tancredo Neves obtém direito de receber registros médicos do ex-presidente", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/filho-de-tancredo-neves-obtem-direito-de-receber-registros-medicos-do-ex-presidente.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-01T19:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um filho de Tancredo Neves venceu uma ação judicial para obter os registros médicos sobre o tratamento e a morte do ex-presidente, ocorridos em 1985. Essa decisão permitirá que o filho possa acessar esses documentos após mais de 30 anos.", "titulo_pt": "Filho de Tancredo Neves conquista direito de acessar registros médicos do pai", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 239425, "titulo": "Aliados de Tarcísio apostam no desgaste do bolsonarismo para lançar candidatura em 2030", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/aliados-de-tarcisio-apostam-no-desgaste-do-bolsonarismo-para-lancar-candidatura-em-2030.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-01T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do governador Tarcísio de Freitas apostam no desgaste do bolsonarismo para potencializar uma candidatura sua à Presidência da República em 2030.", "titulo_pt": "Aliados de Tarcísio apostam no desgaste do bolsonarismo para lançar candidatura em 2030", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 239307, "titulo": "Taiwan protests APEC ‘discrimination’", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/02/2003866988", "fonte_id": "taipei_times", "data_pub": "2026-11-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null is aprendendo a executar tarefas, reconhecer padrões e interagir com pessoas. Empresas de tecnologia estão buscando novas formas de obter informações de qualidade para melhorar a precisão, a segurança e a utilidade das ferramentas, devido à desproporção entre a quantidade de dados necessários e a disponibilidade de dados de qualidade.", "titulo_pt": "Até onde as empresas vão para treinar suas IAs", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 239492, "titulo": "Rival da Starlink avança no Brasil e quer levar satélite a 200 milhões de celulares", "url": "https://exame.com/invest/mercados/rival-da-starlink-avanca-no-brasil-e-quer-levar-satelite-a-200-milhoes-de-celulares/", "fonte_id": "exame", "data_pub": "2026-11-01T18:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa americana recebeu o aval da Anatel para usar 30 MHz na banda S e acaba de adicionar quatro operadoras regionais que cederão a faixa de 700 MHz. Isso indica o avanço do projeto para levar internet por satélite a 200 milhões de celulares no Brasil.", "titulo_pt": "Concorrente da Starlink avança no Brasil e busca levar satélite a 200 milhões de celulares", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 239548, "titulo": "Lava e seca estraga as roupas mais rápido? Descubra antes de comprar", "url": "https://canaltech.com.br/eletro/lava-e-seca-estraga-as-roupas-mais-rapido-descubra-antes-de-comprar/", "fonte_id": "canaltech", "data_pub": "2026-11-01T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso frequente da função de secagem em lavadoras e secadoras pode acelerar o desgaste das roupas, mas isso não ocorre com todas as peças. O impacto depende de vários fatores, conforme explicado por Marcia Zile de Abreu Melo, gerente de Qualidade e Processos do Grupo Malwee.", "titulo_pt": "Lava e seca estraga as roupas mais rápido? Descubra antes de comprar", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 239543, "titulo": "Nova ferramenta de pagamento do Itaú leva compras online para dentro do aplicativo do banco", "url": "https://olhardigital.com.br/2026/11/01/pro/nova-ferramenta-de-pagamento-do-itau-leva-compras-online-para-dentro-do-aplicativo-do-banco/", "fonte_id": "olhar_digital", "data_pub": "2026-11-01T18:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itaú lançou uma nova ferramenta que visa facilitar compras online, diminuir recusas de pagamento e oferecer condições especiais de crédito aos clientes. O serviço será integrado ao aplicativo bancário.", "titulo_pt": "Nova ferramenta de pagamento do Itaú traz compras online para o aplicativo do banco", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 238987, "titulo": "12 vantagens e desvantagens de fazer root no Android", "url": "https://canaltech.com.br/apps/vantagens-e-desvantagens-root-no-android/", "fonte_id": "canaltech", "data_pub": "2026-11-01T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fazer root no Android dá mais controle sobre o dispositivo, permitindo a remoção de aplicativos pré-instalados, personalização da interface, instalação de versões alternativas do sistema e ajustes de desempenho, mas pode também expor brechas de segurança e causar problemas funcionais.", "titulo_pt": "12 Vantagens e desvantagens de rootear o Android", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 239050, "titulo": "Santiago Maratea decidió cerrar su cuenta de Instagram", "url": "https://www.lanacion.com.ar/espectaculos/santiago-maratea-decidio-cerrar-su-cuenta-de-instagram-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T17:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O influenciador Santiago Maratea decidiu fechar sua conta no Instagram. Essa decisão foi revelada durante o programa de TV Podemos Hablar.", "titulo_pt": "Santiago Maratea decidiu fechar sua conta no Instagram", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 239357, "titulo": "TechCrunch Mobility: A new, bigger AV boom is here", "url": "https://techcrunch.com/2026/11/01/techcrunch-mobility-a-new-bigger-av-boom-is-here/", "fonte_id": "techcrunch", "data_pub": "2026-11-01T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TechCrunch Mobility retorna com foco no futuro da mobilidade e na importância crescente do uso da inteligência artificial nesse setor. O avanço na tecnologia de veículos autônomos está aumentando significativamente, destacando-se como um tema central.", "titulo_pt": "Techcrunch Mobility: um novo boom de veículos autônomos está em pleno desenvolvimento", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 239777, "titulo": "Climate change is killing the plants of Uluṟu‑Kata Tjuṯa: Aṉangu traditional owners are concerned", "url": "https://phys.org/news/2026-10-climate-ulurukata-tjua-anangu-traditional.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mudança climática está afetando as plantas do Ulurú-Kata Tjuṯa, preocupando os tradicionais proprietários da terra Anangu. As imagens comuns de danos climáticos, como as marés altas destruindo praias ou ondas de calor queimando corais, não capturam a realidade das desertas regiões.", "titulo_pt": "Mudança climática está matando as plantas do ulurú-kata Tjuṯa: proprietários tradicionais estão preocupados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239778, "titulo": "Collective human metabolism produces 2 billion metric tons of CO₂ a year, global study estimates", "url": "https://phys.org/news/2026-10-human-metabolism-billion-metric-tons.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada pela Universidade de Bath estima que a carbonização do dióxido de carbono emitido pelo metabolismo humano, ao converter alimentos em energia, aumentou em 74% entre 1985 e 2015, chegando a 2,05 bilhões de toneladas métricas por ano. Os pesquisadores afirmam que esses resultados podem auxiliar cientistas a entender melhor a origem, o destino do carbono e como a atividade humana se encaixa no contexto maior.", "titulo_pt": "Metabolismo humano produz 2 bilhões de toneladas métricas de CO₂ por ano, estima estudo global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239480, "titulo": "Estudo relaciona criatividade artística a mais problemas de saúde mental", "url": "https://www.metropoles.com/saude/estudo-relaciona-criatividade-artistica-a-mais-problemas-de-saude-mental", "fonte_id": "metropoles", "data_pub": "2026-11-01T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 14 mil gêmeos suecos relacionou a criatividade artística com mais problemas de saúde mental, mas não encontrou o mesmo padrão na área científica.", "titulo_pt": "Estudo relaciona criatividade artística a mais problemas de saúde mental", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239779, "titulo": "Mars dust may be less abrasive than lunar dust, spacesuit samples suggest", "url": "https://phys.org/news/2026-10-mars-abrasive-lunar-spacesuit-samples.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rochete NASA's Perseverance, em Marte, está usando pequenos pedaços de material de traje espacial para ajudar os cientistas a avaliar o dano potencial causado pela poeira marsiana. Acreditava-se que a poeira de Marte pudesse ser menos abrasiva que a de Lua.", "titulo_pt": "Poeira de marte pode ser menos abrasiva que a lunar, sugerem amostras de traje do perseverance", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239780, "titulo": "New restrictions kick in as Delhi battles pollution", "url": "https://phys.org/news/2026-11-restrictions-delhi-pollution.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Nova Deli intensificaram medidas antipolução neste domingo, incluindo maiores taxas de estacionamento e ordens de trabalho remoto, com o objetivo de reduzir a neblina tóxica em uma das capitais mais poluídas do mundo.", "titulo_pt": "Novas restrições entram em vigor em nova deli na batalha contra a poluição", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239781, "titulo": "From Italy to Croatia, a warming climate threatens prized white truffles", "url": "https://phys.org/news/2026-11-italy-croatia-climate-threatens-prized.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T19:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tino Marolo, guiado pela luz de uma lanterna, procura por trufas brancas valiosas com sua cão Stella em uma floresta no Piedmont, Itália. O clima aquecido ameaça essas trufas, que são um dos tesouros culinários mais apreciados da região.", "titulo_pt": "Do Brasil à croácia, um clima aquecido ameaça as preizadas trufas brancas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239435, "titulo": "Por que estudos controversos da psicologia ainda exercem tanta influência?", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/por-que-estudos-controversos-da-psicologia-ainda-exercem-tanta-influencia.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-01T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois experimentos famosos da psicologia social, a prisão de Stanford e os estudos de obediência de Stanley Milgram, foram criticados e podem ter sido fraudados. Esses estudos ainda exercem influência significativa na pesquisa e na compreensão da psicologia social.", "titulo_pt": "Por que estudos controversos da psicologia ainda exercem tanta influência?", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 239782, "titulo": "Warmer seas and shifting pressure systems: The signs that suggest the Mediterranean's climate is 'tropicalizing'", "url": "https://phys.org/news/2026-10-warmer-seas-shifting-pressure-mediterranean.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Península Ibérica e as Ilhas Baleares ainda não apresentam uma clima tropical, pois a temperatura média do mês mais frio não ultrapassa 18°C. As diferenças entre as estações no Espaço Ibérico e as baixas temperaturas invernais não se assemelham a climas tropicais.", "titulo_pt": "Aquecimento marítimo e sistemas de pressão em movimento: sinais que indicam que o mediterrâneo está 'tropicalizando'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239372, "titulo": "Why some trees thrive far from home—and what that means for carbon sinks", "url": "https://phys.org/news/2026-10-trees-home-carbon.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo que abrange 192 locais e quatro continentes descobriu que pinheiros plantados no Hemisfério Sul crescem até quatro vezes mais rápido e são mais resistentes à seca do que os pinheiros que crescem em suas regiões nativas.", "titulo_pt": "Por que algumas árvores prosperam longe de casa — e o que isso significa para os bancos de carbono", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 238946, "titulo": "Remédio para câncer de pulmão pode evitar avanço da doença por 7 anos", "url": "https://www.cnnbrasil.com.br/saude/remedio-para-cancer-de-pulmao-pode-evitar-avanco-da-doenca-por-7-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um medicamento em forma de comprimido de via oral pode frear o avanço do câncer de pulmão por até sete anos. No Brasil, o medicamento é aprovado pela Anvisa e tem um custo médio de R$ 40 mil por caixa.", "titulo_pt": "Remédio para câncer de pulmão pode evitar avanço da doença por 7 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239398, "titulo": "'Metroid Prime' needs some 'Resident Evil'-style remakes to rediscover its sci-fi shooter mojo", "url": "https://www.space.com/entertainment/space-games/metroid-prime-needs-some-resident-evil-style-remakes-to-rediscover-its-sci-fi-shooter-mojo", "fonte_id": "space_com", "data_pub": "2026-11-01T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A franquia de jogos de tiro em primeira pessoa sci-fi da Nintendo está em problemas, mas há uma solução para os problemas da Samus.", "titulo_pt": "'Metroid Prime' precisa de remasterizações do estilo 'Resident Evil' para recuperar seu encanto como jogo de tiro sci-fi", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239373, "titulo": "How permanent daylight saving time could affect schools", "url": "https://phys.org/news/2026-10-permanent-daylight-affect-schools.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mudança para um horário de verão permanente pode afetar o sono, que é fundamental para o bem-estar. Canadáulas decidiram manter o horário de verão todo o ano, o que pode causar deslocamento de sono para milhões de canadenses.", "titulo_pt": "Como o horário de verão permanente poderia afetar as escolas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239374, "titulo": "Heavy hydrogen in 3I/ATLAS's methane points to a frigid birthplace", "url": "https://phys.org/news/2026-10-heavy-hydrogen-3iatlas-methane-frigid.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cometa interestelar 3I/ATLAS apresenta uma pista química sobre as condições em seu sistema planetário de origem, preservada há muito tempo antes de chegar ao nosso sol. A sua assinatura de metano é excepcionalmente rica em hidrogênio pesado, indicando que os ingredientes congelados do cometa se formaram em um ambiente extremamente frio ao redor de outra estrela ou na nuvem que a precedeu.", "titulo_pt": "Hidrogênio pesado no metano do cometa 3I/ATLAS indica um nascimento frio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239399, "titulo": "Planetary defense: How military and civil satellites are watching fireballs to help keep Earth safe from space rocks", "url": "https://www.space.com/stargazing/meteor-showers/planetary-defense-how-military-and-civil-satellites-are-watching-fireballs-to-help-keep-earth-safe-from-space-rocks", "fonte_id": "space_com", "data_pub": "2026-11-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Satélites estão monitorando meteoros brilhantes que passam pela atmosfera terrestre, fortalecendo o conhecimento de defesa planetária e auxiliando os cientistas a aprenderem mais sobre impactos de detritos espaciais.", "titulo_pt": "Defesa planetária: como satélites militares e civis estão observando meteoros para ajudar a proteger a terra de rochas espaciais", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239400, "titulo": "On this day in space! Nov. 1, 1962: The Soviet Union Launches Mars 1 spacecraft to Red Planet during the Space Race", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-1-2026", "fonte_id": "space_com", "data_pub": "2026-11-01T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1º de novembro de 1962, a União Soviética lançou o foguete Mars 1 em direção ao planeta Vermelho. Este lançamento fazia parte da corrida espacial e buscava realizar um voo por Marte.", "titulo_pt": "1º de novembro de 1962: união soviética lança foguete Mars 1 em direção ao planeta vermelho durante a corrida espacial", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239375, "titulo": "2,700-year-old mummy head yields first molecular evidence linking aloe to Egyptian embalming", "url": "https://phys.org/news/2026-10-year-mummy-yields-molecular-evidence.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time interdisciplinar da Universidade de Marburg combina análise de produtos naturais modernos com arqueologia egípcia e história da farmacologia para investigar os materiais usados pelos antigos egípcios na preservação dos mortos e como sua composição pode ainda ser estudada após milhares de anos. A cabeça mumificada de 2.700 anos forneceu a primeira evidência molecular ligando aloe à embalsamação egípcia.", "titulo_pt": "Cabeça mumificada de 2.700 anos oferece primeiro evidência molecular de uso de aloe na embalsamação egípcia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 239315, "titulo": "Nuit Blanche brings a night of art to Taipei’s Yuanshan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/02/2003867002", "fonte_id": "taipei_times", "data_pub": "2026-11-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Noite Branca trouxe uma noite de arte para o Yuanshan em Taipei. O evento apresentou diversas formas de arte durante a noite.", "titulo_pt": "Noite branca traz uma noite de arte para Yuanshan, Taipei", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 239316, "titulo": "Art installation celebrates Taiwanese baseball heroes", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/02/2003867003", "fonte_id": "taipei_times", "data_pub": "2026-11-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma instalação artística celebra os heróis do beisebol taiwanês. O evento homenageia jogadores e figuras importantes do esporte na ilha.", "titulo_pt": "Instalação artística homenageia heróis do beisebol taiwanês", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 239790, "titulo": "Five Takeaways From Lucca Comics and Games, Europe’s Largest Comic-Con: ‘Harry Potter’ and ‘Percy Jackson’ Fandoms Are Alive and Well, As Are Cosplayers", "url": "https://variety.com/2026/film/global/five-takeaways-lucca-comic-and-games-1236936963/", "fonte_id": "variety", "data_pub": "2026-11-01T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lucca Comics and Games, a maior Comic-Con da Europa, comemorou seu 60º aniversário recentemente, reunindo criadores de conteúdo, artistas, jogadores, autores de quadrinhos e mangás, produtores de séries de TV e anime, atores e diretores de filmes. O evento atraíu aproximadamente 80.000 pessoas.", "titulo_pt": "Cinco pontos principais da Lucca Comics and Games, a maior Comic-Con da Europa: Fandoms de ‘harry Potter’ e ‘Percy Jackson’ ainda são fortes, assim como os Cosplayers", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 239791, "titulo": "‘Gintama: Yoshiwara in Flames’ Director and Producer Discuss Bringing the Cult Anime to the Big Screen", "url": "https://variety.com/2026/film/asia/gintama-yoshiwara-in-flames-lucca-comics-and-games-1236936938/", "fonte_id": "variety", "data_pub": "2026-11-01T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Gintama: Yoshiwara in Flames' foi apresentado em um evento de quadrinhos na Europa antes de sua estreia nos cinemas italianos. O diretor Naoya Andô e o produtor Ryo Nakamura discutiram sobre a continuação da saga do anime.", "titulo_pt": "Diretor e produtor de 'gintama: yoshiwara em chamas' falam sobre a continuação do Anime para o cinema", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 239565, "titulo": "“Una fiesta”: récords, nuevos compradores y reencuentros para celebrar los 35 años de arteba", "url": "https://www.lanacion.com.ar/cultura/una-fiesta-records-nuevos-compradores-y-reencuentros-para-celebrar-los-35-anos-de-arteba-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T21:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A feria ArteBA comemorou seus 35 anos em La Rural, registrando uma grande quantidade de compras institucionais e atraiu um público diversificado, com mais de 41.000 visitantes.", "titulo_pt": "Festa dos 35 anos: novos compradores e reencontros para arteba", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 239430, "titulo": "Morre Juan Atkins, DJ pioneiro do techno de Detroit, aos 64 anos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/morre-juan-atkins-dj-pioneiro-do-techno-de-detroit-aos-64-anos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-01T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Juan Atkins, produtor e DJ americano e um dos fundadores do techno de Detroit, faleceu aos 64 anos na Cidade do México. Atkins era membro da dupla Cybotron e também atuou como artista solo sob o nome Model 500.", "titulo_pt": "Morre Juan Atkins, DJ pioneiro do techno de Detroit, aos 64 anos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 239792, "titulo": "Hilary Duff Says She Was ‘F—ing Done’ With ‘Lizzie McGuire’ When It Ended and Never Wanted to Sing ‘What Dreams Are Made Of’ Again: I Was ‘Exhausted By It’", "url": "https://variety.com/2026/music/news/hilary-duff-fing-done-when-lizzie-mcguire-ended-1236936919/", "fonte_id": "variety", "data_pub": "2026-11-01T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hilary Duff afirmou que estava 'exausta' após o fim da série 'Lizzie McGuire' em 2003 e que nunca mais quis cantar 'What Dreams Are Made Of' novamente. Ela regravou a canção para seu EP '(Mine)' de 2026 e a cantou ao vivo pela primeira vez.", "titulo_pt": "Hilary Duff diz que estava 'exausta' com 'Lizzie McGuire' após o fim da série e nunca quis cantar 'What Dreams Are Made Of' novamente", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 239800, "titulo": "My Chemical Romance Tops the Billboard 200 With 20-Year-Old Album", "url": "https://www.rollingstone.com/music/music-news/my-chemical-romance-black-parade-billboard-200-number-one-1235650097/", "fonte_id": "rolling_stone_music", "data_pub": "2026-11-01T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O álbum 'The Black Parade', da banda de rock My Chemical Romance, alcançou o topo da Billboard 200 com sua reedição em comemoração ao seu 20º aniversário, superando Olivia Rodrigo na lista.", "titulo_pt": "My Chemical Romance chega ao topo da Billboard 200 com álbum de 20 anos", "veiculo": "Rolling Stone - Música", "pais": "EUA", "classe": "C"}, {"id": 239461, "titulo": "Tate McRae e Ashe decretam fim da ‘mulher do lar’ em músicas virais", "url": "https://veja.abril.com.br/cultura/tate-mcrae-e-ashe-decretam-fim-da-mulher-do-lar-em-musicas-virais/", "fonte_id": "veja", "data_pub": "2026-11-01T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ashe e Tate McRae lançaram duas músicas que se tornaram muito populares, estando entre as cinco mais ouvidas do Spotify mundialmente. As canções 'Housewife' e 'Stop The Wedding!' marcaram um ponto na cultura digital.", "titulo_pt": "Ashe e tate McRae anunciam fim da ‘mulher do lar’ em músicas virais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239569, "titulo": "La paradoja de la felicidad que expone Gabriel Rolón: “Podemos alcanzar la faltacidad”", "url": "https://www.lanacion.com.ar/sociedad/la-paradoja-de-la-felicidad-que-expone-gabriel-rolon-podemos-alcanzar-la-faltacidad-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O psicólogo Gabriel Rolón, em entrevista para LA NACION, discutiu a importância dessa construção atual e sugeriu que as pessoas devem abandonar a espera por um destino idealizado para aceitar a realidade.", "titulo_pt": "A paradoxa da felicidade que expõe Gabriel Rolón: 'podemos alcançar a faltacidad'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 239783, "titulo": "Blue Planet III review – David Attenborough makes another absolute corker", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/01/blue-planet-iii-review-david-attenborough-bbc-iplayer", "fonte_id": "guardian_culture", "data_pub": "2026-11-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Blue Planet III é uma nova série documental narrada pelo centenário David Attenborough, exibida no BBC One aos domingos. A série é descrita como engraçada, tenso e impressionante, representando uma luz de esperança na série renomada.", "titulo_pt": "Blue Planet III revisão – David Attenborough faz outro verdadeiro sucesso", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 239785, "titulo": "Teenage violinist wins BBC Young Musician 2026, after first all-female final", "url": "https://www.theguardian.com/music/2026/nov/01/bbc-young-musician-teenage-violinist-sofia-demetriades", "fonte_id": "guardian_culture", "data_pub": "2026-11-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sofia Demetriades, uma violinista jovem, venceu o concurso BBC Young Musician 2026, em uma final totalmente composta por mulheres, uma vez que nunca antes ocorreu esse tipo de final no concurso de 48 anos de história. Os juízes elogiaram sua performance do Concerto para Violino de Tchaikovsky, descrevendo-a como cheia de insights, poesia e maturidade.", "titulo_pt": "Violinista jovem vence BBC Young Musician 2026 em final feminina histórica", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 239793, "titulo": "My Chemical Romance Scores First-Ever No. 1 on Albums Chart With ‘The Black Parade,’ 20 Years After Its Release", "url": "https://variety.com/2026/music/news/my-chemical-romance-scores-first-no-1-with-the-black-parade-1236936933/", "fonte_id": "variety", "data_pub": "2026-11-01T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "My Chemical Romance atingiu pela primeira vez a posição número um na Billboard 200 com 'The Black Parade', 20 anos após o lançamento original. O álbum alcançou o topo após um reedição deluxe que incluiu 78.000 unidades equivalentes de álbuns.", "titulo_pt": "My Chemical Romance conquista primeiro lugar No billboard 200 com 'The Black Parade', 20 anos após lançamento", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 239794, "titulo": "‘Criminal Minds: Evolution’ Stars A.J. Cook, Paget Brewster and More React to Series Cancellation: ‘Rest in Peace’", "url": "https://variety.com/2026/tv/news/criminal-minds-evolution-cancellation-reactions-1236936927/", "fonte_id": "variety", "data_pub": "2026-11-01T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estrelas de 'Criminal Minds: Evolution', como A.J. Cook, Paget Brewster e Kirsten Vangsness, estão reagindo à cancelamento da série após sua 20ª temporada. O anúncio ocorreu em um momento apropriado para homenagear a série.", "titulo_pt": "Elenco de 'criminal Minds: evolution' reage ao cancelamento da série", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 239795, "titulo": "Oscar-Nominated Director James Longley Talks His Afghanistan Documentary ‘Mohabat’ and Why His Next Film Will Center on the Rohingya Genocide (EXCLUSIVE)", "url": "https://variety.com/2026/film/global/james-longley-mohabat-rohingya-genocide-1236936781/", "fonte_id": "variety", "data_pub": "2026-11-01T20:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "James Longley, diretor vencedor do prêmio principal do Festival Internacional de Cinema Documental de Ji.hlava com 'Mohabat', será 112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T20:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Quatro crianças e uma jovem morreram em um incêndio em Quitilipi; os menores apresentavam cortes no pescoço. A investigação está sendo realizada para determinar se houve assassinato pela parceria envolvida.", "titulo_pt": "Quatro crianças e uma jovem morreram em incêndio em quitilipi: investigam se foram assassinadas pela parceria", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 239484, "titulo": "Tiroteio em laboratório de drogas deixa PM baleado, 2 mortos e 5 presos", "url": "https://www.metropoles.com/sao-paulo/tiroteio-em-laboratorio-de-drogas-deixa-pm-baleado-2-mortos-e-5-presos", "fonte_id": "metropoles", "data_pub": "2026-11-01T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Militar realizou uma operação em um sítio de Guariba, interior do estado, após denúncias sobre uma refinaria de drogas, resultando em um policial baleado, duas mortes e cinco pessoas presas.", "titulo_pt": "Tiroteio em laboratório de drogas deixa PM baleado, 2 mortos e 5 presos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239486, "titulo": "PF faz buscas em imóvel usado por \"mulas\" do tráfico em Copacabana", "url": "https://www.metropoles.com/brasil/pf-faz-buscas-em-imovel-usado-por-mulas-do-trafico-em-copacabana", "fonte_id": "metropoles", "data_pub": "2026-11-01T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou buscas em um imóvel em Copacabana usado por intermediários do tráfico de drogas. Durante a operação, foram apreendidos entorpecentes e materiais utilizados para esconder a cocaína no corpo de passageiros que viajavam para outros países.", "titulo_pt": "PF faz buscas em imóvel usado por 'mulas' do tráfico em Copacabana", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239487, "titulo": "Prefeitura de SP promove vacinação antirrábica e microchipagem para pets", "url": "https://www.metropoles.com/sao-paulo/prefeitura-de-sp-promove-vacinacao-antirrabica-e-microchipagem-para-pets", "fonte_id": "metropoles", "data_pub": "2026-11-01T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de São Paulo realiza uma campanha de vacinação antirrábica e microchipagem para cães e gatos de 7 a 14 de novembro. Os animais serão vacinados e microchipados gratuitamente durante este período.", "titulo_pt": "Prefeitura de SP promove vacinação antirrábica e microchipagem para pets", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239716, "titulo": "Why the 'elite overproduction' theory is misunderstanding young people's anger", "url": "https://www.lemonde.fr/en/opinion/article/2026/11/01/why-the-elite-overproduction-theory-is-misunderstanding-young-people-s-anger_6768940_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A teoria de que há uma ligação causal entre uma excessiva produção de elites e crises sociais tem sido usada por setores conservadores para explicar o mal-estar juvenil. No entanto, muitos sociólogos contestam essa ideia, afirmando que o desencanto decorre da falha na materialização da igualdade de oportunidades prometida.", "titulo_pt": "Por que a teoria da 'produção excessiva de elites' está mal compreendendo o descontentamento jovem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 238875, "titulo": "Estudantes franceses retomarão bloqueios após rejeitarem medidas do governo", "url": "https://veja.abril.com.br/mundo/estudantes-franceses-retomarao-bloqueios-apos-rejeitarem-medidas-do-governo/", "fonte_id": "veja", "data_pub": "2026-11-01T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes franceses planejam retomar bloqueios em escolas após rejeitarem as medidas do governo. 00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o fim de semana de Halloween, ocorreram tiroteios em várias cidades dos Estados Unidos, resultando em pelo menos seis mortes e dezenas de feridos. Em Dallas, o local mais violento, quatro pessoas morreram e 15 ficaram feridas após um grupo de tiroteios em uma área da cidade conhecida por seus bares, restaurantes e vida noturna.", "titulo_pt": "6 Mortos, dezenas feridos em violência armada no fim de semana de Halloween por todo o país", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 239496, "titulo": "Protestos na França deixam 779 pessoas detidas e 116 agentes feridos no fim de semana", "url": "https://exame.com/mundo/protestos-na-franca-deixam-779-pessoas-detidas-e-116-agentes-feridos-no-fim-de-semana/", "fonte_id": "exame", "data_pub": "2026-11-01T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No fim de semana, 779 pessoas foram detidas e 116 agentes de segurança ficaram feridos durante os protestos na França. O balanço do Ministério do Interior indica uma diminuição no número de detenções em comparação com a semana anterior.", "titulo_pt": "Protestos na França deixam 779 pessoas detidas e 116 agentes feridos no fim de semana", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 239259, "titulo": "Bangladesh workers clash with police in protests over low pay", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/1/bangladesh-workers-clash-with-police-in-protests-over-low-pay?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-01T16:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da indústria de confecção em Bangladesh entraram em conflito com a polícia na capital Dhaka. A confusão ocorreu em protesto contra salários baixos.", "titulo_pt": "Trabalhadores da confecção em bangladesh entram em conflito com a polícia por salários baixos", "veiculo": "Al Jazeera English", "p rnia inaugurará o maior puente para animais do mundo, que cruza uma autopista de dez pistas perto das Montanhas de Santa Mônica. A estrutura é coberta com terra e vegetação típica da região.", "titulo_pt": "Califórnia inaugurará em dezembro o puente para animais mais grande do mundo: cruza uma autopista de dez pistas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 239035, "titulo": "En Florida, un adolescente de 14 años construyó jardines submarinos verticales de ostras para limpiar 950.000 litros de agua por día", "url": "https://www.clarin.com/estados-unidos/florida-adolescente-14-anos-construyo-jardines-submarinos-verticales-ostras-limpiar-950000-litros-agua-dia_0_bHdiJZRSGB.html", "fonte_id": "clarin", "data_pub": "2026-11-01T17:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Isaac Nelson, um adolescente de 14 anos, construiu jardins submarinos verticais de ostras na Flórida para limpar água. O projeto resulta na purificação de 950.000 litros de água por dia. Ele é protagonista de um documentário sobre mudanças no water e foi finalista do Premio Sylvia Earle de Conservação Oceânica 2026.", "titulo_pt": "Em flórida, adolescente de 14 anos construiu jardins submarinos verticais de ostras para limpar água", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 239234, "titulo": "Biodiversity COP17: Leading negotiator Steven Guilbeault believes harmful subsidies will be 'main battleground in the coming years'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/01/biodiversity-cop17-leading-negotiator-steven-guilbeault-believes-harmful-subsidies-will-be-main-battleground-in-the-coming-years_6768841_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-01T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O negociador-chefe anterior do Canadá para biodiversidade, Steven Guilbeault, expressou uma avaliação positiva sobre a conferência sobre biodiversidade que terminou em 31 de outubro na Armênia. Ele acredita que as subsídios prejudiciais serão o principal campo de batalha nos anos vindouros.", "titulo_pt": "COP17 de biodiversidade: Steven Guilbeault acredita que os subsídios prejudiciais serão o principal campo de batalha nos anos vindouros", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 238964, "titulo": "Vídeo: barcaça com mil toneladas de minério afunda em rio no Pantanal de MS", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/ms/video-barcaca-com-mil-toneladas-de-minerio-afunda-em-rio-no-pantanal-de-ms/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Marinha está investigando o acidente que ocorreu no sábado (31) no rio Paraguai, onde uma barcaça com mil toneladas de minério afundou. O Ibama relatou um vazamento do material na água e está apurando as possíveis consequências ambientais.", "titulo_pt": "Vídeo: barcaça com mil toneladas de minério afunda em rio no Pantanal de MS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239157, "titulo": "Northern Territory water plan condemned as ‘blatant and shameless’ attack on nature", "url": "https://www.theguardian.com/australia-news/2026/nov/02/northern-territory-water-plan-condemned-as-blatant-and-shameless-attack-on-nature", "fonte_id": "guardian_world", "data_pub": "2026-11-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Território do Norte está planejando eliminar uma exigência legal que determina a reserva de água para a natureza, o que é visto por grupos ambientais como uma 'ataque escancarado e sem vergonha' ao meio ambiente. Isso seria a última medida de uma série de ataques ambientais por parte do governo do Partido Liberal do País.", "titulo_pt": "Plano de água do território do norte é acusado de 'ataque escancarado e sem vergonha' ao meio ambiente", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 238354, "titulo": "Desastres climáticos podem cair no Enem e vestibulares? Veja dicas", "url": "https://www.cnnbrasil.com.br/educacao/desastres-climaticos-podem-cair-no-enem-e-vestibulares-veja-dicas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Questões relacionadas a desastres climáticos podem ser abordadas em diversos assuntos do Enem e vestibulares devido à sua relevância atual. O tema ambiental tem sido frequentemente incorporado em provas devido às suas implicações para grandes populações.", "titulo_pt": "Desastres climáticos podem surgir no Enem e vestibulares? Confira dicas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238717, "titulo": "Hate paper straws? Asia’s new alternatives are another eco trap", "url": "https://www.scmp.com/week-asia/health-environment/article/3372751/hate-paper-straws-asias-new-alternatives-are-another-eco-trap", "fonte_id": "scmp", "data_pub": "2026-11-01T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para a flight attendant Chloe Tan Zi Ling, de 35 anos, os palitos de papel são impráticos porque se desidratam antes de terminar a bebida. Ela prefere alternativas metálicas reutilizáveis, mas acha que deixam um sabor desagradável. Essa frustração reflete um debate mais amplo sobre a transição asiática para palitos de papel e alternativas, com um estudo sul-coreano recente indicando que os palitos de plástico convencionais se saem melhor que os de papel e outras opções.", "titulo_pt": "Detestando palitos de papel? Alternativas asiáticas podem ser outro engodo ecológico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 238480, "titulo": "Presidente de Bolivia decreta emergencia nacional por el fenómeno climático de El Niño", "url": "https://www.latercera.com/mundo/noticia/presidente-de-bolivia-decreta-emergencia-nacional-por-el-fenomeno-climatico-de-el-nino/", "
