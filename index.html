<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "23/08/2026 07:18", "stats": {"noticias_novas": 519, "resumos_gerados": 198}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O primeiro debate presidencial da eleição de 2026 acontecerá neste domingo (23) às 20h, com a possibilidade de ausência de Lula e Flávio Bolsonaro. Os demais candidatos convidados pelo Grupo Bandeirantes podem explorar essa situação durante o evento. O governo Lula planeja incluir 266 mil famílias no programa de reforma agrária até o fim do mandato. O Partido Liberal receberá R$881 milhões e o PT, R$615 milhões, das liberações de R$2,3 bilhões do fundo eleitoral. O filho mais velho de Bolsonaro, Flávio, anunciou que retornará à Festa do Peão de Barretos em 2027, desta vez como presidente, ao lado do pai Jair Bolsonaro, que está em prisão domiciliar. Além disso, o filho do presidente Lula, Lulinha, está sendo investigado, enquanto o ex-assessor de Lula estava ajudando um lobista em solicitações de reuniões com membros do governo.", "mundo": "O Canadá suspendeu as negociações comerciais com os Estados Unidos, o que levou o presidente Donald Trump a aplicar tarifas de 50% em diversos produtos canadenses, como botes de salva-vidas e capas. Em resposta, o Canadá anunciou que iria retaliar 'dólar por dólar'. Diante dessas tensões comerciais, o presidente da Ucrânia, Volodymyr Zelensky, afirmou que realizar eleições durante a guerra contra a Rússia seria perigoso e poderia dividir o país. O presidente do Irã, Masoud Pezeshkian, declarou que seu país enfrenta vários problemas, como inflação e desemprego, devido às sanções americanas. As tensões entre Irã e Estados Unidos continuam a aumentar, com Teerã ameaçando considerar como inimigos quaisquer países que aderirem às sanções americanas.\n\nIsrael realizou um ataque aéreo perto do acampamento de refugiados Maghazi em Gaza, resultando em uma morte e duas pessoas feridas. Em outro evento, o ex-presidente colombiano Juan Manuel Santos criticou a restauração das relações com Israel, afirmando que isso equivale a aprovar o genocídio de Gaza. O Irã ameaçou atacar interesses de países vizinhos que apoiam a ofensiva econômica dos Estados Unidos. Por sua vez, o Canadá planeja impor tarifas a partir de 8 de setembro sobre importações de aço dos EUA, eletrônicos e outros produtos. Além disso, o presidente dos Estados Unidos, Donald Trump, está apostando em novas sanções, um bloqueio naval e pressão econômica maior contra os parceiros comerciais do Irã para forçar Teerã a aceitar um acordo em suas condições, o que pode levar a uma possível reação do Corpo de Guardas Revolucionários Islâmicos do Irã, que controla o Estreito de Ormuz e enviou drones de ataque pelo Golfo.", "economia": "A economia global enfrenta diversos desafios e oportunidades, conforme destacado nos artigos. O Banco da Coreia está comprando ouro novamente após uma pausa de mais de uma década, enquanto o Banco Central da Coreia do Sul espera aumentar sua estimativa de crescimento econômico para mais de 3% em 2026. No Brasil, a economia também enfrenta desafios, como a profunda desconfiança dos funcionários da Boeing em relação aos líderes da empresa, além de perdas projetadas por empresas do Ibovespa devido aos efeitos do El Niño. Ainda, a economia brasileira vê a retomada de discussões sobre a reforma tributária, que promete trazer mudanças significativas para as empresas. Além disso, o setor de turismo enfrenta contrastes, com companhias aéreas vendendo mais passagens, mas com lucros diminuídos, enquanto os hotéis mantêm seus resultados estáveis. Ainda, a economia brasileira também registra um movimento de capital estrangeiro, que entrou no país nos primeiros meses do ano, mas agora está voltando para fora.", "tecnologia": "Um robô humanoide chinês quebrou o recorde mundial dos 100 metros, correndo em 9,39 segundos, superando Usain Bolt. Este feito aconteceu durante o World Humanoid Robot Games, um evento que reúne competições inspiradas em esportes e testes de robôs em situações cruciais. Paralelamente, a Alibaba anunciou uma oferta de ações no valor de US$10,2 bilhões, com o objetivo de investir em inteligência artificial, refletindo a crescente importância desta tecnologia na China. Além disso, uma startup brasileira desenvolveu um sistema que permite a navegação autônoma e controle remoto de embarcações sem tripulação, com operação a até 300 km de distância, demonstrando avanços significativos na tecnologia marítima sem tripulação.", "ciencia": "A descoberta de um dos mistérios da formação da Via Láctea pela equipe do Telescópio Hubble é um dos principais avanços científicos mencionados. A NASA está prestes a lançar o Telescópio Espacial Nancy Grace Roman, que tem um espelho primário originalmente desenvolvido para satélites de monitoramento terrestre. Em outro avanço, pesquisadores descobriram que tubarões da Groenlândia podem viver até 400 anos sem sofrer deterioração retiniana. Estudos sobre a curva de crescimento de buracos negros e a resiliência de estrelas próximas a eles também foram realizados. A Europa registrou mais de 30.000 mortes excessivas devido a ondas de calor, com a atividade sísmica global aumentando em vários locais. A Coreia do Sul investiu pesadamente em pesquisa e desenvolvimento, com as principais farmacêuticas do país gastando mais de 100 bilhões de won cada uma. Além disso, a descoberta de um colar humano de mais de 6.500 anos na Sérvia e a previsão de um eclipse lunar quase total também chamam a atenção para os eventos científicos recentes.", "cultura": "O evento mais importante dos artigos é a coroação do filme 'Nosso Segredo' no Festival de Gramado. O filme ganhou o Kikito na categoria de melhor longa-metragem de ficção e também foi premiado nas categorias de fotografia e direção de arte. O festival encerrou no sábado, destacando-se como um momento de celebração da cinematografia local e internacional. Outro destaque cultural foi a cantora Carminho, conhecida por seu trabalho com o fado português, que está em turnê mundial e fará dois shows em São Paulo. A artista promove seu sétimo álbum, 'Eu Vou Morrer de Amor ou Resistir', levando seu talento musical para o público brasileiro. Na área dos esportes, Riku Miura e Ryuichi Kihara, campeões olímpicos de patinação artística em duplas nos Jogos Olímpicos de Inverno de Milão-Cortina, anunciaram seu compromisso. Os dois venceram a competição de forma dramática, reagindo do quinto lugar após o programa curto para conquistar a medalha de ouro. Além disso, a cultura do 'eu mereço' está influenciando a forma como os brasileiros gastam dinheiro, especialmente em busca de conforto e alívio após um período de trabalho intenso. Isso está mudando a maneira como os consumidores controlam seus gastos, refletindo uma nova abordagem ao consumo.", "sociedade": "Um adolescente indonésio, vestido como Superman, ajudou a combater incêndios florestais na ilha de Borneu, enfrentando grandes focos de fogo que causaram uma névoa densa na região. Em contraste, uma série de crises sociais e políticas afetam o ensino superior americano, com cerca de 55 instituições fechando devido a problemas financeiros e descrença. No Brasil, o governo e o partido de governo discutiram políticas habitacionais em uma reunião de alto nível, enquanto casos de violência e crime, incluindo o linchamento de um ciclista em Copacabana, Rio de Janeiro, e o assassinato de uma jovem de 17 anos em uma escola sueca, levantam preocupações sobre a segurança pública e a violência. Além disso, a falta de mulheres na China tem levado homens a caírem em golpes de falsas noivas, refletindo uma crise demográfica prolongada no país, e um jovem de 19 anos assumiu a responsabilidade de gerir a sanduícheira familiar em Chicago após o pai ser deportado pelo ICE para o Paquistão.", "meio_ambiente": "A China está considerando sediar as negociações climáticas da ONU em 2028, mas ainda não tomou uma decisão oficial. Em outro desenvolvimento, a Organização Não-Governamental Habitat para a Humanidade Brasil alerta para os riscos do fenômeno 'Super El Niño', que pode aumentar eventos como enchentes, deslizamentos de terra e queimadas no Brasil. Além disso, mais de 16.000 doses da vacina Ervebo chegaram à República Democrática do Congo para combater a expansão do vírus Ebola em Kinshasa. Por outro lado, municípios sul-coreanos estão introduzindo um tipo de 'seguro climático' para compensar os custos de saúde e financeiros decorrentes do clima extremo. Busan, por exemplo, planeja alterar uma de suas leis locais para criar um sistema de apoio administrativo e financeiro através do seguro climático.", "direitos_humanos": "Um ativista dos direitos das pessoas com deficiência na Coreia do Sul foi absolvido após um tribunal de apelação determinar que o mandado de dispersão policial era ilegal. Isso permitiu que ele agisse em legítima defesa durante uma manifestação. Este caso destaca a importância de garantir que as empresas tenham obrigações legais claras para informar sobre desfechos de casos de assédio no trabalho, como relatado em um artigo sobre a Coreia do Sul. Além disso, trabalhadores indonésios acusam empregadores de práticas abusivas, como trabalho forçado e redução de salários, em operações de empregos temporários. Isso levanta questões sobre violações de direitos trabalhistas e as condições precárias em que os trabalhadores estão sendo empregados. Em relação à Coreia do Sul, trabalhadores locais também enfrentam desafios, especialmente em empresas que não têm obrigações claras de informar sobre casos de assédio no trabalho. Isso pode levar a um ambiente de trabalho hostil e prejudicial. Essas violações de direitos humanos têm impactos negativos tanto na sociedade em geral quanto na economia, pois podem levar a uma diminuição na produtividade e na qualidade de vida dos trabalhadores. Portanto, é crucial garantir que todos os trabalhadores, independentemente de sua nacionalidade, tenham seus direitos protegidos e respeitados."}, "resumo_do_dia": {"politica_nacional": [{"id": 118813, "titulo": "Sem Lula e Flávio Bolsonaro, os debates ainda importam? O que dizem os especialistas", "url": "https://www.bbc.com/portuguese/articles/c8jnwr9d4vdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-23T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação incerta dos candidatos Luiz Inácio Lula da Silva e Flávio Bolsonaro nos debates eleitorais marcaria um momento inédito desde a redemocratização do país.", "titulo_pt": "Sem Lula e Flávio Bolsonaro, os debates ainda importam?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 118711, "titulo": "Governo Lula diz que chegará a 266 mil famílias incluídas na reforma agrária até o fim do mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/governo-lula-diz-que-chegara-a-266-mil-familias-incluidas-na-reforma-agraria-ate-o-fim-do-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula planeja incluir 266 mil famílias no programa de reforma agrária até o fim do mandato. Este número representa o objetivo final do terceiro mandato do presidente.", "titulo_pt": "Governo Lula prevê incluir 266 mil famílias na reforma agrária até o fim do mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 118733, "titulo": "Planalto pressiona, mas senadores admitem votação da 6x1 após eleição", "url": "https://www.metropoles.com/colunas/milena-teixeira/planalto-pressiona-mas-senadores-admitem-votacao-da-6x1-apos-eleicao", "fonte_id": "metropoles", "data_pub": "2026-08-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças do governo no Senado consideram que a Proposta de Emenda à Constituição (PEC) que estabelece o fim do voto 6x1 pode ser adiada após as eleições, apesar da pressão do Palácio do Planalto. Senadores admitem a possibilidade de votação da PEC após o pleito.", "titulo_pt": "Planalto pressiona, mas senadores admitem votação da 6x1 após eleição", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118736, "titulo": "Dois meses após início, Move Motoristas alcançou 11% do total previsto", "url": "https://www.metropoles.com/brasil/dois-meses-apos-inicio-move-motoristas-alcancou-11-do-total-previsto", "fonte_id": "metropoles", "data_pub": "2026-08-23T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Move Motoristas, que teve início há dois meses, já aprovou R$ 3,55 bilhões em crédito para a renovação de frota, representando 11% do total previsto de R$ 30 bilhões. No entanto, o ritmo de aprovação ainda está abaixo do esperado.", "titulo_pt": "Dois meses após início, Move Motoristas alcançou 11% do total previsto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118738, "titulo": "Dois filhos (Lulinha e Flávio Bolsonaro), dois pesos e duas medidas", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/dois-filhos-lulinha-e-flavio-bolsonaro-dois-pesos-e-duas-medidas", "fonte_id": "metropoles", "data_pub": "2026-08-23T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um dos filhos de Bolsonaro, Lulinha, está sendo alvo de investigações, enquanto o outro, Flávio, não comentou sobre uma fortuna recebida de um banqueiro preso.", "titulo_pt": "Dois filhos, dois pesos e duas medidas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118739, "titulo": "MP cobra R$ 21 milhões de candidato a vice-governador em RR", "url": "https://www.metropoles.com/colunas/andreza-matais/ministerio-publico-candidato-governador-roraima-terreno-desapropriacao", "fonte_id": "metropoles", "data_pub": "2026-08-23T07:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público (MP) de Roraima está cobrando R$ 21 milhões de um candidato a vice-governador, Arthur Henrique (PL), por desapropriação irregular realizada pela Prefeitura de Boa Vista quando Henrique era prefeito.", "titulo_pt": "MP cobra R$ 21 milhões de candidato a vice-governador em roraima", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118740, "titulo": "Irregularidades em adesivos eleitorais é a 3ª mais denunciada no DF", "url": "https://www.metropoles.com/distrito-federal/irregularidades-em-adesivos-eleitorais-e-a-3a-mais-denunciada-no-df", "fonte_id": "metropoles", "data_pub": "2026-08-23T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral recebeu 12 denúncias sobre irregularidades em adesivos eleitorais em apenas seis dias de campanha no Distrito Federal.", "titulo_pt": "Irregularidades em adesivos eleitorais é a terceira denúncia mais frequentes no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118775, "titulo": "Após liberação de R$2,3 bilhões, PL terá maior fatia do fundo eleitoral", "url": "https://www.cnnbrasil.com.br/eleicoes/apos-liberacao-de-r23-bilhoes-pl-tera-maior-fatia-do-fundo-eleitoral/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-23T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Liberal receberá R$881 milhões e o PT, R$615 milhões, das liberações de R$2,3 bilhões do fundo eleitoral. Os valores serão distribuídos aos partidos até 30 de agosto.", "titulo_pt": "PL terá maior fatia do fundo eleitoral após liberação de R$2,3 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118741, "titulo": "Rumble descarta resposta à AGU e espera decisão sobre Moraes nos EUA", "url": "https://www.metropoles.com/colunas/manoela-alcantara/rumble-descarta-resposta-a-agu-e-espera-decisao-sobre-moraes-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-08-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral da União (AGU) apresentou uma nova manifestação e reiterou o pedido para encerrar o processo na Justiça da Flórida. A empresa Rumble continua aguardando uma decisão sobre a questão no tribunal dos Estados Unidos.", "titulo_pt": "Rumble ignora resposta da AGU e aguarda decisão de Moraes nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118742, "titulo": "Band promove 1º debate presidencial neste domingo. Veja quem participa", "url": "https://www.metropoles.com/sao-paulo/band-promove-1o-debate-presidencial-neste-domingo-veja-quem-participa", "fonte_id": "metropoles", "data_pub": "2026-08-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro debate presidencial está previsto para ocorrer neste domingo. Os participantes confirmados são Caiado, Zema e Renan Santos, enquanto Lula e Flávio estão entre os ausentes. Marçal foi impedido pelo TSE.", "titulo_pt": "Band promove 1º debate presidencial neste domingo. Veja quem participa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118778, "titulo": "Lulinha vira munição do PL enquanto PT contra-ataca com Dark Horse", "url": "https://www.cnnbrasil.com.br/eleicoes/lulinha-vira-municao-do-pl-enquanto-pt-contra-ataca-com-dark-horse/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A oposição quer instalar uma comissão de inquérito sobre o filho do presidente Lula, enquanto os governistas pedem investigação sobre recursos que financiaram a cinebiografia de Jair Bolsonaro.", "titulo_pt": "Lulinha se torna alvo enquanto PT contra-ataca com cinebiografia de bolsonaro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118780, "titulo": "Ex-assessor de Lula recebia demandas e atualizava lobista sobre agendas", "url": "https://www.cnnbrasil.com.br/politica/ex-assessor-de-lula-recebia-demandas-e-atualizava-lobista-sobre-agendas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-assessor de Lula estava auxiliando um lobista em solicitações de reuniões com membros do governo, prometendo um pagamento de 100 mil euros e pagando contas de Marcola. A defesa argumenta que os valores referem-se a um empréstimo pessoal.", "titulo_pt": "Ex-assessor de Lula ajudava lobista a agendar reuniões com governo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118744, "titulo": "Eleições 2026: mais de 6.900 candidatos não declararam bens", "url": "https://www.metropoles.com/brasil/eleicoes-2026-mais-de-6-900-candidatos-nao-declararam-bens", "fonte_id": "metropoles", "data_pub": "2026-08-23T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 6.900 candidatos em eleições de 2026 não declararam seus bens. Outros 19 elegíveis informaram à Justiça Eleitoral que possuem menos de R$ 10,00 em bens.", "titulo_pt": "Eleições 2026: mais de 6.900 candidatos não declararam bens", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118745, "titulo": "\"Bilionários por engano\": saiba quem são os candidatos que erraram registro", "url": "https://www.metropoles.com/brasil/bilionarios-por-engano-saiba-quem-sao-os-candidatos-que-erraram-registro", "fonte_id": "metropoles", "data_pub": "2026-08-23T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos a cargos eletivos registraram declarações de bens incorretas ao Tribunal Superior Eleitoral (TSE), incluindo carros populares avaliados em valores muito superiores ao real. Esses erros podem ter sido causados por engano ou mal-intencionados, mas a informação precisa ainda não foi confirmada pela fonte.", "titulo_pt": "Bilionários por engano: saiba quem são os candidatos que erraram o registro de bens", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118746, "titulo": "Justiça manda suspender plataformas da Pixbet em ação de Padre Júlio", "url": "https://www.metropoles.com/colunas/ramiro-brites/justica-pixbet-padre-julio", "fonte_id": "metropoles", "data_pub": "2026-08-23T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desembargador do Tribunal de Justiça da Paraíba ordenou a suspensão das operações da Pixbet em uma ação movida pelo Padre Júlio Lancellotti e mais duas entidades.", "titulo_pt": "Justiça suspende operações da Pixbet em ação do Padre Júlio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118747, "titulo": "Veja a agenda dos candidatos ao governo de SP neste domingo (23/8)", "url": "https://www.metropoles.com/sao-paulo/veja-a-agenda-dos-candidatos-ao-governo-de-sp-neste-domingo-23-8", "fonte_id": "metropoles", "data_pub": "2026-08-23T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haddad encerra sua agenda com gravação de programas partidários, enquanto Tarcísio se dedica apenas ao lançamento de campanha de uma aliada.", "titulo_pt": "Confira a agenda dos candidatos ao governo de SP neste domingo (23/8)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 118913, "titulo": "U.S.-Canada Trade War: What to Know About Tariffs and the Negotiations", "url": "https://www.nytimes.com/2026/08/23/world/canada/canada-us-trade-war-trump-carney.html", "fonte_id": "nyt_world", "data_pub": "2026-08-23T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Canadá suspendeu as negociações comerciais, o que levou o presidente Trump a aplicar tarifas de 50% em uma variedade de produtos canadenses. Mark Carney declarou que o Canadá iria retaliar 'dólar por dólar'.", "titulo_pt": "Guerra comercial eua-canadá: o que saber sobre tarifas e negociações", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 119015, "titulo": "Hundreds of Gaza children join a mass swimming lesson to cope with trauma", "url": "https://www.france24.com/en/hundreds-of-gaza-children-join-a-mass-swimming-lesson-to-cope-with-trauma", "fonte_id": "france24", "data_pub": "2026-08-23T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Gaza, uma organização não-governamental lançou um projeto em Khan Younis, onde centenas de crianças se juntaram em uma aula de natação massiva para ajudá-las a lidar com o trauma da guerra. O evento tem potencial para estabelecer um recorde mundial.", "titulo_pt": "Centenas de crianças de Gaza participam de aula de natação para lidar com trauma da guerra", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 119016, "titulo": "Venezuela: Two months after the quake, 12,500 people still live in temporary camps", "url": "https://www.france24.com/en/venezuela-two-months-after-the-quake-12-500-people-still-live-in-temporary-camps", "fonte_id": "france24", "data_pub": "2026-08-23T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois meses após dois terremotos atingirem Venezuela, mais de 12.500 pessoas ainda estão vivendo em acampamentos temporários em La Guaira. Muitos sobreviventes enfrentam dificuldades para superar a perda de entes queridos e suas casas, adaptando-se a condições precárias de vida, expostas ao clima, com acesso limitado a cuidados médicos e assistência humanitária.", "titulo_pt": "Venezuela: dois meses após os terremotos, mais de 12.500 pessoas continuam em acampamentos temporários", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 118693, "titulo": "Zelenski diz que eleições durante guerra iriam 'dividir a Ucrânia'", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/zelenski-diz-que-eleicoes-durante-guerra-iriam-dividir-a-ucrania.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-23T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da Ucrânia, Volodimir Zelenski, afirmou que realizar eleições durante a guerra contra a Rússia seria perigoso e poderia dividir o país. As declarações foram feitas durante uma reunião com jornalistas no sábado (22).", "titulo_pt": "Zelenski afirma que eleições durante guerra dividiriam Ucrânia", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 118911, "titulo": "What Canadian Goods Will Take Trump’s 50% Tariffs? Some Pretty Strange Items.", "url": "https://www.nytimes.com/2026/08/23/world/canada/canadian-goods-trump-tariffs-items-list.html", "fonte_id": "nyt_world", "data_pub": "2026-08-23T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Botes de salva-vidas, coleiras para cães, capas, bandeiras nacionais e pequenas estátuas metálicas canadenses agora são mais caras para os compradores americanos devido às tarifas de 50% impostas pelo presidente dos Estados Unidos, Donald Trump.", "titulo_pt": "Quais bens canadenses sofrerão com tarifas de 50% de Trump? Algumas coisas estranhas estão na lista.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 119017, "titulo": "Why Saudi Arabia is spending billions to become a global Esports power?", "url": "https://www.france24.com/en/why-saudi-arabia-is-spending-billions-to-become-a-global-esports-power", "fonte_id": "france24", "data_pub": "2026-08-23T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita está investindo bilhões no setor global de jogos eletrônicos. O país adquiriu a Electronic Arts por 55 bilhões de dólares e está sediando pela primeira vez o Campeonato Mundial de Esports em Paris, como parte de esforços para diversificar sua economia, que historicamente depende do petróleo e do gás.", "titulo_pt": "Por que a arábia saudita está investindo bilhões para se tornar uma potência global em Esports?", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 119053, "titulo": "Israeli air strike near Gaza refugee camp kills one person and injures two", "url": "https://www.aljazeera.com/news/2026/8/23/israeli-air-strike-near-gaza-refugee-camp-kills-one-person-and-injures-two?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-23T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque aéreo israelense próximo ao acampamento de refugiados Maghazi em Gaza resultou em uma morte e duas pessoas feridas.", "titulo_pt": "Ataque aéreo israelense perto do acampamento de refugiados em Gaza mata uma pessoa e feri duas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 119006, "titulo": "Zelensky has 'questions to answer' about corruption in his government, sacked minister tells BBC", "url": "https://www.bbc.co.uk/news/articles/cwy4ypzvd7po?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-23T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro da Defesa demitido acusa o governo de Zelensky de corrupção e propõe que eleresos sejam realizados no país.", "titulo_pt": "Ex-ministro da defesa acusa zelensky de corrupção e sugere eleições", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 119018, "titulo": "Middle East live: Iran's president says country facing 'many problems' as US sanctions loom", "url": "https://www.france24.com/en/middle-east/20260823-middle-east-live-iran-s-president-says-country-facing-many-problems-as-us-sanctions-loom", "fonte_id": "france24", "data_pub": "2026-08-23T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Irã, Masoud Pezeshkian, afirmou que o país enfrenta vários problemas, como inflação, desemprego e questões de subsistência. Suas declarações vieram após os Estados Unidos se comprometerem a desestabilizar o regime iraniano através de novas sanções.", "titulo_pt": "Irã enfrenta múltiplos problemas enquanto EUA ameaçam novas sanções", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 119031, "titulo": "Is the US seeing a turning point in obesity rates?", "url": "https://www.dw.com/en/is-the-us-seeing-a-turning-point-in-obesity-rates/a-78436782?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-23T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As taxas de obesidade nos EUA estavam aumentando por anos, mas agora há sinais de que isso pode estar mudando. O uso de medicamentos para perda de peso, como Ozempic e Wegovy, aumentou rapidamente.", "titulo_pt": "Está ocorrendo um ponto de virada nas taxas de obesidade nos EUA?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 118910, "titulo": "Four Years Ago, a Crypto Boss Went Missing. Now His Successor Has.", "url": "https://www.nytimes.com/2026/08/23/world/europe/poland-estonia-cryptocurrency.html", "fonte_id": "nyt_world", "data_pub": "2026-08-23T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colapso misterioso de uma exchange de criptomoedas europeia explica por que o setor ainda não conseguiu se livrar da reputação de atrair criminosos.", "titulo_pt": "Quatro anos atrás, um líder de criptomoedas desapareceu. Agora seu sucessor tem.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 119032, "titulo": "What is the 'political firewall' against Germany's far-right AfD?", "url": "https://www.dw.com/en/what-is-the-political-firewall-against-germany-s-far-right-afd/a-78431554?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-23T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As principais partidos centristas da Alemanha rejeitam qualquer cooperação com o Alternative for Germany (AfD), que é considerado extremista de direita em algumas de suas partes. No entanto, essa política está enfrentando crescente pressão.", "titulo_pt": "O que é a 'barreira política' contra o extremismo de direita AfD na Alemanha?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 119055, "titulo": "Where water conflicts pose the biggest threat in 2026", "url": "https://www.aljazeera.com/news/2026/8/23/where-water-conflicts-pose-the-biggest-threat-in-2026?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-23T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de conflitos relacionados à água aumentou quase quatro vezes desde 2020. Al Jazeera descreve os dados durante a World Water Week de 2026.", "titulo_pt": "Onde os conflitos relacionados à água representam a maior ameaça em 2026", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 119019, "titulo": "Ukraine: Zelensky asks for more Patriot interceptors as civilian deaths hit highest level since 2022", "url": "https://www.france24.com/en/ukraine-zelensky-asks-for-more-patriot-interceptors-as-civilian-deaths-hit-highest-level-since-2022", "fonte_id": "france24", "data_pub": "2026-08-23T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Ucrânia, Zelensky, pede mais interceptores Patriot em meio a um aumento significativo de mortes civis, com pelo menos 16 mortos em um ataque a um centro comercial em sua cidade natal. O pedido reflete a urgência de Zelensky em obter esses equipamentos à medida que se aproxima o inverno.", "titulo_pt": "Ucrânia: zelensky solicita mais interceptores Patriot em meio a altos níveis de mortes civis", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 119020, "titulo": "South Korea tests Arctic route with a first container shipped to Europe", "url": "https://www.france24.com/en/south-korea-tests-arctic-route-with-a-first-container-shipped-to-europe", "fonte_id": "france24", "data_pub": "2026-08-23T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea testou uma rota no Ártico enviando seu primeiro navio-container para a Europa, evitando o bloqueio de tráfego no Oriente Médio. Este caminho alternativo pode acelerar ainda mais o derretimento da geleada polar.", "titulo_pt": "Coreia do sul testa rota no ártico com primeiro navio-container para Europa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 119021, "titulo": "US-Canada trade dispute escalates after Carney announces retaliatory tariffs", "url": "https://www.france24.com/en/us-canada-trade-dispute-escalates-after-carney-announces-retaliatory-tariffs", "fonte_id": "france24", "data_pub": "2026-08-23T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A negociação de um acordo comercial entre Canadá e Estados Unidos estava próxima de ser concluída, mas as negociações se desintegram com ambas as partes acusando-se de mudanças de última hora nas condições. O primeiro-ministro do Canadá, Mark Carney, anunciou tarifas retaliatórias contra os EUA após este último impor uma tarifa de 50% sobre 20 bilhões de dólares em bens canadenses.", "titulo_pt": "Disputa comercial entre EUA e canadá se agrava após Carney anunciar tarifas retaliatórias", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 118793, "titulo": "Dólar, passagens e IOF: como se preparar para viajar ao exterior no fim de 2026", "url": "https://www.infomoney.com.br/minhas-financas/dolar-passagens-e-iof-como-se-preparar-para-viajar-ao-exterior-no-fim-de-2026/", "fonte_id": "infomoney", "data_pub": "2026-08-23T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A orientação para viajantes é evitar tentar prever o melhor momento para comprar dólares. O texto original sugere que os viajantes devem se preparar para viajar no exterior no final de 2026, considerando fatores como câmbio, passagens e IOF.", "titulo_pt": "Dólar, passagens e IOF: como se preparar para viajar ao exterior no fim de 2026", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118759, "titulo": "Existe alimento proibido para crianças? Especialistas e Dr. Kalil explicam", "url": "https://www.cnnbrasil.com.br/saude/existe-alimento-proibido-para-criancas-especialistas-e-dr-kalil-explicam/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nutricionistas e endocrinologistas discutem obesidade infantil, alertando para o consumo excessivo de refrigerantes, sucos industrializados e salgadinhos.", "titulo_pt": "Existe alimento proibido para crianças? Especialistas e Dr. Kalil explicam", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 119123, "titulo": "People’s Daily defends China’s economic resilience, says annual targets will be met", "url": "https://www.scmp.com/news/article/3364968/peoples-daily-defends-chinas-economic-resilience-says-annual-targets-will-be-met?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jornal oficial do Partido Comunista Chinês defendeu a resiliência da economia chinesa, a segunda mais grande do mundo, afirmando que os riscos internos estão sob controle e que a China continua a fornecer maior estabilidade à economia global. Os comentários foram publicados em seguida de dados fracos de demanda interna e desequilíbrios persistentes que pesaram sobre o crescimento do segundo trimestre.", "titulo_pt": "People's Daily defende a resiliência da economia chinesa e seus objetivos anuais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 118970, "titulo": "O conceito de devedor contumaz na LC 225: problema ou solução?", "url": "https://www.jota.info/opiniao-e-analise/colunas/pauta-fiscal/o-conceito-de-devedor-contumaz-na-lc-225-problema-ou-solucao", "fonte_id": "jota", "data_pub": "2026-08-23T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca que a nova lei pode ser excessivamente objetiva, o que dificulta a identificação do verdadeiro objetivo pretendido. Isso sugere que a lei pode não resolver efetivamente o problema pretendido.", "titulo_pt": "O conceito de devedor contumaz na LC 225: problema ou solução?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 118971, "titulo": "STJ está ficando mais distante e seus precedentes mais próximos das empresas", "url": "https://www.jota.info/opiniao-e-analise/artigos/stj-esta-ficando-mais-distante-e-seus-precedentes-mais-proximos-das-empresas", "fonte_id": "jota", "data_pub": "2026-08-23T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas precisam adotar uma nova estratégia para gerenciar suas demandas judiciais e participar na formação de precedentes, devido ao STJ se distanciando e seus precedentes se tornando mais relevantes. Isso implica em ajustes no filtro de relevância e mudanças nos regulamentos.", "titulo_pt": "STJ está se distanciando e seus precedentes se tornando mais relevantes para as empresas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 118795, "titulo": "Por que os postos quebram 22 vezes mais que o varejo — mas quase nunca fecham?", "url": "https://www.infomoney.com.br/business/por-que-postos-quebram-22-vezes-mais-que-o-varejo-mas-quase-nunca-fecham/", "fonte_id": "infomoney", "data_pub": "2026-08-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo indica que, até junho, havia 182 postos em recuperação, um aumento de 31,9% em comparação com o mesmo período do ano anterior. Os postos de combustíveis quebram 22 vezes mais frequentemente que o varejo, mas quase nunca fecham.", "titulo_pt": "Por que os postos quebram 22 vezes mais que o varejo — mas quase nunca fecham?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118796, "titulo": "Sem Lula e Flávio, candidatos tentam furar polarização no 1º debate presidencial", "url": "https://www.infomoney.com.br/politica/sem-lula-flavio-candidatos-tentam-furar-polarizacao-debate-presidencial/", "fonte_id": "infomoney", "data_pub": "2026-08-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Caiado, Zema, Renan Santos e Augusto Cury terão o primeiro grande debate presidencial sem Lula e Flávio, que lideram as pesquisas de intenção de voto.", "titulo_pt": "Sem Lula e Flávio, candidatos tentam furar polarização no 1º debate presidencial", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118797, "titulo": "Como os “campeonatos de cortes” deixaram Pablo Marçal inelegível até 2032", "url": "https://www.infomoney.com.br/politica/como-os-campeonatos-de-cortes-deixaram-pablo-marcal-inelegivel-ate-2032/", "fonte_id": "infomoney", "data_pub": "2026-08-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pablo Marçal foi condenado na campanha de 2024 por uso de redes sociais e abuso de poder. Como resultado, ele está inelegível até 2032.", "titulo_pt": "Como os 'campeonatos de cortes' deixaram Pablo Marçal inelegível até 2032", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118798, "titulo": "Seis livros para quem quer retomar as rédeas da vida e enfrentar o medo", "url": "https://www.infomoney.com.br/carreira/seis-livros-para-quem-quer-retomar-as-redeas-da-vida-e-enfrentar-o-medo/", "fonte_id": "infomoney", "data_pub": "2026-08-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seleção apresenta seis livros que abordam desafios cotidianos e auxiliam na reflexão sobre como lidar com eles. O post original do InfoMoney lista títulos que podem ajudar quem deseja retomar o controle de sua vida e enfrentar o medo.", "titulo_pt": "Seis livros para quem quer retomar o controle da vida e enfrentar o medo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 119165, "titulo": "Why is BOK buying gold again?", "url": "https://www.koreaherald.com/article/10849098", "fonte_id": "korea_herald", "data_pub": "2026-08-23T06:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco da Coreia está comprando ouro novamente após mais de uma década, aumentando sua exposição a este metal precioso. A instituição está se juntando a outros bancos centrais que diversificam seus reservas internacionais de moeda estrangeira.", "titulo_pt": "Por que o BOK está comprando ouro novamente?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 119129, "titulo": "South Koreans ‘intoxicated by stocks’ swarmed market frenzy – and lost everything", "url": "https://www.scmp.com/news/asia/east-asia/article/3364962/south-koreans-intoxicated-stocks-swarmed-market-frenzy-and-lost-everything?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-23T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice Kospi da Coreia do Sul caiu 30% desde seu pico em junho, levando a uma perda significativa de investidores e criando um trauma para o governo presidido por Lee Jae Myung. A expectativa era que a liberalização regulatória estimulasse investimentos mais arriscados, mas o resultado foi uma desilusão para os investidores minoritários.", "titulo_pt": "Coreanos 'eufóricos com ações' se lançaram em frenesi de mercado e perderam tudo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 118754, "titulo": "Balanços do segundo trimestre expõem contrastes no setor de turismo", "url": "https://exame.com/exame-in/balancos-do-segundo-trimestre-expoem-contrastes-no-setor-de-turismo/", "fonte_id": "exame", "data_pub": "2026-08-23T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As companhias aéreas venderam mais passagens, mas o lucro diminuiu devido ao aumento do preço do combustível. Os hotéis mantiveram seus resultados estáveis, enquanto as plataformas digitais do setor de turismo registraram crescimento.", "titulo_pt": "Balanços do segundo trimestre mostram contrastes no setor de turismo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 119187, "titulo": "Banks' net income falls in H1; interest profit hits record high: data", "url": "https://en.yna.co.kr/view/AEN20260823001800320", "fonte_id": "yonhap_news", "data_pub": "2026-08-23T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os lucros líquidos dos bancos sul-coreanos diminuíram no primeiro semestre, enquanto os lucros de juros atingiram um novo recorde alto.", "titulo_pt": "Lucros líquidos dos bancos sul-coreanos caem no primeiro semestre; lucros de juros batem recorde", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 119091, "titulo": "US buyers snap up Europe’s asset managers at fastest rate in decades", "url": "https://www.ft.com/content/dd605c6f-8a6e-4664-970b-f4c07ea7a4d2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-23T04:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Compradores americanos estão adquirindo gerentes de ativos europeus a um ritmo nunca visto nas últimas décadas. Empresas de fundos europeus enfrentam dificuldades enquanto buscam aumentar suas escala e expandir suas operações globalmente.", "titulo_pt": "Compradores americanos adquirem gerentes de ativos europeus a ritmo recorde", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 119092, "titulo": "Investors try to "EUA", "classe": "A"}, {"id": 118807, "titulo": "IA já controla embarcações sem tripulação no mar e pode ser operada a 300 km de distância", "url": "https://olhardigital.com.br/2026/08/23/carros-e-tecnologia/ia-ja-controla-embarcacoes-sem-tripulacao-no-mar-e-pode-ser-operada-a-300-km-de-distancia/", "fonte_id": "olhar_digital", "data_pub": "2026-08-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma startup carioca desenvolveu um sistema que permite a navegação autônoma e o controle remoto via satélite de embarcações sem tripulação. O controle pode ser realizado a uma distância de até 300 km.", "titulo_pt": "IA já controla embarcações sem tripulação no mar e pode ser operada a 300 km de distância", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 119152, "titulo": "Is Expensive Bottled Water Actually Better for You?", "url": "https://www.wired.com/story/is-expensive-bottled-water-actually-better-for-you/", "fonte_id": "wired", "data_pub": "2026-08-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luxo em água engarrafada pode conter minerais diferentes e ter um sabor notavelmente diferente. No entanto, uma fonte remota, pH alcalino e alto preço não significam necessariamente melhor hidratação.", "titulo_pt": "Água em embalagens caras não significam melhor para a saúde?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 119090, "titulo": "UK energy companies on alert after ‘Iran-linked hackers’ shut down small power facility", "url": "https://www.ft.com/content/bae67bb7-ebf8-44fc-8d55-bbfaada47eb7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-23T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seguranças do país informaram aos chefes das empresas de energia sobre orientações e passos a seguir após um ataque cibernético. Uma hackersia associada ao Irã teria interrompido um pequeno sistema de energia.", "titulo_pt": "Empresas de energia do reino unido em alerta após hackers associados ao Irã interromperem pequena usina", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 119086, "titulo": "Alibaba announces $10.2bn share placement as Chinese companies expand AI investment", "url": "https://www.ft.com/content/e4ab027e-ed41-48b7-89ac-8250d3054ae6?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-23T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alibaba anunciou uma colocação de ações no valor de $10,2 bilhões. O lançamento segue a recepção positiva para seu último modelo de inteligência artificial, Qwen 3.8-Max.", "titulo_pt": "Alibaba anuncia colocação de ações de $10,2 bilhões após recepção positiva para seu modelo de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 119085, "titulo": "Anthropic’s best AI model struggles to attract users as cheaper tools thrive", "url": "https://www.ft.com/content/5ee49718-c258-4f01-aa32-7e5b76ae5245?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-23T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O melhor modelo de inteligência artificial da Anthropic, chamado Fable 5, tem enfrentado dificuldades para atrair clientes corporativos. Alternativas mais baratas estão se destacando no mercado.", "titulo_pt": "Melhor modelo de IA da anthropic enfrenta baixa procura de clientes corporativos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 119157, "titulo": "Innometry ships first inspection equipment for 46-series batteries", "url": "https://www.koreaherald.com/article/10849123", "fonte_id": "korea_herald", "data_pub": "2026-08-23T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Innometry enviou recentemente equipamentos de inspeção não destrutiva para uma linha de produção em massa de baterias 46-série de uma fabricante de baterias importante. O envio incluiu unidades de inspeção por tomografia e sistemas de raio-X projetados para detectar materiais estranhos dentro das células de baterias.", "titulo_pt": "Innometry envia primeiro equipamento de inspeção para baterias 46-série", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 119127, "titulo": "Major tech firms to help upskill Hong Kong workers under ‘AI for All’: Paul Chan", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3364965/major-tech-firms-help-upskill-hong-kong-workers-under-ai-all-paul-chan?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-23T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Hong Kong irá parceriar com grandes empresas de tecnologia para lançar um programa de treinamento em inteligência artificial para a população trabalhadora em novembro. O programa 'AI for All', com um orçamento de 50 milhões de HKD (6,4 milhões de USD), incluirá mais de 200 atividades e deve beneficiar 50 mil pessoas em dois anos.", "titulo_pt": "Grandes empresas de tecnologia irão auxiliar no aperfeiçoamento profissional dos trabalhadores de Hong Kong através do programa 'AI for All'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 119166, "titulo": "Kakao Talk's message reader was disabled for days, inconveniencing visually impaired users", "url": "https://www.koreaherald.com/article/10849097", "fonte_id": "korea_herald", "data_pub": "2026-08-23T06:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A função de leitura de mensagens em voz alta do KakaoTalk, aplicativo de mensagens mais popular na Coreia do Sul, ficou indisponível por três dias a partir do dia 12 de agosto, causando inconvenientes para usuários com deficiência visual. A empresa Kakao Corp. confirmou que o erro foi corrigido na atualização mais recente do aplicativo.", "titulo_pt": "Leitor de mensagens em voz do kakaotalk ficou indisponível por três dias, afetando usuários com deficiência visual", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 119131, "titulo": "After gaining EV dominance, Chinese carmakers shift goal to take on full-hybrid behemoths", "url": "https://www.scmp.com/business/china-business/article/3364906/after-gaining-ev-dominance-chinese-carmakers-shift-goal-take-full-hybrid-behemoths?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-23T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Caminhoneiras chinesas, que já dominam a tecnologia e a produção de veículos elétricos (VE), estão buscando se estabelecer no mercado de veículos híbridos completos, tradicionalmente dominado por marcas internacionais. Empresas como Geely Auto e Changan Automobile estão registrando vendas impressionantes de veículos híbridos elétricos (VEHs), atraindo consumidores domésticos que antes preferiam modelos como o Toyota Prius.", "titulo_pt": "Após dominarem os ve, fabricantes chineses miram marcas internacionais de veículos híbridos completos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 119103, "titulo": "Robots can outrun humans, but can they plug in a cable?", "url": "https://www.japantimes.co.jp/news/2026/08/23/asia-pacific/science-health/robots-outrun-humans-future/", "fonte_id": "japan_times", "data_pub": "2026-08-23T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O evento World Humanoid Robot Games, que começou em Beijing, durará cinco dias e combina competições inspiradas em esportes com desafios projetados para testar os robôs em situações simuladas cruciais.", "titulo_pt": "Robôs podem correr mais rápido que humanos, mas eles podem conectar cabos?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 119169, "titulo": "Foldables revive Samsung Display’s A7 OLED project", "url": "https://www.koreaherald.com/article/10849083", "fonte_id": "korea_herald", "data_pub": "2026-08-23T05:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Display está retomando a construção de sua fábrica A7 de painéis OLED em Asan, Coreia do Sul, após cinco anos de suspensão, devido à crescente demanda por smartphones dobráveis. A empresa aprovou a construção estrutural do A7 em 7 de agosto e espera iniciar a construção em massa no próximo ano, com a finalização prevista para o início de 2028.", "titulo_pt": "Painéis dobráveis: Samsung Display reativa projeto A7 de painéis OLED", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 119135, "titulo": "Alibaba to issue US$10 billion in new shares for huge AI push amid strong investor demand", "url": "https://www.scmp.com/tech/big-tech/article/3364957/alibaba-issue-hk80-billion-new-shares-global-ai-push?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-23T05:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alibaba Group Holding planeja emitir ações no valor de HK$80 bilhões (US$10,2 bilhões) para investir em inteligência artificial, com o objetivo de reforçar sua liderança global nesse campo. A empresa utilizará os recursos arrecadados para expandir e aprimorar suas capacidades de inteligência artificial.", "titulo_pt": "Alibaba planeja emitir ações de US$10 bilhões para investir em IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 118755, "titulo": "5 hacks infalíveis para destravar o potencial do Claude 3", "url": "https://exame.com/inteligencia-artificial/x-hacks-infaliveis-para-destravar-o-potencial-do-claude-3/", "fonte_id": "exame", "data_pub": "2026-08-23T05:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Comandos mais específicos, exemplos e divisão de tarefas podem melhorar a qualidade das respostas do Claude e ajudar o usuário a aproveitar melhor os recursos do modelo.", "titulo_pt": "5 Dicas infalíveis para liberar o potencial do Claude 3", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 119089, "titulo": "Europe can do better than US-style air conditioning", "url": "https://www.ft.com/content/fe9be519-ceae-4279-83b1-220f9505d6a9", "fonte_id": "financial_times", "data_pub": "2026-08-23T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa pode encontrar uma solução mais inteligente e eficiente para o ar condicionado em comparação com o modelo americano. O texto sugere que não há necessidade de fixar um sistema de ar condicionado tradicional em cada edifício.", "titulo_pt": "Europa pode fazer melhor do que o ar condicionado americano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 119138, "titulo": "Quake-prone Indonesia’s first nuclear power plant plan stokes safety fears", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3364952/quake-prone-indonesias-first-nuclear-power-plant-plan-stokes-safety-fears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-23T03:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia, que depende do carvão, está revivendo planos antigos para construir usinas nucleares, que foram interrompidos após o desastre nuclear de Fukushima no Japão em 2011, com o objetivo de atender aos seus objetivos de decarbonização. No entanto, há preocupações públicas e de especialistas sobre os riscos de um desastre nuclear em um país sismicamente ativo.", "titulo_pt": "Indonésia revive planos de usinas nucleares em pleno temor de desastres sísmicos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 119178, "titulo": "Blowing in the wind, humble balloon gets green makeover", "url": "https://phys.org/news/2026-08-humble-balloon-green-makeover.html", "fonte_id": "phys_org", "data_pub": "2026-08-23T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os balões, símbolos globais de festas e celebrações mas responsáveis por problemas
