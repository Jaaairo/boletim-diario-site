<html lang="pt-BR">
<head>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

a El Salvador, Bukele, busca um terceiro mandato após alterações na constituição, o que levanta preocupações sobre a democracia no país. A Coreia do Sul foi classificada como o primeiro país no ranking global de governo eletrônico da ONU, subindo três posições desde 2024. No entanto, a região do Mar do Sul da China continua sendo um ponto de tensão, com a Indonésia discutindo futuras parcerias marítimas com a China, o que preocupa outros países na região.\n\nEm 19 de novembro de 2026, Xi Jinping, Donald Trump e Vladimir Putin realizaram uma cúpula trilateral em Shenzhen, China, emitindo uma declaração conjunta em favor da paz. Os líderes discutiram consensos sobre a reforma da ONU, o suprimento global de energia, imunidade soberana e redução do risco nuclear. Este encontro, conhecido como 'Yalta 2.0', reforçou o papel de liderança global da China, conforme analistas afirmaram. No mesmo dia, em Kyiv, a Ucrânia, ataques russos danificaram as embaixadas da Áustria e dos Países Baixos, reforçando a tensão na região. Além disso, a China está monitorando atentamente as eleições taiwanesas como uma oportunidade para testar a reação da comunidade internacional e avaliar a posição dos Estados Unidos. Em outro desenvolvimento, o presidente dos Estados Unidos, Donald Trump, nomeou a nova chefe de cybersecurity, Kirsten Davies, para substituir Sean Cairncross, após uma série de interrupções que afetaram o transporte aéreo, o acesso ao banco e as comunicações classificadas nos Estados Unidos.", "economia": "As ações da Anthropic caíram cerca de 6% no pré-mercado, seguindo uma tendência de venda generalizada de ações de empresas de inteligência artificial, como a Nvidia e a AMD. Além disso, o dólar atingiu seu maior valor em mais de dois anos, superando R$ 5,93, em mais uma sessão de alta consecutiva, refletindo as pressões do mercado financeiro. O Conselho Monetário Nacional (CMN) aprovou uma nova regra que obriga bancos e outras instituições financeiras a enviarem dados mensais sobre arrecadação de tributos a partir de 2028, visando fornecer informações mais detalhadas e periódicas sobre os registros fiscais do setor financeiro à autoridade monetária. O Tribunal Regional do Trabalho da 2ª Região aprovou um plano de parcelamento de R$ 139 milhões em execuções trabalhistas do Grupo Pão de Açúcar, e o JPMorgan Chase informou que terceiros que prestam serviços à instituição foram alvo de um ataque cibernético.", "tecnologia": "A Apple realizou um evento importante em sua Academia de Desenvolvedores na Coreia do Sul, exibindo projetos inovadores como robôs de estimação e modelos tridimensionais de fígados humanos, reforçando seu compromisso com o ecossistema de aplicativos. Por outro lado, a Anthropic, uma empresa de inteligência artificial, viu seu IPO não conseguir aliviar as preocupações dos investidores, resultando em uma queda de mais de 5% nas ações de Seul. A TSMC, uma das maiores fabricantes de chips do mundo, comprou uma pequena participação na Anthropic por 500 milhões de dólares, destacando a importância da IA para as empresas tecnológicas. Além disso, a TSMC está endurecendo as restrições sobre a exportação de chips de IA para a China em resposta a novas regulamentações americanas, enquanto a Meta reconsidera seus objetivos climáticos para 2030 devido à crescente necessidade de energia dos centros de dados de IA.", "ciencia": "A ciência avança em diversos campos, com destaque para a descoberta de uma nova forma de câncer de próstata hereditário. Isso permite o desenvolvimento de programas genéticos para identificar famílias em risco e promover a detecção precoce da doença. Um estudo sugere que o uso de purificadores de ar pode beneficiar as pessoas com prediabetes, ajudando a manter os níveis diários de açúcar no sangue mais estáveis. A NASA está preparando a missão BepiColombo, que finalmente entrará em órbita ao redor do planeta Mercúrio após uma viagem de oito anos. Além disso, um novo sistema de inteligência artificial foi criado para auxiliar no ensino de programação, enquanto pesquisas mostram como a malária pode ser afetada pelas mudanças climáticas e como a melatonina, um suplemento liberado no Brasil, pode ser usado para tratar insônia. Esses avanços refletem a diversidade e a importância da pesquisa científica em áreas como saúde, tecnologia e astronomia.", "cultura": "O Dia da Consciência Negra homenageia educadores negros, como Hemetério dos Santos, o primeiro professor negro registrado no Brasil, e Iza, que lançou um novo álbum de reggae. A primeira-dama sul-coreana Kim Hea Kyung espera que o kimchi se torne tão popular quanto o K-pop. O Festival de Escritores de Singapura abordou temas como serial killers e inteligência artificial. O Coletivo Negro apresentou uma versão de 'Pai Contra Mãe', transformando a história em uma narrativa sobre uma mulher negra grávida que foge de um segurança após ser acusada injustamente de roubo. O Samba de Dandara, formado somente por mulheres, usa a música para afirmar sua identidade negra e questionar o machismo. O Festival Nicho, que celebra o cinema negro, ocorre em São Paulo, homenageando Milton Santos, um geógrafo baiano conhecido por suas reflexões sobre território e desigualdade social. O BalletBoyz apresentou 'Six Lethargies', uma produção baseada em música composta por Keaton Henson, que expressa sentimentos de depressão e ansiedade, transformando a música em dança. O grupo de K-pop BTS se tornou o primeiro artista não japonês a atingir mais de 10 bilhões de streams no Japão, reforçando a influência global do K-pop.", "sociedade": "O prazo para pedir reaplicação do Enem 2026 termina nesta sexta-feira (20), conforme informado pela CNN Brasil. No entanto, o Brasil enfrenta diversos desafios sociais, como a violência contra mulheres negras, que representam 65% das vítimas de feminicídio no país, de acordo com um relatório da CNN Brasil. Sobre a violência, o Metrópoles revelou que os negros são três vezes mais afetados pela redução da maioridade penal, representando 74,6% dos menores infratores em unidades de internação. Além disso, o secretário da Secretaria de Administração Penitenciária do Ceará, acusado de tortura, foi flagrado usando spray de pimenta em presos, conforme noticiado pelo Metrópoles.", "meio_ambiente": "No penúltimo dia da COP31 em Belém, Brasil, os debates focaram em investimentos, justiça climática e soluções práticas, com negociações em andamento. No entanto, o acordo final pode não incluir uma proclamação para abandonar os combustíveis fósseis, o que divide as nações nas negociações anuais. Em outro desenvolvimento, a Indonésia prometeu parar o desmatamento para produção de alimentos e reutilizar terras degradadas, ganhando elogios do ator Leonardo DiCaprio. No entanto, especialistas argumentam que o plano é vago e pode enfraquecer os ecossistemas vulneráveis.", "direitos_humanos": "A corte principal da ONU declarou que o Mianmar cometeu genocídio contra a minoria rohingya, em um julgamento histórico que atribui responsabilidade por genocídio a um país pela primeira vez desde a fundação da corte há 80 anos. Esta decisão, baseada em acusações de violações graves dos direitos humanos, incluiu o assassinato de milhares de civis rohingya, estupro generalizado de mulheres e violência extrema contra crianças. O tribunal também confirmou que o Mianmar é responsável por genocídio contra o povo rohingya, reabrindo feridas na experiência traumática de 2017. Em outro desenvolvimento, um estudo do Aláfia Lab revelou que 61% das vítimas de racismo online no Brasil são mulheres, com um perfil predominante de mulheres pretas entre 25 e 30 anos. Além disso, a Bahia registra mais de 2,9 mil processos pendentes relacionados a ações de racismo, representando aproximadamente 17% do total de ações ajuizadas no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 276235, "titulo": "Crescem pressões sobre Lula em meio à indefinição de nomes centrais do governo", "url": "https://veja.abril.com.br/politica/crescem-pressoes-sobre-lula-em-meio-a-indefinicao-de-nomes-centrais-do-governo/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula enfrenta pressões enquanto define os nomes para posições centrais do governo. As diretrizes econômicas do novo mandato ainda estão em aberto.", "titulo_pt": "Crescem pressões sobre Lula em meio à indefinição de nomes e diretrizes econômicas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276364, "titulo": "Quem foi Zumbi dos Palmares: o maior líder quilombola brasileiro", "url": "https://www.dw.com/pt-br/quem-foi-zumbi-dos-palmares-o-maior-líder-quilombola-brasileiro/a-70820888?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-20T08:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Data de morte de Zumbi dos Palmares se tornou o Dia da Consciência Negra no Brasil. No auge, o quilombo teria abrigado 30 mil pessoas em uma área equivalente ao tamanho de Portugal.", "titulo_pt": "Quem foi Zumbi dos Palmares: o maior líder quilombola brasileiro", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 276306, "titulo": "PL tenta convencer deputado do Republicanos a concorrer contra Motta", "url": "https://www.metropoles.com/colunas/igor-gadelha/pl-tenta-convencer-deputado-do-republicanos-a-concorrer-contra-motta", "fonte_id": "metropoles", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PL está tentando convencer um deputado do Republicanos a concorrer para presidente da Câmara. A articulação é liderada pela fracionada ala do PL que se opõe ao apoio a Motta.", "titulo_pt": "PL tenta convencer deputado do Republicanos a concorrer contra Motta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276174, "titulo": "Livro do filho resgata dúvidas sobre morte de Jango durante a ditadura", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/livro-do-filho-resgata-duvidas-sobre-morte-de-jango-durante-a-ditadura.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "João Vicente Goulart, filho do ex-presidente João Goulart, publicou um livro resgatando as dúvidas sobre a morte do seu pai durante a ditadura no Brasil. O livro descreve uma série de eventos, incluindo sabotagens, assassinatos por envenenamento e voos secretos, relacionados à última fase da vida de João Goulart.", "titulo_pt": "Livro do filho resgata dúvidas sobre morte de Jango durante a ditadura", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 276184, "titulo": "Governo ainda precisa encontrar espaço no Orçamento para R$ 20 bi de promessas de campanha, diz IFI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-ainda-precisa-encontrar-espaco-no-orcamento-para-r-20-bi-de-promessas-de-campanha-diz-ifi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo precisa encontrar espaço no Orçamento de 2027 para financiar promessas de despesas feitas pelo presidente Lula durante a campanha eleitoral. A IFI não esclareceu como esses gastos serão incluídos nas contas do próximo ano.", "titulo_pt": "Governo precisa encontrar espaço no Orçamento para R$ 20 bi de promessas de campanha, diz IFI", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276292, "titulo": "STF se aproxima do recesso com 6×1, dosimetria e relatórios da PF em aberto", "url": "https://www.cnnbrasil.com.br/politica/stf-se-aproxima-do-recesso-com-6x1-dosimetria-e-relatorios-da-pf-em-aberto/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) terá sessões plenárias em dezembro, mas alguns assuntos não seriam discutidos nesse período e ficarão pendentes até após o recesso, em fevereiro.", "titulo_pt": "STF se aproxima do recesso com sessões em dezembro e pendências para fevereiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276318, "titulo": "STF decide se Van Hattem vira réu por chamar delegado da PF de bandido", "url": "https://www.metropoles.com/colunas/manoela-alcantara/stf-decide-se-van-hattem-vira-reu-por-chamar-delegado-da-pf-de-bandido", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF analisará se o deputado Van Hattem deve ser processado por chamar um delegado da PF de bandido. Van Hattem alega imunidade parlamentar e afirma que o processo ameaça a democracia.", "titulo_pt": "STF decide se Van Hattem vira réu por chamar delegado da PF de bandido", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276295, "titulo": "PGR analisará só 4 dos 10 relatórios da PF sobre ministros do STF; entenda", "url": "https://www.cnnbrasil.com.br/politica/pgr-analisara-so-4-dos-10-relatorios-da-pf-sobre-ministros-do-stf-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T06:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) analisará apenas quatro dos dez relatórios enviados pela Polícia Federal (PF) sobre ministros do Supremo Tribunal Federal (STF). Os relatórios enviados por Fachin cobrem ministros Moraes, Kassio, Toffoli e Mendonça, enquanto seis documentos foram arquivados.", "titulo_pt": "PGR analisará apenas quatro relatórios sobre ministros do STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276297, "titulo": "Ajuste fiscal chega à Câmara sob pressão após resistências no Senado", "url": "https://www.cnnbrasil.com.br/politica/ajuste-fiscal-chega-a-camara-sob-pressao-apos-resistencias-no-senado/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T06:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de ajuste fiscal foi aprovado pelo relator e segue agora para análise dos deputados na Câmara dos Deputados na segunda-feira (23). A proposta depende, no entanto, de um pedido de urgência para ser debatida.", "titulo_pt": "Ajuste fiscal segue para Câmara após aprovação no Senado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276403, "titulo": "O voto distrital misto vai salvar o centrão?", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-voto-distrital-misto-vai-salvar-o-centrao", "fonte_id": "jota", "data_pub": "2026-11-20T06:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma política depende do alinhamento improvável de variáveis para conter o avanço da direita. O voto distrital misto é apresentado como uma possibilidade para esse alinhamento.", "titulo_pt": "O voto distrital misto vai salvar o centrão?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 276192, "titulo": "Justiça manda seguir processo de Trump contra The New York Times", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/justica-manda-seguir-processo-de-trump-contra-the-new-york-times.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T05:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal dos Estados Unidos permitiu que partes do processo por difamação movido pelo ex-presidente Donald Trump contra o The New York Times e quatro de seus repórteres sigam adiante. O processo pede indenização de US$ 15 bilhões.", "titulo_pt": "Justiça permite continuidade do processo de Trump contra The New York Times", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276405, "titulo": "Tema 843 do STF: uma nova modulação de efeitos será firmada com fundamento no impacto orçamentário?", "url": "https://www.jota.info/opiniao-e-analise/colunas/women-in-tax-brazil/tema-843-do-stf-uma-nova-modulacao-de-efeitos-sera-firmada-com-fundamento-no-impacto-orcamentario", "fonte_id": "jota", "data_pub": "2026-11-20T04:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O valor de R$ 16,5 bilhões permanece inalterado desde 2023, reavivando o debate sobre os limites da modulação de efeitos no STF.", "titulo_pt": "Tema 843 do STF: debate sobre os limites da modulação de efeitos será reavivado com fundamento no impacto orçamentário?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 276175, "titulo": "PGR terá núcleo com Gonet para avaliar relatórios sobre ministros do STF e deve superar prazo de 15 dias", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pgr-tera-nucleo-com-gonet-para-avaliar-relatorios-sobre-ministros-do-stf-e-deve-superar-prazo-de-15-dias.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T02:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) formará um núcleo com pelo menos quatro procuradores para avaliar os relatórios sobre ministros do STF enviados pela Polícia Federal. Este grupo deve ultrapassar o prazo de 15 dias para finalizar a avaliação.", "titulo_pt": "PGR terá núcleo com Gonet para avaliar relatórios sobre ministros do STF e deve superar prazo de 15 dias", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 276176, "titulo": "Lula diz que quer evitar erros do atual mandato com ministros e que busca equipe sólida", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/lula-diz-que-quer-evitar-erros-do-atual-mandato-com-ministros-e-que-busca-equipe-solida.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula (PT) não tem pressa para definir os futuros ministros porque busca evitar erros da atual gestão e manter indicados por mais tempo. A referência é às trocas que Lula precisou fazer nos primeiros meses do mandato.", "titulo_pt": "Lula quer evitar erros do atual mandato e busca equipe sólida para o futuro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 276177, "titulo": "Jornais negros surgiram há quase 200 anos para reivindicar cidadania e denunciar racismo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/jornais-negros-surgiram-ha-quase-200-anos-para-reivindicar-cidadania-e-denunciar-racismo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro jornal feito por pessoas negras foi publicado em 1833 no Brasil, durante o regime da escravidão. Esse jornal, 'O Homem de Cor', reivindicava a cidadania da população preta e parda e questionava a discriminação racial. Hoje, jornalistas negros continuam abordando esses temas em seus veículos de comunicação.", "titulo_pt": "Jornais negros surgiram há quase 200 anos para reivindicar cidadania e denunciar racismo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 276193, "titulo": "Entidades criticam decreto de Lula que regulamenta fim da escala 6x1 e falam em falta de informações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/entidades-criticam-decreto-de-lula-que-regulamenta-fim-da-escala-6x1-e-falam-em-falta-de-informacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Associações que representam diversos setores da economia criticam o decreto do governo Lula que regulamenta o fim da escala 6x1, substituída pela 5x2, com duas folgas, em 2026. Empresários reclamam da falta de um período de adaptação ao novo modelo.", "titulo_pt": "Entidades criticam decreto de Lula que regulamenta fim da escala 6x1 e falam em falta de informações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 276617, "titulo": "Ukraine updates: Kyiv targeted by missile strikes, bridges hit", "url": "https://www.dw.com/en/ukraine-updates-kyiv-targeted-by-missile-strikes-bridges-hit/live-79999822?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-20T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A capital ucraniana, Kiev, foi atingida por foguetes russos, resultando em pelo menos três mortes. As últimas investidas ocorreram após Vladimir Putin ameaçar uma 'resposta dolorosa' em resposta aos ataques à ponte de Kerch.", "titulo_pt": "Atualizações da Ucrânia: kiev alvo de ataques com foguetes, pontes atingidas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 276618, "titulo": "COP31: UN Climate summit enters final phase with no deal in sight", "url": "https://www.dw.com/en/cop31-un-climate-summit-enters-final-phase-with-no-deal-in-sight/live-79999516?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-20T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após quase duas semanas de negociações, os países permanecem divididos sobre como combater o aquecimento global. Um novo rascunho de declaração não menciona o fim gradual dos combustíveis fósseis, os principais responsáveis pelo aquecimento global.", "titulo_pt": "COP31: encontro climático da ONU entra na fase final sem acordo", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 276508, "titulo": "UK and EU close in on Brexit reset deal but tuition fees remain a stumbling block – live", "url": "https://www.theguardian.com/world/live/2026/nov/20/uk-eu-european-union-brexit-deal-andy-burnham-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-11-20T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido e a União Europeia chegaram a um acordo provisório que permitirá que 100 mil cidadãos da UE venham ao Reino Unido anualmente através de um novo esquema de mobilidade. No entanto, a questão das taxas de universidade para cidadãos da UE permanece como obstáculo no acordo.", "titulo_pt": "Reino unido e ue se aproximam de acordo de redefinição do Brexit, mas taxas de universidade são obstáculo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 276619, "titulo": "Lufthansa to cut 1,000 jobs, citing ongoing losses — reports", "url": "https://www.dw.com/en/lufthansa-to-cut-1-000-jobs-citing-ongoing-losses-reports/a-80000062?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-20T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lufthansa planeja cortar 1.000 postos de trabalho devido às perdas mensais de 20 milhões de euros. Além dos cortes de empregos, a empresa também planeja reduzir operações.", "titulo_pt": "Lufthansa vai cortar 1.000 postos de trabalho, informa", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 276684, "titulo": "Amb. Ucraina, 'il sito Myrotvorets non rappresenta posizione statale'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/20/amb.-ucraina-il-sito-myrotvorets-non-rappresenta-posizione-statale_b53e87fe-5a3e-472f-b18e-0468b7fdf919.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-20T09:40:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A embaixada ucraniana emitiu uma declaração afirmando que o site Myrotvorets não representa uma posição oficial. Após os italianos serem incluídos na lista negra do site, Kiev declarou que ele não é uma fonte oficial.", "titulo_pt": "Embaixada Ucrânia: site Myrotvorets não representa posição oficial", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 276585, "titulo": "Kyiv's allies push back against Trump and Putin's provocations", "url": "https://www.lemonde.fr/en/international/article/2026/11/20/kyiv-s-allies-push-back-against-trump-and-putin-s-provocations_6785209_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-20T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder russo propôs uma reunião com líderes europeus em Moscou para discutir o futuro da Ucrânia e a arquitetura de segurança da Europa. O chanceler alemão Friedrich Merz indicou que a Europa pretende participar das discussões com Kiev, Moscou e Washington em um local neutro.", "titulo_pt": "Aliados de kiev reagem às iniciativas de Trump e Putin", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 276503, "titulo": "California investigates Nvidia over whether chip exports ended up in China", "url": "https://www.theguardian.com/technology/2026/nov/20/california-investigates-nvidia-over-whether-chip-exports-ended-up-in-china", "fonte_id": "guardian_world", "data_pub": "2026-11-20T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estado da Califórnia está investigando a Nvidia em relação a possíveis exportações de chips para a China em violação das restrições dos Estados Unidos. O procurador-geral Rob Bonta emitiu um subpega investigativa após uma escândalo que levou à demissão do co-fundador e antigo CEO Jensen Huang.", "titulo_pt": "Califórnia investiga Nvidia sobre exportações de chips para a China", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 276661, "titulo": "Pakistan minister visits India for first time since 2025 war", "url": "https://www.aljazeera.com/news-analysis/2026/11/20/pakistan-minister-visits-india-for-first-time-since-2025-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro do Paquistão visitou a Índia pela primeira vez desde a guerra de 2025, e Islamabad e Nova Deli afirmam que a visita é multilateral, não abrindo um canal de contato.", "titulo_pt": "Ministro paquistanês visita Índia pela primeira vez desde guerra de 2025", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 276533, "titulo": "Congress and the Coming Crises", "url": "https://www.foreignaffairs.com/united-states/congress-and-coming-crises", "fonte_id": "foreign_affairs", "data_pub": "2026-11-20T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso americano deve encontrar maneiras de mitigar ameaças emergentes à segurança nacional dos Estados Unidos.", "titulo_pt": "Congresso e as ameaças iminentes à segurança nacional", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 276534, "titulo": "America’s Bad Bargain in Venezuela", "url": "https://www.foreignaffairs.com/venezuela/americas-bad-bargain-venezuela", "fonte_id": "foreign_affairs", "data_pub": "2026-11-20T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os acordos de Washington estão fortalecendo o regime chavista em Venezuela.", "titulo_pt": "O bombardeio dos acordos de washington na Venezuela", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 276662, "titulo": "Russia’s day-long attack on Kyiv damages embassies", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/russias-day-long-attack-on-kyiv-damages-embassies?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um ataque que durou todo o dia, as embaixadas em Kyiv foram danificadas.", "titulo_pt": "Ataque russo de um dia causa danos a embaixadas em Kyiv", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 276794, "titulo": "Seoul questions ex-USFK commander's access to OPCON information", "url": "https://www.koreaherald.com/article/10944383", "fonte_id": "korea_herald", "data_pub": "2026-11-20T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Defesa da Coreia do Sul anunciou que revisará os procedimentos dos EUA para lidar com informações militares sensíveis após um general aposentado dos EUA contradizer o ministro sobre a transferência do controle operacional durante o conflito. A Coreia do Sul afirmou que tomará medidas apropriadas, se necessário, após consultas com os EUA.", "titulo_pt": "Seul questiona procedimentos dos EUA em relação à transferência de informações OPCON", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 276712, "titulo": "Indonesia’s Prabowo and China’s Xi discuss future South China Sea cooperation", "url": "https://www.japantimes.co.jp/news/2026/11/20/asia-pacific/politics/indonesia-south-china-sea-xi/", "fonte_id": "japan_times", "data_pub": "2026-11-20T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prabowo, candidato à presidência da Indonésia, discutiu com Xi, líder chinês, sobre futuras parcerias marítimas. Acordos de cooperação com a China nas águas do Mar do Sul da China têm feito outros países se preocupar com a possibilidade de legitimar as reivindicações de Beijing.", "titulo_pt": "Prabowo e Xi discutem cooperação futura no mar do sul da China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 276663, "titulo": "El Salvador’s Bukele seeks third term after constitution change", "url": "https://www.aljazeera.com/news/2026/11/20/el-salvadors-bukele-seeks-third-term-after-constitution-change?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Bukele busca um terceiro mandato na El Salvador após alterações na constituição. Críticos acusam o presidente populista de estabelecer, de fato, um estado de partido único no país.", "titulo_pt": "Bukele busca terceiro mandato após alteração constitucional em el Salvador", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 276795, "titulo": "KB Financial shareholders back Lee Jae-keun as next chair", "url": "https://www.koreaherald.com/article/10944369", "fonte_id": "korea_herald", "data_pub": "2026-11-20T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os acionistas do Grupo KB Financial elegeram Lee Jae-keun para o conselho de administração, permitindo que ele assuma o cargo de presidente do grupo. Os acionistas que representam 97,69% das ações votaram a favor da eleição de Lee como diretor interno.", "titulo_pt": "Acionistas do KB Financial apoiam Lee Jae-keun como próximo presidente", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 276419, "titulo": "Bukele se presenta a las elecciones de 2027 y optará por un tercer mandato en El Salvador", "url": "https://www.latercera.com/mundo/noticia/bukele-se-presenta-a-las-elecciones-de-2027-y-optara-por-un-tercer-mandato-en-el-salvador/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T08:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Bukele anunciou sua candidatura às eleições de 2027 e pretende buscar um terceiro mandato na presidência do El Salvador. Ele afirmou que o país está sendo gradualmente melhorado e que o objetivo é continuar o processo de desenvolvimento.", "titulo_pt": "Bukele apresenta-se para as eleições de 2027 e busca terceiro mandato na presidência do El Salvador", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 276770, "titulo": "Credit card loans edge up in Oct.", "url": "https://en.yna.co.kr/view/AEN20261120008700320", "fonte_id": "yonhap_news", "data_pub": "2026-11-20T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O valor total de empréstimos com cartões de crédito aumentou ligeiramente em outubro.", "titulo_pt": "Empréstimos com cartões de crédito aumentam levemente em outubro", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 276854, "titulo": "FDA’s search for a new leader, and China’s largest drugmakers", "url": "https://www.statnews.com/2026/11/20/new-fda-commissioner-summit-lung-cancer-drug-readout-loud-podcast/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA está novamente procurando um novo líder. Um medicamento contra o câncer de pulmão, que era amplamente monitorado, foi rejeitado pela agência.", "titulo_pt": "A busca pela nova liderança da fda e a rejeição de um medicamento contra o câncer de pulmão", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 276638, "titulo": "Anthropic shares fall nearly 6% in premarket amid AI selloff as Nvidia, AMD shares drop", "url": "https://www.cnbc.com/2026/11/20/anthropic-stock-ai-amd-nvidia.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-20T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Anthropic caíram cerca de 6% no pré-mercado, acompanhando uma venda generalizada de ações de empresas de inteligência artificial, como as da Nvidia e AMD. Anteriormente, as ações da Anthropic subiram 17% em sua primeira sessão de negociação.", "titulo_pt": "Ações da anthropic caem 6% no pré-mercado durante venda generalizada de AI", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 276243, "titulo": "Os desafios da Anthropic, do Claude, após estreia histórica na bolsa", "url": "https://veja.abril.com.br/economia/os-desafios-da-anthropic-apos-estreia-na-bolsa-com-a-maior-avaliacao-da-historia/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic, empresa de inteligência artificial liderada por Claude, enfrentará o desafio de gerar resultados financeiros que justifiquem o valor atribuído a ela após sua estreia histórica na bolsa.", "titulo_pt": "Desafios da Anthropic, do Claude, após estreia na bolsa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276401, "titulo": "ISS sobre IBS e CBS: a cobrança de 2027 já chegou à Justiça", "url": "https://www.jota.info/opiniao-e-analise/artigos/iss-sobre-ibs-e-cbs-a-cobranca-de-2027-ja-chegou-a-justica", "fonte_id": "jota", "data_pub": "2026-11-20T08:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei Complementar 214/2025 excluiu o ISS da base de cálculo dos novos impostos, mas não abordou a possibilidade de incluí-lo novamente. Essa omissão levou a disputas judiciais sobre a cobrança do ISS a partir de 2027.", "titulo_pt": "ISS sobre IBS e CBS: a cobrança de 2027 já chegou à Justiça", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 276326, "titulo": "Cheques maiores, menos vencedores: financiamento a startups dispara nos EUA", "url": "https://www.infomoney.com.br/business/global/financiamento-inicial-a-startups-disparou-nos-eua-mas-no-de-negocios-estabilizou/", "fonte_id": "infomoney", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As startups americanas captaram US$ 42 bilhões em rodadas Série A até outubro, um aumento de 60% em relação ao mesmo período do ano anterior, mas o número de empresas financiadas permaneceu praticamente estável.", "titulo_pt": "Cheques maiores, menos vencedores: financiamento a startups nos EUA cresce", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 276285, "titulo": "Terras raras têm preços até 11 vezes maiores nos EUA; Brasil mira mercado", "url": "https://www.cnnbrasil.com.br/infra/terras-raras-tem-precos-ate-11-vezes-maiores-nos-eua-brasil-mira-mercado/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da S&P Global revela que o preço das terras raras no mercado americano pode ser até 11 vezes maior do que no mercado chinês. O Brasil está explorando possibilidades de projetos nesse setor como alternativas para diversificar a oferta global de terras raras.", "titulo_pt": "Terras raras têm preços até 11 vezes maiores nos EUA; Brasil mira mercado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276313, "titulo": "Avanço de ajuste fiscal do governo não satisfaz e mercado mantém pessimismo", "url": "https://www.metropoles.com/brasil/avanco-de-ajuste-fiscal-do-governo-nao-satisfaz-e-mercado-mantem-pessimismo", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A semana foi marcada por uma elevação do dólar e novas reduções na Bolsa de valores. O governo admitiu a necessidade de implementar medidas adicionais além do ajuste fiscal.", "titulo_pt": "Avanço de ajuste fiscal do governo não satisfaz e mercado mantém pessimismo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276287, "titulo": "Regulamentação do fim da escala 6×1 gera insegurança, diz juiz do Trabalho", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/regulamentacao-do-fim-da-escala-6x1-gera-inseguranca-diz-juiz-do-trabalho/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T07:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz do Trabalho Otavio Calvet avaliou que o decreto presidencial sobre a regulamentação do fim da escala 6×1 pode descumprir a CLT e prevê que haverá uma judicialização em massa com a nova regra trabalhista.", "titulo_pt": "Regulamentação do fim da escala 6×1 gera insegurança, diz juiz do Trabalho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276639, "titulo": "SoftBank suffers worst day in over two years as AI sell-off hits Asian tech stocks", "url": "https://www.cnbc.com/2026/11/20/softbank-ai-tech-stocks-slide-anthropic-debut.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-20T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da SoftBank caíram significativamente em sua pior sessão em mais de dois anos, enquanto outras ações de tecnologia asiáticas também sofreram devido à venda de inteligência artificial de empresas como Anthropic, que teve seu IPO bem esperado em Wall Street.", "titulo_pt": "Softbank sofre sua pior queda em mais de dois anos com venda de inteligência artificial afetando ações de tecnologia asiáticas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 276402, "titulo": "Plataformas digitais podem entregar medicamentos, não dispensar", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fernando-aith/plataformas-digitais-podem-entregar-medicamentos-nao-dispensar", "fonte_id": "jota", "data_pub": "2026-11-20T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação da Anvisa deve seguir a lei e manter a harmonia com a proteção sanitária já existente. Plataformas digitais podem entregar medicamentos, mas não podem dispensá-los.", "titulo_pt": "Plataformas digitais podem entregar medicamentos, não dispensar", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 276183, "titulo": "Distratos de imóveis disparam e atingem até um quarto das vendas de incorporadoras do país", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/distratos-de-imoveis-disparam-e-atingem-ate-um-quarto-das-vendas-de-incorporadoras-do-pais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os distratos de imóveis já representam até um quarto das vendas brutas de algumas das maiores incorporadoras listadas na B3, conforme mostram os balanços do terceiro trimestre de 2026.", "titulo_pt": "Distratos de imóveis atingem até um quarto das vendas de incorporadoras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276186, "titulo": "Regras para categorias específicas e descanso remunerado com fim da 6x1 saem a partir de segunda (23)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/regras-para-categorias-especificas-e-descanso-remunerado-com-fim-da-6x1-saem-a-partir-de-segunda-23.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Trabalho publicará na próxima segunda-feira (23) as primeiras portarias com regras para implementar o fim da escala 6x1. As portarias abordarão categorias específicas e descanso remunerado.", "titulo_pt": "Novas regras para categorias específicas e descanso remunerado com fim da 6x1 saem a partir de segunda (23)", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276189, "titulo": "Imposto Seletivo de 2027 desconsidera conteúdo nocivo à saúde, diz CLP", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/imposto-seletivo-de-2027-desconsidera-conteudo-nocivo-a-saude-diz-clp.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Imposto Seletivo que entrará em vigor em fevereiro de 2027, conforme a MP 1.399/2026, não relaciona o valor do tributo à quantidade de substâncias prejudiciais à saúde ou ao meio ambiente presentes nos produtos.", "titulo_pt": "Imposto Seletivo de 2027 ignora conteúdo nocivo à saúde, afirma CLP", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276718, "titulo": "Japan’s GDP slump might be more than just a blip", "url": "https://www.japantimes.co.jp/business/2026/11/20/economy/gdp-weak-consumption/", "fonte_id": "japan_times", "data_pub": "2026-11-20T06:42:00Z", "idioma": "en", "provavel_duplicata_de": nul ohang apresenta projetos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 276238, "titulo": "15 coisas que dá para fazer com IA atualmente e você não sabia (até agora)", "url": "https://veja.abril.com.br/coluna/planeta-ia/15-coisas-que-da-para-fazer-com-ia-atualmente-e-voce-nao-sabia-ate-agora/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É possível controlar finanças pelo WhatsApp, verificar o horário do metrô no ChatGPT, e encontrar um encanador através do Gemini, entre outras funções de inteligência artificial. Estas são algumas das muitas maneiras inusitadas e úteis que a IA pode ser utilizada atualmente.", "titulo_pt": "15 Coisas que você não sabia que pode fazer com IA atualmente", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276417, "titulo": "Lincolao & OpenAI: ¿sabemos donde estamos parados?", "url": "https://www.latercera.com/opinion/noticia/lincolao-openai-sabemos-donde-estamos-parados/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a relação entre a Lincolna e a OpenAI, mas não fornece detalhes adicionais sobre o conteúdo específico.", "titulo_pt": "Lincolna & OpenAI: sabemos onde estamos parados?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 276792, "titulo": "Will fees curb Apple Pay’s next wave in Korea?", "url": "https://www.koreaherald.com/article/10944408", "fonte_id": "korea_herald", "data_pub": "2026-11-20T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A introdução do Apple Pay pelo Kakao Bank fez com que o Hyundai Card perdesse o monopólio na oferta do serviço na Coreia do Sul, reavivando a discussão sobre os custos de aderência. A ampla adoção do serviço poderia oferecer mais opções de cartões e locais de pagamento para os usuários de iPhones, mas os emissores já sobrecarregados com menores taxas de comércio precisam avaliar se o Apple Pay compensa os novos custos adicionais.", "titulo_pt": "Taxas podem limitar a próxima onda do Apple Pay na Coreia do sul?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 276710, "titulo": "Mitsubishi Heavy Industries to take on launch operations for Japan’s H3 rocket", "url": "https://www.japantimes.co.jp/business/2026/11/20/companies/h3-rocket-mitsubishi/", "fonte_id": "japan_times", "data_pub": "2026-11-20T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mitsubishi Heavy Industries assumirá as operações de lançamento do foguete H3 japonês, anteriormente gerenciadas pela Agência Espacial Japonesa. O processo será gradual e começará com o próximo lançamento.", "titulo_pt": "Mitsubishi Heavy Industries assumirá operações de lançamento do fogueto H3 japonês", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 276656, "titulo": "White House replaces top cyber security official", "url": "https://www.ft.com/content/6333f2e6-98da-4491-bd2e-30237d7bfbf5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-20T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kirsten Davies foi nomeada nova chefe de segurança cibernética do governo dos Estados Unidos, substituindo Sean Cairncross. A mudança ocorre após uma série de interrupções online.", "titulo_pt": "Branco casa substitui chefe de segurança cibernética", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 276714, "titulo": "Over 15,000 register interest in class action after Rakuten Securities breach", "url": "https://www.japantimes.co.jp/news/2026/11/20/japan/crime-legal/rakuten-securities-lawsuit/", "fonte_id": "japan_times", "data_pub": "2026-11-20T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 15.000 pessoas se registraram para uma ação coletiva após uma violação de segurança na Rakuten Securities, que
