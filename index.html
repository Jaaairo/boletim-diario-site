<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "02/11/2026 19:17", "stats": {"noticias_novas": 580, "resumos_gerados": 232}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O deputado federal Janones se reuniu com o político Sergio Massa para compartilhar estratégias digitais utilizadas na campanha de reeleição de Lula. Em outra notícia, o presidente da Fepal afirmou que a paz em Israel dependeria de 40% dos judeus concordarem com a criação de um Estado palestino. O secretário-executivo do Ministério da Fazenda, Dario Durigan, negou que o governo esteja avaliando propostas como a tabela de juros ou a venda de reservas cambiais. O Supremo Tribunal Federal pode reduzir a pena de prisão de Jair Bolsonaro a 2 anos e 4 meses, o que poderia ocorrer em 2027 ou 2028, se a proposta do Congresso for aprovada. Além disso, o governo Tarcísio de Freitas adiou a entrega de duas estações da Linha 6-Laranja do Metrô em São Paulo, que faziam parte do segundo trecho da linha, após a inauguração incompleta das estações prometidas para outubro.", "mundo": "A Coreia do Sul está prestes a alcançar as exportações anuais de US$ 1 trilhão, reforçando sua posição como uma potência exportadora da Ásia. No entanto, a Coreia do Norte foi acusada pela Federal Bureau of Investigation (FBI) dos Estados Unidos de realizar um ataque cibernético contra criptomoedas. Além disso, o governo dos Estados Unidos anunciou a exclusão da África do Sul e do Rwanda do programa de comércio livre AGOA, devido a supostas violações de regras. Diante dessas tensões geopolíticas, o presidente americano Joe Biden enfrenta críticas por suas promessas não cumpridas e por sua política externa, que tem levado Washington a envolver-se em conflitos ao redor do mundo. Na Europa, o preço do petróleo está caindo, o que pode levar a um acordo com o Irã, enquanto investigações em lojas de alimentos indicam uma crescente vulnerabilidade das cadeias de suprimentos. Em um contexto global marcado por fragmentação e desafios econômicos, a Coreia do Sul planeja um fórum sobre a cooperação econômica com o Japão, enquanto o Reino Unido enfrenta pedidos de reparações pelos crimes da escravidão de países do Caribe.\n\nAs tensões geopolíticas estão aumentando em vários cenários. De acordo com um oficial do Serviço de Informações de Macau, o governo chinês planeja intensificar suas ações agressivas. Por outro lado, o ex-presidente dos Estados Unidos, Donald Trump, sugeriu a possibilidade de um acordo com o Irã, citando a queda dos preços do petróleo como sinal de redução de tensões. O Irã foi acusado de liderar um grupo de hackers norte-coreanos que roubou US$ 6,3 bilhões da Binance, utilizando inteligência artificial para suas operações. Além disso, ataques russos na Ucrânia resultaram em pelo menos 24 mortes, enquanto Israel reativou o lockdown em Hebron. A China intensificou sua diplomacia no Oriente Médio, recebendo o chefe de estado omãí em uma visita inédita desde 1978. Os EUA também suspenderam o acesso isento de tarifas para África do Sul e Ruanda, afetando exportações anuais no valor de 1,7 bilhão de dólares.", "economia": "A economia global enfrenta diversos desafios e oportunidades, com destaque para o desempenho da Apple e a situação do petróleo. A Apple teve um terceiro trimestre sólido, com vendas robustas de iPhones e Macs que compensaram a performance mais fraca na China. No entanto, a empresa está esperando uma projeção crucial sobre as vendas durante as festas de fim de ano. Em relação ao petróleo, o preço caiu mais de 7% devido às esperanças de que as negociações diplomáticas entre Estados Unidos e Irã possam avançar, reduzindo o risco de interrupção no suprimento global. Além disso, a Anthropic registrou um aumento de 148% na receita comercial, superando pela primeira vez a receita governamental, enquanto a Marvell adquiriu a Lumentum por 115 bilhões de dólares, fortalecendo sua posição no mercado de infraestrutura óptica para data centers.", "tecnologia": "A Coreia do Sul planeja dobrar suas despesas em inteligência artificial e chips no próximo ano, buscando manter sua competitividade global. Este investimento visa fortalecer o setor tecnológico do país. Em um desenvolvimento relacionado, a inteligência artificial está resolvendo problemas matemáticos mais rapidamente do que os humanos, levando a questionamentos sobre o futuro dos matemáticos. Por outro lado, a Apple anunciou que adiou o lançamento de seu robô doméstico para 2028, devido a problemas no software. A Anthropic, por sua vez, enfrenta críticas sobre a qualidade das insights geradas por sua inteligência artificial. Além disso, a empresa de hospedagem de sites Squarespace anunciou cortes de 19% em sua força de trabalho, enquanto o New York Times e outras publicações processam a empresa de navegador Brave por supostas violações de direitos autorais. O medo em relação à inteligência artificial fez mais de 2 trilhões de dólares desaparecerem dos mercados acionários internacionais, principalmente afetando as ações de tecnologia, mas uma recuperação na Coreia e uma reavaliação do Deutsche Bank sugerem que a situação pode estar se estabilizando.", "ciencia": "A NASA comemora 65 anos do Centro Espacial Johnson, que desde sua fundação tem sido o centro de excelência para a navegação espacial humana da agência espacial americana. Em outros desenvolvimentos científicos, pesquisadores desenvolveram um novo material semiconductor com propriedades promissoras para aplicações avançadas. Uma equipe liderada pelo Dr. Shikma Zaarur descobriu que solos agrícolas podem conter um grande estoque de potássio, um nutriente essencial para o crescimento das plantas, que é geralmente ignorado pelos métodos de teste de solo convencionais. Outros estudos abordaram a síntese de amônia a baixas temperaturas, a neurologia de raposas domésticas e a preservação de células vermelhas de sangue de dinossauros em fósseis de 115 milhões de anos. Além disso, cientistas identificaram novos alvos para drogas antivirais contra o coronavírus, e novas informações foram descobertas sobre a formação de chuva em nuvens marinhas. A NASA também anunciou a 'retornada' da equipe CHAPEA após uma simulação de viagem a Marte, e um novo genérico de lenacapavir para prevenção do HIV foi aprovado nos Estados Unidos.", "cultura": "A Real Academia Española (RAE) lançou a edição 'nativa digital' do Dicionário de la Lengua Española, com mais de seis mil novas entradas em comparação com a edição de 2014. Este lançamento marca o término de uma série de dicionários que começaram há 300 anos, conforme declarou Santiago Muñoz Machado. Em outro destaque, a Fundação Vilcek anunciou os 12 vencedores dos prêmios de 2026, totalizando US$ 212.000, com o objetivo de promover as artes. Além disso, a exposição 'A Real Love Thing' apresenta 15 obras que exploram o interesse de Jeffrey Gibson em padrões, música, ícones lésbicos e gais, e sua herança indígena Choctaw e Cherokee, abrangendo uma década de prática multidisciplinar do artista.", "sociedade": "A inadimplência atingiu 84 milhões de pessoas no país pela primeira vez, de acordo com dados da Serasa, com o número de pessoas com contas em atraso crescendo 34% desde 2020. O levantamento destaca a importância do crédito no consumo, mas também revela a gravidade da situação financeira enfrentada pela população. Em outro desenvolvimento, a educação foi debatida em um estudo que sugere que ela pode auxiliar, mas não corrigir as desigualdades raciais significativas, conforme Martin Carnoy, professor da Universidade de Stanford. A sociedade também foi impactada por tragédias e incidentes, como o acidente de um avião nos Estados Unidos, onde a copilota era brasileira de 20 anos, e o assassinato de um engenheiro ambiental em Santos, que foi morto após ser espancado durante uma manifestação política pró-Lula. Além disso, o fortalecimento do estatuto jurídico que protege os animais foi discutido em um julgamento unânime, enquanto a construção de hospitais e a melhoria da saúde pública foram anunciadas pelo governo. Ainda, a vida das crianças em Gaza foi retratada em um documentário da BBC, mostrando as dificuldades enfrentadas por elas após um cessar-fogo.", "meio_ambiente": "O aquecimento global, conforme alerta da ONU, pode causar danos irreversíveis a geleiras e banquetes de gelo, aumentando riscos de inundações, escassez de água e impactos econômicos e ecológicos. A aviação, um dos maiores emissores de gases de efeito estufa, pode reduzir significativamente seus impactos ambientais através de alterações nas rotas de voo e uso de combustíveis sustentáveis. Delegados se reúnem na COP31 em Antalya para negociações climáticas. Em outros assuntos, o El Niño prevê chuvas de até 200 milímetros na região pampeana, enquanto o vórtice polar estratosférico pode alterar os padrões climáticos na Europa, aumentando a probabilidade de áreas de alta pressão persistente e condições mais frias. No Brasil, o Inmet emitiu alertas de perigo e perigo potencial para diferentes regiões durante o feriado de Finados, com previsão de chuvas e baixa umidade do ar.", "direitos_humanos": "Pelo menos sete migrantes morreram em um naufrágio no Mar do Atlântico enquanto tentavam chegar às Ilhas Canárias, refletindo as perigosas condições enfrentadas por imigrantes no Mediterrâneo. Em outro caso, uma mulher de 72 anos está sendo julgada em França por acusações de tortura que levou à morte de sua filha de 4 anos nos anos 1980. O caso foi reaberto com base em correspondências de DNA. O Reino Unido implementará novas regras que obrigam parte dos migrantes a esperar 10 anos para obter o direito de residência, parte de uma série de medidas mais rigorosas adotadas pelo governo após um aumento súbito no número de chegadas de imigrantes. Além disso, a Comissão de Direitos Humanos das Nações Unidas iniciará a quarta revisão periódica do direito à proteção de direitos humanos da Tailândia, refletindo a crescente importância dessa métrica de monitoramento universal."}, "resumo_do_dia": {"politica_nacional": [{"id": 241328, "titulo": "Ana Elisa e irmão de Cleitinho divergem sobre quem encarece combustíveis", "url": "https://www.poder360.com.br/poder-congresso/ana-elisa-e-irmao-de-cleitinho-divergem-sobre-quem-encarece-combustiveis/", "fonte_id": "poder360", "data_pub": "2026-11-02T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Ana Elisa atribui o aumento previsto para fevereiro de 2027 do preço do combustível à elevação do ICMS aprovada pelos Estados. O deputado irmão de Cleitinho, por outro lado, responsabiliza o governo Lula pelo encarecimento.", "titulo_pt": "Ana Elisa e irmão de Cleitinho divergem sobre quem encarece combustíveis", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241329, "titulo": "Coordenador do programa de governo de Lula endossa Lara Resende", "url": "https://www.poder360.com.br/poder-economia/coordenador-do-programa-de-governo-de-lula-endossa-lara-resende/", "fonte_id": "poder360", "data_pub": "2026-11-02T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O coordenador do programa de governo de Lula, Carlos Gustavo Gabrielli, apoiou Lara Resende e criticou o mercado financeiro em um artigo sobre política econômica.", "titulo_pt": "Coordenador do programa de governo de Lula endossa Lara Resende", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241317, "titulo": "Aliado de Nunes oficializa candidatura à presidência da Câmara de SP e se beneficia de prisão de Leite", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/aliado-de-nunes-oficializa-candidatura-a-presidencia-da-camara-de-sp-e-se-beneficia-de-prisao-de-leite.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-02T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vereador João Jorge (MDB) oficializou sua candidatura à presidência da Câmara Municipal de São Paulo. A eleição está agendada para o dia 15 de dezembro.", "titulo_pt": "Aliado de Nunes oficializa candidatura à presidência da Câmara de SP e se beneficia de prisão de Leite", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 241365, "titulo": "Aprovação de Trump segue em 32% a um dia das eleições de meio de mandato", "url": "https://www.metropoles.com/mundo/aprovacao-de-trump-segue-em-32-a-um-dia-das-eleicoes-de-meio-de-mandato", "fonte_id": "metropoles", "data_pub": "2026-11-02T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores dos Estados Unidos votam em 3 de novembro para escolher novos congressistas. A aprovação de Trump se mantém em 32% um dia antes das eleições de meio de mandato. Os republicanos podem perder a maioria no Senado.", "titulo_pt": "Aprovação de Trump segue em 32% um dia das eleições de meio de mandato", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 241412, "titulo": "Janones elogia Cleitinho e diz que ele “fala a língua do povo”", "url": "https://www.cnnbrasil.com.br/politica/janones-elogia-cleitinho-e-diz-que-ele-fala-a-lingua-do-povo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Janones elogiou o governador eleito de Minas Gerais, Cleitinho, afirmando que ele é 'um amigo' e 'fala a língua do povo', apesar de ambos estarem em posições políticas diferentes.", "titulo_pt": "Janones elogia Cleitinho e diz que ele ‘fala a língua do povo’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241366, "titulo": "Deputado pede investigação por boicote e perseguição a apoiadores de Lula", "url": "https://www.metropoles.com/sao-paulo/deputado-pede-investigacao-por-boicote-e-perseguicao-a-apoiadores-de-lula", "fonte_id": "metropoles", "data_pub": "2026-11-02T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Emídio de Souza (PT) solicitou que o Ministério Público de São Paulo (MPSP) e outras entidades investiguem possíveis casos de discriminação política contra apoiadores do presidente Lula após sua reeleição.", "titulo_pt": "Deputado pede investigação por discriminação contra apoiadores de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 241308, "titulo": "Grandes montadoras pedem que Congresso dos EUA proíba permanente veículos chineses", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/grandes-montadoras-pedem-que-congresso-dos-eua-proiba-permanente-veiculos-chineses.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo que representa as principais montadoras dos EUA pediu aos parlamentares que proíbam permanentemente os veículos chineses. Essa solicitação foi feita durante uma sessão rápida do Congresso após as eleições legislativas de meio de mandato.", "titulo_pt": "Grupos de montadoras dos EUA pedem proibição permanente de veículos chineses", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 241331, "titulo": "Janones leva a Sergio Massa estratégias digitais da campanha de Lula", "url": "https://www.poder360.com.br/poder-eleicoes-2026/janones-leva-a-sergio-massa-estrategias-digitais-da-campanha-de-lula/", "fonte_id": "poder360", "data_pub": "2026-11-02T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Janones se reuniu com o político Sergio Massa para compartilhar estratégias digitais utilizadas na campanha de reeleição de Lula.", "titulo_pt": "Janones leva estratégias digitais de campanha de Lula a Sergio Massa", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241378, "titulo": "‘Se 40% dos judeus concordassem com Estado palestino, haveria paz’, diz presidente da Fepal", "url": "https://www.brasildefato.com.br/2026/11/02/se-40-dos-judeus-concordassem-com-estado-palestino-haveria-paz-diz-presidente-da-fepal/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições israelenses marcaram um avanço no número de cadeiras do partido de representação palestina, que conquistou 19 das 120 cadeiras do Knesset, mas ainda não há maioria suficiente para remover Benjamin Netanyahu do poder. O presidente da Fepal afirmou que a paz dependeria de 40% dos judeus concordarem com um Estado palestino.", "titulo_pt": "Se 40% dos judeus concordassem com Estado palestino, haveria paz", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 241400, "titulo": "Aprovação de Trump fica perto da mínima histórica, mostra pesquisa da Reuters/Ipsos", "url": "https://www.infomoney.com.br/mundo/aprovacao-de-trump-fica-perto-da-minima-historica-mostra-pesquisa-da-reuters-ipsos/", "fonte_id": "infomoney", "data_pub": "2026-11-02T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aprovação de Trump está próxima de sua menor marca histórica, de acordo com uma pesquisa da Reuters/Ipsos. A pesquisa também indicou que a disputa entre democratas e republicanos pode estar se intensificando à medida que se aproxima a eleição.", "titulo_pt": "Aprovação de Trump perto da mínima histórica, mostra pesquisa da Reuters/Ipsos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 241491, "titulo": "O atalho que Lula deve evitar", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-atalho-que-lula-deve-evitar", "fonte_id": "jota", "data_pub": "2026-11-02T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que Lula deve evitar um caminho que depende de novas tecnologias para chegar ao povo, em vez de usar intermediários. A preocupação é que essa promessa possa comprometer a interação direta do líder com a população.", "titulo_pt": "O atalho que Lula deve evitar", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 241423, "titulo": "Mercado financeiro tem o DNA do autoritarismo, diz Gleisi Hoffmann", "url": "https://www.cnnbrasil.com.br/politica/mercado-financeiro-tem-o-dna-do-autoritarismo-diz-gleisi-hoffmann/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Gleisi Hoffmann criticou a reação do mercado financeiro após uma possível aproximação do presidente Lula ao economista André Lara Resende, conhecido por sua participação no Plano Real.", "titulo_pt": "Deputada federal critica reação do mercado financeiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241424, "titulo": "STF pode reduzir prisão de Bolsonaro a 2 anos e 4 meses", "url": "https://www.cnnbrasil.com.br/politica/stf-pode-reduzir-prisao-de-bolsonaro-a-2-anos-e-4-meses/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Se o Supremo Tribunal Federal (STF) aceitar a pena proposta pelo Congresso, Jair Bolsonaro pode ser libertado em 2027 ou 2028, com uma pena de 2 anos e 4 meses em regime fechado.", "titulo_pt": "STF pode reduzir prisão de Bolsonaro a 2 anos e 4 meses", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241332, "titulo": "Defesa de Vorcaro pede audiência no STF sobre pedidos pendentes", "url": "https://www.poder360.com.br/poder-justica/defesa-de-vorcaro-pede-audiencia-no-stf-sobre-pedidos-pendentes/", "fonte_id": "poder360", "data_pub": "2026-11-02T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados de Vorcaro pediram audiência no STF para discutir pedidos pendentes. O ex-banqueiro está atualmente preso preventivamente.", "titulo_pt": "Defesa de Vorcaro solicita audiência no STF sobre pedidos pendentes", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241333, "titulo": "Voo faz pouso de emergência em Budapeste após ameaça de bomba", "url": "https://www.poder360.com.br/poder-internacional/voo-faz-pouso-de-emergencia-em-budapeste-apos-ameaca-de-bomba/", "fonte_id": "poder360", "data_pub": "2026-11-02T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um voo da Wizz Air que voava de Londres para Sofia, na Bulgária, fez um pouso de emergência em Budapeste após uma ameaça de bomba. A Força Aérea da Hungria acompanhou o avião até o aeroporto.", "titulo_pt": "Voo da wizz air faz pouso de emergência em Budapeste após ameaça de bomba", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241316, "titulo": "Desembargador assume governo de MS após licença de governador e vice", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/desembargador-assume-governo-de-ms-apos-licenca-de-governador-e-vice", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-02T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desembargador Dorival Renato Pavan, presidente do Tribunal de Justiça de Mato Grosso do Sul, assumiu interinamente o governo após o governador Eduardo Riedel solicitar licença temporária. Pavan deve permanecer no cargo até a próxima sexta-feira, quando o governador retorna de sua licença.", "titulo_pt": "Desembargador assume governo de MS após licença de governador e vice", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 241016, "titulo": "Beijing to step up aggression: MAC official", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/03/2003867047", "fonte_id": "taipei_times", "data_pub": "2026-11-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo chinês planeja intensificar suas ações agressivas. Essa informação foi fornecida por um oficial do Serviço de Informações da Região Administrativa Especial de Macau.", "titulo_pt": "Pequim vai aumentar a agressividade: oficial do MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 241776, "titulo": "(EDITORIAL from Korea JoongAng Daily on Nov. 3)", "url": "https://en.yna.co.kr/view/AEN20261103001000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung tem postado sobre apoio por cinco dias consecutivos.", "titulo_pt": "EDITORIAL sobre postagens diárias de apoio do presidente sul-coreano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241777, "titulo": "(EDITORIAL from The Korea Times on Nov. 3)", "url": "https://en.yna.co.kr/view/AEN20261103000900315", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul, potência exportadora da Ásia, está prestes a ultrapassar os US$ 1 trilhão anualmente em exportações.", "titulo_pt": "EDITORIAL do The Korea Times: Coreia do sul prestes a superar us$ 1 trilhão em exportações anuais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241778, "titulo": "(EDITORIAL from The Korea Herald on Nov. 3)", "url": "https://en.yna.co.kr/view/AEN20261103000800315", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federal Bureau of Investigation dos Estados Unidos atribuiu à Coreia do Norte o ataque cibernético contra criptomoedas.", "titulo_pt": "EDITORIAL: fbi culpa Coreia do norte por ataque cibernético a criptomoedas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241709, "titulo": "Trump says he will not attack Iran after midterms", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-says-he-will-not-attack-iran-after-midterms", "fonte_id": "middle_east_eye", "data_pub": "2026-11-02T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou que os Estados Unidos não irão atacar a Irã após as eleições de meios de outubro. O presidente dos EUA disse que não há pressa para realizar ataques ao Irã, embora declare que algo será feito de maneira eventual.", "titulo_pt": "Trump diz que não haverá ataque à Irã após as eleições", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 241654, "titulo": "US to drop South Africa, Rwanda from duty-free trade initiative", "url": "https://www.dw.com/en/us-to-drop-south-africa-rwanda-from-duty-free-trade-initiative/a-79834508?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-02T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump anunciou que removerá South Africa e Rwanda do programa de comércio livre AGOA, pois considera que esses países estão violando as regras do programa.", "titulo_pt": "EUA removerão South Africa e Rwanda do programa de comércio livre agoa", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 241710, "titulo": "Trump says settlement with Iran possible", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-says-settlement-iran-possible", "fonte_id": "middle_east_eye", "data_pub": "2026-11-02T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente dos Estados Unidos, Donald Trump, afirmou que um acordo com o Irã 'poderia acontecer'. Segundo Trump, os preços do petróleo estão caindo drasticamente, o que indica que há uma percepção de que não haverá guerra com o Irã.", "titulo_pt": "Trump diz que acordo com o Irã é possível", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 241779, "titulo": "N. Korean leader's sister blasts FBI's crypto theft probe as 'political provocation'", "url": "https://en.yna.co.kr/view/AEN20261103000600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A irmã do líder norte-coreano rejeitou a investigação da FBI sobre o roubo de criptomoedas como uma 'provação política'. A declaração foi feita em Seul no dia 3 de novembro.", "titulo_pt": "Irmã do líder norte-coreano critica investigação da FBI como 'provação política'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241735, "titulo": "Democrats close ranks after shock Michigan defection", "url": "https://www.ft.com/content/17ea8ea2-a834-428b-8c93-bc1803ca4d9f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-02T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Haley Stevens apoiou o candidato republicano em vez do Abdul El-Sayed, o que gerou uma rápida reação negativa dos democratas.", "titulo_pt": "Democratas unem-se após surpreendente defecção de Michigan", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 241636, "titulo": "Trump promised 'no more wars'. His foreign policy tells another story", "url": "https://www.france24.com/en/tv-shows/truth-or-fake/20261102-trump-promised-no-more-wars-his-foreign-policy-tells-another-story", "fonte_id": "france24", "data_pub": "2026-11-02T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump prometeu uma política externa 'America First' e declarou que manteria os EUA longe de guerras estrangeiras. No entanto, desde o retorno ao cargo, sua administração tem sido intensamente envolvida em conflitos ao redor do mundo, incluindo a Ucrânia, a Venezuela, o Oriente Médio e a disputa com o Irã.", "titulo_pt": "Trump prometeu 'sem mais guerras'. Sua política externa conta uma história diferente", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 241690, "titulo": "Student protests resume in France as pupils return to school", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/2/student-protests-resume-in-france-as-pupils-return-to-school?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manifestações estudantis retomaram na França com a volta às aulas. Os alunos estão novamente nas ruas em protesto.", "titulo_pt": "Manifestações estudantis retomam na França com retorno às aulas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 241576, "titulo": "Are Freezers Being Hacked? Europe and the U.S. Military Are Investigating.", "url": "https://www.nytimes.com/2026/11/02/business/cyberattack-freezers-europe-us-army.html", "fonte_id": "nyt_world", "data_pub": "2026-11-02T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há uma série de interrupções em lojas de alimentos em todo o continente europeu, que alguns funcionários atribuem a ataques cibernéticos, destacando a vulnerabilidade das cadeias de suprimentos. Estabelecimentos comerciais em várias partes da Europa foram afetados novamente na segunda-feira.", "titulo_pt": "Estão sendo hackeados os Freezers? Europa e a força militar dos EUA estão investigando.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 241637, "titulo": "Uganda withdrawing troops from peacekeeping mission in Somalia", "url": "https://www.france24.com/en/uganda-withdrawing-troops-from-peacekeeping-mission-in-somalia", "fonte_id": "france24", "data_pub": "2026-11-02T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uganda está iniciando o deslocamento de tropas de sua missão de paz em Somália, apenas alguns dias após o fim da missão política da ONU naquele país. Além disso, as eleições municipais agendadas na África do Sul podem aprofundar a fragmentação política do país. A Chad enfrenta uma seca que pode ser a mais severa em mais de 40 anos.", "titulo_pt": "Uganda retira tropas da missão de paz na somália", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 241780, "titulo": "(URGENT) N. Korean leader's sister denounces FBI's crypto theft probe as 'political provocation'", "url": "https://en.yna.co.kr/view/AEN20261103000500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A irmã do líder norte-coreano negou que haja uma investigação do FBI sobre o roubo de criptomoedas como uma provocação política.", "titulo_pt": "Irmã do líder norte-coreano denuncia investigação do FBI sobre criptomoedas como provocação política", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241573, "titulo": "Odyssey ‘Endless Cruise’ Ship Stranded in Cambodia May Be Headed for Auction Block", "url": "https://www.nytimes.com/2026/11/02/travel/odyssey-cruise-ship-cambodia-auction.html", "fonte_id": "nyt_world", "data_pub": "2026-11-02T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As tentativas de arrecadar fundos para o navio Odyssey 'Endless Cruise', que está preso em Camboja, parecem ter falhado, deixando os passageiros sem saber o que fazer.", "titulo_pt": "Odyssey 'Endless Cruise' avariado em camboja pode ir para leilão", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 241330, "titulo": "Jatinho pode ter começado a se partir antes da queda, dizem EUA", "url": "https://www.poder360.com.br/poder-internacional/jatinho-pode-ter-comecado-a-se-partir-antes-da-queda-dizem-eua/", "fonte_id": "poder360", "data_pub": "2026-11-02T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Segurança nos Transportes dos EUA afirma que imagens do acidente mostram a aeronave sem o estabilizador horizontal. Isso sugere que o jatinho pode ter começado a se partir antes de cair.", "titulo_pt": "Jatinho pode ter se partido antes da queda, dizem EUA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 241040, "titulo": "Public confidence in Taiwan financial services rises to 64.1%: Survey", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/03/2003867037", "fonte_id": "taipei_times", "data_pub": "2026-11-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que a confiança pública nas serviços financeiros da Taiwan atingiu 64,1%. O estudo não fornece detalhes adicionais sobre os métodos de coleta de dados ou a data da pesquisa.", "titulo_pt": "Confiança pública nas serviços financeiros da Taiwan atinge 64,1%: pesquisa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 241688, "titulo": "Intel foundry push faces critical test after stock's 45% plunge in October", "url": "https://www.cnbc.com/2026/11/02/intel-foundry-faces-critical-test-after-stocks-45percent-plunge-in-october.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-02T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estratégia de foundry da Intel está sendo testada após uma queda de 45% em suas ações em outubro, e agora depende de provar que será capaz de expandir sua capacidade fabril e competir com a TSMC. Os clientes estão buscando sinais de que a Intel pode atender a essa demanda.", "titulo_pt": "A estratégia de foundry da intel enfrenta teste crítico após queda de 45% em outubro", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 241306, "titulo": "Vendas fortes de iPhones e Macs no 3º tri compensam desempenho mais fraco da Apple na China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/vendas-fortes-de-iphones-e-macs-no-3o-tri-compensam-desempenho-mais-fraco-da-apple-na-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Apple registrou crescimento sólido no terceiro trimestre, com vendas fortes de iPhones e Macs, mas foi afetada por vendas abaixo das expectativas na China, em seu primeiro balanço sob o comando de John Ternus.", "titulo_pt": "Vendas sólidas de iphones e Macs no 3º tri compensam desempenho fraco na China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 241689, "titulo": "Palantir reports booming U.S. commercial revenue growth, topping government for first time", "url": "https://www.cnbc.com/2026/11/02/palantir-pltr-earnings-q3-2026.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-02T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Palantir registrou um aumento de 148% na receita comercial para US$ 984 milhões, superando pela primeira vez a receita governamental de US$ 953 milhões.", "titulo_pt": "Palantir relata forte crescimento de receita comercial nos EUA, ultrapassando a receita governamental pela primeira vez", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 241496, "titulo": "Cavallo pidió levantar el cepo y emitir pesos para comprar reservas ante los riesgos de una crisis en 2027", "url": "https://www.lanacion.com.ar/economia/cavallo-pidio-levantar-el-cepo-y-emitir-pesos-para-comprar-reservas-ante-los-riesgos-de-una-crisis-nid02112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-02T21:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O exministro de Economía, Cavallo, recomendou ao Banco Central da Argentina (BCRA) que levante o cepo cambial e emita pesos para comprar reservas, sugerindo a aquisição de pelo menos 15.000 milhões de dólares em doze meses. Ele alertou para possíveis novos choques externos e ressaltou a importância de manter a relação com o Brasil.", "titulo_pt": "Cavallo sugere levantar o cepo e emitir pesos para comprar reservas ante riscos de crise em 2027", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 241737, "titulo": "Apple’s strong iPhone and Mac sales offset weaker performance in China", "url": "https://www.ft.com/content/f6ad8c32-cacb-48ad-ad85-a9a7edac3f16?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-02T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple relatou receita sólida no terceiro trimestre, com vendas fortes de iPhones e Macs que compensaram uma performance mais fraca na China. A empresa informou que aguarda uma projeção crucial sobre as vendas durante as festas de fim de ano.", "titulo_pt": "Vendas fortes de iphones e macs compensam desempenho fraco na China, diz apple", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 241307, "titulo": "Rede social faz acordo em caso sobre depressão e transtornos alimentares", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/rede-social-faz-acordo-em-caso-sobre-depressao-e-transtornos-alimentares.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Snap, proprietária do Snapchat, chegou a um acordo durante um julgamento sobre ações movidas por dois adolescentes que alegam ter sofrido depressão, ansiedade e distúrbios alimentares devido à dependência da plataforma. Os advogados dos autores informaram sobre o acordo nesta segunda-feira (2 de fevereiro de 2026).", "titulo_pt": "Snapchat chega a acordo em caso sobre depressão e transtornos alimentares", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 241414, "titulo": "Custo dos juros da dívida rural sobe 191% em quatro anos, mostra Cepea", "url": "https://www.cnnbrasil.com.br/agro/custo-dos-juros-da-divida-rural-sobe-191-em-quatro-anos-mostra-cepea/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O custo dos juros da dívida rural aumentou 191% em quatro anos, conforme mostrado pelo Cepea. A inadimplência atingiu 9,69% em agosto de 2026, o maior percentual desde o início da série histórica do Banco Central em 2011.", "titulo_pt": "Custo dos juros da dívida rural sobe 191% em quatro anos, mostra estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241416, "titulo": "Soja recua 1,42% em Chicago com pressão da nova safra dos EUA", "url": "https://www.cnnbrasil.com.br/agro/soja-recua-142-em-chicago-com-pressao-da-nova-safra-dos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As cotações da soja recuaram 1,42% em Chicago devido às expectativas de aumento da produtividade e dos estoques americanos, apesar de novas vendas para a China.", "titulo_pt": "Soja cai 1,42% em Chicago com expectativa de maior produtividade e estoques americanos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241503, "titulo": "El dólar tocó el valor más alto del año y el riesgo país superó los 800 puntos", "url": "https://www.lanacion.com.ar/economia/mercados-el-dolar-oficial-toca-el-valor-mas-alto-del-ano-aunque-avanzo-menos-que-la-inflacion-nid02112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-02T21:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar atingiu o valor mais alto do ano, chegando a R$ 1565 no Banco Nación, enquanto o índice de riesgo país, elaborado pela JP Morgan, registrou 805 pontos. O Banco Central não interveio no mercado.", "titulo_pt": "O dólar atingiu o valor mais alto do ano e o riesgo país superou os 800 pontos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 241523, "titulo": "Concha y Toro estima que podría recaudar hasta US$350 millones con venta de terrenos", "url": "https://www.latercera.com/pulso/noticia/concha-y-toro-estima-que-podria-recaudar-hasta-us350-millones-con-venta-de-terrenos/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T21:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Concha y Toro planeja vender ativos imobiliários e avaliar aquisições de outras empresas vitivinícolas como parte de sua estratégia para os próximos anos. A empresa projeta superar vendas de 1 bilhão de pesos chilenos até 2030 e potencialmente arrecadar até 350 milhões de dólares com a venda de terrenos.", "titulo_pt": "Concha e Toro estima arrecadar até 350 milhões de dólares com venda de terrenos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 241524, "titulo": "ILC concreta su reorganización societaria y Vida Cámara pasa a ser filial de Red Salud", "url": "https://www.latercera.com/pulso/noticia/ilc-concreta-su-reorganizacion-societaria-y-vida-camara-pasa-a-ser-filial-de-red-salud/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T21:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ILC concretou sua reorganização societária e Vida Câmara passou a ser uma filial de Red Salud. A modificação societária foi proposta em julho deste ano e aprovada meses depois.", "titulo_pt": "ILC concretiza reorganização societária e Vida câmara se torna filial de Red Salud", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 241417, "titulo": "Bitcoin cai após ataque à Binance e mercado aguarda eleições nos EUA", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bitcoin-cai-apos-ataque-a-binance-e-mercado-aguarda-eleicoes-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin caiu 1,19%, atingindo US$ 76.860,55, enquanto o Ethereum perdeu 0,45%, valendo US$ 2.250,87, nas últimas 24 horas. Essas quedas ocorreram após um ataque à exchange Binance e à espera das eleições nos Estados Unidos.", "titulo_pt": "Bitcoin cai após ataque à Binance e mercado aguarda eleições nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241309, "titulo": "Um investidor conservador deveria ter ações na carteira?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/um-investidor-conservador-deveria-ter-acoes-na-carteira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Para a American Association of Individual Investors, uma carteira com 40% do patrimônio investido em ações pode ser considerada conservadora. Essa alocação faz parte da sua carteira-modelo destinada a investidores com um horizonte de pelo menos dez anos.", "titulo_pt": "Investidor conservador: 40% em ações na carteira?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 241342, "titulo": "Petróleo despenca mais de 7% com expectativa de acordo entre EUA e Irã", "url": "https://veja.abril.com.br/economia/petroleo-despenca-em-mais-de-7-com-expectativa-de-acordo-entre-eua-e-ira/", "fonte_id": "veja", "data_pub": "2026-11-02T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo caiu mais de 7% devido às expectativas de um acordo entre EUA e Irã, que poderia levar à reabertura do Estreito de Ormuz. Isso aumentou o otimismo nos mercados após semanas de tensão e ameaças ao transporte de petróleo.", "titulo_pt": "Petróleo despenca mais de 7% com expectativa de acordo entre EUA e Irã", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 241311, "titulo": "Ataqu
