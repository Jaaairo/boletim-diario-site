<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>

 Lula encerrou sua participação na COP31 cobrando das nações ricas, incluindo os Estados Unidos e países europeus, financiamento para enfrentar a crise climática. Além disso, o Congresso dos Estados Unidos aprovou um projeto de lei que visa proteger pequenas empresas americanas de ameaças estrangeiras, incluindo a Coreia do Norte. No entanto, a Ucrânia informou que as restrições ao serviço Starlink foram reinstaladas, enquanto enviados dos Estados Unidos se encontram com Vladimir Putin em Moscou, enfrentando dificuldades para interceptar drones aéreos propelidos por jatos russos.\n\nA geopolítica global continua em um estado de tensão, com destaque para a crise na Ucrânia e os conflitos regionais. O presidente russo, Vladimir Putin, rejeitou a ideia de recuar em suas exigências territoriais na Ucrânia, reafirmando seu controle sobre quatro regiões ucranianas que Moscou afirma ter anexado. As tensões persistem, com ataques aéreos israelenses a hospitais em Gaza e ações de bombardeios russos em Kyiv, apesar de um cessar-fogo que já dura um ano. Além disso, a China enfrenta pressões para sediar a secretaria do Tratado das Águas do Mar Aberto, enquanto Taiwan anuncia o fechamento de sua representação em Papua-Nova Guiné devido à política de 'um-China'. O cenário geopolítico continua instável, com potenciais reuniões entre líderes globais e novos desafios emergindo em diversos pontos do mundo.", "economia": "A economia enfrenta diversos desafios em diferentes setores. A Petrobras fechou um acordo para adquirir 100% da Logum Logística, empresa especializada no transporte e armazenamento de etanol, por R$ 620 milhões. Esta aquisição ainda depende de condições precedentes. Além disso, a inflação oficial no Brasil ficou em 0,14% em outubro, uma queda em relação a setembro, com o IPCA acumulando 4,63% nos 12 meses anteriores. A inflação dos alimentos atingiu o maior nível em quatro anos, com destaque para o aumento de 19,57% no tomate e 11,29% na cebola. Em outro desenvolvimento, a Anvisa suspendeu a venda de queijo muçarela da marca Italy devido à presença de Listeria monocytogenes. Por outro lado, a Nvidia negou a renúncia de seu CEO, Jensen Huang, após se envolver em um escândalo de relacionamentos extraconjugais, com suas ações caindo mais de 14% na Nasdaq. O STJ validou as regras estabelecidas pela ANS sobre o pagamento de planos coletivos por adesão, enquanto o Banco do Brasil registrou uma recuperação mais lenta da lucratividade no terceiro trimestre, devido a uma piora significativa na inadimplência da carteira de crédito do agronegócio.", "tecnologia": "Jensen Huang, fundador e CEO da Nvidia, renunciou ao cargo devido a uma investigação sobre um affair com uma suposta agente de inteligência chinesa. Sua saída pode afetar as relações financeiras que contribuíram para o crescimento do setor de inteligência artificial e desestruturar as relações tecnológicas entre Washington e Beijing. Colette Kress, chefe financeira da Nvidia, assumiu interinamente a posição de CEO. A renúncia de Huang também levantou preocupações sobre a crise no campo da inteligência artificial, com a destruição da confiança entre especialistas e leitores devido à disseminação de fraudes literárias. Além disso, a Nvidia enfrenta concorrência para o cargo de CEO, com executivos de empresas rivais e até mesmo os filhos de Huang em disputa. A saída de Huang também impactou a operação da empresa de drones Quantum Systems, que teve seus sistemas de drones suspensos após um ataque cibernético.", "ciencia": "As notícias científicas do mês foram lideradas pela NASA e pela Agência Espacial Europeia. A missão Euclid divulgou dados sobre mais de 900 milhões de galáxias, enquanto a NASA's Hubble Space Telescope capturou imagens de lentes gravitacionais. A pesquisa sobre o cogumelo Galerina, que contém uma substância psicodélica e uma toxina mortal, também merece destaque. O El Niño continua sua influência no Oceano Pacífico e deve permanecer com intensidade 'muito forte' até março de 2027, com mais de 73% de chance de ser o mais intenso já registrado. A American Cancer Society revisou suas diretrizes de screening para câncer de próstata, recomendando exames de PSA rotineiros para homens entre 50 e 69 anos. Além disso, a descoberta do asteroide Ryugu, que pode ter formado durante a primeira geração de blocos planetários do início do sistema solar, também é notável. Por fim, a missão Hera da Europa está prestes a iniciar sua exploração do asteroide binário Didymos, proporcionando oportunidades científicas em duas frentes.", "cultura": "O evento mais importante dos artigos é a homenagem póstuma à atriz Nicole Kidman, que receberá um prêmio honorário do César, principal prêmio do cinema francês, durante a 52ª edição do festival em fevereiro de 2027 em Paris. No campo da cultura independente, a banda Wry, formada por jovens de Sorocaba, retorna à cidade natal após anos vivendo no exterior. O documentário 'Suzane von Richthofen: O que o Tempo Não Apaga', lançado na Netflix, oferece uma visão sobre o caso sem depoimentos diretos da protagonista. O Festival Revelando SP, em São Paulo, oferece música, culinária e manifestações culturais gratuitas até 15 de novembro. A exposição 'A Longa Sombra: Japão Pós-Guerra através da Lente' no Metropolitan Museum of Art em Nova York reúne fotografias de 15 fotógrafos japoneses que documentaram o país após a Segunda Guerra Mundial, com mais de 25 livros e revistas e uma instalação de vídeo. Destaca-se também a transferência de propriedade de uma vasilha de David Drake pelo museu de Newark, e o resgate de um mural pintado com críticas ao Brexit por um limpa-vidros. Outras notícias incluem o show único do The Jacksons em São Paulo em 2027, a transferência de um escultor de Jean Arp roubado de uma galeria durante Art Cologne, e a confirmação de que o mural de Banksy foi resgatado em um local secreto.", "sociedade": "Os Estados Unidos registraram uma redução significativa nos homicídios nas maiores cidades do país, com uma queda de 15,2% até setembro de 2026, de acordo com um relatório da Associação de Chefes de Polícias de Grandes Cidades. Em contraste, a Austrália enfrenta um aumento no número de jovens envolvidos em extremismo, com 32 dos 37 jovens processados em casos de terrorismo desde 2020 acusados nos últimos dois anos. Além disso, um homem foi preso por abusar sexualmente de sua filha adolescente por seis anos, desde que ela tinha 8 anos, com os abusos ocorrendo até o último dia de novembro. O Distrito Federal oferece 958 oportunidades de emprego com salários de até R$ 5 mil, enquanto a polícia penal do Rio de Janeiro prendeu um suspeito de estuprar uma mulher em setembro.", "meio_ambiente": "A COP31 em Belém, no Brasil, continua com debates importantes sobre o clima e a transição energética. Greta Thunberg criticou os governos por falhas na prevenção do colapso ambiental, enfatizando a urgência de ações mais efetivas. O ministro João Paulo Capobianco defendeu a compatibilidade entre petróleo e transição energética, refletindo a complexidade das discussões. Além disso, a conferência abordou temas como o uso de lã de ovelha para retardar o deshielo de glaciares e o rápido avanço do aquecimento global, que já consumiu quase toda a margem de segurança climática estabelecida pelo Acordo de Paris.", "direitos_humanos": "Desde o amanhecer, dez palestinos foram mortos em ataques israelenses em Gaza, incluindo dois ataques a hospitais que resultaram em pelo menos sete mortes. Um ataque noturno a um hospital médico Nasser em Khan Younis causou a morte de seis pessoas, entre elas cirurgiões e pacientes, e um ataque a um veículo por um drone israelense no sul de Deir al-Balah também resultou em várias vítimas. Em outro evento, as autoridades turcas fecharam o escritório da organização LGBTQ+ mais antiga do país, Lambda Istanbul, alegando que era um 'clube social não autorizado', visando 'isolar' pessoas LGBTQ+ e privá-las de um espaço para organizar-se. Um relatório da fundação Ajuda à Igreja que Sofre (ACN) revela que a perseguição contra cristãos aumentou entre 2024 e 2026, após o avanço do terrorismo na África. Além disso, uma mãe chilena reencontrou seus filhos após 40 anos, que foram levados durante o regime de Pinochet, e um indivíduo de 20 anos foi preso em Hong Kong sob suspeita de divulgar informações pessoais de 15 vítimas online sem consentimento, em relação a empréstimos não pagos. Por fim, uma organização de direitos humanos informou que as Nações Unidas e oficiais sul-sudaneses falharam em prevenir o massacre em um vilarejo, onde mais de 200 pessoas foram mortas, apesar de as forças de paz terem conhecimento de um possível ataque em Abiemnom."}, "resumo_do_dia": {"politica_nacional": [{"id": 259204, "titulo": "Federação com partidos médios avança, mas dirigentes disputam comando", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/federacao-com-partidos-medios-avanca-mas-dirigentes-disputam-comando.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSB e o PDT devem avançar em torno da federação com os partidos Avante, Solidariedade e PRD na próxima semana, mas já há disputa pelo comando do grupo entre as legendas.", "titulo_pt": "Federação com partidos médios avança, mas há disputa pelo comando", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 259302, "titulo": "O mais novo embate entre Lula e Sergio Moro sobre o triplex do Guarujá", "url": "https://veja.abril.com.br/brasil/o-mais-novo-embate-entre-lula-e-sergio-moro-sobre-o-triplex-do-guaruja/", "fonte_id": "veja", "data_pub": "2026-11-12T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça determinou que a OAS receba o valor do leilão do imóvel atribuído ao petista pelo caso Lava-Jato. O governador eleito do Paraná rebateu o incidente.", "titulo_pt": "Novo embate entre Lula e Moro sobre o triplex do Guarujá", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 259240, "titulo": "'É um escárnio', diz Cleitinho sobre licitação de R$ 6 milhões para celulares no Senado", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/11/12/cleitinho-celulares-senado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-12T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Cleitinho, governador eleito de Minas Gerais, criticou a licitação do Senado Federal que prevê gastos de R$ 6 milhões com serviços de telefonia, incluindo o fornecimento de iPhones para parlamentares e servidores. Ele considerou o gasto um 'escárnio' e afirmou que os senadores estão desconectados.", "titulo_pt": "Cleitinho chama de 'escárnio' gasto de R$ 6 milhões com celulares no Senado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 259182, "titulo": "Conselho da Braskem discute novas propostas de credores nesta quinta (12)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/conselho-da-braskem-discute-novas-propostas-de-credores-nesta-quinta-12.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conselho de administração da Braskem vai discutir propostas de credores nesta quinta-feira. Os termos das propostas não atendem ainda às expectativas do grupo de controle da companhia, composto pela Petrobras e pelo fundo IG4.", "titulo_pt": "Conselho da Braskem discute novas propostas de credores nesta quinta", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259241, "titulo": "Fim da escala 6x1: Dino mantém transição e autoriza distribuição de 42 horas semanais em 5 dias de trabalho", "url": "https://g1.globo.com/politica/noticia/2026/11/12/fim-da-escala-6x1-dino-autoriza-distribuicao-de-42-horas-semanais-em-5-dias-de-trabalho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-12T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino autorizou a distribuição de 42 horas semanais em 5 dias de trabalho, na escala 5x2, sem a incidência de adicional de hora extra. Esta decisão vale para a etapa de transição da PEC do Fim da Escala 6x1, que reduziu a jornada máxima de trabalho no país de 44 para 40 horas semanais.", "titulo_pt": "Fim da escala 6x1: dino autoriza distribuição de 42 horas semanais em 5 dias de trabalho", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 259242, "titulo": "Senado deve votar pacote de medidas fiscais nesta quinta", "url": "https://g1.globo.com/politica/ao-vivo/senado-pacote-medidas-fiscais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-12T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado deve votar um pacote de medidas fiscais nesta quinta-feira. O projeto proposto pelo governo Lula visa estabilizar a dívida pública e limitar o crescimento de gastos em caso de queda de arrecadação, com a expectativa de melhorar o resultado primário em cerca de R$ 50 bilhões em 2027.", "titulo_pt": "Senado vota pacote de medidas fiscais nesta quinta", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 259396, "titulo": "Governo acelerará indicações e ajuste em “contagem regressiva” no Congresso", "url": "https://www.cnnbrasil.com.br/politica/governo-acelerara-indicacoes-e-ajuste-em-contagem-regressiva-no-congresso/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula planeja acelerar as indicações para os órgãos como STF, BC, Cade e agências, bem como implementar novas medidas de ajuste fiscal, antes da renovação do Congresso.", "titulo_pt": "Governo acelerará indicações e ajuste em 'contagem regressiva' no Congresso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 259328, "titulo": "Ajuste fiscal pode tirar R$ 2 bilhões do DF; Celina e parlamentares reagem", "url": "https://www.metropoles.com/colunas/grande-angular/ajuste-fiscal-pode-tirar-r-2-bilhoes-do-df-celina-e-parlamentares-reagem", "fonte_id": "metropoles", "data_pub": "2026-11-12T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares da bancada do Distrito Federal se mobilizam contra um projeto do governo federal que pode reduzir em R$ 2 bilhões os repasses financeiros ao DF. Eles apresentaram emendas para tentar impedir a redução.", "titulo_pt": "Ajuste fiscal pode cortar R$ 2 bilhões no DF; parlamentares reagem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 259329, "titulo": "Congresso libera R$149,4 bilhões para custear Previdência e Bolsa Família", "url": "https://www.metropoles.com/brasil/congresso-libera-r1494-bilhoes-para-custear-previdencia-e-bolsa-familia", "fonte_id": "metropoles", "data_pub": "2026-11-12T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputados e senadores aprovaram uma sessão conjunta que liberou R$149,4 bilhões para custear programas como Previdência e Bolsa Família.", "titulo_pt": "Congresso libera R$149,4 bilhões para custear Previdência e Bolsa Família", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 259399, "titulo": "6×1: Dino mantém cronograma e pede que Congresso discuta regimes especiais", "url": "https://www.cnnbrasil.com.br/politica/6x1-dino-mantem-cronograma-e-pede-que-congresso-discuta-regimes-especiais/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro manteve a redução da jornada de trabalho para 42 horas em dezembro e solicitou ao Congresso que discuta e regulamente, em até 180 dias, regimes especiais de trabalho. A decisão também permite a flexibilização na distribuição de folgas.", "titulo_pt": "6×1: Dino mantém redução da jornada e pede discussão de regimes especiais no Congresso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 259184, "titulo": "Justiça impede posse de aprovado em concurso da Polícia Federal após suspeita de fraude", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/justica-impede-posse-de-aprovado-em-concurso-da-policia-federal-apos-suspeita-de-fraude.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação nesta quinta-feira (12) para investigar suspeitas de fraude em um concurso público de 2025 para a própria corporação. A justiça impede a posse de um aprovado no concurso por suspeitas de irregularidades.", "titulo_pt": "Justiça impede posse de aprovado em concurso da Polícia Federal após suspeita de fraude", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259243, "titulo": "Fachin marca reunião com STJ e do TSE para discutir a proposta de reforma do sistema de Justiça", "url": "https://g1.globo.com/politica/noticia/2026/11/12/fachin-marca-reuniao-com-stj-e-do-tse-para-discutir-a-proposta-de-reforma-do-sistema-de-justica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-12T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal, Edson Fachin, planeja uma reunião com ministros do STF, além de representantes do STJ e do TSE, para discutir a proposta de reforma do sistema Judiciário brasileiro. A reunião está programada para a próxima semana e visa à conclusão do relatório do grupo criado por Fachin até dezembro, embora haja discussão sobre a possibilidade de prorrogação das atividades.", "titulo_pt": "Fachin agendará reunião para discutir reforma do sistema judiciário", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 259185, "titulo": "Dino mantém período de transição para o fim da escala 6x1 e permite flexibilizar folgas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/dino-mantem-periodo-de-transicao-para-o-fim-da-escala-6x1-e-permite-flexibilizar-folgas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Flávio Dino manteve o período de transição para o fim da escala 6x1, com a nova regra para a jornada de trabalho entrando em vigor em 16 de dezembro. A decisão será avaliada pelo plenário da corte.", "titulo_pt": "Dino mantém período de transição para fim da escala 6x1 e permite flexibilizar folgas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259205, "titulo": "Corte Especial do STJ zera pauta e julga 3.200 processos em menos de três meses", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/corte-especial-do-stj-zera-pauta-e-julga-3200-processos-em-menos-de-tres-meses.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Corte Especial do STJ julgou 3.219 processos em menos de três meses, entre 20 de agosto e 10 de novembro, e concluiu todos os 47 casos que estavam na pauta inicialmente.", "titulo_pt": "Corte Especial do STJ zera pauta e julga 3.200 processos em menos de três meses", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 259206, "titulo": "Congresso tem nas mãos a saída para os supersalários", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/transparencia-publica/2026/11/congresso-tem-nas-maos-a-saida-para-os-supersalarios.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo incluiu de forma simbólica o combate aos supersalários no pacote de ajuste fiscal enviado ao Senado, com prazo de 120 dias para o Congresso votar uma regulamentação das verbas indenizatórias. O tema teve o apoço de 83% dos brasileiros, segundo o Datafolha.", "titulo_pt": "Congresso tem nas mãos a saída para os supersalários", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 259188, "titulo": "Juiz manda vereador de Curitiba retirar conteúdo que incita demissão de petistas, sob pena de multa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/juiz-manda-vereador-de-curitiba-retirar-conteudo-que-incita-demissao-de-petistas-sob-pena-de-multa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz Guilherme Mayer Amin, da 8ª Vara do Trabalho de Curitiba, determinou que o vereador Guilherme Kilter retire conteúdos em suas redes sociais que incitam a demissão de trabalhadores por causa do voto no presidente Lula, sob pena de multa de R$ 50 mil.", "titulo_pt": "Juiz determina que vereador retire conteúdo que incita demissão de petistas, com multa de r$ 50 mil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 259299, "titulo": "Putin descarta recuar de exigências territorias na Ucrânia, mas oferece trégua local", "url": "https://veja.abril.com.br/mundo/putin-descarta-recuar-de-exigencias-territorias-na-ucrania-mas-oferece-tregua-local/", "fonte_id": "veja", "data_pub": "2026-11-12T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente russo, Putin, rejeitou a ideia de recuar em suas exigências territoriais na Ucrânia durante uma reunião com representantes de Donald Trump. Ele também negou a possibilidade de forças de manutenção de paz estrangeiras no conflito.", "titulo_pt": "Putin descarta recuar em exigências territoriais na Ucrânia, mas oferece trégua local", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 259719, "titulo": "Israel says it will ban French leftist leader Mélenchon from entry", "url": "https://www.lemonde.fr/en/international/article/2026/11/12/israel-says-it-will-ban-french-leftist-leader-melenchon-from-entry_6778873_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-12T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Israel anunciou que irá banir o candidato presidencial francês de esquerda Jean-Luc Mélenchon e um de seus líderes partidários do país, afirmando que eles agem contra Israel e incitam contra seus cidadãos.", "titulo_pt": "Israel anunciará banimento de líder esquerdista francês Mélenchon", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 259292, "titulo": "Putin recebe enviados de Trump e rejeita tropas europeias", "url": "https://www.poder360.com.br/poder-internacional/putin-recebe-enviados-de-trump-e-rejeita-tropas-europeias/", "fonte_id": "poder360", "data_pub": "2026-11-12T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente russo, Putin, rejeitou a proposta de zonas desmilitarizadas na divisão territorial e sugeriu uma missão humanitária em Kostiantynivka. Além disso, Putin recebeu enviados do presidente americano, Trump.", "titulo_pt": "Putin rejeita zonas desmilitarizadas e propõe missão humanitária", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 259844, "titulo": "Il nuovo Congresso indagherà su ok della Casa Bianca a vendita chip Nvidia alla Cina", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/12/il-nuovo-congresso-indaghera-su-ok-della-casa-bianca-a-vendita-chip-nvidia-alla_cfafb543-6f9a-4ff9-827b-1a8dd48d2268.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-12T17:49:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O novo Congresso investigará a aprovação da venda do chip Nvidia para a China pela Casa Branca. Jeffries afirma que há mais perguntas do que respostas sobre um caso de segurança nacional.", "titulo_pt": "Novo Congresso investigará aprovação da venda do chip Nvidia para a china pela Casa branca", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 259383, "titulo": "EUA: Rubio, Vance e Ossoff largam na frente na corrida de 2028, diz pesquisa", "url": "https://www.infomoney.com.br/mundo/eua-rubio-vance-e-ossoff-largam-na-frente-na-corrida-de-2028-diz-pesquisa/", "fonte_id": "infomoney", "data_pub": "2026-11-12T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa concluída na segunda-feira, seis dias após as eleições de meio de mandato, indica que Rubio, Vance e Ossoff estão na frente na corrida para as eleições de 2028 nos Estados Unidos.", "titulo_pt": "EUA: rubio, Vance e Ossoff lideram na corrida para 2028, de acordo com pesquisa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 259729, "titulo": "Israel to ban far-left French politician Jean-Luc Mélenchon from entry", "url": "https://www.france24.com/en/middle-east/20261112-israel-to-ban-far-left-french-politician-jean-luc-m%C3%A9lenchon-from-entry", "fonte_id": "france24", "data_pub": "2026-11-12T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo israelense anunciou que irá banir o político francês de extrema-esquerda Jean-Luc Mélenchon da entrada no país. Mélenchon havia afirmado que, se eleito, usaria navios franceses para forçar a entrada de ajuda em Gaza.", "titulo_pt": "Israel banirá político francês Jean-Luc Mélenchon da entrada no país", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 259295, "titulo": "Lula cobra Trump e europeus por financiamento climático na COP31", "url": "https://www.poder360.com.br/poder-governo/lula-cobra-trump-e-europeus-por-financiamento-climatico-na-cop31/", "fonte_id": "poder360", "data_pub": "2026-11-12T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula encerrou sua participação na COP31 cobrando das nações ricas, incluindo os Estados Unidos e países europeus, financiamento para enfrentar a crise climática.", "titulo_pt": "Lula cobra Trump e europeus por financiamento climático na COP31", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 259845, "titulo": "Il prezzo del gas corre e sfiora i 94 euro con tensioni Medioriente", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/12/il-prezzo-del-gas-corre-e-sfiora-i-94-euro-con-tensioni-medioriente_b2c4afc3-ebdf-49b0-8b94-1ab7e8a768ca.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-12T17:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O preço do gás natural registrou um aumento de 8% nos contratos TTF em Amsterdã. As tensões no Oriente Médio estão contribuindo para a volatilidade.", "titulo_pt": "Preço do gás atinge marca próxima a 94 euros com tensões no oriente médio", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 259858, "titulo": "European leaders reject Russian push to overhaul continent’s security", "url": "https://www.ft.com/content/8d28a5be-af56-421f-a33d-779a0fcc7ad4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes europeus rejeitaram as tentativas da Rússia de reformular a segurança continental. Após as conversas em Abu Dhabi, Zelenskyy alerta que Europa deve prestar atenção.", "titulo_pt": "Líderes europeus rejeitam propostas russas de reformular segurança continental", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 259824, "titulo": "Yemen's Houthis say they attacked pumping station on Saudi Arabia's East-West oil Pipeline", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/yemens-houthis-say-they-attacked-pumping-station-saudi-arabias-east-west", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os hutis, aliados do Irã, afirmaram ter atacado uma estação de bombagem em uma das linhas de petróleo da Arábia Saudita e uma instalação petroquímica em Yanbu. A Arábia Saudita não confirmou imediatamente a declaração dos hutis.", "titulo_pt": "Hutis afirmam ter atacado estações de bombagem e instalação petroquímica na arábia saudita", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 259730, "titulo": "‘Labelled terrorists’: How France is using anti-terror powers to deter protests", "url": "https://www.france24.com/en/france/20261112-labelled-terrorists-france-authorities-used-anti-terrorism-powers-to-deter-protests", "fonte_id": "france24", "data_pub": "2026-11-12T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo francês tem sido acusado de usar uma lei antiterrorista adotada após os ataques de 2015 em Paris como uma ferramenta para impedir que dezenas de pessoas participem de grandes protestos em todo o país. Advogados e grupos de direitos humanos denunciam um abuso de poder que pode ter consequências perigosas para a liberdade individual e o direito de protestar.", "titulo_pt": "Etiquetados como terroristas: como a França está usando leis antiterroristas para deter protestos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 259765, "titulo": "“The rules-based international order is breaking down,” Thailand’s Foreign Minister warns", "url": "https://www.euronews.com/2026/11/12/the-rules-based-international-order-is-breaking-down-thailands-foreign-minister-warns", "fonte_id": "euronews", "data_pub": "2026-11-12T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores da Tailândia alerta que o ordenamento internacional baseado em regras está desmoronando. A Tailândia é descrita como uma 'zona geopolítica segura' em um mundo onde as regras internacionais estariam se desintegrando.", "titulo_pt": "O ordenamento internacional baseado em regras está desmoronando, avisa o ministro das relações exteriores da tailândia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 259432, "titulo": "Democratas ampliam domínio no Senado nos EUA com vitória no Mississipi", "url": "https://www.dw.com/pt-br/democratas-ampliam-domínio-no-senado-nos-eua-com-vitória-no-mississipi/a-79933955?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-12T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os democratas expandiram seu domínio no Senado dos Estados Unidos com uma vitória no Mississippi, em uma eleição que representou um duro revés para Trump. Scott Colom foi o candidato vitorioso, consolidando uma vitória democrata em um estado tradicionalmente republicano.", "titulo_pt": "Democratas ampliam domínio no Senado com vitória no mississippi", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 259233, "titulo": "EUA batem recorde de prisões e deportações de imigrantes na história", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/eua-batem-recorde-de-prisoes-e-deportacoes-de-imigrantes-na-historia.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-12T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump registrou um recorde de detenções e deportações de imigrantes nos Estados Unidos no último ano fiscal. Este é o maior número na história do país.", "titulo_pt": "EUA batem recorde de prisões e deportações de imigrantes na história", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 259586, "titulo": "Putin says Russia would target foreign troops deployed to Ukraine", "url": "https://www.theguardian.com/world/2026/nov/12/vladimir-putin-russia-target-foreign-troops-ukraine-elon-musk-starlink", "fonte_id": "guardian_world", "data_pub": "2026-11-12T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Putin advertiu os negociadores americanos que a Rússia atacaria tropas estrangeiras em Ucrânia. Durante reuniões no Kremlin com Jared Kushner e Steve Witkoff, o presidente russo rejeitou softening suas demandas territoriais, reafirmando seu controle sobre quatro regiões ucranianas que Moscou afirma ter anexado.", "titulo_pt": "Putin ameaça atacar tropas estrangeiras em Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 259825, "titulo": "Dutch foreign minister declines to deny talks are under way on curbing ICC powers", "url": "https://www.middleeasteye.net/news/dutch-foreign-minister-declines-rule-out-talks-curbing-icc-powers", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro dos Negócios Estrangeiros dos Países Baixos, Tom Berendsen, evitou negar que haja discussões em andamento para limitar o poder do Tribunal Penal Internacional (TPI). Questionado sobre possíveis restrições que poderiam proteger oficiais israelenses e americanos de serem processados, Berendsen não descartou a possibilidade.", "titulo_pt": "Ministro dos países baixos não descarta discussões sobre limitar poder do tpi", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 259782, "titulo": "Nebius falls 16% as company expects increased 2026 capex spend, issues weak outlook", "url": "https://www.cnbc.com/2026/11/12/nebius-q3-earnings-report-2026.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-12T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nebius registrou uma queda de 16% em suas ações após divulgar seu relatório financeiro, enquanto suas concorrentes IREN e CoreWeave apresentaram resultados melhores do que o esperado recentemente. A empresa espera um aumento no gasto de capital em 2026 e divulgou uma perspectiva fraca para o futuro.", "titulo_pt": "Nebius cai 16% após divulgar resultados fracos e prever aumento de gastos em 2026", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 259394, "titulo": "Inflação dos EUA está acima da meta e pede cautelosa do Fed, diz dirigente", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/inflacao-dos-eua-esta-acima-da-meta-e-pede-cautelosa-do-fed-diz-dirigente/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dirigente Austan Goolsbee alertou que a inflação nos Estados Unidos está acima da meta e exige uma abordagem cautelosa por parte do Federal Reserve. Segundo ele, o relatório de outubro, que mostrou uma aceleração acima da média, não foi um caso isolado.", "titulo_pt": "Inflação nos EUA acima da meta e requer cautela do Fed, diz dirigente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 259180, "titulo": "Sem concorrentes, Conasa arremata Rota Arco Norte, que liga Mato Grosso ao Pará", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/sem-concorrentes-conasa-arremata-rota-arco-norte-que-liga-mato-grosso-ao-para.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Conasa arrematou a Rota Arco Norte (BR-163/MT/PA) em um leilão sem concorrentes realizado na B3, a Bolsa de Valores de São Paulo. A empresa ofereceu um desconto de 0,01% sobre a tarifa básica de pedágio.", "titulo_pt": "Conasa arremata Rota Arco Norte em leilão sem concorrentes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259181, "titulo": "Entidades empresariais criticam proposta prevista no 'plano Moretti' que limita compensação de tributos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/entidades-empresariais-criticam-proposta-prevista-no-plano-moretti-que-limita-compensacao-de-tributos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades empresariais criticaram a proposta do 'plano Moretti' que limita a compensação de tributos, medida analisada pelo Congresso Nacional na semana passada.", "titulo_pt": "Empresários criticam proposta que limita compensação de tributos no 'plano Moretti'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259500, "titulo": "Inflación de octubre, EN VIVO: cuál es el IPC acumulado y qué proyectan las consultoras para este año", "url": "https://www.lanacion.com.ar/economia/inflacion-de-octubre-en-vivo-cual-es-el-ipc-acumulado-y-que-proyectan-las-consultoras-para-este-ano-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T17:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As estimativas privadas situam o Índice de Preços ao Consumidor (IPC) para outubro entre 1,8% e 2,1%. As consultorias econômicas e as definições governamentais ainda não forneceram suas projeções para este ano.", "titulo_pt": "Inflação de outubro, ao VIVO: qual é o IPC acumulado e quais são as projeções para este ano?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 259183, "titulo": "Uber é proibida pela Justiça do Trabalho de cobrar taxa de motorista no Brasil; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/uber-e-proibida-pela-justica-do-trabalho-de-cobrar-taxa-de-motorista-no-brasil-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trabalho suspendeu a cobrança da taxa 'Passe para Motoristas' pela Uber em todo o Brasil. A empresa não pode exigir taxas de assinatura ou acesso como  "titulo_pt": "Petrobras adquire 100% da Logum logística", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 259194, "titulo": "Big techs foram alvo de 133 mil queixas por contas banidas; vítimas apontam perda de renda e sofrimento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/big-techs-foram-alvo-de-133-mil-queixas-por-contas-banidas-vitimas-apontam-perda-de-renda-e-sofrimento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T15:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta (controladora do Facebook e Instagram) e Google receberam 132,9 mil reclamações na plataforma Consumidor.gov relacionadas à perda de acesso às contas. O tema foi o mais comum entre mais de 270 mil queixas registradas contra empresas de tecnologia entre 2021 e maio de 2026.", "titulo_pt": "Big techs foram alvo de 133 mil queixas por contas banidas; vítimas apontam perda de renda e sofrimento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259195, "titulo": "PF investiga aplicação de R$ 6 milhões de previdência municipal no Master e no Daycoval", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/pf-investiga-aplicacao-de-r-6-milhoes-de-previdencia-municipal-no-master-e-no-daycoval.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga suspeitas de irregularidades na aplicação de R$ 6 milhões de recursos da previdência dos servidores municipais de São Gabriel do Oeste, em Mato Grosso do Sul, nos bancos Master e Daycoval. A operação foi deflagrada nesta quinta-feira (12).", "titulo_pt": "PF investiga aplicação de R$ 6 milhões de previdência municipal em bancos Master e Daycoval", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259196, "titulo": "BB tem cenário preocupante à frente e amplia distância de pares privados, dizem analistas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/bb-tem-cenario-preocupante-a-frente-e-amplia-distancia-de-pares-privados-dizem-analistas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco do Brasil registrou uma recuperação mais lenta da lucratividade no terceiro trimestre, devido a uma piora significativa na inadimplência da carteira de crédito do agronegócio. De acordo com analistas, o banco está ampliando a distância em relação aos seus pares privados.", "titulo_pt": "BB apresenta cenário de recuperação lenta e amplia vantagem sobre pares privados, dizem analistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259198, "titulo": "Juro alto e perfil de ativos pode gerar menos apetite em leilões de infraestrutura, diz CEO da Motiva", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/juro-alto-e-perfil-de-ativos-pode-gerar-menos-apetite-em-leiloes-de-infraestrutura-diz-ceo-da-motiva.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T15:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Motiva, Miguel Setas, afirmou que o alto nível de juros e a mudança no perfil dos ativos nos próximos leilões de infraestrutura podem diminuir o interesse do setor. As empresas de infraestrutura mantêm uma rentabilidade construtiva.", "titulo_pt": "Alto juro e perfil de ativos podem reduzir apetite em leilões de infraestrutura, diz CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259265, "titulo": "Reúso de computadores pelo governo brasileiro gera economia de água", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/reuso-de-computadores-pelo-governo-brasileiro-gera-economia-de-agua", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-12T15:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa do governo brasileiro que reúso computadores usados já economizou 133,3 milhões de litros de água. A iniciativa, coordenada pelo Ministério das Comunicações através do Programa Computadores para Inclusão, evita a produção de novos computadores, que exigiriam em média 1.500 litros de água cada um.", "titulo_pt": "Reúso de computadores pelo governo brasileiro gera economia de água", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 259179, "titulo": "Cinco pontos sobre a Nvidia, gigante de chips para IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/cinco-pontos-sobre-a-nvidia-gigante-de-chips-para-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia, uma gigante tecnológica americana, começou como uma startup focada em videogames, mas se transformou em líder mundial em chips para inteligência artificial e se tornou um importante player em Wall Street. Recentemente, a empresa foi impactada pela renúncia de seu CEO.", "titulo_pt": "Cinco pontos sobre a Nvidia, gigante de chips para IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 259862, "titulo": "Quantum Systems drones grounded by German military after cyber attack", "url": "https://www.ft.com/content/783504cd-aa28-453a-a223-7a34eee86ce8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de drones de alta tecnologia, avaliada em 7 bilhões de euros e com operações na Ucrânia, foi a última empresa de armas europeia a ser alvo de um ataque cibernético, levan de desempenho. A empresa planeja atualizar o hardware do implante e está desenvolvendo um novo dispositivo.", "titulo_pt": "Synchon suspende testes de seu implante cerebral devido a problemas de desempenho", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 259857, "titulo": "Jensen jeopardy will disrupt the AI industry", "url": "https://www.ft.com/content/42bfcbcb-7121-492b-8e1d-0aceacd093e2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A saída do CEO da Nvidia pode aprofundar o desacordo tecnológico entre Washington e Beijing.", "titulo_pt": "Perigo para jensen interromperá a indústria de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 259933, "titulo": "Cold War lessons for the AI age: how a US-China hotline could help stop a nuclear attack", "url": "https://www.scmp.com/news/china/diplomacy/article/3374246/cold-war-lessons-ai-age-how-us-china-hotline-could-help-stop-nuclear-attack", "fonte_id": "scmp", "data_pub": "2026-11-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Analistas sugerem que os Estados Unidos e China devem estabelecer uma linha direta dedicada para reduzir o risco de ataques nucleares induzidos por IA. Durante uma conversa telefônica, o secretário de Estado dos EUA, Marco Rubio, e seu homólogo chinês, Wang Yi, concordaram que conversas de alto nível ajudariam a avançar objetivos como paz e desnuclearização.", "titulo_pt": "Aulas da guerra fria para a era da IA: como uma linha direta eua-china poderia evitar um ataque nuclear", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 259856, "titulo": "Jensen Huang is gone. Will the AI industry pay the price?", "url": "https://www.ft.com/content/dd9072bd-e8a3-4f8e-9985-550aa80a2fd4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T14:22:00Z", "idioma": "en", "provavel_duplicata_de": nul -12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os óculos inteligentes Android XR da Google e Samsung estão disponíveis. Os modelos da Warby Parker e da Gentle Monster custam, respectivamente, $395 e $449 e vêm em algumas estilos.", "titulo_pt": "Google e Samsung lançam óculos inteligentes Android XR", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 259983, "titulo": "Here’s How Google Says It’s Making Its Smart Glasses More Private", "url": "https://www.wired.com/story/how-google-is-making-its-smart-glasses-more-private/", "fonte_id": "wired", "data_pub": "2026-11-12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google está destacando seus óculos inteligentes como a opção mais privada em comparação com os produtos da Meta.", "titulo_pt": "Aqui está como a Google afirma estar tornando seus óculos inteligentes mais privados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 259984, "titulo": "Apple’s HomeView Tries Face Authentication Without FaceID", "url": "https://www.wired.com/story/apples-homeview-tries-face-authentication-without-faceid/", "fonte_id": "wired", "data_pub": "2026-11-12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está utilizando uma nova tecnologia de 'recognition of persons' para autenticação em seu dispositivo de inteligência domiciliar HomeView, sem recorrer ao FaceID tradicional. Esta tecnologia ainda não foi testada em escala.", "titulo_pt": "Apple’s HomeView tenta autenticação facial sem FaceID", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 259619, "titulo": "The CEO, the Spy, and a Crisis for AI", "url": "https://www.theatlantic.com/podcasts/2026/11/the-jensen-huang-crisis-for-ai/689392/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-12T13:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história envolvendo o CEO e um espião está causando uma crise no campo da inteligência artificial.", "titulo_pt": "O CEO, o espião e uma crise para IA", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 259986, "titulo": "Exclusive: Fairphone Lands Its First US Carrier Partner in Boost Mobile", "url": "https://www.wired.com/story/exclusive-fairphone-lands-its-first-us-carrier-partner-in-boost-mobile/", "fonte_id": "wired", "data_pub": "2026-11-12T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de telefones sustentáveis Fairphone encontrou seu primeiro parceiro de operadora nos Estados Unidos, a Boost Mobile, com quem planeja vender planos de celular junto com seu smartphone totalmente reparável.", "titulo_pt": "Fairphone adota parceiro de operadora nos EUA na Boost Mobile", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 259968, "titulo": "The Download: COP31’s climate challenge and the quest for immortality", "url": "https://www.technologyreview.com/2026/11/12/1148444/the-download-cop31-climate-talks-cognitive-immortality/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-12T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Delegados, lobistas e jornalistas se reuniram em Antalya, Turquia, para as negociações do COP31, as anuais conversações climáticas da ONU. Este ano, as discussões focam em desafios climáticos e buscam avanços significativos na área.", "titulo_pt": "Download: desafios climáticos do cop31 e busca pela imortalidade", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 259918, "titulo": "Groups unveil new obesity treatment guidelines", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/13/2003867669", "fonte_id": "taipei_times", "data_pub": "2026-11-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos apresentaram novas diretrizes para o tratamento da obesidade. Essas diretrizes visam fornecer orientações mais atualizadas e eficazes para a abordagem da obesidade.", "titulo_pt": "Grupos lançam novas diretrizes para tratamento da obesidade", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 260070, "titulo": "NASA Ames Stars of the Month: November 2026", "url": "https://www.nasa.gov/general/nasa-ames-stars-of-the-month-november-2026/", "fonte_id": "nasa_news", "data_pub": "2026-11-12T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA Ames Science Directorate destaca os contribuições notáveis de Alyssa Villanueva, Steve Howell e Samuel LeBlanc. Eles demonstram o espírito empreendedor, a expertise técnica e a disposição colaborativa necessárias para explorar o espaço e além do nosso planeta.", "titulo_pt": "Estrelas do mês da NASA Ames: novembro 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 259336, "titulo": "Cientistas acham 1º cogumelo com psicodélico e toxina mortal ao mesmo tempo", "url": "https://www.metropoles.com/ciencia/cientistas-acham-1o-cogumelo-com-psicodelico-e-toxina-mortal-ao-mesmo-tempo", "fonte_id": "metropoles", "data_pub": "2026-11-12T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram pela primeira vez um cogumelo que contém simultaneamente uma substância psicodélica e uma toxina mortal. O Galerina indica, encontrado na Flórida, apresenta essas duas propriedades químicas.", "titulo_pt": "Cientistas descobrem primeiro cogumelo com psicodélico e toxina mortal ao mesmo tempo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 259337, "titulo": "Maior eclipse dos últimos anos fará dia virar noite por mais de 6 minutos", "url": "https://www.metropoles.com/mundo/maior-eclipse-dos-ultimos-anos-fara-dia-virar-noite-por-mais-de-6-minutos", "fonte_id": "metropoles", "data_pub": "2026-11-12T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar total em 2017 durará mais de 6 minutos em algumas áreas, sendo considerado um dos mais longos do século. Este fenômeno fará o dia parecer virar noite por alguns minutos.", "titulo_pt": "Maior eclipse solar dos últimos anos fará dia virar noite por mais de 6 minutos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 259409, "titulo": "El Niño mantém influência no Oceano Pacífico e deve continuar com intensidade “muito forte” até março de 2027, diz agência climática dos EUA", "url": "https://www.cnnbrasil.com.br/ciencia/el-nino-mantem-influencia-no-oceano-pacifico-e-deve-continuar-com-intensidade-muito-forte-ate-marco-de-2027-diz-agencia-climatica-dos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Climática dos EUA prevê que o El Niño mantenha sua influência no Oceano Pacífico e continue com intensidade 'muito forte' até março de 2027, com mais de 73% de chance de ser o mais intenso já registrado; o evento pode superar os efeitos observados em 1950.", "titulo_pt": "El Niño deve continuar com intensidade 'muito forte' até março de 2027, diz agência climática dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 259411, "titulo": "Chiclete consegue reduzir presença do HPV e bactérias ligadas ao câncer", "url": "https://www.cnnbrasil.com.br/saude/chiclete-consegue-reduzir-presenca-do-hpv-e-bacterias-ligadas-ao-cancer/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa publicada na revista Scientific Reports descobriu que uma goma feita com proteína extraída de feijão reduziu até 93% dos vírus HPV em amostras de pacientes com câncer de cabeça e pescoço. A pesquisa também notou a redução de bactérias ligadas ao câncer nesses pacientes.", "titulo_pt": "Chiclete reduz presença de HPV e bactérias relacionadas ao câncer", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260042, "titulo": "STAT+: Blackstone backs Pfizer’s bet on monthly obesity treatment", "url": "https://www.statnews.com/2026/11/12/biotech-news-blackstone-backs-pfizer-bet-on-monthly-obesity-treatment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pfizer gastou até US$ 10 bilhões para adquirir a Metsera no ano passado. Agora, a empresa está trazendo o gigante de private equity Blackstone para ajudar a financiar o acordo.", "titulo_pt": "Blackstone apoia aposta de Pfizer em tratamento mensal para obesidade", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 260043, "titulo": "STAT+: Scientists debut map of basal ganglia, a key brain region involved in an array of diseases", "url": "https://www.statnews.com/2026/11/12/brain-map-basal-ganglia-offers-treatment-clues-parkinsons-schizophrenia/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma colaboração científica significativa criou o mapa mais detalhado até agora da região do córtex basal, uma área crucial do cérebro envolvida em diversas doenças psiquiátricas e neurológicas.", "titulo_pt": "Cientistas lançam mapa detalhado da região basal do córtex, importante para diversos distúrbios", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 260051, "titulo": "The brain’s fear center moonlights as the save button for memories", "url": "https://www.sciencenews.org/article/brain-amygdala-neuron-saves-memories", "fonte_id": "science_news", "data_pub": "2026-11-12T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O amígdala, geralmente associado à regulação do medo e da agressividade, pode ter um papel importante na determinação de quais momentos são lembrados.", "titulo_pt": "O centro de medo do cérebro atua como o botão de salvamento de memórias", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 260066, "titulo": "AI is disrupting math. Is science next?", "url": "https://www.scientificamerican.com/article/ai-is-disrupting-math-is-science-next/", "fonte_id": "scientific_american", "data_pub": "2026-11-12T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, a matemática foi revolucionada pela inteligência artificial. A próxima área a ser impactada pode ser a ciência.", "titulo_pt": "A IA está revolucionando a matemática. Será a ciência a próxima?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 260044, "titulo": "STAT+: Will Heidi Overton get to run the FDA?", "url": "https://www.statnews.com/2026/11/12/will-heidi-overton-be-confirmed-fda-commissioner-dc-diagnosis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pergunta questiona se Heidi Overton tem o apoio necessário e como os democratas vão reagir à possibilidade dela assumir o cargo de FDA, em relação a RFK Jr.", "titulo_pt": "Heidi Overton vai poder concorrer à FDA?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 260067, "titulo": "Jensen Huang leaving Nvidia risks a ‘brain drain’ from the AI chipmaker", "url": "https://www.scientificamerican.com/article/jensen-huang-leaving-nvidia-risks-a-brain-drain-from-the-ai-chipmaker/", "fonte_id": "scientific_american", "data_pub": "2026-11-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang está deixando a Nvidia, o que pode resultar em uma perda de talentos para a empresa, que é conhecida por sua contribuição na área de chips para inteligência artificial.", "titulo_pt": "Saída de Huang da Nvidia pode causar 'drenagem de cérebros'", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 260045, "titulo": "STAT+: New documents raise more questions about Medicare’s AI prior-authorization experiment", "url": "https://www.statnews.com/2026/11/12/new-documents-raise-more-questions-about-medicares-ai-prior-authorization-experiment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos documentos levantam mais questões sobre o experimento de autorização prévia com IA do Medicare. Este episódio de STAT Health Tech também aborda investimentos da Oura em inteligência artificial, uma 'faixa de alerta' para chatbots clínicos e o experimento de autorização prévia com IA do Medicare.", "titulo_pt": "Novos documentos levantam mais questões sobre o experimento de autorização prévia com IA do Medicare", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 259227, "titulo": "Missão Euclid divulga dados sobre mais de 900 milhões de galáxias", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/missao-euclid-divulga-dados-sobre-mais-de-900-milhoes-de-galaxias.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-12T14:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Espacial Europeia divulgou o primeiro grande conjunto de dados da missão do telescópio orbital Euclid, que inclui observações de mais de 900 milhões de galáxias. O material será usado para investigar a matéria escura e a energia escura.", "titulo_pt": "Missão Euclid divulga dados sobre mais de 900 milhões de galáxias", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 260046, "titulo": "STAT+: Pharmalittle: We’re reading about FDA shelving fast-track review, a Canadian importer arrested, and more", "url": "https://www.statnews.com/pharmalot/2026/11/12/fda-fast-track-review-shelved-canadian-importer-arrested/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA suspendeu a iniciativa de revisão acelerada de medicamentos lançada pelo ex-comissário Marty Makary em junho de 2025. Um im
