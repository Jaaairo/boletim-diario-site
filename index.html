<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 18/11/2026 19:20 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "18/11/2026 19:20", "stats": {"noticias_novas": 662, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Senado concluiu a votação do pacote fiscal proposto pelo governo Lula, rejeitando quatro pedidos de alteração e enviando o texto à Câmara. O projeto tem potencial de melhorar as contas públicas em até R$ 56,1 bilhões em 2027. O ministro das Relações Institucionais, José Guimarães, afirmou que o governo tem votos suficientes para aprovar o pacote no Senado. O projeto, conhecido como 'plano Moretti', mantém algumas medidas de ajuste, mas flexibiliza outras para evitar resistências. O governo chegou a um acordo com o relator do texto, o senador Eduardo Braga (MDB-AM), para flexibilizar uma parte do ajuste fiscal relacionada à Lei Kandir. Paralelamente, o Novo lançou Paulo Martins (PR) para disputar a presidência da Câmara em 2027, em uma disputa que pode gerar divisão no PL, com Nikolas Ferreira ameaçando deixar o partido se ele for apoiado a reeleição de Hugo Motta. Além disso, a Polícia Federal investiga um possível vazamento de informações sobre relatórios que citam ministros do STF, com o diretor-geral Andrei Rodrigues afirmando que a corporação segue a Constituição Federal e que a decisão de afastar delegados relacionados ao caso Banco Master foi legal.", "mundo": "O presidente do Paraguai, Santiago Peña, demitiu o diretor paraguaio da hidrelétrica de Itaipu em resposta à crise no Ueno Bank, que levou à destituição e prisão do ex-presidente Pedro Alliana. Em outro desenvolvimento, Bassirou Diomaye Faye foi excluído do partido de governo do Senegal. A Coreia do Norte realizou uma visita de inspeção à universidade naval em meio a possíveis negociações com os Estados Unidos. Donald Trump, o primeiro presidente dos Estados Unidos, visitou Shenzhen, na China, onde serviu como base para empreendedores de tecnologia e onde o supercomputador mais rápido do mundo está localizado. O primeiro-ministro Andy Burnham do Reino Unido busca redefinir as relações com a União Europeia, uma tarefa complexa após uma década de separação. Hakeem Jeffries, um democrata, foi escolhido para ser o próximo presidente da Câmara dos Representantes dos Estados Unidos, tornando-o o primeiro afro-americano a ocupar o cargo. Além disso, a Coreia do Norte realizou uma visita de inspeção à universidade naval, enquanto o presidente chinês Xi Jinping se reuniu com o presidente americano Donald Trump em Shenzhen durante uma cúpula regional.\n\nA reunião tripartida entre os presidentes Donald Trump, Vladimir Putin e Xi Jinping, no encontro da APEC em Shenzhen, terá seu momento fotográfico, mas estará sob a sombra de questões pendentes. As palavras dos ausentes podem pesar tanto quanto as dos presentes em assuntos globais. Em outro desenvolvimento, os Estados Unidos e a Venezuela planejam expandir sua cooperação militar para combater o tráfico de drogas, com Pete Hegseth confirmado para visitar Caracas. Na região do Oriente Médio, Israel lançou uma operação terrestre no centro de Gaza, resultando na fuga de palestinos e três mortes. As tensões entre Israel e Gaza continuam, com ataques israelenses em Gaza e uma avó palestiniana morta por um setelista israelense. A Rússia intensificou suas atividades militares, com ataques a Odesa na Ucrânia e um nuclear briefcase observado durante a cúpula APEC. Além disso, a Coreia do Norte visitou uma universidade naval na costa leste, em meio a possíveis negociações com os Estados Unidos.", "economia": "O dólar atingiu um novo pico em 19 meses, subindo 1,46% e se aproximando de R$ 5,86, influenciado pela alta dos juros nos Estados Unidos. O setor financeiro rejeitou o aumento das tarifas de gasodutos, defendendo a continuidade do processo de revisão. O setor nuclear busca espaço nas metas climáticas da COP31, pressionando pela inclusão de energia nuclear em decisões sobre metas climáticas. A Anthropic fixou o preço de sua oferta pública inicial de ações em US$ 83, acima da faixa prevista, em uma das maiores operações do tipo já registradas. A Agrotools identificou pressão do EUDR sobre a cadeia brasileira de soja, com a Europa absorvendo metade das exportações de farelo de soja brasileiro em 2025, totalizando 11,7 milhões de toneladas e US$ 5 bilhões.", "tecnologia": "A Nvidia enfrenta diversos desafios, elevando suas projeções financeiras e afirmando que pode prosperar sem a liderança de seu fundador, Jensen Huang. A situação de Huang continua a gerar incertezas, especialmente em relação ao impacto na Taiwan. A empresa também enfrenta problemas técnicos, com falhas em sistemas de aviação e até mesmo em plataformas de comunicação da Agência de Segurança Nacional dos EUA. Em outro desenvolvimento, um bilionário estoniano, conhecido por sua visão pessimista sobre a inteligência artificial (IA), está previsto para ser um dos maiores ganhadores da IPO do Anthropic, uma empresa de IA. Além disso, a CIA descartou atividade maliciosa por trás de falhas tecnológicas recentes, enquanto a Citi resolveu uma ação judicial sobre assédio sexual. No cenário mais amplo, o uso da IA está ganhando espaço em diversas áreas, desde a coleta de dívidas até a interação de personagens de Star Wars com visitantes em parques temáticos. A Anthropic, proprietária do Claude, enfrenta críticas sobre a segurança de sua IA, enquanto a China se beneficia da saída de Huang, de acordo com um executivo da Anduril.", "ciencia": "A Voyager 1, da NASA, atingiu a marca de um dia-luz de distância após 50 anos de operação no espaço, estabelecendo um novo recorde. Este feito marca a distância mais distante percorrida por um objeto humano, com a espaçonave, que está em viagem há quase meio século, sendo destinada a explorar a Via Láctea. Em outro importante avanço, a NASA anunciou uma competição para desenvolver propulsores de efeito Hall de potência intermediária, com o objetivo de apoiar futuras missões espaciais. Além disso, a Organização Pan-Americana de Saúde (OPAS) alertou para o aumento da resistência a antibióticos, representando um grave desafio à saúde pública, enquanto um estudo na Amazônia revelou uma interação inesperada entre musgos e fungos zumbis, com potenciais implicações para a ecologia local.", "cultura": "O 31º Encontro dos Tambores, realizado em Macapá, é o evento mais importante do ano para os artistas locais. O tema 'Tradição, ancestralidade e resistência do povo negro amazônico' promove uma programação diversificada e gratuita. O evento, que ocorre de 18 a 22 de novembro, celebra as tradições negras da Amazônia. Em seguida, uma cerimônia marcante vê os crânios de duas pessoas escravizadas pelo Harvard devolvidos a seus países de origem, após cerca de dois séculos de reclusão em um museu. A RedeTV! contrata Luiz Bacci para substituir Marcelo de Carvalho no programa 'Mega Sonho'. A confeitaria francesa Ladurée reabre suas portas em São Paulo com uma nova loja no Iguatemi, após uma pausa de uma década. A atriz Lilia Cabral interpreta a vilã Celestina Guerreiro na novela 'Lá na Minha Terra'. Roger Daltrey, do The Who, se apresenta em São Paulo, enquanto a Globo inaugura novas estrelas em sua calçada da fama, incluindo Janete Clair, Reginaldo Faria e Stênio Garcia. A influenciadora Puli Cocina, após passar por múltiplas cirurgias, decide ter um bebê por meio de outras formas de maternidade, compartilhando suas emoções nas redes sociais. A crítica literária Aurora Bernardini publicou cinco livros sob um pseudônimo desconhecido. A Art Bridges Fund anunciou um financiamento adicional de US$ 9,5 milhões para a Access For All Initiative, beneficiando 64 museus nos Estados Unidos. A exposição retrospectiva de Ana Mendieta no MoMA em 2027 e o documentário sobre Edward Said também são destaque na cultura contemporânea.", "sociedade": "Um proprietário de uma sala de escape foi indiciado pela morte de um funcionário em Taipei, na Taiwan, levantando suspeitas sobre as condições de trabalho. Em outro caso, uma criança de 2 anos foi esfaqueada em uma festa familiar no Paraná após se recusar a tirar foto, resultando na prisão da suspeita. A comunidade muçulmana deve ultrapassar os cristãos nas próximas décadas, tornando-se o maior grupo religioso do mundo até 2035, devido a taxas de natalidade mais altas. A concorrência desleal pelo tempo dos adolescentes entre estudos, trabalho, tarefas domésticas e lazer tem sido amplamente discutida. Além disso, a transparência na área da saúde é considerada crucial para que os cidadãos tomem decisões informadas.", "meio_ambiente": "A COP31 no Brasil, liderada pela ministra Gita Chaudhary, enfatizou a urgência da justiça climática e da responsabilidade dos países mais poluentes. Durante o evento, que ocorreu em meio a uma tragédia climática que deixou mais de 1.400 mortos e causou perdas equivalentes a 10% do PIB do país, também foram debatidos os desafios financeiros relacionados à responsabilidade na crise climática. Há expectativa de uma decisão importante sobre esse tema nesta quarta-feira. Paralelamente, o fenômeno El Niño preocupa as autoridades brasileiras, que estão monitorando a situação em áreas mais vulneráveis, especialmente em regiões com menor capacidade de adaptação às mudanças climáticas. Em Santiago, no Chile, a escassez hídrica persiste, apesar do aumento nas chuvas, com o Fundo de Água Santiago-Maipo alertando para a necessidade de implementar soluções naturais para conservar água e lidar com o calor extremo.", "direitos_humanos": "O Superior Tribunal de Justiça (STJ) reduziu a indenização que a apresentadora Xuxa deve pagar em um processo sobre o uso indevido de personagens da Turma do Cabralzinho, que está em discussão há 26 anos. Em outra notícia, a ONU advertiu sobre possíveis retrocessos na autonomia e na capacidade operacional do Instituto Nacional de Defesa Humana (INDH) devido a um informe financeiro da iniciativa que poderia desvincular todos os seus advogados. Na Arábia Saudita, clérigos xiitas foram condenados à prisão perpétua por conspiração com o Irã, enquanto grupos de direitos humanos expressam preocupações sobre tortura e confissões forçadas. A UNICEF realizou uma conferência global em Manila para discutir estratégias para combater a violência contra crianças em todo o mundo. O chefe do Diretório de Polícia Criminal da Sérvia foi detido em agosto de 2025, acusado de torturar manifestantes. Refugiados rohingya esperam que o Tribunal Internacional decida a seu favor, mas não está claro se isso ajudará a permitir seu retorno. A Arábia Saudita cortou drasticamente o programa de refugiados australiano em 90% e eliminou o programa de vistos permanentes para pais e pais idosos, o que foi criticado por oponentes políticos e organizações de advocacy. Além disso, testemunhos de nove mil mulheres sobre problemas ginecológicos após exposição a gases lacrimogêneos durante protestos levantaram preocupações sobre os efeitos desses gases na saúde feminina, resultando em chamados por uma proibição. A intensificação dos conflitos no Iêmen causou a morte e ferimentos em pelo menos 64 crianças, além de interromper o acesso a serviços de saúde, água segura, higiene, alimentos e educação."}, "resumo_do_dia": {"politica_nacional": [{"id": 273272, "titulo": "Senado adia avanço da reforma do Código Civil, mas prevê relatórios parciais em janeiro", "url": "https://www.jota.info/legislativo/senado-adia-avanco-da-reforma-do-codigo-civil-mas-preve-relatorios-parciais-em-janeiro", "fonte_id": "jota", "data_pub": "2026-11-18T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço da reforma do Código Civil no Senado foi adiado, mas a comissão estabeleceu prazos para a entrega de sub-relatórios em 30 de janeiro e do relatório final de Veneziano até maio.", "titulo_pt": "Senado adia reforma do Código Civil, mas prevê relatórios parciais em janeiro e parecer final em maio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273207, "titulo": "Senado rejeita destaques e pacote fiscal proposto pelo governo Lula segue para Câmara", "url": "https://www.infomoney.com.br/politica/senado-rejeita-destaques-e-avanca-com-pacote-fiscal-proposto-pelo-governo-lula/", "fonte_id": "infomoney", "data_pub": "2026-11-18T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado rejeitou os destaques ao pacote fiscal proposto pelo governo Lula. O projeto de Lei Complementar agora será analisado pela Câmara dos Deputados.", "titulo_pt": "Senado rejeita destaques e pacote fiscal de Lula vai para Câmara", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 273086, "titulo": "Novo lança Paulo Martins na disputa pela presidência da Câmara contra Motta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/novo-lanca-paulo-martins-na-disputa-pela-presidencia-da-camara-contra-motta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Novo lançou Paulo Martins (PR) para disputar a presidência da Câmara em fevereiro do próximo ano. Martins será deputado federal a partir de 2027.", "titulo_pt": "Novo lança Paulo Martins na corrida pela presidência da Câmara contra Motta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 273209, "titulo": "Governo fecha acordo e flexibiliza trecho do ajuste fiscal sobre Lei Kandir", "url": "https://www.infomoney.com.br/politica/governo-fecha-acordo-e-flexibiliza-trecho-do-ajuste-fiscal-sobre-lei-kandir/", "fonte_id": "infomoney", "data_pub": "2026-11-18T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo chegou a um acordo com o relator do texto, o senador Eduardo Braga (MDB-AM), para flexibilizar uma parte do ajuste fiscal relacionada à Lei Kandir.", "titulo_pt": "Governo fecha acordo e flexibiliza trecho do ajuste fiscal sobre Lei Kandir", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 273162, "titulo": "Análise: Relatório da Polícia Federal sobre STF não será adjetivado", "url": "https://www.cnnbrasil.com.br/politica/analise-relatorio-da-policia-federal-sobre-stf-nao-sera-adjetivado/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da Polícia Federal sobre o Supremo Tribunal Federal será entregue ao juiz Fachin sem incluir juízo de valor. A análise foi feita por Pedro Venceslau para o CNN 360º.", "titulo_pt": "Relatório da Polícia Federal sobre STF será entregue a fachin sem adjetivação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273270, "titulo": "Senado conclui votação do ajuste fiscal de Lula e envia texto à Câmara", "url": "https://www.metropoles.com/brasil/senado-pacote-fiscal-lula", "fonte_id": "metropoles", "data_pub": "2026-11-18T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado concluiu a votação do ajuste fiscal proposto por Lula, rejeitando quatro pedidos de alteração e enviando o texto à Câmara. O projeto tem potencial de melhorar as contas públicas em até R$ 56,1 bilhões em 2027.", "titulo_pt": "Senado finaliza votação do ajuste fiscal de Lula e envia texto à Câmara", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273087, "titulo": "'Plano Moretti' reduz incentivo do Programa de Alimentação do Trabalhador e pressiona vale-refeição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/plano-moretti-reduz-incentivo-do-programa-de-alimentacao-do-trabalhador-e-pressiona-vale-refeicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O 'plano Moretti', que visa ajustes fiscais, reduzirá o incentivo do Programa de Alimentação do Trabalhador, afetando as empresas que oferecem vale-refeição aos funcionários.", "titulo_pt": "Plano Moretti diminui incentivo do Programa de Alimentação do Trabalhador e pressiona vale-refeição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 273092, "titulo": "Eleição para presidente da Câmara causa divisão no PL, e Nikolas ameaça deixar partido", "url": "https://g1.globo.com/politica/noticia/2026/11/18/eleicao-para-presidente-da-camara-causa-divisao-no-pl-e-nikolas-ameaca-deixar-partido.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição para presidente da Câmara dos Deputados gerou divisão no PL, com Nikolas Ferreira ameaçando deixar o partido se ele for apoiado a reeleição de Hugo Motta.", "titulo_pt": "Eleição para presidente da Câmara causa divisão no PL, e Nikolas ameaça deixar partido", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273178, "titulo": "Suspeita de chefiar esquema de fraude fiscal de R$ 1,3 bi é presa em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/suspeita-de-chefiar-esquema-de-fraude-fiscal-de-r-13-bi-e-presa-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma suspeita de liderar um esquema de fraude fiscal que gerou prejuízo de R$ 1,3 bilhão aos cofres públicos paulistas foi presa. O esquema envolvia notas falsas que criavam créditos indevidos de ICMS sobre operações fictícias no setor de combustíveis.", "titulo_pt": "Suspeita de chefiar esquema de fraude fiscal de R$ 1,3 bi é presa em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273093, "titulo": "PF investiga vazamento de informações sobre relatórios citando ministros do STF", "url": "https://g1.globo.com/politica/noticia/2026/11/18/pf-investiga-vazamento-de-informacoes-sobre-relatorios-citando-ministros-do-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T20:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal (PF) está investigando um possível vazamento de informações sobre relatórios que citam ministros do Supremo Tribunal Federal (STF). O diretor-geral da PF, Andrei Rodrigues, afirmou durante uma audiência no Senado que a ordem interna foi descumprida, mas não sabe se o documento inteiro foi vazado.", "titulo_pt": "PF investiga vazamento de informações sobre relatórios citando ministros do STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273273, "titulo": "STF: fim da isenção de pena em casos de violência patrimonial vale a partir do julgamento", "url": "https://www.jota.info/stf/do-supremo/stf-fim-da-isencao-de-pena-em-casos-de-violencia-patrimonial-vale-a-partir-do-julgamento", "fonte_id": "jota", "data_pub": "2026-11-18T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal decidiu que a isenção de pena em casos de violência patrimonial não vale para ações penais já finalizadas, mas começa a valer a partir do julgamento.", "titulo_pt": "STF: isenção de pena em violência patrimonial não retroage", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273094, "titulo": "Câmara aprova projeto que pune político que não colaborar com transição entre governos", "url": "https://g1.globo.com/politica/noticia/2026/11/18/camara-aprova-projeto-que-pune-politico-que-nao-colaborar-com-transicao-entre-governos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto de lei que estabelece regras para o processo de transição administrativa entre governos. O projeto prevê a aplicação de sanções administrativas e multa em caso de resistência no processo de transição.", "titulo_pt": "Câmara aprova projeto que estabelece regras para transição administrativa entre governos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273088, "titulo": "O Master e o brasileiro desconfiado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/maria-herminia-tavares/2026/11/o-master-e-o-brasileiro-desconfiado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Para compreender a ascensão da extrema-direita na América Latina, é necessário considerar o sentimento popular que persiste há mais de três décadas, mesmo com a experiência democrática. A economista chilena Marta Lagos, diretora-executiva do Latinobarómetro, fez esse alerta durante a II Cúpula do Conversatorio Latinoamericano realizada no Rio de Janeiro.", "titulo_pt": "O mestre e o brasileiro desconfiado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 273089, "titulo": "Politizar a reforma do Judiciário", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/conrado-hubner-mendes/2026/11/e-preciso-politizar-a-reforma-do-judiciario.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma do Judiciário deve ser realizada através do diálogo com os demais poderes e com a sociedade, segundo a citação. Não se deve promover uma reforma contra o Poder Judiciário, mas sim construí-la em conjunto.", "titulo_pt": "Politicar a reforma do Judiciário", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 273275, "titulo": "Dino determina extinção de processos sobre Moratória da Soja no Cade e na Justiça", "url": "https://www.jota.info/stf/do-supremo/dino-determina-extincao-de-processos-sobre-moratoria-da-soja-no-cade-e-na-justica", "fonte_id": "jota", "data_pub": "2026-11-18T19:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador do Amazonas, Wilson Lima, determinou a extinção de processos relacionados à Moratória da Soja no Conselho Administrativo de Defesa Econômica (CADE) e na Justiça. Ele permitiu que litígios independentes da Moratória da Soja possam ser discutidos em ações separadas.", "titulo_pt": "Lima determina extinção de processos sobre Moratória da Soja no Cade e na Justiça", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273095, "titulo": "Ajuste fiscal: Senado faz acordo sobre mudança na Lei Kandir, rejeita outras alterações e conclui votação do projeto", "url": "https://g1.globo.com/politica/noticia/2026/11/18/senado-comeca-a-votar-requerimentos-para-modificar-proposta-de-ajuste-fiscal-de-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T19:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal concluiu a votação do projeto de lei de ajuste fiscal proposto pelo governo Lula, rejeitando três mudanças propostas e acordando sobre duas outras. Os destaques rejeitados incluíam a exclusão da autorização para o governo limitar o uso de créditos tributários por empresas.", "titulo_pt": "Senado conclui votação do projeto de ajuste fiscal, rejeita mudanças e acorda sobre Lei Kandir", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 272779, "titulo": "Taiwan eyeing US-China-Russia talks", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003867998", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan está considerando participar das negociações entre Estados Unidos, China e Rússia. Até o momento, não há informações sobre a participação efetiva da Taiwan nesses encontros.", "titulo_pt": "Taiwan avaliando participação em negociações entre EUA, china e Rússia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272781, "titulo": "Xi welcomes Trump to China ahead of summit", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868000", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês, Xi Jinping, recebeu o presidente dos Estados Unidos, Donald Trump, na China antes de uma cúpula bilateral. A visita ocorreu como parte de esforços para melhorar as relações entre as duas nações.", "titulo_pt": "Xi recebe Trump na China antes de cúpula", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 273493, "titulo": "Bukele confirms airstrike on Haitian gang leader Jeff's luxury mansion", "url": "https://www.euronews.com/2026/11/18/bukele-confirms-airstrike-on-haitian-gang-leader-jeffs-luxury-mansion", "fonte_id": "euronews", "data_pub": "2026-11-18T21:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da El Salvador, Bukele, confirmou um ataque aéreo que destruiu a mansão do líder criminal haitiano Jeff Larose. Não está claro se Jeff estava no local durante o bombardeio.", "titulo_pt": "Bukele confirma ataque aéreo na mansão do líder criminal haitiano Jeff", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 273069, "titulo": "Presidente do Paraguai destitui diretor de Itaipu após crise do Ueno Bank", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/presidente-do-paraguai-destitui-diretor-de-itaipu-apos-crise-do-ueno-bank.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Paraguai, Pedro Alliana, demitiu o diretor paraguaio da hidrelétrica de Itaipu em virtude de sua atuação durante a crise bancária que levou à destituição e prisão do ex-presidente Santiago Peña.", "titulo_pt": "Presidente do Paraguai demite diretor de Itaipu após crise bancária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273497, "titulo": "Russian accused of spying on Palantir over assistance to Ukraine", "url": "https://www.ft.com/content/4972f4c7-fe8d-4fdd-b0fd-0db2360cda2a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores acusam suspeito de ter entrado nos EUA de México e de ter vigiado funcionários de uma empresa de tecnologia da Califórnia. A empresa em questão é a Palantir, que teria fornecido assistência à Ucrânia.", "titulo_pt": "Rússia acusada de espionar a Palantir por assistência à Ucrânia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273563, "titulo": "N.K. leader visits naval university, construction sites on eastern coast amid possible N.K.-U.S. talks", "url": "https://en.yna.co.kr/view/AEN20261119000500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder norte-coreano Kim Jong-un visitou uma universidade naval e locais de construção na costa leste. Essa visita ocorre em meio a possíveis negociações entre Coreia do Norte e Estados Unidos.", "titulo_pt": "Líder norte-coreano visita universidade naval e obras na costa leste durante possíveis negociações com EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 273165, "titulo": "Nos EUA, chefe da espionagem de Israel defendeu ataques ao Irã, diz fonte", "url": "https://www.cnnbrasil.com.br/internacional/nos-eua-chefe-da-espionagem-de-israel-defendeu-ataques-ao-ira-diz-fonte/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um chefe da inteligência de Israel defendeu ataques ao Irã, segundo fontes. O primeiro-ministro israelense, Benjamin Netanyahu, acredita que a oportunidade para uma nova ofensiva está se esgotando.", "titulo_pt": "Em Israel, chefe da espionagem defendeu ataques ao Irã, diz fonte", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273476, "titulo": "Bassirou Diomaye Faye excluded from Senegal's ruling party", "url": "https://www.france24.com/en/bassirou-diomaye-faye-excluded-from-senegal-s-ruling-party", "fonte_id": "france24", "data_pub": "2026-11-18T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bassirou Diomaye Faye foi excluído do partido de governo de Senegal. Em outro desenvolvimento, todos os estados da Nigéria expressaram interesse em criar suas próprias forças policiais. Além disso, conflitos e redução de financiamento estão aumentando as pressões sobre a aprendizagem das crianças em algumas partes da África.", "titulo_pt": "Bassirou Diomaye Faye excluído do partido de governo de Senegal", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 273586, "titulo": "Absolute Batman can save DC Studios", "url": "https://www.theverge.com/entertainment/1035722/absolute-batman-can-save-dc-studios", "fonte_id": "the_verge", "data_pub": "2026-11-18T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com James Gunn e Peter Safran deixando suas posições como co-coordenadores da DC Studios após a aquisição da Warner Bros. Discovery pela Skydance, o futuro do universo cinematográfico que estava sendo construído em torno de filmes como 'Superman' do ano passado está incerto. Ainda assim, é possível que o filme 'Man of Tomorrow' de Gunn seja lançado, mas sua visão mais ampla para o projeto parece estar em risco.", "titulo_pt": "Batman pode ser a salvação da DC Studios", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 273564, "titulo": "(URGENT) N.K. leader inspects naval university amid possible N.K.-U.S. talks", "url": "https://en.yna.co.kr/view/AEN20261119000400315", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder da Coreia do Norte inspecionou uma universidade naval no país. Essa visita ocorre em um momento em que há possíveis negociações entre a Coreia do Norte e os Estados Unidos.", "titulo_pt": "Urgente: líder da Coreia do norte inspecciona universidade naval durante possíveis negociações com EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 273499, "titulo": "US and Venezuela to expand military co-operation to target drug trafficking", "url": "https://www.ft.com/content/5144ce59-b928-46ba-b6b6-d7e77eb79d5b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e a Venezuela planejam expandir sua cooperação militar para combater o tráfico de drogas. Durante uma visita inesperada a Caracas, Pete Hegseth afirmou que os dois países irão 'perseguir', 'localizar' e 'destruir' 'narcoterroristas'.", "titulo_pt": "EUA e Venezuela ampliarão cooperação militar para combater tráfico de drogas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273167, "titulo": "EUA e Venezuela concordam em reforçar cooperação militar", "url": "https://www.cnnbrasil.com.br/internacional/eua-e-venezuela-concordam-em-reforcar-cooperacao-militar/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário de Defesa dos Estados Unidos, Pete Hegseth, se reuniu com a presidente interina da Venezuela, Delcy Rodríguez, em Caracas. Os dois países concordaram em reforçar a cooperação militar.", "titulo_pt": "EUA e Venezuela concordam em reforçar cooperação militar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273494, "titulo": "US Defence Secretary announces military cooperation in surprise Caracas visit", "url": "https://www.euronews.com/2026/11/18/us-defence-secretary-announces-military-cooperation-in-surprise-caracas-visit", "fonte_id": "euronews", "data_pub": "2026-11-18T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Secretário de Defesa dos Estados Unidos se reuniu com Delcy Rodríguez em Caracas antes de uma visita planejada à Colômbia, onde ele pretende discutir cooperação bilateral em segurança.", "titulo_pt": "Secretário de defesa dos EUA anuncia cooperação militar em visita surpresa a Caracas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 273170, "titulo": "Trump é o 1° presidente dos EUA no cargo a ir à “cidade milagrosa” da China", "url": "https://www.cnnbrasil.com.br/internacional/trump-e-o-1-presidente-dos-eua-no-cargo-a-ir-a-cidade-milagrosa-da-china/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Shenzhen é uma cidade chinesa que serve como base para empreendedores de tecnologia, drones de entrega de alimentos e o supercomputador mais rápido do mundo, comparada à Vale do Silício. Trump foi o primeiro presidente dos Estados Unidos a visitar Shenzhen.", "titulo_pt": "Trump é o 1º presidente dos EUA a visitar a 'cidade milagrosa' da China", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273140, "titulo": "Israel lança operação terrestre no centro de Gaza e provoca fuga de palestinos", "url": "https://veja.abril.com.br/mundo/israel-lanca-operacao-terrestre-no-centro-de-gaza-e-provoca-fuga-de-palestinos/", "fonte_id": "veja", "data_pub": "2026-11-18T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel lançou uma operação terrestre no centro de Gaza, resultando na fuga de palestinos. Três pessoas foram mortas em diferentes ataques israelenses no território durante o dia, de acordo com médicos palestinos.", "titulo_pt": "Israel lança operação terrestre no centro de Gaza e provoca fuga de palestinos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 273141, "titulo": "Explosão atinge capital saudita em meio à escalada de ataques hutis", "url": "https://veja.abril.com.br/mundo/explosao-atinge-capital-saudita-em-meio-a-escalada-de-ataques-hutis/", "fonte_id": "veja", "data_pub": "2026-11-18T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma explosão ocorreu na capital saudita, Riyadh, durante a escalada de ataques hutis. Moradores não relataram alertas prévios, mas a coalizão militar afirmou ter interceptado dois mísseis de cruzeiro.", "titulo_pt": "Explosão atinge riad durante escalada de ataques hutis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 273070, "titulo": "Anthropic precifica ação do IPO em US$ 83, acima do esperado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/anthropic-precifica-acao-do-ipo-em-us-83.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic fixou o preço de sua oferta pública inicial de ações em US$ 83 por papel, acima da faixa prevista, em uma das maiores operações do tipo já registradas. O volume da oferta também aumentou.", "titulo_pt": "Anthropic precifica ação do IPO em US$ 83, acima do esperado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273072, "titulo": "Setor nuclear cobra espaço nas metas climáticas da COP31", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/setor-nuclear-cobra-espaco-nas-metas-climaticas-da-cop31.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes do setor nuclear estão pressionando para que a energia atômica seja incluída nas decisões sobre metas climáticas durante a COP31 em Antália, Turquia, até 20 de novembro. Eles também estão buscando mais investimentos no setor.", "titulo_pt": "Setor nuclear busca espaço nas metas climáticas da COP31", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273073, "titulo": "Ter uma carteira para cada objetivo pode ser um erro?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/ter-uma-carteira-para-cada-objetivo-pode-ser-um-erro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que separar dinheiro específico para a faculdade do filho pode não ser a melhor estratégia. O autor questiona se essa abordagem é realmente a mais eficaz para alcançar o objetivo de educação do filho.", "titulo_pt": "Ter uma carteira para cada objetivo pode ser um erro?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273566, "titulo": "Financial sector's overseas real estate investment down in Q2", "url": "https://en.yna.co.kr/view/AEN20261118006700320", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O investimento do setor financeiro em imóveis no exterior diminuiu no segundo trimestre. Essa informação foi divulgada pela Yonhap News em Seul, 19 de novembro.", "titulo_pt": "Investimento do setor financeiro em imóveis no exterior diminuiu no segundo trimestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 273400, "titulo": "Confirman baja de los combustibles: revisa los valores de la bencina para los próximos días", "url": "https://www.latercera.com/servicios/noticia/confirman-baja-de-los-combustibles-revisa-los-valores-de-la-bencina-para-los-proximos-dias/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T20:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A última elevação nos preços dos combustíveis foi revertida, conforme informa o relatório semanal da Empresa Nacional do Petróleo. Os novos valores da gasolina serão divulgados nos próximos dias.", "titulo_pt": "Confirmação da baixa nos combustíveis: confira os novos valores da gasolina", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 273172, "titulo": "‘Clientes’ e investidores futuros do agro virão da Ásia, miram analistas", "url": "https://www.cnnbrasil.com.br/agro/clientes-e-investidores-futuros-do-agro-virao-da-asia-miram-analistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes do agronegócio vêem o comércio exterior com a China, Japão e países do Oriente Médio como lucrativo, mas o Brasil precisará investir em negociadores nessas regiões.", "titulo_pt": "Clientes e investidores futuros do agronegócio virão da Ásia, dizem analistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273074, "titulo": "Meta lança Achados, aplicativo que reúne vendas do Facebook e Instagram", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/meta-lanca-achados-aplicativo-que-reune-vendas-do-facebook-e-instagram.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta lançou o Achados, um aplicativo que reúne anúncios de produtos novos e usados publicados no Facebook Marketplace, em grupos do Facebook e no Instagram. O aplicativo permite buscar itens por categoria, preço e distância e consultar informações sobre os vendedores antes de entrar em contato.", "titulo_pt": "Meta lança Achados, aplicativo que reúne vendas do Facebook e Instagram", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273251, "titulo": "Desenvolve SP vai financiar câmeras 3.0 da Gabriel", "url": "https://braziljournal.com/desenvolve-sp-vai-financiar-cameras-30-da-gabriel", "fonte_id": "brazil_journal", "data_pub": "2026-11-18T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup de câmeras de segurança Gabriel levantou R$ 20 milhões em financiamento da Desenvolve SP para desenvolver a próxima geração de sua tecnologia, um hardware com inteligência artificial que identifica ações suspeitas e age preventivamente.", "titulo_pt": "Desenvolve SP financiará câmeras 3.0 da Gabriel", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 273143, "titulo": "Dólar sobe de novo e passa de R$ 5,86 com pacote fiscal indefinido no Congresso; bolsa cai", "url": "https://veja.abril.com.br/economia/dolar-sobe-de-novo-e-vai-a-r-587-com-pacote-fiscal-indefinido-no-congresso-bolsa-cai/", "fonte_id": "veja", "data_pub": "2026-11-18T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar subiu novamente, atingindo mais de R$ 5,86, devido ao pacote fiscal indefinido no Congresso. A bolsa também registrou uma queda. O projeto de ajuste no Senado, que estava adiado, será votado nesta quarta-feira.", "titulo_pt": "Dólar sobe e bolsa cai com pacote fiscal indefinido; votação de projeto de ajuste no senado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 273075, "titulo": "Beleza concentra 34% das marcas com crescimento mais acelerado no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/beleza-concentra-34-das-marcas-com-crescimento-mais-acelerado-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de beleza e cuidados pessoais representa 34% das marcas com crescimento mais acelerado no Brasil, conforme identificado pela Bain & Company. Das 53 empresas analisadas, 18 pertencem ao segmento, que tem se destacado com modelos de operação diferentes dos grandes fabricantes.", "titulo_pt": "Beleza concentra 34% das marcas com crescimento mais acelerado no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273154, "titulo": "Senado pede explicações a TCU sobre alíquota de 11,3% da CBS", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/senado-pede-explicacoes-tcu-sobre-aliquota-de-113-da-cbs", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-18T20:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Assuntos Econômicos (CAE) do Senado aprovou um requerimento para pedir explicações ao Tribunal de Contas da União (TCU) e ao Ministério da Fazenda sobre a alíquota de 11,3% da Contribuição sobre Bens e Serviços (CBS). Os parlamentares desejam acessar estudos, metodologias e atas das reuniões técnicas que fundamentaram a recomendação do TCU para 2027.", "titulo_pt": "Senado pede explicações sobre alíquota de 11,3% da CBS", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 273076, "titulo": "ANP rejeita pedidos para suspender processo de revisão das tarifas de gasodutos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/anp-rejeita-pedidos-para-suspender-processo-de-revisao-das-tarifas-de-gasodutos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ANP decidiu manter o processo de revisão das tarifas dos gasodutos brasileiros, apesar de protestos de investidores do setor.", "titulo_pt": "ANP rejeita pedidos para pausar revisão das tarifas de gasodutos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273274, "titulo": "Venda de medicamentos por marketplaces: Anvisa debaterá texto com regras até dezembro", "url": "https://www.jota.info/saude/venda-de-medicamentos-por-marketplaces-anvisa-debatera-texto-com-regras-ate-dezembro", "fonte_id": "jota", "data_pub": "2026-11-18T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa (Agência Nacional de Vigilância Sanitária) está elaborando um documento com regras para a venda de medicamentos por marketplaces. O texto será debatido em reunião e, posteriormente, submetido à consulta pública.", "titulo_pt": "Anvisa debaterá regras para venda de medicamentos por marketplaces até dezembro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273077, "titulo": "Farmacêuticas conseguem revisão na Justiça de multas milionárias pela venda de medicamentos acima do teto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/farmaceuticas-conseguem-revisao-na-justica-de-multas-milionarias-pela-venda-de-medicamentos-acima-do-teto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas farmacêuticas têm conseguido, em tribunais federais, a revisão de multas milionárias aplicadas pela Cmed, órgão da Anvisa, por vender medicamentos acima do teto de preço estabelecido.", "titulo_pt": "Farmacêuticas conseguem revisão judicial de multas milionárias pela venda de medicamentos acima do teto de preço", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273078, "titulo": "Ata do Fed mostra preocupação com inflação e possibilidade de novas altas de juros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/ata-do-fed-mostra-preocupacao-com-inflacao-e-possibilidade-de-novas-altas-de-juros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T19:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ata da reunião do Federal Reserve em outubro mostrou que autoridades do banco central perceberam um risco crescente de inflação e consideraram a possibilidade de intensificar os esforços para controlá-la, mesmo que tenham mantido as taxas de juros estáveis naquele momento.", "titulo_pt": "Ata do Fed revela preocupação com inflação e possibilidade de novas altas de juros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273079, "titulo": "Justiça manda Keeta tirar Pizza Hut do aplicativo por oferecer produtos sem aval", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/justica-manda-keeta-tirar-pizza-hut-do-aplicativo-por-oferecer-produtos-sem-aval.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T19:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça de São Paulo determinou que a plataforma de entregas Keeta retire do seu aplicativo referências à Pizza Hut e que pague uma indenização à rede por danos materiais e morais. O prazo para recurso encerra-se em 11 de dezembro.", "titulo_pt": "Justiça obriga Keeta a tirar Pizza Hut do aplicativo e pagar indenização", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 272795, "titulo": "Nvidia issue part of a supply chain trend: academic", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868019", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O problema da Nvidia faz parte de uma tendência na cadeia de suprimentos. Este é um fenômeno que afeta várias empresas e setores.", "titulo_pt": "Problema da nvidia parte de tendência na cadeia de suprimentos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272800, "titulo": "Nvidia raises outlook, says it can thrive without Huang", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/19/2003867978", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia elevou suas projeções financeiras e afirmou que pode prosperar sem a liderança de Huang. A empresa indicou que continua confiante em seu futuro mesmo após as saídas de algumas de suas lideranças-chave.", "titulo_pt": "Nvidia eleva projeções e afirma que pode prosperar sem Huang", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272801, "titulo": "Nvidia leadership change’s impact on Taiwan remains uncertain: Researchers", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/19/2003867979", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mudança de liderança na Nvidia continua a gerar incertezas quanto ao impacto na Taiwan. Os pesquisadores ainda não têm informações claras sobre como a situação afetará o país.", "titulo_pt": "Mudança de liderança na nvidia continua com incertezas para Taiwan: pesquisadores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 273576, "titulo": "Palmer Luckey thinks China is ‘thrilled to have Jensen out,’ so he wants the ousted Nvidia CEO reinstated", "url": "https://techcrunch.com/2026/11/18/palmer-luckey-thinks-china-is-thrilled-to-have-jensen-out-so-he-wants-the-ousted-nvidia-ceo-reinstated/", "fonte_id": "techcrunch", "data_pub": "2026-11-18T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palmer Luckey, CEO da Anduril, acredita que a saída de Jensen Huang, ex-líder da Nvidia, fortaleceria a China e quer vê-lo reinstalado na empresa.", "titulo_pt": "Palmer Luckey acredita que China se beneficiaria com saída de Jensen e quer vê-lo reinstalado na Nvidia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 273492, "titulo": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO", "url": "https://www.cnbc.com/2026/11/18/jaan-tallinn-anthropic-ipo-series-a-investment.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bilionário de tecnologia estoniano conhecido por sua posição de que a IA poderia acabar com a humanidade está previsto para ser um dos maiores ganhadores da IPO do Anthropic.", "titulo_pt": "Um dos maiores 'doomers' da IA está para se tornar bilionário na IPO do Anthropic", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 273581, "titulo": "America’s AI Chip War Is Heating Up in the Dumbest Possible Ways", "url": "https://www.wired.com/story/the-ai-chip-war-meets-the-jensen-huang-affair/", "fonte_id": "wired", "data_pub": "2026-11-18T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump anunciou medidas para reduzir o acesso da China a chips de inteligência artificial. Parece que um escândalo de fraude do século foi o motivo que faltava para justificar essas ações.", "titulo_pt": "Guerra de chips de IA dos EUA quente com motivos estranhos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 273355, "titulo": "Las consultas a la IA de uno de los presos acusados de querer atentar contra la fiscal que lo metió tras las rejas", "url": "https://www.lanacion.com.ar/seguridad/las-consultas-a-la-ia-de-uno-de-los-presos-acusados-de-querer-atentar-contra-la-fiscal-que-lo-metio-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T21:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Martín Rettori, proprietário de um oficina mecânica em Tigre, é acusado dos delitos de coação e ameaças coativas contra Paula Hertrig, procuradora do Ministério Público de San Isidro. Rettori consultou uma IA sobre essas acusações.", "titulo_pt": "Consultas à IA de um preso acusado de ameaçar procuradora que o encarcerou", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 273554, "titulo": "Huawei case enters jury deliberations after 2-month battle in US courtroom", "url": "https://www.scmp.com/news/us/article/3374967/huawei-case-enters-jury-deliberations-after-2-month-battle-us-courtroom", "fonte_id": "scmp", "data_pub": "2026-11-18T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os jurados começaram a deliberar na terça-feira sobre o caso criminal do governo americano contra a Huawei Technologies, após um julgamento de dois meses que foi uma das processações mais proeminentes de uma gigante tecnológica chinesa recentemente. A Huawei, uma empresa sediada em Shenzhen, enfrenta 12 acusações criminais, incluindo conspiração para racketear, roubo de segredos comerciais, fraude bancária e obstrução de justiça.", "titulo_pt": "Caso huawei entra na fase de deliberação dos jurados após dois meses de julgamento no tribunal americano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 273174, "titulo": "Um em cada quatro brasileiros confia na IA para decidir compras, diz estudo", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/um-em-cada-quatro-brasileiros-confia-na-ia-para-decidir-compras-diz-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um em cada quatro brasileiros confia na inteligência artificial para tomar decisões de compra, de acordo com um estudo. A maioria dos consumidores utiliza tecnologias como ofertas encontradas online, mantendo a decisão final sob seu controle.", "titulo_pt": "Um em cada quatro brasileiros confia na IA para decidir compras, diz estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273496, "titulo": "Nvidia accelerates pay rises as interim CEO seeks to lift staff morale", "url": "https://www.ft.com/content/9ee78a67-fcab-4e43-bee7-09c9244e76b8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Colette Kress conduz reunião geral enquanto o fundador saído Jensen Huang planeja retornar. A Nvidia aumenta os salários para melhorar a moral dos funcionários sob a liderança interina de Kress.", "titulo_pt": "Nvidia acelera aumentos salariais como CEO interino busca melhorar moral dos funcionários", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273410, "titulo": "La chilena que lidera la IA de On Running", "url": "https://www.latercera.com/videos/noticia/la-chilena-que-lidera-la-ia-de-on-running/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T20:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Sofía Cubillos, uma chilena, se tornou a diretora de estratégia de IA na marca de calçados ON, que passou de 50 funcionários para se tornar uma das marcas de esportes mais reconhecidas do mundo em 10 anos. Ela lidera o uso de IA e busca oportunidades de negócios através da tecnologia.", "titulo_pt": "A chilena que lidera a IA na On Running", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 273495, "titulo": "‘Situational Awareness 2.0’: Leopold Aschenbrenner plots comeback", "url": "https://www.ft.com/content/1fcbc6ea-1be3-44d2-b564-8ebf91181639?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Leopold Aschenbrenner, um trader de IA de 25 anos, tem discutido a possibilidade de usar alavancagem novamente e de arrecadar fundos após um quase colapso da empresa.", "titulo_pt": "'Situacional Awareness 2.0': leopold Aschenbrenner planeja recuperação", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273148, "titulo": "Inteligência dos EUA descarta atividade ‘maliciosa’ por trás de falhas tecnológicas", "url": "https://veja.abril.com.br/mundo/inteligencia-dos-eua-descarta-atividade-maliciosa-por-tras-de-falhas-tecnologicas/", "fonte_id": "veja", "data_pub": "2026-11-18T20:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Plataformas devoçais e bancos sofreram falhas nos últimos dias, afetando voos e a rede de comunicações da NSA. A inteligência dos EUA não identificou atividade maliciosa por trás dessas falhas.", "titulo_pt": "Inteligência dos EUA nega atividade maliciosa por trás de falhas tecnológicas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 273466, "titulo": "Trust, but prepare: How to make sense of AI's age of upheaval", "url": "https://www.axios.com/2026/11/18/behind-curtain-outages-ai-prepare", "fonte_id": "axios", "data_pub": "2026-11-18T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os americanos estão confusos e assustados com as frequentes falhas técnicas em áreas como viagens aéreas, bancos e programas de software como o Outlook da Microsoft. Esses problemas parecem ser resultado da explosão da inteligência artificial e de suas consequências imprevistas.", "titulo_pt": "Confie, mas prepare-se: como fazer sentido na era de transformação da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 273582, "titulo": "Australia’s Plan to Manage Neil the Unruly Seal Involves ‘Hazing’ and ‘Seal Enrichment’", "url": "https://www.wired.com/story/australia-neil-the-seal-management-plan/", "fonte_id": "wired", "data_pub": "2026-11-18T19:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo documento de 27 páginas descreve como manter o roedor-mar Neil, viral e problemático, longe de causar danos quando ele chegar à costa. O plano inclui métodos como 'hazing' e 'enriquecimento do habitat' para controlar o comportamento dele.", "titulo_pt" com plantas", "url": "https://www.bbc.com/portuguese/articles/cx987yn9jz54o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-18T19:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado em uma reserva florestal próxima a Manaus, no Amazonas, revelou que musgos são infectados por fungos que manipulam os insetos. Os cientistas buscam agora entender essa interação incomum entre plantas e microrganismos.", "titulo_pt": "Fungos zumbis infectam musgos em estudo na Amazônia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 273598, "titulo": "STAT+: 7 burning questions about the FDA’s post-Overton future", "url": "https://www.statnews.com/2026/11/18/fda-after-heidi-overton-burning-questions-agency-future/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-18T19:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O STAT aborda as questões mais importantes sobre o futuro incerto da FDA após a era Overton.", "titulo_pt": "7 Perguntas ardentes sobre o futuro incerto da FDA após a era overton", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 273599, "titulo": "STAT+: The emerging winners and losers in the AI scribe market", "url": "https://www.statnews.com/2026/11/18/ai-scribe-market-emerging-winners-losers-ai-prognosis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-18T19:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este relatório da AI Prognosis examina como o mercado de redatores de IA está se desenhando, com informações provenientes da conferência HLTH e outros detalhes relevantes.", "titulo_pt": "Os vencedores e perdedores emergentes no mercado de redatores de IA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 273656, "titulo": "MAF EAP – Holidays – How to manage the BAH HUMBUG that tries to sneak in", "url": "https://www.nasa.gov/centers-and-facilities/michoud/maf-eap/maf-eap-holidays-how-to-manage-the-bah-humbug-that-tries-to-sneak-in/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T18:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hábitos de férias podem ser uma pausa divertida durante um ano ocupado, mas podem se tornar estressantes quando a temporada de férias se estende. O texto destaca que a maioria das pessoas enfrenta algum nível de estresse durante as férias.", "titulo_pt": "MAF EAP – férias – como gerenciar o BAH HUMBUG que tenta se esgueirar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 273657, "titulo": "NASA Announces Mid-Power Electric Rocket Challenge for US Companies", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/nasa-announces-mid-power-electric-rocket-challenge-for-us-companies/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T18:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou uma nova competição para empresas americanas desenvolverem protótipos de propulsores de efeito Hall de potência intermediária - um tipo de sistema de propulsão elétrica considerado crucial para futuras operações e exploração espaciais. Estes propulsores usam um campo elétrico para acelerar um gás de propulsão, gerando um thrust eficiente para missões de longa duração.", "titulo_pt": "NASA anuncia desafio de rápidos rápidos rápidos elétricos de potência média para empresas americanas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 272884, "titulo": "Making diversity count: New paper highlights overlooked scientists in the chemical sciences curriculum", "url": "https://phys.org/news/2026-11-diversity-paper-highlights-overlooked-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo artigo de James Wilton-Ely, Ravi Singh e colaboradores examina como a diversificação do currículo pode ajudar a combater
