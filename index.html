ite now", "url": "https://www.theverge.com/ai-artificial-intelligence/1030709/anthropic-has-its-own-ai-powered-office-suite-now", "fonte_id": "the_verge", "data_pub": "2026-11-10T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic lançou uma suite de escritório baseada em IA. A empresa, conhecida por ferramentas para corporações e codificação, está expandindo sua presença no mercado.", "titulo_pt": "Anthropic lança suite de escritório baseada em IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 254270, "titulo": "Pacientes com síndrome de Alagille passam por 6 especialistas, em média, até o diagnóstico", "url": "https://www.jota.info/coberturas-especiais/pacientes-com-sindrome-de-alagille-passam-por-6-especialistas-em-media-ate-o-diagnostico", "fonte_id": "jota", "data_pub": "2026-11-10T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A síndrome de Alagille é uma doença genética rara e multissistêmica que geralmente requer a avaliação de, em média, seis especialistas até ser diagnosticada. O diagnóstico costuma ser tardio e há uma falta de protocolo clínico no Sistema Único de Saúde (SUS).", "titulo_pt": "Pacientes com síndrome de Alagille passam por seis especialistas, em média, até o diagnóstico", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 254359, "titulo": "Mulher com doença rara genética tem 200 tumores espalhados pelo corpo", "url": "https://www.metropoles.com/saude/mulher-com-doenca-rara-genetica-tem-200-tumores-espalhados-pelo-corpo", "fonte_id": "metropoles", "data_pub": "2026-11-10T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma americana diagnosticada com uma doença rara que causa tumores nos nervos tem cerca de 200 nódulos espalhados pelo corpo e sofre bullying nas redes sociais.", "titulo_pt": "Mulher com doença rara genética e 200 tumores espalhados pelo corpo sofre bullying nas redes sociais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 254229, "titulo": "Ex-boxeador é preso após matar vendedor na frente da família em SC", "url": "https://www.cnnbrasil.com.br/nacional/sul/sc/ex-boxeador-e-preso-apos-matar-vendedor-na-frente-da-familia-em-sc/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-boxeador foi preso após matar um vendedor em Santa Catarina. As agressões continuaram mesmo após a vítima cair e ficar desacordada, e o crime foi cometido na presença da esposa e do filho de 3 anos do agressor.", "titulo_pt": "Ex-boxeador é preso após matar vendedor na frente da família em SC", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 254123, "titulo": "Cigarro ilegal também é uma questão de segurança pública", "url": "https://veja.abril.com.br/coluna/por-tras-dos-numeros/cigarro-ilegal-tambem-e-uma-questao-de-seguranca-publica/", "fonte_id": "veja", "data_pub": "2026-11-10T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comércio ilegal de cigarros constitui um desafio significativo para a segurança pública, considerando as penalidades envolvidas, como prisão, fiança e apreensão da carga.", "titulo_pt": "Cigarro ilegal também é uma questão de segurança pública", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 254233, "titulo": "Justiça de SP nega pedido de ONGs para proibir venda de animais na internet", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/justica-de-sp-nega-pedido-de-ongs-para-proibir-venda-de-animais-na-internet/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça de São Paulo negou um pedido de ONGs que buscavam proibir a venda de animais em plataformas online, como Mercado Livre e OLX. As organizações argumentaram que o comércio online promove maus tratos e precificação da vida, mas a decisão foi tomada sob o argumento de que não existe uma lei nacional que proíba o comércio online de pets.", "titulo_pt": "Justiça de SP nega pedido de ONGs para proibir venda de animais na internet", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 254388, "titulo": "Paro transportista enciende aún más debate de Presupuesto y diputados presionan por reforma para rebaja de combustibles", "url": "https://www.latercera.com/politica/noticia/paro-transportista-enciende-aun-mas-debate-de-presupuesto-y-diputados-presionan-por-reforma-para-rebaja-de-combustibles/", "fonte_id": "la_tercera", "data_pub": "2026-11-10T16:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Diputados, como Jaime Araya (indep. PPD), estão trabalhando em propostas para modificar a Constituição para reduzir o IVA ou o imposto sobre combustíveis, evitando as competências presidenciais. Essa ideia já foi apresentada anteriormente, como em 2022, quando a bancada UDI propôs uma reforma, mas agora, com integrantes do governo, os gremialistas decidiram solicitar uma reunião ao ministro Quiroz para discutir a ideia.", "titulo_pt": "Diputados buscam reforma constitucional para reduzir impostos sobre combustíveis", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 254044, "titulo": "Assaí é condenado por restringir ida ao banheiro e assediar funcionários", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/assai-e-condenado-por-restringir-ida-ao-banheiro-e-assediar-funcionarios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rede de atacarejo Assaí foi condenada a pagar R$ 50 mil por danos morais coletivos após ser acusada de restrições ao uso de banheiros, assédio moral e outras irregularidades em uma unidade de Piracicaba (SP). A empresa também foi obrigada a parar de impor desvios de função e escalas imprevisíveis aos funcionários.", "titulo_pt": "Assaí condenado por restrições ao banheiro e assédio moral", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254275, "titulo": "TRT10 reintegra funcionária que denunciou importunação sexual e manda indenizar em R$ 200 mil", "url": "https://www.jota.info/trabalho/trt10-reintegra-funcionaria-que-denunciou-importunacao-sexual-e-manda-indenizar-em-r-200-mil", "fonte_id": "jota", "data_pub": "2026-11-10T13:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A TRT10 (Tribunal Regional do Trabalho da 10ª Região) reintegrou uma funcionária que denunciou importunação sexual e determinou que o empregador indenize o valor de R$ 200 mil. Em um dos episódios relatados, um colega chegou a jogar uma cueca no rosto da funcionária.", "titulo_pt": "TRT10 reintegra funcionária que denunciou importunação sexual e determina indenização de R$ 200 mil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 254649, "titulo": "French students block dozens of schools to 'put pressure on the government'", "url": "https://www.lemonde.fr/en/france/article/2026/11/10/french-students-block-dozens-of-schools-to-put-pressure-on-the-government_6776833_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-10T11:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos de escolas de nível médio em França estão bloqueando várias escolas para pressionar o governo. Isso ocorre dois meses após o início da manifestação estudantil no país.", "titulo_pt": "Estudantes bloqueiam escolas para pressionar o governo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 254372, "titulo": "Parque Tantauco inaugura nueva Casa Museo Sebastián Piñera Echenique", "url": "https://www.latercera.com/nacional/noticia/parque-tantauco-inaugura-nueva-casa-museo-sebastian-pinera-echenique/", "fonte_id": "la_tercera", "data_pub": "2026-11-10T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O novo espaço, localizado no setor norte do Parque Tantauco, oferece tecnologia, museografia interativa e experiências educativas para toda a família, destacando o patrimônio cultural e natural de Chiloé. O local já está aberto ao público.", "titulo_pt": "Parque Tantauco inaugura nova Casa museu Sebastián Piñera Echenique", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 254326, "titulo": "Una amenaza latente: el trágico desenlace de un yaguareté reavivó la preocupación por la reintroducción de la especie", "url": "https://www.lanacion.com.ar/sociedad/una-amenaza-latente-un-yaguarete-que-era-monitoreado-murio-atropellado-y-reavivo-la-preocupacion-por-nid10112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-10T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um jaguatirica de dois anos e meio, que havia começado a se deslocar para fora de uma ilha onde nasceu, morreu atropelado em uma área protegida; esse incidente reavivou preocupações sobre a reintrodução da espécie.", "titulo_pt": "Uma ameaça latente: o trágico fim de um jaguatirica reavivou a preocupação com a reintrodução da espécie", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 254225, "titulo": "Associação do setor de energia nuclear defende operação de Angra 3", "url": "https://www.cnnbrasil.com.br/infra/associacao-defende-angra-3-e-alerta-para-perda-bilionaria-com-paralisacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A associação do setor de energia nuclear defende a operação de Angra 3. O Brasil estaria perdendo bilhões com a paralisação das obras da usina.", "titulo_pt": "Associação do setor nuclear defende operação de Angra 3", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255164, "titulo": "Analysis: Which countries have sent the most delegates to COP31?", "url": "https://www.carbonbrief.org/analysis-which-countries-have-sent-the-most-delegates-to-cop31", "fonte_id": "carbon_brief", "data_pub": "2026-11-10T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 92.000 pessoas se registraram para participar da COP31 de clima em Antalya, Turquia, o que potencialmente torna-a a maior até o momento. O artigo analisa quais países enviaram mais delegados para a COP31.", "titulo_pt": "Análise: quais países enviaram mais delegados para a COP31?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 254230, "titulo": "Fumaça fecha escolas, ginásios e suspende UTI aérea em Parintins", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/fumaca-fecha-escolas-ginasios-e-suspende-uti-aerea-em-parintins/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As escolas e ginásios municipais de Parintins estão fechados, e a UTI aérea foi suspensa devido a uma fumaça. O hospital da cidade registrou aumento no número de pacientes com sintomas respiratórios, levando a rede municipal a adotar ensino remoto de forma temporária.", "titulo_pt": "Fumaça fecha escolas, ginásios e suspende UTI aérea em Parintins", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 254231, "titulo": "Pesquisadores identificam resíduos de anti-inflamatório e remédio para coração em amostras de um dos principais rios do RS", "url": "https://www.cnnbrasil.com.br/ciencia/pesquisadores-identificam-residuos-de-anti-inflamatorio-e-remedio-para-coracao-em-amostras-de-um-dos-principais-rios-do-rs/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores detectaram resíduos de anti-inflamatórios e medicamentos para coração em amostras de um rio importante do Rio Grande do Sul. O estudo indica que há uma falta de efetividade no tratamento da água e sugere a necessidade de investimentos em saneamento.", "titulo_pt": "Pesquisadores identificam resíduos de medicamentos em rio gaúcho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 254314, "titulo": "Alemanha vai investir 15 milhões de euros na proteção e preservação de terras indígenas no Brasil", "url": "https://www.dw.com/pt-br/alemanha-vai-investir-15-milhões-de-euros-na-proteção-e-preservação-de-terras-indígenas-no-brasil/a-79910794?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha anunciou um investimento de 15 milhões de euros na proteção e preservação de terras indígenas no Brasil. O repasse foi oficializado durante a COP31 em Antália, Turquia, e será gerido por entidades indígenas para decidir a aplicação dos recursos.", "titulo_pt": "Alemanha investirá 15 milhões de euros na proteção e preservação de terras indígenas no Brasil", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 254319, "titulo": "O que aconteceu em 30 anos de conferências do clima", "url": "https://www.dw.com/pt-br/o-que-aconteceu-em-30-anos-de-conferências-do-clima/a-74675224?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T12:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A linha do tempo apresenta os principais avanços desde a primeira Conferência das Partes (COP), realizada em Berlim em 1995. Ao longo desses 30 anos, foram realizadas várias conferências internacionais sobre mudanças climáticas com o objetivo de discutir e implementar ações para mitigar o efeito estufa.", "titulo_pt": "O que aconteceu em 30 anos de conferências do clima", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 254868, "titulo": "Japan to use COP31 to showcase environmental technologies", "url": "https://www.japantimes.co.jp/news/2026/11/10/japan/politics/cop31-japan-technologies/", "fonte_id": "japan_times", "data_pub": "2026-11-10T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão vai usar a COP31 para apresentar tecnologias ambientais. Um dos objetivos do evento é aumentar a electrificação mundial para 35% até 2035.", "titulo_pt": "Japão utilizará COP31 para exibir tecnologias ambientais", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 254884, "titulo": "‘Pit of hell’: Turkish mother and daughter lead fight against coal mine", "url": "https://www.japantimes.co.jp/environment/2026/11/10/turkish-fight-against-coal-mine/", "fonte_id": "japan_times", "data_pub": "2026-11-10T05:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Isik e sua filha têm protestado contra projetos minerais que estão destruindo gradualmente a província de Mugla na Turquia há cerca de uma década.", "titulo_pt": "Bunda de inferno: mãe e filha turcas lideram luta contra mina", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 254886, "titulo": "Fossil fuel emissions fall due to Iran war and renewables, research shows", "url": "https://www.japantimes.co.jp/environment/2026/11/10/energy/fossil-fuel-emissions-fall/", "fonte_id": "japan_times", "data_pub": "2026-11-10T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de combustíveis fósseis devem registrar uma queda anual esperada, a primeira desde 2020, quando a pandemia de COVID-19 paralisou a economia global, o comércio e o transporte.", "titulo_pt": "Emissões de combustíveis fósseis caem devido à guerra no Irã e à expansão de energias renováveis, pesquisa mostra", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 254650, "titulo": "Fossil fuel-related CO₂ emissions show slight global drop, an encouraging but insufficient sign", "url": "https://www.lemonde.fr/en/environment/article/2026/11/10/fossil-fuel-related-co-emissions-show-slight-global-drop-an-encouraging-but-insufficient-sign_6776431_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-10T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de CO₂ relacionadas a combustíveis fósseis devem cair em 0,4% este ano, segundo o Projeto Global de Carbono, impulsionadas pelo crescimento da energia renovável e pela crise ongoing na região do Oriente Médio.", "titulo_pt": "Emissões relacionadas a combustíveis fósseis mostram leve queda global, sinal encorajador, mas insuficiente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 255165, "titulo": "Analysis: Fossil-fuel CO2 emissions set to dip in 2026 as Iran conflict hits oil use", "url": "https://www.carbonbrief.org/analysis-fossil-fuel-co2-emissions-set-to-dip-in-2026-as-iran-conflict-hits-oil-use", "fonte_id": "carbon_brief", "data_pub": "2026-11-10T01:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono (CO2) provenientes de combustíveis fósseis e cimento devem diminuir em torno de 0.4% em 2026, totalizando cerca de 38,2 bilhões de toneladas. Esta redução está associada ao impacto do conflito iraniano na utilização de petróleo.", "titulo_pt": "Análise: emissões de CO2 de combustíveis fósseis devem diminuir em 2026 devido ao conflito iraniano", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 255208, "titulo": "Global carbon emissions set to fall in 2026 due to Iran energy shock", "url": "https://www.newscientist.com/article/2598130-global-carbon-emissions-fall-in-2026-due-to-iran-energy-shock/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-10T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono estão projetadas para diminuir em 0,4% neste ano, em parte devido a preços mais altos do petróleo resultantes da interrupção no tráfego marítimo no Estreito de Ormuz.", "titulo_pt": "Emissões globais de carbono devem cair em 2026 devido à perturbação no estreito de Ormuz", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 253091, "titulo": "Nuclear would slow down net zero transition: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/10/2003867475", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos afirmam que a adoção de tecnologias nucleares retardaria o processo de transição para um equilíbrio de zero em termos de emissões de carbono.", "titulo_pt": "Nuclear dificilmente aceleraria a transição para o equilíbrio de zero: grupos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 254304, "titulo": "Jueza ordena liberar a estudiante de UC Berkeley detenida por el ICE en aeropuerto de San Francisco", "url": "https://www.clarin.com/estados-unidos/jueza-ordena-liberar-a-estudiante-de-uc-berkeley-detenida-por-el-ice-en-aeropuerto-de-san-francisco_0_zIiNTARJRy.html", "fonte_id": "clarin", "data_pub": "2026-11-10T17:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma juiza federal ordenou a liberação de uma estudante da UC Berkeley que foi detida pelo ICE no aeroporto de San Francisco, citando uma violação ao direito processual. A jovem colombiana poderá continuar seu processo de asilo em liberdade.", "titulo_pt": "Juiza ordena libertar estudante da UC Berkeley detida pelo ICE no aeroporto de San Francisco", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 254483, "titulo": "Entre 2021 y 2024: denuncias que exMejor Niñez envió a fiscalía por riesgo de explotación sexual de NNA aumentaron un 166%", "url": "https://www.ciperchile.cl/2026/11/10/entre-2021-y-2024-denuncias-que-exmejor-ninez-envio-a-fiscalia-por-riesgo-de-explotacion-sexual-de-nna-aumentaron-un-166/?utm_source=rss&utm_medium=rss&utm_campaign=entre-2021-y-2024-denuncias-que-exmejor-ninez-envio-a-fiscalia-por-riesgo-de-explotacion-sexual-de-n   const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";

      const tit = n.titulo_pt || n.titulo;

      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>

  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {

function ativar(id) {

function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
