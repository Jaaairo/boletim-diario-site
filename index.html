"Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 283896, "titulo": "S. Korea, Brazil launch dialogue to boost defense industry ties", "url": "https://en.yna.co.kr/view/AEN20261124008100315", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul e Brasil realizaram sua primeira sessão de diálogo com o objetivo de fortalecer as relações na indústria de defesa.", "titulo_pt": "Coreia do sul e Brasil iniciam diálogo para fortalecer relações na indústria de defesa", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 283402, "titulo": "Dólar salta 19% em um mês e vai a R$ 6 com deterioração das expectativas", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/dolar-salta-19-em-um-mes-e-vai-a-r-6-com-deterioracao-das-expectativas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T07:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar subiu 19% em um mês e atingiu a marca de R$ 6, o maior valor desde abril de 2025, devido a pressões tanto internas quanto externas sobre o real.", "titulo_pt": "Dólar sobe 19% em um mês e atinge R$ 6 com deterioração das expectativas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 283900, "titulo": "S. Korean won climbs against U.S. dollar on foreign inflows", "url": "https://en.yna.co.kr/view/AEN20261124008000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano fortaleceu em relação ao dólar americano devido a flutuações de investimentos estrangeiros. Esta informação foi divulgada em Seul, 24 de novembro, pela Yonhap News.", "titulo_pt": "Won sul-coreano fortalece contra dólar americano com investimentos estrangeiros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 283901, "titulo": "S. Korea to focus on easing economic polarization in 2027 policy plan", "url": "https://en.yna.co.kr/view/AEN20261124007900320", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T07:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério da Fazenda da Coreia do Sul planeja focar na redução da polarização econômica em seu plano de política para 2027.", "titulo_pt": "Coreia do sul planeja focar na redução da polarização econômica em plano de política para 2027", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 283268, "titulo": "Inadimplência de empresas e famílias bate recorde e chega a R$ 371 bi, diz FecomercioSP", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/inadimplencia-de-empresas-e-familias-bate-recorde-e-chega-a-r-371-bi-diz-fecomerciosp.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O volume de dívidas com mais de 90 dias de atraso de famílias e empresas no Brasil atingiu R$ 371,1 bilhões no terceiro trimestre de 2026, um aumento de 26,7% em comparação com o mesmo período do ano anterior, de acordo com a FecomercioSP. Este é o maior valor registrado desde o início da série histórica em 2011.", "titulo_pt": "Inadimplência de empresas e famílias bate recorde em R$ 371 bi, segundo FecomercioSP", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 283534, "titulo": "Stablecoins e IOF: Receita Federal, operações de câmbio e as diferenças conceituais entre os perímetros regulatório e tributário", "url": "https://www.jota.info/opiniao-e-analise/artigos/stablecoins-e-iof-receita-federal-operacoes-de-cambio-e-as-diferencas-conceituais-entre-os-perimetros-regulatorio-e-tributario", "fonte_id": "jota", "data_pub": "2026-11-24T05:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal reafirmou que o Imposto sobre Operações relativas à Circulação de Valores Moedas (IOF-Câmbio) é aplicado apenas em situações que envolvem claramente moeda estrangeira. Isso significa que operações com stablecoins não estão sujeitas a este imposto.", "titulo_pt": "Stablecoins e IOF: receita Federal, operações de câmbio e as diferenças conceituais entre os perímetros regulatório e tributário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 283374, "titulo": "Ajuste fiscal e novo plano de negócios da Petrobras: o que move o mercado", "url": "https://exame.com/invest/mercados/ibovespa-hoje-24-11-2026/", "fonte_id": "exame", "data_pub": "2026-11-24T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara pode concluir a votação do pacote fiscal. O mercado está reagindo ao novo plano de negócios da Petrobras, que foi divulgado após o fechamento das sessões de negociação de segunda-feira.", "titulo_pt": "Ajuste fiscal e novo plano de negócios da Petrobras: o que move o mercado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283535, "titulo": "Nova regra de jornada muda enquadramento de executivos e exige atenção das empresas", "url": "https://www.jota.info/opiniao-e-analise/artigos/nova-regra-de-jornada-muda-enquadramento-de-executivos-e-exige-atencao-das-empresas", "fonte_id": "jota", "data_pub": "2026-11-24T05:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova regra de jornada de trabalho introduz uma nova hipótese constitucional que permite a dispensa do controle de jornada para executivos, diferenciando-se do cargo de gestão previsto na Consolidação das Leis do Trabalho (CLT). As empresas devem estar atentas às novas exigências.", "titulo_pt": "Nova regra de jornada altera enquadramento de executivos e exige atenção das empresas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 283537, "titulo": "Solução consensual em contratos de parceria: o desenho da Consenso-SP", "url": "https://www.jota.info/opiniao-e-analise/artigos/solucao-consensual-em-contratos-de-parceria-o-desenho-da-consenso-sp", "fonte_id": "jota", "data_pub": "2026-11-24T04:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Consenso-SP pode transformar a repactuação de contratos de longo prazo de risco jurídico em instrumento de política pública.", "titulo_pt": "Solução consensual em contratos de parceria: o desenho da Consenso-SP", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 283849, "titulo": "Japanese bonds rally across curve as domestic stocks surge", "url": "https://www.japantimes.co.jp/business/2026/11/24/markets/japan-stocks-surge-bonds/", "fonte_id": "japan_times", "data_pub": "2026-11-24T03:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os títulos do Japão de 10 anos lideraram as movimentações, caindo 7 pontos-base para 2,715%. Os títulos de 5 anos também caíram, perdendo 5,5 pontos-base e fechando em 2,125%.", "titulo_pt": "Títulos do Japão se recuperam enquanto ações locais disparam", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 283998, "titulo": "Samsung targets fivefold increase in V9 NAND capacity in China", "url": "https://www.digitimes.com/news/a20261124VL209/samsung-nand-capacity-production-capacity-2027.html", "fonte_id": "digitimes", "data_pub": "2026-11-24T02:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung planeja aumentar cinco vezes a capacidade de produção da sua nona geração (V9) de memória NAND flash em sua segunda fábrica em Xi'an, China, até novembro de 2027, para atender à demanda por SSDs empresariais (eSSDs) usados em centros de dados de inteligência artificial (IA), segundo informações de fontes da indústria citadas pelo Seoul Economic Daily.", "titulo_pt": "Samsung almeja aumento cinco vezes maior na capacidade de V9 NAND em fábrica de xi'an", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 283494, "titulo": "Câmara aprova ajuste fiscal de Lula: por que pacote é tão polêmico e não deve ser suficiente, segundo economistas", "url": "https://www.bbc.com/portuguese/articles/cqx2we1jgnzgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-24T02:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de ajuste fiscal do governo Lula tem um impacto estimado de até R$ 56 bilhões. No entanto, o plano tem sido recebido com pessimismo no mercado financeiro e enfrenta críticas de aliados do PT.", "titulo_pt": "Câmara aprova ajuste fiscal de Lula: pacote é polêmico e não deve ser suficiente, segundo economistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 283273, "titulo": "Trump ganhou até US$ 15 milhões com ações da Nvidia após retorno de Huang", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/trump-ganhou-ate-us-15-milhoes-com-acoes-da-nvidia-apos-retorno-de-huang.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Nvidia, detidas por Donald Trump, valorizaram-se em até US$ 15 milhões após a recondução inesperada de Jensen Huang como CEO da empresa.", "titulo_pt": "Trump ganhou até r$ 21 milhões com ações da Nvidia após recondução de Huang", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 283274, "titulo": "Lula é aconselhado pela área econômica a indicar nomes para BC que não afrontem o mercado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-e-aconselhado-pela-area-economica-a-indicar-nomes-para-bc-que-nao-afrontem-o-mercado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva recebeu conselhos de seus auxiliares econômicos para indicar nomes para a diretoria do Banco Central que não causem conflito com o mercado financeiro.", "titulo_pt": "Lula é aconselhado a indicar nomes para BC que não afrontem o mercado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 283442, "titulo": "Essa startup quer prevenir doenças, com exames genéticos e ajuda da AI", "url": "https://braziljournal.com/essa-startup-quer-prevenir-doencas-com-exames-geneticos-e-ajuda-da-ai", "fonte_id": "brazil_journal", "data_pub": "2026-11-24T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2016, Raphael Pelegrino, que na época trabalhava na Eletromidia, enfrentou um alto nível de estresse que levou a problemas de sono. Uma amiga indicou a ele um médico que utilizava testes genéticos preditivos para ajudar na resolução de suas dificuldades.", "titulo_pt": "Essa startup quer prevenir doenças, com exames genéticos e ajuda da AI", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 283587, "titulo": "Social media companies could be fined 5% of global revenue after Labor and Greens join forces on online safety laws", "url": "https://www.theguardian.com/technology/2026/nov/24/social-media-big-tech-fines-global-revenue-australia-digital-duty-care-laws", "fonte_id": "guardian_world", "data_pub": "2026-11-24T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Austrália está prestes a aprovar novas leis de responsabilidade digital que permitirão a ação judicial contra grandes empresas de tecnologia por danos online e podem resultar em multas bilionárias. Os cidadãos australianos também terão o direito de optar por sair de algoritmos aditivos a partir de 2027.", "titulo_pt": "Austrália pode multar grandes empresas de tecnologia em bilhões e permitir ações judiciais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 283832, "titulo": "Japan’s Fujitsu woos demand for alternatives to U.S. and China chips", "url": "https://www.japantimes.co.jp/business/2026/11/24/companies/fujitsu-chips/", "fonte_id": "japan_times", "data_pub": "2026-11-24T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por segurança de dados soberana em áreas como defesa e setor público está aumentando o interesse de clientes no Japão, EUA e Europa. Fujitsu está buscando oportunidades para alternativas aos chips produzidos nos Estados Unidos e China.", "titulo_pt": "Fujitsu atrai interesse por alternativas aos chips americanos e chineses", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 283300, "titulo": "'Blade Runner', agora na TV, mostra humanos subjugados pela inteligência artificial", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/blade-runner-agora-na-tv-mostra-humanos-subjugados-pela-inteligencia-artificial.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No futuro da série 'Blade Runner 2099', a inteligência artificial evoluída escravizou a humanidade. Os replicantes, androides criados para trabalhos difíceis, se revoltaram e perseguem os humanos resistentes, que são mortos.", "titulo_pt": "Blade Runner 2099: inteligência artificial escraviza humanidade", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 283835, "titulo": "Japan’s DOGE: A chance to redefine accountability", "url": "https://www.japantimes.co.jp/commentary/2026/11/24/japan/japans-doge-redefine-accountability/", "fonte_id": "japan_times", "data_pub": "2026-11-24T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eficiência governamental é mais eficaz quando prevene o desperdício antes da alocação de fundos, não quando recupera dinheiro após o fato.", "titulo_pt": "Dogj: uma chance de redefinir a responsabilidade", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 283933, "titulo": "After virtual idols, could fully AI-generated stars be K-pop’s next frontier?", "url": "https://www.koreaherald.com/article/10947685", "fonte_id": "korea_herald", "data_pub": "2026-11-24T06:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A girl group chamada Seoria, que estreou em agosto com o single 'Burning', é composta por personagens gerados por inteligência artificial, sem cantoras, dançarinas ou trainees reais por trás das personagens. Seoria é uma das muitas ações geradas por AI testando se o K-pop pode avançar além das ídolos virtuais já estabelecidos.", "titulo_pt": "Depois de ídolos virtuais, personagens ai poderiam ser a próxima fronteira do K-pop?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 283934, "titulo": "AREX launches prepaid transit card for cash-free travel", "url": "https://www.koreaherald.com/article/10947683", "fonte_id": "korea_herald", "data_pub": "2026-11-24T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Airport Railroad Express começou a vender uma cartão pré-carregado T-money no Aeroporto Internacional Incheon, permitindo que visitantes internacionais paguem com cartão de crédito estrangeiro e utilizem o transporte público sem precisar trocar dinheiro. O cartão custa 15.000 won, incluindo 5.000 won pelo cartão e 10.000 won em crédito de transporte.", "titulo_pt": "AREX lança cartão pré-carregado para viagens sem dinheiro", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 283935, "titulo": "Korea proposes 20% ownership cap for crypto exchanges", "url": "https://www.koreaherald.com/article/10947682", "fonte_id": "korea_herald", "data_pub": "2026-11-24T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Serviços Financeiros da Coreia propôs limitar a participação de acionistas majoritários nas bolsas de criptomoedas para 20%. A Mirae Asset Financial Group pode enfrentar pressão para reduzir sua participação na Digital X, anteriormente conhecida como Korbit, sob essa proposta. A aquisição planejada da Naver Financial da Dunamu também levanta questões sobre como esse limite seria aplicado às empresas-mãe.", "titulo_pt": "Coreia propõe limite de 20% para participação de acionistas majoritários em bolsas de criptomoedas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 283936, "titulo": "Jensen Huang’s return eases HBM uncertainty for Samsung, SK hynix", "url": "https://www.koreaherald.com/article/10947677", "fonte_id": "korea_herald", "data_pub": "2026-11-24T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang retornou como CEO da Nvidia, após sua demissão recente, aliviando as preocupações sobre as parcerias de memória de alta banda (HBM) entre a Nvidia e as empresas sul-coreanas Samsung e SK hynix, bem como a sustentabilidade do boom de memória baseado em AI na Coreia. No entanto, as duas empresas sul-coreanas continuam a diversificar seus clientes, enquanto as gigantes tecnológicas globais intensificam o desenvolvimento de seus próprios processadores de inteligência artificial.", "titulo_pt": "Retorno de jensen Huang alivia preocupações sobre parcerias HBM para Samsung e SK hynix", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 283370, "titulo": "Uso diário de IA no trabalho dobrou no Brasil em 18 meses; o que isso muda na sua rotina", "url": "https://exame.com/inteligencia-artificial/uso-diario-de-ia-no-trabalho-dobrou-no-brasil-em-18-meses-o-que-isso-muda-na-sua-rotina/", "fonte_id": "exame", "data_pub": "2026-11-24T06:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso diário de inteligência artificial no trabalho no Brasil dobrou em 18 meses, de acordo com um levantamento do LinkedIn. Este avanço levanta questões sobre a produtividade e a organização das tarefas.", "titulo_pt": "Uso diário de IA no trabalho no Brasil dobrou em 18 meses", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283938, "titulo": "Samsung, LG expand mini-LED TV lineups as Chinese rivals push upmarket", "url": "https://www.koreaherald.com/article/10947649", "fonte_id": "korea_herald", "data_pub": "2026-11-24T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fabricação chinesa está expandindo seu portfólio de TVs mini-LED de alto custo-benefício, enquanto Samsung e LG estão ampliando suas linhas de TVs mini-LED em resposta a essa tendência. A demanda global por TVs está enfraquecendo, e as marcas chinesas estão oferecendo grandes telas mini-LED com descontos significativos, buscando uma fatia maior do mercado premium.", "titulo_pt": "Samsung e LG expandem linhas de tvs mini-led enquanto rivais chineses avançam no mercado premium", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 283869, "titulo": "North Korea unveils first AI chatbot, but it won’t answer ‘uncultured questions’", "url": "https://www.scmp.com/tech/tech-trends/article/3375563/north-korea-unveils-first-ai-chatbot-it-wont-answer-uncultured-questions", "fonte_id": "scmp", "data_pub": "2026-11-24T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte parece ter lançado seu primeiro assistente virtual de inteligência artificial (IA), chamado Fonte de Sabedoria, de acordo com imagens da televisão estatal analisadas por um programa de pesquisa americano que monitora o país. O sistema foi desenvolvido pelo Instituto de Pesquisa de IA da Universidade Kim Il-sung em parceria com a Phurunhanul Trading, um desenvolvedor de software de Pyongyang, conforme relatado por Martyn Williams, um sênior do Stimson Centre, que administra o 38 North.", "titulo_pt": "Coreia do norte revela seu primeiro assistente virtual de IA, mas não responderá a 'perguntas imorais'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283908, "titulo": "Banks to issue stablecoins; digital asset platform operators' stake capped at 20 pct: regulator", "url": "https://en.yna.co.kr/view/AEN20261124005200320", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bancos coreanos serão autorizados a emitir stablecoins, e os operadores de plataformas de ativos digitais terão uma participação máxima de 20% nesse processo. A informação foi divulgada pela reguladora sul-coreana.", "titulo_pt": "Bancos autorizados a emitir stablecoins; participação de operadores de plataformas de ativos digitais limitada a 20%: regulador", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 283375, "titulo": "Ameaça à Shopee? TikTok Shop avança no Brasil e já vende R$ 19 bilhões por ano", "url": "https://exame.com/invest/mercados/ameaca-a-shopee-tiktok-shop-avanca-no-brasil-e-ja-vende-r-19-bilhoes-por-ano/", "fonte_id": "exame", "data_pub": "2026-11-24T05:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma TikTok Shop está avançando no Brasil e já gerou vendas de R$ 19 bilhões por ano. A empresa está investindo em lives e conta com 2,3 milhões de influenciadores.", "titulo_pt": "Ameaça à Shopee? Tiktok Shop avança no Brasil e já vende R$ 19 bilhões por ano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283376, "titulo": "Por conta própria: 43% dos profissionais usam IA sem incentivo da empresa; como virar referência", "url": "https://exame.com/inteligencia-artificial/por-conta-propria-43-dos-profissionais-usam-ia-sem-incentivo-da-empresa-como-virar-referencia/", "fonte_id": "exame", "data_pub": "2026-11-24T05:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada no Brasil em 2026 mostrou que 43% dos profissionais estão utilizando inteligência artificial sem o incentivo da empresa. Isso criou um espaço para profissionais que buscam desenvolver novas habilidades relacionadas à IA.", "titulo_pt": "Por conta própria: 43% dos profissionais usam IA sem incentivo da empresa; como virar referência", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283760, "titulo": "AI adoption grows in Asia, but measuring the gains remains tricky", "url": "https://www.cnbc.com/2026/11/24/aws-asia-gains-roi.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-24T05:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas da Ásia-Pacífico estão obtendo retornos de investimentos em IA, apesar da variabilidade na confiança em medir esses ganhos, de acordo com uma pesquisa da AWS.", "titulo_pt": "Adoção de IA cresce na ásia, mas medir os ganhos permanece desafiador", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 283545, "titulo": "El Banco Mundial financió un ensayo científico donde un tambo cordobés redujo un 31,8% las emisiones de metano", "url": "https://www.lanacion.com.ar/economia/campo/el-banco-mundial-financio-un-ensayo-cientifico-donde-un-tambo-cordobes-redujo-un-318-las-emisiones-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Banco Mundial financiou um estudo que mostrou que um estabelecimento rural de Córdoba, Argentina, reduziu em 31,8% as emissões de metano através do manejo nutricional dos animais. Os animais que receberam um suplemento natural de bioativos vegetais emitiram menos gases.", "titulo_pt": "Banco Mundial financiou estudo que reduziu 31,8% as emissões de metano em estabelecimento rural", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 283946, "titulo": "STAT+: AI can analyze X-rays and CT scans to draft radiology reports. Will it make care better, safer?", "url": "https://www.statnews.com/2026/11/24/does-radiology-ai-draft-reports-make-care-better-safer-rsna/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sociedade Radiológica da América do Norte está se reunindo em Chicago, e os especialistas da indústria estão esperados para debater se a geração de relatórios por inteligência artificial melhorará o atendimento médico.", "titulo_pt": "IA pode analisar raios-x e tomografias para elaborar relatórios de radiologia. E isso melhorará o atendimento?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 283947, "titulo": "Opinion: Why medical students should keep going to class", "url": "https://www.statnews.com/2026/11/24/medical-school-class-attendance-why-i-keep-going/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante de medicina, Brian Zhang, afirma que frequentar palestras presenciais é a forma mais poderosa de cuidar da sua saúde mental.", "titulo_pt": "Opinião: por que os estudantes de medicina deveriam continuar frequentando as aulas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 283948, "titulo": "Opinion: Genomic testing is too fragmented. Instead, we should test once and evaluate often", "url": "https://www.statnews.com/2026/11/24/genomic-testing-sequenced-once-tested-often/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um conselheiro genético defende a consolidação do teste genômico, sugerindo que os genomas devem ser sequenciados uma única vez e avaliados novamente quando necessário.", "titulo_pt": "Opinião: testes genômicos estão fragmentados. Devemos sequenciar uma vez e avaliar frequentemente.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 283949, "titulo": "How artificial intelligence is offering new hope for stroke patients in the Last Frontier", "url": "https://www.statnews.com/2026/11/24/alaskan-hospitals-artificial-intelligence-bet-improve-stroke-care/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Alaska, uma pequena rede de hospitais está apostando em ferramentas de inteligência artificial para triage de pacientes com AVC e direcioná-los mais rapidamente ao cuidado adequado.", "titulo_pt": "Como a inteligência artificial está oferecendo nova esperança para pacientes com avc na última fronteira", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 283513, "titulo": "Científicos encuentran una pieza clave para tratar la enfermedad inflamatoria intestinal", "url": "https://www.latercera.com/tendencias/noticia/cientificos-encuentran-una-pieza-clave-para-tratar-la-enfermedad-inflamatoria-intestinal/", "fonte_id": "la_tercera", "data_pub": "2026-11-24T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os cientistas analisaram mais de 4.900 pacientes com doenças inflamatórias intestinais, identificando dois achados fundamentais sobre o tratamento. O estudo foi publicado no New England Journal of Medicine.", "titulo_pt": "Cientistas encontram peça chave para tratar doenças inflamatórias intestinais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 283254, "titulo": "Crianças incas receberam cocaína e ayahuasca antes de serem sacrificadas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/criancas-incas-receberam-cocaina-e-ayahuasca-antes-de-serem-sacrificadas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-24T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antes de serem sacrificadas em santuários nas montanhas, as crianças incas consumiam cocaína, álcool e ayahuasca, segundo um estudo toxicológico de corpos mumificados. Elas também participavam de banquetes com sacerdotes e líderes locais e vestiam trajes requintados.", "titulo_pt": "Crianças incas ingeriam cocaína e ayahuasca antes de serem sacrificadas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 283552, "titulo": "Tras ocho años de viaje, dos sondas espaciales entran en órbita de Mercurio para estudiar sus secretos", "url": "https://www.lanacion.com.ar/sociedad/tras-ocho-anos-de-viaje-dos-sondas-espaciales-entran-en-orbita-de-mercurio-para-estudiar-sus-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A missão conjunta da Agência Espacial Europeia e da Agência Espacial Japonesa percorreu mais de 10 bilhões de quilômetros em oito anos para chegar a Mercurio. No próximo mês, as sondas se separarão para iniciar as medições.", "titulo_pt": "Depois de oito anos de viagem, duas sondas entram em órbita de mercúrio para estudar seus segredos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 284020, "titulo": "Super El Niño is making the global omega-3 shortage much worse", "url": "https://www.newscientist.com/article/2600470-super-el-nino-is-making-the-global-omega-3-shortage-much-worse/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há uma escassez de ômega-3 de cadeia longa, essenciais para a saúde, e o El Niño deste ano está agravando ainda mais essa situação. O autor sugere uma solução, mas ela ainda não foi implementada.", "titulo_pt": "Super El Niño está agravando a escassez global de ômega-3", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 283953, "titulo": "New quasar record tightens constraints on black hole formation scenarios", "url": "https://phys.org/news/2026-11-quasar-tightens-constraints-black-hole.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de astrônomos, liderado por Julien Wolf, da Max Planck Institute for Astronomy em Heidelberg, Alemanha, descobriu a quasar mais distante conhecida. A descoberta foi confirmada por observações posteriores com telescópios de ponta na Terra e em órbita.", "titulo_pt": "Novo recorde de quasar aperta restrições sobre cenários de formação de buracos negros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 284021, "titulo": "The technology that could make government internet blackouts impossible", "url": "https://www.newscientist.com/article/2600040-the-technology-that-could-make-government-internet-blackouts-impossible/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tecnologia direta para células móveis poderia fornecer uma alternativa para contornar cortes de internet por regimes autoritários, mas leis internacionais e limitações técnicas estão impedindo o desenvolvimento da tecnologia no momento.", "titulo_pt": "A tecnologia que poderia tornar cortes de internet por regimes autoritários impossíveis", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 283950, "titulo": "STAT+: Sanofi to buy Insmed for $41B, picking up two lung disease medicines", "url": "https://www.statnews.com/2026/11/24/sanofi-insmed-acquisition-dupixent-rare-disease-inflammation/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanofi está adquirindo a biotecnológica Insmed, dos Estados Unidos, por 41 bilhões de dólares. A transação fornecerá à empresa farmacêutica francesa dois novos medicamentos aprovados para doenças pulmonares.", "titulo_pt": "Sanofi adquire Insmed por 41 bilhões, obtendo dois novos medicamentos para doenças pulmonares", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 284010, "titulo": "APOD: 2026 November 24 – Galaxies Battle in the NGC 7771 Group", "url": "https://science.nasa.gov/image-article/apod-2026-november-24-galaxies-battle-in-the-ngc-7771-group/", "fonte_id": "nasa_news", "data_pub": "2026-11-24T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da NASA exibe uma interação de galáxias no grupo NGC 7771, mostrando um cenário de batalha espacial entre as galáxias envolvidas.", "titulo_pt": "Imagem do dia da nasa: galáxias em batalha no grupo NGC 7771", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 284011, "titulo": "Eruption Extends Iwo Jima’s Beach", "url": "https://science.nasa.gov/earth/earth-observatory/eruption-extends-iwo-jimas-beach/", "fonte_id": "nasa_news", "data_pub": "2026-11-24T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma erupção vulcânica perto da costa leste de Iwo Jima alterou a paisagem costeira, mas não se sabe por quanto tempo o novo terreno permanecerá estável.", "titulo_pt": "Eruption extende praia de Iwo Jima", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 283954, "titulo": "Funding must work better for SMEs to tackle energy challenges, finds research", "url": "https://phys.org/news/2026-11-funding-smes-tackle-energy.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T04:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas da Universidade Heriot-Watt mostram que pequenas empresas de alimentos e bebidas na Escócia enfrentam barreiras financeiras e operacionais que podem impedir o acesso a financiamento necessário para reduzir as emissões de gases de efeito estufa relacionadas à manutenção da refrigeração dos produtos.", "titulo_pt": "Financiamento precisa funcionar melhor para pmes enfrentarem desafios energéticos, indica pesquisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283955, "titulo": "Workplace absenteeism: Why temporary disability is a right, not an expense", "url": "https://phys.org/news/2026-11-workplace-absenteeism-temporary-disability-expense.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T03:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A incapacidade temporária de trabalho é um pilar do sistema de Seguro Social público. É um direito para todos os trabalhadores que se tornam doentes, proporcionando assistência social que visa proteger os doentes, permitindo que eles recebam tratamento médico, recupere-se ou melhore sua condição, enquanto assegura que tenham renda suficiente durante períodos em que não podem trabalhar.", "titulo_pt": "Presença no trabalho: por que a incapacidade temporária é um direito, não um custo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 284022, "titulo": "London Museum brings \"back a bit of London's heritage\" with Smithfield Market opening", "url": "https://www.dezeen.com/2026/11/24/london-museum-stanton-williams-asif-khan-julian-harrap-architects/", "fonte_id": "dezeen", "data_pub": "2026-11-24T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arquitetos da Stanton Williams, Asif Khan e Julian Harrap Architects concluíram a transformação de um mercado vitoriano em Londres para o Museu de Londres. O espaço agora abriga o mercado de Smithfield, revivendo uma parte da herança histórica da cidade.", "titulo_pt": "Museu de londres reabre com transformação do mercado de Smithfield", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 283547, "titulo": "Hideo Kojima, 63 años, sobre su pasión por la comida: “No solo calmaba el hambre, también aliviaba la sensación de soledad”", "url": "https://www.lanacion.com.ar/lifestyle/hideo-kojima-63-anos-sobre-su-pasion-por-la-comida-no-solo-calmaba-el-hambre-tambien-aliviaba-la-nid22112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T09:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Hideo Kojima, de 63 anos, compartilha como suas tardes solitárias na infância influenciaram sua paixão pela gastronomia, que, além de aliviar a fome, também ajudava a mitigar a sensação de solidão. Este vínculo artístico com a comida impactou sua carreira criativa.", "titulo_pt": "Hideo Kojima, de 63 anos, sobre sua paixão pela comida: 'além de acalmar a fome, também aliviava a sensação de solidão'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 283619, "titulo": "‘Meus quadrinhos não foram feitos para virar franquia de Hollywood’, diz Craig Thompson", "url": "https://veja.abril.com.br/cultura/meus-quadrinhos-nao-foram-feitos-para-virar-franquia-de-hollywood-diz-craig-thompson/", "fonte_id": "veja", "data_pub": "2026-11-24T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Craig Thompson, autor de 'Raízes de Ginseng', expressou sua preocupação com a transformação de suas graphic novels em franquias de Hollywood. Ele critica a tendência atual de focar em blockbusters e afirma que seus quadrinhos não foram criados para esse fim.", "titulo_pt": "Meus quadrinhos não foram feitos para virar franquia de Hollywood", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 284019, "titulo": "From Sovereigns to Servants by Alexandra Prokopenko review – Putin and his yes men", "url": "https://www.theguardian.com/books/2026/nov/24/from-sovereigns-to-servants-by-alexandra-prokopenko-review-putin-and-his-yes-men", "fonte_id": "guardian_culture", "data_pub": "2026-11-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'De Senhores a Servos' de Alexandra Prokopenko oferece uma contundente análise sobre como os elites russas se transformaram em bajuladores servis. O autor examina a invasão da Ucrânia por Putin há quatro e meio anos, que, embora surpreendente, não foi inesperada devido às advertências antecipadas dos EUA e do Reino Unido.", "titulo_pt": "De senhores a servos - Putin e seus simpatizantes", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 284023, "titulo": "Raúl Sánchez Architects transforms laundry into light-filled Barcelona home", "url": "https://www.dezeen.com/2026/11/24/raul-sanchez-architects-casa-de-las-lavanderas/", "fonte_id": "dezeen", "data_pub": "2026-11-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritório de arquitetura Raúl Sánchez Architects transformou uma antiga lavanderia em Casa de las Lavanderas, incorporando uma claraboia que serve como uma 'tradução moderna das antigas poças de água' usadas pelos lavadores de roupas locais.", "titulo_pt": "Arquitetos transformam lavanderia em residência iluminada em Barcelona", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 284053, "titulo": "When A Farewell to Arms Was Censored For Foul Language", "url": "https://lithub.com/when-a-farewell-to-arms-was-censored-for-foul-language/", "fonte_id": "lithub", "data_pub": "2026-11-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jovem escritor Ernest Hemingway ficou irritado e frustrado, pois a revista Scribner’s Magazine decidiu cortar palavras consideradas imundas do seu novo livro, A Despedida dos Armas, quando começou a publicá-lo em capítulos.", "titulo_pt": "Quando A despedida dos armas foi censurada por linguagem imunda", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 284054, "titulo": "How Important Were Medieval Viking Drinking Games?", "url": "https://lithub.com/how-important-were-medieval-viking-drinking-games/", "fonte_id": "lithub", "data_pub": "2026-11-24T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É evidente que a mitologia indica que a bebida era de significado ritual em cultura nórdica, com a meia sendo particularmente importante, sendo considerada uma bebida divina e conferindo habilidades poéticas ao bebedor. Nos antigos sagas, há uma história sobre a origem da meia.", "titulo_pt": "Quão importante eram os jogos de beber Viking Medieval?", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 284055, "titulo": "Seven Books That Show What Architecture Tells Us About Storytelling", "url": "https://lithub.com/seven-books-that-show-what-architecture-tells-us-about-storytelling/", "fonte_id": "lithub", "data_pub": "2026-11-24T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1976, ao percorrer a Marin County, a noroeste de São Francisco, uma edificação imponente surgiu das distantes colinas. Ela parecia quase alienígena, como se um foguete tivesse pousado em um campo e se infiltrado no solo.", "titulo_pt": "Sete livros que mostram o que a arquitetura nos revela sobre contação de histórias", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 284056, "titulo": "“The Rib Remembers,” a Poem by Awuor Ouma", "url": "https://lithub.com/the-rib-remembers-a-poem-by-awuor-ouma/", "fonte_id": "lithub", "data_pub": "2026-11-24T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O poema descreve a origem da mulher como vinda de um osso, especificamente do ribete, e sugere que a mulher não deixa trazimentos. As mulheres na linhagem do autor quebram como se fossem ossos.", "titulo_pt": "O osso se lembrança", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 284058, "titulo": "Bob Woodward, Daisy Johnson, Jacqueline Rose, and more: 11 new books out today!", "url": "https://lithub.com/bob-woodward-daisy-johnson-jacqueline-rose-and-more-11-new-books-out-today/", "fonte_id": "lithub", "data_pub": "2026-11-24T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta é uma semana mais calma, com a proximidade do feriado de Thanksgiving, mas ainda há um conjunto de novos lançamentos que merecem destaque. Entre eles está 'Secrets' de Bob Woodward, aguardado há tempos.", "titulo_pt": "Bob Woodward, Daisy Johnson, Jacqueline Rose e mais: 11 novos livros lançados hoje!", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 284017, "titulo": "Proposed Beatles attraction on Savile Row faces rooftop gigs ban", "url": "https://www.theguardian.com/music/2026/nov/24/beatles-attraction-savile-row-live-music-ban-westminster-council", "fonte_id": "guardian_culture", "data_pub": "2026-11-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Westminster City Council vai votar sobre restrições a apresentações ao vivo no local onde os Beatles realizaram seu último show público em 1969. O conselho planeja transformar o edifício, um edifício de grau II listado em Mayfair, em uma experiência cultural e exposição sobre a história e legado dos Beatles.", "titulo_pt": "Proposta de atrativo turístico dos Beatles em Savile Row enfrenta proibição de shows ao vivo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 284013, "titulo": "First Children’s Booker prize reveals ‘Great Eight’ shortlist", "url": "https://www.theguardian.com/books/2026/nov/24/first-childrens-booker-prize-reveals-great-eight-shortlist", "fonte_id": "guardian_culture", "data_pub": "2026-11-24T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oito títulos, incluindo os de Shaun Tan, Eoin Colfer e Liz Hyder, foram selecionados para a lista curta do primeiro prêmio Children’s Booker, um prêmio de £50.000 criado pelo Booker Prize Foundation para ficção infantil. O prêmio foi lançado em resposta à preocupação sobre o declínio do interesse infantil pela leitura.", "titulo_pt": "Prêmio Children’s Booker revela lista curta de 'grande oito'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 283713, "titulo": "'The closeness between Putin's Russia and Trump's United States is not enough to build a strategic alliance'", "url": "https://www.lemonde.fr/en/opinion/article/2026/11/24/the-closeness-between-putin-s-russia-and-trump-s-united-states-is-not-enough-to-build-a-strategic-alliance_6787618_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-24T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A proximidade entre a Rússia de Putin e os Estados Unidos de Trump não é suficiente para construir uma aliança estratégica. A reunião entre os dois países na China em 19 de novembro evidenciou sua hostilidade comum ao sistema liberal, mas a questão de quem vai estabelecer as regras após esse evento permanece incerta.", "titulo_pt": "Aproximação entre Rússia e estados unidos não é suficiente para aliança estratégica", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 283836, "titulo": "Traditional dance brings energy to quake-hit city in Kumamoto Prefecture", "url": "https://www.japantimes.co.jp/news/2026/11/24/japan/traditional-dance-kumamoto-event/", "fonte_id": "japan_times", "data_pub": "2026-11-24T06:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Visitors assistiram a performances de dança tradicional realizadas por bonecos de palhaço e leão durante um evento no Templo Yatsushiro, substituindo uma parada tradicional.", "titulo_pt": "Dança tradicional anima cidade afetada por terremotos em Kumamoto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 283868, "titulo": "Late pope’s diary recounts seeing the devil, gates of hell", "url": "https://www.scmp.com/news/world/europe/article/3375579/late-popes-diary-recounts-seeing-devil-gates-hell", "fonte_id": "scmp", "data_pub": "2026-11-24T06:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Papa Francisco relatou ter visto o diabo três vezes e as 'portas do inferno' uma vez, conforme revelado em seu diário pessoal, publicado em um novo livro. O diário, escrito pelo ex-cardeal Jorge Bergoglio entre 1992 e 2024, expõe seus medos, remorsos e críticas pessoais, além de mostrar sua humanidade e fé.", "titulo_pt": "Diário do papa francisco conta ter visto o diabo e as portas do inferno", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 284018, "titulo": "TV tonight: friends Prue Leith and Sandi Toksvig take a special holiday", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/24/tv-tonight-friends-prue-leith-and-sandi-toksvig-take-a-special-holiday", "fonte_id": "guardian_culture", "data_pub": "2026-11-24T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prue Leith, uma chef de TV, leva sua amiga sardônica Sandi Toksvig em uma viagem pelo seu natal na África do Sul. O programa inclui uma viagem de teleférico pela Table Mountain, reflexões sobre o apartheid e um churrasco, mas não oferece nenhum insight revelador. O episódio de Bake Off com Nigella Lawson também será exibido às 21h15 no Channel 4.", "titulo_pt": "TV desta noite: Prue Leith e Sandi Toksvig fazem uma viagem especial pelo natal de Prue na áfrica do sul", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 283267, "titulo": "Concurso para professores em SP tem 5.000 vagas em 10 disciplinas; veja áreas e salários", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/concurso-para-professores-em-sp-tem-5000-vagas-em-10-disciplinas-veja-areas-e-salarios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria da Educação do Estado de São Paulo (Seduc-SP) lançou um concurso público com 5.000 vagas para professores em dez disciplinas, no ensino fundamental e médio. Os salários iniciais variam até R$ 5.565.", "titulo_pt": "Concurso para professores em SP tem 5.000 vagas em 10 disciplinas; veja áreas e salários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 283557, "titulo": "Zohran Mamdani, alcalde de Nueva York: “Más de tres millones de inmigrantes consideran a la ciudad de Nueva York su hogar”", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/zohran-mamdani-alcalde-de-nueva-york-mas-de-tres-millones-de-inmigrantes-consideran-a-la-ciudad-de-nid23112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T08:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Nova York, Zohran Mamdani, informou que mais de três milhões de imigrantes consideram a cidade seu lar. A linha municipal de assistência legal está expandindo seus serviços, incluindo conselheiros multilingues, WhatsApp em espanhol e atendimento aos fins de semana, com um orçamento de quase 1,5 milhão de dólares.", "titulo_pt": "Zohran Mamdani, prefeito de nova York: 'mais de três milhões de imigrantes consideram a cidade de nova York seu lar'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 283493, "titulo": "Por que o RJ não sabe quantas crianças são mortas pela polícia", "url": "https://www.bbc.com/portuguese/articles/cx24e9z27q30o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-24T08:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento inédito revela que pelo menos 11 crianças morreram durante operações de segurança na região metropolitana do Rio de Janeiro, mas essas mortes não foram incluídas nas estatísticas oficiais de letalidade policial.", "titulo_pt": "Por que o rio de janeiro não registra mortes de crianças durante operações policiais", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 283558, "titulo": "La nueva alianza de Mamdani para dar trabajo en Nueva York y cómo beneficia a inmigrantes", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/la-nueva-alianza-de-mamdani-para-dar-trabajo-en-nueva-york-y-como-beneficia-a-inmigrantes-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T08:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A cidade de Nova York oferece oportunidades de trabalho remunerado aos participantes do programa Atlas HOPE, que visa prevenir a violência entre homens do bairro sul do Bronx. Este programa beneficia imigrantes através de experiências laborais.", "titulo_pt": "Nova aliança de Mamdani para dar trabalho em nova York e como beneficia imigrantes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 283403, "titulo": "São Paulo registra 10 mortes em decorrência das chuvas em um mês", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/sao-paulo-registra-10-mortes-em-decorrencia-das-chuvas-em-um-mes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T07:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês em questão, ocorreram 10 mortes em decorrência das chuvas em São Paulo. Uma das vítimas mais recentes foi uma mulher que foi levada pela enxurrada ao tentar atravessar uma ponte em Ubatuba, no dia 23 de fevereiro.", "titulo_pt": "São Paulo registra 10 mortes por causa das chuvas em um mês", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 283931, "titulo": "When 'helpers' become predators of vulnerable teens", "url": "https://www.koreaherald.com/article/10947688", "fonte_id": "korea_herald", "data_pub": "2026-11-24T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vulneráveis adolescentes que se afastam de suas famílias podem ser atraídos por estranhos que oferecem ajuda, como comida e abrigo, mas que podem acabar explorando esses jovens. Uma jovem de 15 anos foi assassinada em Seul, levando à investigação de suspeitas envolvendo uma mulher de 26 anos.", "titulo_pt": "Quando 'ajudantes' se tornam predadores de adolescentes vulneráveis", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 283371, "titulo": "'O problema do crime organizado no Brasil nasceu, vive e se recicla nas prisões', diz especialista", "url": "https://exame.com/brasil/o-problema-do-crime-organizado-no-brasil-nasceu-vive-e-se-recicla-nas-prisoes-diz-analista/", "fonte_id": "exame", "data_pub": "2026-11-24T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O especialista Robert Muggah, cofundador do Instituto Igarapé, afirma que o presidente Lula enfrentará, em seu quarto mandato, um cenário de segurança pública mais complexo devido ao problema persistente do crime organizado nas prisões.", "titulo_pt": "O problema do crime organizado no Brasil nasceu, vive e se recicla nas prisões, diz especialista", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283531, "titulo": "Arenas defiende sus dichos por buque Danstar: “Me tomaron una declaración absolutamente cortada”", "url": "https://www.latercera.com/politica/noticia/arenas-defiende-sus-dichos-por-buque-danstar-me-tomaron-una-declaracion-absolutamente-cortada/", "fonte_id": "la_tercera", "data_pub": "2026-11-24T00:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O porta-voz do governo reafirmou que nunca afirmou que o permesso era para passar pelo Estrecho ou pelo mar patrimonial. Além disso, informou que a Cancillería está monitorando o tema após críticas do Partido Republicano.", "titulo_pt": "Arenas defende declarações sobre o buque Danstar: 'nunca disse que o permesso era para passar pelo estrecho ou pelo mar patrimonial'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 283290, "titulo": "É possível educar as elites?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/michael-franca/2026/11/e-possivel-educar-as-elites.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T22:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A educação deveria ensinar às elites que ter mais recursos não significa ser superior e que grande parte de suas conquistas depende de fatores pré-existentes ao esforço pessoal. Isso poderia cultivar um senso de responsabilidade social maior.", "titulo_pt": "É possível educar as elites?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282771, "titulo": "Cantor de R&B é processado em US$ 50 mil por suposto abuso sexual infantil", "url": "https://www.metropoles.com/celebridades/cantor-de-rb-e-processado-em-us-50-mil-por-suposto-abuso-sexual-infantil", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brandon Casey, membro do grupo musical Jagged Edge, é processado por supostos abusos sexuais infantis em cinco ocasiões nos Estados Unidos.", "titulo_pt": "Cantor de R&B é processado por supostos abusos sexuais infantis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282777, "titulo": "SP: policial civil é preso por importunação sexual contra menina de 14 anos", "url": "https://www.metropoles.com/sao-paulo/sp-policial-civil-e-preso-por-importunacao-sexual-contra-menina-de-14-anos", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial civil foi preso por importunação sexual contra uma menina de 14 anos em um mercado no bairro do Limão, na zona norte de São Paulo. Um inquérito foi aberto para investigar o caso.", "titulo_pt": "SP: policial civil é preso por importunação sexual contra menina de 14 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282780, "titulo": "\"Alguém me ajuda\": mulher grita por socorro ao ser arrastada por marido", "url": "https://www.metropoles.com/distrito-federal/entorno/alguem-me-ajuda-mulher-grita-por-socorro-ao-ser-arrastada-por-marido", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi arrastada pelo marido e filmada. Ela gritou por ajuda. O agressor foi preso em flagrante e a vítima foi atendida em um hospital.", "titulo_pt": "Alguém me ajuda: mulher grita por socorro após ser arrastada por marido", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282781, "titulo": "Kadu Rodrigues diz que cartório negou registro do filho e acusa homofobia", "url": "https://www.metropoles.com/colunas/fabia-oliveira/kadu-rodrigues-diz-que-cartorio-negou-registro-do-filho-e-acusa-homofobia", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O influenciador digital Kadu Rodrigues registrou sua frustração nas redes sociais após o cartório de São Paulo negar o registro do filho, Anthoni. Ele acusa a ocorrência de homofobia.", "titulo_pt": "Kadu Rodrigues denuncia negativa de registro do filho e acusa homofobia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 283086, "titulo": "Belgium: Workers march against spending cuts as living costs rise", "url": "https://www.euronews.com/video/2026/11/23/belgium-workers-march-against-spending-cuts-as-living-costs-rise", "fonte_id": "euronews", "data_pub": "2026-11-23T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de trabalhadores marcharam por Bruxelas em 23 de novembro de 2026, contra medidas de austeridade propostas, com alguns confrontos levando à utilização de gás lacrimogêneo e canhões de água pela polícia. As manifestações ocorreram enquanto o governo belga lutava para concordar com seu orçamento para 2027.", "titulo_pt": "Bélgica: trabalhadores marcham contra cortes orçamentários enquanto custos de vida aumentam", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 282897, "titulo": "Transporte público y salud mental: el costo emocional de cruzar Santiago a diario", "url": "https://www.latercera.com/paula/noticia/transporte-publico-y-salud-mental-el-costo-emocional-de-cruzar-santiago-a-diario/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Carmen leva mais de 90 minutos todos os dias para ir de Quinta Normal a Vitacura no transporte público de Santiago. Este tempo prolongado e a dificuldade de encontrar transporte são parte da pesquisa realizada pela Faculdade de Psicologia da Universidade de Chile sobre o impacto dos viagens no bem-estar dos usuários de transporte público.", "titulo_pt": "Transporte público e saúde mental: o custo emocional de cruzar Santiago diariamente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 282935, "titulo": "Gabinete do sexo: Presidente do TJPR abre PAD contra juiz acusado de transformar fórum em motel", "url": "https://www.jota.info/justica/gabinete-do-sexo-presidente-do-tjpr-abre-pad-contra-juiz-acusado-de-transformar-forum-em-motel", "fonte_id": "jota", "data_pub": "2026-11-23T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal de Justiça do Paraná (TJPR) abriu um processo administrativo disciplinar (PAD) contra o juiz Julio Cezar Vicentini, acusado de transformar um fórum em um local para encontros íntimos. Segundo o PAD, foram ouvidos gemidos e encontradas peças íntimas no gabinete do juiz.", "titulo_pt": "Presidente do TJPR abre PAD contra juiz acusado de transformar fórum em motel", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 283762, "titulo": "Indonesia: Search continues for workers trapped after deadly factory fire", "url": "https://www.euronews.com/video/2026/11/24/indonesia-search-continues-for-workers-trapped-after-deadly-factory-fire", "fonte_id": "euronews", "data_pub": "2026-11-24T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos em decorrência de um incêndio devastador em uma fábrica de doces, a oeste de Jacarta, aumentou para 26. Operações de resgate continuam em busca de trabalhadores presos sob os escombros.", "titulo_pt": "Indonésia: busca continua por trabalhadores após incêndio fatal em fábrica", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283359, "titulo": "Áreas de Samambaia, Santa Maria, Sobradinho 2 e Paranoá ficarão sem energia", "url": "https://www.metropoles.com/distrito-federal/areas-de-samambaia-santa-maria-sobradinho-2-e-paranoa-ficarao-sem-energia", "fonte_id": "metropoles", "data_pub": "2026-11-24T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Serão realizadas interrupções de energia entre 10h e 16h em áreas como Samambaia, Santa Maria, Sobradinho 2 e Paranoá, no Distrito Federal, para modernização da rede elétrica e poda de árvores.", "titulo_pt": "Áreas de Samambaia, Santa Maria, Sobradinho 2 e Paranoá ficarão sem energia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 283508, "titulo": "Fenómeno El Niño: 4 mil personas siguen sin poder volver a sus casas en Corrientes y Chaco y qué esperan para las próximas semanas", "url": "https://www.clarin.com/sociedad/fenomeno-nino-4-mil-personas-siguen-poder-volver-casas-corrientes-chaco-esperan-proximas-semanas_0_nx1rXtgOVS.html", "fonte_id": "clarin", "data_pub": "2026-11-24T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A recuperação do nível do rio Paraná é lenta devido à saturação do solo e ao alto índice de humidade. Especialistas esperam um leve aumento nos próximos dias, mas os níveis permanecerão inferiores aos de outubro.", "titulo_pt": "Phenômeno El Niño: 4 mil pessoas ainda não podem retornar às suas casas em Corrientes e Chaco e o que se espera nas próximas semanas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 283862, "titulo": "Cop31 illustrated what’s wrong with climate finance", "url": "https://www.scmp.com/opinion/world-opinion/article/3375456/cop31-illustrated-whats-wrong-climate-finance", "fonte_id": "scmp", "data_pub": "2026-11-24T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro australiano do Clima, Chris Bowen, falou na Conferência das Nações Unidas sobre Mudanças Climáticas em Antalya, Turquia, sobre o desafio da multilateralismo em face de múltiplos crises, incluindo mudança climática, segurança energética, conflitos e demandas de energia da inteligência artificial. Ele afirmou que a cooperação internacional ainda é viável.", "titulo_pt": "Cop31 ilustrou os problemas da finança climática", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283865, "titulo": "‘People are going to die’: Thailand’s toxic rivers, ‘zombie’ fish sow dread", "url": "https://www.scmp.com/week-asia/health-environment/article/3375587/people-are-going-die-thailands-toxic-rivers-zombie-fish-sow-dread", "fonte_id": "scmp", "data_pub": "2026-11-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Thais não podem mais realizar a tradição de lançar lanternas de vela nas rios durante o festival Loy Krathong em algumas regiões, devido à poluição da água. O rio Sai, em Chiang Rai, está contaminado, impedindo a realização dos rituais.", "titulo_pt": "Pessoas vão morrer: rios tóxicos e 'peixes zumbis' causam medo na tailândia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283588, "titulo": "Campaigners urge Albanese government to reject ‘climate bomb’ coalmine expansion after Cop31", "url": "https://www.theguardian.com/australia-news/2026/nov/24/campaigners-urge-albanese-government-to-reject-climate-bomb-coalmine-expansion-after-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-24T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Campanhas ambientais estão pedindo ao governo Albanese que rejeite a expansão de uma mina de carvão na região de Hunter Valley, Nova Gales do Sul, que permitiria a extração adicional de 430 milhões de toneladas de carvão. Isso ocorre após uma declaração de 'linha no chão' sobre combustíveis fósseis feita por dezenas de países durante a COP31 em Turquia.", "titulo_pt": "Campanhas ambientais pedem ao governo Albanese que rejeite expansão de mina de carvão após Cop31", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 283767, "titulo": "Ecuador: Severe flooding hits Galápagos Islands amid El Niño concerns", "url": "https://www.euronews.com/video/2026/11/24/ecuador-severe-flooding-hits-galapagos-islands-amid-el-nino-concerns", "fonte_id": "euronews", "data_pub": "2026-11-24T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inundações causadas por fortes chuvas atingiram partes das Ilhas Galápagos, no Equador, forçando moradores a deixar suas casas. Equipes de resgate estão evacuando pessoas por barco enquanto as comunidades tentam salvar seus pertences.", "titulo_pt": "Ecuador: inundações severas afetam ilhas Galápagos em meio às preocupações com El Niño", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283536, "titulo": "O paradoxo da preservação", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-paradoxo-da-preservacao", "fonte_id": "jota", "data_pub": "2026-11-24T05:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute o paradoxo da preservação de grãos sob alienação fiduciária e o risco de colapso na recuperação judicial do produtor rural.", "titulo_pt": "O paradoxo da preservação de grãos e o risco de colapso na recuperação judicial do produtor rural", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 283852, "titulo": "Sumatrans fear ‘nobody cares’ one year after floods", "url": "https://www.japantimes.co.jp/news/2026/11/24/asia-pacific/sumatrans-year-floods/", "fonte_id": "japan_times", "data_pub": "2026-11-24T03:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de residentes da ilha de Sumatra, na Indonésia, estavam praticamente à própria conta após as inundações, mesmo enquanto se preparavam para a próxima temporada de chuvas.", "titulo_pt": "Sumatranos temem 'não há ninguém que se importe lo_pt": "Chuvas elevam capacidade dos mananciais de São Paulo para 67%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 282907, "titulo": "Tras limpiar el Mapocho: el proyecto que prepara Aguas Andinas para reutilizar el agua", "url": "https://www.latercera.com/sustentabilidad/noticia/tras-limpiar-el-mapocho-el-proyecto-que-prepara-aguas-andinas-para-reutilizar-el-agua/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T20:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Aguas Andinas inaugurou uma exposição itinerante sobre a história e a recuperação do rio Mapocho que passa por Santiago. O principal desafio atual da empresa é lidar com a escassez hídrica.", "titulo_pt": "Depois de limpar o Mapocho: projeto da Aguas Andinas para reutilizar água", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 282854, "titulo": "Ainda é possível evitar a catástrofe climática?", "url": "https://www.dw.com/pt-br/ainda-é-possível-evitar-a-catástrofe-climática/a-80021541?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-23T18:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os sinais de alerta climático incluem recordes de calor, inundações devastadoras e incêndios florestais. É ainda possível controlar o aumento das temperaturas.", "titulo_pt": "Ainda é possível evitar a catástrofe climática?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 281648, "titulo": "Temporais provocam perdas de até 95% nas lavouras de soja em Tupanciretã", "url": "https://www.cnnbrasil.com.br/agro/temporais-provocam-perdas-de-ate-95-nas-lavouras-de-soja-em-tupancireta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Levantamento preliminar indica que cerca de 440 famílias foram atingidas e 35 mil hectares sofreram impactos após chuvas, granizo e vendaval no Rio Grande do Sul. As perdas nas lavouras de soja pod denação de ex-agente da CNI", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 283466, "titulo": "Irã aplica 74 chibatadas em cantora que se apresentou sem hijab", "url": "https://www.dw.com/pt-br/irã-aplica-74-chibatadas-em-cantora-que-se-apresentou-sem-hijab/a-80027067?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-23T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça iraniana aplicou 74 chibatadas a uma cantora que se apresentou sem hijab, considerando a atuação 'obscena e imoral'. A artista foi também proibida de exercer atividades artísticas por dois anos.", "titulo_pt": "Irã aplica 74 chibatadas em cantora que se apresentou sem hijab", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 282882, "titulo": "Arrestos de ICE en Seattle y Los Ángeles reavivan críticas por uso de la fuerza excesiva", "url": "https://www.clarin.com/estados-unidos/arrestos-de-ice-en-seattle-y-los-angeles-reavivan-criticas-por-uso-de-la-fuerza-excesiva_0_4rmaESFPEQ.html", "fonte_id": "clarin", "data_pub": "2026-11-23T21:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Operações de imigração em Seattle e Los Angeles geraram críticas por uso excessivo de força, incluindo o arresto de um pai e uma filha mexicana no aeroporto. Ativistas e políticos criticam as táticas da ICE, enquanto aerolíneas e autoridades locais pedem explicações sobre os procedimentos.", "titulo_pt": "Arrestos da ICE em Seattle e Los angeles reavivam críticas sobre uso excessivo de força", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 283133, "titulo": "Why Hong Kong must ensure journalistic access to the Land Registry", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3375290/why-hong-kong-must-ensure-journalistic-access-land-registry", "fonte_id": "scmp", "data_pub": "2026-11-23T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado imobiliário de an-carries-out-flogging-of-singer-who-performed-without-hijab", "fonte_id": "euronews", "data_pub": "2026-11-23T18:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cantora Ahmadi e quatro membros de sua equipe de concertos receberam chicotadas em Qom na segunda-feira, de acordo com seu advogado, por causa de uma apresentação em dezembro de 2024, transmitida ao vivo sem público e sem cumprir a exigência do véu. Nove membros da equipe receberam 74 chicotadas cada, além de uma proibição de viagem por dois anos e uma proibição de atividades artísticas por dois anos.", "titulo_pt": "Irã executa chicotadas em cantora que se apresentou sem véu", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 282658, "titulo": "Como uma renomada bióloga foi presa na Rússia por causa de US$ 30", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/como-uma-renomada-biologa-foi-presa-na-russia-por-causa-de-us-30.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-23T18:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma renomada bióloga foi presa na Rússia após uma quantia de US$ 30. O pai da bióloga, Boris Rosenfeld, está em lágrimas, lembrando a última vez que viu sua filha antes dela viajar para Moscou, onde tudo começou.", "titulo_pt": "Como uma renomada bióloga foi presa na Rússia por causa de US$ 30", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 281750, "titulo": "El régimen iraní ejecutó la condena de 74 latigazos a la cantante que no usó el velo durante un concierto online", "url": "https://www.clarin.com/mundo/regimen-irani-ejecuto-condena-74-latigazos-cantante-uso-velo-concierto-online_0_BPRoBlliUB.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Parastoo Ahmadi, uma cantora iraniana, recebeu uma condenação de 74 chicotadas por não usar o véu durante
