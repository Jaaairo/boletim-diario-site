<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>

      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "18/11/2026 15:26", "stats": {"noticias_novas": 1027, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios políticos e econômicos, com destaque para a crise na Polícia Federal e as negociações para formar o novo governo. O diretor-geral da Polícia Federal, Andrei Rodrigues, confirmou sua presença em audiências no Senado após uma reunião com o presidente Lula. A Associação Nacional dos Delegados de Polícia Federal pediu que o Ministério da Justiça ouça diretamente os delegados afastados. O projeto de ajuste fiscal do ministro Bruno Moretti gerou divisões na esquerda e ameaça novas manifestações, enquanto o governo considera fazer concessões para aprovar a compensação a entes subnacionais pela Lei Kandir. Além disso, o Supremo Tribunal Federal continua julgando ações que questionam a imunidade penal em crimes patrimoniais, e o Brasil pode economizar R$ 40 bilhões anualmente ao ampliar o uso de ferrovias para o transporte de cargas, segundo a Associação Nacional dos Fornecedores de Logística Ferroviária.", "mundo": "Em Shenzhen, China, líderes globais se reúnem para a cúpula da APEC, com destaque para a primeira reunião trilateral entre Xi Jinping, Donald Trump e Vladimir Putin. Durante a visita de Trump a China, Xi Jinping deu um abraço a Trump no aeroporto de Shenzhen, marcando um encontro inédito após comentários polêmicos de Takaichi sobre a intervenção militar japonesa em casos de crise no Taiwan. A reunião entre os líderes visa discutir questões econômicas e geopolíticas na região, com preocupações de que a Ucrânia possa ser discutida sem considerar os interesses europeus. Além disso, a União Europeia decidiu excluir o chefe da política externa da equipe negociadora para conversações sobre a paz com a Rússia, demonstrando como conflitos nacionais prejudicam planos globais de Bruxelas. No cenário político americano, os democratas indicaram Hakeem Jeffries para a presidência da Câmara dos Deputados e preparam investigações abrangentes sobre o círculo próximo do presidente Trump, enquanto o IEA (Instituto de Energia do Alto) afirma que não existe um caminho credível para retornar à normalidade pré-guerra no Estreito de Ormuz devido ao conflito com a Irã.\n\nUm encontro histórico entre os líderes dos Estados Unidos, China e Rússia ocorreu em Shenzhen, China, em 18 de novembro. Este evento levantou preocupações na Europa sobre a possibilidade de divisão do mundo em esferas de influência, lembrando o encontro de Yalta há 81 anos. Paralelamente, a Rússia enfrenta críticas internacionais após ataques na Ucrânia e no Golfo Pérsico. O Canadá acusa Vladimir Putin de mentir sobre as sanções ocidentais. Além disso, o Irã ameaça os Estados Unidos e seus aliados, com o comandante-chefe das Forças Armadas do Irã prometendo uma resposta 'mais devastadora' em caso de novos ataques. O encontro também levantou questões sobre o futuro do comércio global, com os líderes da China e Rússia criticando o protecionismo ocidental e as sanções ocidentais.", "economia": "O dólar atingiu R$ 5,84, seu nível mais alto em 12 meses, em meio à expectativa de aprovação de um pacote de ajuste fiscal no Congresso. Isso levou a uma inflação de 3,6% no Reino Unido. No Brasil, o número de desempregados há dois anos ou mais atingiu o menor valor em 14 anos, com 971 mil pessoas. Além disso, a taxa de desemprego diminuiu em oito estados no terceiro trimestre de 2026. O Banco Central defende a atualização da lei de liquidação de bancos. A Anthropic divulga o preço de sua ação para o IPO na Nasdaq. A Previ registra uma perda de R$ 2,5 bilhões devido à queda nas ações do Banco do Brasil. Além disso, a Rede D'Or vendeu a Sul América Investimentos à BlackRock por R$ 850 milhões, e a China enfrenta desafios no domínio do grafite com a emergência de uma nova startup.", "tecnologia": "Em 2027, a Google exigirá que desenvolvedores de aplicativos para Android ofereçam suporte básico a dispositivos dobráveis a partir de abril do mesmo ano, sob risco de não poderem publicar ou atualizar seus aplicativos. Este anúncio destaca a crescente importância dos dispositivos dobráveis no mercado de tecnologia. Paralelamente, o Senado dos Estados Unidos aprovou uma proposta que usa inteligência artificial para combater o desmatamento, exigindo supervisão humana e estabelecendo limites ao uso de dados e punições automáticas. A proposta visa combater a disseminação do sarampo nos EUA, que perdeu seu status de eliminação da doença, e a falha crítica descoberta na linguagem de programação PHP, amplamente utilizada por grandes empresas, levantando preocupações sobre a segurança cibernética. Estes eventos refletem a crescente integração e importância da inteligência artificial em diversos aspectos da tecnologia e da sociedade.", "ciencia": "A Voyager 1, da NASA, atingiu uma marca histórica ao se distanciar da Terra por uma distância equivalente a um dia-luz, um feito que ocorreu após 50 anos de operação. Este marco representa um importante avanço na exploração espacial, pois a espaçonave se tornou o primeiro objeto criado pelo homem a alcançar tal distância. Paralelamente, um novo estudo enfatiza a importância da diversificação no currículo de ciências químicas, sugerindo que a inclusão de representantes de minorias pode ajudar a combater a sobrerrepresentação desses cientistas na educação. Outras notícias incluem a observação de uma fusão estelar na Galáxia de Andrômeda, a transmissão das primeiras imagens do telescópio Roman pela NASA, e a descoberta de que picos de calor repentinos podem ser mais prejudiciais para abelhas do que calor prolongado. Estes eventos refletem o amplo espectro da pesquisa científica em andamento, desde a exploração espacial até a ecologia e a saúde das populações de abelhas.", "cultura": "A cultura global tem sido ativa em vários aspectos, com destaque para o lançamento do jogo 'GTA 6', que estreou nesta quinta-feira, gerando debate sobre os limites de jogos realistas. O lançamento das obras completas do escritor taiwanês Wu Zhuo-liu marcou um momento importante na literatura local. A Globo inaugurou novas estrelas em sua calçada da fama, incluindo Janete Clair, Reginaldo Faria e Stênio Garcia. A exposição 'Van Eyck: Os Portratos' na National Gallery, em Londres, reúne pela primeira vez os retratos do artista, destacando sua habilidade em capturar detalhes minuciosos. Além disso, a ópera 'Conceição Evaristo', que celebra os 80 anos da escritora mineira, estreou no Teatro São Pedro em São Paulo, com cinco apresentações programadas. Estudantes de arquitetura de paisagística da Harvard Graduate School of Design propuseram alternativas para o memorial arqueado de Donald Trump, enquanto a morte do National Historic Preservation Act foi discutida em um artigo sobre monumentos antimonumentais.", "sociedade": "Um homem de 70 anos, Justo Fernando Barrientos, foi condenado à prisão perpétua pelo Tribunal Oral em Criminal e Correccional (TOCC) porteño N° 5, em Buenos Aires, Argentina. Ele foi condenado por um crime múltiplo que resultou na morte de três mulheres em um hotel de Barracas. A sentença foi agravada pelo ensaio de ódio contra as orientações sexuais das vítimas, todas lesbianas. Em outro caso, a Justiça brasileira decidiu que filhos podem fazer pedidos para remover nomes de pais ausentes ou abusivos dos documentos. Em São Paulo, a Polícia investiga a morte de um pichador conhecido como Olodum, encontrado morto após uma perseguição em um prédio. No Canadá, pessoas e famílias estão se associando para comprar casas em vez de tentar comprar sozinhas devido aos altos preços imobiliários. O governo do Distrito Federal anunciou a troca de gestão do Hospital Evangélico de Pituba (Hvep) e prometeu aumentar em 25% os atendimentos, prometendo melhorar a qualidade dos serviços e reduzir as filas. Além disso, o Conselho de Constituição e Justiça do Senado aprovou um projeto que aumenta as penas para motoristas que causarem mortes devido ao uso de álcool ou drogas, intensificando as punições para casos de lesão corporal grave ou gravíssima cometidas por condutores.", "meio_ambiente": "A COP31, que está em sua reta final, debate a justiça climática e a responsabilidade financeira na crise ambiental, enfrentando impasses financeiros. A ministra do Meio Ambiente do Nepal, Gita Chaudhary, enfatizou a urgência de justiça climática e a responsabilidade dos países mais poluentes após a tragédia climática que deixou mais de 1.400 mortos e causou perdas equivalentes a 10% do PIB do Nepal. Em Santiago, apesar das chuvas recordes, a escassez hídrica persiste e o Fundo de Água Santiago-Maipo alerta para a necessidade de implementar soluções naturais para conservar água e lidar com o calor extremo. No Brasil, o fenômeno El Niño está causando temporais no Sul do país e seca no Norte, levando a Câmara dos Deputados a aprovar um crédito extraordinário para mitigar os impactos na agricultura. Além disso, o Instituto Nacional de Meteorologia monitora a formação de um ciclone na costa argentina, com previsão de ventos acima de 90 km/h no Rio Grande do Sul, mas sem alertas específicos para o Brasil no momento.", "direitos_humanos": "O vice-diretor executivo adjunto da UNICEF, Ted Chaiban, participou da Segunda Conferência Global Ministerial sobre o Fim da Violência Contra Crianças, em Manila, para discutir estratégias de proteção dos direitos das crianças em todo o mundo. Em outro evento, refugiados rohingya esperam que o Tribunal Penal Internacional decida a seu favor, o que poderia permitir seu retorno à terra natal. O chefe do Departamento de Polícia Criminal da Sérvia, Marko Kricak, foi detido em agosto de 2025 sob acusações de tortura de manifestantes, refletindo crescentes preocupações sobre abusos de poder e violações de direitos humanos. Em Bahrain, clérigos xiitas foram condenados a prisão perpétua por conspiração com o Irã, enquanto organizações de direitos humanos levantam preocupações sobre possíveis torturas e confissões forçadas. A intensificação dos conflitos no Iêmen está causando a morte e ferimentos em pelo menos 64 crianças, além de interromper o acesso a serviços essenciais. Finalmente, relatos de problemas ginecológicos em mulheres após exposição a gases lacrimogêneos durante protestos em França levantaram preocupações sobre os efeitos desses gases na saúde feminina, resultando em chamados por uma proibição."}, "resumo_do_dia": {"politica_nacional": [{"id": 272085, "titulo": "Ministério dos Direitos Humanos abre licitação para massagens ao custo de R$ 722 mil e depois desiste", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/ministerio-dos-direitos-humanos-abre-licitacao-para-massagens-ao-custo-de-r-722-mil-e-depois-desiste.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério dos Direitos Humanos abriu uma licitação para fornecer massagens aos funcionários da pasta por R$ 722 mil ao longo de cinco anos, mas cancelou o pregão após questionamentos.", "titulo_pt": "Ministério dos Direitos Humanos cancela licitação para massagens ao custo de R$ 722 mil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272086, "titulo": "Andrei diz que PF segue Constituição e que afastamento de delegados do caso Master foi legal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/andrei-diz-que-pf-segue-constituicao-e-que-afastamento-de-delegados-do-caso-master-foi-legal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Andrei Rodrigues, diretor-presidente da Polícia Federal, afirmou que a corporação segue a Constituição Federal e que a decisão de afastar dois delegados relacionados ao caso Banco Master foi legal.", "titulo_pt": "André afirma que afastamento de delegados do caso banco Master foi legal e que PF segue a Constituição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272098, "titulo": "Diretor-geral da PF Andrei Rodrigues fala ao Senado sobre troca de delegados; ASSISTA", "url": "https://g1.globo.com/politica/ao-vivo/diretor-pf-andrei-rodrigues-senado-crise-policia-federal-troca-delegados.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor-geral da Polícia Federal, Andrei Rodrigues, comparecerá ao Senado para prestar esclarecimentos sobre as recentes trocas de delegados. Esses delegados foram afastados após elaborarem relatórios sobre o envolvimento de ministros do STF com Daniel Vorcaro, dono do Master.", "titulo_pt": "Diretor-geral da PF Andrei Rodrigues fala ao Senado sobre troca de delegados", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 272087, "titulo": "PSOL calibra oposição a 'plano Moretti' e não deve aderir a novas manifestações", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/psol-calibra-oposicao-a-plano-moretti-e-nao-deve-aderir-a-novas-manifestacoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSOL decidiu se afastar da mobilização contra o 'plano Moretti' e planeja ajustar suas críticas às propostas de contenção de despesas do governo Lula.", "titulo_pt": "PSOL se afasta da mobilização contra 'plano Moretti' e ajusta críticas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272061, "titulo": "Brasil pode poupar R$ 40 bi por ano ao ampliar uso de ferrovias, diz associação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/brasil-pode-poupar-r-40-bi-por-ano-ao-ampliar-uso-de-ferrovias-diz-associacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil poderia economizar R$ 40 bilhões anualmente com fretes de cargas se aumentasse a participação das ferrovias para 35% do transporte atual, que é de 20%. No entanto, isso requer que o sistema ferroviário seja considerado uma política de Estado, não de governo.", "titulo_pt": "Brasil pode economizar R$ 40 bi por ano ao ampliar uso de ferrovias, diz associação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272168, "titulo": "Moro escolhe ex-colega de Lava Jato para Secretaria Anticorrupção do Paraná", "url": "https://veja.abril.com.br/politica/a-escolha-estrategia-de-moro-para-a-secretaria-anticorrupcao-do-parana/", "fonte_id": "veja", "data_pub": "2026-11-18T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Fernando dos Santos Lima, ex-integrante da equipe original da Operação Lava Jato em Curitiba, foi escolhido para liderar a Secretaria Anticorrupção do Paraná. Ele será responsável por estruturar a nova pasta.", "titulo_pt": "Moro nomeia ex-integrante da Lava Jato para Secretaria Anticorrupção do Paraná", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 272288, "titulo": "Morre Paulo Gallotti, aos 81 anos, ministro aposentado do Superior Tribunal de Justiça", "url": "https://www.jota.info/justica/morre-paulo-gallotti-aos-81-anos-ministro-aposentado-do-superior-tribunal-de-justica", "fonte_id": "jota", "data_pub": "2026-11-18T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paulo Gallotti, ministro aposentado do Superior Tribunal de Justiça, faleceu aos 81 anos. Ele era um magistrado catarinense conhecido por suas contribuições ao Direito Penal.", "titulo_pt": "Morre Paulo Gallotti, ministro aposentado do Superior Tribunal de Justiça", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 272290, "titulo": "STF AO VIVO – Imunidade penal em crimes patrimoniais – 18/11/2026", "url": "https://www.jota.info/stf/do-supremo/stf-ao-vivo-imunidade-penal-em-crimes-patrimoniais-18-11-2026", "fonte_id": "jota", "data_pub": "2026-11-18T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) continua julgando ações que questionam a imunidade penal em crimes patrimoniais e pedem exceções para casos de violência contra a mulher.", "titulo_pt": "STF AO VIVO – Imunidade penal em crimes patrimoniais – 18/11/2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 272099, "titulo": "Durigan descarta recessão, mas vê crescimento em 'patamar menor' em 2027; ministro diz acreditar em aprovação de ajuste fiscal", "url": "https://g1.globo.com/economia/noticia/2026/11/18/durigan-ve-economia-deve-crescer-em-patamar-menor-em-2027-descarta-recessao-e-diz-acreditar-em-aprovacao-de-pacote-fiscal.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, não prevê recessão para 2027, mas admite preocupações com a desaceleração econômica. A expectativa é de crescimento menor do Produto Interno Bruto (PIB) em 2027, em torno de 1%, em comparação com os anos anteriores.", "titulo_pt": "Durigan descarta recessão, mas vê crescimento em 'patamar menor' em 2027", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 272100, "titulo": "A geografia da polarização na eleição presidencial: o empate nacional que o interior não vivencia", "url": "https://g1.globo.com/politica/noticia/2026/11/18/a-geografia-da-polarizacao-na-eleicao-presidencial.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde 2018, as eleições presidenciais no Brasil têm sido interpretadas como resultado da polarização política, com pequenas margens de vitória nos segundos turnos. Em 2026, Lula foi reeleito com 51,78% dos votos válidos, com uma diferença mínima de 3,56 pontos percentuais em relação a Flávio Bolsonaro.", "titulo_pt": "A geografia da polarização na eleição presidencial: o empate nacional que o interior não vivencia", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 272088, "titulo": "Racha na esquerda após anúncio de 'plano Moretti' envolve sombra de 2013 e novo exército digital", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/racha-na-esquerda-apos-anuncio-de-plano-moretti-envolve-sombra-de-2013-e-novo-exercito-digital.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O anúncio do projeto de ajuste fiscal do ministro Bruno Moretti gerou divisões na esquerda, levando a temores de novas manifestações como as de 2013, a formação de um novo exército digital pelo lado radical da esquerda e tentativas de aproveitamento por bolsonaristas.", "titulo_pt": "Racha na esquerda após anúncio de 'plano Moretti' envolve medo de 2013 e novo exército digital", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272089, "titulo": "Relatórios da PF sobre ministros do STF e Master causam apreensão e incerteza sobre reação de Fachin", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/relatorios-da-pf-sobre-ministros-do-stf-e-master-causam-apreensao-e-incerteza-sobre-reacao-de-fachin.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal planeja entregar relatórios sobre a relação dos ministros do STF com Daniel Vorcaro, ex-dono do Banco Master, causando apreensão na corte devido à incerteza sobre a reação do presidente Edson Fachin.", "titulo_pt": "Relatórios da PF sobre ministros do STF e Master causam apreensão e incerteza sobre reação de Fachin", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272090, "titulo": "Lula deve encontrar Alcolumbre hoje para tratar de STF e composição do governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/lula-deve-encontrar-alcolumbre-hoje-para-tratar-de-stf-e-composicao-do-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T15:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula deve se encontrar com o presidente do Senado, Davi Alcolumbre, hoje para discutir a indicação para o STF e a formação do novo governo. Eles pretendem garantir a governabilidade através da composição dos espaços políticos.", "titulo_pt": "Lula deve se encontrar com Alcolumbre hoje para tratar de STF e composição do governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272091, "titulo": "Morre Paulo Gallotti, ministro aposentado do STJ, aos 81 anos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/morre-paulo-gallotti-ministro-aposentado-do-stj-aos-81-anos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro aposentado do STJ Paulo Gallotti faleceu em Florianópolis aos 81 anos. Ele morreu nesta quarta-feira (18).", "titulo_pt": "Morre Paulo Gallotti, ministro aposentado do STJ, aos 81 anos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 272101, "titulo": "Justiça suspende licitação que previa gasto de R$ 6 milhões com iPhones e outros celulares para parlamentares e servidores do Senado", "url": "https://g1.globo.com/df/distrito-federal/noticia/2026/11/18/justica-suspende-licitacao-que-previa-gasto-de-r-6-milhoes-com-celulares-para-parlamentares-e-servidores-do-senado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-18T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal suspendeu a licitação de R$ 6 milhões para fornecimento de serviços de telefonia, incluindo iPhones, para parlamentares e servidores do Senado, em resposta a uma ação popular. O deputado Nikolas Ferreira (PL-MG) alegou que a compra é um 'escárnio com o dinheiro público'.", "titulo_pt": "Justiça suspende licitação de R$ 6 milhões para fornecimento de iphones para parlamentares e servidores do Senado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 272092, "titulo": "Advogado disse a Vorcaro ter informações de chefe da PF sobre inquérito", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/advogado-disse-a-vorcaro-ter-informacoes-de-chefe-da-pf-sobre-inquerito.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Walfrido Warde informou ao banqueiro Daniel Vorcaro que obteve informações sobre a atuação do diretor-geral da Polícia Federal, Andrei Rodrigues, em um inquérito contra o Banco Master.", "titulo_pt": "Advogado diz a Vorcaro ter informações sobre atuação de chefe da PF em inquérito contra banco", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 272781, "titulo": "Xi welcomes Trump to China ahead of summit", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868000", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês, Xi Jinping, recebeu o presidente dos Estados Unidos, Donald Trump, na China antes de uma cúpula bilateral. A visita ocorreu como parte de esforços para melhorar as relações entre as duas nações.", "titulo_pt": "Xi recebe Trump na China antes de cúpula", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272478, "titulo": "Trump, Xi and Putin Shake Hands as Leaders Gather in China", "url": "https://www.nytimes.com/live/2026/11/18/world/trump-china-asia-apec", "fonte_id": "nyt_world", "data_pub": "2026-11-18T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder chinês Xi Jinping abraçou o presidente americano, Donald Trump, no pátio de aterrissagem quando Trump chegou a Shenzhen para uma cúpula regional. Uma reunião trilateral com o presidente russo, Vladimir Putin, está prevista para ocorrer na quinta-feira.", "titulo_pt": "Trump, Xi e Putin se encontram em reunião em China", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 272487, "titulo": "The Shadow of Yalta Hangs Over Trump’s Summit in China", "url": "https://www.nytimes.com/2026/11/18/world/asia/trump-xi-putin-summit-yalta.html", "fonte_id": "nyt_world", "data_pub": "2026-11-18T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um encontro em 1945 entre Churchill, Stalin e Roosevelt determinou o curso da Europa por décadas. Este evento continua a influenciar as relações internacionais até hoje.", "titulo_pt": "A sombra de Yalta paira sobre a cúpula de Trump em pequim", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 272948, "titulo": "EU Countries Renew Call To Exclude Russia from Venice Ahead of 2027 Architecture Biennale", "url": "https://www.artnews.com/art-news/news/eu-countries-renew-call-to-exclude-russia-from-venice-ahead-of-2027-architecture-biennale-1234806682/", "fonte_id": "artnews", "data_pub": "2026-11-18T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países europeus estão reiterando o pedido para que a Rússia não participe do Biênio de Arquitetura de Veneza em 2027, que terá como tema 'Do Arquitetura — Para a Possibilidade de Coexistência Diante de uma Realidade Real'.", "titulo_pt": "Países europeus reiteram pedido para excluirmos a Rússia do biênio de arquitetura de veneza em 2027", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 272687, "titulo": "Jensen Huang has agreed to appear before Senate banking committee, Chairman Scott says", "url": "https://www.cnbc.com/2026/11/18/jensen-huang-nvidia-tim-scott-congress.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang concordou em comparecer à comissão de bancos do Senado, conforme anunciado pelo seu presidente, Tim Scott. Esta audiência adiciona-se a uma já programada perante comitês da Câmara dos Representantes.", "titulo_pt": "Jensen Huang irá comparecer à comissão de bancos do senado, diz Scott", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 272722, "titulo": "What has happened to the $18bn pledged to Trump’s Board of Peace for Gaza?", "url": "https://www.aljazeera.com/news/2026/11/18/what-has-happened-to-the-18bn-pledged-to-trumps-board-of-peace-for-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde um suposto cessar-fogo em 2025, bilhões foram prometidos para a Gaza, mas o processo de reconstrução não começou e os ataques israe
