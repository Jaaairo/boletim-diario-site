ões de tecnologia dos Estados Unidos devem saltar ao abrir, apesar de oscilações voláteis em um mercado que encontra dificuldades para avaliar os lucros futuros. O impacto dominante das tecnologias de inteligência artificial foi substituído por essas oscilações.", "titulo_pt": "Ações de tecnologia dos EUA devem saltar ao abrir com oscilações voláteis no mercado", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 290473, "titulo": "Recuperação judicial: o problema não é o remédio, muito menos se ele é amargo", "url": "https://www.jota.info/opiniao-e-analise/artigos/recuperacao-judicial-o-problema-nao-e-o-remedio-muito-menos-se-ele-e-amargo", "fonte_id": "jota", "data_pub": "2026-11-27T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil demora quatro anos para recuperar apenas 18,2% dos créditos em recuperação judicial, contra 81% nos Estados Unidos em um ano.", "titulo_pt": "O problema não é o remédio, nem se ele é amargo, na recuperação judicial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 290749, "titulo": "Chinese shares soar after Beijing signals more support", "url": "https://www.ft.com/content/fedc6392-ad25-43e4-9d9f-20216cbf331e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice CSI 300, que mede as ações das maiores empresas chinesas, registrou o maior aumento diário em dois anos após meses de declínio. A Bolsa de Pequim viu uma forte recuperação devido a sinais de apoio adicional do governo.", "titulo_pt": "Ações chinesas disparam após pequim sinalizar mais suporte", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 290474, "titulo": "O atraso do Tecon Santos 10 em números", "url": "https://www.jota.info/opiniao-e-analise/colunas/infra/o-atraso-do-tecon-santos-10-em-numeros", "fonte_id": "jota", "data_pub": "2026-11-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um único ano, as perdas logísticas do Tecon Santos 10 podem chegar a R$ 1,5 bilhão; a ampliação da concorrência no leilão é apresentada como o caminho mais seguro para resolver o problema.", "titulo_pt": "O atraso do Tecon Santos 10 em números", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 290716, "titulo": "‘Borrowing to make ends meet’: The rising cost of living in Europe", "url": "https://www.aljazeera.com/news/2026/11/27/borrowing-to-make-ends-meet-the-rising-cost-of-living-in-europe?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços estão subindo novamente em toda a Europa devido ao aumento dos custos de energia.", "titulo_pt": "Empréstimos para dar conta das despesas: o aumento dos custos de vida na Europa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 290262, "titulo": "Fundos de participações desafiam má fase e buscam R$ 20 bi para investir em empresas brasileiras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/fundos-de-participacoes-desafiam-ma-fase-e-buscam-r-20-bi-para-investir-em-empresas-brasileiras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fundos de participações estão buscando recursos para investir no Brasil e América Latina, potencialmente levantando até R$ 20 bilhões. Eles buscam aproveitar uma oportunidade na maré baixa para negócios.", "titulo_pt": "Fundos de participações buscam R$ 20 bi para investir em empresas brasileiras e latino-americanas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 290750, "titulo": "Hong Kong seeks to lure sovereign wealth funds with tax breaks", "url": "https://www.ft.com/content/0285a2eb-5312-443d-bd60-b094af9575b1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hong Kong está oferecendo incentivos fiscais para atrair fundos de investimento soberano. Esta medida foi tomada após alguns investidores globais reduzirem ou fecharam suas operações no hub financeiro asiático.", "titulo_pt": "Hong Kong busca atrair fundos de investimento soberano com incentivos fiscais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 290852, "titulo": "(URGENT) Seoul shares soar over 4 pct on hopes of policy support", "url": "https://en.yna.co.kr/view/AEN20261127004700320", "fonte_id": "yonhap_news", "data_pub": "2026-11-27T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul subiram mais de 4% devido às esperanças de apoio por parte da política.", "titulo_pt": "Seul registra alta de mais de 4% nas bolsas devido às esperanças de apoio político", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 290907, "titulo": "Foreign shoppers, global store lift Musinsa's third-quarter earnings", "url": "https://www.koreaherald.com/article/10951951", "fonte_id": "korea_herald", "data_pub": "2026-11-27T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Musinsa registrou um aumento de 67% no lucro operacional trimestral, com o aumento do gasto com cartões estrangeiros em suas lojas multibrandas e o crescimento acelerado de seu negócio online global. O faturamento consolidado subiu 34,2% para 405,8 bilhões de wones, enquanto o lucro operacional atingiu 19,6 bilhões de wones.", "titulo_pt": "Comerciante estrangeiro e loja global impulsionam lucros trimestrais da Musinsa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290477, "titulo": "Fim da escala 6×1: a conta que os contratos privados terão de refazer", "url": "https://www.jota.info/opiniao-e-analise/artigos/fim-da-escala-6x1-a-conta-que-os-contratos-privados-terao-de-refazer", "fonte_id": "jota", "data_pub": "2026-11-27T05:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas terão de reavaliar preços e cláusulas em função dos novos custos da jornada de trabalho, sem a garantia de um repasse automático desses custos.", "titulo_pt": "Fim da escala 6×1: as empresas terão de reavaliar contratos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 290748, "titulo": "Chinese households shed billions in consumer debt", "url": "https://www.ft.com/content/8c5e0298-58f0-47e9-a843-513178d9fa2e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há um declínio de três anos nos empréstimos imobiliários na China que agora está se estendendo aos empréstimos de consumo. Os lares chineses estão reduzindo bilhões de dólares em dívidas de consumo.", "titulo_pt": "Famílias chinesas reduzem bilhões em dívidas de consumo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 290752, "titulo": "Middle-class Americans and Europeans have opposite problems", "url": "https://www.ft.com/content/047e1a9d-0448-4ccd-aaec-c5c06125d111?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia dos ricos está concentrando riqueza, enquanto o meio-classes enfrenta estagnação em ambos os Estados Unidos e Europa. Esses são problemas distintos para regiões diferentes.", "titulo_pt": "Classe média americana e europeia enfrentam problemas opostos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 290753, "titulo": "Is the Fed ready for its next fight?", "url": "https://www.ft.com/content/71ffa69f-2a07-44e4-8305-ae5548b89828?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oficiais do banco central dos Estados Unidos enfrentam uma luta tridimensional sobre inflação, IA e orientação.", "titulo_pt": "O Fed está preparado para seu próximo desafio?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 290755, "titulo": "Kirkland & Ellis under fire from private equity backers over sell-to-yourself deals", "url": "https://www.ft.com/content/5cc534e6-d461-4fc7-a744-b938e54eee1d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kirkland & Ellis enfrenta críticas de investidores de private equity por causa de acordos de veículos de continuação que removem o direito dos investidores de processar em caso de disputa.", "titulo_pt": "Kirkland & Ellis sob ataque de investidores de private equity por acordos de venda para si mesmos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 290864, "titulo": "Dutch tool maker Trymax deepens Japan push with Kanematsu PWS", "url": "https://www.digitimes.com/news/a20261127VL216/dutch-automotive-equipment-investment-japan-production.html", "fonte_id": "digitimes", "data_pub": "2026-11-27T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa holandesa de equipamentos para plasma Trymax Semiconductor Equipment nomeou a Kanematsu PWS como representante exclusivo de vendas no Japão. Este acordo visa aproveitar a potencial demanda de fabricantes japoneses de chips para poderes e automóveis, em um momento em que suas investidas estão fracas.", "titulo_pt": "Holandês Trymax intensifica presença no Japão através da Kanematsu PWS", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 290865, "titulo": "AI cooling will progress toward removal of thermal interface materials, says Jentech president", "url": "https://www.digitimes.com/news/a20261127PD224/jentech-precision-cooling-materials-2027.html", "fonte_id": "digitimes", "data_pub": "2026-11-27T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Jentech Precision, fornecedora de soluções térmicas, projeta um otimismo para 2027 e planeja expandir sua capacidade conforme programado. A companhia iniciará a produção em massa de câmaras de vapor de três peças no primeiro trimestre de 2027, enquanto seus clientes continuam a testar as tampas microcanais (MCL).", "titulo_pt": "Resfriamento de IA avançará para a eliminação de materiais de interface térmica, diz presidente da Jentech", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 290238, "titulo": "Inteligência artificial empurrou matemática para crise existencial", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/inteligencia-artificial-empurrou-matematica-para-crise-existencial.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A matemática enfrenta uma crise existencial devido ao avanço da inteligência artificial. O uso de IA está levando a questionamentos fundamentais sobre a natureza e os limites da matemática.", "titulo_pt": "Inteligência artificial coloca matemática em crise existencial", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 290326, "titulo": "Empresas driblam Anvisa e vendem software de IA para hospitais mesmo sem certificação", "url": "https://veja.abril.com.br/brasil/empresas-driblam-anvisa-e-vendem-ia-para-hospitais-sem-registro-da-agencia/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estão vendendo software de inteligência artificial para hospitais sem a certificação necessária, como no caso da MPS Cloud que vende o TurboMR, mesmo que este ainda esteja em análise pela Anvisa.", "titulo_pt": "Empresas driblam Anvisa e vendem software de IA para hospitais sem certificação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290334, "titulo": "Caso Nvidia: onze dias que abalaram o mundo", "url": "https://veja.abril.com.br/tecnologia/caso-nvidia-onze-dias-que-abalaram-o-mundo/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Nvidia durou onze dias e teve impacto global. O próprio Trump lucrou 15 milhões de dólares com a situação.", "titulo_pt": "Caso Nvidia: onze dias que abalaram o mundo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290921, "titulo": "Lampsy Health raises €1.1M to shine a light on undetected night-time seizures", "url": "https://tech.eu/2026/11/27/lampsy-health-raises-eur11m-to-shine-a-light-on-undetected-night-time-seizures/", "fonte_id": "tech_eu", "data_pub": "2026-11-27T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup portuguesa Lampsy Health levantou €1,1 milhão para financiar a comercialização e distribuição de seu produto na Europa e no Reino Unido. A empresa desenvolveu uma lâmpada que monitora crises epilépticas noturnas não detectadas.", "titulo_pt": "Lampsy Health levanta €1,1 milhão para lançar e distribuir produto que monitora crises epilépticas noturnas", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 290891, "titulo": "Hana Bank expands QR payments to Malaysia", "url": "https://www.koreaherald.com/article/10952213", "fonte_id": "korea_herald", "data_pub": "2026-11-27T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A subsidiária da Hana Bank, GLN International, lançou o sistema de pagamentos QR emMalásia, expandindo sua rede para 17 países. O serviço permite pagamentos através de aplicativos coreanos sem a necessidade de uma conta bancária local ou instalação de outro aplicativo.", "titulo_pt": "Hana Bank estende pagamentos QR para malásia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290866, "titulo": "Bank of Korea flags risks to memory chip boom", "url": "https://www.digitimes.com/news/a20261127VL213/memory-exports-financing-investment-2027-2028.html", "fonte_id": "digitimes", "data_pub": "2026-11-27T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco da Coreia identificou riscos que podem levar aos preços das memórias semicondutores a cair abaixo das projeções atuais até 2028, caso a investimento em IA diminua, as condições de financiamento se tornem mais apertadas e as fabricantes chinesas aumentem a produção.", "titulo_pt": "Banco da Coreia alerta sobre riscos à bolha dos chips de memória", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 290759, "titulo": "Suzuki to domestically produce rare metal-free EV batteries", "url": "https://www.japantimes.co.jp/business/2026/11/27/companies/suzuki-rare-metal-free-batteries/", "fonte_id": "japan_times", "data_pub": "2026-11-27T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suzuki planeja produzir baterias para veículos elétricos sem metais raros com o objetivo de reduzir os riscos de importação de materiais que a Japan depende de importações.", "titulo_pt": "Suzuki vai produzir baterias para veículos elétricos sem metais raros no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 290823, "titulo": "Volvo's big batteries: We drive its updated 2028 plug-in hybrids", "url": "https://arstechnica.com/cars/2026/11/volvos-big-batteries-we-drive-its-updated-2028-plug-in-hybrids/", "fonte_id": "ars_technica", "data_pub": "2026-11-27T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Volvo lançou suas novas baterias para veículos plug-in híbridos, mas ainda não se sabe quanto eles custarão.", "titulo_pt": "Baterias das novas plug-in híbridos da volvo: o preço ainda é incerto", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 290807, "titulo": "Hong Kong police handle 30 cybersecurity cases in past month, including AI-assisted hack", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3376025/hong-kong-police-handle-30-cybersecurity-cases-past-month-including-ai-assisted-hack", "fonte_id": "scmp", "data_pub": "2026-11-27T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong lidou com 30 incidentes de segurança cibernética no último mês, com falhas nas comunicações entre componentes de software representando um terço dos casos. Uma falha no API de um aplicativo de uma cadeia local de varejo resultou na exposição de dados de mais de um milhão de clientes.", "titulo_pt": "Polícia de hong Kong trata de 30 casos de segurança cibernética, incluindo falha de api", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 290867, "titulo": "From lab to fab: Taiwan's supply chain holds key to mass-producing silicon photonics and CPO", "url": "https://www.digitimes.com/news/a20261127PD225/siph-cpo-equipment-2027.html", "fonte_id": "digitimes", "data_pub": "2026-11-27T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira Exposição de Tecnologia de Fotônica em Silício vai ocorrer de 21 a 23 de abril de 2027, abrangendo tecnologias de fotônica em silício, co-packaged optics, comunicações ópticas de alta velocidade, centrais de dados de IA, embalagens avançadas, componentes óptoeletrônicos, equipamentos e materiais, bem como testes e medições.", "titulo_pt": "Do laboratório à fábrica: cadeia de suprimentos de taiwan é crucial para a produção em massa de fotônica em silício e CPO", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 290868, "titulo": "Phone chip demand may stay weak in 2027, recovery seen in 2028", "url": "https://www.digitimes.com/news/a20261127PD220/smartphone-demand-recovery-2027-2028.html", "fonte_id": "digitimes", "data_pub": "2026-11-27T07:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que o mercado de smartphones pode continuar fraco em 2027, com uma recuperação mais evidente esperada para 2028. As condições do mercado devem permanecer semelhantes às de 2026, com Apple e Samsung Electronics mantendo sua liderança, enquanto as marcas chinesas enfrentam menor momentum nas vendas de modelos intermediários e de baixo custo, além de desafios crescentes na categoria de modelos premium.", "titulo_pt": "Demanda por chips de smartphones pode permanecer fraca em 2027, com recuperação prevista para 2028", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 290869, "titulo": "TSMC's A14 ready for chip design", "url": "https://www.digitimes.com/news/a20261127VL211/tsmc-ic-design-production-capacity.html", "fonte_id": "digitimes", "data_pub": "2026-11-27T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC, fabricante de chips mais grande do mundo, está preparada para projetar chips com sua próxima geração de processo A14, que será produzida em massa em 2028 usando tecnologia de 1,4nm.", "titulo_pt": "Tsmc's A14 pronto para projeto de chip", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 290898, "titulo": "Huawei, Kioxia challenge Samsung, SK hynix’s HBM dominance", "url": "https://www.koreaherald.com/article/10952102", "fonte_id": "korea_herald", "data_pub": "2026-11-27T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung e SK hynix enfrentam novos desafios em sua dominância no memory high-bandwidth, com a Huawei desenvolvendo seus próprios chips e o Kioxia colaborando com a Nvidia para reduzir a dependência de sistemas de inteligência artificial em memória de alto nível. Estas iniciativas visam diminuir a influência das empresas coreanas no mercado de memória avançada, cada uma por seu próprio caminho.", "titulo_pt": "Huawei e Kioxia desafiam a dominância de Samsung e SK hynix na memória de alto banda", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290701, "titulo": "Tech German software major SAP is reportedly weighing cutting at least 10,000 jobs in AI push", "url": "https://www.cnbc.com/2026/11/27/sap-job-cuts-ai-restructuring.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-27T07:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SAP está considerando cortes de pelo menos 10.000 vagas de emprego enquanto reestrutura sua empresa de software em torno da inteligência artificial, de acordo com relatos do Bloomberg.", "titulo_pt": "SAP considera cortes de pelo menos 10.000 vagas em push para inteligência artificial", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 290859, "titulo": "Bacterial colonies turn themselves inside out when oxygen is scarce", "url": "https://phys.org/news/2026-11-bacterial-colonies-oxygen-scarce.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bactérias formam colônias para se protegerem de ameaças externas. É pouco compreendido como essas colônias se transformam estruturalmente, especialmente quando há escassez de oxigênio.", "titulo_pt": "Colônias bacterianas se viram internamente quando há escassez de oxigênio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 290860, "titulo": "New atlas unites nearly 3,500 laser surveys to map forests across 56 countries", "url": "https://phys.org/news/2026-11-atlas-laser-surveys-forests-countries.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores, liderado pela Universidade de Bristol no Reino Unido, apresentou o Atlas Global da Canastra, que é a maior coleção integrada de mapas 3D de alta resolução de florestas, florestões e savanas já compilada.", "titulo_pt": "Novo atlas reúne quase 3.500 pesquisas laser para mapear florestas em 56 países", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 290888, "titulo": "Pregnancy is the ‘perfect storm’ for eating disorders, but doctors keep missing them", "url": "https://www.statnews.com/2026/11/27/pregnancy-eating-disorders-expanded-doctor-screening-needed/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas mulheres lutam com transtornos alimentares antes e depois do parto, mas frequentemente escapam ao sistema de saúde dos Estados Unidos.", "titulo_pt": "Gravidez é a 'perfeita tempestade' para transtornos alimentares, mas médicos continuam deixando-os passar", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 290889, "titulo": "Opinion: Montana’s ‘right to try’ law makes patients responsible for bearing costs — and risks", "url": "https://www.statnews.com/2026/11/27/montana-sb-535-right-to-try-questions-risks-costs-insurance/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Montana é o primeiro estado a ter sua própria lei 'direito de tentar', mas perguntas importantes permanecem, escrevem os pesquisadores.", "titulo_pt": "Opinião: lei 'direito de tentar' do montana coloca pacientes responsáveis pelos custos e riscos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 290934, "titulo": "New Scientist Book Club: How urine changed the course of human history", "url": "https://www.newscientist.com/article/2601034-new-scientist-book-club-how-urine-changed-the-course-of-human-history/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'The Age of Alchemy' venceu o prêmio Royal Society Trivedi Science Book. O autor Kit Chapman argumenta sobre o impacto transformador da urina em humanidade.", "titulo_pt": "Clube do livro new Scientist: como a urina mudou o curso da história humana", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 290935, "titulo": "Read an extract from The Age of Alchemy by Kit Chapman", "url": "https://www.newscientist.com/article/2601043-read-an-extract-from-the-age-of-alchemy-by-kit-chapman/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-27T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto explica a redescoberta do Leiden Papyrus X, o mais antigo livro de alquimia sobrevivente na história. Este trecho é extraído do livro The Age of Alchemy, de Kit Chapman, que faz parte da seleção do Club de Livros da New Scientist para o mês de dezembro.", "titulo_pt": "Leia um trecho de The Age of Alchemy por Kit Chapman", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 290561, "titulo": "Investigadores aseguran que podría existir otro Monte Everest debajo del hielo antártico", "url": "https://www.lanacion.com.ar/ciencia/investigadores-aseguran-que-podria-existir-otro-monte-everest-debajo-del-hielo-antartico-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-27T09:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Geólogos australianos encontraram evidências geológicas de cordilheiras gigantes sob o continente antártico, sugerindo que essas montanhas facilitaram o surgimento da vida animal. Essas montanhas poderiam ser comparáveis ao Monte Everest.", "titulo_pt": "Investigadores afirmam que pode existir outro Monte Everest sob o gelo antártico", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 290527, "titulo": "Cómo los genes podrían influir en el dolor crónico, según una nueva investigación", "url": "https://www.latercera.com/tendencias/noticia/como-los-genes-podrian-influir-en-el-dolor-cronico-segun-una-nueva-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estudo analisou dados genéticos e de saúde de mais de 1,2 milhões de pessoas, sendo considerado o mais amplo do tipo até agora. Os pesquisadores esperam que seu método possa levar, no futuro, a aplicações práticas e estratégias de prevenção relacionadas ao dor crónico.", "titulo_pt": "Como os genes podem influenciar o dor crónico, de acordo com uma nova pesquisa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 290563, "titulo": "Ciencia extrema: el increíble trabajo de la científica argentina que estudia al depredador más famoso de la Antártida", "url": "https://www.lanacion.com.ar/sociedad/ciencia-extrema-el-increible-trabajo-de-la-cientifica-argentina-que-estudia-al-depredador-mas-famoso-nid27112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-27T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A cientista argentina tem dedicado uma década de sua carreira a estudar a espécie mais famosa da Antártida durante um mês por ano, enfrentando condições extremas de frio e tempestades. Seus trabalhos incluem observações sobre a vida desses animais em ambientes hostis.", "titulo_pt": "Ciência extrema: o incrível trabalho da cientista argentina que estuda o predador mais famoso da Antártida", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 290936, "titulo": "Particles not seen before have been observed in a quantum simulator", "url": "https://www.newscientist.com/article/2600979-particles-not-seen-before-have-been-observed-in-a-quantum-simulator/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos observaram partículas que não pertencem às categorias tradicionais de bósons ou fermiões, sugerindo a possibilidade de uma terceira categoria de partículas. Um novo experimento oferece evidências de que essa terceira categoria poderia existir.", "titulo_pt": "Partículas não vistas antes observadas em simulador quântico", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 290367, "titulo": "Ambição turbinada: os destaques da segunda edição do prêmio Na Prática Protagonismo Universitário", "url": "https://exame.com/revista-exame/ambicao-turbinada/", "fonte_id": "exame", "data_pub": "2026-11-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A segunda edição do Prêmio Na Prática mostrou como os universitários brasileiros integraram a inteligência artificial em suas rotinas e como isso redefiniu as oportunidades de mercado. O prêmio também evidenciou o valor do diploma universitário para os participantes.", "titulo_pt": "Ambição turbinada: os destaques da segunda edição do prêmio Na Prática Protagonismo Universitário", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 290922, "titulo": "APOD: 2026 November 27 – The Moon Watchers", "url": "https://science.nasa.gov/image-article/apod-2026-november-27-the-moon-watchers/", "fonte_id": "nasa_news", "data_pub": "2026-11-27T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 27 de novembro de 2026 mostra a Lua, destacando observadores da Lua. O título original em inglês é 'The Moon Watchers'.", "titulo_pt": "Observadores da lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 290923, "titulo": "Shivelyuch Socked In", "url": "https://science.nasa.gov/earth/earth-observatory/shivelyuch-socked-in/", "fonte_id": "nasa_news", "data_pub": "2026-11-27T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma camada de nuvens envolvia os flancos do vulcão na Península de Kamchatka, mas deixava visível seu caldeirão agitado.", "titulo_pt": "Nuvens envolvem vulcão na península de kamchatka", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 290915, "titulo": "A fat-burning molecule has an unexpected benefit for your muscles", "url": "https://www.sciencedaily.com/releases/2026/11/261126063315.htm", "fonte_id": "science_daily", "data_pub": "2026-11-27T04:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobririram que uma molécula natural liberada durante a atividade física ajuda os músculos a se tornarem mais fortes, resistirem à fadiga e suportarem danos. Esta molécula, já disponível como suplemento alimentar, pode abrir novas possibilidades para o tratamento da degeneração muscular associada ao diabetes de tipo 2.", "titulo_pt": "Uma molécula queima gorduras oferece benefícios inesperados aos músculos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 290916, "titulo": "Scientists identify two ages when children may be most vulnerable to screen time", "url": "https://www.sciencedaily.com/releases/2026/11/261126033220.htm", "fonte_id": "science_daily", "data_pub": "2026-11-27T03:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram dois períodos de desenvolvimento quando o tempo de tela pode ser particularmente prejudicial para o aprendizado e memória das crianças: a infância e o início da escola formal. Exposição maior à tela durante essas janelas de desenvolvimento foi associada a piores desempenhos acadêmicos e memória de trabalho mais fraca anos depois.", "titulo_pt": "Cientistas identificam dois momentos críticos quando o tempo de tela pode ser especialmente prejudicial para a aprendizagem e memória das crianças", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 290914, "titulo": "Harvard’s tiny UV light chip could help shrink quantum computers", "url": "https://www.sciencedaily.com/releases/2026/11/261126063333.htm", "fonte_id": "science_daily", "data_pub": "2026-11-27T03:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores liderados pela Harvard University desenvolveram um dispositivo microscópico que gera 120 vezes mais luz ultravioleta do que métodos anteriores, eficientemente convertendo luz vermelha em UV. Este avanço pode permitir computadores quânticos mais compactos, relógios atômicos ultra-precisos e sensores ambientais compactos.", "titulo_pt": "Chip de luz UV miniaturizado da harvard pode ajudar a reduzir computadores quânticos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 290937, "titulo": "The debate over putting trees on buildings", "url": "https://www.dezeen.com/2026/11/27/trees-on-buildings-chipotle-hoodie-shanghai-opera-house-dezeen-weekly/", "fonte_id": "dezeen", "data_pub": "2026-11-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda o debate sobre a incorporação de árvores em edifícios. Também discute tendências atuais na moda de rua relacionadas à comida e critica aspectos do novo Teatro Grande de Shanghai projetado pela Snøhetta.", "titulo_pt": "Debate sobre a incorporação de árvores em edifícios", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 290941, "titulo": "Carroll Dunham Calls His Filthy Formalism “Abstraction with a Hard-On”", "url": "https://www.artnews.com/art-in-america/features/carroll-dunham-ica-miami-laurie-simmons-1234807999/", "fonte_id": "artnews", "data_pub": "2026-11-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Carroll Dunham chama seu formalismo sujo de abstração com uma ereção. Antes de sua retrospectiva em Miami, o artista e seus aliados ajudam um cético a compreender sua obra.", "titulo_pt": "Carroll Dunham chama seu formalismo sujo de abstração com uma ereção", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 290942, "titulo": "Batima Zaurbekova’s Textiles Meld Traditional Kazakh Techniques with Modernist Influences, Defying Easy Categorization", "url": "https://www.artnews.com/art-news/artists/batima-zaurbekova-retrospective-almaty-kazakhstan-1234807853/", "fonte_id": "artnews", "data_pub": "2026-11-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A artista Batima Zaurbekova, com 80 anos, é o centro de uma importante retrospectiva no Abylkhan Kasteyev National Museum of Arts. Seus tecidos mesclam técnicas tradicionais kazacas com influências modernistas, defrontando categorizações fáceis.", "titulo_pt": "Batima Zaurbekova: tecidos que combinem técnicas tradicionais kazacas com influências modernistas, desafiando categorizações fáceis", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 290551, "titulo": "Navidad 2026: qué es y cómo se hace el pan dulce relleno de cookies", "url": "https://www.lanacion.com.ar/recetas/navidad-2026-que-es-y-como-se-hace-el-pan-dulce-relleno-de-cookies-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-27T09:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A receita de pan dulce relleno de cookies será lançada para a Navidad de 2026. O artigo explica como preparar esta inovadora e curiosa receita em poucos passos, com o objetivo de surpreender a família na mesa de Natal no dia 24 e 25 de dezembro.", "titulo_pt": "Navidad 2026: aprenda a fazer o pan dulce relleno de cookies", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 290890, "titulo": "'Rashta never gets tired': Lee Se-young on playing the villain of 'The Remarried Empress'", "url": "https://www.koreaherald.com/article/10952228", "fonte_id": "korea_herald", "data_pub": "2026-11-27T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rashta, a vilã central da série Disney+ 'A Remarinha Imperatriz', é uma personagem manipuladora e cruel em um mundo fictício medieval. Ela começa como uma escrava fugida que se torna o interesse do imperador, causando o divórcio de sua esposa perfeita, a Imperatriz Navier, e prossegue em uma caminhada de mentiras e traições em direção ao trono, deixando corpos em seu caminho.", "titulo_pt": "Rashta nunca se cansa: lee Se-young sobre interpretar a vilã de 'a remarinha imperatriz'", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290322, "titulo": "Cristo Redentor: braços abertos sobre nuvens", "url": "https://veja.abril.com.br/brasil/cristo-redentor-bracos-abertos-sobre-nuvens/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma impressionante cascata de nuvens envolveu o monumento mais simbólico do Rio de Janeiro. O Cristo Redentor estava cercado por nuvens, destacando-se contra o céu.", "titulo_pt": "Cristo Redentor: braços abertos sobre nuvens", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290323, "titulo": "Pragmatismo e estabilidade", "url": "https://veja.abril.com.br/coluna/murillo-de-aragao/pragmatismo-e-estabilidade/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fórmula para recuperar a confiança já é conhecida. O texto sugere que existem medidas práticas e estáveis que podem ser adotadas.", "titulo_pt": "Pragmatismo e estabilidade", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290324, "titulo": "Símbolos de resistência, vitrais salvos dos nazistas voltam à exposição pública após 90 anos", "url": "https://veja.abril.com.br/cultura/simbolos-de-resistencia-vitrais-salvos-dos-nazistas-voltam-a-exposicao-publica-apos-90-anos/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vitrais que sobreviveram durante o período nazista estão sendo exibidos novamente após 90 anos. Em um mundo atualmente marcado por conflitos, esses fragmentos de vidro adquiriram um novo significado simbólico.", "titulo_pt": "Símbolos de resistência: vitrais salvos dos nazistas voltam à exposição pública após 90 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290330, "titulo": "Tabata Amaral: “Há muitos privilégios”", "url": "https://veja.abril.com.br/paginas-amarelas/tabata-amaral-ha-muitos-privilegios/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada reeleita Tabata Amaral do PSB defende ajustes nas contas públicas, destacando a necessidade de incluir os supersalários e as emendas parlamentares nesse processo.", "titulo_pt": "Tabata Amaral: 'há muitos privilégios'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290928, "titulo": "Get me a 747 and deploy the oxygen masks! The British pilot behind Hollywood’s greatest inflight scenes", "url": "https://www.theguardian.com/film/2026/nov/27/british-pilot-plane-film-hollywood-focker-in-law-britney-spears-aero-mock-ups", "fonte_id": "guardian_culture", "data_pub": "2026-11-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Richard Chan, conhecido por fornecer cenários de cabine de avião para filmes, relembra suas produções mais notáveis, incluindo cenas de emergência em 'Noivas Casadas', humilhações em 'Os Fazendeiros do Caribe' e cenas inusitadas como um grande vaso sanitário em um vídeo do clipe de 'Toxic' da Britney Spears. O texto destaca a preocupação crescente dos passageiros com a possibilidade de problemas durante as viagens aéreas, mencionando a recente interrupção da FAA e o aumento de vídeos virais mostrando comportamentos inadequados a bordo de aviões.", "titulo_pt": "Piloto britânico lembra de suas maiores cenas de cabine de avião em Hollywood", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 290932, "titulo": "The Private Diary of Pope Francis review – a glimpse of life inside the Vatican", "url": "https://www.theguardian.com/books/2026/nov/27/the-private-diary-of-pope-francis-review-a-glimpse-of-life-inside-the-vatican", "fonte_id": "guardian_culture", "data_pub": "2026-11-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diário privado do Papa Francisco, publicado quase dois anos após sua morte, oferece uma visão da profundidade de sua fé, mas não deve se esperar revelações ou conteúdo explícito. O livro captura o pensamento do papa argentino, que tornou-se o 266º papa da Igreja Católica Romana, sendo o primeiro latino-americano e o primeiro papa não europeu desde o século 8, além de ser o primeiro jesuíta a ocupar o cargo e ter escolhido o nome Francisco em homenagem ao Santo Francisco de Assisí.", "titulo_pt": "A vida privada do papa francisco - uma visão interna do vaticano", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 290892, "titulo": "Rescene, Aespa, BTS reveal contrasting K-pop tastes in Korea, China, Japan", "url": "https://www.koreaherald.com/article/10952210", "fonte_id": "korea_herald", "data_pub": "2026-11-27T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A group de K-pop Rescene se destacou em seu mercado doméstico, superando artistas mais conhecidos. Aespa lidera na China, enquanto BTS permanece inigualável no Japão. Esses resultados foram revelados no primeiro relatório de dados do Global-K Chart, uma classificação de artistas de K-pop lançada em junho pela Kakao Entertainment.", "titulo_pt": "Rescene, Aespa e BTS revelam diferenças na popularidade do K-pop em diferentes mercados da ásia oriental", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290927, "titulo": "‘We had a drug dealer called Satan on our tour bus’: Britpop stars Echobelly on debauchery, being pals with Oasis – and their spiritual return", "url": "https://www.theguardian.com/music/2026/nov/27/we-had-a-drug-dealer-called-satan-on-our-tour-bus-britpop-stars-echobelly-on-debauchery-being-pals-with-oasis-and-their-spiritual-return", "fonte_id": "guardian_culture", "data_pub": "2026-11-27T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Echobelly, uma banda britânica de rock, está de volta como um duo após passar por momentos difíceis, incluindo excessos e problemas financeiros. Antes de lançarem um novo álbum, eles lembram-se de terem se encontrado com a banda Oasis durante uma turnê nos Estados Unidos em 1994, refutando a ideia de que Oasis tenha usado cristal meth durante a turnê.", "titulo_pt": "Echobelly: da turnê com Oasis à volta como duo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 290760, "titulo": "A documentarian’s painstaking portrait of Bunyo Ishikawa, the ‘Battlefield Bohemian’", "url": "https://www.japantimes.co.jp/culture/2026/11/27/film/bunyo-ishikawa-documentary-atsunori-kawamura-interview/", "fonte_id": "japan_times", "data_pub": "2026-11-27T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diretor do NHK Atsunori Kawamura dedicou sete anos para produzir um documentário sobre um fotógrafo de guerra chamado Bunyo Ishikawa, conhecido como 'Boêmio do Campo de Batalha'.", "titulo_pt": "Documentário demorado sobre Bunyo Ishikawa, o 'boêmio do campo de batalha'", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 290281, "titulo": "Romances de 'garota maluca' reacendem debate de rótulos em livros de mulheres", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/romances-de-garota-maluca-reacendem-debate-de-rotulos-em-livros-de-mulheres.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romances que retratam mulheres independentes e sexuais têm reacendido debates sobre rótulos em literatura feminina. O trecho descreve uma personagem de 30 anos com carreira e vida social ativa.", "titulo_pt": "Romances de 'garota maluca' reavivam discussões sobre rótulos em livros de mulheres", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 290282, "titulo": "Luciany Aparecida prepara novo romance 'Tinta da Bahia' para julho de 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/walter-porto/2026/11/luciany-aparecida-prepara-novo-romance-tinta-da-bahia-para-julho-de-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A editora Alfaguara planeja lançar o novo romance de Luciany Aparecida, intitulado 'Tinta da Bahia', em julho de 2027. A autora ganhou destaque com seu primeiro romance, 'Mata Doce', que foi publicado há quatro anos e lhe rendeu o Prêmio São Paulo de Literatura.", "titulo_pt": "Luciany Aparecida prepara novo romance 'Tinta da Bahia' para julho de 2027", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 290387, "titulo": "Servidor é demitido e indiciado por perseguir e importunar colegas", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/servidor-e-demitido-e-indiciado-por-perseguir-e-importunar-colegas", "fonte_id": "metropoles", "data_pub": "2026-11-27T09:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um servidor foi demitido e indiciado por perseguir e importunar colegas de trabalho. De acordo com a PCES, o motorista abordava insistentemente funcionárias do Pronto Atendimento de Marilândia (ES).", "titulo_pt": "Servidor é demitido e indiciado por perseguir e importunar colegas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290327, "titulo": "Pais lotam a agenda dos filhos, mas especialistas alertam para riscos de sobrecarga", "url": "https://veja.abril.com.br/comportamento/pais-lotam-a-agenda-dos-filhos-mas-especialistas-alertam-para-riscos-de-sobrecarga/", "fonte_id": "veja", "data_pub": "2026-  "texto_pt": "Um terço das escolas na Coreia do Sul paralisou as refeições na sexta-feira devido a uma greve de trabalhadores pedindo aumento de salários e melhores condições de trabalho. As escolas que não serviram refeições normais forneceram alternativas como pão e leite ou permitiram que os alunos trouxessem lanches de casa.", "titulo_pt": "Pão e leite: greve interrompe refeições regulares em cerca de 1 em 3 escolas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290896, "titulo": "Three middle school girls help save man at subway station", "url": "https://www.koreaherald.com/article/10952139", "fonte_id": "korea_herald", "data_pub": "2026-11-27T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 70 anos desmaiou em uma plataforma de metrô em Seongnam, Gyeonggi Province. Três estudantes do ensino médio intervieram rapidamente, verificando seu estado e chamando ajuda, antes de começar a fazer compressões cardíacas. Sua rápida ação, juntamente com os esforços de um funcionário da estação que usou um defibrilador externo automático, contribuiu para salvar sua vida.", "titulo_pt": "Três estudantes do ensino médio ajudam a salvar homem de 70 anos em estação de metrô", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290419, "titulo": "Dia D de vacinação contra meningite ocorre neste sábado na capital paulista", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/dia-d-de-vacinacao-contra-meningite-ocorre-neste-sabado-na-capital-paulista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de vacinação contra meningite ocorre neste sábado na capital paulista, prioritariamente para adolescentes entre 11 e 14 anos que não receberam a dose da vacina meningocócica, além de outras vacinas disponíveis para diferentes faixas etárias.", "titulo_pt": "Dia D de vacinação contra meningite ocorre neste sábado na capital paulista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 290366, "titulo": "Gente que cuida de gente", "url": "https://exame.com/revista-exame/gente-que-cuida-de-gente/", "fonte_id": "exame", "data_pub": "2026-11-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas premiadas no Melhores em Gestão de Pessoas 2026 oferecem bolsas de estudo para funcionários e familiares, apoio psicológico, reconhecimento e oportunidades de carreira. Estas práticas resultam em altos níveis de orgulho e satisfação entre os funcionários.", "titulo_pt": "Pessoas que cuidam de pessoas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 290607, "titulo": "Race hate exploded in this Spanish town last year. Now its residents are bracing for more", "url": "https://www.theguardian.com/world/2026/nov/27/spain-migrants-election-vox-far-right-europe", "fonte_id": "guardian_world", "data_pub": "2026-11-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes de Torre-Pacheco, uma cidade espanhola com comunidades diversificadas, estão preocupados com a possibilidade de entrada do partido de extrema-direita Vox no governo após as eleições deste domingo. A chegada do Vox está sendo vista como um sinal de aumento do racismo na cidade.", "titulo_pt": "Ojeriza racial explodiu nesta cidade espanhola no ano passado. Agora, os residentes se preparam para mais.", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 290776, "titulo": "Health ministry mulls raising care insurance premiums for some older adults", "url": "https://www.japantimes.co.jp/news/2026/11/27/japan/society/older-adults-care-insurance/", "fonte_id": "japan_times", "data_pub": "2026-11-27T02:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério da Saúde está considerando aumentar as taxas de seguro de cuidados para alguns idosos. As mudanças ocorrem devido aos desafios de eiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 288972, "titulo": "Covid-19: casos graves aumentam e variante monitorada pela OMS circula em 8 estados", "url": "https://veja.abril.com.br/saude/covid-19-casos-graves-aumentam-e-variante-monitorada-pela-oms-circula-em-8-estados/", "fonte_id": "veja", "data_pub": "2026-11-26T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa de novos episódios graves do novo coronavírus e de outros vírus respiratórios está em nível de alerta no Rio de Janeiro. A variante monitorada pela OMS circula em oito estados brasileiros.", "titulo_pt": "Covid-19: casos graves aumentam e variante da OMS circula em 8 estados", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 289146, "titulo": "Espanha avalia risco ambiental após navio-tanque com 7 mil toneladas de diesel virar perto de Ibiza", "url": "https://www.bbc.com/portuguese/articles/c60ev94d02jlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-26T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O serviço de salvamento marítimo da Espanha está avaliando os possíveis danos ambientais causados por um navio-tanque que virou perto da ilha de Ibiza, contendo 7 mil toneladas de diesel.", "titulo_pt": "Espanha avalia risco ambiental após navio-tanque com 7 mil toneladas de diesel virar perto de Ibiza", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 288976, "titulo": "Seca na Amazônia: governo estuda auxílio emergencial para pescadores", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/seca-na-amazonia-governo-estuda-auxilio-emergencial-para-pescadores", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-26T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal considera fornecer um auxílio emergencial para cerca de 400 mil pescadores artesanais afetados pela seca nos rios da Amazônia. O ministro da Pesca e Aquicultura, Édipo Araújo, afirmou que tem recebido pedidos para conceder um auxílio extraordinário para esses pescadores que estão sem trabalho devido às condições climáticas adversas.", "titulo_pt": "Seca na Amazônia: governo considera auxílio emergencial para pescadores", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 289140, "titulo": "Espanha tenta evitar desastre ambiental após acidente com navio-tanque no Mediterrâneo", "url": "https://www.dw.com/pt-br/espanha-tenta-evitar-desastre-ambiental-após-acidente-com-navio-tanque-no-mediterrâneo/a-80063833?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T14:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um navio-tanque com cerca de 8,2 milhões de litros de diesel virou perto da ilha de Ibiza, Espanha, deixando uma pessoa morta. A Espanha está tentando evitar um desastre ambiental.", "titulo_pt": "Espanha tenta evitar desastre ambiental após acidente com navio-tanque no Mediterrâneo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289430, "titulo": "Aerial footage shows diesel tanker sinking off Ibiza", "url": "https://www.euronews.com/2026/11/26/aerial-footage-shows-diesel-tanker-sinking-off-ibiza", "fonte_id": "euronews", "data_pub": "2026-11-26T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tanqueiro carregado com aproximadamente 7.000 toneladas de diesel virou perto da ilha de Ibiza, Espanha, levando autoridades a avaliarem o risco de poluição marinha. Um dos membros da tripulação morreu após todos os 17 passageiros serem resgatados.", "titulo_pt": "Vídeo aéreo mostra tanque de diesel virado perto de Ibiza", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 289288, "titulo": "‘Disaster’ unfolding as Sydney fire ant outbreak partly blamed on ignored biosecurity recommendations", "url": "https://www.theguardian.com/australia-news/2026/nov/27/sydney-fire-ants-outbreak-biosecurity-experts-ignored", "fonte_id": "guardian_world", "data_pub": "2026-11-26T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que recomendações antigos do órgão de vigilância biosecuritária australianas foram ignoradas ou não implementadas pelos governos federais sucessivos, aumentando o risco de uma explosão de pragas invasoras como a descoberta de formigas de fogo em Sydney esta semana. O presidente da federação de agricultores afirma que Austrália não consegue até mesmo manter cigarros ilegítimos fora do país, muito menos pragas detectáveis.", "titulo_pt": "Desastre em andamento devido a infestação de formigas de fogo em Sydney, em parte devido a recomendações de biosegurança ignoradas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 289562, "titulo": "Deadly factory fire in Indonesia renews lack of safety enforcement fears", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3375934/deadly-factory-fire-indonesia-renews-lack-safety-enforcement-fears", "fonte_id": "scmp", "data_pub": "2026-11-26T10:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio letal em uma fábrica de doces em Banten, na Indonésia, resultou em 26 mortos e cerca de 30 desaparecidos, levantando preocupações sobre a inconsistência na aplicação das regulamentações de segurança no trabalho no país. A falta de fiscalização adequada e práticas de operação das empresas são apontadas como fatores de risco para os trabalhadores.", "titulo_pt": "Incêndio letal em fábrica na indonésia reforça temores sobre falta de fiscalização de segurança no trabalho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288212, "titulo": "Mau tempo atrasa mais de 6 mil voos na véspera de Ação de Graças nos EUA", "url": "https://www.cnnbrasil.com.br/internacional/mau-tempo-atrasa-mais-de-6-mil-voos-na-vespera-de-acao-de-gracas-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tempestades nas duas costas dos Estados Unidos causaram atrasos em mais de 6 mil voos na véspera de Ação de Graças. A Parada de Ação de Graças da Macy's em Nova York foi adiada pela primeira vez devido às condições meteorológicas adversas.", "titulo_pt": "Mau tempo adia mais de 6 mil voos e parada de Ação de Graças na véspera do feriado nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 290796, "titulo": "‘Sheer Outrage’: North Macedonia Activists Vow to Intensify Protests After Femicides", "url": "https://balkaninsight.com/2026/11/27/sheer-outrage-north-macedonia-activists-vow-to-intensify-protests-after-femicides/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-27T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após uma série de femicídios e violência contra mulheres em Macedônia do Norte, ativistas estão aumentando suas demandas por responsabilização, mudanças legislativas e suporte maior para sobreviventes. A ativista Marija Arsenkova informou à BIRN que os protestos serão intensificados.", "titulo_pt": "Ira total: ativistas de macedônia do norte prometem aumentar protestos após femicídios", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 290908, "titulo": "S. Korea repatriates 6 rescued North Korean fishing crew, 1 opts to stay", "url": "https://www.koreaherald.com/article/10951950", "fonte_id": "korea_herald", "data_pub": "2026-11-27T05:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis marinheiros norte-coreanos foram repatriados para a Coreia do Norte após 24 dias, enquanto um dos sete membros da tripulação optou por ficar na Coreia do Sul e pediu proteção governamental.", "titulo_pt": "Coreia do sul repatria seis tripulantes norte-coreanos resgatados, um opta ficar", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290814, "titulo": "Malaysian teacher gets 60 years, 24 strokes in Sarawak school sex abuse case", "url": "https://www.scmp.com/week-asia/people/article/3375992/malaysian-teacher-gets-60-years-24-strokes-sarawak-school-sex-abuse-case", "fonte_id": "scmp", "data_pub": "2026-11-27T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor em Malaysia foi condenado a 60 anos de prisão por abusar sexualmente de oito meninas com idades entre 7 e 12 anos em uma escola primária em Sarawak. Ele também foi sentenciado a 24 chicotadas. Este caso é o mais recente de uma série de acusações contra educadores, apesar da posição firme do governo contra esses crimes.", "titulo_pt": "Professor malásio é condenado a 60 anos e 24 chicotadas em caso de abuso sexual em escola", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 289802, "titulo": "PF assume investigação de suspeita de tráfico internacional de bebês em Saquarema", "url": "https://veja.abril.com.br/brasil/pf-assume-investigacao-de-suspeita-de-trafico-internacional-de-bebes-em-saquarema/", "fonte_id": "veja", "data_pub": "2026-11-26T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um casal estrangeiro foi detido sob suspeita de envolvimento no tráfico internacional de bebês. A Polícia Federal assumiu a investigação no município de Saquarema.", "titulo_pt": "PF investiga suspeita de tráfico internacional de bebês em Saquarema", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290081, "titulo": "TC declara admisible recurso para que marinos imputados por violación en Rapa Nui vayan a una cárcel común", "url": "https://www.latercera.com/nacional/noticia/tc-declara-admisible-recurso-para-que-marinos-imputados-por-violacion-en-rapa-nui-vayan-a-una-carcel-comun/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T20:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A magistratura constitucional chilena passará a analisar o caso em profundidade, ouvirá as partes envolvidas e decidirá se aceitará ou rejeitara o recurso que foi apresentado pelo representante da vítima. O recurso visa permitir que marinheiros acusados de violação em Rapa Nui sejam encarcerados em uma prisão comum ao invés de uma prisional militar.", "titulo_pt": "TC decide analisar recurso para marinheiros acusados de violação em Rapa Nui serem encarcerados em prisão comum", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 289820, "titulo": "Israel ‘chancela tortura’ de prisioneiros palestinos para extrair confissões, diz relatório", "url": "https://veja.abril.com.br/mundo/israel-chancela-tortura-de-prisioneiros-palestinos-para-extrair-confissoes-diz-relatorio/", "fonte_id": "veja", "data_pub": "2026-11-26T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório denuncia a institucionalização de medidas especiais de interrogatório no sistema de prisioneiros palestinos, que Israel chancela, e o risco de erros judiciais irreversíveis. A nova lei de pena de morte está em vigor.", "titulo_pt": "Israel aprova tortura de prisioneiros palestinos para obter confissões, alerta relatório", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 289190, "titulo": "Confirman la condena al productor que destruyó nidos y mató pingüinos en Punta Tombo", "url": "https://www.lanacion.com.ar/sociedad/confirman-la-condena-al-productor-que-destruyo-nidos-y-mato-pinguinos-en-punta-tombo-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Provincial confirmou a pena de três anos de prisão condicional para o produtor acusado de destruir ninhos e matar pingüins em Punta Tombo. A fiscal Florencia Gómez salientou a importância deste julgamento para a proteção da fauna silvestre.", "titulo_pt": "Confirmação da condenação do produtor que destruiu nidos e matou pingüins em Punta Tombo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 289133, "titulo": "Sobreviventes cobram justiça um ano após megaincêndio em Hong Kong", "url": "https://www.dw.com/pt-br/sobreviventes-cobram-justiça-um-ano-após-megaincêndio-em-hong-kong/a-80068207?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ano após o megaincêndio em Hong Kong, que deixou 168 mortos e cerca de 4.600 desalojados, sobreviventes estão pressionando por justiça. Diante da indignação pública e do trauma, as autoridades reprimem essas cobranças, evitando uma investigação independente.", "titulo_pt": "Sobreviventes cobram justiça um ano após megaincêndio em Hong Kong", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289250, "titulo": "Campillai presenta querella contra ex alto mando de Carabineros por presuntas violaciones a los DD.HH. en el estallido social", "url": "https://www.latercera.com/nacional/noticia/campillai-presenta-querella-contra-exalto-mando-de-carabineros-por-presuntas-violaciones-a-los-ddhh-en-el-estallido-social/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T16:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A senadora Campillai apresentou uma denúncia judicial contra ex-comandantes da Carabineros acusando-os de ter conhecimento de violações aos direitos humanos durante os protestos sociais e de não terem agido para impedir essas violações. Ela busca que essa ação judicial seja incorporada à causa contra os ex-comandados.", "titulo_pt": "Campillai apresenta denúncia contra ex-alto-comando da Carabineros por supostas violações de direitos humanos durante os protestos sociais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 289373, "titulo": "Emilie König, France's most high-profile female jihadist, faces justice", "url": "https://www.lemonde.fr/en/france/article/2026/11/26/emilie-konig-france-s-most-high-profile-female-jihadist-faces-justice_6789302_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A julgamento de Emilie König, uma mãe de cinco filhos repatriada da Síria e acusada de conspiração terrorista, por disseminar propaganda do grupo Estado Islâmico, foi iniciado em Paris. A acusação se refere especificamente a sua suposta atividade de propaganda para o grupo extremista.", "titulo_pt": "Emilie König, mais proeminente mulher jihaldista da França, enfrenta julgamento", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289374, "titulo": "Paris appeals court upholds trial order for Depardieu over rape claims", "url": "https://www.lemonde.fr/en/culture/article/2026/11/26/paris-appeals-court-upholds-trial-order-for-depardieu-over-rape-claims_6789301_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal de apelações de Paris manteve a decisão de julgamento contra Gérard Depardieu, de 77 anos, acusado de estupro de Charlotte Arnould em 2018, quando ela tinha 22 anos.", "titulo_pt": "Tribunal de apelações de paris mantém decisão de julgamento contra Depardieu por acusação de estupro", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289369, "titulo": "Bardella's antisemitic messages: 19 elements proving he was the author, contrary to his denials", "url": "https://www.lemonde.fr/en/politics/article/2026/11/26/bardella-s-antisemitic-messages-19-elements-proving-he-was-the-author-contrary-to-his-denials_6789268_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Le Monde obteve uma conversa privada do Facebook de 2013 envolvendo Jordan Bardella, revelada pela plataforma investigativa Mediapart. As mensagens correspondem a outras declarações públicas, demonstrando que, apesar das negações repetidas, o presidente do partido de Marine Le Pen efetivamente fez comentários antissemitas.", "titulo_pt": "Mensagens antissemitas de bardella: 19 elementos provando que ele foi o autor, contra suas negações", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289476, "titulo": "UN ruling disputes Israeli allegations used to dismiss UNRWA Gaza staff", "url": "https://www.aljazeera.com/news/2026/11/26/un-ruling-disputes-israeli-allegations-used-to-dismiss-unrwa-gaza-staff?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal levantou questões sobre a credibilidade da decisão do UNRWA de demitir seus funcionários sem evidências comprovadas. Isso questiona as alegações israelenses que justificaram a demissão.", "titulo_pt": "Julgamento questiona decisão do UNRWA em demitir funcionários em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 289552, "titulo": "UN experts demand Vietnam explain ‘abduction’ of activists from Cambodia", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375945/un-experts-demand-vietnam-explain-abduction-activists-cambodia", "fonte_id": "scmp", "data_pub": "2026-11-26T12:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Orientais das Nações Unidas pediram que o Vietnã explique como três ativistas pró-democracia acabaram detidos, enfrentando acusações de terrorismo, após supostamente serem sequestrados do vizinho Camboja. O Vietnã é conhecido por reprimir fortemente a oposição interna e críticos dizem que a sua apparatus de segurança atua além das fronteiras, com dissidentes desejados já sendo abduzidos no Tailândia e na Alemanha.", "titulo_pt": "Orientais das nações unidas exigem explicações do vietnã sobre suposto sequestro de ativistas pró-democracia do camboja", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 289498, "titulo": "Vietnam must explain ‘abduction’ of activists: U.N. experts", "url": "https://www.japantimes.co.jp/news/2026/11/26/asia-pacific/vietnam-activists-un-experts/", "fonte_id": "japan_times", "data_pub": "2026-11-26T12:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vietnam proíbe quase toda divergência interna e os críticos afirmam que seu aparelho de segurança estende suas atividades além das fronteiras do país. O Conselho de Direitos Humanos da ONU pede que o Vietnã explique a 'abdução' de ativistas.", "titulo_pt": "ONU pede explicação sobre 'abdução' de ativistas no vietnã", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 289370, "titulo": "'At the hospital, they didn't know if I would make it through the night': Stun grenades cause increasingly severe injuries at protests in France", "url": "https://www.lemonde.fr/en/france/article/2026/11/26/at-the-hospital-they-didn-t-know-if-i-would-make-it-through-the-night-stun-grenades-cause-increasingly-severe-injuries-at-protests-in-france_6788971_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Stéphanie e Jonathan, que não se conhecem, foram feridos por fragmentos de granada de eletrocutação em protestos em outubro. As lesões continuam a afetá-los.", "titulo_pt": "Hospital não sabia se eu aguentaria a noite: ferimentos cada vez mais graves por causa de granadas de eletrocutação em protestos na França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 290859, "fonte_id": "phys_org", "titulo": "Bacterial colonies turn themselves inside out when oxygen is scarce", "url": "https://phys.org/news/2026-11-bacterial-colonies-oxygen-scarce.html", "data_pub": "2026-11-27T10:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "Colônias bacterianas se viram internamente quando há escassez
