<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "29/08/2026 15:22", "stats": {"noticias_novas": 575, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As eleições presidenciais no Brasil ganham força com a estreia das propagandas eleitorais na televisão e no rádio. Lula e Jair Bolsonaro, os principais candidatos, mantêm-se consistentes em suas abordagens. Lula enfatiza a participação feminina na política, enquanto Jair Bolsonaro busca o voto feminino. O presidente Lula reafirma que o Congresso Nacional aprovará o fim da sistemática 6x1, enquanto Lula enfrenta questionamentos sobre a origem de recursos financeiros. Renan Santos, candidato a presidente, destaca-se positivamente nas mídias. A campanha petista tenta minimizar os danos causados por fotos divulgadas. A agenda dos candidatos para o fim de semana inclui diversos eventos e reuniões, com destaque para a reunião de Jair Bolsonaro em Angra dos Reis e a carreata de Anthony Garotinho no Rio de Janeiro. Além disso, a PEC da Segurança Pública pode impactar o orçamento do esporte, e a campanha presidencial realiza uma série de atividades em diversas regiões do país.", "mundo": "Um ataque letal perto de Kyiv, na Ucrânia, resultou em 37 mortos, sendo um dos ataques mais letais do ano. Drones realizaram ataques quase constantes em todo o território ucraniano. Em outra notícia, o ex-presidente da Honduras, Juan Orlando Hernández, foi perdoado por Donald Trump e evitou uma pena de 45 anos de prisão americana, retornando ao país para enfrentar novas acusações de fraude e lavagem de dinheiro. Além disso, a China e a Jordânia se uniram na questão palestina, com o presidente Xi Jinping proposto quatro princípios para uma solução política, em meio ao conflito em Gaza.\n\nO conflito na Ucrânia continua a dominar a cena geopolítica, com ataques russos e intensificação das operações militares. Um ataque com drones russos a um depósito de armas perto de Kyiv resultou em pelo menos 37 mortes e grandes danos, conforme informou o presidente ucraniano Zelenskyy. O incidente levou a uma investigação sobre possíveis negligências criminais. Além disso, um ataque aéreo russo a um depósito de munições perto de Kyiv causou várias mortes, refletindo a escalada dos ataques aéreos na região. Em outro desenvolvimento, Israel intensificou os ataques em Gaza, resultando em mortes e feridos, incluindo um ataque de drone que atingiu um hospital em Deir el-Balah, ferindo três pessoas. As tensões regionais continuam com Israel e a Turquia em conflito no Mar Negro devido a ataques a navios turcos, enquanto o Irã reafirmou sua posição de resistência às sanções americanas e prometeu resistir ao controle diplomático e militar.", "economia": "Em 2026, o Brasil foi incluído no top 5 dos melhores países para estrangeiros viverem, de acordo com um ranking. O governo Lula busca maior liberdade para conter gastos em caso de desvios nas receitas e considera implementar medidas que permitam à equipe econômica atingir o centro da meta de resultado primário a partir de 2027. A Airbus está avaliando a venda de sua operação espacial nos Estados Unidos enquanto concentra esforços na criação de uma gigante pan-europeia de satélites através da fusão de três empresas. O programa Novo Desenrola Brasil, que visa renegociar dívidas bancárias de pessoas físicas, termina nesta segunda-feira. O relator do caso no Supremo Tribunal Federal (STF) alterou o placar da votação, eliminando a maioria que defendia a constitucionalidade da tributação do lucro de controladas no exterior. O governo dos Estados Unidos anunciou um acordo que deu aos EUA o controle majoritário de mais de 65 bilhões de barris de petróleo bruto venezuelano, equivalente a cerca de um quinto das reservas do país. O Irã reconheceu os impactos econômicos das sanções dos Estados Unidos, afirmando que combater essas pressões é uma de suas principais prioridades. A construção civil é considerada um dos segmentos mais blindados ao cenário eleitoral, com a MRV, construtora e incorporadora mineira, sendo a maior empresa do segmento na América Latina, focada em habitações populares. A Confederação Nacional da Indústria (CNI) realizou um levantamento mostrando que a mudança para a escala 5x2 pode aumentar os custos para as empresas que já trabalham com a jornada 5x2 e a redução da jornada para 40 horas semanais.", "tecnologia": "As maiores editoras de música acionaram a Anthropic por suposta violação de propriedade intelectual, marcando o início de um conflito que pode durar anos sobre música, inteligência artificial e a proteção da propriedade intelectual em uma nova era tecnológica. A tecnologia de inteligência artificial tem auxiliado os jogos de PC, especialmente desde o lançamento da primeira versão do NVIDIA DLSS em 2019, ao melhorar a performance. No entanto, a indústria enfrenta uma crise de hardware devido à escassez de novidades e ao aumento de preços dos produtos restantes no mercado. Além disso, as casas inteligentes estão se tornando mais acessíveis com a oferta de caixas de som Bluetooth em promoção na Amazon, enquanto a NVIDIA destaca que a nova geração de sistemas de data center está aumentando a eficiência através de um controle de tráfego mais inteligente, em vez de apenas mais ciclos de processamento.", "ciencia": "Um estudo recente da NASA, liderado por Nshan Kazaryan, engenheiro responsável pela comunicação com as sondas espaciais Voyager 1 e 2, tenta prolongar a vida útil dessas naves, que foram lançadas há quase 50 anos. A Voyager 1 e 2 estão atualmente a cerca de 16 e 11 bilhões de quilômetros da Terra, respectivamente, e a equipe da NASA está buscando maneiras de garantir que elas continuem a transmitir informações valiosas sobre o espaço exterior por mais tempo. Em paralelo, a Telescópio Espacial Nancy Grace Roman, nomeado em homenagem à 'Mãe do Hubble', está prestes a ser lançado, prometendo avanços significativos na compreensão do universo. O telescópio dedicará mais de um quarto do seu tempo a observar a bulha do galáxia de Vênus, uma região central estrelada que pode abrigar muitos planetas rochosos pequenos. Além disso, pesquisadores do Instituto Charles de Praga desenvolveram um photocatodo avançado que converte carbono-dioxideno etanol puro usando luz solar, uma tecnologia que resolve problemas de degradação de materiais em água e atinge uma eficiência recorde, potencialmente abrindo caminho para a produção sustentável de combustíveis verdes.", "cultura": "O evento mais importante dos artigos é a morte de Dolly Parton, cantora de renome, aos 80 anos, vitimada por um câncer. O aeroporto de Nashville, onde ela começou sua carreira, pode ser renomeado em sua homenagem. Outro destaque é a Apple TV, que aumentou os valores de suas assinaturas no Brasil: a mensalidade passou de R$ 29,90 para R$ 34,90, e o plano anual de R$ 220 para R$ 279. Na literatura, o autor Steven Rosenbaum revelou que citações em seu livro foram geradas por ferramentas de inteligência artificial, um desenvolvimento que pode transformar os livros escritos por humanos em 'produtos premium'. Além disso, o Museu do Pontal, importante espaço para a arte popular brasileira, comemora seu meio século de fundação em 2026, após superar dificuldades como as frequentes enchentes que acometeram sua antiga sede no Recreio dos Bandeirantes, Rio de Janeiro. O diretor Ridley Scott estreia 'A Guerra dos Últimos', uma produção sobre sobreviventes após uma pandemia devastadora, com 88 anos de idade. Ainda na cultura, a artista americana Laurie Anderson foi escolhida como a 13ª contribuinte para o projeto Future Library em Oslo, com seu manuscrito permanecendo guardado até 2114.", "sociedade": "Um homem foi preso após esfaquear sua companheira na Praça do Bicalho, em Taguatinga, no Distrito Federal, levando-a ao Hospital Regional de Taguatinga em estado grave. Em Guarulhos, São Paulo, quatro indivíduos que se passavam por policiais civis foram detidos pela polícia militar. Eles eram vistos com uniformes da Polícia Civil e uma pistola calibre 380 em um carro furtado. Na cidade de Nova York, jovens estão buscando formas atípicas de se sustentar, como viver com freiras ou dividir casas com idosos, devido a dificuldades econômicas. Em uma comunidade indígena no Distrito Federal, um incêndio atingiu residências, mas não houve feridos. O governo do Nepal solicitou apoio técnico para localizar quase 3 mil desaparecidos, recusando equipes estrangeiras de resgate. Além disso, estima-se que 93,6% das vítimas de violência doméstica no Brasil não estejam registradas oficialmente. A Europa lidera os casos de violência doméstica contra brasileiras no exterior em 2024, com 45% dos registros.", "meio_ambiente": "Um desastre de enxurrada catastrófico na fronteira entre Nepal e Tibet em 26 de agosto resultou em mais de 600 mortes, destruiu casas, estradas e pontes, e deixou milhares de pessoas desaparecidas, incluindo mais de 500 estrangeiros de mais de 30 países, conforme informado pela Autoridade Nepalesa de Gestão e Redução de Riscos de Desastres. O Nepal estima que a reconstrução após as enchentes possa custar até US$ 5 bilhões, com os prejuízos e danos ainda a serem avaliados pelo ministro das Finanças. Paralelamente, a biodiversidade está se integrando na compliance corporativa com o Marco Global da Biodiversidade e o TNFD (Taskforce on Nature-related Financial Disclosures), incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza. Além disso, a Europa enfrenta um inverno com seus estoques de gás em níveis historicamente baixos, com 63% de capacidade no final de agosto, abaixo da média de 80% registrada nos últimos anos, o que pode causar 'pânico de inverno' entre os comerciantes de energia.", "direitos_humanos": "A Procuradoria Federal da República investiga a venda de mercúrio a garimpeiros ilegais na Amazônia através do TikTok. Esta prática se concentra em perfis que usam a plataforma para oferecer o produto de forma ilegal. Em outro caso, o tenente-coronel Geraldo Leite Rosa Neto, acusado do feminicídio da soldado Gisele Alves Santana, teve o habeas corpus negado pelo Superior Tribunal de Justiça (STJ) e permanece detido no presídio militar Romão Gomes, na zona Norte de São Paulo. A UNICEF comemorou a libertação de mulheres e crianças em Kenscoff, Haiti, e apelou por uma proteção mais forte para as crianças naquele país. Em Gaza, Israel, o presidente da Refugees International, Jeremy Konyndyk, criticou as afirmações israelenses sobre a melhora nas estatísticas de malnutrição, afirmando que isso não invalida a declaração de fome do ano anterior. Por fim, palestinos estão presos em suas casas no vilarejo ocupado de Qusra, no West Bank, cercados por setitadores israelenses que incendiaram terras palestinas nas proximidades. Israelenes militares estavam presentes no local, mas não intervieram para liberar os residentes."}, "resumo_do_dia": {"politica_nacional": [{"id": 132098, "titulo": "Flávio Bolsonaro renega ajuste fiscal; direita já pode defender a democracia", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/celso-rocha-de-barros/2026/08/flavio-bolsonaro-renega-ajuste-fiscal-direita-ja-pode-defender-a-democracia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro rejeitou o ajuste fiscal. O texto sugere que a direita pode agora se posicionar em favor da democracia, embora não seja explicitamente afirmado que isso ocorreu.", "titulo_pt": "Flávio Bolsonaro rejeita ajuste fiscal; direita pode defender democracia", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132099, "titulo": "Previsíveis, Lula e Flávio correm atrás do eleitor-pêndulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/previsiveis-lula-e-flavio-correm-atras-do-eleitor-pendulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro mostraram cautela durante suas aparições no horário eleitoral gratuito de rádio e TV. Ambos os candidatos, que são rivais na disputa presidencial, foram consistentes em suas abordagens.", "titulo_pt": "Previstos, Lula e Flávio correm atrás do eleitor-pêndulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132100, "titulo": "Lula exalta Janja e fim da 6x1 em ato de mulheres em MG com protesto de petistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-exalta-janja-e-fim-da-6x1-em-ato-de-mulheres-em-mg-com-protesto-de-petistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula participou de um encontro com mulheres em Belo Horizonte, onde destacou a importância do envolvimento feminino na política e anunciou que pretende aprovar, na próxima semana, o fim da escala de trabalho 6x1.", "titulo_pt": "Lula destaca Janja e fim da 6x1 em encontro com mulheres em MG", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132101, "titulo": "Lula diz id": 132185, "titulo": "Liminar do TSE garante retorno de Garotinho à campanha ao governo do RJ", "url": "https://veja.abril.com.br/politica/liminar-do-tse-garante-retorno-de-garotinho-a-campanha-ao-governo-do-rj/", "fonte_id": "veja", "data_pub": "2026-08-29T14:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A liminar concedida pelo juiz Floriano de Azevedo Marques pelo TSE permitiu o retorno de Anthony Garotinho à campanha para o governo do Rio de Janeiro, incluindo o uso de recursos e horário eleitoral. Garotinho fará uma carreata na Zona Oeste neste sábado.", "titulo_pt": "Liminar permite retorno de Garotinho à campanha no rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132097, "titulo": "Confira a agenda dos presidenciáveis neste fim de semana (29 e 30)", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/confira-agenda-dos-presidenciaveis-neste-fim-de-semana-29-e-30", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-29T13:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidenciáveis têm agenda variada neste fim de semana, incluindo atos políticos, caminhadas, carreatas e encontros com apoiadores. Também estão programadas visitas a locais com problemas de infraestrutura e eventos voltados para diferentes segmentos da população.", "titulo_pt": "Confira a agenda dos presidenciáveis neste fim de semana (29 e 30)", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 132346, "titulo": "Flávio Bolsonaro sobrevive a teste no JN, mas não explica filme nem detalha propostas", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-marianna-holanda/flavio-bolsonaro-sobrevive-a-teste-no-jn-mas-nao-explica-filme-nem-detalha-propostas", "fonte_id": "jota", "data_pub": "2026-08-29T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro manteve-se firme durante o teste na Jornal Nacional, evitando falhas graves, mas nã -29T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Turquia convocou o embaixador ucraniano em resposta aos ataques a navios turcos no Mar Negro. Duas embarcações operadas pela Turquia foram atingidas esta semana devido à guerra entre Rússia e Ucrânia.", "titulo_pt": "Turquia convoca embaixador ucraniano sobre ataques no mar negro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 132517, "titulo": "Israeli settlers attack fourth Qusra home today as residents try to fit protective netting", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-settlers-attack-fourth-qusra-home-today-residents-try-fit", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Settadores israelenses atacaram a quarta casa em construção em Qusra no sábado, enquanto seis residentes palestinos tentavam instalar malha protetora. Os moradores buscavam proteger a casa de ataques intensificados por settadores, que incluíram pedras e materiais incendiários lançados em propriedades palestinas. Soldados israelenses chegaram e dispararam gás lacrimogêneo contra as pessoas dentro da casa, ferindo o proprietário.", "titulo_pt": "Settadores israelenses atacam quarta casa em Qusra enquanto moradores tentam proteger a propriedade", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 132518, "titulo": "Witnesses describe tear gas, stones in Israeli settler attack in Qusra", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/witnesses-describe-tear-gas-stones-israeli-settler-attack-qusra", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos residentes em Qusra relataram um assédio de uma hora, com arremessos de pedras por dezenas de colonos israelenses mascarados, que também dispararam gás lacrimogêneo no interior da casa. O morador Luay Bayruti foi solto, enquanto os colonos não foram detidos.", "titulo_pt": "Testemunhas descrevem gás lacrimogêneo e pedras em ataque de colonos israelenses em Qusra", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 132307, "titulo": "O que faz Cuba depender do exterior para alimentar sua população", "url": "https://www.bbc.com/portuguese/articles/cwyzj4rvv5eo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-29T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apesar de ter potencial agrícola, Cuba importa aproximadamente 80% dos alimentos que consome. Isso destaca a dependência do país em relação ao exterior para suprir sua população com alimentos.", "titulo_pt": "O que faz Cuba depender do exterior para alimentar sua população", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 132350, "titulo": "Pogacar, caída y adiós a la Vuelta a España", "url": "https://elpais.com/deportes/ciclismo/2026-08-29/pogacar-se-cae-a-falta-de-31-kilometros-de-meta-y-abandona-la-vuelta-en-la-octava-etapa.html", "fonte_id": "elpais_america", "data_pub": "2026-08-29T17:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pogacar sofre uma queda ao tentar evitar uma pedra e se retira da Volta a Espanha como líder da classificação geral. O posto de líder é assumido por Enric Mas.", "titulo_pt": "Pogacar, queda e despedida da volta a Espanha", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 132257, "titulo": "Número de mortos em enchentes no Nepal e na China ultrapassa 680", "url": "https://www.cnnbrasil.com.br/internacional/numero-de-mortos-em-enchentes-no-nepal-e-na-china-ultrapassa-680/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos em enchentes no Nepal e na China ultrapassou 680. Cerca de 3.000 pessoas estão desaparecidas nos dois países.", "titulo_pt": "Número d sil", "classe": "A"}, {"id": 132267, "titulo": "Irã reconhece impactos econômicos devido a sanções dos EUA em meio à guerra", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/ira-reconhece-impactos-economicos-devido-a-sancoes-dos-eua-em-meio-a-guerra/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo iraniano reconheceu os impactos econômicos das sanções dos Estados Unidos, afirmando que combater essas pressões é uma de suas principais prioridades. Uma declaração oficial foi emitida pela mídia estatal do país.", "titulo_pt": "Irã reconhece impactos econômicos das sanções dos EUA em meio à guerra", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132304, "titulo": "Após remédios para obesidade, medicamentos contra calvície viram aposta nos EUA", "url": "https://www.infomoney.com.br/mercados/apos-remedios-para-obesidade-medicamentos-contra-calvicie-viram-aposta-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-08-29T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ações da Veradermics Inc., empresa que desenvolve tratamentos para calvície, dispararam quase 500% devido à promessa de medicamentos inovadores. Este aumento ocorre após a onda de sucesso com medicamentos para obesidade nos EUA.", "titulo_pt": "Após remédios para obesidade, medicamentos contra calvície viram aposta nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132305, "titulo": "Reconstrução do Nepal após enchentes pode custar até R$ 26 bi; mortos chegam a 676", "url": "https://www.infomoney.com.br/mundo/mortos-por-enchentes-no-nepal-chegam-a-676-reconstrucao-pode-custar-ate-r-26-bi/", "fonte_id": "infomoney", "data_pub": "2026-08-29T15:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desastre no Nepal foi causado pelo colapso de uma geleira que resultou em uma inundação repentina, destruindo várias cidades. A reconstrução após as enchentes pode custar até R$ 26 bilhões e o número de mortos chegou a 676.", "titulo_pt": "Reconstrução do Nepal após enchentes pode custar até R$ 26 bi; mortos chegam a 676", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132274, "titulo": "H-1B: conheça o visto dos EUA que custa mais de US$ 100 mil", "url": "https://www.cnnbrasil.com.br/internacional/h-1b-conheca-o-visto-dos-eua-que-custa-mais-de-us-100-mil/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O H-1B é um visto dos Estados Unidos usado por empresas para contratar estrangeiros qualificados. Suas taxas podem ultrapassar US$ 100 mil devido a mudanças implementadas pela administração Trump.", "titulo_pt": "H-1B: conheça o visto dos EUA que pode custar mais de US$ 100 mil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132122, "titulo": "O obscuro acordo dos Estados Unidos para garantir um quinto do petróleo da Venezuela", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/o-obscuro-acordo-dos-estados-unidos-para-garantir-um-quinto-do-petroleo-da-venezuela.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T14:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na sexta-feira (28), o presidente dos Estados Unidos anunciou um acordo que deu aos EUA o controle majoritário de mais de 65 bilhões de barris de petróleo bruto venezuelano, equivalente a cerca de um quinto das reservas do país. O anúncio foi descrito como 'o maior acordo petrolífero da história mundial'.", "titulo_pt": "O obscuro acordo dos Estados Unidos para garantir um quinto do petróleo da Venezuela", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 132123, "titulo": "Airbus avalia vender operação espacial nos EUA enquanto foca em produzir satélites na Europa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/airbus-avalia-vender-operacao-espacial-nos-eua-enquanto-foca-em-produzir-satelites-na-europa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T14:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Airbus está avaliando a venda de sua operação espacial nos Estados Unidos enquanto concentra esforços na criação de uma gigante pan-europeia de satélites através da fusão de três empresas.", "titulo_pt": "Airbus avalia vender operação espacial nos EUA e foca em satélites na Europa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 132191, "titulo": "Adeus às canetas emagrecedoras? Calvície é nova mina de ouro de Wall Street", "url": "https://exame.com/invest/mercados/adeus-as-canetas-emagrecedoras-calvicie-e-nova-mina-de-ouro-de-wall-street/", "fonte_id": "exame", "data_pub": "2026-08-29T14:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ações da Veradermics e Absci aumentaram significativamente com a expectativa de que possam lançar os primeiros novos medicamentos para tratar a calvície em cerca de três décadas.", "titulo_pt": "Adeus às canetas emagrecedoras? Calvície se torna nova mina de ouro de Wall Street", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 132284, "titulo": "A mentira dos Watts: como saber se a caixa de som é potente", "url": "https://canaltech.com.br/caixa-de-som/a-mentira-dos-watts-como-saber-se-a-caixa-de-som-e-potente/", "fonte_id": "canaltech", "data_pub": "2026-08-29T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A potência de uma caixa de som não pode ser avaliada apenas pelo número de Watts anunciado, pois o PMPO é usado para enganar o consumidor. É importante considerar a potência RMS, o tamanho dos alto-falantes e outros fatores para uma escolha adequada.", "titulo_pt": "A mentira dos Watts: como saber se a caixa de som é potente", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132606, "titulo": "At TechBBQ, Europe’s AI conversations kept coming back to: Who’s actually in control?", "url": "https://techcrunch.com/2026/08/29/at-techbbq-europes-ai-conversations-kept-coming-back-to-whos-actually-in-control/", "fonte_id": "techcrunch", "data_pub": "2026-08-29T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores, fundadores e operadores europeus participaram da conferência anual Nordic TechBBQ para discutir como os humanos podem ter controle sobre a inteligência artificial.", "titulo_pt": "Na TechBBQ da Europa, conversas sobre IA voltaram constantemente para: quem realmente está no controle?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 132607, "titulo": "“We’re not doing 30 bets a year”: Vijay Pande on betting small after running $4 billion at a16z", "url": "https://techcrunch.com/2026/08/29/were-not-doing-30-bets-a-year-vijay-pande-on-betting-small-after-running-4-billion-at-a16z/", "fonte_id": "techcrunch", "data_pub": "2026-08-29T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vijay Pande, que saiu do amplo portfólio biotecnológico de aproximadamente 4 bilhões de dólares da a16z para criar a menor e AI-native VZVC, discute como a biologia está se transformando de uma ciência de 'descoberta' para uma de 'engenharia', a elevada custo das fases clínicas e a crença de que conjuntos de dados abertos e compartilhados serão cruciais para a transformação da medicina pelo uso de IA.", "titulo_pt": "Nós não fazemos 30 apostas por ano: vijay Pande sobre apostar pequeno após administrar 4 bilhões na a16z", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 132285, "titulo": "Quem é mais forte: Thanos ou Doutor Destino?", "url": "https://canaltech.com.br/entretenimento/quem-e-mais-forte-thanos-ou-doutor-destino/", "fonte_id": "canaltech", "data_pub": "2026-08-29T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Vingadores Ultimato (2019), Thanos enfrentou os heróis com as seis Joias do Infinito e um exército de alienígenas, enquanto em Vingadores: Doutor Destino, o vilão promete um desafio maior. Os dois personagens oferecem propostas distintas e o vencedor de um duelo dependerá do roteiro.", "titulo_pt": "Quem é mais forte: thanos ou Doutor Destino?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132276, "titulo": "Casa inteligente começa pelo som: Echo Dot em oferta na Amazon", "url": "https://olhardigital.com.br/2026/08/29/reviews/casa-inteligente-comeca-pelo-som-echo-dot-em-oferta-na-amazon-3/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo três versões do smart speaker Echo Dot com cores diferentes, todos equipados com Alexa, Wi-Fi e Bluetooth. Essa oferta facilita a transformação da casa em um ambiente conectado.", "titulo_pt": "Casa inteligente começa pelo som: echo Dot em oferta na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 132287, "titulo": "IA pode salvar os games em tempos de crise de hardware; entenda", "url": "https://canaltech.com.br/hardware/ia-pode-salvar-games-em-tempos-de-crise/", "fonte_id": "canaltech", "data_pub": "2026-08-29T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial tem auxiliado os jogos de PC, especialmente desde o lançamento da primeira versão do NVIDIA DLSS em 2019, ao melhorar a performance. No entanto, a indústria enfrenta uma crise de hardware, com escassez de novidades e aumento de preços dos produtos restantes no mercado.", "titulo_pt": "IA pode salvar os jogos em tempos de crise de hardware; entenda", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132277, "titulo": "Som que vai onde você for: seleção de caixas de som Bluetooth em promoção na Amazon", "url": "https://olhardigital.com.br/2026/08/29/reviews/som-que-vai-onde-voce-for-selecao-de-caixas-de-som-bluetooth-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seleção inclui três caixas de som Bluetooth em promoção na Amazon, adequadas para diferentes situações, como festas, relaxamento na praia e uso diário. Cada caixa oferece funcionalidades como iluminação RGB e proteção contra quedas.", "titulo_pt": "Som que vai onde você for: seleção de caixas de som Bluetooth em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 132446, "titulo": "Music publishers sue Anthropic, allege \"blantant theft\" of copyrighted music", "url": "https://www.axios.com/2026/08/29/anthropic-sony-warner-music-copyright", "fonte_id": "axios", "data_pub": "2026-08-29T16:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias das maiores editoras de música do mundo apresentaram uma ação legal contra a Anthropic, acusando a empresa de uma das maiores e mais flagrantes violações de propriedade intelectual de música em história. A ação marca o início de um conflito que pode durar anos sobre a música, inteligência artificial e como a propriedade intelectual será protegida em uma nova era tecnológica.", "titulo_pt": "Editoras de música processam Anthropic por 'umas das maiores e mais flagrantes violações de propriedade intelectual de música em história'", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 132288, "titulo": "Estudo comprova eficiência do ADAS contra acidentes, mas faz alerta", "url": "https://canaltech.com.br/carros/estudo-comprova-eficiencia-do-adas-contra-acidentes-mas-faz-alerta/", "fonte_id": "canaltech", "data_pub": "2026-08-29T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade de Queensland, na Austrália, mostrou que os sistemas de assistência ao motorista (ADAS) são eficazes na redução de acidentes de trânsito, com recursos como sensor de ponto cego, alerta de permanência em faixa e frenagem automática de emergência sendo particularmente eficazes.", "titulo_pt": "Estudo confirma a eficácia do ADAS contra acidentes, mas faz alerta", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132278, "titulo": "Quer melhorar sua experiência nos games? Confira uma seleção de headsets gamer em promoção", "url": "https://olhardigital.com.br/2026/08/29/reviews/quer-melhorar-sua-experiencia-nos-games-confira-uma-selecao-de-headsets-gamer-em-promocao-2/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto apresenta uma seleção de três headsets gamer em oferta na Amazon, recomendados para melhorar a experiência em jogos competitivos e sessões de jogo prolongadas. O primeiro headset mencionado é o JBL Quantum 100M2, mas detalhes específicos sobre os outros dois não foram fornecidos.", "titulo_pt": "Quer melhorar sua experiência nos games? Confira headsets gamer em promoção", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 132620, "titulo": "Noodling on Nuclear Engines", "url": "https://spectrum.ieee.org/bimodal-nuclear-engine", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-29T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1982, Joseph “Rod” Canion e dois colegas da Texas Instruments desenham o protótipo do primeiro PC portátil em um guardanapo durante um jantar em Houston. Em 1996, Felix Zandman, fundador da Vishay Intertechnology, desenha um resistor metálico em um guardanapo durante um jantar em Columbus, Nebraska, que se torna crucial para componentes de gerenciamento de energia em indústria, automóveis e consumidores. O guardanapo de Zandman está agora no Museu Nacional Americano da História do Smithsonian.", "titulo_pt": "Brincando com noodles em Engines nucleares", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 132280, "titulo": "Tempestade solar vai atingir a Terra nas próximas horas", "url": "https://olhardigital.com.br/2026/08/29/ciencia-e-espaco/tempestade-solar-vai-atingir-a-terra-nas-proximas-horas/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma tempestade solar de intensidade moderada está prevista para atingir a Terra nas próximas horas. O fenômeno pode causar alguns problemas na infraestrutura de comunicação global.", "titulo_pt": "Tempestade solar vai atingir a Terra nas próximas horas", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 132281, "titulo": "Dia do Gamer 2026: veja as melhores promoções para aproveitar neste sábado", "url": "https://olhardigital.com.br/2026/08/29/games-e-consoles/dia-do-gamer-2026-melhores-promocoes/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T15:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dia do Gamer 2026 oferece descontos em hardware, acessórios e ingressos para eventos de games. As melhores ofertas estarão disponíveis neste sábado.", "titulo_pt": "Dia do Gamer 2026: veja as melhores promoções para aproveitar neste sábado", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 132282, "titulo": "Quer mais velocidade no seu PC? Confira esta seleção de SSDs em promoção na Amazon", "url": "https://olhardigital.com.br/2026/08/29/reviews/quer-mais-velocidade-no-seu-pc-confira-esta-selecao-de-ssds-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a possibilidade de melhorar a velocidade do PC através da instalação de um SSD. Três opções de SSDs em promoção na Amazon são mencionadas, sendo uma delas o Kingston NV3 1TB.", "titulo_pt": "Quer mais velocidade no seu PC? Confira esta seleção de SSDs em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 132289, "titulo": "Celular proibido nas escolas funcionou? O que mudou após 1 ano", "url": "https://canaltech.com.br/smartphone/celular-proibido-nas-escolas-funcionou-o-que-mudou-apos-1-ano/", "fonte_id": "canaltech", "data_pub": "2026-08-29T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei nº 15.100/2025 que proíbe o uso de celulares nas escolas brasileiras entrou em vigor há um ano, e o Ministério da Educação relata que a maioria das escolas adotou regras para limitar o uso dos aparelhos, notando melhorias na concentração e convivência dos estudantes. No entanto, educadores acreditam que a simples proibição não é suficiente e que orientação adicional é necessária.", "titulo_pt": "Celular proibido nas escolas: o que mudou após 1 ano?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132617, "titulo": "Welcome to Night Vale cocreator Joseph Fink learned storytelling from Grim Fandango", "url": "https://www.theverge.com/entertainment/983448/welcome-to-night-vale-cocreator-joseph-fink-learned-storytelling-from-grim-fandango", "fonte_id": "the_verge", "data_pub": "2026-08-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joseph Fink, co-criador e co-autor de Welcome to Night Vale, um podcast de ficção considerado importante, também criou o podcast noir Unlicensed and Alice Isn't Dead, que explora temas conspiratórios e cósmicos de forma mais séria.", "titulo_pt": "Cocriador de welcome to Night Vale aprendeu narrativa com Grim Fandango", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 132621, "titulo": "How everyday household tasks impact relationships", "url": "https://phys.org/news/2026-08-everyday-household-tasks-impact-relationships.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade de Queensland examinou os impactos das tarefas domésticas no bem-estar das relações casais, considerando os carregamentos físico, cognitivo e emocional associados à administração da casa. O estudo analisou o que é chamado de 'tri-load' doméstico, que inclui tarefas físicas, cognitivas e emocionais.", "titulo_pt": "Como tarefas domésticas diárias afetam as relações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132622, "titulo": "Most people would sacrifice some life satisfaction in exchange for a more equal society", "url": "https://phys.org/news/2026-08-people-sacrifice-life-satisfaction-exchange.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa questiona qual tipo de sociedade as pessoas prefeririam viver, uma igualitária com baixo padrão de vida geral ou uma desigual com maioria prosperando, mas minoria em dificuldades. Ela sugere uma escolha entre sociedades antes do nascimento sem conhecimento do próprio destino.", "titulo_pt": "A maioria sacrificaria algum nível de satisfação pessoal por uma sociedade mais igualitária", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132623, "titulo": "How plastic welds retain a molecular 'memory' of their former surfaces to strengthen pipe joints", "url": "https://phys.org/news/2026-08-plastic-welds-retain-molecular-memory.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A soldagem de plástico é uma parte crucial da engenharia diária, especialmente para evitar vazamentos em tubos subterrâneos de água e gás. A razão pela qual as juntas soldadas de tubos de polietileno podem ser tão fortes quanto o próprio tubo ou até mais forte permanece um mistério por décadas.", "titulo_pt": "Como soldas de plástico mantêm uma 'memória' molecular das superfícies antigas para fortalecer as junções de tubos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132624, "titulo": "A never-before-seen picture of eagle migrations", "url": "https://phys.org/news/2026-08-picture-eagle-migrations.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1899, os cientistas começaram a rastrear a migração de aves colocando anéis identificadores nos tornozelos das aves, mas os percursos entre os pontos de captura permaneciam desconhecidos. Hoje, os rastreadores GPS permitem que os pesquisadores vejam todos os estágios da migração de aves, transformando a migração de uma descrição teórica em um mapa exato. No entanto, muitos caminhos das espécies em suas respectivas rotas de migração ainda não foram descritos.", "titulo_pt": "Imagem inédita da migração de águias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132625, "titulo": "Takeaway cups may be releasing microplastics into your coffee", "url": "https://phys.org/news/2026-08-takeaway-cups-microplastics-coffee.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Queensland descobriram que os copos de papel usados para bebidas de takeout, quando expostos a líquidos quentes, liberam milhões de partículas de microplástico.", "titulo_pt": "Garrafas descartáveis podem liberar microplásticos no seu café", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132645, "titulo": "This Week In Space podcast: Episode 225 — Get a Grip!", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-225-get-a-grip", "fonte_id": "space_com", "data_pub": "2026-08-29T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rod Pyle, Tariq Malik e Adam Kall de KMI discutem como seu trabalho na Estação Espacial Internacional pode fornecer respostas para a mitigação de detritos orbitais.", "titulo_pt": "Este semana no espaço: episódio 225 — pegue um peso!", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132106, "titulo": "Nasa tenta prolongar vida das sondas Voyager, lançadas há quase 50 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/nasa-tenta-prolongar-vida-das-sondas-voyager-lancadas-ha-quase-50-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-29T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nshan Kazaryan, engenheiro da Nasa responsável pela comunicação com as sondas espaciais Voyager 1 e Voyager 2, é mais jovem do que as próprias naves. As sondas foram lançadas há quase 50 anos.", "titulo_pt": "Nasa tenta prolongar vida das sondas Voyager, lançadas há quase 50 anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 132646, "titulo": "When is the next lunar eclipse?", "url": "https://www.space.com/stargazing/lunar-eclipses/when-is-the-next-lunar-eclipse", "fonte_id": "space_com", "data_pub": "2026-08-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A próxima eclipses parcial da lua ocorrerá após o eclipses parcial de agosto de 2026, quando a sombra da Terra cobrirá a lua.", "titulo_pt": "Quando será o próximo eclipses parcial da lua?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132647, "titulo": "On this day in space! Aug. 29, 1965: NASA's Gemini 5 breaks spaceflight duration record after 2 astronauts spent '8 days in a garbage can'", "url": "https://www.space.com/space-exploration/on-this-day-in-space-august-29-2026", "fonte_id": "space_com", "data_pub": "2026-08-29T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 29 de agosto de 1965, dois astronautas da NASA retornaram à Terra após uma missão Gemini 5 que durou oito dias no espaço, estabelecendo um novo recorde de duração de voo espacial.", "titulo_pt": "29 De agosto de 1965: astronautas da Gemini 5 quebram recorde de duração de voo espacial após 8 dias no espaço", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132626, "titulo": "Centuries of child labor left lasting spinal damage in Dutch children, study finds", "url": "https://phys.org/news/2026-08-centuries-child-labor-left-spinal.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T14:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na International Journal of Paleopathology descobriu que crianças na força de trabalho pós-média da Holanda sofreram danos permanentes na coluna vertebral devido ao trabalho intenso, com alguns casos ocorrendo até mesmo antes que as crianças perdessem seus dentes de leite.", "titulo_pt": "Séculos de trabalho infantil causaram danos permanentes na coluna de crianças holandesas, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132648, "titulo": "SpaceX test-fires Starship Super Heavy booster ahead of critical Flight 14 (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-test-fires-starship-super-heavy-booster-ahead-of-key-test-flight", "fonte_id": "space_com", "data_pub": "2026-08-29T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX realizou um teste com todos os 33 motores do Super Heavy booster em preparação para o próximo voo de teste Starship, que será a primeira vez que o veículo atingirá órbita.", "titulo_pt": "Spacex realiza teste com todos os 33 motores do Super Heavy booster em preparação para o voo orbital de teste 14", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132632, "titulo": "Keto diet cut liver fat by 67% in a clinical trial", "url": "https://www.sciencedaily.com/releases/2026/08/260828082327.htm", "fonte_id": "science_daily", "data_pub": "2026-08-29T13:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma dieta ketogenic melhorou significativamente a saúde metabólica em um estudo clínico com pessoas _pub": "2026-08-29T15:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um indivíduo foi preso em La Pintana após um homicídio relacionado a uma disputa territorial com membros da população La Legua. De acordo com a inspectora Paula Salas, da BH Sur, os acusados pertencem a uma banda localmente conhecida.", "titulo_pt": "Pessoa é detida em La Pintana após homicídio associado a disputa territorial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 132204, "titulo": "Nepal pede ajuda técnica para resgatar quase 3 mil desaparecidos", "url": "https://exame.com/mundo/nepal-pede-ajuda-tecnica-para-resgatar-quase-3-mil-desaparecidos/", "fonte_id": "exame", "data_pub": "2026-08-29T11:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo nepalês solicitou apoio técnico especializado para localizar quase 3 mil desaparecidos, mas recusou equipes estrangeiras de resgate.", "titulo_pt": "Nepal pede ajuda técnica para resgatar quase 3 mil desaparecidos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 131708, "titulo": "Por que o Brasil ainda não sabe quantos entregadores se acidentam no trabalho?", "url": "https://www.bbc.com/portuguese/articles/c5y4klql8k9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-29T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil enfrenta dificuldades em medir a quantidade de entregadores que se acidentam no trabalho devido à falta de dados oficiais que permitam confirmar se a pessoa estava trabalhando no momento do acidente.", "titulo_pt": "Por que o Brasil ainda não sabe quantos entregadores se acidentam no trabalho?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 131548, "titulo": "Jovens buscam formas atípicas para se sustentar em Nova York", "url": "https://www.cnnbrasil.com.br/internacional/jovens-buscam-formas-atipicas-de-arcar-com-os-custos-de-vida-em-nova-york/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jovens em Nova York estão buscando formas não convencionais de moradia para reduzir custos, como viver com freiras ou dividir casas com idosos.", "titulo_pt": "Jovens buscam formas atípicas para se sustentar em Nova York", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131634, "titulo": "Europa lidera casos de violência doméstica contra brasileiras no exterior", "url": "https://www.metropoles.com/mundo/europa-lidera-casos-de-violencia-domestica-contra-brasileiras-no-exterior", "fonte_id": "metropoles", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consulados brasileiros registraram 1.631 casos de violência doméstica e de gênero contra brasileiras no exterior em 2024, sendo que a Europa concentra 45% desses casos.", "titulo_pt": "Europa lidera casos de violência doméstica contra brasileiras no exterior", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 131635, "titulo": "Violência doméstica: 93,6% das vítimas estão fora dos registros oficiais", "url": "https://www.metropoles.com/brasil/violencia-domestica-936-das-vitimas-estao-fora-dos-registros-oficiais", "fonte_id": "metropoles", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estima-se que 93,6% das vítimas de violência doméstica não estejam registradas oficialmente. Além disso, três em cada dez brasileiras foram vítimas de violência doméstica ou familiar nos últimos 12 meses.", "titulo_pt": "Violência doméstica: 93,6% das vítimas não estão nos registros oficiais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 131964, "titulo": "What happens if you give everyone $700? A local economy thrives", "url": "https://www.japantimes.co.jp/business/2026/08/29/direct-cash-transfer-experiment/", "fonte_id": "japan_times", "data_pub": "2026-08-29T06:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um experimento em Kamala, no sul de Malawi, está mostrando como a futura assistência poderia funcionar ao fornecer $700 a todos. O resultado tem sido o fortalecimento da economia local.", "titulo_pt": "O que acontece se você der $700 a todo mundo? Uma economia local prospera", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 132214, "titulo": "Temporais deixam ao menos três mortos e causam estragos no Sul", "url": "https://www.metropoles.com/brasil/temporais-deixam-ao-menos-tres-mortos-e-causam-estragos-no-sul", "fonte_id": "metropoles", "data_pub": "2026-08-29T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais intensos causaram três mortes e deixaram estragos nos estados do Rio Grande do Sul e Santa Catarina. Uma frente fria está avançando para o Sudeste.", "titulo_pt": "Temporais deixam três mortos e causam estragos no Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132256, "titulo": "Inmet emite alerta para estados que podem ter “secura de deserto”; veja lista", "url": "https://www.cnnbrasil.com.br/nacional/brasil/inmet-emite-alerta-para-estados-que-podem-ter-secura-de-deserto-veja-lista/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) emitiu um alerta para estados que podem experimentar uma umidade relativa do ar muito baixa, comparável a desertos como o Saara. A umidade pode variar entre 20% e 12%, níveis muito baixos.", "titulo_pt": "Inmet emite alerta para estados com 'secura de deserto'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132168, "titulo": "Marina rebate Flávio Bolsonaro sobre clima: ‘Saneamento é importante, mas não resolve mudança do clima’", "url": "https://veja.abril.com.br/politica/marina-rebate-flavio-bolsonaro-sobre-clima-saneamento-e-importante-mas-nao-resolve-mudanca-do-clima/", "fonte_id": "veja", "data_pub": "2026-08-29T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva rebateu Flávio Bolsonaro ao afirmar que saneamento é importante, mas não resolve a mudança do clima. Durante uma agenda com Haddad em Osasco, ela acusou o candidato do PL de 'negacionista' após uma sabatina no Jornal Nacional.", "titulo_pt": "Marina rebate Flávio Bolsonaro sobre clima: 'saneamento é importante, mas não resolve mudança do clima'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132568, "titulo": "Man held after laundry capsules dumped into pond, killing catfish and injuring turtles", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3365720/man-held-after-laundry-capsules-dumped-pond-killing-catfish-and-injuring-turtles?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 42 anos foi preso após supostamente descartar cápsulas de lavagem em um lago, matando um tilápia e ferindo 30 tartarugas em Ma On Shan, na China. A polícia foi notificada por um vigilante que encontrou grande quantidade de espuma no lago, onde as tartarugas eram mantidas.", "titulo_pt": "Homem preso após descartar cápsulas de lavagem em lago, matando peixe e ferindo tartarugas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 132268, "titulo": "Após enchentes, Nepal estima que reconstrução custará até US$ 5 bilhões", "url": "https://www.cnnbrasil.com.br/internacional/apos-enchentes-nepal-estima-que-reconstrucao-custara-ate-us-5-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nepal estima que a reconstrução após as enchentes possa custar até US$ 5 bilhões. Prejuízos e danos ainda estão sendo avaliados pelo ministro das Finanças.", "titulo_pt": "Após enchentes, Nepal estima que reconstrução custará até US$ 5 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131638, "titulo": "A biodiversidade entrou no compliance", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-biodiversidade-entrou-no-compliance", "fonte_id": "jota", "data_pub": "2026-08-29T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A biodiversidade está se integrando na compliance corporativo com o Marco Global da Biodiversidade e o TNFD (Taskforce on Nature-related Financial Disclosures) incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza.", "titulo_pt": "A biodiversidade entrou no compliance", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131761, "titulo": "Plug-in solar panels could save households up to $370 a year – if Australia made them legal as in the UK", "url": "https://www.theguardian.com/environment/2026/aug/29/plug-in-solar-panels-could-save-households-370-a-year-and-experts-say-australia-should-copy-the-uk-in-legalising-them", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instalação de kits solares plugáveis, que custam aproximadamente $1.000, pode pagar-se em três anos, de acordo com um especialista. Uma organização de advocacy sugere que a legalização desses kits no Australia, como no Reino Unido, poderia economizar até $370 por ano nas contas de energia dos australianos e ajudar no combate às mudanças climáticas.", "titulo_pt": "Kit solar plugável poderia economizar até $370 por ano para os australianos se a austrália legalizasse como no reino unido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132004, "titulo": "US families hold out hope for relatives lost in Nepal floods", "url": "https://www.scmp.com/news/asia/south-asia/article/3365688/us-families-hold-out-hope-relatives-lost-nepal-floods?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T05:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mukti Patel está reunida com familiares e amigos em sua casa em Richmond, Virginia, desde que seu pai, irmã e outras duas relações desapareceram nas cheias catastróficas perto da fronteira entre Nepal e China. Ela ainda não fala em passado, pois não há informações sobre o paradeiro deles.", "titulo_pt": "Famílias americanas mantêm esperança por parentes desaparecidos nas cheias no Nepal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131765, "titulo": "‘Winter panic’: EU gas stores at their lowest level in 13 years", "url": "https://www.theguardian.com/business/2026/aug/29/european-gas-stores-lowest-13-years-eu-price", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa está prestes a entrar no inverno com seus estoques de gás em níveis historicamente baixos, com 63% de capacidade no final de agosto, abaixo da média de 80% registrada nos últimos anos. Especialistas advertiram que essa situação pode causar 'pânico de inverno' entre os comerciantes de energia.", "titulo_pt": "Pânico de inverno: estoques de gás da Europa estão nos níveis mais baixos em 13 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132038, "titulo": "Flood devastation", "url": "https://www.koreaherald.com/article/10856068", "fonte_id": "korea_herald", "data_pub": "2026-08-29T03:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre de enxurrada catastrófica atingiu a região Himalayense da fronteira entre Nepal e Tibet em 26 de agosto, causando mais de 600 mortes, destruindo casas, estradas e pontes, e deixando milhares de pessoas desaparecidas, incluindo mais de 500 estrangeiros de mais de 30 países.", "titulo_pt": "Desastre de enxurrada", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 1317 os, econômicos, humanitários e científicos são inúmeros. Politicamente, o incidente reforça a narrativa de negligência da Rússia e pode levar a sanções ainda mais severas. Economicamente, a destruição de instalações importantes pode afetar a produção e a logística de armas. Humanitariamente, a perda de vidas e a destruição de infraestrutura afetaram diretamente a população local. Cientificamente, o incidente levanta questões sobre a segurança de armas e a eficácia dos sistemas de armazenamento de munições. Além disso, a guerra continua a ter implicações globais, com efeitos na economia mundial e na segurança global.", "data_edicao": "2026-08-29", "artigos": [{"id": 132423, "titulo": "Al menos 38 fallecidos deja ataque ruso contra un almacén cerca de Kiev", "url": "https://www.latercera.com/mundo/noticia/al-menos-38-fallecidos-deja-ataque-ruso-contra-un-almacen-cerca-de-kiev/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T17:29:00Z", "topico": "politica_internacional", "idioma": "es", "texto_resumo": "Um ataque russo causou ao menos 38 mortes em um almirante perto de Kiev. O bombardeio atingiu uma instalação em Myla que, de acordo com a Procuradoria ucraniana, possuía materiais explosivos, agravando os danos.", "titulo_pt": "Pelo menos 38 mortos em ataque russo contra um almirante perto de Kiev", "texto_pt": "Um ataque russo causou ao menos 38 mortes em um almirante perto de Kiev. O bombardeio atingiu uma instalação em Myla que, de acordo com a Procuradoria ucraniana, possuía materiais explosivos, agravando os danos.", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 132494, "titulo": "Russian strike on a munitions depot triggers deadly blasts near Kyiv", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/29/29-08-sv-russia-strikes-arms-depot-kyiv-fm?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-29T16:53:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "Um ataque russo a um depósito de armas perto de Kyiv function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}
