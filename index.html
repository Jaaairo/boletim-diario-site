ue ameaçou deputado e familiares é preso", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256902, "titulo": "PF realiza operação contra investigados por crimes sexuais no DF", "url": "https://veja.abril.com.br/brasil/pf-realiza-operacao-contra-investigados-por-crimes-sexuais-no-df/", "fonte_id": "veja", "data_pub": "2026-11-11T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação no Distrito Federal contra pessoas investigadas por crimes sexuais, cumprindo três mandados de busca e apreensão e um de prisão preventiva.", "titulo_pt": "PF realiza operação contra investigados por crimes sexuais no DF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 257031, "titulo": "Espanha tem primeira greve geral em 14 anos em meio à crise habitacional e à campanha eleitoral", "url": "https://www.dw.com/pt-br/espanha-tem-primeira-greve-geral-em-14-anos-em-meio-à-crise-habitacional-e-à-campanha-eleitoral/a-79922900?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Espanha enfrenta sua primeira greve geral em 14 anos, com protestos que cobram moradia acessível, controle dos aluguéis e melhores salários. Os protestos ocorrem a 18 dias das eleições e pressionam tanto o governo quanto a oposição.", "titulo_pt": "Espanha tem primeira greve geral em 14 anos em meio à crise habitacional e à campanha eleitoral", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 256979, "titulo": "RJ: pais espancam e torturam filho de 10 anos e o mantêm preso por 14 dias", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/rj-pais-espancam-e-torturam-filho-de-10-anos-e-o-mantem-preso-por-14-dias", "fonte_id": "metropoles", "data_pub": "2026-11-11T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pais espancaram e torturaram um filho de 10 anos e o mantiveram preso por 14 dias. Os suspeitos foram presos em flagrante pela PCERJ após uma professora notar machucados no corpo do menino.", "titulo_pt": "RJ: pais espancam e torturam filho de 10 anos e o mantêm preso por 14 dias", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257004, "titulo": "Policiais tocavam “empresa” com drogas tabeladas dentro do CDP de Guarulhos", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/policiais-tocavam-empresa-com-drogas-tabeladas-dentro-do-cdp-de-guarulhos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais investigados manejavam uma atividade como negócio dentro do Centro de Detenção Provisória (CDP) de Guarulhos, envolvendo a venda de drogas, bebida alcoólica e celulares com preços fixos. Os envolvidos tratavam a atividade como uma empresa, com clientes definidos.", "titulo_pt": "Policiais investigados manejavam 'empresa' com drogas tabeladas dentro do CDP de Guarulhos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256912, "titulo": "Polícia Civil investiga morte com spray de pimenta após abordagem da PM em Minas Gerais", "url": "https://veja.abril.com.br/brasil/policia-civil-investiga-morte-com-spray-de-pimenta-apos-abordagem-da-pm-em-minas-gerais/", "fonte_id": "veja", "data_pub": "2026-11-11T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil está investigando uma morte relacionada ao uso de spray de pimenta após uma abordagem realizada pela Polícia Militar em Minas Gerais. Um vídeo mostra um policial aplicando spray de pimenta no porta-malas de um veículo enquanto um homem grita por socorro.", "titulo_pt": "Polícia Civil investiga morte com spray de pimenta após abordagem da PM em Minas Gerais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 257040, "titulo": "Um bilhão de refeições no lixo todo dia: como evitar desperdício de alimentos em casa?", "url": "https://www.bbc.com/portuguese/articles/cmpdgd74g0l9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-11T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas afirmam que reduzir o desperdício de alimentos é uma das ações climáticas mais concretas que podemos adotar individualmente. Todo dia, um bilhão de refeições são jogadas no lixo.", "titulo_pt": "Um bilhão de refeições no lixo todo dia: como evitar desperdício de alimentos em casa?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 257167, "titulo": "Quiénes son los líderes tras la paralización de los camioneros que terminó marginando a los históricos dirigentes", "url": "https://www.latercera.com/nacional/noticia/quienes-son-los-lideres-tras-la-paralizacion-de-los-camioneros-que-termino-marginando-a-los-historicos-dirigentes/", "fonte_id": "la_tercera", "data_pub": "2026-11-11T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A mobilização dos camioneros durante a paralização evidenciou um profundo desacordo entre os transportistas e seus líderes tradicionais. Nomes até então desconhecidos emergiram como líderes locais durante esta paralização.", "titulo_pt": "Quem são os líderes após a paralização dos camioneros que marginalizou os históricos dirigentes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 257440, "titulo": "‘It’s just too expensive’: Housing and wages at the heart of Spain’s strike", "url": "https://www.aljazeera.com/news/2026/11/11/its-just-too-expensive-housing-and-wages-at-the-heart-of-spains-strike?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas saíram às ruas em várias cidades espanholas em um grande paročo geral após 14 anos. O protesto focou-se nas questões de habitação e salários.", "titulo_pt": "É simplesmente muito caro: habitação e salários no centro da greve geral em Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 257417, "titulo": "Measles is surging in the U.S. — and outbreaks can cost millions", "url": "https://www.cnbc.com/2026/11/11/measles-outbreak-us-economic-cost.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-11T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo ferramenta desenvolvida por pesquisadores do Johns Hopkins estimou que a erupção de sarampo nos Estados Unidos em 2025 causou um custo econômico superior a 37 milhões de dólares.", "titulo_pt": "Sarampo está aumentando nos EUA — e surtos podem custar milhões", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 257219, "titulo": "First Covid lockdowns, then alcohol to your door: rise in young Victorians with liver diseases prompts fears", "url": "https://www.theguardian.com/australia-news/2026/nov/12/first-covid-lockdowns-then-alcohol-to-your-door-rise-in-young-victorians-with-liver-diseases-prompts-fears", "fonte_id": "guardian_world", "data_pub": "2026-11-11T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rising numbers of jovens vitorianos estão sendo hospitalizados com doenças hepáticas graves e irreversíveis, mesmo com uma diminuição geral no consumo de álcool entre os jovens. As admissões hospitalares relacionadas ao álcool permanecem acima dos níveis pré-pandemia após atingirem picos durante os lockdowns devido à Covid.", "titulo_pt": "Primeiras lockdowns de Covid, depois álcool entregue em domicílio: crescente de jovens vitorianos com doenças hepáticas preocupa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 257226, "titulo": "Why are fewer Black Americans getting GLP-1s?", "url": "https://www.vox.com/videos/510358/why-are-fewer-black-americans-getting-glp-1s", "fonte_id": "vox", "data_pub": "2026-11-11T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de GLP-1s, medicamentos que inicialmente foram desenvolvidos para tratar diabetes tipo 2, tem se tornado uma tendência de status entre celebridades, mas há uma diminuição no uso desses medicamentos entre os americanos negros.", "titulo_pt": "Por que menos americanos negros estão usando GLP-1s?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 256982, "titulo": "Brasil extremo: seca atinge 59% do país e alagamentos, 49,5% dos municípios", "url": "https://www.metropoles.com/brasil/brasil-extremo-seca-atinge-59-do-pais-e-alagamentos-495-dos-municipios", "fonte_id": "metropoles", "data_pub": "2026-11-11T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa do IBGE mostra que 59% do Brasil está sob seca e 49,5% dos municípios enfrentam alagamentos. O relatório destaca o acentuado cenário climático extremo no país.", "titulo_pt": "Brasil extremo: seca atinge 59% do país e alagamentos, 49,5% dos municípios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256792, "titulo": "Setores de aço e cimento vão receber R$ 81 milhões para reduzir emissão de CO2", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/setores-de-aco-e-cimento-vao-receber-r-81-milhoes-para-reduzir-emissao-de-co2.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embrapii e a agência alemã GIZ lançaram uma chamada de financiamento no valor de R$ 81 milhões para projetos de pesquisa e desenvolvimento voltados à redução das emissões de CO2 na cadeia industrial do aço e do cimento no Brasil.", "titulo_pt": "Setores de aço e cimento vão receber R$ 81 milhões para reduzir emissão de CO2", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256923, "titulo": "Após clima de inverno, temporais voltam ao Centro-Sul; veja previsão", "url": "https://exame.com/brasil/apos-clima-de-inverno-temporais-voltam-ao-centro-sul-veja-previsao/", "fonte_id": "exame", "data_pub": "2026-11-11T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As massas de ar polar se afastam e as temperaturas começam a subir. Entre quarta e quinta-feira, áreas do Centro-Sul do país podem enfrentar chuva forte, granizo e ventos de até 80 km/h.", "titulo_pt": "Depois do inverno, temporais voltam ao Centro-Sul; confira a previsão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 257034, "titulo": "Brasil salta em ranking de proteção climática após queda do desmatamento na Amazônia", "url": "https://www.dw.com/pt-br/brasil-salta-em-ranking-de-proteção-climática-após-queda-do-desmatamento-na-amazônia/a-79919030?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil melhorou seu ranking de proteção climática devido à redução do desmatamento na Amazônia e ao aumento da utilização de energias renováveis. No entanto, a expansão do petróleo e gás e as emissões de gases de efeito estufa de setores poluentes continuam sendo obstáculos para um avanço maior.", "titulo_pt": "Brasil avança no ranking de proteção climática após queda do desmatamento na Amazônia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257400, "titulo": "Storm Charles: Heavy rain and strong winds batter Portugal", "url": "https://www.euronews.com/video/2026/11/11/storm-charles-heavy-rain-and-strong-winds-batter-portugal", "fonte_id": "euronews", "data_pub": "2026-11-11T13:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fortes chuvas e ventos fortes atingiram a Costa da Caparica em Portugal, fechando instalações costeiras e deixando as ruas alagadas.", "titulo_pt": "Tempo severo: chuvas intensas e ventos fortes castigam a costa da caparica, Portugal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 257456, "titulo": "‘Climate crisis is outrunning us,’ UN chief Guterres says at COP31", "url": "https://www.aljazeera.com/news/2026/11/11/climate-crisis-is-outrunning-us-un-chief-guterres-says-at-cop31?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T12:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da ONU, Guterres, afirma que a crise climática está avançando mais rápido do que as ações tomadas para enfrentá-la, acusando o lobby dos combustíveis fósseis de atrasar as ações críticas em negociações importantes.", "titulo_pt": "Crise climática está avançando mais rápido do que as ações tomadas, diz Guterres em COP31", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 257486, "titulo": "Japan, eight others get fossil award over leaders skipping climate talks", "url": "https://www.japantimes.co.jp/news/2026/11/11/japan/climate-talks-fossil-award/", "fonte_id": "japan_times", "data_pub": "2026-11-11T11:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão e oito outros países receberam um prêmio por líderes que não compareceram às negociações climáticas. Entre os países do G7, apenas o Primeiro Ministro do Reino Unido, Andy Burnham, está programado para participar do evento.", "titulo_pt": "Japão e outros nove países recebem prêmio por líderes que evitam conferências climáticas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 256082, "titulo": "Vinho de patauá contaminado provoca surto de Chagas e deixa 1 morto no Pará", "url": "https://www.metropoles.com/brasil/vinho-de-pataua-contaminado-provoca-surto-de-chagas-e-deixa-1-morto-no-para", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um surto de doença de Chagas foi causado por vinho de patauá contaminado em um município do Pará, com oito casos confirmados e 27 pessoas monitoradas. Até o momento, uma morte foi registrada.", "titulo_pt": "Vinho de patauá contaminado causa surto de Chagas e deixa uma morte no Pará", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256123, "titulo": "Começa Cúpula de Líderes na COP31; Lula vai discursar", "url": "https://www.cnnbrasil.com.br/internacional/cupula-lideres-cop31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados de aproximadamente 200 países estão se reunindo na cidade turística de Antália, na Turquia, para a COP31. As emissões de gases de efeito estufa globais não mostram sinais significativos de diminuição e outras crises, como guerras e inflação, estão competindo pela atenção política.", "titulo_pt": "Começa Cúpula de Líderes na COP31; Lula vai discursar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256558, "titulo": "World leaders begin UN climate talks amid concerns action on global warming too slow", "url": "https://www.scmp.com/news/world/africa/article/3374065/world-leaders-begin-un-climate-talks-amid-concerns-action-global-warming-too-slow", "fonte_id": "scmp", "data_pub": "2026-11-11T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes mundiais começaram a chegar para iniciar discussões formais na conferência das Nações Unidas sobre mudanças climáticas em Turquia, buscando acordar ações concretas para frear o aquecimento global após um ano de desastres climáticos, como inundações e ondas de calor. No entanto, o que será alcançado na conferência de 11 dias, chamada Cop31, ainda é incerto.", "titulo_pt": "Líderes mundiais iniciam discussões climáticas das nações unidas com temores de que ação sobre o aquecimento global seja lenta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 256085, "titulo": "Clima: pancadas de chuva, temporais isolados e rajadas de vento marcam a 4ª", "url": "https://www.metropoles.com/brasil/clima-pancadas-de-chuva-temporais-isolados-e-rajadas-de-vento-marcam-a-4a", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pancadas de chuva, temporais isolados e rajadas de vento marcam a quarta-feira. A combinação de calor, umidade elevada e sistemas meteorológicos favorecem a formação de nuvens carregadas.", "titulo_pt": "Pancadas de chuva, temporais isolados e rajadas de vento marcam a 4ª", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256129, "titulo": "Brasil apresenta controles ambientais para manter exportações à Europa", "url": "https://www.cnnbrasil.com.br/agro/brasil-apresenta-controles-ambientais-para-manter-exportacoes-a-europa/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo e entidades do setor agrícola apresentaram ferramentas de rastreabilidade e dados sobre propriedades rurais aos autoridades e compradores europeus para demonstrar que a produção brasileira pode atender às novas exigências ambientais do bloco europeu.", "titulo_pt": "Brasil apresenta controles ambientais para manter exportações à Europa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256710, "titulo": "Analysis: Climate-finance pledges fall 70% as countries meet at COP31", "url": "https://www.carbonbrief.org/analysis-climate-finance-pledges-fall-70-as-countries-meet-at-cop31", "fonte_id": "carbon_brief", "data_pub": "2026-11-11T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O montante de financiamento público prometido para ajudar os países em desenvolvimento a enfrentar o clima caiu mais de 70% durante a COP31. Essa é a análise apresentada pelo Carbon Brief.", "titulo_pt": "Análise: promessas de financiamento climático caem 70% durante COP31", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 256053, "titulo": "COP31 caminha para ser a maior da história; Brasil tem a 2ª maior delegação", "url": "https://exame.com/esg/cop31-caminha-para-ser-a-maior-da-historia-brasil-tem-a-2a-maior-delegacao/", "fonte_id": "exame", "data_pub": "2026-11-11T06:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 está progredindo com a participação de uma das maiores delegações do Brasil, embora a lista de chefes de Estado das grandes economias seja curta e os Estados Unidos não estejam presentes.", "titulo_pt": "COP31 caminha para ser a maior da história; Brasil tem a 2ª maior delegação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 256056, "titulo": "Quem ficou de fora da COP31? Os líderes que deixaram o clima em segundo plano", "url": "https://exame.com/esg/quem-ficou-de-fora-da-cop31-os-lideres-que-deixaram-o-clima-em-segundo-plano/", "fonte_id": "exame", "data_pub": "2026-11-11T06:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os chefes de governo das sete maiores economias desenvolvidas, com exceção do primeiro-ministro britânico, não participaram da Cúpula dos Líderes, que visava avançar em acordos climáticos.", "titulo_pt": "Quem ficou de fora da COP31? Os líderes que deixaram o clima em segundo plano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 256058, "titulo": "Cúpula de Líderes marca terceiro dia da COP31 com florestas no foco e caos na chegada", "url": "https://exame.com/esg/cupula-de-lideres-marca-terceiro-dia-da-cop31-com-florestas-no-foco-e-caos-na-chegada/", "fonte_id": "exame", "data_pub": "2026-11-11T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cúpula de líderes na COP31 em Antália, com 102 participantes esperados, enfrentou problemas de trânsito, restrições de acesso e longas filas devido ao reforço da segurança. O ex-presidente Lula discursou tanto na abertura quanto no segmento de alto nível.", "titulo_pt": "Cúpula de Líderes marca terceiro dia da COP31 com florestas no foco e caos na chegada", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 256898, "titulo": "Família de cacique Raoni pede suspensão de documentário na COP31", "url": "https://veja.abril.com.br/mundo/familia-de-cacique-raoni-pede-suspensao-de-documentario-na-cop31/", "fonte_id": "veja", "data_pub": "2026-11-11T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças indígenas, incluindo o cacique Raoni, pediram a suspensão do documentário na COP31, alegando falta de autorização para a estreia. Eles argumentam que não foram consultados ou informados sobre o filme.", "titulo_pt": "Família de cacique Raoni pede suspensão de documentário na COP31", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 257399, "titulo": "Trinidad and Tobago highest court overturns gay sex ban", "url": "https://www.euronews.com/2026/11/11/trinidad-and-tobago-highest-court-overturns-gay-sex-ban", "fonte_id": "euronews", "data_pub": "2026-11-11T16:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal supremo da ilha de Trinidad e Tobago anulou uma lei de 1986 que proibia relações sexuais entre adultos do mesmo sexo consentidas.", "titulo_pt": "Tribunal supremo de trinidad e Tobago anula lei que proibia relações homossexuais", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 257217, "titulo": "Killing of journalist underscores deteriorating conditions in Ecuador", "url": "https://www.theguardian.com/world/2026/nov/11/ecuador-journalist-killing", "fonte_id": "guardian_world", "data_pub": "2026-11-11T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jornalista Tomás Beltrán foi morto a tiros durante uma guerra entre gangues em Ecuador. Este conflito relacionado ao tráfico de drogas transformou o país, uma vez considerado um dos mais seguros da América Latina, em um dos mais violentos.", "titulo_pt": "Morte de jornalista ilustra a deterioração das condições em Ecuador", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 257035, "titulo": "Corte britânica descriminaliza sexo gay em Trinidad e Tobago", "url": "https://www.dw.com/pt-br/corte-britânica-descriminaliza-sexo-gay-em-trinidad-e-tobago/a-79916807?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T13:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem de 61 anos teve sucesso após uma década de luta judicial. A última instância de apelação, que decidiu descriminalizar o sexo gay em Trinidad e Tobago, está localizada em Londres, refletindo o legado colonial.", "titulo_pt": "Corte britânica descriminaliza sexo gay em Trinidad e Tobago", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257458, "titulo": "African rights body raises alarm over treatment of Niger’s Mahamid Arabs", "url": "https://www.aljazeera.com/news/2026/11/11/african-rights-body-raises-alarm-over-treatment-of-nigers-mahamid-arabs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T12:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma comissão de direitos humanos pediu ao presidente da Nigéria que interceda sobre supostas violações cometidas contra os Mahamid, um grupo árabe na Nigéria.", "titulo_pt": "Organização de direitos humanos alerta para abusos contra os Mahamid, na nigéria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 256315, "titulo": "Ed Miliband says national security of all countries at risk from climate crisis", "url": "https://www.theguardian.com/environment/2026/nov/11/ed-miliband-national-security-climate-crisis-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-11T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado britânico para Assuntos Exteriores, Ed Miliband, alertará líderes mundiais na COP31 que a crise climática representa uma ameaça à segurança nacional de todos os países, com cenári function renderSecao(topico) {

function toggleDrill(id) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {

    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()

  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);

  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }

    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`

  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
