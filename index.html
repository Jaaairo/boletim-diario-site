<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "06/11/2026 07:33", "stats": {"noticias_novas": 619, "resumos_gerados": 239}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-presidente Jair Bolsonaro e seu filho, o senador Flávio Bolsonaro, continuam no centro das atenções. Durante uma live, Bolsonaro chamou Flávio de 'pé-frio'. O presidente Lula também fez comentários sobre o senador. No Congresso, Arthur Lira é visto como o favorito para assumir a presidência da CCJ do Senado, independentemente do próximo presidente do Senado. Segundo o Eurasia Group, o governo Lula não planeja cortes de gastos e pretende criar o Ministério da Segurança Pública por meio de uma Medida Provisória. A privatização do Banco do Brasil está em discussão, e o Tribunal Superior Eleitoral (TSE) abriu uma ação contra a chapa Lula-Alckmin por uso indevido da máquina pública. Além disso, a alíquota de 11,3% do imposto é aplicada, e a política nacional de informação e saúde digital foi aprovada. O ministro André Mendonça autorizou a prisão domiciliar de Maurício Camisotti, investigado por fraudes no INSS.", "mundo": "As eleições intermediárias nos Estados Unidos resultaram em uma vitória democrata, o que pode ter implicações significativas para a política global. A China aprovou uma nova lei antidesvios de conduta que visa combater a corrupção internacional, fornecendo ferramentas amplas para perseguir ativos ilícitos no exterior e impedir esforços estrangeiros de investigação em território chinês. No Japão, o governo Takaichi anunciou um novo pacote de defesa cibernética de emergência, focado em fortalecer a cooperação entre setor privado e público e na formação de equipes de especialistas. Em contraste, o presidente francês propôs uma aliança ampla entre socialistas, centrões e conservadores para as eleições presidenciais, mas os candidatos presidenciais demonstraram pouca entusiasmo com a ideia. Além disso, o dirigente japonês Kozo Tashima está concorrendo à presidência da FIFA, tornando-se o primeiro candidato japonês a buscar esse cargo.\n\nA Europa está em alerta após uma série de ameaças de bomba falsas feitas contra voos comerciais, afetando pelo menos 27 voos em diferentes países europeus. As ameaças, que mencionam um grupo extremista russo, levaram a uma intensificação das buscas e direcionamentos de aeronaves. Em outro desenvolvimento, um juiz dos Estados Unidos ordenou uma pausa de 14 dias na construção do chamado 'Arc de Trump' em Washington, DC. O ex-Primeiro-Ministro de Malásia, Najib Razak, foi transferido para prisão domiciliar após seu partido arrecadar fundos para pagar uma multa de R$ 12 milhões. Na Ásia, a União Europeia enfrenta dificuldades na ampliação de sua influência na Ásia do Sul devido à escassez de fundos, enquanto a China continua a expandir sua presença econômica e política, como na expropriação de ativos da Japan Tobacco por Putin. A tensão entre Estados Unidos e Irã aumenta, com Bob McNally prevendo que o petróleo ultrapasse os $100. Em Israel, colonos israelenses tomaram 8 casas palestinas em Jerusalém Oriental, deslocando dezenas de pessoas, enquanto Gaza utiliza panelas danificadas para criar barreiras costeiras para enfrentar inundações.", "economia": "As bolsas de valores enfrentaram turbulências significativas, com o índice Nasdaq caindo 6,4% em uma sessão caótica, após a vitória dos democratas nas eleições médias nos Estados Unidos. Isso levou a uma forte queda no uso de inteligência artificial. O Dow Jones Futuro também recuou devido às expectativas sobre o relatório de emprego (payroll). O governo brasileiro está tentando implementar ajustes fiscais, focando em cortes de privilégios e revisão de benefícios, em resposta a pressões de juros e do mercado. O presidente, Lula, ajustou o tom, defendendo a responsabilidade fiscal, após a vitória nas eleições. O Banco of England aumentou as taxas de juros pela primeira vez desde 2023, em resposta à pressão inflacionária persistente devido aos altos preços da energia, alertando para a possibilidade de mais aumentos no futuro. O ministro das Finanças do Brasil prometeu ações rápidas para aliviar a volatilidade do mercado de ações, enquanto o Banco de Desenvolvimento da Ásia (KDB) implementou um circuit breaker para o índice KOSPI devido a uma queda abrupta nos mercados.", "tecnologia": "O governo do Japão anunciou uma série de medidas emergenciais para combater recentes vazamentos de dados pessoais causados por acesso não autorizado. Entre as ações, estão o uso de inteligência artificial para identificar vulnerabilidades em sistemas computacionais e a formação de equipes especializadas. Essas medidas foram discutidas em uma reunião entre a primeira-ministra Sanae Takaichi e ministros relevantes. Ao mesmo tempo, a vitória dos democratas nos Estados Unidos nas eleições de meios mandatos levou a preocupações sobre a possível desaceleração na indústria de inteligência artificial, com ações asiáticas e europeias caindo drasticamente. A Nvidia concluiu o pagamento de 1 bilhão de dólares e adquiriu mais de 4% de participação na Naver. As ações das principais empresas de semicondutores sul-coreanas, como a Samsung e a SK hynix, caíram cerca de 10% durante a sessão de negociação de sexta-feira, fazendo com que o índice Kospi caísse abaixo dos 5.000 pontos, refletindo a queda nas ações de tecnologia americanas. A Chery, empresa chinesa, vai lançar um táxi robótico de nível 4 de automação através da marca Omoda para mercados globais. A empresa Doosan Group anunciou que investirá aproximadamente 550 bilhões de wons para expandir a capacidade de produção de CCL (Copper Clad Laminate) na China, devido ao aumento da demanda por inteligência artificial. Além disso, a Global Stock Exchange espera um aumento de 36% nas entregas de servidores de IA globais.", "ciencia": "Foi desenvolvido um novo métrico para quantificar o risco associado a projetos de remoção de carbono, permitindo comparações entre diferentes esquemas independentemente da tecnologia utilizada. Além disso, pesquisas geológicas revelaram elevações inesperadamente rápidas em zonas de falhas na Sicília e Calábria, no sul da Itália, o que pode melhorar a avaliação dos perigos de terremotos na região sísmica ativa. Um grupo internacional de cientistas propôs que as novas gerações de modelos de inteligência artificial poderiam revolucionar nossa compreensão de ecossistemas e auxiliar na previsão de suas respostas ao aquecimento global. Outras pesquisas destacaram a necessidade de adaptação à globalização do aquecimento superior a 1,5°C, além de investigações sobre a deforestação na Austrália e a eficiência do uso de nitrogênio pelos microrganismos em florestas e campos. Estudos também abordaram a questão do câncer, explorando novos tratamentos que permitem destruir o câncer sem cirurgias mutilantes, bem como a exploração lunar por um robô chamado GIMLI, que será usado para explorar uma caverna lunar em preparação para a futura base lunar da NASA.", "cultura": "O Papa Leão XIV está prestes a realizar uma visita histórica à América Latina, começando pelo Peru, onde será recebido com entusiasmo, mesmo após uma recente cirurgia. Em Uruguai e Argentina, a visita pode servir como um meio de diálogo entre as diferentes facções da Igreja Católica. No Brasil, o Festival de Cinema de Mar del Plata já está em andamento, com mais de 40 sessões esgotadas. Em São Paulo, o personagem Gato da Cartola retorna à telona em forma de animação, após 23 anos desde seu live-action polêmico. No âmbito cultural, a 34ª edição do Festival MixBrasil de Cultura e Diversidade ocorre de 11 a 22 de novembro, com 138 filmes de 30 países, explorando histórias queer de diferentes épocas e locais. Além disso, o Folha Gourmet Festival, que inicia no sábado (7) no Parque Villa-Lobos, promete oferecer uma amostra da gastronomia paulistana, com 20 bares e restaurantes premiados participantes, além de shows e espaços para churrasco, vinho e cerveja.", "sociedade": "Os não-religiosos superaram os evangélicos brancos em 10 pontos percentuais no eleitorado das eleições de 2026, contra apenas 1 ponto percentual em 2024, indicando uma mudança significativa na dinâmica política americana. Em outra notícia, a morte de uma família durante um terremoto na Coreia do Sul levou a ações judiciais contra o governo e o proprietário do prédio. A PAHO (Organização Pan-Americana da Saúde) alertou para a necessidade de integrar a saúde na agenda política da América Latina. Na área social, a mortalidade infantil no Brasil diminuiu, mas especialistas destacam as disparidades regionais. A senadora Damares Alves esteve presente no velório de uma menina morta por seu padrasto no Distrito Federal, prestando apoio aos familiares. Um estudo com universitários revelou que o medo de errar tem crescido mais rapidamente do que a ambição, associando esse fenômeno à situação econômica atual.", "meio_ambiente": "Em outubro de 2026, a cidade de São Paulo registrou o segundo outubro mais chuvoso desde 1995, com 220,3 mm de precipitação, 96,7% acima da média esperada. O mês teve 26 dias com chuva, o que dificultou a implantação de culturas como milho e girassol na Província de Buenos Aires, especialmente na parte sul e ocidental, onde as chuvas exageradas, as baixas temperaturas e a falta de sol dificultaram a cultura dessas plantações. Em seguida, a notícia destaca a intensificação do fenômeno El Niño, que está em desenvolvimento rápido e deve atingir seu pico em dezembro, com potencial para afetar significativamente as temperaturas globais. A Indonésia aumentou suas metas climáticas, apesar das intensas queimadas que contradizem essa estratégia, enquanto a Coreia do Sul pode enfrentar um inverno mais quente e úmido devido ao El Niño mais forte registrado. Além disso, a China registrou uma queda de 3,1% nas emissões de dióxido de carbono no terceiro trimestre de 2026, o maior decréscimo desde a pandemia de COVID-19.", "direitos_humanos": "Joshua Wong, um ativista pró-democracia de Hong Kong, foi condenado a 10 anos de prisão em um novo julgamento sob a Lei de Segurança Nacional, que os críticos alegam ser usada para suprimir a oposição política. Esta sentença, a segunda contra Wong, ocorre em um contexto global onde ataques a sistemas de água estão aumentando em conflitos, com um relatório registrando um aumento de 300% nos ataques. Isso prejudicou trabalhadores e crianças em 23 países. Além disso, a Coreia do Norte criticou a Comissão dos Direitos Humanos da ONU e pediu ao EUA para se manter fora de assuntos internos nacionais. Yoani Sánchez, jornalista cubana vencedora de prêmios, foi detida pela Segurança Estatal Cubana em Havana."}, "resumo_do_dia": {"politica_nacional": [{"id": 247525, "titulo": "Juíza barra “Arco do Triunfo” de Trump menos de uma hora após aprovação", "url": "https://www.cnnbrasil.com.br/internacional/juiza-barra-arco-do-triunfo-de-trump-menos-de-uma-hora-apos-aprovacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T09:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma juíza impôs uma barreira judicial ao projeto de construção do 'Arco do Triunfo' de Trump em Washington menos de uma hora após a aprovação. A Casa Branca tenta concluir a estrutura gigante para garantir o legado presidencial nos dois últimos anos de mandato.", "titulo_pt": "Juíza barrar 'Arco do Triunfo' de Trump menos de uma hora após aprovação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 247421, "titulo": "Flávio abandona Comissão de Segurança do Senado, que deve ser herdada por Mourão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/flavio-abandona-comissao-de-seguranca-do-senado-que-deve-ser-herdada-por-mourao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Hamilton Mourão (Republicanos-RS) assumirá a presidência da Comissão de Segurança Pública do Senado, substituindo Flávio Bolsonaro (PL-RJ), que deixou o país.", "titulo_pt": "Mourão assume Comissão de Segurança após flávio bolsonaro deixar o país", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 247468, "titulo": "Briga pelo Congresso promete incendiar mais uma vez o embate entre governo e oposição", "url": "https://veja.abril.com.br/politica/briga-pelo-congresso-promete-incendiar-mais-uma-vez-o-embate-entre-governo-e-oposicao/", "fonte_id": "veja", "data_pub": "2026-11-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após a eleição presidencial, a disputa pelo controle do Congresso Nacional intensificará o conflito entre governo e oposição.", "titulo_pt": "Briga pelo Congresso promete incendiar mais uma vez o embate entre governo e oposição", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 247531, "titulo": "Orplana defende flexibilização da jornada no setor sucroenergético", "url": "https://www.cnnbrasil.com.br/agro/orplana-defende-flexibilizacao-da-jornada-no-setor-sucroenergetico/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Orplana defende a flexibilização da jornada de trabalho no setor sucroenergético, citando a automação e a provavel_duplicata_de": null, "texto_pt": "O texto argumenta que exigir autocrítica pública não é uma forma de moralismo, mas sim uma estratégia intencional para enfraquecer um oponente político.", "titulo_pt": "A armadilha da autocrítica: por que todos os partidos devem ser capazes de confessar seus erros?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247422, "titulo": "Debate sobre 2º turno no RJ mantém atuação do STF na política estadual por um ano", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/debate-sobre-2o-turno-no-rj-mantem-atuacao-do-stf-na-politica-estadual-por-um-ano.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação judicial proposta pelo PSD está mantendo a intervenção do STF na política do Rio de Janeiro, prolongando a atuação do tribunal na eleição para o governo do estado por aproximadamente um ano.", "titulo_pt": "Debate sobre segundo turno no RJ mantém atuação do STF na política estadual por um ano", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 247423, "titulo": "Marinho viajará o país e aposta em pressão de bolsonaristas por votos para presidência do Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/marinho-viajara-o-pais-e-aposta-em-pressao-de-bolsonaristas-por-votos-para-presidencia-do-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Rogério Marinho, do PL-RN, planeja viajar pelo país para mobilizar a base bolsonarista em favor de sua candidatura à presidência do Senado. Sua intenção é garantir o voto dos congressistas de direita.", "titulo_pt": "Marinho viajará pelo país e aposta em pressão de bolsonaristas por votos para presidência do Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 247424, "titulo": "Omissões de Kassio Nunes expõem falhas e limites do Judiciário", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/11/omissoes-de-kassio-nunes-expoem-falhas-e-limites-do-judiciario.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca ocasionalidades na decisão do juiz Kassio Nunes, apontando falhas e limites no sistema judiciário. O título traduzido seria: 'Omissões de Kassio Nunes ilustram falhas e limites do Judiciário.'", "titulo_pt": "Omissões de Kassio Nunes ilustram falhas e limites do Judiciário", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 247428, "titulo": "BRB discute corte de cerca de 15% dos funcionários em PDV, e privatização volta ao radar pós-eleição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/brb-discute-corte-de-cerca-de-15-dos-funcionarios-em-pdv-e-privatizacao-volta-ao-radar-pos-eleicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco de Brasília (BRB) está considerando cortar cerca de 15% de seus funcionários devido a crises relacionadas com o Banco Master. A possibilidade de privatização da instituição foi reavivada após a reeleição da governadora Celina Leão (PP) no Distrito Federal.", "titulo_pt": "BRB considera corte de funcionários e privatização volta ao radar após reeleição", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247644, "titulo": "Alíquota de 11,3%: a conta das exceções chegou, e quem paga é o IBS", "url": "https://www.jota.info/opiniao-e-analise/artigos/aliquota-de-113-a-conta-das-excecoes-chegou-e-quem-paga-e-o-ibs", "fonte_id": "jota", "data_pub": "2026-11-06T06:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alíquota de 11,3% do imposto é aplicada, utilizando a margem de tolerância da carga tributária sobre os contribuintes. O índice não ultrapassa a cota permitida por nenhuma esfera de governo.", "titulo_pt": "Alíquota de 11,3%: a conta das exceções chegou, e quem paga é o contribuinte", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 247645, "titulo": "Precatórios e CNJ: entre organizar o mercado e legislar sobre ele", "url": "https://www.jota.info/opiniao-e-analise/artigos/precatorios-e-cnj-entre-organizar-o-mercado-e-legislar-sobre-ele", "fonte_id": "jota", "data_pub": "2026-11-06T05:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a relação entre precatórios e o Conselho Nacional de Justiça (CNJ), focando na organização do mercado e na legislação relacionada. Todo direito creditório decorre de uma lesão causada pelo Estado, reconhecida pelo Judiciário.", "titulo_pt": "Precatórios e CNJ: entre organizar o mercado e legislar sobre ele", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 247648, "titulo": "Brasil aprova sua política nacional de informação e saúde digital", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fernando-aith/brasil-aprova-sua-politica-nacional-de-informacao-e-saude-digital", "fonte_id": "jota", "data_pub": "2026-11-06T03:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A política nacional de informação e saúde digital foi aprovada pelo Brasil com a publicação da Portaria 12.301/2026, que orienta a transformação digital no país.", "titulo_pt": "Brasil aprova sua política nacional de informação e saúde digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 247425, "titulo": "Bancada bolsonarista vê maioridade penal de 14 anos como irreal e aceita redução para 16", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/bancada-bolsonarista-ve-maioridade-penal-de-14-anos-como-irreal-e-aceita-reducao-para-16.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bancada bolsonarista no Congresso Nacional aceita aprovar a redução da maioridade penal para 16 anos, mesmo defendendo oficialmente que seja de 14 anos para crimes hediondos. Embora prefira a maioridade penal com 14 anos, os parlamentares aceitam a proposta de 16 anos em discussão.", "titulo_pt": "Bancada bolsonarista aceita redução da maioridade penal para 16 anos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 247435, "titulo": "Imposto Seletivo agrada setores e adia debate sobre tributação 'do pecado'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/imposto-seletivo-agrada-setores-e-adia-debate-sobre-tributacao-do-pecado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A medida provisória que define as alíquotas do Imposto Seletivo para 2027 foi bem recebida pelos setores afetados, que conseguiram manter a carga tributária atual, equivalente à tributação pelo IPI. O acordo foi fechado com o Ministério da Fazenda e adia o debate sobre a tributação 'do pecado'.", "titulo_pt": "Imposto Seletivo agrada setores e adia debate sobre tributação 'do pecado'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 247685, "titulo": "European skies on high alert after hoax bomb threats this week – Europe live", "url": "https://www.theguardian.com/world/live/2026/nov/06/high-alert-hoax-bomb-threats-france-air-lingus-belgium-pope-leo-europe-live", "fonte_id": "guardian_world", "data_pub": "2026-11-06T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hoaxes de ameaças de bomba foram feitas contra voos comerciais na Europa esta semana, levando a pelo menos 35 aeronaves a serem pesquisadas ou direcionadas. A polícia de Copenhague está presente no aeroporto devido a novas ameaças, mas afirma que não há perigo para os passageiros.", "titulo_pt": "Europa em alerta após ameaças falsas de bomba a voos comerciais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 247484, "titulo": "Grupo extremista russo é citado em ameaças de bombas em voos na Europa", "url": "https://www.metropoles.com/mundo/grupo-extremista-russo-e-citado-em-ameacas-de-bombas-em-voos-na-europa", "fonte_id": "metropoles", "data_pub": "2026-11-06T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 27 voos em diferentes países europeus foram afetados por falsos alertas de bombas. As mensagens mencionam um grupo extremista russo.", "titulo_pt": "Grupos extremistas russos são citados em falsos alertas de bombas em voos na Europa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247729, "titulo": "2027 French elections: Macron's broad coalition idea fails to gain traction, even among his own successors", "url": "https://www.lemonde.fr/en/politics/article/2026/11/06/2027-french-elections-macron-s-broad-coalition-idea-fails-to-gain-traction-even-among-his-own-successors_6773362_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma entrevista, o presidente francês propôs que socialistas, centrões e conservadores se unam em uma aliança ampla para as eleições presidenciais. No entanto, os candidatos presidenciais, inclusive herdeiros políticos do próprio presidente, demonstraram pouca entusiasmo com a ideia.", "titulo_pt": "Eleições francesas de 2027: ideia de aliança ampla de macron não atrai apoio, nem mesmo entre seus sucessores", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 247523, "titulo": "Ataque russo a ponto de ajuda na Ucrânia deixa 53 mortos, diz governador", "url": "https://www.cnnbrasil.com.br/internacional/ataque-russo-a-ponto-de-ajuda-na-ucrania-deixa-53-mortos-diz-governador/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T09:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque russo a um ponto de ajuda na Ucrânia causou 53 mortos, conforme informou o governador local. Ofensivas contra a infraestrutura energética resultaram em novos apagões, especialmente na região de Kiev.", "titulo_pt": "Ataque russo a ponto de ajuda na Ucrânia deixa 53 mortos, diz governador", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 247733, "titulo": "China's Macau jails ex-lawmaker in first national security trial", "url": "https://www.lemonde.fr/en/international/article/2026/11/06/china-s-macau-jails-ex-lawmaker-in-first-national-security-trial_6773296_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Au Kam San, 69 anos, foi condenado pela primeira vez sob leis de segurança nacional ampliadas em 2023 em Macau, uma ex-colônia portuguesa e hub de cassinos que voltou para a China em 1999.", "titulo_pt": "China condena ex-deputado em Macau na primeira audiência de segurança nacional", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 247811, "titulo": "Takaichi administration announces emergency cyberdefense package", "url": "https://www.japantimes.co.jp/news/2026/11/06/japan/takaichi-cybersecurity-package/", "fonte_id": "japan_times", "data_pub": "2026-11-06T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Takaichi anuncia uma nova pacote de defesa cibernética de emergência, focando em fortalecer a cooperação entre setor privado e público e na formação de equipes de especialistas.", "titulo_pt": "Administração takaichi anuncia pacote emergencial de defesa cibernética", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 247752, "titulo": "Judge blocks construction of Trump's massive 'triumphal arch'", "url": "https://www.euronews.com/2026/11/06/judge-blocks-construction-of-trumps-massive-triumphal-arch", "fonte_id": "euronews", "data_pub": "2026-11-06T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz impediu a construção de um grande arco triunfal proposto por Trump. Trump afirmou que o local seria transformado em um complexo militar de alta qualidade, abrigando drones, snipers e munição.", "titulo_pt": "Juiz bloqueia construção do grande arco triunfal de Trump", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 247764, "titulo": "Court grants ex-Malaysian PM Najib house arrest after $12m royal pardon", "url": "https://www.aljazeera.com/news/2026/11/6/courts-grant-ex-malaysian-pm-najib-house-arrest-after-12m-royal-pardon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-Primeiro-Ministro de Malásia Najib Razak foi transferido para prisão domiciliar após seu partido UMNO arrecadar R$ 18,1 milhões para pagar uma multa de R$ 12 milhões por meio de uma campanha de financiamento coletivo.", "titulo_pt": "Corte concede prisão domiciliar ao ex-pm Najib após multa de r$ 12 milhões ser paga por campanha de financiamento coletivo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 247880, "titulo": "Nat'l Assembly passes special counsel bill on alleged fabricated indictments", "url": "https://en.yna.co.kr/view/AEN20261106010200315", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Parlamento sul-coreano aprovou uma proposta de lei sobre supostos indiciamentos fictícios. A aprovação foi liderada pelo partido de governo, o Partido Democrático.", "titulo_pt": "Parlamento aprova lei sobre supostos indiciamentos fictícios", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247815, "titulo": "Okinawa Policy Council meeting held for first time in 13 years", "url": "https://www.japantimes.co.jp/news/2026/11/06/japan/politics/okinawa-policy-council-meeting/", "fonte_id": "japan_times", "data_pub": "2026-11-06T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira reunião do Conselho de Política de Okinawa ocorreu após 13 anos, em resposta a uma solicitação do governador Genta Koja, eleito em setembro.", "titulo_pt": "Reunião do conselho de política de okinawa realizada após 13 anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 247818, "titulo": "Kozo Tashima looking to bring ‘integrity’ to FIFA with run for president", "url": "https://www.japantimes.co.jp/sports/2026/11/06/soccer/kozo-tashima-fifa-integrity/", "fonte_id": "japan_times", "data_pub": "2026-11-06T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kozo Tashima, com 68 anos, está prestes a se candidatar à presidência da FIFA, tornando-se o primeiro candidato japonês a buscar esse cargo.", "titulo_pt": "Kozo Tashima se candidata à presidência da FIFA, sendo o primeiro do Japão a fazê-lo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 247885, "titulo": "(profile) Veteran tax investigator named new head of S. Korea's tax agency", "url": "https://en.yna.co.kr/view/AEN20261106010400320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ahn Duk-su foi escolhido para liderar a Agência Nacional de Impostos da Coreia do Sul. A nomeação ocorreu em 6 de novembro em Seul.", "titulo_pt": "Veterano de investigação fiscal nomeado novo chefe da agência de impostos da Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247886, "titulo": "(LEAD) Arms review committee approves plan for nuclear-powered submarine project", "url": "https://en.yna.co.kr/view/AEN20261106007751315", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um comitê de revisão do estado do setor de armas aprovou um plano para um projeto de submarino nuclear. A notícia foi divulgada em Seul, em 6 de novembro.", "titulo_pt": "Comitê de revisão de armas aprova plano para projeto de submarino nuclear", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247769, "titulo": "US judge halts construction of Trump’s triumphal arch in Washington, DC", "url": "https://www.aljazeera.com/news/2026/11/6/us-judge-halts-construction-of-trumps-triumphal-arch-in-washington-dc?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz dos Estados Unidos ordenou uma pausa de 14 dias que bloqueia o projeto do chamado 'Arc de Trump' em Washington, DC.", "titulo_pt": "Juiz suspende construção do arco de Trump em Washington, DC", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 247770, "titulo": "Lebanese pack bags and stock up amid fears of new Israeli escalation", "url": "https://www.aljazeera.com/news/2026/11/6/lebanese-pack-bags-and-stock-up-amid-fears-of-new-israeli-escalation?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lebaneses que passaram por duas escaladas israelenses estão se preparando, enchendo sacolas e malas, caso ocorra uma terceira escalada.", "titulo_pt": "Lebaneses empacotam e se preparam em face do temor de nova escalada israelense", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 247771, "titulo": "How Israel is tightening its grip on Palestinian schools in East Jerusalem", "url": "https://www.aljazeera.com/features/2026/11/6/how-israel-is-tightening-its-grip-on-palestinian-schools-in-east-jerusalem?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T07:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As restrições israelenses aos professores e a pressão para adotar o currículo israelense ameaçam a educação palestiniana na cidade de Jerusalém Oriental.", "titulo_pt": "Como Israel está apertando o controle sobre as escolas palestinas em jerusalém oriental", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 247519, "titulo": "Dow Jones Futuro cai à espera do payroll; Nikkei despenca 6% no Japão", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-cai-a-espera-do-payroll-nikkei-despenca-6-no-japao/", "fonte_id": "infomoney", "data_pub": "2026-11-06T08:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dow Jones Futuro caiu devido à expectativa do relatório de emprego (payroll) e o Nikkei caiu 6% no Japão.", "titulo_pt": "Dow Jones Futuro cai à espera do payroll; Nikkei despenca 6% no Japão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 247804, "titulo": "Wall Street AI sell-off spreads to Asia and Europe", "url": "https://www.ft.com/content/642b32dc-e3a1-4df8-ae91-5c84bdeb89e0", "fonte_id": "financial_times", "data_pub": "2026-11-06T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de empresas de tecnologia caíram nos Estados Unidos devido a preocupações sobre a economia, levando a uma queda em mercados asiáticos e europeus. Donald Trump atribuiu a queda nos mercados à ação dos investidores.", "titulo_pt": "Venda de AI na wall Street se espalha para ásia e Europa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 247888, "titulo": "(2nd LD) Seoul stocks crash for 2nd day on AI rout after U.S. midterms", "url": "https://en.yna.co.kr/view/AEN20261106007852320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Seul caíram pela segunda sessão consecutiva devido à venda generalizada de ações de empresas relacionadas à inteligência artificial após os resultados dos midterms nos Estados Unidos.", "titulo_pt": "Seoul stocks caem pela segunda sessão consecutiva após midterms e onda de vendas de ações de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247496, "titulo": "Pressionado por juros e mercado, governo tenta construir ajuste fiscal", "url": "https://www.metropoles.com/brasil/pressionado-por-juros-e-mercado-governo-tenta-construir-ajuste-fiscal", "fonte_id": "metropoles", "data_pub": "2026-11-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo está tentando implementar ajustes fiscais, focando em cortes de privilégios e revisão de benefícios. Essas medidas fazem parte de um esforço para reorganizar os gastos públicos diante de pressões de juros e do mercado.", "titulo_pt": "Governo busca ajuste fiscal pressionado por juros e mercado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247497, "titulo": "Em aceno ao mercado, Lula ajusta o tom e defende responsabilidade fiscal", "url": "https://www.metropoles.com/brasil/em-aceno-ao-mercado-lula-ajusta-o-tom-e-defende-responsabilidade-fiscal", "fonte_id": "metropoles", "data_pub": "2026-11-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado reagiu negativamente à vitória de Lula nas eleições e tem registrado índices negativos desde o resultado do segundo turno. O presidente eleito ajustou o tom, defendendo a responsabilidade fiscal.", "titulo_pt": "Em sinal ao mercado, Lula ajusta o tom e defende responsabilidade fiscal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247643, "titulo": "Reforma Tributária e Lei de TICs", "url": "https://www.jota.info/opiniao-e-analise/colunas/women-in-tax-brazil/reforma-tributaria-e-lei-de-tics", "fonte_id": "jota", "data_pub": "2026-11-06T07:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A integração do IBS (Imposto sobre Bens e Serviços) e do CBS (Crédito de Imposto sobre Bens e Serviços) está sendo discutida no contexto da Reforma Tributária, com a possível inclusão na Lei de TICs (Tributação de Intermediação de Crédito).", "titulo_pt": "Ibs e cbs devem integrar cálculo do crédito financeiro?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 247890, "titulo": "(LEAD) LIG D&A shifts to red in Q3 on facility expansion costs", "url": "https://en.yna.co.kr/view/AEN20261106010000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de defesa LIG D&A registrou lucros negativos no terceiro trimestre devido aos custos associados à expansão de suas instalações.", "titulo_pt": "LIG D&A registra prejuízo no terceiro trimestre devido A custos de expansão de instalações", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247429, "titulo": "Leilão do Banco Master tem disputa acirrada por cadeiras de luxo; veja os itens mais cobiçados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/leilao-do-banco-master-tem-disputa-acirrada-por-cadeiras-de-luxo-veja-os-itens-mais-cobicados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há uma disputa acirrada no leilão online de móveis de escritório do Banco Master e do Will Bank, que ocorrerá em 9 de junho, com destaque para as cadeiras da Herman Miller, conhecidas por seu design inovador e durabilidade no mercado corporativo.", "titulo_pt": "Leilão do Banco Master tem disputa intensa por cadeiras de luxo; veja os itens mais cobiçados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247430, "titulo": "Comissão do Senado aprova projeto que facilita conserto de celular, TV e geladeira; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/comissao-do-senado-aprova-projeto-que-facilita-conserto-de-celular-tv-e-geladeira-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei que proíbe a obsolescência programada e regulamenta o direito ao reparo foi aprovado pela Comissão de Fiscalização e Controle do Senado. A proposta agora segue para análise da Câmara dos Deputados.", "titulo_pt": "Comissão do Senado aprova projeto que combate obsolescência programada e facilita conserto de produtos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247431, "titulo": "Resultados de gigantes do Japão divergem no 3º tri, com disparada de lucro na Sony e queda na Nintendo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/resultados-de-gigantes-do-japao-divergem-no-3o-tri-com-disparada-de-lucro-na-sony-e-queda-na-nintendo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sony registrou um aumento de 45% no lucro operacional do segundo trimestre, superando as expectativas do mercado, enquanto a Nintendo teve uma queda nos lucros que não atingiu as expectativas dos investidores.", "titulo_pt": "Resultados divergentes de gigantes japoneses: lucro da Sony explode e queda na Nintendo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247433, "titulo": "Santander é condenado a ressarcir idoso com Alzheimer que perdeu R$ 344 mil na Bolsa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/santander-e-condenado-a-ressarcir-idoso-com-alzheimer-que-perdeu-r-344-mil-na-bolsa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Santander foi condenado a indenizar um idoso de 80 anos, com Alzheimer, que perdeu cerca de R$ 344 mil em investimentos de alto risco incompatíveis com seu perfil de investidor.", "titulo_pt": "Santander condenado a ressarcir idoso com Alzheimer que perdeu R$ 344 mil na Bolsa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247806, "titulo": "The sell-off gets deep", "url": "https://www.ft.com/content/4ea585dd-6532-4839-a042-c9d1ad2e23f7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A venda de ações está se intensificando, mas não está afetando todos os setores ainda. As informações indicam que há uma tendência de desvalorização, mas ela ainda não é generalizada.", "titulo_pt": "A venda se intensifica, mas não é generalizada", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 247760, "titulo": "India as an AI hedge? The country's stocks could see robust inflows as markets globally tank", "url": "https://www.cnbc.com/2026/11/06/india-ai-tech-hedge-nifty50.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-06T06:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos últimos meses, as ações da Índia, representadas pelo índice Nifty 50, ganharam quase 9%, enquanto mercados com exposição pesada em IA, incluindo EUA, Japão, Coreia do Sul e Taiwan, perderam valor significativamente.", "titulo_pt": "Índia como hedge de IA? Ações do país podem atrair fluxos robustos enquanto mercados globais caem", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 247646, "titulo": "O direito de que a inovação precisa", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-direito-de-que-a-inovacao-precisa", "fonte_id": "jota", "data_pub": "2026-11-06T05:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O direito deve ser capaz de planejar, estruturar e ajustar caminhos adequados para a inovação.", "titulo_pt": "O direito e a inovação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 247647, "titulo": "Precatório em dia: o primeiro teste de credibilidade de 2027", "url": "https://www.jota.info/opiniao-e-analise/artigos/precatorio-em-dia-o-primeiro-teste-de-credibilidade-de-2027", "fonte_id": "jota", "data_pub": "2026-11-06T05:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O orçamento do primeiro ano do novo ciclo é esperado para trazer previsibilidade e a disposição de cumprir decisões do Supremo Tribunal Federal.", "titulo_pt": "Precatório em dia: o primeiro teste de credibilidade de 2027", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 247808, "titulo": "Don’t bet on a ‘blue wave’ changing the economy", "url": "https://www.ft.com/content/880c8ba8-2967-4d7a-87fb-d34135c676d8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Não se deve apostar em uma 'onda azul' alterar a economia. Um mudança na composição do Congresso terá pouco impacto na formulação de políticas no resto do mandato de Trump.", "titulo_pt": "Não aposte em uma 'onda azul' mudar a economia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 247856, "titulo": "Japan deploys AI, specialist teams to counter cyberattack wave", "url": "https://www.scmp.com/news/asia/east-asia/article/3373555/japan-deploys-ai-specialist-teams-counter-cyberattack-wave", "fonte_id": "scmp", "data_pub": "2026-11-06T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Japão anunciou uma série de medidas emergenciais para combater uma série recente de vazamentos de dados pessoais causados por acesso não autorizado, incluindo o uso de inteligência artificial para identificar vulnerabilidades em sistemas computacionais e a formação de equipes especializadas de alta habilidade. Essas medidas foram discutidas em uma reunião entre a primeira-ministra Sanae Takaichi e ministros relevantes.", "titulo_pt": "Japão implementa medidas emergenciais e AI para combater onda de ataques cibernéticos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 247607, "titulo": "El imperio digital que amenaza a Hollywood", "url": "https://www.lanacion.com.ar/economia/negocios/el-imperio-digital-que-amenaza-a-hollywood-nid06112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T09:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Com uma audiência e um catálogo que crescem constantemente, o YouTube se tornou o principal jogador do entretenimento global.", "titulo_pt": "O império digital do youtube que ameaça o Hollywood", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 247462, "titulo": "IA ao volante: Uber quer 2 mil carros sem motorista em 2027", "url": "https://veja.abril.com.br/coluna/planeta-ia/ia-ao-volante-uber-quer-2-mil-carros-sem-motorista-em-2027/", "fonte_id": "veja", "data_pub": "2026-11-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Uber planeja ter cerca de 2 mil carros sem motorista nas ruas ao redor do mundo até 2027, quase triplicando sua frota de robotáxis. O Brasil faz parte desse plano.", "titulo_pt": "IA ao volante: uber quer 2 mil carros sem motorista em 2027", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 247680, "titulo": "Global stocks plunge amid AI slowdown fears after Democrats’ midterm triumph", "url": "https://www.theguardian.com/business/2026/nov/06/global-stocks-plunge-amid-ai-slowdown-fears-after-democrats-midterm-triumph", "fonte_id": "guardian_world", "data_pub": "2026-11-06T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações asiáticas e europeias caíram drasticamente após a vitória dos democratas nas eleições de meios mandatos nos Estados Unidos, levando a um temor de uma possível desaceleração na indústria de inteligência artificial. O índice FTSE 100 em Londres caiu 1,5% no início da sessão, refletindo a queda nas ações de tecnologia americanas.", "titulo_pt": "Ações globais despencam após vitória democrata nas eleições de meios mandatos e temores de desaceleração na IA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 247906, "titulo": "Democrats constrain Trump as scarce AI capacity benefits CSPs", "url": "https://www.digitimes.com/news/a20261106PD243/capacity-industrial-policy-technology-expansion.html", "fonte_id": "digitimes", "data_pub": "2026-11-06T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas venceram as eleições parlamentares nos Estados Unidos, alterando o panorama global da tecnologia e das indústrias. Vitórias em importantes eleições para governadores, como em Texas e Geórgia, levantaram preocupações sobre a expansão da infraestrutura de IA, já que alguns candidatos vencedores explicitamente prometeram pausar o desenvolvimento de centros de dados.", "titulo_pt": "Democratas restringem Trump enquanto escassa capacidade de IA beneficia provedores de serviços", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 247530, "titulo": "Chery vai lançar Robotaxi nível 4 vendido pela Omoda em mercados globais", "url": "https://www.cnnbrasil.com.br/auto/chery-vai-lancar-robotaxi-nivel-4-vendido-pela-omoda-em-mercados-globais/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Chery, empresa chinesa, vai lançar um táxi robótico de nível 4 de automação através da marca Omoda para mercados globais. O veículo é projetado para transporte de passageiros sem motorista.", "titulo_pt": "Chery vai lançar Robotaxi nível 4 vendido pela Omoda em mercados globais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 247817, "titulo": "Binance hack funds flow to Chinese launderers, Chainalysis says", "url": "https://www.japantimes.co.jp/business/2026/11/06/tech/binance-hack-funds-china/", "fonte_id": "japan_times", "data_pub": "2026-11-06T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Chainalysis informou que os hackers estão transferindo ativos roubados por meio de milhares de carteiras digitais e várias blockchains para obscurecer sua origem. Os fundos roubados estão sendo encaminhados para lavadores de dinheiro chineses.", "titulo_pt": "Fundo roubado da binance flui para lavadores de dinheiro chineses, diz Chainalysis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 247931, "titulo": "Samyang Foods on track to hit W3tr in revenue as Buldak fires up US, China growth", "url": "https://www.koreaherald.com/article/10928875", "fonte_id": "korea_herald", "data_pub": "2026-11-06T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samyang Foods registrou um lucro operacional recorde no terceiro trimestre, aumentando quase 50% em comparação com o mesmo período do ano anterior devido ao bom desempenho da marca Buldak nos Estados Unidos e na China. A empresa está próxima de atingir 3 trilhões de wones ($2,2 bilhões) em receita anual.", "titulo_pt": "Samyang Foods se dirige a 3 trilhões de wones em receita com crescimento de Buldak nos EUA e China", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 247887, "titulo": "Nvidia finalizes payment of US$1 bln, acquires over 4 pct stake in Naver", "url": "https://en.yna.co.kr/view/AEN20261106010300320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia concluiu o pagamento de 1 bilhão de dólares e adquiriu mais de 4% de participação na Naver. O evento ocorreu em Seul, Coreia do Sul, em 6 de novembro.", "titulo_pt": "Nvidia finaliza pagamento de 1 bi e adquire mais de 4% na Naver", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247773, "titulo": "Global tech stocks plunge over fears of AI curbs in US", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/6/global-tech-stocks-plunge-over-fears-of-ai-curbs-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas asiáticas caíram nesta sexta-feira, seguindo a queda nas bolsas ocidentais após as eleições legislativas dos Estados Unidos.", "titulo_pt": "Ações de tecnologia globais caem com medo de restrições à IA nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 247889, "titulo": "(LEAD)(News Focus) KOSPI pummeled by AI investment fears, briefly dips below 5,000", "url": "https://en.yna.co.kr/view/AEN20261106004451320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice de referência da Bolsa de Seul, KOSPI, sofreu uma queda devido às preocupações com a investimento em IA, atingindo temporariamente um nível abaixo dos 5.000 pontos.", "titulo_pt": "KOSPI atinge nível abaixo de 5.000 pontos devido às preocupações com investimento em IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247805, "titulo": "Is the AI stock bubble finally bursting?", "url": "https://www.ft.com/content/e185d576-c4a6-4fb0-aa03-deda69c900c8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T07:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há sinais claros de que o mercado está vivendo uma situação insustentável, relacionada à bolha de investimento em inteligência artificial. Os sintomas desse mercado exagerado podem ser observados por qualquer pessoa razoável.", "titulo_pt": "A bolha de ações de IA está finalmente se rompendo?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 247892, "titulo": "Unionized members at Samsung Biologics stage another partial strike", "url": "https://en.yna.co.kr/view/AEN20261106009800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores sindicalizados na Samsung Biologics realizaram mais uma paralisação parcial. O evento ocorreu em Seul, Coreia do Sul, no dia 6 de novembro.", "titulo_pt": "Trabalhadores sindicalizados na Samsung Biologics realizam nova paralisação parcial", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247434, "titulo": "Reação da população contra a IA ameaça boom trilionário de data centers, dizem líderes de tecnologia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/reacao-da-populacao-contra-a-ia-ameaca-boom-trilionario-de-data-centers-dizem-lideres-de-tecnologia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes de tecnologia acreditam que a crescente desaprovação em relação ao desenvolvimento da inteligência artificial pode impedir a expansão significativa de data centers, considerada a mais cara expansão de infraestrutura na história.", "titulo_pt": "Reação da população contra a IA ameaça boom trilionário de data centers, dizem líderes de tecnologia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247894, "titulo": "Court suspends 201.1 bln-won fine imposed on Coupang for unauthorized user data collection", "url": "https://en.yna.co.kr/view/AEN20261106008000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um : "phys_org", "data_pub": "2026-11-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A geóloga Becky Dorsey da Universidade do Oregon realizou pesquisas que revelam elevações inesperadamente rápidas em zonas de falhas na Sicília e Calábria, na Itália sul. Esses dados podem melhorar a avaliação dos perigos de terremotos na região sísmica ativa.", "titulo_pt": "Terreiras de elevação alta sugerem elevação mais rápida do que o esperado na sicília e calábria", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247958, "titulo": "Can AI learn to understand nature? Scientists set out a roadmap for the future of ecology", "url": "https://phys.org/news/2026-11-ai-nature-scientists-roadmap-future.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de cientistas propôs como as novas gerações de modelos de inteligência artificial poderiam revolucionar nossa compreensão de ecossistemas e auxiliar na previsão de suas respostas ao mudança ambiental.", "titulo_pt": "Pode a IA aprender a entender a natureza? Cientistas traçam uma rota para o futuro da ecologia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247959, "titulo": "Cancer-linked gene uses 'shortcut' to trigger cell division", "url": "https://phys.org/news/2026-11-cancer-linked-gene-shortcut-trigger.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um gene relacionado ao câncer utiliza um 'caminho mais curto' para acionar a divisão celular. A divisão celular é crucial para o desenvolvimento tecidual e a recuperação de lesões, mas é importante que ela ocorra apenas quando necessário, pois a divisão não regulada pode levar a problemas como o câncer.", "titulo_pt": "Gene relacionado ao câncer emprega 'atalho' para iniciar divisão celular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 24795 e a kratom. O que é e quem a usa?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 247955, "titulo": "Opinion: What it’s like to live with cognitively unimpaired Alzheimer’s disease", "url": "https://www.statnews.com/2026/11/06/pre-clinical-alzheimers-disease-biomarkers-tests-mental-health/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-06T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas com Alzheimer cognitivamente não afetadas podem não apresentar sintomas, mas ainda têm uma experiência da doença, escreve Jason Karlawish.", "titulo_pt": "Opinião: como é viver com Alzheimer sem afetar cognitivamente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 247404, "titulo": "Blue Origin adia tentativa de lançamento do foguete New Glenn para 2027", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/blue-origin-adia-tentativa-de-lancamento-do-foguete-new-glenn-para-2027.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Blue Origin adiou a tentativa de lançamento do foguete New Glenn para 2027. A próxima previsão para o voo é janeiro de 2027.", "titulo_pt": "Blue Origin adia lançamento do foguete New Glenn para 2027", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 247470, "titulo": "Novos tratamentos permitem destruir o câncer sem impor cirurgias que mutilam órgãos", "url": "https://veja.abril.com.br/saude/novos-tratamentos-permitem-destruir-o-cancer-sem-impor-cirurgias-que-mutilam-orgaos/", "fonte_id": "veja", "data_pub": "2026-11-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novos tratamentos permitem destruir o câncer sem a necessidade de cirurgias que causam mutilação nos órgãos. Trata-se de uma mudança positiva que mantém a qualidade de vida dos pacientes.", "titulo_pt": "No
