const D = {"gerado_em": "31/07/2026 19:56", "stats": {"noticias_novas": 550, "resumos_gerados": 238}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Michelle Bolsonaro, ex-primeira-dama e atual membro do PL, deve confirmar sua candidatura ao Senado no Distrito Federal durante uma convenção marcada para o próximo domingo (2/8). O anúncio foi feito pelo presidente nacional do partido, Valdemar Costa Neto. Além disso, o embaixador brasileiro em Assunção, José Marcondes, explicou que a declaração de Lula não teve intenção de desrespeitar durante um encontro com autoridades paraguaias, minimizando os impactos potenciais na relação bilateral. Na política estadual, o Republicanos convocou sua convenção para terça-feira (4) e planeja rejeitar uma aliança com Flávio Bolsonaro (PL), enquanto o Podemos provavelmente manter-se-á neutro nas eleições presidenciais.", "mundo": "A Itália implementou uma nova estratégia para combater o tráfico marítimo de drogas, concentrando-se principalmente nos cartéis mexicanos Sinaloa e Jalisco Nueva Generação. A principal rota para o transporte de drogas está no Oceano Pacífico. Em outro desenvolvimento, a China comprou soja dos Estados Unidos, uma das maiores compras diárias deste mês pela maior importadora mundial de soja. No entanto, a situação migratória em Ceuta, Espanha, continua gerando tensões políticas, com milhares de pessoas cruzando a fronteira do Marrocos e o governo espanhol anunciando a deportação dos ilegais. Além disso, o Irã enfrenta possíveis ataques das forças americanas e israelitas às suas infraestruturas energéticas, enquanto o Hamas aceitou um plano de desarmamento proposto pelos Estados Unidos em acordo com o governo palestino.\n\nA geopolítica global enfrenta diversos desafios e tensões. O Hamas concordou com a desarmamentização, um passo importante que ainda apresenta incertezas sobre sua implementação. Um acordo proposto estabelece um roadmap de três anos para a desarmamentização, apoiado pelos Estados Unidos, mas dependerá do cumprimento das promessas israelenses. As tensões regionais continuam com o Irã bloqueando navios comerciais e os EUA planejando bombardear alvos energéticos iranianos, embora sem a aprovação final do presidente americano. A Itália suspendeu o livre fluxo de pessoas com a Espanha após um influxo massivo de imigrantes marroquinos, aumentando preocupações sobre migrações e segurança fronteiriça. O conflito na Ucrânia também impacta o Mar Cáspio, com ataques à frota iraniana elevando as tensões regionais. Em outro desenvolvimento, um acidente de ônibus ocorrido na África do Saara resultou em 25 mortes e várias feridos, destacando os riscos na região.", "economia": "O PIB de Taiwan registrou o maior aumento em cerca de 40 anos, com uma taxa de 12,92%, impulsionado pela venda de chips para inteligência artificial. A economia do país teve seu melhor crescimento em quase 50 anos, refletindo a importância da indústria de semicondutores na região. Em contraste, o Banco do Japão manteve as taxas de juros estáveis e advertiu sobre os desafios inflacionários enfrentados pelo país. No mercado financeiro brasileiro, o Ibovespa encerrou julho com uma alta acumulada de quase 4%, enquanto a bandeira tarifária permaneceu amarela em agosto, resultando em um acréscimo de R$ 1,88 por cada 100 kWh consumidos. Além disso, o Tesouro dos EUA informou aos bancos que pode intervir no mercado do iene japonês, enquanto a Apple perdeu US$ 358 bilhões na bolsa após anunciar resultados do segundo trimestre inferiores às expectativas.", "tecnologia": "A MediaTek está buscando uma maior presença no mercado de inteligência artificial (IA), enquanto a Hon Hai iniciou as operações comerciais de um cluster de IA com capacidade de 5 MW. O Google Earth enfrentou críticas após lançar uma função que permitia criar imagens de deepfakes usando prompts de texto, mas desativou rapidamente a ferramenta. A Amazon concluiu um investimento de US$ 50 bilhões na OpenAI, tornando-se um dos principais acionistas da empresa de pesquisa em IA. A Anthropic anunciou uma falha de segurança relacionada às suas IAs, marcando um ponto importante no desenvolvimento dessa tecnologia. Em contraste, o Google Earth enfrenta preocupações sobre a possibilidade de disseminação de imagens falsas geradas por IA, destacando os riscos associados à utilização dessas ferramentas. Além disso, empresas como Apple e Amazon estão investindo bilhões em IA, mas ainda não se sabe se esses investimentos terão retorno financeiro.", "ciencia": "A NASA realizou uma conferência de imprensa na base espacial Kennedy da Flórida, detalhando novos esforços para explorar o espaço. O evento marcou a inauguração do primeiro novo túnel de vento significativo da agência em mais de 40 anos, no Facility for Flight Dynamics Research, que vai apoiar pesquisas e desenvolvimento tecnológico crucial. Em outro avanço espacial, uma sonda japonesa realizou um sobrevoo a apenas 400 metros de um asteroide próximo da Terra, estabelecendo o recorde mais próximo já registrado em uma missão desse tipo. Na Terra, cientistas descobriram que os genomas humanos contêm mecanismos inovadores para proteger o DNA durante a divisão celular, enquanto pesquisas sobre isótopos podem auxiliar na identificação de madeira ilegalmente cortada no Amazonas. Também foi anunciado um novo telescópio extremamente grande que deve entrar em operação na Austrália do Sul nos próximos anos e pode detectar biossinalizações em outros planetas. Além disso, a NASA também testou cintas comerciais prontas para uso que atendem aos requisitos de flammabilidade da agência espacial, comprovando sua eficácia em ambientes elevados de oxigênio.", "cultura": "O ministro do STF Luiz Fux confirmou sua presença no fórum antirracista e climático promovido pela universidade paulista. Durante o evento, ele fará uma palestra importante. Além disso, a exposição 'Help Wanted / Leave Now' em California documentará a famosa Operação Wetback de 1954, que expulsou trabalhadores mexicanos não-documentados dos Estados Unidos. Em outra notícia cultural, o Programa Ceará Criativo viabilizou a circulação de 130 artistas cearenses por diversos destinos no Brasil e exterior, comemorando os 40 anos do álbum 'O Concreto Já Rachou' da Plebe Rude. A cerimônia de premiação do 2º Prêmio ADEP-MG de Jornalismo ocorreu em Belo Horizonte, onde o programa 'Caminhos da Reportagem' ganhou na categoria Vídeo.", "sociedade": "A crise migratória em Ceuta continua gerando grande atenção nas redes sociais, com mais de 50 mil pessoas cruzando a fronteira em cerca de 24 horas e pelo menos 34 mortos. O governo espanhol reagiu enviando tropas do Exército para reforçar a segurança na região. Em outro incidente trágico, um servidor público foi morto a tiros enquanto levava seu filho à escola em Niterói (RJ), e uma criança também foi baleada no mesmo evento. No que diz respeito às questões sociais, o Brasil enfrenta desafios significativos na área da saúde mental, que está entre os serviços em lista de espera. Outro caso importante é a travessia de migrantes entre Marrocos e Ceuta, Espanha, resultando em pelo menos 34 mortes afogadas. A divisão de poder na Braskem tem causado instabilidade operacional, enquanto o país busca reduzir os danos do tarifaço através de negociações com Estados Unidos.", "meio_ambiente": "Até julho deste ano, o Brasil registrou 81 tornados e pode ultrapassar o recorde de 92 em 2025, com os registros aumentando significativamente. A República Democrática do Congo declarou sua segunda maior epidemia de ebola na história, com o surto se espalhando rapidamente e necessitando de atenção internacional. O Meio Ambiente enfrenta desafios globais como a onda de calor na Europa, que levou a confusão entre 'risco iminente' e 'risco emergente', além do derretimento das geleiras e mudanças nas precipitações extremas. A previsão do El Niño intensifica as chances de chuvas intensas, inundações e cheias no Brasil, afetando usinas hidrelétricas na região Sul que estão se preparando para um aumento da precipitação.", "direitos_humanos": "O Irã registrou um número alarmante de vítimas infantis, superando 2.500, durante o conflito atual, conforme declarou Abdul Fofana, diretor regional interino da UNICEF para o Oriente Médio e África do Norte. Em outra notícia, o Ministério dos Direitos Humanos enfrenta três denúncias contra Zé Felipe por supostamente ter estimulado seu filho a repetir frases de conteúdo sexual em um vídeo. A igreja envolvida concordou em pagar R$ 100 mil como compensação pelo incidente. Além disso, a PAHO alertou para a necessidade de proteger o aleitamento materno das ameaças da publicidade digital prejudicial, enquanto especialistas advertiram sobre os cortes no financiamento externo dos EUA que podem limitar o acesso a um medicamento injetável preventivo do HIV."}, "resumo_do_dia": {"politica_nacional": [{"id": 84641, "titulo": "Fala sobre Vorcaro gera constrangimento em encontro de Flávio com vereadores de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/fala-sobre-vorcaro-gera-constrangimento-em-encontro-de-flavio-com-vereadores-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro se reuniu com Tarcísio de Freitas, vereadores de São Paulo e o prefeito Ricardo Nunes. Houve um momento de constrangimento durante a reunião nesta sexta-feira (31).", "titulo_pt": "Encontro entre Flávio bolsonaro e vereadores de SP gera constrangimento", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 84699, "titulo": "Michelle diz estar presa com Bolsonaro e definirá candidatura com ele", "url": "https://www.metropoles.com/colunas/grande-angular/michelle-diz-estar-presa-com-bolsonaro-e-definira-candidatura-com-ele", "fonte_id": "metropoles", "data_pub": "2026-07-31T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro afirmou estar presa com Jair Bolsonaro e que definirá sua possível candidatura ao Senado durante uma convenção do PL-DF neste domingo (2/8).", "titulo_pt": "Michelle diz estar presa com Bolsonaro e definirá candidatura com ele", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 84733, "titulo": "Michelle não confirma candidatura e diz “priorizar” cuidado de Bolsonaro", "url": "https://www.cnnbrasil.com.br/eleicoes/michelle-nao-confirma-candidatura-e-diz-priorizar-cuidado-de-bolsonaro/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-31T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro não confirmou sua intenção de se candidatar a qualquer cargo e enfatizou que priorizará o cuidado com seu marido, o presidente Jair Bolsonaro.", "titulo_pt": "Michelle não confirma candidatura e diz 'priorizar' cuidado de Bolsonaro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 84734, "titulo": "Justiça do DF condena Nikolas Ferreira a pagar R$ 20 mil ao PT", "url": "https://www.cnnbrasil.com.br/politica/justica-do-df-condena-nikolas-ferreira-a-pagar-r-20-mil-ao-pt/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-31T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Distrito Federal condenou Nikolas Ferreira a pagar R$ 20 mil ao PT. A sentença ordena que ele retire uma publicação que associava o partido ao tráfico de drogas.", "titulo_pt": "Justiça do DF condena Nikolas Ferreira a pagar R$ 20 mil ao PT", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 84623, "titulo": "Michelle não crava candidatura e diz que prioridade é cuidar de Bolsonaro: 'Presa com meu marido'", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/07/31/michelle-bolsonaro-diz-que-ainda-avalia-candidatura-e-prioridade-e-cuidar-de-jair-presa-com-meu-marido.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-31T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro (PL) ainda está avaliando se será candidata ao Senado pelo Distrito Federal nas eleições deste ano. Ela afirmou que deve definir sua posição até o dia seguinte e priorizar cuidar de Jair Bolsonaro, que participará da decisão.", "titulo_pt": "Michelle Bolsonaro não crava candidatura e diz que prioridade é cuidar de Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 84642, "titulo": "Zanin arquiva inquérito contra ministro do STJ em caso de venda de decisões", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/zanin-arquiva-inquerito-contra-ministro-do-stj-em-caso-de-venda-de-decisoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Cristiano Zanin, do STF, arquivou um inquérito contra o ministro Og Fernandes do STJ relacionado a suspeitas de venda e vazamento de decisões judiciais. O inquérito foi arquivado nesta sexta-feira (31).", "titulo_pt": "Zanin arquiva inquérito contra ministro do STJ em caso de venda de decisões", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 84643, "titulo": "Lula e Flávio Bolsonaro disputam Podemos, que deve ficar neutro, em vitória para o PT", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/lula-e-flavio-bolsonaro-disputam-podemos-que-deve-ficar-neutro-em-vitoria-para-o-pt.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do presidente Lula (PT) e integrantes da campanha de Flávio Bolsonaro (PL) tentaram conquistar o Podemos, que provavelmente manter-se-á neutro. A sigla deve evitar alianças com ambos os candidatos presidenciais.", "titulo_pt": "Lula e Bolsonaro disputam Podemos, que deve se manter neutro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 84624, "titulo": "Em entrevista no Alvorada, Lula comenta tamanho do Palácio: 'Café chega frio, cerveja chega quente'", "url": "https://g1.globo.com/politica/noticia/2026/07/31/em-entrevista-no-alvorada-lula-comenta-tamanho-do-palacio-cafe-chega-frio-cerveja-chega-quente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-31T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) comentou sobre o tamanho do Palácio da Alvorada durante uma entrevista, destacando que os ambientes são distantes um do outro e não adequados para morar devido à falta de espaço familiar. Ele observou que a residência oficial é bela para visitas, mas desumana para quem tem muitos filhos.", "titulo_pt": "Lula fala sobre o tamanho do Palácio da Alvorada", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 84710, "titulo": "STJ mantém condenação de empresas de gás de cozinha por cartel no DF", "url": "https://www.metropoles.com/distrito-federal/stj-mantem-condenacao-de-empresas-de-gas-de-cozinha-por-cartel-no-df", "fonte_id": "metropoles", "data_pub": "2026-07-31T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) manteve a condenação das empresas de gás de cozinha no Distrito Federal por formarem um cartel. As distribuidoras foram obrigadas a pagar R$ 250 mil como indenização por danos morais coletivos.", "titulo_pt": "STJ mantém condenação de empresas de gás de cozinha por cartel no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 84644, "titulo": "Flávio Bolsonaro mira SP com troca de marqueteiro e diz não entender rejeição entre mulheres", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/flavio-bolsonaro-mira-sp-com-troca-de-marqueteiro-e-diz-nao-entender-rejeicao-entre-mulheres.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro fez uma troca na equipe de comunicação e participou de um encontro com vereadores de São Paulo, intensificando a presença da campanha no estado. Ele também não entende a rejeição entre as mulheres.", "titulo_pt": "Flávio Bolsonaro ajusta equipe de comunicação e aumenta atuação em SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 84896, "titulo": "Lula marca 40,5% e amplia vantagem sobre Flávio Bolsonaro, aponta Vox Brasil", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-marca-405-e-amplia-vantagem-sobre-flavio-bolsonaro-aponta-vox-brasil", "fonte_id": "jota", "data_pub": "2026-07-31T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula marcou 40,5% nas intenções de voto e ampliou sua vantagem sobre Flávio Bolsonaro. O atual governo do presidente registrou 48,9% de aprovação e 50,3% de desaprovação.", "titulo_pt": "Lula lidera com 40,5% e amplia vantagem sobre Flávio Bolsonaro, aponta Vox Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 84625, "titulo": "Embaixador brasileiro diz ao Paraguai que Lula não teve intenção de faltar com respeito e que fala foi retirada de contexto", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/07/31/embaixador-brasileiro-diz-ao-paraguai-que-lula-nao-teve-intencao-de-faltar-com-respeito-e-que-fala-foi-retirada-de-contexto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-31T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O embaixador brasileiro em Assunção, José Marcondes, explicou que o presidente Lula não teve intenção de desrespeitar durante sua fala sobre a guerra no encontro com autoridades paraguaias. O chanceler paraguaio pediu esclarecimentos após a entrega de uma nota de repúdio pelo Paraguai.", "titulo_pt": "Embaixador brasileiro afirma que Lula não teve intenção de desrespeitar e fala foi retirada do contexto", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 84899, "titulo": "Aos 80 anos, Lula inicia última campanha presidencial com desafio de fazer eleitor sonhar com futuro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/aos-80-anos-lula-inicia-ultima-campanha-presidencial-com-desafio-de-fazer-eleitor-sonhar-com-futuro", "fonte_id": "jota", "data_pub": "2026-07-31T20:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva, aos 80 anos, inicia sua última campanha presidencial. A primeira parada é no Estádio 1º de Maio, local onde Lula se tornou conhecido nacionalmente durante greves do ABC na década de 1970.", "titulo_pt": "Lula, aos 80 anos, inicia última campanha presidencial em palco histórico", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 84645, "titulo": "TJ da Bahia quer turbinar gastos com comunicação em quase 400%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/tj-da-bahia-quer-turbinar-gastos-com-comunicacao-em-quase-400.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T20:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal de Justiça da Bahia, desembargador José Edivaldo Rocha Rotondano, propôs um orçamento para 2027 com gastos de R$ 13 milhões em comunicação institucional, representando um aumento de cerca de 381% em relação aos R$ 2,7 milhões do orçamento atual.", "titulo_pt": "TJ da Bahia quer aumentar gastos com comunicação em 381%", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 84639, "titulo": "PRTB lança Leonardo Avalanche candidato à Presidência da República", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/prtb-lanca-leonardo-avalanche-candidato-presidencia-da-republica", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-31T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Renovador Trabalhista Brasileiro (PRTB) lançou oficialmente Leonardo Avalanche como candidato à Presidência da República. A convenção do partido ocorreu em Goiânia, na quarta-feira (29).", "titulo_pt": "PRTB lança Leonardo Avalanche candidato à Presidência da República", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 84646, "titulo": "Centrais sindicais entregam demandas ao governo para reagir ao tarifaço", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/centrais-sindicais-entregam-demandas-ao-governo-para-reagir-ao-tarifaco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As centrais sindicais apresentaram ao governo propostas para combater o tarifaço imposto pelo governo dos Estados Unidos, incluindo a revisão da Lei das Patentes e o fortalecimento do Mercosul.", "titulo_pt": "Centrais sindicais entregam propostas ao governo contra tarifaço", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 84326, "titulo": "Hamas agrees to disarm, but major challenges ahead", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/01/2003861744", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Hamas concordou com a desarmamentização, mas vários desafios permanecem por resolver. A decisão de desarmar representa um passo importante, no entanto, ainda há muitas incertezas sobre como isso será implementado.", "titulo_pt": "Hamas aceita desarmar, mas grandes desafios se avizinham", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84327, "titulo": "Coast guard monitoring Chinese vessels east of Taiwan", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/01/2003861745", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O serviço de guarda costeira está monitorando navios chineses na costa leste de Taiwan.", "titulo_pt": "Guarda-costeira monitora navios chineses na costa leste de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 85080, "titulo": "Chinese buyers acquire US soybeans for October-November, traders say", "url": "https://www.scmp.com/news/world/united-states-canada/article/3362615/chinese-buyers-acquire-us-soybeans-october-november-traders-say?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-31T21:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Compradores do governo chinês adquiriram ao menos oito cargas de soja dos Estados Unidos para embarque a partir de terminais da costa do Golfo dos EUA em agosto, e seis cargas para outubro e novembro por portos do noroeste do Pacífico. As vendas representam uma das maiores compras diárias deste mês pela China, após o maior importador mundial de soja retomar as compras americanas no final de junho.", "titulo_pt": "Compradores chineses adquirem soja americana para outubro e novembro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 85026, "titulo": "Columbia University student workers’ union withdraws Israel divestment demand", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/columbia-university-student-workers-union-withdraws-israel-divestment", "fonte_id": "middle_east_eye", "data_pub": "2026-07-31T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A entidade sindical dos trabalhadores estudantis da Columbia University retirou a exigência de divestimento financeiro do país israelense durante uma reunião de negociação esta semana. A decisão foi votada pelos membros da entidade em uma assembleia geral realizada na segunda-feira.", "titulo_pt": "Sindicato dos trabalhadores estudantis da columbia University retira exigência de divestimento de Israel", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 85027, "titulo": "US Centcom says ’30 commerical vessels’ redirected during Iran blockade", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/us-centcom-says-30-commerical-vessels-redirected-during-iran-blockade", "fonte_id": "middle_east_eye", "data_pub": "2026-07-31T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comando Central dos EUA (Centcom) informou que redirecionou 30 navios comerciais, desabilitou dois e embarcou outros dois para garantir o cumprimento integral das regras durante a bloqueio imposto pela Irã. A Força Armada permitiu que cerca de 30 navios passem pelo bloqueio para fornecer assistência humanitária.", "titulo_pt": "Centcom diz ter redirecionado 30 navios comerciais durante o bloqueio iraniano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 85070, "titulo": "Messico, 'nel Pacifico si concentra il principale traffico marittimo di droga'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/messico-nel-pacifico-si-concentra-il-principale-traffico-marittimo-di-droga_403be767-5b98-4d7a-ac64-922b32576567.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T21:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Itália implementou uma nova estratégia contra o tráfico de drogas marítimo, com foco nos cartéis de Sinaloa e Jalisco Nueva Generação. A principal rota para o transporte de drogas está no Pacífico.", "titulo_pt": "México: na bússola do tráfico marítimo de drogas, os cartéis de sinaloa e jalisco nueva generación estão sob vigilância", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 84654, "titulo": "Paraguai entrega nota de repúdio a embaixador brasileiro, e vice diz não querer aprofundar rusga", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/paraguai-entrega-nota-de-repudio-a-embaixador-brasileiro-e-vice-diz-nao-querer-aprofundar-rusga.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-31T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente do Paraguai, Pedro Alliana, entregou uma nota de repúdio ao embaixador brasileiro e indicou que não quer aprofundar o conflito com o Brasil nas vésperas das eleições de outubro.", "titulo_pt": "Paraguai entrega nota de repúdio ao embaixador brasileiro e vice não quer aprofundar rusga", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 85081, "titulo": "Will US or China win the next war? That’s the wrong question to ask", "url": "https://www.scmp.com/opinion/china-opinion/article/3362476/will-us-or-china-win-next-war-thats-wrong-question-ask?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-31T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo da revista Foreign Affairs explora a rivalidade militar e tecnológica entre Estados Unidos e China, focando no confronto de estratégias entre o sistema liderado pelos EUA e a visão mundial chinesa. O texto reflete uma tradição estratégica ocidental liberal-realista.", "titulo_pt": "EUA ou China: qual será o vencedor da próxima guerra?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 85071, "titulo": "Wsj, 'Trump ha ordinato un nuovo attacco all'Iran, forse nel fine settimana'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/wsj-trump-ha-ordinato-un-nuovo-attacco-alliran-forse-nel-fine-settimana_6db723fd-7a77-43ee-862e-8ed2f4edde18.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T21:30:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Trump ordenou um novo ataque ao Irã, possivelmente no final de semana, com o objetivo de induzir Teerã à rendição.", "titulo_pt": "Trump ordena novo ataque ao Irã, provavelmente no fim de semana", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 84798, "titulo": "EUA e Israel planejam bombardear alvos vinculados ao setor energético no Irã, diz CBS", "url": "https://www.infomoney.com.br/mundo/eua-e-israel-planejam-bombardear-alvos-vinculados-ao-setor-energetico-no-ira-diz-cbs/", "fonte_id": "infomoney", "data_pub": "2026-07-31T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos ainda não deu o aval final para os bombardeios, segundo fontes citadas pela CBS. Os EUA e Israel planejam atacar alvos relacionados ao setor energético do Irã.", "titulo_pt": "EUA e Israel planejam bombardear alvos energéticos no Irã, diz CBS", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 84892, "titulo": "Migrants Surge Into Spanish Territory, Prompting Political Backlash", "url": "https://www.nytimes.com/2026/07/31/world/europe/migrants-surge-into-spanish-territory-triggering-political-backlash.html", "fonte_id": "nyt_world", "data_pub": "2026-07-31T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Migrantes saíram repentinamente do Marrocos, surpreendendo autoridades espanholas e levando partidos de direita a criticar severamente a situação.", "titulo_pt": "Migrantes chegam em massa à Espanha, gerando reação política", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 84670, "titulo": "Itália suspende livre fluxo de pessoas com a Espanha", "url": "https://www.poder360.com.br/poder-internacional/italia-suspende-livre-fluxo-de-pessoas-com-a-espanha/", "fonte_id": "poder360", "data_pub": "2026-07-31T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Itália suspendeu o livre fluxo de pessoas com a Espanha a partir de 1º de agosto, por um mês. A medida foi anunciada após cerca de 50.000 imigrantes marroquinos entrarem no território espanhol em 24 horas.", "titulo_pt": "Itália suspende livre fluxo de pessoas com a Espanha", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 85072, "titulo": "Cbs, 'Usa e Israele si preparano ad attaccare le infrastrutture energetiche Iran'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/cbs-usa-e-israele-si-preparano-ad-attaccare-le-infrastrutture-energetiche-iran_bb6a355c-da5f-4877-a0a1-1f4e07fed4af.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T21:06:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e Israel podem estar se preparando para atacar as infraestruturas energéticas do Irã. Trump ainda não autorizou os ataques, que podem ocorrer no fim de semana.", "titulo_pt": "Cbs: EUA e israel preparam-se para atacar infraestruturas energeticas do Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 84741, "titulo": "Caça dos EUA cai em base militar de San Diego, Califórnia", "url": "https://www.cnnbrasil.com.br/internacional/caca-dos-eua-cai-em-base-militar-de-san-diego-california/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-31T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um avião de caça dos Estados Unidos caiu em uma base militar de San Diego, Califórnia. O piloto foi ejetado do veículo, mas não foram divulgadas informações sobre o seu estado de saúde.", "titulo_pt": "Avião de caça dos EUA cai em base militar de San Diego", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 84721, "titulo": "Conexão perigosa: como o ataque da Ucrânia a um navio do Irã aumenta riscos de escalada militar", "url": "https://www.brasildefato.com.br/2026/07/31/conexao-perigosa-como-o-ataque-da-ucrania-a-um-navio-do-ira-aumenta-riscos-de-escalada-militar/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-31T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ataque da Ucrânia a um navio iraniano no Mar Cáspio aumentou a tensão entre Kiev e Teerã, elevando as preocupações com uma possível escalada militar. Os conflitos na Ucrânia e no Irã estão cada vez mais interligados, o que pode levar a uma expansão geográfica das ações militares no Mar Cáspio.", "titulo_pt": "Conexão perigosa: como o ataque da Ucrânia a um navio do Irã aumenta riscos de escalada militar", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 84655, "titulo": "Navio japonês que transportava mil prisioneiros é encontrado no Pacífico após 80 anos", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/navio-japones-que-transportava-mil-prisioneiros-e-encontrado-no-pacifico-apos-80-anos.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-31T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os destroços do navio japonês Hofuku Maru, que transportava cerca de 1.200 prisioneiros de guerra britânicos e holandeses durante a Segunda Guerra Mundial, foram localizados na costa da ilha de Luzon nas Filipinas após 80 anos.", "titulo_pt": "Navio japonês com mil prisioneiros de guerra é encontrado no Pacífico após 80 anos", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 84325, "titulo": "GDP posts fastest rise in nearly 40 years to 12.92%", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/01/2003861743", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PIB de Taiwan registrou o maior aumento em cerca de 40 anos, com uma taxa de 12,92%.", "titulo_pt": "Pib de taiwan cresce a taxa mais rápida em quase 40 anos (12,92%)", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84343, "titulo": "TAIEX jumps nearly 8 percent in largest-ever points gain", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861725", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O indicador de ações taiwanês TAIEX subiu quase 8% em sua maior alta pontual histórica.", "titulo_pt": "TAIEX sobe quase 8% com maior ganho pontual na história", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84348, "titulo": "Bank of Japan keeps rates steady, warns on inflation", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861730", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão manteve as taxas de juros estáveis e advertiu sobre a inflação. A instituição central japonesa não alterou suas taxas, mas alertou para os desafios inflacionários enfrentados pelo país.", "titulo_pt": "Banco do Japão mantém taxas de juros estáveis e avisa sobre inflação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84657, "titulo": "Dólar fecha estável, mas acumula queda de 1,82% em julho", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/dolar-fecha-estavel-mas-acumula-queda-de-182-em-julho", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-31T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar teve uma leve alta na sexta-feira (31), mas registrou uma queda de 1,82% no mês de julho. O Ibovespa da bolsa brasileira fechou em alta e ganhou quase 3,5% no mesmo período.", "titulo_pt": "Dólar fecha estável, mas perde 1,82% em julho", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 85022, "titulo": "Fintech broker Clear Street offers investors pre-IPO access to $188 billion AI giant Databricks", "url": "https://www.cnbc.com/2026/07/31/clear-street-pre-ipo-platform-databricks.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-31T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fintech Clear Street está lançando uma plataforma de mercados privados, inicialmente com participações na Databricks, para oferecer mais acesso a startups em estágios avançados aos investidores.", "titulo_pt": "Fintech Clear Street oferece acesso pré-ipo a investidores em gigante de IA Databricks", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 85067, "titulo": "Citadel’s swoop on Situational Awareness helped stem a $3tn AI rout", "url": "https://www.ft.com/content/4f00bd97-c3da-41af-9b92-410ebaa6ad2d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-31T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Citadel adquiriu a Situational Awareness, o que aliviou os investidores ansiosos sobre ações de tecnologia.", "titulo_pt": "Compra da situacional Awareness pela citadel acalma traders de ações de tecnologia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 84705, "titulo": "Conta de luz continua com bandeira tarifária amarela no mês de agosto", "url": "https://www.metropoles.com/brasil/conta-de-luz-continua-com-bandeira-tarifaria-amarela-no-mes-de-agosto", "fonte_id": "metropoles", "data_pub": "2026-07-31T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil terá bandeira tarifária amarela na conta de luz pelo quarto mês consecutivo, resultando em um acréscimo de R$ 1,88 a cada 100 kWh consumidos.", "titulo_pt": "Bandeira tarifária amarela continua na conta de luz no mês de agosto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 84658, "titulo": "Bandeira tarifária continuará amarela em agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/bandeira-tarifaria-continuara-amarela-em-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-31T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bandeira tarifária permanecerá amarela em agosto, conforme informou a Agência Nacional de Energia Elétrica (Aneel). O acréscimo de R$ 1,88 por cada 100 kWh consumidos nas contas de luz será mantido para todos os consumidores do Sistema Interligado Nacional.", "titulo_pt": "Bandeira tarifária continuará amarela em agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 84739, "titulo": "Tesouro dos EUA informa bancos que deve intervir no iene japonês, diz fonte", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/tesouro-dos-eua-informa-bancos-que-deve-intervir-no-iene-japones-diz-fonte/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-31T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Federal Reserve de Nova York informou bancos que pode intervir no mercado do iene japonês. Esta ação ocorreu um dia após as autoridades japonesas realizarem uma intervenção para fortalecer o iene.", "titulo_pt": "Tesouro dos EUA avisa bancos sobre possível intervenção no iene, diz fonte", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 84632, "titulo": "Quando o investidor vira advogado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/07/quando-o-investidor-vira-advogado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-31T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores que descobrem problemas em suas decisões de investimento tendem a ignorar evidências desfavoráveis, desqualificar críticos e selecionar apenas informações que confirmam sua primeira avaliação. Isso é comparado a um engenheiro que ignora falhas em uma ponte.", "titulo_pt": "Quando o investidor vira advogado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 84897, "titulo": "STJ promove fórum sobre prevenção a fraudes e segurança digital", "url": "https://www.jota.info/justica/stj-promove-forum-sobre-prevencao-a-fraudes-e-seguranca-digital", "fonte_id": "jota", "data_pub": "2026-07-31T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) realizará um fórum sobre prevenção a fraudes e segurança digital no dia 3 de setembro, das 9h às 12h, na sede do STJ em Brasília.", "titulo_pt": "STJ promove fórum sobre prevenção a fraudes e segurança digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 84686, "titulo": "Ibovespa encerra julho com alta acumulada de quase 4%", "url": "https://veja.abril.com.br/economia/ibovespa-encerra-julho-com-alta-acumulada-de-quase-4/", "fonte_id": "veja", "data_pub": "2026-07-31T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa, principal índice da B3, encerrou o mês de julho com uma alta acumulada de quase 4%. Apesar disso, houve um atraso na operação nesta sexta-feira.", "titulo_pt": "Ibovespa fecha julho com alta de quase 4%", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 84634, "titulo": "Chegada do Ozivy não reduz preços de canetas emagrecedoras e importações disparam, mostra estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/chegada-do-ozivy-nao-reduz-precos-de-canetas-emagrecedoras-e-importacoes-disparam-mostra-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-31T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo mostra que a procura por canetas emagrecedoras aumentou significativamente no primeiro semestre de 2026, mas os preços não diminuíram e nem a chegada de uma nova opção no mercado alterou este cenário.", "titulo_pt": "Chegada do Ozivy não reduz preços de canetas emagrecedoras e importações disparam, mostra estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 84898, "titulo": "Legal Infra Summit divulga programação completa da terceira edição em SP", "url": "https://www.jota.info/coberturas-especiais/legal-infra-summit-divulga-programacao-completa-da-terceira-edicao-em-sp", "fonte_id": "jota", "data_pub": "2026-07-31T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A terceira edição do Legal Infra Summit, organizado por JOTA, Hiria e Vernalha Pereira, ocorrerá no dia 26 de agosto. A programação completa já foi divulgada e inclui participantes como parlamentares, economistas, executivos e acadêmicos.", "titulo_pt": "Programação completa do legal Infra Summit da terceira edição em SP é divulgada", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 84635, "titulo": "Loteria leiloada por Tarcísio entra no ar com domínio '.bet' e jogos similares a caça-níqueis", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/loteria-leiloada-por-tarcisio-entra-no-ar-com-dominio-bet-e-jogos-similares-a-caca-niqueis.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-31T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Loteria Estadual de São Paulo está operando um site chamado 'dasorteloteria.bet', oferecendo jogos online semelhantes a caça-níqueis e roletas desde o dia 1º de julho. As apostas podem ser realizadas através de um aplicativo restrito atualmente aos dispositivos Android.", "titulo_pt": "Loteria estadual de são paulo opera site com jogos similares a caça-níqueis", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 84636, "titulo": "Sem concorrência, consórcio leva concessão de manejo de lixo de 31 cidades em MG", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/sem-concorrencia-consorcio-leva-concessao-de-manejo-de-lixo-de-31-cidades-em-mg.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-31T19:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um consórcio formado pelas empresas Viasolo Engenharia Ambiental e Revita Engenharia venceu a licitação para administrar os serviços de manejo de resíduos sólidos urbanos em 31 cidades de Minas Gerais. Não houve concorrência na arrematação da concessão.", "titulo_pt": "Sem concorrência, consórcio leva concessão de manejo de lixo de 31 cidades em MG", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 84344, "titulo": "MediaTek eyes bigger share of AI market", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861726", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MediaTek está buscando uma maior participação no mercado de inteligência artificial (IA). A empresa está focada em aumentar sua presença nesta área tecnológica.", "titulo_pt": "Mediatek mira em maior fatia do mercado de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84345, "titulo": "Hon Hai subsidiary begins commercial operations of 5MW AI cluster", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861727", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A subsidiária da Hon Hai iniciou as operações comerciais de um cluster de inteligência artificial com capacidade de 5MW.", "titulo_pt": "Subsidiária da hon Hai inicia operações comerciais de cluster AI com 5MW", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84346, "titulo": "Lite-On Technology expects 2H revenue boost", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861728", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lite-On Technology espera um aumento nas receitas no segundo semestre do ano.", "titulo_pt": "Lite-on Technology espera aumento nas receitas no 2º semestre", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 85021, "titulo": "Trump's AI executive order nears key deadline as regulation debate intensifies", "url": "https://www.cnbc.com/2026/07/31/trump-ai-executive-order-nears-key-deadline-regulation-debate-heats-up.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-31T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tech líderes como Sam Altman e Jensen Huang estiveram em Washington, D.C., antes da prazo final definido pelo decreto executivo do governo americano sobre IA.", "titulo_pt": "Ordem executiva de AI de trump se aproxima de prazo crucial enquanto debate regulatório intensifica", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 84929, "titulo": "Google Just Torched the Credibility of Its Satellite Images", "url": "https://www.theatlantic.com/technology/2026/07/google-earth-ai-images/688145/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-31T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google Earth era uma ferramenta valiosa para pesquisadores, mas recentemente as imagens satelitais do serviço passaram a ser questionadas devido à possibilidade de falsificação por deepfakes.", "titulo_pt": "Google acaba de destruir a credibilidade das suas imagens satelitais", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 85069, "titulo": "Amazon completes $50bn investment in OpenAI", "url": "https://www.ft.com/content/8ae9e6e4-a53c-44da-8e7d-c9d81f0df4b9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-31T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon concluiu uma investimento de US$ 50 bilhões na OpenAI, empresa de pesquisa em inteligência artificial. A aquisição dá à Amazon aproximadamente 5% das ações da AI lab.", "titulo_pt": "Amazon completa investimento de us$ 50 bi na OpenAI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 85082, "titulo": "Google rolls back new satellite image AI tool after backlash", "url": "https://www.scmp.com/news/world/united-states-canada/article/3362613/google-rolls-back-new-satellite-image-ai-tool-after-backlash?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-31T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google desativou uma nova funcionalidade que permitia aos usuários do Google Earth criar visualizações de inteligência artificial sobre as imagens satelitais do serviço, após forte reação negativa de pesquisadores e especialistas em Inteligência Aberta sobre o risco de disseminar desinformação.", "titulo_pt": "Google revoga nova ferramenta de imagem satelital com AI após contragosto", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 84991, "titulo": "OpenAI tops one billion active users as AI race intensifies", "url": "https://www.lemonde.fr/en/pixels/article/2026/07/31/openai-tops-one-billion-active-users-as-ai-race-intensifies_6756049_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-31T20:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa detrás do ChatGPT atingiu a marca de um bilhão de usuários ativos menos de quatro anos após o lançamento do seu principal chatbot, enquanto a concorrência intensificada leva a empresa a reduzir os preços.", "titulo_pt": "Openai supera um bilhão de usuários ativos enquanto a corrida pela IA acelera", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 84691, "titulo": "O anúncio da Anthropic sobre falha de segurança com suas IAs", "url": "https://veja.abril.com.br/tecnologia/o-anuncio-da-anthropic-sobre-falha-de-seguranca-com-suas-ias/", "fonte_id": "veja", "data_pub": "2026-07-31T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Anthropic anunciou uma falha de segurança relacionada a suas inteligências artificiais, o que marca um ponto importante na tecnologia em que duas das maiores startups de IA demonstram capacidades extremas dos seus modelos.", "titulo_pt": "Anúncio da Anthropic sobre falha de segurança com suas IAs", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 84837, "titulo": "Os planos da Amazon e da Apple para inteligência artificial — e as dificuldades financeiras que eles causam", "url": "https://www.bbc.com/portuguese/articles/cr49e6q92keo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-31T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bilhões de dólares estão sendo investidos na tecnologia de inteligência artificial pela Amazon e Apple, mas ainda não se sabe se essas empresas terão retorno financeiro desses investimentos.", "titulo_pt": "Planos da Amazon e da Apple para inteligência artificial — e as dificuldades financeiras que eles causam", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 85089, "titulo": "Google Earth’s AI deepfake tool only lasted one day", "url": "https://www.theverge.com/tech/973943/google-earth-ai-image-generation-deepfake-tool", "fonte_id": "the_verge", "data_pub": "2026-07-31T19:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google encerrou uma funcionalidade do Google Earth que permitia aos usuários criar imagens de satélite editadas com deepfakes usando prompts de texto; a ferramenta foi disponibilizada por apenas um dia. Henk van Ess, da Digital Digging, usou-a para adicionar elementos fictícios às imagens de satélite.", "titulo_pt": "Google fecha recurso do google Earth que criava deepfakes com AI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 84772, "titulo": "Aplicativo da Motorola vai preservar idioma indígena que pode desaparecer", "url": "https://exame.com/esg/aplicativo-da-motorola-vai-preservar-idioma-indigena-que-pode-desaparecer/", "fonte_id": "exame", "data_pub": "2026-07-31T18:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um aplicativo desenvolvido com a Lenovo Foundation e representantes da comunidade Rainy Lake Ojibwe foi criado para preservar um idioma indígena que corre o risco de desaparecer. A ferramenta inclui relatos, referências geográficas e conhecimentos tradicionais.", "titulo_pt": "Aplicativo vai preservar idioma indígena em perigo de extinção", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 85091, "titulo": "Google might launch a ‘Pixel Tag’", "url": "https://www.theverge.com/tech/973889/google-pixel-tag-item-tracker", "fonte_id": "the_verge", "data_pub": "2026-07-31T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google estaria desenvolvendo um rastreador de itens chamado 'Pixel Tag', que concorreria com o AirTag da Apple. Um imagem e uma lista de produtos na Slovênia mencionam o Pixel Tag como um rastreador com um altifalante.", "titulo_pt": "Google pode lançar um 'Pixel Tag'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 85092, "titulo": "Chinese AI Researchers Are Finding Their Voice on X", "url": "https://www.wired.com/story/chinese-ai-researchers-are-finding-their-voice-on-x/", "fonte_id": "wired", "data_pub": "2026-07-31T18:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores chineses de inteligência artificial estão se juntando à plataforma X para explicar seus trabalhos, atrair talentos e moldar a conversa global sobre IA. Enquanto os funcionários da OpenAI e Anthropic ficam mais silenciosos online, os pesquisadores chineses estão tomando uma posição ativa nessa plataforma.", "titulo_pt": "Pesquisadores de IA chineses estão fazendo seus pregos em X", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 84076, "titulo": "How Leopold Aschenbrenner built a $45 billion AI hedge fund — and lost most of it in days", "url": "https://www.cnbc.com/2026/07/31/leopold-aschenbrenner-situational-awareness-fund-fire-sale.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-31T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Leopold Aschenbrenner, ex-membro da OpenAI que se tornou gestor de fundos hedge, viu uma significativa queda no valor do seu fundo focado em inteligência artificial, Situacional Awareness, esta semana. O fundo, avaliado em 45 bilhões de dólares, sofreu grandes perdas nos últimos dias.", "titulo_pt": "Como Leopold Aschenbrenner construiu um fundo de hedge de 45 bilhões de AI e o perdeu em poucos dias", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 83399, "titulo": "No Vale do Silício, alguns dizem que uma bolha de IA seria bem-vinda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/07/no-vale-do-silicio-alguns-dizem-que-uma-bolha-de-ia-seria-bem-vinda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-31T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores renomados, como Michael Burry e Dean Baker, e até mesmo o CEO do JPMorgan Chase, Jamie Dimon, expressaram preocupações sobre a possibilidade de uma bolha em inteligência artificial no Vale do Silício.", "titulo_pt": "Em silicon valley, alguns alertam para uma possível bolha de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 84652, "titulo": "Observatório brasileiro registra chuva de meteoros: veja", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/observatorio-brasileiro-registra-chuva-de-meteoros-veja.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-31T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A chuva de meteoros Delta Aquáridas do Sul atingiu seu pico na noite de quinta-feira (30) e madrugada de sexta-feira (31). No Brasil, o fenômeno foi registrado, apesar da visibilidade ter sido prejudicada pela Lua cheia.", "titulo_pt": "Observatório brasileiro registra chuva de meteoros delta aquáridas do sul", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 85108, "titulo": "Moonquakes could reveal ice buried beneath lunar south polar craters", "url": "https://phys.org/news/2026-07-moonquakes-reveal-ice-beneath-lunar.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A detecção de vibrações específicas na superfície da lua poderia revelar a presença de água congelada nas crateras polares sulares.", "titulo_pt": "Sismos lunares podem indicar gelo escondido sob as crateras polares sulares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 84737, "titulo": "Bioéster de quinoa pode rejuvenescer a pele em até 16 anos, diz estudo", "url": "https://www.cnnbrasil.com.br/lifestyle/bioester-de-quinoa-pode-rejuvenescer-a-pele-em-ate-16-anos-diz-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-31T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que o bioativo de quinoa pode promover o rejuvenescimento molecular da pele. O produto poderia potencialmente fazer a pele parecer até 16 anos mais jovem.", "titulo_pt": "Bioativo de quinoa pode rejuvenescer a pele em até 16 anos, sugere estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 85109, "titulo": "Laying odds on the potential for Martian water near future landing zones", "url": "https://phys.org/news/2026-07-laying-odds-potential-martian-future.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está planejando enviar astronautas à superfície de Marte, e o Planetary Science Institute (PSI) está criando mapas globais que identificam onde se encontra a água subsuperficial no equador do planeta. Esses mapas serão usados para determinar quais missões e ferramentas são necessárias para aumentar a precisão dessas localizações.", "titulo_pt": "Cinco apostas sobre a presença de água em zonas próximas ao futuro assentamento marciano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85110, "titulo": "Art festivals may revive island communities when tourism stays within local limits", "url": "https://phys.org/news/2026-07-art-festivals-revive-island-communities.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Festivais de arte localizados dentro dos limites de recursos e capacidades sociais das comunidades insulares anfitriãs podem contribuir para a revitalização sustentável a longo prazo dessas comunidades.", "titulo_pt": "Festivais de arte podem reviver comunidades insulares quando o turismo se mantém dentro dos limites locais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85131, "titulo": "NASA to Host Florida Event Celebrating American Air, Space Leadership", "url": "https://www.nasa.gov/news-release/nasa-to-host-florida-event-celebrating-american-air-space-leadership/", "fonte_id": "nasa_news", "data_pub": "2026-07-31T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizará uma conferência de imprensa às 14h30 de EST no dia 14 de agosto, na base espacial Kennedy da Flórida. A conferência apresentará detalhes sobre um novo evento que ocorrerá mais tarde na mesma localização.", "titulo_pt": "NASA realizará evento na flórida para comemorar liderança americana em aviação e espaço", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 85111, "titulo": "Smarter fish farms could cut electricity use and CO₂ while keeping fish safe", "url": "https://phys.org/news/2026-07-smarter-fish-farms-electricity-safe.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sistemas de aquicultura recirculantes (RAS) estão ganhando atenção como tecnologia sustentável que pode reduzir o uso d'água, controlar as condições de criação e diminuir os impactos ambientais filtrando e reutilizando a água. No entanto, essas instalações dependem de bombas, filtros, aeradores e outros equipamentos que são frequentemente operados continuamente ou segundo escalões fixos, resultando em consumo significativo de energia para manter condições de criação estáveis.", "titulo_pt": "Aquicultura mais inteligente poderia reduzir o uso de energia e emissões de CO₂ enquanto mantém os peixes seguros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85112, "titulo": "A new genetic tool helps researchers uncover the logic of gene regulation", "url": "https://phys.org/news/2026-07-genetic-tool-uncover-logic-gene.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os genomas humanos contêm mais de 20.000 genes, mas apenas uma fração desses são ativados em um determinado momento e célula. Pesquisadores do Grupo Krebs da EMBL Heidelberg desenvolveram uma abordagem experimental inovadora para entender como as células decidem qual gene ativar e quando.", "titulo_pt": "Uma nova ferramenta genética ajuda os pesquisadores a decifrar a lógica de regulação genética", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85159, "titulo": "'The End of Oak Street: Could JJ Abrams' new 'Twilight Zone meets Jurassic Park' movie be the sleeper hit of the summer?", "url": "https://www.space.com/entertainment/the-end-of-oak-street-could-jj-abrams-new-twilight-zone-meets-jurassic-park-movie-be-the-sleeper-hit-of-the-summer", "fonte_id": "space_com", "data_pub": "2026-07-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'The End of Oak Street', dirigido por JJ Abrams, mistura elementos de 'The Twilight Zone' e 'Jurassic Park', com influências de 'A Quiet Place'. Poderia se tornar o grande sucesso do verão.", "titulo_pt": "O fim da rua Oak: 'Twilight Zone' mece Jurassic Park' poderia ser o grande sucesso do verão?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 85129, "titulo": "Sending repurposed Mars rover to the moon could cost more than $1 billion", "url": "https://spacenews.com/sending-repurposed-mars-rover-to-the-moon-could-cost-more-than-1-billion/", "fonte_id": "spacenews", "data_pub": "2026-07-31T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A conversão de um modelo engenheiro de rover do Marte em um verdadeiro rover lunar poderia custar mais de 1 bilhão de dólares à NASA, uma estimativa rejeitada fortemente pelo administrador da agência.", "titulo_pt": "Converter rover do marte para o mês pode custar mais de 1 bilhão", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 85113, "titulo": "From research to policy: Study turns EU wildfire assessments into a tool for better governance", "url": "https://phys.org/news/2026-07-policy-eu-wildfire-tool.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos estão transformando as avaliações de incêndios florestais na União Europeia em ferramentas para melhor governança. As mudanças climáticas, os ajustes no uso do solo e as pressões socioeconômicas estão transformando os incêndios florestais em um risco sistêmico complexo que afeta diversos aspectos como ecossistemas, infraestrutura, saúde pública, recursos hídricos, patrimônio cultural e meios de subsistência rurais. Apesar das investidas significativas nas capacidades de combate a incêndios, os incêndios florestais são projetados para se tornar mais frequentes, extremos e devastadores.", "titulo_pt": "De pesquisa para políticas: estudos transformam avaliações de incêndios florestais na ue em ferramentas para melhor governança", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85114, "titulo": "Newly discovered mechanism protects DNA during cell division", "url": "https://phys.org/news/2026-07-newly-mechanism-dna-cell-division.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante a divisão celular, o DNA precisa ser precisamente copiado e distribuído entre duas novas células. No entanto, em alguns casos, os cromossomos não se separam completamente, deixando tramas finas de DNA conhecidas como pontes de DNA que conectam as duas novas células.", "titulo_pt": "Novo mecanismo descoberto protege o DNA durante a divisão celular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85115, "titulo": "Isotopic analysis may help police combat illegal timber trade in Amazon", "url": "https://phys.org/news/2026-07-isotopic-analysis-police-combat-illegal.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A análise isotópica do madeireamento amazônico pode auxiliar na identificação de madeira ilegalmente cortada. Ao analisar a proporção de isôtopos de elementos como oxigênio, carbono, nitrogênio e estrôncio nos lenhos das árvores, os pesquisadores podem determinar com maior precisão a região de origem da madeira.", "titulo_pt": "Análise isotópica pode ajudar na combate ao comércio ilegal de madeireamento na amazônia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85116, "titulo": "Homing in on the X-ray sky with eROSITA's second data release", "url": "https://phys.org/news/2026-07-homing-ray-sky-erosita.html", "fonte_id": "phys_org", "data_pub": "2026-07-31T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A consortium alemão eROSITA-DE, liderado pelo Instituto Max Planck para Física Extraterrestre (MPE) e que inclui a Universidade de Bonn, lançou sua segunda grande liberação pública de dados, chamada 'eROSITA Data Release 2' (DR2).", "titulo_pt": "Apoio ao céu x com o segundo conjunto de dados públicos do erosita", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 84653, "titulo": "Sonda japonesa realiza sobrevoo mais próximo de um asteroide já registrado", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/sonda-japonesa-realiza-sobrevoo-mais-proximo-de-um-asteroide-ja-registrado.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-31T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma sonda japonesa realizou um sobrevoo a 400 metros de um asteroide próximo da Terra, estabelecendo o recorde de aproximação mais próxima já registrada em uma missão desse tipo.", "titulo_pt": "Sonda japonesa realiza sobrevoo mais próximo de um asteroide já registrado", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 85132, "titulo": "NASA’s Newest Wind Tunnel Opens at NASA Langley", "url": "https://www.nasa.gov/image-article/nasas-newest-wind-tunnel-opens-at-nasa-langley/", "fonte_id": "nasa_news", "data_pub": "2026-07-31T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No dia 31 de julho de 2026, a NASA e autoridades do governo da Virgínia inauguraram o primeiro novo túnel de vento significativo da agência em mais de 40 anos, o Facility for Flight Dynamics Research na NASA's Langley Research Center em Hampton, Virgínia. A moderna instalação vai apoiar pesquisas e desenvolvimento tecnológico que avançarão os objetivos aeronáuticos, de exploração e científicos da NASA.", "titulo_pt": "NASA abre novo túnel de vento na Langley", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 85144, "titulo": "Heritage Bookbinding Elements Transform in Contemporary Sculptures by Adelene Koh", "url": "https://www.thisiscolossal.com/2026/07/adelene-koh-bookbinding-paper-sewing-sculpture-loewe-craft-prize/", "fonte_id": "colossal", "data_pub": "2026-07-31T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adelene Koh transforma elementos subestimados da encadernação de livros em esculturas contemporâneas. O artigo originalmente apareceu no Colossal.", "titulo_pt": "Elementos de encadernação herdados transformam-se em esculturas contemporâneas por Adelene Koh", "veiculo": "Colossal (arte)", "pais": "EUA", "classe": "B"}, {"id": 85139, "titulo": "6 Books We’re Looking Forward to in August", "url": "https://www.artnews.com/list/art-in-america/columns/6-books-sargent-depraved-how-to-enter-art-world-1234794048/", "fonte_id": "artnews", "data_pub": "2026-07-31T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este mês, as publicações abordarão a vida oculta de John Singer Sargent, questionarão questões existenciais sobre o arte e guiarão os leitores pela complexidade do mundo artístico.", "titulo_pt": "6 Livros que estamos aguardando em agosto", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 84659, "titulo": "'Homem-Aranha' e Steven Spielberg: o que ver na TV e no streaming neste sábado", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/homem-aranha-e-steven-spielberg-o-que-ver-na-tv-e-no-streaming-neste-sabado.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-31T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Steven Spielberg retorna ao gênero ficção científica com a produção 'Dia D', que estrela Emily Blunt, Josh O'Connor, Colin Firth e Colman Domingo.", "titul
