<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "30/07/2026 19:50", "stats": {"noticias_novas": 594, "resumos_gerados": 233}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A campanha de Flávio Bolsonaro enfrenta novos desafios com a mudança no comando da equipe de comunicação, que agora será liderada por Duda Lima, marqueteiro do presidente Jair Bolsonaro. Além disso, o ministro André Mendonça autorizou uma investigação contra Fábio Luís Lula da Silva (Lulinha), suspeito de tráfico de influência no Ministério da Saúde, em resposta a críticas da Polícia Federal. O Partido Progressista (PP) se opõe à aliança entre Tereza Cristina e Flávio Bolsonaro para a vice-presidência, enquanto o PSD anuncia Aldo Rebelo como coordenador político de campanha do candidato Ronaldo Caiado. A nota de crédito do Brasil deve ser reavaliada apenas em 2027, segundo a agência Moody's, após as eleições presidenciais e legislativas.", "mundo": "Milhares de migrantes entraram recentemente na cidade espanhola de Ceuta, vindo do Marrocos, levando a tensões políticas e debates sobre migração. Em um incidente grave, o presidente ucraniano Volodymyr Zelensky acusou a Rússia de usar um míssil norte-coreano em uma operação que resultou na morte de cinco membros da mesma família. A Venezuela começou a demolição de prédios danificados por um terremoto, causando indignação entre os habitantes. O governo do Paraguai convocou o embaixador do Brasil após declarações do presidente Lula sobre a Guerra do Paraguai, levantando preocupações no país. Além disso, Israel afirmou que destruiu túneis do Hezbollah na região de Beaufort no Líbano com a utilização de 700 toneladas de explosivos.\n\nAs tensões entre os Estados Unidos e o Irã continuam a aumentar, com ambas as partes realizando testes de mísseis. A Arábia Saudita condenou um ataque com drones que causou incêndios em duas embarcações no porto de Damietta, no Egito, reforçando a escalada regional. O ministro da Segurança Nacional de Israel, Itamar Ben Gvir, anunciou o uso de crocodilos-nilo como guardas prisionais para presos palestinos políticos, em um novo capítulo do que vem sendo chamado de 'guerra animal' israelense. As tensões entre os EUA e o Irã aumentaram com a possibilidade de envio de lançadores de mísseis chineses ao Irã, sugerindo que a China pode se envolver mais no conflito. A Arábia Saudita anunciou planos para uma coalizão marítima internacional de defesa em resposta aos ataques dos hutis no Iêmen e à crescente hostilidade com o Irã. Além disso, um memorando obtido pela WIRED associa cyberataques contra utilities de água do Minnesota ao Teerã, reforçando a presença iraniana na ciberguerra. O conflito na Ucrânia continua com ataques aéreos russos que deixaram nove mortos, incluindo três crianças, e um fabricante de drones norte-americano em Kyiv foi alvo de um míssil russo, sendo a primeira vez que Moscou atinge uma empresa americana durante o conflito.", "economia": "O Ibovespa registrou uma forte valorização nesta quinta-feira após a divulgação de dados econômicos nos Estados Unidos. O mercado percebeu um interesse maior do capital estrangeiro na bolsa brasileira, o que contribuiu para o fortalecimento das ações. Outro destaque foi a arrecadação federal, que cresceu 7,7% em junho, somando R$ 264,4 bilhões. Isso representa um aumento real de 7,7% em comparação com o mesmo mês do ano anterior. No entanto, o juro médio cobrado das famílias atingiu 64% ao ano no mesmo período, o maior patamar em quase dez anos. Além disso, a Caixa Econômica Federal pagou o Bolsa Família de julho para beneficiários com NIS final 9 nesta quinta-feira (30), antecipado para alguns municípios em situação de emergência ou calamidade pública nos estados do Amazonas, Paraíba, Paraná, Rio Grande do Norte, Roraima e Sergipe.", "tecnologia": "A Apple projeta um crescimento mais lento devido ao investimento pesado em inteligência artificial (IA), enquanto concorrentes como a Amazon aumentam suas despesas nesse campo. A OpenAI reduziu os preços de seus modelos de IA para competir com versões chinesas, e a empresa xAI, liderada por Elon Musk, enfrenta acusações relacionadas à ferramenta Grok, envolvida em disputas sobre a produção de deepfakes. A Amazon planeja aumentar seus gastos de capital para US$ 220 bilhões este ano, devido a maiores custos de memória e investimentos adicionais em IA. As vendas de iPhone e Mac da Apple aumentaram no terceiro trimestre, com crescimentos de 22% e 29%, respectivamente, apesar de uma escassez global de RAM afetar fabricantes de dispositivos. A LinkedIn introduziu um botão que permite aos usuários reportar conteúdo que parece ser resultado de IA, como forma de reduzir o volume desses posts na plataforma. O Google afirmou que corrigiu mais bugs no Chrome em junho do que nos últimos dois anos, graças ao uso de inteligência artificial. A empresa Unitree Robotics planeja lançar sua oferta inicial de ações na Bolsa de Shanghai na próxima semana, intensificando o conflito entre os Estados Unidos e China na área da robótica.", "ciencia": "Os cientistas enfrentam diversos desafios, mas também realizam avanços significativos na compreensão da natureza. Um estudo recente publicado no Scientific Reports indica que a probabilidade de incêndios florestais na Europa do Sul dobrou desde os anos 1980, devido ao clima mais quente e seco, levando autoridades locais a alertarem para o risco crescente. Em outro desenvolvimento, pesquisadores da Universidade de Maryland desenvolveram uma nova abordagem para tratar picadas de serpentes venenosas utilizando proteínas do próprio veneno das cobra-torpedo-ocidental. Eles comprovaram em laboratório que essas combinações específicas de proteínas são 10 vezes mais potentes que os antivenenos atuais. Além disso, a Administração Federal de Aviação (FAA) dos Estados Unidos considera reduzir as avaliações ambientais para acelerar os lançamentos e reentries de naves espaciais em resposta à crescente demanda, o que pode ter implicações significativas na indústria espacial. Estes avanços científicos e as preocupações climáticas representam importantes passos no entendimento e enfrentamento dos desafios ambientais e médicos contemporâneos.", "cultura": "As últimas notícias sobre cultura abrangem diversos aspectos do setor, desde a literatura até a arquitetura. A morte de Gilberto Cárdenas, colecionador latino-americano de arte e estudioso dos estudos latino-americanos, é um evento significativo que destaca sua contribuição para o campo da arte latino-americana. Em seguida, a dissolução do Coro Nacional de Niños no Brasil, anunciada pelo governo, marca um momento importante na política cultural do país. No cinema, Wagner Moura confirmou sua participação no próximo filme da saga 'Onze Homens e Um Segredo', dirigido por Bradley Cooper, enquanto a série 'As Patricinhas de Beverly Hills' ganha uma sequência na plataforma de streaming Paramount+. O livro 'Escreviventes', uma conversa entre Conceição Evaristo e Eliana Alves Cruz sobre literatura, memória e racismo, celebra o aniversário do autor Ignácio de Loyola Brandão. Finalmente, o Guggenheim Abu Dhabi, projetado pelo arquiteto Frank Gehry, está programado para abrir suas portas em dezembro, trazendo um importante museu de arte moderna e contemporânea ao Oriente Médio.", "sociedade": "O Brasil enfrenta diversos desafios sociais e legais. Um policial civil foi morto por sua filha após uma discussão com a esposa, no local onde ele estava desarmado, destacando o risco doméstico. Em outro caso, um ex-guarda de segurança que trabalhou em Hong Kong foi condenado a quatro meses de prisão por amarrar e jogar um gato no lixo, refletindo questões sobre a proteção animal. A justiça brasileira obrigou o INSS a atender entregadores acidentados durante o horário de trabalho, fortalecendo medidas previdenciárias para esses profissionais. No Chile, a participação feminina nos diretórios bancários permanece baixa e há uma diferença salarial entre homens e mulheres reconhecida. Em São Paulo, cerca de 17 mil clientes ainda estão sem luz após um vendaval que causou danos significativos na capital. O relatório do Observatório Infância apontou falhas no cuidado com a primeira infância, enquanto o Instituto Empreende no Zap ofereceu vagas gratuitas para um curso de empreendedorismo feminino visando aumentar os lucros durante a alta temporada comercial.", "meio_ambiente": "A Alemanha registrou quase 10.000 mortes relacionadas ao calor, de acordo com o órgão de saúde do país. A maioria das vítimas eram idosos acima de 75 anos. Em todo o continente europeu, as condições climáticas extremas estão agravando incêndios florestais, com relatos de fogueiras selvagens em países como Espanha e Grécia, onde dois bombeiros morreram durante os combates aos incêndios. A seca atinge regiões como o centro da França, com riachos secando e criando um cenário desértico. No entanto, apesar das preocupações com as mudanças climáticas, pesquisas indicam que corrigir percepções incorretas sobre ação climática pode não necessariamente aumentar o comprometimento com medidas ambientais.", "direitos_humanos": "Um relatório sobre direitos humanos relatou um incidente fatal envolvendo um homem palestino. A Rússia, por outro lado, incluiu Pavel Durov, fundador do Telegram, na lista de 'terroristas e extremistas'. Em outra notícia, centenas de migrantes invadiram a região espanhola de Ceuta, levando o presidente do enclave a considerar a situação uma emergência humanitária. Além disso, um homem taiwanês foi condenado a mais de 12 anos de prisão por tráfico de cocaína para Hong Kong, no último caso julgado pelo juiz Wilson Chan Ka-shun antes de sua aposentadoria antecipada. Estes eventos refletem diversos aspectos dos direitos humanos em diferentes partes do mundo, desde violência e justiça criminal até questões migratórias e liberdades individuais."}, "resumo_do_dia": {"politica_nacional": [{"id": 82552, "titulo": "Entenda a investigação da PF envolvendo Lulinha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/entenda-a-investigacao-da-pf-envolvendo-lulinha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF André Mendonça autorizou a abertura de um inquérito para investigar suspeitas envolvendo o empresário Fábio Luís Lula da Silva, conhecido como Lulinha. A investigação foi solicitada pela Polícia Federal.", "titulo_pt": "Entenda a investigação do stf envolvendo Lulinha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 82553, "titulo": "Augusto Cury diz que convidou Zema para ser seu vice", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/augusto-cury-diz-que-convidou-zema-para-ser-seu-vice.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O escritor Augusto Cury, pré-candidato à Presidência pelo Avante, telefonou para Romeu Zema do Novo convidando-o para ser seu vice.", "titulo_pt": "Augusto Cury diz ter convidado Zema para ser seu vice", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 82594, "titulo": "Inquérito contra Lulinha é resposta da PF às críticas da oposição e dentro do próprio STF", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/07/30/inquerito-contra-lulinha-e-resposta-da-pf-as-criticas-da-oposicao-e-dentro-do-proprio-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal abriu um inquérito para investigar suspeitas de tráfico de influência envolvendo Fábio Luiz Lula da Silva, conhecido como Lulinha. A medida foi tomada em resposta a críticas recebidas e autorizada pelo ministro André Mendonça do STF.", "titulo_pt": "Inquérito contra Lulinha é resposta à PF às críticas da oposição e dentro do próprio STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 82644, "titulo": "Cúpula do PP rachaça possibilidade de Tereza Cristina ser vice de Flávio", "url": "https://www.metropoles.com/colunas/igor-gadelha/cupula-do-pp-rachaca-possibilidade-de-tereza-cristina-ser-vice-de-flavio", "fonte_id": "metropoles", "data_pub": "2026-07-30T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A liderança do PP questiona a intenção de Tereza Cristina se aliar a Flávio como vice, reafirmando a postura neutra da legenda. A cúpula do partido não compreende o movimento e mantém sua decisão.", "titulo_pt": "Liderança do PP desentende aliança de Tereza Cristina com Flávio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 82554, "titulo": "PGR pede para arquivar inquérito de Zanin contra 3º ministro do STJ em caso de venda de decisões", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/pgr-pede-para-arquivar-inquerito-de-zanin-contra-3o-ministro-do-stj-em-caso-de-venda-de-decisoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República pediu o "}, {"id": 82558, "titulo": "PSD anuncia ex-ministro Aldo Rebelo como coordenador político de campanha de Caiado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/psd-anuncia-ex-ministro-aldo-rebelo-como-coordenador-politico-de-campanha-de-caiado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSD nomeou Aldo Rebelo, ex-ministro, como coordenador político da campanha de Ronaldo Caiado à Presidência da República. Esta decisão foi anunciada na quinta-feira (30).", "titulo_pt": "PSD anuncia Aldo Rebelo como coordenador político de campanha de Caiado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 82317, "titulo": "US and Iran trade missile barrages as war drags on", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/31/2003861687", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e Irã trocaram lançamentos de mísseis, com a guerra prolongada se estendendo.", "titulo_pt": "EUA e Irã trocam lançamentos de mísseis enquanto guerra persiste", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 82742, "titulo": "EXCLUSIVO: Erai Maggi lidera grupo do agro em negociação com presidente da Bolívia", "url": "https://www.infomoney.com.br/business/exclusivo-erai-maggi-lidera-grupo-do-agro-em-negociacao-com-presidente-da-bolivia/", "fonte_id": "infomoney", "data_pub": "2026-07-30T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma delegação composta por mais de 20 jatos executivos está negociando com o presidente da Bolívia, Rodrigo Paz Pereira, e ministros na cidade de San Ignacio de Velasco. O grupo agroindustrial liderado pela Erai Maggi discute a construção de uma rodovia de 129 km que poderia redefinir a logística de _pub": "2026-07-30T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um economista da FAO alerta que a América Latina enfrentará um El Niño intenso entre outubro e dezembro, o que pode agravar problemas relacionados à falta de fertilizantes e sementes devido a conflitos no Golfo de Omã.", "titulo_pt": "América Latina deve enfrentar El Niño intenso, alerta representante da ONU", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 82827, "titulo": "Thousands of Migrants Enter Ceuta, a Spanish Enclave, From Morocco", "url": "https://www.nytimes.com/2026/07/30/world/europe/spain-morocco-ceuta-migrants.html", "fonte_id": "nyt_world", "data_pub": "2026-07-30T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de migrantes entraram na Ceuta, um pedaço de terra de seis milhas de comprimento no norte da costa do Marrocos sob governança espanhola há séculos. Essas chegadas têm acentuado tensões políticas.", "titulo_pt": "Milhares de migrantes entram na Ceuta, um Enclave espanhol no marrocos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 82857, "titulo": "Australia news live: attorneys general meet to reform working with children checks; leaders gather for Garma festival", "url": "https://www.theguardian.com/australia-news/live/2026/jul/31/australia-news-live-working-with-children-check-garma-festival-anthony-albanese-labor-angus-taylor-coalition-one-nation-pauline-hanson-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-07-30T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados-gerais se reúnem em Darwin para discutir a nacionalização dos check de trabalho com crianças, após denúncias sérias sobre falhas de segurança no setor de creches. Uma pesquisa da Associação Dental Australiana revela que três quartos dos 25 mil entrevistados enfrentam barreiras ao acessar cuidados odontológicos.", "titulo_pt": "Austrália: advogados-gerais se reúnem para reformar check de trabalho com crianças; pesquisa mostra que 75% dos australianos têm dificuldades para acessar atendimento dental", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 83011, "titulo": "Opinion: Ben Gvir's crocodiles are the latest weapon in Israel's animal warfare on Palestinians", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/opinion-ben-gvirs-crocodiles-are-latest-weapon-israels-animal-warfare", "fonte_id": "middle_east_eye", "data_pub": "2026-07-30T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Segurança Nacional de Israel, Itamar Ben Gvir, anunciou o uso de crocodilos-nilo como guardas prisionais para presos palestinos políticos. O programa será implementado no maior presídio israelense, Ketziot, localizado na Deserto do Negev.", "titulo_pt": "Opinião: crocódilos de ben Gvir são a última arma animal em Israel contra os palestinos", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 82694, "titulo": "Análise: Ajuda da China ao Irã aumentaria custo da guerra para os EUA", "url": "https://www.cnnbrasil.com.br/internacional/analise-ajuda-da-china-ao-ira-aumentaria-custo-da-guerra-para-os-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fontes da Reuters sugerem que a China pode enviar lançadores de mísseis ao Irã. Esta possibilidade é avaliada como tendo impacto no conflito entre os EUA e o Irã.", "titulo_pt": "Análise: ajuda da China ao Irã aumentaria custo da guerra para os EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 82608, "titulo": "Após fala de Lula, governo paraguaio convoca embaixador do Brasil", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-07/apos-fala-de-lula-governo-paraguaio-convoca-embaixador-do-brasil", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-07-30T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores do Paraguai convocou o embaixador do Brasil para uma conversa sobre declarações de Lula sobre a Guerra do Paraguai. O evento na semana passada levantou preocupações no Paraguai, que conhece o conflito como Guerra da Tríplice Aliança.", "titulo_pt": "Após fala de Lula, governo paraguaio convoca embaixador do Brasil", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 82563, "titulo": "Venezuela começa a demolir prédios danificados por terremotos", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/venezuela-comeca-a-demolir-predios-danificados-por-terremotos.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-30T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Venezuela iniciou a demolição de prédios danificados por um terremoto recente, causando indignação na população. A agência de notícias AFP relatou o início das operações nesta quinta-feira (30).", "titulo_pt": "Venezuela inicia demolição de prédios danificados por terremotos", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 83012, "titulo": "Iraq says it neither approved nor had prior knowledge of US-Saudi strikes", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iraq-says-it-neither-approved-nor-had-prior-knowledge-us-saudi-strikes", "fonte_id": "middle_east_eye", "data_pub": "2026-07-30T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Iraque afirmou que não aprovou nem tinha conhecimento prévio das operações de ataque realizadas pela Arábia Saudita e os Estados Unidos no território iraquiano. As operações foram contra grupos apoiados pelo Irã, responsáveis por ataques com drones contra instalações petroleiras sauditas.", "titulo_pt": "Iraque afirma não ter aprovado nem conhecido operações de ataque dos EUA e arábia saudita", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 82852, "titulo": "Meloni evalúa suspender la libre circulación de personas con España por la crisis de migrantes marroquíes en Ceuta", "url": "https://www.lanacion.com.ar/el-mundo/meloni-evalua-suspender-la-libre-circulacion-de-personas-con-espana-por-la-crisis-de-migrantes-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T21:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A primeira-ministra italiana, Meloni, considera suspender a livre circulação de pessoas com a Espanha devido à crise migratória marroquina em Ceuta. Ela expressou disposição para desativar o espaço Schengen.", "titulo_pt": "Meloni avalia suspender circulação livre de pessoas com a Espanha por crise migratória marroquina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 83044, "titulo": "Netanyahu, 'abbiamo distrutto i tunnel di Hezbollah nella zona di Beaufort in Libano'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/netanyahu-abbiamo-distrutto-i-tunnel-di-hezbollah-nella-zona-di-beaufort-in-libano_896a90ca-e7b6-4ac4-ae7a-a4a015c63462.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T21:22:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Netanyahu afirmou que Israel destruiu os túneis do Hezbollah na região de Beaufort no Líbano com a utilização de 700 toneladas de explosivos.", "titulo_pt": "Netanyahu: 'destruímos os túneis do Hezbollah na zona de Beaufort no líbano'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 83078, "titulo": "A Leaked Memo Ties Cyberattacks on Minnesota Water Utilities to Iran", "url": "https://www.wired.com/story/a-leaked-memo-ties-cyberattacks-on-minnesota-water-utilities-to-iran/", "fonte_id": "wired", "data_pub": "2026-07-30T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um memorando obtido pela WIRED, emitido pelo grupo de compartilhamento de informações das e os últimos dois anos, graças ao uso de inteligência artificial. Especialistas alertaram há dois anos que empresas como Microsoft e agora Google estão encontrando e corrigindo um número exponencial de bugs em seus produtos, graças à utilização de LLMs e ferramentas de IA.", "titulo_pt": "Google diz ter corrigido mais bugs no Chrome em junho do que nos últimos dois anos, graças ao AI", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 83068, "titulo": "LinkedIn actually adds a ‘seems like AI slop’ button", "url": "https://www.theverge.com/ai-artificial-intelligence/973384/linkedin-seems-like-ai-slop-button", "fonte_id": "the_verge", "data_pub": "2026-07-30T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LinkedIn introduziu um botão que permite aos usuários reportar conteúdo que parece ser resultado de inteligência artificial, como forma de reduzir o volume desses posts no plataforma. Este é parte de uma série de atualizações para melhorar a qualidade do conteúdo.", "titulo_pt": "Linkedin adiciona botão para reportar conteúdo que parece ser AI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 83074, "titulo": "Florida plans to build air taxi pads using $200M intended for EV chargers", "url": "https://techcrunch.com/2026/07/30/florida-plans-to-build-air-taxi-pads-using-200m-intended-for-ev-chargers/", "fonte_id": "techcrunch", "data_pub": "2026-07-30T18:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Flórida pretende utilizar fundos federais destinados a carregadores de veículos elétricos (VE) para construir plataformas para táxis aéreos que conectem campos de golfe, edifícios residenciais luxuosos e aeroportos.", "titulo_pt": "Flórida planeja construir pílulas de táxi aéreo usando fundos de carregadores de ve", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 83039, "titulo": "Mark Zuckerberg is becoming the king of the ‘side quest’", "url": "https://www.ft.com/content/6d206b85-bc50-4c89-973b-f18cd84e2a15?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T18:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta está desenvolvendo uma variedade de produtos fora da sua zona de conforto, e essas iniciativas secundárias apresentam altos riscos.", "titulo_pt": "Mark Zuckerberg está se tornando o rei das 'missões paralelas'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 82667, "titulo": "Apple tem lucro acima da expectativa e reduz investimentos na contramão das 'techs'", "url": "https://exame.com/invest/mercados/apple-tem-lucro-acima-da-expectativa-e-reduz-investimentos-na-contramao-das-techs/", "fonte_id": "exame", "data_pub": "2026-07-30T18:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lucro da Apple superou as expectativas dos analistas no segundo trimestre, com os iPhones contribuindo significativamente para o aumento nas vendas. No entanto, a empresa reduziu seus investimentos em comparação com o mesmo período do ano anterior.", "titulo_pt": "Apple bate na expectativa com lucro e reduz investimentos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 83075, "titulo": "LinkedIn adds a button to report AI-generated ‘slop’", "url": "https://techcrunch.com/2026/07/30/linkedin-adds-a-button-to-report-ai-generated-slop/", "fonte_id": "techcrunch", "data_pub": "2026-07-30T18:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A LinkedIn introduziu novas maneiras de reduzir posts de baixa qualidade gerados por IA, incluindo uma opção para relatar conteúdo que parece ser 'lixo' produzido pela IA. A empresa também está substituindo sua própria função de escrita automatizada por um ferramenta de revisão.", "titulo_pt": "Linkedin adiciona botão para denunciar postagens ai de baixa qualidade", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 83083, "titulo": "Turkey confronts growing wildfires on tourist coasts", "url": "https://phys.org/news/2026-07-turkey-wildfires-tourist-coasts.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de bombeiros turcos combatem incêndios florestais que se espalham perto das principais regiões turísticas da costa mediterrânea do país.", "titulo_pt": "Turquia enfrenta incêndios em áreas turísticas da costa mediterrânea", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83084, "titulo": "Uncovering the structure of the poxvirus 'portal complex'", "url": "https://phys.org/news/2026-07-uncovering-poxvirus-portal-complex.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Poxvírus têm uma longa história na doença humana e na medicina, incluindo a criação da primeira vacina contra varíola. Embora a varíola tenha sido erradicada, os cientistas ainda não compreendem completamente como esses vírus infectam e se replicam dentro das células humanas. As recentes explosões de mpox destacam a urgência de uma melhor compreensão da biologia dos poxvírus.", "titulo_pt": "Desvendando a estrutura do complexo 'portal' dos poxvírus", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82916, "titulo": "How a super El Niño affects the global climate", "url": "https://www.vox.com/videos/497257/how-super-el-nino-affects-global-climate", "fonte_id": "vox", "data_pub": "2026-07-30T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 11 de junho, a NOAA emitiu um aviso sobre El Niño após temperaturas no Oceano Pacífico Equatorial permanecerem acima da média por vários meses. Este evento pode ser extraordinário.", "titulo_pt": "Como um super El Niño afeta o clima global", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 83085, "titulo": "Likelihood of wildfires in Southern Europe has doubled since the 80s, study shows", "url": "https://phys.org/news/2026-07-likelihood-wildfires-southern-europe-80s.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo publicado na Scientific Reports indica que os dias de verão propícios para a ignição, intensidade e extensão das chamas rurais dobraram nas grandes partes da Península Ibérica, França, Itália e Grécia desde 1981. Embora o número de incêndios tenha diminuído na região desde os anos 1980, a pesquisa sugere que clima mais quente e seco está aumentando o risco de incêndio florestal no sul da Europa.", "titulo_pt": "Probabilidade de incêndios florestais no sul da Europa dobrou desde os anos 1980", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83086, "titulo": "Scientists solve mystery of how muscle cells grow and stay healthy", "url": "https://phys.org/news/2026-07-scientists-mystery-muscle-cells-stay.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ciêntistas desvendaram o mistério sobre como as células musculares se formam e mantêm sua função no nível molecular. Esses achados podem auxiliar na criação de tratamentos para doenças musculares, incluindo a cardiomiopatia dilatada, uma das principais causas de insuficiência cardíaca.", "titulo_pt": "Cientistas resolvem mistério sobre como as células musculares crescem e permanecem saudáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83087, "titulo": "Southern Europe 'becoming more flammable' in hotter climate, experts say", "url": "https://phys.org/news/2026-07-southern-europe-flammable-hotter-climate.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo revelou que a Europa do Sul está se tornando mais propensa a incêndios, com o número de dias de verão favoráveis a condições extremas de fogo dobrar desde 1981.", "titulo_pt": "Europa do sul se torna mais propensa a incêndios em clima mais quente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83088, "titulo": "Quantum spin effects may enhance one-way electrical transport in chiral magnets", "url": "https://phys.org/news/2026-07-quantum-effects-electrical-chiral-magnets.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos realizados por pesquisadores do Science Tokyo demonstraram que as flutuações quânticas influenciam o transporte elétrico direcional em sistemas magnéticos espiralizados, com a corrente elétrica fluindo de maneira diferente dependendo da direção. Essa pesquisa também revelou uma dependência logarítmica da temperatura nos baixos níveis, oferecendo novas perspectivas sobre o transporte de elétrons em materiais magnéticos.", "titulo_pt": "Efeitos do spin quântico podem melhorar o transporte elétrico unidirecional em magnéticos espiralizados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83089, "titulo": "Study investigates how seven different Central European tree species respond to metal-contaminated soils", "url": "https://phys.org/news/2026-07-central-european-tree-species-metal.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa examina como sete diferentes espécies de árvores da Europa Central respondem a solos contaminados por metais pesados, como zinco, cromo, cobre e chumbo. O objetivo é identificar maneiras de gerenciar esses locais para prevenir a contaminação do subsolo ou dos ecossistemas adjacentes.", "titulo_pt": "Estudo investiga como sete espécies de árvores da Europa Central respondem a solos contaminados por metais pesados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83090, "titulo": "Flash droughts can pull 'alarming' amounts of moisture from the landscape and intensify wildfires", "url": "https://phys.org/news/2026-07-droughts-alarming-amounts-moisture-landscape.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flash droughts podem extrair grandes quantidades de umidade do solo e intensificar incêndios florestais. Droughts severas geralmente precedem as devastadoras chamas, que necessitam de vegetação seca e terrenos assoreados para se espalhar.", "titulo_pt": "Flash droughts podem extrair grandes quantidades de umidade do solo e intensificar incêndios florestais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83091, "titulo": "Redistributing sunlight boosts algae biomass productivity sixfold", "url": "https://phys.org/news/2026-07-redistributing-sunlight-boosts-algae-biomass.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A redistribuição da luz solar aumenta a produtividade do biomassa de algas seis vezes. As algas estão sendo cada vez mais exploradas como fábricas vivas sustentáveis que podem converter luz solar e dióxido de carbono em combustíveis renováveis, plásticos, medicamentos e outros produtos valiosos.", "titulo_pt": "Redistribuição da luz solar aumenta a produtividade do biomassa de algas seis vezes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82602, "titulo": "Hora de voltar aos livros de colorir", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/07/hora-de-voltar-aos-livros-de-colorir.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-30T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor decidiu escrever e ilustrar seus próprios livros didáticos, simplificando as ilustrações para enfatizar os conceitos fundamentais, ao invés de detalhes técnicos. O objetivo é transmitir insights essenciais que costumam ficar escondidos em volumes de informações.", "titulo_pt": "Hora de voltar aos livros de colorir", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 83092, "titulo": "ATPγS recycling opens cheaper pathways to increased drug stability", "url": "https://phys.org/news/2026-07-atps-recycling-cheaper-pathways-drug.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo de reciclagem do ATPγS pode abrir caminhos mais econômicos para aumentar a estabilidade dos medicamentos. Este processo envolve a adição e remoção de fósforo, similar ao mecanismo de fosfolipilação e desfosfolipilação que ocorre nas células.", "titulo_pt": "Reciclagem do atpγs abre caminhos mais econômicos para maior estabilidade de medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83093, "titulo": "Italy's Po River valley on drought alert", "url": "https://phys.org/news/2026-07-italy-po-river-valley-drought.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades italianas elevaram o nível de alerta para seca em toda a região do Vale do Po, que abriga o rio mais longo da Itália, devido às condições piorando e previsões climáticas desfavoráveis.", "titulo_pt": "Itália em alerta de seca no vale do Po", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83123, "titulo": "The US government wants to bypass environmental laws for commercial launches and spacecraft reentries", "url": "https://www.space.com/space-exploration/launches-spacecraft/the-us-government-wants-to-bypass-environmental-laws-for-commercial-launches-and-spacecraft-reentries", "fonte_id": "space_com", "data_pub": "2026-07-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviação (FAA) dos Estados Unidos está considerando reduzir as avaliações ambientais para acelerar os lançamentos e reentries de naves espaciais, diante de uma demanda crescente que está causando um backlog.", "titulo_pt": "O governo americano quer pular leis ambientais para acelerar lançamentos comerciais e reentries de naves espaciais", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 83094, "titulo": "Spectroscopy system detects aerosols using light reflected from traffic signs and tree trunks", "url": "https://phys.org/news/2026-07-spectroscopy-aerosols-traffic-tree-trunks.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores desenvolveram e testaram um sistema de espectroscopia infravermelha que pode detectar rapidamente aerossóis químicos a uma distância, usando luz refletida em superfícies comuns como sinalizadores de trânsito ou troncos de árvores. A nova técnica poderia permitir a detecção de perigos sem instrumentos complexos, melhorando a segurança e simplificando operações em locais industriais, públicos e outros locais de alto risco.", "titulo_pt": "Sistema de espectroscopia detecta aerossóis usando luz refletida em sinalizadores de trânsito e troncos de árvores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83095, "titulo": "Combined rattlesnake proteins prove 10 times more potent than current antivenom in lab tests", "url": "https://phys.org/news/2026-07-combined-rattlesnake-proteins-potent-current.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Maryland desenvolveram uma nova abordagem para o tratamento de picadas de serpentes venenosas, utilizando proteínas do próprio veneno das cobra-torpedo-ocidental. Essas combinações específicas de proteínas sanguíneas foram 10 vezes mais potentes que os antivenenos atuais em testes laboratoriais.", "titulo_pt": "Combinação de proteínas de cobra-protegia prova 10 vezes mais eficaz do que o antiveneno atual em testes de laboratório", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 82332, "titulo": "Higashino’s death sends his novels soaring on Taiwan bestseller lists", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861706", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas dos livros de Higashino aumentaram significativamente nas listas de best-sellers da Taiwan após sua morte.", "titulo_pt": "Morte de higashino faz seus livros subirem nas listas de best-sellers na Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 83113, "titulo": "Simone Forti, Artist of Movement and Chance, Dies at 91", "url": "https://hyperallergic.com/simone-forti-artist-of-movement-and-chance-dies-at-91/", "fonte_id": "hyperallergic", "data_pub": "2026-07-30T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simone Forti, nascida na Itália e considerada uma coreógrafa e artista de performance, faleceu aos 91 anos. Sua criatividade abrangente combinava curiosidade sem limites com rigor formal em um espectro criativo que englobou Nova York, Los Angeles e Roma.", "titulo_pt": "Simone Forti, artista do movimento e da Chance, falece aos 91 anos", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 82585, "titulo": "DiaTV cancela programa após entrevista com deputado Kim Kataguiri", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/diatv-cancela-programa-apos-entrevista-com-deputado-kim-kataguiri.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-30T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A emissora DiaTV encerrou o programa Simplificando Entrevista após críticas negativas de espectadores e membros da equipe, devido a uma edição com o deputado Kim Kataguiri.", "titulo_pt": "Diatv c "texto_pt": "Tássio Maia dos Santos, ex-atacante do Botafogo que havia se aposentado em 2019, morreu durante um forte temporal em Rio de Janeiro. O muro onde ele estava se desmoronou. As fortes rajadas de vento superando os 100 km/h causaram danos e interromperam o funcionamento do aeroporto Santos Dumont.", "titulo_pt": "Faleceu um ex-jogador do Botafogo: tinha 41 anos e foi uma das vítimas do temporal em rio de Janeiro", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 82956, "titulo": "La participación de mujeres se achica mientras se acercan a las jefaturas y sigue siendo baja en directorios, especialmente en bancos", "url": "https://www.latercera.com/pulso/noticia/la-participacion-de-mujeres-se-achica-mientras-se-acercan-a-las-jefaturas-y-sigue-siendo-baja-en-directorios-especialmente-en-bancos/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A participação feminina nos diretórios de bancos e filiais bancárias no Chile representava 17,2% no fechamento de 2025 e 14,4% nas sociedades de apoio ao giro. O relatório de gênero da CMF destaca uma diferença salarial entre homens e mulheres e a baixa presença delas em cargos gerenciais.", "titulo_pt": "Participação feminina diminui nos diretórios bancários enquanto persiste brecha salarial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 82962, "titulo": "Impacto en España por ingreso masivo de migrantes a Ceuta: cruzaron a nado desde Marruecos", "url": "https://www.latercera.com/videos/noticia/el-impactante-registro-de-una-llegada-masiva-de-inmigrantes-a-espana-nadaron-desde-marruecos/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T20:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo de Pedro Sánchez anunciou o deslocamento do Exército para a cidade autônoma de Ceuta, localizada na costa africana, em resposta ao ingresso massivo de migrantes que cruzaram a nado desde Marrocos.", "titulo_pt": "Impacto em Espanha por influxo maciço de migrantes a Ceuta: cruzaram a nado desde marrocos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 81822, "titulo": "Mulher é atraída para apartamento, espancada e estuprada no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/mulher-e-atraida-para-apartamento-espancada-e-estuprada-no-rj", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi levada para um apartamento, espancada até desmaiar e estuprada enquanto inconsciente. O suspeito foi detido na quarta-feira (29/7).", "titulo_pt": "Mulher é espancada e estuprada após ser levada a apartamento no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 82054, "titulo": "Ministra de Salud reconoce deuda con la primera infancia: “Hemos fallado”", "url": "https://www.latercera.com/nacional/noticia/ministra-de-salud-reconoce-deuda-con-la-primera-infancia-hemos-fallado/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra de Saúde Chomali participou da apresentação de um relatório do Observatório Infância da Fundación Colunga, que oferece uma visão sobre a situação dos bebês e crianças com até 5 anos no país. Durante o evento, ela reconheceu que há uma dívida com a infância.", "titulo_pt": "Ministra de saúde reconhece dívida com a primeira infância: 'hemos fallado'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 81824, "titulo": "Regular açúcar na infância pode reduzir risco de Alzheimer, diz estudo", "url": "https://www.metropoles.com/saude/regular-acucar-infancia-risco-alzheimer", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa analisou dados de mais de 60 mil pessoas e encontrou que um consumo reduzido de açúcar na infância pode estar associado a um risco menor de desenvolver Alzheimer.", "titulo_pt": "Manter o açúcar em cheque na infância pode diminuir o risco de Alzheimer, sugere estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 81958, "titulo": "Constanza Lamarque, perfiladora criminal, sobre la muerte de la niña de dos años en Villa Gesell: “Hay un tabú de no poder ver a la madre como una asesina, pero hay muchísimos casos”", "url": "https://www.lanacion.com.ar/seguridad/constanza-lamarque-perfiladora-criminal-sobre-la-muerte-de-la-nina-de-dos-anos-en-villa-gesell-hay-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T17:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A perito criminal Constanza Lamarque realizou uma análise comportamental dos elementos conhecidos do caso da morte de uma menina de dois anos em Villa Gesell. Ela explicou que há um tabu na sociedade que impede ver a mãe como suspeita, mas que existem muitos casos semelhantes.", "titulo_pt": "Constanza Lamarque sobre o caso da criança morta em Villa Gesell: 'existe um tabu de não ver a mãe como assassina'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 81828, "titulo": "Com 1,5 mil vagas, curso gratuito de Libras tem vagas abertas no DF", "url": "https://www.metropoles.com/distrito-federal/com-15-mil-vagas-curso-gratuito-de-libras-tem-vagas-abertas-no-df", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O curso gratuito de Libras chamado Librando Tech oferece 1,5 mil vagas e as aulas são totalmente online. As inscrições estão abertas até que todas as vagas sejam preenchidas.", "titulo_pt": "Com 1,5 mil vagas, curso gratuito de Libras tem vagas abertas no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 81831, "titulo": "Hotelaria Brasil promove treinamento sobre legislação e assédio", "url": "https://www.metropoles.com/conteudo-especial/hotelaria-brasil-promove-treinamento-sobre-legislacao-e-assedio", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes operacionais dos hotéis Ramada e Tryp em Brasília receberam treinamentos sobre legislação e prevenção de assédio no trabalho. O objetivo é criar um ambiente mais seguro para os funcionários.", "titulo_pt": "Hotelaria Brasil realiza treinamento sobre legislação e combate ao assédio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 81750, "titulo": "Cerca de 17 mil clientes ainda estão sem luz após ventania em São Paulo", "url": "https://www.cnnbrasil.com.br/infra/clientes-ainda-estao-sem-luz-apos-ventania-em-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 70 mil imóveis ficaram sem energia elétrica na quarta-feira após uma ventania em São Paulo, e cerca de 17 mil clientes ainda estão sem luz nesta quinta-feira. A capital concentra mais de 11 mil interrupções.", "titulo_pt": "Aproximadamente 17 mil clientes ainda sem luz após ventania em São Paulo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81916, "titulo": "Medicamento à base de paracetamol é suspenso após contaminação por bolor", "url": "https://veja.abril.com.br/brasil/medicamento-a-base-de-paracetamol-e-suspenso-apos-contaminacao-por-bolor/", "fonte_id": "veja", "data_pub": "2026-07-30T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa suspendeu a venda de um lote do medicamento Paramol, que é usado para reduzir febre e aliviar dores, após constatação de contaminação por bolor.", "titulo_pt": "Medicamento à base de paracetamol é suspenso após contaminação por bolor", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 81629, "titulo": "Terapeuta vê lado sombrio da psicodelia à moda Trump", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/virada-psicodelica/2026/07/terapeuta-ve-lado-sombrio-da-psicodelia-a-moda-trump.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-30T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A psicoterapeuta Kari Gleiser e seu marido, o físico Marcelo Gleiser, se mudaram para um templo do século 17 na Toscana, Itália, onde fundaram a Ilha de Conhecimento, um retiro focado no florescimento humano, não em um retiro psicodélico.", "titulo_pt": "Terapeuta vê lado sombrio da psicodelia à moda Trump", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 81793, "titulo": "Instituto abre 700 vagas para curso gratuito de empreendedorismo feminino", "url": "https://exame.com/bussola/instituto-abre-700-vagas-para-curso-gratuito-de-empreendedorismo-feminino/", "fonte_id": "exame", "data_pub": "2026-07-30T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Empreende no Zap oferece até 700 vagas gratuitas para um curso de empreendedorismo feminino. O curso inclui mentoria para auxiliar as mulheres empreendedoras a aumentarem seus lucros durante a alta temporada comercial.", "titulo_pt": "Instituto abre 700 vagas para curso gratuito de empreendedorismo feminino", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 82687, "titulo": "Alemanha registra quase 10 mil mortes relacionadas ao calor, diz instituto", "url": "https://www.cnnbrasil.com.br/internacional/alemanha-registra-quase-10-mil-mortes-relacionadas-ao-calor-diz-instituto/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha registrou quase 10 mil mortes relacionadas ao calor, de acordo com o órgão de saúde alemão. A maior parte dessas mortes aconteceu em pessoas com 75 anos ou mais.", "titulo_pt": "Alemanha registra quase 10 mil mortes relacionadas ao calor, informa instituto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83009, "titulo": "Europe’s heating climate sparks ‘major intensification’ of fires: Report", "url": "https://www.aljazeera.com/news/2026/7/30/europes-heating-climate-sparks-major-intensification-of-fires-report?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aumento do clima nas regiões sul da Europa dobrou a probabilidade de incêndios florestais desde 1981, segundo pesquisadores.", "titulo_pt": "Aumento do clima na Europa do sul intensifica 'gravemente' os incêndios: relatório", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 81751, "titulo": "Filhotes de arara exclusiva do Nordeste brasileiro nascem na Bélgica; veja", "url": "https://www.cnnbrasil.com.br/ciencia/filhotes-de-arara-exclusiva-do-nordeste-brasileiro-nascem-na-belgica-veja/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas araras-de-lear, uma espécie ameaçada de extinção localizada na Caatinga da Bahia, foram nascidas em um zoológico belga. Este é agora o único centro público no mundo a ter conseguido reproduzir as três espécies de araras-azuis.", "titulo_pt": "Filhotes de arara-de-lear, exclusiva do Nordeste brasileiro, nascem na Bélgica; veja", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81921, "titulo": "Promessa de gás a US$ 5 põe ANP e PPSA sob pressão máxima", "url": "https://veja.abril.com.br/coluna/radar-economico/promessa-de-gas-a-us-5-poe-anp-e-ppsa-sob-pressao-maxima/", "fonte_id": "veja", "data_pub": "2026-07-30T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço de gás anunciado pelo governo é mais baixo do que o valor cobrado pela Petrobras para escoar e processar o produto, colocando a ANP e PPSA sob pressão. A promessa de gás a US$ 5 põe as agências reguladoras em situação delicada.", "titulo_pt": "Promessa de gás a US$ 5 coloca ANP e PPSA sob pressão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82977, "titulo": "France's grape harvest threatened by drought, despite promising 2026 vintage", "url": "https://www.lemonde.fr/en/economy/article/2026/07/30/france-s-grape-harvest-threatened-by-drought-despite-promising-2026-vintage_6756010_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A colheita de uvas está programada para começar mais cedo, no início de agosto. Apesar da falta de água que afetou as videiras, o vintage pode ainda ser excelente, já que não sofreu com doenças.", "titulo_pt": "Colheita de uvas ameaçada por secas, mas vintage promissor", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 82455, "titulo": "Correcting climate ‘misperceptions’ may not boost climate action", "url": "https://www.carbonbrief.org/correcting-climate-misperceptions-may-not-boost-climate-action", "fonte_id": "carbon_brief", "data_pub": "2026-07-30T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que o público geral subestima o apoio à ação climática e sobreestima as ações reais tomadas por outras pessoas para abordar o clima. Corrigir essas percepções incorretas pode não necessariamente aumentar a ação climática.", "titulo_pt": "Corrigir 'percepções errôneas' sobre o clima pode não melhorar as ações climáticas", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 81843, "titulo": "Quando os rios adoecem", "url": "https://www.jota.info/opiniao-e-analise/colunas/em-clima-de-justica/quando-os-rios-adoecem", "fonte_id": "jota", "data_pub": "2026-07-30T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O garimpo e a degradação silenciosa dos sistemas aquáticos da Amazônia descrevem como atividades ilegais e o uso inadequado estão afetando os rios e lagos da região amazônica, causando danos sutis mas significativos ao ecossistema.", "titulo_pt": "Quando os rios adoecem", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81973, "titulo": "Firefighters race to extinguish blazes across EU as fire weather breaks records", "url": "https://www.theguardian.com/world/2026/jul/30/fire-weather-eu-wildfires-data", "fonte_id": "guardian_world", "data_pub": "2026-07-30T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Condições quentes, secas e ventosas na Europa estão 43% mais severas do que a média dos últimos 20 anos. Incêndios florestais em todo o Mediterrâneo são controlados por bombeiros enquanto as condições climáticas extremas batem recordes de severidade para esta época do ano.", "titulo_pt": "Bombeiros correm contra o tempo para apagar incêndios na Europa com condições meteorológicas recorde", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 82152, "titulo": "Unprecedented drought hits central France: 'Nothing grows anymore, it has become a desert'", "url": "https://www.lemonde.fr/en/environment/article/2026/07/30/unprecedented-drought-hits-central-france-nothing-grows-anymore-it-has-become-a-desert_6756006_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma seca sem precedentes atinge o centro da França, com apenas três dos 35 riachos monitorados pelo Serviço Francês de Biodiversidade ainda fluindo. As condições são as mais baixas desde que o monitoramento começou em 2012.", "titulo_pt": "Seca sem precedentes atinge centro da França: 'nada cresce mais, tornou-se um deserto'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 82456, "titulo": "Factcheck: No, Europe is not having its ‘quietest’ year for wildfires", "url": "https://www.carbonbrief.org/factcheck-no-europe-is-not-having-its-quietest-year-for-wildfires", "fonte_id": "carbon_brief", "data_pub": "2026-07-30T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na última semana, críticos do clima e comentaristas de direita compartilharam gráficos nas redes sociais sugerindo erroneamente que a Europa está experimentando seu ano mais calmo em termos de incêndios florestais. O Carbon Brief refuta essa afirmação, indicando que não é verdade que este seja o ano menos propício a incêndios na região.", "titulo_pt": "Verificação de fatos: não, Europa não está tendo seu ‘ano mais calmo’ em termos de incêndios florestais", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 82180, "titulo": "Drone footage captures massive Castellon wildfire in eastern Spain", "url": "http://www.euronews.com/video/2026/07/30/drone-footage-captures-massive-castellon-wildfire-in-eastern-spain", "fonte_id": "euronews", "data_pub": "2026-07-30T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos selvagens continuam a queimar em Espanha, com equipes lutando contra incêndios em Castellón e Zamora. Milhares de pessoas foram evacuadas e aviões estão auxiliando nos esforços de combate aos incêndios.", "titulo_pt": "Vídeo por drone captura grande incêndio em castellón, Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 82181, "titulo": "EU's competition chief Ribera slams climate deniers as fires rage: 'They are lying'", "url": "http://www.euronews.com/2026/07/30/they-are-lying-teresa-ribera-slams-climate-deniers-as-fires-rage-in-euronews-interview", "fonte_id": "euronews", "data_pub": "2026-07-30T13:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comissária europeia de Competição, Margrethe Vestager, criticou políticos europeus que duvidam da ciência climática e ignoram as políticas ambientais como ideológicas. Ela acusou esses parlamentares de 'perigosos e estúpidos' durante uma entrevista à Euronews.", "titulo_pt": "Comissária europeia ataca negadores do clima: 'eles estão mentindo'", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 81966, "titulo": "Fifteen elephant deaths at Kenya park may be due to cyanide poisoning", "url": "https://www.theguardian.com/environment/2026/jul/30/elephant-deaths-kenya-park-cyanide-poisoning-wildlife", "fonte_id": "guardian_world", "data_pub": "2026-07-30T12:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Kenya Wildlife Service (KWS) informou que a morte de 15 elefantes perto de um parque na região sul do país, ocorrida recentemente, pode ter sido causada pelo consumo de pesticidas usados em plantações de tomates próximas. Análises realizadas nos corpos dos animais detectaram traços de cianeto, substância utilizada no controle predatório e como fumigante na agricultura, que também é empregada por caçadores ilegais.", "titulo_pt": "Dezessete mortes de elefantes em parque da kenia podem ser resultado de envenenamento com cianeto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 82184, "titulo": "Crete wildfire kills two firefighters as fierce flames spread in Greece", "url": "http://www.euronews.com/video/2026/07/30/crete-wildfire-kills-two-firefighters-as-fierce-flames-spread-in-greece", "fonte_id": "euronews", "data_pub": "2026-07-30T11:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogo selvagem continua a queimar na ilha de Creta, Grécia, onde dois bombeiros morreram com ventos fortes alimentando as chamas e aviões participando dos esforços de resgate.", "titulo_pt": "Incêndio em creta mata dois bombeiros", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 82390, "titulo": "A Civilian Plane Crashed in New Mexico. Was the Military’s Tech to Blame?", "url": "https://www.wired.com/story/a-civilian-plane-crashed-in-new-mexico-was-the-militarys-tech-to-blame/", "fonte_id": "wired", "data_pub": "2026-07-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião civil caiu no No ra.com/opinions/2026/7/30/apartheid-wealth-cannot-buy-silence-on-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As universidades sul-africanas devem resistir aos doadores que usam poder financeiro para impor obediência política. O título traduzido é: A riqueza do apartheid não pode comprar silêncio sobre Gaza.", "titulo_pt": "A riqueza do apartheid não pode comprar silêncio sobre Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 81441, "titulo": "Malaysia’s ‘shocking’ deal to return 5,000 Rohingya to Myanmar triggers refoulement fears", "url": "https://www.scmp.com/week-asia/people/article/3362390/malaysias-shocking-deal-return-5000-rohingya-myanmar-triggers-refoulement-fears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia afirma que Myanamar concordou em receber 5.000 rohingyas, o que gerou esperança de alívio no sistema de refugiados do país, mas também alarme entre ativistas sobre os riscos de retornar um grupo perseguido a um local ainda em conflito.", "titulo_pt": "Acordo da malásia para devolver 5.000 rohingyas ao myanamar gera temores sobre refoulement", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 81388, "titulo": "He helped China repress Uyghurs. He says he’s a victim, too.", "url": "https://www.japantimes.co.jp/news/2026/07/30/asia-pacific/politics/china-uyghurs-victim/", "fonte_id": "japan_times", "data_pub": "2026-07-30T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zhang Yabo, ex-oficial da polícia, descreveu Xinjiang como uma grande prisão que aprisiona não apenas inúmeros uigures inocentes 'mas também os espíritos de quem é ordenado a executar essa política.'", "titulo_pt": "Ele ajudou a reprimir uigures em xinjiang. Agora ele se diz vítima, também.", "veiculo": "T            return `<div class="item" data-flag-url="${esc(n.url)}">
