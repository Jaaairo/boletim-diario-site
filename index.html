<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "29/10/2026 07:47", "stats": {"noticias_novas": 612, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula começa seu quarto mandato em 5 de janeiro de 2027, com propostas em áreas como economia, saúde e educação. No entanto, terá que negociar com um Congresso de oposição que se fortaleceu recentemente. As ações recentes de Flávio Bolsonaro, que divulgou uma carta considerada golpista e fugiu para os Estados Unidos, têm provocado tensões políticas e reações de diversos setores, incluindo o governo Lula, que orientou os ministros a tratar a fuga como um caso de responsabilidade da Justiça. Além disso, o governo planeja realizar leilões de rodovias em novembro, com investimentos previstos de R$ 31 bilhões. O MGI prevê um novo CNU em 2027 e aguarda o aval do Orçamento no Congresso.", "mundo": "O Senado francês aprovou uma proposta que impõe multas de até 11.000 euros aos protestantes, no meio de semanas de protestos violentos pelo país. O presidente sul-coreano Lee Jae Myung está programado para se reunir com o chanceler alemão em uma cúpula que se concentra em cooperação econômica. O senador Flávio Bolsonaro, que enfrentava uma investigação sobre lavagem de dinheiro, fugiu do Brasil para os Estados Unidos, passando por Argentina e Espanha, e declarou-se o 'verdadeiro presidente' do Brasil após a vitória do ex-presidente Luiz Inácio Lula da Silva nas últimas eleições presidenciais. Além disso, o governo dos Estados Unidos identificou possibilidades de cooperação nuclear na área de ciclos de combustível nuclear com a Coreia do Sul. A Assembleia Geral da ONU condenou o embargo econômico dos EUA contra Cuba pela 34ª vez, mas houve uma diminuição no apoio, com 130 votos a favor, 17 contra e 25 abstenções.\n\nNo Fórum da ASEAN, o Ministro da Defesa da Coreia do Sul, Shin Wonsik, rejeitou os recentes testes de mísseis da Coreia do Norte, realizados durante o evento. Em outra notícia, o presidente russo, Vladimir Putin, elogiou Elon Musk, chamando-o de 'genial' pelo projeto Starlink, e destacou os esforços da Rússia para desenvolver sua própria rede satelital competitiva. As relações entre a União Europeia e o Canadá também estão sob foco, com líderes europeus, especialmente a Alemanha, pressionando para que as condições que impedem o Canadá de se tornar um membro associado fossem removidas do projeto de declaração. Além disso, a Coreia do Norte realizou testes de alto-falantes de propaganda nas áreas próximas à fronteira inter-Coreana, suspeitando-se que a China esteja por trás dessa ação. As tensões entre as partes continuam, com Seul acusando Pyongyang de causar uma explosão de mina terrestre que feriu três de seus soldados, enquanto a Coreia do Norte nega as acusações.", "economia": "Os preços do petróleo caíram nesta quinta-feira devido às esperanças de novas negociações de paz, que aliviaram as preocupações com interrupções de suprimentos decorrentes das tensões crescentes no Oriente Médio, conforme informou a CNBC Internacional. Em outro destaque, a Sumitomo Mitsui Trust Bank, uma instituição japonesa, comprou uma participação em uma empresa de private equity indiana, demonstrando o interesse dos investidores japoneses em empresas indianas de serviços financeiros, manufatura e imóveis, relatou o Japão Times. Em relação às finanças globais, o Federal Reserve manteve as taxas de juros inalteradas, o que levou o won sul-coreano a ganhar levemente em relação ao dólar americano, informou a Yonhap News. Além disso, a reforma tributária no Brasil exige planejamento específico do agronegócio para maximizar a eficiência nas exportações, enquanto o mercado de gás no Brasil enfrenta insegurança jurídica devido à falta ou excesso de regras, afetando tanto compradores quanto vendedores, conforme o Jota.", "tecnologia": "A indústria de inteligência artificial (IA) tem ganhado destaque em diversos setores, com destaque para o aumento das aplicações corporativas e a expansão global das tecnologias. Segundo o The Verge, uma empresa em Arizona está utilizando IA para desenvolver tecnologias avançadas, como smartphones e aplicativos. A Wired destaca que o uso da IA nas empresas está mudando, com foco na autonomia e eficiência do trabalho, gerando retorno econômico claro. A Tencent, gigante asiática, está utilizando a Ásia Oriental como plataforma para lançar seus produtos de IA, liderados pelo assistente de trabalho WorkBuddy, apesar da forte concorrência doméstica. A Samsung Electronics registrou um lucro recorde no terceiro trimestre devido à superciclo de chips de IA, conforme informado pelo Yonhap News. A SK Hynix, gigante sul-coreano de chips de memória, também registrou uma margem operacional de quase 80% de suas vendas, impulsionada pelo boom global da IA, conforme relatado pelo South China Morning Post. A Kansai se destaca como um importante hub de centros de dados, ocupando 25% do total de área de centros de dados no Japão, conforme informado pelo Japan Times. A indústria de baterias sul-coreana também está apresentando sinais iniciais de recuperação, com projetos de veículos elétricos retomados e a crescente demanda por sistemas de armazenamento de energia, segundo o Korea Herald. Além disso, a empresa de satélites EarthDaily fechou uma parceria com a NASA e o Serviço Geológico dos Estados Unidos para analisar dados geoespaciais, visando avançar no monitoramento terrestre e no uso de satélites para prospecção de terras raras e apoio ao avanço do agro no Brasil, conforme informado pelo CNN Brasil.", "ciencia": "Um novo atlas de tumores colorretais fornece insights sobre a maior periculosidade dos cânceres em pessoas jovens. Em outra notícia científica, o rover Perseverance da NASA detectou partículas de poeira ultrafinas em Marte, com cerca de 100 nanômetros de diâmetro, 500 vezes menores que um fio de cabelo humano. O Vietnã se juntou à 78ª nação a assinar os Acordos Artemis, se associando a um grupo crescente de países interessados na exploração pacífica, transparente e responsável do espaço. Além disso, astrônomos chineses descobriram três sistemas solares onde planetas gigantes deveriam ter sido engolidos por estrelas anãs vermelhas avançadas em sua evolução, mas sobreviveram, redefinindo como os cientistas imaginam o futuro distante da Terra. O Instituto Nacional de Antropologia e História (INAH) no México descobriu uma estrutura de 2.500 anos que acredita ser uma antiga observatória solar em Teteles de Ávila Castillo, Sierra Norte de Puebla, sugerindo uma compreensão mais rica da astronomia pré-hispânica.", "cultura": "O evento mais importante é a morte de Dolores Huerta, líder sindical e ícone dos direitos civis dos Estados Unidos, que faleceu aos 96 anos. Ela foi vice-presidente do United Farm Workers, sindicato que fundou junto com César Chávez, e trabalhou para melhorar as condições de trabalho dos trabalhadores migrantes. Entre as homenagens, Shin Hae-chul, cantor falecido, e Yoo Jae-suk receberam o Mérito Cultural. No Brasil, a Orquestra Sinfônica do Estado de São Paulo (Osesp) planeja inovar em sua temporada 2027 ao criar nove festivais inspirados nas ideias de Friedrich Nietzsche. Adélia Prado, Micheliny Verunschk e Julia Codo foram declaradas finalistas do Prêmio Oceanos 2026, que reconhece o melhor da poesia e da prosa em língua portuguesa. A Globo começou a gravar sua tradicional vinheta de fim de ano, com artistas como Serginho Groisman e Alexandre Borges convidados para participar. O Festival de Cinema Francês do Brasil exibe um drama premiado no Festival de Cannes e uma comédia com a atriz Isabelle Huppert, abordando temas como arte, política e sereias. A VGSTV, afiliada da Fundação Nivaldo Bueno e integrante da Rede Nacional de Comunicação Pública, estreou sua retransmissora na cidade de Ceres, Goiás, transmitindo no canal 7.1 com conteúdo da TV Brasil.", "sociedade": "Em uma comununa chilena chamada Estação Central, um cidadão chileno foi morto após ser baleado, conforme relato de [la_tercera]. Em outro caso, uma adolescente de 16 anos denunciou estupro cometido por MC Poze do Rodo, levando a investigação do PCERJ no Rio de Janeiro. Na América Latina, a atriz Teca Pereira relatou dificuldades de representatividade em sua carreira no Brasil, enquanto indígenas denunciaram ameaças após as eleições em Mato Grosso do Sul. No exterior, o presidente da Coreia do Sul, Yoon Suk Yeol, pediu ações para prevenir mortes evitáveis, em referência à tragédia de Itaewon que resultou em 159 mortes. Em Brisbane, Austrália, uma jovem de 19 anos morreu após ser atingida por um tiroteio drive-by, levando a investigação da polícia sobre possíveis ligações com gangues.", "meio_ambiente": "Um relatório da Lancet Countdown afirma que as mudanças climáticas devem ser declaradas como uma emergência global de saúde, com o calor extremo sendo responsável por quase 3 milhões de mortes no mundo entre 2016 e 2023. No Brasil, a perda de vegetação foi de 45% e as florestas foram fragmentadas nos últimos 38 anos, conforme relatório do MapBiomas divulgado durante a COP16 da Biodiversidade. O Reino Unido anunciou uma 'nova direção na energia', com foco em manter os custos baixos, incluindo importantes declarações sobre clima e energia. Além disso, Los Angeles proibiu a extração de petróleo em mais de 1.800 poços ativos e inativos, buscando proteger a saúde pública e alcançar a neutralidade de carbono para 2035.", "direitos_humanos": "Um relatório da Global Rights Compliance afirma que uma rede de brokers russos está recrutando trabalhadores norte-coreanos usando vistos de estudante e empregando-os em trabalho forçado na Rússia. Em outro desenvolvimento, o Ministério da Unificação sul-coreano está considerando aprovar uma resolução da ONU sobre os direitos humanos na Coreia do Norte. Segundo um relatório da Amnesty Internacional, sobreviventes relataram que policiais e soldados serviam como guardas em esquemas de estelionato onde milhares eram forçados a trabalhar na indústria de fraudes online, usando choques elétricos e espancamentos para mantê-los presos. Além disso, o cineasta iraniano Jafar Panahi foi condenado a cinco anos e um mês de prisão pelo Tribunal Revolucionário de Teerã, enquanto um blogueiro chinês, Wu Kai, conhecido por denunciar fraudes, foi morto por criminosos contratados online. Estes casos abrangem desde trabalho forçado internacionalmente até perseguição a jornalistas e ativistas em diferentes partes do mundo, destacando a urgência de ações para proteger os direitos humanos em várias regiões globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 232694, "titulo": "Rogério Xavier: Lula precisa dar “choque de credibilidade”", "url": "https://braziljournal.com/rogerio-xavier-lula-precisa-dar-choque-de-credibilidade", "fonte_id": "brazil_journal", "data_pub": "2026-10-29T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rogério Xavier, cofundador da SPX Capital, vai aguardar a indicação do ministro da Fazenda e novas medidas econômicas para avaliar a credibilidade delas e verificar se há necessidade de ação nos mercados. Ele destaca a importância de tomar decisões com base em informações concretas, dada a recente queda nos preços dos ativos, que pode indicar uma nova realidade econômica sem ajustes fiscais.", "titulo_pt": "Lula precisa dar 'choque de credibilidade'", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 232720, "titulo": "Presidente do Carf projeta R$ 2 trilhões em casos julgados até o final do ano", "url": "https://www.jota.info/tributos/presidente-do-carf-projeta-r-2-trilhoes-em-casos-julgados-ate-o-final-do-ano", "fonte_id": "jota", "data_pub": "2026-10-29T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Higino, presidente do Carf, apresentou um balanço de sua gestão durante quatro anos, no início de um seminário sobre questões controvertidas no Carf. O projeto prevê que cerca de R$ 2 trilhões em casos serão julgados até o final do ano.", "titulo_pt": "Presidente do Carf projeta R$ 2 trilhões em casos julgados até o final do ano", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 232755, "titulo": "As propostas do presidente Lula para o seu quarto mandato em 8 áreas", "url": "https://www.bbc.com/portuguese/articles/cm2ke83x1785o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-29T08:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula inicia seu quarto mandato em 5 de janeiro de 2027 com propostas em áreas como economia, saúde, educação e segurança pública. No entanto, ele terá que negociar com um Congresso de oposição fortalecido para avançar com sua agenda.", "titulo_pt": "Propostas do presidente Lula para seu quarto mandato em 8 áreas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 232754, "titulo": "Qual o futuro do bolsonarismo após Flávio Bolsonaro ir para os EUA?", "url": "https://www.bbc.com/portuguese/articles/cw98zmy9gnj8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-29T08:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas políticos ouvidos pela BBC News Brasil discutem se o bolsonarismo continuará forte ou abrirá espaço para uma direita moderada após Flávio Bolsonaro ir para os Estados Unidos.", "titulo_pt": "Qual o futuro do bolsonarismo após Flávio Bolsonaro ir para os EUA?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 232627, "titulo": "Gleisi é cotada para assumir ministério que cuida do Bolsa Família", "url": "https://www.metropoles.com/colunas/igor-gadelha/gleisi-e-cotada-para-assumir-ministerio-que-cuida-do-bolsa-familia", "fonte_id": "metropoles", "data_pub": "2026-10-29T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wellington Dias, atual ministro do Desenvolvimento Social, pode não permanecer no cargo segundo fontes do governo. Gleisi Hoffmann é cotada para assumir o ministério responsável pelo Bolsa Família.", "titulo_pt": "Gleisi é cotada para assumir ministério do Bolsa Família", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232657, "titulo": "TSE e aliados defendem eleição após carta com teor golpista de Flávio", "url": "https://www.cnnbrasil.com.br/politica/tse-e-aliados-defendem-eleicao-apos-carta-com-teor-golpista-de-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T07:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro divulgou uma carta com conteúdo considerado teor golpista, que surpreendeu seus aliados e foi contestado pela Justiça Eleitoral. O texto foi divulgado após ele ter sido um ex-candidato à Presidência.", "titulo_pt": "TSE e aliados contestam eleição após carta teor golpista de Flávio bolsonaro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 232628, "titulo": "Governo Lula notou acenos do STF para Flávio após 1º turno", "url": "https://www.metropoles.com/colunas/andreza-matais/governo-lula-irritado-com-acenos-do-stf-para-flavio-apos-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-10-29T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula percebeu sinais de aproximação de membros do STF com o bolsonarismo após o primeiro turno das eleições, quando parecia que Flávio seria o vencedor.", "titulo_pt": "Governo Lula notou acenos do STF para bolsonarismo após 1º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232629, "titulo": "Planalto orienta ministros a tratar fuga de Flávio como caso de Justiça", "url": "https://www.metropoles.com/brasil/planalto-orienta-ministros-a-tratar-fuga-de-flavio-como-caso-de-justica", "fonte_id": "metropoles", "data_pub": "2026-10-29T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula orientou os ministros a tratar a fuga de Flávio Bolsonaro como um caso de responsabilidade da Justiça e da Polícia Federal, buscando evitar a tese de perseguição política.", "titulo_pt": "Planalto orienta ministros a tratar fuga de Flávio como caso de Justiça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232577, "titulo": "MGI prevê novo CNU em 2027 e aguarda aval do Orçamento no Congresso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/mgi-preve-novo-cnu-em-2027-e-aguarda-aval-do-orcamento-no-congresso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MGI prevê a realização do CNU a cada dois anos e espera realizar uma nova edição em 2027, dependendo da aprovação do Orçamento pelo Congresso Nacional.", "titulo_pt": "MGI projeta novo CNU em 2027 e aguarda aprovação do Orçamento no Congresso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232586, "titulo": "Mulheres pressionam Lula por indicação inédita de ministra negra ao STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mulheres-pressionam-lula-por-indicacao-inedita-de-ministra-negra-ao-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mulheres estão pressionando o presidente Lula para que ele faça uma indicação inédita de uma ministra negra para o Supremo Tribunal Federal (STF).", "titulo_pt": "Mulheres pressionam Lula por indicação inédita de ministra negra ao STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 232634, "titulo": "Lula virou eleição em 211 cidades no 2º turno; Flávio Bolsonaro reverteu resultado em uma", "url": "https://exame.com/brasil/lula-virou-eleicao-em-211-cidades-no-2o-turno-flavio-bolsonaro-reverteu-resultado-em-uma/", "fonte_id": "exame", "data_pub": "2026-10-29T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula ganhou em 211 cidades no segundo turno da eleição. Flávio Bolsonaro venceu em apenas uma cidade, Uirapuru, em Goiás, por uma margem muito estreita de 18 votos.", "titulo_pt": "Lula vira eleição em 211 cidades; Flávio Bolsonaro vence em uma", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 232637, "titulo": "Após eleições, leilões de rodovias voltam em novembro com previsão de R$ 31 bi em investimentos", "url": "https://exame.com/brasil/infraestrutura/apos-eleicoes-leiloes-de-rodovias-voltam-em-novembro-com-r-31-bi-em-investimentos/", "fonte_id": "exame", "data_pub": "2026-10-29T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Leilões de rodovias ocorrerão em novembro com previsão de investimentos de R$ 31 bilhões. O calendário inclui três leilões até dezembro, e a expansão das concessões está associada ao uso de inteligência artificial e tecnologias de monitoramento ambiental.", "titulo_pt": "Leilões de rodovias em novembro previstos com investimentos de R$ 31 bi", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 232588, "titulo": "Pastor de Flávio Bolsonaro diz que não tem 'terceiro turno' e que as eleições terminaram", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pastor-de-flavio-bolsonaro-diz-que-nao-tem-terceiro-turno-e-que-as-eleicoes-terminaram.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T03:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O bispo JB Carvalho, líder da Comunidade das Nações, onde Flávio Bolsonaro se batizou em 2024, publicou uma mensagem afirmando que não há 'terceiro turno' e que as eleições terminaram após a derrota do senador para Lula.", "titulo_pt": "Pastor de Flávio Bolsonaro afirma que não há 'terceiro turno' e que eleições terminaram", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 232589, "titulo": "Sem registro em Foz, rota de Flávio Bolsonaro até Argentina motiva teorias e pressiona PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/sem-registro-em-foz-rota-de-flavio-bolsonaro-ate-argentina-motiva-teorias-e-pressiona-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O trajeto não registrado de Flávio Bolsonaro de sua residência em Brasília até o aeroporto de Porto Iguassú, na Argentina, levanta teorias sobre a fuga do senador por Foz do Iguaçu, uma possível última localização no Brasil. A Polícia Federal é pressionada a fornecer respostas, mas ainda não as tem.", "titulo_pt": "Sem registro em Foz, rota de Flávio Bolsonaro até Argentina motiva teorias e pressiona PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 232582, "titulo": "Empresários de cidade mineira reagem a lista que pede boicote a eleitores de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/empresarios-de-cidade-mineira-reagem-a-lista-que-pede-boicote-a-eleitores-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Poços de Caldas, uma cidade mineira, listas circulam pelo WhatsApp pedindo o boicote a estabelecimentos com donos que teriam votado em Lula. Os empresários da cidade estão reagindo a essa situação.", "titulo_pt": "Empresários de poços de caldas reagem a lista de boicote a eleitores de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232584, "titulo": "Investidores de varejo da Braskem cobram lugar na mesa de renegociação da dívida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/investidores-de-varejo-da-braskem-cobram-lugar-na-mesa-de-renegociacao-da-divida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Titulares de CRAs emitidos com lastro em dívidas da Braskem reclamam de não terem sido incluídos nas negociações sobre a reestruturação da empresa, que tenta renegociar uma dívida de R$ 55 bilhões. Esses investidores de varejo da Braskem querem participar da renegociação da dívida.", "titulo_pt": "Investidores de varejo da Braskem reclamam de não participar das negociações de renegociação da dívida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 232909, "titulo": "French Senate backs ‘Rioters Pay’ bill that could make protesters pay $11,000 fines", "url": "https://www.cnbc.com/2026/10/29/france-protests-riots-cost-damages-law.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-29T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado francês aprovou uma proposta que faz os protestantes pagar multas de até 11.000 euros. A expectativa é de novos distúrbios no fim de semana, após semanas de protestos violentos pelo país. A medida enfrenta críticas.", "titulo_pt": "Senado francês aprova 'lei dos protestantes pagantes' que pode fazer os manifestantes pagar multas de até 11.000 euros", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 233068, "titulo": "Defense chief denounces N. Korea's missile launches at ASEAN defense forum", "url": "https://en.yna.co.kr/view/AEN20261029012200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministro da Defesa da Coreia do Sul, Kang Shin-chul, rejeitou as lançagens de mísseis da Coreia do Norte durante o Fórum de Defesa da ASEAN, realizado em 29 de outubro em Seul.", "titulo_pt": "Ministro de defesa condena lançamentos de mísseis da Coreia do norte em fórum da ASEAN", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232902, "titulo": "Putin calls Elon Musk a 'genius' as Russia builds its own Starlink rival", "url": "https://www.euronews.com/2026/10/29/putin-calls-elon-musk-a-genius-as-russia-builds-its-own-starlink-rival", "fonte_id": "euronews", "data_pub": "2026-10-29T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente russo Vladimir Putin elogiou Elon Musk como um 'genio' por lançar milhares de satélites. Putin também destacou os esforços da Rússia para desenvolver sua própria rede de internet satelital competidora do Starlink de Musk.", "titulo_pt": "Putin chama Musk de 'genio' enquanto Rússia desenvolve rival do Starlink", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 232934, "titulo": "European Union backtracks on Canada becoming ‘associate member’", "url": "https://www.aljazeera.com/news/2026/10/29/european-union-backtracks-on-canada-becoming-associate-2?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-29T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha, representada pelo chefe do governo, Christian Lindner, e outros líderes da União Europeia, teriam pressionado para que as condições que permitiriam ao Canadá se tornar um membro assoc tps://en.yna.co.kr/view/AEN20261029009051315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de inteligência sul-coreana sugere que o líder norte-coreano Kim Jong-un pode ter discutido a possibilidade de futuras negociações com os Estados Unidos durante sua visita à China. As informações são de uma reportagem do Yonhap News datada de 29 de outubro.", "titulo_pt": "Líder norte-coreano pode ter discutido potenciais conversas com EUA durante visita à China: agência", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 233074, "titulo": "U.S. official says Washington sees scope for nuclear fuel-cycle cooperation with S. Korea", "url": "https://en.yna.co.kr/view/AEN20261029010900315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos identificou possibilidades de cooperação nuclear na área de ciclos de combustível nuclear com a Coreia do Sul.", "titulo_pt": "EUA vê potencial para cooperação nuclear na área de ciclos de combustível nuclear com a Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232818, "titulo": "Albanese concedes savings needed as he faces internal Labor pressure on cost-of-living crisis", "url": "https://www.theguardian.com/australia-news/2026/oct/29/albanese-concedes-savings-needed-as-he-faces-internal-labor-pressure-on-cost-of-living-crisis", "fonte_id": "guardian_world", "data_pub": "2026-10-29T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Anthony Albanese declarou que não haverá cortes significativos em saúde, educação e serviços essenciais no atualização orçamentária de meados do ano de dezembro, mas admitiu que economias são necessárias devido à aceleração da inflação. Sob pressão interno do seu próprio partido, bem como da oposição e do setor empresarial, Albanese criticou o governo de coalizão por não apoiar propostas de economia existentes.", "titulo_pt": "Albanese reconhece necessidade de economias, mas não cortará saúde e educação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 232631, "titulo": "Com Flávio, Eduardo e aliados, direita amplia discurso bolsonarista nos EUA", "url": "https://www.metropoles.com/mundo/flavio-eduardo-bolsonarista-eua", "fonte_id": "metropoles", "data_pub": "2026-10-29T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, após deixar o Brasil, publicou uma carta com ataques às urnas e se aliou a Eduardo e seus aliados nos Estados Unidos.", "titulo_pt": "Com Flávio, Eduardo e aliados, direita amplia discurso bolsonarista nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233036, "titulo": "N. Korea appears to test propaganda loudspeakers along border", "url": "https://www.koreaherald.com/article/10919523", "fonte_id": "korea_herald", "data_pub": "2026-10-29T07:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte parece ter realizado um teste de seus alto-falantes de propaganda nas áreas próximas à fronteira inter-Coreana na quinta-feira, uma semana após a irmã do líder norte-coreano Kim Jong-un emitir uma advertência. Os residentes na cidade sul-coreana de Paju relataram ouvir os alto-falantes norte-coreanos pela manhã, com o volume baixo, mas audível.", "titulo_pt": "Coreia do norte realiza teste de alto-falantes de propaganda na fronteira", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 232943, "titulo": "North Korea fires missiles as row over landmine blast intensifies", "url": "https://www.aljazeera.com/news/2026/10/29/north-korea-fires-missiles-as-row-over-landmine-blast-intensifies?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-29T07:24:00Z", "idioma": "en", "provavel_duplicata_d ovavel_duplicata_de": null, "texto_pt": "Foram destacados os principais eventos econômicos e corporativos previstos para movimentar os mercados na quinta-feira, 29, incluindo a inflação e o PIB nos EUA, dados do Caged, notícias do BCE, balanço da Vale e outros destaques.", "titulo_pt": "Inflação e PIB nos EUA, Caged, BCE, balanço da Vale e mais destaques desta quinta", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 232971, "titulo": "Japan’s Sumitomo Mitsui Trust Bank buys stake in Indian PE firm", "url": "https://www.japantimes.co.jp/business/2026/10/29/sumitomo-mitsui-investments-india/", "fonte_id": "japan_times", "data_pub": "2026-10-29T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sumitomo Mitsui Trust Bank, uma instituição japonesa, comprou uma participação em uma empresa de private equity indiana. Esta investida demonstra o interesse dos investidores institucionais japoneses em empresas indianas de serviços financeiros, manufatura e imóveis.", "titulo_pt": "Banco japonês compra stake em empresa de private equity indiana", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 232722, "titulo": "Federalismo fiscal da judicialização da saúde no Tema 1.234", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fiscal/federalismo-fiscal-da-judicializacao-da-saude-no-tema-1-234", "fonte_id": "jota", "data_pub": "2026-10-29T08:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O custo gerado por decisões judiciais no fornecimento de medicamentos aumentou significativamente e afeta o orçamento dos entes federados.", "titulo_pt": "Federalismo fiscal e judicialização da saúde no Tema 1.234", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 233089, "titulo": "STAT+: Biopharma industry at odds over impact of Treasury’s new China rule", "url": "https://www.statnews.com/2026/10/29/biotech-licensing-deals-treasury-rules-stir-debate/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-29T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há desacordos na indústria biopharma sobre a proposta de regra do Tesouro dos EUA sobre China, com foco em uma exceção para um tipo comum de negócios na indústria.", "titulo_pt": "Indústria biopharma em conflito sobre impacto da nova regra do tesouro sobre China", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 232821, "titulo": "Shell profits double to $10.8bn as Iran war pushes up profit margin on oil", "url": "https://www.theguardian.com/business/2026/oct/29/shell-profits-double-iran-war-pushes-up-profit-margin-on-oil", "fonte_id": "guardian_world", "data_pub": "2026-10-29T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shell dobrou seus lucros para US$ 10,8 bilhões no último trimestre devido ao conflito no Oriente Médio que elevou o preço do petróleo e do gás, criando escassez no mercado global. A empresa planeja retornar US$ 5 bilhões aos acionistas.", "titulo_pt": "Lucros da shell dobram para us$ 10,8 bilhões com guerra no oriente médio", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233075, "titulo": "(LEAD) Doosan Enerbility swings to black in Q3 on solid energy biz", "url": "https://en.yna.co.kr/view/AEN20261029010051320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de equipamentos para usinas de energia, Doosan Enerbility, registrou prejuízo no terceiro trimestre. O negócio de energia da empresa se manteve sólido.", "titulo_pt": "Doosan Enerbility registra prejuízo no terceiro trimestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 233076, "titulo": "Lotte reshuffles biz portfolio with Busan store sale to Shinsegae", "url": "https://en.yna.co.kr/view/AEN20261029011100320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lotte Shopping, uma filial de comércio varejista da Coreia do Sul, está reorganizando sua carteira de negócios, incluindo a venda de uma loja em Busan para a Shinsegae.", "titulo_pt": "Lotte reorganiza portfólio de negócios com venda de loja em Busan para Shinsegae", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 233077, "titulo": "S. Korean won gains slightly against U.S. dollar after Fed holds rates", "url": "https://en.yna.co.kr/view/AEN20261029011200320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano ganhou levemente em relação ao dólar americano após o Federal Reserve manter as taxas de juros inalteradas.", "titulo_pt": "Won sul-coreano ganha levemente contra dólar após federal reserve manter taxas de juros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232979, "titulo": "Hungary’s post-Orban shakeout ripples through auto industry", "url": "https://www.japantimes.co.jp/business/2026/10/29/economy/hungary-orban-auto-industry/", "fonte_id": "japan_times", "data_pub": "2026-10-29T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há uma mudança na abordagem ambiental na Hungria, ocorrendo simultaneamente com o sucesso crescente da aposta do ex-prime minister Orban em veículos elétricos.", "titulo_pt": "Desenvolvimento pós-orban na hungria impacta o setor automotivo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233079, "titulo": "(LEAD) Hanwha Aerospace swings to Q3 net loss due to delayed weapons deliveries", "url": "https://en.yna.co.kr/view/AEN20261029009251320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de defesa Hanwha Aerospace registrou um prejuízo líquido no terceiro trimestre devido a atrasos nas entregas de armamentos. A empresa não forneceu detalhes adicionais sobre a magnitude do prejuízo ou os motivos específicos dos atrasos.", "titulo_pt": "Hanwha Aerospace registra prejuízo no terceiro trimestre devido a atrasos nas entregas de armamentos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232896, "titulo": "European Central Bank meets as France's deteriorating public finances continue to drive questions", "url": "https://www.lemonde.fr/en/economy/article/2026/10/29/european-central-bank-meets-as-france-s-deteriorating-public-finances-continue-to-drive-questions_6766663_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-29T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria espera que o BCE mantenha as taxas de juros inalteradas pelo menos por enquanto, depois de aumentá-las duas vezes este ano. As finanças públicas francesas em deterioração continuam a gerar preocupações.", "titulo_pt": "Banco Central europeu se reúne com finanças públicas francesas em deterioração", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 232575, "titulo": "Pix e bancarização impulsionam inclusão financeira, aponta estudo da Fin", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/pix-e-bancarizacao-impulsionam-inclusao-financeira-aponta-estudo-da-fin.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O acesso aos serviços financeiros está se tornando menos desigual entre as regiões brasileiras, de acordo com um estudo da Fin. O relatório destaca o papel do Pix e da bancarização no fortalecimento da inclusão financeira no país.", "titulo_pt": "Pix e bancarização reduzem desigualdade no acesso aos serviços financeiros, mostra estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232578, "titulo": "Veja funcionamento de bancos, do INSS e de outros serviços nesta sexta e no feriado de Finados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/veja-funcionamento-de-bancos-do-inss-e-de-outros-servicos-nesta-sexta-e-no-feriado-de-finados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As agências do INSS não funcionarão nesta sexta-feira (30) e na próxima segunda-feira (2), feriado de Finados. O atendimento presencial será retomado na terça-feira (3).", "titulo_pt": "Veja funcionamento de bancos, do INSS e de outros serviços nesta sexta e no feriado de Finados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232579, "titulo": "Mercado de apostas espera decisão de Fux, mas não voltará como era antes de proibição, diz associação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/mercado-de-apostas-espera-decisao-de-fux-mas-nao-voltara-como-era-antes-de-proibicao-diz-associacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de apostas aguarda uma decisão do ministro Luiz Fux no STF, que pode permitir a retomada das atividades após a proibição. No entanto, o setor não retornará ao estado anterior à proibição, conforme afirma a associação.", "titulo_pt": "Mercado de apostas aguarda decisão de Fux, mas não retornará ao formato anterior à proibição, diz associação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 233085, "titulo": "AI has come for Arizona’s water", "url": "https://www.theverge.com/cs/features/1016650/arizona-water-data-center-tsmc", "fonte_id": "the_verge", "data_pub": "2026-10-29T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um gigante cinza e grande emerge do deserto. Dentro dele, engenheiros criam a força por trás de tecnologias como smartphones, computadores, aplicativos e serviços de streaming.", "titulo_pt": "A IA chegou ao Arizona para o seu água", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 232693, "titulo": "OPINIÃO. O gap da AI no mundo corporativo", "url": "https://braziljournal.com/opiniao-o-gap-da-ai-no-mundo-corporativo", "fonte_id": "brazil_journal", "data_pub": "2026-10-29T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A discussão sobre a inteligência artificial nas empresas está mudando de foco, passando de se perguntar quantas pessoas estão usando a tecnologia para se concentrar no quanto trabalho a AI já consegue executar autonomamente, com qualidade mensurável e retorno econômico claro.", "titulo_pt": "OPINIÃO: o gap da AI no mundo corporativo", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 233081, "titulo": "Law Firm Linked to Elon Musk Started an ‘Election Integrity’ Organization", "url": "https://www.wired.com/story/law-firm-linked-to-elon-musk-started-an-election-integrity-organization/", "fonte_id": "wired", "data_pub": "2026-10-29T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mesma firma que auxiliou na criação do America PAC de Elon Musk está por trás de uma nova organização que trabalhará com autoridades eleitorais para promover políticas alinhadas às falsas alegações de fraude eleitoral de Donald Trump.", "titulo_pt": "Firma de Elon Musk lidera nova organização de 'integridade eleitoral'", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 233082, "titulo": "Liquid Glass Finally Makes Sense on the iPhone Duo", "url": "https://www.wired.com/story/liquid-glass-finally-makes-sense-on-the-iphone-duo/", "fonte_id": "wired", "data_pub": "2026-10-29T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Liquid Glass foi um redesign controverso. Agora, com um iPhone radicalmente diferente, as peças parecem estar se encaixando melhor.", "titulo_pt": "Liquid Glass finalmente faz sentido no iphone Duo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 232759, "titulo": "Guía para detectar una imagen falsa hecha con inteligencia artificial", "url": "https://www.latercera.com/tendencias/noticia/guia-para-detectar-una-imagen-falsa-hecha-con-inteligencia-artificial/", "fonte_id": "la_tercera", "data_pub": "2026-10-29T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As imagens criadas por inteligência artificial estão se tornando cada vez mais difíceis de distinguir de fotos reais. Especialistas explicam como identificar essas imagens falsas, quais ferramentas usar e o que fazer antes de compartilhar conteúdo suspeito.", "titulo_pt": "Guia para detectar uma imagem falsa feita com inteligência artificial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 232895, "titulo": "'Starlink serves the geopolitical interests of the United States and the fortune of Elon Musk'", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/29/starlink-serves-the-geopolitical-interests-of-the-united-states-and-the-fortune-of-elon-musk_6766696_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-29T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento no lançamento de satélites pelo provedor de internet SpaceX, controlado pelo bilionário americano estreitamente ligado a Donald Trump, está causando danos ambientais e interferindo no trabalho dos cientistas, de acordo com Bryan Carter, realizador de documentários espaciais.", "titulo_pt": "Starlink atende aos interesses geopolíticos dos estados unidos e ao patrimônio de Elon Musk", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 233083, "titulo": "Astronomers Discover a Possible New Dwarf Planet in Our Solar System", "url": "https://www.wired.com/story/astronomers-discover-a-possible-new-dwarf-planet-in-our-solar-system/", "fonte_id": "wired", "data_pub": "2026-10-29T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobririram uma possível nova planetaideana no sistema solar, localizada além de Plutão. 2026 ED138 pode ter até 1.500 km de diâmetro, mas ainda não foi confirmado se atende aos critérios de um planetaideana.", "titulo_pt": "Astrônomos descobrem possível nova planetaideana no sistema Solar", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 233017, "titulo": "Korea's battery rebound yet to reach suppliers: KBIA chief", "url": "https://www.koreaherald.com/article/10919668", "fonte_id": "korea_herald", "data_pub": "2026-10-29T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de baterias sul-coreana está apresentando sinais iniciais de recuperação, com projetos de veículos elétricos retomados e a crescente demanda por sistemas de armazenamento de energia ajudando a compensar a desaceleração no mercado EV dos EUA, segundo o presidente da Associação da Indústria de Baterias da Coreia e CEO da Posco Future M.", "titulo_pt": "Retorno das baterias da Coreia ainda não alcançou os fornecedores: presidente da KBIA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 232965, "titulo": "US tech stocks set to fall after earnings fuel AI spending concerns", "url": "https://www.ft.com/content/1639620b-99e7-47ed-8484-49646816489e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-29T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações das tecnológicas da Nasdaq 100 podem abrir com uma queda de 1% devido a relatórios de despesas de capital inferiores às expectativas de Google (Alphabet) e Microsoft. Isso levanta preocupações sobre o aumento do gasto com inteligência artificial.", "titulo_pt": "Ações de tecnologia da nasdaq 100 podem abrir em baixa devido a preocupações com gasto em AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 233070, "titulo": "(LEAD) Watchdog to fine Celltrion 630 mln won over unfair subcontracting practices", "url": "https://en.yna.co.kr/view/AEN20261029003551320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vigilância antitruste da Coreia do Sul anunciou que multará a Celltrion em 630 milhões de wones devido a práticas de subcontratação injustas.", "titulo_pt": "Autoridade antitruste multará Celltrion em 630 milhões de wones por práticas de subcontratação imjustas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232975, "titulo": "Japan must accelerate cyberdefense strategy, former NSA director says", "url": "https://www.japantimes.co.jp/news/2026/10/29/japan/crime-legal/nsa-director-michael-rogers-interview/", "fonte_id": "japan_times", "data_pub": "2026-10-29T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michael Rogers, ex-diretor da NSA, afirma que o Japão precisa acelerar sua estratégia de defesa cibernética. O ex-chefe de inteligência argumenta que gastar semanas e meses em estratégias não é propício para uma postura defensiva cibernética ativa.", "titulo_pt": "Ex-diretor da NSA diz que o Japão deve acelerar sua estratégia de defesa cibernética", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233030, "titulo": "Seoul shares down 1.24% as Samsung disappoints on shareholder returns", "url": "https://www.koreaherald.com/article/10919586", "fonte_id": "korea_herald", "data_pub": "2026-10-29T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram 1,24% após o resultado trimestral da Samsung elevar expectativas e não fornecer atualizações sobre seu plano de retorno para acionistas. O índice de referência KOSPI fechou em 5.937,66 pontos, após subir temporariamente para 6.100,11 pontos.", "titulo_pt": "Ações sul-coreanas caem 1,24% após Samsung decepcionar investidores", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 233031, "titulo": "Boditech Med partners with Brazil's Biosys for local diagnostics production", "url": "https://www.koreaherald.com/article/10919569", "fonte_id": "korea_herald", "data_pub": "2026-10-29T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana Boditech Med firmou um acordo com a empresa brasileira Biosys para estabelecer uma base de produção local. Este movimento visa reduzir custos e expandir a presença da Boditech Med na América do Sul.", "titulo_pt": "Boditech Med se associa à Biosys para produção local de diagnósticos no Brasil", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 232977, "titulo": "GMO cybersecurity team finds info critical to identifying hackers, CEO says", "url": "https://www.japantimes.co.jp/news/2026/10/29/japan/gmo-hacker-information/", "fonte_id": "japan_times", "data_pub": "2026-10-29T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de hackers permaneceu em silêncio público desde a retirada do site que revelava dados pessoais de clientes da empresa GMO. O CEO da empresa informou que a equipe de segurança da informação da GMO encontrou informações cruciais para identificar os hackers.", "titulo_pt": "Equipe de segurança da GMO encontra informações importantes para identificar hackers", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233052, "titulo": "Tencent targets Southeast Asia as launch pad for AI agent WorkBuddy amid tough local market", "url": "https://www.scmp.com/tech/big-tech/article/3372550/tencent-targets-southeast-asia-launch-pad-ai-agent-workbuddy-amid-tough-local-market", "fonte_id": "scmp", "data_pub": "2026-10-29T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante chinesa de tecnologia Tencent está utilizando a Ásia Oriental ilos. Segundo ele, o Museu da Língua Portuguesa seria dominado por artistas de funk, como MC Cabelinho, se o bolsonarismo tivesse o controle completo.", "titulo_pt": "Bolsonarismo busca dominar o museu da língua portuguesa com funk", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 232568, "titulo": "Jorja Smith volta ao Brasil com disco embebido na música de pista britânica", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/jorja-smith-volta-ao-brasil-com-disco-embebido-na-musica-de-pista-britanica.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jorja Smith retornou ao Brasil com seu álbum. Ela tocou no Lollapalooza Brasil em 2019, quando tinha 21 anos, e se lembra de ter sido muito bem recebida no país.", "titulo_pt": "Jorja Smith volta ao Brasil com novo álbum após show memorável em 2019", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233143, "titulo": "Wicker review – Olivia Colman finds the perfect lover in intriguing folk-horror romance", "url": "https://www.theguardian.com/film/2026/oct/29/wicker-review-olivia-colman-finds-the-perfect-lover-in-intriguing-folk-horror-romance", "fonte_id": "guardian_culture", "data_pub": "2026-10-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Olivia Colman interpreta uma pescadora depressiva e perseguida no século medieval em Wicker, uma romance de horror folclórico que mistura elementos macabros com sentimentos. Peter Dinklage e Alexander Skarsgård coestrelam como um feiticeiro de cestos de vime que se torna o amante da protagonista. A obra, adaptada de uma história de 2006, revive o espírito de Shirley Jackson de forma peculiar.", "titulo_pt": "Wicker: Olivia Colman encontra o perfeito amante em romance de horror folclórico intrigante", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 233145, "titulo": "Are You With Me Now? by Hanif Kureishi review – back to basics", "url": "https://www.theguardian.com/books/2026/oct/29/are-you-with-me-now-by-hanif-kureishi-review-back-to-basics", "fonte_id": "guardian_culture", "data_pub": "2026-10-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hanif Kureishi começa a rebelar-se, após um ano hospitalar, não contra sua família ou sua condição tetraplégica, mas contra a homogeneidade de Shepherd’s Bush. Ele se pierça o ouvido e veste um chapéu Maga, esperando reações negativas.", "titulo_pt": "Are You With Me Now? De Hanif Kureishi - de volta às origens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 233150, "titulo": "‘Just come in’: 30 years of Maggie’s cancer care centres – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/oct/29/30-years-of-maggies-centres-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-10-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma exposição fotográfica comemora 30 anos dos centros Maggie’s, que oferecem suporte prático, emocional e social gratuito às pessoas afetadas pelo câncer. As fotos documentam os momentos cotidianos de conforto, conversa e pausa nas instalações dos centros.", "titulo_pt": "‘Apenas entre’: 30 anos dos centros Maggie’s de cuidados contra o câncer – em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 232643, "titulo": "'Razão e Sensibilidade': conheça o livro de Jane Austen que inspira o filme", "url": "https://exame.com/pop/razao-e-sensibilidade-conheca-o-livro-de-jane-austen-que-inspira-o-filme/", "fonte_id": "exame", "data_pub": "2026-10-29T05:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro 'Razão e Sensibilidade', de Jane Austen, explora o contraste entre razão e emoção através das experiências das irmãs Elinor e Marianne ": "https://www.theguardian.com/tv-and-radio/2026/oct/29/tv-tonight-its-already-time-for-the-years-first-christmas-special", "fonte_id": "guardian_culture", "data_pub": "2026-10-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sally Lindsay interpreta Jean, uma detetive que opera no mundo do comércio de antiguidades, que se envolve em uma investigação natalina após o corpo da prefeita de Sainte-Victoire ser encontrado no fontanário. A trama se desenrola em plena véspera de Natal, interrompendo os planos de casamento de Jean.", "titulo_pt": "TV desta noite: já é hora de um pouco de drama natalino", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 233151, "titulo": "South Park turns to America’s beef shortage – and explodes in diarrhea", "url": "https://www.theguardian.com/tv-and-radio/2026/oct/29/south-park-turns-to-americas-beef-shortage-and-explodes-in-diarrhea", "fonte_id": "guardian_culture", "data_pub": "2026-10-29T04:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 29º temporada de South Park teve seu primeiro episódio com pouca originalidade, focalizando um gag repetitivo que parece servir como arco narrativo. O episódio explorou a escassez de carne bovina nos Estados Unidos, mas a abordagem foi considerada pouco profunda.", "titulo_pt": "South Park usa escassez de carne bovina e explode em diarreia", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 232756, "titulo": "Hombre muere tras ser baleado en la comuna de Estación Central", "url": "https://www.latercera.com/nacional/noticia/hombre-muere-tras-ser-baleado-en-la-comuna-de-estacion-central/", "fonte_id": "la_tercera", "data_pub": "2026-10-29T09:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um cidadão chileno foi morto após ser baleado na comuna de Estação Central. A vítima foi levada a um hospital, mas não sobreviveu devido às gravidade das feridas.", "titulo_pt": "Homem morre após ser baleado em estação Central", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 232621, "titulo": "Adolescente denuncia MC Poze do Rodo por estupro; PCERJ investiga caso", "url": "https://www.metropoles.com/distrito-federal/na-mira/adolescente-denuncia-mc-poze-do-rodo-por-estupro-pcerj-investiga-caso", "fonte_id": "metropoles", "data_pub": "2026-10-29T09:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente de 16 anos denunciou ao PCERJ que foi estuprada pelo cantor MC Poze do Rodo. O abuso teria ocorrido na casa do artista, no Rio de Janeiro, no final de setembro.", "titulo_pt": "Adolescente denuncia MC Poze do Rodo por estupro; PCERJ investiga caso", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233016, "titulo": "Multicultural families struggle to see the perks under fire", "url": "https://www.koreaherald.com/article/10919681", "fonte_id": "korea_herald", "data_pub": "2026-10-29T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algumas imigrantes casadas em Coreia dizem que as recentes advertências do presidente Lee Jae Myung sobre os benefícios excessivos para famílias multicultural não refletem suas realidades. Eles e seus defensores alegam que o debate pode obscurecer os desafios continuos que enfrentam, alimentando hostilidade contra imigrantes.", "titulo_pt": "Famílias multiculturalistas lutam contra advertências sobre benefícios excessivos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 232752, "titulo": "Podría cambiar el sistema de multas en CABA: la Legislatura vota modificaciones en el scoring", "url": "https://www.lanacion.com.ar/autos/podria-cambiar-el-sistema-de-multas-en-caba-la-legislatura-vota-modificaciones-en-el-scoring-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-29T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei pro a Corina Machado visita zona devastada por terremoto en Venezuela", "url": "https://www.latercera.com/mundo/noticia/maria-corina-machado-visita-zona-devastada-por-terremoto-en-venezuela/", "fonte_id": "la_tercera", "data_pub": "2026-10-29T03:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A líder opositora venezuelana María Corina Machado visitou a zona afetada pelo terremoto na costa do estado de La Guaira, onde conversou com as vítimas e presenciou de perto os danos causados pelos sismos.", "titulo_pt": "María Corina Machado visita área afetada pelo terremoto em la guaira, Venezuela", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 231507, "titulo": "Senai oferece auxílio de até R$ 858 para cursos técnicos gratuitos", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/empreendedorismo-e-trabalho/senai-oferece-auxilio-de-ate-r-858-para-cursos-tecnicos-gratuitos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T01:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senai oferece auxílio de até R$ 858 para cursos técnicos gratuitos. O programa Autonomia e Renda Petrobras visa auxiliar participantes em situação de vulnerabilidade socioeconômica com bolsa mensal; as inscrições estão abertas até 3 de novembro.", "titulo_pt": "Senai oferece auxílio de até R$ 858 para cursos técnicos gratuitos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231600, "titulo": "En 2022, unos leñadores que trabajaban para unos vecinos invadieron la propiedad de una pareja de Mississippi y talaron 1.299 árboles: los damnificados recibieron 41.920 dólares de indemnización", "url": "https://www.clarin.com/estados-unidos/2022-lenadores-trabajaban-vecinos-invadieron-propiedad-pareja-mississippi-talaron-1299-arboles-damnificados-recibieron-41920-dolares-indemnizacion_0_PEde34wU6P.html", "fonte_id": "clarin", "data_pub": "2026-10-29T01:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2022, le
