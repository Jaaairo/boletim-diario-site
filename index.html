<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "01/10/2026 00:18", "stats": {"noticias_novas": 1089, "resumos_gerados": 253}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro Gilmar Mendes convocou os presidentes do STF (Supremo Tribunal Federal) e do STJ (Superior Tribunal de Justiça) para discutir ações judiciais envolvendo hospitais e o risco financeiro de R$ 24 bilhões para o SUS (Sistema Único de Saúde), mencionando precatórios. No outro desenvolvimento, o TSE (Tribunal Superior Eleitoral) manteve a publicação de posts sobre Flávio Bolsonaro e a padroeira Nossa Senhora Aparecida, após discussões sobre o alcance da medida. O ministro Mendonça criticou a confusão entre fake news e restrição à liberdade de fé no TSE. Na política, Lula, Caiado e Cury assinaram uma carta contra o trabalho escravo, enquanto Flávio Bolsonaro ameaçou retaliar diplomatas se eleito. A JOTA planeja cobertura ao vivo das Eleições 2026, com análises em tempo real, e o STF validou o acesso gratuito a sites da Justiça Eleitoral e de agências de checagem durante os períodos de 72 horas antes e 24 horas após cada turno das eleições.", "mundo": "O presidente dos Estados Unidos, Donald Trump, anunciou um investimento de 200 bilhões de dólares da Coreia do Sul em projetos norte-americanos, incluindo a construção de usinas nucleares e uma instalação de geração de energia no Texas. Enquanto isso, Andy Burnham, ministro do Interior britânico, sugeriu que o Reino Unido possa retornar à União Europeia (UE), uma ideia que foi bem recebida por Emmanuel Macron. Na Argentina, o presidente Javier Milei busca novos investidores para evitar uma recessão. No Iraque, a retirada das forças americanas levou a uma mistura de alívio e medo, deixando um vácuo de segurança. O líder norte-coreano Kim Jong-un enviou uma carta ao presidente chinês Xi Jinping, reafirmando seu compromisso de levar as relações bilaterais a um novo nível estratégico. Além disso, o ex-presidente do Federal Reserve, Jerome Powell, foi exonerado de acusações criminais por um Órgão de Inspeção Geral, embora o presidente dos EUA, Donald Trump, continue a pressionar para que ele renuncie ou seja processado.\n\nAs tensões geopolíticas estão evidentes na região do Oriente Médio e na Europa. Em primeiro lugar, o presidente sul-coreano Lee Jae Myung enfatizou a necessidade de reduzir as tensões militares com a Coreia do Norte, prometendo perseguir medidas para isso. No entanto, as relações entre o Irã e o Reino Unido estão sob pressão, com o primeiro-ministro britânico afirmando fortes indícios de envolvimento iraniano em um incidente de base aérea, negado pelo Irã. A Rússia, por sua vez, enviou uma advertência nuclear à NATO, ameaçando usar armas nucleares se a Europa tentar bloquear Kaliningrado, um enclave russo no Báltico. Em outro desenvolvimento, o secretário de Defesa dos Estados Unidos, Pete Hegseth, afirmou que as forças americanas destruíram a capacidade militar do Irã, uma declaração que reflete a crescente tensão entre os dois países.", "economia": "As exportações da Coreia do Sul atingiram um recorde de US$120,9 bilhões em setembro, impulsionadas por vendas robustas de chips, informou a Yonhap News. O ministro das Finanças da Coreia do Sul espera que as exportações ultrapassem 1 trilhão de dólares neste ano. O Brasil gerou um saldo de quase 4,6 milhões de empregos formais para beneficiários do Bolsa Família entre janeiro de 2023 e julho de 2026, de acordo com um estudo da FGV. A empresa australiana Lynas Rare Earths anunciou a compra de Meteoric Resources, responsável pelo Projeto Caldeira, um empreendimento de terras raras localizado no sul de Minas Gerais, por aproximadamente R$ 3,5 bilhões. A dívida bruta global atingiu US$365 trilhões, equivalente a 311% do PIB mundial, no primeiro semestre de 2026, de acordo com o Global Debt Monitor do IIF. O Brasil registrou uma dívida bruta de 82,9% do PIB em agosto, o maior nível em cinco anos, segundo o Banco Central. A inflação nos EUA desacelerou para 2,6% após mudanças de cálculo, o que pode reduzir as chances de um novo aumento da taxa de juros pelo Fed no próximo mês. A Coreia do Sul planeja investir 200 bilhões de dólares nos Estados Unidos em energia, parte de um acordo comercial de julho de 2025 com o governo de Trump. O presidente Lula prometeu criar um novo benefício para mães atípicas e cuidadoras a partir de 2027 no âmbito do INSS. O dólar caiu nesta quarta-feira após os dados de inflação dos Estados Unidos serem menores do que o esperado, enquanto os investidores acompanham o mercado de petróleo e o cenário eleitoral no Brasil.", "tecnologia": "A Coreia do Sul enfrentou uma derrota legal significativa, sendo condenada a pagar cerca de 50 milhões de dólares à Elliott em um caso relacionado à fusão da Samsung. O Google lançou seu mais avançado modelo de inteligência artificial, o Gemini 4 Argon, que apresenta melhorias em codificação, segurança cibernética e trabalhos complexos, mas o acesso está limitado a 'defensores cibernéticos de confiança'. A China domina o mercado de robôs humanoides, com fabricantes locais fornecendo mais de 95% das exportações globais. A Taiwan usa IA para combater ameaças de IA, enquanto a Google expandiu suas investigações em empresas de IA, incluindo Anthropic e OpenAI. O Reino Unido acusa a China de espionar pesquisas em IA e outras tecnologias por meio de acadêmicos, e o Pentágono envolveu Elon Musk e Palmer Luckey em um projeto militar com OpenAI.", "ciencia": "A NASA anunciou a seleção de três novas pesquisas científicas para o desenvolvimento da primeira base lunar, com o objetivo de aumentar o conhecimento sobre a Lua e contribuir para a construção da primeira base lunar para a humanidade. Além disso, a organização contratou a Modulate Space Corporation para desenvolver componentes-chave de um sistema de comunicação 5G para uso na superfície lunar, que inclui Wi-Fi 6. Em outro desenvolvimento, a NaviGate, uma empresa de tecnologia espacial, concluiu com sucesso a demonstração orbital do NaviCode Caravel, seu sistema de determinação orbital preciso, a bordo do satélite D-Orbit ION Carrier. Estes avanços tecnológicos e científicos demonstram o progresso contínuo em direção à exploração espacial e à criação de infraestruturas sustentáveis na Lua.", "cultura": "O Festival Psica 2026, que acontecerá em Belém de 11 a 13 de dezembro, promete agitar o cenário cultural com shows de artistas consagrados, como Alceu Valença e Zeca Pagodinho, além de outros nomes que seguem o conceito 'Nosso Tempo é o Norte'. O evento, com mais de 40 atrações, visa celebrar a música brasileira e a cultura do Norte do país. Em outra notícia cultural, o documentário premiado NAZA, sobre o assassinato sistemático de civis palestinos por Israel em Gaza, liderou o box office italiano em sua estreia, superando títulos como Avengers: Endgame - Encore, indicando a forte demanda por conteúdo que aborda temas sociais e políticos relevantes.", "sociedade": "Houve um incidente violento no Aeroporto Internacional do Galeão, no Rio de Janeiro, onde motoristas de cooperativa e de táxi entraram em conflito após uma mudança de ponto. A confusão resultou em agressões físicas entre os grupos. Em outro caso, um bombeiro foi preso após matar um estudante de medicina durante uma briga de trânsito em Taubaté, no interior de São Paulo. A Agência de Saúde do Brasil está considerando a implementação de licença parental para agricultores, enquanto o governo de Hong Kong planeja introduzir cuidadores estrangeiros qualificados para auxiliar na assistência aos idosos. Um novo plano de segurança alimentar foi lançado com o objetivo de reduzir a carga de doenças transmitidas por alimentos que afetam 43 milhões de pessoas nas Américas. O retartado, um tratamento para obesidade, foi estudado e mostrou que pacientes com obesidade ou sobrepeso e diabetes tipo 2 podem perder até 18,8% do peso corporal. Um médico venezuelano recebeu um prêmio da OPAS por avançar na saúde indígena e intercultural. O corpo de uma jovem de 21 anos foi encontrado carbonizado perto de uma creche no Distrito Federal, após o acionamento do 9° Batalhão da Polícia Militar.", "meio_ambiente": "O Reino Unido evitou a necessidade de importações de gás, graças à energia renovável proveniente do vento e do sol, durante a crise do Estreito de Ormuz. Em contraste, a Indonésia enfrenta incêndios florestais que levaram a Kuala Lumpur a ser classificada como a cidade mais poluída do mundo, com Singapura em terceiro lugar. No Brasil, a mudança climática está pressionando os preços dos alimentos, ameaçando a inflação, enquanto a população de jumentos caiu 94%. O aquecimento global está transformando as camadas polares, com o gelo do Ártico diminuindo em cerca de 50.000 km² por década. Além disso, a população de gado no Brasil aumentou quase 10% em relação à população humana em 2025. A Albemarle foi multada em mais de 4 bilhões de pesos chilenos por sobreexplotar o Salar de Atacama, e um macho de tartaruga marinheira verde, apelidado de Jurassic, foi libertado no Oceano Atlântico após um período de reabilitação. No México, o furacão Polo causou inundações e danos significativos, enquanto a crise energética na Europa levou a bombeiros a marcharem em Paris exigindo mais recursos e financiamento.", "direitos_humanos": "A Suprema Corte dos Estados Unidos confirmou a execução de Christa Pike, uma mulher condenada a morte há 31 anos, após várias disputas judiciais. Pike foi sentenciada em 1996 por assassinar uma colega de escola em Knoxville, Tennessee. O caso levanta questões sobre a justiça e a aplicação da pena de morte. Paralelamente, o governo francês reconheceu oficialmente como crime contra a humanidade a operação nazista e do regime colaboracionista Vichy que afetou 20 mil moradores do Velho Port de Marselha em 1943, após uma investigação de sete anos. O reconhecimento visa compensar e reconciliar as vítimas, marcando um passo importante na luta pelos direitos humanos na Europa."}, "resumo_do_dia": {"politica_nacional": [{"id": 187261, "titulo": "Gilmar cita precatórios e risco de R$ 24 bi ao SUS e cobra STJ e STF sobre ações de hospitais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/gilmar-cita-precatorios-e-risco-de-r-24-bi-ao-sus-e-cobra-stj-e-stf-sobre-acoes-de-hospitais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T02:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes acionou os presidentes do STF e do STJ para discutir ações judiciais envolvendo hospitais e a questão dos precatórios no setor de saúde, citando o risco financeiro de R$ 24 bilhões para o SUS.", "titulo_pt": "Gilmar cita precatórios e risco de R$ 24 bi ao SUS e cobra STJ e STF sobre ações de hospitais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187497, "titulo": "Lula, Cury e Caiado assinam carta de compromisso contra o trabalho escravo", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-cury-e-caiado-assinam-carta-de-compromisso-contra-o-trabalho-escravo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T02:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, Cury e Caiado assinaram uma carta de compromisso contra o trabalho escravo, enquanto Flávio, Renan e Zema não foram incluídos como signatários. A Conatrae vem apresentando esse documento a candidatos desde 2003.", "titulo_pt": "Lula, Cury e Caiado assinam carta de compromisso contra o trabalho escravo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 187262, "titulo": "Lula silencia sobre supersalários e rivais citam cortes genéricos no funcionalismo em planos de governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/lula-silencia-sobre-supersalarios-e-rivais-citam-cortes-genericos-no-funcionalismo-em-planos-de-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência emplacaram o combate aos supersalários como um tema importante em seus planos de governo, embora poucos detalhem como pretendem abordar a questão. Os rivais de Lula mencionam cortes genéricos no funcionalismo, sem entrar em detalhes específicos.", "titulo_pt": "Lula calado sobre supersalários, enquanto rivais falam de cortes gerais no funcionalismo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187264, "titulo": "Fazenda investiga Blaze por práticas irregulares durante carteado de R$ 325 mi de advogado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/fazenda-investiga-blaze-por-praticas-irregulares-durante-carteado-de-r-325-mi-de-advogado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Fazenda abriu um processo administrativo contra o site de apostas Blaze para investigar práticas irregulares relatadas por um advogado, que foi investigado no escândalo do INSS, após perder R$ 325 milhões em jogos online. A empresa pode ser multada em até R$ 2 bilhões.", "titulo_pt": "Fazenda investiga Blaze por práticas irregulares durante carteado de R$ 325 mi de advogado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187627, "titulo": "TSE manda excluir posts sobre Flávio Bolsonaro e padroeira, mas diverge sobre alcance da medida", "url": "https://www.jota.info/eleicoes/eleicoes-2026/tse-manda-excluir-posts-sobre-flavio-bolsonaro-e-padroeira-mas-diverge-sobre-alcance-da-medida", "fonte_id": "jota", "data_pub": "2026-10-01T01:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Tribunal Superior Eleitoral (TSE) votaram por 7 votos contra 0 para manter a publicação de Antonio Tabet. A decisão manteve os posts sobre Flávio Bolsonaro e a padroeira, mas divergiu sobre o alcance da medida.", "titulo_pt": "TSE mantém publicação sobre Flávio Bolsonaro e padroeira, mas diverge sobre alcance da medida", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 187509, "titulo": "Waack: TSE tenta reduzir interferência do STF na pauta", "url": "https://www.cnnbrasil.com.br/politica/waack-tse-tenta-reduzir-interferencia-do-stf-na-pauta/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T01:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino solicitou que a Polícia Federal investigasse casos de ataques a imagens religiosas, que ele considera parte de uma onda. O Tribunal Superior Eleitoral (TSE) está tentando reduzir a influência do Supremo Tribunal Federal (STF) na definição da pauta.", "titulo_pt": "Waack: TSE tenta diminuir influência do STF na pauta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 187418, "titulo": "TSE decide remover fake news que associam Nossa Senhora a Flávio Bolsonaro", "url": "https://www.metropoles.com/colunas/manoela-alcantara/tse-padroeira-nossa-senhora", "fonte_id": "metropoles", "data_pub": "2026-10-01T01:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relator do caso, André Mendonça, decidiu manter o post do ator Antonio Tabet no ar, após reconsiderar a decisão de removê-lo. A TSE (Tribunal Superior Eleitoral) analisou fake news que associam Nossa Senhora a Flávio Bolsonaro.", "titulo_pt": "TSE decide manter post que associa Nossa Senhora a Flávio Bolsonaro no ar", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 187512, "titulo": "TRE-PR libera aliados para pedirem votos a Deltan, que ainda está proibido", "url": "https://www.cnnbrasil.com.br/eleicoes/tre-pr-libera-aliados-para-pedirem-votos-a-deltan-que-ainda-esta-proibido/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T00:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A magistrada reafirmou a proibição de Deltan Dallagnol de participar ativamente da campanha. Aliados, no entanto, estão autorizados a pedir votos a ele.", "titulo_pt": "TRE-PR libera aliados para pedirem votos a Deltan, que ainda está proibido", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 187379, "titulo": "Pesquisa mostra a divisão de católicos e evangélicos entre Lula e Flávio no maior colégio eleitoral do país", "url": "https://veja.abril.com.br/politica/pesquisa-mostra-a-divisao-de-catolicos-e-evangelicos-entre-lula-e-flavio-no-maior-colegio-eleitoral-do-pais/", "fonte_id": "veja", "data_pub": "2026-10-01T00:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na pesquisa, os católicos tendem a votar mais para Lula, enquanto os evangélicos preferem Flávio Bolsonaro. No segundo turno, Flávio Bolsonaro lidera entre os evangélicos com 32 pontos percentuais de vantagem em relação a Lula.", "titulo_pt": "Pesquisa revela divisão entre católicos e evangélicos no segundo turno entre Lula e Flávio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 187628, "titulo": "Quem são e quais os números dos candidatos a governador de Rondônia (RO) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-e-quais-os-numeros-dos-candidatos-a-governador-de-rondonia-ro-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-01T00:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Seis candidatos disputam o cargo de governador de Rondônia nas eleições de 2026. A lista inclui nomes que concorrem à chefia do Palácio Rio Madeira.", "titulo_pt": "Quem são e quais os números dos candidatos a governador de Rondônia (RO) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 187268, "titulo": "Demora de Kassio no caso de Nossa Senhora acende luz vermelha no TSE", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/09/demora-de-kassio-no-caso-de-nossa-senhora-acende-luz-vermelha-no-tse.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T00:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, ministro Kassio Nunes Marques, ainda não pautou o julgamento do caso envolvendo a retirada de publicações sobre Nossa Senhora Aparecida das redes sociais, o que acende um alerta vermelho para os próximos dias até a votação de domingo.", "titulo_pt": "Atraso de Kassio no julgamento do caso Nossa Senhora acende alerta vermelho no TSE", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187432, "titulo": "Eduardo Bolsonaro ameaça retaliar diplomatas caso Flávio seja eleito", "url": "https://www.metropoles.com/brasil/eduardo-bolsonaro-ameaca-retaliar-diplomatas-caso-flavio-seja-eleito", "fonte_id": "metropoles", "data_pub": "2026-09-30T23:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro ameaçou retaliar diplomatas que, segundo ele, trabalharam para sabotar o governo do pai, Jair Bolsonaro. O deputado federal fez a declaração em relação a possíveis tentativas de influenciar a eleição de Flávio Bolsonaro.", "titulo_pt": "Eduardo Bolsonaro ameaça retaliar diplomatas caso Flávio seja eleito", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 187630, "titulo": "‘Toque’: Estela Aranha determina remoção de post de Nikolas que associa Lula a crimes contra crianças", "url": "https://www.jota.info/eleicoes/eleicoes-2026/toque-estela-aranha-determina-remocao-de-post-de-nikolas-que-associa-lula-a-crimes-contra-criancas", "fonte_id": "jota", "data_pub": "2026-09-30T23:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estela Aranha determinou a remoção de um post de Nikolas que associava Lula a crimes contra crianças. O postagem original tirava de contexto uma fala de Lula sobre 'toque' em mulheres.", "titulo_pt": "Estela Aranha determina remoção de post de Nikolas sobre Lula", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 187433, "titulo": "Em últimas propagandas no rádio, Lula ataca Flávio, que aposta em \"virada\"", "url": "https://www.metropoles.com/brasil/em-ultimas-propagandas-no-radio-lula-ataca-flavio-que-aposta-em-virada", "fonte_id": "metropoles", "data_pub": "2026-09-30T23:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro está investindo em novos jingles e mensagens com a participação de Tarcísio e Michelle para sua campanha. No entanto, em suas últimas propagandas no rádio, Lula está atacando Flávio, focando em acusações sobre milícias.", "titulo_pt": "Em últimas propagandas no rádio, Lula ataca Flávio, que aposta em 'virada'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 187436, "titulo": "Real Time Big Data: Paes tem 37% e Ruas, 31%, no 1º turno no Rio de Janeiro", "url": "https://exame.com/brasil/real-time-big-data-paes-tem-37-e-ruas-31-no-1o-turno-no-rio-de-janeiro/", "fonte_id": "exame", "data_pub": "2026-09-30T23:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paes obteve 37% dos votos e Ruas, 31%, no primeiro turno das eleições no Rio de Janeiro. Paes registrou uma elevação de 2 pontos percentuais em um mês, enquanto Ruas aumentou 10 pontos percentuais no mesmo período.", "titulo_pt": "Paes e Ruas lideram no primeiro turno nas eleições no Rio de Janeiro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 187437, "titulo": "Real Time: Ferraço tem 45% e Pazolini, 37%, no 1º turno no Espírito Santo", "url": "https://exame.com/brasil/real-time-ferraco-tem-45-e-pazolini-37-no-1o-turno-no-espirito-santo/", "fonte_id": "exame", "data_pub": "2026-09-30T23:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Ferraço lidera com 45% das intenções de voto no primeiro turno das eleições no Espírito Santo, seguido por Paolo Pazolini com 37%. Ferraço mantém uma vantagem significativa no cenário estadual e seria favorito em confrontos diretos de segundo turno, devido à sua alta aprovação.", "titulo_pt": "Ferraço e Pazolini disputam primeiro turno no Espírito Santo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 187708, "titulo": "Australia news live: PM says Shoebridge’s ‘replace Labor’ goal ‘somewhat concerning’; Anika Wells named in Time’s ‘influential rising stars’", "url": "https://www.theguardian.com/australia-news/live/2026/oct/01/labor-anthony-albanese-ato-ndis-thriving-kids-coalition-greens-leader-david-shoebridge-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-01T02:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do estado da Queensland não se inscreveu no programa federal Thriving Kids antes do seu lançamento. O programa visa fornecer suporte a crianças com idades até 8 anos que têm autismo leve a moderado ou atrasos de desenvolvimento. Os beneficiários ficarão ineligiíveis para auxílio federal através do NDIS a partir de 2028.", "titulo_pt": "Notícias da austrália em tempo real: líder diz que objetivo de Shoebridge de 'substituir o Labor' é 'um pouco preocupante'; Anika Wells nomeada na lista de jovens influentes da Time", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 187987, "titulo": "Trump says he raised case of Hong Kong’s Jimmy Lai with Xi", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/politics/trump-hong-kong-jimmy-lai-xi/", "fonte_id": "japan_times", "data_pub": "2026-10-01T02:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, discutiu o caso de Jimmy Lai, um ativista de Hong Kong, com o líder chinês Xi Jinping durante uma reunião em Washington. Trump enfrentou pressão para abordar casos humanitários de alto perfil durante o encontro.", "titulo_pt": "Trump discute caso de Jimmy Lai com Xi", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188166, "titulo": "(LEAD) Lee vows to seek measures to reduce military tensions with N. Korea", "url": "https://en.yna.co.kr/view/AEN20261001004251315", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T02:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung prometeu perseguir medidas para reduzir as tensões militares com a Coreia do Norte. Esta declaração foi feita em Seul no dia 1º de outubro, conforme informado pela Yonhap News.", "titulo_pt": "Lee promete buscar medidas para reduzir tensões militares com a Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 187988, "titulo": "Back in parliament, Takaichi will face her biggest test yet", "url": "https://www.japantimes.co.jp/news/2026/10/01/japan/politics/takaichi-parliament-test/", "fonte_id": "japan_times", "data_pub": "2026-10-01T02:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A sessão parlamentar lotada de 69 dias apresentará o maior desafio ainda para a liderança da primeira-ministra Sanae Takaichi.", "titulo_pt": "De volta ao parlamento, Takaichi enfrentará seu maior teste até agora", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188168, "titulo": "(URGENT) Lee says will finalize OPCON transfer from U.S. to realize self-reliant national defense", "url": "https://en.yna.co.kr/view/AEN20261001004000315", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T01:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee declarou que finalizará a transferência do controle operacional (OPCON) dos Estados Unidos para o país para alcançar uma defesa nacional autossustentada.", "titulo_pt": "Lee anuncia finalização da transferência do controle operacional para defesa nacional autossuficiente", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 188169, "titulo": "(URGENT) Lee says will continue taking measures to reduce military tension with N. Korea", "url": "https://en.yna.co.kr/view/AEN20261001004100315", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T01:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lee afirmou que continuará adotando medidas para reduzir a tensão militar com a Coreia do Norte.", "titulo_pt": "Lee diz que continuará tomada medidas para reduzir tensão militar com Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 187990, "titulo": "U.K. PM says ‘strong indications’ Iran involved in airbase incident", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/uk-pm-iran-airbase-incident/", "fonte_id": "japan_times", "data_pub": "2026-10-01T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Reino Unido afirmou que há fortes indícios de envolvimento do Irã em um incidente envolvendo uma base aérea. Em resposta, a embaixada do Irã em Londres negou categoricamente qualquer envolvimento no incidente perto de RAF Fairford.", "titulo_pt": "PM do reino unido afirma fortes indícios de envolvimento do Irã em incidente de base aérea", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 187991, "titulo": "Trump unveils $200 billion South Korean investment in U.S. projects", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/trump-200-billion-south-korea-investment/", "fonte_id": "japan_times", "data_pub": "2026-10-01T01:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou uma investimento de 200 bilhões de dólares de Coreia do Sul em projetos norte-americanos, incluindo a construção de usinas nucleares, um gasoduto de gás natural liquefeito (GNL) no Alasca e uma instalação de geração de energia no Texas.", "titulo_pt": "Trump anuncia investimento de 200 bilhões de dólares da Coreia do sul em projetos norte-americanos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 187651, "titulo": "Rusia amenaza a la OTAN con armas nucleares si bloquea un enclave en el Báltico", "url": "https://www.latercera.com/mundo/noticia/rusia-amenaza-a-la-otan-con-armas-nucleares-si-bloquea-un-enclave-en-el-baltico/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T01:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo russo enviou uma mensagem através de suas embaixadas na Irlanda, Reino Unido e Bélgica, ameaçando usar armas nucleares se tentarem bloquear Kaliningrado, localizado entre Polônia e Lituânia.", "titulo_pt": "Rússia ameaça Otan com armas nucleares se bloquear enclave Báltico", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 187993, "titulo": "France and Spain would welcome back U.K. if it rejoined EU", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/politics/france-spain-uk-eu/", "fonte_id": "japan_times", "data_pub": "2026-10-01T01:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Reino Unido, Andy Burnham, sugeriu a possibilidade de seu país retornar à União Europeia (UE). Esta ideia foi ventilada um dia após Burnham afirmar que o Reino Unido planeja estabelecer uma nova relação com a blocos europeu.", "titulo_pt": "França e Espanha aceitariam o reino unido se ele se reintegrasse à ue", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 187961, "titulo": "Iraq celebrates Sovereignty Day as US troops complete withdrawal", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/1/iraq-celebrates-sovereignty-day-as-us-troops-complete-withdrawal?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T01:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Iraqis comemoraram o Dia da Soberania durante uma celebração noturna que marcou o início de um feriado de quatro dias. As tropas americanas concluíram sua retirada do país.", "titulo_pt": "Irak comemora dia da soberania com início de feriado de quatro dias", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 187994, "titulo": "Russia sends nuclear warning to NATO as tensions rise in the Baltic", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/politics/russia-nuclear-nato-baltic/", "fonte_id": "japan_times", "data_pub": "2026-10-01T01:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um porta-voz do Ministério das Relações Externo da Rússia afirmou que, se Europa atacar a Rússia, isso resultaria em uma guerra muito rápida. A Rússia enviou uma advertência nuclear à NATO em meio a tensões crescentes no Báltico.", "titulo_pt": "Rússia emite advertência nuclear para NATO com aumento de tensões no báltico", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188172, "titulo": "Armed Forces Day anniv. celebrated with display of advanced weapons", "url": "https://en.yna.co.kr/view/AEN20260930009300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea comemorou o 78º aniversário do Dia das Forças Armadas exibindo armas avançadas. A celebração ocorreu em Seul no dia 1º de outubro.", "titulo_pt": "Dia das forças armadas comemorado com exibição de armas avançadas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 187851, "titulo": "Argentinian President Javier Milei seeks investors to support a struggling economy", "url": "https://www.lemonde.fr/en/international/article/2026/10/01/argentinian-president-javier-milei-seeks-investors-to-support-a-struggling-economy_6758126_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T00:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Javier Milei, presidente argentino, participa do Argentina Week forum em Paris buscando atrair novos investidores estrangeiros para tentar evitar uma recessão no país, com menos de um ano para a próxima eleição presidencial.", "titulo_pt": "Presidente argentino Javier Milei busca investidores em paris", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 188174, "titulo": "N. Korea's Kim vows to bring bilateral ties to 'new strategic level' in letter to Xi", "url": "https://en.yna.co.kr/view/AEN20261001002600315", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T00:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder norte-coreano Kim Jong-un enviou uma carta ao presidente chinês Xi Jinping, reafirmando seu compromisso de levar as relações bilaterais a um 'nível estratégico novo'.", "titulo_pt": "Kim jong-un promete melhorar as relações com a china", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 187848, "titulo": "Watchdog clears former US Fed chief Powell in renovation probe", "url": "https://www.lemonde.fr/en/international/article/2026/10/01/watchdog-clears-former-us-fed-chief-powell-in-renovation-probe_6758125_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T00:02:00Z", "idioma": "en", "provavel_duplicata_de": 187784, "texto_pt": "O Órgão de Inspeção Geral do Federal Reserve dos EUA não encontrou fundamentos razoáveis Proibição de apostas online pode transferir R$ 25 bilhões para sites ilegais, diz consultoria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187854, "titulo": "South Korea to invest $200 billion in US energy", "url": "https://www.lemonde.fr/en/economy/article/2026/10/01/south-korea-to-invest-200-billion-in-us-energy_6758124_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-30T23:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul planeja investir 200 bilhões de dólares nos Estados Unidos em energia. Esses investimentos fazem parte de um acordo comercial de julho de 2025 com Trump, que envolve tarifas sobre as importações sul-coreanas para os Estados Unidos.", "titulo_pt": "Coreia do sul investirá 200 bilhões de dólares nos EUA em energia", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 187273, "titulo": "Nubank nega negociação para comprar banco britânico Monzo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/nubank-nega-negociacao-para-comprar-banco-britanico-monzo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-30T22:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank negou estar buscando uma transação com a fintech britânica Monzo, após relatos de que estaria negociando a aquisição da empresa.", "titulo_pt": "Nubank nega negociação para comprar banco britânico Monzo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187631, "titulo": "MME prevê leilões de reserva anuais até 2029 e abre espaço para hidrelétricas reversíveis", "url": "https://www.jota.info/energia/mme-preve-leiloes-de-reserva-anuais-ate-2029-e-abre-espaco-para-hidreletricas-reversiveis", "fonte_id": "jota", "data_pub": "2026-09-30T22:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Energia Elétrica (ANEEL) planeja realiza sortium wins 840 bln-won plant deal in Vietnam", "url": "https://en.yna.co.kr/view/AEN20261001004400320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um consórcio liderado pela empresa sul-coreana de construção de plantas Doosan venceu um contrato de 840 bilhões de wones para uma planta em Vietnã.", "titulo_pt": "Conselho liderado por doosan vence contrato de 840 bilhões de wones para projeto no vietnã", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 188148, "titulo": "GS Entec to supply 37 monopiles for Taean wind project", "url": "https://www.koreaherald.com/article/10890233", "fonte_id": "korea_herald", "data_pub": "2026-10-01T02:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A subsidiária GS Entec, da GS Global, fornecerá 37 monopiles para o parque eólico marinho de Taean com capacidade de 504 megawatts, localizado na costa de Taean, Chungcheong do Sul. A produção começará em julho de 2027 e as entregas serão concluídas até o final de agosto de 2028.", "titulo_pt": "GS Entec fornecerá 37 monopiles para projeto eólico marinho de Taean", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 187989, "titulo": "Google grapples with employee skepticism about new Gemini 4", "url": "https://www.japantimes.co.jp/business/2026/10/01/tech/google-employee-skepticism-gemini-4/", "fonte_id": "japan_times", "data_pub": "2026-10-01T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gemini 4 obteve resultados superiores em vários testes de referência, mas há críticas internas sobre seu desempenho em tarefas como codificação.", "titulo_pt": "Google enfrenta desconfiança de funcionários sobre o novo Gemini 4", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 187845, "titulo": "AI to emit six times more CO₂ in 2030 than in 2025, experts warn", "url": "https://www.lemonde.fr/en/pixels/article/2026/10/01/ai-to-emit-six-times-more-co-in-2030-than-in-2025-experts-warn_6758128_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T01:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado pela organização francesa Green IT alerta que as emissões de gases de efeito estufa do setor de IA poderão atingir níveis preocupantes até o final da década. Além disso, essas emissões contribuirão para danos ambientais, incluindo poluição aquática e poluição por partículas finas.", "titulo_pt": "IA pode emitir seis vezes mais CO₂ em 2030 do que em 2025, alertam especialistas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 188040, "titulo": "China's humanoid robot lead widens, with domestic vendors supplying over 95% of global shipments", "url": "https://www.digitimes.com/news/a20261001PD208/robot-shipments-market-2026-idc.html", "fonte_id": "digitimes", "data_pub": "2026-10-01T01:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado chinês de robôs humanoides continuou a expandir-se rapidamente no primeiro semestre de 2026, com embarques acima de 19.000 unidades, representando cerca de 77,9% do total global. Fabricantes locais dominaram mais de 95% das exportações mundiais, reforçando a China como o maior mercado de robôs humanoides e a principal fonte de suprimento do setor.", "titulo_pt": "China amplia liderança no mercado de robôs humanoides, com fornecedores nacionais responsáveis por mais de 95% das exportações globais", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 188094, "titulo": "Taiwan using AI to counter AI threats", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/01/2003865194", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan está utilizando inteligência artificial para contrapor ameaças de inteligência artificial. O país está empregando tecnologias de IA para se defender contra possíveis ameaças relacionadas a IA.", "titulo_pt": "Taiwan usa AI para combater ameaças AI", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 187895, "titulo": "Google rolls out Gemini 4 Argon, its most advanced AI model", "url": "https://www.cnbc.com/2026/09/30/google-gemini-4-argon-ai.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-30T22:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Gemini 4 Argon é o modelo de inteligência artificial mais avançado da Alphabet, trazendo melhorias significativas em codificação, segurança cibernética e trabalhos profissionais complexos.", "titulo_pt": "Google lança Gemini 4 Argon, seu modelo de IA mais avançado", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 188000, "titulo": "U.K. accuses China of using academics to spy on AI and other tech research", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/politics/uk-china-academics-spy-ai-research/", "fonte_id": "japan_times", "data_pub": "2026-09-30T22:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O MI5 acusa a China de utilizar acadêmicos para espionar pesquisas em AI e outras tecnologias no Reino Unido. Mais de cem acadêmicos baseados no Reino Unido contribuíram para projetos financiados por um grupo com fortes ligações à inteligência de Beijing.", "titulo_pt": "Reino unido acusa China de usar acadêmicos para espionar pesquisas em AI e outras tecnologias", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 187924, "titulo": "US competition watchdog expands investigation of Anthropic and OpenAI", "url": "https://www.ft.com/content/a3075bf9-5b6c-40c8-bb6b-aca4422d1cbb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-30T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Comércio Federal dos Estados Unidos ampliou a investigação de empresas de inteligência artificial, incluindo Anthropic e OpenAI, solicitando informações e depoimentos dos executivos dessas empresas.", "titulo_pt": "Conselho de competição dos EUA expande investigação em Anthropic e OpenAI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 187904, "titulo": "Elon Musk, Palmer Luckey and Newt Gingrich to help Pentagon with warfare initiative, Hegseth says", "url": "https://www.cnbc.com/2026/09/30/musk-luckey-gingrich-pentagon-hegseth-.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-30T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pete Hegseth anunciou um projeto que envolve Elon Musk e Palmer Luckey, dois executivos de tecnologia que apoiam o GOP, para examinar as capacidades militares. Newt Gingrich também participará desse esforço em parceria com o Pentágono.", "titulo_pt": "Elon Musk, Palmer Luckey e Newt Gingrich auxiliarão o pentágono em iniciativa de guerra, diz Hegseth", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 187923, "titulo": "Google releases most advanced Gemini AI model", "url": "https://www.ft.com/content/46194a0b-a0e4-42cc-ad40-0df753492768?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-30T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante da tecnologia espera que o 'Argon', o modelo mais avançado do AI Gemini, ajude a reestabelecer sua posição à vanguarda da inteligência artificial.", "titulo_pt": "Google libera modelo avançado de AI Gemini", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 188135, "titulo": "The White House Is Starting to Panic Over the Midterms", "url": "https://www.wired.com/story/the-white-house-is-starting-to-panic-over-the-midterms/", "fonte_id": "wired", "data_pub": "2026-09-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump ainda acredita que os republicanos têm chances de sucesso nas eleições-médias. No entanto, seus assessores não estão tão confiantes.", "titulo_pt": "A casa branca começa a se preocupar com as eleições-médias", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 188129, "titulo": "Google announces Gemini 4 and says it’s so capable that only ‘trusted cyber defenders’ can have it right now", "url": "https://www.theverge.com/tech/1002980/google-gemini-4-argon", "fonte_id": "the_verge", "data_pub": "2026-09-30T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google anunciou seu novo modelo de IA, o Gemini 4 Argon, que oferece desempenho avançado em trabalhos complexos como engenharia de software, trabalho de conhecimento empresarial em áreas como lei e finanças, e defesa cibernética. No entanto, o acesso ao modelo está limitado atualmente a apenas 'defensores cibernéticos de confiança'.", "titulo_pt": "Google anuncia Gemini 4 e limita acesso a 'defensores cibernéticos de confiança'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 188137, "titulo": "The Battle to Be Your Personal AI Agent Is Here", "url": "https://www.wired.com/story/ai-agents-dots-devday-muse-battling-it-out/", "fonte_id": "wired", "data_pub": "2026-09-30T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI's Dots e Meta's Muse estão competindo para se tornarem seu agente AI preferido. O autor testou ambos e suspeita que outros também o farão.", "titulo_pt": "A batalha para ser o seu agente AI pessoal começou", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 188213, "titulo": "Galileo Space Is Building Satellites That Turn Signals Into Answers in Orbit", "url": "https://spacenews.com/galileo-space-is-building-satellites-that-turn-signals-into-answers-in-orbit/", "fonte_id": "spacenews", "data_pub": "2026-10-01T00:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Galileo Space está desenvolvendo satélites projetados para transformar sinais em respostas em órbita. Esses satélites fornecerão respostas rápidas sobre o que está acontecendo e onde, para operações militares e comerciais modernas.", "titulo_pt": "Galileo Space está construindo satélites que transformam sinais em respostas em órbita", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 188214, "titulo": "Curiosity Blog, Sols 5016–5021: Fantastic Minerals and How To Detect Them", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-5016-5021-fantastic-minerals-and-how-to-detect-them/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T23:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Curiosity detectou uma mudança no tipo de rochas no início da semana, passando de blocos de argilato finamente camadas para uma textura diferente. Os cientistas estão investigando essas novas rochas e como detectá-las.", "titulo_pt": "Curiosity Blog, Sols 5016–5021: minerais fantásticos e como detectá-los", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188179, "titulo": "STAT+: UnitedHealth investor lawsuit moves forward on allegations it ‘manufactured earnings’ to hide declining profits", "url": "https://www.statnews.com/2026/09/30/unitedhealth-investor-lawsuit-moves-forward-allegations-of-manufactured-earnings-to-hide-declining-profits/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-30T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um processo de investidor contra a UnitedHealth Group será permitido a seguir, pois o juiz federal negou o pedido da empresa para descartar as acusações de que ela 'fabricou receitas' para ocultar lucros decrescentes.", "titulo_pt": "Ação de investidor contra unitedhealth avança com acusações de 'fabricação de lucros'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 187391, "titulo": "A evolução do voo contada a partir do fóssil de um dinossauro chinês com penas", "url": "https://veja.abril.com.br/ciencia/a-evolucao-do-voo-contada-a-partir-do-fossil-de-um-dinossauro-chines-com-penas/", "fonte_id": "veja", "data_pub": "2026-09-30T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fóssil encontrado na China levou a análises que revelaram uma história diferente na evolução da anatomia usada pelos dinossauros para o voo.", "titulo_pt": "Evolução do voo contada a partir do fóssil de um dinossauro chinês com penas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 188215, "titulo": "Help Overlap Zoo Reveal Cosmic Dust", "url": "https://science.nasa.gov/get-involved/citizen-science/help-overlap-zoo-reveal-cosmic-dust/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Galáxias, grandes coleções de bilhões de estrelas, gás e poeira gravitacionalmente unidas, estão espalhadas pelo universo. Por vezes, duas galáxias alinham-se de tal forma que parecem se sobrepor no céu, formando galáxias que se sobrepõem de forma rara.", "titulo_pt": "Ajude a desvendar poeira cósmica", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188216, "titulo": "NASA Adds New Science Investigations for Moon Base", "url": "https://www.nasa.gov/news-release/nasa-adds-new-science-investigations-for-moon-base/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA selecionou três novas investigações científicas e seus conjuntos de carga para aumentar o conhecimento sobre a Lua e contribuir para o desenvolvimento da primeira base lunar para a humanidade. Os instrumentos científicos e tecnologias selecionados serão usados para esse propósito.", "titulo_pt": "NASA adiciona novas investigações científicas para Base lunar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188217, "titulo": "NASA Awards Contract to Develop 5G Communications for Moon", "url": "https://www.nasa.gov/news-release/nasa-awards-contract-to-develop-5g-communications-for-moon/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA concedeu uma contratação à Modulate Space Corporation para desenvolver elementos-chave de um sistema de comunicações 5G para uso na superfície da Lua, com Wi-Fi 6 integrado, para o Centro de Pesquisa Glenn em Cleveland. Este esforço acelerado engloba duas áreas de trabalho principais que juntas desenvolverão uma capacidade de comunicações escalável e baseada em padrões.", "titulo_pt": "NASA contrata desenvolvimento de comunicações 5G para a lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188180, "titulo": "STAT+: HHS announces new efforts to speed up, expand clinical trials with AI", "url": "https://www.statnews.com/2026/09/30/hhs-arpa-h-clinical-trials-artificial-intelligence-surpass-program/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-30T20:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Secretaria de Saúde Federal anuncia novas iniciativas para acelerar e expandir os ensaios clínicos com a ajuda da inteligência artificial. Os esforços visam competir com países como a China no desenvolvimento de pesquisas clínicas.", "titulo_pt": "HHS anuncia novas iniciativas para acelerar e expandir ensaios clínicos com AI", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 187567, "titulo": "As construções monumentais 'escondidas' na Amazônia descobertas por cientistas", "url": "https://www.bbc.com/portuguese/articles/cm4gvnv14zlgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-30T19:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas usaram tecnologia avançada para descobrir construções antigas na Amazônia, revelando a presença de estruturas construídas por séculos em uma região que pode ter abrigado milhões de pessoas. O trabalho foi publicado no periódico acadêmico Nature.", "titulo_pt": "Construções monumentais 'escondidas' na Amazônia descobertas por cientistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 187459, "titulo": "Lua pode esconder detritos de civilizações alienígenas extintas", "url": "https://exame.com/ciencia/lua-pode-esconder-detritos-de-civilizacoes-alienigenas-extintas/", "fonte_id": "exame", "data_pub": "2026-09-30T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas sugerem examinar o solo lunar em busca de partículas microscópicas artificiais que possam ter vindo de civilizações alienígenas extintas. O objetivo é analisar se há indícios de detritos de outras civilizações que poderiam ter viajado pela galáxia.", "titulo_pt": "Lua pode esconder detritos de civilizações alienígenas extintas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 188218, "titulo": "NASA, International Partners Advance Work on Space Crops", "url": "https://science.nasa.gov/science-research/biological-physical-sciences/nasa-international-partners-advance-work-on-space-crops/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T18:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA, a CSA (Agência Canadense Espacial) e o Centro Aeronáutico Alemão assinaram um acordo para iniciar trabalhos coordenados na Terra com o objetivo de aprender a cultivar alimentos na Lua.", "titulo_pt": "NASA, parceiros internacionais avançam no desenvolvimento de agricultura espacial na lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188219, "titulo": "Star Trails", "url": "https://www.nasa.gov/image-article/star-trails/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem longa duração mostra trilhas estelares acima da Terra, luzes azuis de barcos de pesca e luzes amarelas de cidades indonésias estendendo-se abaixo da Estação Espacial Internacional, que orbitava a 258 milhas acima do Mar de Banda em 20 de setembro de 2026.", "titulo_pt": "Trilhas estelares", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188231, "titulo": "NASA directive might increase the odds of contaminating Mars", "url": "https://www.scientificamerican.com/article/nasa-directive-might-increase-the-odds-of-contaminating-mars/", "fonte_id": "scientific_american", "data_pub": "2026-09-30T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova diretriz dos EUA relaxa as regras para esterilização de spacecrafts destinadas a Marte e propõe modernizar a ciência da 'proteção planetária'.", "titulo_pt": "Diretriz da NASA pode aumentar riscos de contaminar marte", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 188232, "titulo": "The Atlantic hurricane season has been so quiet it’s unprecedented", "url": "https://www.scientificamerican.com/article/for-the-first-time-no-hurricanes-have-formed-in-the-atlantic-this-season-so-far/", "fonte_id": "scientific_american", "data_pub": "2026-09-30T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temporada hurricânea do Atlântico tem sido muito calma, mais do que os previsores esperavam. O El Niño tem impedido a formação de tempestades de maneira ainda maior do que foi projetado.", "titulo_pt": "A temporada hurricânea do atlântico tem sido inéditamente calma", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 188210, "titulo": "PAHO and Canada’s Bruyère Health Research Institute strengthen partnership to advance disease elimination in the Americas", "url": "https://www.paho.org/en/news/30-9-2026-paho-and-canadas-bruyere-health-research-institute-strengthen-partnership-advance", "fonte_id": "paho", "data_pub": "2026-09-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO e o Instituto Bruyère de Pesquisa em Saúde do Canadá fortaleceram sua parceria para avançar na eliminação de doenças na América.", "titulo_pt": "PAHO e instituto Bruyère de pesquisa em saúde do canadá fortalecem parceria para avançar na eliminação de doenças na américa", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 188212, "titulo": "A new map points out U.S. rivers most worth protecting", "url": "https://www.sciencenews.org/article/new-map-rivers-conservation-protection", "fonte_id": "science_news", "data_pub": "2026-09-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas avaliaram todas as nascentes e riachos nos Estados Unidos contíguos, identificando as necessidades específicas de reparos para suportar a vida aquática.", "titulo_pt": "Novo mapa destaca rios americanos mais merecedores de proteção", "veiculo": "Science News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 187286, "titulo": "Anne Hathaway e Dakota Johnson estrelam 'Verity', adaptação para o cinema de livro de Colleen Hoover", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/cinema/2026/09/anne-hathaway-e-dakota-johnson-estrelam-verity-adaptacao-para-o-cinema-de-livro-de-colleen-hoover.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O suspense erótico 'Verity' estreia nos cinemas nesta quinta-feira, 1º. Anne Hathaway e Dakota Johnson protagonizam a adaptação do livro de Colleen Hoover, envolvendo-se em uma história de desejo e segredos.", "titulo_pt": "Anne Hathaway e Dakota Johnson estrelam 'Verity', adaptação para o cinema de livro de Colleen Hoover", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 187287, "titulo": "Make Hommus, Brisa do Baru e Mica participam de festival gastronômico da Folha", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/restaurantes/2026/09/make-hommus-brisa-do-baru-e-mica-participam-de-festival-gastronomico-da-folha.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Folha Gourmet Festival, que ocorrerá nos dias 7, 8, 14 e 15 de novembro, apresentará sabores da América Latina e do Oriente Médio, incluindo a produção inovadora de chocolate da Mica, premiada loja que combina delicadeza e bom humor na confecção.", "titulo_pt": "Make Hommus, Brisa do Baru e Mica participam no festival gourmet da Folha", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 187289, "titulo": "'Quem Ama Cuida': Adriana escolhe Tom como alvo após tentativa de sequestro de Pedro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2025/09/adriana-escolhe-tom-como-alvo-apos-tentativa-de-sequestro-de-pedro-em-quem-ama-cuida.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-30T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Adriana escolhe Tom como novo alvo após se vingar de Ademir e Ulisses. Tom será alvo do plano de Pilar contra Pedro, o que o coloca na mira de Adriana em 'Quem Ama Cuida'.", "titulo_pt": "Adriana escolhe Tom como alvo após sequestro de Pedro", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 187290, "titulo": "Cine Marabá, um dos mais antigos do país, pode fechar depois de ordem de despejo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/cine-maraba-um-dos-mais-antigos-do-pais-pode-fechar-apos-ordem-de-despejo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-30T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cinema Multiplex Playarte Marabá, localizado na avenida Ipiranga, no centro de São Paulo, desde 1944, pode fechar as portas devido a um processo de despejo que será julgado pelo
