<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "01/10/2026 19:16", "stats": {"noticias_novas": 661, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A secretária Estela Aranha, do Tribunal Superior Eleitoral (TSE), determinou que a Rede Globo não pode exibir o púlpito reservado ao presidente Lula durante o debate presidencial, garantindo assim a igualdade entre os candidatos. Em outro desenvolvimento, o Supremo Tribunal Federal (STF) encaminhou a questão do reajuste em planos de saúde para conciliação, envolvendo contratos anteriores ao Estatuto do Idoso e com um prejuízo estimado de R$ 40 bilhões para as operadoras. Nas eleições, o Rio de Janeiro registra 37 candidatos do Partido dos Trabalhadores (PT) a deputado federal, 44 do PSDB, e 47 cada do PSB e do PSD, disputando 46 cadeiras na Câmara dos Deputados. Além disso, pelo menos 30 candidatos suspeitos de ligação com o crime organizado foram identificados pelo sistema eleitoral.", "mundo": "O mundo enfrenta diversos desafios políticos, econômicos e sociais. O Canadá está considerando a construção de um novo oleoduto do Alberta, que pode aliviar tensões internas e fortalecer as relações com os Estados Unidos. Em um incidente de segurança aérea, o co-piloto de um voo da FlyDubai atacou o piloto no Emirado Árabe Unidos, levando a uma investigação e a suspensão do serviço entre Dubai e Tel Aviv. Nos Estados Unidos, a Suprema Corte analisará uma política de detenção indeterminada de imigrantes ilegais, enquanto a cidade de Nova York enfrenta problemas no sistema Medicaid de um bilhão de dólares. Em Israel, o primeiro-ministro Benjamin Netanyahu acusa o co-piloto de 'indoctrinação islâmica radical', embora não forneça detalhes. Na França, estudantes de Saint-Denis protestam por melhores condições de aprendizado, comparando-as com áreas mais privilegiadas, enquanto a Venezuela recebe uma unidade do grupo Lide, liderado por João Doria, em um momento de abertura econômica e política. Por outro lado, o ex-presidente dos Estados Unidos, Donald Trump, desviou fundos de ajuda para a Ucrânia para América Latina, contrariando os democratas. Em um desenvolvimento legal, Mike Smith, o ator de 'Trailer Park Boys', teve um processo de acusação de assédio sexual arquivado. A Alemanha está preparada para enfrentar ataques híbridos da Rússia na Ucrânia, enquanto o presidente russo, Vladimir Putin, rejeitou uma proposta de Washington para um cessar-fogo de ataques a longo alcance. Na Índia, o partido de oposição e o movimento Rã Viva ameaçam organizar manifestações devido a novas acusações de viés na Comissão Eleitoral. O Brasil enfrenta críticas internacionais por possíveis financiamentos dos EUA a ataques contra o Supremo Tribunal Federal, enquanto o governo Lula espera que Trump envie propostas de negociação de tarifas após as eleições. No último debate presidencial das eleições 2026, a TV Globo incluirá Flávio Bolsonaro como candidato, mas Lula não participará. Além disso, a Índia e o Eritreo romperam relações diplomáticas devido a agravamentos de conflitos internos, enquanto a Etiópia suspendeu o serviço aéreo com a FlyDubai após o incidente no cockpit.\n\nA geopolítica global está em um estado de tensão significativa, com vários conflitos e desafios em diferentes regiões. Em primeiro lugar, a Rússia, sob o comando de Putin, ameaça o uso de armas nucleares para defender a exclave de Kaliningrado, enquanto mantém a postura de não planejar atacar países europeus. O presidente russo reiterou que responderá com todos os meios de defesa à agressão. Paralelamente, os Estados Unidos estão considerando ataques ao Irã, com a porta-aviões USS Theodore Roosevelt pronta para chegar ao Oriente Médio. No Iêmen, a escalada de conflitos entre hutis e forças governamentais continua, com relatos de ataques a supertanqueiros no Estreito de Ormuz. Em outro ponto, a Turquia negou relatos de uma suposta reunião entre representantes da Síria e do Hezbollah em seu território, enquanto a Síria também negou a realização do encontro. Além disso, a China está atenta às eleições da Duma russa, com a liderança chinesa interessada na estabilidade do vizinho. No contexto regional, a escalada de tensões entre Eritreia e Etiópia levou a um rompimento diplomático, com ambas fechando suas embaixadas. O conflito no Mar Vermelho também continua, com Eritreia e Etiópia acusando-se mutuamente de hostilidades. Em um desenvolvimento mais próximo, o governo dos Estados Unidos financiou um projeto que contesta a atuação do STF no Brasil, revelado pelo jornal The Guardian. A geopolítica global parece estar em um momento crítico, com diversos conflitos regionais e disputas geopolíticas em andamento.", "economia": "O Ibovespa encerrou em alta, impulsionado pela Petrobras, após um dia volátil, enquanto os investidores aguardavam o primeiro turno das eleições. O índice de volatilidade VIX Brasil atingiu novos recordes históricos, refletindo a proximidade do pleito e a presença de tensões geopolíticas. O vice-presidente da política monetária do Federal Reserve, Philip Jefferson, sinalizou que o banco central manterá as taxas de juros estáveis em outubro. Em outro desenvolvimento, o Ibovespa registrou o maior volume de resgates líquidos em fundos de investimentos isentos de Imposto de Renda desde 2021, de acordo com um levantamento da plataforma Credit Guide. A ArcelorMittal, uma das maiores produtoras de aço do mundo, está projetando investimentos adicionais de mais de R$ 10 bilhões no Brasil, após a redução do aço chinês no mercado brasileiro. A carne cultivada em laboratório está sendo explorada para ser utilizada em ração animal, sushi e chocolate, além de alimentos para humanos, com a indústria almejando expandir seu mercado além da dieta carnívora ética. O Banco Central do Reino Unido atingiu juros de 6%, o maior nível desde 1998, devido à disparada do petróleo e aos temores de uma nova onda inflacionária, pressionando as contas públicas e o governo britânico. Além disso, a carne bovina brasileira pagará uma tarifa total de 67% para entrar no mercado chinês a partir de 1º de outubro, devido ao esgotamento da cota anual de exportações. O preço do cobre pode chegar a US$ 10 por libra no próximo ano, de acordo com um estudo do Deutsche Bank, embora isso reflita incertezas relacionadas à arrecadação de Trump e à acumulação de estoques.", "tecnologia": "Lyft pagará US$ 272,5 milhões para resolver uma ação judicial que questionava a classificação de seus motoristas como terceirizados, mantendo a incerteza sobre a classificação deles como empregados. A startup Armadin, liderada por Kevin Mandia, levantou US$ 255,5 milhões e lançou uma solução de segurança baseada em agentes em swarms. Cyber 2026 destaca como a inteligência artificial está transformando a maneira de comprar em varejo, com marcas enfrentando desafios em captar, entender e competir por demanda. A Nike planeja cortar funcionários e abrir um campus na Índia como parte de sua reestruturação, prevendo uma diminuição nas receitas no próximo ano. A OpenAI está lançando novas funcionalidades de compra para o ChatGPT, permitindo que os usuários virtualmente experimentem roupas e acessórios usando suas próprias fotos. A Fervo Energy concluiu sua primeira central termal de energia geotérmica em menos de dois anos, com as próximas fases prometendo conectá-la à rede elétrica rapidamente. Além disso, a empresa OpenAI acusa a Moonshot AI, responsável pelo Kimi, de ter participado, ao menos parcialmente, de um ataque de destilação contra o ChatGPT.", "ciencia": "A NASA lançou a missão Crew-13 com astronautas da NASA, CSA e Roscosmos para a Estação Espacial Internacional, demonstrando a capacidade dos Estados Unidos em voos espaciais com tripulação e a força de suas parcerias comerciais. Um estudo internacional mostrou como as plantas em flor e seus polinizadores dependem um do outro, revelando que o clima é o fator que melhor explica as parcerias especializadas, mais do que a latitude. Além disso, a DeepMind, divisão do Google, desenvolveu marcas invisíveis para proteínas projetadas por inteligência artificial, com o objetivo de proteger a autenticidade e tracar a origem dessas proteínas.", "cultura": "O Dia Latino-Americano e Caribenho de Luta pela Descriminalização e Legalização do Aborto, celebrado em 28 de setembro de 2026, marcou um momento importante na luta feminista no Brasil. A autora do artigo acompanhou uma passeata realizada por mulheres em comemoração ao evento, destacando a participação de Rute Alonso, da União de Mulheres, que fez um discurso sobre a importância da luta. Em outros eventos culturais, o festival Austin City Limits apresentará performances de artistas como Charli XCX, Geese, the xx, Lorde, Skrillex, The War on Drugs e Turnstile. Além disso, a TV Brasil estreia a segunda temporada do seriado Aprender a Sonhar, que retrata a jornada acadêmica de estudantes de periferia e quilombolas, enquanto a marca BMÉS, de Bruna Malheiros, anuncia um crescimento de 20% após um rebranding que visa ampliar sua distribuição internacional.", "sociedade": "Um ex-namorado acusado de femicídio foi detido no Rio Grande do Sul, mas foi atacado por moradores quando transportado em uma camioneta. Em São Paulo, um homem morreu e uma mulher foi baleada enquanto amamentava o bebê durante uma briga em um haras, o que levou a investigações sobre o motivo do tiroteio. No Rio de Janeiro, uma operação do Ministério do Trabalho e Emprego resgatou 67 trabalhadores em condições semelhantes à escravidão em uma usina de etanol. O presidente Lula assinou um parecer que permite que mulheres vítimas de violência doméstica tenham um afastamento remunerado de até seis meses sem a necessidade de perícia médica para receber o benefício do INSS. Além disso, a educação executiva tem se destacado como uma ferramenta importante para acelerar as carreiras e as lideranças femininas, através de formação, mentoria e networking. Em uma pesquisa realizada pela Marca Brasil, as mulheres percebem o setor agrícola como um 'motor setorial' do Brasil, avaliando-o positivamente em termos de qualidade, produtos e serviços oferecidos.", "meio_ambiente": "O clima e os impactos ambientais têm sido temas de crescente preocupação em vários países. No Brasil, o custo climático já contratado é considerado um assunto importante, apesar de não ter sido amplamente debatido nas campanhas eleitorais. Em contraste, a Suíça enfrenta uma situação dramática, com glaciares perdendo 20% de seu volume em apenas cinco anos, um fenômeno atribuído a ondas de calor e derretimentos recordes. O verão mais quente da história registrou mais de 34.600 mortes por calor em países ocidentais da Europa, refletindo a gravidade das mudanças climáticas. No Brasil, o mês de outubro começa com temporais no Sudeste e temperaturas de até 40°C no Nordeste, enquanto o Glacier Rhône na Suíça perdeu 5,5% de seu gelo nos primeiros oito meses do ano, refletindo a aceleração da derivação de gelo devido a ondas de calor e um inverno seco. Estes eventos e tendências indicam a urgência de ações imediatas para enfrentar as mudanças climáticas e proteger o meio ambiente.", "direitos_humanos": "A Suprema Corte dos Estados Unidos permitiu a execução iminente de Christa Pike, uma mulher condenada há mais de 30 anos à morte no Tennessee, após longas disputas judiciais. Pike, a única mulher na prisão da morte do estado, sobreviveu a duas tentativas de execução por injeção letal, o que levantou dúvidas sobre os procedimentos penitenciários. Em outro caso, a família de Renee Good, uma mulher morta por um oficial de imigração em Minneapolis, acionou a administração Trump em uma ação judicial, acusando os oficiais de imprudência e violações de direitos civis. A situação de Christa Pike e Renee Good reflete os desafios e controvérsias envolvidos no sistema penal e de imigração dos EUA. Além disso, a Corte Suprema sul-coreana anulou a decisão de um escritório de imigração que negou uma revisão completa de um pedido de asilo de um homem africano perseguido por sua orientação sexual, em um caso que destaca a luta por direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 190397, "titulo": "Ministra do TSE decide que Globo não pode mostrar púlpito de Lula vazio em debate", "url": "https://www.jota.info/eleicoes/eleicoes-2026/ministra-do-tse-decide-que-globo-nao-pode-mostrar-pulpito-de-lula-vazio-em-debate", "fonte_id": "jota", "data_pub": "2026-10-01T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Estela Aranha do Tribunal Superior Eleitoral (TSE) determinou que a Globo não pode exibir um púlpito vazio durante o debate com Lula. Ela também estabeleceu limites para a dinâmica de perguntas ao candidato ausente, atendendo a um pedido da coligação de Lula.", "titulo_pt": "Ministra do TSE proíbe Globo de mostrar púlpito vazio de Lula em debate", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 190170, "titulo": "TRE-DF faz simulado de teste de autenticidade e integridade das urnas", "url": "https://www.metropoles.com/distrito-federal/tre-df-faz-simulado-de-teste-de-autenticidade-e-integridade-das-urnas", "fonte_id": "metropoles", "data_pub": "2026-10-01T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRE-DF realizou um simulado de teste de autenticidade e integridade das urnas na tarde de 1º de outubro, na CLDF. No dia das eleições, 100 servidores participarão dos testes.", "titulo_pt": "TRE-DF realiza simulado de teste de urnas eletrônicas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 190062, "titulo": "Ministra do TSE veta que Globo mostre púlpito vazio reservado a Lula em debate", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ministra-do-tse-veta-que-globo-mostre-pulpito-vazio-reservado-a-lula-em-debate.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Estela Aranha, do TSE, proibiu a Rede Globo de exibir o púlpito reservado ao presidente Lula durante o debate presidencial desta quinta-feira. A decisão visa garantir a igualdade entre os candidatos.", "titulo_pt": "Ministra do TSE proíbe Globo de mostrar púlpito vazio para Lula em debate", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 190398, "titulo": "STF encaminha para conciliação reajuste em planos de saúde para contratos anteriores ao Estatuto do Idoso", "url": "https://www.jota.info/stf/do-supremo/stf-encaminha-para-conciliacao-reajuste-em-planos-de-saude-para-contratos-anteriores-ao-estatuto-do-idoso", "fonte_id": "jota", "data_pub": "2026-10-01T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) encaminhou a questão do reajuste em planos de saúde para conciliação, envolvendo contratos anteriores ao Estatuto do Idoso. A Confederação Nacional de Seguros Privados (CNSeg) estima um prejuízo de R$ 40 bilhões para as operadoras se a versão favorável aos segurados prevalecer.", "titulo_pt": "STF encaminha reajuste em planos de saúde para conciliação envolvendo contratos anteriores ao Estatuto do Idoso", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Saiba quem são os candidatos a deputado federal pela Rede no RJ", "sumario": "O partido Rede tem dois candidatos a deputado federal registrados no Tribunal Superior Eleitoral no estado do Rio de Janeiro, que possui 46 cadeiras na Câmara dos Deputados em disputa. O Rio de Janeiro possui quatro candidatos do PCdoB inscritos no TSE (Tribunal Superior Eleitoral) para disputar o cargo de deputado estadual, em um total de 70 vagas na Assembleia Legislativa. O Partido Verde (PV) tem cinco candidatos a deputado federal registrados no Tribunal Superior Eleitoral (TSE) no estado do Rio de Janeiro, onde 46 cadeiras na Câmara dos Deputados estão em disputa.", "artigos": [{"id": 190187, "titulo": "Saiba quem são os candidatos a deputado federal pela Rede no RJ", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-quem-sao-os-candidatos-a-deputado-federal-pela-rede-no-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Rede tem dois candidatos a deputado federal registrados no Tribunal Superior Eleitoral no estado do Rio de Janeiro, que possui 46 cadeiras na Câmara dos Deputados em disputa.", "titulo_pt": "Saiba quem são os candidatos a deputado federal pela Rede no RJ", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 190188, "titulo": "Saiba quem são os candidatos a deputado estadual pelo PCdoB no RJ", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-quem-sao-os-candidatos-a-deputado-estadual-pelo-pcdob-no-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio de Janeiro possui quatro candidatos do PCdoB inscritos no TSE (Tribunal Superior Eleitoral) para disputar o cargo de deputado estadual, em um total de 70 vagas na Assembleia Legislativa.", "titulo_pt": "Conheça os candidatos a deputado estadual pelo PCdoB no RJ", "veiculo": "CNN Bras  no RJ", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-quem-sao-os-candidatos-a-deputado-federal-pelo-psb-no-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSB tem 47 candidatos a deputado federal registrados no TSE. O estado do Rio de Janeiro tem 46 cadeiras na Câmara dos Deputados em disputa.", "titulo_pt": "Conheça os candidatos a deputado federal pelo PSB no RJ", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}]}, {"titulo": "Saiba qual é o número de William Siri, candidato ao governo do RJ", "sumario": "No próximo domingo (4), os eleitores votarão para deputado federal, deputado estadual ou distrital, duas vezes para senador, governador e presidente.", "artigos": [{"id": 190193, "titulo": "Saiba qual é o número de William Siri, candidato ao governo do RJ", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-qual-e-o-numero-de-william-siri-candidato-ao-governo-do-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No próximo domingo (4), os eleitores votarão para deputado federal, deputado estadual ou distrital, duas vezes para senador, governador e presidente.", "titulo_pt": "Saiba qual é o número de William Siri, candidato ao governo do RJ", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 190199, "titulo": "Saiba qual é o número de Luan Monteiro, candidato ao governo do RJ", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-qual-e-o-numero-de-luan-monteiro-candidato-ao-governo-do-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No próximo domingo (4), os eleitores votarão para deputado federal, deputado estadual ou distrital, duas vezes para senador, governador e presidente.", "titulo_pt": "Saiba qual é o número de Luan Monteiro, candidato ao governo do RJ", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 190203, "titulo": "Saiba qual é o número de Juliete, candidata ao governo do RJ", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-qual-e-numero-de-juliete-candidata-ao-governo-do-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No próximo domingo (4), os eleitores votarão para deputado federal, deputado estadual ou distrital, duas vezes para senador, governador e presidente. A notícia aborda as opções de voto disponíveis aos eleitores no próximo pleito no estado do Rio de Janeiro.", "titulo_pt": "Saiba qual é o número de Juliete, candidata ao governo do RJ", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}]}], "mundo": [{"id": 189722, "titulo": "Navy vice admiral joins CGA top ranks", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/02/2003865244", "fonte_id": "taipei_times", "data_pub": "2026-10-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vice-almirante da Marinha ingressou nas altas esferas da Comissão de Gestão de Acidentes (CGA).", "titulo_pt": "Vice-almirante se integra aos níveis superiores da CGA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 190388, "titulo": "Canada’s Proposed Oil Pipeline Offers Carney Relief From Domestic and Global Turmoil", "url": "https://www.nytimes.com/2026/10/01/world/canada/carney-alberta-british-columbia-oil-pipeline.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo oleoduto do Alberta, que transportará óleo dos campos de areia para a costa do Pacífico, pode reduzir as tensões separatistas na província enquanto também fortalece as relações energéticas com os Estados Unidos.", "titulo_pt": "Novo oleoduto no canadá pode aliviar tensões separatistas e fortalecer relações energéticas", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 190390, "titulo": "Investigators Seek Motive for FlyDubai Cockpit Attack", "url": "https://www.nytimes.com/2026/10/01/world/middleeast/flydubai-attack-invesigation.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O investigador da aeronáutica busca entender o motivo do co-piloto atacar o piloto em um voo da FlyDubai. O primeiro-ministro de Israel, Benjamin Netanyahu, afirmou que o co-piloto havia passado por 'indoctrinação islâmica radical', mas não forneceu detalhes.", "titulo_pt": "Investigadores buscam motivo do ataque no Cockpit da FlyDubai", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 190018, "titulo": "Suprema Corte dos EUA julgará política de deter imigrantes que vivem há anos no país", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/suprema-corte-dos-eua-julgara-politica-de-deter-imigrantes-que-vivem-ha-anos-nos-eua.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-01T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos decidiu analisar uma política do governo de Donald Trump que determina o detenção indeterminada de imigrantes que cruzaram ilegalmente a fronteira no passado. A corte indicará sua intenção de se pronunciar sobre questões significativas da agressiva agenda de deportações do republicano.", "titulo_pt": "Suprema Corte dos EUA julgará política de deter imigrantes que vivem há anos no país", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 190650, "titulo": "Trump defies Democrats, diverts aid for Europe to Latin America instead", "url": "https://www.washingtonpost.com/national-security/2026/10/01/trump-defies-democrats-diverts-aid-europe-latin-america-instead/", "fonte_id": "washington_post_world", "data_pub": "2026-10-01T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente dos Estados Unidos, Donald Trump, desviou fundos destinados aos países afetados pela guerra na Ucrânia para América Latina em vez de Europeu, contrariando os democratas.", "titulo_pt": "Trump desvia ajuda para Europa e destina a américa latina em vez dos democratas", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 190484, "titulo": "Russia’s Putin rules out ceasefire with Ukraine during speech in Moscow", "url": "https://www.aljazeera.com/news/2026/10/1/russias-putin-rules-out-ceasefire-with-ukraine-during-speech-in-moscow?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Putin afirmou que não há condições para um cessar-fogo com a Ucrânia. Ele ameaçou o Ocidente que, se necessário, usaria armas nucleares para defender a exclave balcânica de Kaliningrado.", "titulo_pt": "Putin descarta cessar-fogo com Ucrânia e ameaça usar armas nucleares para defender kaliningrado", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 190391, "titulo": "Lucien Lazare, Jewish Resistance Fighter in Occupied France, Dies at 101", "url": "https://www.nytimes.com/2026/10/01/world/lucien-lazare-dead.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lucien Lazare, um resistente judeu na França ocupada, faleceu aos 101 anos. Ele e um pequeno grupo de judeus franceses trabalharam com as forças aliadas para distribuir suprimentos e combater os nazistas, ambicionando um trem alemão e libertando uma cidade no sul.", "titulo_pt": "Lucien Lazare, resistente judeu na França ocupada, morre aos 101 anos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 190447, "titulo": "Hegseth Wants More", "url": "https://foreignpolicy.com/2026/10/01/hegseth-speech-state-force-autonomous-musk-luckey-gingrich/", "fonte_id": "foreign_policy", "data_pub": "2026-10-01T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Defesa dos Estados Unidos apresentou planos ambiciosos em uma 'Discurso sobre o Estado da Força'.", "titulo_pt": "Hegseth quer mais", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 190448, "titulo": "Violent Student Protests Loom Over France’s Budget Proposal", "url": "https://foreignpolicy.com/2026/10/01/france-budget-proposal-2027-violent-student-protests-lecornu-macron/", "fonte_id": "foreign_policy", "data_pub": "2026-10-01T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paris espera conter o déficit do país e evitar outro voto de não confiança.", "titulo_pt": "Protestos estudantis violentos pairam sobre a proposta orçamentária da França", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 190509, "titulo": "Houthis, AFP say explosions heard in Sannaa", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/houthis-afp-say-explosions-heard-sannaa", "fonte_id": "middle_east_eye", "data_pub": "2026-10-01T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Explosões foram ouvidas na capital do Iêmen, Sanaa, conforme relatos dos hutis e da AFP. O ministério das Relações Exteriores do Iêmen anunciou uma reunião do gabinete para planejar uma ofensiva militar contra os hutis.", "titulo_pt": "Hutis e AFP relatam explosões em sanaa", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 190506, "titulo": "US sanctions Kremlin-backed fintech A7 for allegedly assisting Iran", "url": "https://www.ft.com/content/29e2d078-4476-41f2-a180-faf0b2001068?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de pagamentos A7, que movimentou cerca de 7 bilhões de dólares através de bancos globais, foi designada como uma organização criminal transnacional. A empresa é acusada de ter ajudado o Kremlin a financiar atividades do Irã.", "titulo_pt": "Sanções dos EUA à fintech A7 acusada de auxiliar o Irã", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 190392, "titulo": "Mike Smith, Bubbles on ‘Trailer Park Boys,’ Has Sexual Assault Charge Dismissed", "url": "https://www.nytimes.com/2026/10/01/world/canada/mike-smith-trailer-park-boys-sexual-assault-charge.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ator Mike Smith, 54 anos, que interpretou Bubbles na série canadense de comédia 'Trailer Park Boys', teve um processo de acusação de assédio sexual arquivado. A série anunciou que ele continuará a participar do show.", "titulo_pt": "Mike Smith, de 'Trailer Park Boys', vê acusação de assédio Sexual arquivada", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 190481, "titulo": "Trump could target three Fed governors. Removing them may be harder than it looks", "url": "https://www.cnbc.com/2026/10/01/trump-fed-powell-lisa-cook-michael-barr-removal.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-01T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump poderia tentar remover Jerome Powell, Lisa Cook e Michael Barr do Federal Reserve, mas decisões judiciais e processos longos podem limitar suas ações.", "titulo_pt": "Trump poderia alvo de três governadores do Fed. Remoção pode ser mais difícil do que parece", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 190560, "titulo": "Putin warns Russia will use ‘all weapons’ in arsenal if any of its territory is attacked", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3369487/putin-warns-russia-will-use-all-weapons-arsenal-if-any-its-territory-attacked?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-01T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente russo Vladimir Putin reiterou que a Rússia não planeja atacar países europeus, mas que responderá com todos os meios de defesa à agressão. Putin acusou o Ocidente e a Europa de agravar tensões ao falar em guerra com Moscou, realizar exercícios militares no Mar Báltico e apreender embarcações russas.", "titulo_pt": "Putin avisa que Rússia usará 'todos os armamentos' se sua território for atacado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 190508, "titulo": "US deploys thousands of troops to Middle East as Trump weighs strikes on Iran", "url": "https://www.ft.com/content/352e14c5-267d-4c8f-981d-6ae8bea531f9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A USS Theodore Roosevelt, porta-aviões dos Estados Unidos, deve chegar à região do Oriente Médio no final de novembro. O governo dos Estados Unidos está considerando possíveis ataques a Iran.", "titulo_pt": "EUA deslocam milhares de tropas para oriente médio enquanto Trump pondera ataques ao Irã", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 190393, "titulo": "A Climate Change Rebrand", "url": "https://www.nytimes.com/2026/10/01/world/climate-change-rebrand-renewables-flydubai.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais políticos têm parado de falar sobre o clima, mas a transição verde ainda avança.", "titulo_pt": "Uma rebranding do clima", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 190231, "titulo": "Houlihan Lokey contrata ex-Patria para vertical de capital solutions", "url": "https://braziljournal.com/houlihan-lokey-contrata-ex-patria-para-vertical-de-capital-solutions/", "fonte_id": "brazil_journal", "data_pub": "2026-10-01T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Houlihan Lokey, um banco de investimento americano especializado em fusões e aquisições e reestruturação de dívidas, contratou Mayra Fregonesi, ex-executiva do Patria, para desenvolver uma vertical de capital solutions no Brasil. Sua função será atrair capital para as transações do banco e conectar family offices e fundos brasileiros.", "titulo_pt": "Houlihan Lokey contrata ex-patria para vertical de capital solutions", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 190088, "titulo": "Entra em vigor tarifa zero para instrumentos musicais importados", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/entra-em-vigor-tarifa-zero-para-instrumentos-musicais-importados", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-01T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entrou em vigor a tarifa zero para a importação de microfones, instrumentos musicais e máquinas de costura de uso doméstico. A medida elimina tarifas que chegavam a 18% para instrumentos musicais e 20% para máquinas de costura.", "titulo_pt": "Tarifa zero entra em vigor para instrumentos musicais importados", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 190023, "titulo": "Fundos de investimentos isentos têm maior volume de resgates desde 2021, diz levantamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/fundos-de-investimentos-isentos-tem-maior-volume-de-resgates-desde-2021-diz-levantamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, os fundos de investimentos isentos de Imposto de Renda registraram o maior volume de resgates líquidos desde 2021, de acordo com um levantamento da plataforma Credit Guide.", "titulo_pt": "Fundos isentos de ir têm maior volume de resgates desde 2021, mostra levantamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190197, "titulo": "“Índice do medo” da bolsa brasileira bate recorde pela 3ª vez na semana", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/indice-do-medo-da-bolsa-brasileira-bate-recorde-pela-3a-vez-na-semana/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O índice de volatilidade VIX Brasil atingiu novos recordes históricos durante a semana, refletindo a proximidade do primeiro turno das eleições e a presença de tensões geopolíticas nos pensamentos dos investidores.", "titulo_pt": "Índice do medo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 190025, "titulo": "Gol prevê alta de 11% em voos no verão e mira expansão na Argentina", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/gol-preve-alta-de-11-em-voos-no-verao-e-mira-expansao-na-argentina.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Gol prevê um aumento de 11% na oferta de voos durante a alta temporada, entre dezembro de 2026 e janeiro de 2027, em comparação com o mesmo período do ano anterior. A empresa planeja operar 50 mil voos nesse período, com 4.000 assentos a mais em relação à última alta temporada.", "titulo_pt": "Gol projeta alta de 11% em voos no verão e mira expansão na Argentina", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190503, "titulo": "Top Fed official signals central bank will keep rates on hold in October", "url": "https://www.ft.com/content/e3a53272-385d-40a8-ac77-408f4c136f6f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente da política monetária Philip Jefferson sinaliza que o banco central manterá as taxas de juros  Armadin, levanta $255,5 milhões em valuation de $2,5 bilhões", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 190316, "titulo": "Cyber 2026: Cómo la IA está cambiando la manera de comprar en Retail", "url": "https://www.latercera.com/branded/noticia/cyber-2026-como-la-ia-esta-cambiando-la-manera-de-comprar-en-retail/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cyber 2026 demonstra que as marcas enfrentam desafios não apenas em captar, mas também em entender e competir por demanda em ambientes de inteligência artificial e buscadores. Com mais de 5 milhões de transações em sua última edição, a tendência revela mudanças significativas no comportamento de compra online.", "titulo_pt": "Cyber 2026: como a IA está transformando o modo de comprar no varejo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 190507, "titulo": "Nike to cut jobs as it forecasts revenue decline in the coming year", "url": "https://www.ft.com/content/08eeee4a-903b-4889-92ef-61ebaeea682a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nike planeja cortar funcionários e abrir um campus na Índia como parte de seu plano de reestruturação. A empresa prevê uma diminuição nas receitas no próximo ano.", "titulo_pt": "Nike vai cortar funcionários e abrir campus na Índia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 190568, "titulo": "Musk’s AI chatbot Grok reportedly encouraged Trump to capture Venezuela’s president", "url": "https://techcrunch.com/2026/10/01/musks-ai-chatbot-grok-reportedly-encouraged-trump-to-capture-venezuelas-president/", "fonte_id": "techcrunch", "data_pub": "2026-10-01T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump teria consultado o chatbot de inteligência artificial criado por Musk antes de considerar uma invas ge/", "fonte_id": "ars_technica", "data_pub": "2026-10-01T20:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O juiz negou o pedido de duas ações de monopólio contra Google relacionadas à pesquisa de inteligência artificial. O tribunal reconhece que a pesquisa de IA traz consequências, mas considera que não se trata de um problema antitruste.", "titulo_pt": "Juiz descarta ações de monopólio contra Google relacionadas à pesquisa de inteligência artificial", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 190569, "titulo": "ChatGPT can now virtually try on clothes for you", "url": "https://techcrunch.com/2026/10/01/chatgpt-can-now-virtually-try-on-clothes-for-you/", "fonte_id": "techcrunch", "data_pub": "2026-10-01T19:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI está lançando novas funcionalidades de compra para o ChatGPT que permitem aos usuários virtualmente experimentar roupas e acessórios usando suas próprias fotos e salvar produtos que gostam em uma biblioteca de favoritos.", "titulo_pt": "Chatgpt agora pode virtualmente fazer você tentar roupas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 190576, "titulo": "Can good design stop content creators from having sex in robotaxis?", "url": "https://arstechnica.com/cars/2026/10/can-good-design-stop-content-creators-from-having-sex-in-robotaxis/", "fonte_id": "ars_technica", "data_pub": "2026-10-01T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os designers de veículos autônomos precisam considerar a possibilidade de passageiros terem relações sexuais em tóquios robóticos. Isso sugere que a segurança e a privacidade dos passageiros serão prioridades na designação desses veículos.", "titulo_pt": "Pode um bom design impedir que criadores de conteúdo tenham sexo em tóquios robóticos?", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 190570, "titulo": "Google thinks SpaceX’s Starship has to launch 1,800 times before space data centers get off the ground", "url": "https://techcrunch.com/2026/10/01/google-thinks-spacexs-starship-has-to-launch-1600-times-before-space-data-centers-get-off-the-ground/", "fonte_id": "techcrunch", "data_pub": "2026-10-01T19:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou seu primeiro chip avançado no espaço para preparar o caminho para centrais de dados espaciais. A empresa acredita que a SpaceX precisará realizar 1,800 lançamentos do Starship antes que essas centrais de dados espaciais sejam possíveis.", "titulo_pt": "Google acredita que a SpaceX precisa realizar 1,800 lançamentos do Starship antes de centrais de dados espaciais se tornarem realidade", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 190571, "titulo": "World’s first enhanced geothermal power plant completed in just 23 months", "url": "https://techcrunch.com/2026/10/01/worlds-first-enhanced-geothermal-power-plant-completed-in-just-23-months/", "fonte_id": "techcrunch", "data_pub": "2026-10-01T18:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Fervo Energy concluiu sua primeira central termal de energia geotérmica em menos de dois anos. As próximas fases prometem conectá-la à rede elétrica ainda mais rapidamente.", "titulo_pt": "Primeira central termal geotérmica de energia comumente conhecida concluída em 23 meses", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 190572, "titulo": "OpenAI cuts ties with 3 safety researchers, WSJ reports", "url": "https://techcrunch.com/2026/10/01/openai-cuts-ties-with-three-safety-researchers-wsj-reports/", "fonte_id": "techcrunch", "data_pub": "2026-10-01T18:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI desligou três pesquisadores de segurança após uma investigação interna apontar que eles manipularam informações confidenciais da empresa de forma inadequada, conforme relatado.", "titulo_pt": "Openai se separa de três pesquisadores de segurança após investigação", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 190584, "titulo": "Experience What It’s Like to Travel in the Occupied West Bank", "url": "https://www.wired.com/story/experience-what-its-like-to-travel-in-the-occupied-west-bank/", "fonte_id": "wired", "data_pub": "2026-10-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A experiência de percorrer barreiras e pontos de bloqueio na Cisjordânia ocupada reflete a realidade vivida por quase 3,5 milhões de palestinos que residem na região.", "titulo_pt": "Experimente o que é atravessar barreiras e pontos de bloqueio na cisjordânia ocupada", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 189800, "titulo": "Opus 5.5 loves to tell you ‘this matters’ (and other AI writing tells)", "url": "https://techcrunch.com/2026/10/01/opus-5-5-loves-to-tell-you-this-matters-and-other-ai-writing-tells/", "fonte_id": "techcrunch", "data_pub": "2026-10-01T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Opus 5.5 é caracterizado por frequentemente usar a palavra 'dependável', que aparece 23 vezes mais do que nas amostras humanas. O texto destaca que outras ferramentas de IA também tendem a enfatizar determinados termos.", "titulo_pt": "Opus 5.5 adora dizer 'isso importa' (e outras ferramentas de IA também fazem isso)", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 190588, "titulo": "Webb provides crash course on planet-shattering collisions", "url": "https://phys.org/news/2026-10-webb-planet-shattering-collisions.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na história inicial do nosso sistema solar, cientistas acreditam que um objeto do tamanho de Marte, chamado Theia, colidiu com uma jovem Terra, vaporizando grandes quantidades de rocha e lançando-a no espaço. Alguma dessas partículas se coalesceram para formar a lua, onde o programa Artemis da NASA está retomando humanos e preparando o caminho para Marte, moldando o futuro da exploração espacial.", "titulo_pt": "Webb oferece aula sobre colisões planetárias devastadoras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190589, "titulo": "New method generates nearly indistinguishable photons for quantum communication", "url": "https://phys.org/news/2026-10-method-generates-indistinguishable-photons-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Paderborn, da Universidade de Basileia e da Ruhr University Bochum desenvolveram uma nova técnica para gerar fótons quânticos praticamente indistinguíveis, que servem como base para a comunicação quântica e a entrelaçamento quântico. Os resultados foram publicados recentemente na revista Physical Review Letters.", "titulo_pt": "Novo método gera fótons quânticos quase indistinguíveis para comunicação quântica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190590, "titulo": "Artisans turn old São Paulo subway construction uniforms into backpacks", "url": "https://phys.org/news/2026-10-artisans-paulo-subway-uniforms-backpacks.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Ciclou, sediada em São Paulo, Brasil, desenvolveu um sistema que transforma uniformes de construção antigos do metrô em mochilas, convertendo resíduos em oportunidades econômicas. O sistema conecta geradores de resíduos, como indústrias e corporações de eventos e infraestrutura, com artesãos das periferias da cidade.", "titulo_pt": "Artesãos transformam uniformes antigos de construção do metrô em São Paulo em mochilas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190591, "titulo": "Yosemite toad killer may be hiding in their own homes", "url": "https://phys.org/news/2026-10-yosemite-toad-killer-homes.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Biologistas da UCLA descobririram que o fungo Batrachochytrium dendrobatidis, responsável pela morte de populações de anfíbios em todo o mundo, pode estar se escondendo nos buracos dos rãs de Yosemite quando eles estão fora d'água.", "titulo_pt": "O assassino silencioso das rãs de yosemite pode estar escondido em suas próprias tocas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190592, "titulo": "AI method predicts retention times of small molecules more reliably", "url": "https://phys.org/news/2026-10-ai-method-retention-small-molecules.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da Friedrich Schiller University Jena, em colaboração com o Helmholtz Zentrum München e a Technical University of Munich, desenvolveram um método que prediz mais precisamente os tempos de retenção de pequenas moléculas, um problema persistente na química analítica há décadas. Este método pode ser útil em várias áreas, incluindo descoberta de medicamentos, análise ambiental e metabolômica.", "titulo_pt": "Método AI prevê mais precisamente os tempos de retenção de pequenas moléculas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190301, "titulo": "Los expertos en comportamiento animal coincidieron: tocar la nariz del perro no sirve para detectar si tiene fiebre", "url": "https://www.lanacion.com.ar/lifestyle/mascotas/los-expertos-en-comportamiento-animal-coincidieron-tocar-la-nariz-del-perro-no-sirve-para-detectar-nid01102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T21:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Expertos en comportamiento animal concordaron que tocar la nariz de un perro no es una forma precisa de determinar si tiene fiebre. Um conhecido veterinário esclareceu um erro comum em casa e explicou que tocar na região do focinho não determina com precisão se o cão tem alta temperatura.", "titulo_pt": "Tocar na nariz do cachorro não serve para detectar febre", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 190593, "titulo": "Viewer impatience may explain why ads lasting ten seconds or less outperform longer spots", "url": "https://phys.org/news/2026-10-viewer-impatience-ads-ten-seconds.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa liderado pelo professor Inyoung Chae da Sungkyunkwan University, em colaboração com professores Beth L. Fossen da Indiana University e Philip Kim da Texas Christian University, demonstrou que anúncios ultracurtos, com duração de 10 segundos ou menos, são significativamente mais eficazes que anúncios mais longos e elaborados em promover visitas online imediatas e engajamento do consumidor.", "titulo_pt": "Impaciência do espectador pode explicar por que anúncios de 10 segundos ou menos performam melhor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190594, "titulo": "The 2025 Kamchatka tsunami kept the Pacific ringing for more than ten hours. Its rhythm could help tsunami warnings", "url": "https://phys.org/news/2026-09-kamchatka-tsunami-pacific-ten-hours.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 29 de julho de 2025, às 23:24 UTC, um terremoto de magnitude 8.8 causou um tsunami no Pacífico após um trecho de fundo marinho perto da Península de Kamchatka, na Rússia, ser elevado. Níveis de água chegaram a 19 metros na Ilha Shumshu, nas Ilhas Kuril, e alertas de tsunami foram emitidos de Japão a Chile.", "titulo_pt": "O tsunami de 2025 na Kamchatka manteve o pacífico em ressonância por mais de dez horas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190587, "titulo": "STAT+: Medicare Advantage plans shift more costs onto seniors in 2027", "url": "https://www.statnews.com/2026/10/01/medicare-advantage-plans-have-higher-deductibles-fewer-benefits-in-2027/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As taxas de Medicare Advantage permanecem estáveis, mas as planilhas estão implementando mudanças significativas que podem tornar os cuidados mais caros para os pacientes.", "titulo_pt": "Planos medicare Advantage passam a transferir mais custos para os idosos em 2027", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 190097, "titulo": "EUA aprovam remédio para Parkinson com novo mecanismo de ação", "url": "https://www.poder360.com.br/poder-saude/eua-aprovam-remedio-para-parkinson-com-novo-mecanismo-de-acao/", "fonte_id": "poder360", "data_pub": "2026-10-01T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos aprovaram um novo medicamento para o tratamento da Parkinson que age em receptores de dopamina diferentes dos usados pelos principais remédios existentes na mesma classe terapêutica.", "titulo_pt": "EUA aprovam remédio para Parkinson com novo mecanismo de ação", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 190595, "titulo": "Global pollination analysis reveals climate explains specialized partnerships better than latitude", "url": "https://phys.org/news/2026-10-global-pollination-analysis-reveals-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo internacional, liderado por pesquisadores da Universidade Carolina Praga (CUNI) e do Centro de Biologia da Academia Tcheca das Ciências (BC CAS), mapeou como as plantas em flor e seus polinizadores dependem um do outro. O estudo revela que o clima explica melhor as parcerias especializadas do que a latitude.", "titulo_pt": "Análise global de polinização mostra que o clima explica parcerias especializadas melhor do que a latitude", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190596, "titulo": "Salivary gland mini-organs grown from pluripotent stem cells offer potential path to treating severe dry mouth", "url": "https://phys.org/news/2026-10-salivary-gland-mini-grown-pluripotent.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A boca seca extremamente severa, causada pela radioterapia utilizada no tratamento do câncer e por doenças autoimunes como a síndrome de Sjögren, tem um grande impacto na qualidade de vida dos pacientes. Até agora, este problema parecia intransponível.", "titulo_pt": "Mini-órgãos de glândulas salivares cultivados a partir de células-tronco pluripotentes oferecem potencial para tratar a boca seca severa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190597, "titulo": "Engineer brings 'surgineering' mindset to future of medicine", "url": "https://phys.org/news/2026-10-surgineering-mindset-future-medicine.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Farshid Alambeigi está desenvolvendo tecnologia robótica que poderia ser usado para produzir tecidos vivos, e eventualmente órgãos funcionais, para transplante. Ele chama este projeto de 'o projeto de ficção científica'.", "titulo_pt": "Engenheiro aplica 'surgineering' no futuro da medicina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190598, "titulo": "How the biological clock regulates phases of wakefulness", "url": "https://phys.org/news/2026-10-biological-clock-phases.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relógio biológico regula ciclos de sono e vigília, bem como várias funções fisiológicas como a temperatura corporal e a produção de hormônios. Este relógio, em muitos animais, depende de uma rede de neurônios que gera ritmos aproximadamente de 24 horas.", "titulo_pt": "Como o relógio biológico regula fases de vigília", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190599, "titulo": "Google DeepMind develops invisible watermarks for AI-designed proteins", "url": "https://phys.org/news/2026-10-google-deepmind-invisible-watermarks-ai.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A DeepMind, uma divisão do Google, desenvolveu marcas invisíveis para proteínas projetadas por inteligência artificial, visando proteger a autenticidade e tracar a origem dessas proteínas. Essas marcas têm sido usadas há muito tempo em diversos contextos, como notas de banco e fotografias digitais, para provar a autenticidade e verificar a origem dos objetos.", "titulo_pt": "DeepMind desenvolve marcas invisíveis para proteínas projetadas por IA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 190600, "titulo": "The ocean as a medicine cabinet: Researchers search for useful microbes", "url": "https://phys.org/news/2026-10-ocean-medicine-cabinet-microbes.html", "fonte_id": "phys_org", "data_pub": "2026-10-01T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores em Leiden, coordenados por biólogos Gilles van Wezel e Mariana Avalos Garcia, estão buscando microorganismos no leito marinho que possam produzir compostos úteis para novos medicamentos, produtos de proteção de cultivo e tratamentos para doenças de peixes.", "titulo_pt": "O oceano como armazém de medicamentos: pesquisadores buscam microorganismos úteis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 190672, "titulo": "Talking Heads Set Fear of Music Super Deluxe Edition", "url": "https://pitchfork.com/story/talking-heads-set-fear-of-music-super-deluxe-edition/", "fonte_id": "pitchfork", "data_pub": "2026-10-01T21:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A edição super deluxe de Fear of Music, lançada em 3 CDs, incluirá um remasterizado do álbum de 1979, gravações ao vivo inéditas e takes de estúdio.", "titulo_pt": "Talking Heads lançam edição Super Deluxe de Fear of Music", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 190014, "titulo": "Quando será a vez das mulheres?", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/djamila-ribeiro/2026/10/quando-sera-a-vez-das-mulheres.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-01T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No dia 28 de setembro de 2026, mulheres brasileiras realizaram uma passeata pouco noticiada em celebração ao Dia Latino-Americano e Caribenho de Luta pela Descriminalização e Legalização do Aborto. A autora deste texto acompanhou essa mobilização e ouviu um pronunciamento de Rute Alonso, da União de Mulheres, antes de decidir escrever este artigo.", "titulo_pt": "Quando será a vez das mulheres em relação ao aborto?", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 190234, "titulo": "A corte de prazeres de Vorcaro", "url": "https://piaui.uol.com.br/web/festas-vorcaro-autoridades/", "fonte_id": "piaui", "data_pub": "2026-10-01T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-banqueiro havia estabelecido um departamento dedicado ao entretenimento e ao sexo com o objetivo de seduzir poderosos. Este departamento era parte de sua estratégia para alcançar influência e vantagens.", "titulo_pt": "A corte de prazeres de Vorcaro", "veiculo": "Revista Piauí", "pais": "Brasil", "classe": "B"}, {"id": 190015, "titulo": "'Super Mario Galaxy' e 'K2 - O Desafio Final': o que ver na TV e no streaming na sexta", "url" eiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 189271, "titulo": "“Los docentes no cobran nada y encima son agredidos”: así se sintió el paro en las escuelas bonaerenses", "url": "https://www.lanacion.com.ar/sociedad/los-docentes-no-cobran-nada-y-encima-son-agredidos-asi-se-sintio-el-paro-en-las-escuelas-bonaerenses-nid01102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pela LA NACION em cinco escolas do conurbano baiano revelou aulas vazias, forte adesão à paralisação e preocupação com a crescente violência contra os professores.", "titulo_pt": "Os professores não recebem nada e ainda são agredidos: assim se sentiu o paro nas escolas da província de buenos aires", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 189113, "titulo": "Briga em haras termina com morto e mulher baleada enquanto amamentava bebê", "url": "https://www.metropoles.com/sao-paulo/briga-em-haras-termina-com-morto-e-mulher-baleada-enquanto-amamentava-bebe", "fonte_id": "metropoles", "data_pub": "2026-10-01T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem morreu e uma mulher foi baleada enquanto amamentava o bebê durante uma briga em um haras no interior de São Paulo. A polícia investiga se a disputa sobre um asno doméstico foi o motivo do tiroteio.", "titulo_pt": "Briga em haras termina com morto e mulher baleada durante amamentação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 189129, "titulo": "Vídeo mostra momento em que falsos policiais matam morador em SP; veja", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/video-mostra-momento-em-que-falsos-policiais-matam-morador-em-sp-veja/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criminosos se passaram por policiais civis para invadir uma casa na região ce
