<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "14/11/2026 19:21", "stats": {"noticias_novas": 357, "resumos_gerados": 199}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula participou da cúpula da Asean nas Filipinas, destacando a importância da mobilização da esquerda brasileira nas eleições. Em outro desenvolvimento, o ministro Fux interrompeu o julgamento virtual sobre o fim da escala 6x1 no STF, transferindo-o para o plenário físico, com quatro votos favoráveis. A campanha de Lula respondeu a acusações de irregularidades na prestação de contas. Paralelamente, o governo do Alasca passou para a oposição democrata após 28 anos. No Congresso, Janones criticou as ações da 'extrema-esquerda' contra o ajuste fiscal proposto por Lula, enquanto a governadora Celina Leão afirmou que obras de infraestrutura na região do Pôr do Sol/Sol Nascente estão em andamento, apesar da revogação das licitações. Além disso, o governo federal busca apoio para a relatoria da Medida Provisória do Imposto Seletivo, com Aguinaldo Ribeiro confirmado como relator.", "mundo": "A SpaceX realizou com sucesso a recuperação de sua espaçonave Starship, marcando o primeiro pouso bem-sucedido de uma espaçonave após um tentativo de recuperação interrompido. Este é um evento histórico para a empresa de Elon Musk. Paralelamente, manifestações em França continuam, com dezenas de milhares de pessoas ocupando as ruas no quinto sábado consecutivo, protestando contra a inflação e a proposta de ampliar a proteção jurídica da polícia. Em outro desenvolvimento, Israel e a Palestina enfrentam tensões políticas, com Benjamin Netanyahu reiterando seu pedido para uma unidade de governo, enquanto as Forças Armadas israelenses descartam a proposta como uma manobra política.\n\nAs relações internacionais e a geopolítica estão em destaque com diversos eventos importantes. A 33ª cúpula do APEC, a ser realizada em Shenzhen, chama atenção para o papel da China na economia global e a possibilidade de reavivar a cooperação. Em relação à Ucrânia, a proposta dos EUA de que a Ucrânia ceda partes do Donbas à Rússia em troca da adesão à OTAN é um ponto controverso, com o presidente ucraniano Volodymyr Zelenskiy rejeitando a ideia. A China também está em foco, com a empresa Nvidia suscitando tensões devido ao Escândalo da Nvidia, que intensificou a rivalidade com os EUA antes de um importante encontro. No cenário local, os voos nos Estados Unidos continuam interrompidos devido a problemas no sistema de controle de tráfego aéreo, o que afeta o tráfego aéreo entre os EUA e o Brasil. Além disso, manifestações de Casacos Amarelos na França e protestos em Taiwan sobre questões climáticas também refletem tensões geopolíticas e questões nacionais.", "economia": "O Brasil enfrenta desafios econômicos, devido à falta de um plano unificado de desenvolvimento econômico, conforme informa o jornal Folha Mercado. Economistas sugerem que o plano fiscal anunciado pelo governo é insuficiente, não abordando as principais propostas em discussão, como a reforma do salário mínimo, da saúde e da educação. Por outro lado, a Binance prevê a retomada total dos saques até a próxima semana após ter coberto 95% dos US$6,3 bilhões em tokens roubados de sua plataforma. No exterior, a Nvidia enfrenta a possibilidade de ações judiciais após a renúncia de seu CEO, Jensen Huang, enquanto a Voyager 1 da NASA atinge um marco histórico a 26 bilhões de km da Terra após 49 anos de operação. Além disso, o Brasil registrou 1.009 casos de mpox, com a variante africana da doença se espalhando pelo país, e a State Grid Brasil emite R$ 2,5 bilhões em 'panda bonds' para financiar obras de transmissão de energia em uma linha que liga as regiões Nordeste e Centro-Oeste.", "tecnologia": "A SpaceX realizou com sucesso o primeiro 'chopstick catch' da Starship, capturando o estágio principal do foguete após a missão Starship Test Flight 15. Esta é a primeira vez que a empresa consegue essa manobra com a Starship, após já ter realizado com seus boosters. Em outro desenvolvimento tecnológico, a Meta foi multada em 805 milhões de euros pela Autoridade de Privacidade da Itália por acessar indevidamente fotos e vídeos de usuários do Android sem autorização. A multa, anunciada no sábado, reflete a crescente preocupação com a privacidade de dados em plataformas digitais. Além disso, a SpaceX também conseguiu recuperar com sucesso a espaçonave Starship após sua maior missão orbital até o momento, realizando a primeira recuperação bem-sucedida de seu módulo principal. Esses eventos destacam o avanço contínuo da tecnologia espacial e a intensificação dos esforços regulatórios para proteger a privacidade digital.", "ciencia": "A SpaceX conseguiu pela primeira vez recuperar o segundo estágio de um foguete Starship após um voo de mais de 22 horas, um passo crucial para a rápida reutilização do veículo. Paralelamente, astrônomos têm estudado objetos cósmicos que emitem flashes de rádio a cada 8 minutos, encontrados em sistemas binários com uma pequena e fria estrela chamada rémula em órbita com um restos estelar conhecido como brâmo-dwarf. Além disso, pesquisadoras da USP descobriram que gatos emitem um 'miado estratégico' para pedir ajuda aos humanos em situações específicas. O maior lago de água doce do mundo, o Lago Baikal na Sibéria, está se recuperando após décadas de declínio, abrigando cerca de 20% das águas doces do planeta e sendo um importante ambiente para a biodiversidade. O Lago Baikal foi declarado Patrimônio Mundial da UNESCO em 1996.", "cultura": "O Festival de Mar del Plata encerrou com grande sucesso, com a obra 'A Noite em que Arezou Desapareceu', dirigida por Arian Vazirdaftari, conquistando o principal prêmio. O ator Andrew Scott foi premiado na categoria de melhor ator. Em outro destaque, o Circuito Cultural Instituto 12 – Conexões Criativas iniciou no Rio de Janeiro com uma série de eventos gratuitos, focados na relação entre arte, meio ambiente, sociedade e cidade, promovendo atividades como exposições, palestras, shows e espetáculos de dança. O documentário sobre Suzane von Richthofen, comandado por Maurício determinante, gerou reflexões sobre a responsabilidade do público com o conteúdo produzido. A trilha sonora do game 'GTA VI' incluiu contribuições de artistas como Lana Del Rey, Dua Lipa e Zara Larsson, destacando a importância da música em jogos eletrônicos.", "sociedade": "Milhares de pessoas protestaram na França contra o aumento do custo de vida e um projeto de lei que protege policiais que usam armas, fazendo parte de uma campanha nacional que já dura cinco dias. Em Portugal, dezenas de milhares de pessoas protestaram contra a crise habitacional, que registrou o maior aumento da relação entre preços dos imóveis e renda média na União Europeia nos últimos dez anos. No Brasil, o CEO do Instituto Four, Wellington Vitorino, afirma que há uma desconexão entre o discurso e a prática em relação às políticas de inclusão nas empresas, intensificada desde a eleição de Donald Trump. Além disso, no Chile, uma pesquisa intitulada 'Cuidar a democracia hoje' revelou que oito em cada dez chilenos valorizam a democracia, mas poucos acreditam que contribuem para seu cuidado.", "meio_ambiente": "A Conferência COP31, realizada em Belém, no Brasil, é crucial para os países vulneráveis às mudanças climáticas, como o Bangladesh, que enfrenta as consequências dessas alterações sem ter contribuído significativamente para as emissões globais. É fundamental que o financiamento para ações climáticas chegue a tempo, alcance os destinatários corretos e não aprofunde as dívidas desses países. Além disso, o Ceará declarou situação de emergência em 65 cidades devido aos efeitos do El Niño, intensificando o monitoramento hidrológico e planejando parcerias com as prefeituras para garantir a segurança hídrica.", "direitos_humanos": "Um comissário foi preso por matar um sargento durante uma operação policial, onde os suspeitos já haviam sido capturados e estavam amarrados, revelando a gravidade de incidentes envolvendo a violência policial. Em outro caso, cinco jovens que testemunharam um espancamento de um homem negro por três policiais em 2020, se juntaram a uma ação judicial, denunciando a violência policial e o trauma que ainda sentem. A política de detenção de imigrantes de Trump sobrecarrega os tribunais dos EUA, com entidades de direitos humanos criticando o uso de recursos públicos para defender prisões consideradas ilegais. Além disso, a Meta foi multada em 805 milhões de euros pela Itália por acessar informações e dados de 20 milhões de usuários sem consentimento, destacando a importância da privacidade digital. Finalmente, uma menina de 6 anos que sofreu queimaduras em Gaza enfrenta dificuldades para obter um protetor facial necessário para controlar as cicatrizes, devido a um impasse entre Israel e a Itália sobre a importação de plástico para o tratamento."}, "resumo_do_dia": {"politica_nacional": [{"id": 264493, "titulo": "Lula cancela discursos nas Filipinas por rouquidão", "url": "https://www.poder360.com.br/poder-governo/lula-cancela-discurso-nas-filipinas-por-rouquidao-na-voz/", "fonte_id": "poder360", "data_pub": "2026-11-14T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula cancelou discursos nas Filipinas devido a uma rouquidão repentina. Ele se limitou a uma declaração escrita após um encontro bilateral e participou de um fórum empresarial sem fazer declarações à imprensa.", "titulo_pt": "Lula cancela discursos nas Filipinas por rouquidão", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264503, "titulo": "A resposta da campanha de Lula ao relatório do TSE que apontou irregularidades em prestação de contas", "url": "https://veja.abril.com.br/brasil/a-resposta-da-campanha-de-lula-ao-relatorio-do-tse-que-apontou-irregularidades-em-prestacao-de-contas/", "fonte_id": "veja", "data_pub": "2026-11-14T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados da campanha de Lula responderam a acusações de omissão de despesas no valor de R$ 48,5 milhões na prestação de contas. O relatório do TSE apontou irregularidades.", "titulo_pt": "Resposta de Lula sobre irregularidades apontadas no relatório do TSE", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 264556, "titulo": "Após críticas, Dino defende decisão sobre 6×1: “Texto perfeito não existe”", "url": "https://www.cnnbrasil.com.br/politica/apos-criticas-dino-defende-decisao-sobre-6x1-texto-perfeito-nao-existe/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dino defendeu sua decisão sobre a liminar que não cria exceções à nova jornada de trabalho nem permite acordos individuais. Câmara e Senado contestaram as mudanças feitas pelo relator nas regras aprovadas pelo Congresso.", "titulo_pt": "Dino defende decisão sobre 6×1, após críticas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264494, "titulo": "Democratas voltam ao poder no Alasca depois de 28 anos", "url": "https://www.poder360.com.br/poder-internacional/democratas-voltam-ao-poder-no-alasca-depois-de-28-anos/", "fonte_id": "poder360", "data_pub": "2026-11-14T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jonathan S. Kreiss-Tomkins venceu a disputa pelo governo do Alasca, derrotando três candidatos republicanos. Este é o fim de 28 anos de governos republicanos no estado.", "titulo_pt": "Democratas retomam governo do Alasca após 28 anos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264521, "titulo": "Obras de infraestrutura no Pôr do Sol/Sol Nascente estão de pé, diz Celina", "url": "https://www.metropoles.com/distrito-federal/obras-de-infraestrutura-no-por-do-sol-sol-nascente-estao-de-pe-diz-celina", "fonte_id": "metropoles", "data_pub": "2026-11-14T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O GDF revogou as licitações para contratar empresas para executar obras de infraestrutura urbana na região do Pôr do Sol/Sol Nascente. A deputada Celina Leão afirmou que as obras estão em andamento.", "titulo_pt": "Obras de infraestrutura no Pôr do Sol/Sol Nascente continuam em pé, diz Celina", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264465, "titulo": "Aliados pedem que Alcolumbre defenda fim de superinquéritos do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/aliados-pedem-que-alcolumbre-defenda-fim-de-superinqueritos-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Davi Alcolumbre afirmam que suas propostas de reforma do Judiciário, como a instituição de mandatos para ministros do STF e idade mínima para indicações, são insuficientes para conquistar votos de bolsonaristas. Eles pedem que Alcolumbre defenda o fim dos superinquéritos do STF.", "titulo_pt": "Aliados pedem que Alcolumbre defenda fim de superinquéritos do STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 264507, "titulo": "TCU cobra R$ 5,5 milhões de Rosinha Garotinho por irregularidade em convênio", "url": "https://veja.abril.com.br/politica/tcu-cobra-r-55-milhoes-de-rosinha-garotinho-por-irregularidade-em-convenio/", "fonte_id": "veja", "data_pub": "2026-11-14T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU (Tribunal de Contas da União) está exigindo R$ 5,5 milhões de Rosinha Garotinho em relação a irregularidades encontradas em um convênio para a construção de escolas em Campos dos Goytacazes, no estado do Rio de Janeiro. O processo se refere a repasses de recursos federais para o projeto de construção das escolas.", "titulo_pt": "TCU pede R$ 5,5 milhões de Rosinha Garotinho por irregularidades em convênio para construção de escolas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 264495, "titulo": "Lula e outros 34 alvos da Lava Jato foram eleitos em 2026", "url": "https://www.poder360.com.br/poder-eleicoes-2026/lula-e-outros-34-alvos-da-lava-jato-foram-eleitos-em-2026/", "fonte_id": "poder360", "data_pub": "2026-11-14T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e 34 outros alvos da Lava Jato foram eleitos em 2026, enquanto 40 indivíduos com ligações à operação tentaram se eleger mas não obtiveram sucesso. As investigações e condenações desses últimos foram anuladas ou arquivadas.", "titulo_pt": "Lula e outros 34 alvos da Lava Jato eleitos em 2026", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264524, "titulo": "Lupion rebate alegação de “calote” de produtores rurais no Banco do Brasil", "url": "https://www.metropoles.com/colunas/grande-angular/lupion-rebate-alegacao-de-calote-de-produtores-rurais-no-banco-do-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-14T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Pedro Lupion negou a alegação de que os produtores rurais estão inadimplentes com o Banco do Brasil. O banco afirma que 90% dos seus clientes do agronegócio estão em dia com suas obrigações.", "titulo_pt": "Lupion rebate alegação de 'calote' de produtores rurais no Banco do Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264550, "titulo": "Fim da 6×1: Fux interrompe julgamento e análise de decisão de Dino vai para o plenário físico", "url": "https://www.infomoney.com.br/mercados/fim-da-6x1-fux-interrompe-julgamento-e-analise-de-dino-vai-para-o-plenario-fisico/", "fonte_id": "infomoney", "data_pub": "2026-11-14T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux interrompeu o julgamento, e a análise da decisão do governador Dino será feita pelo plenário físico do STF. Uma nova data para o julgamento será definida pelo presidente do STF, ministro Edson Fachin.", "titulo_pt": "Fim da 6×1: fux interrompe julgamento e análise de decisão de Dino vai para o plenário físico", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264526, "titulo": "Janones põe Moretti nas redes para alinhar o discurso sobre o ajuste", "url": "https://www.metropoles.com/colunas/matheus-leitao/janones-poe-moretti-nas-redes-para-alinhar-o-discurso-sobre-o-ajuste", "fonte_id": "metropoles", "data_pub": "2026-11-14T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um vídeo, Moretti afirma que o pacote de ajuste não inclui cortes, argumenta que ele acaba com supersalários e privilégios de grandes empresas e garante investimento adicional de R$ 20 bilhões na saúde.", "titulo_pt": "Janones publica vídeo de Moretti alinhando discurso sobre o ajuste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264498, "titulo": "Vitória no Brasil serve de lição contra “extrema direita”, diz Lula", "url": "https://www.poder360.com.br/poder-governo/vitoria-no-brasil-serve-de-licao-contra-extrema-direita-diz-lula/", "fonte_id": "poder360", "data_pub": "2026-11-14T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva está participando da cúpula da Asean nas Filipinas como convidado. Ele afirmou que outras nações podem aprender com a mobilização da esquerda brasileira nas eleições.", "titulo_pt": "Vitória no Brasil serve de lição contra 'extrema direita', diz Lula", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [{"titulo": "Fux suspende julgamento virtual da escala 6x1 e pede que caso vá a plenário", "sumario": "O ministro Fux suspendeu o julgamento virtual que discutia a escala 6x1 e pediu que o caso seja analisado em plenário. O ministro Fux levou o julgamento de transição da 6 X 1 ao plenário físico do STF. O ministro Fux interrompeu o julgamento sobre a escala 6×1 e transferiu o caso para o plenário presencial.", "artigos": [{"id": 264523, "titulo": "Fux suspende julgamento virtual da escala 6x1 e pede que caso vá a plenário", "url": "https://www.metropoles.com/brasil/fux-suspende-julgamento-virtual-da-escala-6x1-e-pede-que-caso-va-a-plenario", "fonte_id": "metropoles", "data_pub": "2026-11-14T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux suspendeu o julgamento virtual que discutia a escala 6x1 e pediu que o caso seja analisado em plenário. O julgamento virtual já tinha quatro votos favoráveis à mudança na jornada de trabalho.", "titulo_pt": "Fux suspende julgamento virtual da escala 6x1 e pede que caso vá a plenário", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264497, "titulo": "Fux leva julgamento de transição da 6 X 1 ao plenário físico do STF", "url": "https://www.poder360.com.br/poder-justica/fux-pede-destaque-para-julgamento-de-transicao-da-6-x-1/", "fonte_id": "poder360", "data_pub": "2026-11-14T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux levou o julgamento de transição da 6 X 1 ao plenário físico do STF. O julgamento será reiniciado após essa medida.", "titulo_pt": "Fux leva julgamento de transição da 6 X 1 ao plenário físico do STF", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264561, "titulo": "Fux interrompe julgamento sobre fim da escala 6×1 e leva caso ao plenário", "url": "https://www.cnnbrasil.com.br/politica/fux-interrompe-julgamento-sobre-fim-da-escala-6x1-e-leva-caso-ao-plenario/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux interrompeu o julgamento sobre a escala 6×1 e transferiu o caso para o plenário presencial. Votos apresentados virtualmente serão desconsiderados e a liminar de Dino continua valendo.", "titulo_pt": "Fux interrompe julgamento sobre escala 6×1 e leva caso ao plenário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264483, "titulo": "Fux interrompe julgamento sobre escala 5×2 no STF e leva discussão ao plenário físico", "url": "https://www.cartacapital.com.br/politica/fux-interrompe-julgamento-sobre-escala-5x2-no-stf-e-leva-discussao-ao-plenario-fisico/", "fonte_id": "cartacapital", "data_pub": "2026-11-14T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux interrompeu o julgamento sobre a escala 5×2 no STF, passando a discussão para o plenário físico. Ele pediu destaque e retirou a análise do ambiente virtual, onde quatro ministros já haviam votado pela manutenção das regras estabelecidas por Flávio Dino.", "titulo_pt": "Fux interrompe julgamento sobre escala 5×2 no STF e leva discussão ao plenário físico", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}]}], "mundo": [{"id": 264344, "titulo": "US firms tout orbital threat detection", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867754", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas americanas estão promovendo a detecção de ameaças orbitais.", "titulo_pt": "Empresas americanas destacam detecção de ameaças orbitais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264345, "titulo": "Allies tout Taiwan at climate conference", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867755", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alies enfatizaram a importância de Taiwan na conferência sobre clima. O país participou como observador em discussões sobre mudanças climáticas.", "titulo_pt": "Aliados destacam Taiwan na conferência sobre clima", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264346, "titulo": "US airlines work to fix nationwide ground stop", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867756", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As companhias aéreas dos Estados Unidos estão trabalhando para corrigir um sistema nacional de paradas de pista que tem causado interrupções nas operações aeronáuticas.", "titulo_pt": "Companhias aéreas dos EUA buscam corrigir sistema nacional de paradas de pista", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264348, "titulo": "French protests to focus on children and police bill", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867758", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manifestações francesas se concentrarão em questões relacionadas a crianças e a um projeto de lei policial.", "titulo_pt": "Protestos franceses se concentrarão em crianças e projeto de lei policial", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264352, "titulo": "Donation to help Italian city rebuild after August storm", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/15/2003867769", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma doação foi feita para ajudar uma cidade italiana a se reconstruir após um temporal em agosto. O dinheiro será usado para restaurar infraestruturas danificadas e apoiar a recuperação local.", "titulo_pt": "Doação para auxiliar cidade italiana a se reconstruir após temporal de agosto", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264359, "titulo": "Coast guard tracks PRC vessel after radio spat", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/15/2003867776", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guarda costeira de Taiwan monitorou um navio da China após uma discussão por rádio. Não há detalhes adicionais sobre o incidente.", "titulo_pt": "Guarda costeira de taiwan monitora navio da china após discussão por rádio", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264492, "titulo": "Brasil e Filipinas assinam acordos sobre agro e livre concorrência", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-11/brasil-e-filipinas-assinam-acordos-sobre-agro-e-livre-concorrencia", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-11-14T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brasil e Filipinas assinaram dois memorandos de entendimento em Manila para facilitar o comércio agrícola e combater práticas anticoncorrenciais. Esses acordos foram firmados durante a visita oficial do presidente Luiz Inácio Lula da Silva à Filópina, após reunião com o presidente filipino, Ferdinand Marcos Júnior.", "titulo_pt": "Brasil e Filipinas assinam acordos sobre agro e livre concorrência", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 264741, "titulo": "SpaceX successfully catches Starship and makes history", "url": "https://www.npr.org/2026/11/14/g-s1-153786/spacex-successfully-catches-starship-and-makes-history", "fonte_id": "npr_news", "data_pub": "2026-11-14T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX retornou com sucesso sua nave Starship ao hangar em Texas, utilizando dois braços metálicos que se fixaram na torre de lançamento para pousar de maneira dramática.", "titulo_pt": "Spacex pousa Starship com sucesso e faz história", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 264770, "titulo": "US flights resume after ageing technology blamed for outage", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/14/us-flights-resume-after-ageing-technology-blamed-for-outage?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os voos nos Estados Unidos retomaram após o sistema de controle de tráfego aéreo, considerado obsoleto, ser apontado como responsável pelo interrupção.", "titulo_pt": "Voo dos EUA retomados após tecnologia obsoleta ser culpada por interrupção", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 264750, "titulo": "SpaceX carries out first-ever spaceship capture", "url": "https://www.dw.com/en/spacex-carries-out-first-ever-spaceship-capture/a-79950275?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-14T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A recuperação bem-sucedida do Starship da SpaceX marca a primeira recuperação de uma espaçonave.", "titulo_pt": "Spacex realiza primeira recuperação de uma espaçonave", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 264787, "titulo": "Amid the Xi-Trump clamour, can Apec revive the business of cooperation?", "url": "https://www.scmp.com/opinion/china-opinion/article/3374048/amid-xi-trump-clamour-can-apec-revive-business-cooperation", "fonte_id": "scmp", "data_pub": "2026-11-14T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A 33ª cúpula do APEC será realizada em Shenzhen de 18 a 19 de novembro. O local escolhido não é casual, pois foi transformado de uma pequena cidade agrícola em um importante centro de eletrônicos e símbolo das reformas abertas da China.", "titulo_pt": "Em meio ao clamor Xi-Trump, será que o Apec pode reviver a cooperação?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264641, "titulo": "Malvinas: el camino de la diplomacia jurídica para la defensa pacífica de nuestros intereses", "url": "https://www.lanacion.com.ar/politica/malvinas-el-camino-de-la-diplomacia-juridica-para-la-defensa-pacifica-de-nuestros-intereses-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute o uso da diplomacia jurídica como uma abordagem pacífica para defender os interesses relacionados às Malvinas. O foco está na estratégia diplomática para resolver o conflito de forma pacífica.", "titulo_pt": "Malvinas: o caminho da diplomacia jurídica para a defesa pacífica dos nossos interesses", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264771, "titulo": "US envoy Kushner says he aims to broker Europe-Russia talks on Ukraine", "url": "https://www.aljazeera.com/news/2026/11/14/us-envoy-kushner-says-he-aims-to-broker-europe-russia-talks-on-ukraine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O enviado americano Jared Kushner afirmou que busca facilitar conversações entre Europa e Rússia sobre a Ucrânia. A aproximação direta da Europa com Moscou nas negociações de paz está se tornando cada vez mais real.", "titulo_pt": "Kushner quer mediar conversações entre Europa e Rússia sobre Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 264751, "titulo": "Germany's 2027 budget: A record €561 billion and a mountain of debt", "url": "https://www.dw.com/en/germany-s-2027-budget-a-record-€561-billion-and-a-mountain-of-debt/a-79943216?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-14T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O orçamento federal alemão para 2027 foi finalmente definido e está pronto para ser votado no parlamento. O documento destaca as prioridades do governo em áreas como defesa, infraestrutura, economia e gastos sociais.", "titulo_pt": "Orçamento federal alemão de 2027: bilhão de euros e dívida elevada", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 264759, "titulo": "Moscow says it will not dictate EU delegation's participation in Ukraine talks", "url": "https://www.euronews.com/2026/11/14/moscow-says-it-will-not-dictate-eu-delegations-participation-in-ukraine-talks", "fonte_id": "euronews", "data_pub": "2026-11-14T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moscou havia exigido anteriormente que os representantes europeus não participassem das negociações, mas agora mudou sua posição.", "titulo_pt": "Moscou não vai ditar a participação da delegação da ue nas conversas sobre Ucrânia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 264752, "titulo": "Nigeria's upcoming election marred by rising AI disinformation", "url": "https://www.dw.com/en/nigeria-s-upcoming-election-marred-by-rising-ai-disinformation/a-79946897?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-14T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aproximação das eleições de 2027 no Nígeria levanta questionamentos sobre a integridade e a preparação institucional diante do uso de inteligência artificial no processo eleitoral. Há dúvidas sobre a confiabilidade dos processos democráticos nigerianos.", "titulo_pt": "Eleições de 2027 no nígeria ameaçadas por disinformação de IA", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 264364, "titulo": "Finance and tech talent is beginning to return to Venezuela", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/15/2003867742", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há sinais de que talentos financeiros e tecnológicos estão retornando à Venezuela. A situação é vista como uma possível indicação de melhora econômica ou estabilidade no país.", "titulo_pt": "Financeiros e tecnológicos começam a retornar à Venezuela", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264546, "titulo": "Emprego dos sonhos? Vaga paga até US$ 120 mil para jogar GTA 6", "url": "https://www.infomoney.com.br/carreira/emprego-dos-sonhos-vaga-paga-ate-us-120-mil-para-jogar-gta-6/", "fonte_id": "infomoney", "data_pub": "2026-11-14T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um emprego que envolve jogar GTA 6 foi anunciado, oferecendo salários até US$ 120 mil. O profissional selecionado terá que fazer transmissões ao vivo e analisar a economia virtual do jogo.", "titulo_pt": "Emprego dos sonhos? Vaga paga até US$ 120 mil para jogar GTA 6", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264599, "titulo": "Na Cosan, um braço direito vira uma página", "url": "https://braziljournal.com/na-cosan-um-braco-direito-vira-uma-pagina", "fonte_id": "brazil_journal", "data_pub": "2026-11-14T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2002, Rubens Ometto contratou Marcelo Martins para liderar as finanças da Cosan, que posteriormente se transformou em uma das maiores holding de infraestrutura do país através de uma série de aquisições e IPOs.", "titulo_pt": "Na Cosan, um braço direito vira uma página", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 264552, "titulo": "Fortes chuvas atingem São Paulo nos próximos dias; veja quando", "url": "https://www.infomoney.com.br/brasil/fortes-chuvas-atingem-sao-paulo-nos-proximos-dias-veja-quando/", "fonte_id": "infomoney", "data_pub": "2026-11-14T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As fortes chuvas estão previstas para atingir São Paulo entre a tarde e a noite nos próximos dias. Para este sábado, 14, não há expectativa de precipitações intensas.", "titulo_pt": "Fortes chuvas atingirão São Paulo nos próximos dias; confira o horário", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264555, "titulo": "Mpox: Rio retoma vacinação contra a doença; veja quem tem direito e onde se imunizar", "url": "https://www.infomoney.com.br/brasil/mpox-rio-retoma-vacinacao-contra-a-doenca-veja-quem-tem-direito-e-onde-se-imunizar/", "fonte_id": "infomoney", "data_pub": "2026-11-14T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio de Janeiro retomou a vacinação contra a doença mpox. A vacina está disponível em cinco unidades para pessoas com HIV/AIDS e CD4 abaixo de 200. A cidade registrou 287 casos em 2026.", "titulo_pt": "Mpox: rio retoma vacinação contra a doença; veja quem tem direito e onde se imunizar", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264479, "titulo": "O Brasil não conhece o Brasil e quer fazer plano de desenvolvimento econômico", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/11/o-brasil-nao-conhece-o-brasil-e-quer-fazer-plano-de-desenvolvimento-economico.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T19:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil possui várias políticas de desenvolvimento econômico, mas não possui uma estratégia clara e consistente. O texto sugere que a falta de um plano unificado prejudica o desenvolvimento econômico do país.", "titulo_pt": "O Brasil não conhece seu próprio plano de desenvolvimento econômico", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263986, "titulo": "Em vídeo, ministro afirma que ajuste fiscal preserva direitos e combate privilégios", "url": "https://www.infomoney.com.br/politica/em-video-ministro-afirma-que-ajuste-fiscal-preserva-direitos-e-combate-privilegios/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Bruno Moretti mencionou supersalários e benefícios fiscais em um vídeo, afirmando que o ajuste fiscal preserva direitos e combate privilégios. O texto ainda está em tramitação no Congresso e enfrenta desconfiança tanto do mercado quanto de setores do governo.", "titulo_pt": "Em vídeo, ministro afirma que ajuste fiscal preserva direitos e combate privilégios", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264289, "titulo": "Nvidia board urged to consider 'potential return of Jensen Huang' by two major investors", "url": "https://www.cnbc.com/2026/11/14/nvidia-investors-jensen-huang-return-board-letter.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois investidores da Nvidia que detêm aproximadamente $2,13 bilhões em ações estão pedindo uma busca deliberada por liderança após a renúncia de Huang. Eles sugerem que a empresa considere a possibilidade de recontratar Huang.", "titulo_pt": "Investidores da nvidia pressionam para considerar 'potencial retorno de Jensen Huang'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 263987, "titulo": "A parte da força de trabalho da Tesla e da Amazon que nunca cansa (nem pede salário)", "url": "https://www.infomoney.com.br/business/global/a-forca-de-trabalho-da-tesla-e-da-amazon-nunca-cansa-nem-pede-salario/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Robôs estão tomando espaço nas fábricas e armazéns da Tesla e da Amazon, influenciando o debate sobre o futuro do trabalho. Esses robôs não cansam e não pedem salário.", "titulo_pt": "A parte da força de trabalho da Tesla e da Amazon que nunca cansa (nem pede salário)", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263990, "titulo": "Mpox: variante que causou crise na África avança no Brasil; veja sintomas", "url": "https://www.infomoney.com.br/mercados/mpox-variante-que-causou-crise-na-africa-avanca-no-brasil-veja-sintomas/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou 1.009 casos de mpox e confirmou a primeira morte causada pela doença em um paciente do Rio de Janeiro. A variante africana da doença está se espalhando no país.", "titulo_pt": "Mpox: variante africana que causou crise na África avança no Brasil; veja sintomas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263933, "titulo": "Chefe da aviação federal dos EUA pede desculpas após caos aéreo", "url": "https://www.metropoles.com/mundo/chefe-da-aviacao-federal-dos-eua-pede-desculpas-apos-caos-aereo", "fonte_id": "metropoles", "data_pub": "2026-11-14T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe da aviação federal dos EUA pediu desculpas após um caos aéreo. O problema foi causado por uma troca de fiação, que interrompeu a comunicação de tráfego.", "titulo_pt": "Chefe da aviação federal dos EUA pede desculpas após caos aéreo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263991, "titulo": "Sonda Voyager 1 da Nasa atingirá marco histórico a 26 bilhões de km da Terra", "url": "https://www.infomoney.com.br/mundo/sonda-voyager-1-da-nasa-atingira-marco-historico-a-26-bilhoes-de-km-da-terra/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Voyager 1, da Nasa, atingirá um marco histórico a 26 bilhões de quilômetros da Terra após 49 anos de operação. A Voyager 1 e a Voyager 2 foram lançadas para explorar os planetas no sistema solar exterior antes de seguir em direção ao espaço interestelar.", "titulo_pt": "Sonda Voyager 1 da Nasa atingirá marco histórico a 26 bilhões de km da Terra", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263992, "titulo": "Binance prevê retomada total dos saques até a próxima semana", "url": "https://www.infomoney.com.br/onde-investir/binance-preve-retomada-total-dos-saques-ate-a-proxima-semana/", "fonte_id": "infomoney", "data_pub": "2026-11-14T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance retomou gradualmente os saques em fases neste mês, após cobrir 95% dos US$6,3 bilhões em tokens roubados de sua plataforma. A empresa prevê a retomada total dos saques até a próxima semana.", "titulo_pt": "Binance prevê retomada total dos saques até a próxima semana", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263993, "titulo": "Musk: ‘sem Huang, muitos acordos críticos feitos em aperto de mão serão perdidos’", "url": "https://www.infomoney.com.br/business/musk-sem-huang-muitos-acordos-criticos-feitos-em-aperto-de-mao-serao-perdidos/", "fonte_id": "infomoney", "data_pub": "2026-11-14T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Huang deixou sua posição após escândalos relacionados a um suposto relacionamento com uma espiã chinesa. Musk afirmou que muitos acordos importantes, feitos informalmente, podem ser perdidos sem Huang.", "titulo_pt": "Musk: 'sem Huang, muitos acordos críticos feitos em aperto de mão serão perdidos'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263926, "titulo": "EUA têm mais de 4.000 voos cancelados neste sábado após suspensão aérea", "url": "https://www.poder360.com.br/poder-internacional/eua-tem-voos-cancelados-neste-sabado-apos-suspensao-aerea/", "fonte_id": "poder360", "data_pub": "2026-11-14T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos registraram mais de 4.000 voos cancelados neste sábado após a suspensão aérea. No Brasil, 3.019 operações tiveram atrasos até as 13h de Brasília.", "titulo_pt": "EUA têm mais de 4.000 voos cancelados neste sábado após suspensão aérea", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263849, "titulo": "State Grid emite R$ 2,5 bi em 'panda bonds' para financiar transmissão de energia no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/state-grid-emite-r-25-bi-em-panda-bonds-para-financiar-transmissao-de-energia-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A State Grid Brasil emitiu R$ 2,5 bilhões em 'panda bonds' para financiar obras de transmissão de energia em uma linha que liga as regiões Nordeste e Centro-Oeste.", "titulo_pt": "State Grid emite R$ 2,5 bi em 'panda bonds' para financiar transmissão de energia no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 264758, "titulo": "SpaceX catches upper stage of Starship rocket in historic first", "url": "https://www.cnbc.com/2026/11/14/spacex-plans-to-try-first-ever-catch-of-starship-rocket-from-orbit.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão de teste Starship Test Flight 15 foi o primeiro tentativa da empresa de Elon Musk de capturar tanto o primeiro estágio quanto o segundo estágio do foguete.", "titulo_pt": "Spacex captura primeiro estágio do foguete Starship em missão histórica", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 264789, "titulo": "Watch SpaceX successfully execute the first ‘chopstick’ catch of Starship", "url": "https://www.theverge.com/science/1033930/spacex-chopstick-starship-catch", "fonte_id": "the_verge", "data_pub": "2026-11-14T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX realizou com sucesso o primeiro 'chopstick' catch da Starship, após abortar a captura planejada do boosters da missão Starship Flight 15. A empresa já havia realizado essa manobra anteriormente com seus boosters, mas nunca antes com a Starship.", "titulo_pt": "Assista à SpaceX realizar com sucesso o primeiro 'chopstick' catch da Starship", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 264799, "titulo": "Elon Musk, other tech execs sign petition calling on Nvidia to reinstate Jensen Huang", "url": "https://techcrunch.com/2026/11/14/elon-musk-other-tech-execs-sign-petition-calling-on-nvidia-to-reinstate-jensen-huang/", "fonte_id": "techcrunch", "data_pub": "2026-11-14T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 115.000 pessoas assinaram uma petição, incluindo Elon Musk, pedindo à Nvidia que reestabeleça Jensen Huang em suas posições.", "titulo_pt": "Elon Musk e outros executivos de tecnologia assinam petição pedindo que a Nvidia reestabeleça Jensen Huang", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 264785, "titulo": "SpaceX successfully carries out first-ever spaceship catch", "url": "https://www.scmp.com/news/world/united-states-canada/article/3374463/spacex-successfully-carries-out-first-ever-spaceship-catch", "fonte_id": "scmp", "data_pub": "2026-11-14T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A espaçonave Starship da SpaceX retornou com sucesso à plataforma de lançamento em Texas após sua maior missão orbital até o momento, realizando a primeira recuperação bem-sucedida de seu módulo principal. O foguete Super Heavy, a parte inferior do Starship, transportou a espaçonave ao espaço de suas instalações em Starbase, Texas, na véspera.", "titulo_pt": "Spacex realiza primeiro puxadouro bem-sucedido de sua espaçonave", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264640, "titulo": "El escándalo de Nvidia suma tensión a la carrera entre Estados Unidos y China por el dominio de la IA", "url": "https://www.lanacion.com.ar/estados-unidos/el-escandalo-de-nvidia-suma-tension-a-la-carrera-entre-estados-unidos-y-china-por-el-dominio-de-la-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um suposto esquema de espionagem chinesa envolvendo o ex-CEO da Nvidia está aumentando a tensão na disputa tecnológica entre Estados Unidos e China, especialmente em relação ao domínio da Inteligência Artificial.", "titulo_pt": "Escândalo de Nvidia aumenta tensão na disputa tecnológica entre EUA e China", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264475, "titulo": "Musk diz que parte dos acordos da Nvidia está ameaçada por ser só 'aperto de mãos' com Huang", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/musk-diz-que-parte-dos-acordos-da-nvidia-esta-ameacada-por-ser-so-aperto-de-maos-com-huang.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Elon Musk afirmou que parte dos acordos feitos pela Nvidia podem estar em risco devido à saída de Jensen Huang dos cargos de presidente, CEO e membro do conselho de administração da empresa. Musk mencionou que esses acordos podem estar ameaçados devido à natureza informal dos seus termos, comparando-os a um 'aperto de mãos'.", "titulo_pt": "Musk diz que parte dos acordos da Nvidia está ameaçada por ser só 'aperto de mãos' com Huang", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 264800, "titulo": "Tesla opens Cybercab pre-orders ‘for personal use,’ with geo restrictions and a $299 monthly fee", "url": "https://techcrunch.com/2026/11/14/tesla-opens-cybercab-pre-orders-for-personal-use-with-geo-restrictions-and-a-299-monthly-fee/", "fonte_id": "techcrunch", "data_pub": "2026-11-14T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tesla está aceitando pré-encomendas para o Cybercab para uso pessoal, com restrições geográficas e um custo mensal de $299. Mesmo Elon Musk considerou o valor do mês alto.", "titulo_pt": "Tesla abre pré-encomendas para Cybercab 'para uso pessoal', com restrições geográficas e taxa mensal de $299", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 264688, "titulo": "Art ‘must not be sacrificed on the altar of corporate profit’ Liberal senator says as AI policy debate rages", "url": "https://www.theguardian.com/australia-news/2026/nov/15/art-over-profit-ai-policy-debate-andrew-mclachlan", "fonte_id": "guardian_world", "data_pub": "2026-11-14T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O senador liberal Andrew McLachlan alertou contra o uso de AI, alegando que a arte não deve ser sacrificada para o lucro das corporações. Ele pediu ao governo laborista para considerar o impacto da AI sobre os artistas e o meio ambiente.", "titulo_pt": "Arte não deve ser sacrificada para lucro das corporações, afirma senador Liberal", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 264792, "titulo": "Synopsys sees AI accelerating EDA as chip-specific models divide work", "url": "https://www.digitimes.com/news/a20261112PD239/synopsys-eda-openai-development-design.html", "fonte_id": "digitimes", "data_pub": "2026-11-14T18:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente de desenvolvimento de produtos da Synopsys, Shankar Krishnamoorthy, afirmou que a inteligência artificial acelerará a indústria de automação de design eletrônico (EDA) enquanto a empresa trabalha com a OpenAI para desenvolver modelos específicos para semicondutores, mantendo ao mesmo tempo o suporte para modelos fronteiriços e de peso aberto para preservar a neutralidade da plataforma.", "titulo_pt": "Synopsys vê IA acelerando EDA com modelos específicos para semicondutores", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 264537, "titulo": "Caos aéreo continua nos EUA após pane, com 5 mil voos cancelados neste sábado", "url": "https://exame.com/mundo/caos-aereo-continua-nos-eua-apos-pane-com-5-mil-voos-cancelados-neste-sabado/", "fonte_id": "exame", "data_pub": "2026-11-14T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A modernização do controle de tráfego aéreo nos Estados Unidos enfrentou uma falha, resultando em milhares de voos cancelados neste sábado. O incidente expôs problemas na infraestrutura do país.", "titulo_pt": "Caos aéreo continua nos EUA após falha, com 5 mil voos cancelados neste sábado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264788, "titulo": "Transport chief blames US-wide flight disruptions on upgrade of old copper wiring", "url": "https://www.scmp.com/news/world/united-states-canada/article/3374456/transport-chief-blames-us-wide-flight-disruptions-upgrade-old-copper-wiring", "fonte_id": "scmp", "data_pub": "2026-11-14T18:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os viajantes ficaram preparados para mais perturbações no serviço aéreo no sábado, após um adiamento de horas nos aeroportos dos EUA, atribuído à administração Trump a falhas no equipamento ou a um erro por parte de um contratista responsável pela substituição de velhas linhas de cobre de comunicação. A paralisação nacional na sexta-feira causou caos generalizado e deixou centenas de milhares de passageiros em situação incerta, com alguns passageiros sendo removidos do avião momentos antes do decolagem, enquanto a equipe da companhia aérea parecia estar desinformada sobre o que se passava.", "titulo_pt": "Chefe de transporte culpa interrupções de voos nos EUA por problemas no equipamento antigo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264801, "titulo": "Got an iPhone Duo? These 9 settings make it easier to use", "url": "https://techcrunch.com/2026/11/14/got-an-iphone-duo-these-9-settings-make-it-easier-to-use/", "fonte_id": "techcrunch", "data_pub": "2026-11-14T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estes ajustes incluem atalhos Touch ID, botões de volume mais inteligentes e truques de câmera, tornando o iPhone dobrável da Apple mais fácil de usar no dia a dia.", "titulo_pt": "Possui um iphone Duo? Estes 9 ajustes tornam o uso mais fácil", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 264793, "titulo": "Foxconn targets automotive chiplets with 5μm fan-out RDL packaging", "url": "https://www.digitimes.com/news/a20261112PD242/packaging-ai-applications-foxconn-automotive-training.html", "fonte_id": "digitimes", "data_pub": "2026-11-14T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foxconn está utilizando tecnologia de redistribuição de camada (RDL) para entrar no mercado de embalagens avançadas. A empresa exibiu circuitos com linhas finas de aproximadamente 5μm no Hon Hai Tech Day 2026, com foco em chiplets automotivos, Inteligência Artificial em borda e eletrônicos consumidores, buscando balancear a densidade de interconexões, o tamanho do pacote e o custo de fabricação.", "titulo_pt": "Foxconn almeja chiplets automotivos com tecnologia de embalagem avançada de 5μm", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 264794, "titulo": "AUO Mobility Solutions to showcase next-gen smart cockpit at CES 2027", "url": "https://www.digitimes.com/news/a20261112PD246/auo-smart-cockpit-2027-ces-subsidiary.html", "fonte_id": "digitimes", "data_pub": "2026-11-14T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A AUO Mobility Solutions, uma
