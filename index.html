<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "13/08/2026 15:20", "stats": {"noticias_novas": 920, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As eleições presidenciais de 2026 se aproximam, com o primeiro turno marcado para 30 de outubro e o segundo turno, caso necessário, para 20 de novembro. O senador Flávio Bolsonaro (PL-RJ) enfrenta problemas na tentativa de registrar sua candidatura após ser filiado indevidamente ao partido Missão no sistema do Tribunal Superior Eleitoral (TSE). A decisão gerou controvérsias, com o TSE negando que tenha ocorrido um ataque hacker e apontando para a utilização fraudulenta das credenciais do próprio senador. Por outro lado, o presidente Luiz Inácio Lula da Silva (PT) iniciou a gravação de vídeos para campanha eleitoral, focando em senadores e governadores que já exercem mandato. Além disso, o Tribunal Superior Eleitoral (TSE) suspendeu um julgamento que poderia ampliar o fundo eleitoral do PT, afetando todos os partidos, incluindo a maior fatia do fundo.", "mundo": "O surto de Ebola na República Democrática do Congo se expandiu para a sexta província, com relatos de uma morte em Bas-Uele após uma pessoa viajar de Haut-Uele. O chefe da Organização Mundial da Saúde alertou que o surto pode ultrapassar o mais letal registrado no passado, que matou cerca de 11 mil pessoas há mais de uma década. Até agora, mais de 2.100 mortes foram registradas em um total superior a 4.500 casos. Em outro desenvolvimento, o governo do Chile realizou uma operação chamada 'Cancerbero', envolvendo o transporte massivo de presos considerados de alta periculosidade. O presidente chileno declarou que é um dia histórico e marca um importante avanço na gestão carcerária. Além disso, a Boeing foi condenada a pagar 29 milhões de euros em uma causa civil movida por uma família irlandesa que perdeu um membro no acidente envolvendo 157 pessoas.\n\nTaiwan foi alvo de uma campanha de hacking baseada em inteligência artificial, segundo relatos do Taipei Times. Os Estados Unidos pediram à China para parar com a pressão militar sobre Taiwan após exercícios navais realizados pela China perto das águas taiwanesas. As novas nomeações no governo iraniano sugerem preparação para uma guerra prolongada, de acordo com o Foreign Policy. A China e a Indonésia realizaram exercícios militares conjuntos nas águas leste de Taiwan, gerando irritação na província taiwanesa. As relações entre Israel e Qatar permanecem tensas, já que Doha mantém laços com Gaza e Hamas, apesar das preocupações de Tel Aviv sobre esses vínculos, conforme relatado pelo The Diplomat.", "economia": "A América Latina está enfrentando o El Niño mais intenso já registrado, o que pode afetar significativamente a principal região exportadora mundial de alimentos. O fenômeno climático também influencia as expectativas inflacionárias no Brasil, com o IPCA previsto para subir cerca de 4% em 2026, sem considerar os impactos da guerra e do El Niño. Em outro destaque econômico, a Petrobras atingiu um recorde de 4 bilhões de barris de óleo equivalente no campo de Tupi no pré-sal, o primeiro ativo da companhia a alcançar essa marca. Além disso, a plataforma Shopee estreou seu serviço de entrega em até quatro horas para alimentos frescos no Brasil, enquanto a Eneva registrou uma queda significativa de 91,4% no lucro do segundo trimestre. O Banco do Brasil enfrenta um aumento na inadimplência e restringiu linhas de crédito após um erro relacionado a um cartão, levando as ações da empresa a cair nesta quinta-feira. A Vale planeja elevar sua produção de cobre com o projeto Flotação de Partículas Grossas no complexo de Salobo até 2028, enquanto a MRV&Co registrou um prejuízo líquido de R$ 626,6 milhões no segundo trimestre, majoritariamente puxado por perdas na Resia. A Porsche também anunciou que planeja parar a produção do único modelo 100% elétrico Taycan até 2030, refletindo as dificuldades enfrentadas pelo mercado de veículos elétricos.", "tecnologia": "A Skytech está focada na alta demanda associada à explosão da inteligência artificial. A Anthropic estaria em negociações para comprar a startup Decart por 6 bilhões de dólares. A OpenAI, empresa liderada por Sam Altman, enfrenta mudanças significativas em sua liderança com a saída repentina de Denise Dresser, chefe de receita da empresa. As preocupações com a cibersegurança estão aumentando, pois a inteligência artificial está sendo usada como uma arma perigosa e quase 14 mil detentores de criptomoedas enfrentam risco de segurança após um vazamento de dados em um ataque hacker. A tecnologia de inteligência artificial também está sendo utilizada para gerar conteúdo, como filmes e notícias, embora o melhor conteúdo ainda seja produzido por humanos. Além disso, a Microsoft está simplificando o Copilot ao combinar suas aplicações para consumidores e negócios, eliminando recursos como podcasts gerados por IA.", "ciencia": "O Ministério de Ciência do Chile estabeleceu seis pilares para o período 2026-2030, incluindo a integração da inteligência artificial. A ministra Aisén Etcheverry enfatizou que o país não deve apenas consumir, mas também produzir avanços nessa área. Paralelamente, uma tempestade rara no Pacífico está se aproximando das Ilhas Havaí neste fim de semana, trazendo chuvas intensas e possíveis condições hurricânicas. Em outro desenvolvimento científico, estrelas frequentemente lançam plasma no espaço, mas observações de tal erupção em outras estrelas são raras; campos magnéticos podem explicar essa raridade. Além disso, a NASA fotografou dois meteoroides do Perseides durante um eclipse solar total em 2018 no Monumento Nacional Cedar Breaks, Utah.", "cultura": "A exposição 'Turn the Volume Up!' no Museu Nasher de Arte, na Duke University, foi inaugurada em 27 de agosto. Ela destaca a história de pessoas e artistas que se manifestaram para buscar mudanças na América. Com uma abordagem multifacetada, o evento explora como a voz das vozes marginalizadas foi crucial para o progresso social ao longo dos anos. Paralelamente, o Festival Mirada, em sua oitava edição e reunindo espetáculos de 15 países na Baixada Santista, debate temas como tempo, migração e festa. Inspirado pelas festas andinas, o festival combina humor com cosmovisão andina. Estes eventos refletem a diversidade cultural e a busca por mudanças sociais através do arte e da reflexão.", "sociedade": "Em Cali, uma psicóloga chamada Kelly Díaz testemunhou um colapso escolar que resultou na morte de uma menina de 10 anos. Ela prestou socorro e encontrou a garota falecida em seus braços, o que gerou grande comoção local. Em meio a diversos outros eventos sociais, destaca-se o caso da nova onda de ataques às vacinas liderada por Nikolas Ferreira e Eduardo Bolsonaro, que provocaram uma reação favorável à imunização nas redes sociais após um período inicial de desaceleração. Além disso, a proposta de reforma da segurança pública no Chile prevê limitações aos presidiários em relação aos benefícios estatais, levantando preocupações políticas e jurídicas.", "meio_ambiente": "A Europa enfrenta um aumento nas temperaturas, com mais de 135 milhões de pessoas afetadas por altas marcas acima dos 35°C. Em particular, o Reino Unido registrou sua temperatura mais alta do ano, com 38,1°C no Jardim Botânico de Kew, superando seu recorde anterior. As autoridades britânicas alertaram para a gravidade da situação e pediram restrições mais rígidas no uso da água. Paralelamente, um vazamento de óleo de um navio-tanque, supostamente russo, atingiu as praias do Oman, contaminando suas costas. Além disso, a Organização Mundial da Saúde (OMS) alertou sobre o avanço da epidemia de Ebola para a sexta província congolense, com mais de 2.100 mortes registradas. No Brasil, espera-se um aumento nas chuvas de até 33% no verão nas regiões mais produtivas do país, devido ao fenômeno El Niño. Finalmente, o Greenpeace pediu uma revisão da lei de energia, enquanto a agência apresentou quatro agricultores com rótulos indicando que suas propriedades são amigáveis aos búlbos. O artigo também discute a importância dos conceitos de Antropoceno e Capitaloceno na discussão do tratamento da natureza como mercadoria.", "direitos_humanos": "Um ex-arcebispo de Broome, na Austrália, foi condenado por 13 delitos sexuais após ter organizado festas alcoólicas que resultaram no abuso sexual de jovens homens indígenas. De acordo com relatório do The Guardian, 94% (31%) dos casos envolvendo disputa de idade na França e Reino Unido foram posteriormente confirmados como menores de idade, o que reflete preocupações sobre a detenção de crianças como adultos sob acordos migratórios bilaterais. Em Hong Kong, uma mulher foi absolvida de duas acusações relacionadas às manifestações anti-governo após um juiz considerar as provas apresentadas pelos promotores insuficientes. Além disso, o The Guardian informa que 90% das crianças foram detidas como adultos sob o acordo entre Reino Unido e França para a migração, reforçando os desafios éticos associados à implementação desses acordos."}, "resumo_do_dia": {"politica_nacional": [{"id": 101945, "titulo": "PL não consegue registrar Flávio como candidato após fraude alterar filiação do senador para partido Missão, afirma campanha", "url": "https://www.bbc.com/portuguese/articles/cg5lp58rnpqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-13T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Missão não conseguiu registrar Flávio Bolsonaro como candidato após uma fraude alterar sua filiação partidária. O Tribunal Superior Eleitoral (TSE) ainda não se manifestou sobre o ocorrido.", "titulo_pt": "PL não consegue registrar Flávio como candidato após fraude alterar filiação do senador para partido Missão, afirma campanha", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 101746, "titulo": "'Só sabem jogar sujo', diz Flávio Bolsonaro após ser filiado ao Missão", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/13/so-sabem-jogar-sujo-diz-flavio-bolsonaro-sobre-filiacao-ao-missao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador pelo PL, se manifestou nas redes sociais após ser filiado indevidamente ao Missão no sistema do Tribunal Superior Eleitoral (TSE), o que impediu a registro da sua candidatura à Presidência da República. O TSE negou hackeamento e informou que alguém com acesso às plataformas do Missão fez o processo de filiação.", "titulo_pt": "‘Só sabem jogar sujo’, diz Flávio Bolsonaro após ser filiado ao Missão", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 101824, "titulo": "Kassio manda polícia investigar filiação de Flávio ao Missão", "url": "https://www.metropoles.com/colunas/manoela-alcantara/kassio-manda-policia-investigar-filiacao-de-flavio-ao-missao", "fonte_id": "metropoles", "data_pub": "2026-08-13T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O corte afirmou que as credenciais da legenda foram usadas indevidamente para efetivar a filiação de Flávio. Kassio mandou a polícia investigar essa situação.", "titulo_pt": "Kassio manda polícia investigar filiação irregular de Flávio ao Missão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 101826, "titulo": "Suspeitos fizeram 1ª tentativa de filiar Flávio ao Missão em 2/8", "url": "https://www.metropoles.com/colunas/igor-gadelha/suspeitos-fizeram-1a-tentativa-de-filiar-flavio-ao-missao-em-2-8", "fonte_id": "metropoles", "data_pub": "2026-08-13T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2 de agosto, suspeitos tentaram filiar Flávio ao partido Missão, mas a tentativa não foi efetivada por falta de pagamento.", "titulo_pt": "Suspeitos fizeram primeira tentativa de filiação de Flávio ao Missão em 2/8", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 101747, "titulo": "TSE diz que credenciado do Missão filiou Flávio Bolsonaro ao partido e nega ataque hacker", "url": "https://g1.globo.com/politica/noticia/2026/08/13/tse-nega-ataque-hacker-na-filiacao-de-flavio-ao-missao-e-aponta-uso-indevido-de-ferramenta.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) negou que a filiação do senador Flávio Bolsonaro ao partido Missão tenha sido resultado de um ataque hacker. O registro teria ocorrido por meio da utilização indevida das credenciais da própria legenda.", "titulo_pt": "TSE nega que filiação de Flávio Bolsonaro seja resultado de ataque hacker", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 101773, "titulo": "Lula discute ajudar candidato ao governo do Amapá aliado de Alcolumbre", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/lula-discute-ajudar-candidato-ao-governo-do-amapa-aliado-de-alcolumbre.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reestablishment da relação entre Lula (PT) e Davi Alcolumbre (União-AP), presidente do Senado, pode levar o petista a apoiar mais explicitamente a candidatura de Clécio Luís (União Brasil) ao governo do Amapá.", "titulo_pt": "Lula discute ajudar candidato ao governo do Amapá aliado de Alcolumbre", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 101783, "titulo": "Senado aprova empréstimos de US$ 1,8 bi para estados e municípios", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/senado-aprova-emprestimos-de-us-18-bi-para-estados-e-municipios", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-13T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plenário do Senado aprovou 16 empréstimos externos no valor total de US$ 1,8 bilhão para estados e municípios com garantia da União. As operações foram autorizadas após análise do governo federal.", "titulo_pt": "Senado aprova empréstimos de US$ 1,8 bi para estados e municípios", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 101748, "titulo": "Câmara aprova projeto para converter milhas em dinheiro", "url": "https://g1.globo.com/economia/noticia/2026/08/13/camara-aprova-projeto-para-converter-milhas-em-dinheiro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto que visa regulamentar programas de fidelidade, milhas e pontos, incluindo a conversão dessas milhas em dinheiro. O texto agora será analisado pelo Senado.", "titulo_pt": "Câmara aprova projeto sobre conversão de milhas em dinheiro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 101749, "titulo": "Missão diz ser 'vítima' e que alertou gabinete de Flávio Bolsonaro 10 dias antes sobre tentativa de fraude", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/13/missao-diz-que-filiacao-de-flavio-bolsonaro-ao-partido-foi-fraudulenta.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Missão afirmou em nota que foi vítima de uma tentativa fraudulenta de filiação por Flávio Bolsonaro e alertou o gabinete do senador em agosto. O partido buscou cancelar a filiação no mesmo dia, mas sem sucesso na Justiça Eleitoral.", "titulo_pt": "Missão diz ser 'vítima' e que alertou gabinete de Flávio Bolsonaro sobre tentativa de fraude", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 101774, "titulo": "As contas fechadas dos partidos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/08/as-contas-fechadas-dos-partidos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido da Causa Operária (PCO) foi alvo de uma operação policial. Rui Costa Pimenta, seu presidente e figura frequente em campanhas presidenciais, foi submetido a busca e apreensão durante a operação Causa Própria.", "titulo_pt": "As contas fechadas dos partidos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 101775, "titulo": "Secretaria de Segurança de SP descarta intimidação de policiais a Haddad", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/secretaria-de-seguranca-de-sp-descarta-intimidacao-de-policiais-a-haddad.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T16:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria de Segurança Pública de São Paulo, sob a gestão de Tarcísio de Freitas (Republicanos), negou que tenha havido tentativa de intimidar o candidato ao governo do estado Fernando Haddad (PT) e sua equipe.", "titulo_pt": "Secretaria de Segurança de SP descarta intimidação de policiais a Haddad", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 101750, "titulo": "Lula grava primeiros vídeos para campanha eleitoral nesta quinta", "url": "https://g1.globo.com/politica/noticia/2026/08/13/lula-grava-primeiros-videos-para-campanha-eleitoral-nesta-quinta.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) começou a gravar vídeos para a campanha eleitoral nesta quinta-feira, iniciando a produção de conteúdo para candidatos do PT e aliados. As gravações prioritariamente abrangem senadores e governadores em estados onde os nomes apoiados já exercem mandato.", "titulo_pt": "Lula começa a gravar vídeos para campanha eleitoral nesta quinta", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 101776, "titulo": "TSE suspende julgamento de ação do PT para ampliar fundo eleitoral e trava repasse a todos partidos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tse-suspende-julgamento-de-acao-do-pt-para-ampliar-fundo-eleitoral-e-trava-repasse-a-todos-partidos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T16:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral suspendeu o julgamento que analisa um pedido do PT para aumentar seu fundo eleitoral. A decisão trava o repasse de recursos para todos os partidos, incluindo a maior fatia do fundo.", "titulo_pt": "TSE suspende julgamento sobre aumento do fundo eleitoral do PT e trava repasses", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 101777, "titulo": "Flávio Bolsonaro é filiado a partido Missão, e registro de candidatura no TSE atrasa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-bolsonaro-e-filiado-a-partido-missao-e-registro-de-candidatura-no-tse-atrasa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro (PL-RJ) foi registrado como filiado ao partido Missão, sem seu conhecimento. Isso está atrasando o registro formal de sua candidatura presidencial.", "titulo_pt": "Flávio Bolsonaro é filiado a partido Missão e registro de candidatura no TSE atrasa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 101751, "titulo": "Câmara aprova projeto que autoriza porte de arma para oficiais de justiça", "url": "https://g1.globo.com/politica/noticia/2026/08/13/camara-aprova-projeto-que-autoriza-porte-de-arma-para-oficiais-de-justica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto que autoriza oficiais de justiça a porte de armas de fogo para defesa pessoal. O texto seguirá para análise no Senado.", "titulo_pt": "Câmara aprova porte de arma para oficiais de justiça", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 101752, "titulo": "TSE adia reunião que discutiria proibição do uso de deepfakes na campanha eleitoral", "url": "https://g1.globo.com/politica/noticia/2026/08/13/tse-adia-reuniao-que-discutiria-proibicao-do-uso-de-deepfakes-na-campanha-eleitoral.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) adiou a reunião prevista para discutir a proibição do uso de deepfakes na campanha eleitoral e as punições para descumprimento das regras. O encontro, convocado pelo presidente Kassio Nunes Marques, foi adiado após os julgamentos do plenário e sem data nova definida.", "titulo_pt": "TSE adia reunião sobre proibição de deepfakes na campanha eleitoral", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 102417, "titulo": "Taiwan targeted in AI-driven hacking campaign", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/14/2003862463", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan foi alvo de uma campanha de hacking baseada em inteligência artificial. Os detalhes específicos da operação não foram fornecidos nessa notícia.", "titulo_pt": "Taiwan alvo de campanha de hacking com uso de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102423, "titulo": "U.S. urges China to halt military pressure on Taiwan after naval drill", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862476", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos pediram à China para que parasse de aplicar pressão militar sobre a Taiwan após uma manobra naval. O incidente envolveu exercícios militares realizados pela China perto das águas taiwanesas.", "titulo_pt": "EUA pedem a China para parar com pressão militar sobre Taiwan após manobras navais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102427, "titulo": "Government bodies urged to collaborate on APEC subfund", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862480", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram encorajados os órgãos governamentais a colaborarem na subcota do FMI para APEC. O foco está na cooperação entre as entidades governamentais relacionada ao fundo.", "titulo_pt": "Governo incentivado a colaborar no subfundo da APEC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102440, "titulo": "EDITORIAL: AIT shows deepening Taiwan-US ties", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/08/14/2003862453", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo editorial destaca aprofundamento das relações entre Taiwan e Estados Unidos.", "titulo_pt": "AIT mostra aprofundamento das relações entre taiwan e estados unidos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 101821, "titulo": "Missão diz que alertou gabinete de Flávio Bolsonaro sobre fraude", "url": "https://www.metropoles.com/brasil/missao-diz-que-alertou-gabinete-de-flavio-bolsonaro-sobre-fraude", "fonte_id": "metropoles", "data_pub": "2026-08-13T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Missão enviou e-mails ao gabinete de Flávio Bolsonaro em 2 de agosto para informar sobre a tentativa de filiação fraudulenta.", "titulo_pt": "Missão avisa gabinete de Flávio Bolsonaro sobre fraude na filiação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 102189, "titulo": "Mangione could plead guilty in federal case ahead of NY murder trial", "url": "https://www.npr.org/2026/08/13/nx-s1-5930397/mangione-federal-court-hearing-guilty-plea", "fonte_id": "npr_news", "data_pub": "2026-08-13T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve uma surpresa na sexta-feira durante uma audiência no tribunal federal que aumentou as especulações de que Luigi Mangione pode admitir culpa em um caso federal, o que poderia interromper um julgamento estatal por assassinato.", "titulo_pt": "Luigi mangione pode se entregar em processo federal antes do julgamento pelo assassinato no estado", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 102375, "titulo": "Media, Kiev ha proposto a Mosca una tregua su obiettivi civili nel Mar Nero", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/13/media-kiev-ha-proposto-a-mosca-una-tregua-su-obiettivi-civili-nel-mar_7d56a14e-c16c-45d6-a7a3-e183196b6593.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-13T17:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Kiev propôs a Moscou uma tregua para proteger objetivos civis no Mar Negro. Os ataques recíprocos contra as expedições de grão podem impactar os preços globais.", "titulo_pt": "Kiev propõe tregua à moscou para proteger objetivos civis no Mar negro", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 102227, "titulo": "Conditions on US aircraft carrier at sea for more than 250 days raise alarms", "url": "https://www.bbc.co.uk/news/articles/cyvl2d5j52lo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-13T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há relatos de escassez de alimentos, problemas no sistema de encanamento e outras possíveis danos a bordo do USS Abraham Lincoln, que permanece em operação há mais de 250 dias.", "titulo_pt": "Condições a bordo do uss abraham lincoln após mais de 250 dias em alto mar levantam alarmes", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 102087, "titulo": "Train Derails Near Town of Lewes in East Sussex, U.K.", "url": "https://www.nytimes.com/2026/08/13/world/europe/train-derails-southern-england.html", "fonte_id": "nyt_world", "data_pub": "2026-08-13T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acidente ferroviário ocorreu perto da cidade de Lewes, no condado de East Sussex, Reino Unido. Equipes de emergência estavam trabalhando no local do incidente.", "titulo_pt": "Trem deriva perto de Lewes, no Sussex oriental, reino unido", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 102310, "titulo": "When the earth moves: six major earthquakes of 2026", "url": "https://www.dw.com/en/when-the-earth-moves-six-major-earthquakes-of-2026/a-78358208?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-13T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, seis fortes terremotos ocorreram na Colômbia, Venezuela e Mindanao, causando milhares de mortes. O tamanho do terremoto não é o único fator que determina a gravidade da catástrofe.", "titulo_pt": "Quando a terra trema: seis grandes terremotos de 2026", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 102088, "titulo": "Topos Azteca, a Mexican Volunteer Rescue Group, Helps With Rescue Efforts After Colombia Earthquake", "url": "https://www.nytimes.com/2026/08/13/world/americas/topos-azteca-rescue-efforts-colombia-earthquake.html", "fonte_id": "nyt_world", "data_pub": "2026-08-13T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Topos Azteca, um grupo de voluntários de resgate mexicano que atua globalmente e ajudou após os ataques do 11 de setembro, chegou à Colômbia para procurar sobreviventes depois de ter trabalhado em Venezuela.", "titulo_pt": "Topos Azteca, um grupo de voluntários de resgate mexicano, chega à colômbia para buscar sobreviventes", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 102376, "titulo": "Gip, 'da Lavitola dichiarazioni fumose e senza alcun riscontro'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/13/gip-da-lavitola-dichiarazioni-fumose-e-senza-alcun-riscontro_5cfa30c7-588d-4283-b181-ed685cb3653a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-13T17:13:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O juiz rejeitou a solicitação dos presos domiciliários. A Lavitola fez declarações fumosas, mas sem nenhum fundamento.", "titulo_pt": "Gip, 'declarações fumosas e sem respaldo'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 102021, "titulo": "El Gobierno de Kast ejecuta un traslado masivo de reos de alta peligrosidad en un operativo al estilo Bukele", "url": "https://elpais.com/chile/2026-08-13/el-gobierno-de-kast-ejecuta-un-traslado-masivo-de-reos-de-alta-peligrosidad-en-un-operativo-al-estilo-bukele.html", "fonte_id": "elpais_america", "data_pub": "2026-08-13T17:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo de Kast realizou uma operação denominada 'Cancerbero', envolvendo o traslado massivo de presos considerados de alta periculosidade. O presidente chileno declarou que é um dia histórico e marca um importante mudança de gestão.", "titulo_pt": "Governo de Kast executa transferência maciça de reclusos altamente perigosos em operação semelhante à de Bukele", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 102377, "titulo": "Boeing condannata a pagare 29 milioni per disastro in cui morirono anche 8 italiani", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/13/boeing-condannata-a-pagare-29-milioni-per-disastro-in-cui-morirono-anche-8-italiani_9e725848-5384-4bb9-bb99-a3a0570d1d97.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-13T17:04:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Boeing foi condenada a pagar 29 milhões de euros em uma causa civil movida por uma família irlandesa que perdeu um membro na catástrofe. A vítima era uma das 157 pessoas mortas no acidente.", "titulo_pt": "Boeing condenada a pagar 29 milhões por desastre com 8 italianos mortos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 102197, "titulo": "Platner announced as speaker for activist-led event in Maine", "url": "https://www.politico.com/news/2026/08/13/graham-platner-maine-event-speaker-01036207", "fonte_id": "politico", "data_pub": "2026-08-13T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Platner deixou recentemente sua corrida pelo Senado de Maine após uma mulher que o datou acusá-lo de assédio sexual, alegação que ele negou. Ele será o orador de um evento liderado por ativistas em Maine.", "titulo_pt": "Platner anunciado como orador para evento liderado por ativistas em Maine", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 102257, "titulo": "Lagos: Electric vehicles offer an alternative as fuel prices soar", "url": "https://www.france24.com/en/video/20260813-lagos-electric-vehicles-offer-an-alternative-as-fuel-prices-soar", "fonte_id": "france24", "data_pub": "2026-08-13T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Lagos, a Nigéria, o som dos veículos elétricos está se tornando mais comum à medida que os preços do combustível aumentam. No entanto, a transição para veículos elétricos enfrenta desafios significativos em um país que é um dos maiores produtores de petróleo da África.", "titulo_pt": "Lagos: veículos elétricos oferecem alternativa com preços do combustível em alta", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 101706, "titulo": "Como o super El Niño na América Latina afetará a principal região exportadora de alimentos?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/como-o-super-el-nino-na-america-latina-afetara-a-principal-regiao-exportadora-de-alimentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A América Latina está se preparando para enfrentar o El Niño mais intenso já registrado, de acordo com especialistas. Este fenômeno climático pode afetar significativamente a principal região exportadora mundial de alimentos.", "titulo_pt": "Como o super El Niño na América Latina impactará a maior região exportadora de alimentos?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 101782, "titulo": "Tupi, pioneiro do pré-sal, chega ao recorde de 4 bilhões de barris", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/tupi-pioneiro-do-pre-sal-chega-ao-recorde-de-4-bilhoes-de-barris", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-13T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras informou que o ativo de Tupi, no pré-sal da Bacia de Santos, alcançou 4 bilhões de barris de óleo equivalente (boe), um recorde para um único ativo da companhia. Este é o primeiro campo a atingir essa marca.", "titulo_pt": "Tupi, pioneiro do pré-sal, atinge marca recorde de 4 bilhões de barris", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 101708, "titulo": "Câmara aprova projeto que facilita comércio de milhas e conversão de pontos em dinheiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/camara-aprova-projeto-que-facilita-comercio-de-milhas-e-conversao-de-pontos-em-dinheiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto que cria um marco regulatório para os programas de milhagem das companhias aéreas, facilitando a comercialização de milhas e permitindo a conversão dos pontos em dinheiro. O texto agora segue para o Senado.", "titulo_pt": "Câmara aprova projeto que regula comércio de milhas e conversão de pontos em dinheiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 101709, "titulo": "Porsche prevê parar de produzir o Taycan, seu único modelo 100% elétrico, até 2030", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/porsche-preve-parar-de-produzir-o-taycan-seu-unico-modelo-100-eletrico-ate-2030.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Porsche planeja parar a produção do Taycan, seu único modelo 100% elétrico, até 2030. As vendas desse carro despencaram nos últimos anos.", "titulo_pt": "Porsche prevê encerrar produção do Taycan, seu único carro 100% elétrico, até 2030", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 101710, "titulo": "Shopee estreia no mercado de alimentos frescos no Brasil e lança entregas em até tuação de rua morre após ter corpo incendiado enquanto dormia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 101290, "titulo": "‘Everything is on the line’: students shun calls to stay in school and join anti-Hanson protests across Australia", "url": "https://www.theguardian.com/australia-news/2026/aug/13/australia-student-rally-anti-hanson-protests-sydney-brisbane-melbourne-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-13T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes de ensino médio e universitários se uniram em greves nas principais cidades e algumas localidades menores, protestando contra o aumento da influência de Pauline Hanson. Eles saíram às ruas gritando slogans anti-racistas e criticando a ex-lanchonete de Pauline Hanson e ela mesma.", "titulo_pt": "Tudo está em jogo: estudantes abandonam escola para se juntar aos protestos antirracismo contra pauline hanson em todo o país", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 102425, "titulo": "Greenpeace calls for review of energy bill", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862478", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Greenpeace está pedindo uma revisão da lei de energia. O grupo ambientalista quer que as regras atuais sobre a produção e uso de energia sejam examinadas mais profundamente.", "titulo_pt": "Greenpeace solicita revisão da lei de energia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102429, "titulo": "Agency presents four farmers with owl-friendly label", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862482", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência apresentou quatro agricultores com um rótul o-e-analise/colunas/em-clima-de-justica/antropoceno-capitaloceno-ou-o-preco-de-tratar-a-natureza-como-mercadoria", "fonte_id": "jota", "data_pub": "2026-08-13T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância de conceitos como Antropoceno e Capitaloceno, enfatizando a urgência da mudança no tratamento da natureza como mercadoria.", "titulo_pt": "Antropoceno, Capitaloceno, ou o preço de tratar a natureza como mercadoria", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 102345, "titulo": "Ebola outbreak caused by new ‘animal transmission’: What that means", "url": "https://www.aljazeera.com/news/2026/8/13/ebola-outbreak-caused-by-new-animal-transmission-what-that-means?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T14:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 2.000 pessoas morreram após contrair a última cepa do vírus Ebola.", "titulo_pt": "Ebola: nova 'transmissão animal' é causa dos casos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 102355, "titulo": "More than 135 million people in Europe face temperatures over 35C", "url": "https://www.aljazeera.com/news/2026/8/13/more-than-135-million-people-in-europe-set-for-temperatures-over-35c?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 135 milhões de pessoas na Europa enfrentam temperaturas acima de 35°C. A Europa é o continente que mais aquece no mundo e, em alguns lugares, não está preparada para lidar com as condições quentes.", "titulo_pt": "Mais de 135 milhões de europeus enfrentam temperaturas superiores a 35C", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 102283, "titulo": "Europe braces for another temperature spike above 35°C", "url": "https://www.lemonde.fr/en/international/article/2026/08/13/europe-braces-for-another-temperature-spike-above-35-c_6756467_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T11:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Áreas habitadas por mais de 135 milhões de europeus estão prestes a serem afetadas pelas temperaturas mais altas. Cerca de três quintos dos residentes da Europa podem ver as temperaturas superarem os 30°C.", "titulo_pt": "Europa se prepara para nova onda de altas temperaturas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 101147, "titulo": "Efecto Niño: anticipan lluvias extraordinarias desde fin de agosto en las zonas más productivas de Argentina", "url": "https://www.clarin.com/rural/efecto-nino-anticipan-lluvias-extraordinarias-fin-agosto-zonas-productivas-argentina_0_DAHC980u1c.html", "fonte_id": "clarin", "data_pub": "2026-08-13T09:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Prevê-se um aumento nas chuvas de até 25% na primavera e até 33% no verão nas regiões mais produtivas da Argentina. Essas precipitações extraordinárias são esperadas a partir do final de agosto.", "titulo_pt": "Efeito Niño: previsão de chuvas excepcionais desde o fim de agosto em áreas produtivas da Argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 101016, "titulo": "Clima: El Niño e veranico trazem calorão e interrompem chuvas nesta 5ª", "url": "https://www.metropoles.com/brasil/clima-el-nino-e-veranico-trazem-calorao-e-interrompem-chuvas-nesta-5a", "fonte_id": "metropoles", "data_pub": "2026-08-13T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O El Niño e o veranico estão causando temperaturas acima da média e interrompendo as chuvas nesta quinta-feira. Há uma ausência quase total de precipitação.", "titulo_pt": "El Niño e veranico trazem calorão e interrompem chuvas nesta quinta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 101352, "titulo": "As drought grips France, tensions over drinking water mount: 'We are "titulo_pt": "Números recorde de raia-dourada em praias da califórnia causam ferimentos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 101387, "titulo": "Oil spill from tanker believed to be Russian reaches Oman's coastline, Muscat authorities say", "url": "http://www.euronews.com/2026/08/13/oil-spill-from-tanker-believed-to-be-russian-reaches-omans-coastline-muscat-authorities-sa", "fonte_id": "euronews", "data_pub": "2026-08-13T04:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vazamento de óleo de um navio-tanque, supostamente russo, atingiu as praias de Ras Madrakah na costa principal do Omã, a cerca de 200 quilômetros ao norte da Ilha Qabiliyah. De acordo com o Autoridade Ambiental do Omã, as praias também foram contaminadas.", "titulo_pt": "Vazamento de óleo russo atinge costa do omã", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 102101, "titulo": "Nearly 100 children detained as adults under UK-France migration deal", "url": "https://www.theguardian.com/uk-news/2026/aug/13/children-detained-adults-one-in-one-out-deal-uk-france-migration", "fonte_id": "guardian_world", "data_pub": "2026-08-13T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove décimos de um cento de crianças foram detidas como adultos sob o acordo entre Reino Unido e França para a migração. Segundo relatório, 94 (31%) dos casos envolvendo disputa de idade foram posteriormente confirmados como menores de idade.", "titulo_pt": "Quase 100 crianças detidas como adultos no acordo uk-frança sobre imigração", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 101948, "titulo": "Única filha de Fidel Castro reflete sobre o homem que ela nunca quis chamar de pai: 'Ele me deu um boneco vestido como ele'", "url": "https://www.bbc.com/portuguese/articles/c2k72yvd5wyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026- const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
