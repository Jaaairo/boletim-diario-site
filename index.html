<html lang="pt-BR">
<head>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "09/11/2026 15:21", "stats": {"noticias_novas": 932, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente do Senado, Davi Alcolumbre, cancelou um encontro com a bancada feminina, justificando a incompatibilidade de agendas. A Petrobras sugeriu ao governo um período sem multas durante a reforma tributária, enquanto o Supremo Tribunal Federal suspendeu processos sobre a proibição das apostas esportivas no Brasil. O governo Lula prorrogou o programa Gás do Povo até 2031, e a Procuradoria-Geral da República pediu o arquivamento do inquérito das fake news após mais de sete anos de tramitação. Além disso, a reforma ministerial do quarto mandato de Lula deve reforçar a base no Senado, e a Petrobras apresentou uma proposta para a reforma tributária com um período de transição sem multas. O ministro Fux também suspendeu o afastamento da juíza Gabriela Hardt, determinado pelo CNJ, e o governo prorrogou o calendário de pagamento do IPVA de 2027 em São Paulo.", "mundo": "A vitória de Lula nas eleições no Brasil inspirou a esquerda internacional, especialmente na América do Sul, onde a reeleição de Lula e a derrota das forças reacionárias foram vistos como um sinal positivo. Na França, o ministro das Relações Exteriores acusou as Forças Revolucionárias Islâmicas do Irã de realizar ataques cibernéticos em refrigeradores de supermercados, o que levou a investigações em Paris. Em outro desenvolvimento, o primeiro-ministro francês, Sébastien Lecornu, anunciou o aumento do salário mínimo para dezembro, em um esforço para aliviar os protestos causados pela crise de custos de vida, mas o plano foi rejeitado pelas principais sindicatos. Além disso, Javier Milei, presidente da Argentina, lidera em pesquisas para o segundo turno, enquanto o governo da Lituânia solicitou a Taipei que alterasse o nome de uma representação controversa antes do Dia Nacional de Pequim, em um esforço para restaurar relações diplomáticas congeladas.\n\nA França acusou o Irã de realizar um ataque cibernético em refrigeradores de supermercados, afetando mais de mil lojas, em um incidente ocorrido em 11 de setembro de 2026. Paralelamente, a Ucrânia intensificou sua campanha contra a Rússia, atingindo a segunda maior refinaria do país, o que levou a limitações de fornecimento de combustível. As negociações de paz entre a Rússia, Israel e a Ucrânia estão em andamento, com a quarta rodada dessas negociações ocorrendo na semana atual. Além disso, a Coreia do Sul se comprometeu com o não-proliferação de armas nucleares, mesmo com planos para submarinos nucleares, em um desenvolvimento que recebeu aprovação da Agência Internacional de Energia Atômica.", "economia": "A economia global enfrenta diversos desafios e realizações. A Taiwan prevê um crescimento econômico e as exportações registraram um recorde de 58,9%, totalizando US$96,76 bilhões. No entanto, a economia filipina está em declínio devido à guerra no Irã e ao mau tempo, pressionando o banco central e aumentando a pressão sobre o presidente Ferdinand Marcos Jr. A Southern Copper Corporation, apesar de ter faturado menos, é valorizada três vezes mais que a Vale, devido ao aumento do interesse no cobre como commodity. Em contraste, a bolsa de valores de Coreia do Sul, o Kosdaq, perdeu quase metade do seu valor desde seu pico em abril. A indústria de aviação também enfrenta pressões, com a British Airways alertando sobre a possibilidade de as taxas ambientais acabarem com a aviação europeia. Empresas como a Honda estão tomando medidas para se adaptar, investindo 3 bilhões de dólares em uma nova fábrica de veículos híbridos em Ohio. A Doosan expandirá a produção de lâmina de cobre laminado (CCL) na Coreia do Sul e na China. A CNI acionou o STF contra a atuação do MPT e da Justiça do Trabalho em normas regulatórias, enquanto a A5X formou uma parceria com a MSCI para lançar derivativos de índices internacionais no Brasil. A revisão tarifária de gasodutos gera ameaças de judicialização e corte de investimentos, e a NTS ameaça ir à Justiça contra a ANP para reverter o processo.", "tecnologia": "O CEO da Nvidia, Jensen Huang, enfrenta um escândalo de espionagem que abalou a empresa e a corrida global pela liderança em inteligência artificial (IA). Huang admitiu um affair com uma mulher suspeita de ser espiã chinesa, o que fez com que as ações da Nvidia caíssem. Este caso tem implicações significativas para a empresa e para a indústria de IA, levantando preocupações sobre a estabilidade da empresa e do ecossistema de IA. Além disso, a Nvidia está investigando uma suposta relação entre Huang e uma empresa chinesa que vendeu propostas de chips de IA para investidores. A empresa está considerando contratar consultores de relações públicas para lidar com a crise. Em um desenvolvimento relacionado, a startup chinesa DeepSeek está expandindo seu ferramental Harness, que já atinge 1,54 milhão de usuários diariamente, com o objetivo de competir com ferramentas como Claude Code e Codex.", "ciencia": "A NASA anunciou o lançamento do desafio estudiantil Base Lunar, com um prêmio de um milhão de dólares, durante um evento chamado MAX POWER no Complexo de Visitantes do Centro Espacial Kennedy, na Flórida. Este evento marcou a conclusão bem-sucedida de uma missão da agência espacial e celebrou os exploradores, inovadores e visionários que estão avançando na próxima era da exploração espacial. Paralelamente, pesquisas indicam que, mesmo com uma redução na precipitação, as cidades podem enfrentar inundações cada vez mais severas devido ao aumento da intensidade das chuvas. Outras descobertas científicas incluem o uso de semaglutida, ingrediente ativo do Ozempic, para ajudar na reversão da doença renal crônica, e a descoberta de uma planta gigante na Amazônia, publicada inicialmente no Instagram. Além disso, a terapia de células-mãe chilena explorada para reparar a cartilagem danificada no tornozelo de pacientes é uma promessa para acelerar a recuperação dos pacientes. Estes avanços e descobertas refletem a diversidade dos campos científicos atualmente em desenvolvimento.", "cultura": "O Papa Francisco realizou uma missa histórica no Monumento aos Espanhóis em Palermo, na Espanha, com um público recorde de 2,5 milhões de pessoas. Este foi o maior evento da sua visita de 12 dias à América do Sul e o mais significativo desde que assumiu a liderança da Igreja Católica há 18 meses. A missa foi projetada pelo sastre Tomás Valentín Gómez, de Punta Arenas, com trajes litúrgicos que incluíam pedras de ónix extraídas na província de Punta Arenas. A cerimônia foi transmitida por várias emissoras de TV, alcançando um rating de 28,5 pontos durante o pico na segunda emissora nacional. Em outro evento cultural, a Netflix estreia na próxima quarta-feira (11) o documentário 'Suzane von Richthofen: O que o Tempo Não Apaga', que retrata a vida atual da condenada pelo assassinato de seus pais em 2002.", "sociedade": "Em Cracóvia, na Polônia, um homem de 24 anos matou seis pessoas em uma praça, causando um massacre que abalou a sensação de segurança no país. O incidente, que resultou em seis mortos e 15 feridos, ocorreu durante um confronto com a polícia. Na Polônia, apesar do medo gerado, a cidade turística planeja manter suas atividades abertas. Em seguida, há quase oito anos, um psiquiatra foi morto em Seul, na Coreia do Sul, levando à aprovação de uma lei que aumentou as penas para agressões a profissionais de saúde. No entanto, um ataque recente em um hospital da capital fez os médicos questionarem a segurança inadequada ainda existente nos hospitais do país. Além disso, um levantamento do Sindicato dos Policiais Penais revelou que a unidade de CDP de Pinheiros, em São Paulo, estava superlotada com 1.722 presos, enquanto sua capacidade é de 793, após uma tentativa de fuga na unidade.", "meio_ambiente": "A COP31, a conferência das Nações Unidas sobre mudança climática realizada no Brasil, começou com o alerta de que 2026 pode ser o ano mais quente da história, conforme informado pela BBC Brasil. Durante o evento, líderes pediram para que o mundo acelerasse as ações contra o aquecimento global, como mencionado pelo Guardian World. A Noruega investiu R$ 350 milhões no Fundo Amazônia, conforme relatado pela Exame, enquanto o Brasil enfrenta perdas crescentes no agronegócio devido a eventos climáticos extremos, informado pela Folha de S. Paulo. O clima volátil também afetou regiões como Gaza, onde um temporal resultou em cinco mortes e deixou 70.000 pessoas sem abrigo, conforme noticiado pelo Euronews. O clima extremo também atingiu o Brasil, com chuvas e temporais afetando o Sul, Centro-Oeste e Sudeste, conforme noticiado pelo Metrópoles. Além disso, o Mecanismo Belém-Antalya, esperado para ser lançado durante a COP31, visa promover a transição justa para países e comunidades afetadas pelas mudanças climáticas, conforme explicado pelo Carbon Brief.", "direitos_humanos": "O jornal independente russo 'Novaya Gazeta', fundado em 1993, encerrou suas atividades após enfrentar pressão do Kremlin, registrando o assassinato de seis de seus funcionários ao longo dos últimos anos. Em Senegal, uma organização de direitos humanos pediu ação do governo após um naufrágio fatal que resultou em milhares de mortes de pessoas tentando chegar às ilhas Canárias da Espanha, partindo da África Ocidental. Essa situação reflete os perigos enfrentados pelos migrantes e refugiados ao longo do caminho marítimo do Mediterrâneo, onde a organização SOS Méditerranée relatou que, em 2022, mais de 10.000 pessoas morreram ou desapareceram tentando chegar à Europa. Em Creta, Grécia, ao menos 21 migrantes e refugiados morreram tentando chegar à ilha, enquanto a guarda costeira grega relatou a resolução de várias operações que salvaram mais de 100 pessoas na costa sul de Creta. Na França, três policiais enfrentarão julgamento por terem batido em Michel Zecler, um produtor musical negro, durante a pandemia de coronavírus, em um caso raro que chegou ao tribunal, ocorrendo em um momento de tensões aumentadas.}"}, "resumo_do_dia": {"politica_nacional": [{"id": 252595, "titulo": "Café de Alcolumbre com senadoras eleitas é cancelado", "url": "https://www.metropoles.com/colunas/grande-angular/cafe-de-alcolumbre-com-senadoras-eleitas-e-cancelado", "fonte_id": "metropoles", "data_pub": "2026-11-09T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Café de Alcolumbre, um evento que reuniria o presidente do Senado e a líder da Bancada Feminina com as senadoras da atual legislatura e as eleitas, foi cancelado nesta terça-feira.", "titulo_pt": "Café de Alcolumbre com senadoras eleitas é cancelado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 252448, "titulo": "Petrobras pede ao governo período sem multas na reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/petrobras-pede-ao-governo-periodo-sem-multas-na-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente da Petrobras, Magda Chambriard, sugeriu ao governo o estabelecimento de um período de transição sem multas durante a reforma tributária, para ajudar as empresas a se adaptarem às novas regras. A proposta já foi apresentada ao Ministério da Fazenda.", "titulo_pt": "Petrobras pede ao governo período sem multas na reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252510, "titulo": "Relator apresenta diretrizes da proposta de voto distrital misto", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/relator-do-distrital-misto-propoe-voto-unico-para-distrital-e-lista", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-09T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Domingos Neto apresentou as diretrizes do relatório que sugere a mudança do sistema de votação proporcional para um sistema de distrital misto no Brasil. O objetivo é votar a proposta ainda neste ano, com a implementação gradual em 2030, 2032 e 2034 para eleições municipais e gerais, respectivamente.", "titulo_pt": "Relator apresenta diretrizes para proposta de voto distrital misto no Brasil", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 252650, "titulo": "Fux suspende processos contra proibição das bets no Brasil", "url": "https://www.dw.com/pt-br/fux-suspende-processos-contra-proibição-das-bets-no-brasil/a-79903577?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-09T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux suspendeu os processos que questionam a constitucionalidade da proibição das aplicações de apostas esportivas no Brasil. A PGR ressaltou que decisões antecipadas poderiam causar insegurança jurídica.", "titulo_pt": "Fux suspende processos sobre proibição de apostas esportivas no Brasil", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 252426, "titulo": "Alcolumbre tem encontro com bancada feminina cancelado por falta de quórum", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/na-disputa-a-reeleicao-alcolumbre-tem-encontro-com-bancada-feminina-cancelado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encontro entre o presidente do Senado, Davi Alcolumbre, e a bancada feminina foi cancelado devido a uma incompatibilidade de agendas. A líder da bancada, Professora Dorinha, informou sobre o cancelamento em uma mensagem às senadoras.", "titulo_pt": "Encontro de alcolumbre com bancada feminina cancelado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 252427, "titulo": "Reforma ministerial de Lula 4 deve reforçar Senado contra bolsonaristas e expor racha no PT", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/reforma-ministerial-de-lula-4-deve-reforcar-senado-contra-bolsonaristas-e-expor-racha-no-pt.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T16:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma ministerial do quarto mandato do presidente Lula deve reforçar a base no Senado, reduzindo a presença de senadores, e abrir espaço para aliados sem mandato. A articulação também deve antecipar a discussão sobre o futuro do PT.", "titulo_pt": "Reforma ministerial de Lula 4 deve reforçar Senado e expor racha no PT", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 252428, "titulo": "PGR pede fim do inquérito das fake news depois de mais de 7 anos de tramitação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pgr-pede-fim-do-inquerito-das-fake-news-depois-de-mais-de-7-anos-de-tramitacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República pediu o arquivamento do inquérito das fake news, após mais de 7 anos de tramitação. O presidente do STF, Edson Fachin, pode encerrar o processo, marcando o fim de um dos capítulos mais controversos da história recente da corte.", "titulo_pt": "PGR pede arquivamento do inquérito das fake news após 7 anos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 252507, "titulo": "Confira o calendário de pagamento do IPVA de 2027 em São Paulo", "url": "https://agenciabrasil.ebc.com.br/geral/noticia/2026-11/confira-o-calendario-de-pagamento-do-ipva-de-2027-em-sao-paulo", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-09T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Governo do Estado de São Paulo divulgou o calendário de pagamento do IPVA de 2027, permitindo que os contribuintes quitassem o imposto em cota única com desconto ou optassem pelo parcelamento em até cinco vezes. Os vencimentos da primeira cota começam em 11 de janeiro de 2027.", "titulo_pt": "Confira o calendário de pagamento do IPVA de 2027 em São Paulo", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 252455, "titulo": "Decisão de Fux bloqueou ações de 29 bets, incluindo Blaze, Stake e EstrelaBet", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/decisao-de-fux-bloqueou-acoes-de-29-bets-incluindo-blaze-stake-e-estrelabet.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T15:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Luiz Fux bloqueou nesta segunda-feira (9) as ações de 29 casas de apostas, incluindo Blaze, Stake e EstrelaBet, para voltarem a atuar.", "titulo_pt": "Decisão de Fux bloqueou ações de 29 bets, incluindo Blaze, Stake e EstrelaBet", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252456, "titulo": "Imposto de importação de pneus de passeio sobe para 30% após pedido da indústria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/imposto-de-importacao-de-pneus-de-passeio-sobre-para-30-apos-pedido-da-industria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alíquota do imposto de importação sobre pneus de passeio no Brasil foi aumentada para 30% por 12 meses, conforme decisão do Comitê-Executivo de Gestão da Camex. Este aumento foi solicitado pela ANIP (Associação Nacional da Indústria de Pneumáticos).", "titulo_pt": "Imposto de importação de pneus de passeio aumenta para 30% após pedido da indústria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252471, "titulo": "PGR encaminha a Fachin parecer pelo arquivamento do inquérito das fake news", "url": "https://g1.globo.com/politica/noticia/2026/11/09/pgr-encaminha-a-fachin-parecer-pelo-arquivamento-do-inquerito-das-fake-news.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-09T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República encaminhou ao presidente do Supremo Tribunal Federal, Edson Fachin, um parecer favorável ao arquivamento do inquérito das fake news. O documento, assinado pelo procurador-geral Paulo Gonet, se refere ao inquérito principal, com número 4.781, e afirma que o objeto da investigação se esgotou.", "titulo_pt": "PGR encaminha parecer pelo arquivamento do inquérito das fake news a Fachin", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 252508, "titulo": "Gás do Povo: governo prorroga vigência do auxílio até 2031", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/gas-do-povo-governo-prorroga-vigencia-do-programa-ate-2031", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-09T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal prorrogou a vigência do auxílio Gás do Povo até 19 de novembro de 2031, garantindo o programa para cerca de 15 milhões de famílias que atualmente recebem o benefício. Atualmente, o auxílio atende 45 milhões de pessoas.", "titulo_pt": "Prorrogação do auxílio gás do Povo até 2031", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 252460, "titulo": "Ministério do Esporte diz apoiar MP que proibiu as bets no Brasil: 'proteção das famílias'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/ministerio-do-esporte-diz-apoiar-mp-que-proibiu-as-bets-no-brasil-protecao-das-familias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Esporte afirmou apoiar a medida provisória que proibiu as apostas esportivas no Brasil. A declaração foi dada em resposta a uma solicitação da coluna, após a ANJL ter questionado a falta de consulta formal do Planalto ao ministério antes da edição da MP.", "titulo_pt": "Ministério do Esporte apoia MP que proibiu apostas no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252429, "titulo": "Lula viaja sem desenhar a própria transição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/11/lula-viaja-sem-desenhar-a-propria-transicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T14:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da República fez um discurso à nação no domingo sem novidades em relação à campanha. Em seguida, embarcou em uma série de viagens internacionais que devem durar até meados de dezembro.", "titulo_pt": "Lula viaja sem detalhar a transição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 252463, "titulo": "Governo Lula prorroga vigência do Gás do Povo até 2031", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-lula-prorroga-vigencia-do-gas-do-povo-ate-2031.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula prorrogou o programa Gás do Povo até 2031, que oferece gás de cozinha gratuitamente. A decisão foi publicada no DOU nesta segunda-feira (9).", "titulo_pt": "Governo Lula prorroga vigência do Gás do Povo até 2031", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252640, "titulo": "Fux suspende condenação de Hardt no CNJ e juíza pode voltar a atuar após licença médica", "url": "https://www.jota.info/stf/do-supremo/fux-suspende-condenacao-de-hardt-no-cnj-e-juiza-pode-voltar-a-atuar-apos-licenca-medica", "fonte_id": "jota", "data_pub": "2026-11-09T14:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux suspendeu a condenação de Hardt no CNJ, após constatar indícios de que o processo disciplinar foi aberto após o prazo de prescrição. A juíza pode voltar a atuar após sua licença médica.", "titulo_pt": "Fux suspende condenação de Hardt no CNJ e juíza pode retornar após licença", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 252649, "titulo": "Cerca de 400 mil russos já morreram na Ucrânia, indicam dados hackeados", "url": "https://www.dw.com/pt-br/cerca-de-400-mil-russos-já-morreram-na-ucrânia-indicam-dados-hackeados/a-79903447?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-09T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hackers afirmam ter acesso a centenas de milhares de certidões de óbito registradas pelo regime russo, indicando que cerca de 400 mil russos já morreram na Ucrânia. O Kremlin tem evitado divulgar dados sobre baixas no conflito, que se arrasta há quase cinco anos.", "titulo_pt": "Aproximadamente 400 mil russos já morreram na Ucrânia, indicam dados hackeados", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 252813, "titulo": "Arenas asegura que Rabat decidió desde el jueves “parar cualquier decreto” hasta conocer avances del proyecto que busca derogar el beneficio", "url": "https://www.latercera.com/politica/noticia/arenas-asegura-que-rabat-decidio-desde-el-jueves-parar-cualquier-decreto-hasta-conocer-avances-del-proyecto-que-busca-derogar-el-beneficio/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro Rabat decidiu parar a implementação de decretos até conhecer os avanços do projeto que visa revogar o benefício. O porta-voz afirmou que o ministro é adulto o suficiente para suportar a pressão de parlamentares oposicionistas que consultaram a decisão com ele.", "titulo_pt": "Arenas garante que Rabat parou a implementação de decretos até conhecer o projeto de revogação do benefício", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 253025, "titulo": "Israeli tourists spark outrage over video pushing tour guide into sea", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/9/israeli-tourists-spark-outrage-over-video-pushing-tour-guide-into-sea?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vídeo mostrando um turista israelense empurrando um guia turístico sri-lanquês da embarcação gerou indignação. A situação levantou preocupações sobre o tratamento dado aos trabalhadores de turismo locais por parte de visitantes estrangeiros.", "titulo_pt": "Turista israelense empurra guia turístico sri-lanquês do barco, causando indignação", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 252994, "titulo": "Latest news bulletin | November 9th, 2026 – Evening", "url": "https://www.euronews.com/video/2026/11/09/latest-news-bulletin-november-9th-2026-evening", "fonte_id": "euronews", "data_pub": "2026-11-09T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatados os principais eventos da Europa e do mundo no dia 9 de novembro de 2026, abrangendo seções de notícias como Mundo, Negócios, Entretenimento, Política, Cultura e Viagem.", "titulo_pt": "Boletim de notícias mais importantes | 9 de novembro de 2026 – noite", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 252840, "titulo": "Labour’s Brexit red lines ready for ‘dignified retirement’, says their co-author", "url": "https://www.theguardian.com/politics/2026/nov/09/labour-mp-brexit-red-lines-dignified-retirement", "fonte_id": "guardian_world", "data_pub": "2026-11-09T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos autores das linhas vermelhas do Brexit de Keir Starmer sugere que Andy Burnham deve abandonar essas promessas na próxima eleição, alegando que uma relação mais próxima com a UE protegeria o Reino Unido de ameaças globais. Isso representa uma voz mais favorável a um rápido e mais próximo relacionamento com a UE de um importante membro da administração de Starmer.", "titulo_pt": "Autor das linhas vermelhas do Brexit sugere que andy burnham deve abandonar as promessas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 253059, "titulo": "EU Offers Black Sea Countries Support to Counter Security Threats", "url": "https://balkaninsight.com/2026/11/09/eu-offers-black-sea-countries-support-to-counter-security-threats/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-09T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissária Europeia para Assuntos Externos anunciou a atribuição de 60 milhões de euros para auxiliar Romênia, Bulgária e Turquia a monitorar e responder aos crescentes efeitos da guerra da Rússia na Ucrânia.", "titulo_pt": "Ue promete suporte financeiro para combater ameaças de segurança na ásia menor", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 252923, "titulo": "French PM brings forward hike in minimum wage to calm protesters", "url": "https://www.france24.com/en/video/20261109-french-pm-brings-forward-hike-in-minimum-wage-to-calm-protesters", "fonte_id": "france24", "data_pub": "2026-11-09T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro da França, Sebastien Lecornu, antecipou o aumento do salário mínimo da França para dezembro, a partir do mês que vem, em vez de janeiro, em um esforço para aliviar protestos causados por uma crise de custos de vida. Entretanto, as principais sindicatos rejeitaram a proposta, considerando-a insuficiente.", "titulo_pt": "Primeiro-ministro francês antecipa aumento do salário mínimo para acalmar protestos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 253021, "titulo": "Russia rations petrol after new Ukrainian strikes on refineries", "url": "https://www.ft.com/content/ae06452b-3447-4fee-bd94-355cd324d1c5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T16:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rosneft, empresa estatal russa, limitou as vendas de combustível para 30 litros por carro nas cidades e 50 litros nas estradas. Isso ocorre após novos ataques ucranianos a refinarias russas.", "titulo_pt": "Rússia implementa racionamento de combustível após novos ataques ucranianos a refinarias", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 253028, "titulo": "Israel’s Shin Bet finds no evidence of foreign election meddling: Report", "url": "https://www.aljazeera.com/news/2026/11/9/israels-shin-bet-finds-no-evidence-of-foreign-election-meddling-report?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com fontes da law enforcement, Netanyahu e Zini não âmicas do Irã de terem realizado cyber-ataques inéditos em refrigeradores de supermercados no país em outubro. O ataque cibernético de há um mês fez com que os refrigeradores de centenas de supermercados na França aumentassem de temperatura.", "artigos": [{"id": 252446, "titulo": "França acusa o Irã de hackear refrigeradores de supermercados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/franca-acusa-o-ira-de-hackear-refrigeradores-de-supermercados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A França acusou o Irã de estar por trás de ataques cibernéticos que afetaram os refrigeradores e freezers de supermercados. O incidente ocorreu em 11 de setembro de 2026.", "titulo_pt": "França acusa o Irã de hackear refrigeradores de supermercados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252839, "titulo": "France blames Iran’s Revolutionary Guards for cyber-attacks on supermarket fridges", "url": "https://www.theguardian.com/world/2026/nov/09/france-blames-irans-revolutionary-guards-for-cyber-attacks-on-supermarket-fridges", "fonte_id": "guardian_world", "data_pub": "2026-11-09T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério das Relações Exteriores francês acusa as Forças Revolucionárias Islâmicas do Irã de terem realizado cyber-ataques inéditos em refrigeradores de supermercados no país em outubro. A França promete impor sanções europeias ao Teerã por esse incidente.", "titulo_pt": "França culpa guardas revolucionários do Irã por ataques cibernéticos em refrigeradores de supermercados", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 252671, "titulo": "França acusa Irã pelos ataques hacker em refrigeradores de supermercados", "url": "https://www.bbc.com/portuguese/articles/c893z3ldzpz3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-09T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": 252446, "texto_pt": "O ataque cibernético de há um mês fez com que os refrigeradores de centenas de supermercados na França aumentassem de temperatura. A França acusa o Irã por este incidente.", "titulo_pt": "França acusa Irã por ataques hacker em refrigeradores de supermercados", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 252962, "titulo": "France accuses Iran's Guards of cyberattacks on supermarket fridges", "url": "https://www.lemonde.fr/en/france/article/2026/11/09/france-accuses-iran-s-guards-of-cyberattacks-on-supermarket-fridges_6776101_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T16:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores da França, Jean-Noël Barrot, acusou as Forças Revolucionárias Islâmicas de terem realizado ataques cibernéticos em refrigeradores de supermercados. Os procuradores parisienses abriram uma investigação sobre o caso.", "titulo_pt": "França acusa guardas revolucionários islâmicos do Irã de ataques cibernéticos em refrigeradores de supermercados", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 253027, "titulo": "France accuses Iran of cyberattack on supermarket fridges", "url": "https://www.aljazeera.com/news/2026/11/9/france-accuses-iran-of-cyberattack-on-european-fridges?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T16:33:00Z", "idioma": "en", "provavel_duplicata_de": 252962, "texto_pt": "A França acusa a Irã de realizar um ataque cibernético em refrigeradores de supermercados, afetando mais de mil lojas. Segundo Paris, uma unidade cibernética vinculada ao Guarda Revolucionário iraniano seria responsável pelo hack.", "titulo_pt": "França acusa Irã de cyberataque em refrigeradores de supermercados", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}]}], "economia": [{"id" l de Jensen Huang?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 253133, "titulo": "Nancy Pelosi’s replacement is ready to regulate AI", "url": "https://www.technologyreview.com/2026/11/09/1148182/nancy-pelosis-replacement-is-ready-to-regulate-ai/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-09T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Scott Wiener, senador da Califórnia, autorizou leis para limitar os riscos da IA avançada. Agora, após ganhar uma eleição para o antigo cargo de Speaker Nancy Pelosi, ele pode desempenhar um papel importante na formulação da política federal de IA.", "titulo_pt": "Substituto de nancy Pelosi está pronto para regular a IA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 253017, "titulo": "Can Jensen Huang survive as Nvidia’s CEO after spy scandal?", "url": "https://www.ft.com/content/0b20d24a-580a-41df-a5f3-7f7dba4f552f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O co-fundador da Nvidia não tem um sucessor evidente para assumir o cargo de CEO da segunda maior empresa do setor de chips no mundo.", "titulo_pt": "Jensen Huang pode sobreviver como CEO da Nvidia após escândalo de espionagem?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 253080, "titulo": "Japan’s search for a better public trash bin — and why robots may help", "url": "https://www.japantimes.co.jp/life/2026/11/10/style-design/robot-smart-garbage-bins/", "fonte_id": "japan_times", "data_pub": "2026-11-09T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em virtude da escassez de lixeiras públicas, o Japão está buscando lixeiras inteligentes e robôs autônomos para facilitar a disposição do lixo.", "titulo_pt": "Japão procura por melhores lixeiras públicas — e por que robôs podem ajudar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 252651, "titulo": "Como a IA pode reduzir desempenho de adolescentes na escola", "url": "https://www.dw.com/pt-br/como-a-ia-pode-reduzir-desempenho-de-adolescentes-na-escola/a-79898284?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-09T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas indicam que o uso inadequado da tecnologia pode prejudicar o pensamento crítico dos adolescentes e resultar em piores notas. Professores estão enfrentando este desafio nas salas de aula.", "titulo_pt": "Como a IA pode reduzir o desempenho escolar dos adolescentes", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 252449, "titulo": "Quando o chefe ao telefone não é real: como mais de US$ 129 milhões foram roubados com o uso de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/quando-o-chefe-ao-telefone-nao-e-real-como-mais-de-us-129-milhoes-foram-roubados-com-o-uso-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um contador de uma rede hospitalar no Missouri atendeu um telefonema em que a voz do CEO foi reconhecida. Mais de US$ 129 milhões foram roubados usando inteligência artificial.", "titulo_pt": "Quando o chefe ao telefone não é real: como mais de US$ 129 milhões foram roubados com o uso de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252450, "titulo": "Nvidia alerta que 'relações pessoais', como do caso de Huang, podem gerar conflito de interesses", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/nvidia-alerta-que-relacoes-pessoais-como-do-caso-de-huang-podem-gerar-conflito-de-interesses.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, admitiu ter mantido um relacionamento amoroso com uma empresária chinesa que, segundo agências de inteligência dos EUA, era espiã do governo chinês. O governo chinês negou a acusação.", "titulo_pt": "Nvidia alerta: relações pessoais, como no caso de Huang, podem gerar conflito de interesses", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252865, "titulo": "Two cities just voted to get Flock cameras out. It’s only the beginning.", "url": "https://www.vox.com/future-perfect/509941/midterms-vote-flock-privacy-surveillance", "fonte_id": "vox", "data_pub": "2026-11-09T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidades nos Estados Unidos estão cancelando contratos com a Flock Safety, empresa que oferece câmeras de vigilância com inteligência artificial. A decisão reflete preocupações públicas sobre privacidade, vigilância e uso abusivo da tecnologia pela polícia.", "titulo_pt": "Dois municípios votaram para remover câmeras Flock. É apenas o começo.", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 253173, "titulo": "Trump’s 60 Minutes interview touched on AI safety, threat to arrest an AI exec", "url": "https://www.theverge.com/ai-artificial-intelligence/1029802/trump-60-minutes-ai", "fonte_id": "the_verge", "data_pub": "2026-11-09T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump comentou sobre a segurança de modelos de inteligência artificial durante sua entrevista ao 60 Minutes, afirmando que o risco não é tão real quanto os executivos de IA o descrevem e que o risco pode ser gerenciado. Ele mencionou que o Departamento de Justiça está lidando com essa questão.", "titulo_pt": "Entrevista do 60 Minutes: trump sobre segurança de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 252653, "titulo": "Como o caso do CEO da Nvidia com suposta espiã chinesa impacta o setor de IA", "url": "https://www.dw.com/pt-br/como-o-caso-do-ceo-da-nvidia-com-suposta-espiã-chinesa-impacta-o-setor-de-ia/a-79900322?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-09T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, admitiu um relacionamento com uma mulher suspeita de espionar para a China. Este caso pode ter implicações significativas para a empresa e para a corrida global por tecnologia de inteligência artificial.", "titulo_pt": "Como o caso do CEO da Nvidia com suposta espiã chinesa impacta o setor de IA", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 253174, "titulo": "Disney and Adobe are building generative AI tools together", "url": "https://www.theverge.com/tech/1029773/disney-adobe-generative-ai-partnership", "fonte_id": "the_verge", "data_pub": "2026-11-09T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Walt Disney Company e a Adobe estão desenvolvendo modelos de inteligência artificial gerativa sob supervisão artística para apoiar o pipeline de produção da Disney. Esta parceria de longo prazo foi anunciada durante a conferência MAX da Adobe.", "titulo_pt": "Disney e Adobe desenvolvem ferramentas de IA gerativa juntos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 253016, "titulo": "Alleged Chinese spy linked to Nvidia chief pitched AI chip deals to investors", "url": "https://www.ft.com/content/5d8c1e1d-6ce0-4eb4-9f5c-722fa5c4841d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Huang se apresentou como tendo acesso a GPUs da Nvidia e uma conexão com a Alibaba. Ela tentou vender propostas de chips de inteligência artificial para investidores.", "titulo_pt": "Suspeita de espiã chinesa ligada ao chefe da Nvidia tentou vender negócios de chips de IA para investidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 253156, "titulo": "Jensen Huang Hired a PR Firm Known for Handling Sex Scandals Last Year", "url": "https://www.wired.com/story/nvidia-ceo-jensen-huang-hired-a-pr-firm-known-for-handling-sex-scandals-last-year/", "fonte_id": "wired", "data_pub": "2026-11-09T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, contratou consultores da Heller, conhecidos por lidar com escândalos sexuais, no início de outubro de 2025, aproximadamente no mesmo período em que ele foi inicialmente associado a um suposto espião chinês.", "titulo_pt": "Jensen Huang contratou empresa de relações públicas que lidou com escândalos sexuais no passado", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 253118, "titulo": "Singapore firm Megaspeed back in the spotlight over Nvidia scandal, China chip allegations", "url": "https://www.scmp.com/week-asia/politics/article/3373840/singapore-firm-megaspeed-back-spotlight-over-nvidia-scandal-china-chip-allegations", "fonte_id": "scmp", "data_pub": "2026-11-09T14:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa desconhecida registrada em Singapura está no centro de uma escândalo amoroso envolvendo o chefe da Nvidia, Jensen Huang, e acusações americanas de espionagem chinesa. Após Huang admitir um caso extraconjugal, as investigações se voltaram para a Megaspeed, que é um importante cliente da Nvidia e cujo ex-executivo foi identificado como a mulher envolvida no relacionamento suspeito de ligação com a espionagem chinesa.", "titulo_pt": "Empresa singapurense Megaspeed volta ao centro de escândalos envolvendo Nvidia e acusações de espionagem chinesa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 253287, "titulo": "A true paleo diet would include a lot more insects", "url": "https://www.newscientist.com/article/2598048-a-true-paleo-diet-would-include-a-lot-more-insects/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A dieta paleo tradicional incluiria uma quantidade significativa de insetos, de acordo com o colunista Michael Marshall. Geralmente, a conversa sobre alimentos pré-históricos se concentra em carne ou grãos, mas pesquisas sugerem que os humanos pré-históricos podem ter comido mais insetos do que se pensava anteriormente.", "titulo_pt": "Uma dieta verdadeiramente paleo incluiria muito mais insetos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 253292, "titulo": "Starfish Space loses contact with 1st 'Otter' servicing spacecraft, ending NASA tech-demo mission", "url": "https://www.space.com/space-exploration/launches-spacecraft/starfish-space-loses-contact-with-1st-otter-servicing-spacecraft-ending-nasa-tech-demo-mission", "fonte_id": "space_com", "data_pub": "2026-11-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro foguete Otter da Starfish Space teve um problema em órbita recentemente, encerrando sua missão demonstrativa de tecnologia para a NASA.", "titulo_pt": "Starfish Space perde contato com primeiro foguete 'Otter' de manutenção, interrompendo demonstração tecnológica da NASA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 253180, "titulo": "STAT+: Hospitals win the midterms, and Chopping Very Strategically", "url": "https://www.statnews.com/2026/11/09/midterm-elections-good-news-for-hospitals-cvs-breakup-explained/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A notícia explica a separação da CVS e menciona que as vitórias eleitorais dos democratas beneficiam os hospitais.", "titulo_pt": "Hospitais ganham nas eleições e cvs se divide", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 253187, "titulo": "Less rain, more intense storms: Climate change strengthens extreme urban floods", "url": "https://phys.org/news/2026-11-intense-storms-climate-extreme-urban.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa indica que, mesmo com uma redução na precipitação, as cidades podem enfrentar inundações cada vez mais severas devido ao aumento da intensidade das chuvas. O estudo, liderado por um estudante de doutorado, foi conduzido com a supervisão de um professor da Universidade Hebraica de Jerusalém.", "titulo_pt": "Menos chuva, maiores tempestades: mudança climática fortalece inundações urbanas extremas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253188, "titulo": "Two nearby rocky worlds could offer alien astronomers views of planets appearing to reverse course", "url": "https://phys.org/news/2026-11-nearby-rocky-worlds-alien-astronomers.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor da Sejong University, Professor Woong-bae Zee, publicou um artigo astronômico que aborda a possibilidade de planetas parecidos com os da Terra serem observados por inteligências alienígenas. O artigo sugere que tais planetas poderiam oferecer uma visão de planetas parecidos com os de nosso sistema solar, mas com movimentos aparentemente reversos.", "titulo_pt": "Dois mundos rochosos próximos poderiam oferecer vistas de planetas se movendo em sentido contrário para alienígenas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253234, "titulo": "La NASA destina un millón de dólares al reto estudiantil Base Lunar", "url": "https://www.nasa.gov/news-release/la-nasa-destina-un-millon-de-dolares-al-reto-estudiantil-base-lunar/", "fonte_id": "nasa_news", "data_pub": "2026-11-09T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 8 de novembro de 2026, a NASA lançou o desafio estudiantil Base Lunar, com um prêmio de um milhão de dólares, durante um evento chamado MAX POWER no Complexo de Visitantes do Centro Espacial Kennedy, em Florida.", "titulo_pt": "NASA destina um milhão de dólares ao desafio estudiantil Base Lunar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 252682, "titulo": "Os pequenos descansos que ajudam cérebro a aprender coisas novas", "url": "https://www.bbc.com/portuguese/articles/c3vgxxdlzkkqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-09T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cérebro necessita de pausas para consolidar o conhecimento recentemente adquirido e transformá-lo em memória duradoura.", "titulo_pt": "Pequenos descansos ajudam o cérebro a aprender coisas novas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 253189, "titulo": "The fastest levitated spinning magnet ever made might help physicists search for dark matter", "url": "https://phys.org/news/2026-11-fastest-levitated-magnet-physicists-dark.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Magnetos levitados minúsculos podem ser úteis para detectar forças e campos magnéticos extremamente fracos e servem como sensores quânticos de baixo ruído e ferramentas de medição precisa. A combinação de levitação com temperaturas extremamente baixas reduz ainda mais o movimento indesejado que pode dificultar a detecção de sinais fracos.", "titulo_pt": "O magneto levitado mais rápido já criado pode auxiliar na busca por matéria escura", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253190, "titulo": "Satellite monitoring of the world's oceans is being restricted by legal barriers, study suggests", "url": "https://phys.org/news/2026-11-satellite-world-oceans-restricted-legal.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos sugerem que barreiras legais estão limitando a monitoração de satélite das áreas marinhas do mundo. A tecnologia de satélite pode rastrear navios em todo o oceano e detectar pesca industrial em áreas protegidas marítimas, mas regulamentos podem estar impedindo autoridades globais de usar essas detecções para efetivar a fiscalização.", "titulo_pt": "Monitoramento de satélite das áreas marinhas está sendo limitado por barreiras legais, sugere estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253235, "titulo": "Astronauts Across Generations Share the Stage", "url": "https://www.nasa.gov/image-article/astronauts-across-generations-share-the-stage/", "fonte_id": "nasa_news", "data_pub": "2026-11-09T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 6 de novembro de 2026, a Purpose Entertainment realizou a Gala de Celebração Artemis no Complexo Visitação da NASA em Merritt Island, Flórida. O evento marcou a conclusão bem-sucedida de uma missão da agência espacial e celebrou os exploradores, inovadores e visionários que estão avançando na próxima era da exploração espacial.", "titulo_pt": "Astronautas de gerações diferentes compartilham o palco", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 253181, "titulo": "STAT+: Heart association meeting’s readout is trending ‘neutral’", "url": "https://www.statnews.com/2026/11/09/aha-2026-news-neutral-clinical-trials-lessons-learned/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tema das reuniões da Associação Americana do Coração foi sobre resultados 'neutros'. No entanto, ainda não há intenção de abandonar a pesquisa sobre inflamação ou a redução do Lp(a).", "titulo_pt": "Resultado das reuniões da aha é 'neutro', mas pesquisa sobre inflamação e lp(a) continua", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 253236, "titulo": "MAX POWER: NASA’s Inaugural Aerospace Expo Ignites America’s Future", "url": "https://www.nasa.gov/general/max-power-nasas-inaugural-aerospace-expo-ignites-americas-future/", "fonte_id": "nasa_news", "data_pub": "2026-11-09T16:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas se reuniram durante vários dias no início de novembro para participar do MAX POWER, a primeira exposição da NASA sobre superioridade americana no espaço, naeronáutica e tecnologia, realizada no Centro Espacial Kennedy em Florida. O evento de vários dias, familiar e familiar, celebrou o 250º aniversário da nação e serviu como o ponto alto da Turnê de Inspiração da agência.", "titulo_pt": "Maior potência: a primeira exposição espacial da nasa celebra o 250º aniversário dos estados unidos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 253237, "titulo": "NASA’s ESCAPADE Completes Powered Earth Flybys, Now En Route to Mars", "url": "https://science.nasa.gov/science-research/heliophysics/nasas-escapade-completes-powered-earth-flybys-now-en-route-to-mars/", "fonte_id": "nasa_news", "data_pub": "2026-11-09T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os dois satélites ESCAPADE da NASA realizaram com sucesso uma passagem pela Terra com propulsão, utilizando a gravidade da Terra para se catapultar rumo a Marte. Agora em trânsito, os satélites devem chegar ao planeta vermelho em setembro de 2027.", "titulo_pt": "Satélites ESCAPADE da nasa concluem voo passado terra com propulsão, agora direcionados para marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 253219, "titulo": "Drugs like Ozempic may help reverse chronic kidney disease", "url": "https://www.sciencenews.org/article/semaglutide-chronic-kidney-disease", "fonte_id": "science_news", "data_pub": "2026-11-09T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram que semaglutida, o ingrediente ativo do Ozempic, reparou vasos sanguíneos, diminuiu a inflamação e melhorou a função renal dos pacientes.", "titulo_pt": "Medicamentos como Ozempic podem ajudar a reverter a doença renal crônica", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 253182, "titulo": "STAT+: FDA warns GLP-1 drugs carry potential risk of rare eye condition", "url": "https://www.statnews.com/2026/11/09/glp-1-drugs-potential-risk-rare-eye-condition-naion-fda/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA advertiu que os medicamentos GLP-1 apresentam um risco potencial de uma condição ocular rara, frequentemente chamada de 'acidente vascular encefálico ocular'.", "titulo_pt": "FDA avisa: medicamentos GLP-1 têm risco potencial de condição ocular rara", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 253244, "titulo": "The coin-flipping trick that counts the Internet", "url": "https://www.scientificamerican.com/article/the-coin-flipping-trick-that-counts-the-internet/", "fonte_id": "scientific_american", "data_pub": "2026-11-09T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O algoritmo HyperLogLog é usado para contar grandes volumes de dados, como os pacotes de tráfego na Internet. Ele utiliza uma técnica de jogada de moeda para estimar o número de elementos únicos de forma eficiente.", "titulo_pt": "A técnica de jogada de moeda que conta a Internet", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 252810, "titulo": "La Universidad Autónoma reunió en Chile a voces clave del diálogo internacional", "url": "https://www.latercera.com/sociales/noticia/la-universidad-autonoma-reunio-en-chile-a-voces-clave-del-dialogo-internacional/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "
