-empurram-um-pib-cada-vez-mais-devagar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T15:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economia brasileira deve crescer cerca de 2% em 2026, com base nos dados do PIB do segundo trimestre de 2025 e do desempenho do terceiro trimestre. O ritmo de crescimento anual foi menor no último ano, com 1,9%, o menor desde 2019 (exceto durante a pandemia).", "titulo_pt": "Gasto das famílias estagnado, agro e petróleo levam PIB a crescer devagar em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137581, "titulo": "Interesse por taxa das blusinhas dispara 492% e impulsiona Shein, Shopee e Aliexpress", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/interesse-por-taxa-das-blusinhas-dispara-492-e-impulsiona-shein-shopee-e-aliexpress.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T15:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O interesse por 'taxa das blusinhas' aumentou 492% nos últimos 45 dias, de acordo com um levantamento da Taboola. Este interesse impulsionou o crescimento das plataformas Shein, Shopee e Aliexpress.", "titulo_pt": "Interesse por 'taxa das blusinhas' dispara 492% e impulsiona Shein, Shopee e Aliexpress", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137583, "titulo": "Shein arrecada US$ 1,7 bilhão em IPO e fecha estreia na Bolsa com queda de 0,1%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/shein-arrecada-us-17-bilhao-em-ipo-e-fecha-estreia-na-bolsa-com-queda-de-01.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T14:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Shein, gigante do fast-fashion, realizou uma oferta pública inicial (IPO) na Bolsa de Hong Kong, arrecadando US$ 1,7 bilhão. A estreia na bolsa teve uma leve queda de 0,1%.", "titulo_pt": "Shein arrecada US$ 1,7 bilhão em IPO e fecha estreia na Bolsa com leve queda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137584, "titulo": "É necessário estabelecer teto de gastos com base na relação dívida/PIB, diz Sachsida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/e-necessario-estabelecer-teto-de-gastos-com-base-na-relacao-dividapib-diz-sachsida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T14:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Adolfo Sachsida, ex-ministro de Minas e Energia e integrante da equipe econômica que assessora a campanha de Flávio Bolsonaro, defendeu a necessidade de estabelecer um teto de gastos com base na relação entre dívida bruta e PIB.", "titulo_pt": "É necessário estabelecer teto de gastos com base na relação dívida/PIB, diz ex-ministro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137585, "titulo": "Qualicorp elege Eduardo Oliveira como novo CEO da empresa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/09/01/6558-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466783", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conselho de administração da Qualicorp nomeou Eduardo Oliveira como novo diretor-presidente da empresa, substituindo Maurício Lopes. Oliveira era vice-presidente-executivo da Qualicorp.", "titulo_pt": "Qualicorp elege Eduardo Oliveira como novo CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137780, "titulo": "Banco do Brasil e BEI assinam crédito de 250 milhões de euros para mulheres na Amazônia", "url": "https://exame.com/esg/banco-do-brasil-e-bei-assinam-credito-de-250-milhoes-de-euros-para-mulheres-na-amazonia/", "fonte_id": "exame", "data_pub": "2026-09-01T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A parceria entre o Banco do Brasil e o BEI (Banco Europeu de Investimento) visa apoiar 50 mil empreendedoras na Amazônia em três anos, com um crédito de 250 milhões de euros anunciado na COP30, mas detalhes como taxa, prazo e ticket ainda não foram definidos.", "titulo_pt": "Banco do Brasil e BEI assinam crédito de 250 milhões de euros para mulheres na Amazônia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 137589, "titulo": "Inflação na zona do euro supera 3% e pressiona Banco Central Europeu", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/inflacao-na-zona-do-euro-supera-3-e-pressiona-banco-central-europeu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T14:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação anual na zona do euro ultrapassou 3% em agosto, principalmente devido ao aumento dos custos de energia. Essa situação reforça os argumentos para um novo aumento da taxa de juros pelo Banco Central Europeu.", "titulo_pt": "Inflação na zona do euro supera 3% e pressiona Banco Central Europeu", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137590, "titulo": "Governo reverte decisão que suspendia imposto de exportação do petróleo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/governo-reverte-decisao-que-suspendia-imposto-de-exportacao-do-petroleo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T14:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal revogou a decisão que suspendia a cobrança do imposto de exportação do petróleo, que era usado para compensar a perda de arrecadação com a subvenção ao óleo diesel. A decisão foi tomada nesta segunda-feira (1º).", "titulo_pt": "Governo revoga decisão que suspendia imposto de exportação do petróleo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137591, "titulo": "Fabricante de Ozempic e Wegovy relança site para venda online de medicamentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/equilibrioesaude/2026/09/fabricante-de-ozempic-e-wegovy-relanca-site-para-venda-online-de-medicamentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T14:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Novo Nordisk relançou a NovoCare Farmácia, uma plataforma de venda online de medicamentos para diabetes tipo 2, sobrepeso e obesidade, incluindo Ozempic, Wegovy e Rybelsus. A plataforma vende medicamentos à base de semaglutida.", "titulo_pt": "Novo nordisk relança site para venda online de medicamentos para diabetes e sobrepeso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138196, "titulo": "Fed Governor Barr says he'll support rate hike if inflation doesn't ease", "url": "https://www.cnbc.com/2026/09/01/fed-governor-barr-says-hell-support-rate-hike-if-inflation-doesnt-ease.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O membro do conselho de política monetária disse que apoia uma elevação das taxas de juros se a inflação não diminuir. Ele expressou preocupação com a possibilidade de pressões de preços mais amplas se instalar, uma vez que a inflação tem permanecido acima do objetivo de 2% do Fed.", "titulo_pt": "Barr, membro do fed, afirma que apoiará aumento das taxas se inflação não abaixar", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 138405, "titulo": "Google Find Hub will soon help you locate things without a tracker", "url": "https://www.theverge.com/tech/987339/google-september-android-drop-motion-assist-gemini-find-hub", "fonte_id": "the_verge", "data_pub": "2026-09-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou novas funcionalidades para dispositivos Android como parte da atualização do mês. Entre as novidades, está a introdução do Motion Assist, similar à função Motion Cues do iOS, que tenta reduzir a sensação de mal-estar ao mover pontos na tela em resposta às movimentações do veículo.", "titulo_pt": "Google Find Hub vai ajudar a localizar coisas sem rastreador", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 138462, "titulo": "IEEE President’s Note: Technology for Social Good", "url": "https://spectrum.ieee.org/president-ieee-note-september-2026", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A força da IEEE reside não apenas na excelência das suas comunidades individuais, mas também na capacidade de unir essas comunidades em torno de problemas compartilhados que exigem soluções interdisciplinares. Sua missão como instituição filantrópica pública — avançar a tecnologia para o benefício da humanidade — está se tornando um diferencial estratégico importante.", "titulo_pt": "Nota do presidente da IEEE: tecnologia para o bem Social", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 138382, "titulo": "Google’s answer to Canva is an AI tool where you prompt instead of design", "url": "https://techcrunch.com/2026/09/01/googles-answer-to-canva-is-an-ai-tool-where-you-prompt-instead-of-design/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou uma ferramenta de AI chamada Google Pics, que visa competir com a Canva e a Adobe no mercado de software criativo, mas com uma abordagem focada em IA.", "titulo_pt": "Google lança ferramenta de AI para competir com Canva", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 137853, "titulo": "SoundCloud testa recurso que permite venda de músicas com repasse total aos artistas", "url": "https://veja.abril.com.br/coluna/faria-lima-news/soundcloud-testa-recurso-que-permite-venda-de-musicas-com-repasse-total-aos-artistas/", "fonte_id": "veja", "data_pub": "2026-09-01T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SoundCloud está testando um novo recurso que permite às músicas serem vendidas diretamente, com o artista definindo o preço e recebendo 100% da receita líquida.", "titulo_pt": "Soundcloud testa venda direta de músicas com repasse total aos artistas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 138383, "titulo": "ChatGPT Health adds Epic integration for clinicians to import patient data", "url": "https://techcrunch.com/2026/09/01/chatgpt-health-adds-epic-integration-for-clinicians-to-import-patient-data/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI anunciou a integração do ChatGPT Health com o Epic, permitindo que os profissionais de saúde tenham acesso somente de leitura aos registros médicos dos pacientes.", "titulo_pt": "Chatgpt Health integra com Epic para importar dados de pacientes", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138384, "titulo": "Waymo goes on offense ahead of Tesla’s Cybercab launch", "url": "https://techcrunch.com/2026/09/01/waymo-goes-on-offense-ahead-of-teslas-cybercab-launch/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Waymo afirmou que veículos autônomos completamente autônomos não são possíveis sem uma mistura de sensores e alertou que sistemas de IA end-to-end não são seguros o suficiente. A empresa está tomando medidas proativas antes do lançamento do Cybercab da Tesla.", "titulo_pt": "Waymo ataca antes do lançamento do Cybercab da Tesla", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138385, "titulo": "Sequoia-incubated Empirik launches with $21M to predict outages before they happen", "url": "https://techcrunch.com/2026/09/01/sequoia-incubated-empirik-launches-with-21m-to-predict-outages-before-they-happen/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Empirik, incubada pela Sequoia, recebeu $21 milhões para prever falhas em infraestrutura de TI antes que elas ocorram. A empresa tem como objetivo ser para a infraestrutura de TI o que a Cursor é para engenharia de software.", "titulo_pt": "Empirik lança com $21 milhões para prever falhas em infraestrutura de ti", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138366, "titulo": "Plug and Play plans $100 million Taiwan fund, hopes one of its next five unicorns is Taiwanese", "url": "https://www.digitimes.com/news/a20260901VL221/taiwan-taipei-business-software-google.html", "fonte_id": "digitimes", "data_pub": "2026-09-01T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Saeed Amidi, cofundador do Plug and Play, chegou a Taiwan e está perguntando a todos sobre planos para um fundo de 100 milhões de dólares. O objetivo é que um de seus próximos cinco unicórnios seja uma empresa taiwanesa.", "titulo_pt": "Plug and Play planeja fundo de 100 milhões de dólares em Taiwan, com esperança de gerar um unicórnio taiwanês dentre os próximos cinco", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 138386, "titulo": "GoPro to be acquired for $285M, will remain a public company", "url": "https://techcrunch.com/2026/09/01/gopro-to-be-acquired-for-285m-will-remain-a-public-company/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "GoPro será adquirida por $285 milhões e continuará a operar como uma empresa pública. A aquisição envolve uma empresa que desenvolve infraestrutura de inteligência artificial, mas a GoPro continuará a apoiar seus produtos existentes para consumidores.", "titulo_pt": "Gopro será adquirida por $285 milhões e permanecerá como empresa pública", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138387, "titulo": "Amazon Alexa can now alert you when something new might tempt you to shop", "url": "https://techcrunch.com/2026/09/01/amazon-alexa-can-now-alert-you-when-something-new-might-tempt-you-to-shop/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T15:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon introduziu uma nova funcionalidade do Alexa chamada 'Update Me When', que pode enviar alertas personalizados sobre lançamentos de produtos, tours, livros, shows e outros eventos que podem motivar uma compra.", "titulo_pt": "Alexa da amazon agora pode avisar sobre novidades que podem te fazer comprar", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138388, "titulo": "AIR raises $50M to help companies vet the skills and add-ons AI agents use", "url": "https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa AIR levantou $50 milhões para ajudar empresas a avaliar as habilidades e complementos dos agentes de inteligência artificial que usam. A plataforma do AIR pode descobrir agentes em uso em uma empresa, verificar continuamente quaisquer habilidades e complementos que eles utilizam e bloquear qualquer comportamento indesejado.", "titulo_pt": "AIR levanta $50 milhões para avaliar e bloquear comportamentos indesejados de agentes de IA em empresas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138389, "titulo": "Microsoft 365 outage drags on, but things are improving", "url": "https://techcrunch.com/2026/09/01/microsoft-365-outage-drags-on-but-things-are-improving/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T15:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O serviço Microsoft 365 e o Outlook ainda estão enfrentando degradações em 2023, conforme indicado pela página de status da empresa.", "titulo_pt": "Interrupção no microsoft 365 e outlook persiste, mas há sinais de melhora", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138390, "titulo": "Fambot introduces an ‘AI chief of staff’ for families", "url": "https://techcrunch.com/2026/09/01/fambot-introduces-an-ai-chief-of-staff-for-families/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fambot está desenvolvendo um assistente de inteligência artificial (IA) com o título de 'chefe de staff' para auxiliar as famílias na organização de emails, calendários, atualizações escolares, horários de esportes e outras logísticas relacionadas à criação de crianças.", "titulo_pt": "Fambot apresenta um 'chefe de staff' de IA para famílias", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138345, "titulo": "Power failure halts trams running between Hong Kong’s Wan Chai and Admiralty", "url": "https://www.scmp.com/news/hong-kong/transport/article/3366028/power-failure-halts-trams-running-between-hong-kongs-wan-chai-and-admiralty?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os serviços de trambolhos entre Wan Chai e Admiralty em Hong Kong foram interrompidos na noite de terça-feira devido a um falha de energia elétrica. Este é o segundo incidente de interrupção de serviços de trambolhos em dois dias consecutivos.", "titulo_pt": "Falha de energia interrompe trambolhos entre Wan Chai e Admiralty", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138391, "titulo": "Florida and Texas move to block Flock cameras over privacy concerns", "url": "https://techcrunch.com/2026/09/01/florida-and-texas-move-to-block-flock-cameras-over-privacy-concerns/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Florida e Texas estão tomando medidas para bloquear a utilização de câmeras Flock devido a preocupações sobre privacidade. A rede de 130.000 câmeras de placa de licença nos Estados Unidos é alvo de preocupações bipartidárias sobre privacidade e liberdades civis.", "titulo_pt": "Flórida e Texas buscam bloquear câmeras Flock por questões de privacidade", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 138392, "titulo": "This startup is fuel-injecting hydrogen to make cargo ships more efficient", "url": "https://techcrunch.com/2026/09/01/this-startup-is-fuel-injecting-hydrogen-to-make-cargo-ships-more-efficient/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Newlight levantou um financiamento de 9 milhões de dólares em semente e realizou um teste de 8.500 náuticas de Singapore para Ghana injetando hidrogênio nos motores dos navios.", "titulo_pt": "Esta startup está injetando hidrogênio nos motores de navios para torná-los mais eficientes", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 138426, "titulo": "Diatom sequencing project finds striking genetic differences among microscopic algae", "url": "https://phys.org/news/2026-08-diatom-sequencing-genetic-differences-microscopic.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de mais de cem cientistas realizou um projeto de sequenciamento genético em diatomés, descobrindo diferenças genéticas significativas entre essas microalgas. Este trabalho representa um passo importante para compreender melhor essas pequenas, mas crucial, organizações.", "titulo_pt": "Projeto de sequenciamento genético de diatomés revela diferenças genéticas notáveis entre microalgas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 138427, "titulo": "New AI approaches to help understand complex biological data", "url": "https://phys.org/news/2026-09-ai-approaches-complex-biological.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da Universidade de Cardiff apresentaram dois estudos no 2026 International Conference on Machine Learning (ICML 2026) que abordam desafios fundamentais na IA moderna: a compreensão da geometria complexa e das relações dentro dos dados, bem como a identificação de padrões que ocorrem em diferentes escalas.", "titulo_pt": "Novas abordagens de IA para ajudar a entender dados biológicos complexos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 138482, "titulo": "Historic Engines Take Their Place on Artemis III", "url": "https://www.nasa.gov/image-article/historic-engines-take-their-place-on-artemis-iii/", "fonte_id": "nasa_news", "data_pub": "2026-09-01T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 24 de agosto, técnicos do Centro Espacial Kennedy da NASA, em Florida, começaram a instalar os quatro motores RS-25 no estágio central do foguete Sistemo de Lançamento Espacial (SLS) que levará a tripulação da missão Artemis III à órbita terrestre baixa em 2027. Cada motor RS-25 possui um número de série único que registra sua história de voo detalhada.", "titulo_pt": "Motor histórico se integra ao foguete da Artemis III", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 138419, "titulo": "Opinion: I’m a reproductive psychiatrist. The Lindsay Clancy trial will cause terrible damage to my field", "url": "https://www.statnews.com/2026/09/01/lindsay-clancy-trial-verdict-postpartum-psychosis-psychiatry/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A psiquiatra reprodutiva Jennifer Okwerekwu critica que o julgamento de Lindsay Clancy reduzirá sua área de estudo a uma única pergunta preconceituosa: se o sistema de saúde falhou nesse caso.", "titulo_pt": "Opinião: sou uma psiquiatra reprodutiva. O julgamento Lindsay Clancy causará danos terríveis ao meu campo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 137854, "titulo": "Nancy Grace Roman: quem foi a astrônoma que dá nome ao novo telescópio espacial da Nasa", "url": "https://veja.abril.com.br/ciencia/nancy-grace-roman-quem-foi-a-astronoma-que-da-nome-ao-novo-telescopio-espacial-da-nasa/", "fonte_id": "veja", "data_pub": "2026-09-01T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nancy Grace Roman foi a primeira chefe de astronomia da NASA e é conhecida como 'Mãe do Hubble'.", "titulo_pt": "Nancy Grace Roman: a primeira chefe de astronomia da Nasa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 138480, "titulo": "The universe may have been building rocky planets almost from the start", "url": "https://www.sciencenews.org/article/universe-rocky-planets-formed-early", "fonte_id": "science_news", "data_pub": "2026-09-01T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simulações indicam que os componentes de planetas rochosos podem ter formado apenas 100 milhões de anos após o Big Bang.", "titulo_pt": "O universo pode ter estado formando planetas rochosos quase desde o início", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 138347, "titulo": "China-Nepal floods: first research shows that no one could have outrun debris flow", "url": "https://www.scmp.com/news/china/science/article/3366020/china-nepal-floods-first-research-shows-no-one-could-have-outrun-debris-flow?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Instituto Chinesês de Ciências, um dos primeiros a avaliar a catástrofe, concluiu que as águas de um deslizamento de massa não poderiam ser superadas até mesmo por corredores de elite, como Usain Bolt. O estudo calculou que a velocidade superficial do deslizamento de massa era de 19 metros por segundo quando atingiu o ponto de fronteira de Gyirong Port, no Tibete.", "titulo_pt": "China-nepal: estudo mostra que ninguém poderia ter escapado das águas devastadoras da cheia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138463, "titulo": "Have we finally found dark matter?", "url": "https://www.scientificamerican.com/article/have-we-finally-found-dark-matter/", "fonte_id": "scientific_american", "data_pub": "2026-09-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos maiores experimentos de busca de matéria escura registrou uma partícula que não pode ser explicada. Isso sugere que a matéria escura pode estar sendo detectada, mas a natureza exata da partícula ainda é incerta.", "titulo_pt": "Finalmente encontramos matéria escura?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 138481, "titulo": "Dark matter hunters may have finally spotted a hint of the particles", "url": "https://www.sciencenews.org/article/dark-matter-particle-wimp-lz-experiment", "fonte_id": "science_news", "data_pub": "2026-09-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa por partículas de matéria escura, conhecida como matéria sombria, tem durado décadas. O experimento LZ pode ter detectado uma partícula chamada WIMP, mas é necessário mais dados para confirmar.", "titulo_pt": "Pesquisadores de matéria escura podem ter encontrado uma pista das partículas", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 138421, "titulo": "STAT+: Novartis gets multiple sclerosis win with BTK inhibitor", "url": "https://www.statnews.com/2026/09/01/biotech-news-novartis-gets-multiple-sclerosis-win-with-btk-inhibitor/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novartis obteve um sucesso no tratamento de esclerose múltipla com um inibidor de BTK. A STAT+ também noticiou acordos adicionais sobre preços de medicamentos de mais Trump, aceleramento do desenvolvimento de uma vacina mRNA contra gripe pela GSK e outras notícias da biotecnologia.", "titulo_pt": "Novartis conquista vitória na esclerose múltipla com inibidor de BTK", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 138422, "titulo": "STAT+: Pharmalittle: We’re reading about Novartis and Bristol pausing cell therapy trials, a $480K cancer drug, and more", "url": "https://www.statnews.com/pharmalot/2026/09/01/novartis-bristol-trials-paused-pancreatic-cancer-drug-price-pharmalittle-newsletter/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T13:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novartis e Bristol Myers Squibb suspenderam várias fases de testes de terapias celulares, enquanto o preço de um medicamento contra o câncer chegou a US$ 480.000.", "titulo_pt": "Pharmalittle: Novartis e Bristol myers squibb pausam ensaios de terapias celulares e medicamento contra o câncer custa us$ 480.000", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 138423, "titulo": "STAT+: FDA clears Stryker’s ‘surgical cockpit’ that uses Apple’s VR headset, Vision Pro", "url": "https://www.statnews.com/2026/09/01/fda-stryker-surgical-cockpit-apple-vr-headset-health-tech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou o uso de um sistema de realidade virtual desenvolvido pela Stryker, que utiliza o headset Vision Pro da Apple, para uma aplicação cirúrgica. O relatório também menciona o uso de chatbots para combater a solidão, mas não fornece detalhes adicionais sobre esse aspecto.", "titulo_pt": "FDA aprova uso de headset VR da Apple para cirurgia pela Stryker", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 138424, "titulo": "Paxlovid did not help long Covid, study finds", "url": "https://www.statnews.com/2026/09/01/health-news-paxlovid-did-not-help-long-covid-study-finds/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T13:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo descobriu que o Paxlovid não auxiliou na recuperação de pacientes com Covid-19 prolongada. Novas negociações de preços de medicamentos do governo Trump, produtos de cannabis comestíveis e pesquisas sobre direção após o uso de cannabis também foram noticiadas.", "titulo_pt": "Paxlovid não beneficiou pacientes com Covid-19 prolongada, estudo constata", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 138354, "titulo": "Starship could create more debris than an anti-satellite test if it explodes in orbit", "url": "https://www.scmp.com/news/china/science/article/3365943/starship-could-create-more-debris-anti-satellite-test-if-it-explodes-orbit?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Starship, o foguete mais grande e poderoso do mundo, está prestes a tentar alcançar a órbita terrestre. Se ocorrer uma catástrofe em voo, como uma explosão da etapa superior, poderia gerar detritos espaciais, o que os especialistas consideram uma preocupação.", "titulo_pt": "Navio espacial poderia criar mais detritos do que um teste antissatélite se explodir em órbita", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138418, "titulo": "S. Korea's science minister attends G20 Innovation Ministerial event", "url": "https://en.yna.co.kr/view/AEN20260901008100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-01T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Ciência da Coreia do Sul, Bae Kyung-hoon, participou do evento ministerial de inovação da G20.", "titulo_pt": "Ministro da ciência da Coreia do sul participa do evento Ministerial de inovação da G20", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 138464, "titulo": "Why the Grand Canyon flash flood was so devastating", "url": "https://www.scientificamerican.com/article/why-the-grand-canyon-flash-flood-was-so-devastating/", "fonte_id": "scientific_american", "data_pub": "2026-09-01T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um temporal de monção causou uma cheia devastadora no Grand Canyon, resultando em mortes. Os especialistas explicam as condições que tornaram essa tempestade tão perigosa.", "titulo_pt": "Por que a cheia no Grand Canyon foi tão devastadora", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 138342, "titulo": "MODA promoting local computing capacity expansion", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/02/2003863516", "fonte_id": "taipei_times", "data_pub": "2026-09-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MODA está promovendo o aumento da capacidade de computação local. O objetivo é expandir as habilidades computacionais locais.", "titulo_pt": "MODA promovendo expansão da capacidade de computação local", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 138529, "titulo": "U.K. Prime Minister Retracts Support for Return of Parthenon Marbles to Greece", "url": "https://www.artforum.com/news/burnham-retracts-support-for-return-of-parthenon-marbles-1234758580/", "fonte_id": "artforum", "data_pub": "2026-09-01T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Burnham, ex-premiê do Reino Unido, revogou sua posição em relação à devolução das Colunas do Partenon para a Grécia após ter sido um defensor do seu retorno em 2023. Anteriormente, quando era o prefeito de Manchester, Burnham afirmou que George Osborne, o presidente do British Museum, deveria devolver as colunas.", "titulo_pt": "Ex-premiê do reino unido retraça apoio à devolução das colunas do partenon à Grécia", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 138512, "titulo": "Beeple Artwork at Wisconsin Museum Generates Controversy over Use of AI: ‘Devoid of Any Critical Engagement’", "url": "https://www.artnews.com/art-news/news/beeple-artwork-wisconsin-museum-controversy-ai-1234796433/", "fonte_id": "artnews", "data_pub": "2026-09-01T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas assinaram uma carta aberta criticando a exposição de arte de Beeple no museu de Wisconsin, afirmando que o uso de obras de terceiros é éticamente questionável. A arte foi acusada de estar 'destituída de qualquer engajamento crítico'.", "titulo_pt": "Carta aberta critica exposição de arte de beeple no museu de Wisconsin", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 137989, "titulo": "Arrau se desmarca de Registro de Vándalos y La Moneda intenta salvar iniciativa excluida de la agenda de seguridad", "url": "https://www.latercera.com/politica/noticia/arrau-se-desmarca-de-registro-de-vandalos-y-la-moneda-intenta-salvar-iniciativa-excluida-de-la-agenda-de-seguridad/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Segurança não participa da tramitação do projeto Registro de Vándalos e a Comissão de Segurança aprovou separar o conceito de ato vandálico de incivilidade. A iniciativa não faz parte da atual agenda de segurança.", "titulo_pt": "Arrau se distancia de Registro de Vándalos e comissão de segurança separa conceitos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 137977, "titulo": "Crisis en Comisión Verdad y Niñez: comisionados remueven a cuatro coordinadores en medio de tensión por denuncias de maltrato", "url": "https://www.latercera.com/nacional/noticia/crisis-en-comision-verdad-y-ninez-comisionados-remueven-a-cuatro-coordinadores-en-medio-de-tension-por-denuncias-de-maltrato/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 18 de agosto, os cinco especialistas decidiram remover quatro coordenadores após um relatório de desempenho elaborado pelo secretário executivo Branislav Marelic. Três dias depois, 25 funcionários pediram a renúncia de Marelic, acusando maltrato e eventuais irregularidades. Seis desses funcionários denunciaram Marelic à Subsecretaria de Justiça, e quase todos foram demitidos na mesma jornada.", "titulo_pt": "Crise na comissão Verdad y Niñez: comissários removem quatro coordenadores em meio a tensões por denúncias de maltrato", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 138495, "titulo": "Inside the 3,000-Zine Library in a Texas Living Room", "url": "https://hyperallergic.com/inside-the-3-000-zine-library-in-a-texas-living-room/", "fonte_id": "hyperallergic", "data_pub": "2026-09-01T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A biblioteca de zines Sherwood Forest de Michelle Millette, em Austin, é parte de uma cultura e comunidade em crescimento que envolve livros auto-publicados e fáceis de distribuir.", "titulo_pt": "Dentro da biblioteca de 3.000 zines em um Living Room no Texas", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 138553, "titulo": "Twelve Centuries of Documents Illuminate Humans’ Quest for Knowledge in ‘World Unfolding’", "url": "https://www.thisiscolossal.com/2026/09/world-unfolding-book-human-knowledge-history-the-huntington/", "fonte_id": "colossal", "data_pub": "2026-09-01T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro em cinco volumes contém mais de 625 ilustrações da vasta coleção do Huntington. O 'World Unfolding' ilumina a busca humana pelo conhecimento ao longo de milhares de anos.", "titulo_pt": "Milênios de documentos iluminam a busca humana pelo conhecimento em 'World Unfolding'", "veiculo": "Colossal (arte)", "pais": "EUA", "classe": "B"}, {"id": 138555, "titulo": "Miley Cyrus Rebrands as Miley, Reveals New Album Bass Persuades", "url": "https://pitchfork.com/story/miley-cyrus-rebrands-as-miley-reveals-new-album-bass-persuades/", "fonte_id": "pitchfork", "data_pub": "2026-09-01T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O álbum seguinte a Something Beautiful será lançado em 18 de setembro. Miley Cyrus rebrandou sua identidade artística para Miley.", "titulo_pt": "Miley Cyrus lança novo álbum em 18 de setembro", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 137998, "titulo": "Gladys González publica nuevo poemario sobre el cáncer dedicado al dolor por la muerte de su abuelo-padre", "url": "https://www.latercera.com/culto/noticia/gladys-gonzalez-publica-nuevo-poemario-sobre-el-cancer-dedicado-al-dolor-por-la-muerte-de-su-abuelo-padre/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T16:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gladys González lançou um novo poemário chamado 'Animalito Salvaje', que faz parte de mais de vinte anos de escrita da autora. O livro, que será apresentado em Santiago, revisita e constata o processo de morte do seu abuelo, explorando o sofrimento associado à velhice, ao deterioramento e ao abandono.", "titulo_pt": "Gladys González publica novo livro sobre câncer dedicado ao sofrimento pela morte do seu avô-pai", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 137688, "titulo": "Festival em Tiradentes celebra laços da cozinha mineira com Portugal", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/festival-de-tiradentes-celebra-lacos-da-cozinha-mineira-com-portugal", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-01T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 29ª edição do Festival Cultura e Gastronomia de Tiradentes, que se encerrou no último domingo, atraiu cerca de 70 mil pessoas em dez dias. O evento explorou as conexões entre a cozinha mineira e portuguesa, com ações como aulas de cozinha, palestras e espaços interativos.", "titulo_pt": "Festival em Tiradentes celebra laços da cozinha mineira com Portugal", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 138496, "titulo": "Opportunities in September 2026", "url": "https://hyperallergic.com/opportunities-in-september-2026/", "fonte_id": "hyperallergic", "data_pub": "2026-09-01T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro de 2026, há oportunidades disponíveis para artistas, escritores e profissionais de arte, como residências, bolsas e convites abertos de várias organizações, incluindo o Journal da Costa do Golfo, o Harry Ransom Center, o Smithsonian American Art Museum e o Vermont Studio Center.", "titulo_pt": "Oportunidades em setembro de 2026", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 138530, "titulo": "Mark Feary to Curate 2028 Adelaide Biennial", "url": "https://www.artforum.com/news/mark-feary-will-curate-2028-adelaide-biennial-1234758565/", "fonte_id": "artforum", "data_pub": "2026-09-01T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mark Feary, nascido na Nova Zelândia e atualmente diretor artístico do Gertrude Contemporary em Melbourne, foi escolhido para curar a próxima edição do Biênal de Arte de Adelaide, que ocorrerá de 3 de março a 4 de junho de 2028.", "titulo_pt": "Mark Feary será curador da próxima biênal de arte de Adelaide em 2028", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 138556, "titulo": "Oso Oso Announce Album on Mark Quinlan’s New Label", "url": "https://pitchfork.com/story/oso-oso-announce-album-on-mark-quinlans-new-label/", "fonte_id": "pitchfork", "data_pub": "2026-09-01T15:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oso Oso anunciará seu álbum de estreia pela Feral Twin Records, uma nova etiqueta de Mark Quinlan, baterista da banda Hop Along.", "titulo_pt": "Oso Oso anunciam álbum pela nova etiqueta de Mark Quinlan", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 138498, "titulo": "How Fannuh Baskets Connect Liberia to the US Lowcountry", "url": "https://hyperallergic.com/how-fannuh-baskets-connect-liberia-to-the-us-lowcountry/", "fonte_id": "hyperallergic", "data_pub": "2026-09-01T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecelagem de cestas Gullah Geechee está radicada em uma tradição oral mantida por escravos oriundos da costa Windward da Libéria.", "titulo_pt": "Como as cestas Fannuh conectam a libéria ao baixo condado dos EUA", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 138539, "titulo": "Emily Wilson to retranslate the Odyssey from scratch", "url": "https://www.theguardian.com/books/2026/sep/01/emily-wilson-to-retranslate-the-odyssey-from-scratch-christopher-nolan", "fonte_id": "guardian_culture", "data_pub": "2026-09-01T15:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emily Wilson, a primeira mulher a traduzir a Odisséia de Homero para o inglês, está retransladando a epopeia em sua íntegra após menos de uma década desde a publicação de sua versão aclamada. A decisão foi anunciada após Wilson criticar severamente a adaptação cinematográfica de Christopher Nolan, chamando-a de 'abominável' e criticando a falta de cenas sexuais.", "titulo_pt": "Emily Wilson vai retranslatar a odisséia do zero", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 138504, "titulo": "MVRDV \"prioritises human scale\" in design of colourful Miami building", "url": "https://www.dezeen.com/2026/09/01/mvrdv-woma-colourful-residential-miami/", "fonte_id": "dezeen", "data_pub": "2026-09-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estúdio de arquitetura holandês MVRDV projetou o edifício Woma, multifuncional, em Wynwood, Miami, com uma praça central e uma fachada dividida em seções coloridas. O projeto inclui 163 residências e foi desenvolvido pela Uribe Schwarzkopf, conhecida por projetos recentes em Quito.", "titulo_pt": "MVRDV prioriza escala humana no projeto colorido do edifício woma em Miami", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 138245, "titulo": "US health authorities contradict state officials on measles-related deaths", "url": "https://www.aljazeera.com/news/2026/9/1/us-health-authorities-contradict-state-officials-on-measles-related-deaths?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-01T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades de saúde dos Estados Unidos contradizem oficiais estaduais sobre mortes relacionadas à rubéola. Os Estados Unidos registram o maior número de casos de rubéola em décadas.", "titulo_pt": "Autoridades federais dos EUA contradizem estados sobre mortes por rubéola", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 137769, "titulo": "Com salário de R$ 27 mil, tenente é preso dando migué em bico da PM", "url": "https://www.metropoles.com/colunas/alfredo-henrique/com-salario-de-r-27-mil-tenente-e-preso-dando-migue-em-bico-da-pm", "fonte_id": "metropoles", "data_pub": "2026-09-01T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tenente da Polícia Militar de São Paulo foi preso após ser flagrado em um ônibus deixando o trabalho durante o horário de serviço. O oficial recebia R$ 27 mil mensais para trabalhar em uma atividade delegada, conhecida como bico, mas foi flagrado usando esse trabalho como desculpa para se ausentar.", "titulo_pt": "Tenente com salário de R$ 27 mil é preso usando bico como desculpa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 137715, "titulo": "INSS: pagamentos de setembro inciarão no dia 24; confira datas", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/meu-dinheiro/inss-pagamentos-de-setembro-inciarao-no-dia-24-confira-datas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os pagamentos do INSS para o mês de setembro começarão no dia 24. A distribuição seguirá em ordem alfabética, com os beneficiários que recebem até um salário mínimo recebendo primeiro.", "titulo_pt": "INSS: pagamentos de setembro começarão no dia 24; confira datas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137724, "titulo": "Impulsionado pelo HPV: 70% dos diagnósticos de câncer de boca são em homens", "url": "https://www.cnnbrasil.com.br/saude/impulsionado-pelo-hpv-70-dos-diagnosticos-de-cancer-de-boca-sao-em-homens/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "70% dos diagnósticos de câncer de boca são em homens, e eles são os que menos realizam exames e tomam vacinas na prevenção do HPV.", "titulo_pt": "Impulsionado pelo HPV: 70% dos diagnósticos de câncer de boca são em homens", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 138355, "titulo": "Welfare groups seek clarity on breed classification amid third fighting dog case", "url": "https://www.scmp.com/news/hong-kong/society/article/3366019/welfare-groups-seek-clarity-breed-classification-amid-third-fighting-dog-case?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades em Hong Kong detiveram um cachorro e classificaram-no como de raça de luta, o terceiro caso semelhante na semana, após uma série de ataques na cidade. Grupos de bem-estar animal pediram esclarecimentos sobre os procedimentos de classificação de raças e sobre um mecanismo de recurso transparente, alegando que a incerteza pode levar a mais abandono de animais de estimação e estereótipos injustos sobre certas raças.", "titulo_pt": "Ongs buscam clareza sobre classificação de raças após terceiro caso de cachorro de luta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138208, "titulo": "Notting Hill carnival returns to West London for 60th anniversary", "url": "http://www.euronews.com/video/2026/09/01/notting-hill-carnival-returns-to-west-london-for-60th-anniversary", "fonte_id": "euronews", "data_pub": "2026-09-01T12:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Notting Hill Carnival retorna para sua 60ª edição, celebrando a cultura afro-caribenha britânica com música, dança e trajes coloridos na região oeste de Londres.", "titulo_pt": "Notting Hill carnival comemora 60 anos em londres", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 138150, "titulo": "French schools face 'unprecedented challenge' of accelerating demographic decline", "url": "https://www.lemonde.fr/en/france/article/2026/09/01/french-schools-face-unprecedented-challenge-of-accelerating-demographic-decline_6757042_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-01T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diminuição significativa da matrícula de alunos está continuando no início do ano escolar de 2026, levando o Ministério da Educação e as autoridades locais a buscarem novas estratégias de planejamento para evitar a formação de 'desertos escolares'.", "titulo_pt": "Escolas francesas enfrentam 'desafio sem precedentes' de declínio demográfico acelerado", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 136938, "titulo": "Roberto, jubilado: \"Me diagnosticaron un cáncer y, de un día para otro, decidí dejar de trabajar. Me compré este barco por 85.000 euros\"", "url": "https://www.clarin.com/internacional/roberto-jubilado-diagnosticaron-cancer-dia-decidi-dejar-trabajar-compre-barco-85000-euros_0_3YvtGtgTHK.html", "fonte_id": "clarin", "data_pub": "2026-09-01T09:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem de 66 anos, jubilado e gallego, foi diagnosticado com câncer e decidiu parar de trabalhar. Após a aposentadoria, ele comprou um barco por 85.000 euros.", "titulo_pt": "Roberto, jubilado: 'me diagnosticaram câncer e, de um dia para outro, decidi parar de trabalhar e comprar um barco'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 137052, "titulo": "Footage of police officer boasting about punching Sydney anti-Herzog protester raises questions about conduct", "url": "https://www.theguardian.com/australia-news/2026/sep/01/police-officer-boasted-about-punching-anti-herzog-protester-when-he-was-down-bodycam-footage-reveals-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-01T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Video foi divulgado mostrando um policial masculino se gabando de ter dado um soco em um manifestante no chão durante protesto em Sydney contra a visita do presidente israelense Isaac Herzog, antes que o manifestante fosse acusado de agredir a polícia. A filmagem, gravada por câmeras de corpo de policiais, foi vazada para uma conta de mídia social e compartilhada amplamente no fim de semana.", "titulo_pt": "Vídeo de policial se gabando de ter dado um soco em manifestante durante protesto em Sydney gera questionamentos sobre conduta", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 136930, "titulo": "Saúde mental é política de Estado", "url": "https://www.jota.info/opiniao-e-analise/artigos/saude-mental-e-politica-de-estado", "fonte_id": "jota", "data_pub": "2026-09-01T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil ocupa o primeiro lugar no ranking mundial de ansiedade e enfrenta uma epidemia silenciosa de vícios em jogos.", "titulo_pt": "Saúde mental é política de Estado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136932, "titulo": "Epilepsia no Brasil: inovação avançou, mas SUS não reorganizou o cuidado", "url": "https://www.jota.info/opiniao-e-analise/colunas/estado-da-saude/epilepsia-no-brasil-inovacao-avancou-mas-sus-nao-reorganizou-o-cuidado", "fonte_id": "jota", "data_pub": "2026-09-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inovação no tratamento da epilepsia no Brasil avançou, mas o Sistema Único de Saúde (SUS) não reorganizou adequadamente o cuidado. O Plano de Cargos, Carreiras e Salários (PCDT) de 2018, a rede de cuidados fragmentada e a incorporação lenta das terapias avançadas limitam o acesso aos tratamentos mais modernos.", "titulo_pt": "Epilepsia no Brasil: inovação avançou, mas SUS não reorganizou o cuidado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136872, "titulo": "Setembro Amarelo: busca por estética acende alerta para dismorfia corporal", "url": "https://www.cnnbrasil.com.br/saude/setembro-amarelo-busca-por-estetica-acende-alerta-para-dismorfia-corporal/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cirurgiã Carine Barreto salienta a necessidade de investigar expectativas irrealistas para preservar a saúde mental dos pacientes. O fenômeno da 'estética acuada' no mês de setembro levanta alertas sobre a dismorfia corporal.", "titulo_pt": "Setembro Amarelo: busca pela perfeição estética acende alerta para dismorfia corporal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137370, "titulo": "Excitement and anxiety as pupils return to school, aided by new well-being campaign", "url": "https://www.scmp.com/news/hong-kong/education/article/3365935/primary-pupils-return-school-mixed-emotions-well-being-campaign-rolls-out?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos das escolas primárias de Hong Kong retornaram às aulas nesta terça-feira com misto de excitação e ansiedade sobre o ano letivo. A secretária de Educação, Christine Choi Yuk-lin, anunciou a implementação de uma campanha para melhorar o bem-estar dos alunos, focada em prevenir bullying.", "titulo_pt": "Excitação e ansiedade dos alunos na volta às aulas, com campanha de bem-estar escolar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 137072, "titulo": "Jugaba en una plaza: niña de 5 años queda herida de gravedad tras balacera en Cerro Navia", "url": "https://www.latercera.com/nacional/noticia/nina-de-5-anos-herida-de-gravedad-producto-de-balacera-en-cerro-navia/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T00:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma menina de 5 anos ficou gravemente ferida após ser atingida por uma bala em um local de jogos em Cerro Navia. Ela foi levada a um hospital onde precisou passar por uma intervenção cirúrgica. A investigação foi encarregada à PDI e ao ECOH da Fiscalía.", "titulo_pt": "Jogava em uma praça: menina de 5 anos fica gravemente ferida em tiroteio em Cerro Navia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 135897, "titulo": "Health ministry expands health subsidy categories", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863485", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde expandiu as categorias de subsídio de saúde, incluindo novos serviços e tratamentos no programa.", "titulo_pt": "Ministério da saúde expande categorias de subsídio de saúde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 138224, "titulo": "Farmers press Commission for drought aid", "url": "https://www.euractiv.com/news/farmers-press-commission-for-drought-aid/", "fonte_id": "euractiv", "data_pub": "2026-09-01T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia irá atualizar os ministros da agricultura sobre a situação de estiagem durante uma reunião em Dublin na próxima segunda-feira.", "titulo_pt": "Agricultores pressionam comissão pela ajuda no caso da seca", "veiculo": "Euractiv", "pais": "Europa", "classe": "B"}, {"id": 138356, "titulo": "Philippine capital’s ‘acutely unhealthy’ air due to Indonesian haze spurs warnings", "url": "https://www.scmp.com/week-asia/health-environment/article/3366016/philippine-capitals-acutely-unhealthy-air-due-indonesian-haze-spurs-warnings?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T12:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fumaça proveniente de incêndios florestais na Indonésia cobriu Manila, levando a alertas de saúde pública no centro da Filipinas. O esmagamento de fumaça vindos das chamas em Kalimantan, parte indonésia da Borneu, fez com que especialistas em saúde recomendassem o uso de máscaras N95 para a população.", "titulo_pt": "Araguaia encolhe em alerta de saúde pública devido à fumaça da indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138363, "titulo": "Glacier risk hangs over China-Nepal border as region remembers mudslide victims", "url": "https://www.scmp.com/news/china/politics/article/3366006/glacier-risk-hangs-over-china-nepal-border-region-remembers-mudslide-victims?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na região autônoma do Tibete, moradores e resgatistas observaram um minuto de silêncio em memória das vítimas da deslizamento de lama que ocorreu na semana passada. Cerca de mil pessoas morreram e milhares estão desaparecidas na área fronteiriça entre China e Nepal após a colapso de um glaciar.", "titulo_pt": "Risco de gelo paira sobre fronteira entre china e nepal enquanto região homenageia vítimas de deslizamento de lama", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138378, "titulo": "Doosan, KOEN widen drone, helicopter search for 9 missing workers in Nepal", "url": "https://www.koreaherald.com/article/10859334", "fonte_id": "korea_herald", "data_pub": "2026-09-01T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doosan Enerbility e Korea South-East Power Co. intensificaram a busca por nove funcionários desaparecidos em Nepal, após inundações flash, utilizando drones e helicópteros. A empresa estatal KOEN adicionou quatro drones equipados com câmeras térmicas e infravermelhas, totalizando seis, para a busca.", "titulo_pt": "Doosan e KOEN intensificam busca por 9 trabalhadores desaparecidos em Nepal com drones e helicópteros", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 137966, "titulo": "The Growing Lawlessness in California’s Forests", "url": "https://www.theatlantic.com/science/2026/09/frog-biologists-kidnapping-california-national-forest/688445/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-01T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas biólogas de rãs foram sequestradas nas florestas. Situações ainda mais estranhas podem ocorrer.", "titulo_pt": "Aumento da Lawlessness nas florestas da califórnia", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 136877, "titulo": "Clima: ciclone extratropical provoca ventos intensos no centro-sul do país", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-provoca-ventos-intensos-no-centro-sul-do-pais", "fonte_id": "metropoles", "data_pub": "2026-09-01T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone extratropical se formou na costa da Região Sul, causando ventos intensos no centro-sul do país. As temperaturas caem no Sul, enquanto no Norte e Nordeste chegam a 41ºC.", "titulo_pt": "Ciclone extratropical causa ventos fortes no centro-sul do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 136881, "titulo": "Lobo-guará é resgatado dentro de casa no DF e depois devolvido à natureza", "url": "https://www.metropoles.com/distrito-federal/lobo-guara-e-resgatado-dentro-de-casa-no-df-e-depois-devolvido-a-natureza", "fonte_id": "metropoles", "data_pub": "2026-09-01T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um lobo-guará foi resgatado dentro de uma casa no Distrito Federal e posteriormente solto na Estação Ecológica Jardim Botânico, local adequado para sua preservação e segurança.", "titulo_pt": "Lobo-guará é resgatado em casa no DF e devolvido à natureza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 137069, "titulo": "Nepal eleva a cerca de mil los muertos por las inundaciones en la frontera con China, que deja unos 3.900 desaparecidos", "url": "https://www.latercera.com/mundo/noticia/nepal-eleva-a-cerca-de-mil-los-muertos-por-las-inundaciones-en-la-frontera-con-china-que-deja-unos-3900-desaparecidos/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T09:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Nepal registra mais de mil mortos e cerca de 3.900 desaparecidos devido às inundações na fronteira com China, enquanto no território chinês foram registrados pelo menos 16 mortos e 550 desaparecidos.", "titulo_pt": "Nepal eleva número de mortos por inundações na fronteira com China, que registra 16 mortos e 550 desaparecidos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 137499, "titulo": "Guest post: Why tough methane cuts are crucial for keeping warming ‘well-below’ 2C", "url": "https://www.carbonbrief.org/guest-post-why-tough-methane-cuts-are-crucial-for-keeping-warming-well-below-2c", "fonte_id": "carbon_brief", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O metano é um gás de efeito estufa poderoso e o segundo maior contribuinte para o aquecimento global após o dióxido de carbono (CO2). Reduções rigorosas do metano são cruciais para manter o aquecimento 'bem abaixo' de 2°C.", "titulo_pt": "Post convidado: por que cortes rigorosos de metano são cruciais para manter o aquecimento 'bem abaixo' de 2°C", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 137051, "titulo": "Sydney records warmest winter on record as Melbourne equals previous hottest temperatures", "url": "https://www.theguardian.com/australia-news/2026/sep/01/sydney-records-warmest-winter-on-record-as-melbourne-equals-previous-hottest-temperatures", "fonte_id": "guardian_world", "data_pub": "2026-09-01T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nova Gales do Sul, Vitoria e Tasmânia registraram seus invernos mais quentes na história. O BoM prevê temperaturas acima da média para todo o país durante o outono, com maior probabilidade de máximas muito elevadas.", "titulo_pt": "Sídney registra inverno mais quente da história enquanto Melbourne iguala recordes de calor", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 136866, "titulo": "Nepal registra mais de mil mortes e 4 mil desaparecidos após enchentes", "url": "https://www.cnnbrasil.com.br/internacional/nepal-registra-mais-de-mil-mortes-e-4-mil-desaparecidos-apos-enchentes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de mil pessoas morreram e cerca de 4 mil desapareceram no Nepal devido às enchentes. Equipes de resgate escavaram escombros em áreas remotas do Himalaia para resgatar trabalhadores presos.", "titulo_pt": "Nepal registra mais de mil mortes e 4 mil desaparecidos após enchentes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137205, "titulo": "Death toll passes 1,000 from catastrophic flooding in Nepal and China, officials say", "url": "http://www.euronews.com/2026/09/01/death-toll-passes-1000-from-catastrophic-flooding-in-nepal-and-china-officials-say", "fonte_id": "euronews", "data_pub": "2026-09-01T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre ocorrido em 26 de agosto no Himalaia começou com a colapso de um gelo, que liberou grandes quantidades de rochas, gelo e água derretida para vales abaixo, desencadeando fortes inundações a jusante. O número de mortos superou a marca de 1.000 em Nepal e China, de acordo com autoridades.", "titulo_pt": "Óbitos ultrapassam 1.000 em inundações catastróficas no Nepal e na China", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 138236, "titulo": "VOLTAGE: Foot dragging over nature restoration", "url": "https://www.euractiv.com/news/voltage-foot-dragging-over-nature-restoration/", "fonte_id": "euractiv", "data_pub": "2026-09-01T06:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seção aborda três temas: tecnologias limpas na China, a implantação de energia eólica e o setor de navegação grego.", "titulo_pt": "VOLTAGE: pés de barro na restauração da natureza", "veiculo": "Euractiv", "pais": "Europa", "classe": "B"}, {"id": 136901, "titulo": "Dados de 40 anos mostram como a seca na Amazônia já ameaça o agro, alerta especialista", "url": "https://exame.com/esg/a-amazonia-esta-perto-do-ponto-de-nao-retorno-para-especialista-crise-ja-e-sistemica/", "fonte_id": "exame", "data_pub": "2026-09-01T05:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada por uma cientista brasileira associada a Princeton indica que a seca na Amazônia já afeta o agronegócio, com 57% da renda do setor no Brasil dependendo das chuvas nas Terras Indígenas da região.", "titulo_pt": "Dados de 40 anos mostram como a seca na Amazônia já ameaça o agro, alerta especialista", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 137207, "titulo": "Two dead and one still unaccounted for in Grand Canyon flash floods, officials say", "url": "http://www.euronews.com/2026/09/01/two-dead-and-one-still-unaccounted-for-in-grand-canyon-flash-floods-officials-say", "fonte_id": "euronews", "data_pub": "2026-09-01T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois pessoas morreram e uma ainda está desaparecida devido às cheias repentinas no Grand Canyon, conforme informaram as autoridades. As operações de resgate foram prejudicadas por mais chuvas intensas que atingiram a região na segunda-feira, parte normal da monção estacional que frequentemente causa cheias repentinas.", "titulo_pt": "Dois mortos e um desaparecido em cheias repentinas no Grand Canyon, dizem autoridades", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 138241, "titulo": "Wind industry downbeat despite being on track for record deployment this year", "url": "https://www.euractiv.com/news/wind-industry-downbeat-despite-being-on-track-for-record-deployment-this-year/", "fonte_id": "euractiv", "data_pub": "2026-09-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os desenvolvedores de parques eólicos europeus enfrentam dificuldades com a diminuição de permissões e o declínio do mercado alemão. Apesar de estar em curso um recorde de implantação este ano, os desafios continuam.", "titulo_pt": "Indústria eólica sob pressão apesar de recorde de implantação", "veiculo": "Euractiv", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 137995, "titulo": "Formalizan a Gonzalo Feito por maltrato habitual y decretan suspensión condicional del procedimiento por un año", "url": "https://www.latercera.com/nacional/noticia/formalizan-a-gonzalo-feito-por-maltrato-habitual-y-decretan-suspension-condicional-del-procedimiento-por-un-ano/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T17:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gonzalo Feito, periodista e apresentador de televisão, foi formalizado por maltrato habitual e teve um procedimento condicional de suspensão decretado por um ano. Como parte das condições, ele deverá submeter-se a testes de drogas a cada quatro meses e participar de um programa de reeducação em violência psicológica.", "titulo_pt": "Formalização de Gonzalo Feito por maltrato habitual e suspensão condicionada", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 138286, "titulo": "WHO raises concerns over amputees and deteriorating water quality in Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/who-raises-concern-over-deteriorating-water-quality-water-contamination", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) expressou preocupações sobre a qualidade da água deteriorada e a contaminação na Faixa de Gaza, com riscos de doenças aumentando. Entre janeiro e agosto deste ano, mais de 6.700 amostras de água foram testadas e a contaminação microbiológica quase triplicou, passando de menos de seis por cento em janeiro para mais de 18 por cento em agosto.", "titulo_pt": "OMS se preocupa com amputados e qualidade da água deteriorada em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 137893, "titulo": "La desconocida investigación sobre adopciones irregulares en dictadura que hizo Mónica Madariaga en los años 80", "url": "https://www.ciperchile.cl/2026/09/01/la-desconocida-investigacion-sobre-adopciones-irregulares-en-dictadura-que-hizo-monica-madariaga-en-los-anos-80/?utm_source=rss&utm_medium=rss&utm_c
