<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "26/08/2026 15:32", "stats": {"noticias_novas": 969, "resumos_gerados": 246}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo Lula prorrogou o subsídio à gasolina até 9 de setembro, mantendo a subvenção em R$ 0,44 para controlar o preço do combustível. Em outra frente, a Procuradoria-Geral da República vai decidir se federaliza o caso Mari Ferrer, após o Instituto Pró-Vítima apresentar uma ação pedindo intervenção. No cenário eleitoral, Lula lidera com 46% das intenções de voto contra 41% de Flávio Bolsonaro no segundo turno, segundo pesquisa Indexa/Broadcast. Além disso, o governo apresentou propostas para reforma do Judiciário, como mandato para ministros e transparência com a ajuda de inteligência artificial (IA), ao Supremo Tribunal Federal (STF). O governo também divulgou telefones de emergência para brasileiros em áreas afetadas por deslizamentos de terra e enchentes no Nepal e no Tibete, mostrando preocupação com a segurança de cidadãos no exterior.", "mundo": "Um desastre natural atingiu o vale do rio Himalaia, entre Nepal e a região tibetana da China, causando pelo menos 98 mortes e centenas de desaparecidos, incluindo muitos estrangeiros. O evento, que pode ter sido causado por uma avalanche de gelo, afetou principalmente as áreas próximas ao rio Bhotekoshi, na fronteira entre os dois países. O presidente Luiz Inácio Lula da Silva expressou solidariedade às vítimas e às autoridades do Nepal e da China. Em outro desenvolvimento, o Irã afirmou que locais nucleares atacados não são seguros para inspeções da AIEA, a menos que se desenvolva um protocolo específico de inspeção e a segurança desses locais seja garantida. Além disso, a Coreia do Sul evacuou 10 de seus cidadãos presos devido às inundações na Nepal. Por fim, o banco Melli, o maior do Irã, enfrenta intensificação de sanções dos EUA, com o objetivo de impedir sua capacidade de operar internacionalmente, após 19 anos de restrições.\n\nA situação geopolítica na região do Oriente Médio e na Ucrânia continua a dominar os acontecimentos. O Irã e Omã chegaram a um acordo para compartilhar a receita do tráfego pelo Estreito de Ormuz, mas a reabertura da via dependerá da aceitação das condições impostas pelos Estados Unidos, conforme comunicado do Corpo da Guarda Revolucionária Islâmica. Em contraste, Israel continua ocupando um centro da UNRWA em Jerusalém Oriental por mais um dia, com relatos de soldados elevando a bandeira israelense no local. O governo local informou que equipes municipais israelenses entraram no prédio para trabalhos de manutenção e renovação, preparando-o para receber estudantes israelenses, o que foi condenado pela ONU. Além disso, o Kremlin está avaliando a possibilidade de ampliar os ataques com mísseis contra Kiev e outras cidades ucranianas devido ao impasse nas negociações de paz com os Estados Unidos e a Ucrânia.", "economia": "A inflação nos Estados Unidos permaneceu alta em julho, com a taxa anual acima da meta do Federal Reserve pelo 65º mês consecutivo, influenciada pela guerra com o Irã. A Meta alcançou um acordo com procuradores de estados americanos, incluindo a Califórnia, pagando 16,7 bilhões de dólares para resolver o caso de adicção à mídia social. Em outro desenvolvimento econômico, o campo de Búzios, da Petrobras, bateu recordes de exportação de gás natural em agosto, com uma média diária superior a 10 milhões de metros cúbicos. Além disso, a Caixa Econômica Federal realizou o pagamento da parcela de agosto do Bolsa Família para beneficiários com NIS final 7, beneficiando 19,3 milhões de famílias.", "tecnologia": "Uma pesquisa recente da Taipei Times indica que os jovens estão passando o mesmo tempo online que os funcionários no trabalho, evidenciando a crescente dependência digital. A Jota revela que a inclusão da inteligência artificial (IA) nas camadas sociais mais baixas ainda é limitada, com apenas 16% das pessoas nas classes D e E utilizando a tecnologia. A SpaceX está em desenvolvimento e planeja construir um complexo de lançamento de foguetes no sul da Louisiana, nos Estados Unidos, com um investimento de US$ 100 bilhões. Este complexo servirá como base para lançamentos do Starship e de satélites de IA. A Meta concordou em pagar até US$ 18 bilhões para resolver um caso relacionado a supostas falhas na proteção de crianças em redes sociais, em um acordo histórico que visa implementar medidas de segurança abrangentes na indústria. A empresa anunciou ainda um 'modo escola' e o veto ao uso de filtros de beleza para adolescentes em suas plataformas. Segundo o Exame, a latência, a escolha do modelo e a infraestrutura podem afetar o custo das aplicações de IA nas empresas. A OpenAI's Jalapeño AI chip superou os sistemas Blackwell da Nvidia em testes de eficiência de inferência-chave, indicando um avanço significativo na utilização de silício personalizado para IA. A SpaceX planeja construir um complexo de lançamento de foguetes no sul da Louisiana, nos Estados Unidos, com um investimento de US$ 100 bilhões, servindo como base para lançamentos do Starship e de satélites de IA. A latência, a escolha do modelo e a infraestrutura podem afetar o custo das aplicações de inteligência artificial nas empresas, conforme exposto pelo Exame.", "ciencia": "Os EUA aprovaram um novo medicamento que aumenta em 90% o tempo de vida dos pacientes com câncer de pâncreas, atuando em uma mutação presente em grande parte dos adenocarcinomas pancreáticos, conforme informa [veja]. Em outra notícia científica, a NASA começou a testar o comportamento da pluma de um foguete de pouso lunar na superfície lunar, com o objetivo de melhorar a compreensão dos riscos associados a essas interações durante o pouso, conforme relata [nasa_news]. Além disso, a Blue Canyon Technologies, uma divisão da RTX, apresentou um novo subsistema de satélite que expande as capacidades de missão espacial, conforme noticia [spacenews].", "cultura": "Dolly Parton, lendária cantora country, faleceu aos 80 anos após uma longa batalha contra o câncer, deixando um legado inigualável para a música americana. Taylor Swift fez uma emocionante homenagem à artista, destacando sua versatilidade e impacto na indústria. Em um tributo coletivo, músicos como kd lang, Peggy Seeger, Annie Lennox e Shirley Collins celebraram a carreira de Parton, destacando sua habilidade como empreendedora, filantropa e pessoa gentil. Outros eventos culturais notáveis incluem a morte do ator Tim Curry, conhecido por seu papel em 'The Rocky Horror Picture Show' e 'It', além da exposição de arte rupestre de Murujuga, que sofreu danos devido a emissões históricas de sulfeto de dióxido. Um projeto arquitetônico inovador foi realizado por Interior Architects em San Francisco, projetando um escritório no estilo Craftsman para a empresa de inteligência artificial Notion, combinando detalhes tradicionais com uma aparência minimalista tecnológica.", "sociedade": "Um motorista de aplicativo foi mantido em prisão preventiva após abusar de uma jovem de 18 anos durante uma corrida em Guarujá, conforme informou o Metrópoles. Em outro caso, um policial militar foi preso após tentar assassinar um policial civil com um tiro na cabeça durante a execução de um mandado de prisão preventiva no bairro Fazenda Grande do Retiro, em Salvador (BA), relatado pelo Metrópoles. A secretária de Cultura do Rio de Janeiro, Danielle Barros, participou de uma campanha política em favor do seu irmão, que concorre a deputado, enquanto o governador autorizou a atuação dela na campanha, informou o Veja. No Brasil, o número de estudantes de origem imigrante em ensino fundamental, médio e superior atingiu um novo recorde, segundo o Yonhap News. Além disso, um estudo indica que a discriminação e a desigualdade econômica podem custar 0,8% do PIB, reduzindo a produtividade, excluindo trabalhadores e limitando a formação de capital humano, publicado no Exame.", "meio_ambiente": "Inundações devastadoras atingiram o Nepal e a China, deixando pelo menos 98 mortos e centenas desaparecidos. O temporal causou alagamentos e deslizamentos de terra, danificando estradas, pontes e projetos de energia. As autoridades alertam para o risco de uma segunda inundação, com o rio Himalaia ainda bloqueado por detritos. No Brasil, o número de empresas que divulgam dados sobre emissões de carbono atingiu um novo recorde, refletindo a crescente preocupação com o meio ambiente. A Europa também registrou uma elevação significativa de mortes devido ao calor, com pelo menos 35.000 mortes adicionais em decorrência das altas temperaturas.", "direitos_humanos": "Os direitos humanos estão em pauta em diversos contextos ao redor do mundo, conforme relatos recentes. No Brasil, o Mapa Nacional da Violência de Gênero mostra que quase 29 milhões de mulheres relataram ter passado por situações de violência em um período de 12 meses, embora apenas 13% das vítimas reconhecessem essas situações como violência. Em Myanmar, a situação humanitária atingiu um novo nível, com a junta governante enfrentando críticas internacionais por sua gestão após o golpe de 2021, incluindo violações de direitos humanos relacionadas à atividade ilegal de mineração e estelionato. No Paquistão, um incêndio em um hospital resultou na morte de pelo menos 14 bebês recém-nascidos, destacando a necessidade de melhorias na segurança hospitalar. Em outro contexto, a comunidade sorda no Chile enfrenta exclusão no sistema judicial devido à falta de acesso à sua própria língua. Estes relatos refletem uma série de desafios relacionados aos direitos humanos em diferentes regiões do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 125214, "titulo": "Governo divulga telefones de emergência para brasileiros no Nepal e no Tibete após enchentes e deslizamentos", "url": "https://g1.globo.com/politica/noticia/2026/08/26/governo-divulga-telefones-de-emergencia-para-brasileiros-no-nepal-e-no-tibete-apos-enchentes-e-deslizamentos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-26T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itamaraty divulgou telefones de emergência para brasileiros no Nepal e no Tibete após deslizamentos de terra e enchentes. O governo brasileiro expressou consternação com a tragédia causada por um terremoto que resultou em mortes e desaparecidos.", "titulo_pt": "Governo divulga telefones de emergência para brasileiros no Nepal e no Tibete após deslizamentos e enchentes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 125287, "titulo": "PGR vai decidir se pede federalização do caso Mari Ferrer", "url": "https://veja.abril.com.br/brasil/pgr-vai-decidir-se-pede-federalizacao-do-caso-mari-ferrer/", "fonte_id": "veja", "data_pub": "2026-08-26T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Pró-Vítima apresentou uma ação à Procuradoria-Geral da República pedindo que o caso Mari Ferrer seja federalizado. O Ministério Público Federal decidirá se intervirá no processo que está sendo retomado na justiça catarinense.", "titulo_pt": "PGR decidirá sobre federalização do caso Mari Ferrer", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 125215, "titulo": "Governo prorroga subsídio à gasolina até 9 de setembro", "url": "https://g1.globo.com/economia/noticia/2026/08/26/governo-prorroga-subsidio-a-gasolina-ate-9-de-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-26T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo prorrogou o subsídio à gasolina até 9 de setembro, mantendo a subvenção em R$ 0,44 para controlar o preço do combustível. Este subsídio visa reduzir o impacto da alta do petróleo nos preços pagos pelos consumidores.", "titulo_pt": "Governo prorroga subsídio à gasolina até 9 de setembro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 125497, "titulo": "O triunfo e a morte anunciada do novo STJ", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-triunfo-e-a-morte-anunciada-do-novo-stj", "fonte_id": "jota", "data_pub": "2026-08-26T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a autoridade final sobre tratados e leis federais no novo STJ.", "titulo_pt": "O triunfo e a morte anunciada do novo STJ", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 125216, "titulo": "Reforma do Judiciário: STF recebe sugestões que pedem mandato de ministros, revisão de competência e transparência com IA", "url": "https://g1.globo.com/politica/noticia/2026/08/26/reforma-do-judiciario-stf-recebe-sugestoes-que-pedem-revisao-de-competencia-da-corte-mandato-para-ministros-e-transparencia-com-ia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-26T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF recebeu 87 propostas para a reforma do Judiciário, que incluem sugestões como mandato para ministros, limitação de decisões individuais e transparência com IA. As ideias buscam melhorar o julgamento colegiado e criar novos mecanismos de controle e responsabilização.", "titulo_pt": "Reforma do Judiciário: STF recebe sugestões com mandato para ministros e transparência com IA", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 125173, "titulo": "Conselho Nacional de Direitos Humanos cobra apuração sobre linchamento de ciclista no Rio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/conselho-nacional-de-direitos-humanos-cobra-apuracao-sobre-linchamento-de-ciclista-no-rio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Direitos Humanos solicitou uma investigação rigorosa sobre o linchamento e a morte do ciclista Cláudio Rafael, ocorridos em 11 de agosto no Rio de Janeiro.", "titulo_pt": "Conselho Nacional de Direitos Humanos cobra apuração sobre linchamento de ciclista no Rio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 125174, "titulo": "Lula vai ao TSE contra Renan Santos e Caiado por ataques em debate e pede retirada de posts em redes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-vai-ao-tse-contra-renan-santos-e-caiado-por-ataques-em-debate-e-pede-retirada-de-posts-em-redes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula acionou o TSE contra Renan Santos e Ronaldo Caiado por ataques feitos durante um debate. Os petistas pediram a retirada de posts ofensivos nas redes sociais dos adversários.", "titulo_pt": "Lula aciona TSE contra Renan Santos e Caiado por ataques em debate", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 125217, "titulo": "Candidatos descumprem lei eleitoral e excedem limite para financiar a própria campanha", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/26/candidatos-descumprem-lei-eleitoral-e-excedem-limite-para-financiar-a-propria-campanha.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-26T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) registrou que 1.768 candidatos declararam doações para suas próprias campanhas até o momento, com dois deles ultrapassando o limite legal. A lei permite que os candidatos utilizem fundos próprios, mas estabelece um limite para esse tipo de autofinanciamento.", "titulo_pt": "Candidatos descumprem lei eleitoral ao exceder limite de autofinanciamento", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 125371, "titulo": "Indexa: 49% dizem que jamais votariam em Lula, mesmo índice de Flávio", "url": "https://www.cnnbrasil.com.br/eleicoes/indexa-49-dizem-que-jamais-votariam-em-lula-mesmo-indice-de-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado entre os dias 20 e 23 de agosto com 2.000 eleitores pelo país inteiro indicou que 49% disseram que jamais votariam em Lula, um índice similar ao de Flávio.", "titulo_pt": "49% Dizem que jamais votariam em Lula, índice igual ao de Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125175, "titulo": "Lobista pediu ação de Lulinha para fechar negócios de Careca do INSS com governo, diz PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lobista-pediu-acao-de-lulinha-para-fechar-negocios-de-careca-do-inss-com-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal informou que a lobista Roberta Luchsinger pediu a intervenção do filho do presidente Lula, Fábio Luís Lula da Silva, para tentar negociar negócios de interesse de Antônio Camilo Antunes, conhecido como Careca do INSS, com o Ministério da Saúde.", "titulo_pt": "Lobista pediu intervenção de Lulinha para fechar negócios de Careca com governo, diz PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 125186, "titulo": "ECA Digital e os desafios da proteção social na internet", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/politicas-e-justica/2026/08/eca-digital-e-os-desafios-da-protecao-social-na-internet.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a proteção de crianças e adolescentes na internet, destacando a importância de transformar regras em mecanismos eficazes. O debate frequentemente se concentra na responsabilização das plataformas ou na necessidade de novas regras, mas o foco deve ser também na implementação efetiva dessas medidas.", "titulo_pt": "ECA Digital e os desafios da proteção social na internet", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125176, "titulo": "Na 1ª semana de campanha nas redes, Lula reforça trajetória, e Flávio soma ataques diretos a petista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/na-1a-semana-de-campanha-nas-redes-lula-reforca-trajetoria-e-flavio-soma-ataques-diretos-a-petista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na primeira semana de campanha nas redes sociais, Lula enfatizou sua trajetória política, enquanto Flávio Bolsonaro fez ataques diretos ao petista.", "titulo_pt": "Na 1ª semana de campanha nas redes, Lula reforça trajetória, e Flávio soma ataques diretos a petista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 125177, "titulo": "Consultor conhecido por usar robôs disse que lutaria por Flávio Bolsonaro, afirma ex-companheira", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/consultor-conhecido-por-usar-robos-disse-que-lutaria-por-flavio-bolsonaro-afirma-ex-companheira.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O consultor político argentino Fernando Cerimedo, conhecido por usar robôs em campanhas eleitorais, afirmou à sua ex-companheira que se disporia a ajudar o senador Flávio Bolsonaro nas eleições de 2026, conforme relatado por ela à Folha em entrevista.", "titulo_pt": "Ex-companheira afirma que consultor de campanhas prometeu ajudar Flávio Bolsonaro nas eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 125219, "titulo": "Quaest em RO: veja intenção de voto por gênero, idade, escolaridade, renda, cor, religião e posicionamento político", "url": "https://g1.globo.com/ro/rondonia/eleicoes/2026/noticia/2026/08/26/quaest-em-ro-veja-intencao-de-voto-por-genero-idade-escolaridade-renda-cor-religiao-e-posicionamento-politico.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-26T15:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada em 25 de agosto de 2026 mostrou as intenções de voto para o governo de Rondônia, com Marcos Rogério e Adailton Furia tecnicamente empatados com 24% e 21% respectivamente. O PT e a União aparecem com 10% cada, seguidos por Samuel Costa e Pedro Abib com 2% e 1% respectivamente.", "titulo_pt": "Quaest em RO: veja intenção de voto por gênero, idade, escolaridade, renda, cor, religião e posicionamento político", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 125220, "titulo": "TRE-SP reverte uma das decisões que condenaram Pablo Marçal à inelegibilidade", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/26/tre-sp-reverte-uma-das-decisoes-que-condenaram-pablo-marcal-a-inelegibilidade.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-26T15:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral de São Paulo (TRE-SP) reverteu uma decisão que condena e Ormuz", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 125710, "titulo": "Exclusive: French astronaut Sophie Adenot recounts her ‘miracle’ mission from orbiting ISS", "url": "https://www.france24.com/en/tv-shows/the-interview/20260826-exclusive-french-astronaut-sophie-adenot-recounts-her-miracle-mission-from-orbiting-iss", "fonte_id": "france24", "data_pub": "2026-08-26T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astronauta francesa Sophie Adenot, em entrevista exclusiva à FRANCE 24 e à RFI, do International Space Station, declarou que sua missão foi um 'sucesso' após duas caminhadas espaciais para substituir uma antena defeituosa. Ela também mencionou as evidências 'visíveis' do aquecimento global que observou do espaço.", "titulo_pt": "Astronauta francesa comemora missão bem-sucedida e registra sinais de mudanças climáticas do espaço", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 125846, "titulo": "Polizia Nepal, 'recuperati 157 corpi dalle zone colpite dall'alluvione'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/26/polizia-nepal-recuperati-157-corpi-dalle-zone-colpite-dallalluvione_fb597286-a6d9-4afe-9a36-3737a2f2aa04.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-26T17:47:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Foram recuperados 157 corpos nas áreas afetadas pela cheia no Nepal. No hospital, 49 pessoas estão feridas.", "titulo_pt": "Polícia do Nepal recupera 157 corpos nas áreas afetadas pela cheia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 125813, "titulo": "US designates Palestine Action activist group 'Specially Designated Global Terrorist'", "url": "https://www.middleeasteye.net/news/us-designates-palestine-action-specially-designated-global-terrorist", "fonte_id": "middle_east_eye", "data_pub": "2026-08-26T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos designou o grupo de ativistas palestinos Palestine Action como 'Specially Designated Global Terrorist' (SDGT). Essa medida faz parte das ações do governo para combater organizações que ele considera terroristas.", "titulo_pt": "EUA designam grupo de ativistas palestinos 'Specially Designated Global Terrorist'", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 125732, "titulo": "Ukraine airstrike on bus in Russian-occupied Luhansk kills 9", "url": "https://www.dw.com/en/ukraine-airstrike-on-bus-in-russian-occupied-luhansk-kills-9/a-78516673?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-26T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque aéreo com drone em um ônibus na Luhansk, ocupada pela Rússia, resultou em nove mortes. Autoridades russas na área ocupada informam que houve feridos. Kyiv também destruiu outro depósito da Wildberries.", "titulo_pt": "Ataque aéreo com drone em ônibus na Luhansk, ocupada pela Rússia, mata nove", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 125410, "titulo": "Putin prepara escalada na guerra contra Ucrânia após fracasso das negociações de paz", "url": "https://www.infomoney.com.br/mundo/putin-prepara-escalada-na-guerra-contra-ucrania-apos-fracasso-das-negociacoes-de-paz/", "fonte_id": "infomoney", "data_pub": "2026-08-26T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Kremlin está avaliando a possibilidade de ampliar os ataques com mísseis contra Kiev e outras cidades ucranianas devido ao impasse nas negociações de paz com os Estados Unidos e a Ucrânia.", "titulo_pt": "Putin prepara escalada na guerra contra Ucrânia após falha nas negociações de paz", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 125613, "titulo": "Greetings from Karbala, Iraq, where millions gathered for a Shia pilgrimage", "url": "https://www.npr.org/2026/08/26/g-s1-138982/karbala-iraq-arbaeen-shia-muslims", "font "}, {"id": 125514, "titulo": "Los primeros detenidos por el fraude de la UNAM son dos operadores de una academia que hicieron el examen por los alumnos", "url": "https://elpais.com/mexico/2026-08-26/los-primeros-detenidos-por-el-fraude-de-la-unam-son-dos-operadores-de-una-academia-que-hicieron-el-examen-por-los-alumnos.html", "fonte_id": "elpais_america", "data_pub": "2026-08-26T17:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria da Cidade do México deteve duas pessoas suspeitas de cobrar alunos para responder às perguntas do exame em nome deles. Segundo a autoridade, esses indivíduos contaram com o apoio de instrutores.", "titulo_pt": "Primeiros detidos no escândalo da UNAM são dois operadores de uma academia que fizeram o exame pelos alunos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 125696, "titulo": "German airport worker dies of malaria after 'mosquito arrives on plane'", "url": "https://www.bbc.co.uk/news/articles/cz6zwgg9y8go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-26T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um trabalhador do aeroporto na Alemanha morreu de malária após uma explosão rara de casos no principal aeroporto do país. Cinco outros funcionários também estão sendo tratados.", "titulo_pt": "Trabalhador do aeroporto morre de malária após 'mosquito chegar no avião'", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 125939, "titulo": "(LEAD) U.S. official says 'no change' in U.S. policy toward N. Korea amid denuclearization concerns", "url": "https://en.yna.co.kr/view/AEN20260827000351315", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um funcionário dos Estados Unidos declarou na sexta-feira que não houve mudanças na política dos EUA em relação à Coreia do Norte, apesar das preocupações com a desnuclearização.", "titulo_p
