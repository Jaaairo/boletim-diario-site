<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "20/09/2026 15:23", "stats": {"noticias_novas": 894, "resumos_gerados": 237}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva viaja para Nova York para a 81ª Assembleia Geral da ONU, onde defende o multilateralismo e a reforma do Conselho de Segurança. Este evento acontece em um cenário eleitoral turbulento, com Flávio Bolsonaro movendo uma ação contra Lula no Tribunal Superior Eleitoral por supostas irregularidades durante o Carnaval do Rio. A Medida Provisória que limita as apostas online divide o governo, com o presidente e a Secom a favor, e o Ministério da Fazenda contra, alegando perda de arrecadação. Michelle lidera a corrida para o Senado no Distrito Federal, enquanto Celina tem 41,5% dos votos. O ministro Alexandre de Moraes e sua esposa, Viviane Barci, foram vistos desembarcando de um avião de uma empresa associada a Daniel Vorcaro, do Banco Master, o que pode sugerir um conflito de interesses. O governador Ronaldo Caiado considera reorientar sua estratégia para Goiás nas últimas semanas da campanha, enquanto a indústria de apostas enfatiza os possíveis prejuízos da restrição à publicidade de apostas online.", "mundo": "Na Alemanha, o partido conservador CDU, liderado por Friedrich Merz, sofreu significativas derrotas nas eleições regionais, com o partido de extrema-direita AfD conquistando vitórias importantes. Apesar dos resultados negativos, Merz declarou que continuará a liderar o partido. Em contraste, o governo alemão, liderado por Friedrich Merz, também enfrentou derrotas em duas eleições estaduais, com o partido perdendo votos. Em outro desenvolvimento, o Irã enviou uma nova proposta de negociação aos Estados Unidos com o objetivo de encerrar a guerra entre os países. A Coreia do Norte realizou testes de mísseis balísticos, intensificando as tensões regionais. Além disso, a Rússia intensificou os ataques à Ucrânia em resposta a ataques recentes, e a Coreia do Norte disparou dois mísseis em sua costa leste, aumentando a tensão na península coreana.\n\nA Ucrânia intensificou sua ofensiva contra a Rússia, realizando o maior ataque aéreo já registrado com drones, que resultou na morte de dois civis e danos em uma refinaria de petróleo. Este ataque ocorreu no último dia das eleições parlamentares russas, com o objetivo de fortalecer o controle do poder pelo Kremlin após quatro anos e meio de guerra. Em resposta, a Rússia informou ter interceptado e destruído mais de 1.600 drones, incluindo 450 direcionados a Moscou. Paralelamente, a Coreia do Norte realizou testes de mísseis balísticos, reafirmando seu status nuclear e desafiando uma resolução da ONU. A região do Oriente Médio enfrenta tensões, com Israel realizando operações em território palestino e o Qatar condenando ataques de mísseis do grupo Houthis contra a Arábia Saudita. As tensões geopolíticas continuam a crescer, com o Reino Unido alertando para o risco de um conflito na Europa que a população ainda não está preparada para enfrentar.", "economia": "A economia global enfrenta desafios significativos, principalmente relacionados à inflação. A tecnologia artificial inteligente (IA) é vista como uma ferramenta potencial para aliviar a pressão inflacionária, conforme relatado pelo Taipei Times. Em outro desenvolvimento, a empresária Tatyana Kim, a mulher mais rica da Rússia, viu sua fortuna diminuir acentuadamente devido a ataques com drones, com prejuízos estimados em 550 bilhões de rublos, informa a Infomoney. A FAO alerta para o aumento do índice de preços globais de alimentos, com a possibilidade de um fenômeno climático intenso, o El Niño, agravar a situação, conforme o CNN Brasil. Nos Estados Unidos, o Federal Reserve elevou as taxas de juros em um quarto de ponto percentual, mantendo a inflação alta em todos os setores, de acordo com a Infomoney. O governo dos Estados Unidos espera empreender cerca de 1 trilhão de dólares em títulos do tesouro a curto prazo, refletindo a crescente dependência de financiamento a prazo, informa o Financial Times. No Brasil, a diferença de juros entre o país e os Estados Unidos diminuiu, mas os ativos locais continuam atrativos para investidores estrangeiros, conforme o Folha Mercado. A Volkswagen reduziu suas projeções de receita para 2026, refletindo impactos da China e tarifas, enquanto o Grupo Capim Santo assume a operação gastronômica da Reserva Morros Verdes, visando expansão, relata o Exame. A crise na Escócia e mudanças nos hábitos de consumo ameaçam o setor de uísque, com a Holyrood Distillery enfrentando desafios, enquanto o varejo físico enfrenta concorrência online, precisando se adaptar com experiências únicas, destaca o Folha Mercado.", "tecnologia": "O Brasil tem desempenhado um papel importante no avanço da inteligência artificial (IA) na matemática, conforme discutido por Marcelo Viana, diretor-geral do IMPA, em um artigo publicado na Folha. A IA também está sendo aplicada na pecuária, com criadores utilizando programas para analisar dados zootécnicos de reprodutores, o que facilita a escolha do touro ideal para melhorar o rebanho. A tecnologia de IA está ganhando destaque em discussões sobre segurança cibernética, com especialistas alertando sobre os riscos potenciais de sistemas de IA maliciosos. No cenário geopolítico, a criação de uma 'Força AI' nos Estados Unidos, anunciada por Donald Trump, pode representar uma escalada na disputa tecnológica com a China, conforme analisado por especialistas. Além disso, a IA está sendo usada para gerar conteúdo de vídeo de alta qualidade, com a designer de motion graphics Kim Gryun destacando a responsabilidade dos profissionais nessa área de produzir conteúdo original.", "ciencia": "Um estudo recente mostrou que a exposição pré-natal a certos elementos raras pode aumentar significativamente o risco de nascimento com baixo peso, com alguns compostos elevando o risco mais de três vezes. Os cientistas da NASA descobriram que a Terra pode ter ficado sem a proteção do Sol há milhões de anos, devido a nuvens interestelares que comprimiram a heliosfera, deixando a Terra temporariamente exposta ao ambiente da Via Láctea. Outros estudos sugerem que a atividade solar varia entre períodos turbulentos e calmos, mas prever o pico solar exato e sua intensidade continua sendo um desafio. Além disso, pesquisas indicam que a mitocôndria, estruturas que convertem nutrientes em energia, formam uma rede dinâmica e interconectada, e podem ser simuladas por modelos de inteligência artificial em 4D, acelerando o processo de descoberta de medicamentos. Também foi descoberto que os anéis de Saturno são estruturas dinâmicas que surgem e se dissipam conforme as circunstâncias, e que os anéis de Calisto podem ser o mesmo caso. Além disso, um estudo com camundongos idosos observou um aumento de 12% na longevidade após o uso de uma substância emagrecedora, levantando a possibilidade de um efeito semelhante em humanos. Finalmente, um experimento de décadas da NIST resultou em uma nova medição do constante gravitacional universal que difere de outra medida dominante, aprofundando um mistério físico de 225 anos, levando os cientistas a questionarem possíveis erros experimentais ou algo mais surpreendente.", "cultura": "O Festival de Toronto concedeu o People's Choice Award ao filme 'A Bola Negra', enquanto 'Angh' venceu na seção Platform, destacando-se nas premiações internacionais. Em Brasília, o 59º Festival do Cinema Brasileiro premiou 'Se Eu Fosse Vivo... Vivia', reafirmando a força do cinema nacional. A Rádio MEC exibiu episódios do programa Roda de Choro, celebrou o trabalho do flautista Altamiro Carrilho e apresentou a ópera 'Salvator Rosa', de Carlos Gomes, com regência de Maurizio Benini. A Casa do Leitor, uma livraria fundada em Bom Jesus dos Perdões, promove debates públicos e leitura na cidade, transformando a vida cultural local. O filme 'Feito Pipa', dirigido por Allan Deberton, será o representante do Brasil no Oscar 2027, abordando temas como identidade de gênero e relação entre avó e neto. A ópera 'Chica da Silva' humaniza a personagem, desviando do mito tradicional, enquanto a peça 'Not I' destaca a performance de Soprano Claire Booth, interpretando a boca de uma mulher desesperada em uma cena isolada. O artigo '50 Songs That Explain America' explora 50 músicas que ilustram a essência cultural dos Estados Unidos, variando desde a música de Sinatra até a de SZA, passando por folk da Appalachia e funk de Detroit. Além disso, a influenciadora Rachel Accurso, conhecida por vídeos com bebês, fala sobre seus objetivos e controvérsias em seu trabalho. Ed Sheeran, em seu show em Filadélfia, abordou a situação em Gaza, chamando-a de 'catastrófica e injustificável'.", "sociedade": "Um homem foi condenado à prisão por matar peixes em um templo local, destacando a importância da preservação ambiental e do respeito às instituições religiosas. Horacio 'Chacho' Asensio, treinador de hóquei, foi detido por supostamente abusar sexualmente de três adolescentes entre 2012 e 2013, quando estava à frente de um time em Monte Hermoso, evidenciando a necessidade de proteção e segurança para menores. Em Quintero, um motorista embriagado causou um acidente que deixou uma pessoa em estado grave e sete feridos, reforçando os riscos da condução sob efeito de álcool. Um ônibus que transportava romeiros caiu em uma ribanceira no Ceará, resultando em seis mortes, levantando questões sobre a segurança de passageiros em viagens religiosas. A detenção de um homem de 53 anos, chileno, por lesões graves causadas a duas mulheres em Tomé, usando uma arma cortopunzante, reforça a importância da aplicação da lei e da proteção das mulheres. A luta de uma mãe por esclarecimentos sobre a morte de sua filha em um local onde ela morava com o namorado, João Munhoz, no Ceará, reflete a busca constante por justiça e transparência em casos de mortes misteriosas. Estes eventos abrangem diversos aspectos da sociedade, incluindo crimes, segurança, justiça e a busca por respostas em casos de mortes inexplicadas, refletindo os desafios atuais enfrentados pela sociedade.", "meio_ambiente": "A cidade turística de Villa de Leyva, na Colômbia, está enfrentando incêndios florestais devido a temperaturas recordistas causadas pelo El Niño e a condições de seca. O antigo aterro sanitário de Luján, o maior da Argentina, parou de receber resíduos a partir de 1º de julho, e as mudanças já são perceptíveis.", "direitos_humanos": "A Organização das Nações Unidas condenou o uso de violência sexual pelos tropas russas na Ucrânia, classificando a prática como crime de guerra e crime contra a humanidade. Em outro desenvolvimento, centenas de mulheres iranianas desafiaram a lei do véu durante uma corrida de 10K em Teerã, demonstrando resistência contra as restrições do governo. Em um contexto mais amplo, a Human Rights Watch observou uma pausa na repressão explícita no Venezuela sob o presidente Nicolás Maduro, mas alertou para a necessidade de reformas institucionais e libertação de presos políticos. Além disso, a escassez de medicamentos, como insulina, afetou a vida de Ali Mohseni e sua mãe em Teerã, devido a tensões na região. Por fim, a ICE (Banco de Execuções de Imigração) coordena com a TSA (Administração de Segurança do Transporte) a detenção de estrangeiros em voos domésticos e internacionais, em uma operação que envolve a cooperação entre as duas agências para identificar e remover ilegalmente presentes do país."}, "resumo_do_dia": {"politica_nacional": [{"id": 171995, "titulo": "Vídeo mostra Moraes desembarcando de jatinho de empresa de Vorcaro; avião foi apontado pela PF como pagamento ao escritório da esposa do ministro", "url": "https://g1.globo.com/politica/noticia/2026/09/20/video-mostra-moraes-desembarcando-de-jatinho-de-empresa-de-vorcaro-aviao-foi-apontado-pela-pf-como-pagamento-ao-escritorio-da-esposa-do-ministro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-20T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do Supremo Tribunal Federal, e sua esposa, a advogada Viviane Barci, viajaram em um avião de uma empresa que tinha Daniel Vorcaro, do Banco Master, como sócio. O voo ocorreu em 22 de agosto de 2025 e foi registrado em um vídeo publicado pela coluna do jornalista Lauro Jardim.", "titulo_pt": "Vídeo mostra Moraes e esposa desembarcando de avião de empresa com sócio do banco master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 171958, "titulo": "PT rebate governo do DF e diz que não há chance de aval federal para apoiar BRB", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/pt-rebate-governo-do-df-e-diz-que-nao-ha-chance-de-aval-federal-para-apoiar-brb.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT rebateu o governo do Distrito Federal, negando qualquer possibilidade de apoio financeiro federal para o BRB. O governo Lula não se dispõe a ajudar a recuperação financeira do banco após o rombo causado pelas operações com o Banco Master.", "titulo_pt": "PT rebate governo do DF e nega chance de apoio federal para BRB", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 172064, "titulo": "Igape/Record: Michelle lidera ao Senado; Bia e Leila empatam em 2º", "url": "https://www.metropoles.com/colunas/grande-angular/igape-record-michelle-lidera-ao-senado-bia-e-leila-empatam-em-2o", "fonte_id": "metropoles", "data_pub": "2026-09-20T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Igape, encomendada pela Record, foi realizada no Distrito Federal entre os dias 15 e 19 de setembro. Michelle lidera na intenção de voto para o Senado, enquanto Bia e Leila estão empatadas em segundo lugar.", "titulo_pt": "Michelle lidera no Senado; Bia e Leila empatam em segundo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 172115, "titulo": "TSE analisará ação contra Lula por desfile no Carnaval do Rio; entenda", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-analisara-acao-contra-lula-por-desfile-no-carnaval-do-rio-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-20T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) analisará uma ação contra Lula por desfile no Carnaval do Rio. Flávio Bolsonaro apresentou uma representação acusando o presidente de irregularidades de comunicação e de abuso de poder político e econômico.", "titulo_pt": "TSE analisará ação contra Lula por desfile no Carnaval do Rio; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 172116, "titulo": "Quem é Guilherme Theophilo, candidato ao Senado pelo Ceará", "url": "https://www.cnnbrasil.com.br/eleicoes/quem-e-guilherme-theophilo-candidato-ao-senado-pelo-ceara/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-20T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Guilherme Theophilo é um general da reserva que concorre ao Senado pelo estado do Ceará como candidato do partido Novo. Sua carreira está ligada à segurança pública e ele já disputou o governo do estado em 2018.", "titulo_pt": "Quem é Guilherme Theophilo, candidato ao Senado pelo Ceará", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 172067, "titulo": "Igape/Record: Celina tem 41,5% dos votos, Arruda soma 16,3%, e Grass, 15,8%", "url": "https://www.metropoles.com/distrito-federal/igape-record-celina-tem-415-dos-votos-arruda-soma-163-e-grass-158", "fonte_id": "metropoles", "data_pub": "2026-09-20T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Igape/Record indica que Celina tem 41,5% dos votos, Arruda soma 16,3%, e Grass, 15,8%. A margem de erro é de 2,2% e foram ouvidas 2 mil pessoas no Distrito Federal.", "titulo_pt": "Celina tem 41,5% dos votos, Arruda soma 16,3%, e Grass, 15,8%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 171981, "titulo": "Indústria de bets usa valores invesidos com publicidade e patrocínio contra ofensiva do presidente Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/industria-de-bets-usa-valores-invesidos-com-publicidade-e-patrocinio-contra-ofensiva-do-presidente-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria de apostas enfatiza os possíveis prejuízos da restrição à publicidade de bets, antes da assinatura da medida provisória pelo presidente Lula que proíbe cassinos online e endurece as regras de publicidade das apostas esportivas.", "titulo_pt": "Indústria de bets argumenta contra restrição à publicidade antes de Lula assinar medida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171959, "titulo": "Vídeo registra Alexandre de Moraes saindo de avião de Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/video-registra-alexandre-de-moraes-saindo-de-aviao-de-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Alexandre de Moraes e sua esposa, Viviane Barci de Moraes, aparecem em um vídeo desembarcando de um avião pertencente a Daniel Vorcaro, dono do Banco Master, em agosto de 2025.", "titulo_pt": "Vídeo registra Alexandre de Moraes saindo de avião de Vorcaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171960, "titulo": "Baiana que vive em Aracaju diz que Bolsa Família ajuda, mas não define escolha eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/baiana-que-vive-em-aracaju-diz-que-bolsa-familia-ajuda-mas-nao-define-escolha-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T15:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A baiana Laiza Sousa, beneficiária do Bolsa Família, reconhece a importância do programa em sua vida, mas a distância de Aracaju a Salvador desestimula seu voto nas eleições de 4 de outubro.", "titulo_pt": "Baiana que vive em Aracaju diz que Bolsa Família ajuda, mas não incentiva voto", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171961, "titulo": "Brasil merece ter Dino presidente após 'missão no STF', diz pupilo candidato ao Governo do Maranhão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/brasil-merece-ter-dino-presidente-apos-missao-no-stf-diz-pupilo-candidato-ao-governo-do-maranhao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Felipe Camarão, candidato ao Governo do Maranhão, compara sua trajetória política com a de Flávio Dino, afirmando que o estado merece ter Dino como presidente após sua 'missão no STF'.", "titulo_pt": "Brasil merece ter Dino presidente após 'missão no STF', diz candidato ao Governo do Maranhão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171962, "titulo": "Motta faz campanha paroquial e usa relação com Lula para ampliar poder na Paraíba", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/motta-faz-campanha-paroquial-e-usa-relacao-com-lula-para-ampliar-poder-na-paraiba.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hugo Motta, presidente da Câmara dos Deputados, realizou um comício em Patos, Paraíba, em 20 de agosto, onde discursou sobre obras locais, como a construção de um hospital de traumas. O evento ocorreu na praça Edivaldo Motta, nomeada em homenagem ao avô de Motta, que também foi deputado federal.", "titulo_pt": "Motta realiza campanha em patos e fala sobre obras no município", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171982, "titulo": "Governo Lula demora mais para conceder garantia a empréstimos pleiteados por opositores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/governo-lula-demora-mais-para-conceder-garantia-a-emprestimos-pleiteados-por-opositores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula demorou mais para conceder garantia soberana a empréstimos pleiteados por estados e capitais liderados por opositores políticos, enquanto acelerou os processos para aliados. Essa diferença foi observada em empréstimos pleiteados em 9 de outubro de 2026.", "titulo_pt": "Governo Lula demora mais para conceder garantia a empréstimos pleiteados por opositores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171983, "titulo": "Como o aumento de etanol na gasolina entrou no debate eleitoral entre Lula e Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/como-o-aumento-de-etanol-na-gasolina-entrou-no-debate-eleitoral-entre-lula-e-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T15:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo aumentou o teor de etanol na gasolina, o que está provocando discussões no cenário eleitoral, com candidatos como Lula e Flávio Bolsonaro se posicionando sobre o assunto. O programa de etanol brasileiro contava com apoio político amplo por décadas, mas essa situação está mudando.", "titulo_pt": "Como o aumento de etanol na gasolina entrou no debate eleitoral entre Lula e Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171963, "titulo": "Dino determina revisão de regras da CVM sobre fundos e lavagem de dinheiro após caso Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/dino-determina-revisao-de-regras-da-cvm-sobre-fundos-e-lavagem-de-dinheiro-apos-caso-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, determinou que o governo Lula revise as regras da CVM sobre fundos de investimento e prevenção à lavagem de dinheiro. A determinação foi feita após um caso envolvendo o Master Fund, sem detalhes adicionais sobre o caso específico.", "titulo_pt": "Dino determina revisão de regras da CVM sobre fundos e lavagem de dinheiro após caso Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171964, "titulo": "MP de Lula para restringir bets divide Planalto e Fazenda", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/mp-de-lula-para-restringir-bets-divide-planalto-e-fazenda.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula (PT) se divide em relação à edição de uma Medida Provisória para restringir as apostas online, com o presidente e a Secom defendendo a proibição, enquanto o Ministério da Fazenda se opõe, alegando que isso resultaria em uma perda de arrecadação de aproximadamente R$ 12 bilhões.", "titulo_pt": "MP para restringir bets divide governo Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171965, "titulo": "TSE aceita abrir ação de Flávio Bolsonaro contra Lula por desfile no Carnaval do Rio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/tse-aceita-abrir-acao-de-flavio-bolsonaro-contra-lula-por-desfile-no-carnaval-do-rio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) aceitou uma ação de Flávio Bolsonaro contra Lula e Alckmin relacionada a supostas irregularidades no desfile da Acadêmicos de Niterói durante o Carnaval de 2026.", "titulo_pt": "TSE aceita ação de Flávio Bolsonaro contra Lula por desfile no Carnaval do Rio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 172634, "titulo": "Ukraine launches attack on Moscow", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/21/2003864611", "fonte_id": "taipei_times", "data_pub": "2026-09-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia lançou uma ofensiva contra Moscou. Este ataque é parte das operações militares em curso entre as duas nações.", "titulo_pt": "Ucrânia inicia ataque contra moscou", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 172656, "titulo": "Thousands march in France against ‘licence to kill’ draft law", "url": "https://www.scmp.com/news/world/europe/article/3368176/thousands-march-france-against-licence-kill-draft-law?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam em Paris e outras cidades francesas contra uma proposta de lei que permite o uso da força policial. A lei, criticada como um 'licença para matar', está sendo votada no Senado após aprovação na Assembleia Nacional.", "titulo_pt": "Milhares marcham em paris contra 'licença para matar' na França", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 172512, "titulo": "Iran shuts language center affiliated with French embassy in Tehran", "url": "https://www.lemonde.fr/en/international/article/2026/09/20/iran-shuts-language-center-affiliated-with-french-embassy-in-tehran_6757743_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-20T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O centro de línguas associado à embaixada francesa em Teerã foi fechado pela justiça iraniana, que acusou o centro de realizar 'atos ilegais que violaram as convenções diplomáticas'.", "titulo_pt": "Irã fecha centro de línguas afiliado à embaixada francesa em teerã", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 172574, "titulo": "German chancellor Merz vows to stay on despite ‘disastrous’ losses in regional polls", "url": "https://www.ft.com/content/d74ce82a-2a15-404a-ae3a-3921e887bab3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-20T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do partido CDU, Christian Lindner, declarou que permanecerá no cargo apesar das perdas significativas nas eleições regionais. As primeiras resultados parciais mostram que o CDU ficou acima do limite de 5% necessário para representação parlamentar na Mecklenburgo-Vorpommern.", "titulo_pt": "Líder do cdu promete permanecer, apesar de 'perdas catastróficas' nas eleições regionais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 172361, "titulo": "La extrema derecha se dispara en las elecciones regionales alemanas y agrava la crisis de la CDU", "url": "https://elpais.com/internacional/2026-09-20/la-extrema-derecha-se-dispara-en-las-elecciones-regionales-alemanas-y-profundiza-la-crisis-de-la-cdu-del-canciller-merz.html", "fonte_id": "elpais_america", "data_pub": "2026-09-20T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Na Alemanha, a extrema-direita AfD ganhou nas eleições regionais em Mecklemburgo-Pomerânia, enquanto Die Linke, partido de esquerda, venceu em Berlim. O chefe do partido CDU, Armin Laschet, chamou o resultado de Mecklemburgo-Pomerânia de desastre, mas declarou-se disposto a continuar liderando o governo.", "titulo_pt": "Extrema-direita avança nas eleições regionais alemãs e agravam crise da CDU", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 172448, "titulo": "German Chancellor Merz calls state election a 'disaster' for his party but vows to stay on", "url": "https://www.bbc.co.uk/news/articles/cvwyz29n0nn2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-20T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do partido conservador CDU, Christian Lindner, registrou significativas perdas em duas eleições estaduais em Berlim e Mecklenburgo-Vorpommern. Apesar do resultado negativo, Lindner declarou que continuará a liderar o partido.", "titulo_pt": "Chefe do cdu chama eleições estaduais de 'disaster' para o partido, mas promete permanecer", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 172329, "titulo": "Houthis Push to Expand Territory as Tensions With Saudi Arabia Rise", "url": "https://www.nytimes.com/2026/09/20/world/middleeast/saudi-arabia-yemen-houthis-fighting.html", "fonte_id": "nyt_world", "data_pub": "2026-09-20T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A milícia apoiada pelo Irã está envolvida em intensas batalhas com forças governamentais apoiadas por Arábia Saudita no Iêmen, enquanto tenta manter o impulso na guerra.", "titulo_pt": "Houthis buscam expansão de território à medida que tensões com arábia saudita aumentam", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 172274, "titulo": "Jefes de inteligencia europeos advierten sobre posibles acciones rusas contra la OTAN “en meses, no años”", "url": "https://www.latercera.com/mundo/noticia/jefes-de-inteligencia-europeos-advierten-sobre-posibles-acciones-rusas-contra-la-otan-en-meses-no-anos/", "fonte_id": "la_tercera", "data_pub": "2026-09-20T17:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Responsáveis de inteligência europeus alertaram sobre possíveis ações de Moscovo contra a OTAN nos próximos meses, variando desde sabotagens até incursões limitadas. No entanto, o chefe de segurança de Letônia não identificou sinais de um ataque iminente.", "titulo_pt": "Chefs de inteligência europeus alertam sobre possíveis ações de moscovo contra a Otan nos próximos meses", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 172621, "titulo": "Prof accoltellata a Roma, i genitori del 13enne le chiedono scusa", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/20/prof-accoltellata-a-roma-i-genitori-del-13enne-le-chiedono-scusa_a74ebd12-8f8e-4f82-a12f-a408dc798702.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-20T17:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os pais de um estudante de 13 anos enviaram uma mensagem de e-mail pedindo desculpas ao professor após uma professora ter sido ferida com uma faca no colégio em Roma.", "titulo_pt": "Professor ferida com faca em Roma, pais do aluno de 13 anos pedem desculpas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 172409, "titulo": "Germany's Merz vows to press ahead with reforms after historic state election defeat", "url": "https://www.npr.org/2026/09/20/g-s1-144211/germanys-merz-vows-to-press-ahead-with-reforms-after-historic-state-election-defeat", "fonte_id": "npr_news", "data_pub": "2026-09-20T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do governo alemão, Friedrich Merz, enfrentou uma significativa derrota eleitoral em duas eleições estaduais, com seu partido centrista-direito perdendo votos. O partido extremamente direitista Alternativa para a Alemanha conquistou importantes vitórias.", "titulo_pt": "Merz promete perseguir reformas após derrota histórica nas eleições estaduais", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 172468, "titulo": "Germany: Merz vows to \"push on despite setbacks\"", "url": "https://www.france24.com/en/tv-shows/spotlight/20260920-germany-merz-vows-to-push-on-despite-setbacks", "fonte_id": "france24", "data_pub": "2026-09-20T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O eleitorado alemão deu um novo golpe ao chancellor Friedrich Merz em duas importantes eleições regionais.", "titulo_pt": "Alemanha: merz promete 'continuar apesar dos contratempos'", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 172469, "titulo": "The Deportation Project - Inside the Trump administration's secret deals to expel people worldwide", "url": "https://www.france24.com/en/video/20260920-the-deportation-project-inside-the-trump-administration-s-secret-deals-to-expel-people-worldwide", "fonte_id": "france24", "data_pub": "2026-09-20T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Setenta e duas jornalistas de 26 organizações de mídia trabalharam no projeto por meses. O relatório revelará os acordos secretos da administração Trump para expulsar pessoas de todo o mundo. Os detalhes serão divulgados no dia seguinte.", "titulo_pt": "O projeto de expulsão - dentro dos acordos secretos da administração Trump para expulsar pessoas de todo o mundo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 172622, "titulo": "Mosca, 'intensificheremo gli attacchi sull'Ucraina in risposta ai raid odierni'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/20/mosca-intensificheremo-gli-attacchi-sullucraina-in-risposta-ai-raid-odierni_07ce8d99-d249-4e1a-b44e-0bfb7bdc231f.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-20T17:07:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Rússia intensificará os ataques à Ucrânia em resposta aos ataques ocorridos hoje. Em 24 horas, foram abatidos 1.951 drones e 8 mísseis de cruzeiro.", "titulo_pt": "Moscou, 'intensificaremos os ataques à Ucrânia em resposta aos ataques de hoje'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 172506, "titulo": "New York and Paris mayors Mamdani and Grégoire meet to advocate for housing access and climate solutions", "url": "https://www.lemonde.fr/en/politics/article/2026/09/20/new-york-and-paris-mayors-mamdani-and-gregoire-meet-to-advocate-for-housing-access-and-climate-solutions_6757742_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-20T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os socialistas Zohran Mamdani, prefeito de Nova York, e Emmanuel Grégoire, prefeito de Paris, se encontraram em Nova York para defender seus interesses comuns em políticas de habitação e meio ambiente.", "titulo_pt": "Prefeitos de nova York e Paris se reúnem para defender acesso à habitação e soluções climáticas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 172573, "titulo": "Lula, Costa, Ruto and Carney: Multilateralism is not idealism, it is a necessity", "url": "https://www.ft.com/content/d9e6c07e-7d84-4e41-a9a2-0d0ac2319dd2", "fonte_id": "financial_times", "data_pub": "2026-09-20T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É neces
