para proteger sus costas: el ambicioso proyecto que busca recuperar arrecifes, manglares y otras especies", "url": "https://www.clarin.com/estados-unidos/florida-crea-corredor-marino-proteger-costas-ambicioso-proyecto-busca-recuperar-arrecifes-manglares-especies_0_wEBJBRt6lX.html", "fonte_id": "clarin", "data_pub": "2026-08-10T17:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Flórida está implementando um corredor marinho que conectará projetos de conservação ao longo das costas do Atlântico e do Golfo de México, incluindo arrecifes artificiais, restauração de bancos de ostras e recuperação de pastos marinhos. O objetivo é proteger a biodiversidade e aumentar a resistência frente a fenômenos extremos.", "titulo_pt": "Flórida cria corredor marinho para proteger suas costas: projeto ambicioso busca recuperar arrecifes, manguezais e outras espécies", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 96769, "titulo": "Sarampo volta a acender alerta no Brasil: quem precisa se vacinar? Veja perguntas e respostas sobre a doença", "url": "https://www.bbc.com/portuguese/articles/cm2g4kmvpxjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-10T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sarampo tem voltado a circular no Brasil, com aumento de casos em São Paulo e surtos na região das Américas. Especialistas explicam sobre os grupos que devem se vacinar e as razões para o retorno do vírus.", "titulo_pt": "Sarampo volta a acender alerta no Brasil: veja quem precisa se vacinar", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 97055, "titulo": "Firefighters battle wildfire in eastern Spain's Castellón", "url": "http://www.euronews.com/video/2026/08/10/firefighters-battle-wildfire-in-eastern-spains-castellon", "fonte_id": "euronews", "data_pub": "2026-08-10T12:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 300 bombeiros e 21 aeronaves estão combatendo um incêndio florestal em Tírig, na Espanha Oriental. O fogo já consumiu 810 hectares desde que começou no Friday.", "titulo_pt": "Bombeiros lutam contra incêndio em Castellón, Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 96675, "titulo": "Quem paga a conta? Para diretor da FAO, esse é o principal desafio da transição climática no campo", "url": "https://exame.com/esg/quem-paga-a-conta-para-diretor-da-fao-esse-e-o-principal-desafio-da-transicao-climatica-no-campo/", "fonte_id": "exame", "data_pub": "2026-08-10T12:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Laborde, diretor de políticas agrícolas da FAO, afirma que a sustentabilidade na agricultura depende da renda no curto prazo. Para ele, não é possível ser verde se estiver no vermelho.", "titulo_pt": "Quem paga a conta? Diretor da FAO destaca desafio econômico para transição climática no campo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 96694, "titulo": "Tufão Dolphin atinge litoral da China e avança para o norte com chuvas em dez províncias", "url": "https://www.brasildefato.com.br/2026/08/10/tufao-dolphin-atinge-litoral-da-china-e-avanca-para-o-norte-com-chuvas-em-dez-provincias/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-10T11:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tufão Dolphin atingiu o litoral da província de Zhejiang, na China, com ventos superiores a 150 km/h e continua causando chuvas em mais de dez províncias enquanto se dirige para o interior do país.", "titulo_pt": "Tufão Dolphin atinge litoral da China e avança para o norte com chuvas em dez províncias", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 97148, "titulo": "Over 6,000 still living in evacuation centers two weeks after Kumamoto quake", "url": "https://www.japantimes.co.jp/news/2026/08/10/japan/6000-evacuation-centers-kumamoto/", "fonte_id": "japan_times", "data_pub": "2026-08-10T11:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 6.000 pessoas ainda estão nos centros de evacuação dois semanas após o terremoto de Kumamoto. O governo local está preparando alocamentos em hotéis para os desalojados.", "titulo_pt": "Mais de 6.000 ainda em centros de evacuação duas semanas após terremoto de Kumamoto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 96237, "titulo": "Weather tracker: Europe breaks more heat records as temperatures soar", "url": "https://www.theguardian.com/environment/2026/aug/10/weather-tracker-europe-break-heat-records-temperatures-drought-wildfires", "fonte_id": "guardian_world", "data_pub": "2026-08-10T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas extremamente altas estão quebrando recordes em toda a Europa, intensificando secas e incêndios florestais. Um sistema de alta pressão está causando temperaturas acima de 40°C em vários países europeus, incluindo Áustria e Eslováquia.", "titulo_pt": "Rastreador do tempo: Europa quebra mais recordes de calor com temperaturas elevadas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 96292, "titulo": "Greece battles new wildfire near Athens driven by strong winds", "url": "https://www.lemonde.fr/en/international/article/2026/08/10/greece-battles-new-wildfire-near-athens-driven-by-strong-winds_6756333_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-10T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Grécia enfrenta um novo incêndio florestal perto de Atenas, impulsionado por fortes ventos. Este é o segundo incêndio na região esta estação do ano, após outro que ocorreu há dez dias e destruiu mais de 11.000 hectares de florestas pinheiras e áreas agrícolas.", "titulo_pt": "Grécia combate novo incêndio perto de atenas impulsionado por ventos fortes", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 97155, "titulo": "How the hard reality of climate change hit Europe’s economy this summer", "url": "https://www.japantimes.co.jp/business/2026/08/10/economy/climate-change-europe-economy-summer/", "fonte_id": "japan_times", "data_pub": "2026-08-10T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, recordes de calor e secas causaram danos significativos na produção de energia, no setor de navegação e nos sistemas de saúde pública.", "titulo_pt": "Como a dura realidade do clima impactou a economia europeia este verão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 97160, "titulo": "Ebola case count set to increase as Congo officials track hidden infections", "url": "https://www.japantimes.co.jp/news/2026/08/10/world/science-health/ebola-congo-hidden-infections/", "fonte_id": "japan_times", "data_pub": "2026-08-10T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos confirmados do Ebola no Congo aumentou para 4.209, com um total de 1.916 mortes, levando a uma taxa bruta de mortalidade de 45,5%. A contagem dos casos está sendo ampliada para identificar possíveis infecções ocultas.", "titulo_pt": "Contagem de casos de ebola no Congo deve aumentar com busca por infecções ocultas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 96397, "titulo": "Discovery of almost 1,000 weapons in Indonesian school fuels safety fears", "url": "https://www.scmp.com/week-asia/people/article/3363504/discovery-almost-1000-weapons-indonesian-school-fuels-safety-fears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T06:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ministro indonésio pediu melhor proteção para os alunos após a descoberta de quase 1.000 armas em uma escola privada em South Jakarta. A polícia apreendeu 995 rifles de ar e um revólver vivo na instituição ligada à Fundação Harapan Ibu Islamic School Foundation.", "titulo_pt": "Descoberta de quase 1.000 armas em escola indonésia aumenta preocupações com a segurança", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96140, "titulo": "Europa bate recorde de temperatura em verão de ondas de calor e incêndios", "url": "https://www.cnnbrasil.com.br/internacional/europa-bate-recorde-de-temperatura-em-verao-de-ondas-de-calor-e-incendios/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T06:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Europa registrou recorde de temperatura no verão, com junho e julho tendo média 2,79°C acima do padrão. Além disso, uma estiagem severa reduziu os níveis dos rios, aumentando riscos à população e aos serviços de abastecimento de energia.", "titulo_pt": "Europa quebra recorde de temperatura em verão com ondas de calor e incêndios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96353, "titulo": "Wildfires bear down on homes in Canada’s Okanagan region", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/10/wildfires-bear-down-on-homes-in-canadas-okanagan-region?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T04:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal rápido no estado canadense de British Columbia obrigou milhares de pessoas a deixarem suas casas.", "titulo_pt": "Incêndios florestais ameaçam residências na região okanegana do canadá", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 97307, "titulo": "Agency calls for laws to counter China repression", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/11/2003862287", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência está pedindo a adoção de leis para contrabalançar as repressão da China. O documento destaca a necessidade legal para enfrentar medidas restrictivas do país.", "titulo_pt": "Agência solicita leis contra repressão chinesa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 97311, "titulo": "Eight Tai-gi films featured in annual human rights program", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/11/2003862291", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oito filmes taiwaneses de Tai-gi foram selecionados para o programa anual de direitos humanos.", "titulo_pt": "Oito filmes Tai-gi são destacados no programa anual de direitos humanos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 96956, "titulo": "Após Janja pedir suspensão, AGU e ANPD aguardam respostas do Discord para avaliar medidas", "url": "https://www.jota.info/executivo/apos-janja-pedir-suspensao-agu-e-anpd-aguardam-respostas-do-discord-para-avaliar-medidas", "fonte_id": "jota", "data_pub": "2026-08-10T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal está aguardando respostas do Discord para avaliar medidas após a empresa ter solicitado uma suspensão temporária. A ofensiva governamental ocorreu no contexto de uma morte envolvendo um adolescente durante uma live.", "titulo_pt": "Após pedir suspensão, AGU e ANPD aguardam respostas do Discord para avaliar medidas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 97104, "titulo": "Ben-Gvir posts AI video of starving Palestinian ahead of elections", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/10/ben-gvir-posts-ai-video-of-starving-palestinian-ahead-of-elections?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ben-Gvir publicou um vídeo AI de um palestiniano supostamente faminto nas redes sociais antes das eleições.", "titulo_pt": "Ben-gvir publica vídeo AI de palestiniano supostamente faminto nas vésperas das eleições", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 96913, "titulo": "‘Shoved the tube so hard it tore my nose’: Kurdish film-maker recounts ‘inhumane’ ICE force-feeding", "url": "https://www.theguardian.com/us-news/2026/aug/10/ice-force-feeding-detention-gabar-choli", "fonte_id": "guardian_world", "data_pub": "2026-08-10T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gabar Choli, um cineasta kurdo, descreveu como foi submetido a uma detenção de meses com algemas e forçado a comer. As consequências físicas e emocionais deste tratamento inhumano persistem.", "titulo_pt": "'Empurrou o tubo tão forte que arrancou meu nariz': cineasta kurdo relata 'tratamento inhumano' de força alimentação pela ICE", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 96914, "titulo": "Kurdish hunger striker says ICE force-feeding ‘mentally broke me’", "url": "https://www.theguardian.com/us-news/2026/aug/10/kurdish-hunger-striker-ice-force-feeding", "fonte_id": "guardian_world", "data_pub": "2026-08-10T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cineasta curdo, Gabar Choli, que estava em greve de fome durante oito meses na detenção dos EUA e foi submetido a alimentação forçada, relatou pela primeira vez como esse processo o prejudicou fisicamente e psiquicamente. O tratamento coercitivo, considerado tortura por organizações de direitos humanos internacionais, era aplicado frequentemente duas vezes ao dia.", "titulo_pt": "Cineasta curdo que fez greve de fome durante 8 meses na detenção dos EUA relata sobre a alimentação forçada", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 96417, "titulo": "Police to strengthen whistleblower protections following investigative authority reform", "url": "https://www.koreaherald.com/article/10836507", "fonte_id": "korea_herald", "data_pub": "2026-08-10T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Polícia da Coreia anunciou que vai fortalecer as medidas para incentivar denúncias e proteger os informantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia. O objetivo é reforçar o controle interno e aumentar a confiança dos policiais em relatar irregularidades.", "titulo_pt": "Polícia coreana vai fortalecer proteção a denunciantes após reforma", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 96263, "titulo": "De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas", "url": "https://www.jota.info/opiniao-e-analise/artigos/de-tabu-individual-a-dever-coletivo-o-direito-a-dignidade-menstrual-de-meninas", "fonte_id": "jota", "data_pub": "2026-08-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de políticas e debates contribui para a naturalização do sofrimento de meninas e mulheres em relação ao direito à dignidade menstrual. O título traduzido é: 'De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas.'", "titulo_pt": "De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96201, "titulo": "Encontraron ocho cuerpos desmembrados en una mina ilegal de oro en Ecuador", "url": "https://www.lanacion.com.ar/el-mundo/encontraron-ocho-cuerpos-desmembrados-en-una-mina-ilegal-de-oro-en-ecuador-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T06:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Oito corpos desmembrados foram encontrados em duas fossas, a cerca de dois metros de profundidade, em uma mina ilegal de ouro no Equador. O operativo foi iniciado após várias famílias relatarem que perderam o contato com parentes.", "titulo_pt": "Encontraram oito corpos desmembrados em uma mina ilegal de ouro no equador", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96399, "titulo": "Hong Kong police arrest 8 over HK$6.2 million ‘sugar baby’ dating scam", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3363500/hong-kong-police-arrest-8-over-hk62-million-sugar-baby-dating-scam?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong prendeu oito pessoas por supostamente participar de uma quadrilha de estelionato que enganou vítimas, incluindo professores e trabalhadores da saúde, sacando cerca de HK$6.2 milhões (US$790.000) sob a pretexto de pagamentos legais para formalizar contratos de 'sugar baby'. Foram investigados 80 casos envolvendo estelionatários que usaram o dating compensado como uma tática para atrair vítimas entre fevereiro e julho deste ano.", "titulo_pt": "Polícia de hong Kong prende oito por esquema de 'sugar baby'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96329, "titulo": "Union documents 108 Israeli attacks against Palestinian journalists in July", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/union-documents-108-israeli-attacks-against-palestinian-journalists-july", "fonte_id": "middle_east_eye", "data_pub": "2026-08-10T06:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Sindicato dos Jornalistas Palestinos documentou 108 ataques israelenses contra jornalistas e trabalhadores da mídia palestinos em julho. Esses ataques incluíram detenções, agressões físicas, interrogatórios, uso de granadas de efeito sonoro e gás lacrimogêneo, violência por parte de colonos, busca e apreensão nas residências e locais de trabalho desses profissionais, bem como o sequestro de equipamentos jornalísticos.", "titulo_pt": "Documentos da união registram 108 ataques israelenses contra jornalistas palestinos em julho", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 96403, "titulo": "Court const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
