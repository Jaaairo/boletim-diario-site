<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "06/10/2026 15:30", "stats": {"noticias_novas": 971, "resumos_gerados": 243}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro Gilmar Mendes, do STF, comemorou a não contestação do resultado das eleições gerais de 2026 pelos principais líderes políticos. A Procuradoria-Geral Eleitoral decidiu anular os votos de Anthony Garotinho na eleição pelo Governo do Rio de Janeiro. O presidente Lula expressou sua insatisfação com o prefeito do Rio de Janeiro, Eduardo Paes, que não apoiou sua candidatura. O PP anunciará seu apoio a Flávio Bolsonaro no segundo turno das eleições, após ter criticado severamente a candidatura do filho de Jair Bolsonaro há um ano. O Congresso Nacional eleito manterá seu perfil conservador, com predominância de representantes do centro à direita. O Supremo Tribunal Federal determinou que a PGR se manifeste sobre o pedido do ex-presidente Jair Bolsonaro para permitir visitas de seu filho, o senador Flávio Bolsonaro. O ministro André Mendonça multou o presidenciável Flávio Bolsonaro em R$ 5 mil por impulsionar um post negativo contra o presidente Luiz Inácio Lula da Silva. O projeto de lei 4.319/25 propõe expandir a responsabilidade penal para pessoas jurídicas, focando no debate sobre a constitucionalidade dessa proposta.", "mundo": "As eleições presidenciais no Brasil, marcadas para o dia 25 de outubro, estão em plena campanha, com o segundo turno entre Lula e Bolsonaro prometendo um confronto direto. O agro-bolsonarismo na Amazônia e no Centro-Oeste se estabeleceu como uma base social significativa para a direita radical. O ex-presidente americano Donald Trump celebrou a vitória do primeiro turno, sem mencionar Flávio Bolsonaro. Em contraste, a França enfrenta uma onda de protestos que se espalhou para mais de 40 cidades, refletindo insatisfação pública com as condições escolares. Além disso, a Coreia do Sul confirmou uma invasão de sete bancos com indícios de uso de inteligência artificial, enquanto a Argentina anunciou que impedirá que as Ilhas Falkland explorem campos de petróleo offshore, reivindicando soberania sobre o território.\n\nA geopolítica global enfrenta diversos desafios significativos. No Iêmen, a crise humanitária em Taiz continua agravada por combates, enquanto a Europa se prepara para uma possível escalada de conflito com a Rússia, após um programa de guerra simulada receber uma advertência nuclear. Em um desenvolvimento preocupante, ataques a navios no Estreito de Ormuz continuam a ameaçar a segurança energética global. Por outro lado, a Coreia do Norte ameaça uma reação poderosa caso o Sul Coreano avance sobre seu território, enquanto a Arábia Saudita relata a restauração da capacidade da linha de transmissão de petróleo entre o Oriente e Ocidente. O Irã implementa novas estratégias para enfrentar pressões econômicas dos Estados Unidos, enquanto a França realiza um teste de um novo foguete nuclear-capacitado. As tensões regionais se intensificam, com Israel estabelecendo um prazo para fechar o consulado britânico em resposta a novas sanções, enquanto a Rússia nega a morte de um trabalhador de laboratório suspeito de peste, o que alimenta a incerteza. A Coreia do Sul e a Ucrânia enfrentam desafios diplomáticos, com a Coreia do Sul considerando a disculpa de Kiev insuficiente e a Ucrânia confirmando seu primeiro caso de Ebola, levando a preocupações sanitárias globais.", "economia": "As ações do Banco do Brasil caíram na sessão de terça-feira (6), após a JP Morgan rebaixar sua recomendação do papel de 'neutro' para 'underweight'. O mercado também reagiu à queda dos rendimentos dos Treasuries nos EUA, com o rendimento dos títulos de 10 anos atingindo seu maior nível em mais de duas décadas, a 5,3%. O FMI alertou que picos elevados nos preços dos alimentos e da energia podem se tornar mais frequentes, agravando as expectativas de inflação e a pobreza, ameaçando a estabilidade econômica. Em outro desenvolvimento, o Ibovespa disparou no dia anterior, influenciado pelo resultado do primeiro turno da eleição presidencial, que favoreceu o senador Flávio Bolsonaro sobre Lula, o que levou a uma queda do dólar e da bolsa nesta terça-feira (6).", "tecnologia": "A Paramount fechou um acordo histórico de aquisição por US$ 110 bilhões para adquirir a Warner Bros. Discovery, criando uma das maiores empresas de entretenimento do mundo. A fusão resultará em uma nova entidade, que reunirá três grandes estúdios de cinema, dois serviços de streaming globais e dois grandes canais de notícias. Este acordo historicamente significativo reúne poderosas marcas e recursos, fortalecendo a posição da nova empresa no cenário global de entretenimento. Em outra notícia, a empresa de tecnologia militar Erebor, liderada por Palmer Luckey, acumulou depósitos superiores a 7 bilhões de dólares desde seu lançamento, buscando preencher o vazio deixado pela falência do Silicon Valley Bank. A startup Neurotech Bridge está planejando desenvolver um dispositivo wearável que utiliza ultrassom para criar uma interface cérebro-computador, concorrendo com os esforços de Merge Labs, liderados por Sam Altman. Além disso, a Mistral AI lançou um novo modelo de inteligência artificial chamado Mistral Large 4, visando reduzir a diferença em desempenho em relação aos principais concorrentes chineses. O modelo estará disponível a partir de terça-feira, sinalizando um novo capítulo na corrida pela liderança no campo da IA.", "ciencia": "O físico belga Francis Halzen, professor da Universidade do Wisconsin-Madison, foi premiado com o Nobel de Física em 2026 por suas contribuições para o Observatório de Neutrinos de Gelo IceCube e pela descoberta de neutrinos de alta energia de origem astrológica. Este reconhecimento destaca o avanço significativo na compreensão do universo através da detecção de partículas cósmicas. Em outro desenvolvimento importante, a NASA anunciou que a estrela branca HS 0209+0832 pode abrigar um planeta da segunda geração, um achado que foi ilustrado em uma concepção artística lançada em 5 de outubro de 2026. Além disso, o Telescópio Espacial James Webb da NASA/ESA/CSA revelou estrelas ocultas por nuvens de poeira em uma nebulosa estelar chamada NGC 7129, a 3.300 anos-luz da Terra, aprimorando nossa compreensão do nascimento de estrelas. Estes avanços científicos demonstram a importância da pesquisa em astrofísica e cosmologia para expandir nosso conhecimento sobre o universo.", "cultura": "A exposição 'O Brasil de Tarsila' inaugurou o Nubank Arte Lab, no Conjunto Nacional, em São Paulo, com cerca de 40 obras projetadas em 360 graus, oferecendo uma experiência cultural imersiva para os visitantes. O Festival Internacional de Cinema de Busan, na sua 31ª edição, abriu com uma produção independente de pequeno porte, evitando discutir um filme político controverso. O Museu de Arte de Fênix recebeu um presente de 5 milhões de dólares do filantropo Dr. Sukumar Nagendran para expandir sua seção de arte sul-asiática e sri-lankesa, incluindo o aumento das galerias de Arte da Ásia. O Festival de Jarasum, na Coreia do Sul, celebrou a França com um programa centrado na música jazz, com destaque para uma pianista de inteligência artificial.", "sociedade": "Manifestações violentas e protestos estudantis graves estão em destaque na sociedade. Entre 256.000 e 450.000 pessoas participaram de protestos violentos na França, levando a incêndios, distúrbios e jovens feridos, segundo relatos. Em El Salvador, uma idosa construiu uma casa de 10 metros quadrados usando garrafas PET, destacando-se como um exemplo de resiliência. O setor de saúde no Brasil criou 100 mil empregos formais em 2026, com agosto de 2026 sendo o melhor desempenho em cinco anos. Além disso, a América avança em relação ao envelhecimento saudável, mas ainda enfrenta gaps antes de 2030, enquanto a França enfrenta protestos estudantis e problemas de falta de funcionários e infraestrutura nas escolas.", "meio_ambiente": "O primeiro-ministro da Austrália, Anthony Albanese, alertou para um verão perigoso devido ao 'super El Niño' no Pacífico, com possíveis inundações, ciclones e calor extremo. Este alerta destaca a urgência de ações climáticas, especialmente para países insulares como Tuvalu. Paralelamente, a Natura estima que a mudança climática na Amazônia possa comprometer R$ 584,2 milhões em vendas, representando 2,6% da receita líquida da empresa em 2025. Em outro projeto, a Mataquito Transmisora de Energia enfrenta cinco reclamações no Tribunal Ambiental por supostas ilegalidades na aprovação de um projeto de transmissão elétrica de US$ 324 milhões. No exterior, as autoridades finlandesas ordenaram que a Google pare com a construção de centrais de dados até que possa comprovar conformidade com as leis ambientais, devido a preocupações ambientais.", "direitos_humanos": "Em vários pontos do mundo, os direitos humanos estão sendo testados e violados. Na França, grupos de direitos humanos condenaram o uso da força policial contra estudantes em manifestações, com registros de jovens gravemente feridos e milhares detidos. Em Trinidad e Tobago, jornalistas estão pedindo uma alteração urgente na Lei de Operações Especiais de 2026, que aumenta os poderes de busca e apreensão da polícia, ameaçando a liberdade de imprensa. Na Rússia, há suspeitas de que o governo esteja adotando uma abordagem evasiva sobre a morte devido a um possível acidente de laboratório no norte do país. Em Gaza, a guerra aumentou a violência sexual e o casamento forçado de meninas e mulheres como forma de proteção. Na África do Sul, a descoberta de 11 corpos de mulheres em Johannesburg expõe a violência contra as mulheres no país. A Organização das Nações Unidas (ONU) informou que mais de 1.900 crianças foram deixadas órfãs ou separadas de suas famílias devido à Ebola nas regiões de Ituri e North Kivu na República Democrática do Congo. Além disso, a Coreia do Sul possui 52 condenados à morte com uma média de 58,7 anos de idade. Em Tigray, na Etiópia, rebeldes estão forçando a recruta de meninos com 15 anos ou menos. A Assembleia dos Direitos Humanos condenou os ataques contra civis no Sudão e pediu um cessar-fogo. Por fim, a ONU alerta que mais de 347 milhões de crianças em quase 100 países serão expostas a um dos eventos El Niño mais intensos na história registrada, o que pode afetar gravemente seus direitos e bem-estar."}, "resumo_do_dia": {"politica_nacional": [{"id": 198539, "titulo": "O que explica a diferença entre o resultado das urnas e as pesquisas", "url": "https://www.bbc.com/portuguese/articles/cq5ynrke17mdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maior parte dos institutos de pesquisa ficou fora da margem de erro e subestimou Flávio Bolsonaro nas eleições, segundo especialistas. Voto de última hora, abstenção e desconfiança dos entrevistados limitaram o alcance dos levantamentos.", "titulo_pt": "O que explica a diferença entre o resultado das urnas e as pesquisas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 198302, "titulo": "Procuradoria Eleitoral afirma que votos de Garotinho devem ser anulados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/procuradoria-eleitoral-afirma-que-votos-de-garotinho-devem-ser-anulados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral Eleitoral declarou que os votos de Anthony Garotinho devem ser considerados nulos na eleição pelo Governo do Rio de Janeiro. Este parecer será enviado ao Tribunal Superior Eleitoral.", "titulo_pt": "Procuradoria Eleitoral afirma que votos de Garotinho devem ser anulados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198303, "titulo": "Lula diz a aliados que Paes se omitiu no Rio e reclama de falta de apoio na disputa nacional", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/lula-diz-a-aliados-que-paes-se-omitiu-no-rio-e-reclama-de-falta-de-apoio-na-disputa-nacional.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula reclamou da falta de apoio do ex-prefeito do Rio de Janeiro Eduardo Paes à sua candidatura. Isso ocorreu após Lula terminar em segundo lugar nas eleições presidenciais para o segundo turno.", "titulo_pt": "Lula critica ausência de eduardo Paes no apoio à sua campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198304, "titulo": "PP deve anunciar apoio a Flávio quase um ano após Ciro Nogueira dizer que candidato era inviável", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/pp-deve-anunciar-apoio-a-flavio-quase-um-ano-apos-ciro-nogueira-dizer-que-candidato-era-inviavel.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PP, Ciro Nogueira, defende que o partido apoie Flávio Bolsonaro no segundo turno das eleições, embora tenha criticado severamente a candidatura do filho de Jair Bolsonaro há aproximadamente um ano, por considerá-la inviável.", "titulo_pt": "PP deve anunciar apoio a Flávio quase um ano após criticar candidatura inviável", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198426, "titulo": "Gilmar celebra que líderes políticos não questionaram resultado das urnas", "url": "https://www.metropoles.com/brasil/gilmar-celebra-que-lideres-politicos-nao-questionaram-resultado-das-urnas", "fonte_id": "metropoles", "data_pub": "2026-10-06T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do STF, publicou uma nota no X celebrando o fato de que os líderes políticos não questionaram o resultado das eleições gerais de 2026.", "titulo_pt": "Gilmar comemora que líderes políticos não questionaram resultado das eleições de 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 198305, "titulo": "Quem é Jones Manoel, influenciador comunista eleito deputado que quer participar da campanha digital de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/quem-e-jones-manoel-influenciador-comunista-eleito-deputado-que-quer-participar-da-campanha-digital-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jones Manoel, um historiador e influenciador político comunista, foi eleito deputado federal pelo PSOL em Pernambuco com 249.077 votos, ficando em segundo lugar no estado. Ele agora quer participar da campanha digital de Lula.", "titulo_pt": "Quem é Jones Manoel, influenciador comunista eleito deputado que quer participar da campanha digital de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198306, "titulo": "Flávio Bolsonaro diz que vai a debates no segundo turno, após Lula também sinalizar presença", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/flavio-bolsonaro-diz-que-vai-a-debates-no-segundo-turno-apos-lula-tambem-sinalizar-presenca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato a presidente Flávio Bolsonaro anunciou que participará de debates no segundo turno, após Lula também confirmar presença. Flávio Bolsonaro não compareceu aos debates do primeiro turno, enquanto Lula esteve presente.", "titulo_pt": "Flávio Bolsonaro confirmará presença em debates do segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198544, "titulo": "Após 16 anos como deputado, Tiririca tem 5 mil votos e não consegue se reeleger", "url": "https://www.bbc.com/portuguese/articles/cje36y2zlr90o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tiririca, que foi o deputado mais votado em 2010 com mais de 1,3 milhão de votos em São Paulo, não conseguiu se reeleger após 16 anos de mandato. Após mudar de partido, ele concorreu em seu estado natal, o Ceará, mas obteve apenas 5 mil votos.", "titulo_pt": "Após 16 anos como deputado, Tiririca tem 5 mil votos e não consegue se reeleger", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 198436, "titulo": "Marinho no STF: Senado não será omisso sobre crimes de ministros do Supremo", "url": "https://www.metropoles.com/colunas/manoela-alcantara/marinho-fachin-senado-omisso-crimes-ministros", "fonte_id": "metropoles", "data_pub": "2026-10-06T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O coordenador de Flávio Bolsonaro negou a intenção de retaliação após uma reunião com o ministro Fachin e destacou a necessidade de ação do Senado em relação a crimes de responsabilidade cometidos pelos ministros do Supremo Tribunal Federal.", "titulo_pt": "Marinho no STF: senado não será omisso sobre crimes de ministros do Supremo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 198282, "titulo": "Daniella Marques é cotada para comandar área social em eventual governo Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/daniella-marques-e-cotada-para-comandar-area-social-em-eventual-governo-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniella Marques, porta-voz econômica da campanha de Flávio Bolsonaro, é considerada para liderar um ministério social em um eventual governo dele.", "titulo_pt": "Daniella Marques é cotada para área social em eventual governo de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 198273, "titulo": "Com 91 anos, Erundina é a deputada estadual mais velha eleita em 2026", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/com-91-anos-erundina-e-deputada-estadual-mais-velha-eleita-em-2026", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-06T16:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiza Erundina, com 91 anos, se tornou a deputada estadual mais velha eleita no pleito de 2026, ocupando uma das 94 cadeiras da Assembleia Legislativa de São Paulo. Ela superou o deputado Eduardo Suplicy, de 85 anos, que era o mais velho na Alesp até então.", "titulo_pt": "Com 91 anos, Erundina é a deputada estadual mais velha eleita em 2026", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 198285, "titulo": "Flávio Bolsonaro diz que fim da escala 6x1 é oportunismo de Lula para ganhar votos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/flavio-bolsonaro-diz-que-fim-da-escala-6x1-e-oportunismo-de-lula-para-ganhar-votos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T16:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro afirmou que o fim da escala 6x1 é oportunismo do governo Lula, seu adversário na eleição presidencial. A proposta será discutida no Senado nesta terça-feira.", "titulo_pt": "Flávio Bolsonaro critica fim da escala 6x1 como oportunismo de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 198307, "titulo": "Moraes manda PGR se manifestar sobre pedido de Bolsonaro para liberar visitas de Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/moraes-manda-pgr-se-manifestar-sobre-pedido-de-bolsonaro-para-liberar-visitas-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, determinou que a PGR se manifeste sobre o pedido do ex-presidente Jair Bolsonaro para permitir visitas de seu filho, o senador Flávio Bolsonaro. A decisão foi tomada nesta terça-feira (6).", "titulo_pt": "Moraes determina que PGR se manifeste sobre pedido de Bolsonaro para liberar visitas de Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198274, "titulo": "Mendonça multa Flávio por impulsionar post negativo contra Lula", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/mendonca-multa-flavio-por-impulsionar-post-negativo-contra-lula", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-06T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do Supremo Tribunal Federal, multou o presidenciável Flávio Bolsonaro em R$ 5 mil por impulsionar um post negativo contra o presidente Luiz Inácio Lula da Silva. A decisão foi tomada após a campanha de Lula questionar a publicação, que mostrava uma foto de Flávio com uma identificação de sua candidatura.", "titulo_pt": "Mendonça multa Flávio por impulsionar post negativo contra Lula", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 198308, "titulo": "Perfil do Congresso será conservador como sempre foi", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/10/perfil-do-congresso-sera-conservador-como-sempre-foi.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional eleito para os próximos quatro anos manterá seu perfil conservador, com predominância de representantes do centro à direita.", "titulo_pt": "Perfis conservadores prevalecerão no Congresso nacional", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 198309, "titulo": "Centrão perde espaço para direita na Câmara, mas ainda será decisivo para governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/centrao-perde-espaco-para-direita-na-camara-mas-ainda-sera-decisivo-para-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os partidos do centrão (União Brasil, PP e Republicanos) perderam espaço para o PL na Câmara dos Deputados nas eleições de 2026, mas ainda serão importantes para o governo aprovar reformas e projetos de lei.", "titulo_pt": "Centrão perde espaço para direita na Câmara, mas ainda será decisivo para governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 198655, "titulo": "Trump-Appointed Judge Accuses ICE of Lying and Fabricating Records", "url": "https://www.nytimes.com/2026/10/06/nyregion/ice-judge-condemns-arrests-falsified-records.html", "fonte_id": "nyt_world", "data_pub": "2026-10-06T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal nomeado por Trump criticou as ações da ICE após dois homens serem injustamente detidos no Bronx. O juiz Gary R. Brown acusou a agência de mentir e fabricar registros.", "titulo_pt": "Juiz nomeado por trump acusa ICE de mentir e fabricar registros", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 198651, "titulo": "Student Protests Expand to More Than 40 French Cities", "url": "https://www.nytimes.com/live/2026/10/06/world/france-protests-students-schools", "fonte_id": "nyt_world", "data_pub": "2026-10-06T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A manifestação estendeu-se para mais de 40 cidades francesas, com sindicalistas, pais e professores se juntando aos estudantes, que já haviam fechado centenas de escolas desde setembro.", "titulo_pt": "Manifestações estendem-se para mais de 40 cidades francês", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 198829, "titulo": "'Colossal failure: Death penalty system in America is a broken process from start to finish'", "url": "https://www.france24.com/en/colossal-failure-death-penalty-system-in-america-is-a-broken-process-from-start-to-finish", "fonte_id": "france24", "data_pub": "2026-10-06T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O advogado de direitos humanos Reed Brody destaca que o fracasso na execução de Christa Pike revela problemas mais amplos relacionados à pena de morte nos Estados Unidos, incluindo a qualidade do auxílio jurídico, as disparidades entre jurisdições e as dificuldades enfrentadas pelos estados na administração da pena capital.", "titulo_pt": "Colossal falha: sistema de pena de morte nos estados unidos é um processo quebrado do começo ao fim", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 198947, "titulo": "Sempio, 'nessun errore giudiziario su Alberto Stasi, condanna giusta'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/06/sempio-nessun-errore-giudiziario-su-alberto-stasi-condanna-giusta_1e432088-a63b-4988-825a-885694495451.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-06T17:50:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que há aspectos do racconto alternativo que não convencem o autor. Não se menciona detalhes específicos sobre quem ou o que exatamente não convence.", "titulo_pt": "Sempre, 'nenhum erro judiciário sobre Alberto Stasi, condenação justa'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 198654, "titulo": "Drones Hit Ships Off Bulgaria’s Black Sea Coast, Prime Minister Says", "url": "https://www.nytimes.com/2026/10/06/world/europe/bulgaria-drones-black-sea.html", "fonte_id": "nyt_world", "data_pub": "2026-10-06T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um resgate estava em andamento após um dos dois navios afundar, segundo o primeiro-ministro Rumen Radev. Não ficou claro de onde os drones se originaram.", "titulo_pt": "Drones atingem navios na costa do mar negro da bulgária, diz primeiro-ministro", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 198441, "titulo": "Javier Milei se vangloria por votos de Flávio Bolsonaro enquanto pobreza cresce na Argentina", "url": "https://www.brasildefato.com.br/2026/10/06/javier-milei-se-vangloria-por-votos-de-flavio-bolsonaro-enquanto-pobreza-cresce-na-argentina/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-06T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente argentino Alberto Fernández, com uma rejeição histórica, mencionou um possível encontro com Flávio Bolsonaro nos Estados Unidos. O candidato Javier Milei afirmou que não há uma agenda definida para esse encontro.", "titulo_pt": "Milei se vangloria de votos de Flávio Bolsonaro enquanto rejeição de fernández cresce na Argentina", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 198653, "titulo": "Kenya Records Ebola Case for First Time", "url": "https://www.nytimes.com/2026/10/06/world/africa/kenya-case-ebola-outbreak.html", "fonte_id": "nyt_world", "data_pub": "2026-10-06T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades relataram um caso de Ebola em um homem que chegou do Congo Democrático. Medidas estão sendo tomadas para prevenir a propagação do vírus.", "titulo_pt": "Quênia registra primeiro caso de Ebola", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 198908, "titulo": "Yemen’s Taiz residents fear food and fuel crisis amid fighting", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/6/yemens-taiz-residents-fear-food-and-fuel-crisis-amid-fighting?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes de Taiz, no Iêmen, temem uma crise de alimentos e combustível devido aos combates.", "titulo_pt": "Residentes de Taiz, no iêmen, temem crise de alimentos e combustível", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 198573, "titulo": "Elecciones en Brasil, EN VIVO: qué se sabe del balotaje entre Lula y Bolsonaro, encuestas y últimas noticias", "url": "https://www.lanacion.com.ar/el-mundo/elecciones-en-brasil-en-vivo-que-se-sabe-del-balotaje-entre-lula-y-bolsonaro-encuestas-y-ultimas-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral confirmou a segunda volta das eleições presidenciais no Brasil, que será entre Lula e Bolsonaro. O pleito determinará o futuro do país no dia 25 de outubro.", "titulo_pt": "Eleições no Brasil, EN VIVO: segunda volta entre Lula e Bolsonaro, definida para 25 de outubro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 198319, "titulo": "Extrema direita elege seu 1º presidente de Parlamento estadual na Alemanha desde 1945", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/extrema-direita-elege-seu-1o-presidente-de-parlamento-na-alemanha-desde-1945.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-06T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tobias Rausch, político da AfD (Alternativa para a Alemanha), foi eleito presidente do Parlamento estadual em Saxônia-Anhalt. Este é o primeiro presidente parlamentar de extrema direita na Alemanha desde 1945.", "titulo_pt": "Extrema direita elege seu primeiro presidente de Parlamento estadual na Alemanha desde 1945", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 198639, "titulo": "Los Emmy se mudan con Amazon: los premios de la Academia de Televisión firman un acuerdo con Prime Video", "url": "https://elpais.com/us/entretenimiento/2026-10-06/los-emmy-se-mudan-con-amazon-los-premios-de-la-academia-de-television-firman-un-acuerdo-con-prime-video.html", "fonte_id": "elpais_america", "data_pub": "2026-10-06T17:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Academia de Televisão assinou um acordo com o Prime Video que durará pelo menos seis anos e custará cerca de 15 milhões de dólares anualmente. O acordo prevê que os Emmy sejam transmitidos gratuitamente pela plataforma. O contrato foi firmado meses após o YouTube obter os direitos dos Oscar.", "titulo_pt": "Os Emmy se mudam para o Amazon Prime Video: Academia de televisão firma acordo com a plataforma", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 198830, "titulo": "Brazil 'has moved to the right progressively over the last two decades', expert says", "url": "https://www.france24.com/en/tv-shows/a-propos/20261006-brazil-has-moved-to-the-right-progressively-over-the-last-two-decades-expert-says", "fonte_id": "france24", "data_pub": "2026-10-06T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O senador Flavio Bolsonaro recebeu endossos de Ronaldo Caiado e Romeu Zema, dois políticos de direita que concorreram contra ele na primeira rodada do pleito, para a corrida presidencial contra Luiz Inácio Lula da Silva. De acordo com Anthony Pereira, diretor executivo do Stone Center for Latin American Studies da Tulane University, o caminho de Lula para a vitória passa por mobilizar os eleitores que não votaram na primeira rodada, enquanto Flavio Bolsonaro pode beneficiar-se dos votos de outros candidatos de direita.", "titulo_pt": "Brasil se movimentou gradualmente para a direita nas últimas duas décadas, diz especialista", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 198851, "titulo": "Russia denies anti-plague measures after pneumonia death", "url": "https://www.dw.com/en/russia-denies-anti-plague-measures-after-pneumonia-death/a-79567922?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-06T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo russo nega que medidas antitéticas contra a peste sejam necessárias após a morte de um funcionário em um instituto antitéticista em Irkutsk. O secretário de Estado dos Estados Unidos, Marco Rubio, pediu transparência da Rússia sobre as investigações.", "titulo_pt": "Rússia nega medidas antitéticas após morte de funcionário em instituto antitético", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 199143, "titulo": "Protests sweep France, as student walkouts tap into public discontent", "url": "https://www.washingtonpost.com/world/2026/10/06/protests-sweep-france-closing-schools-student-walkouts-escalate/", "fonte_id": "washington_post_world", "data_pub": "2026-10-06T17:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos se espalham por todo o país na França, com greves estudantis refletindo insatisfação pública sobre as condições escolares. Mais de 5.000 pessoas foram detidas, muitas delas menores de idade.", "titulo_pt": "Protestos abrangem França, com greves estudantis refletindo insatisfação pública sobre condições escolares", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 198909, "titulo": "Kenya confirms first Ebola case as man dies in Nairobi after DRC return", "url": "https://www.aljazeera.com/news/2026/10/6/kenya-confirms-first-ebola-case-after-patient-from-dr-congo-dies-in-nairobi?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Kenia confirmou seu primeiro caso de Ebola após um homem morrer em Nairobi após retornar do Congo Democrático. Mais de 4.000 pessoas já morreram na pior epidemia da história do Congo Democrático, com mais de 8.300 casos confirmados.", "titulo_pt": "Kenya confirma primeiro caso de Ebola após mortes em Nairobi", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 198538, "titulo": "Como o agro-bolsonarismo na Amazônia e no Centro-Oeste equilibrou a disputa com Nordeste lulista", "url": "https://www.bbc.com/portuguese/articles/c5vgyl2gk7jyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O agro-bolsonarismo na Amazônia e no Centro-Oeste se estabeleceu como uma base territorial e social significativa para a direita radical, similar à que o PT construiu no Nordeste. Este fenômeno foi explicado por Fernando Rugitsky, economista e pesquisador.", "titulo_pt": "Como o agro-bolsonarismo na Amazônia e no Centro-Oeste fortaleceu a direita comparável à base lulista no Nordeste", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 198277, "titulo": "JP Morgan rebaixa Banco do Brasil e ações caem após rali da véspera", "url": "https://redir.folha.com.br/redir/online ", "classe": "A"}, {"id": 198484, "titulo": "Encontro de investidores debate alta da bolsa", "url": "https://www.cnnbrasil.com.br/economia/encontro-de-investidores-debate-alta-da-bolsa/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento Panorama Itaúsa reuniu executivos para discutir o cenário econômico após a alta recorde de 7% na bolsa brasileira. Analista de Economia da CNN Débora Oliveira acompanhou o encontro.", "titulo_pt": "Encontro de investidores discute alta recorde de 7% na bolsa brasileira", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 198279, "titulo": "Uber compra empresa que serve alimentos em eventos por US$ 2,3 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/uber-compra-empresa-que-serve-alimentos-em-eventos-por-us-23-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Uber está próxima de adquirir a empresa de catering ezCater por US$ 2,3 bilhões, o que ajudará a plataforma Uber Eats a atingir uma clientela mais corporativa.", "titulo_pt": "Uber compra empresa de catering por 2,3 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 198280, "titulo": "Governo avalia assumir parte dos riscos com efeitos climáticos em concessões de portos e aeroportos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/governo-avalia-assumir-parte-dos-riscos-com-efeitos-climaticos-em-concessoes-de-portos-e-aeroportos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal está avaliando assumir parte dos riscos relacionados a eventos climáticos extremos em concessões de aeroportos, portos e hidrovias, compartilhando o  "bbc_brasil", "data_pub": "2026-10-06T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Experiências em países europeus e no Brasil indicam que a redução da jornada de trabalho não necessariamente prejudica o crescimento econômico. Em países que implementaram a escala 6x1, o PIB apresentou um crescimento 'relativamente robusto'.", "titulo_pt": "Fim da escala 6x1 não vai prejudicar a economia?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 198283, "titulo": "Crises de custo de vida têm impacto duradouro nas expectativas de inflação e pobreza, diz FMI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/crises-de-custo-de-vida-tem-impacto-duradouro-nas-expectativas-de-inflacao-e-pobreza-diz-fmi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O FMI alerta que picos acentuados nos preços dos alimentos e da energia podem se tornar mais frequentes, agravando as expectativas de inflação e a pobreza, e ameaçando a estabilidade econômica.", "titulo_pt": "Crises de custo de vida têm impacto duradouro nas expectativas de inflação e pobreza, diz FMI", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 198624, "titulo": "Empleo y productividad: una reforma para dos urgencias", "url": "https://www.latercera.com/opinion/noticia/empleo-y-productividad-una-reforma-para-dos-urgencias/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A reforma proposta visa melhorar o emprego e a produtividade. O texto discute medidas para abordar duas urgências econômicas.", "titulo_pt": "Emprego e produtividade: uma reforma para duas urgências", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 198284, "titulo": "Por que os juros caíram tanto com o resultado da eleição?", "url": "https://red DNA.", "titulo_pt": "Medicamentos para perda de peso podem reduzir o envelhecimento biológico, dizem fabricantes", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 198792, "titulo": "Paramount closes historic $110B deal for Warner Bros. Discovery to create Skydance", "url": "https://www.axios.com/2026/10/06/paramount-warner-bros-discovery-deal-skydance", "fonte_id": "axios", "data_pub": "2026-10-06T16:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Paramount fechou um acordo histórico de aquisição de US$ 110 bilhões para adquirir a Warner Bros. Discovery, criando uma das maiores empresas de entretenimento do mundo. A fusão resultará em uma entidade renomeada Skydance que abrigará três grandes estúdios de cinema, dois serviços de streaming globais e dois grandes canais de notícias.", "titulo_pt": "Paramount fecha acordo histórico de us$ 110 bilhões para adquirir Warner Bros. Discovery", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 198946, "titulo": "Anduril plans shipyard to manufacture parts for US Navy’s top submarines", "url": "https://www.ft.com/content/a6339e0c-4114-413a-a23c-916ed4392ce0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-06T16:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A start-up de tecnologia militar de Palmer Luckey planeja investir 3,7 bilhões de dólares em um grémio naval para produzir peças para os submarinos mais avançados da Marinha dos Estados Unidos. O objetivo é reduzir a dependência das principais empresas contratadas para a produção militar.", "titulo_pt": "Anduril planeja grémio naval para produzir peças para submarinos da marinha dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 198286, "titulo": "Startup de IA apoiada por Nvidia e governo Trump lança modelo para competir com chinesas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10  198805, "titulo": "Mistral AI unveils new AI model aimed at 'narrowing the gap' with top Chinese competitors", "url": "https://www.lemonde.fr/en/economy/article/2026/10/06/mistral-ai-unveils-new-ai-model-aimed-at-narrowing-the-gap-with-top-chinese-competitors_6758318_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup francesa Mistral AI lançou um novo modelo de IA chamado Mistral Large 4, com o objetivo de reduzir a diferença em desempenho em relação aos principais concorrentes chineses. O modelo está disponível a partir de terça-feira.", "titulo_pt": "Mistral AI anuncia novo modelo de IA para 'reduzir a distância' com rivais chineses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198894, "titulo": "Google DeepMind's Lila Ibrahim, world's top AI 'readiness' officer, on preparing for what's to come", "url": "https://www.cnbc.com/2026/10/06/google-deepmind-ai-risks-lila-ibrahim.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-06T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lila Ibrahim, a Chief AI Readiness Officer da Google DeepMind, é a única pessoa com essa posição. Ela se dedica seriamente à preparação para os riscos crescentes de inteligência artificial.", "titulo_pt": "Lila Ibrahim, a única diretora de prontidão para IA da google DeepMind, sobre a preparação para os desafios futuros", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 198408, "titulo": "AI Paralysis: o excesso de ferramentas de IA está travando a produtividade das equipes, diz estudo", "url": "https://exame.com/inteligencia-artificial/ai-paralysis-o-excesso-de-ferramentas-de-ia-esta-travando-a-produtividade-das-equipes/", "fonte_id": "exame", "data_pub": "2026-10-06T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas recentes indicam que o uso excessivo de várias ferramentas de inteligência artificial simultaneamente pode aumentar a fadiga mental e diminuir o desempenho dos profissionais. O estudo sugere que o excesso de ferramentas de IA pode estar prejudicando a produtividade das equipes.", "titulo_pt": "Paralisia de IA: o excesso de ferramentas de IA está reduzindo a produtividade das equipes, diz estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 198296, "titulo": "Dona da Wikipédia diz que ação de agentes de IA pode ter derrubado site em maio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/dona-do-wikipedia-diz-que-acao-de-agentes-de-ia-pode-ter-derrubado-site-em-maio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T13:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação Wikimedia informou que o tráfego intenso gerado por agentes de IA fora do controle da OpenAI pode ter causado uma interrupção no serviço de dados da Wikipédia em maio.", "titulo_pt": "Dono da Wikipédia culpa agentes de IA por interrupção em maio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199069, "titulo": "Mistral Says Its New AI Model ‘Le Chonk’ Is the Best Open-Weight Offering Outside of China", "url": "https://www.wired.com/story/mistral-new-model-le-chonk-open-source-china-us-frontier/", "fonte_id": "wired", "data_pub": "2026-10-06T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mistral lançou um novo modelo de inteligência artificial com um bilhão de parâmetros, intitulado 'Le Chonk', buscando mostrar que ainda está na corrida para construir inteligência artificial de ponta.", "titulo_pt": "Mistral afirma que seu novo modelo AI 'Le Chonk' é o melhor oferecimento aberto fora da China", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 199082, "titulo": "A 2-in-1 approach captures toxic metals and recovers rare earth elements from wastewater", "url": "https://phys.org/news/2026-10-approach-captures-toxic-metals-recovers.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo de recuperação de metais tóxicos e elementos raros da água residual pode ser efetuado de forma simultânea. Objetos eletrônicos queimados, como lentes de câmera, fones de ouvido ou telefones antigos, contêm elementos raros valiosos que podem ser recuperados antes de serem descartados.", "titulo_pt": "Abordagem 2-em-1 captura metais tóxicos e recupera elementos raros de água residual", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199083, "titulo": "'Let me explain': Corporate disclosures can take a circuitous route", "url": "https://phys.org/news/2026-10-corporate-disclosures-circuitous-route.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas podem divulgar informações de maneiras indiretas, mesmo que o caminho mais direto seja mais eficiente. Às vezes, essas abordagens mais longas podem trazer vantagens específicas.", "titulo_pt": "Deixe-me explicar: as divulgações corporativas podem seguir um caminho mais longo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199084, "titulo": "Webb captures commotion from nebula's stellar jets", "url": "https://phys.org/news/2026-10-webb-captures-commotion-nebula-stellar.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb da NASA/ESA/CSA revelou estrelas ocultas por nuvens de poeira em uma natalício estelar chamado NGC 7129, a 3.300 luzes-ano da Terra. A captura de luz infravermelha pelo telescópio permitiu visualizar regiões densas que normalmente escurecem a visão de outras formas de luz.", "titulo_pt": "Webb registra agitação de jatos estelares em natalício de estrelas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199085, "titulo": "A gamma-ray burst's engine stayed active for nearly a month, breaking the previous record", "url": "https://phys.org/news/2026-10-gamma-ray-stayed-month-previous.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram a atividade do motor central mais longa já registrada em um raio-gama. O raio-gama durou cerca de 27 dias em seu próprio referencial de descanso, o que é aproximadamente 20 dias mais longo do que o recorde anterior.", "titulo_pt": "O motor de um raio-gama brilhou por quase um mês, quebrando o recorde anterior", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199086, "titulo": "Endangered Lantau toads show genetic and call differences that could signal an emerging species", "url": "https://phys.org/news/2026-10-endangered-lantau-toads-genetic-differences.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sapo-cornudo de curta perna (Boulenophrys brachykolos), listado como em perigo de extinção na Lista Vermelha da União Internacional para a Conservação da Natureza (IUCN), é a única espécie de rã pequena conhecida em Hong Kong pertencente ao gênero Boulenophrys da família Megophryidae.", "titulo_pt": "Sapos ameaçados de Lantau mostram diferenças genéticas e de chamado que podem indicar a emergência de uma nova espécie", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199087, "titulo": "News you can use: Holiday travel does not have to break the bank", "url": "https://phys.org/news/2026-10-news-holiday-bank.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O período festivo é uma ocasião para se reunir e celebrar, mas se essa reunião envolver viagens aéreas, os preços dos bilhetes podem se tornar uma barreira significativa para a alegria natalina.", "titulo_pt": "Notícias úteis: viagens de férias não precisam quebrar o banco", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199088, "titulo": "How gender shapes perceptions of workplace gossip", "url": "https://phys.org/news/2026-10-gender-perceptions-workplace-gossip.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Escola de Liderança de Negócios James & Gail Ellis demonstrou que a gossip no ambiente de trabalho pode desempenhar um papel mais complexo nas relações organizacionais do que é geralmente percebido, não sendo necessariamente negativa.", "titulo_pt": "Como o gênero molda as percepções sobre a gossip no ambiente de trabalho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 198473, "titulo": "O que se sabe sobre a morte de técnica de instituto antipeste na Rússia", "url": "https://www.infomoney.com.br/mundo/o-que-se-sabe-sobre-a-morte-de-tecnica-de-instituto-antipeste-na-russia/", "fonte_id": "infomoney", "data_pub": "2026-10-06T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma técnica de um instituto antipeste na Rússia faleceu, levando à quarentena de um hospital e ao monitoramento de pessoas que entraram em contato com ela. O caso gerou preocupação e medidas de biossegurança foram implementadas.", "titulo_pt": "O que se sabe sobre a morte de técnica de instituto antipeste na Rússia", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 198987, "titulo": "EU wants to track potential rogue efforts to block out the sun", "url": "https://www.scmp.com/news/world/europe/article/3369959/eu-wants-track-potential-rogue-efforts-block-out-sun?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia lançou um edital de €35 milhões para financiar pesquisas e coordenação, incluindo o detecção de esforços potenciais de alterar o atmosfera da Terra ao bloquear o sol. Esta iniciativa faz parte de uma abordagem inicial para coordenar ações sobre a Modificação de Radiação Solar, uma tecnologia emergente e controversa que poderia ser usada para refrescar o planeta.", "titulo_pt": "Ue quer rastrear esforços potenciais para bloquear o sol", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 199140, "titulo": "Astronomers Solve Cosmic Cold Case with NASA Hubble Data", "url": "https://www.nasa.gov/image-article/astronomers-solve-cosmic-cold-case-with-nasa-hubble-data/", "fonte_id": "nasa_news", "data_pub": "2026-10-06T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram uma pista química surpreendente que indica que a estrela branca HS 0209+0832 pode abrigar um planeta da segunda geração. Essa possibilidade foi ilustrada em uma concepção artística lançada em 5 de outubro de 2026.", "titulo_pt": "Astrônomos resolvem caso cósmico com dados da NASA Hubble", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 199141, "titulo": "NASA’s Curiosity Rover Catches Stunning Martian Dawn", "url": "https://www.nasa.gov/missions/mars-science-laboratory/curiosity-rover/nasas-curiosity-rover-catches-stunning-martian-dawn/", "fonte_id": "nasa_news", "data_pub": "2026-10-06T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Curiosidade, rover da NASA, capturou uma panorâmica detalhada das falésias distantes do Marte, criadas pelo vento, em um amanhecer local. A imagem, tirada às 8:30 da manhã do horário local do Marte, destaca cores azuis vibrantes no fundo devido à luz da manhã.", "titulo_pt": "Curiosidade da nasa captura vista fantástica do amanhecer martiano", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 198347, "titulo": "Rússia diz que não há casos de peste em cidade da Sibéria", "url": "https://www.cartacapital.com.br/mundo/russia-diz-que-nao- e minister vows to ‘ramp up’ efforts to regain Parthenon marbles", "url": "https://www.theguardian.com/artanddesign/2026/oct/06/greek-prime-minister-pledges-to-ramp-up-efforts-to-regain-parthenon-marbles", "fonte_id": "guardian_world", "data_pub": "2026-10-06T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro grego, Kyriakos Mitsotakis, declarou que vai intensificar as reivindicações do país para recuperar os marbles do Partenon do British Museum. Mitsotakis mencionou que seu homólogo britânico, Andy Burnham, foi muito favorável a esses esforços de restituição antes de se tornar secretário de Estado.", "titulo_pt": "Grego promete intensificar reivindicações para recuperar marbles do partenon do british museum", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198329, "titulo": "Ministério Público pede 61 anos de condenação para apresentador réu por golpe do Pix", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/ministerio-publico-pede-61-anos-de-condenacao-para-apresentador-reu-por-golpe-do-pix.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-06T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público da Bahia recomendou uma condenação de 61 anos para Marcelo Castro, apresentador do Alô Juca na TV Aratu, por um caso relacionado ao golpe do Pix. Se a recomendação for aceita, a pena será a máxima em regime fechado.", "titulo_pt": "Mp pede 61 anos de condenação para apresentador réu por golpe do Pix", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 198330, "titulo": "Gabriela Medvedovsky vai protagonizar série na Disney com Camila Queiroz", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/gabriela-medvedovsky-vai-protagonizar-serie-na-disney-com-camila-queiroz.shtml",
