<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

 a japonesa Tomoko Akane, em um movimento mais amplo contra a corte, liderado pelo governo Trump. O país também enfrenta críticas internas e externas por ter pausado a construção de uma muralha na fronteira do Parque Nacional Big Bend, em um conflito ambiental e social. Em outro desenvolvimento, um terremoto de magnitude 4,8 ocorreu perto de Gójar, na Espanha, causando ferimentos leves. O julgamento contra a Meta, que detém o Facebook e o Instagram, começou em um tribunal da Califórnia, com quatro estados acusando a empresa de criar sistemas que promovem a adicção de jovens. Além disso, o influenciador de mídia social da Nigéria foi detido após a apreensão de cocaína avaliada em 28 milhões de dólares. Em Afeganistão, pelo menos 42 crianças morreram em uma explosão em Kabul, enquanto a ex-ministra francesa Yvette Roudy faleceu aos 97 anos, tendo sido pioneira na inclusão de cobertura de abortos no sistema de saúde do país. O ministro das Relações Exteriores da China, Wang Yi, está prestes a visitar Seul, após Donald Trump sugerir reduzir as manobras militares com a Coreia do Sul, gerando incertezas entre aliados americanos na Ásia.\n\nO conflito entre Estados Unidos e Irã continua a dominar a cena geopolítica. Enquanto o Irã ameaça fechar o Estreito de Ormuz até que os Estados Unidos cumpram um acordo, o presidente americano Joe Biden publicou um mapa mostrando o estreito como um novo território americano. As tensões cibernéticas também são uma preocupação, com especialistas alertando sobre possíveis ações dos EUA e das grandes empresas de tecnologia que podem influenciar as eleições brasileiras. Em outro desenvolvimento, a Ucrânia realizou um dos maiores ataques de drones contra a Rússia, afetando mais de 5 mil pessoas. A Coreia do Sul considerou enviar seu sistema de defesa aérea Cheongung-II para a Ucrânia. Por fim, a Rússia protestou contra declarações do primeiro-ministro japonês sobre suas visitas às Ilhas Kuril, e a China planeja visitar Seul para discutir questões relacionadas ao Norte Coreia e assuntos bilaterais.", "economia": "As eleições no Brasil estão testando o real, com o Citi removendo o real de sua cesta de carry trade e optando pelo rand sul-africano. O dólar está oscilando, com uma alta de 0,29% para R$ 5,214. A Bolsa avança devido às tensões no Oriente Médio que pressionam os preços do petróleo e levantam preocupações com a inflação. A aplicação de renda fixa mais vulnerável, segundo a ARX, destaca a importância de investimentos indexados à inflação. A Nokia planeja reduzir significativamente sua força de trabalho na China continental e encerrar gradualmente suas instalações até o final de 2026. A Apple reformulou as taxas de sua loja de aplicativos na Europa para resolver controvérsias com reguladores decorrentes da aplicação da Digital Markets Act europeia. A Ultragaz inaugurou sua primeira estação de biometano no Brasil em Paulínia, com capacidade para abastecer até 20 mil m³ de biometano por dia e atender cerca de 200 caminhões. A Fitch rebaixou o rating de crédito da Braskem de 'C' para 'RD', classificação de inadimplência restrita, devido ao não cumprimento do pagamento de juros sobre obrigações financeiras. A joint venture entre a Braskem e o Grupo Idesa, com operações no México, solicitou recuperação judicial nos Estados Unidos em 18 de agosto de 2026. A Fazenda suspendeu a licença de apostas de cinco empresas, incluindo negócios ligados à influenciadora Deolane Bezerra e ao grupo Pixbet, por falta de entrega de documentos obrigatórios. O Ministério da Fazenda concedeu ao Itaú Unibanco uma aprovação preliminar para operar com uma licença nacional nos Estados Unidos. A receita anualizada da Anthropic, empresa por trás do Claude, ultrapassou US$ 65 bilhões antes da oferta pública inicial de ações. A Paramount solicitou que os estados dos EUA que se opõem à aquisição da Warner Bros. Discovery apresentem uma fiança de US$ 1,9 bilhão para cobrir eventuais perdas financeiras. A Getnet muda de CEO após cinco anos, com Cristiane Nogueira assumindo o cargo. A Cepal indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026. A Apple reformulou as taxas de sua loja de aplicativos na Europa para resolver controvérsias com reguladores decorrentes da aplicação da Digital Markets Act europeia. A Cepal indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026. A Cepal indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026. A Cepal indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026. A Cepal indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026. A Cepal indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026.", "tecnologia": "A OpenAI implementou novas medidas de segurança após um vazamento no Hugging Face, incluindo um monitoramento mais detalhado dos modelos durante o desenvolvimento e uma maior ênfase na alinhamento e segurança após o treinamento. Em um desenvolvimento notável, a startup Etched dobrou sua avaliação para US$ 21 bilhões em um mês, após a Jane Street instalar seu primeiro sistema de cluster AI e liderar uma rodada de financiamento significativa. A Apple reformulou suas taxas da App Store na Europa, substituindo a taxa por instalação por uma comissão de 5% para aplicativos distribuídos fora da App Store, e simplificou as regras para desenvolvedores de mercados de aplicativos alternativos. O Google implementou uma solução de inteligência artificial nos semáforos de São Paulo para melhorar a fluidez do trânsito, enquanto um projeto conjunto do Google e do governo britânico usa IA para prever regiões propícias à formação de rastros de condensação em corredores aéreos do Atlântico, com o objetivo de reduzir o impacto climático dos aviões. Além disso, a startup Nome utiliza inteligência artificial e conhecimento em desenvolvimento de medicamentos para ajudar famílias de pacientes com doenças raras a transformarem diagnósticos genéticos em possíveis caminhos para tratamento, enquanto a Baidu registrou uma queda de 4% no faturamento trimestral devido à desaceleração do setor publicitário, que não foi compensada pelo crescimento das operações de nuvem de inteligência artificial.", "ciencia": "A Organização Mundial da Saúde, sob a liderança de Tedros Adhanom Ghebreyesus, alertou que a epidemia de Ebola na República Democrática do Congo está progredindo rapidamente e corre o risco de se espalhar para mais países. Segundo a OMS, a epidemia tem um 'grande head start' e os esforços para contê-la ainda estão atrasados. Além disso, a NASA apresentou uma nova pintura em seu Boeing 777 em 11 de agosto de 2026, adquirido para substituir e expandir as capacidades da antiga DC-8, que foi aposentada em 2024. O B777 começará a operar do Centro de Pesquisas Langley da NASA em Hampton, Virgínia, a partir de 2027. O dente espiralado do narwhal tem sido um mistério científico há muito tempo, mas os cientistas estão próximos de descobrir o que torna esse dente tão especial. Além disso, a energia solar se tornou a forma mais barata de energia no mundo devido a quatro principais razões, levando a um aumento repentino e significativo no uso da energia solar nos últimos anos.", "cultura": "Laura Cardoso, atriz brasileira de 98 anos, faleceu em 17 de fevereiro de 2026, sendo homenageada por amigos, colegas e fãs. A atriz, que teve uma carreira de mais de 8 décadas, foi lembrada por colegas como José Loreto, Fernanda Torres e Beth Goulart. A Globo exibiu um especial de homenagem à atriz na tarde do dia 18 de fevereiro. A atriz retornou às gravações de 'Sol Nascente' em 2017 após um afastamento por motivos de saúde, sendo recebida com aplausos. O Ministério da Cultura expressou solidariedade à família e aos fãs de Laura Cardoso. O Festival de Brasília do Cinema Brasileiro terá sua 59ª edição, com mais de 70 produções sendo exibidas de 11 a 19 de setembro. A atriz Estrela Leminski, filha do poeta Paulo Leminski, lançou o álbum 'Completamente Poeta' e fará um show em São Paulo. O Festival de Edimburgo recebeu performances intensas, como a de Megan Tomei, que pedala 27 km por apresentação em um show de spinning, e One Fell Swoop, um circo australiano que se destaca com uma apresentação emocionante e mágica. A The Atlantic anunciou novos membros para sua equipe, incluindo Ian Bogost e Gabby Deutch como redatores e Nick Summers e Talya Zax como editores-sênior.", "sociedade": "Um ex-dirigente da Mos Burger e sua esposa, juntamente com seis supostos 'trabalhadores fantasma', compareceram em juízo após serem acusados de conspirar para fraudar a empresa de fast-food em cerca de HK$680.000 (US$86.670) em salários, conforme informou o SCMP. O caso veio à tona após denúncias feitas pelo Comissariado Independente Contra a Corrupção (ICAC) de Hong Kong. Em outro episódio, Shakira destinou US$1,25 milhão para reconstruir escolas danificadas pelo terremoto na Colômbia, anunciou a Fundação Pies Descalzos, em um esforço para reativar a educação na região afetada de Chocó, conforme informado pelo Rolling Stone Music.", "meio_ambiente": "Um Super El Niño, um fenômeno climático que pode se intensificar até 2027, pode alterar drasticamente o clima do Brasil, trazendo calor extremo, seca, incêndios e chuvas intensas. No Chile, seis áreas de Tocopilla tiveram evacuação ordenada devido à atividade de quebradas. No Pacífico, a quota anual de atum azul foi aumentada em 25% para 14.836 toneladas em 2027 e 2028. Na Inglaterra, um vídeo de drone registra campos afetados pela seca após o julho mais seco da história do país. Na Espanha e na França, soldados do Corpo de Bombeiros trabalham juntos para combater incêndios florestais em Aragão, onde mais de 17.000 hectares foram consumidos. Além disso, o Monte Etna, na Sicília, eruptou um dia após a morte de uma turista dos Estados Unidos por raio.", "direitos_humanos": "Um tribunal sírio condenou Wassim al-Assad, primo do presidente Bashar al-Assad, à morte por crimes contra a humanidade, por múltiplos assassinatos e por assassinatos acompanhados de tortura e brutalidade durante a guerra civil que durou quase 14 anos. Segundo relatos do South China Morning Post, esta sentença destaca a continuidade de graves violações dos direitos humanos no país. Em outro desenvolvimento, milhares de pessoas lamentaram a morte do ex-professor da Universidade de Cambridge, Jason Arday, em Londres, acusando a mídia de intensa e racista de ter contribuído para sua morte, conforme relatado pela Al Jazeera. Esses eventos refletem a complexidade e a amplitude dos desafios enfrentados pelos direitos humanos em diferentes partes do mundo, desde a violência estatal na Síria até a perseguição racial e a morte de indivíduos em terras europeias."}, "resumo_do_dia": {"politica_nacional": [{"id": 109487, "titulo": "Flávio anuncia nomes do mercado e setor de infraestrutura para ajudar no programa de governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/flavio-anuncia-nomes-do-mercado-e-setor-de-infraestrutura-para-ajudar-no-programa-de-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato a presidente pelo PL, anunciou nomes de especialistas do mercado financeiro e setor de infraestrutura para detalhar seu programa de governo.", "titulo_pt": "Flávio anuncia nomes do mercado e setor de infraestrutura para detalhar programa de governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 109488, "titulo": "Campanha de Renan Santos anuncia ex-secretário do governo Lula para equipe econômica", "url": "https://redir.folh ndo a defesa da criação de hospitais públicos para cães e gatos. Suêd Haidar é a vice na chapa de Grassi.", "titulo_pt": "Democrata Wilson Grassi concorre à presidência com background em veterinária e empresariado", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 109523, "titulo": "Samara Martins é a candidata do União Popular ao pleito presidencial", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/samara-martins-e-candidata-do-uniao-popular-ao-pleito-presidencial", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-18T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Samara Martins, formada em odontologia, é a candidata do partido Unidade Popular à presidência. Raquel Brício compõe a chapa como vice.", "titulo_pt": "Samara Martins é a candidata do União Popular ao pleito presidencial", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 109524, "titulo": "Sindicalista Rui Costa Pimenta concorrerá à Presidência pelo PCO", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/sindicalista-rui-costa-pimenta-concorrera-presidencia-pelo-pco", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-18T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rui Costa Pimenta, de 69 anos, jornalista e sindicalista, é o candidato do Partido da Causa Operária (PCO) à Presidência da República em 2026. Ele é o presidente do partido desde 1995 e concorrerá junto com o vice professor Antônio Carlos Silva.", "titulo_pt": "Sindicalista Rui Costa Pimenta concorrerá à Presidência pelo PCO", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 109525, "titulo": "Eleições 2026: Ronaldo Caiado é o candidato do PSD à Presidência", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/eleicoes-2026-ronaldo-caiado-e-o-candidato-do-psd-presidencia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-1 o passado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/08/pt-atrela-futuro-a-saudade-do-passado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva continuou a exaltar sua figura em atos oficiais de campanha, mantendo um ritmo contínuo desde outubro de 2022. A insistência na exaltação pessoal alimenta a suspeita de que Lula seja o principal ativo do Partido dos Trabalhadores (PT).", "titulo_pt": "PT vincula futuro à saudade do passado, com ênfase em lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 109493, "titulo": "Campanha de Lula avalia ato para evangélicos, mas ideia divide aliados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/campanha-de-lula-avalia-ato-para-evangelicos-mas-ideia-divide-aliados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe de campanha de Lula está considerando realizar um evento para evangélicos nas próximas semanas, possivelmente no Rio de Janeiro. A ideia divide os aliados do candidato.", "titulo_pt": "Campanha de Lula planeja evento para evangélicos, mas divisão entre aliados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 109752, "titulo": "Edinho diz que PT quer ampliar ‘diálogo’ para formar frente ‘antibolsonarista’", "url": "https://www.jota.info/eleicoes/eleicoes-2026/edinho-diz-que-pt-quer-ampliar-dialogo-para-formar-frente-antibolsonarista", "fonte_id": "jota", "data_pub": "2026-08-18T15:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PT mencionou o PSD, liderado por Kassab, e indicou que o partido busca ampliar o diálogo para formar uma frente 'antibolsonarista'.", "titulo_pt": "Edinho afirma que PT quer ampliar 'diálogo' para formar frente 'antibolsonarista'", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 109494, "titulo": "Veja quem são os candidatos à Presidência nas eleições de 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/veja-quem-sao-os-candidatos-a-presidencia-nas-eleicoes-de-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com o início oficial da campanha eleitoral, 13 candidatos registraram suas chapas para a disputa presidencial em 2026. As candidaturas aguardam o deferimento do Tribunal Superior Eleitoral, mas já podem iniciar suas campanhas.", "titulo_pt": "Conheça os candidatos à Presidência nas eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 109495, "titulo": "Flávio tem o maior patrimônio declarado do clã Bolsonaro, e Renan, o menor; veja valores", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-tem-o-maior-patrimonio-declarado-do-cla-bolsonaro-e-renan-o-menor-veja-valores.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro registrou sua candidatura no TSE no último dia do prazo, sendo a última a fazer isso entre os integrantes do clã Bolsonaro que concorrerão às eleições deste ano. O patrimônio declarado pelo clã varia de R$ 8,18 milhões a R$ 187,3 mil.", "titulo_pt": "Flávio tem o maior patrimônio declarado do clã Bolsonaro, e Renan, o menor; veja valores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 109526, "titulo": "Eleição: homem, branco e empresário é perfil majoritário de candidatos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/eleicao-homem-branco-e-empresario-e-perfil-majoritario-de-candidatos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-18T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral registrou 20.530 pedidos de registro de candidatura para as eleições deste ano, com 65% dos candidatos sendo homens e 35% mulheres. Mais de 10 mil candidatos declararam ter cor branca e 2.576 disseram ser empresários.", "titulo_pt": "Eleição: perfil majoritário de candidatos é homem, branco e empresário", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 109496, "titulo": "A economia do reconhecimento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/deborah-bizarria/2026/08/a-economia-do-reconhecimento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor descobriu que uma coluna publicada em outro veículo foi listada como o primeiro resultado ao buscar um estudo que ele havia usado em uma coluna da Folha. Isso ocorreu durante um dia no escritório, quando um colega pediu por uma referência de um estudo.", "titulo_pt": "A economia do reconhecimento", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 110127, "titulo": "Gli Usa impongono sanzioni contro la presidente della Cpi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/gli-usa-impongono-sanzioni-contro-la-presidente-della-cpi_a665d3d2-5e81-43a5-81d1-2c560f6e3bb1.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T17:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos impõem sanções contra a presidente da Cpi. A presidente é a japonesa Tomoko Akane.", "titulo_pt": "Estados unidos imputam sanções contra presidente da Cpi", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 109847, "titulo": "Israel Strikes Air Base in Syria, Drawing Ire From the U.S.", "url": "https://www.nytimes.com/2026/08/18/world/middleeast/israel-airstrikes-syria-air-base.html", "fonte_id": "nyt_world", "data_pub": "2026-08-18T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel atacou uma base aérea na Síria, gerando irritação dos Estados Unidos. Este ataque faz parte de uma série de intervenções militares israelenses na Síria nos últimos dois anos.", "titulo_pt": "Israel ataca Base aérea na síria, irritando EUA", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 109984, "titulo": "US announces new sanctions on top ICC figures", "url": "https://www.bbc.co.uk/news/articles/cnvnl0elz47o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-18T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump anunciou novas sanções a figuras-chave da Corte Penal Internacional. O governo prometeu desmantelar a corte 'pedra por pedra'.", "titulo_pt": "EUA anunciam novas sanções a figuras-chave da corte penal internacional", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 109934, "titulo": "'Profits won.' The child safety trial against Meta kicks off in federal court", "url": "https://www.npr.org/2026/08/18/nx-s1-5935458/meta-child-safety-social-media-addiction-trial-opening", "fonte_id": "npr_news", "data_pub": "2026-08-18T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O julgamento começou com as argumentações iniciais, onde quatro estados dos Estados Unidos enfrentam a empresa que detém o Facebook e o Instagram. Os estados acusam a Meta de saber que seus produtos podem atraír crianças e ter mentido sobre os riscos associados.", "titulo_pt": "Lucros conquistados. O julgamento contra a Meta por segurança infantil começa em tribunal federal", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 109789, "titulo": "Un nuevo terremoto de magnitud 4,8 sacude Granada y deja tres personas con heridas leves", "url": "https://elpais.com/espana/2026-08-18/un-nuevo-terremoto-de-magnitud-46-sacude-granada.html", "fonte_id": "elpais_america", "data_pub": "2026-08-18T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 4,8 ocorreu perto de Gójar, provocando sentido forte na área metropolitana de Granada. Três pessoas ficaram feridas levemente.", "titulo_pt": "Novo terremoto de magnitude 4,8 sacode Granada e deixa três feridos leves", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 110084, "titulo": "Spanish deputy PM’s rival at the ILO seeks US support in battle for leadership", "url": "https://english.elpais.com/economy-and-business/2026-08-18/spanish-deputy-pms-rival-at-the-ilo-seeks-us-support-in-battle-for-leadership.html", "fonte_id": "elpais_en", "data_pub": "2026-08-18T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yolanda Díaz, vice-primeira-ministra espanhola, propôs direitos trabalhistas mínimos e universais em 187 países da OIT. Gilbert F. Houngbo, seu rival pela liderança da OIT, deixou a porta aberta para um aliado de Trump assumir a posição de vice-diretor-geral da agência.", "titulo_pt": "Concorrente de vice-primeira-ministra espanhola na oit busca apoio dos EUA na batalha pelo comando", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 110085, "titulo": "Trump administration pauses border wall construction in Big Bend National Park amid criticism", "url": "https://english.elpais.com/usa/2026-08-18/trump-administration-pauses-border-wall-construction-in-big-bend-national-park-amid-criticism.html", "fonte_id": "elpais_en", "data_pub": "2026-08-18T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração Trump pausou a construção da muralha na fronteira em Big Bend Nacional Park diante da críticas. O projeto enfrentou oposição de democratas e republicanos devido a seu impacto potencial ambiental, cultural e econômico.", "titulo_pt": "Administração trump pausa construção da muralha na fronteira em Big Bend nacional Park diante da crítica", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 110129, "titulo": "Zelensky propone Yevhenii Khmara come nuovo ministro della Difesa", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/zelensky-propone-yevhenii-khmara-come-nuovo-ministro-della-difesa_d337494f-2d75-4af5-920a-f2d522b2eea4.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T17:25:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Yevhenii Khmara foi proposto por Zelensky para ser o novo ministro da Defesa. O voto no parlamento está previsto para o dia seguinte.", "titulo_pt": "Zelensky propõe Yevhenii Khmara como novo ministro da defesa", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 110128, "titulo": "Donna uccisa a coltellate a Collefero, il marito in stato di fermo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/donna-uccisa-a-coltellate-a-collefero-il-marito-in-stato-di-fermo_ff8c784b-1081-4dba-8cd5-35aac9ca8cb9.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T17:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi morta com uma faca em Collefero. O marido está detido sob custódia policial. A agressão teria ocorrido na presença do filho mais novo.", "titulo_pt": "Mulher assassinada a facadas em Collefero, marido em detenção", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 109562, "titulo": "Conflito no Irã causa escassez de flúor e coloca em risco a saúde bucal no Brasil", "url": "https://www.brasildefato.com.br/2026/08/18/conflito-no-ira-causa-escassez-de-fluor-e-coloca-em-risco-a-saude-bucal-no-brasil/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-18T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas de saneamento básico de Joinville e Itajaí, em Santa Catarina, anunciaram cortes na fluoretação da água distribuída à população. Blumenau também enfrenta escassez de flúor, com estoque suficiente para apenas 25 dias. O motivo dos cortes é a falta da substância, importante para a prevenção da cárie.", "titulo_pt": "Conflito no Irã causa escassez de flúor e coloca em risco a saúde bucal no Brasil", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 109991, "titulo": "ABC sues Trump's media regulator over threat to broadcast licenses", "url": "https://www.lemonde.fr/en/economy/article/2026/08/18/abc-sues-trump-s-media-regulator-over-threat-to-broadcast-licenses_6756642_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-18T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "ABC, uma empresa da Walt Disney, processou a Comissão Federal de Comunicações (FCC) acusando-a de exigir uma revisão antecipada das licenças de transmissão, que ABC afirma ser uma 'ameaça existencial' para suas operações.", "titulo_pt": "ABC processa regulador de mídia de Trump por ameaça a licenças de transmissão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 109788, "titulo": "Comienza el juicio decisivo contra Meta: “Sabían que sus plataformas perjudicaban a los jóvenes”", "url": "https://elpais.com/tecnologia/2026-08-18/comienza-el-juicio-decisivo-contra-meta-sabian-que-sus-plataformas-perjudicaban-a-los-jovenes.html", "fonte_id": "elpais_america", "data_pub": "2026-08-18T17:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Quatro estados americanos acusam a Meta (anteriormente Facebook) e Instagram de criar sistemas que promovem a adicção de jovens, pedindo 200 bilhões de dólares em um tribunal da Califórnia.", "titulo_pt": "Começa o julgamento decisivo contra Meta: 'sabiam que suas plataformas prejudicavam os jovens'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 110036, "titulo": "Minors living alone on Ceuta's streets at risk of abuse", "url": "https://www.dw.com/en/minors-living-alone-on-ceuta-s-streets-at-risk-of-abuse/a-78416604?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-18T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de menores desacompanhados se aglomeraram em Ceuta, um enclave espanhol na costa norte da África. A saúde e o risco de abuso desses menores são problemas graves, e as autoridades admitiram estar sobrecarregadas.", "titulo_pt": "Menores vivendo sozinhos nas ruas de Ceuta correm risco de abuso", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 110130, "titulo": "Emirati, 'l'Iran ha lanciato due missili balistici, finiti in mare'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/emirati-liran-ha-lanciato-due-missili-balistici-finiti-in-mare_abedab91-f906-49b8-b3a5-0cf55f222bc1.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T17:05:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Emirados Árabes Unidos alega que o Irã lançou dois misseis balísticos, que caíram no mar. Este seria o primeiro ataque ao país desde o memorando entre Teerã e Washington.", "titulo_pt": "Emiratis, 'o Irã lançou dois misseis balísticos, que acabaram no mar'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 110131, "titulo": "Federacciai presenta la manifestazione di interesse per gli stabilimenti ex Ilva", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/federacciai-presenta-la-manifestazione-di-interesse-per-gli-stabilimenti-ex-ilva_8c8da8a3-0fae-4a9e-a5d3-d9b461a38706.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T17:04:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Federação apresentou a manifestação de interesse pelos estabelecimentos ex Ilva. Além da federação, outras 14 empresas assinaram a proposta.", "titulo_pt": "Federação apresenta manifestação de interesse pelos ex estabelecimentos Ilva", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 110132, "titulo": "Il calciatore del Cagliari Trepy si risveglia dal coma", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/il-calciatore-del-cagliari-trepy-si-risveglia-dal-coma_8e3ee9ba-ec42-4329-8d3a-0a00526e7d2a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T17:01:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um atacante do Cagliari, Trepy, acordou do coma. Ele foi submetido a uma estubata e o hospital informou que não há déficits neurológicos.", "titulo_pt": "Atacante do Cagliari Trepy acorda do coma após estubata", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 109730, "titulo": "Eleições colocam real à prova e mercado troca aposta no Brasil por proteção cambial", "url": "https://www.infomoney.com.br/mercados/eleicoes-colocam-real-a-prova-e-mercado-troca-aposta-no-brasil-por-protecao-cambial/", "fonte_id": "infomoney", "data_pub": "2026-08-18T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Citi retirou o real de sua cesta de carry trade e optou pelo rand sul-africano, enquanto bancos e gestores de investimentos alertam para o aumento do prêmio de risco antes das eleições presidenciais no Brasil.", "titulo_pt": "Eleições colocam real à prova e mercado troca aposta no Brasil por proteção cambial", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 109500, "titulo": "CEO que demitiu 900 pessoas via Zoom é mandado embora, diz emissora", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ceo-que-demitiu-900-pessoas-via-zoom-e-mandado-embora-diz-emissora.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O executivo indiano Vishal Garg, conhecido por realizar demissões em larga escala por videoconferência, foi demitido do cargo de CEO da empresa Better Home & Finance na segunda-feira (3).", "titulo_pt": "CEO que demitiu 900 pessoas via Zoom é demitido, diz cnn business", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109737, "titulo": "A aplicação de renda fixa mais vulnerável se a inflação desandar, segundo a ARX", "url": "https://www.infomoney.com.br/onde-investir/renda-fixa-mais-vulneravel-se-inflacao-desandar-segundo-arx/", "fonte_id": "infomoney", "data_pub": "2026-08-18T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ARX identificou um componente da carteira de renda fixa que seria mais afetado por uma aceleração da inflação. A instituição destaca a importância de investimentos indexados à inflação.", "titulo_pt": "Aplicação de renda fixa mais vulnerável se inflação disparar, segundo ARX", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 109501, "titulo": "Nokia fechará quase todas suas instalações na China continental neste ano, diz jornal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/nokia-fechara-quase-todas-suas-instalacoes-na-china-continental-neste-ano-diz-jornal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nokia planeja reduzir significativamente sua força de trabalho na China continental e encerrar gradualmente suas instalações até o final de 2026, conforme informado pelo South China Morning Post.", "titulo_pt": "Nokia fechará quase todas suas instalações na China continental neste ano", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 110026, "titulo": "Apple overhauls Europe app store fees to resolve payments clash", "url": "https://www.cnbc.com/2026/08/18/apple-eu-app-store-fees-iphone.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-18T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple reformulou as taxas da sua loja de aplicativos na Europa para resolver controvérsias com reguladores decorrentes da aplicação da Digital Markets Act europeia.", "titulo_pt": "Apple reformula taxas da loja de aplicativos na Europa para resolver conflitos com reguladores", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 109502, "titulo": "Reclamações contra Casas Bahia sobem 65% neste ano, e queixas por entrega já superam todo 2025", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/reclamacoes-contra-casas-bahia-sobem-65-neste-ano-e-queixas-por-entrega-ja-superam-todo-2025.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As reclamações de consumidores contra as Casas Bahia aumentaram 65% de janeiro a julho de 2026 em comparação com o mesmo período de 2025, e as queixas relacionadas à entrega já superaram o total de 2025. O grupo pediu recuperação judicial no início de agosto de 2026.", "titulo_pt": "Reclamações contra Casas Bahia sobem 65% neste ano, e queixas por entrega já superam todo 2025", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109751, "titulo": "Zanin marca nova audiência sobre regras da Anvisa para 1º de dezembro", "url": "https://www.jota.info/saude/zanin-marca-nova-audiencia-sobre-regras-da-anvisa-para-1o-de-dezembro", "fonte_id": "jota", "data_pub": "2026-08-18T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As RDC 96/2008 e RDC 24/2010 estão sendo questionadas na ADI 7788, com Zanin sendo o relator do caso no Supremo Tribunal Federal (STF).", "titulo_pt": "Zanin analisa questionamentos sobre regras da Anvisa para 1º de dezembro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 109504, "titulo": "Axia deverá desembolsar R$ 1,5 bi com resgates de ações, estima Itaú BBA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466741", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Axia Energia, ex-Eletrobras, deve desembolsar aproximadamente R$ 1,5 bilhão com resgates de ações preferenciais classe C, de um plano total de R$ 2 bilhões aprovado pelo conselho de administração, conforme estimativa do Itaú BBA.", "titulo_pt": "Axia deve desembolsar R$ 1,5 bi com resgates de ações, estima Itaú BBA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109505, "titulo": "Crédito imobiliário pode ficar mais caro com novo modelo de captação de recursos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/credito-imobiliario-pode-ficar-mais-caro-com-novo-modelo-de-captacao-de-recursos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T15:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo modelo de crédito imobiliário brasileiro, que visa reduzir a dependência dos bancos em relação à poupança, pode levar a juros mais altos para os compradores de imóveis em períodos de taxas elevadas de juros.", "titulo_pt": "Crédito imobiliário pode ficar mais caro com novo modelo de captação de recursos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109506, "titulo": "Criptomoedas ganham espaço no Brasil e superam ações e CDBs, diz pesquisa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/criptomoedas-ganham-espaco-no-brasil-e-superam-acoes-e-cdbs-diz-pesquisa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa nacional sobre criptomoedas, realizada pela Paradigma em parceria com o Datafolha, revelou que mais brasileiros já tiveram contato com criptomoedas do que com ações e CDBs. Cerca de 17,2% dos brasileiros com mais de 16 anos têm ou já tiveram criptomoedas, contra 15,1% para CDBs e títulos públicos e 7,4% para ações.", "titulo_pt": "Criptomoedas superam ações e CDBs no Brasil, mostra pesquisa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109507, "titulo": "Cepal vê tarifas de Trump pressionarem mais a América Latina em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/cepal-ve-tarifas-de-trump-pressionarem-mais-a-america-latina-em-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão Econômica para a América Latina e o Caribe (Cepal) indicou que as tarifas impostas por Donald Trump podem continuar pressionando as economias latino-americanas até 2026. O secretário-executivo da Cepal, José Manuel Salazar-Xirinachs, afirmou que a incerteza no comércio mundial causada por essas tarifas atingirá 'um pouco mais' os países da região nesse período.", "titulo_pt": "Cepal prevê impacto das tarifas de Trump nas economias latino-americanas até 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109638, "titulo": "União de gigantes amplia segurança para mercado de R$ 10 tri em duplicatas", "url": "https://exame.com/negocios/uniao-de-gigantes-amplia-seguranca-para-mercado-de-r-10-tri-em-duplicatas/", "fonte_id": "exame", "data_pub": "2026-08-18T14:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nexxera e Núclea uniram forças para expandir o mercado de duplicatas, que tem um volume de negócios de R$ 10 trilhões, integrando dados de transações e histórico financeiro para reduzir riscos e facilitar o acesso a capital e crédito para empresas.", "titulo_pt": "União de gigantes amplia segurança no mercado de duplicatas de R$ 10 trilhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 109508, "titulo": "Ultragaz inaugura sua primeira estação própria de biometano do país em Paulínia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/ultragaz-inaugura-sua-primeira-estacao-propria-de-biometano-do-pais-em-paulinia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ultragaz inaugurou a sua primeira estação de biometano no Brasil em Paulínia, com capacidade para abastecer até 20 mil m³ de biometano por dia e atender cerca de 200 caminhões. Esta é parte da estratégia de descarbonização da empresa.", "titulo_pt": "Ultragaz inaugura sua primeira estação própria de biometano no país em Paulínia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109509, "titulo": "Fazenda suspende 14 bets, incluindo três ligadas a Deolane, por falta de documentação; veja lista", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/fazenda-suspende-mais-14-bets-incluindo-tres-ligadas-a-deolane-por-falta-de-documentacao-veja-lista.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T13:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Fazenda suspendeu a licença de apostas de cinco empresas, incluindo negócios ligados à influenciadora Deolane Bezerra e ao grupo Pixbet, devido à falta de entrega de documentos obrigatórios. Como cada companhia pode ter até três marcas, 14 sites foram suspensos pelas medidas cautelares.", "titulo_pt": "Fazenda suspende 14 sites de apostas, incluindo três ligados a Deolane, por falta de documentação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109510, "titulo": "Tribunal estadual dos EUA adia julgamento de Luigi Mangione sobre assassinato de CEO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466740", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento de Luigi Mangione por assassinato de um executivo em Nova York foi adiado pelo tribunal estadual. A promotoria foi solicitada a responder a um pedido da defesa de Mangione para extinguir o processo.", "titulo_pt": "Julgamento de Luigi Mangione por assassinato de CEO é adiado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109512, "titulo": "MPF pede que Ibama esclareça plano da Petrobras de novos poços na Foz do Amazonas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466738", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T13:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal pediu esclarecimentos ao Ibama sobre os pedidos da Petrobras para perfurar três novos poços exploratórios na Bacia da Foz do Amazonas. O Ibama terá cinco dias para responder.", "titulo_pt": "MPF pede esclarecimentos ao Ibama sobre novos poços da Petrobras na Foz do Amazonas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 110173, "titulo": "Innolux confidently predicts huge growth in shipments", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/19/2003862715", "fonte_id": "taipei_times", "data_pub": "2026-08-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Innolux prevê um significativo crescimento nas entregas de produtos. A empresa está confiante sobre essas projeções de crescimento.", "titulo_pt": "Innolux confiante sobre grande crescimento nas entregas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 110237, "titulo": "OpenAI institutes new safeguards after Hugging Face breach", "url": "https://techcrunch.com/2026/08/18/openai-institutes-new-safeguards-after-hugging-face-breach/", "fonte_id": "techcrunch", "data_pub": "2026-08-18T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI implementou novas medidas de segurança após o vazamento do Hugging Face, incluindo um monitoramento mais detalhado dos modelos durante o desenvolvimento e uma maior ênfase na alinhamento e segurança após o treinamento.", "titulo_pt": "Openai implementa novas medidas de segurança após vazamento do Hugging Face", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 110238, "titulo": "Etched’s valuation doubles to $21B in a month", "url": "https://techcrunch.com/2026/08/18/etcheds-valuation-doubles-to-21b-in-a-month/", "fonte_id": "techcrunch", "data_pub": "2026-08-18T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Etched dobrou sua avaliação para US$ 21 bilhões em um mês, após a Jane Street instalar seu primeiro sistema de cluster AI e liderar uma rodada de financiamento significativa.", "titulo_pt": "Valoração da etched dobra para us$ 21 bilhões em um mês", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 110213, "titulo": "PlayStation’s wireless gaming speakers launch in November", "url": "https://www.theverge.com/tech/981562/sony-playstation-pulse-elevate-wireless-gaming-speakers-launch-date-preorder", "fonte_id": "the_verge", "data_pub": "2026-08-18T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os alto-falantes sem fio Pulse Elevate da Sony estão sendo lançados no dia 12 de novembro e custarão $219,99. Eles são compatíveis com PS5, PlayStation Portal, PC e Mac e incluem drivers magnéticos planares de estúdio que oferecem som vivo em todo o espectro audível.", "titulo_pt": "Alto-falantes sem fio pulse elevate da sony lançam em novembro", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 110239, "titulo": "Apple overhauls its EU App Store fees, loosens rules for alternative app stores", "url": "https://techcrunch.com/2026/08/18/apple-overhauls-its-eu-app-store-fees-loosens-rules-for-alternative-app-stores/", "fonte_id": "techcrunch", "data_pub": "2026-08-18T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple está simplificando suas taxas deApp Store na Europa, substituindo a taxa por instalação por uma comissão de 5% para aplicativos distribuídos fora da App Store e tornando mais fácil para desenvolvedores operar mercados de aplicativos alternativos.", "titulo_pt": "Apple reestrutura suas taxas de App Store na Europa e facilita mercados alternativos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 109592, "titulo": "Google leva IA aos semáforos de São Paulo para tentar reduzir trânsito", "url": "https://veja.abril.com.br/coluna/faria-lima-news/google-leva-ia-aos-semaforos-de-sao-paulo-para-tentar-reduzir-transito/", "fonte_id": "veja", "data_pub": "2026-08-18T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google implementou uma solução de inteligência artificial nos semáforos de São Paulo com o objetivo de melhorar a fluidez do trânsito. O sistema analisa dados de movimentação de veículos coletados pelo Google Maps.", "titulo_pt": "Google implementa IA nos semáforos de São Paulo para reduzir congestionamento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 110214, "titulo": "Apple squashes EU beef with new App Store rules", "url": "https://www.theverge.com/tech/981504/apple-app-store-eu-rules-core-technology-commission", "fonte_id": "the_verge", "data_pub": "2026-08-18T16:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está novamente reformulando as regras da App Store no Europa, alegando que isso resolverá suas 'diferenças com a Comissão Europeia sobre termos de negócios e distribuição alternativa'. Como parte dessas mudanças, todos os desenvolvedores que distribuem apps serão submetidos a um conjunto único de termos de negócios.", "titulo_pt": "Apple refaz regras da App Store no EUA, dizendo que resolverá disputas com a comissão", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 109503, "titulo": "A IA não saiu do controle. É pior do que isso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/a-ia-nao-saiu-do-controle-e-pior-do-que-isso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em maio, a OpenAI realizou um experimento de cibersegurança que resultou em hackers internos contornando restrições e colaborando por vários dias. Este evento foi alarmante pois demonstrou uma falha significativa nos sistemas de controle da IA.", "titulo_pt": "A IA não saiu do controle. É pior do que isso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 110253, "titulo": "Viral Disneyland Content Creator Defends Her ‘Special Friendship’ With Peter Pan", "url": "https://www.wired.com/story/viral-disneyland-content-creator-defends-her-special-friendship-with-peter-pan/", "fonte_id": "wired", "data_pub": "2026-08-18T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Toni Kulusich, uma superfã da Disney, foi acusada de perseguir seu personagem favorito, Peter Pan, levantando discussões sobre os limites com os atores de parque. Ela afirma para a WIRED que a reação negativa é injusta.", "titulo_pt": "Superfã da disney se defende de acusações de stalkeria com Peter Pan", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 109626, "titulo": "Google testa IA para reduzir impacto climático de aviões em corredor aéreo no Atlântico", "url": "https://exame.com/inteligencia-artificial/google-testa-ia-para-reduzir-impacto-climatico-de-avioes-em-corredor-aereo-no-atlantico/", "fonte_id": "exame", "data_pub": "2026-08-18T14:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto, apoiado pelo governo britânico, usa inteligência artificial para prever regiões propícias à formação de rastros de condensação e desvia voos de forma pontual. O objetivo é reduzir o impacto climático dos aviões em um corredor aéreo no Atlântico.", "titulo_pt": "Google testa IA para reduzir impacto climático de aviões em corredor aéreo no Atlântico", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 110254, "titulo": "Meta Ran Ads for an App That Promised to Nudify Female Politicians", "url": "https://www.wired.com/story/meta-ran-ads-for-an-app-promising-to-nudify-female-politicians/", "fonte_id": "wired", "data_pub": "2026-08-18T14:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um anúncio exibiu um vídeo pornográfico com uma deepfake que se assemelhava a uma política americana proeminente. A Apple removeu a aplicativo da App Store após uma investigação do WIRED.", "titulo_pt": "Meta anunciou aplicativo que prometia nudes de políticas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 109631, "titulo": "Aos 18 anos, jovem fatura US$ 1,4 milhão por mês com app de IA criado no quarto de casa", "url": "https://exame.com/carreira/aos-18-anos-jovem-fatura-us-14-milhao-por-mes-com-app-de-ia-criado-no-quarto-de-casa-3/", "fonte_id": "exame", "data_pub": "2026-08-18T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zach Yadegari, aos 18 anos, gerencia uma empresa de inteligência artificial que fatura US$ 1,4 milhão mensais. O app foi criado em seu quarto de casa e está competindo no mercado tecnológico.", "titulo_pt": "Aos 18 anos, jovem fatura r$ 4,7 milhões por mês com app de IA criado no quarto de casa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 109632, "titulo": "Cansado de tarefas repetitivas? 5 coisas que a IA pode automatizar no seu trabalho hoje", "url": "https://exame.com/inteligencia-artificial/cansado-de-tarefas-repetitivas-5-coisas-que-a-ia-pode-automatizar-no-seu-trabalho-hoje/", "fonte_id": "exame", "data_pub": "2026-08-18T14:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Profissionais podem utilizar ferramentas de inteligência artificial para automatizar tarefas repetitivas como e-mails e planilhas, liberando tempo para atividades que exigem análise.", "titulo_pt": "Cansado de tarefas repetitivas? 5 coisas que a IA pode automatizar no seu trabalho hoje", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 110196, "titulo": "Meet the Chinese AI star who splashed a reported US$70m on a California mansion", "url": "https://www.scmp.com/tech/big-tech/article/3364380/meet-chinese-ai-star-who-splashed-reported-us70m-california-mansion?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tony Wu Yuhuai, co-fundador chinês da lab de inteligência artificial de Elon Musk, gerou discussões nas redes sociais chinesas após comprar uma mansão de seis quartos em California por US$70 milhões, o maior negócio imobiliário da região de Bay Area este ano.", "titulo_pt": "Conheça a estrela chinesa da IA que gastou US$70 milhões em uma mansão na califórnia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 109640, "titulo": "O Claude caiu? IA da Anthropic tem instabilidade nesta terça-feira, 18", "url": "https://exame.com/tecnologia/o-claude-caiu-ia-da-anthropic-tem-instabilidade-nesta-terca-feira-18/", "fonte_id": "exame", "data_pub": "2026-08-18T13:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial Claude, desenvolvida pela Anthropic, enfrentava instabilidades nesta terça-feira, 18.", "titulo_pt": "Claude teve instabilidade nesta terça-feira", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 110218, "titulo": "Comcast is turning millions of its routers into motion detectors", "url": "https://www.theverge.com/news/981381/comcast-xfinity-shield-wifi-motion-sensing", "fonte_id": "the_verge", "data_pub": "2026-08-18T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Comcast está introduzindo detecção de movimento sem fio em milhões de roteadores já instalados nas casas dos clientes, transformando-os em monitores de atividade. A nova atualização do aplicativo Xfinity Internet, lançada em 18 de agosto, habilita essa funcionalidade em roteadores compatíveis Xfinity sem custos adicionais.", "titulo_pt": "Comcast está transformando milhões de roteadores em detectores de movimento sem fio", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 110267, "titulo": "STAT+: Leaders of Mass General, Dana-Farber among hospital execs who got big raises in 2024", "url": "https://www.statnews.com/2026/08/18/massachusetts-hospital-ceo-compensation-2024/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos de hospitais importantes receberam aumentos significativos de salário em 2024, mesmo enquanto seus hospitais enfrentavam diversos desafios.", "titulo_pt": "Líderes de Mass General, Dana-Farber entre executivos de hospitais que receberam grandes aumentos em 2024", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110192, "titulo": "WHO chief warns DR Congo Ebola outbreak ‘far from being under control’", "url": "https://www.scmp.com/news/world/africa/article/3364476/who-chief-warns-dr-congo-ebola-outbreak-far-being-under-control?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diretor-geral da Organização Mundial da Saúde, Tedros Adhanom Ghebreyesus, advertiu que a epidemia de Ebola na República Democrática do Congo está avançando mais rapidamente do que qualquer outro surto anterior e corre o risco de se espalhar para mais países. Segundo ele, a epidemia tem um 'grande head start' e os esforços para contê-la ainda estão em atraso.", "titulo_pt": "Diretor-geral da OMS avisa que surto de Ebola na república democrática do Congo 'longe de estar sob controle'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 110324, "titulo": "NASA’s B777 Gets New Coat of Paint", "url": "https://www.nasa.gov/image-article/nasas-b777-gets-new-coat-of-paint/", "fonte_id": "nasa_news", "data_pub": "2026-08-18T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA exibiu uma nova pintura em seu Boeing 777 em 11 de agosto de 2026. O avião foi adquirido para substituir e expandir as capacidades da antiga DC-8, que foi aposentada em 2024. O B777 começará a operar do Centro de Pesquisas Langley da NASA em Hampton, Virgínia, em 2027.", "titulo_pt": "Boeing 777 da nasa recebe nova pintura", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 110299, "titulo": "What makes a narwhal’s tusk so special? Scientists are close to unraveling the mystery", "url": "https://www.scientificamerican.com/article/what-makes-a-narwhals-tusk-so-special-scientists-are-close-to-unraveling-the-mystery/", "fonte_id": "scientific_american", "data_pub": "2026-08-18T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O dente espiralado do narwhal tem sido um mistério científico há muito tempo. Os cientistas estão próximos de descobrir o que faz esse dente ser tão especial.", "titulo_pt": "O que torna o dente do narwhal tão especial? Os cientistas estão próximos de desvendar o mistério", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 110268, "titulo": "STAT+: Government workers feel the squeeze on health care", "url": "https://www.statnews.com/2026/08/18/health-care-costs-surge-for-cities-counties-generous-model-deadline-for-states/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T14:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Municípios estão enfrentando dificuldades com o custo da seguridade saúde para seus funcionários, enquanto estados estão considerando uma decisão importante sobre a cobertura de medicamentos pelo Medicaid.", "titulo_pt": "Funcionários públicos sentem o impacto dos custos de saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110300, "titulo": "Extreme weather is making Americans feel powerless", "url": "https://www.scientificamerican.com/article/extreme-weather-is-making-americans-feel-powerless/", "fonte_id": "scientific_american", "data_pub": "2026-08-18T14:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que as pessoas afetadas por eventos climáticos extremos também tendem a se preocupar com a possibilidade de enfrentar desastres futuros.", "titulo_pt": "Clima extremo faz americanos se sentirem impotentes", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 110319, "titulo": "What Spider-Man gets right — and wrong — about turning off superpowers", "url": "https://www.sciencenews.org/article/spider-man-superpower-inhibitor-rna", "fonte_id": "science_news", "data_pub": "2026-08-18T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No filme 'Spider-Man: Brand New Day', Peter Parker cria um inhibidor de superpoderes baseado em uma verdadeira terapia que usa RNA. O filme apresenta tanto aspectos corretos quanto incorretos sobre esse conceito.", "titulo_pt": "O que Spider-Man acerta e erra sobre desligar superpoderes", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 110325, "titulo": "NASA Glenn’s Legacy Forged Through Decades of Flight Research", "url": "https://www.nasa.gov/general/nasa-glenn-inflight-research/", "fonte_id": "nasa_news", "data_pub": "2026-08-18T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA Glenn Research Center em Cleveland realizou testes aéreos durante décadas, pilotando aeronaves em ambientes específicos como nuvens de gelo e rotas atmosféricas definidas, coletando dados cruciais diretamente durante esses voos. Muitos dos mais importantes avanços aeroespaciais da NASA que começaram no laboratório foram validados por esses testes de voo.", "titulo_pt": "Herança da NASA Glenn forjada ao longo de decadas de pesquisa aeronáutica", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 110269, "titulo": "STAT+: Pharmalittle: We’re reading about a setback for Eyepoint, a win for Amylyx, and more", "url": "https://www.statnews.com/pharmalot/2026/08/18/eyepoint-blindness-treatment-setback-amylyx-avexitide-win/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T13:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Eyepoint anunciou que um estudo em fase 3 de sua terapia experimental para uma das causas mais comuns de cegueira relacionada à idade não atingiu seu objetivo principal. Amylyx, por outro lado, obteve um resultado positivo, embora não seja mencionado qual específico.", "titulo_pt": "Pharmalittle: notícia sobre um contratempos para Eyepoint e uma vitória para Amylyx", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110270, "titulo": "Kindergarten vaccine exemptions are climbing", "url": "https://www.statnews.com/2026/08/18/health-news-kindergarten-vaccine-exemptions-are-climbing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T13:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de exceções a vacinação em creches está aumentando. O título traduzido seria: 'Exceções à vacinação em jardins de infância estão crescendo.'", "titulo_pt": "Exceções à vacinação em jardins de infância estão crescendo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110271, "titulo": "STAT+: Prominent AI startup rolls out virtual cell model in race to speed up science", "url": "https://www.statnews.com/2026/08/18/david-baker-genbio-ai-new-virtual-model-unveiled-aido-cell/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de IA de destaque lançou um modelo virtual de célula, acelerando a corrida para avançar na ciência.", "titulo_pt": "Iniciativa de IA de destaque lança modelo virtual de célula na corrida pela aceleração da ciência", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110301, "titulo": "Robotic rescue missions are sparking a spaceflight revolution", "url": "https://www.scientificamerican.com/article/robotic-rescue-missions-are-sparking-a-spaceflight-revolution/", "fonte_id": "scientific_american", "data_pub": "2026-08-18T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois novos missionários estão demonstrando como a reparação e a montagem robótica podem se tornar rotineiras no espaço exterior.", "titulo_pt": "Missões robóticas de resgate estão impulsionando uma revolução no voo espacial", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 110320, "titulo": "Eoptic, Inc. Selected to Supply DeepScan™ Imaging Payloads Scheduled for Launch in 2027", "url": "https://spacenews.com/eoptic-inc-selected-to-supply-deepscan-imaging-payloads-scheduled-for-launch-in-2027/", "fonte_id": "spacenews", "data_pub": "2026-08-18T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eoptic, Inc., desenvolvedora de sistemas de imagens multi-espectrais e multi-moda, foi selecionada como fornecedora aprovada para os equipamentos de imagens DeepScan™ programados para serem lançados em 2027. A notícia foi divulgada em Rochester, Nova York, em 18 de agosto de 2026.", "titulo_pt": "Eoptic, Inc., selecionada para supri
