idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora Damares Alves esteve presente no velório de uma menina morta por seu padrasto no Distrito Federal, prestando apoio aos familiares da vítima.", "titulo_pt": "Damares vai ao velório de menina morta por padrasto no DF e faz desabafo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 246759, "titulo": "Caso Juliette: psicóloga explica por que falar sobre dinheiro no casamento", "url": "https://www.metropoles.com/vida-e-estilo/caso-juliette-psicologa-explica-por-que-falar-sobre-dinheiro-no-casamento", "fonte_id": "metropoles", "data_pub": "2026-11-06T00:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Juliette separou seus bens após o casamento, o que gerou debates online. Uma psicóloga enfatiza a importância de discutir dinheiro na relação.", "titulo_pt": "Caso Juliette: psicóloga explica a importância de falar sobre dinheiro no casamento", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 246910, "titulo": "Mortalidad infantil: el Gobierno informó una baja en 2025, pero la tasa sigue en niveles similares a los de hace cinco años", "url": "https://www.lanacion.com.ar/sociedad/mortalidad-infantil-el-gobierno-informo-una-baja-en-2025-pero-la-tasa-sigue-en-niveles-similares-a-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-05T23:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério de Saúde informou uma redução na mortalidade infantil, passando de 8,5 para 8 mortes por cada 1.000 nascidos vivos. No entanto, especialistas em pediatria alertam sobre as diferenças regionais e as oportunidades de prevenção.", "titulo_pt": "Mortalidade infantil: governo informa baixa em 2025, mas taxa permanece semelhante ao nível de cinco anos atrás", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 246800, "titulo": "Detento escapa pelo teto de ônibus e acaba baleado em Belém; veja", "url": "https://www.cnnbrasil.com.br/nacional/norte/pa/detento-escapa-pelo-teto-de-onibus-e-acaba-baleado-em-belem-veja/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-05T23:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um detento escapou de um veículo durante o transporte para uma audiência presencial, fugiu entre os carros, mas foi recapturado por agentes penais. O homem acabou baleado durante a tentativa de fuga.", "titulo_pt": "Detento escapa pelo teto de ônibus e acaba baleado em Belém; veja", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 246764, "titulo": "Alunos de escola no Areal pedem afeto como presente em cartas ao Papai Noel", "url": "https://www.metropoles.com/distrito-federal/alunos-de-escola-no-areal-pedem-afeto-como-presente-em-cartas-ao-papai-noel", "fonte_id": "metropoles", "data_pub": "2026-11-05T23:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes de uma escola pública no Areal escreveram cartas ao Papai Noel pedindo doações para colegas em necessidade e uma oração por uma avó. A iniciativa surpreendeu os professores e chamou a atenção para a solidariedade dos alunos.", "titulo_pt": "Alunos de escola no Areal pedem afeto como presente em cartas ao Papai Noel", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 247603, "titulo": "Construyen el puente para animales más grande del mundo, una obra que busca reconectar hábitats y proteger a pumas aislados", "url": "https://www.lanacion.com.ar/el-mundo/construyen-el-puente-para-animales-mas-grande-del-mundo-una-obra-que-busca-reconectar-habitats-y-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em California, está sendo finalizado o Wallis Annenberg Wildlife Crossing, que será o maior puente para animais do mundo. A estrutura visa conectar habitats e proteger pumas isolados, reduzindo a endogamia genética nesses felinos.", "titulo_pt": "Construem o puente para animais mais grande do mundo, uma obra que busca reconectar habitats e proteger pumas aislados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 247977, "titulo": "‘Simply staggering’: Rapidly developing ‘super El Niño’ on track to peak in December", "url": "https://www.carbonbrief.org/simply-staggering-rapidly-developing-super-el-nino-on-track-to-peak-in-december", "fonte_id": "carbon_brief", "data_pub": "2026-11-06T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 'super El Niño' atual está em desenvolvimento rápido e está programado para atingir seu pico em dezembro. As temperaturas globais médias podem ser afetadas significativamente quando o fenômeno atingir seu pico no final do ano.", "titulo_pt": "Absurdo: 'super El Niño' em desenvolvimento rápido previsto para atingir pico em dezembro", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 247753, "titulo": "Grizzly bear hunt underway after mother and daughter killed in Canada", "url": "https://www.euronews.com/2026/11/06/grizzly-bear-hunt-underway-after-mother-and-daughter-killed-in-canada", "fonte_id": "euronews", "data_pub": "2026-11-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe e sua filha foram encontradas mortas após um suposto ataque de urso pardo perto de Bella Coola, no Canadá. Oficiais de conservação afirmam que podem ter sido envolvidos múltiplos ursos pardos, e as operações de armadilhas estão em andamento. A autoridade local estabeleceu um curfew enquanto a investigação continua.", "titulo_pt": "Caça ao urso pardo em andamento após mortes de mãe e filha em território canadense", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 247859, "titulo": "Indonesia doubles down on climate goals despite surging wildfire emissions", "url": "https://www.scmp.com/week-asia/health-environment/article/3373544/indonesia-doubles-down-climate-goals-despite-surging-wildfire-emissions", "fonte_id": "scmp", "data_pub": "2026-11-06T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia aumentou suas metas climáticas, apesar das intensas queimadas que contradizem essa estratégia. O ministro do Meio Ambiente, Jumhur Hidayat, enfatizou que os objetivos climáticos não devem prejudicar o desenvolvimento nacional.", "titulo_pt": "Indonésia reforça metas climáticas frente a intensas queimadas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 247949, "titulo": "Record-breaking El Nino raises prospect of warmer, wetter winter in Korea", "url": "https://www.koreaherald.com/article/10928548", "fonte_id": "korea_herald", "data_pub": "2026-11-06T04:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia Meteorológica Administrativa informou que o El Niño mais forte registrado está previsto para afetar a Península Coreana durante o inverno, trazendo condições mais quentes e úmidas. No entanto, condições climáticas podem mudar abruptamente em janeiro com a chegada de ar frio.", "titulo_pt": "El niño record-breaking promete inverno mais quente e úmido na Coreia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 246747, "titulo": "Em 2026, cidade de SP tem segundo outubro mais chuvoso desde 1995, diz CGE", "url": "https://www.metropoles.com/sao-paulo/em-2026-cidade-de-sp-tem-segundo-outubro-mais-chuvoso-desde-1995-diz-cge", "fonte_id": "metropoles", "data_pub": "2026-11-06T00:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, a cidade de São Paulo registrou o segundo outubro mais chuvoso desde 1995, com 220,3 mm de precipitação, um volume 96,7% superior à média esperada. O mês teve 26 dias com chuva.", "titulo_pt": "Em 2026, cidade de SP tem segundo outubro mais chuvoso desde 1995, diz CGE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247312, "titulo": "Analysis: China’s quarterly CO2 falls 3% in largest drop since Covid", "url": "https://www.carbonbrief.org/analysis-chinas-quarterly-co2-falls-3-in-largest-drop-since-covid", "fonte_id": "carbon_brief", "data_pub": "2026-11-06T00:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono (CO2) na China caíram 3,1% no terceiro trimestre de 2026, sendo este o maior decréscimo desde a pandemia de COVID-19.", "titulo_pt": "Análise: emissões de CO2 trimestrais da china caem 3% no maior decréscimo desde a pandemia de Covid-19", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 246909, "titulo": "El Niño. Las lluvias no dan tregua y en el sur bonaerense hay hasta 20 días de atraso en la siembra: “Vamos lerdo”", "url": "https://www.lanacion.com.ar/economia/campo/el-nino-las-lluvias-no-dan-tregua-y-en-el-sur-bonaerense-hay-hasta-20-dias-de-atraso-en-la-siembra-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-05T23:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em partes sul e ocidental da Província de Buenos Aires, as chuvas exageradas, as baixas temperaturas e a falta de sol dificultam a implantação de milho e girassol; alguns produtores podem não concluir a área prevista.", "titulo_pt": "O Niño. Chuvas não dão trégua e no sul da província de buenos aires há atraso de até 20 dias na sementeira: 'vamos devagar'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 246829, "titulo": "Sarampo: bebê morre nos EUA em meio a surto com mais de 400 casos", "url": "https://olhardigital.com.br/2026/11/05/medicina-e-saude/sarampo-bebe-morre-nos-eua-em-meio-a-surto-com-mais-de-400-casos/", "fonte_id": "olhar_digital", "data_pub": "2026-11-05T23:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bebê morreu nos Estados Unidos durante um surto de sarampo que registrou mais de 400 casos. Este é o primeiro óbito por sarampo na região desde 1990.", "titulo_pt": "Bebê morre nos EUA em surto de sarampo com mais de 400 casos", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 245502, "titulo": "Copec, Coca-Cola Andina y Sendero avanzan en la gestión sustentable del agua con el Certificado Azul", "url": "https://www.latercera.com/sustentabilidad/noticia/copec-coca-cola-andina-y-sendero-avanzan-en-la-gestion-sustentable-del-agua-con-el-certificado-azul/", "fonte_id": "la_tercera", "data_pub": "2026-11-05T17:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Seis instalações das empresas Copec, Coca-Cola Andina e Sendero receberam o Nível 1 Avanzado do Acordo de Produção Limpia (APL) Certificado Azul, um programa promovido pela Agência de Sustentabilidade e Mudanças Climáticas da Corfo. A avaliação da sua pegada hídrica permitiu identificar os principais impactos das operações e definir medidas para reduzi-los, promovendo um uso mais eficiente da água.", "titulo_pt": "Copec, Coca-Cola Andina e Sendero avançam na gestão sustentável da água com o Certificado Azul", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 245288, "titulo": "Tornado, ciclones e ventos: o que está acontecendo no Centro-Sul do Brasil", "url": "https://www.cnnbrasil.com.br/nacional/brasil/tornado-ciclones-e-ventos-o-que-esta-acontecendo-no-centro-sul-do-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-05T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista relacionou mudanças climáticas e a influência do El Niño como fatores associados à frequência e intensidade dos eventos climáticos no Centro-Sul do Brasil. Este ano, mais de 100 tornados já foram registrados no país.", "titulo_pt": "Tornados, ciclones e ventos: o que está acontecendo no Centro-Sul do Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 245476, "titulo": "Por que a doença de Newcastle voltou a preocupar a avicultura no Brasil e no mundo", "url": "https://www.dw.com/pt-br/por-que-a-doença-de-newcastle-voltou-a-preocupar-a-avicultura-no-brasil-e-no-mundo/a-79867131?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-05T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A doença de Newcastle causou focos em granjas de Santa Catarina, levando 37 países a restringirem as compras do Brasil. As notificações globais da doença bateram recorde em 2025, com a Europa liderando os casos.", "titulo_pt": "Por que a doença de Newcastle voltou a preocupar a avicultura no Brasil e no mundo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 246402, "titulo": "Interactive: Tracking negotiating texts at the COP31 climate summit", "url": "https://www.carbonbrief.org/interactive-tracking-negotiating-texts-at-the-cop31-climate-summit", "fonte_id": "carbon_brief", "data_pub": "2026-11-05T14:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada summit das Nações Unidas sobre clima vê países negociando a redação de numerosos artigos legais. O post Interactive: Rastreando os textos de negociação na COP31 de clima apareceu originalmente no Carbon Brief.", "titulo_pt": "Interactive: rastreando os textos de negociação na COP31 de clima", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 245886, "titulo": "Gaza: Displaced Palestinian builds wind turbine to generate electricity", "url": "https://www.euronews.com/video/2026/11/05/gaza-displaced-palestinian-builds-wind-turbine-to-generate-electricity", "fonte_id": "euronews", "data_pub": "2026-11-05T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um palestino deslocado em Gaza construiu uma turbina de vento improvisada para fornecer eletricidade aos barracos em Khan Younis. Ele não pode affordar painéis solares, então encontrou uma maneira de aproveitar o vento para alimentar bens de uso diário.", "titulo_pt": "Palestino deslocado em gaza null, "texto_pt": "Eva Geller, 90 anos, faleceu em um hospital um ano após ser ferida durante um massacre antisemitico em Bondi beach em 14 de dezembro de 2025. Ela tinha estado internada várias vezes desde então devido às suas feridas.", "titulo_pt": "Eva Geller, de 90 anos, morre em hospital após ataque antisemitico em bondi beach", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 247870, "titulo": "5 months’ jail for helper convicted of molesting employer’s 12-year-old daughter", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3373505/5-months-jail-helper-convicted-molesting-employers-12-year-old-daughter", "fonte_id": "scmp", "data_pub": "2026-11-06T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma auxiliar de domínio de 45 anos foi sentenciada a cinco meses de prisão por abusar sexualmente da filha de 12 anos do seu empregador em casa. Flores foi condenada por três delitos de toque indevido.", "titulo_pt": "Auxiliar de domínio sentenciada a cinco meses de prisão por abusar sexualmente de menina de 12 anos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 247872, "titulo": "Hong Kong privacy watchdog backs tighter rules on access to land records", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3373496/hong-kong-privacy-watchdog-backs-tighter-rules-access-land-records", "fonte_id": "scmp", "data_pub": "2026-11-06T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselheiro de privacidade de Hong Kong apoiou a proposta de reformar as regras para aprimorar o acesso aos registros imobiliários, alertando que jornalistas não estão isentos da lei de privacidade ao coletar dados. A comissária de privacidade Ada Chung Lai-ling afirmou que jornalistas não têm isenção sob a Lei de Privacidade, mesmo que certos cuidados se apliquem à utilização subsequente dos dados.", "titulo_pt": "Comissário de privacidade de hong Kong ap nos.", "titulo_pt": "Suécia devolve coleção de Bronze de Benin a nigéria e restos humanos a bolívia", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 247256, "titulo": "Cuba detains award-winning journalist Yoani Sanchez", "url": "https://www.scmp.com/news/world/americas/article/3373461/cuba-detains-award-winning-journalist-yoani-sanchez", "fonte_id": "scmp", "data_pub": "2026-11-05T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A jornalista cubana Yoani Sanchez, vencedora de prêmios, foi detida pela Segurança Estatal Cubana na capital Havana. Esta foi a terceira detenção de um jornalista independente na cidade nesta semana.", "titulo_pt": "Cuba detém jornalista premiada Yoani Sanchez", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 245775, "titulo": "Rabat rechazó al menos nueve rebajas de penas y las disputó en tribunales: en seis los jueces le dieron la razón y no otorgaron el beneficio", "url": "https://www.ciperchile.cl/2026/11/05/rabat-rechazo-al-menos-nueve-rebajas-de-penas-y-las-disputo-en-tribunales-en-seis-los-jueces-le-dieron-la-razon-y-no-otorgaron-el-beneficio/?utm_source=rss&utm_medium=rss&utm_campaign=rabat-rechazo-al-menos-nueve-rebajas-de-penas-y-las-disputo-en-tribunales-en-seis-los-jueces-le-dieron-la-razon-y-no-otorgaron-el-beneficio", "fonte_id": "ciper_chile", "data_pub": "2026-11-05T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Rabat rejeitou pelo menos nove reduções de penas e os casos foram disputados em tribunais. Em seis desses casos, os juízes concordaram e não concederam o benefício.", "titulo_pt": "Rabat rejeitou pelo menos nove reduções de penas e os casos foram disputados em tribunais", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 245291, "titulo": "MPF entra com ação por racismo no TikTok e pede pagamento de R$ 200 milhões", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/mpf-entra-com-acao-por-racismo-no-tiktok-e-pede-pagamento-de-r-200-milhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-05T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal ingressou com uma ação judicial por racismo no TikTok, solicitando que a plataforma pague uma indenização de R$ 200 milhões. O MPF busca responsabilizar a rede social por não ter impedido a discriminação racial no aplicativo.", "titulo_pt": "MPF move ação por racismo no TikTok e pede R$ 200 milhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 246376, "titulo": "Reported attacks damaging water systems in conflict triple as children lose access to safe water - UNICEF", "url": "https://www.unicef.org/press-releases/reported-attacks-damaging-water-systems-conflict-triple-children-lose-access-safe", "fonte_id": "unicef", "data_pub": "2026-11-05T14:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório Water Under Fire Volume 4 registra um aumento de 300% nos ataques a sistemas de água em conflitos, prejudicando trabalhadores e crianças que dependem desses serviços em 23 países e territórios.", "titulo_pt": "Relatório registra aumento de 300% em ataques a sistemas de água em conflitos, prejudicando acesso de crianças a água segura", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 246121, "titulo": "Hong Kong grandmother gets 20 days for slapping 5-year-old girl at play area", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3373430/hong-kong-grandmother-gets-20-days-slapping-five-year-old-girl-play-area", "fonte_id": "scmp", "data_pub": "2026-11-05T12:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma avó de 68 anos foi condenada a 20 dias de prisão por ter esbofetear uma menina de 5 anos que estava brincando de basquete com seu neto em um shopping center em Kwun Tong, Hong Kong. A mulher admitiu o impulso de dar um soco na menina.", "titulo_pt": "Avó de 68 anos é co const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;

    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">

      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">

      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
