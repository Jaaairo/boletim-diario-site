const D = {"gerado_em": "09/10/2026 15:21", "stats": {"noticias_novas": 1019, "resumos_gerados": 253}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O segundo turno das eleições presidenciais no Brasil, marcado para o próximo dia 29 de outubro, está em pleno ritmo. Os candidatos Jair Bolsonaro (PL) e Luiz Inácio Lula da Silva (PT) estão intensificando suas campanhas. Jair Bolsonaro prometeu manter programas sociais e criticou os cortes do governo anterior, enquanto Lula reforçou a luta pela democracia e criticou o que chamou de 'fascismo' e 'assassinos da pandemia'. A propaganda eleitoral gratuita no rádio e na TV foi retomada nesta sexta-feira (9), e Jair lidera as pesquisas em dez cidades com maiores perdas de empregos. O governo anunciou a renovação e ampliação da desoneração de impostos sobre etanol e gasolina, com um custo estimado de R$ 5,2 bilhões, em meio à disputa. Além disso, o Tribunal Superior Eleitoral determinou a remoção de postagens associando Lula a facções criminosas e multou Jair por postagens similares. A composição do Congresso também sofreu mudanças, com o aumento do espaço das bancadas menos alinhadas à pauta ambiental.", "mundo": "O governo dos Estados Unidos anunciou severas sanções contra a Corte Penal Internacional (CPI), considerando essa medida uma 'agressão à ordem jurídica'. Esta ação ocorreu horas após o Comitê do Prêmio Nobel da Paz premiar Navi Pillay, ex-chefe das Nações Unidas para os direitos humanos, com o Prêmio Nobel da Paz. O presidente dos Estados Unidos, Donald Trump, também pressionou o México a fechar acordos energéticos durante as negociações comerciais cruciais, o que causou alarme em Cidade do México. Paralelamente, a França enfrenta intensos protestos estudantis, com o governo prometendo contratar mais 3 mil professores para as escolas. Além disso, a China e a União Europeia chegaram a um acordo sobre veículos híbridos e a continuidade do fornecimento de minerais raros, enquanto o Brasil vê o partido do Bolsonaro prestes a retomar o poder presidencial, conforme informou o The Atlantic.\n\nA situação geopolítica global está em foco com vários eventos importantes. Os Estados Unidos impuseram sanções ao Tribunal Penal Internacional (TPI), em uma escalada significativa de tensões internacionais. Poucas horas após um ex-julgador do TPI ganhar o Prêmio Nobel de Paz, o governo americano tomou esta medida, levando a uma colisão diplomática com aliados europeus. Por sua vez, o Irã intensificou suas operações militares, ameaçando perseguir e punir navios que violarem rotas designadas em qualquer parte da região, em conflito com a Arábia Saudita. Além disso, a Ucrânia continua a intensificar seus ataques à infraestrutura digital russa, enquanto a União Europeia advertiu sobre a ameaça do grupo Houthi que se estendeu para áreas mais profundas da Arábia Saudita, incluindo a capital Riad. Essas ações refletem a complexidade e a intensidade do cenário geopolítico atual.", "economia": "O presidente dos Estados Unidos, Donald Trump, criou uma comissão para investigar a governadora do Fed, Lisa Cook, em um movimento que ocorre após o Supremo Tribunal Federal rejeitar o esforço do presidente para demitir um funcionário do banco central. Além disso, a inflação oficial de setembro no Brasil atingiu 0,82%, o maior nível desde março de 2026, devido ao fim do Bônus de Itaipu. A poupança no Brasil registrou saques líquidos de R$ 9,35 bilhões em setembro, conforme dados divulgados pelo Banco Central. O Ibovespa atingiu um novo recorde intradiário, se aproximando dos 210 mil pontos, superando o máximo anterior de 209.605,70 pontos registrado na segunda-feira. O PIB do Brasil deve desacelerar para 1,8% em 2026 e 1,5% em 2027, segundo o relatório anual da Unctad, após uma alta de 2,3% em 2025. Além disso, a inflação oficial de setembro, medida pelo IPCA, atingiu 0,82%, o maior nível desde março de 2026, influenciada pela alta dos preços da energia elétrica. A Meta proibiu anúncios da ByteDance, responsável pelo TikTok, em seus serviços nos Estados Unidos e em alguns outros países. A Anduril, empresa americana especializada em drones e equipamentos de defesa autônomos, ganhou um contrato do Pentágono para construir submarinos nucleares, investindo US$ 3,7 bilhões na construção de um estaleiro em Maryland, que deve entrar em operação em 2030.", "tecnologia": "A tecnologia continua sendo um campo de intensa atividade, com destaque para a questão da inteligência artificial (IA). A OpenAI espera gerar uma receita anual de US$70 bilhões. A Anthropic anunciou que proibirá seus usuários de tratar seu assistente de IA, Claude, com crueldade desnecessária. O Departamento de Justiça está considerando acusações de perjúrio e obstrução de justiça contra Cassidy Hutchinson, ex-assistente da Casa Branca, em uma série de desenvolvimentos envolvendo a IA e a política. Além disso, o Encontro Nacional de Automação abrirá inscrições para a edição de 2026, com foco em palestras, painéis e demonstrações práticas de tecnologias. No que diz respeito à IA, a ONU alerta para as ameaças à privacidade associadas ao avanço das neurotecnologias, sugerindo cenários futuros onde a polícia pode acessar informações cerebrais de suspeitos ou prever seus potenciais crimes.", "ciencia": "Um importante avanço na ciência foi a descoberta de um 'planeta fênix', que surgiu das cinzas de uma estrela moribunda, comparado a fênix da mitologia por sua renovação após a destruição. Além disso, um novo estudo sugere que a complexidade cerebral dos coleópteros, como besouros e outros insetos, pode estar relacionada não apenas ao próprio gene, mas à organização tridimensional do genoma. Em outro desenvolvimento, quatro astronautas retornaram à Terra após permanecerem na Estação Espacial Internacional por oito meses, substituindo um companheiro de equipe doente. Este evento marcou um importante momento na pesquisa espacial.", "cultura": "O evento mais importante dos artigos é a exposição 'Escada para o Céu' no Museu Yayoi Kusama, inaugurada em 8 de outubro. A mostra, a primeira após a morte da artista, apresenta uma nova instalação que promete uma experiência única para os visitantes. Em outros desenvolvimentos, a cantora Marília Mendonça recebe uma exposição sensorial no Museu da Imagem e do Som em São Paulo, celebrando sua carreira e memória. Além disso, a artista argentina Marta Minujín será reconhecida na Bienal Internacional de Arquitetura como a primeira artista a receber um prêmio por sua trajetória, destacando-se por suas obras que desafiam os limites. Essas notícias refletem a diversidade e a riqueza da cultura global, abrangendo desde a arte contemporânea até a música.", "sociedade": "A inclusividade é enfatizada em um editorial publicado no Taipei Times, que destaca que ela deve ser uma prática contínua e genuína, não apenas uma atitude superficial. Em outro artigo, a Veja relata que a Sabará prevê investir R$ 10 milhões em saúde mental, mas a incerteza sobre os pagamentos dos planos de saúde limitou o projeto a apenas dez vagas. A CNN Brasil destaca um estudo que explica por que o sentimento de desconforto com a promoção de um colega não é a mesma coisa que invejar um bilionário, relacionando a percepção de sucesso alheio à dor física. O Brasil De Fato relata a terceira semana de protestos estudantis na França, marcada por violência policial, com perda de mão e centenas de feridos, em protesto contra a precarização das escolas públicas e cortes orçamentários. Além disso, a UNICEF realizou uma coletiva de imprensa em Genebra sobre a recuperação no Nepal após desastres naturais, abordando os esforços de recuperação no país.", "meio_ambiente": "O Pré-COP em Fiji e Tuvalu resultou em uma forte pressão para que países ricos destribuam US$ 5 bilhões em financiamento climático para os estados insulares do Pacífico, que enfrentam uma situação crítica devido à crise climática. O evento também levantou a questão da implementação da lei de reciclagem de eletrônicos no Brasil, que é cumprida por apenas 4,8% das empresas envolvidas. Além disso, um estudo da Fiocruz detectou cocaína em cinco rios do Rio de Janeiro, com contaminação que supera níveis encontrados em outros cinco países, levando a preocupações sobre a saúde dos organismos aquáticos. Finalmente, gemsbok, antílopes africanos introduzidos no Novo México, estão se expandindo significativamente devido a adaptações excepcionais para condições áridas, e os pesquisadores prevêem que isso se intensificará devido ao aquecimento global.", "direitos_humanos": "Navi Pillay, jurista sul-africana e ex-comissária das Nações Unidas para os Direitos Humanos, foi declarada vencedora do Prêmio Nobel de Paz de 2026, reconhecida por suas contribuições para a promoção da paz e do direito internacional. A decisão surpreendeu até mesmo apoiadores da pena de morte, como Pete Hegseth, Secretário de Defesa dos EUA, que anunciou a transmissão ao vivo da execução de Major Nidal Malik Hasan pelo Pentágono. Em outro fato relevante, jornalistas do Egito planejaram um protesto após a prisão de seis colegas acusados de terrorismo, denunciando supostas torturas durante a detenção. Esses eventos destacam a luta contínua por direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 205471, "titulo": "Flávio assumiu compromisso para renegociar dívida de MG, diz Cleitinho", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-assumiu-compromisso-para-renegociar-divida-de-mg-diz-cleitinho/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro assumiu um compromisso para renegociar a dívida de Minas Gerais. O governador eleito declarou apoio ao candidato do PL no segundo turno, mas disse que, se Lula ganhar, ele sentará para discutir a mesma pauta de prioridades.", "titulo_pt": "Flávio assumiu compromisso para renegociar dívida de MG, diz Cleitinho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 205336, "titulo": "PF e PGR negam que Vorcaro tenha afirmado que financiou documentário sobre Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pf-e-pgr-negam-que-vorcaro-tenha-afirmado-que-financiou-documentario-sobre-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal negou que Daniel Vorcaro tenha prestado depoimento ou entregue documentos sobre sua suposta delação premiada relativa ao financiamento de um documentário sobre Lula, dirigido por Oliver Stone. A Procuradoria-Geral da República também se posicionou negativamente sobre o assunto.", "titulo_pt": "PF e PGR negam que Vorcaro tenha afirmado ter financiado documentário sobre Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 205632, "titulo": "Armadilha do ego levou Napoleão à ruína; agora é ameaça para Lula", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-do-mura/armadilha-do-ego-levou-napoleao-a-ruina-agora-e-ameaca-para-lula", "fonte_id": "jota", "data_pub": "2026-10-09T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Napoleão caiu em armadilhas devido ao ego, levando a sua ruína. O mesmo erro, segundo a fonte, está sendo cometido pelo petista, que não percebeu mudanças no cenário.", "titulo_pt": "Egoísmo pode levar Lula à ruína, como aconteceu com Napoleão", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 205351, "titulo": "Na estreia da campanha da TV neste 2º turno, Flávio promete manter programas sociais, e Lula critica cortes no governo Jair Bolsonaro", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/09/primeiro-programa-horario-eleitoral-2-turno-flavio-bolsonaro-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro (PL) prometeu manter programas sociais durante seu programa eleitoral, enquanto Lula (PT) criticou cortes no governo Jair Bolsonaro (PL) e pediu mobilização nas redes sociais e nas ruas. Os dois candidatos retomaram a propaganda eleitoral na televisão para o segundo turno da eleição.", "titulo_pt": "Na estreia da campanha da TV neste 2º turno, Flávio promete manter programas sociais, e Lula critica cortes no governo Jair Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 205352, "titulo": "TSE determina que Flávio remova posts que associam Lula a facções criminosas aplica multa de R$ 5 mil", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/09/tse-determina-remocao-de-posts-que-associam-lula-a-faccoes-criminosas-flavio-e-multado-em-r-5-mil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral determinou que a campanha do senador Flávio Bolsonaro remova postagens associando o presidente Lula a facções criminosas. A coligação do PT apresentou a representação, e o ministro André Mendonça reajustou seu voto, decidindo em favor da remoção.", "titulo_pt": "TSE determina remoção de posts associando Lula a facções criminosas e aplica multa de R$ 5 mil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 205353, "titulo": "Na volta da propaganda no rádio, Flávio Bolsonaro diz que Brasil escolheu 'mudança' e Lula afirma que Brasil decidirá entre democracia e 'barbárie'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/09/propaganda-eleitoral-flavio-lula-2-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T16:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro afirmou que o Brasil escolheu a mudança e que o segundo turno é um passo para consolidar a vitória. Lula apresentou o cenário como uma nova eleição entre democracia e barbárie.", "titulo_pt": "Na volta da propaganda no rádio, Flávio Bolsonaro diz que Brasil escolheu 'mudança' e Lula afirma que Brasil decidirá entre democracia e 'barbárie'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 205337, "titulo": "PT pede cassação de chapa de Flávio por uso de perfil de Marçal para disseminar fake news e propaganda", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pt-pede-cassacao-de-chapa-de-flavio-por-uso-de-perfil-de-marcal-para-disseminar-fake-news-e-propaganda.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido do presidente Lula protocolou uma ação no TSE pedindo a cassação da chapa de Flávio Bolsonaro por uso de perfis de Marçal para propaganda eleitoral e disseminação de fake news. A ação também solicita a suspensão do perfil de Marçal no Instagram.", "titulo_pt": "PT pede cassação de chapa de Flávio por uso de perfil de Marçal para disseminar fake news e propaganda", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 205382, "titulo": "Brasil não será governado por sócios do Banco Master, diz Lula em ato", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/brasil-nao-sera-governado-por-socios-do-banco-master-diz-lula-em-ato", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-09T15:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) defendeu a Proposta de Emenda à Constituição que visa extinguir a jornada de trabalho de 6x1. Durante um ato de campanha em Ceilândia, Lula afirmou que essa é a intenção da passeata que quer reduzir a jornada para cinco dias de trabalho e dois dias de folga.", "titulo_pt": "Brasil não será governado por sócios do Banco Master, diz Lula em ato", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 205338, "titulo": "Quem fala de pronome neutro é a extrema direita, nossas pautas são outras, diz 3ª mais votada de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/quem-fala-de-pronome-neutro-e-a-extrema-direita-nossas-pautas-sao-outras-diz-3a-mais-votada-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada estadual eleita Sofia Favero (PSOL) afirmou que a extrema direita é a principal promotora do debate sobre pronome neutro, e que as pautas do partido são diferentes. Favero teve como madrinha política Erika Hilton (PSOL-SP).", "titulo_pt": "Quem fala de pronome neutro é a extrema direita, nossas pautas são outras, diz deputada eleita", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 205339, "titulo": "Não houve frustração, mas eleitor exigiu mais de Lula, diz Jerônimo Rodrigues, reeleito na Bahia", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/nao-houve-frustracao-mas-eleitor-exigiu-mais-de-lula-diz-jeronimo-rodrigues-reeleito-na-bahia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jerônimo Rodrigues, reeleito governador da Bahia, reuniu-se com prefeitos aliados para definir uma estratégia de apoio a Lula no segundo turno das eleições. O governador recebeu a Folha de S.Paulo para uma entrevista após as reuniões.", "titulo_pt": "Não houve frustração, mas eleitor exigiu mais de Lula, diz Jerônimo Rodrigues, reeleito na Bahia", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 205340, "titulo": "Número de militares e policiais eleitos cresce em 2026 e retoma nível recorde atingido com Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mesmo-com-menos-candidatos-numero-de-militares-e-policiais-eleitos-cresce-em-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de militares e policiais eleitos em 2026 aumentou em comparação com 2022, mesmo com uma diminuição no número de candidatos que se declararam ex-membros das Forças Armadas e das forças de segurança. Este aumento levou o número de eleitos nesse segmento a atingir um nível recorde, similar ao registrado durante o governo de Jair Bolsonaro.", "titulo_pt": "Número de militares e policiais eleitos cresce em 2026 e retoma nível recorde", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 205341, "titulo": "Mendonça e Kassio mandam tirar vídeos em que Lula e Janja falam em corte de ações sociais por Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mendonca-e-kassio-mandam-tirar-videos-em-que-lula-e-janja-falam-em-corte-de-acoes-sociais-por-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do TSE, determinou a remoção de dois vídeos em que Lula fala sobre o corte de ações sociais atribuído a Flávio Bolsonaro. Mendonça argumentou que as afirmações de Lula são feitas sem elementos concretos que as sustentem.", "titulo_pt": "Mendonça e Kassio ordenam retirada de vídeos com Lula sobre corte de ações sociais por Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 205633, "titulo": "Gilmar Mendes quer retomada do debate sobre valores pagos pelo SUS a hospitais privados", "url": "https://www.jota.info/saude/gilmar-mendes-quer-retomada-do-debate-sobre-valores-pagos-pelo-sus-a-hospitais-privados", "fonte_id": "jota", "data_pub": "2026-10-09T15:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do Supremo Tribunal Federal (STF), expressou preocupação com o impacto financeiro de R$ 24 bilhões e a emissão de precatórios relacionados ao pagamento de valores pelo Sistema Único de Saúde (SUS) a hospitais privados. Mendes quer retomar o debate sobre esse tema.", "titulo_pt": "Gilmar Mendes quer retomada do debate sobre valores pagos pelo SUS a hospitais privados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 205383, "titulo": "Começa nesta sexta a propaganda eleitoral gratuita no rádio e na TV", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/comeca-nesta-sexta-propaganda-eleitoral-gratuita-no-radio-e-na-tv", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-09T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A propaganda eleitoral gratuita no rádio e na televisão para o segundo turno das Eleições 2026 começa nesta sexta-feira (9) e vai até 23 de outubro. As transmissões serão realizadas em horários específicos, com propaganda política no rádio às 7h e ao meio-dia, e na TV das 13h às 16h30.", "titulo_pt": "Começa nesta sexta a propaganda eleitoral gratuita no rádio e na TV para o segundo turno das eleições 2026", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 205320, "titulo": "Governo zera imposto federal da gasolina e renova subsídio do etanol a 16 dias das eleições; custo é de R$ 5,2 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/governo-zera-imposto-federal-da-gasolina-a-16-dias-das-eleicoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula (PT) anunciou a renovação e ampliação da desoneração de impostos sobre etanol e gasolina, bem como a criação de uma subvenção para a importação de diesel, 16 dias antes do segundo turno das eleições presidenciais. O custo estimado dessas medidas é de R$ 5,2 bilhões.", "titulo_pt": "Governo zera impostos federais sobre etanol e gasolina e cria subvenção para diesel a 16 dias das eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205321, "titulo": "Flávio Bolsonaro lidera votação no 1º turno nas 10 cidades que mais perderam empregos no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/flavio-bolsonaro-lidera-votacao-no-1o-turno-nas-10-cidades-que-mais-perderam-empregos-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro foi o candidato mais votado no primeiro turno das eleições presidenciais nas dez cidades brasileiras com as maiores perdas de empregos formais em um ano. A análise se baseou nas cidades com mais de 10 mil trabalhadores com carteira assinada.", "titulo_pt": "Flávio Bolsonaro lidera votação no 1º turno nas 10 cidades que mais perderam empregos no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 205718, "titulo": "Navi Pillay, South African Jurist, Is Awarded the Nobel Peace Prize", "url": "https://www.nytimes.com/2026/10/09/world/europe/nobel-peace-prize-navi-pillay.html", "fonte_id": "nyt_world", "data_pub": "2026-10-09T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, jurista sul-africana, foi premiada com o Prêmio Nobel da Paz. Sua nomeação gerou críticas de Israel devido à sua liderança de uma comissão da ONU que afirmou que o país cometeu genocídio contra os palestinos.", "titulo_pt": "Navi Pillay, jurista sul-africana, ganha prêmio Nobel da paz", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 205720, "titulo": "Trump Administration Hits International Criminal Court With Severe Sanctions", "url": "https://www.nytimes.com/2026/10/09/us/politics/trump-international-criminal-court-sanctions.html", "fonte_id": "nyt_world", "data_pub": "2026-10-09T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump anunciou severas punições à Corte Penal Internacional horas após o comitê do Prêmio Nobel da Paz premiar um ex-julgador da corte.", "titulo_pt": "Governo trump aplica sanções severas à corte penal internacional", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 205891, "titulo": "Rare waterspouts slam western Sicily, wrecking homes and a school", "url": "https://www.euronews.com/video/2026/10/09/rare-waterspouts-slam-western-sicily-wrecking-homes-and-a-school", "fonte_id": "euronews", "data_pub": "2026-10-09T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um raro par de waterspouts atingiu a Sicília Ocidental na sexta-feira, causando danos em residências, veículos e uma escola. As duas funções se formaram perto da costa de Marsala e se movimentaram para o interior, atingindo a cidade de Petrosino no caminho.", "titulo_pt": "Raros waterspouts causam danos em áreas da sicília ocidental", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205797, "titulo": "U.S. working to reverse an Egyptian man's third-country deportation to Africa", "url": "https://www.npr.org/2026/10/09/g-s1-147476/trump-third-country-deportation-africa-reverse", "fonte_id": "npr_news", "data_pub": "2026-10-09T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump está tentando reverter a deportação de Ahmed Soliman, um egípcio, de um país terceiro para a África, após uma decisão judicial americana que considerou que a deportação violou o direito processual.", "titulo_pt": "EUA tentam reverter deportação de egípcio para áfrica", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 205881, "titulo": "Montenegro expels popular Russian war blogger wanted by US", "url": "https://www.lemonde.fr/en/international/article/2026/10/09/montenegro-expels-popular-russian-war-blogger-wanted-by-us_6758432_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mikhail Zvinchuk, um blogger russo popular que serviu na armada russa na Síria e fundou o canal Telegram Rybar, é procurado pelos EUA por supostas interferências nas eleições e foi sancionado pela União Europeia por promover propaganda pró-rússia.", "titulo_pt": "Montenegro expulsa blogger russo popular procurado pelos EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 206042, "titulo": "Il tribunale rigetta il ricorso di Ranucci per il reintegro a Report", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/09/il-tribunale-rigetta-il-ricorso-di-ranucci-per-il-reintegro-a-report_553c8878-d41b-4a07-b168-8cc2a30b58d1.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-09T17:47:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O tribunal rejeitou o recurso de Ranucci para o reintegro. O jornalista havia se oposto à remoção decidida pela RAI.", "titulo_pt": "Tribunal rejeita recurso de Ranucci para reintegro", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 206043, "titulo": "Procura Emirati, 'copilota FlyDubai voleva colpire Ben Gurion, si è ispirato a 11/9'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/09/procura-emirati-copilota-flydubai-voleva-colpire-ben-gurion-si-e-ispirato-a-119_b9c71364-d627-4c90-adae-8647c0bb289b.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-09T17:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O copiloto da FlyDubai planejava um ataque suicida ao Aeroporto Ben Gurion, de acordo com relatos. Ele afirmou agir sozinho.", "titulo_pt": "Procura dos emiratis: copiloto da FlyDubai queria atacar Ben Gurion, se inspirou no 11/9", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 205831, "titulo": "US unveils sanctions on ICC in move court condems as 'assault on rule of law'", "url": "https://www.bbc.co.uk/news/articles/cj20vkkx3rdvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos impuseram sanções ao Tribunal Penal Internacional (TPI), ação que o tribunal considera uma 'agressão à ordem jurídica'. Vários países membros do TPI, incluindo o Reino Unido, afirmam discordar fortemente dessas sanções.", "titulo_pt": "EUA impõem sanções ao tpi em ação que tribunal condena como 'agressão à ordem jurídica'", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 205593, "titulo": "Protestos estudantis continuam e governo da França promete 3 mil professores a mais nas escolas", "url": "https://www.bbc.com/portuguese/articles/c6vg0eplp347o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-09T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Educação da França anunciou a contratação de 3 mil professores a mais para as escolas, em resposta aos protestos estudantis que continuam, incluindo manifestações violentas dos estudantes do ensino médio.", "titulo_pt": "Protestos estudantis continuam e governo da França promete 3 mil professores a mais nas escolas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 206044, "titulo": "Vance, 'non guarderò l'esecuzione del killer di Fort Hood'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/09/vance-non-guardero-lesecuzione-del-killer-di-fort-hood_d801ec39-4bad-4f1d-9061-cd9701c3245a.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-09T17:40:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Vance afirmou que não assistirá à execução do assassino do ataque de Fort Hood. O juiz federal Michael J. Davis determinou que Vance não participe da execução de Nidal Hasan.", "titulo_pt": "Vance não assistirá à execução do assassino de Fort Hood", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 205832, "titulo": "Navi Pillay, former UN human rights chief, wins Nobel Peace Prize", "url": "https://www.bbc.co.uk/news/articles/cm9wz5kng0x1o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, ex-chefe das Nações Unidas para os direitos humanos, venceu o Prêmio Nobel da Paz. Pillay foi reconhecida por seus 'esforços para promover a paz e o direito internacional'.", "titulo_pt": "Navi Pillay, ex-chefe das nações unidas para os direitos humanos, vence prêmio Nobel da paz", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 205837, "titulo": "US immigration officials defend ICE agents who shot man in same car as child", "url": "https://www.bbc.co.uk/news/articles/cq78px5y1zmzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oscar Belgal, um homem de 28 anos, sobreviveu ao disparo feito por agentes da ICE e está atualmente detido em uma instalação de detenção fora de Nova York.", "titulo_pt": "Imigrantes dos EUA defendem agentes da ICE que dispararam em homem no mesmo carro que uma criança", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 205719, "titulo": "30,000 Bottles of Italian Red Wine Stolen in Brazen Tuscan Heist", "url": "https://www.nytimes.com/2026/10/09/world/europe/wine-heist-italy-marchesi-antinori.html", "fonte_id": "nyt_world", "data_pub": "2026-10-09T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de garrafas de vinho tinto italiano premium foram roubadas por cerca de 10 homens em um assalto audacioso na Toscana. O valor dos vinhos roubados ultrapassa cinco milhões de dólares.", "titulo_pt": "30.000 Garrafas de vinho tinto italiano premium roubadas em assalto audacioso na toscana", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 205994, "titulo": "Trump pressures Mexico for energy deals in crunch trade talks", "url": "https://www.ft.com/content/dda61be8-88bd-4ebc-bde5-ba440308d518?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-09T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, está pressionando o México a fechar acordos energéticos durante as negociações comerciais cruciais. Isso está causando alarme em Cidade do México, onde o controle nacional da seleta indústria é parte da identidade política moderna.", "titulo_pt": "Trump pressiona México por acordos energéticos em negociações comerciais cruciais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 205662, "titulo": "Rubio tras su reunión con Dinorah Figuera: “Deseamos que Venezuela tenga una democracia que pueda gobernar”", "url": "https://elpais.com/us/2026-10-09/rubio-tras-su-reunion-con-dinorah-figuera-deseamos-que-venezuela-tenga-una-democracia-que-pueda-gobernar.html", "fonte_id": "elpais_america", "data_pub": "2026-10-09T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rubio e Dinorah Figuera discutiram sobre a transição na Venezuela, mas não definiram uma data para as eleições. Maria Corina Machado ainda não pode retornar ao país.", "titulo_pt": "Rubio após reunião com Dinorah Figuera: 'desejamos que a Venezuela tenha uma democracia que possa governar'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 205945, "titulo": "Drone strike kills 30 people in Sudan’s Blue Nile region", "url": "https://www.aljazeera.com/news/2026/10/9/drone-strike-kills-30-people-in-sudans-blue-nile-region?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone, supostamente controlado por forças rivais (RSF), atingiu Wad al-Mahi, resultando em pelo menos 30 mortes próximas a um acampamento de deslocados, incluindo mulheres e crianças.", "titulo_pt": "Ataque com drone mata 30 pessoas na região de Blue Nile, sudão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 205993, "titulo": "Trump launches committee to investigate Fed governor Lisa Cook", "url": "https://www.ft.com/content/d0c81cd2-f944-46b9-a859-abc3f0bd3516?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-09T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Joe Biden, criou uma comissão para investigar a governadora do Fed, Lisa Cook. Esta decisão ocorre após o Supremo Tribunal Federal rejeitar, em junho, o esforço do presidente para demitir um funcionário do banco central.", "titulo_pt": "Biden cria comissão para investigar Lisa Cook, governadora do Fed", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 205312, "titulo": "Alimentos sobem sob influência do clima após três meses em queda; tomate aumenta quase 38%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/alimentos-sobem-sob-influencia-do-clima-apos-tres-meses-em-queda-tomate-aumenta-quase-38.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços da alimentação no domicílio subiram 0,96% em setembro no Brasil, após três meses consecutivos em queda. O tomate foi um dos alimentos que mais aumentaram, com um aumento de quase 38%.", "titulo_pt": "Alimentos sobem após três meses em queda; tomate aumenta quase 38%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205920, "titulo": "Hurricane Isaias disrupts U.S. oil production in Gulf of Mexico, threatens refineries", "url": "https://www.cnbc.com/2026/10/09/hurricane-isaias-gulf-mexico-oil-refinery.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-09T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias interrompeu a produção de petróleo nos Estados Unidos no Golfo do México e ameaça refinarias. O furacão pode agravar uma já perturbada situação do mercado de combustíveis causada por conflitos na Europa Oriental e no Oriente Médio.", "titulo_pt": "Furacão Isaias interrompe produção de petróleo no golfo do México e ameaça refinarias", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 205313, "titulo": "Previdência reduz fila do INSS para 1,2 milhão e fecha acordo para frear ações na Justiça; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/prevdencia-reduz-fila-do-inss-para-12-milhao-e-fecha-acordo-para-frear-acoes-na-justica-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Previdência Social e o INSS reduziram a fila de pedidos de aposentadoria para 1,2 milhão em setembro. Ambos também fecharam um acordo com o Judiciário para diminuir o número de processos contra os órgãos.", "titulo_pt": "Previdência reduz fila do INSS para 1,2 milhão e fecha acordo para frear ações na Justiça", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205376, "titulo": "Pix ultrapassa 1 bilhão de chaves cadastradas no Brasil", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/pix-ultrapassa-1-bilhao-de-chaves-cadastradas-no-brasil", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-09T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de chaves Pix cadastradas no Brasil ultrapassou 1 bilhão em setembro, com um total de 1,008 bilhão de registros. O sistema reúne cerca de 170 milhões de clientes, considerando que uma mesma pessoa pode ter mais de uma chave.", "titulo_pt": "Pix atinge marca de 1 bilhão de chaves cadastradas no Brasil", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 205377, "titulo": "Tributos da gasolina são zerados e subsídios a combustíveis, ampliados", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/tributos-da-gasolina-sao-zerados-e-subsidios-combustiveis-ampliados", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-09T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe econômica decidiu ampliar a desoneração de tributos sobre a gasolina e aumentar os subsídios ao etanol e ao diesel importado, com custos estimados em R$ 5,2 bilhões em 30 dias. A redução tributária sobre a gasolina passa de R$ 0,63 para R$ 0,89 por litro, zerando as alíquotas de PIS/Pasep, Cofins e Cide-Combustíveis.", "titulo_pt": "Tributos da gasolina são zerados e subsídios a combustíveis, ampliados", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 205918, "titulo": "Americans' debt problems are flashing a warning not seen since the Great Recession", "url": "https://www.cnbc.com/2026/10/09/american-debt-delinquency.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-09T16:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que, embora as disparidades de riqueza tenham se reduzido ligeiramente, a capacidade de honrar pagamentos de dívidas piorou significativamente.", "titulo_pt": "Problemas de dívida dos americanos estão sinalizando um alerta não visto desde a grande recessão", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 205316, "titulo": "Pix supera 1 bilhão de chaves cadastradas no Brasil, diz Banco Central", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/pix-supera-1-bilhao-de-chaves-cadastradas-no-brasil-diz-banco-central.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de chaves Pix cadastradas no Brasil ultrapassou 1 bilhão, com a criação de 9,8 milhões de novas chaves entre agosto e setembro. Segundo o Banco Central, essa marca foi alcançada nesse período.", "titulo_pt": "Pix atinge marca de 1 bilhão de chaves cadastradas no Brasil, revela Banco Central", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205317, "titulo": "Empresa australiana de data centers apoiada pela Nvidia desiste de IPO de US$ 5 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/empresa-australiana-de-data-centers-apoiada-pela-nvidia-desiste-de-ipo-de-us-5-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de data centers apoiada pela Nvidia desistiu de uma oferta pública inicial de US$ 5 bilhões, indicando uma crescente cautela dos investidores em relação às altas avaliações de empresas de inteligência artificial.", "titulo_pt": "Empresa de data centers apoiada pela Nvidia desiste de IPO de US$ 5 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205319, "titulo": "Greve da Caixa afeta incorporadoras e atrasa repasses no Minha Casa, Minha Vida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/greve-da-caixa-afeta-incorporadoras-e-atrasa-repasses-no-minha-casa-minha-vida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A greve nacional dos bancários da Caixa Econômica Federal em setembro afetou o fluxo de incorporadoras que atuam com o público de baixa renda, impactando os resultados do terceiro trimestre de 2026.", "titulo_pt": "Greve da Caixa afeta incorporadoras e atrasa repasses no Minha Casa, Minha Vida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205778, "titulo": "China agrees to ‘halve’ hybrid car exports to EU in landmark deal", "url": "https://www.theguardian.com/business/2026/oct/09/china-agrees-to-curb-hybrid-car-exports-to-eu-in-landmark-deal", "fonte_id": "guardian_world", "data_pub": "2026-10-09T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia e China chegaram a um acordo histórico para reduzir as exportações de carros híbridos chineses para a UE em mais de metade nos próximos quatro anos, em resposta a preocupações sobre o impacto nas indústrias automotivas europeias.", "titulo_pt": "China concorda em reduzir exportações de carros híbridos para a ue em metade", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205323, "titulo": "Novas regras de Trump dificultarão acesso de agricultores dos EUA a fundos para projetos de energia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/novas-regras-de-trump-dificultarao-acesso-de-agricultores-dos-eua-a-fundos-para-projetos-de-energia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T14:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As novas regras propostas pelo presidente dos Estados Unidos, Donald Trump, dificultarão o acesso de agricultores americanos a fundos para projetos de energia renovável, como painéis solares e eficiência energética. Isso ocorrerá devido a mudanças iminentes em um programa de energia rural que distribuiu bilhões de dólares nos últimos anos.", "titulo_pt": "Novas regras de Trump dificultarão acesso de agricultores americanos a fundos para projetos de energia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205324, "titulo": "Poupança tem saque líquido de R$ 9,35 bi em agosto, diz BC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/poupanca-tem-saque-liquido-de-r-935-bi-em-agosto-diz-bc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em setembro, a poupança no Brasil registrou saques líquidos de R$ 9,35 bilhões, conforme dados divulgados pelo Banco Central.", "titulo_pt": "Poupança tem saque líquido de R$ 9,35 bi em setembro, diz BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205325, "titulo": "Meta proíbe anúncios da dona do TikTok nos EUA, Japão, Canadá e outros países", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/meta-proibe-anuncios-da-dona-do-tiktok-nos-eua-japao-canada-e-outros-paises.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T14:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta proibiu anúncios da ByteDance, responsável pelo TikTok, em seus serviços nos Estados Unidos e em alguns outros países. Essa medida foi informada por um porta-voz da empresa nesta quinta-feira (8).", "titulo_pt": "Meta proíbe anúncios da dona do TikTok nos EUA e outros países", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205378, "titulo": "INPC, inflação que corrige salários, acumula 4,29% em 12 meses", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/inpc-inflacao-que-corrige-salarios-acumula-429-em-12-meses", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-09T13:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Índice Nacional de Preços ao Consumidor (INPC) registrou 0,82% em setembro, com um acumulado de 4,29% nos últimos 12 meses. Os dados foram divulgados pelo Instituto Brasileiro de Geografia e Estatística (IBGE).", "titulo_pt": "INPC, inflação que corrige salários, acumula 4,29% em 12 meses", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 205327, "titulo": "SoftBank busca obter US$ 100 bilhões no Oriente Médio para investir em IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/softbank-busca-obter-us-100-bilhoes-no-oriente-medio-para-investir-em-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T13:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundador do SoftBank, Masayoshi Son, busca levantar até US$ 100 bilhões de investidores do Golfo Pérsico para ampliar sua aposta em inteligência artificial. A empresa busca reforçar seu poder financeiro para investir mais em tecnologia.", "titulo_pt": "Softbank busca US$ 100 bilhões no golfo pérsico para investir em IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 206073, "titulo": "Meta bans ads from TikTok on its apps", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/10/2003865696", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta proibiu anúncios do TikTok em suas plataformas. A decisão afeta a exibição de anúncios do TikTok em aplicativos da Meta.", "titulo_pt": "Meta proíbe anúncios do TikTok em suas apps", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206075, "titulo": "Vance highlights Microsoft in crackdown on visa abuse", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/10/2003865698", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vance enfatizou a Microsoft durante a operação contra o abuso de vistos. A ação visa combater o uso indevido de vistos de trabalho.", "titulo_pt": "Vance destaca a Microsoft em operação contra abuso de vistos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206076, "titulo": "OpenAI expects US$70bn in annualized revenue", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/10/2003865699", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI espera gerar receita anualizada de US$70 bilhões.", "titulo_pt": "Openai espera receita anualizada de US$70 bilhões", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206077, "titulo": "AI valuation fears derail Firmus IPO", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/10/2003865700", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A avaliação da inteligência artificial tem causado preocupações que estão impedindo a oferta inicial de ações da empresa Firmus de prosseguir.", "titulo_pt": "Medo de avaliação da IA impede IPO da Firmus", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206158, "titulo": "Master AI Chip Principles With New IEEE Design Program", "url": "https://spectrum.ieee.org/master-ai-chip-principles-ieee", "fonte_id": "ieee_spectrum", "data_pub": "2026-10-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Engenheiros enfrentam uma aceleração inédita na complexidade do hardware de IA, conforme discutido no artigo de pesquisa recente \"Revisando a IA em Edge: Oportunidades e Desafios\". O artigo examina o rápido crescimento da IA em Edge e os desafios que isso cria, incluindo restrições de recursos, limitações de arquitetura do modelo e demandas de rede em implementações de IA em Edge.", "titulo_pt": "Aprenda os princípios do Chip de IA com novo programa de Design da IEEE", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 205506, "titulo": "Trump quer mudar o termo “IA”, mas ciência rebate e faz distinção; entenda", "url": "https://www.infomoney.com.br/mundo/trump-quer-chamar-ia-de-superinteligencia/", "fonte_id": "infomoney", "data_pub": "2026-10-09T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, propôs mudar o termo 'IA' (Inteligência Artificial), mas a ciência rebateu, fazendo uma distinção sobre o uso desse conceito ainda hipotético. A decisão levanta questões sobre o uso de um termo científico em desenvolvimento.", "titulo_pt": "Trump quer mudar o termo ‘IA’, mas ciência rebate e faz distinção; entenda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 205787, "titulo": "Is Crypto Dead? Or More Influential Than Ever?", "url": "https://www.theatlantic.com/podcasts/2026/10/crypto-influence-politics-ben-mckenzie/688946/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-09T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ben McKenzie, uma celebridade que investigou criptomoedas durante a pandemia, em vez de promovê-las, descreve o estranho percurso dessas moedas digitais.", "titulo_pt": "Crypto morreu? Ou mais influente do que nunca?", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 205561, "titulo": "A AI pode ter consciência? A Anthropic tentou convencer o Papa", "url": "https://braziljournal.com/a-ai-pode-ter-consciencia-a-anthropic-tentou-convencer-o-papa", "fonte_id": "brazil_journal", "data_pub": "2026-10-09T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV enfatizou a importância de distinguir a arte humana daquilo produzido por inteligência artificial. Ele reiterou a necessidade de traçar uma linha clara entre as realizações humanas e as da IA em suas redes sociais.", "titulo_pt": "A IA pode ter consciência? O Papa aborda o tema", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 205314, "titulo": "ONU alerta para ameaça à privacidade com avanço de neurotecnologias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/onu-alerta-para-ameaca-a-privacidade-com-avanco-de-neurotecnologias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU alerta para as ameaças à privacidade associadas ao avanço das neurotecnologias, mencionando cenários futuros onde a polícia pode acessar informações cerebrais de suspeitos ou prever seus potenciais crimes.", "titulo_pt": "ONU avisa sobre ameaça à privacidade com avanço de neurotecnologias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206144, "titulo": "The DOJ Is Weighing Perjury Charges Against Cassidy Hutchinson", "url": "https://www.wired.com/story/the-doj-is-weighing-perjury-charges-against-cassidy-hutchinson/", "fonte_id": "wired", "data_pub": "2026-10-09T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Justiça está considerando acusações de perjúrio e obstrução de Justiça contra Cassidy Hutchinson, uma ex-assistente da Casa Branca que testemunhou contra Donald Trump para a Comissão do Dia 6 de Janeiro.", "titulo_pt": "Justiça federal avalia acusações de perjúrio contra ex-assistente de trump", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 206124, "titulo": "The AI is in the computer", "url": "https://www.theverge.com/podcast/1008707/amazon-alexa-tablet-googlebooks-apple-vergecast", "fonte_id": "the_verge", "data_pub": "2026-10-09T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temporada de lançamentos de gadgets está em pleno vapor, com várias empresas lançando diversos produtos. Independentemente da empresa, seja a Microsoft com um notebook de alta gama, a Amazon com um tablet Android avançado ou a Apple com seus produtos para casa inteligente, todas parecem se concentrar em assistentes e agentes de inteligência artificial.", "titulo_pt": "A IA está nos produtos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 206145, "titulo": "I’m Still Convinced the iPod Was the Perfect Gadget", "url": "https://www.wired.com/story/im-still-convinced-the-ipod-was-the-perfect-gadget/", "fonte_id": "wired", "data_pub": "2026-10-09T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iPod original acertou em muitos pontos. Entre eles, não se conectava à internet.", "titulo_pt": "Ainda acrendo que o ipod foi o perfeito dispositivo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 206125, "titulo": "Trump’s attempt to rename AI is looking awfully artificial", "url": "https://www.theverge.com/policy/1008677/trump-super-intelligence-ai-rebranding", "fonte_id": "the_verge", "data_pub": "2026-10-09T14:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump tem uma tendência de usar palavras contra seus adversários. Recentemente, ele tem tentado renomear inteligência artificial, mas essa tentativa parece artificial.", "titulo_pt": "Trump’s attempt to rename AI is looking awfully artificial (tentativa de trump de renomear a IA parece artificial)", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 205876, "titulo": "New evidence linking far-right leader Bardella to antisemitic messages revealed", "url": "https://www.lemonde.fr/en/politics/article/2026/10/09/new-evidence-linking-far-right-leader-bardella-to-antisemitic-messages-revealed_6758422_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma de investigação Mediapart revelou três novas conversas envolvendo Jordan Bardella, fortalecendo ainda mais a ligação do líder do partido extremamente direitista com uma conta do Facebook acusada de mensagens antissemitas.", "titulo_pt": "Novas provas ligam líder do extremismo de direita Bardella a mensagens antissemitas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 205637, "titulo": "Evidências apontam cada vez mais para necessidade de se regular IA na saúde", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fernando-aith/evidencias-apontam-cada-vez-mais-para-necessidade-de-se-regular-ia-na-saude", "fonte_id": "jota", "data_pub": "2026-10-09T13:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Casos reais de sucesso e falha da inteligência artificial médica no Canadá evidenciam a necessidade de regulamentação imediata pela Anvisa.", "titulo_pt": "Evidências apontam cada vez mais para necessidade de se regular IA na saúde", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 205577, "titulo": "Encontro Nacional de Automação abre inscrições para edição de 2026", "url": "https://exame.com/bussola/encontro-nacional-de-automacao-abre-inscricoes-para-edicao-de-2026/", "fonte_id": "exame", "data_pub": "2026-10-09T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Encontro Nacional de Automação abrirá inscrições para a edição de 2026. O evento ocorrerá nos dias 4 e 5 de novembro no Expominas, com programação composta por palestras, painéis e demonstrações práticas de tecnologias.", "titulo_pt": "Inscrições para o encontro Nacional de Automação de 2026 começam", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 206160, "titulo": "'Mix-and-match' material's properties can be tuned by changing its metallic 'recipe'", "url": "https://phys.org/news/2026-10-material-properties-tuned-metallic-recipe.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram uma nova família de materiais cujas propriedades podem ser ajustadas mudando sua 'receita' metálica, o que abre novas possibilidades para aplicações como armazenamento de gás e detecção.", "titulo_pt": "Receita metálica pode ajustar propriedades de novos materiais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206161, "titulo": "Are analytics making pro sports less fun? Fans and analysts remain divided", "url": "https://phys.org/news/2026-10-analytics-pro-sports-fun-fans.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hoje, as discussões sobre análise de dados no esporte, como retratadas no filme 'Moneyball' de 2011, parecem antiquadas. O uso de dados por times para identificar jogadores mais valiosos e menos caros do que se pensa já não surpreende mais ninguém.", "titulo_pt": "Análises de dados estão tornando o esporte profissional menos divertido? Fãs e analistas estão divididos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205651, "titulo": "Christina Koch, astronauta del Artemis II: “Para explorar el universo y otros planetas, primero debemos entender cómo cuidar el nuestro”", "url": "https://www.lanacion.com.ar/el-mundo/christina-koch-astronauta-del-artemis-ii-para-explorar-el-universo-y-otros-planetas-primero-debemos-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-09T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Christina Koch, uma astronauta da NASA, afirmou que para explorar o universo e outros planetas, primeiro é necessário entender como cuidar do nosso planeta. Essa declaração foi feita após o sucesso do sobrevoo lunar durante a missão Artemis II.", "titulo_pt": "Christina Koch, astronauta da Artemis II: ‘para explorar o universo e outros planetas, primeiro devemos entender como cuidar do nosso’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 206162, "titulo": "New sensing method expands label-free particle detection beyond sensor surfaces", "url": "https://phys.org/news/2026-10-method-free-particle-sensor-surfaces.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo método de detecção de partículas expande a detecção de células cancerígenas individuais em amostras de sangue além das superfícies dos sensores. A procura por sensores ultra-sensitive e robustos, capazes de detectar targets cada vez menores e mais raros, como vírus e células tumorais circulantes, continua a crescer.", "titulo_pt": "Novo método de detecção amplia a detecção de partículas além das superfícies dos sensores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206163, "titulo": "AI reveals how coating thickness changes the link between surface roughness and pitting resistance", "url": "https://phys.org/news/2026-10-ai-reveals-coating-thickness-link.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corrosão por pitting localizada pode causar falhas súbitas em componentes de alumínio mesmo quando as taxas de corrosão em geral são baixas. O processo de capa de vapor de água oferece uma rota protetiva para filmes de boehmite, mas altera simultaneamente a espessura da camada, a morfologia superficial, a cristalinidade e as deficiências do substrato.", "titulo_pt": "IA revela como a espessura da capa afeta a relação entre rugosidade superficial e resistência a pitting", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206207, "titulo": "NASA Demonstrates Next-Generation Heat Shield Technologies", "url": "https://www.nasa.gov/centers-and-facilities/ames/nasa-demonstrates-next-generation-heat-shield-technologies/", "fonte_id": "nasa_news", "data_pub": "2026-10-09T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está testando novas tecnologias de amortecimento térmico que podem manter os astronautas seguros durante o retorno das missões à Lua e Marte, utilizando um método inusitado: os resíduos de lixo. Durante a desocupa do 24º voo de suprimentos da Northrop Grumman para a Estação Espacial Internacional, foram transportados 12 pequenas cápsulas experimentais.", "titulo_pt": "NASA testa novas tecnologias de amortecimento térmico para missões espaciais", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 206185, "titulo": "STAT+: Pharma’s free lunches for doctors boost inappropriate prescribing, analysis finds", "url": "https://www.statnews.com/pharmalot/2026/10/09/pharma-free-lunches-to-doctors-boost-inappropriate-prescribing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-09T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo mostrou que os presentes e pagamentos que médicos recebem de empresas farmacêuticas aumentaram a prescrição inadequada de medicamentos, provavelmente levando a aumentos nos custos de saúde.", "titulo_pt": "Presentes e pagamentos das farmacêuticas aumentam prescrição inadequada, estudo indica", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 206186, "titulo": "STAT+: Medicare Advantage star ratings trigger new bonuses, and uncertainty", "url": "https://www.statnews.com/2026/10/09/medicare-advantage-insurers-star-ratings-2027-humana-alignment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-09T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo federal divulgou novos ratings de qualidade para as seguradoras Medicare Advantage para 2027, com a Humana sendo a maior vencedora.", "titulo_pt": "Novos ratings de qualidade medicare Advantage para 2027 beneficiam a humana", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 205304, "titulo": "ONU aponta riscos de eventual uso de tecnologia para ler a mente humana", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/onu-alerta-para-tecnologia-usada-para-ler-a-mente-dos-cidadaos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-09T15:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU alerta para os riscos associados à possibilidade de uso de tecnologias que permitam ler a mente humana, incluindo a aplicação por parte da polícia e a previsão de crimes futuros.", "titulo_pt": "ONU aponta riscos de uso futuro de tecnologia para ler a mente humana", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 206187, "titulo": "STAT+: Life Biosciences share glaucoma study updates for its cellular reprogramming drug", "url": "https://www.statnews.com/2026/10/09/biotech-news-life-biosciences-share-glaucoma-cellular-reprogramming-drug-update/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-09T15:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três pacientes com glaucoma receberam uma única injeção do medicamento experimental de reprogramação celular da Life Biosciences, sem ocorrer nenhum efeito adverso sério.", "titulo_pt": "Life Biosciences divulga atualizações do estudo sobre seu medicamento experimental para glaucoma", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 206199, "titulo": "The Social Reckoning is a ‘surreal’ portrait of social media’s harms, scientist says", "url": "https://www.scientificamerican.com/article/the-social-reckoning-is-a-surreal-portrait-of-social-medias-harms-scientist-says/", "fonte_id": "scientific_american", "data_pub": "2026-10-09T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A película retrata a revelação feita pela ex-funcionária do Facebook, Frances Haugen, sobre as práticas de segurança da empresa. O filme é baseado em fatos reais.", "titulo_pt": "A conta Social é uma 'surreal' retratação dos danos da mídia Social, cientista afirma", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 206204, "titulo": "How the Grand Canyon could have lost 1 billion years of geologic history", "url": "https://www.sciencenews.org/article/grand-canyon-lost-history-giant-cliff", "fonte_id": "science_news", "data_pub": "2026-10-09T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa sugere que a elevação e queda de um penhasco que abrange um continente poderia explicar um enigma de 1 bilhão de anos na história geológica da Terra.", "titulo_pt": "Como o Grand Canyon poderia ter perdido 1 bilhão de anos de história geológica", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 205566, "titulo": "Ex-baixista dos Rolling Stones vira arqueólogo e descobre tesouro romano no próprio quintal", "url": "https://exame.com/pop/ex-baixista-dos-rolling-stones-vira-arqueologo-e-descobre-tesouro-romano-no-proprio-quintal/", "fonte_id": "exame", "data_pub": "2026-10-09T14:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mick Wyman, ex-baixista dos Rolling Stones, se tornou arqueólogo e descobriu um tesouro romano em sua propriedade, localizada no Reino Unido. A propriedade, que data do século XV, foi adquirida por Wyman em 1968, quando ele ainda estava viajando com a banda.", "titulo_pt": "Ex-baixista dos Rolling Stones descobre tesouro romano no próprio quintal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 206208, "titulo": "Cosmic House of Mirrors", "url": "https://www.nasa.gov/image-article/cosmic-house-of-mirrors/", "fonte_id": "nasa_news", "data_pub": "2026-10-09T13:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem da NASA's James Webb Space Telescope, divulgada em 29 de setembro de 2026, mostra galáxias distorcidas e multiplicadas como se estivessem em um espelho de casa. As galáxias douradas brilhantes são parte de um aglomerado de galáxias chamado MACS J0454.1-0300. As galáxias avermelhadas agrupadas em um lado da imagem não são realmente.", "titulo_pt": "Casa de espelhos cósmica", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 206087, "titulo": "Anthropic claims Chinese AI firms secretly use Claude. Is it true?", "url": "https://www.scmp.com/tech/tech-war/article/3370317/anthropic-claims-chinese-ai-firms-secretly-use-claude-it-true?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Acusações de Washington e do laboratório de IA Anthropic sugerem que empresas de IA chinesas estariam usando modelos de IA dos EUA sem permissão para reduzir custos de computação e energia. O National Security Agency, FBI e Cybersecurity and Infrastructure Security Agency alertaram sobre essa prática sistemática.", "titulo_pt": "Empresas de IA chinesas teriam usado modelos de IA dos EUA sem autorização?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 206188, "titulo": "How these census changes could threaten public health", "url": "https://www.statnews.com/2026/10/09/health-news-census-changes-threaten-public-data-collection/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-09T13:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Trump propôs fazer três mudanças significativas no Censo dos Estados Unidos, incluindo a eliminação de perguntas sobre raça, etnia e orientação sexual e a exclusão de pessoas que não são cidadãos.", "titulo_pt": "Como essas mudanças no censo podem ameaçar a saúde pública", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 206065, "titulo": "Overseas offices celebrate Double Ten", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865727", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As delegações estrangeiras comemoraram o Dia Nacional de Taiwan. O evento ocorreu em vários escritórios no exterior.", "titulo_pt": "Delegações estrangeiras celebram dia nacional de taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206066, "titulo": "Giant Taiwan flag flies freely on National Day", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865728", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um enorme bandeira de Taiwan foi voando livremente durante o Dia Nacional da República. O evento ocorreu em comemoração ao Dia Nacional, mas não há detalhes adicionais sobre o local ou as circunstâncias específicas da exibição da bandeira.", "titulo_pt": "Gigantesca bandeira de Taiwan voa livremente no dia nacional", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206068, "titulo": "CBS identifies ‘accomplice’ of alleged Chinese agent", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865730", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CBS identificou um suposto cúmplice de um suposto agente chinês. A informação foi divulgada pela emissora de notícias americana, mas não há detalhes adicionais sobre o caso.", "titulo_pt": "CBS identifica cúmplice de suposto agente chinês", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206071, "titulo": "Celebrating Taiwan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/200386573 mi", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 206233, "titulo": "Lightsaber Darth Vader used in ‘I am your father’ Star Wars duel up for auction", "url": "https://www.theguardian.com/film/2026/oct/09/lightsaber-darth-vader-star-wars-auction", "fonte_id": "guardian_culture", "data_pub": "2026-10-09T13:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sabre de luz usado por Darth Vader no confronto em que ele diz 'I am your father' em Star Wars está sendo leiloado e pode ser vendido por pelo menos 1 milhão de dólares. Mais de duas dúzias de cenários de Star Wars, de Episódios I a IX, e outros itens da franquia criada por George Lucas também serão leiloados.", "titulo_pt": "Sabre de luz de Darth Vader usado em 'eu sou seu pai' vai ao leilão", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 205299, "titulo": "É tempo de lutar, não de desanimar, diz Urias sobre o cenário eleitoral brasileiro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/e-tempo-de-lutar-nao-de-desanimar-diz-urias-sobre-o-cenario-eleitoral-brasileiro.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-09T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Urias afirma que foi um ano de coragem durante a criação de seu terceiro álbum de estúdio, 'Carranca', admitindo que enfrentou medos durante o processo.", "titulo_pt": "É tempo de lutar, não de desanimar, diz Urias sobre o cenário eleitoral brasileiro", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 206079, "titulo": "EDITORIAL: Inclusivity is not a token gesture", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/10/10/2003865702", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O editorial destaca
