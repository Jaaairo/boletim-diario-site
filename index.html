<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "12/08/2026 15:24", "stats": {"noticias_novas": 1532, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva manteve sua popularidade e continua entre os cinco líderes mais populares, de acordo com um recente levantamento. Um desenvolvimento notável é que o governo anunciou investimentos de R$ 2 bilhões em dois supercomputadores de inteligência artificial: um dos Estados Unidos e outro da China. Essas aquisições visam impulsionar a tecnologia no país. A Procuradoria Municipal apresentou um pedido de cassação contra o prefeito de Macaé, acusando-o de usar recursos públicos para promover sua própria campanha eleitoral. Além disso, a Agência Nacional de Proteção de Dados (ANPD) determinou a suspensão temporária das transmissões ao vivo do Discord no Brasil por três dias úteis, em resposta às preocupações com o uso da plataforma por menores envolvidos em violência extrema.", "mundo": "O mundo enfrenta diversos desafios e eventos importantes. Primeiro, um eclipse solar total ocorreu pela primeira vez na Europa há décadas, atraindo multidões de Groenlândia até Espanha para observar o fenômeno astronômico. No entanto, o rejeitamento do plano de paz para Gaza pelo governo israelense, proposto pelos EUA e apresentado por Benjamin Netanyahu, concedeu uma vitória diplomática ao Hamas. O grupo concordou em gradualmente abandonar suas armas em troca da retirada israelense de Gaza. As exportações de grãos da Rússia e da Ucrânia estão diminuindo devido a ataques mútuos às infraestruturas marítimas e portos, afetando significativamente o comércio global. Além disso, a inflação nos Estados Unidos caiu para 3,4% no mês de julho, com os custos dos alimentos decelerando, embora os preços do aluguel permaneçam elevados. No Brasil, a China apoiou o país na sua luta contra as tarifas dos EUA na Organização Mundial do Comércio (OMC). No exterior, o governo italiano prometeu reduzir as taxas de imposto e tem pelo menos 30 bilhões de euros para implementar suas medidas. A região conhecida como Cinturão de Fogo do Pacífico, onde ocorrem 90% dos terremotos globais, inclui a Colômbia, que está localizada nessa área geográfica vulcânica ativa. Por fim, os Estados Unidos estão processando o ex-presidente Trump para impedir que ele publique anúncios oficiais do governo exclusivamente no aplicativo Truth Social.\n\nIsrael realizou uma operação aérea em Gaza, seu primeiro ataque no território em mais de uma semana, visando um comandante do Hamas que estaria planejando ataques contra forças militares israelenses. O presidente dos Estados Unidos, Joe Biden, reafirmou que o país detém 'total controle' do Estreito de Ormuz após a passagem de navios ter caído drasticamente. Na última segunda-feira, apenas 8 navios transitaram pelo local, contra os 130 a 140 antes da guerra. Taiwan condenou manobras navais planejadas pela China com a Indonésia, afirmando que Pequim tentava criar uma impressão falsa de controle sobre as águas orientais de Taiwan. Em outro desenvolvimento, hackers suspeitos de ligação com a China usaram inteligência artificial para atacar sites do governo de Taiwan, um incidente inédito que ilustra o papel crescente da IA na guerra cibernética.", "economia": "O Rio de Janeiro é o estado brasileiro que menos gasta com servidores ativos, investindo mais em despesas como aposentadorias e pensões. O aperto fiscal limita as contratações no estado. Por outro lado, o governo de Javier Milei na Argentina está mudando sua abordagem, agora priorizando o crescimento econômico e o emprego além do combate à inflação. O Banco Central da China promete novas medidas de política monetária para manter uma política adequadamente frouxa. No Brasil, o setor de serviços manteve-se estável em junho, contrariando as expectativas dos economistas que previam uma nova queda. O desempenho do segundo trimestre confirmou a tendência de enfraquecimento da economia.", "tecnologia": "A Google anunciou que o assistente de inteligência artificial Gemini atingiu 1 bilhão de usuários mensais, um marco significativo para a empresa. Essa conquista foi divulgada pelo CEO Sundar Pichai em uma declaração oficial na terça-feira, 12 de dezembro de 2026. Paralelamente, a inteligência artificial está ganhando cada vez mais espaço nas tecnologias móveis: recentemente, a Google lançou o Pixel 11 com novas funcionalidades de câmera e o Pixel Watch 5, que agora inclui a detecção de emergências respiratórias. Além disso, a MIT Technology Review publicará sua lista anual de Innovators Under 35 em 8 de setembro, reconhecendo jovens cientistas e engenheiros excepcionais com inovações promissoras.", "ciencia": "Um dos eventos mais notáveis mencionados nos artigos foi o eclipse solar total que ocorreu em 12 de agosto, visível em partes do Hemisfério Norte. Milhões de europeus tiveram a oportunidade de observar este fenômeno natural impressionante, enquanto o Brasil não pôde acompanhá-lo diretamente. A NASA também destacou a atualização de seu simulador de movimento vertical, um recurso crucial para treinamento e simulações espaciais, que agora pode replicar experiências avançadas como pilotagem de aviões modernos ou pousos na Lua sem necessidade de sair do solo. Além disso, a ciência também se destacou em outros campos: Yale publicou um estudo afirmando que o 'Medicare for All' poderia economizar US$ 1 trilhão e salvar 114.000 vidas por ano, enquanto pesquisas sobre buracos negros e nebulosas foram reveladas com novos detalhes graças ao Telescópio Espacial James Webb. Outra pesquisa focou na evolução de truques de cobras para atrair presas, introduzindo a terminologia 'engodo caudal' como uma novidade interessante no campo da biologia.", "cultura": "Milhões de pessoas se aglomeraram para observar o eclipse solar que percorreu a Europa Ocidental. Em outro destaque cultural, o Festival Acessa BH, na sua sexta edição, promove 30 atrações com foco em mulheres com deficiência no cinema e teatro. O guitarrista Daniel Oliva apresenta seu segundo álbum autoral 'Círculos' em São Paulo. No teatro, 'You and Me (and Whoever Comes Next)', baseado nas experiências de Keron Day como cuidador residencial, combina veracidade emocional com humor leve e tem um propósito social. A cantora Anitta comentou sobre sua presença em festivais internacionais durante uma entrevista ao programa Sem Censura, da TV Brasil, destacando que encontra mais espaço fora do Brasil. O grupo New Order anunciou um show extra em São Paulo, após a demanda inicial por ingressos se esgotar rapidamente. Além disso, o Festival Acessa BH destaca artistas de seis estados brasileiros e do Reino Unido, trazendo uma programação que valoriza a diversidade e inclusão cultural.", "sociedade": "O Brasil enfrenta um novo surto de sarampo após décadas sem registros da doença. A certificação internacional foi perdida dez anos depois que o vírus retornou e a cobertura vacinal diminuiu, levando à realização de uma campanha de vacinação em massa no estado de São Paulo. Em outro desenvolvimento, a Colômbia declarou três dias de luto oficial para homenagear as vítimas de um incidente recente. O município de Taoyuan, em Taiwan, planeja expandir seu programa gratuito de leite para mais crianças na região. Na área social, um construtor madrileño de 75 anos adaptou seu negócio, permitindo que trabalhe com apenas três pessoas e as faça autônomas, em resposta à pressão fiscal e incerteza do setor. Um relatório da saúde destaca erros ocorridos no hospital, detalhando problemas identificados durante uma revisão interna.", "meio_ambiente": "A Europa enfrenta diversos desafios ambientais e climáticos que ameaçam sua infraestrutura energética e a saúde pública. Em um desenvolvimento preocupante, 17 reatores nucleares franceses foram afetados por condições climáticas extremas e pela presença excessiva de jararacas marinhas, resultando em uma redução superior a 20% na capacidade produtiva de energia nuclear, atingindo um recorde negativo. Além disso, mais da metade da população europeia está prevista para ser afetada por outra onda de calor, com temperaturas acima de 30°C esperadas em regiões como França, Itália e Espanha, onde as temperaturas podem ultrapassar os 35°C. No contexto britânico, o governo está considerando enfraquecer seus objetivos para veículos elétricos (VEs), o que poderia custar até 3 bilhões de libras aos consumidores anualmente até 2030.", "direitos_humanos": "Em 2026, o Líbano vai parar de executar condenados à morte, conforme informa a Amnesty International. Isso marca um avanço na direção da abolição da pena de morte, já que o país se junta a três quartos dos países do mundo que não aplicam mais essa punição em lei ou prática. Por outro lado, investigações da ONU revelaram que o exército birmanês tem intensificado ataques contra civis usando paragliders motorizados, girocópteros e drones para lançar explosivos não guiados em áreas populosas. Este uso de tecnologia militar avançada em operações de guerra civil é considerado uma violação grave dos direitos humanos. Além disso, o livro 'Heart Full of Light', de Kalbinur Sidik, oferece uma perspectiva pessoal sobre os crimes cometidos contra o povo uighur na região do Xinjiang, na China. Finalmente, um julgamento no tribunal superior de Hong Kong terminou com um júri dividido sobre se Matthew Choi havia cometido o assassinato sob delírio de perseguição por ondas eletromagnéticas, levando ao encaminhamento do caso para um novo julgamento."}, "resumo_do_dia": {"politica_nacional": [{"id": 98981, "titulo": "“Cartel digital” com verba pública: MPE pede cassação de prefeito de Macaé", "url": "https://www.metropoles.com/colunas/milena-teixeira/cartel-digital-com-verba-publica-mpe-pede-cassacao-de-prefeito-de-macae", "fonte_id": "metropoles", "data_pub": "2026-08-12T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria Municipal apresentou um pedido de cassação contra o prefeito de Macaé, alegando que recursos públicos e estrutura da Prefeitura foram utilizados para promover o próprio prefeito e influenciar na eleição de 2024.", "titulo_pt": "Cassação pedida contra prefeito de Macaé por uso de verba pública em campanha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 98776, "titulo": "Lula muda planos e deve gastar R$ 2 bi em dois supercomputadores de IA, um americano e um chinês", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/lula-muda-planos-e-deve-gastar-r-2-bi-em-dois-supercomputadores-de-ia-um-americano-e-um-chines.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo alterou o Plano Brasileiro de Inteligência Artificial e planeja comprar dois supercomputadores entre os dez mais potentes do mundo, um dos Estados Unidos e outro da China. Os investimentos totalizam R$ 2 bilhões.", "titulo_pt": "Lula muda planos e deve gastar R$ 2 bi em dois supercomputadores de IA, um americano e um chinês", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98887, "titulo": "Suspensão do Discord: empresa chama decisão da ANPD de 'prematura' e diz que crimes foram coordenados fora da plataforma", "url": "https://g1.globo.com/tecnologia/noticia/2026/08/12/discord-anpd.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Discord classificou como prematura a decisão da ANPD de suspender as transmissões ao vivo na plataforma no Brasil, afirmando que ainda estava dentro do prazo para apresentar sua resposta. A empresa argumenta que a notificação foi recebida recentemente e está analisando o conteúdo da determinação.", "titulo_pt": "Discord chama decisão da ANPD de 'prematura'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98837, "titulo": "Lula aparece com chapéu em imagem para urna; relembre fotos dele em eleições anteriores", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-aparece-com-chapeu-em-imagem-para-urna-relembre-fotos-dele-em-eleicoes-anteriores.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de reeleição do presidente Lula (PT) divulgou fotos dele e de seu vice, Geraldo Alckmin (PSB), para a urna eletrônica. Lula aparece usando um chapéu panamá.", "titulo_pt": "Lula aparece com chapéu em imagem para urna; veja fotos das campanhas anteriores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98838, "titulo": "Candidato, Derrite deve ser vice de comissão da Câmara sobre redução da maioridade penal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/candidato-derrite-sera-vice-de-comissao-da-camara-sobre-reducao-da-maioridade-penal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Guilherme Derrite, candidato ao Senado por São Paulo (PP), será nomeado para ser vice-presidente de uma comissão da Câmara dos Deputados responsável pela análise do projeto que reduz a maioridade penal no Brasil.", "titulo_pt": "Candidato deve ser vice-presidente de comissão sobre redução da maioridade penal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98839, "titulo": "Meta tem de informar quem pagou ataque a Tarcísio após expor operação de fake news", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/meta-tem-de-informar-quem-pagou-ataque-a-tarcisio-apos-expor-operacao-de-fake-news.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatórios da Meta entregues à Justiça Eleitoral de São Paulo indicam que fake news contra o governador Tarcísio de Freitas foram disseminadas por contas externas, dificultando identificar quem financiou a operação.", "titulo_pt": "Meta deve informar quem pagou ataque a Tarcísio após expor operação de fake news", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98840, "titulo": "Haddad diz que vai questionar gestão Tarcísio após PM seguir seu motorista de forma 'ostensiva'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/haddad-diz-que-vai-questionar-gestao-tarcisio-apos-pm-seguir-seu-motorista-de-forma-ostensiva.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Fernando Haddad, candidato ao Governo de São Paulo, afirmou que sua equipe vai questionar a gestão Tarcísio de Freitas sobre uma suposta conduta ostensiva do PM em relação ao seu motorista. Haddad considera que o comportamento foi fora do padrão normal.", "titulo_pt": "Haddad vai questionar gestão Tarcísio após PM seguir motorista de forma 'ostensiva'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98888, "titulo": "Discord no Brasil: a decisão que suspende lives da rede social no país e o que acontece agora", "url": "https://g1.globo.com/tecnologia/noticia/2026/08/12/discord-no-brasil-a-decisao-que-suspende-lives-da-rede-social-no-pais-e-o-que-acontece-agora.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Proteção de Dados (ANPD) determinou que as lives no Discord serão suspensas no Brasil por três dias úteis, até que a empresa comprove medidas para proteger crianças e adolescentes. A primeira-dama Janja da Silva defendeu a medida na semana passada.", "titulo_pt": "Decisão suspende lives do discord no Brasil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 99226, "titulo": "Mendonça: manifestação antecipada do STF é fundamental para reforma tributária", "url": "https://www.jota.info/tributos/mendonca-manifestacao-antecipada-do-stf-e-fundamental-para-reforma-tributaria", "fonte_id": "jota", "data_pub": "2026-08-12T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) destacou a importância da manifestação antecipada do tribunal para a reforma tributária, mas também alertou para a necessidade de modular as expectativas sobre o ritmo dos julgamentos.", "titulo_pt": "Mendonça: manifestação antecipada do STF é fundamental para reforma tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98841, "titulo": "Pacto pela Democracia lança manifesto em defesa da integridade das eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/pacto-pela-democracia-lanca-manifesto-em-defesa-da-integridade-das-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Pacto pela Democracia, formado por mais de 200 organizações da sociedade civil, lançará um manifesto em defesa da integridade das eleições de 2026.", "titulo_pt": "Pacto pela Democracia lança manifesto para garantir a integridade das eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98889, "titulo": "Páginas oficiais de Flávio Bolsonaro incluem curso de pós-graduação que ele não fez; campanha diz que houve 'equívoco'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/12/paginas-oficiais-de-flavio-bolsonaro-incluem-curso-de-pos-graduacao-que-ele-nao-fez-campanha-diz-que-houve-equivoco.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As páginas oficiais do senador Flávio Bolsonaro, pré-candidato à Presidência pelo PL, afirmam que ele possui uma pós-graduação em Ciências Políticas da UFRJ, o que a universidade nega. A campanha de Flávio Bolsonaro admitiu um equívoco.", "titulo_pt": "Páginas oficiais de Flávio Bolsonaro incluem curso de pós-graduação que ele não fez; campanha diz que houve 'equívoco'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98890, "titulo": "Discord: reportagem revelou como lives na plataforma eram usadas para envolver adolescentes em violência extrema; relembre", "url": "https://g1.globo.com/fantastico/noticia/2026/08/12/discord-reportagem-revelou-como-lives-na-plataforma-eram-usadas-para-envolver-adolescentes-em-violencia-extrema-relembre.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T16:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente de 13 anos teria sido induzida a tirar a própria vida durante uma transmissão no Discord, levando a um novo debate sobre os riscos enfrentados por menores na plataforma e a mobilização de autoridades. O caso ressurge após relatos de desafios perversos que envolvem violência extrema entre usuários adolescentes.", "titulo_pt": "Discord: reportagem revelou como transmissões eram usadas para envolver adolescentes em violência extrema", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98842, "titulo": "Folha abre vaga de estágio em Saúde e Equilíbrio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/08/folha-abre-vaga-de-estagio-em-saude-e-equilibrio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T15:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de São Paulo oferece uma vaga de estágio na editoria de Saúde e Equilíbrio. O anúncio foi publicado no dia 8 de dezembro de 2026.", "titulo_pt": "Folha abre vaga de estágio em Saúde e Equilíbrio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98787, "titulo": "INSS paga aposentadoria por doença grave sem contribuição mínima; veja quem tem direito e como fazer o pedido", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/inss-paga-aposentadoria-por-doenca-grave-sem-contribuicao-minima-veja-quem-tem-direito-e-como-fazer-o-pedido.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os segurados do INSS com doenças graves podem se aposentar sem cumprir o mínimo de 12 contribuições exigidas pela Previdência Social. Essa medida permite que pessoas com condições médicas específicas tenham acesso ao benefício antes da idade mínima.", "titulo_pt": "INSS paga aposentadoria por doença grave sem contribuição mínima", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98891, "titulo": "Quaest divulga nova pesquisa da eleição presidencial na sexta (14)", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/08/12/quaest-divulga-nova-pesquisa-da-eleicao-presidencial.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Quaest divulgará na próxima sexta-feira (14) os resultados de uma nova pesquisa sobre a corrida presidencial de 2026, que foi contratada pelo Grupo Globo. O levantamento será o primeiro divulgado após a revelação da Polícia Federal sobre um repasse envolvendo Roberta Luchsinger e Marcola, ex-chefe de gabinete de Lula (PT), além da escolha de Alfredo Gaspar como candidato a vice-presidente na chapa de Flávio Bolsonaro.", "titulo_pt": "Quaest divulga nova pesquisa sobre eleição presidencial de 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98892, "titulo": "O que acontece com o Discord após suspensão de transmissões ao vivo no Brasil a pedido da ANPD", "url": "https://g1.globo.com/politica/noticia/2026/08/12/o-que-acontece-com-o-discord-apos-suspensao-de-transmissoes-ao-vivo-no-brasil-a-pedido-da-anpd.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Proteção de Dados (ANPD) determinou a suspensão das transmissões ao vivo do Discord no Brasil por três dias úteis. A medida visa cumprir as exigências da agência e não implica na suspensão total da plataforma no país.", "titulo_pt": "O que acontece com o Discord após suspensão de transmissões ao vivo no Brasil a pedido da ANPD", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 99747, "titulo": "Taiwan condemns ‘dangerous’ drill for political manipulation", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/13/2003862405", "fonte_id": "taipei_times", "data_pub": "2026-08-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan condenou uma 'exercício perigoso' que foi usado para manipular políticas. O país rejeitou a ação como prejudicial às suas relações internacionais.", "titulo_pt": "Taiwan condena ‘exercício perigoso’ para manipulação p to_pt": "Um plano da coalizão para abolir as normas de energia obrigatórias nas novas casas foi criticado como uma 'timebomb do custo de vida' que aprofundaria a desigualdade. Segundo o porta-voz da oposição sobre habitação e meio ambiente, Andrew Bragg, isso aumentaria os custos das contas de energia para as famílias mais pobres.", "titulo_pt": "Plano da coalizão para eliminar normas energéticas em novas casas é chamado de 'timebomb do custo de vida'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 98788, "titulo": "Lucro do BNDES cresce 25% e chega a R$ 9,2 bilhões no primeiro semestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/lucro-do-bndes-cresce-25-e-chega-a-r-92-bilhoes-no-primeiro-semestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES registrou um lucro recorrente de R$ 9,2 bilhões no primeiro semestre deste ano, crescimento de 25% em comparação com o mesmo período do ano anterior. O lucro recorrente acumulado de 12 meses atingiu R$ 17,1 bilhões, novo recorde histórico para a instituição.", "titulo_pt": "Lucro do BNDES cresce 25% e chega a R$ 9,2 bilhões no primeiro semestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98791, "titulo": "Setor de serviços do Brasil supera expectativas e fica estável em junho", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466716", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T14:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de serviços brasileiro manteve-se estável em junho, contrariando as expectativas dos economistas que previam uma nova queda. O desempenho do segundo trimestre confirmou a tendência de enfraquecimento da economia.", "titulo_pt": "Setor de serviços brasileiro mantém-se estável em junho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98792, "titulo": "Transpetro abre concurso público com 281 vagas e salário inicial de até R$ 15 mil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/transpetro-abre-concurso-publico-com-281-vagas-e-salario-inicial-de-ate-r-15-mil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T13:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Transpetro, empresa de transporte da Petrobras, lançou um concurso público com 281 vagas efetivas e 3.890 para cadastro de reserva. Os cargos são distribuídos em quatro editais, dois voltados para vagas terrestres e outros dois para posições marinhas, sob a regência da CLT.", "titulo_pt": "Transpetro abre concurso público com 281 vagas e salário inicial de até R$ 15 mil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98795, "titulo": "Preço do petróleo supera US$ 90, mas cai e está oscilando nesta quarta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466715", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T13:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo está oscilando nesta quarta-feira após dois dias de forte alta, com o barril Brent alcançando US$ 90,06. A commodity voltou a superar os US$ 90.", "titulo_pt": "Preço do petróleo oscila acima dos US$ 90, mas cai nesta quarta", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98796, "titulo": "Dólar e Bolsa oscilam após divulgação de inflação dos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/dolar-abre-em-queda-apos-divulgacao-de-inflacao-dos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T13:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar está oscilando nesta quarta-feira após subir 1,02% ontem, atingindo o valor de R$ 5,164. Os investidores estão reagindo aos dados de inflação dos Estados Unidos que foram conforme às expectativas.", "titulo_pt": "Dólar e Bolsa oscilam após divulgação de inflação dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 100061, "titulo": "China’s iSpace raises first batch of series E funding for reusable rocketry", "url": "https://spacenews.com/chinas-ispace-raises-first-batch-of-series-e-funding-for-reusable-rocketry/", "fonte_id": "spacenews", "data_pub": "2026-08-12T12:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa iSpace conseguiu arrecadar o primeiro lote de financiamento da série E para seu programa de foguetes reutilizáveis, meses após um grande round D++. Ainda há mais financiamento sendo levantado.", "titulo_pt": "China's ispace obtém primeira rodada de financiamento série E para foguetes reutilizáveis", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 99236, "titulo": "Análise sobre publicidade de alimentos pode levar até nove meses, diz diretor da Anvisa", "url": "https://www.jota.info/saude/analise-sobre-publicidade-de-alimentos-pode-levar-ate-nove-meses-diz-diretor-da-anvisa", "fonte_id": "jota", "data_pub": "2026-08-12T12:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor da Anvisa informou que uma análise sobre publicidade de alimentos pode levar até nove meses para ser concluída. A agência já elaborou duas resoluções sobre propagandas de alimentos e medicamentos, mas elas nunca entraram em vigor.", "titulo_pt": "Análise sobre publicidade de alimentos pode levar até nove meses, diz Anvisa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98798, "titulo": "BC da China promete novas medidas de política monetária de forma tempestiva", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466714", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T12:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O banco central da China afirmou que manterá uma política monetária adequadamente frouxa e adotará novas medidas práticas e eficazes de forma rápida, sem sinalizar cortes explícitos nas taxas de juros ou de compulsório.", "titulo_pt": "BC da China promete novas medidas monetárias rápidas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 99755, "titulo": "Field 3D printers could sustain high-tempo drone ops", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/13/2003862418", "fonte_id": "taipei_times", "data_pub": "2026-08-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de impressoras 3D no campo pode suportar operações aéreas de drones com alta intensidade. Essa tecnologia permitiria que os drones operassem em condições mais exigentes, aumentando sua eficiência e capacidade operacional.", "titulo_pt": "Impressoras 3D no campo poderiam sustentar operações aéreas de drones de alta intensidade", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 99427, "titulo": "ICE plans to put electric-shock gloves on officers' hands", "url": "https://www.axios.com/2026/08/12/ice-electric-shock-gloves-millions", "fonte_id": "axios", "data_pub": "2026-08-12T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ICE (Immigration and Customs Enforcement) planeja começar a usar luvas elétricas-chocadoras projetadas para causar dor e interromper a capacidade de reação de uma pessoa. A agência pretende gastar entre 10 e 20 milhões de dólares no equipamento, que será distribuído para agentes das divisões de Investigações da Segurança do Departamento de Estado e Operações de Remoção da ICE.", "titulo_pt": "ICE planeja usar luvas elétricas-chocadoras em seus agentes", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 98778, "titulo": "IA tem funcionado como amortecedor de impacto da guerra no Irã, diz Avenue", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ia-tem-funcionado-como-amortecedor-de-impacto-da-guerra-no-ira-diz-avenue.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial tem atuado como um amortecedor frente à alta dos preços do petróleo e da inflação, conforme analisou a diretora de investimentos (CIO) da Avenue Marcela Rocha. No entanto, esse efeito pode diminuir se a guerra no Oriente Médio persistir.", "titulo_pt": "IA atua como amortecedor diante da alta do petróleo, mas efeito pode diminuir com guerra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 99808, "titulo": "Scaling AI agents with trustworthy data", "url": "https://www.technologyreview.com/2026/08/12/1141032/scaling-ai-agents-with-trustworthy-data/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-12T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações estão rapidamente adotando agentes de inteligência artificial, e muitas acreditam que isso pode transformar o trabalho. No entanto, para alcançar um retorno sobre investimento desejado, é essencial ter uma base sólida, incluindo infraestrutura adequada e dados confiáveis.", "titulo_pt": "Escalar agentes de IA com dados confiáveis", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 99590, "titulo": "Google’s new Pixel 11 puts Gemini at center of AI phone battle with Apple", "url": "https://www.cnbc.com/2026/08/12/google-pixel-11-gemini-ai-phone-apple.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-12T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google está lançando a linha de telefones Pixel 11 algumas semanas antes do lançamento da Apple, que apresentará uma versão atualizada do Siri alimentada por modelos de inteligência artificial Gemini.", "titulo_pt": "Novo Pixel 11 da google coloca Gemini no centro da batalha de AI com a Apple", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 99005, "titulo": "Por que a mesma pergunta feita de manhã e à noite pode gerar respostas diferentes na IA?", "url": "https://exame.com/inteligencia-artificial/por-que-a-mesma-pergunta-feita-de-manha-e-a-noite-pode-gerar-respostas-diferentes-na-ia/", "fonte_id": "exame", "data_pub": "2026-08-12T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial pode fornecer respostas diferentes para a mesma pergunta feita de manhã e à noite devido a fatores técnicos e operacionais. Isso ocorre porque a IA pode sofrer variações na precisão ou tom ao longo do dia.", "titulo_pt": "Por que a mesma pergunta feita de manhã e à noite pode gerar respostas diferentes na IA?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 99971, "titulo": "Inside the Data Bottleneck Slowing Visual and Physical AI", "url": "https://content.knowledgehub.wiley.com/the-2026-state-of-visual-and-physical-ai-a-survey-of-700-practitioners-on-data-models-and-production/", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-12T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa com mais de 700 profissionais examina como equipes de IA visual e física constrzem sistemas, por que modelos falham e onde o trabalho com dados impulsiona a produção. O whitepaper gratuito pode ser baixado imediatamente.", "titulo_pt": "Dentro do Bottleneck de dados atravessando Visual e físico AI", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 99912, "titulo": "Google’s Pixel Watch 5 Can Now Detect Breathing Emergencies", "url": "https://www.wired.com/story/googles-pixel-watch-5-can-now-detect-breathing-emergencies/", "fonte_id": "wired", "data_pub": "2026-08-12T14:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google adicionou a detecção de emergências respiratórias ao seu relógio inteligente Pixel Watch. A companhia também incluiu a monitoração proativa de pressão sanguínea e tendências de resistência à insulina no aplicativo Google Health.", "titulo_pt": "Relógio Pixel Watch 5 da google agora pode detectar emergências respiratórias", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 99913, "titulo": "4 New Camera Tricks on Google’s Latest Pixel 11 Smartphones", "url": "https://www.wired.com/story/new-camera-tricks-on-google-latest-pixel-11-smartphones/", "fonte_id": "wired", "data_pub": "2026-08-12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google lançou novas funcionalidades de câmera no seu mais recente smartphone Pixel 11, incluindo Magic Capture e Instant Night Sight. Entre outras, há também um teleprompter integrado.", "titulo_pt": "4 Novos truques de câmera na última série do Google Pixel 11", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 99914, "titulo": "Google Pixel 11 Series, Pixel Watch 5, Pixel Tag: Specs, Features, Price, Release Date", "url": "https://www.wired.com/story/pixel-11-pixel-watch-5-pixel-tag-everything-google-announced-at-its-made-by-google-2026-event/", "fonte_id": "wired", "data_pub": "2026-08-12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A linha de smartphones Pixel 11 foi lançada, juntamente com o Pixel Watch 5 e a nova Pixel Tag.", "titulo_pt": "Google Pixel 11 Series, Pixel Watch 5 e Pixel Tag: especificações, funcionalidades, preços e data de lançamento", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 98793, "titulo": "Google diz que Gemini ultrapassou 1 bilhão de usuários mensais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/google-diz-que-gemini-ultrapassou-1-bilhao-de-usuarios-mensais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T13:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO do Google, Sundar Pichai, anunciou que o assistente de inteligência artificial Gemini atingiu a marca de 1 bilhão de usuários mensais. Este feito foi divulgado na terça-feira (11) de dezembro de 2026.", "titulo_pt": "Google anuncia que Gemini ultrapassou 1 bilhão de usuários mensais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 99915, "titulo": "Honor’s Robot Phone Has a Gimbal-Powered Camera for Vloggers", "url": "https://www.wired.com/story/honor-robot-phone/", "fonte_id": "wired", "data_pub": "2026-08-12T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo telefone Android da Honor, exclusivo para o mercado chinês, possui uma câmera gimbal motorizada que se eleva do aparelho para substituir a ação-câmera.", "titulo_pt": "Telefone honor com câmera gimbal motorizada para vlogueiros", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 99809, "titulo": "The Download: our 35 young innovators and the “censorship-industrial complex”", "url": "https://www.technologyreview.com/2026/08/12/1141714/the-download-innovators-under-35-censorship-industrial-complex/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-12T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O MIT Technology Review vai revelar sua lista anual de Innovators Under 35 em 8 de setembro, reconhecendo 35 jovens cientistas e engenheiros excepcionais. O objetivo é destacar inovações promissoras lideradas por indivíduos com menos de 35 anos.", "titulo_pt": "Download: nossos 35 inovadores e a 'indústria da censura'", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 99916, "titulo": "This Coin-Sized Device Can Hack a Boeing 737", "url": "https://www.wired.com/story/this-coin-sized-device-can-hack-a-boeing-737/", "fonte_id": "wired", "data_pub": "2026-08-12T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de segurança descobriram que, em menos de 60 segundos, é possível abrir uma porta externa do avião, conectar um dispositivo pequeno e redirecionar o piloto automático ou sabotar o plano de voo.", "titulo_pt": "Dispositivo do tamanho de uma moeda pode hackear um Boeing 737", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 99917, "titulo": "How to Select the Office Chair That’s Right For You", "url": "https://www.wired.com/story/how-to-choose-the-right-office-chair/", "fonte_id": "wired", "data_pub": "2026-08-12T11:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Não todos os cadeiras de escritório são adequadas para todas as pessoas. Um especialista em ergonomia foi consultado sobre como escolher a cadeira ideal dentro do orçamento, altura e constituição física.", "titulo_pt": "Como escolher a cadeira de escritório ideal para você", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 99919, "titulo": "The Job-Interview Tattoo Guy Everyone Got Mad at Finally Explains Himself", "url": "https://www.wired.com/story/linkedin-grindset-tattoo-guy-explains-himself/", "fonte_id": "wired", "data_pub": "2026-08-12T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jordan Zietz, cofundador da LemonLime, decidiu tatuar o logotipo da empresa no seu ombro como resposta às críticas recebidas.", "titulo_pt": "O fundador do startup com tatuagem gerou polêmica finalmente se explica", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 100088, "titulo": "A vest tested on the Artemis I mission blocked some radiation exposure", "url": "https://www.sciencenews.org/article/vest-artemis-mission-blocked-radiation", "fonte_id": "science_news", "data_pub": "2026-08-12T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma blusa de plástico de 26 quilos, usada em um modelo humano no voo não tripulado da missão Artemis I, pode proteger os astronautas contra rajadas solares no futuro.", "titulo_pt": "Blusa testada na missão Artemis I bloqueou exposição a radiação", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 100078, "titulo": "NASA Upgrades Vertical Motion Simulator for Modern Mission Needs", "url": "https://www.nasa.gov/centers-and-facilities/ames/nasa-upgrades-vertical-motion-simulator-for-modern-mission-needs/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA atualizou seu simulador de movimento vertical, o maior do mundo, para atender às necessidades modernas das missões. Com as novas melhorias, o simulador se tornou mais poderoso e capaz de simular experiências como pilotar um táxi aéreo avançado ou pousar na Lua sem sair do chão.", "titulo_pt": "NASA atualiza simulador Vertical para necessidades modernas das missões", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 98831, "titulo": "Veja fotos do eclipse solar desta quarta-feira (12)", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/veja-fotos-do-eclipse-solar-desta-quarta-feira-12.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-12T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhões de europeus tiveram a chance de observar um eclipse solar total nesta quarta-feira (12), quando a Lua passou entre a Terra e o Sol. O fenômeno foi visível em parte do continente, com uma faixa mergulhada na escuridão por quase dois minutos.", "titulo_pt": "Veja fotos do eclipse solar desta quarta-feira (12)", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 99124, "titulo": "Ao vivo: acompanhe o eclipse solar total", "url": "https://www.bbc.com/portuguese/articles/c4gj4e99xe5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-12T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lua passará entre a Terra e o Sol, ocultando a luz solar na quarta-feira (12/08). O eclipse solar total será visível em algumas regiões do Hemisfério Norte, enquanto no Brasil não será possível observá-lo.", "titulo_pt": "Ao vivo: acompanhe o eclipse solar total", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 99531, "titulo": "Eurovision to exclude countries at war from hosting contest", "url": "https://www.lemonde.fr/en/culture/article/2026/08/12/eurovision-to-exclude-countries-at-war-from-hosting-contest_6756434_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-12T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A organização do concurso musical anunciou que, com as novas regras, o vencedor da competição não poderá automaticamente anfitrião do evento se uma guerra, situação geopolítica sensível ou qualquer outra circunstância significativamente afetar a segurança, a segurança ou a estabilidade de seu país ou região imediata.", "titulo_pt": "Eurovision vai excluir países em guerra da organização do concurso", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 99656, "titulo": "World witnesses one of nature’s greatest spectacles: a total solar eclipse", "url": "https://www.ft.com/content/007b5ff6-e8fe-47f6-ba34-40cd6520e9fd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-12T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Públicos observam um dos maiores espetáculos da natureza, eclipses solares totais ou parciais. Espectadores e cientistas se reúnem para assistirem à ocultação total ou parcial do Sol no hemisfério norte.", "titulo_pt": "Mundo testemunha um dos maiores espetáculos da natureza: um eclipse solar total", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 100079, "titulo": "NASA Astronaut Mike Fincke Leaves NASA, Career Includes 4 Spaceflights", "url": "https://www.nasa.gov/news-release/nasa-astronaut-mike-fincke-leaves-nasa-career-includes-4-spaceflights/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Fincke, astronauta da NASA, está deixando a agência após 30 anos de serviço. Durante sua carreira, ele realizou quatro missões espaciais, acumulou 549 dias em órbita e fez nove caminhadas extraveiculares para o Estação Espacial Internacional.", "titulo_pt": "Mike Fincke, astronauta da NASA, se despede após 30 anos de serviço", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 100017, "titulo": "Yale study finds 'Medicare for All' could save $1 trillion and 114,000 lives every year", "url": "https://www.scientificamerican.com/article/yale-study-finds-medicare-for-all-could-save-1-trillion-and-114-000-lives-every-year/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de Yale afirma que um sistema de saúde universal e de pagamento único, como 'Medicare for All', poderia economizar US$ 1 trilhão e salvar 114.000 vidas por ano. O senador Bernie Sanders do Vermont cita o estudo como prova dos benefícios desse tipo de sistema, mas a pesquisa ainda não foi submetida para revisão peer.", "titulo_pt": "Estudo de yale sugere que 'Medicare for All' poderia economizar us$ 1 trilhão e salvar 114.000 vidas por ano", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100080, "titulo": "Pursuing a Dream of Working for NASA", "url": "https://www.nasa.gov/centers-and-facilities/kennedy/pursuing-a-dream-of-working-for-nasa/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lindsey Waitt, uma jovem que cresceu em Worcester, Massachusetts, sempre sonhou em trabalhar para a NASA. Seu sonho se realizou quando ela assumiu o papel de engenheira de projeto de teste do time Artemis da NASA.", "titulo_pt": "Perseguindo um sonho de trabalhar na NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 99974, "titulo": "STAT+: Cancer patients face longer wait times to begin treatment, according to new study", "url": "https://www.statnews.com/2026/08/12/cancer-patients-face-longer-wait-times-for-treatment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo mostrou que pacientes com câncer estão aguardando mais tempo para iniciar o tratamento desde há uma década. Isso ocorre independentemente do tipo de câncer analisado.", "titulo_pt": "Pacientes com câncer enfrentam espera maior para início do tratamento, sugere estudo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 100018, "titulo": "No, AI didn’t just solve the thorniest problem in math", "url": "https://www.scientificamerican.com/article/no-ai-didnt-just-solve-the-thorniest-problem-in-math/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Não houve uma solução para a hipótese de Riemann, mas um AI fez progressos significativos em um problema relacionado. Existe um prêmio de 1 milhão de dólares para provar a hipótese de Riemann.", "titulo_pt": "AI não resolveu o problema mais difícil da matemática, mas avançou em um relacionado", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100019, "titulo": "Stunning new images reveal cosmic cycle of death and rebirth", "url": "https://www.scientificamerican.com/article/stunning-new-images-reveal-cosmic-cycle-of-death-and-rebirth/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa na Nébula Helix revelou detalhes nunca antes vistos sobre como estrelas moribundas reciclam elementos. A descoberta foi feita acidentalmente pelos pesquisadores.", "titulo_pt": "Novas imagens impressionantes revelam ciclo de morte e renascimento cósmico", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100020, "titulo": "JWST images illuminate ‘black hole stars’ at cosmic dawn", "url": "https://www.scientificamerican.com/article/jwst-images-illuminate-black-hole-stars-at-cosmic-dawn/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens do Telescópio Espacial James Webb capturaram primeiramente esses buracos negros gigantes, envoltos por nuvens de gás, como pequenos pontos vermelhos em fotografias de fundo interestelar. Eles estão cheios de surpresas.", "titulo_pt": "Imagens do JWST iluminam ‘estrelas de buracos negros’ na alvorada cósmica", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100089, "titulo": "Too many choices complicate female frogs’ sex lives", "url": "https://www.sciencenews.org/article/choices-female-frogs-sex-mating-calls", "fonte_id": "science_news", "data_pub": "2026-08-12T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na pesquisa, as fêmeas de rãs escolheram menos machos preferidos à medida que o número de chamados de macho aumentava. Isso pode dar a outros machos uma chance melhor de se reproduzirem.", "titulo_pt": "Muitas opções complicam a vida sexual das fêmeas de rã", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 99975, "titulo": "Opinion: The Lindsay Clancy case shows the limits of postpartum psychiatry", "url": "https://www.statnews.com/2026/08/12/lindsay-clancy-postpartum-psychosis-diagnosis-treatment-limits/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-12T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os tratamentos e compreensões das doenças psiquiátricas pós-parto ainda são considerados insuficientes, de acordo com especialistas.", "titulo_pt": "A situação de Lindsay Clancy ilustra as limitações da psiquiatria pós-parto", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 100081, "titulo": "APOD: 2026 August 12 – Perseids over a Little Planet", "url": "https://science.nasa.gov/image-article/apod/apod-2026-august-12-perseids-over-a-little-planet/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da NASA mostra o fenômeno dos Perseides sobre uma pequena representação planetária. Esta imagem foi publicada na APOD (Astronomy Picture of the Day) em 12 de agosto de 2026.", "titulo_pt": "Perseidas acima de um pequeno planeta", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 99310, "titulo": "Europe solar eclipse live: millions flock to viewing spots in Spain, UK and Iceland", "url": "https://www.theguardian.com/world/live/2026/aug/12/europe-solar-eclipse-spain-uk-iceland-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-12T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhões de pessoas se aglomeraram nos locais de observação ao longo do caminho total da sombra solar na Europa Ocidental para assistirem à eclipsesolar. As estradas e parques de estacionamento em Cornualha, no Reino Unido, estão congestionados com espectadores.", "titulo_pt": "Eclipse solar na Europa: milhões se aglomeram em pontos de observação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 100114, "titulo": "Post your questions for Amy Lee of Evanescence", "url": "https://www.theguardian.com/music/2026/aug/12/post-your-questions-for-amy-lee-o function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {

  _fUrl = btn.dataset.url;

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
