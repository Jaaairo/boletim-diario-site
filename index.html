aiwan", "classe": "B"}, {"id": 241771, "titulo": "How to Save $25 on Burga’s Phone Accessories With This Sale", "url": "https://www.wired.com/story/burga-sale-november-2026/", "fonte_id": "wired", "data_pub": "2026-11-02T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há uma promoção que permite economizar $25 em pedidos acima de $50, incluindo itens como case de telefone, anel magnético, pulseira para Apple Watch e carregador portátil.", "titulo_pt": "Como economizar $25 em acessórios de telefone da Burga com esta promoção", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 241760, "titulo": "Third person dies of bird flu since virus started jumping to livestock", "url": "https://arstechnica.com/health/2026/11/third-person-dies-of-bird-flu-since-virus-started-jumping-to-livestock/", "fonte_id": "ars_technica", "data_pub": "2026-11-02T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terceiro caso de morte por gripe aviária foi registrado desde que o vírus começou a infectar animais domésticos. A ameaça ainda é considerada baixa, mas o vírus continua se espalhando.", "titulo_pt": "Terceira morte por gripe aviária registra-se desde que vírus infecta animais", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 241786, "titulo": "One of Google’s Android partners turned 1.3 million set-top boxes into a botnet", "url": "https://www.theverge.com/1024807/google-botnet-android-tv-shut-down", "fonte_id": "the_verge", "data_pub": "2026-11-02T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google informou que um de seus parceiros de fabricação de Android instalou uma backdoor em 1,3 milhões de dispositivos, transformando-os em uma rede zumbi. A empresa desativou a backdoor e rompeu os laços com o fabricante chinês Videostrong Technology Co., que foi proibido de construir ou vender dispositivos Android certificados.", "titulo_pt": "Um dos parceiros do Android da Google instalou uma backdoor em 1,3 milhões de dispositivos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 241753, "titulo": "As AI solves maths puzzles faster than humans, mathematicians face uncertain future", "url": "https://www.scmp.com/news/us/science-technology/article/3373045/ai-solves-maths-puzzles-faster-humans-mathematicians-face-uncertain-future", "fonte_id": "scmp", "data_pub": "2026-11-02T20:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está resolvendo problemas matemáticos que deixaram os humanos estupefatos, levando matemáticos de todo o mundo, incluindo da China, a questionarem se as máquinas irão substituí-los e como isso afetará o futuro da pesquisa e dos logros na matemática.", "titulo_pt": "A IA resolvendo problemas matemáticos mais rápido que os humanos faz os matemáticos questionarem o futuro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 241783, "titulo": "U.S. trade commission terminates Samsung chip patent probe following settlement with Netlist", "url": "https://en.yna.co.kr/view/AEN20261103000300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Comércio Internacional dos Estados Unidos encerrou a investigação sobre patentes de chips da Samsung após um acordo com a Netlist.", "titulo_pt": "Comissão de comércio internacional dos EUA encerra investigação de patentes de chips da Samsung após acordo com a Netlist", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241348, "titulo": "O que a inteligência artificial não pode ensinar sobre o coração", "url": "https://veja.abril.com.br/coluna/letra-de-medico/o-que-a-inteligencia-artificial-nao-pode-ensinar-sobre-o-coracao/", "fonte_id": "veja", "data_pub": "2026-11-02T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está revolucionando a medicina, mas estudos indicam que emoções como o otimismo também desempenham um papel significativo na saúde cardiovascular.", "titulo_pt": "O que a inteligência artificial não pode ensinar sobre o coração", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 241761, "titulo": "Googling \"Zelda\" today offers a glimpse of how search worked in 1998", "url": "https://arstechnica.com/gaming/2026/11/googles-legend-of-zelda-easter-egg-transports-you-back-to-1998/", "fonte_id": "ars_technica", "data_pub": "2026-11-02T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa de hoje com a palavra 'Zelda' oferece uma visão de como os motores de busca funcionavam em 1998. A frase 'O fluxo do tempo sempre é cruel' sugere que as mudanças nas capacidades de busca são notáveis e evidentes quando se compara com o passado.", "titulo_pt": "Pesquisando 'Zelda' hoje oferece uma visão de como o google funcionava em 1998", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 241767, "titulo": "Germany says lawmakers’ iPhones may have been hacked with spyware", "url": "https://techcrunch.com/2026/11/02/germany-says-lawmakers-iphones-may-have-been-hacked-with-spyware/", "fonte_id": "techcrunch", "data_pub": "2026-11-02T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha informou que parlamentares e um cineasta receberam avisos da Apple indicando que seus iPhones podem ter sido hackeados com spyware. A Apple notificou essas pessoas sobre a possibilidade de seu dispositivo ter sido alvo de um ataque.", "titulo_pt": "Alemanha relata que iphones de parlamentares podem ter sido hackeados com spyware", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 241768, "titulo": "Web host Squarespace lays off 19% of its employees", "url": "https://techcrunch.com/2026/11/02/web-host-squarespace-lays-off-19-of-its-employees/", "fonte_id": "techcrunch", "data_pub": "2026-11-02T19:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Squarespace, provedor de hospedagem de sites, anunciou cortes de 19% de sua força de trabalho como parte de uma reestruturação organizacional mais ampla.", "titulo_pt": "Squarespace elimina 19% de seus funcionários", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 241769, "titulo": "New York Times and other outlets sue web browser Brave over alleged content scraping", "url": "https://techcrunch.com/2026/11/02/new-york-times-and-other-outlets-sue-web-browser-brave-over-alleged-content-scraping/", "fonte_id": "techcrunch", "data_pub": "2026-11-02T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O New York Times e outras fontes estão processando a empresa de navegador web focada na privacidade, Brave, acusando-a de rastrear conteúdo protegido por direitos autorais do New York Times e distribuí-lo ilegalmente para seus clientes, como Anthropic e Perplexity.", "titulo_pt": "New York Times e outros veículos processam navegador Brave por suposto rastreamento de conteúdo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 241762, "titulo": "Most of our measures of a key cognitive process don't agree", "url": "https://arstechnica.com/science/2026/11/most-of-our-measures-of-a-key-cognitive-process-dont-agree/", "fonte_id": "ars_technica", "data_pub": "2026-11-02T19:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma grande pesquisa que não obteve resultados positivos ainda foi publicada. As medidas de um processo cognitivo crucial não concordam entre si.", "titulo_pt": "A maioria de nossas medidas de um processo cognitivo crucial não concordam", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 241770, "titulo": "Snap settles lawsuit accusing platform of fueling teen depression and eating disorders", "url": "https://techcrunch.com/2026/11/02/snap-settles-lawsuit-accusing-platform-of-fueling-teen-depression-and-eating-disorders/", "fonte_id": "techcrunch", "data_pub": "2026-11-02T19:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Snap concordou em pagar uma indenização para encerrar uma ação judicial que acusava a plataforma de contribuir para a depressão e distúrbios alimentares de adolescentes. Os reclamantes afirmaram que começaram a usar plataformas como o YouTube desde os três anos de idade e outras redes sociais por volta dos nove anos, desenvolvendo hábitos de uso compulsivo atribuídos a recursos como o autoplay e a rolagem infinita.", "titulo_pt": "Snap concorda em pagar indenização por acusação de contribuir para depressão e distúrbios alimentares de adolescentes", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 241789, "titulo": "Ford promises not to sell your driving habits to data brokers", "url": "https://www.theverge.com/transportation/1024386/ford-customer-driving-data-privacy-promise-data-brokers", "fonte_id": "the_verge", "data_pub": "2026-11-02T19:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ford prometeu não vender dados sobre o comportamento de dirigir dos clientes a brokering de dados externos como parte de uma nova promessa de privacidade. A empresa afirma que buscará proteger esses dados.", "titulo_pt": "Ford promete não vender hábitos de direção dos clientes para brokering de dados", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 241790, "titulo": "Anthropic clamps down on Claude’s AI video game clones", "url": "https://www.theverge.com/ai-artificial-intelligence/1024632/anthropic-claude-ai-video-game-clones", "fonte_id": "the_verge", "data_pub": "2026-11-02T18:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic atualizou o sistema de prompt do Claude Code para impedir que a ferramenta de IA seja utilizada para reproduzir jogos de videogame existentes. A empresa permitirá que as pessoas usem o Claude Code para criar jogos, mas não quer que elas reproduzam jogos existentes.", "titulo_pt": "Anthropic restringe uso do Claude code para clonar jogos de videogame existentes", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 241028, "titulo": "Researchers develop new semiconductor material", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/03/2003867066", "fonte_id": "taipei_times", "data_pub": "2026-11-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores desenvolveram um novo material semiconductor. O material apresenta propriedades promissoras para aplicações em tecnologia avançada.", "titulo_pt": "Pesquisadores desenvolvem novo material semiconductor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 241794, "titulo": "Exactly solvable model reveals how trapped light can create magnetic order in one-dimensional spin chains", "url": "https://phys.org/news/2026-11-solvable-reveals-magnetic-dimensional-chains.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas descobriram que confinando cadeias de spins unidimensionais classicas dentro de uma cajota comum de espelho com luz, eles podiam forçar essas partículas magnéticas a se organizar e passar por uma transição de fase. Seu trabalho fornece os exemplos mais simples e exatamente resolubles que demonstram como a luz pode criar novas transições de fase com materiais.", "titulo_pt": "Modelo exatamente resolúvel revela como a luz pode criar ordem magnética em cadeias de spins unidimensionais confinadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241795, "titulo": "European flounder can complete whole life cycle in freshwater", "url": "https://phys.org/news/2026-11-european-flounder-life-freshwater.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos flundres coletados no Lago Pulmanki, no norte da Finlândia, passou toda a sua vida em água doce. Este estudo fornece a primeira evidência de que a espécie pode completar todo o ciclo vital em água doce.", "titulo_pt": "Flundres europeus podem completar todo o ciclo vital em água doce", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241796, "titulo": "Industrialization reshapes gut microbes, from bacterial communities to their DNA, studies find", "url": "https://phys.org/news/2026-11-industrialization-reshapes-gut-microbes-bacterial.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A industrialização altera as comunidades de microrganismos no trato gastrointestinal, afetando tanto as comunidades bacterianas quanto o DNA dessas bactérias. Essas alterações influenciam significativamente as funções e o bem-estar do hospedeiro, com possíveis conexões com doenças ambientais crônicas.", "titulo_pt": "Industrialização remodela micrbioma do intestino, dos grupos bacterianos aos seus genes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241797, "titulo": "Not in a FEMA flood zone? Your home could still be at risk—and you could suffer more than your neighbor", "url": "https://phys.org/news/2026-11-fema-zone-home-neighbor.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Casas fora das áreas de risco federal de inundações ainda podem estar em perigo. A falta de obrigatoriedade de seguros de inundações e a ilusão de segurança oferecida pelas mapas de risco podem levar a prejuízos maiores para quem não tem cobertura.", "titulo_pt": "Fora da área de inundação federal? Sua casa ainda corre risco e pode sofrer mais do que o vizinho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241819, "titulo": "Happy 65 Years: NASA’s Johnson Space Center Then and Now", "url": "https://www.nasa.gov/centers-and-facilities/johnson/happy-65-years-nasas-johnson-space-center-then-and-now/", "fonte_id": "nasa_news", "data_pub": "2026-11-02T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aos 65 anos, o Centro Espacial Johnson, em Houston, foi fundado com o objetivo de promover a navegação espacial humana. Desde então, tem sido o centro de excelência para a navegação espacial humana da NASA, suportando missões desde o Projeto Mercury até a missão Artemis.", "titulo_pt": "Feliz 65 anos: o centro espacial Johnson da nasa, daí para aqui", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 241798, "titulo": "Are we overfertilizing our fields? Researchers challenge conventional soil testing", "url": "https://phys.org/news/2026-11-overfertilizing-fields-conventional-soil.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo, liderado por Dr. Shikma Zaarur da Universidade Hebraica de Jerusalém, em colaboração com Dr. Ran Erel da Organização Agrícola de Pesquisa–Instituto Volcani, descobriu que solos agrícolas podem conter um grande estoque de potássio, um nutriente essencial para o crescimento das plantas, que é geralmente ignorado pelos métodos de teste de solo convencionais. Esses achados podem abrir caminho para recomendações de fertilizantes mais precisas, potencialmente reduzindo o uso desnecessário de fertilizantes enquanto promovem a produção agrícola sustentável.", "titulo_pt": "Estamos sobreaplicando fertilizantes nas nossas terras? Pesquisadores questionam os métodos de teste de solo convencionais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241799, "titulo": "Molecular dinitrogen anions pave the way for low-temperature ammonia synthesis", "url": "https://phys.org/news/2026-11-molecular-dinitrogen-anions-pave-temperature.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A síntese de amônia (NH₃) é crucial para a produção de fertilizantes, mas está ganhando atenção como um meio de transporte de hidrogênio livre de carbono. No entanto, a síntese ainda depende de processos de alta temperatura e pressão, que são desafiadores para serem escalados de forma sustentável devido à forte ligação entre os átomos de nitrogênio em gás nitrogênio (N₂).", "titulo_pt": "Aniones de dinitrogênio abrem caminho para a síntese de amônia a baixa temperatura", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241800, "titulo": "According to science, you may be more likely to gain respect and status by helping others", "url": "https://phys.org/news/2026-11-science-gain-respect-status.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa, liderada por Jonathan Egeland, sugere que a inteligência humana pode trazer mais respeito e status, mas apenas quando utilizada para auxiliar outras pessoas. A inteligência ainda é um mistério para os cientistas, que buscam entender por que ela evoluiu nas humanas, embora já existam algumas teorias sobre sua função social.", "titulo_pt": "De acordo com a ciência, você pode ganhar mais respeito e status ao auxiliar outras pessoas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241801, "titulo": "Reservoir, human activity impact Ravi River's surface water availability by fivefold", "url": "https://phys.org/news/2026-11-reservoir-human-impact-ravi-river.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A saúde de um rio não se limita à presença de água e vegetação. Ela depende de vários fatores, como a quantidade de água que flui, como ela se move pelo território, como essa quantidade varia com as estações do ano, a movimentação de sedimentos e a frequência com que o rio transborda para sua planície de alvoroamento.", "titulo_pt": "Reservatório e atividades humanas aumentam cinco vezes a disponibilidade de água superficial do rio Ravi", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241802, "titulo": "From wild to mild: Friendly foxes show changes in brain region", "url": "https://phys.org/news/2026-11-wild-mild-friendly-foxes-brain.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estudaram a neurologia de raposas domésticas e observaram mudanças em uma área do cérebro associada à agressividade, localizada na base do hipotálamo ventromedial. Essas mudanças foram observadas em raposas domésticas, agressivas e selvagens.", "titulo_pt": "De selvagens a dóceis: raposas amigáveis mostram mudanças em região do cérebro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241820, "titulo": "TB 26-09 Measured Hammer-Tap Inputs", "url": "https://www.nasa.gov/centers-and-facilities/nesc/tb-26-09-measured-hammer-tap-inputs/", "fonte_id": "nasa_news", "data_pub": "2026-11-02T20:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um teste com martelo instrumentado não requer uma onda de pulso idealizada. Quando forças e respostas são medidas com precisão, picos e contatos separados permanecem como entradas conhecidas. A forma da força altera a excitação, mas não invalida inerentemente o registro.", "titulo_pt": "TB 26-09: medidas de impulsos com martelo", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 241793, "titulo": "Washington state resident dies from bird flu following exposure to infected cattle", "url": "https://www.statnews.com/2026/11/02/bird-flu-washington-state-resident-dies-infected-cattle-exposure/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um residente de Washington morreu de complicações causadas pelo vírus da gripe aviária. Este é o primeiro caso de morte por este vírus nos Estados Unidos em um ano.", "titulo_pt": "Pessoa de washington morre com gripe aviária após contato com gado infectado", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 241803, "titulo": "Q&A: Is faith feminine? Why US churches have men in pulpits, women in pews", "url": "https://phys.org/news/2026-11-qa-faith-feminine-churches-men.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Landon Schnabel, que trabalhou como ministro cristão, notou uma contradição em muitas igrejas dos EUA: embora os cargos de liderança geralmente sejam ocupados por homens, indicando uma religião considerada masculina e patriarcal, mais mulheres participam de serviços, estudos bíblicos e outras atividades.", "titulo_pt": "Perguntas e respostas: A fé é feminina? Por que as igrejas dos EUA têm homens no púlpito e mulheres nas cadeiras?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241804, "titulo": "A new way to make better use of ruthenium in single-atom catalysts", "url": "https://phys.org/news/2026-11-ruthenium-atom-catalysts.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rutenio (Ru) é um metal valioso usado em catalisadores para acelerar reações químicas em muitos processos industriais. Embora seja raro e caro, cientistas buscam maneiras de utilizá-lo de forma mais eficiente.", "titulo_pt": "Uma nova maneira de melhorar o uso do rutenio em catalisadores de átomos únicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241454, "titulo": "EUA aprovam genérico de lenacapavir para prevenção do HIV", "url": "https://www.dw.com/pt-br/eua-aprovam-genérico-de-lenacapavir-para-prevenção-do-hiv/a-79833988?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-02T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos aprovaram um genérico de lenacapavir para prevenção do HIV, o que pode facilitar o acesso em países de baixa e média renda. No Brasil, o principal obstáculo para a inclusão da terapia no SUS é o alto custo.", "titulo_pt": "EUA aprovam genérico de lenacapavir para prevenção do HIV", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 241493, "titulo": "Qué se sabe de la visita del Papa León XIV a la Argentina: cuándo son los feriados, cómo es el itinerario completo y qué calles estarán cortadas", "url": "https://www.lanacion.com.ar/sociedad/que-se-sabe-de-la-visita-del-papa-leon-xiv-a-la-argentina-cuando-son-los-feriados-como-es-el-nid02112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-02T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV visitará a Argentina de 8 a 11 de novembro, com atividades programadas em Buenos Aires, Córdoba e Luján. As rotas de circulação serão alteradas devido aos preparativos para a visita.", "titulo_pt": "O que se sabe sobre a visita do Papa leão XIV à Argentina: datas dos feriados, itinerário completo e calçadas interditas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 241871, "titulo": "The First Time Producers Had to Find a New James Bond, the Result Was the Best 007 Movie Ever", "url": "https://www.indiewire.com/features/commentary/george-lazenby-james-bond-on-her-majestys-secret-service-1235224936/", "fonte_id": "indiewire", "data_pub": "2026-11-02T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção do próximo filme James Bond está focada no agente 007. No entanto, em 1969, os produtores tiveram que substituir Sean Connery por George Lazenby, um desconhecido, e o resultado foi o melhor filme James Bond segundo cineastas como Christopher Nolan e Steven Soderbergh.", "titulo_pt": "A primeira vez que os produtores tiveram que encontrar um novo James Bond, o resultado foi o melhor filme 007 de todos os tempos", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 241859, "titulo": "Cosmic Leonora Carrington Painting Reemerges at Auction After 70 Years", "url": "https://www.artnews.com/art-news/news/leonora-carrington-painting-reemerges-auction-1234804420/", "fonte_id": "artnews", "data_pub": "2026-11-02T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pintura cosmicamente inspirada de Leonora Carrington será leiloada em Nova York pela Heritage Auctions no dia 10 de novembro, com uma estimativa de valor entre 250.000 e 350.000 dólares.", "titulo_pt": "Pintura cosmicamente inspirada de Leonora Carrington reaparece em leilão após 70 anos", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 241872, "titulo": "‘The Liberation’ Trailer: Carrie Coon Is Lured Into Lily James’ Cult in a Gut-Wrenching Grief Drama", "url": "https://www.indiewire.com/news/trailers/the-liberation-trailer-carrie-coon-1235225057/", "fonte_id": "indiewire", "data_pub": "2026-11-02T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A drama de luto 'A Libertação' estreia nos cinemas no dia 8 de janeiro, distribuído pela Bleecker Street. No filme, Carrie Coon é atraída para uma seita liderada por Lily James em uma história emocionalmente impactante sobre perda e manipulação.", "titulo_pt": "Trailer: carrie Coon é atraida para a seita de Lily James em 'a libertação', novo Drama de luto", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 241506, "titulo": "La conmovedora historia del pintor que aprendió a crear con la mano izquierda tras un ACV: “Primero sentí frustración, pero después comienza la intuición”", "url": "https://www.lanacion.com.ar/sociedad/la-conmovedora-historia-del-pintor-que-aprendio-a-crear-con-la-mano-izquierda-tras-un-acv-primero-nid02112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-02T21:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artista plástico Walter Kerh : "Colossal (arte)", "pais": "EUA", "classe": "B"}, {"id": 241823, "titulo": "10 Art Shows to See in Upstate New York This November", "url": "https://hyperallergic.com/10-art-shows-to-see-in-upstate-new-york-this-november-2026/", "fonte_id": "hyperallergic", "data_pub": "2026-11-02T20:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Exposições de arte em Upstate New York em novembro incluem trabalhos de Julia Whitney Barnes, Emily Nomer e Maria Molteni, cada uma com sua própria abordagem única.", "titulo_pt": "10 Exposições de arte a visitar em Upstate New York em novembro", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 241297, "titulo": "Bota plataforma sai do rock e vira aposta de fãs de k-pop para ver show melhor", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/k-cultura/2026/11/bota-plataforma-sai-do-rock-e-vira-aposta-de-fas-de-k-pop-para-ver-show-melhor.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-02T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As botas plataforma, com salto alto e detalhes metálicos, passaram de serem usadas por fãs de rock, metal e góticos para serem adotadas por fãs de k-pop.", "titulo_pt": "Bota plataforma sai do rock e se torna moda entre fãs de k-pop", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 241861, "titulo": "Remembering Dolores Huerta: Artists Barbara Carrasco, Judith F. Baca, Yreina D. Cervántez, and Vincent Valdez Reflect on the Iconic Activist’s Legacy", "url": "https://www.artnews.com/list/art-news/artists/dolores-huerta-artist-rememberances-1234804398/", "fonte_id": "artnews", "data_pub": "2026-11-02T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Carrasco, Baca, Cervántez e Valdez são artistas que já representaram Dolores Huerta em suas obras.", "titulo_pt": "Lembrando Dolores Huerta: artistas refletem sobre o legado da I y-proyecta-la-apertura-de-tres-hospitales-en-2028/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo planeja investir 645 bilhões de dólares em infraestrutura de saúde para 2027, com 97% dos recursos destinados à conclusão de 130 obras em andamento e o restante para 29 centros de atenção primária e três hospitais oncológicos.", "titulo_pt": "Saúde destina 645 bilhões a infraestrutura para 2027 e projeta abertura de três hospitais em 2028", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 240713, "titulo": "Madre e hija y una mujer de 45 años: quiénes son las tres víctimas de la tragedia en el Cajón del Maipo", "url": "https://www.latercera.com/nacional/noticia/madre-e-hija-y-una-mujer-de-45-anos-quienes-son-las-tres-victimas-de-la-tragedia-en-el-cajon-del-maipo/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três mulheres, incluindo uma de 45 anos e sua mãe, morreram em um acidente no Cajón del Maipo, que começou como um passeio familiar. Além delas, várias pessoas ficaram feridas, entre elas menores de idade.", "titulo_pt": "Mãe, filha e uma mulher de 45 anos: quais são as três vítimas da tragédia no Cajón del Maipo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 240714, "titulo": "Portazo para Cathy Barriga: exalcaldesa fracasa en su intento por excluir del juicio oral a los peritos de Contraloría", "url": "https://www.latercera.com/nacional/noticia/portazo-para-cathy-barriga-exalcaldesa-fracasa-en-su-intento-por-excluir-del-juicio-oral-a-los-peritos-de-contraloria/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A defesa de Cathy Barriga não conseguiu excluir os peritos da Contraloría do processo. A etapa final de preparação para o juízo oral já começou e a ex-candidata a Miss Mekano enfrenta até , {"id": 240755, "titulo": "Reddit and libertarian group challenge Australia’s under-16s social media ban in high court", "url": "https://www.theguardian.com/australia-news/2026/nov/03/australia-social-media-ban-high-court-challenge-reddit-digital-freedom-project", "fonte_id": "guardian_world", "data_pub": "2026-11-02T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reddit e um grupo de liberdade digital, liderado pelo deputado estadual John Ruddick do estado de NSW, estão buscando derrubar a proibição de uso de redes sociais para menores de 16 anos em tribunal de alta instância. Essa é a primeira grande desafio legal contra a lei, que exigiu que 10 plataformas digitais desativassem ou suspendessem contas de usuários menores de 16 anos há quase 11 meses.", "titulo_pt": "Reddit e grupo libertário desafiam proibição de redes sociais para menores de 16 anos na austrália em tribunal", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 240861, "titulo": "Represión policial, discapacidad y Derechos Humanos", "url": "https://www.ciperchile.cl/2026/11/02/represion-policial-discapacidad-y-derechos-humanos/?utm_source=rss&utm_medium=rss&utm_campaign=represion-policial-discapacidad-y-derechos-humanos", "fonte_id": "ciper_chile", "data_pub": "2026-11-02T13:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda a repressão policial em relação às pessoas com deficiência e seus direitos humanos.", "titulo_pt": "Repressão policial, deficiência e direitos Humanos", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 241062, "titulo": "As UN peacekeeping mission in Western Sahara ends, refugees cling to hopes of return", "url": "https://www.scmp.com/news/world/africa/article/3373014/un-peacekeeping-mission-western-sahara-ends-refugees-cling-hopes-return", "fonte_id": "scmp", "data_pub": "2026-11-02T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Binina Mohamed, de 51 anos, vive em um campo de refugiados no sul da Argélia há toda a vida desde que foi forçada a deixar a região do Saara Ocidental, local de um conflito que é frequentemente considerado o mais antigo desafio territorial da África. A missão de paz da ONU no Saara Ocidental chegou ao fim após uma disputa no Conselho de Segurança das Nações Unidas.", "titulo_pt": "Missão de paz da ONU no saara ocidental termina, refugiados seguem com esperança de retorno", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240884, "titulo": "Evacuated Ukrainians from Oleshky: 'We don't know where to go, but one thing is certain: We will survive'", "url": "https://www.lemonde.fr/en/international/article/2026/11/02/evacuated-ukrainians-from-oleshky-we-don-t-know-where-to-go-but-one-thing-is-certain-we-will-survive_6769438_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-02T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante uma cessão de hostilidades de seis dias entre Moscou e Kiev, cerca de 700 pessoas conseguiram deixar Oleshky, uma cidade ocupada por forças russas há quatro anos e localizada nas proximidades das linhas de frente. A população abandonada enfrentava graves escassezes de alimentos e medicamentos.", "titulo_pt": "Ucranianos de Oleshky: 'não sabemos para onde ir, mas uma coisa é certa: vamos sobreviver'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 240294, "titulo": "‘Life on Hold’: Poland’s Immigrants Face Years Waiting for Residence Permits", "url": "https://balkaninsight.com/2026/11/02/life-on-hold-polands-immigrants-face-years-waiting-for-residence-permits/rd/", "fonte_id": "balkan_insight", "data_pub": "2026-11-02T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polônia tem se tornado um país de imigração mais rápido do que suas autoridades conseguem adaptar-se. Estrangeiros que vivem e trabalham no país enfrentam longos períodos de espera por permiss function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
