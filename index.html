<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 16/09/2026 19:15 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "16/09/2026 19:15", "stats": {"noticias_novas": 635, "resumos_gerados": 236}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva sancionou a lei que cria a Política Nacional de Minerais Críticos e Estratégicos, destinando R$ 7 bilhões para estimular a pesquisa, extração e transformação desses recursos. Além disso, o STF realizou uma sessão conturbada um dia após julgar um caso histórico sobre o ministro Alexandre Moraes. Durante a sessão, ministros usaram expressões pejorativas entre si, marcando um julgamento que discutiu o relatório da PF sobre Moraes e elevou o clima de tensão na corte. A campanha de Flávio Bolsonaro registrou um aumento de 8,7 milhões de seguidores nas redes sociais em um ano, enquanto a plataforma 'TemMeuVoto' foi lançada para conectar eleitores a candidatos ao Legislativo com posições similares às suas.", "mundo": "A Reserva Federal dos Estados Unidos aumentou as taxas de juros pela primeira vez em três anos, elevando-as para o intervalo de 3,75% a 4%. Esta decisão, tomada em meio a preocupações econômicas, foi criticada pelo ex-presidente Donald Trump, que pediu que os juros fossem reduzidos rapidamente. Em outro desenvolvimento, a Reserva Federal dos EUA aumentou sua taxa de referência básica em 0,25 pontos percentuais, marcando o primeiro ajuste desde julho de 2023. As relações entre Canadá e Estados Unidos estão se deteriorando, enquanto o Canadá se aproxima da Europa, embora a criação de uma nova parceria entre eles possa ser desafiadora. Além disso, o governo dos EUA acusou o Brasil de falhar no combate ao Comando Vermelho e PCC, enquanto o ex-presidente Trump criticou a decisão da Reserva Federal de aumentar os juros rapidamente. No Equador, o governo declarou estado de emergência em oito províncias devido à violência relacionada ao narcotráfico, mesmo com operações militares e policiais em andamento. Em Israel, Benjamin Netanyahu anunciou projetos de lei para revogar a cidadania de pessoas que 'difamem' o Exército israelense, após o lançamento do documentário 'NAZA', que examina a ofensiva contra a Franja de Gaza. Na Bielorrússia, o governo libertou 25 prisioneiros políticos em troca do alívio das sanções impostas pelos EUA, com mais liberações esperadas devido ao melhoramento das relações entre os dois países.\n\nO Irã e os Estados Unidos enfrentam tensões geopolíticas significativas. O Irã atacou centros de dados da Amazon, causando danos permanentes, enquanto os EUA retiraram a Venezuela da lista de países produtores e tráfegos de drogas. Em outro front geopolítico, a Arábia Saudita enfrenta escassez de interceptores de mísseis e busca ajuda de aliados para fortalecer sua defesa aérea. Israel intensifica sua pressão sobre a Cisjordânia, com relatórios indicando a destruição das condições de vida dos palestinos. O Conselho de Segurança da ONU, sob a liderança de Guterres, enfrenta divisões que impedem ação sobre crises globais, enquanto Kosovo condena a sentença de guerra contra o ex-presidente Hashim Thaçi, gerando protestos em Pristina. Além disso, a Arábia Saudita e os EUA buscam alianças para combater os hutitas no Iêmen, enquanto a Coreia do Norte continua a ser um foco de tensões internacionais, com Trump e Xi esperando poucos avanços na desnuclearização durante a próxima cúpula.", "economia": "O Comitê de Política Monetária (Copom) do Banco Central não deu indicações de novos cortes na taxa Selic, que foi reduzida pela quinta vez consecutiva, atingindo 13,75% ao ano. A decisão foi unânime e conforme as expectativas do mercado. O Federal Reserve dos Estados Unidos aumentou as taxas de juros pela primeira vez em mais de três anos, o que pode afetar o financiamento externo para o governo argentino. No Brasil, o Banco Central regulamentou uma nova subvenção ao diesel, estabelecendo um benefício mínimo de R$ 1 por litro, com potencial de chegar a R$ 2,12. As decisões do Copom e do Fed podem influenciar o mercado de investimentos, mas é importante focar no longo prazo ao planejar a aposentadoria. A Petrobras alcançou a maior margem de lucro entre as grandes petroleiras internacionais no primeiro semestre de 2026, superando empresas como a Saudi Aramco e as americanas ExxonMobil e Chevron.", "tecnologia": "Em uma conferência em São Francisco, Sam Altman, executivo de empresas de tecnologia, expressou preocupações com os avanços da inteligência artificial (IA), sinalizando um debate crescente sobre o controle e supervisão dessas tecnologias emergentes. O governo dos Estados Unidos, liderado pela Casa Branca, se opõe à regulamentação da IA no curto prazo, embora cresçam preocupações sobre modelos de IA que possam se comportar de maneira imprevista. O debate sobre a IA ganhou novo fôlego no Brasil, com o evento do Vale do Silício no país reunindo empresas para discutir temas como IA, inovação e transformação de negócios. Além disso, o Papa Francisco alertou sobre o risco de IA substituir decisões humanas, transferindo o controle para algoritmos e potencialmente tornando as relações mais impessoais.", "ciencia": "A SpaceX anunciou que pretende colocar em órbita seu megafoguete Starship nos próximos dias, um marco importante no desenvolvimento de veículos concebidos para viagens à Lua e Marte. Além disso, a NASA comemorou a restauração completa de sua Estação Remota em Guam após danos causados pelo Super Tufão Mawar. Em pesquisa científica, os cientistas da Penn State desenvolveram um novo método para detectar Pseudomonas syringae, uma bactéria comum que infecta diversos cultivos. Por outro lado, o cientista Julian West do Rice University desenvolveu uma nova técnica para catalisar reações de carbono-carbono. Na área de inteligência artificial, pesquisas indicam que, em alguns casos, o uso de chatbots pode ser mais confortável do que conversar com uma pessoa para discutir sentimentos difíceis. Outros estudos sugerem que a creatina pode ter efeitos positivos na recuperação do sono e na prevenção da depressão, além de seus benefícios conhecidos para a recuperação muscular. A NASA também está monitorando as mudanças sazonais que afetam o centro de massa do planeta Terra, uma informação crucial para navegação por satélite e medições de elevação.", "cultura": "O filme 'Feito Pipa', dirigido por Allan Deberton, foi selecionado para representar o Brasil no Oscar 2027, sendo um importante evento na cultura cinematográfica nacional. Em outro destaque, a exposição de Renoir no National Gallery de Londres bateu um recorde de bilheteria, com mais de 22.000 ingressos vendidos, superando o recorde anterior estabelecido pela exposição de Van Gogh. No âmbito da música, a série 'Monstro: A História de Lizzie Borden' estreia na quinta-feira, com Ella Beatty interpretando a acusada de matar o pai e a madrasta com machados durante a era vitoriana. A produção é de Ryan Murphy e Ian Brennan. Além disso, a Ópera 'Don Carlo', de Giuseppe Verdi, retorna ao Theatro Municipal após uma ausência de 21 anos, explorando os conflitos políticos por trás de seu lirismo. A Globo planeja homenagear Alceu Valença no Prêmio Multishow em dezembro, com apresentação por Tadeu Schmidt e Kenya Sade.", "sociedade": "Um agropecuarista foi julgado por um acidente de trânsito que resultou na morte de uma família inteira em fevereiro de 2022, na rodovia 29, próximo a General Belgrano. O julgamento recente teve início recentemente. O Brasil supera países europeus em termos de mulheres na liderança, com 32,2% de mulheres ocupando posições de liderança, conforme um estudo do LinkedIn. A falta de circulação de informações afeta principalmente a população que utiliza o SUS, com mais de 75% da população brasileira utilizando o sistema. Além disso, a PAHO participou da 79ª Assembleia Geral das Nações Unidas, contribuindo para os esforços globais na prevenção, preparação e resposta a pandemias.", "meio_ambiente": "Um desabamento em uma mina de ouro no Sudão resultou em mais de 80 mortes, destacando os perigos associados à exploração mineral. Em seguida, o verão de 2026 foi o mais quente da França desde 1900, com o número de mortes atribuídas ao calor ainda em aumento. O Google realizou a maior compra de remoção de carbono da sua história, em parceria com a Terradot, para combater as emissões de carbono. No Nordeste, a Riachuelo inaugurou o primeiro hub de reciclagem têxtil em escala industrial, transformando 181 toneladas de algodão em fios novos. Além disso, a geração de energia solar e eólica sofreu cortes superiores a 60% nos últimos cinco meses, prejudicando a produção renovável. O governo Lula está prestes a criar uma regra nacional que permitirá a realização de atividades de pesquisa de mineração sem a necessidade de licença ambiental, visando acelerar a busca por minerais críticos. Finalmente, a qualidade da água do maior lago da América do Sul, o Lago Maracaibo, tem piorado drasticamente devido à poluição por óleo, ameaçando a subsistência de 20.000 pescadores da região.", "direitos_humanos": "Em Gaza, um edifício residencial desabou após danos causados por ataques israelenses anteriores, resultando em pelo menos 21 mortos, incluindo 11 crianças, e várias pessoas desaparecidas. O primeiro-ministro francês, Sébastien Lecornu, anunciou um 'plano plurianual' de recursos para combater a violência de gênero e sexual, mas não detalhou os fundos a serem alocados. Além disso, a Turquia realizou uma ampla repressão contra grupos LGBTQ+ sob o pretexto de 'segurança familiar', afetando jornalistas independentes e organizações de direitos humanos. Organizações de direitos humanos pediram a prisão de 87 oficiais iranianos por 'crimes contra a humanidade' em relação à repressão durante os protestos de 2022. No Brasil, o país manteve a 72ª posição no ranking global de igualdade de gênero, com uma pequena queda de 0,4 ponto percentual em comparação com o ano anterior. Na África do Sul, sete mulheres foram encontradas mortas nas proximidades do aeroporto internacional de Joanesburgo, gerando medo, tristeza e raiva em relação à falta de progresso no combate ao feminicídio. Por fim, no Kosovo, Hashim Thaçi, ex-presidente do país, foi condenado a 25 anos de prisão por crimes de guerra em uma corte na Haia."}, "resumo_do_dia": {"politica_nacional": [{"id": 166883, "titulo": "Política nacional vai estimular pesquisa de minerais críticos no país", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/politica-nacional-vai-estimular-pesquisa-de-minerais-criticos-no-pais", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-16T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou a lei que cria a Política Nacional de Minerais Críticos e Estratégicos, prevendo investimentos de até R$ 7 bilhões para estimular a pesquisa, extração e transformação desses minerais. A lei visa incentivar projetos de processamento e transformação de minerais críticos e estratégicos no país.", "titulo_pt": "Política nacional vai estimular pesquisa de minerais críticos no país", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 166836, "titulo": "Campanha de Flávio aponta ganho de 8,7 milhões de seguidores nas redes em 1 ano", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/campanha-de-flavio-aponta-ganho-de-87-milhoes-de-seguidores-nas-redes-em-1-ano.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro registrou um aumento de 8,7 milhões de seguidores nas redes sociais entre outubro de 2025 e setembro de 2026, conforme dados divulgados pela plataforma Fanpage Karma.", "titulo_pt": "Campanha de Flávio registra ganho de 8,7 milhões de seguidores nas redes em 1 ano", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 166837, "titulo": "Deputado americano cita Moraes e pede ação da OEA sobre liberdade de expressão no Brasil", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/deputado-americano-cita-moraes-e-pede-acao-da-oea-sobre-liberdade-de-expressao-no-brasil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado republicano Chris Smith, de Nova Jersey, pediu à Comissão Interamericana de Direitos Humanos que manifeste-se sobre a liberdade de expressão no Brasil e que intensifique o monitoramento do país antes das eleições presidenciais.", "titulo_pt": "Deputado americano pede ação da OEA sobre liberdade de expressão no Brasil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 166889, "titulo": "Justiça Eleitoral barra candidatura de Cristiane Brasil, filha de Roberto Jefferson", "url": "https://veja.abril.com.br/politica/justica-eleitoral-barra-candidatura-de-cristiane-brasil-filha-de-roberto-jefferson/", "fonte_id": "veja", "data_pub": "2026-09-16T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Eleitoral barrou a candidatura de Cristiane Brasil, filha de Roberto Jefferson, para as eleições. O TRE considera-a suspeita de envolvimento com uma organização criminosa armada. Cristiane nega as acusações.", "titulo_pt": "Justiça Eleitoral nega candidatura de Cristiane Brasil, filha de Roberto Jefferson", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 166838, "titulo": "Suplente do PT ao Senado leva tiros de borracha durante ação da Polícia Militar em Santa Catarina", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/suplente-do-pt-ao-senado-leva-tiros-de-borracha-durante-acao-da-policia-militar-em-santa-catarina.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma suplente ao Senado pelo PT em Santa Catarina foi atingida por tiros de borracha durante um confronto com a Polícia Militar em Jaraguá do Sul na noite de sábado (12).", "titulo_pt": "Suplente do PT ao Senado é atingida por tiros de borracha em jaraguá do sul", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 166992, "titulo": "Após bloqueios de rodovias em 2022, PRF define regras para eleições 2026", "url": "https://www.cnnbrasil.com.br/eleicoes/apos-bloqueios-de-rodovias-em-2022-prf-define-regras-para-eleicoes-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A PRF estabeleceu regras para o policiamento e fiscalização durante as eleições de 2026, proibindo ações que possam obstruir o trânsito de eleitores. Eventuais bloqueios ou interdições de rodovias devem ser comunicados com antecedência ao TRE e indicar rotas alternativas.", "titulo_pt": "PRF define regras para policiamento nas eleições 2026", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166865, "titulo": "STF se reúne um dia após julgamento sobre Moraes", "url": "https://g1.globo.com/politica/ao-vivo/stf-sessao-apos-julgamento-sobre-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF (Supremo Tribunal Federal) realizou uma sessão um dia após julgar um caso histórico sobre o ministro Alexandre Moraes. Na pauta de hoje, o tribunal discute o alcance da imunidade do ITBI no caso de integralização de capital social de uma imobiliária.", "titulo_pt": "STF se reúne um dia após julgamento sobre Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 167265, "titulo": "Quem são os candidatos a deputado federal por Tocantins (TO) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-deputado-federal-por-tocantins-to-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-09-16T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mais de um milhão de eleitores do Tocantins irão eleger 8 deputados federais. Os candidatos a essas vagas ainda não foram nomeados nesta notícia.", "titulo_pt": "Quem são os candidatos a deputado federal por Tocantins (TO) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 166855, "titulo": "Lula sanciona lei dos minerais críticos com R$ 5 bi em subsídios e poder de decidir sobre estrangeiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/09/lula-sanciona-lei-dos-minerais-criticos-com-r-5-bi-em-subsidios-e-poder-de-decidir-sobre-estrangeiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou a lei dos minerais críticos e estratégicos, destinando R$ 5 bilhões em subsídios e concedendo poder de decisão sobre estrangeiros. A medida visa contrabalançar a presença de empresas internacionais em minas brasileiras.", "titulo_pt": "Lula sanciona lei dos minerais críticos com R$ 5 bi em subsídios e poder de decidir sobre estrangeiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166839, "titulo": "Ratinho Jr tira licença para ajudar aliado, sobe o tom contra Moro e acena a Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ratinho-jr-tira-licenca-para-ajudar-aliado-sobe-o-tom-contra-moro-e-acena-a-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Ratinho Junior anunciou que se licenciará do cargo a partir desta quinta-feira para ajudar um aliado. Durante esse período, ele intensificará as críticas a Sergio Moro e mostrará apoio a Jair Bolsonaro, que está em prisão domiciliar.", "titulo_pt": "Ratinho Jr. Tira licença para auxiliar aliado, aumenta ataques a Moro e apoia Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 166840, "titulo": "Campanha de Flávio vai aumentar ataques a Dino e equipará-los às críticas feitas a Moraes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/campanha-de-flavio-vai-aumentar-ataques-a-dino-e-equiparar-as-criticas-feitas-a-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após o julgamento no STF, Flávio Bolsonaro intensificará as críticas a Flávio Dino, equipará-las às já feitas a Alexandre de Moraes. A campanha do senador aumentará o volume das críticas contra o governador maranhense.", "titulo_pt": "Campanha de Flávio bolsonaro vai aumentar ataques a Flávio Dino e equipará-los às críticas feitas a Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 166841, "titulo": "Entenda por que Moraes e Mendonça votaram sobre investigação, mas Nunes Marques e Toffoli não", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/entenda-por-que-moraes-e-mendonca-votaram-sobre-investigacao-mas-nunes-marques-e-toffoli-nao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sessão do STF sobre o ministro Alexandre de Moraes encerrou com uma votação para tratar a questão em conjunto com o procedimento de que André Mendonça é alvo. Nunes Marques e Toffoli não participaram da votação.", "titulo_pt": "Entenda por que Moraes e Mendonça tiveram votação, mas não houve para Nunes Marques e Toffoli", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 166825, "titulo": "Divergências do programa de governo de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/marcelo-rubens-paiva/2026/09/divergencias-do-programa-de-governo-de-flavio-bolsonaro.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-16T20:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca divergências no programa de governo de Flávio Bolsonaro. Uma ativista antivacina, que apoiava Eduardo Bolsonaro, criticava a vacinação contra o sarampo durante um evento no 7 de Setembro em São Paulo.", "titulo_pt": "Divergências no programa de governo de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 166866, "titulo": "Ipsos-Ipec: 43% avaliam governo Lula como ruim ou péssimo, 33% como ótimo ou bom e 23% como regular", "url": "https://g1.globo.com/politica/noticia/2026/09/16/ipsos-ipec-avaliacao-governo-lula-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Ipsos-Ipec divulgada em 16 de setembro de 2026 mostrou que 43% dos brasileiros avaliam o governo Lula como ruim ou péssimo, enquanto 33% consideram a gestão ótima ou boa. O índice de avaliações negativas é o mais alto desde junho de 2025.", "titulo_pt": "43% Avaliam governo Lula como ruim ou péssimo, 33% como ótimo ou bom e 23% como regular", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 167267, "titulo": "Julgamento sobre regras para ingresso de médico em cooperativa está empatado", "url": "https://www.jota.info/saude/julgamento-sobre-regras-para-ingresso-de-medico-em-cooperativa-esta-empatado", "fonte_id": "jota", "data_pub": "2026-09-16T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento sobre as regras para o ingresso de um médico em uma cooperativa está empatado. O profissional não atendeu à exigência do regimento em relação ao certificado da AMB, embora tenha apresentado certificados de residência médica.", "titulo_pt": "Julgamento sobre regras para ingresso de médico em cooperativa está empatado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 167268, "titulo": "O caminho para Flávio tirar Bolsonaro da prisão começou com o julgamento do STF", "url": "https://www.jota.info/eleicoes/eleicoes-2026/o-caminho-para-flavio-tirar-bolsonaro-da-prisao-comecou-com-o-julgamento-do-stf", "fonte_id": "jota", "data_pub": "2026-09-16T20:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Suspeitas sobre o juiz Moro ampliaram a esperança de uma possível revisão das condenações de Flávio Bolsonaro. A anistia será priorizada se o senador for eleito.", "titulo_pt": "Caminho para Flávio tirar Bolsonaro da prisão começou com julgamento do STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 166503, "titulo": "Ukrainian NGO official urges support for Taiwan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/17/2003864414", "fonte_id": "taipei_times", "data_pub": "2026-09-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma oficial de uma organização não-governamental ucraniana está pedindo apoio para Taiwan. O pedido visa aumentar a conscientização e o apoio internacional para Taiwan.", "titulo_pt": "Oficial de ong ucraniana solicita apoio para Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 166504, "titulo": "DPP’s Puma Shen proposes Taipei commuting policies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/17/2003864415", "fonte_id": "taipei_times", "data_pub": "2026-09-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Puma Shen, do Partido Democrático Progressista (DPP), propôs políticas de transporte público para Taipei. As medidas visam melhorar o sistema de transporte da cidade.", "titulo_pt": "Puma Shen propõe políticas de transporte para Taipei", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 167199, "titulo": "Australian politics live: Labor to reveal new immigration rules; PM hails narrowing of gender gap", "url": "https://www.theguardian.com/australia-news/live/2026/sep/17/labor-immigration-policy-tony-burke-anthony-albanese-one-nation-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-16T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido laborista australiano planeja anunciar novas regras de imigração. A ministra Tanya Plibersek expressou preocupação sobre supostas ações intimidadoras de membros da Igreja Brethren durante a campanha eleitoral.", "titulo_pt": "Política australiana em tempo real: partido laborista anunciará novas regras de imigração; plibersek se preocupa com supostas ações intimidadoras de membros da igreja brethren", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 167337, "titulo": "US troops must prepare to fight around the moon, Trump’s top military adviser says", "url": "https://www.scmp.com/news/world/united-states-canada/article/3367778/us-troops-must-prepare-fight-around-moon-trumps-top-military-adviser-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-16T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselheiro-chefe das Forças Armadas dos EUA, General Dan Caine, afirmou que tropas americanas devem se preparar para combater não apenas na órbita terrestre, mas também ao redor da lua. Esta declaração foi feita em uma conferência onde os EUA revelaram pela primeira vez que têm armas em operação no espaço.", "titulo_pt": "Soldados americanos devem se preparar para combater ao redor da lua, diz conselheiro militar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 167195, "titulo": "Fiji Declares a National Emergency as H.I.V. Cases Skyrocket", "url": "https://www.nytimes.com/2026/09/16/world/asia/fiji-hiv-national-emergency.html", "fonte_id": "nyt_world", "data_pub": "2026-09-16T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fiji declarou uma emergência nacional devido ao aumento explosivo de casos de HIV no país. A taxa estimada é de um em cada 60 adultos infectados com o vírus.", "titulo_pt": "Fiji declara emergência nacional diante do aumento explosivo de casos de hiv", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 167197, "titulo": "Why Israel Wants More One-Ton Bombs From the U.S.", "url": "https://www.nytimes.com/2026/09/16/world/middleeast/israel-one-ton-bombs-us.html", "fonte_id": "nyt_world", "data_pub": "2026-09-16T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump planeja fornecer 60,000 bombas poderosas de um tonelada para Israel, em um momento em que há crescente oposição nos EUA a vendas de armas para o país.", "titulo_pt": "Por que Israel quer mais bombas de um tonelada dos EUA", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 167253, "titulo": "As far-right gains ground, EU Commission president pledges a Europe that protects", "url": "https://www.lemonde.fr/en/international/article/2026/09/16/as-far-right-gains-ground-eu-commission-president-pledges-a-europe-that-protects_6757608_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ursula von der Leyen prometeu uma Europa que protege, enfatizando a necessidade de uma resposta coletiva a desafios climáticos, riscos relacionados à inteligência artificial, defesa e exportações chinesas.", "titulo_pt": "A direita extremista ganha força, presidente da comissão europeia promete uma Europa que protege", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 166831, "titulo": "Lula deve defender não interferência estrangeira em seu último discurso do mandato na ONU", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/lula-deve-defender-nao-interferencia-estrangeira-em-seu-ultimo-discurso-do-mandato-na-onu.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-16T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula deve abordar a não interferência estrangeira em assuntos internos durante seu discurso na Assembleia-Geral das Nações Unidas, antes do primeiro turno das eleições.", "titulo_pt": "Lula deve defender não interferência estrangeira em seu último discurso do mandato na ONU", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 167252, "titulo": "Watch: Leaked photos reveal extensive damage at US bases in Gulf", "url": "https://www.bbc.co.uk/news/videos/c9dr7e1lr265o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-16T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens vazadas por militares ativos mostram danos significativos em bases americanas no Golfo Pérsico, incluindo um radar derrubado, trailers achatados e edifícios severamente danificados como resultado de ataques iranianos.", "titulo_pt": "Veja: fotos vazadas revelam extensos danos em bases americanas no golfo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 167329, "titulo": "Cuba, 'pronti degli esperti per aiutare l'Iran a riparare i danni di guerra'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/16/cuba-pronti-degli-esperti-per-aiutare-liran-a-riparare-i-danni-di-guerra_1d6f50dc-d625-448b-94eb-94c632ef67d1.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-16T21:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Cuba oferece especialistas para ajudar a reparar estruturas sanitárias danificadas pelos bombardeios no Irã. A oferta de assistência técnica foi feita por autoridades cubanas.", "titulo_pt": "Cuba oferece especialistas para reparar danos sanitários no Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 167196, "titulo": "U.S. Intelligence Warns of China Theft Over Sale of F-35 Jets to Saudis", "url": "https://www.nytimes.com/2026/09/16/us/politics/us-intelligence-china-f35-jets-saudis.html", "fonte_id": "nyt_world", "data_pub": "2026-09-16T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatórios internos, incluindo um do Instituto de Inteligência Militar do Pentágono, sugerem que a China poderia obter tecnologia de aviões americanos através de espionagem ou cooperação com o Reino Arábico Saudita.", "titulo_pt": "Inteligência dos EUA avisa sobre risco chinês de roubo de tecnologia de caças F-35 vendidos aos sauditas", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 167230, "titulo": "You'd expect homeowners to save their stuff. Federal policy pays them to leave it", "url": "https://www.npr.org/2026/09/16/g-s1-143708/video-houses-collapse-north-carolina-ocean", "fonte_id": "npr_news", "data_pub": "2026-09-16T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NPR investigou o mundo inverso da seguradora de catástrofes FEMA em áreas costeiras e descobriu que muitos proprietários de imóveis não têm escolha fina afac0e-e16f-421c-950c-c8067a9b86c9.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-16T21:13:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O governo da Bolívia está considerando implementar um estado de assédio devido a bloqueios e quatro mortes. A segurança foi reforçada na fronteira com o Brasil, com o deslocamento de militares e drones.", "titulo_pt": "Governo da bolívia avalia estado de assédio após bloqueios e quatro mortes", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 167231, "titulo": "House holds billionaire Leon Black in contempt of Congress", "url": "https://www.npr.org/2026/09/16/nx-s1-5954258/house-holds-billionaire-leon-black-in-contempt-of-congress", "fonte_id": "npr_news", "data_pub": "2026-09-16T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso dos Estados Unidos declarou o bilionário Leon Black em desobediência ao Congresso após ele recusar-se a fornecer informações adicionais sobre sua relação com o condenado por abuso sexual Jeffrey Epstein.", "titulo_pt": "Câmara declara bilionário Leon Black em desobediência ao congresso", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 166942, "titulo": "Copom não dá pistas sobre novo corte de juros, após 5ª redução da Selic", "url": "https://www.metropoles.com/brasil/economia-br/copom-nao-da-pistas-sobre-novo-corte-de-juros-apos-5a-reducao-da-selic", "fonte_id": "metropoles", "data_pub": "2026-09-16T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê de Política Monetária (Copom) do Banco Central não deu pistas sobre a possibilidade de novos cortes na taxa Selic, após cinco reduções consecutivas. A incerteza do cenário econômico atual é apontada como motivo para o mistério sobre a sequência da política monetária.", "titulo_pt": "Copom não dá pistas sobre novo corte de juros, após 5ª redução da Selic", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 166852, "titulo": "Minoritários da MBRF contestam uso de jato da empresa por controlador; empresa diz que operação é legal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/minoritarios-da-mbrf-contestam-uso-de-jato-da-empresa-por-controlador-empresa-diz-que-operacao-e-legal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Acionistas minoritários da MBRF expressam preocupação com o uso de um jato executivo da empresa pelo controlador e presidente do conselho de administração para viagens pessoais. A empresa afirma que a operação é legal.", "titulo_pt": "Minoritários da MBRF contestam uso de jato da empresa por controlador; empresa diz que operação é legal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167024, "titulo": "Fed aumenta juros nos EUA pela primeira vez em mais de 3 anos", "url": "https://www.cartacapital.com.br/mundo/fed-aumenta-juros-nos-eua-pela-primeira-vez-em-mais-de-3-anos/", "fonte_id": "cartacapital", "data_pub": "2026-09-16T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Federal Reserve aumentou as taxas de juros de referência nos Estados Unidos pela primeira vez em mais de três anos. Essa decisão indica um retorno às políticas monetárias mais apertadas após um período de baixas taxas de juros.", "titulo_pt": "Fed aumenta juros nos EUA pela primeira vez em mais de 3 anos", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 166884, "titulo": "BC reduz juros básicos para 13,75% ao ano", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/bc-reduz-juros-basicos-para-1375-ao-ano", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-16T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central reduziu a Taxa Selic em 0,25 ponto percentual, para 13,75% ao ano, pela quinta vez consecutiva. A decisão foi tomada pelo Comitê de Política Monetária por unanimidade, conforme esperado pelo mercado financeiro.", "titulo_pt": "BC reduz juros básicos para 13,75% ao ano", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 166950, "titulo": "Governo regulamenta nova subvenção ao diesel e amplia subsídio", "url": "https://www.metropoles.com/brasil/governo-regulamenta-nova-subvencao-ao-diesel-e-amplia-subsidio", "fonte_id": "metropoles", "data_pub": "2026-09-16T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo regulamentou uma nova subvenção ao diesel que estabelece um benefício mínimo de R$ 1 por litro e prevê um aumento até R$ 2,12, em resposta à elevação internacional do preço do petróleo.", "titulo_pt": "Governo regulamenta nova subvenção ao diesel e amplia subsídio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 167115, "titulo": "Cambia el viento: por qué la decisión de la FED podría complicar a la Argentina", "url": "https://www.lanacion.com.ar/economia/cambia-el-viento-por-que-la-decision-de-la-fed-podria-complicar-a-la-argentina-nid16092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-16T21:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Reserva Federal dos Estados Unidos aumentou as taxas de juros pela primeira vez desde julho de 2023, o que pode tornar mais caro o financiamento externo para o governo argentino.", "titulo_pt": "Mudança de vento: por que a decisão da FED poderia complicar a Argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 166853, "titulo": "Selic em 13,75% mantém pós-fixados atrativos, mas abre espaço para prefixados e IPCA+", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/selic-em-1375-mantem-pos-fixados-atrativos-mas-abre-espaco-para-prefixados-e-ipca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa Selic foi reduzida para 13,75% ao ano após a decisão do Banco Central nesta quarta-feira (16), mantendo as taxas de juros elevadas e preservando a atratividade da renda fixa para investidores que buscam rentabilidade com menor risco.", "titulo_pt": "Selic em 13,75% mantém pós-fixados atrativos, mas abre espaço para prefixados e IPCA+", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166854, "titulo": "Banco Central reduz Selic a 13,75% ao ano antes das eleições e deixa passos futuros em aberto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/banco-central-repete-corte-de-025-ponto-e-reduz-selic-a-1375-ao-ano-antes-das-eleicoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê de Política Monetária decidiu reduzir a taxa Selic pela quinta vez consecutiva, atingindo 13,75% ao ano, na última reunião antes das eleições presidenciais. Os passos futuros para a taxa não foram definidos.", "titulo_pt": "Bc reduz Selic a 13,75% ao ano antes das eleições e deixa passos futuros em aberto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166957, "titulo": "Copom reduz taxa Selic e juros caem para 13,75% ao ano", "url": "https://www.metropoles.com/brasil/copom-reduz-taxa-selic-e-juros-caem-para-1375-ao-ano", "fonte_id": "metropoles", "data_pub": "2026-09-16T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê de Política Monetária (Copom) reduziu a taxa Selic para 13,75% ao ano. A decisão, que foi unânime, foi anunciada nesta quarta-feira (16/9) e foi esperada pelo mercado financeiro.", "titulo_pt": "Copom reduz taxa Selic e juros caem para 13,75% ao ano", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 166980, "titulo": "Selic a 13,75%: Quanto rendem R$ 1 mil na poupança, CDB ou Tesouro Direto?", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/meu-dinheiro/selic-a-1375-quanto-rendem-r-1-mil-na-poupanca-cdb-ou-tesouro-direto/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na renda fixa, os CDBs de bancos médios continuam sendo as melhores opções de investimento. Fundos de ações do Ibovespa se destacam entre todos os rendimentos.", "titulo_pt": "Selic a 13,75%: quanto rendem R$ 1 mil na poupança, CDB ou Tesouro Direto?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166981, "titulo": "BC corta juros em 0,25 ponto pela 5ª vez seguida e Selic recua a 13,75%", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bc-copom-selic-juros-setembro-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Banco Central (BC) cortou os juros básicos do país em 0,25 ponto percentual pela quinta vez consecutiva, reduzindo a Selic para 13,75%. A decisão foi unânime e conforme as expectativas do mercado, considerando sinais de redução da inflação e desaceleração da atividade econômica.", "titulo_pt": "BC corta juros em 0,25 ponto pela 5ª vez seguida e Selic recua a 13,75%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166856, "titulo": "Quanto as decisões do Copom e do Fed de hoje afetam sua aposentadoria daqui a 30 anos?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/09/quanto-as-decisoes-do-copom-e-do-fed-de-hoje-afetam-sua-aposentadoria-daqui-a-30-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As decisões do Copom e do Fed podem influenciar o mercado de investimentos, mas é importante focar no longo prazo ao planejar aposentadoria. É recomendável considerar as tendências a longo prazo, não apenas as previsões a curto prazo.", "titulo_pt": "Como as decisões do Copom e do Fed afetam sua aposentadoria daqui a 30 anos?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167318, "titulo": "Fed defies Trump with first rate rise since 2023", "url": "https://www.ft.com/content/f5ce5c38-76e3-4212-8c60-4c868f6dee70?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-16T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Reserva Federal dos EUA elevou as taxas de juros pela primeira vez desde 2023, contrariando as expectativas do presidente Joe Biden. O presidente da Fed, Kevin Warsh, alertou que a inflação está muito alta e há muito tempo.", "titulo_pt": "Fed contraria Trump com primeira elevação de taxas desde 2023", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 167408, "titulo": "(3rd LD) Fed raises key interest rate by quarter point in 1st hike since 2023", "url": "https://en.yna.co.kr/view/AEN20260917000353315", "fonte_id": "yonhap_news", "data_pub": "2026-09-16T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Reserva Federal dos Estados Unidos aumentou a taxa básica de juros pela primeira vez desde 2023, elevando-a em 0,25 pontos percentuais.", "titulo_pt": "3º LD: Fed aumenta taxa básica de juros pela primeira vez desde 2023", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 167047, "titulo": "Wall Street cai após Fed elevar juros e sinalizar mais aperto monetário pela frente", "url": "https://www.infomoney.com.br/mercados/wall-street-cai-apos-fed-elevar-juros-e-sinalizar-mais-aperto-monetario-pela-frente/", "fonte_id": "infomoney", "data_pub": "2026-09-16T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Wall Street caiu após o Fed elevar os juros e sinalizar a possibilidade de mais apertos monetários no
