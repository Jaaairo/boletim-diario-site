<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

e tropas americanas no Oriente Médio, conforme informaram oficiais da Central Command. O Irã, por sua vez, respondeu com ataques contra forças americanas em Jordânia, de acordo com relatos de mídia iraniana. O Irã também alegou que vários membros das forças armadas americanas morreram durante uma operação em Jordânia. Em outras notícias, a Assembleia Nacional da Venezuela aprovou um acordo que concede poderes aos Estados Unidos sobre o petróleo do país, enquanto o Congresso dos Estados Unidos vai votar sobre uma resolução que condena o socialismo antes das eleições de novembro. O acordo inusitado entre o Pentágono e um empresário venezuelano está reconfigurando a exploração de petróleo na Venezuela, enquanto o governo dos Estados Unidos defende o acordo como uma maneira de expulsar rivais chineses e russos dos campos de petróleo na América do Sul.\n\nOs Estados Unidos intensificaram suas operações militares contra o Irã, realizando novos ataques após ataques iranianos a navios e a pessoal militar dos EUA no Estreito de Ormuz. As hostilidades retomaram após ataques russos deliberados ao sistema ferroviário ucraniano, resultando em pelo menos 12 mortes e 12 feridos. O Irã prometeu responder a novas agressões dos EUA, com severas punições aguardando os agressores. Além disso, a China desviou o consenso em relação ao comunicado após a reunião do G20, onde se opôs a uma linguagem que exigia a eliminação de políticas 'não de mercado' para reduzir déficits comerciais. A Alemanha acusou a Rússia de estar por trás de um 'atentado híbrido' no Aeroporto de Leipzig, após a descoberta de dois dronês explosivos, e reagiu com sanções contra Moscou. A Agência Internacional de Energia Atômica (IAEA) alertou sobre a falta de acesso às instalações iranianas para verificar o material nuclear, o que é uma preocupação relacionada à proliferação nuclear.", "economia": "O PIB brasileiro cresceu 0,5% no segundo trimestre de 2026, ficando em quinto lugar entre as maiores altas, superando economias como Estados Unidos e China, conforme informado pela agência Austin Rating com base em dados do FMI. A reforma tributária prevista para 2027 está projetada para aumentar a arrecadação do governo em 19%, enquanto o Orçamento de 2027 prevê investimentos de R$ 133,8 bilhões, um aumento em relação aos R$ 110,8 bilhões do Orçamento de 2026. O Ibovespa subiu 1,30% com o petróleo e a Petrobras em alta, enquanto o dólar caiu. Além disso, o desemprego no Brasil atingiu o menor nível da série histórica, mas o mercado de trabalho ainda enfrenta desafios relacionados à informalidade, subutilização e falta de proteção para os trabalhadores.", "tecnologia": "O Congresso dos Estados Unidos aprovou um novo projeto de lei para fortalecer a liderança americana em inteligência artificial de código aberto, em resposta à dominância chinesa nessa área. A OpenAI está prestes a lançar seu primeiro modelo de IA com habilidades 'críticas' em segurança cibernética, enquanto a Google atualizou o Android para melhorar a acessibilidade e reduzir o enjôo de movimento. Apple planeja um evento de lançamento do iPhone para a próxima semana, onde deve apresentar o primeiro iPhone dobrável, com o CEO Tim Cook no comando da empresa. A Anthropic lançou a versão 5.1 do Fable, visando reduzir os custos de tokens e as restrições de falsos-positivos nas medidas de segurança do modelo. Além disso, a Google lançará o Find Hub com novas funcionalidades para dispositivos Android, incluindo o Motion Assist, que visa reduzir a sensação de mal-estar ao mover pontos na tela em resposta às movimentações do veículo. A construção de data centers para inteligência artificial subiu significativamente em julho, atingindo uma taxa anualizada de quase 60%.", "ciencia": "A NASA contratou a Blue Origin para desenvolver uma rede de telecomunicações para Marte, um sistema avançado que permitirá comunicações confiáveis e de alta banda de frequência para missões atuais e futuras. Este contrato, de valor fixo, pode valer até aproximadamente US$ 700 milhões e envolve o fornecimento de um satélite de telecomunicações para Marte. Paralelamente, a Missão Fermi Explorer planeja lançar um pequeno e econômico foguete para Alpha Centauri nos próximos anos, com o objetivo de inspirar uma exploração mais profunda e ajudar a humanidade a refletir sobre seu lugar no universo. Em um desenvolvimento científico, a plataforma baseada em inteligência artificial chamada AdaptiveFlow, desenvolvida e validada por instituições renomadas, redefine a computação em nuvem para a descoberta de medicamentos. Essa plataforma permite o screening virtual de bilhões de moléculas semelhantes a medicamentos com uma redução de 1.000 vezes nos custos computacionais em comparação com métodos existentes. Além disso, o Congresso aprovou uma lei temporária que pausa as mudanças no processo de atribuição de bolsas de pesquisa federal, pausando as mudanças propostas que teriam transferido o controle do financiamento científico para burocratas nomeados, amplamente criticadas pela comunidade científica.", "cultura": "O Festival de Cinema de Valdivia 2026, que acontecerá de 12 a 18 de outubro, apresentará filmes de diretores chilenos renomados, como Valeria Sarmiento, Sergio Castro San Martín, Cristián Sánchez, Cristóbal Valenzuela Berríos e Alba Gaviraghi. A 17ª edição do CineFantasy, que estreará em São Paulo de 1º a 6 de setembro, homenageará a atriz Liz Marins, conhecida por ter criado a personagem Liz Vamp. Em Los Angeles, a exposição 'Hujar: Contact', que oferece uma visão inédita da fotografia nova-iorquina de Peter Hujar, permanecerá aberta até 25 de outubro. A Galeria de Arte de Ontário, sob a liderança de Stephan Jost, encerrará sua gestão após dez anos, enfrentando controvérsias durante seu mandato. Além disso, o Festival de Veneza, em sua 83ª edição, ocorre em um momento de conflitos políticos, com temas como a guerra em Gaza sendo abordados nas exibições.", "sociedade": "O Ministério Público do Rio de Janeiro (MPRJ) está investigando um esquema conhecido como 'Máfia das cantinas', que teria fraudado licitações em presídios do estado, causando um prejuízo superior a R$ 25 milhões aos cofres públicos. Paralelamente, um casal foi expulso de um clube em Belo Horizonte, mas perdeu na Justiça ao tentar anular a decisão. O seguro rural receberá R$ 1,2 bilhão no orçamento, mas 73,5% dos recursos estão condicionados, gerando preocupações no setor devido à falta de previsibilidade. Em São Paulo, foram nomeados 1.411 aprovados em um concurso de 2023 para a Polícia Civil, que passarão por uma formação de cinco meses antes de se integrarem às delegacias da capital e do interior.", "meio_ambiente": "Um desastre climático no Himalaia, que começou com o colapso de um glaciar em 26 de agosto, resultou em mais de mil mortes e cerca de 4 mil desaparecidos em Nepal e China, conforme informaram as autoridades. Este incidente, que levou a fortes inundações, destaca o agravamento da crise climática global. Paralelamente, o Reino Unido registrou seu verão mais quente desde o início dos registros meteorológicos, com uma temperatura média de 16,5 graus Celsius. O metano, segundo especialistas, é um gás de efeito estufa poderoso e o segundo maior contribuinte para o aquecimento global, sublinhando a urgência de medidas rigorosas para seu controle. Na região de Tibet, moradores e resgatistas observaram um minuto de silêncio em memória das vítimas, enquanto Nepal e China enfrentam a maior crise de inundações em décadas, com milhares de vidas em risco.", "direitos_humanos": "A Organização Mundial da Saúde (OMS) expressou preocupações sobre a contaminação da água na Faixa de Gaza, com a qualidade deteriorada e o risco de doenças aumentando, conforme relatado pela Middle East Eye. A OMS também destacou a situação dos amputados e a deterioração da água na região, que afeta mais de dois terços das crianças na África Oriental e do Sul. A entidade alertou para a necessidade de ação urgente, conforme informado pelo UNICEF. Durante a segunda sessão regular do Conselho Executivo do UNICEF em 2026, a diretora-executiva Catherine Russell fez as observações de abertura, reiterando o compromisso da organização com a proteção das crianças."}, "resumo_do_dia": {"politica_nacional": [{"id": 138858, "titulo": "PLP à espera de sanção vincula administrações a repetitivos e repercussões gerais", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-barbara-mengardo/plp-a-espera-de-sancao-vincula-administracoes-a-repetitivos-e-repercussoes-gerais", "fonte_id": "jota", "data_pub": "2026-09-01T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PLP 124/2022, que vincula administrações a repetitivos e repercussões gerais, é esperado para ser sancionado. Contribuintes esperam ganho de segurança jurídica, enquanto fiscos temem a quebra da paridade de armas.", "titulo_pt": "PLP à espera de sanção vincula administrações a repetitivos e repercussões gerais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 138702, "titulo": "Ajustes no texto adiam votação da MP da \"taxa das blusinhas\"", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/ajustes-no-texto-adiam-votacao-da-mp-da-taxa-das-blusinhas", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-01T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comissão mista adiou a votação do relatório da Medida Provisória 1357/2026, que visa extinguir a chamada 'taxa das blusinhas', para a próxima quarta-feira (2), às 10h. O texto, que suspende a cobrança de 20% do imposto federal de importação sobre compras internacionais de até US$ 50, precisa ser votado e aprovado pelo Congresso Nacional antes do seu vencimento em 8 de setembro.", "titulo_pt": "Ajustes finais adiam votação da MP da 'taxa das blusinhas'", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 138618, "titulo": "STJ atende agência reguladora e restabelece 'circuito fechado' em fretamento de ônibus", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/stj-atende-agencia-reguladora-e-restabelece-circuito-fechado-em-fretamento-de-onibus.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Marco Aurélio Bellizze, do STJ, restabeleceu a regra do circuito fechado no fretamento de ônibus interestaduais após um recurso da ANTT. O assunto segue em discussão no STF.", "titulo_pt": "STJ reestabelece 'circuito fechado' em fretamento de ônibus após recurso da antt", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138605, "titulo": "Einstein afasta Lottenberg do conselho após anúncio como futuro ministro de Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/einstein-afasta-lottenberg-do-conselho-apos-anuncio-como-futuro-ministro-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Conselho Deliberativo do Einstein Hospital Israelita, Cláudio Lottenberg, iniciou uma licença de suas funções no conselho a partir de 1º de setembro, até o fim do período eleitoral. Este anúncio foi feito após Lottenberg ter sido anunciado como futuro ministro.", "titulo_pt": "Einstein hospital afasta Lottenberg do conselho após anúncio como futuro ministro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138606, "titulo": "Senado aprova indicação de Rodrigo Pacheco como ministro do TCU", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/senado-aprova-indicacao-de-rodrigo-pacheco-como-ministro-do-tcu.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal aprovou a indicação de Rodrigo Pacheco para o cargo de ministro do TCU. A vaga ficou disponível com a saída antecipada do ministro Bruno Dantas.", "titulo_pt": "Senado aprova indicação de Rodrigo Pacheco como ministro do TCU", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138632, "titulo": "Senado aprova indicação de Rodrigo Pacheco para o Tribunal de Contas da União", "url": "https://g1.globo.com/politica/noticia/2026/09/01/senado-aprova-indicacao-de-rodrigo-pacheco-para-o-tribunal-de-contas-da-uniao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou a indicação de Rodrigo Pacheco para ministro do Tribunal de Contas da União por 63 votos a 4. A aprovação segue para análise da Câmara dos Deputados, onde será votada na seguinte sessão.", "titulo_pt": "Senado aprova Rodrigo Pacheco para tcu", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 138859, "titulo": "STJ diz que Reclame Aqui não responde automaticamente por reclamação do consumidor", "url": "https://www.jota.info/justica/stj-diz-que-reclame-aqui-nao-responde-automaticamente-por-reclamacao-do-consumidor", "fonte_id": "jota", "data_pub": "2026-09-01T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 3ª Turma do Superior Tribunal de Justiça decidiu que o Reclame Aqui não é responsável por responder automaticamente as reclamações dos consumidores. O provedor só pode ser responsabilizado se descumprir uma decisão judicial sobre a remoção de conteúdo.", "titulo_pt": "STJ determina que Reclame Aqui não responde automaticamente reclamações de consumidores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 138619, "titulo": "Entenda como a PF ligou mensagens de Vorcaro no WhatsApp a Moraes, mesmo com visualização única", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/entenda-como-a-pf-ligou-mensagens-de-vorcaro-no-whatsapp-a-moraes-mesmo-com-visualizacao-unica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antes de enviar mensagens para o ministro Alexandre de Moraes, o ex-banqueiro Daniel Vorcaro fazia printscreens das conversas e os salvava. A Polícia Federal usou esse padrão para reconstruir o diálogo entre Vorcaro e Moraes, revelado na investigação publicada nesta terça-feira (1º).", "titulo_pt": "Entenda como a PF ligou conversas do WhatsApp de Vorcaro a Moraes, mesmo com visualização única", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138633, "titulo": "PF aponta que Vorcaro mandou ao menos 28 mensagens a telefone atribuído a Moraes na semana em que foi preso", "url": "https://g1.globo.com/politica/noticia/2026/09/01/pf-aponta-que-vorcaro-mandou-mensagens-a-telefone-atribuido-a-moraes-na-semana-em-que-foi-preso.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal identificou que Daniel Vorcaro, ex-dono do Banco Master, enviou pelo menos 28 mensagens a um número atribuído ao ministro Alexandre de Moraes, do STF, antes de sua prisão em 2025. Nas mensagens, Vorcaro pediu encontros com Moraes e fez perguntas sobre influência sobre outros envolvidos no caso.", "titulo_pt": "PF identifica 28 mensagens de Vorcaro a Moraes antes de prisão", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 138607, "titulo": "Oposição cobra impeachment de Moraes, mas vê resistência de Alcolumbre e centrão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/oposicao-cobra-impeachment-de-moraes-mas-ve-resistencia-de-alcolumbre-e-centrao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores de oposição consideram aumentar a pressão pelo impeachment do ministro Alexandre de Moraes, do STF, mas reconhecem que não haverá efeitos práticos devido à falta de apoio do presidente da Câmara, Davi Alcolumbre (União Brasil - AP).", "titulo_pt": "Oposição cobra impeachment de Moraes, mas vê resistência de Alcolumbre e centrão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138608, "titulo": "Terremoto institucional no STF atinge as campanhas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/terremoto-institucional-no-stf-atinge-as-campanhas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A revelação das mensagens entre Daniel Vorcaro e Alexandre de Moraes tem grandes implicações para a vida institucional brasileira e afetará imediatamente as campanhas presidenciais.", "titulo_pt": "Terremoto institucional no STF atinge as campanhas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138860, "titulo": "Saiba tudo o que diz o relatório da PF sobre Moraes e Vorcaro. Leia a íntegra do documento", "url": "https://www.jota.info/stf/do-supremo/saiba-tudo-o-que-diz-o-relatorio-da-pf-sobre-moraes-e-vorcaro-leia-a-integra-do-documento", "fonte_id": "jota", "data_pub": "2026-09-01T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da Polícia Federal sobre os processos envolvendo a Operação Compliance Zero teve seu sigilo levantado pelo ministro André Mendonça, que é o relator desses processos.", "titulo_pt": "Entenda o relatório da PF sobre Moraes e vorcarro, agora sem sigilo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 138609, "titulo": "Ex-ministro de Bolsonaro intermediou contato entre Vorcaro e Moraes: 'dá tempo de tomar um whisky', mostram mensagens", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ex-ministro-de-bolsonaro-intermediou-contato-entre-vorcaro-e-moraes-da-tempo-de-tomar-um-whisky-mostram-mensagens.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fábio Faria, ex-ministro das Comunicações de Jair Bolsonaro, intermediou o contato entre Daniel Vorcaro, dono do Banco Master, e o ministro do STF Alexandre de Moraes, conforme mostram mensagens obtidas pela Polícia Federal.", "titulo_pt": "Ex-ministro de Bolsonaro intermediou contato entre Vorcaro e Moraes: 'dá tempo de tomar um whisky', mostram mensagens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138610, "titulo": "Mensagens de Vorcaro citam Moraes, Gonet e chefe da PF; entenda o caso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/mensagens-de-vorcaro-citam-moraes-gonet-e-chefe-da-pf-entenda-o-caso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T20:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal encontrou uma série de mensagens, minutas de contratos e metadados no celular de Daniel Vorcaro que ampliaram as informações sobre sua relação com autoridades. Essas evidências foram reveladas nesta terça-feira (1º).", "titulo_pt": "Mensagens de Vorcaro citam Moraes, Gonet e chefe da PF; entenda o caso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138634, "titulo": "Vorcaro fez mais um repasse de US$ 1,6 milhão para o filme Dark Horse após cobranças de Flávio Bolsonaro, diz revista", "url": "https://g1.globo.com/politica/noticia/2026/09/01/vorcaro-fez-mais-um-repasse-de-us-16-milhao-para-o-filme-dark-horse-apos-cobrancas-de-flavio-bolsonaro-diz-revista.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro fez um repasse de US$ 1,666 milhão para o filme Dark Horse em setembro de 2025, após cobranças de Flávio Bolsonaro. Este repasse se soma a outros seis repasses realizados até maio de 2025, totalizando US$ 10 milhões.", "titulo_pt": "Vorcaro fez repasse de US$ 1,6 milhão para filme Dark Horse após cobranças de Flávio Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 138861, "titulo": "Mendonça mandou a PF identificar destinatário de mensagens de Vorcaro. Era Moraes", "url": "https://www.jota.info/stf/do-supremo/mendonca-mandou-a-pf-identificar-destinatario-de-mensagens-de-vorcaro-era-moraes", "fonte_id": "jota", "data_pub": "2026-09-01T20:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal (PF) identificou o destinatário das mensagens de Vorcaro, que foi confirmado como sendo o ministro do STF Alexandre Moraes. A PF informou que não realizou nenhum ato de aprofundamento investigativo direcionado a magistrados.", "titulo_pt": "Mendonça identificou destinatário das mensagens de Vorcaro como sendo Moraes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 138672, "titulo": "Exército de Israel captura chefe de segurança do Hamas em ataque a Gaza", "url": "https://veja.abril.com.br/mundo/exercito-de-israel-captura-chefe-de-seguranca-do-hamas-em-ataque-a-gaza/", "fonte_id": "veja", "data_pub": "2026-09-01T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses capturaram o chefe de segurança do Hamas durante um ataque em Gaza. Autoridades palestinas relataram seis mortes, incluindo três crianças.", "titulo_pt": "Exército de Israel captura chefe de segurança do Hamas em ataque a Gaza", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 139178, "titulo": "U.S. carries out new military strikes in Iran", "url": "https://www.washingtonpost.com/national-security/2026/09/01/us-carries-out-new-military-strikes-iran/", "fonte_id": "washington_post_world", "data_pub": "2026-09-01T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram novos ataques militares em resposta a tentativas de ataques da Irã em navios comerciais no Estreito de Ormuz e a tropas americanas no Oriente Médio, conforme informaram oficiais da Central Command.", "titulo_pt": "EUA realizam novas operações militares na Irã", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 138785, "titulo": "Parlamento da Venezuela apoia acordo petrolífero com os EUA", "url": "https://www.metropoles.com/mundo/parlamento-da-venezuela-apoia-acordo-petrolifero-com-os-eua", "fonte_id": "metropoles", "data_pub": "2026-09-01T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Assembleia Nacional da Venezuela aprovou um acordo que concede poderes aos Estados Unidos sobre o petróleo do país. O acordo foi aprovado nesta terça-feira (1º/9).", "titulo_pt": "Parlamento da Venezuela aprova acordo petrolífero com os EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 139088, "titulo": "Honduras, prosciolto l'ex presidente Juan Orlando Hernandez", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/01/honduras-prosciolto-lex-presidente-juan-orlando-hernandez_83b0b79f-ce77-40e3-9b59-6eb97fd251ba.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-01T21:52:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Juan Orlando Hernández, ex-presidente da Honduras, foi acusado de lavagem de dinheiro e fraude no caso Pandora II, mas agora está livre.", "titulo_pt": "Honduras: ex-presidente Juan Orlando hernández solto", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 138856, "titulo": "Por que o TSE recuou e liberou campanha de Renan Santos", "url": "https://www.bbc.com/portuguese/articles/c93vkpnk5qxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-01T21:51:00Z", "idioma":
