<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

morte da jornalista investigativa Daphne Caruana Galizia, o que gerou indignação da família da vítima e de defensores da liberdade de imprensa. Em outro desenvolvimento, o ministro de Segurança Nacional de Israel, Itamar Ben-Gvir, publicou um vídeo feito por inteligência artificial comemorando a fome sofrida por prisioneiros palestinos nas prisões israelenses, sob sua administração. A escalada das tensões entre Estados Unidos e Irã está acompanhada por uma onda de desinformação online, com vídeos antigos e irrelevantes sendo apresentados como novos ataques. Além disso, o Brasil deportou um imigrante brasileiro de 57 anos para a Guiné Equatorial, enquanto o presidente dos Estados Unidos, Donald Trump, declarou que a Venezuela ainda não está preparada para realizar novas eleições, oito meses após a suposta captura de Nicolás Maduro por forças americanas em Caracas.\n\nAs tensões geopolíticas no Oriente Médio continuam a dominar as notícias, com o Irã e os Estados Unidos em um conflito cada vez mais intenso. O Irã acusa as forças militares dos EUA de cometerem um crime de guerra após uma operação que atingiu um casamento, enquanto o presidente dos EUA, Joe Biden, ameaça novos ataques contra o Irã. Além disso, a Turquia está importando petróleo cru dos EUA em vez da Rússia, devido a interrupções nas importações russas. No Cisjordânia, dois palestinos foram mortos durante um ataque de colonos judeus. O Irã também adicionou 11 navios à sua lista negra, proibindo-os de transitar pelo Estreito de Ormuz, devido a não cumprimento das regras. A China, por sua vez, pressionou para um novo quadro de segurança no Oriente Médio durante uma visita ao Egito, enquanto a Arábia Saudita condenou um ataque letal do Irã a um navio-pipa no Estreito de Ormuz, resultando em duas mortes de marinheiros filipinos.", "economia": "A Standard Chartered elevou sua projeção de crescimento econômico para 11,5%, aumentando suas estimativas de expansão global. Em Taiwan, a Google planeja expandir suas instalações em 60% para atender à crescente demanda por espaço de trabalho. No Brasil, o Senado aprovou um projeto que cria incentivos fiscais de R$ 5 bilhões e um conselho governamental com poder de veto sobre parcerias internacionais para regular o setor de minerais críticos e terras raras. A alta dos juros longos é um fenômeno global, com taxas recorde em vários países, pressionando os mercados de títulos. A União Europeia implementará uma lei contra o desmatamento que afetará o setor de café, incluindo produtores e exportadores fora da Europa, enquanto o Plaza Premium Group planejará inaugurar um espaço VIP no Aeroporto Internacional de Confins, em Belo Horizonte. A Microsoft começará a divulgar o faturamento trimestral do Azure em dólares pela primeira vez, oferecendo mais clareza sobre seu negócio que compete com o AWS. A Chevron se comprometeu a dobrar a produção de petróleo na Venezuela com um investimento de 7 bilhões de dólares em joint ventures, em meio à pressão do governo americano para uma significativa elevação da produção no país. A Uber vai eliminar 3.300 postos de trabalho, correspondendo a 10% de sua força de trabalho, em sua maior redução desde a pandemia, motivada pela crescente concorrência no setor de entrega de alimentos e pelo aumento da competição na corrida para implementar táxis robóticos.", "tecnologia": "A Google escapou de uma tentativa de desintegração de sua operação publicitária nos Estados Unidos, mas um juiz ordenou que a empresa altere suas operações para beneficiar os concorrentes. A empresa foi condenada por sufocar a concorrência, mas não foi obrigada a vender partes de seu negócio de publicidade. Em outro desenvolvimento, a OpenAI lançou um novo modelo chamado Astra, que usa uma técnica chamada 'recorrente de profundidade', permitindo que o modelo opere além do pensamento sequencial que caracteriza a maioria dos modelos de raciocínio. No entanto, a liberação iminente deste modelo tem levantado preocupações entre os pesquisadores sobre potenciais riscos de segurança.", "ciencia": "Um estudo conduzido por uma cientista da Penn State descobriu que peixes criados por pais machos adultos têm maior sobrevivência em situações de vida ou morte do que seus pares criados sem a presença de pais machos, sugerindo que o comportamento protetor retratado no filme 'Procurando Nemo' pode refletir o comportamento real dos pais peixes. Em outra pesquisa, cientistas do Indian Institute of Technology Gandhinagar desenvolveram uma plataforma baseada em nanorodas de ouro que entrega medicamentos específicos ao reticulero endoplasmático, estrutura responsável pela produção e processamento de proteínas dentro das células, e gera calor quando exposto à luz infravermelha próxima, potencialmente oferecendo uma nova abordagem para a terapia direcionada ao câncer. A cidade de Nova York anunciou uma proibição temporária do uso de ferramentas de inteligência artificial por estudantes do ensino fundamental e do ensino médio durante o próximo ano letivo, com o objetivo de proteger a privacidade dos alunos. Além disso, a NASA reformulou o desafio NCAS para comunidades de colégios técnicos dos Estados Unidos, oferecendo aos estudantes a chance de explorar carreiras em aeroespacial, ciência, engenharia e tecnologia. O Telescópio Espacial Hubble da NASA revelou uma onda atmosférica gigante, evoluindo e com forma decagonal, envolvendo o polo sul de Saturno, marcando o primeiro registro de um padrão de jato regular com muitos lados na hemisfério sul do planeta.", "cultura": "A 28ª Bienal Internacional do Livro de São Paulo, que acontece de 4 a 13 de setembro, é o evento mais importante do período, com expectativa de receber mais de 700 mil visitantes. A edição terá uma expansão física e uma programação cultural ampliada, com a participação de 350 autores, 269 expositores e 11 espaços culturais. Em outro destaque, a exposição 'Turn the Volume Up!', no Museu Nasher da Duke University, convida os visitantes a se envolverem politicamente. A artista alemã Kerstin Brätsch também ganhou o prêmio Zurich de Arte no valor de 160 mil dólares, recebendo uma exposição individual no Museum Haus Konstruktiv no próximo ano. Além disso, pesquisas indicam que a combinação de disciplina e autonomia na educação dos nascidos nas décadas de 1960 e 1970 contribuiu para a formação de uma forte capacidade de adaptação, atribuída à abordagem educacional de gerações passadas.", "sociedade": "Em Ceuta, um enclave espanhol, milhares de pessoas protestaram exigindo a expulsão de migrantes que permanecem no local. Em outro evento, uma mulher faleceu após ser diagnosticada com ansiedade e receber duas altas no mesmo dia, o que levou a uma investigação policial. Em Minas Gerais, atividades em um campus foram retomadas após ameaças contra alunos e um diretor, com reforço policial. No Rio de Janeiro, foi aprovado um projeto de lei que estabelece uma cota para mães solteiras de baixa renda nas escolas técnicas.", "meio_ambiente": "O mundo enfrenta um desafio significativo no que diz respeito ao meio ambiente, conforme alerta a ONU, que prevê que o aquecimento global ultrapassará o limite de 1,5°C estipulado pelo Acordo de Paris nos próximos anos. Este aumento acima do limite estabelecido aumenta os riscos de eventos climáticos extremos e afeta negativamente a produtividade agrícola e o uso de recursos naturais. O Nepal também enfrenta um grave problema, com mais de 1.100 mortes e 3.900 pessoas desaparecidas após inundações e deslizamentos de terra. Além disso, a qualidade do ar ruim, causada por incêndios florestais e de terras na Indonésia, força cerca de 1,4 milhão de estudantes a migrarem para o aprendizado online. A indústria marítima, por sua vez, está buscando soluções inovadoras, como a instalação de velas eólicas em navios, para reduzir o consumo de combustível e atender a regulamentações ambientais mais rigorosas.", "direitos_humanos": "Grupos internacionais estão pressionando pela libertação de ativistas democráticos em Hong Kong, enquanto autoridades locais e internacionais continuam a reprimir manifestantes. Joshua Wong, um dos ativistas pró-democracia mais proeminentes de Hong Kong, admitiu culpa em um segundo caso relacionado à Lei de Segurança Nacional de Pequim, o que pode resultar em uma extensão mínima de três anos ou até mesmo prisão perpétua para sua sentença. Além disso, um ex-diretor de um centro residencial para pessoas com deficiência grave foi condenado a 15 anos de prisão por estuprar três residentes durante mais de uma década e por agredir fisicamente outros residentes. Em outros casos, a inteligência militar chilena e uruguaia estiveram envolvidas em uma colaboração secreta em 1973, e um homem palestino-australiano acusa a polícia do estado de Nova South Wales de tê-lo batido durante uma manifestação contra o político Isaac Herzog. Além disso, a pena capital tem aumentado nos Estados Unidos, com Florida executando seu 14º prisioneiro no ano. Finalmente, um ex-diretor de um centro residencial para pessoas com deficiência grave foi condenado a 15 anos de prisão por estuprar três residentes durante mais de uma década e por agredir fisicamente outros residentes."}, "resumo_do_dia": {"politica_nacional": [{"id": 141123, "titulo": "CCJ do Senado aprova texto-base da PEC da Segurança Pública", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/ccj-do-senado-aprova-texto-base-da-pec-da-seguranca-publica", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-02T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto-base da Proposta de Emenda à Constituição (PEC) nº 18/2025, conhecida como PEC da Segurança Pública, foi aprovado na Comissão de Constituição e Justiça (CCJ) do Senado Federal. A proposta estabelece novas regras para chefes de facções criminosas e cria um novo pacto federativo para enfrentar o crime organizado no Brasil.", "titulo_pt": "CCJ do Senado aprova texto-base da PEC da Segurança Pública", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 141162, "titulo": "Renan Santos protocola pedido de impeachment contra Moraes e Toffoli", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/02/renan-santos-impeachment-moraes-toffoli.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato à Presidência, protocolou pedidos de impeachment contra Alexandre de Moraes e Dias Toffoli, ministros do Supremo Tribunal Federal, no Senado Federal. As denúncias são endereçadas ao presidente do Senado, Davi Alcolumbre, e passarão por um primeiro filtro político antes de poderem avançar para uma comissão especial.", "titulo_pt": "Renan Santos protocola pedidos de impeachment contra Moraes e Toffoli", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141163, "titulo": "TSE forma maioria para aprovar registros de candidatura de Lula, Flávio Bolsonaro e Romeu Zema", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/02/tse-forma-maioria-para-aprovar-registros-de-candidatura-de-lula-flavio-bolsonaro-e-romeu-zema.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral formou maioria para aprovar os registros de candidatura de Luiz Inácio Lula da Silva (PT), Flávio Bolsonaro (PL) e Romeu Zema (Novo) à Presidência da República. Samara Martins (UP), Hertz Dias (PSTU) e Edmilson Costa (PCB) também tiveram seus registros aprovados com maioria.", "titulo_pt": "TSE aprova registros de candidatura de Lula, Flávio Bolsonaro e Zema", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141127, "titulo": "Duas propostas para a segurança pública", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/maria-herminia-tavares/2026/09/duas-propostas-para-a-seguranca-publica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A segurança pública é uma das maiores preocupações dos brasileiros, competindo com a saúde. A violência é uma experiência frequente, especialmente para os pobres, podendo ser praticada por parentes, estranhos ou até pela própria polícia.", "titulo_pt": "Duas propostas para a segurança pública", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 141276, "titulo": "Vox Radar: relatório sobre Vorcaro e Moraes abafa caso Lulinha e Dark Horse", "url": "https://www.cnnbrasil.com.br/politica/vox-radar-relatorio-sobre-vorcaro-e-moraes-abafa-caso-lulinha-e-dark-horse/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento indica que 41 mil comentários se referem ao ministro do STF e ao ex-banqueiro, em comparação com apenas 4.212 sobre Flávio Bolsonaro e 1.182 sobre o filho de Lula.", "titulo_pt": "Vox Radar: relatório sobre Vorcaro e Moraes supera comentários sobre flávio bolsonaro e Lulinha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141277, "titulo": "Vox Radar: mensagens de Vorcaro pesam contra Moraes; Mendonça fica neutro", "url": "https://www.cnnbrasil.com.br/politica/vox-radar-mensagens-de-vorcaro-pesam-contra-moraes-mendonca-fica-neutro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento analisou 736.737 reações nas redes sociais e constatou que quase 73% das menções ao ministro do STF, Alexandre Moraes, foram negativas. O ministro Luiz Eduardo Mendonça de Barros, também citado no estudo, manteve uma posição neutra.", "titulo_pt": "Vox Radar: mensagens de Vorcaro pesam contra Moraes; Mendonça fica neutro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141278, "titulo": "Senado aprova PL que amplia poder do governo sobre minerais críticos", "url": "https://www.cnnbrasil.com.br/infra/senado-aprova-pl-que-amplia-poder-do-governo-sobre-minerais-criticos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto de lei que amplia o poder do governo sobre minerais críticos, criando um conselho com autoridade para impedir operações do setor e permitindo a adoção de condições sobre as exportações. A proposta também inclui incentivos fiscais, um fundo garantidor e incentivos para o processamento desses minerais no Brasil.", "titulo_pt": "Senado aprova PL que amplia poder do governo sobre minerais críticos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141128, "titulo": "Gilmar procura Lula para cobrar apoio do governo à cúpula da PF em embate entre Moraes e Mendonça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/gilmar-procura-lula-para-cobrar-apoio-do-governo-a-cupula-da-pf-em-embate-entre-moraes-e-mendonca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, decano do STF, conversou com o presidente Lula para alertá-lo sobre a falta de apoio do governo à cúpula da Polícia Federal. Mendes tem chamado essas conversas de alertas.", "titulo_pt": "Gilmar busca Lula para discutir apoio do governo à cúpula da PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 141164, "titulo": "Terras raras: Senado aprova projeto com fundo garantidor e crédito de R$ 5 bi para estimular exploração", "url": "https://g1.globo.com/politica/noticia/2026/09/02/terras-raras-senado-aprova-fundo-garantidor-e-credito-de-r-5-bi-para-estimular-exploracao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto que cria a Política Nacional de Minerais Críticos e Estratégicos com um fundo garantidor e um crédito tributário de R$ 5 bilhões para estimular a exploração de minérios no Brasil. O texto segue para sanção presidencial.", "titulo_pt": "Senado aprova projeto com fundo garantidor e crédito de R$ 5 bi para estimular exploração de minérios", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141129, "titulo": "Médicos do tráfego pedem mudanças em MP do mototáxi para impedir aumento de mortes no trânsito", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/medicos-do-trafego-pedem-mudancas-em-mp-do-mototaxi-para-impedir-aumento-de-mortes-no-transito.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Associação Brasileira de Medicina do Tráfego propôs mudanças significativas na Medida Provisória que facilita as regras para mototaxistas, temendo que as alterações possam levar a um aumento no número de mortes e acidentes no trânsito.", "titulo_pt": "Médicos do tráfego sugerem alterações na MP do mototáxi para evitar aumento de mortes no trânsito", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 141130, "titulo": "Deputados governistas veem parcialidade de Mendonça e pedem derrubada de sigilo do caso 'Dark Horse'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/deputados-governistas-veem-parcialidade-de-mendonca-e-pedem-derrubada-de-sigilo-do-caso-dark-horse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do presidente Lula na Câmara dos Deputados acionaram o STF para pedir a derrubada do sigilo de uma investigação sobre o filme 'Dark Horse', que envolve o ex-banqueiro Daniel Vorcaro e Jair Bolsonaro. O objetivo é questionar a parcialidade do ministro Mendonça na apuração do caso.", "titulo_pt": "Deputados petistas pedem derrubada de sigilo em caso 'Dark Horse'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 141165, "titulo": "'Crise Master' no STF superou casos 'Dark Horse' e Lulinha em postagens nas redes sociais, aponta levantamento", "url": "https://g1.globo.com/politica/noticia/2026/09/02/crise-master-no-stf-superou-casos-dark-horse-e-lulinha-em-postagens-nas-redes-sociais-aponta-levantamento.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 24 horas, 1,1 milhão de posts nas redes sociais foram registrados sobre a retirada do sigilo de mensagens envolvendo o ministro Alexandre de Moraes e um banqueiro. O pico de atividade ocorreu cerca de nove horas após a revelação, com mais de 84 mil postagens no horário de pico.", "titulo_pt": "Crise Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141131, "titulo": "Tucanos se aproximam de Cury e o veem como alternativa de centro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/tucanos-se-aproximam-de-cury-e-o-veem-como-alternativa-de-centro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes e candidatos do PSDB estão se aproximando de Augusto Cury, do Avante, que é considerado uma alternativa de centro política. Eles vêem Cury como uma opção que rejeita Lula e Flávio Bolsonaro.", "titulo_pt": "Tucanos se aproximam de Cury e o veem como alternativa de centro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 141395, "titulo": "CCJ do Senado aprova a PEC que prevê o fim da escala 6×1", "url": "https://www.jota.info/trabalho/ccj-do-senado-aprova-a-pec-que-preve-o-fim-da-escala-6x1", "fonte_id": "jota", "data_pub": "2026-09-02T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CCJ do Senado aprovou a PEC que prevê o fim da escala 6×1. O relator, senador Omar Aziz (PSD-AM), rejeitou as emendas e manteve o texto da Câmara.", "titulo_pt": "CCJ do Senado aprova PEC que prevê fim da escala 6×1", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 141166, "titulo": "Crise no STF pode respingar em Lula em meio a alertas da pesquisa Quaest divulgada nesta quarta", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/09/02/crise-no-stf-pode-respingar-em-lula-num-momento-de-alertas-da-pesquisa-quaest.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise interna no Supremo Tribunal Federal pode afetar a imagem do presidente Luiz Inácio Lula da Silva, conforme mostram os últimos números da pesquisa Quaest, que indicam uma redução da diferença entre Lula e Flávio Bolsonaro no segundo turno das eleições, agora com 42% para Lula e 41% para Bolsonaro.", "titulo_pt": "Crise no STF pode impactar imagem de Lula, diz pesquisa Quaest", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141132, "titulo": "STF em ponto de não retorno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/stf-em-ponto-de-nao-retorno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) enfrenta a maior crise de sua história devido aos desdobramentos do caso Master, que revelou uma rede de influência envolvendo deputados, senadores, servidores do Banco Central e membros da corte.", "titulo_pt": "STF em ponto de não retorno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 141657, "titulo": "Iran hits targets in Gulf after 2-maltese-tycoon-acquitted-reporter-murder", "fonte_id": "france24", "data_pub": "2026-09-02T21:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal maltês absolveu o empresário Yorgen Fenech no caso da morte pela explosão de um carro de Daphne Caruana Galizia, uma jornalista investigativa. A família da vítima e defensores da liberdade de imprensa condenaram a decisão.", "titulo_pt": "Tribunal maltês absolve empresário no caso da jornalista investigativa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 141154, "titulo": "Brasileiro investigado diz que teve ajuda de consulado para fugir dos EUA", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/cotidiano/2026/09/brasileiro-investigado-diz-que-teve-ajuda-de-consulado-para-fugir-dos-eua.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-02T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O brasileiro João Araújo, de 57 anos, acusado de crimes relacionados a procedimentos de cirurgia plástica nos Estados Unidos, afirma ter recebido ajuda de autoridades brasileiras para fugir da Flórida e chegar ao Rio de Janeiro. As declarações foram publicadas pelo New York Post.", "titulo_pt": "Brasileiro investigado diz ter recebido ajuda do consulado para fugir dos EUA", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 141524, "titulo": "News live: Chalmers acknowledges ‘softness in housing market’; Australia sends drones to Nepal", "url": "https://www.theguardian.com/australia-news/live/2026/sep/03/anthony-albanese-one-nation-jim-chalmers-labor-liberal-angus-taylor-tobacco-plan-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-02T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de operadores especializados em drones irão auxiliar nos esforços de busca e resgate após as inundações letais nas fronteiras entre Nepal e Tibet. O líder da oposição adjunta, Jane Hume, afirmou que o plano do governo Coalition para combater o mercado ilegal de tabaco não é uma cópia do proposto pela One Nation, mas sim um plano integralmente custeado e modelado para enfrentar o crime organizado.", "titulo_pt": "Equipes de drones auxiliarão em Nepal; líder da oposição descreve plano do governo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 141516, "titulo": "Iran Accuses U.S. Military of a War Crime", "url": "https://foreignpolicy.com/2026/09/02/iran-war-crime-us-strike-wedding-renewed-fighting/", "fonte_id": "foreign_policy", "data_pub": "2026-09-02T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã acusa as forças militares dos Estados Unidos de cometerem um crime de guerra. O combate intensificou após um mês sem grandes ações militares significativas.", "titulo_pt": "Irã acusa exército dos EUA de Crime de guerra", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 141630, "titulo": "Struggling Republicans urge Trump to open Maga Inc’s $400mn war chest", "url": "https://www.ft.com/content/8f699fbc-cb01-4846-837c-0d1528a620d0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-02T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Republicanos em dificuldades estão pressionando o presidente Trump para que ele libere os fundos de seu Super PAC, que possui um fundo de US$ 400 milhões, para as eleições de meios mandatos, apesar das pesquisas indicando uma derrota para o partido republicano em novembro.", "titulo_pt": "Republicanos em dificuldade pedem a Trump que abra o cofre de us$ 400 milhões da Maga Inc para as eleições de meios mandatos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 141517, "titulo": "Nepal’s Disaster Demands a Regional Response", "url": "https://foreignpolicy.com/2026/09/02/nepal-floods-disaster-regional-cooperation-climate/", "fonte_id": "foreign_policy", "data_pub": "2026-09-02T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A colapso do gelo e as inundações que seguiram demonstram a necessidade de estados vizinhos cooperarem para reduzir ameaças futuras.", "titulo_pt": "Desastre no nepal require resposta Regional", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 141566, "titulo": "Is Wintour still en Vogue? The Met navigates rough seas as Galliano's 'Horizons' sparks controversy", "url": "https://www.france24.com/en/tv-shows/spotlight/20260902-is-wintour-still-en-vogue-the-met-navigates-rough-seas-as-galliano-s-horizons-sparks-controversy", "fonte_id": "france24", "data_pub": "2026-09-02T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O curador François Picard recebeu Dana Thomas, autora de 'Deuses e Reis: O Auge e a queda de Alexander McQueen e John Galliano' e 'Deluxe: Como o luxo perdeu seu brilho', para discutir a controvérsia em torno da retrospectiva de Galliano no Met. A questão central, segundo Thomas, é o poder institucional.", "titulo_pt": "Wintour ainda está em Vogue? O Met navega em águas turbulentas após a controversa retrospectiva de Galliano", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 141642, "titulo": "Vannacci, 'Meloni al Quirinale? Perché no, sarebbe un ottimo capo dello Stato'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/02/vannacci-meloni-al-quirinale-perche-no-sarebbe-un-ottimo-capo-dello-stato_98ffcb18-0531-4119-a45b-e4d82d8ec836.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-02T21:36:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O político Vannacci expressou que Meloni não seria um ótimo chefe do Estado. Futuro Nazionale, um partido, poderia oferecer apoio a Meloni, mas isso é uma hipótese possível.", "titulo_pt": "Vannacci, 'Meloni no Quirinale? Por que não, ela não seria um bom chefe do estado'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 141155, "titulo": "Ministro extremista de Israel publica vídeo feito com IA em que comemora fome de palestinos em prisões", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/ministro-extremista-de-israel-publica-video-feito-com-ia-em-que-comemora-fome-de-palestinos-em-prisoes.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-02T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro de Segurança Nacional de Israel, Itamar Ben-Gvir, publicou um vídeo feito por inteligência artificial comemorando a fome sofrida por prisioneiros palestinos em prisões israelenses, sob sua administração.", "titulo_pt": "Ministro extremista de Israel publica vídeo com IA sobre fome de prisioneiros palestinos", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 141525, "titulo": "Andy Burnham targets migrant crisis ahead of Macron’s visit to No 10", "url": "https://www.theguardian.com/politics/2026/sep/02/andy-burnham-migrant-crisis-macron-downing-street", "fonte_id": "guardian_world", "data_pub": "2026-09-02T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Reino Unidade se reunirá com o presidente francês Emmanuel Macron em Downing Street, focando em questões de política externa como Irã, grupos de contrabando e relações com a União Europeia. A reunião visa abordar a crise migratória irregular e estabelecer um novo acordo com a União Europeia.", "titulo_pt": "Andy Burnham alinha esforços com Macron sobre crise migratória e outros assuntos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 141613, "titulo": "Turkey replaces Russian oil and diesel imports from US as wars reverberate", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/turkey-replaces-russian-oil-and-diesel-imports-us-wars-reverberate", "fonte_id": "middle_east_eye", "data_pub": "2026-09-02T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Turquia está importando petróleo cru e produtos refinados dos Estados Unidos em vez da Rússia, devido a interrupções nas importações russas causadas por ataques ucranianos a infraestrutura energética russa. Em junho, os EUA superaram a Rússia como principal fornecedor de petróleo cru para a Turquia.", "titulo_pt": "Turquia substitui importações de óleo e diesel russo por americano devido a guerra", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 141581, "titulo": "Malta: Businessman acquitted of journalist's murder", "url": "https://www.dw.com/en/malta-businessman-acquitted-of-journalist-s-murder/a-78814305?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-02T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário Yorgen Fenech foi absolvido do assassinato do jornalista investigativo Daphne Caruana Galizia. A família da vítima continua a exigir justiça para o seu assassinato.", "titulo_pt": "Malta: empresário absolvido no assassinato do jornalista", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 141187, "titulo": "Trump propõe renomear Estreito de Ormuz para ‘Estreito de Trump’", "url": "https://www.cartacapital.com.br/mundo/trump-propoe-renomear-estreito-de-ormuz-para-estreito-de-trump/", "fonte_id": "cartacapital", "data_pub": "2026-09-02T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há uma semana, o presidente americano Donald Trump ordenou que o Lago Ontário fosse renomeado para 'Lago América'. Anteriormente, Trump propôs renomear o Estreito de Ormuz para 'Estreito de Trump'.", "titulo_pt": "Trump propõe renomear Estreito de Ormuz para 'Estreito de Trump'", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 141655, "titulo": "Google to grow office space in Taiwan by 60%", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/03/2003863595", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google planeja expandir o espaço de sua sede em Taiwan em 60%. A empresa está aumentando as instalações existentes para atender a crescente demanda por espaço de trabalho.", "titulo_pt": "Google vai ampliar espaço de escritório em Taiwan em 60%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 141678, "titulo": "Standard Chartered raises economic growth forecast to 11.5%", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/03/2003863580", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Standard Chartered aumentou sua projeção de crescimento econômico para 11,5%. A empresa revisou suas estimativas de crescimento econômico global.", "titulo_pt": "Standard Chartered eleva projeção de crescimento econômico para 11,5%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 141141, "titulo": "Pressionada pela BYD, GM segura terceiro lugar nas vendas de automóveis em agosto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/eduardosodre/2026/09/pressionada-pela-byd-gm-segura-terceiro-lugar-nas-vendas-de-automoveis-em-agosto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A General Motors conseguiu manter o terceiro lugar nas vendas de automóveis em agosto após conceder um bônus de R$ 5.000 para toda a linha Chevrolet no último fim de semana. Antes disso, a empresa havia sido ultrapassada pela BYD, uma montadora chinesa, e caído para o quarto lugar no mês.", "titulo_pt": "GM mantém terceiro lugar em vendas após conceder bônus", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141142, "titulo": "Inflação dos alimentos mantém tendência de queda em agosto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/09/inflacao-dos-alimentos-mantem-tendencia-de-queda-em-agosto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação dos alimentos registrou a 11ª queda consecutiva na semana de agosto em São Paulo, com uma taxa de 0,18%. Seis dos dez principais itens com redução de preços no Índice de Preços ao Consumidor são do setor agrícola, de acordo com pesquisa da Fipe.", "titulo_pt": "Inflação dos alimentos mantém tendência de queda em agosto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141562, "titulo": "US judge rejects bid to break up Google's ad business", "url": "https://www.lemonde.fr/en/international/article/2026/09/02/us-judge-rejects-bid-to-break-up-google-s-ad-business_6757100_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-02T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz dos Estados Unidos rejeitou a tentativa de dividir o negócio de anúncios da Google. De acordo com o caso do governo, a empresa controlava múltiplos lados do mercado de anúncios digitais, desde a plataforma usada por publicadores para vender anúncios até a troca onde as transações ocorrem, além de comandar uma grande demanda de anunciantes.", "titulo_pt": "Juiz rejeita tentativa de dividir negócios de anúncios da Google", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 141143, "titulo": "A correlação quebrada entre juros e ações: até quando?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/solange-srour/2026/09/a-correlacao-quebrada-entre-juros-e-acoes-ate-quando.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alta dos juros longos é um fenômeno global, com taxas recorde em vários países. O título americano de 30 anos atingiu seu nível mais alto desde 2007, o título alemão de 10 anos superou 3,3% pela primeira vez desde 2011, os gilts britânicos de longo prazo estão em sua máxima em quase três décadas, e o título japonês de 20 anos está em seu pico desde 1999.", "titulo_pt": "A correlação quebrada entre juros e ações: até quando?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141144, "titulo": "Senado aprova lei dos minerais críticos com R$ 5 bi em subsídios e conselho com poder de veto a estrangeiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/senado-aprova-lei-dos-minerais-criticos-com-r-5-bi-em-subsidios-e-conselho-com-poder-de-veto-a-estrangeiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal aprovou um projeto de lei que estabelece incentivos fiscais de R$ 5 bilhões, cria um novo fundo garantidor e institui um conselho governamental com poder de veto a parcerias internacionais para regular o setor de minerais críticos e terras raras.", "titulo_pt": "Senado aprova lei dos minerais críticos com R$ 5 bi em incentivos e conselho com poder de veto a estrangeiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141229, "titulo": "Senado aprova incentivos para exploração de minerais críticos no Brasil", "url": "https://www.metropoles.com/brasil/senado-aprova-politica-incentivos-a-minerais-criticos-no-brasil", "fonte_id": "metropoles", "data_pub": "2026-09-02T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto que cria incentivos bilionários para promover o processamento de minerais críticos no Brasil. O texto agora segue para sanção presidencial.", "titulo_pt": "Senado aprova incentivos para exploração de minerais críticos no Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 141282, "titulo": "Lei da UE contra desmatamento impactará setor de café também fora da Europa", "url": "https://www.cnnbrasil.com.br/agro/lei-da-ue-contra/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia (UE) implementará uma lei contra o desmatamento que afetará o setor de café, incluindo produtores e exportadores fora da Europa. Embora a UE importe 40% do café global, as empresas que abastecem o mercado europeu respondem por 80% dos embarques mundiais de café.", "titulo_pt": "Lei da UE contra desmatamento impactará setor de café também fora da Europa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141145, "titulo": "Plaza Premium anuncia lounge VIP em Confins e vê Brasil como um dos 3 mercados mais importantes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/plaza-premium-inaugura-lounge-vip-em-confins-e-ve-brasil-como-um-dos-3-mercados-mais-importantes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Plaza Premium Group, maior operadora de lounges em aeroportos do mundo, vai inaugurar um espaço VIP no Aeroporto Internacional de Confins, em Belo Horizonte. A companhia também planeja anunciar outra operação no Brasil em até seis semanas, chegando a 15 lounges no país.", "titulo_pt": "Plaza Premium anuncia lounge VIP em Confins e Brasil como um dos 3 mercados mais importantes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141288, "titulo": "Índices ligados à inflação lideram alta na renda fixa em agosto, diz B3", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/indices-ligados-a-inflacao-lideram-alta-na-renda-fixa-em-agosto-diz-b3/", "fonte_id": "cnn_brasil", "data_pub": " lo": "3 key belt and road connectivities that Hong Kong drives", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3365366/3-key-belt-and-road-connectivities-hong-kong-drives?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Comércio e Desenvolvimento Econômico de Hong Kong, Algernon Yau Ying-wah, esteve em Kuala Lumpur para a abertura oficial da Representação Econômica e Comercial de Hong Kong, o que elevou as relações econômicas e comerciais de Hong Kong com a Malásia e a região do Sudeste Asiático. Durante a visita, foi realizada uma conferência que reuniu autoridades governamentais, líderes empresariais e profissionais para discussões substantivas.", "titulo_pt": "3 Conectividades-chave do bri que Hong Kong impulsiona", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 141683, "titulo": "OpenAI’s new reasoning technique alarms AI safety experts", "url": "https://techcrunch.com/2026/09/02/openais-new-reasoning-technique-alarms-ai-safety-experts/", "fonte_id": "techcrunch", "data_pub": "2026-09-02T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI desenvolveu um novo modelo chamado Astra que utiliza uma técnica chamada 'recorrente profundidade', permitindo que o modelo opere além do pensamento sequencial que caracteriza a maioria dos modelos de raciocínio.", "titulo_pt": "Nova técnica de raciocínio da openai alarmiza especialistas em segurança de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 141737, "titulo": "China's private, reusable Pallas-1 rocket aces debut launch (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/chinas-private-reusable-pallas-1-rocket-aces-debut-launch-video", "fonte_id": "space_com", "data_pub": "2026-09-02T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira lançamento do foguete Pallas-1, desenvolvido pela Galactic Energy, foi um sucesso, alcançando a órbita. O primeiro estágio do foguete não tentou pousar durante o voo.", "titulo_pt": "Novo foguete Pallas-1 da galactic energy realiza lançamento bem-sucedido", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 141633, "titulo": "Google spared break-up of online advertising monopoly", "url": "https://www.ft.com/content/75c3179a-5c42-42fd-94e9-6f0c3dfc0c70?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-02T19:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O juiz negou o pedido do Departamento de Justiça dos Estados Unidos para forçar a venda de partes do negócio de publicidade da gigante de buscas Google.", "titulo_pt": "Google evita desmembramento do monopólio de publicidade online", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 141694, "titulo": "Applying Different Forms of Mentorship", "url": "https://spectrum.ieee.org/forms-of-engineering-mentorship", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-02T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a forma de solicitar mentorias e compara essa solicitação com a de se tornar um amigo. O autor pondera sobre a natureza estranha de pedir formalmente a alguém para ser seu mentor.", "titulo_pt": "Aplicando diferentes formas de mentoria", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 141485, "titulo": "Meta suddenly cares about kids", "url": "https://www.vox.com/podcasts/501732/meta-trial-settlement-children-social-media-mental-health-tiktok-youtube-snap", "fonte_id": "vox", "data_pub": "2026-09-02T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Por anos, pais de todo o país têm pedido a Congresso que faça algo sobre os efeitos prejudiciais das redes sociais na infância. Geralmente, quando há uma ação, bilionários CEOs de tecnologia são chamados a depor em Congresso e pais que perderam filhos para autolesões trazem fotos antigas dos filhos.", "titulo_pt": "Meta de repente se importa com crianças", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 141687, "titulo": "Wary of Artemis IV timeline, NASA is changing lunar spacesuit design", "url": "https://arstechnica.com/space/2026/09/wary-of-artemis-iv-timeline-nasa-is-changing-lunar-spacesuit-design/", "fonte_id": "ars_technica", "data_pub": "2026-09-02T19:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "NASA está alterando o design das spacesuits para a lua em resposta às preocupações sobre o cronograma da missão Artemis IV. As exigências estão sendo ajustadas para atender às necessidades das missões imediatas.", "titulo_pt": "NASA ajusta design das spacesuits para a lua devido à incerteza do cronograma de Artemis IV", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 141685, "titulo": "It sure looks like hackers breached a major ID card verification service", "url": "https://techcrunch.com/2026/09/02/it-sure-looks-like-hackers-breached-a-major-id-card-verification-service/", "fonte_id": "techcrunch", "data_pub": "2026-09-02T19:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um site de busca de roubos de identidade afirmou ter mais de 150 milhões de fotos de carteiras de motorista roubadas de um serviço de verificação de identidade. O site de crime fechou após fazer essa afirmação.", "titulo_pt": "Parece que hackers roubaram mais de 150 milhões de fotos de carteiras de motorista de um serviço de verificação de identidade", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 141631, "titulo": "Trump administration backs OpenAI in New York Times copyright battle", "url": "https://www.ft.com/content/d5d6e4c9-718a-4d98-b094-97157565f336?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-02T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos está pedindo ao tribunal que rejeite a reivindicação do New York Times de que é ilegal treinar modelos de inteligência artificial em conteúdo de direitos autorais.", "titulo_pt": "Administração trump apoia OpenAI em batalha judicial do New York Times sobre direitos autorais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 141691, "titulo": "Trump Administration Sides With OpenAI in New York Times Copyright Lawsuit", "url": "https://www.wired.com/story/trump-administration-sides-with-ai-giants-new-york-times-lawsuit/", "fonte_id": "wired", "data_pub": "2026-09-02T18:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos apoiou a argumentação da OpenAI de que o treinamento de IA em propriedade intelectual alheia constitui uso justo.", "titulo_pt": "Administração trump apoia OpenAI em litígio sobre direitos autorais do the New York Times", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 141692, "titulo": "ICE Plans to Pay $5 Million to Create National Voting Database", "url": "https://www.wired.com/story/ice-plans-to-pay-5-million-to-create-national-voting-database/", "fonte_id": "wired", "data_pub": "2026-09-02T18:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ICE, como parte de uma investigação mais ampla sobre supostos casos de fraude eleitoral pelo DHS, anunciou que vai gastar até US$ 5 milhões para criar um banco de dados nacional de eleitores.", "titulo_pt": "ICE planeja pagar us$ 5 milhões para criar banco de dados nacional de eleitores", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 141693, "titulo": "These Russian Mathematicians Taught AI Models How to Talk to Each Other Without Using Words", "url": "https://www.wired.com/story/russian-startup-mostik-ai-models-communication/", "fonte_id": "wired", "data_pub": "2026-09-02T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup chamada Mostik desenvolveu uma abordagem inovadora para combinar as capacidades de modelos de IA, permitindo que eles se comuniquem entre si sem o uso de palavras.", "titulo_pt": "Estes matemáticos russo ensinarão os modelos de IA a se comunicarem sem usar palavras", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 141688, "titulo": "Google releases Gemini 3.8 Flash, its third Flash model in six weeks", "url": "https://arstechnica.com/ai/2026/09/google-releases-gemini-3-8-flash-its-third-flash-model-in-six-weeks/", "fonte_id": "ars_technica", "data_pub": "2026-09-02T18:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou o Gemini 3.8 Flash, seu terceiro modelo desse tipo em seis semanas. As atualizações do modelo Pro parecem estar pausadas.", "titulo_pt": "Google libera Gemini 3.8 Flash, seu terceiro modelo neste período de seis semanas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 141700, "titulo": "Fish dads offer new insight into behavioral effects of receiving paternal care", "url": "https://phys.org/news/2026-09-fish-dads-insight-behavioral-effects.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo conduzido por uma cientista da Penn State descobriu que peixes criados por pais machos adultos sobrevivem melhor em situações de vida ou morte do que seus pares criados sem a presença de pais machos. O filme 'Procurando Nemo', que retrata um pai peixe protetor, pode refletir mais precisamente o comportamento real dos pais peixes do que se pensava anteriormente.", "titulo_pt": "Pais peixes oferecem novas luzes sobre os efeitos comportamentais da criação paterna", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141701, "titulo": "Making superconductors thinner can change how they accommodate magnetic fields", "url": "https://phys.org/news/2026-08-superconductors-thinner-accommodate-magnetic-fields.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa examina como o fenômeno da supercondutividade se altera quando o material supercondutor se torna muito fino, chegando a um ponto em que os elétrons não se comportam mais como se estivessem se movendo por um metal convencional tridimensional. O objetivo inicial foi entender por que a diminuição da espessura de uma película supercondutiva modifica a temperatura em que a supercondutividade aparece.", "titulo_pt": "Fazendo supercondutores mais finos muda como eles lidam com campos magnéticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141702, "titulo": "Hidden DNA in medieval gospels reveals history of deadly livestock virus", "url": "https://phys.org/news/2026-09-hidden-dna-medieval-gospels-reveals.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Manuscritos medievais famosos, como os Geraldo de York, foram descobertos como contêineres biológicos que revelam a história de 3.500 anos do vírus da peste ovina (SPPV).", "titulo_pt": "DNA oculto em evangelhos medievais revela história de vírus letal em animais de estimação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141420, "titulo": "“Oro blanco”: el alimento milenario que ayuda a restaurar la flora intestinal", "url": "https://www.lanacion.com.ar/salud/nutricion/oro-blanco-el-alimento-milenario-que-ayuda-a-restaurar-la-flora-intestinal-nid31082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T21:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O 'Oro blanco', um fermento composto por até 60 cepas de bacterias e levaduras, oferece benefícios para a saúde digestiva, imunológica e metabólica.", "titulo_pt": "Oro branco: o alimento milenar que auxilia na restauração da flora intestinal", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 141703, "titulo": "Harnessing gold nanorods and light for targeted cancer therapy", "url": "https://phys.org/news/2026-09-harnessing-gold-nanorods-cancer-therapy.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Indian Institute of Technology Gandhinagar desenvolveram uma plataforma baseada em nanorodas de ouro que entrega agentes terapêuticos específicos ao reticulero endoplasmático, estrutura responsável pela produção e processamento de proteínas dentro das células, e gera calor quando exposto à luz infravermelha próxima.", "titulo_pt": "Capturando nanorodas de ouro e luz para terapia antineoplásica direcionada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141202, "titulo": "Câncer de próstata: técnica para sequela que atinge 30% dos pacientes operados é destaque em congresso", "url": "https://veja.abril.com.br/saude/cancer-de-prostata-tecnica-para-sequela-que-atinge-30-dos-pacientes-operados-e-destaque-em-congresso/", "fonte_id": "veja", "data_pub": "2026-09-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma técnica chamada 'mini-jupette' foi apresentada em um congresso e é considerada eficaz para tratar os efeitos colaterais como climatúria, perda de urina durante o orgasmo e disfunção erétil em pacientes que passaram por cirurgia para o câncer de próstata.", "titulo_pt": "Técnica 'mini-jupette' é destaque no tratamento de efeitos colaterais após cirurgia para câncer de próstata", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 141704, "titulo": "PACMAN AI framework for controlling fusion systems safely makes key decisions in milliseconds", "url": "https://phys.org/news/2026-09-pacman-ai-framework-fusion-safely.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo framework de inteligência artificial desenvolvido por pesquisadores do Laboratório de Física de Plasma da Princeton e da Universidade de Princeton permite que decisões críticas sejam tomadas em milissegundos em sistemas de fusão nuclear, onde partículas extremamente quentes podem se tornar imprevisíveis rapidamente. Essa abordagem mantém a segurança da máquina e mantém os humanos responsáveis pelos objetivos gerais do sistema.", "titulo_pt": "Framework de IA do PACMAN para controle seguro de sistemas de fusão toma decisões cruciais em milissegundos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141705, "titulo": "NYC, the nation's largest school system, bans AI for students through 8th grade", "url": "https://phys.org/news/2026-09-nyc-nation-largest-school-ai.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Nova York anunciou uma proibição temporária do uso de ferramentas de inteligência artificial por estudantes do ensino fundamental e do ensino médio durante o próximo ano letivo. A medida foi anunciada pelo prefeito Zohran Mamdani.", "titulo_pt": "Nova york proíbe uso de AI para estudantes do ensino fundamental e médio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141707, "titulo": "Hubble tracks new decagon encircling Saturn's south pole", "url": "https://phys.org/news/2026-09-hubble-tracks-decagon-encircling-saturn.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Observações recentes com o Telescópio Espacial Hubble da NASA revelaram uma onda atmosférica gigante, evoluindo e com forma decagonal, envolvendo o polo sul de Saturno. Esta descoberta marca o primeiro registro de um padrão de jato regular com muitos lados na hemisfério sul do planeta.", "titulo_pt": "Hubble registra novo decágono em volta do polo sul de saturno", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141724, "titulo": "STAT+: Ultragenyx drug to treat Angelman syndrome, a rare disease, fails late-stage trial", "url": "https://www.statnews.com/2026/09/02/ultragenyx-drug-angelman-syndrome-clinical-trial/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-02T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ultragenyx informou que sua terapia experimental para o síndrome de Angelman, uma doença rara, não mostrou benefícios em comparação com um tratamento falso em uma fase 3 de ensaios clínicos.", "titulo_pt": "Terapia experimental para síndrome de Angelman, de empresa, falha em fase 3 de ensaios", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 141710, "titulo": "Ancient fossil from China reveals animal‑microbe partnerships dating back 550 million years", "url": "https://phys.org/news/2026-09-ancient-fossil-china-reveals-animalmicrobe.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fóssil antigo da China revela parcerias entre animais e microrganismos que datam de 550 milhões de anos. Essas parcerias são algumas das relações mais íntimas que os animais mantêm com microrganismos.", "titulo_pt": "Fóssil chinês revela parcerias entre animais e microrganismos há 550 milhões de anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141725, "titulo": "U.N. admits exceeding Paris Agreement’s 1.5-degree-C warming target is “unavoidable”", "url": "https://www.scientificamerican.com/article/un-admits-exceeding-paris-agreements-1-5-degrees-c-warming-target-is-unavoidable/", "fonte_id": "scientific_american", "data_pub": "2026-09-02T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com um novo relatório, o mundo está destinado a ultrapassar o limite de 1,5 grau Celsius estabelecido pelo Acordo de Paris nos próximos anos. A Organização das Nações Unidas admitiu que atingir esse objetivo é 'inevitável'.", "titulo_pt": "ONU admite que ultrapassar o limite de 1,5 grau celsius do acordo de Paris é 'inevitável'", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 141729, "titulo": "NASA Revamps Challenge Linking Community College Studies to Aerospace Careers", "url": "https://www.nasa.gov/learning-resources/linking-community-college-studies-to-aerospace-careers/", "fonte_id": "nasa_news", "data_pub": "2026-09-02T19:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA reformulou o desafio NCAS para comunidades de colégios técnicos dos Estados Unidos, oferecendo aos estudantes a chance de explorar carreiras em aeroespacial, ciência, engenharia e tecnologia. O desafio atualizado inclui aulas sobre a agência e suas missões, interação com especialistas da NASA e exploração de oportunidades de carreira.", "titulo_pt": "NASA renova desafio conectando estudos em colégios técnicos à carreira em aeroespacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 141015, "titulo": "New Hubble images reveal a bizarre decagon over Saturn’s south pole", "url": "https://www.sciencenews.org/article/hubble-decagon-saturn-south-pole", "fonte_id": "science_news", "data_pub": "2026-09-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram uma onda atmosférica decagonal no polo sul de Saturno, similar à hexágono notável localizado no polo norte.", "titulo_pt": "Novas imagens do Hubble revelam uma onda estranha decagonal no polo sul de saturno", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 141726, "titulo": "Scientists discover a mysterious wave shaped like a decagon in Saturn's atmosphere", "url": "https://www.scientificamerican.com/article/scientists-discover-a-mysterious-wave-shaped-like-a-decagon-in-saturns-atmosphere/", "fonte_id": "scientific_american", "data_pub": "2026-09-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram uma estrutura misteriosa na atmosfera de Saturno, com a forma de um decágono, que parece ter formado recentemente, mas a razão exata para isso ainda não é conhecida.", "titulo_pt": "Cientistas descobrem forma decagonal misteriosa na atmosfera de saturno", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 141727, "titulo": "How the super El Niño could turbocharge warming in the Himalayas", "url": "https://www.scientificamerican.com/article/how-the-super-el-nino-could-turbocharge-warming-in-the-himalayas/", "fonte_id": "scientific_american", "data_pub": "2026-09-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de uma das piores catástrofes naturais na história da região, a atenção está voltando para a iminente super El Niño.", "titulo_pt": "Como o super El Niño pode acelerar o aquecimento nas hímidias", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 141403, "titulo": "Qué hay detrás de la “ruta maldita” camino a la Virgen de Medjugorje y por qué mueren los peregrinos", "url": "https://www.lanacion.com.ar/lifestyle/que-hay-detras-de-la-ruta-maldita-camino-a-la-virgen-de-medjugorje-y-por-que-mueren-los-peregrinos-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T21:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A 'ruta maldita' é um percurso feito por fiéis anualmente em direção à Virgem de Medjugorje, onde ocorreriam aparições marianas, e que se tornou notório por vários acidentes de trânsito. Este percurso ganhou uma reputação negativa e mística devido a esses incidentes.", "titulo_pt": "O que há por trás da 'rotas maldita' no caminho para a virgem de Medjugorje e por que os peregrinos morrem", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 141419, "titulo": "La psicología explica la resiliencia de los nacidos en los años 60 y 70: “Fue un modelo de crianza marcado por la exigencia y la libertad”", "url": "https://www.lanacion.com.ar/salud/la-psicologia-explica-la-resiliencia-de-los-nacidos-en-los-anos-60-y-70-fue-un-modelo-de-crianza-nid31082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T21:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que a combinação de disciplina e autonomia na educação dos nascidos nas décadas de 1960 e 1970 contribuiu para a formação de uma forte capacidade de adaptação. Os acadêmicos atribuem essa resiliência à abordagem educacional de gerações passadas.", "titulo_pt": "A psicologia explica a resiliência dos nascidos nos anos 60 e 70: ‘foi um modelo de criação marcado pela exigência e liberdade’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 141200, "titulo": "“Excelência da arte dramática”, diz Mauro Alencar sobre Gracindo Jr.", "url": "https://veja.abril.com.br/cultura/excelencia-da-arte-dramatica-diz-mauro-alencar-sobre-gracindo-jr/", "fonte_id": "veja", "data_pub": "2026-09-02T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mauro Alencar, doutor em Teledramaturgia, enfatiza a importância do ator para a dramaturgia brasileira. Ele destaca a excelência do trabalho de Gracindo Jr. no campo artístico.", "titulo_pt": "Excelência do trabalho artístico", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 141116, "titulo": "George Clooney recebe Leão de Ouro e critica autoritarismo político hoje", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/george-clooney-recebe-leao-de-ouro-e-critica-autoritarismo-politico-hoje.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-02T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "George Clooney recebeu um Leão de Ouro honorário durante o 83º Festival de Cinema de Veneza e fez um discurso sobre a importância da arte em tempos de turbulência política.", "titulo_pt": "George Clooney recebe Leão de Ouro e critica autoritarismo
