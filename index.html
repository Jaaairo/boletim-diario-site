 "A"}, {"id": 274619, "titulo": "Quem é Manni L. Perez, atriz que dá vida a Lucia Caminos, protagonista de 'GTA 6'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/quem-e-manni-l-perez-atriz-que-da-vida-a-lucia-caminos-protagonista-de-gta-6.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T14:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Manni L. Perez, uma atriz americana de 34 anos, interpreta Lucia Caminos, uma das protagonistas do jogo 'Grand Theft Auto 6'. Ela é conhecida por sua carreira na televisão e reside em Nova York.", "titulo_pt": "Quem é Manni L. Perez, atriz que dá vida a Lucia Caminos, protagonista de 'GTA 6'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 274705, "titulo": "Empresário vira réu e tem prisão preventiva decretada por matar advogada", "url": "https://www.metropoles.com/sao-paulo/empresario-vira-reu-e-tem-prisao-preventiva-decretada-por-matar-advogada", "fonte_id": "metropoles", "data_pub": "2026-11-19T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Eric Conrado foi declarado réu e teve prisão preventiva decretada após ser acusado de matar a namorada, advogada, e o filho dela, de 6 anos.", "titulo_pt": "Empresário é declarado réu e tem prisão preventiva decretada por matar advogada e filho", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274707, "titulo": "Cleitinho é criticado nas redes por tirar mulher do comando da PM em Minas", "url": "https://www.metropoles.com/minas-gerais/cleitinho-e-criticado-nas-redes-por-tirar-mulher-do-comando-da-pm-em-minas", "fonte_id": "metropoles", "data_pub": "2026-11-19T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher criticou a decisão de Cleitinho de substituir a coronel Cleide, que era a primeira mulher a comandar a Polícia Militar em Minas Gerais. A internauta expressou tristeza com a saída da coronel.", "titulo_pt": "Cleitinho é criticado nas redes por tirar mulher do comando da PM em Minas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274711, "titulo": "Abandono em massa: dezenas de cães são largados na Granja do Torto", "url": "https://www.metropoles.com/distrito-federal/abandono-em-massa-dezenas-de-caes-sao-largados-na-granja-do-torto", "fonte_id": "metropoles", "data_pub": "2026-11-19T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dezenas de cães foram abandonados na Granja do Torto, segundo relatos de moradores. A comunidade busca pessoas interessadas em castrar e adotar os animais.", "titulo_pt": "Abandono em massa: dezenas de cães são largados na Granja do Torto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274766, "titulo": "Cidade de Goiás terá que pagar indenização por morte de jovem com meningite", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/go/cidade-de-goias-tera-que-pagar-indenizacao-por-morte-de-jovem-com-meningite/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade de Goiás terá que pagar uma indenização por causa da morte de um jovem que teve meningite. A justiça também determinou o pagamento de uma pensão mensal. A perícia concluiu que houve falhas na investigação dos sintomas apresentados pelo jovem em uma unidade de saúde de Senador Canedo, Goiás.", "titulo_pt": "Cidade de Goiás terá que pagar indenização por morte de jovem com meningite", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274820, "titulo": "Sueli Carneiro, Milton Santos e Carolina Maria de Jesus: as negras e negros que deveriam ser mais estudados nas escolas", "url": "https://www.bbc.com/portuguese/articles/c78drpvdl93o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-19T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É comum ativistas reclamarem que figuras negras importantes na história do Brasil são negligenciadas nas aulas de História. O texto apresenta alguns exemplos dessas figuras.", "titulo_pt": "Sueli Carneiro, Milton Santos e Carolina Maria de Jesus: as negras e negros que deveriam ser mais estudados nas escolas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 274774, "titulo": "Em 1938, Harvard começou a monitorar centenas de pessoas; a maior lição de longevidade não veio dos exames médicos, mas da amizade", "url": "https://www.cnnbrasil.com.br/curiosidades/em-1938-harvard-comecou-a-monitorar-centenas-de-pessoas-a-maior-licao-de-longevidade-nao-veio-dos-exames-medicos-mas-da-amizade/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1938, a Harvard iniciou um estudo que monitorou centenas de pessoas ao longo do tempo. A maior lição sobre longevidade não veio dos exames médicos, mas sim da importância da amizade. A solidão prolongada tem efeitos nocivos comparáveis ao fumar ou ao consumo excessivo de álcool, conforme pesquisas da Harvard indicam.", "titulo_pt": "Em 1938, Harvard começou a monitorar centenas de pessoas; a maior lição de longevidade veio da amizade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274776, "titulo": "Homem é preso por feminicídio de tatuadora encontrada em praça de SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/preso-morte-tatuadora-capital/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marcelo Cunha Massari, de 51 anos, foi preso por feminicídio após a tatuadora Bianca Karolayne Garbo ser encontrada morta em uma praça de São Paulo. Amigas e familiares relataram que a vítima vivia um relacionamento abusivo e recebia ameaças.", "titulo_pt": "Homem é preso por feminicídio de tatuadora encontrada em praça de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274909, "titulo": "Um ano após lei, pacientes com doença de Crohn e retocolite tem diagnóstico tardio", "url": "https://www.jota.info/coberturas-especiais/um-ano-apos-lei-pacientes-com-doenca-de-crohn-e-retocolite-tem-diagnostico-tardio", "fonte_id": "jota", "data_pub": "2026-11-19T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ano após a lei, pacientes com doença de Crohn e retocolite continuam a ter diagnóstico tardio e enfrentam demora no tratamento, segundo relatos em debate na Casa JOTA. Além disso, há ainda falta de integração entre os sistemas do SUS.", "titulo_pt": "Um ano após lei, pacientes com doença de Crohn e retocolite têm diagnóstico tardio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 275052, "titulo": "Paro de camioneros: el método sí importa", "url": "https://www.ciperchile.cl/2026/11/19/paro-de-camioneros-el-metodo-si-importa/?utm_source=rss&utm_medium=rss&utm_campaign=paro-de-camioneros-el-metodo-si-importa", "fonte_id": "ciper_chile", "data_pub": "2026-11-19T12:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo 'Paro de camioneros: el método sí importa' foi publicado originalmente no CIPER Chile. Não há detalhes adicionais sobre o conteúdo do artigo.", "titulo_pt": "Paralisação de caminhoneiros: o método sim importa", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 273853, "titulo": "Troca de tiros na Marginal Pinheiros: polícia mata 2 suspeitos de roubos", "url": "https://www.metropoles.com/sao-paulo/troca-de-tiros-na-marginal-pinheiros-policia-mata-2-suspeitos-de-roubos", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas pessoas suspeitas de roubos foram mortas durante uma troca de tiros com a polícia na Marginal Pinheiros. A dupla fugiu por cerca de 5 quilômetros antes de ser confrontada pelos policiais da Caep.", "titulo_pt": "Troca de tiros na Marginal Pinheiros: polícia mata dois suspeitos de roubos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273973, "titulo": "\"Dejé a un lado mi orgullo y volví a vivir con mis padres después de quedarme sin trabajo. Me alegro de haberlo hecho\"", "url": "https://www.clarin.com/estados-unidos/deje-lado-orgullo-volvi-vivir-padres-despues-quedarme-trabajo-alegro-haberlo-hecho_0_YKOddn6cHj.html", "fonte_id": "clarin", "data_pub": "2026-11-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Erika Lindquist perdeu seu emprego em Nova York, retornou para viver com os pais após meses de busca por outro trabalho e, no que inicialmente foi visto como uma derrota, acabou encontrando o espaço necessário para reconstruir sua carreira e confiança.", "titulo_pt": "Deixei meu orgulho de lado e retornei para viver com meus pais após perder o emprego", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 272784, "titulo": "More rational antibiotic use needed, hospital says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868008", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hospital enfatiza a necessidade de um uso mais racional de antibióticos. A instituição destaca a importância de uma utilização correta para evitar a resistência aos medicamentos.", "titulo_pt": "Mais uso racional de antibióticos necessário, diz hospital", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272785, "titulo": "Legalize cancer drug fund: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868009", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos estão pedindo a legalização de um fundo para medicamentos contra o câncer.", "titulo_pt": "Legalize fundo para medicamentos contra o câncer: grupos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "sociedade__eventos": [{"titulo": "Feriado da Consciência Negra: veja o que abre e fecha em São Paulo", "sumario": "Em São Paulo, o Poupatempo e as unidades do Detran não terão atendimento presencial durante o feriado da Consciência Negra. A maioria dos serviços públicos funcionará parcialmente e alguns serão interrompidos durante o feriado da Consciência Negra no Distrito Federal. O Dia da Consciência Negra, comemorado nesta sexta-feira (20), pode proporcionar uma folga que emenda com o fim de semana para muitos trabalhadores.", "artigos": [{"id": 274762, "titulo": "Feriado da Consciência Negra: veja o que abre e fecha em São Paulo", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/feriado-da-consciencia-negra-veja-o-que-abre-e-fecha-em-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em São Paulo, o Poupatempo e as unidades do Detran não terão atendimento presencial durante o feriado da Consciência Negra. O transporte público funcionará com operação especial e os museus estaduais funcionarão em horários variados.", "titulo_pt": "Feriado da Consciência Negra: veja o que abre e fecha em São Paulo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273850, "titulo": "Feriado da Consciência Negra: o que abre e o que fecha no DF", "url": "https://www.metropoles.com/distrito-federal/feriado-da-consciencia-negra-o-que-abre-e-o-que-fecha-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria dos serviços públicos funcionará parcialmente e alguns serão interrompidos durante o feriado da Consciência Negra no Distrito Federal.", "titulo_pt": "Feriado da Consciência Negra: o que abre e o que fecha no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273746, "titulo": "Veja quais são os direitos de quem trabalha no feriado da Consciência Negra", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/veja-quais-sao-os-direitos-de-quem-trabalha-no-feriado-da-consciencia-negra.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dia da Consciência Negra, comemorado nesta sexta-feira (20), pode proporcionar uma folga que emenda com o fim de semana para muitos trabalhadores. A lei garante que, se forem convocados para trabalhar, eles têm direito a receber o dia em dobro ou a obter uma folga compensatória.", "titulo_pt": "Veja quais são os direitos de quem trabalha no feriado da Consciência Negra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}]}], "meio_ambiente": [{"id": 275297, "titulo": "Advocates ask candidates for clear climate policies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868073", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados pedem aos candidatos políticos que apresentem políticas claras sobre o clima. O objetivo é garantir que os candidatos estejam preparados para lidar com questões ambientais de forma transparente e eficaz.", "titulo_pt": "Advogados pedem políticos clareza sobre políticas climáticas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 274900, "titulo": "Dejaron un carnero suelto en una isla y 40 años después se volvió una amenaza para el ecosistema", "url": "https://www.lanacion.com.ar/lifestyle/dejaron-un-carnero-suelto-en-una-isla-y-40-anos-despues-se-volvio-una-amenaza-para-el-ecosistema-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T17:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um muflon foi introduzido em Tenerife com fins de caça, mas 40 anos depois, o animal se tornou uma ameaça ao ecossistema local, colocando em risco a sobrevivência de espécies vegetais endêmicas únicas.", "titulo_pt": "Deixaram um muflon solto em uma ilha e 40 anos depois ele se tornou uma ameaça ao ecossistema", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274587, "titulo": "Copel vê nova era para hidrelétricas com avanço da energia solar e eólica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/copel-ve-nova-era-para-hidreletricas-com-avanco-da-energia-solar-e-eolica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço da geração solar e eólica no Brasil criou novas oportunidades para o setor de hidrelétricas, conforme destacado no Copel Day, encontro de executivos da Copel com investidores e analistas em Nova York.", "titulo_pt": "Nova era para hidrelétricas com avanço de energia solar e eólica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 275023, "titulo": "Making Oil Companies Pay for Climate Damages", "url": "https://www.theatlantic.com/podcasts/2026/11/suing-our-way-out-of-climate-change/689500/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-19T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte decidiu se cidades e condados podem processar as grandes empresas de petróleo por danos climáticos.", "titulo_pt": "Suprema corte decidirá se cidades e condados podem processar as grandes empresas de petróleo por danos climáticos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 275240, "titulo": "COP31 negotiators publish revised deal text with no mention of fossil fuels", "url": "https://www.japantimes.co.jp/environment/2026/11/19/climate-change/cop-fossil-fuel-language/", "fonte_id": "japan_times", "data_pub": "2026-11-19T12:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira versão do acordo incluía duas referências a combustíveis fósseis e à limitação de seu uso, um tema que divide as nações nas negociações anuais. Os negociadores da COP31 publicaram uma nova proposta sem menção a combustíveis fósseis.", "titulo_pt": "Negociadores da COP31 publicam novo texto de acordo sem mencionar combustíveis fósseis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 275272, "titulo": "Indonesia’s forest protection plan praised by Leonardo DiCaprio. Will it work?", "url": "https://www.scmp.com/week-asia/health-environment/article/3375097/indonesias-forest-protection-plan-praised-leonardo-dicaprio-will-it-work", "fonte_id": "scmp", "data_pub": "2026-11-19T11:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia prometeu parar a desmatamento para produção de alimentos e reutilizar terras degradadas, ganhando elogios do ator Leonardo DiCaprio, que considerou a medida histórica. No entanto, especialistas em meio ambiente argumentam que o plano é vago e pode até enfraquecer os ecossistemas vulneráveis.", "titulo_pt": "Plano de proteção florestal da indonésia ganha elogios de Leonardo DiCaprio, mas especialistas têm dúvidas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274978, "titulo": "Race to replant five South African baobabs after export blocked", "url": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "fonte_id": "guardian_world", "data_pub": "2026-11-19T11:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco baobá de centenas de anos foram arrancados sem os permissoes necessárias e tentaram ser exportados para a Geórgia. Agora, ambientalistas sul-africanos estão empenhados em replantar as árvores e fornecer apoio para seu recuperação.", "titulo_pt": "Corrida para replantar cinco baobás sul-africanos após exportação bloqueada", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 274049, "titulo": "Morgan Freeman compró un campo de 50 hectáreas y lo transformó en un santuario gigante para salvar a las abejas", "url": "https://www.lanacion.com.ar/espectaculos/morgan-freeman-compro-un-campo-de-50-hectareas-y-lo-transformo-en-un-santuario-gigante-para-salvar-a-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2014, o ator Morgan Freeman adquiriu uma propriedade de 50 hectares e a transformou em um santuário para a proteção das abelhas. Ele iniciou esta iniciativa após desenvolver o interesse pela apicultura como novo hobby.", "titulo_pt": "Morgan Freeman compra propriedade de 50 hectares e transforma em santuário para salvar as abelhas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274337, "titulo": "Thai floods expose waste pollution in ‘garbage dump’ region", "url": "https://www.japantimes.co.jp/news/2026/11/19/asia-pacific/science-health/thai-floods-pollution-garbage-dump/", "fonte_id": "japan_times", "data_pub": "2026-11-19T07:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prachinburi, localizada entre Bangkok e a principal zona industrial do leste do país, tem enfrentado preocupações sobre a poluição por resíduos há muito tempo. As inundações recentes expuseram esses problemas ambientais na região conhecida como ‘área de descarte de lixo’.", "titulo_pt": "Inundações expõem poluição de resíduos na região de descarte de lixo do tailândia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 273825, "titulo": "COP31: penúltimo dia foca em implementação climática; negociações entram na reta final", "url": "https://exame.com/esg/cop31-penultimo-dia-foca-em-implementacao-climatica-negociacoes-entram-na-reta-final/", "fonte_id": "exame", "data_pub": "2026-11-19T06:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O penúltimo dia da COP31 focou em debates sobre investimentos, justiça climática e soluções práticas. As negociações estão na reta final e a conferência termina oficialmente na sexta-feira.", "titulo_pt": "COP31: penúltimo dia foca em implementação climática; negociações entram na reta final", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 273939, "titulo": "Titularidade compartilhada de licenças ambientais: novas veredas em Minas Gerais", "url": "https://www.jota.info/opiniao-e-analise/artigos/titularidade-compartilhada-de-licencas-ambientais-novas-veredas-em-minas-gerais", "fonte_id": "jota", "data_pub": "2026-11-19T04:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O decreto reconhece a compartilhada responsabilidade no licenciamento ambiental em Minas Gerais. Pode servir como modelo para outros estados.", "titulo_pt": "Titularidade compartilhada de licenças ambientais: novas veredas em Minas Gerais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 275293, "titulo": "Myanmar guilty of genocide: top UN court", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/20/2003868065", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal mais alto das Nações Unidas declarou que a Myanmarese é responsável por genocídio. O julgamento se referiu a acusações de violações graves dos direitos humanos cometidas pelo governo do país contra minorias étnicas.", "titulo_pt": "Myanmar condenada a genocídio: tribunal mais alto das nações unidas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275302, "titulo": "Indigenous groups call for consent rights to be upheld", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868078", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos indígenas estão pedindo que os direitos de consentimento sejam mantidos. A chamada ocorre em um contexto não especificado, mas destaca a importância do respeito às decisões indígenas.", "titulo_pt": "Grupos indígenas exigem manutenção de direitos de consentimento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275148, "titulo": "Four British men guilty of sexually abusing woman drugged by husband", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/four-british-men-guilty-of-sexually-abusing-woman-drugged-by-husband_6784516_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro homens britânicos foram condenados por estupro e assédio sexual em um caso que lembra o julgamento de 2024 de Dominique Pelicot e outros 50 homens em França.", "titulo_pt": "Quatro homens britânicos culpados de estupro e assédio sexual de mulher drogada pelo marido", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 274765, "titulo": "Justiça torna réus acusados por incêndio que matou 11 em pousada do RS", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/justica-torna-reus-acusados-po-incendio-que-matou-11-em-pousada-do-rs/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram acusadas de responsabilidade pelo incêndio que matou 11 pessoas em uma pousada no Centro de Porto Alegre, ocorrido em abril de 2024. A pousada abrigava pessoas em situação de vulnerabilidade social.", "titulo_pt": "Justiça acusa réus por incêndio que matou 11 em pousada do RS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274690, "titulo": "Pais são condenados a até 87 anos de prisão pela morte e tortura do próprio filho de dois anos", "url": "https://veja.abril.com.br/brasil/pais-sao-condenados-a-ate-87-anos-de-prisao-pela-morte-e-tortura-do-proprio-filho-de-dois-anos/", "fonte_id": "veja", "data_pub": "2026-11-19T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os pais foram condenados a até 87 anos de prisão pelo assassinato e tortura de seu próprio filho de dois anos. O crime ocorreu em março de 2024 e a decisão ainda pode ser recorrida no Tribunal de Justiça.", "titulo_pt": "Pais condenados a até 87 anos de prisão pela morte e tortura do próprio filho de dois anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 274809, "titulo": "Quase uma em cada quatro crianças no mundo vivem em áreas de conflito", "url": "https://www.dw.com/pt-br/quase-uma-em-cada-quatro-crianças-no-mundo-vivem-em-áreas-de-conflito/a-79991426?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-19T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Save the Children indica que 589 milhões de crianças vivem em áreas de conflito, um recorde. O aumento de mortes, sequestros e ataques, combinado com bloqueios à assistência humanitária, é uma preocupação crescente.", "titulo_pt": "Quase uma em cada quatro crianças no mundo vivem em áreas de conflito", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 275193, "titulo": "What the ICJ genocide ruling means for the Rohingya people", "url": "https://www.aljazeera.com/news/2026/11/19/what-the-icj-ruling-means-for-the-rohingya?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta é a primeira vez que o tribunal emitiu uma decisão de que um estado cometeu genocídio. O julgamento aborda o caso dos rohingya.", "titulo_pt": "O que a decisão do ICJ sobre genocídio significa para o povo Rohingya", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 275051, "titulo": "Sitios de memoria con mil pesos de presupuesto: lo que hay detrás", "url": "https://www.ciperchile.cl/2026/11/19/sitios-de-memoria-con-mil-pesos-de-presupuesto-lo-que-hay-detras/?utm_source=rss&utm_medium=rss&utm_campaign=sitios-de-memoria-con-mil-pesos-de-presupuesto-lo-que-hay-detras", "fonte_id": "ciper_chile", "data_pub": "2026-11-19T13:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute sobre os sites de memorial com um orçamento de mil pesos, explorando o que está por trás desses projetos.", "titulo_pt": "Sites de memória com mil pesos de orçamento: o que está por trás?", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 275145, "titulo": "Prosecutor seeks 4 to 6 years in prison for French officers accused of beating Black man", "url": "https://www.lemonde.fr/en/france/article/2026/11/19/prosecutor-urges-court-to-jail-policemen-who-beat-up-black-man-for-4-to-6-years_6784351_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T12:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O promotor pediu de 4 a 6 anos de prisão para três policiais franceses acusados de agredir Michel Zecler em Paris em 2020. Zecler afirmou que os policiais usaram termos racistas durante a agressão.", "titulo_pt": "Promotor pede 4 a 6 anos de prisão para policiais acusados de agredir homem negro em paris", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 275139, "titulo": "Myanmar guilty of genocide against Rohingya, top UN court rules", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/icj-rules-that-myanmar-committed-genocide-against-rohingya-muslims_6784320_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T12:32:00Z", "idioma": "en", "provavel_duplicata_de": 275134, "texto_pt": "A Corte Internacional de Justiça declarou que aMyanmar cometeu genocídio contra o povo rohingya. Este é o primeiro caso em que a corte reconheceu genocídio desde sua fundação há 80 anos.", "titulo_pt": "Myanmar condenado a genocídio contra Rohingya, decide maior tribunal das nações unidas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 275241, "titulo": "Top U.N. court finds Myanmar committed state-sponsored genocide against Muslim Rohingya", "url": "https://www.japantimes.co.jp/news/2026/11/19/asia-pacific/myanmar-rohingya-genocide/", "fonte_id": "japan_times", "data_pub": "2026-11-19T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal da ONU encontrou que a Myanamar cometeu genocídio estatal contra o Rohingya muçulmano. Foi a primeira vez que o tribunal atribuiu responsabilidade por genocídio a um estado.", "titulo_pt": "Corte da ONU encontra myanamar cometera genocídio estatal contra o Rohingya muçulmano", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 273852, "titulo": "Pastor que torturava e abusava de fiéis é condenado a 100 anos de prisão", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pastor-que-torturava-e-abusava-de-fieis-e-condenado-a-100-anos-de-prisao", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Gonçalves da Silva, líder da comunidade Shekinah House Church em Paço do Lumiar, Maranhão, foi condenado a 100 anos de prisão por torturar e abusar sexualmente de fiéis.", "titulo_pt": "Pastor condenado a 100 anos de prisão por torturar e abusar de fiéis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274412, "titulo": "2 men sentenced to prison terms over killing of film director", "url": "https://en.yna.co.kr/view/AEN20261119007300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois homens foram condenados a pena de prisão por agressão e assassinato de um diretor de cinema.", "titulo_pt": "Dois homens condenados por assassinato de diretor de cinema", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274092, "titulo": "One in four women globally unable to refuse sex within marriage, says UN", "url": "https://www.theguardian.com/global-development/2026/nov/19/women-girls-rights-rape-sexual-violence-africa-marriage-unfpa", "fonte_id": "guardian_world", "data_pub": "2026-11-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um em cada quatro mulheres no mundo inteiro não têm poder para negar consentimento sexual se seu marido ou parceiro exigir. Em África ocidental e central, quase metade das mulheres (45%) não podem dizer não em suas próprias casamentos, de acordo com um relatório da UNFPA.", "titulo_pt": "Um em quatro mulheres globalmente não conseguem negar consentimento sexual, diz ONU", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 274195, "titulo": "A new antisemitism law sparks controversy in Italy", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/a-new-antisemitism-law-sparks-controversy-in-italy_6784120_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T03:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei aprovada em 17 de novembro define antisemitismo de uma maneira que, segundo seus críticos, confunde a distinção entre discurso de ódio contra judeus e crítica à política israelense.", "titulo_pt": "Nova lei sobre antisemitismo causa controvérsia na Itália", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 274029, "titulo": "Libertarios amenazan con acusación constitucional contra Chomali tras rechazo de indicación para restringir financiamiento de tratamientos hormonales en menores", "url": "https://www.latercera.com/politica/noticia/libertarios-amenazan-con-acusacion-constitucional-contra-chomali-tras-rechazo-de-indicacion-para-restringir-financiamiento-de-tratamientos-hormonales-en-menores/", "fonte_id": "la_tercera", "data_pub": "2026-11-19T02:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os deputados Hans Marowski e Pier Karle aiwan", "classe": "B"}], "destaque": {"titulo_evento": "Encontro Inédito entre Trump, Xi e Putin", "texto_pt": "O encontro inédito entre os líderes dos Estados Unidos, Donald Trump, da Rússia, Vladimir Putin, e da China, Xi Jinping, na Cúpula APEC em Shenzhen, China, em 19 de novembro de 2026, gerou grande interesse geopolítico. A reunião, apesar de ter sido descrita como 'revolucionária' por Trump, não gerou expectativas significativas para resultados concretos, segundo analistas. Trump, que aparentemente adormeceu durante a fala de Xi, chamou Putin de 'amigo' e se reuniu individualmente com ambos os líderes. O encontro abordou temas como riscos nucleares, fluxos energéticos e reformas da ONU. Este encontro histórico foi visto como um passo importante na diplomacia internacional, mas não produziu avanços significativos em termos de políticas externas. Os desdobramentos políticos e econômicos desta reunião permanecem a serem observados, com especial atenção para as relações entre os três países e suas implicações globais.", "data_edicao": "2026-11-19", "artigos": [{"id": 274980, "titulo": "Trump accused of falling asleep during Xi Jinping speech at Apec summit in China", "url": "https://www.theguardian.com/us-news/2026/nov/19/trump-apec-asleep-china", "fonte_id": "guardian_world", "data_pub": "2026-11-19T17:12:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "O presidente dos Estados Unidos, Donald Trump, foi acusado novamente de adormecer durante uma cerimônia, desta vez durante a fala do presidente chinês, Xi Jinping, no APEC em China. Trump aparentemente fechou os olhos por cerca de 10 segundos, com a cabeça inclinada para baixo e as mãos cruzadas no peito.", "titulo_pt": "Trump acusado de adormecer durante discurso de Xi Jinping em cúpula Apec na China", "texto_pt": "O presidente dos Estados Unidos, Donald Trump, foi acusado novamente de adormecer durante uma cerimônia, desta vez durante a fala do presidente chinês, Xi Jinping, no APEC em China. Trump aparentemente fechou os olhos por cerca de 10 segundos, com a cabeça inclinada para baixo e as mãos cruzadas no peito.", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 275186, "titulo": "Trump and Putin ‘hijacked’ China summit", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/19/trump-and-putin-hijacked-china-summit?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T17:02:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "Trump e Putin teriam desviado a atenção das discussões planejadas durante as negociações trilaterais, segundo Einar Tangen.", "titulo_pt": "Trump e Putin 'subtraíram' a cúpula da China", "texto_pt": "Trump e Putin teriam desviado a atenção das discussões planejadas durante as negociações trilaterais, segundo Einar Tangen.", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 275200, "titulo": "‘Groundbreaking’ Trump-Xi-Putin summit: Five key takeaways", "url": "https://www.aljazeera.com/news/2026/11/19/groundbreaking-trump-xi-putin-summit-five-key-takeaways?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T13:13:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "Líderes celebraram o encontro inédito, que abordou temas como riscos nucleares e fluxos energéticos.", "titulo_pt": "Encontro inédito entre trump, xi e putin: cinco pontos-chave", "texto_pt": "Líderes celebraram o encontro inédito, que abordou temas como riscos nucleares e fluxos energéticos.", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 275212, "titulo": "Xi, Trump and Putin hail ‘groundbreaking’ meeting", "url": "https://www.ft.com/content/3fde6008-d9c4-46a3-89f8-0f7611cd9b3a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T13:00:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Representantes de China, Estados Unidos e Rússia concordaram em discutir a proliferação nuclea function renderSecao(topico) {

function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {

  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
