<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

<script>
const D = {"gerado_em": "22/11/2026 15:30", "stats": {"noticias_novas": 585, "resumos_gerados": 251}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-presidente Jair Bolsonaro permanece internado em uma Unidade de Terapia Intensiva (UTI) sem previsão de alta, devido a um abdômen agudo obstrutivo, conforme informou o boletim médico. Michelle Bolsonaro relatou que o ex-presidente passou a noite sem dor e andou pelo hospital. Políticos de direita, incluindo Flávio Bolsonaro e Damares Alves, publicaram mensagens de apoio. O governo Lula prepara uma política de proteção a mulheres na vida pública, que deve ser incluída no plano nacional ainda em 2026. A COP31 terminou sem acordo devido a divergências sobre o abandono dos combustíveis fósseis. O ministro Moraes autorizou a retirada da tornozeleira eletrônica de Bolsonaro durante sua internação hospitalar. A deputada Talíria Petrone relatou ter recebido ameaças de morte e violência sexual durante sua última campanha eleitoral.", "mundo": "As negociações da COP31 em Ancara, na Turquia, se desintegraram após um conflito sobre a menção a combustíveis fósseis. Isso resultou em um fracasso na conclusão de um acordo climático. Os participantes, incluindo a Europa e países vulneráveis, recusaram um acordo proposto após a Arábia Saudita e outros produtores de petróleo impediram qualquer referência à descontinuação do carvão, petróleo e gás. As discussões se estenderam, se tornando a mais longa na história dos summit, com o presidente Murat Kurum reconhecendo que não havia acordo sobre o texto final. Além disso, o Paris Saint-Germain venceu o Nice por 3 a 2, mantendo sua liderança na Ligue 1, mas sofreu uma baixa com a lesão grave no joelho do atacante Désiré Doué, que o afastará das atividades por vários meses. Em outro evento, um navio russo em uma base naval na costa leste da Líbia foi atingido por uma suposta ação de drone, causando ao menos duas mortes e quatro feridos em Tobruk, próximo a Kyiv.\n\nA COP31, ou Conferência das Nações Unidas sobre Mudanças Climáticas, falhou pela primeira vez desde 2009 em alcançar um acordo político, refletindo a dificuldade das nações em tomar ações ambiciosas para enfrentar as consequências do clima, como ondas de calor, incêndios florestais, inundações e tempestades intensas. A rejeição do projeto de acordo proposto pelos presidentes da Turquia e Austrália, considerado insuficiente para combater o aquecimento global, expôs a crise da Convenção do Clima da ONU. Paralelamente, a China acusou os Estados Unidos de perseguir gigantes de telecomunicações chineses, afirmando que as restrições impostas prejudicam as relações comerciais entre os dois países. A guerra legal do Partido Comunista Chinês continua, enquanto a Taiwan advertiu o Canadá sobre a dependência do país em relação à China, alertando sobre as possíveis consequências dessa dependência para as relações internacionais. Além disso, ataques com drones e incêndios em veículos palestinos na Cisjordânia continuam a intensificar o conflito, com o presidente ucraniano Zelenskyy pedindo ao Estados Unidos a liberação de misseis Patriot para enfrentar a invasão russa.", "economia": "A economia global enfrenta diversos desafios, com destaque para a crise na mineração chilena e as incertezas econômicas na Argentina. O PIB do Chile registrou a maior retração desde 2020, caindo 1,8% no terceiro trimestre, conforme informado pelo Banco Central. Por outro lado, a Bolsa de Valores da China anunciou planos para flexibilizar as exigências de financiamento de operações com margem e reduzir tarifas, buscando sustentar as ações em queda. Na Argentina, os rendimentos dos títulos soberanos dispararam nos últimos quatro meses, refletindo incertezas sobre o governo do presidente Javier Milei e sobre os planos para quitar a dívida. Além disso, a Nscale, uma operadora de centros de dados no Reino Unido, está pausando o processo de contratação, exceto para posições críticas, e reduzindo suas despesas em preparação para uma oferta inicial de ações planejada no valor de 35 bilhões de dólares. Essa medida surge após a fraca performance das ações de empresas que adotaram um modelo incomum de IPO, como a Anthropic, que teve uma performance questionável após a emissão de ações.", "tecnologia": "Bancos taiwaneses estão utilizando inteligência artificial para prevenir ataques cibernéticos, fortalecendo a segurança digital dos bancos locais. Em outro desenvolvimento, voos da Delta entraram e saíram significativamente atrasados em Atlanta no domingo devido a um problema técnico no sistema de peso e balanço dos aviões, afetando milhares de voos no aeroporto mais movimentado do mundo. A tecnologia da informação também está sendo explorada em diferentes contextos, como o uso de inteligência artificial em testes A/B entre robôs e humanos em contextos de mobilidade, e na discussão sobre a ética da inteligência artificial. Ainda, a Starlink ultrapassou a TIM em acessos de banda larga fixa no Brasil, liderando o mercado de satélites, mas ainda representando um nicho pequeno no mercado tradicional de banda larga fixa. Além disso, a discussão sobre a ética da inteligência artificial continua, com debates sobre a responsabilidade de grandes instituições financeiras com relação a bots de terceiros e a necessidade de governança e escalabilidade dos dados em escolas de inovação que buscam se tornar universidades nativas de IA.", "ciencia": "O matemático Claude decifrou um dos maiores mistérios da matemática, conforme relatório. Em outra descoberta científica, um time de pesquisa quantificou um componente importante do ciclo global de nitrogênio, revelando que o nitrogênio orgânico atmosférico emerge como uma importante fonte de nutrientes para os oceanos globais. O filósofo Michael Marder propôs um novo Iluminismo que considere as plantas como modelo de pensamento, em uma época de desorientação. A missão espacial BepiColombo, conjunta da Europa e do Japão, entrou na órbita de Mercúrio após oito anos de viagem, revelando mistérios desse planeta mais próximo do Sol. A NASA lançou um novo álbum de sons criados a partir das observações da formação estelar, enquanto pesquisadores usaram uma única fotônica e medição de tempo para verificar uma localização, o que poderia ser uma nova forma de proteção contra enganadores digitais. Além disso, um estudo clínico em fase III indicou que um medicamento para disfunção erétil pode ter potencial para o tratamento de Alzheimer. A China prepara uma missão de pouso em Calisto, lua de Júpiter, buscando parcerias para experimentos embarcados. A maior sombra total solar deste século será uma experiência única, mas observá-la em Luxor, Egito, pode não ser tão simples quanto se imagina. Um estudo recente publicado pela Cambridge University Press indica a possibilidade de escrita antiga ter existido em tecidos periféricos, sugerindo que a seda já era um commodity valioso na sociedade antiga Shu. Astrônomos registraram o momento em que uma estrela gigante engoliu outra estrela ao vivo, após o contato, levando cerca de sete anos para as duas estrelas se unirem em um único astro. Além disso, a ONU promete reformar as negociações climáticas após reconhecer que a COP31 produziu resultados limitados, enquanto a União Europeia e outros países recusaram-se a endossar um pacto que omitiu os combustíveis fósseis.", "cultura": "O filme 'Hunger Games: A Esperança - Parte 1' estreou com bilheteria recorde de US$ 120 milhões, reativando a franquia 'Hunger Games' e consolidando a Lionsgate como uma produtora de sucesso. Em outra notícia, Rian Johnson expressou esperança sobre o futuro do cinema independente, citando o YouTube como uma plataforma eficaz para novos cineastas, comparando-o ao papel que o Sundance teve nos anos 1980. Janaina Leite, pesquisadora brasileira, criou um espetáculo performativo que integra elementos autobiográficos, IA e memória de tragédia aérea, explorando temas complexos em sua obra. No universo do cinema, Arthur Harari, diretor de 'The Unknown', expressou preocupação com a utilização de inteligência artificial em produções, apesar de ter usado uma ferramenta de deepfake para uma cena dupla no filme. Finalmente, a dupla Chitãozinho & Xororó anunciou aposentadoria dos palcos após 56 anos de carreira, marcando um fim icônico na história da música sertaneja.", "sociedade": "Um temporal no Rio Grande do Sul causou uma tragédia, resultando em cinco mortes, 265 feridos e mais de 20 mil desalojados, levando a instalação de um posto médico avançado pelo SUS em Tupanciretã. Em outro acidente, quatro pessoas morreram e uma ficou ferida em um carro que bateu contra uma árvore em Pernambuco. No Brasil, famílias de baixa renda e mulheres são alvo de quadrilhas em condomínios do Minha Casa, Minha Vida. No exterior, protestos em França e Portugal exigem aumentos salariais e medidas para combater o aumento dos custos de vida. No México, a Cidade do México propôs que as moradias sociais tenham pelo menos 60 m² para atender às necessidades das famílias e facilitar o trabalho remoto.", "meio_ambiente": "O evento mais importante dos artigos é a COP31, que está enfrentando dificuldades para chegar a um consenso sobre combustíveis fósseis. As negociações, que deveriam ter terminado no prazo oficial, ainda não chegaram a um acordo, com representantes de 130 países ausentes e os sauditas em posição contrária. O conflito sobre a transição das energias fósseis para energias renováveis persiste, com várias nações, incluindo França e Panamá, reiterando a necessidade de um acordo que inclua uma transição clara e firme. O Brasil e Argentina discutem as ações já implementadas, como a adoção de uma gasolina com 30% de etanol a partir de agosto de 2025, mas a demora na atualização da legislação no Brasil resulta em prejuízos para a sociedade. Além disso, a falta de resolução sobre combustíveis fósseis aumenta o risco de fracasso das negociações, com a plenária agendada para apresentar a versão final do texto às 9h no domingo em Belém.", "direitos_humanos": "Mexicanos foram violentamente arrastados pelo ICE durante o embarque em um voo nos EUA, conforme relatado pelo Metrópoles. O governador de Washington criticou a ação da ICE e pediu o fim da agência. Em outro desenvolvimento, ativistas e legisladores franceses estão pedindo que o uso de gás lacrimogênico seja suspenso durante protestos, após relatos de alterações nos ciclos menstruais e outros problemas de saúde reprodutiva, conforme informado pelo South China Morning Post. No entanto, cientistas ainda não confirmaram uma ligação médica entre o gás lacrimogênico e esses efeitos. Em Gaza, crianças com diabetes enfrentam dificuldades para obter insulina e suprimentos de teste de glicose sanguínea, segundo relatos do Al Jazeera. Além disso, Irène Sapir, uma figura localmente conhecida por ter escapado da deportação durante a operação Vél d'Hiv em 1942, teve sua escola renomeada em sua homenagem em Bergerac, França, mas os conselheiros do partido RN de Marine Le Pen votaram contra a renomeação, causando controvérsia, conforme relatado pelo Le Monde En. Finalmente, a comunidade asiática americana, especialmente as mulheres, está enfrentando consequências do escândalo envolvendo a Nvidia, conforme informado pelo Taipei Times."}, "resumo_do_dia": {"politica_nacional": [{"id": 280491, "titulo": "Bolsonaro segue na UTI, com quadro estável e sem previsão de alta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/bolsonaro-segue-na-uti-com-quadro-estavel-e-sem-previsao-de-alta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-22T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro permanece internado em uma Unidade de Terapia Intensiva sem previsão de alta. Ele foi diagnosticado com abdômen agudo obstrutivo.", "titulo_pt": "Bolsonaro segue na UTI, sem previsão de alta e com diagnóstico de abdômen agudo obstrutivo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 280521, "titulo": "Leia a íntegra do boletim médico de Bolsonaro deste domingo", "url": "https://www.poder360.com.br/poder-flash/leia-a-integra-do-boletim-medico-de-bolsonaro-deste-domingo/", "fonte_id": "poder360", "data_pub": "2026-11-22T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro permanece estável na Unidade de Terapia Intensiva (UTI) e sem previsão de alta. Ele está em jejum e recebendo suporte nutricional.", "titulo_pt": "Leia a íntegra do boletim médico de Bolsonaro deste domingo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280522, "titulo": "Bolsonaro está estável na UTI e segue sem previsão de alta, diz boletim", "url": "https://www.poder360.com.br/poder-brasil/bolsonaro-esta-estavel-na-uti-e-segue-sem-previsao-de-alta-diz-boletim/", "fonte_id": "poder360", "data_pub": "2026-11-22T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro permanece estável na Unidade de Terapia Intensiva (UTI) e recebe suporte nutricional, segundo o boletim médico. O diagnóstico é de abdômen agudo obstrutivo, sem previsão de alta hospitalar imediata.", "titulo_pt": "Bolsonaro está estável na UTI e segue sem previsão de alta, diz boletim", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280524, "titulo": "Compras como alívio emocional causam ciclo vicioso", "url": "https://www.poder360.com.br/poder-saude/compras-como-alivio-emocional-causam-ciclo-vicioso/", "fonte_id": "poder360", "data_pub": "2026-11-22T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O consumo por impulso pode levar a uma dependência psicológica e ao endividamento, resultando em uma busca falsa pelo bem-estar emocional. Compras como alívio emocional criam um ciclo vicioso que pode ter efeitos negativos na saúde financeira e mental do indivíduo.", "titulo_pt": "Compras impulsivas como alívio emocional criam ciclo vicioso", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280525, "titulo": "Flávio, Damares e políticos de direita pedem orações para Bolsonaro", "url": "https://www.poder360.com.br/poder-gente/flavio-damares-e-politicos-de-direita-pedem-oracoes-para-bolsonaro/", "fonte_id": "poder360", "data_pub": "2026-11-22T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Políticos de direita, incluindo Flávio Bolsonaro e Damares Alves, publicaram mensagens de apoio a Jair Bolsonaro, que foi internado em Brasília devido a uma obstrução intestinal.", "titulo_pt": "Flávio, Damares e políticos de direita pedem orações para Bolsonaro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280526, "titulo": "Sabesp conclui manutenção, mas 5 regiões ainda têm abastecimento afetado", "url": "https://www.poder360.com.br/poder-brasil/sabesp-conclui-manutencao-mas-5-regioes-ainda-tem-abastecimento-afetado/", "fonte_id": "poder360", "data_pub": "2026-11-22T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sabesp concluiu a manutenção no Sistema Cantareira, mas cinco regiões de São Paulo, Francisco Morato e Guarulhos ainda enfrentam problemas de abastecimento. O fornecimento de água está insights sobre sua obsessão com o assassinato de sua personagem mais famosa.", "titulo_pt": "A última xícara da rainha do crime", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 280528, "titulo": "Bolsonaro passa noite sem dor e caminha por hospital, diz Michelle", "url": "https://www.poder360.com.br/poder-gente/bolsonaro-passa-noite-sem-dor-e-caminha-por-hospital-diz-michelle/", "fonte_id": "poder360", "data_pub": "2026-11-22T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro passou a noite sem sentir dor e caminhou pelo hospital, conforme informou a primeira-dama Michelle Bolsonaro. Ele realizou alguns exames e será submetido a um raio-X contrastado para avaliar o intestino.", "titulo_pt": "Bolsonaro passa a noite sem dor e caminha pelo hospital, diz Michelle", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280597, "titulo": "A economia política do Lula 4: o que está em jogo?", "url": "https://www.brasildefato.com.br/2026/11/22/a-economia-politica-do-lula-4-o-que-esta-em-jogo/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-22T15:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crescente discussão sobre o ajuste fiscal no debate público é considerada uma importante conquista para a sociedade brasileira. Segundo Schumpeter, em certas circunstâncias históricas, questões econômicas podem ultrapassar os círculos especializados e se tornar objetos de discussão pública.", "titulo_pt": "A economia política do Lula 4: o que está em jogo?", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 280960, "titulo": "CCP legal warfare evolving: minister", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/23/2003868215", "fonte_id": "taipei_times", "data_pub": "2026-11-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério indica que a guerra legal do Partido o não tenham beneficiado das revelações. O funcionário suspeito, Hugues Moutouh, negou as acusações e pediu para ser afastado de suas funções até que seja feita uma investigação.", "titulo_pt": "Le Pen nega ter recebido informações confidenciais do ministério do interior", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 280827, "titulo": "Lebanese villagers return to wrecked homes as the Israeli army pulls back", "url": "https://www.npr.org/2026/11/22/nx-s1-6048710/lebanon-israel-army-conflict-homes", "fonte_id": "npr_news", "data_pub": "2026-11-22T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um projeto-piloto em um vilarejo no sul do Líbano, as forças israelenses se retiraram e o exército libanês assumiu o controle. No entanto, os moradores que retornaram encontraram suas casas destruídas.", "titulo_pt": "Vilarejos libaneses voltam às casas destruídas enquanto as forças israelenses se retiram", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 280764, "titulo": "COP31 Talks Collapse in Turkey in a Clash Over Fossil Fuels", "url": "https://www.nytimes.com/2026/11/22/climate/cop31-climate-summit-ends-climate.html", "fonte_id": "nyt_world", "data_pub": "2026-11-22T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nations como a Europa e países vulneráveis recusaram um acordo proposto após a Arábia Saudita e outros produtores de petróleo impedirem qualquer referência à descontinuação do carvão, petróleo e gás. O colapso das negociações ocorreu em Ancara, Turquia.", "titulo_pt": "Reunião COP31 colapsa em ancara na Turquia em conflito sobre combustíveis fósseis", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 280828, "titulo": "Meet the young authors! A literacy program inspires kids in South Africa", "url": "https://www.npr.org/2026/11/22/g-s1-154387/books-children-authors-south-africa-literacy", "fonte_id": "npr_news", "data_pub": "2026-11-22T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Africa está enfrentando uma crise de alfabetização infantil. Em uma favela de Johannesburgo, um clube de leitura está incentivando os jovens a amarem os livros e a se tornarem autores.", "titulo_pt": "Conheça os jovens autores! Um programa de alfabetização inspira crianças em South Africa", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 280690, "titulo": "Explosão em navio russo na Líbia levanta suspeita de ataque de drone", "url": "https://www.dw.com/pt-br/explosão-em-navio-russo-na-líbia-levanta-suspeita-de-ataque-de-drone/a-80014687?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma explosão em um navio russo na cidade de Benghazi na Líbia deixou feridos. O incidente aumenta as preocupações sobre a possibilidade de um conflito entre Moscou e Kiev se expandir para além dos principais campos de batalha.", "titulo_pt": "Explosão em navio russo na Líbia reforça temores de expansão do conflito entre Rússia e Ucrânia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 280838, "titulo": "Explosion on Russian ship at Libya port caused by suspected drone attack, officials say", "url": "https://www.bbc.co.uk/news/articles/cr894gjz0j0yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-22T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial do governo da Líbia Oriental afirmou que a explosão ocorreu em uma embarcação que havia parado para abastecimento e suprimentos no retorno para a Rússia. A explosão é suspeita de ter sido causada por um ataque com drone.", "titulo_pt": "Explosão em navio russo em porto líbio é atribuída a suposto ataque de drone", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 280899, "titulo": "Russian vessel hit by suspected sea drone at Libya’s Benghazi naval base", "url": "https://www.aljazeera.com/news/2026/11/22/suspected-drone-strike-hits-russian-vessel-in-libya?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-22T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio russo foi atingido por um suspeito drone marítimo no navio-base de Benghazi, na Líbia. Até o momento, não há reação oficial da Rússia e ninguém assumiu a responsabilidade pelo suposto ataque.", "titulo_pt": "Navio russo atingido por suspeito drone marítimo em base naval de Benghazi, líbia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 280891, "titulo": "Suspected drone strike hits Russian ship at Libya’s Benghazi port, raising regional security concerns", "url": "https://www.euronews.com/2026/11/22/suspected-drone-strike-hits-russian-ship-at-libyas-benghazi-port-raising-regional-security", "fonte_id": "euronews", "data_pub": "2026-11-22T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suposto ataque com drone contra uma embarcação russa no porto de Benghazi, na Líbia, levantou preocupações sobre o possível alargamento do conflito entre Rússia e Ucrânia para a região. Autoridades estão investigando a explosão, com medo crescente de uma agravamento da segurança regional.", "titulo_pt": "Suspeito de ataque com drone causa preocupação sobre segurança regional na líbia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 280596, "titulo": "‘Terrorismo judaico’: Eisenkot cobra punição por ataques de colonos contra palestinos", "url": "https://www.brasildefato.com.br/2026/11/22/terrorismo-judaico-eisenkot-cobra-punicao-por-ataques-de-colonos-contra-palestinos/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-22T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades israelenses abriram uma investigação após incêndios e vandalismo em quatro vilarejos da Cisjordânia ocupada. Soldados e policiais foram mobilizados após denúncias dos ataques.", "titulo_pt": "‘Terrorismo judaico’: israel investiga ataques de colonos contra palestinos", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 280500, "titulo": "Após dias em Israel, Michelle retorna ao Brasil e visita Bolsonaro na UTI", "url": "https://www.cartacapital.com.br/politica/apos-dias-em-israel-michelle-retorna-ao-brasil-e-visita-bolsonaro-na-uti/", "fonte_id": "cartacapital", "data_pub": "2026-11-22T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro retornou ao Brasil após sua visita a Israel e, segundo ela, a volta estava prevista para o fim de semana. A ex-primeira-dama visitou o presidente Jair Bolsonaro, que está internado em uma unidade de terapia intensiva.", "titulo_pt": "Michelle Bolsonaro retorna ao Brasil e visita Bolsonaro na UTI", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 280605, "titulo": "Grampo, drone e despiste: os bastidores da prisão de “El Chapo Isidro” no México", "url": "https://www.infomoney.com.br/business/global/grampo-drone-e-despiste-os-bastidores-da-prisao-de-el-chapo-isidro-no-mexico/", "fonte_id": "infomoney", "data_pub": "2026-11-22T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A prisão de 'El Chapo Isidro', chefe do cartel, foi resultado de semanas de troca de informações entre EUA e México, que envolveram o uso de grampo, drone e despiste. O cartel era liderado por Meza Flores, considerado o homem mais perigoso do México por um funcionário americano.", "titulo_pt": "Grampo, drone e despiste: os bastidores da prisão de ‘El Chapo Isidro’ no México", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280892, "titulo": "Latest news bulletin | November 22nd, 2026 – Evening", "url": "https://www.euronews.com/video/2026/11/22/latest-news-bulletin-november-22nd-2026-evening", "fonte_id": "euronews", "data_pub": "2026-11-22T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resumo /*https://www1.folha.uol.com.br/mercado/2026/11/donald-trump-assina-lei-que-extingue-moeda-de-us-001.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou uma lei que extingue a moeda de um centavo de dólar. Essa moeda, conhecida como 'penny', foi oficialmente encerrada um ano após o anúncio da decisão.", "titulo_pt": "Trump assina lei que extingue moeda de 1 centavo de dólar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 280613, "titulo": "Assim como a SpaceX, Anthropic adota modelo incomum de IPO", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/assim-como-a-spacex-anthropic-adota-modelo-incomum-de-ipo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic adotou um modelo incomum de IPO, semelhante ao da SpaceX, onde bancos arrecadaram meio bilhão de dólares em taxas. A empresa, liderada por Elon Musk, controlou rigorosamente o processo, mantendo informações financeiras e de outros tipos em sigilo durante meses.", "titulo_pt": "Assim como a SpaceX, Anthropic adota modelo incomum de IPO", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 280603, "titulo": "Falha em sistema atrasa todos os voos da Delta em Atlanta, EUA", "url": "https://www.infomoney.com.br/business/global/pane-trava-voos-da-delta-em-atlanta-e-a-3a-falha-no-setor-aereo-dos-eua/", "fonte_id": "infomoney", "data_pub": "2026-11-22T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um sistema que calcula o peso e equilíbrio dos aviões da Delta saiu do ar, causando a cancelamento de um quarto dos voos e o atraso de mais de 40% dos voos em Atlanta, EUA.", "titulo_pt": "Falha no sistema atrasa e cancela voos da Delta em Atlanta, EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280479, "titulo": "Petrobras deve elevar meta de investimentos em novo plano para cinco anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/petrobras-deve-elevar-meta-de-investimentos-em-novo-plano-para-cinco-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras divulgará nesta segunda-feira (23) a atualização de seu plano de investimentos para os próximos cinco anos, com uma projeção maior de gastos e foco no crescimento da produção de diesel e biocombustíveis.", "titulo_pt": "Petrobras deve elevar meta de investimentos em novo plano para cinco anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 280604, "titulo": "Nem GTA 6 segurou “Jogos Vorazes”: novo filme estreia com US$ 225 milhões", "url": "https://www.infomoney.com.br/consumo/nem-gta-6-segurou-jogos-vorazes-novo-filme-estreia-com-us-225-milhoes/", "fonte_id": "infomoney", "data_pub": "2026-11-22T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Jogos Vorazes: A Juventude de Haymitch' arrecadou US$ 225 milhões no mundo ao estrear, superando as expectativas da Lionsgate, mesmo com a concorrência do lançamento do jogo 'GTA 6'.", "titulo_pt": "Nem GTA 6 segurou ‘Jogos Vorazes’: novo filme estreia com US$ 225 milhões", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280480, "titulo": "Ovelhas e painéis solares dividem espaço e aumentam produtividade agrícola", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/modelo-agrivoltaico-amplia-renda-rural-e-eficiencia-da-energia-solar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma em cada dez usinas solares nos Estados Unidos, ovelhas compartilham o espaço com os painé Há um grave risco de que o Banco do Brasil se torne um novo Correios’, diz ex-diretora de desestatização", "url": "https://veja.abril.com.br/economia/ha-um-grave-risco-de-que-o-banco-do-brasil-se-torne-um-novo-correios-diz-ex-diretora-de-desestatizacao/", "fonte_id": "veja", "data_pub": "2026-11-22T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-diretora de desestatização Maria Helena Cunha alerta para o risco de o Banco do Brasil se tornar como os Correios, devido à deterioração dos indicadores do banco público e à interferência política na gestão das estatais.", "titulo_pt": "Há um grave risco de que o Banco do Brasil se torne um novo Correios, avisa ex-diretora de desestatização", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280611, "titulo": "Chile tem maior tombo do PIB desde 2020, e BC vê recuperação mais lenta", "url": "https://www.infomoney.com.br/economia/chile-tem-maior-tombo-do-pib-desde-2020-e-bc-ve-recuperacao-mais-lenta/", "fonte_id": "infomoney", "data_pub": "2026-11-22T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PIB do Chile registrou a maior retração desde 2020, caindo 1,8% no terceiro trimestre. O Banco Central vê a recuperação mais lenta do que o esperado, sem sinais claros de retomada dos investimentos.", "titulo_pt": "Chile registra maior retração do PIB desde 2020, e BC vê recuperação mais lenta", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280483, "titulo": "Bolsas da China afrouxam margem e cortam tarifas para sustentar ações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/bolsas-da-china-afrouxam-margem-e-cortam-tarifas-para-sustentar-acoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As três principais bolsas de valores da China anunciaram planos para sustentar as ações em queda, incluindo a flexib ge", "data_pub": "2026-11-22T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Todos os voos Delta entrando e saindo de Atlanta estão enfrentando significativas atrasos no domingo devido a um problema no sistema que calcula o peso e o equilíbrio da aeronave. O Aeroporto Internacional Hartsfield-Jackson Atlanta é o maior hub da Delta e um dos mais movimentados do mundo.", "titulo_pt": "Vôos delta de e para Atlanta atrasados devido a falha no sistema", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 281004, "titulo": "TechCrunch Mobility: A/B testing robots vs. humans", "url": "https://techcrunch.com/2026/11/22/techcrunch-mobility-a-b-testing-robots-vs-humans/", "fonte_id": "techcrunch", "data_pub": "2026-11-22T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O TechCrunch Mobility continua sendo o hub para o futuro da mobilidade, destacando o papel da inteligência artificial nesse setor. A série agora explora testes A/B entre robôs e humanos em contextos de mobilidade.", "titulo_pt": "Techcrunch Mobility: testes a/B de robôs contra humanos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 280481, "titulo": "IA e matemática: entramos na era das verdades que não entendemos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/ronaldolemos/2026/11/ia-e-matematica-entramos-na-era-das-verdades-que-nao-entendemos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bernhard Riemann nasceu em 1826 na Alemanha e inicialmente pretendia estudar teologia, mas acabou se tornando um dos maiores matemáticos da história. Ele viu a matemática como uma forma de servir a Deus. Suas contribuições para o campo da matemática o colocaram entre os grandes nomes da disciplina.", "titulo_pt": "IA e matemática: entramos na era das verdades que não entendemos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 280638, "titulo": "COP31 termina sem acordo final após impasse sobre o fim dos combustíveis fósseis", "url": "https://olhardigital.com.br/2026/11/22/ciencia-e-espaco/cop31-termina-sem-acordo-final-apos-impasse-sobre-o-fim-dos-combustiveis-fosseis/", "fonte_id": "olhar_digital", "data_pub": "2026-11-22T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O COP31 encerrou sem um acordo final devido a um impasse sobre o fim dos combustíveis fósseis. Um rascunho proposto por Turquia e Austrália foi rejeitado por não incluir metas específicas para o fim dos combustíveis fósseis.", "titulo_pt": "COP31 termina sem acordo final após impasse sobre o fim dos combustíveis fósseis", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 280650, "titulo": "SUV grande da Jeep fica \"no precinho\" e sai mais barato que T-Cross", "url": "https://canaltech.com.br/carros/suv-grande-da-jeep-fica-no-precinho-e-sai-mais-barato-que-t-cross/", "fonte_id": "canaltech", "data_pub": "2026-11-22T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Jeep Commander Limited T270 2022, um SUV grande com espaço para sete ocupantes, oferece equipamentos avançados e sai mais barato que o Volkswagen T-Cross Comfortline zero km. O modelo custa em média R$ 136.481, enquanto o T-Cross custa R$ 171.990, gerando uma economia de mais de R$ 35 mil.", "titulo_pt": "SUV grande da Jeep sai mais barato que T-Cross usado", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 280903, "titulo": "Can we build a more ethical AI future?", "url": "https://www.aljazeera.com/video/upfront/2026/11/22/can-we-build-a-more-ethical-ai-future?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-22T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marc Lamont Hill conversa com o empreendedor de tecnologia Anil Dash sobre os riscos associados à IA e a luta pela tecnologia ética.", "titulo_pt": "Podemos construir um futuro da IA mais ético?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 281005, "titulo": "Can a TV be too large? An investigation", "url": "https://techcrunch.com/2026/11/22/can-a-tv-be-too-large-an-investigation/", "fonte_id": "techcrunch", "data_pub": "2026-11-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritor recentemente atualizou seu televisor para um de 65 polegadas OLED, enfrentando algumas desafios inesperados com essa mudança. A pergunta levantada é se um televisor pode ser realmente muito grande.", "titulo_pt": "Um televisor pode ser demais? Uma investigação", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 280551, "titulo": "Falha técnica na Delta atrasa milhares de voos nos EUA neste domingo", "url": "https://exame.com/mundo/falha-tecnica-na-delta-atrasa-milhares-de-voos-nos-eua-neste-domingo/", "fonte_id": "exame", "data_pub": "2026-11-22T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um problema técnico no sistema de controle de peso e balanceamento das aeronaves está causando atrasos em milhares de voos no Aeroporto Internacional Hartsfield-Jackson de Atlanta, nos Estados Unidos. A Delta Airlines está utilizando procedimentos manuais para lidar com a situação.", "titulo_pt": "Falha técnica no sistema de controle de peso atrasa milhares de voos no aeroporto de atlanta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280651, "titulo": "TGP em notebooks gamer: por que duas RTX iguais podem ter desempenhos opostos?", "url": "https://canaltech.com.br/notebook/tgp-em-notebooks-gamer-diferencas-em-placas-de-video/", "fonte_id": "canaltech", "data_pub": "2026-11-22T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ao comprar um notebook gamer, é necessário realizar uma pesquisa mais aprofundada do que apenas ler o adesivo ao lado do teclado, pois dois notebooks equipados com a mesma GPU de última geração podem apresentar performances diferentes devido ao TGP. O TGP, ou Total Graphics Power, é um recurso permitido pelas marcas AMD e NVIDIA devido às restrições de espaço físico e refrigeração nos notebooks em comparação com os desktops.", "titulo_pt": "TGP em notebooks gamer: por que duas RTX iguais podem ter desempenhos opostos?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 280950, "titulo": "Chinese J-20’s radar signature could nearly double with 10% stealth coating loss: study", "url": "https://www.scmp.com/news/china/science/article/3375012/chinese-j-20s-radar-signature-could-nearly-double-10-stealth-coating-loss-study", "fonte_id": "scmp", "data_pub": "2026-11-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos científicos chineses indicam que uma perda de 10% da camada de absorção de radar no J-20, o caça noturno de combate oculto da China, poderia quase dobrar seu sinal de radar. Fotografias circulando na internet mostram como danos na superfície podem comprometer a capacidade do caça de evadir detecção radar.", "titulo_pt": "Estudo sugere que perda de 10% da camada de absorção de radar no J-20 quase dobraria seu sinal de radar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 280991, "titulo": "‘The show is starting soon. Please turn on your headphones.’", "url": "https://www.theverge.com/tech/1038879/off-broadway-love-me-auracast", "fonte_id": "the_verge", "data_pub": "2026-11-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor subiu alguns degraus de concreto e entrou pela porta da frente de uma casa de dois andares de 200 anos em Nova York, acompanhado por uma multidão que se dirigia ao Teatro SoHo com 178 lugares. Cada pessoa foi entregue um saco de cordão preto com fones de ouvido conectados a um pequeno Auracast.", "titulo_pt": "O espetáculo vai começar. Por favor, ligue seus fones de ouvido.", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 280840, "titulo": "Behind the Curtain — AI 2027: The reckoning", "url": "https://www.axios.com/2026/11/22/behind-the-curtain-ai-2027-the-reckoning", "fonte_id": "axios", "data_pub": "2026-11-22T13:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 líderes de governo, IA, negócios e cibersegurança, que vão desde aceleradores de IA até críticos que querem parar o desenvolvimento, concordaram em que ataques cibernéticos a infraestrutura crítica e empresas serão constantes, cada vez mais sofisticados e altamente disruptivos nos próximos 18 meses. Eles prevêem que em 2027, a cibersegurança se tornará como o tempo: interrupções serão frequentes, disruptivas e ocasionalmente assustadoras, algo que as pessoas e empresas terão que aprender a navegar e conviver diariamente.", "titulo_pt": "Por trás da cortina — AI 2027: o julgamento", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 280652, "titulo": "Surge um novo canal comercial, operado de ponta a ponta por IA", "url": "https://canaltech.com.br/inteligencia-artificial/surge-um-novo-canal-comercial-operado-de-ponta-a-ponta-por-ia/", "fonte_id": "canaltech", "data_pub": "2026-11-22T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial já faz parte das agendas de investimento das empresas, mas apenas 37% dos projetos de IA entregaram os resultados esperados até 2025, de acordo com uma pesquisa da IBM Institute for Business Value. A incorporação da tecnologia às operações é um desafio, conforme apontado por uma análise da Bain & Company.", "titulo_pt": "Novo canal comercial operado inteiramente por IA surge", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 280796, "titulo": "You’re anxious about AI. Can religion help — even if you don’t believe in God?", "url": "https://www.vox.com/advice/511400/ai-doom-anxiety-religion-faith-church", "fonte_id": "vox", "data_pub": "2026-11-22T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O coluna de conselhos 'Your Mileage May Vary' oferece um quadro único para pensar em dilemas morais, baseado no pluralismo de valores, que sugere que cada pessoa possui múltiplos valores válidos que às vezes entram em conflito. Os leitores podem enviar perguntas de forma anônima através de um formulário online.", "titulo_pt": "Você está ansioso sobre a IA. A religião pode ajudar, mesmo se você não crê em deus?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 280951, "titulo": "Tencent touts latest AI model Hy4’s performance on independent safety assessments", "url": "https://www.scmp.com/tech/tech-trends/article/3375374/tencent-touts-latest-ai-model-hy4s-performance-independent-safety-assessment", "fonte_id": "scmp", "data_pub": "2026-11-22T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tencent Holdings colaborou com uma organização internacional de segurança da inteligência artificial para avaliar os riscos do seu último modelo de IA, Hy4, em resposta a crescentes preocupações sobre ataques cibernéticos e uso biológico de IA. Esta é a primeira vez que uma grande empresa de tecnologia chinesa revela ter trabalhado com avaliadores independentes em avaliações de novos modelos antes do lançamento.", "titulo_pt": "Tencent anuncia avaliação independente de segurança do seu último modelo de IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 280964, "titulo": "Claude deciphered math’s greatest riddle: researcher", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/23/2003868219", "fonte_id": "taipei_times", "data_pub": "2026-11-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O matemático Claude decifrou o maior mistério da matemática, de acordo com o relatório.", "titulo_pt": "Claude decifrou o maior mistério da matemática: pesquisador", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 281010, "titulo": "Atmospheric organic nitrogen emerges as a major nutrient source for global oceans", "url": "https://phys.org/news/2026-11-atmospheric-nitrogen-emerges-major-nutrient.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa quantificou um componente importante do ciclo global de nitrogênio. O nitrogênio orgânico atmosférico emerge como uma importante fonte de nutrientes para os oceanos globais.", "titulo_pt": "Nitrogênio orgânico atmosférico emerge como uma importante fonte de nutrientes para os oceanos globais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 280717, "titulo": "El Niño y La Niña: un estudio argentino descubrió patrones de recurrencia y planteó una hipótesis hasta 2030", "url": "https://www.lanacion.com.ar/economia/campo/el-nino-y-la-nina-un-estudio-argentino-descubrio-patrones-de-recurrencia-y-planteo-una-hipotesis-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-22T16:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O pesquisador Guillermo A. Chinni analisou 78 anos de registros e encontrou padrões de recorrência entre El Niño e La Niña e a posição da Terra em relação ao Sol. O trabalho sugere uma possível predominância de El Niño nos próximos anos.", "titulo_pt": "El Niño e La Niña: estudo argentino identifica padrões de recorrência e prevê predominância de el Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 280692, "titulo": "Pente experimental estimula crescimento capilar e supera tratamentos convencionais em ratos", "url": "https://www.dw.com/pt-br/pente-experimental-estimula-crescimento-capilar-e-supera-tratamentos-convencionais-em-ratos/a-80014577?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo dispositivo experimental combina estímulos elétricos e moléculas terapêuticas para estimular o crescimento capilar, alcançando até 97,85% de recrescimento capilar em ratos. A tecnologia ainda não foi testada em humanos.", "titulo_pt": "Dispositivo experimental estimula crescimento capilar e supera tratamentos convencionais em ratos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 281011, "titulo": "JWST finds a possible black hole that grew faster than its host galaxy in the early universe", "url": "https://phys.org/news/2026-11-jwst-black-hole-grew-faster.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta do possível buraco negro que cresceu mais rápido que sua galáxia anfitriã no início do universo é um mistério em astronomia. A formação de buracos negros massivos de cerca de um bilhão de massas solares no primeiro bilhão de anos do universo requer explicações extraordinárias.", "titulo_pt": "JWST encontra possível buraco negro que cresceu mais rápido que sua galáxia anfitriã no início do universo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 281040, "titulo": "SpaceX sends classified US spy satellites to orbit in early-morning launch from California coast (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-spy-satellite-launch-nrol-136-proliferated-architecture", "fonte_id": "space_com", "data_pub": "2026-11-22T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou uma série de satélites espionagem classificados para o Departamento Nacional de Reconhecimento dos Estados Unidos na madrugada de domingo (22 de novembro).", "titulo_pt": "Spacex lança satélites espionagem classificados para o departamento nacional de reconhecimento dos EUA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 280945, "titulo": "Has AI solved the Riemann hypothesis? Claim makes waves at 200th birthday event in China", "url": "https://www.scmp.com/news/china/science/article/3375386/has-ai-solved-riemann-hypothesis-claim-makes-waves-200th-birthday-event-china", "fonte_id": "scmp", "data_pub": "2026-11-22T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um matemático dos Estados Unidos surpreendeu a comunidade ao afirmar ter resolvido a hipótese de Riemann, um problema matemático não resolvido há quase 170 anos, usando inteligência artificial. A afirmação causou comoção durante um importante congresso em Shenzhen, China, que celebra o 200º aniversário do nascimento de Bernhard Riemann.", "titulo_pt": "AI resolveu hipótese de Riemann? Alegação causa ondas em evento chinês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 281012, "titulo": "Mercury gets its first visitor in years as a pair of spacecraft loop into orbit", "url": "https://phys.org/news/2026-11-mercury-visitor-years-pair-spacecraft.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois satélites entraram em órbita ao redor de Mercúrio após uma viagem de oito anos pelo sistema solar interno. O objetivo é descobrir mais sobre as mistérias desse planeta mais próximo do Sol.", "titulo_pt": "Mercúrio recebe sua primeira visita em anos com uma dupla de satélites em órbita", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 281013, "titulo": "COP31 fails to agree on climate deal in chaotic finale", "url": "https://phys.org/news/2026-11-cop31-climate-chaotic.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T15:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As negociações climáticas COP31 terminaram sem um acordo histórico, após a União Europeia e outros países recusarem-se a endossar um pacto que omitiu os combustíveis fósseis. O evento se estendeu além do horário previsto, alcançando uma marca inédita na Turquia.", "titulo_pt": "COP31 falha em alcançar acordo climático em final caótico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 280474, "titulo": "Filósofo Michael Marder propõe outro Iluminismo de olho no vegetal", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/filosofo-michael-marder-propoe-outro-iluminismo-de-olho-no-vegetal.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filósofo Michael Marder sugere um novo Iluminismo que considere as plantas como modelo de pensamento, em uma época de desorientação. Ele propõe refletir mais sobre as plantas do que sobre os problemas humanos complexos.", "titulo_pt": "Filósofo Michael Marder sugere um novo Iluminismo voltado para o vegetal", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 281014, "titulo": "Hybrid nanocrystal surface reveals new way to tune interactions with infrared light", "url": "https://phys.org/news/2026-11-hybrid-nanocrystal-surface-reveals-tune.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma camada de um cristal, feita de duas espécies de nanocrystais misturados em solução, pode amplificar ou suprimir a luz infravermelha além da soma de suas partes individuais.", "titulo_pt": "Superfície de nanocrystais híbridos revela novo método para ajustar interações com luz infravermelha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 281041, "titulo": "This viral star projector has been hyped to Mars and back, but we hunted down the best version you can buy", "url": "https://www.space.com/stargazing/skywatching-kit/this-viral-star-projector-has-been-hyped-to-mars-and-back-but-we-hunted-down-the-best-version-you-can-buy", "fonte_id": "space_com", "data_pub": "2026-11-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projetor estelar Zanbix 2 em 1 Galaxy Projector Night Light é promovido por anúncios de inteligência artificial que são considerados exagerados. A versão que foi pesquisada e recomendada não apresenta tanta histeria nos seus anúncios.", "titulo_pt": "Este projetor estelar viral foi promovido até marte e de volta, mas encontramos a melhor versão que você pode comprar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 280475, "titulo": "Sonda conjunta da Europa e do Japão entrou na órbita de Mercúrio", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/sonda-conjunta-da-europa-e-do-japao-entrou-na-orbita-de-mercurio.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-22T14:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão espacial BepiColombo, conjunta da Europa e do Japão, entrou na órbita de Mercúrio após oito anos de viagem. Este evento ocorreu neste domingo (22).", "titulo_pt": "Sonda conjunta da Europa e do Japão entra na órbita de Mercúrio", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 280552, "titulo": "ONU promete reformar negociações climáticas após reconhecer 'resultados limitados' da COP31", "url": "https://exame.com/esg/onu-promete-reformar-negociacoes-climaticas-apos-reconhecer-resultados-limitados-da-cop31/", "fonte_id": "exame", "data_pub": "2026-11-22T14:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU promete reformar as negociações climáticas após reconhecer que a COP31 produziu resultados limitados. O secretário-executivo defendeu o sistema de decisões por consenso, mas admitiu que as negociações não avançaram em questões centrais da emergência climática.", "titulo_pt": "ONU promete reformar negociações climáticas após reconhecer 'resultados limitados' da COP31", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 281042, "titulo": "As 'Star Trek: First Contact' turns 30, Director Jonathan Frakes reflects on his triumphant time-travel blockbuster (interview)", "url": "https://www.space.com/entertainment/space-movies-shows/star-trek-first-contact-at-30-director-jonathan-frakes-reflects-on-his-triumphant-time-travel-blockbuster-interview", "fonte_id": "space_com", "data_pub": "2026-11-22T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Star Trek: First Contact' completou 30 anos. O diretor Jonathan Frakes, em uma entrevista, expressou entusiasmo pelo filme, chamando-o de 'bulletproof' (intransigente ou imbatível).", "titulo_pt": "30 Anos de 'Star Trek: primeira contato', diretor Jonathan Frakes comemora sucesso", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 281043, "titulo": "On this day in space! Nov.22, 1989: NASA launches space shuttle Discovery on classified STS-33 mission for the US military", "url": "https://www.space.com/on-this-day-in-space-november-22-2026", "fonte_id": "space_com", "data_pub": "2026-11-22T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 22 de novembro de 1989, a nave espacial Discovery decolou em uma missão classificada STS-33 para o Exército dos EUA. O motivo da missão foi manter em segredo.", "titulo_pt": "22 De novembro de 1989: NASA lança ônibus espacial Discovery em missão classificada STS-33 para o exército dos EUA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 281047, "titulo": "Rian Johnson Cites Curry Barker as Reason to Be Optimistic About Future of Indie Filmmaking: ‘Youtube Is Just What Sundance Was in the ’80s’", "url": "https://variety.com/2026/film/festivals/rian-johnson-curry-barker-indie-film-youtube-sundance-1236955248/", "fonte_id": "variety", "data_pub": "2026-11-22T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rian Johnson expressou esperança sobre o futuro do cinema independente. O diretor mencionou o YouTube como uma ferramenta eficaz para que no .theguardian.com/books/2026/nov/22/rivals-author-jilly-cooper-accused-plagiarism", "fonte_id": "guardian_culture", "data_pub": "2026-11-22T15:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora best-seller Jilly Cooper foi acusada de plágio em suas obras, especificamente em seu romance 'Prudence', publicado em 1978, que supostamente contém passagens plagiadas dos livros 'The Serial' de Cyra McFadden e 'The Franchise Affair' de Josephine Tey.", "titulo_pt": "Autora Jilly Cooper acusada de plágio extensivo e deliberado", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 281051, "titulo": "‘The Unknown’ Director Arthur Harari Says AI Is a ‘Slippery Slope,’ Though He ‘Had to Use Deepfake Tool’ for Léa Seydoux Double Scene: ‘There Was a Human Behind It’", "url": "https://variety.com/2026/film/festivals/the-unknown-director-deepfake-tool-lea-seydoux-kissing-scene-1236955267/", "fonte_id": "variety", "data_pub": "2026-11-22T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arthur Harari, diretor de 'The Unknown', afirma que a inteligência artificial é um 'caminho escorregadio' e que gostaria de evitar seu uso em seus próprios projetos. No entanto, ele admitiu ter usado uma ferramenta de deepfake para uma cena dupla com Léa Seydoux no filme, que é um candidato ao Palme d'Or.", "titulo_pt": "Arthur Harari: inteligência artificial é um 'caminho escorregadio', mas usou Deepfake", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 281052, "titulo": "J.A. Bayona, Guneet Monga Kapoor, Vikas Khanna Board Student Academy Award Winner ‘The Dragon Letter’ as Director Plans Feature Version (EXCLUSIVE)", "url": "https://variety.com/2026/film/markets-festivals/ja-bayona-guneet-monga-kapoor-vikas-khanna-dragon-letter-1236955265/", "fonte_id": "variety", "data_pub": "2026-11-22T14:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diretor espanhol J.A. Bayona, a produtora ganhadora
