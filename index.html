: 120844, "titulo": "Can Singapore’s latest pro-family push change minds on parenthood?", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3365083/can-singapores-latest-pro-family-push-change-minds-parenthood?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T11:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Singapura anunciou uma série de medidas para tornar a criação de filhos mais atraente, incluindo aumentar o período de licença parental com base no número de filhos. Essas iniciativas foram bem-vindas por alguns pais, mas outros questionam se elas serão suficientes para superar preocupações mais profundas sobre tempo, carreira, moradia e estilo de vida.", "titulo_pt": "Podem as últimas iniciativas pro-família de singapura mudar as percepções sobre a maternidade e paternidade?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120523, "titulo": "Children make up half of mpox cases in Guinea-Bissau as epidemic spreads", "url": "https://www.theguardian.com/global-development/2026/aug/24/children-half-mpox-disease-cases-guinea-bissau-epidemic-spreads-west-africa", "fonte_id": "guardian_world", "data_pub": "2026-08-24T10:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Guiné-Bissau, mais de metade dos casos de mpox são crianças, com 46 casos suspeitos relatados desde julho. A epidemia foi declarada em 4 de julho após o registro do primeiro caso confirmado em uma mulher de 27 anos.", "titulo_pt": "Crianças representam metade dos casos de mpox em guiné-bissau", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 119674, "titulo": "Scrapping of Berlin swimming day for Black children becomes latest in long list of race-linked pool rows", "url": "https://www.theguardian.com/world/2026/aug/24/scrapping-of-berlin-swimming-day-for-black-children-becomes-latest-in-long-list-of-race-linked-pool-rows", "fonte_id": "guardian_world", "data_pub": "2026-08-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Plano de oferecer um horário exclusivo de banho na piscina para crianças negras em Berlim teve que ser cancelado devido a ataques racistas por parte de vozes de extrema-direita e conservadoras.", "titulo_pt": "Cancelamento do dia de banho na piscina para crianças negras em berlim se torna mais um caso de controvérsia racial", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 119359, "titulo": "Entenda como tipos de câncer afetam financeiramente lares brasileiros", "url": "https://www.cnnbrasil.com.br/saude/entenda-como-tipos-de-cancer-afetam-financeiramente-lares-brasileiros/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-24T02:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cânceres graves como o de mama, útero e ovário têm impactado financeiramente mais lares brasileiros. De acordo com dados do Censo 2022 (IBGE), as mulheres são as principais responsáveis pelo sustento familiar.", "titulo_pt": "Entenda como cânceres graves afetam financeiramente lares brasileiros", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 119942, "titulo": "‘Hang in there’: Chinese boys offer US$1.5 to struggling store owner, sparking wave of support", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3365006/hang-there-chinese-boys-offer-us15-struggling-store-owner-sparking-wave-support?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T02:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três boys da China oriental ofereceram 10,5 yuan (US$1,5) a um dono de loja de conveniência que estava prestes a fechar, gerando uma onda de apoio público. O dono, Chen, decidiu fechar sua loja em Guangzhou após cinco anos de dificuldades financeiras.", "titulo_pt": "Segure firme: garotos chineses oferecem US$1,5 para dono de loja em dificuldades, gerando onda de apoio", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 119943, "titulo": "Homes crack as London heatwaves trigger record subsidence claims", "url": "https://www.scmp.com/news/world/europe/article/3365004/homes-crack-london-heatwaves-trigger-record-subsidence-claims?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T02:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Londres enfrenta riscos históricos de subsidência devido a cinco secas consecutivas que secaram o solo argiloso da cidade. Reclamações de seguros relacionadas a subsidência, fenômeno causado por períodos quentes e secos, atingiram um recorde no último trimestre.", "titulo_pt": "Casas se rompem com reclamações de seguros por subsidência disparam em londres devido a ondas de calor", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 119400, "titulo": "Quatro são presos após roubo milionário a casa com joias em SP", "url": "https://www.metropoles.com/sao-paulo/quatro-sao-presos-apos-roubo-milionario-a-casa-com-joias-em-sp", "fonte_id": "metropoles", "data_pub": "2026-08-24T01:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro suspeitos foram presos após serem flagrados deixando a casa onde ocorreu um roubo milionário com joias e pedras preciosas. A polícia recuperou os objetos roubados.", "titulo_pt": "Quatro são presos após roubo milionário a casa com joias em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 119919, "titulo": "Mental health screen for enlistees could leave loopholes", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/24/2003863028", "fonte_id": "taipei_times", "data_pub": "2026-08-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um teste de saúde mental para recrutas poderia deixar brechas. O teste pode não ser capaz de identificar todas as condições de saúde mental relevantes para a recruta.", "titulo_pt": "Teste de saúde mental para recrutas poderia deixar brechas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 120713, "titulo": "Greta Thunberg joins 10,000 climate marchers in Stockholm", "url": "http://www.euronews.com/video/2026/08/24/greta-thunberg-joins-10000-climate-marchers-in-stockholm", "fonte_id": "euronews", "data_pub": "2026-08-24T15:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 10.000 pessoas marcharam por Stockholm no domingo, exigindo ações mais robustas contra o clima, um mês antes da eleição geral na Suécia.", "titulo_pt": "Greta Thunberg participa da marcha climática com 10.000 pessoas em estocolmo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 120526, "titulo": "Australia has just 12,000 sea lions left – and ‘carnage’ may await them as bird flu takes hold, scientists warn", "url": "https://www.theguardian.com/world/2026/aug/25/australia-has-just-12000-sea-lions-left-and-carnage-may-await-them-as-bird-flu-takes-hold-scientists-warn", "fonte_id": "guardian_world", "data_pub": "2026-08-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australásia tem apenas 12.000 lobos-marinhos restantes, e cientistas advertiram que a gripe aviária H5N1 pode causar 'carnage' nessas populações após a confirmação do vírus em um lobo-marinheiro-nariz-longo na Austrália do Sul.", "titulo_pt": "Austrália tem apenas 12.000 lobos-marinhos e 'carnage' pode se aproximar com a gripe aviária", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 120832, "titulo": "4 arrested as Kenya investigates 18 elephant deaths in Amboseli", "url": "https://www.scmp.com/news/world/africa/article/3365098/4-arrested-kenya-investigates-18-elephant-deaths-amboseli?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro suspeitos foram detidos durante uma investigação sobre a morte de 18 elefantes no ecossistema de Amboseli, na Kenya. O ministério do Turismo e da Vida Selvagem informou que substâncias, incluindo químicos, foram apreendidos. Os suspeitos foram libertados em liberdade provisória, mas os resultados preliminares dos exames sugerem a possibilidade de envolvimento de uma substância tóxica.", "titulo_pt": "Quatro detidos na investigação sobre mortes de 18 elefantes em Amboseli, na Kenya", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120234, "titulo": "Plástico que polui praias revela desafio da transição energética a partir da Amazônia", "url": "https://exame.com/esg/plastico-que-polui-praias-revela-desafio-da-transicao-energetica-a-partir-da-amazonia/", "fonte_id": "exame", "data_pub": "2026-08-24T12:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lixo plástico está se acumulando nas praias da Amazônia. Ciência, inovação e políticas públicas buscam alternativas ao uso do petróleo.", "titulo_pt": "Plástico que polui praias amazônicas revela desafio da transição energética", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120716, "titulo": "Tens of thousands evacuated as Hawk wildfire nears western US city of Reno", "url": "http://www.euronews.com/2026/08/24/tens-of-thousands-evacuated-as-hawk-wildfire-nears-western-us-city-of-reno", "fonte_id": "euronews", "data_pub": "2026-08-24T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de pessoas foram evacuadas à medida que o incêndio de Hawk se aproxima da cidade ocidental de Reno nos Estados Unidos. Não houve mortes relatadas, mas seis pessoas foram feridas, incluindo três resgatadores, e várias casas nas montanhas foram destruídas.", "titulo_pt": "Dezenas de milhares evacuados à medida que incêndio de Hawk se aproxima de Reno", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 120850, "titulo": "Malaysia says Indonesia to open airspace for cloud seeding to tackle haze", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365068/malaysia-says-indonesia-open-airspace-cloud-seeding-tackle-haze?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia concedeu permissão oficial para agências malasianas entrar em seu espaço aéreo para realizar operações de sementação de nuvens, como parte das esforços conjuntos para combater a poluição de fuligem que atinge a região. O aumento das chamas florestais e de terras na Indonésia tem causado fechamentos de escolas em ambos os países.", "titulo_pt": "Malásia diz que indonésia abrirá espaço aéreo para operações de sementação de nuvens para combater a fuligem", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120721, "titulo": "New Zealand's government introduces legislation to ban social media for under-16s", "url": "http://www.euronews.com/2026/08/24/new-zealands-government-introduces-legislation-to-ban-social-media-for-under-16s", "fonte_id": "euronews", "data_pub": "2026-08-24T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Nova Zelândia apresentou uma proposta de lei que proibiria o uso de redes sociais por menores de 16 anos. As empresas como Meta poderiam ser multadas em até 10% do seu faturamento global caso não cumpram a lei.", "titulo_pt": "Novo zeeland apresenta lei para proibir redes sociais para menores de 16 anos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 119801, "titulo": "Landslide at landfill in Guinea kills 30 people, government says", "url": "http://www.euronews.com/2026/08/24/landslide-at-landfill-in-guinea-kills-30-people-government-says", "fonte_id": "euronews", "data_pub": "2026-08-24T03:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um deslizamento de terra no aterro sanitário em Guiné resultou em 30 mortes. O incidente foi acionado por um trem pesado. O governo havia expedido ordens de despejo para os moradores locais nas proximidades do aterro alguns dias antes do acidente, devido ao medo de uma colapso.", "titulo_pt": "Deslizamento de terra em aterro mata 30 pessoas em Guiné, diz governo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 119846, "titulo": "Human-caused Nevada wildfire forces 42,000 people to evacuate", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/24/08-24-26-nevada-forest-fire-sv?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-24T02:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal perto de Reno, Nevada, obrigou 42.000 pessoas a se evacuarem e colocou mais 45.000 pessoas em alerta.", "titulo_pt": "Incêndio natural na Nevada força 42.000 pessoas a evacuarem", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 120516, "titulo": "Kast asegura que el gobierno no tiene en su agenda cuestionar el Convenio 169 de la OIT: “No es prioridad”", "url": "https://www.latercera.com/politica/noticia/kast-asegura-que-el-gobierno-no-tiene-en-su-agenda-cuestionar-el-convenio-169-no-es-prioridad/", "fonte_id": "la_tercera", "data_pub": "2026-08-24T13:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Kast afirma que o governo não planeja questionar o Convenio 169 da OIT, pois considera que não é uma prioridade atual. O mandatário destaca que o país já se comprometeu com o acordo e que as impugnações estão reguladas no próprio tratado.", "titulo_pt": "Kast garante que governo não questionará Convenio 169 da OIT", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 120996, "titulo": "New SMART survey provides updated assessment of child and maternal nutrition in accessible areas of Gaza", "url": "https://www.unicef.org/press-releases/new-smart-survey-provides-updated-assessment-child-and-maternal-nutrition-accessible", "fonte_id": "unicef", "data_pub": "2026-08-24T12:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento SMART forneceu uma avaliação atualizada sobre a nutrição infantil e materna em áreas acessíveis de Gaza.", "titulo_pt": "Novo levantamento SMART oferece avaliação atualizada sobre nutrição infantil e materna em áreas acessíveis de Gaza", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 120412, "titulo": "Heterarquía: cuando las comunidades gobiernan porque el Estado no lo hace", "url": "https://www.ciperchile.cl/2026/08/24/heterarquia-cuando-las-comunidades-gobiernan-porque-el-estado-no-lo-hace/?utm_source=rss&utm_medium=rss&utm_campaign=heterarquia-cuando-las-comunidades-gobiernan-porque-el-estado-no-lo-hace", "fonte_id": "ciper_chile", "data_pub": "2026-08-24T12:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a heterarquia, um conceito que descreve situações em que comunidades locais exercem poder e gerenciam questões sem a intervenção do Estado.", "titulo_pt": "Heterarquia: quando as comunidades governam porque o Estado não faz", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 120746, "titulo": "India used pellets, grenades on Gen Z protests: What Amnesty report reveals", "url": "https://www.aljazeera.com/features/2026/8/24/india-used-pellets-grenades-on-gen-z-protests-what-amnesty-report-reveals?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-24T10:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amnesty International concluiu que forças de segurança indianas usaram gás lacrimogênico, armas de projéteis de gás e dispositivos de choque elétrico contra protestos de estudantes.", "titulo_pt": "India usou pellets e granadas em protestos de Gen Z, revela relatório da Amnesty", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 120727, "titulo": "Indian police used ex const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>

    : "";

    ${eventosHtml}

}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
