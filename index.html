<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>

      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "15/11/2026 15:27", "stats": {"noticias_novas": 613, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Tribunal Superior Eleitoral (TSE) prorrogou o prazo para a entrega de contas do segundo turno e a devolução de sobras do Fundo Eleitoral após um problema global na Microsoft. Em Santa Catarina, sete deputados do PL rejeitaram a indicação do deputado federal Hugo Motta para uma vaga na Câmara Federal, exigindo uma candidatura própria. O Rio de Janeiro registrou a primeira morte confirmada por mpox no país, com 382 casos comprovados laboratorialmente. A Petrobras caiu três posições no ranking de lucro de petroleiras, com um lucro de US$ 7,7 bilhões no terceiro trimestre de 2026. O presidente em exercício Geraldo Alckmin anunciou que a redução significativa no desmatamento resultou em um novo repasse de quase R$ 400 milhões da Noruega, totalizando R$ 4 bilhões desde 2008. Além disso, a Câmara dos Deputados aprovou uma proposta que permite a perda de herança em casos de fraude relacionada a pedidos de curatela.", "mundo": "A economia alemã está retomando o crescimento, mas os economistas alertam para a necessidade de reformas e aumento da produtividade para evitar uma perda de prosperidade no futuro. Em outro desenvolvimento, o Bahrein relatou que seus sistemas de defesa interceptaram e destruíram ataques iranianos, marcando o retorno de ataques iranianos após um hiato de dois meses. O Irã também afirmou ter atacado uma base aérea no Bahrein, interrompendo uma pausa nas operações durante a Guerra do Oriente Médio. Em Israel, o Exército afirmou ter morto um membro de alta hierarquia da ala militar do Hamas em Gaza. Na América do Sul, o Papa Francisco iniciou sua última etapa de uma viagem pela região, destacando os direitos indígenas e a proteção ambiental. Em Cabo Verde, os eleitores irão votar em um novo presidente, enquanto na França, milhares de estudantes protestaram contra o alto custo de vida e a falta de investimentos em educação. Além disso, a Itália multou a Meta em 887 milhões de euros por acesso não autorizado a fotos de usuários em dispositivos Android. Na América do Sul, o Brasil também se prepara para um encontro trilateral entre os líderes da China, Rússia e Estados Unidos, o que causa apreensão na Europa, que vê paralelos com a divisão do mundo após a Segunda Guerra Mundial.\n\nA região do Oriente Médio e do Mar do Sul da China continua a ser cenário de tensões geopolíticas significativas. Israel realizou um ataque que resultou na morte de um comandante sênior do Hamas, Samir Abu Younis, em Gaza, em um movimento que visa reforçar a presença de Israel na região e contrapor a influência crescente da China. Em resposta aos ataques energéticos da Rússia, o presidente ucraniano Zelenskyy acusou as restrições do Starshield de facilitá-los, afirmando que essas medidas auxiliam os ataques. No Mar do Sul da China, as Filipinas e Austrália assinaram um novo acordo de defesa para enfrentar a crescente presença chinesa, enquanto Taiwan planeja estender restrições relacionadas ao Rednote, mostrando a continuidade das tensões na região.", "economia": "O pacote fiscal proposto pelo vice-presidente Alckmin, com o objetivo de reduzir os juros, será avaliado pelo Senado na terça-feira. O crescimento econômico do Peru desacelerou para 2,43% em setembro, devido à queda na mineração e na agropecuária, e o Banco Central aumentou os juros para controlar a inflação. O mercado de semicondutores deve atingir US$ 1,65 trilhão neste ano, com a Nvidia liderando o ranking das dez maiores empresas do setor. A famosa lagoa termal Blue Lagoon, na Islândia, está planejando um IPO, o que pode ser um risco devido ao risco de erupções vulcânicas. A avaliação de integridade da CGU apontou um quadro preocupante na Caixa Asset, onde os funcionários desconfiam das práticas de integridade da direção. O Brasil enfrenta uma crise de cibersegurança, com várias infraestruturas críticas paralisadas, levantando dúvidas sobre a existência de um plano de contingência.", "tecnologia": "O escândalo envolvendo a Nvidia está intensificando a concorrência no campo da inteligência artificial (IA). O CEO da empresa foi demitido repentinamente devido a supostos relacionamentos extraconjugais, incluindo um com uma suposta espiã chinesa. O secretário do Tesouro dos EUA, Scott Bessent, questionou a empresa sobre sua conformidade com as restrições de exportação para a China e sugeriu que a Nvidia precisa de um 'shake-up' com um novo CEO externo. O escândalo também causou uma queda de quase 30% nas ações da empresa, afetando milhões de americanos. Por outro lado, a Anthropic, proprietária do Claude, está definindo o preço da oferta inicial de ações (IPO), com modelos de IA chineses mais baratos pressionando seus custos. A TSMC, por sua vez, obteve um financiamento recorde para expandir suas fábricas de processadores, refletindo o crescimento das operações da empresa.", "ciencia": "Um importante evento no campo científico foi a rejeição do medicamento Ivonescimab pela FDA, o que representa um golpe para o setor biotecnológico chinês. O Ivonescimab, desenvolvido na China, era um teste para verificar a capacidade de medicamentos chineses de passar pela regulamentação dos EUA. Em outro desenvolvimento, a Embrapa busca retomar seu papel relevante na cadeia da soja após ter perdido o desenvolvimento de transgênicos devido a altos custos e concorrência. Além disso, a NASA alertou que o El Niño de 2026 poderia superar o evento histórico de 1997-98, com possíveis grandes precipitações e inundações este inverno. Outros avanços na pesquisa incluem a descoberta de um novo tipo de fungo gigante na China, que pode crescer até 20 polegadas de altura, e a Voyager 1, sonda espacial da NASA, que atingirá a distância de um dia-luz da Terra na próxima quarta-feira, marcando um marco importante na missão interestelar mais longeva da história humana.", "cultura": "O Papa Leão XIV continua sua visita ao Peru, realizando seu penúltimo dia de atividades em Cusco, onde participará de encontros com fiéis e missionários e realizará uma oração na Praça da Basílica Catedral de Nossa Senhora Aparecida. Durante a viagem, o papa enfrentou problemas de saúde, mas conseguiu subir a Cusco, localizada a mais de 3.400 metros acima do nível do mar, realizando um teste físico desafiador. Em outro evento cultural, o Rock & Roll Hall of Fame realizou sua cerimônia de indução, com performances memoráveis de Phil Collins, St. Vincent, Metallica e outros artistas, incluindo um tributo ao Wu-Tang Clan. No Brasil, o Festival da Folha Gourmet celebrou seu último dia com bom tempo, enquanto o Instituto Inhotim inaugurou duas novas atrações em comemoração aos seus 20 anos. No cinema, o filme 'Peixe Abissal' mistura registros atuais, arquivos e animação para explorar a solidão e a dor profunda do cineasta Jairo Ferreira, enquanto 'Obsessão' se transforma em um grande sucesso global.", "sociedade": "Mais de 100 mil pessoas participaram de novos protestos na França no quinto sábado consecutivo, contra o alto custo de vida e em defesa de uma educação melhor. As manifestações, que ocorreram em mais de 100 cidades, resultaram na detenção de 219 manifestantes. O ministro da Educação relatou ataques hackers no Instituto Nacional de Estudos e Pesquisas Educacionais (Inep) no dia anterior ao Exame Nacional do Ensino Médio (Enem), que ocorre neste domingo. Um engenheiro de 75 anos do Distrito Federal, Zacarias da Silva Filho, participa do Enem com a intenção de atualizar seus conhecimentos e buscar uma vaga no curso de direito. Além disso, o Ministério da Saúde registrou mais de 10 mil atendimentos por diabetes em 2026, atendendo 57 mil pessoas desde 2018, e o Ministério Público de Goiás (MPGO) está avaliando a possibilidade de interditar uma fábrica localizada no Entorno do Distrito Federal que transforma a rotina de moradores em pesadelo, tratando diariamente 9 toneladas de resíduos animais e gerando odor e ruído intensos.", "meio_ambiente": "O Canadá anunciou um investimento bilionário de 400 milhões de dólares (aproximadamente R$ 2,26 bilhões) ao Fundo de Proteção de Florestas ao longo de quatro anos, durante uma reunião com o presidente Lula. Este compromisso, juntamente com o segundo aporte do Canadá ao Fundo para Florestas Tropicais no valor de 400 milhões de dólares, reforça a importância da proteção ambiental. Em outro desenvolvimento, incêndios ameaçam comunidades tradicionais no Pará, que está enfrentando uma estiagem severa, levando o estado a decretar emergência. Além disso, a China registrou uma redução nas emissões de carbono, graças à rápida expansão das energias renováveis, e o Irã afirmou ter afundado um supernavio com 2 milhões de barris de petróleo no Estreito de Ormuz, em meio à tensão com os Estados Unidos.", "direitos_humanos": "Mais de 1.400 migrantes chegaram às Ilhas Canárias, na Espanha, em um único dia, conforme relatório do al Jazeera. Em outro desenvolvimento, um tribunal jordaniano sentenciou três homens à morte por enforcamento após um ataque a uma igreja em Karak que resultou na morte de nove pessoas, informou o al Jazeera. A Malásia planeja permitir que refugiados trabalhem legalmente, o que aumentou as esperanças da comunidade de refugiados, mas ativistas afirmam que a medida precisará de procedimentos claros de registro e proteções no ambiente de trabalho para ser eficaz, conforme relatado pelo South China Morning Post. No Irã, o movimento de mulheres que se opõem ao uso obrigatório do hijab está causando reações das autoridades e grupos conservadores, com sinais de que pode haver uma tentativa de boicote ao uso do véu, informou a Carta Capital. Um incêndio destruiu um acampamento de refugiados sírios em Bar Elias, no leste do Líbano, e a Marinha Austríaca está impedida de treinar marinheiros transexuais e não-binários em submarinos nucleares devido a diretrizes dos EUA, mesmo com o acordo Aukus, conforme revelado por documentos do The Guardian. Por fim, um lar para idosos na Tailândia está sendo acusado de manter dezenas de residentes idosos em gaiolas metálicas, informou o al Jazeera."}, "resumo_do_dia": {"politica_nacional": [{"id": 265423, "titulo": "TSE adia entrega de contas do 2º turno após pane global na Microsoft", "url": "https://veja.abril.com.br/brasil/tse-adia-entrega-de-contas-do-2o-turno-apos-pane-global-na-microsoft/", "fonte_id": "veja", "data_pub": "2026-11-15T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) adiou o prazo para a entrega de contas do 2º turno e a devolução de sobras do Fundo Eleitoral para esta segunda-feira (16). A decisão foi tomada após uma pane global na Microsoft.", "titulo_pt": "TSE adia entrega de contas do 2º turno após pane global na Microsoft", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 265455, "titulo": "Bancada do PL em SC rejeita Hugo Motta e cobra candidatura própria à Câmara", "url": "https://www.metropoles.com/colunas/grande-angular/bancada-do-pl-em-sc-rejeita-hugo-motta-e-cobra-candidatura-propria-a-camara", "fonte_id": "metropoles", "data_pub": "2026-11-15T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sete deputados eleitos do partido PL em Santa Catarina rejeitaram a indicação do deputado federal Hugo Motta para uma vaga na Câmara Federal e exigiram que o partido apresente uma candidatura própria.", "titulo_pt": "Bancada do PL em SC rejeita Hugo Motta e cobra candidatura própria para Câmara", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 265499, "titulo": "Cancelamentos de voos ultrapassam 1.500 nos EUA no domingo", "url": "https://www.cnnbrasil.com.br/internacional/cancelamentos-de-voos-ultrapassam-1-500-nos-eua-no-domingo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.500 voos foram cancelados nos Estados Unidos no domingo, apesar das operações da Administração Federal de Aviação (FAA) terem retornado ao normal. Há relatos de longas filas e atrasos graves em vários aeroportos do país.", "titulo_pt": "Cancelamentos de voos superam 1.500 nos EUA no domingo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 265443, "titulo": "STJ proíbe cobrança de aluguel a ex-cônjuge que mora com filhos", "url": "https://www.poder360.com.br/poder-justica/stj-proibe-cobranca-de-aluguel-a-ex-conjuge-que-mora-com-filhos/", "fonte_id": "poder360", "data_pub": "2026-11-15T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) proibiu a cobrança de aluguel de um imóvel por uma ex-cônjuge que mora com os filhos. A decisão considera que o uso do imóvel pelos filhos atende ao dever de sustento e afasta o enriquecimento sem causa.", "titulo_pt": "STJ proíbe cobrança de aluguel de ex-cônjuge que mora com filhos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 265502, "titulo": "Como vídeo humorístico ajudou a eleger senador democrata no Mississippi", "url": "https://www.cnnbrasil.com.br/internacional/como-video-humoristico-ajudou-a-eleger-senador-democrata-no-mississippi/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Scott Colom se tornou o primeiro senador negro eleito no Mississippi em 150 anos. Um vídeo humorístico com humor e palavrões ajudou a eleger o candidato em todo o mundo.", "titulo_pt": "Como vídeo humorístico ajudou a eleger senador democrata negro no Mississippi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 265404, "titulo": "Rio de Janeiro tem primeira morte confirmada por mpox no país", "url": "https://www.cartacapital.com.br/saude/rio-de-janeiro-tem-primeira-morte-confirmada-por-mpox-no-pais/", "fonte_id": "cartacapital", "data_pub": "2026-11-15T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio de Janeiro registrou a primeira morte confirmada por mpox no país. O estado também registrou 382 casos com comprovação laboratorial.", "titulo_pt": "Rio de Janeiro registra primeira morte por mpox no país", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 265444, "titulo": "STJ decide que condomínio pode responder por furto se portaria falhar", "url": "https://www.poder360.com.br/poder-justica/stj-decide-que-condominio-pode-responder-por-furto-se-portaria-falhar/", "fonte_id": "poder360", "data_pub": "2026-11-15T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 3ª Turma do Superior Tribunal de Justiça (STJ) decidiu que um condomínio pode ser responsabilizado por furto se a portaria falhar em prevenir a entrada de criminosos sem autorização dos moradores. A decisão manteve uma condenação em Rio de Janeiro nesse sentido.", "titulo_pt": "STJ decide que condomínio pode ser responsabilizado por furto se portaria falhar", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 265445, "titulo": "Petrobras cai 3 posições em ranking de lucro de petroleiras", "url": "https://www.poder360.com.br/poder-energia/petrobras-cai-3-posicoes-em-ranking-de-lucro-de-petroleiras/", "fonte_id": "poder360", "data_pub": "2026-11-15T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras registrou um lucro de US$ 7,7 bilhões no terceiro trimestre de 2026, caindo três posições no ranking de lucro de petroleiras. A Saudi Aramco liderou a lista com um lucro de US$ 36,6 bilhões.", "titulo_pt": "Petrobras cai três posições no ranking de lucro de petroleiras", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 265466, "titulo": "Celina promete retomada de obras de drenagem após alagamentos em Ceilândia", "url": "https://www.metropoles.com/distrito-federal/celina-promete-retomada-de-obras-de-drenagem-apos-alagamentos-em-ceilandia", "fonte_id": "metropoles", "data_pub": "2026-11-15T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora do Distrito Federal prometeu retomar as obras de drenagem após alagamentos em Ceilândia. O volume de chuva esperado para o mês foi registrado em apenas 25 minutos.", "titulo_pt": "Celina promete retomada de obras de drenagem após alagamentos em Ceilândia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 265380, "titulo": "Folha altera cabeçalho em alusão ao Dia da Proclamação da República", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/folha-altera-cabecalho-em-alusao-ao-dia-da-proclamacao-da-republica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-15T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de S.Paulo altera seu cabeçalho neste domingo para incluir a bandeira do Brasil em homenagem ao Dia da Proclamação da República. A mudança é aplicada tanto na versão impressa quanto digital.", "titulo_pt": "Folha altera cabeçalho em alusão ao Dia da Proclamação da República", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 265427, "titulo": "Como a defesa de Lula justifica os R$ 48,3 milhões questionados pelo TSE", "url": "https://veja.abril.com.br/politica/como-a-defesa-de-lula-justifica-os-r-483-milhoes-questionados-pelo-tse/", "fonte_id": "veja", "data_pub": "2026-11-15T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados da campanha de Lula enviaram explicações ao Tribunal Superior Eleitoral (TSE) sobre os R$ 48,3 milhões questionados. O documento justifica os valores em questão.", "titulo_pt": "Como a defesa de Lula justifica os R$ 48,3 milhões questionados pelo TSE", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 265535, "titulo": "Infantino encontra Lula nas Filipinas e marca reunião sobre a Copa Feminina de 2027", "url": "https://www.infomoney.com.br/mundo/infantino-encontra-lula-nas-filipinas-e-marca-reuniao-sobre-a-copa-feminina-de-2027/", "fonte_id": "infomoney", "data_pub": "2026-11-15T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da FIFA, Gianni Infantino, se encontrou com Lula nas Filipinas durante uma cúpula da ASEAN e marcou uma reunião para tratar da Copa Feminina de 2027 no Brasil.", "titulo_pt": "Infantino encontra Lula nas Filipinas e marca reunião sobre a Copa Feminina de 2027", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 265446, "titulo": "Queda do desmatamento garantiu novo repasse da Noruega, diz Alckmin", "url": "https://www.poder360.com.br/poder-governo/queda-do-desmatamento-garantiu-novo-repasse-da-noruega-diz-alckmin/", "fonte_id": "poder360", "data_pub": "2026-11-15T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente em exercício Geraldo Alckmin anunciou que a queda significativa no desmatamento no Brasil resultou em um novo repasse de quase R$ 400 milhões da Noruega. O total doado desde 2008 ultrapassa R$ 4 bilhões.", "titulo_pt": "Redução no desmatamento garantiu novo repasse da Noruega, diz Alckmin", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 265405, "titulo": "O crítico, o carvalho e o herdeiro", "url": "https://www.cartacapital.com.br/blogs/pantagruel/o-critico-o-carvalho-e-o-herdeiro/", "fonte_id": "cartacapital", "data_pub": "2026-11-15T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um evento inspirado no banquete de fim de colheita de Meursault reuniu seis produtores da região francesa em São Paulo e no Rio de Janeiro. Jean-Marie Fourrier, um dos participantes, falou sobre os novos desafios da região mais cobiçada do mundo.", "titulo_pt": "O crítico, o carvalho e o herdeiro", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 265406, "titulo": "Morre aos 68 anos Aroldo Macêdo, mestre da guitarra baiana e guardião da história do trio elétrico", "url": "https://www.cartacapital.com.br/blogs/augusto-diniz/morre-aos-68-anos-aroldo-macedo-mestre-da-guitarra-baiana-e-guardiao-da-historia-do-trio-eletrico/", "fonte_id": "cartacapital", "data_pub": "2026-11-15T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aroldo Macêdo, músico baiano conhecido como mestre da guitarra baiana e guardião da história do trio elétrico, faleceu aos 68 anos após se encontrar internado em Salvador e enfrentar uma doença degenerativa.", "titulo_pt": "Morre aos 68 anos Aroldo Macêdo, mestre da guitarra baiana e guardião da história do trio elétrico", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 265373, "titulo": "Projeto de ajuste fiscal vai na direção correta e deve chegar à Câmara nesta semana, diz Alckmin", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/projeto-de-ajuste-fiscal-vai-na-direcao-correta-e-deve-chegar-a-camara-nesta-semana-diz-alckmin.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-15T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da República em exercício, Geraldo Alckmin, afirmou que o projeto de ajuste fiscal será enviado à Câmara dos Deputados após a votação no Senado. Alckmin considera que o projeto vai na direção correta e pode contribuir para a redução dos juros da economia.", "titulo_pt": "Alckmin diz que projeto de ajuste fiscal deve chegar à Câmara nesta semana", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 265859, "titulo": "Taiwan flags page over military data", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/16/2003867803", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan discute a bandeira da página sobre dados militares. Os detalhes específicos dos dados militares em questão não foram fornecidos nesse trecho.", "titulo_pt": "Taiwan discute bandeira da página sobre dados militares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265861, "titulo": "MOFA introduces tighter cybersecurity after data breaches", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/16/2003867805", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério dos Negócios Estrangeiros (MOFA) implementou medidas mais rigorosas de segurança cibernética em resposta a brechas de dados recentes.", "titulo_pt": "MOFA introduz medidas mais rígidas de segurança cibernética após brechas de dados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265862, "titulo": "Manila, Canberra sign defense pact with eye on China", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/16/2003867806", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Manila e Canberra assinaram um acordo de defesa com o objetivo de se posicionar contra a influência crescente da China.", "titulo_pt": "Manila e Canberra assinam acordo de defesa com olho na China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265863, "titulo": "R of-the-us-ai-boom?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute os custos ocultos associados ao boom da inteligência artificial nos Estados Unidos, abordando aspectos negativos não frequentemente mencionados na discussão sobre o avanço tecnológico.", "titulo_pt": "Os custos ocultos do boom da IA nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 265614, "titulo": "Todo empezó con un inmigrante en 1898 y hoy, después de más de 100 años, mantiene su vigencia: “Mi abuela hacía dulce de leche en estas cocinas”", "url": "https://www.lanacion.com.ar/economia/campo/todo-empezo-con-un-inmigrante-en-1898-y-hoy-despues-de-mas-de-100-anos-mantiene-su-vigencia-mi-nid15112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-15T17:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Istilart, uma empresa argentina fundada em 1898, continua produzindo mais de 500 churrasqueiras por ano, mantendo um ofício quase artesanal. Seus modelos de fundição ainda são utilizados em casas distantes da rede de gás.", "titulo_pt": "Todo começou com um imigrante em 1898 e hoje, depois de mais de 100 anos, a istilart mantém sua vigência", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 265752, "titulo": "Czechs rally against plan to switch funding of public media", "url": "https://www.bbc.co.uk/news/articles/cm8e0knr7604o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-15T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos ocorrem na República Tcheca contra um plano de alterar a financiamento da mídia pública, enquanto o governo afirma que as emissoras precisam reduzir custos.", "titulo_pt": "Tchecos se mobilizam contra plano de alterar financiamento da mídia pública", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 265628, "titulo": "Guatemala decreta el estado de sitio en el feudo de los grupos narco señalados como terroristas por Estados Unidos", "url": "https://elpais.com/america/2026-11-15/guatemala-decreta-el-estado-de-sitio-en-el-feudo-de-los-grupos-narco-senalados-como-terroristas-por-estados-unidos.html", "fonte_id": "elpais_america", "data_pub": "2026-11-15T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Arévalo decretou o estado de sitio nas regiões de Zacapa e Izabal, importantes para o tráfico de drogas para o México, por um período de um mês. Essas áreas são consideradas feudos de grupos criminosos classificados como terroristas pelos Estados Unidos.", "titulo_pt": "Guatemala declara estado de exceção em zonas críticas para o tráfico de drogas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 265627, "titulo": "La visita de León XIV a Perú, en vivo|El Papa se despide del Cuzco entre aplausos y emprende viaje hacia Pucallpa, en la selva del Amazonas", "url": "https://elpais.com/america/2026-11-15/la-visita-de-leon-xiv-a-peru-en-vivo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-15T17:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco iniciou sua visita ao Peru com a cerimônia de coroação da Virgem Imaculada na catedral de Santa Maria em Cuzco. Ele depois se despediu da cidade com aplausos e seguiu viagem para Pucallpa, na floresta amazônica.", "titulo_pt": "A visita do Papa francisco ao Cuzco, com cerimônia de coroação e despedida com aplausos, antes de seguir para a amazônia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 265533, "titulo": "Irã ataca base dos EUA no Barein com drones; reino diz ter interceptado ofensiva", "url": "https://www.infomoney.com.br/mundo/ira-ataca-base-dos-eua-no-barein-com-drones-reino-diz-ter-interceptado-ofensiva/", "fonte_id": "infomoney", "data_pub": "2026-11-15T17:11:00Z", "idioma": "pt", "provavel_dup  da Bloomberg, a empresa lançará seu primeiro modelo, sem recursos de realidade aumentada, no WWDC de junho do próximo ano, mas as entregas não começariam imediatamente.", "titulo_pt": "As primeiras lentes inteligentes da apple estão prestes a serem anunciadas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 265885, "titulo": "US’ Bessent says Nvidia must ‘go outside the company’ to find new CEO after Jensen Huang", "url": "https://www.scmp.com/news/world/united-states-canada/article/3374512/bessent-says-nvidia-must-go-outside-company-find-new-ceo", "fonte_id": "scmp", "data_pub": "2026-11-15T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, afirmou que a Nvidia deve procurar um novo CEO fora da empresa após a demissão abrupta de Jensen Huang. Huang deixou a posição devido a revelações de relacionamentos extraconjugais, incluindo um com uma suposta espiã chinesa, levando a uma crise para a fabricante de chips.", "titulo_pt": "Secretário do tesouro dos EUA diz que Nvidia deve buscar CEO fora da empresa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265911, "titulo": "The tech products we enthusiastically recommend this holiday season", "url": "https://techcrunch.com/2026/11/15/the-tech-products-we-enthusiastically-recommend-this-holiday-season/", "fonte_id": "techcrunch", "data_pub": "2026-11-15T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TechCrunch tem revisado várias novas gadgets este ano e tem algumas opções favoritas para recomendar para compras de Black Friday e além.", "titulo_pt": "Os produtos tecnológicos que recomendamos entusiasticamente neste período festivo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 265821, "titulo": "Fascism built the AI bubble. What will burst it?", "url": "https://www.aljazeera.com/video/deja-vu-2/2026/11/15/fascism-built-the-ai-bubble-what-will-burst-it?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T14:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Naomi Klein e Astra Taylor discutem no último episódio do Deja Vu o modelo mais recente de capitalismo desastroso.", "titulo_pt": "O fascismo criou a bolha da IA. O que estourará essa bolha?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 265823, "titulo": "‘Almost magic’ as SpaceX craft caught mid-air: Why it matters", "url": "https://www.aljazeera.com/news/2026/11/15/almost-magic-as-spacex-craft-caught-mid-air-why-it-matters?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Starship da SpaceX retornou com sucesso ao seu local de lançamento após orbitar na atmosfera espacial. Este evento foi considerado quase mágico devido à sua natureza impressionante.", "titulo_pt": "Atingimento impressionante da starship da SpaceX ao retornar ao lançamento após órbita", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 265908, "titulo": "The Sony Aibo was a robot revolution dressed like a dog", "url": "https://www.theverge.com/podcast/1033948/sony-aibo-robot-dog-version-history", "fonte_id": "the_verge", "data_pub": "2026-11-15T13:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No final dos anos 90, a Sony acreditava que estávamos à beira de uma revolução robótica. O company planejava que os robôs humanóides se tornariam parte da vida cotidiana, incluindo papéis de empregados, amigos e até mesmo animais de estimação.", "titulo_pt": "O Sony Aibo foi uma revolução robótica disfarçada de cão", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 265843, "titulo": "FDA rejects cancer drug invented in China in blow to Beijing’s biotech sector", "url": "https://www.ft.com/content/390948a3-429c-410a-b5fe-54cc5a380b99?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-15T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA rejeitou o medicamento contra o câncer Ivonescimab, desenvolvido na China, o que representa um golpe para o setor biotecnológico chinês. O medicamento era considerado um teste para verificar se medicamentos chineses poderiam passar pela regulamentação dos EUA.", "titulo_pt": "FDA rejeita medicamento contra câncer chinês em golpe para setor biotecnológico chinês", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 265959, "titulo": "30 years ago, 'Space Jam' proposed the best way to resolve interplanetary disputes", "url": "https://www.space.com/entertainment/space-movies-shows/30-years-ago-space-jam-proposed-the-best-way-to-resolve-interplanetary-disputes", "fonte_id": "space_com", "data_pub": "2026-11-15T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 30 anos, o filme 'Space Jam' apresentou uma das melhores formas de resolver disputas interplanetárias. O filme retrata a chegada dos Monstars e da equipe Tune Squad, que se tornaram um exemplo de resolução de conflitos interestelares.", "titulo_pt": "Há 30 anos, 'Space Jam' sugeriu a melhor maneira de resolver disputas interplanetárias", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 265919, "titulo": "Tangled quantum whirlpools caught unraveling in an ultracold gas", "url": "https://phys.org/news/2026-11-tangled-quantum-whirlpools-caught-unraveling.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando uma nuvem de átomos é resfriada próximo ao zero absoluto, pode se tornar um condensado de Bose-Einstein (BEC), onde todos os átomos compartilham um único estado quântico. Atualmente, teorias sugerem que à medida que um gás quântico desordenado se organiza nesse estado ordenado, uma trela de vórtices microscópicos deve se formar e gradualmente se desfazer.", "titulo_pt": "Vórtices quânticos desentrelaçados em um gás ultrarrefrescado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265516, "titulo": "Paciente sem metástase após vacina russa: é cedo para cura, diz cientista", "url": "https://www.cnnbrasil.com.br/ciencia/paciente-sem-metastase-apos-vacina-russa-e-cedo-para-cura-diz-cientista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T16:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro paciente a receber a vacina experimental russa contra o câncer apresentou estabilidade no quadro clínico, mas cientistas alertam que é cedo para afirmar a eficácia do tratamento.", "titulo_pt": "Paciente sem metástase após vacina russa: é cedo para cura, diz cientista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 265960, "titulo": "On this day in space! Nov. 15, 1988: The 300-foot Green Bank Telescope collapses suddenly, leaving a huge pile of wreckage in West Virginia", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-15-2026", "fonte_id": "space_com", "data_pub": "2026-11-15T15:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 15 de novembro de 1988, um telescópio radioelétrico de 300 pés em Green Bank, West Virginia, caiu repentinamente, deixando um grande monte de escombros no local. Este evento foi significativo devido à perda do equipamento valioso e aos impactos na pesquisa científica.", "titulo_pt": "15 De novembro de 1988: o telescópio radioelétrico de 300 pés em Green Bank, West Virginia, colapsa repentinamente", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 265920, "titulo": "Climate response: Why previous warming makes all the difference", "url": "https://phys.org/news/2026-11-climate-response-previous-difference.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temperatura global pode continuar aumentando mesmo após a parada das emissões de CO₂ humanas. O estudo, liderado pelo Met Office Hadley Center e com co-autores da Universidade de Liverpool, mostrou que a resposta térmica depende do quão quente já está ficando a Terra.", "titulo_pt": "Resposta climática: por que o aquecimento anterior faz toda a diferença", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265936, "titulo": "STAT+: FDA rejects lung cancer treatment ivonescimab from Summit Therapeutics", "url": "https://www.statnews.com/2026/11/15/fda-rejects-ivonescimab-lung-cancer-treatment-summit-therapeutics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-15T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA rejeitou ivonescimab, um tratamento para um tipo de câncer de pulmão desenvolvido pela biotecnológica Summit Therapeutics, dos Estados Unidos, e pela farmacêutica chinesa Akeso.", "titulo_pt": "FDA rejeita tratamento para câncer de pulmão ivonescimab de Summit Therapeutics e akeso", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 265396, "titulo": "O tempo realmente existe ou é uma ilusão persistente?", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/o-tempo-realmente-existe-ou-e-uma-ilusao-persistente.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-15T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto descreve uma situação hipotética onde uma pessoa está em um trem em movimento constante, sem perceber a velocidade, e a iluminação dentro do vagão é uniforme, ilustrando conceitos relacionados ao tempo e à percepção de movimento.", "titulo_pt": "O tempo realmente existe ou é uma ilusão persistente?", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 265921, "titulo": "Giant, prehistoric rodent fossils discovered in southern Thailand", "url": "https://phys.org/news/2026-11-giant-prehistoric-rodent-fossils-southern.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de paleontólogos, incluindo pesquisadores da McGill University, descobriu fósseis de roedores gigantes em uma mina no sul da Tailândia. O achado, publicado em Scientific Reports, sugere que a evolução de roedores gigantes tem uma história mais antiga e mais ampla geograficamente do que se sabia anteriormente.", "titulo_pt": "Fósseis de roedores gigantes descobertos na tailândia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265961, "titulo": "Why hasn't the 'Blaze Star' exploded yet? Astronomers weigh in on what to expect", "url": "https://www.space.com/stargazing/why-hasnt-the-blaze-star-exploded-yet-astronomers-weigh-in-on-what-to-expect", "fonte_id": "space_com", "data_pub": "2026-11-15T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estrela 'Blaze Star' (T CrB) irá erupcionar em breve. Astrônomos são muito confiantes sobre essa previsão.", "titulo_pt": "Por que a 'estrela de chama' ainda não explodiu? Astrônomos se pronunciam sobre o que esperar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 265375, "titulo": "Após perder corrida dos transgênicos, Embrapa quer competir na edição gênica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/apos-perder-corrida-dos-transgenicos-embrapa-quer-competir-na-edicao-genica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-15T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embrapa perdeu o desenvolvimento dos transgênicos recentemente devido aos altos custos e à concorrência das multinacionais, o que resultou em uma concentração do mercado. Com novas tecnologias, a empresa busca retomar seu papel relevante na cadeia da soja.", "titulo_pt": "Embrapa quer competir na edição gênica após perder corrida dos transgênicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 265939, "titulo": "Vitamin C could help block cancer-linked chemicals in your stomach, study finds", "url": "https://www.sciencedaily.com/releases/2026/11/261114202236.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T14:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que a vitamina C pode ajudar a prevenir químicos potencialmente cancerígenos da formação no estômago após o consumo de alimentos ricos em nitritos. Um novo modelo matemático sugere que a ingestão de vitamina C após as refeições pode reduzir essas reações prejudiciais, oferecendo uma possível nova estratégia para diminuir o risco de câncer.", "titulo_pt": "Vitamina C pode ajudar a bloquear químicos cancerígenos no estômago", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 265943, "titulo": "A common osteoporosis drug blocked spinal damage in a surprising new study", "url": "https://www.sciencedaily.com/releases/2026/11/261113232105.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T14:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram uma conexão genética inesperada entre a degeneração espinhal e um medicamento existente contra a osteoporose que pode prevenir o acúmulo de minerais danosos nos espinhos de peixes-zêbra. Este achado pode abrir caminho para novos tratamentos que freiem ou evitem uma das principais causas de dores crônicas na coluna.", "titulo_pt": "Medicamento contra osteoporose bloqueia danos espinhais em estudo surpreendente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 265922, "titulo": "New observations challenge evidence for an 'outsize' black hole in the early universe", "url": "https://phys.org/news/2026-11-evidence-outsize-black-hole-early.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma reanálise recente da galáxia UHZ1, que abrigava um buraco negro supostamente muito grande e coberto por poeira, utilizando dados X-ray existentes e novas observações infravermelhas, não encontrou evidências de atividade oculta de buraco negro. O estudo, publicado em The Astrophysical Journal, sugere que UHZ1 pode ser uma galáxia de baixa massa, pobre em metais e em formação estelar.", "titulo_pt": "Novas observações questionam evidências de um 'buraco negro oversized' na era inicial do universo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265940, "titulo": "NASA warns this year's Monster El Niño could be even bigger than legendary 1997 event", "url": "https://www.sciencedaily.com/releases/2026/11/261114202227.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T13:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "NASA alerta que o El Niño de 2026 poderia superar o evento histórico de 1997-98, com possíveis grandes precipitações e inundações este inverno, embora os impactos exatos ainda sejam incertos.", "titulo_pt": "NASA avisa: El Niño de 2026 pode ser maior que o lendário evento de 1997", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 265941, "titulo": "Uranus and Neptune’s bizarre magnetic fields may finally be explained", "url": "https://www.sciencedaily.com/releases/2026/11/261114202204.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T13:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes sugerem que condições extremas internas de Urano e Netuno criam propriedades elétricas únicas que podem explicar seus campos magnéticos estranhos e inclinados. Os polos magnéticos desses planetas gigantes de gelo podem se mover vários graus em apenas algumas décadas.", "titulo_pt": "Campos magnéticos estranhos de urano e netuno podem ter sido explicados", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 265868, "titulo": "Takuya Kimura thanks Taiwan for disaster support", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/16/2003867819", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Takuya Kimura agradeceu Taiwan pela assistência durante desastres naturais.", "titulo_pt": "Takuya Kimura agradece Taiwan por apoio em desastres", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265875, "titulo": "Divine generals", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/16/2003867827", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto não fornece nenhum trecho específico para resumir. Por favor, forneça um trecho do artigo para que eu possa resumir adequadamente.", "titulo_pt": "Divinos generais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265389, "titulo": "Com sol, público aproveita cervejas e vinhos no último dia do festival da Folha", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/restaurantes/2026/11/com-sol-publico-aproveita-cervejas-e-vinhos-no-ultimo-dia-do-festival-da-folha.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-15T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antes da abertura dos portões, o público formava filas para entrar no Folha Gourmet Festival no último dia de evento, domingo (15). O bom tempo atraiu visitantes para o parque Villa-Lobos.", "titulo_pt": "Com sol, público aproveita cervejas e vinhos no último dia do festival da Folha", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 265390, "titulo": "Phil Collins sobe ao palco do Hall da Fama do Rock de bengalas e se emociona", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/phil-collins-sobe-ao-palco-do-hall-da-fama-do-rock-de-bengalas-e-se-emociona.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-15T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Phil Collins subiu ao palco da cerimônia do Hall da Fama do Rock & Roll com bengalas devido a problemas de saúde e não conseguiu conter as lágrimas. Ele compareceu acompanhado de seus filhos, incluindo Lily Collins, famosa pela série 'Emily em Paris'.", "titulo_pt": "Phil Collins sobe ao palco do Hall da Fama do Rock & roll com bengalas e se emociona", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 265883, "titulo": "Pope Leo visits high Andes, testing recovery from lung cancer surgery", "url": "https://www.scmp.com/news/world/americas/article/3374515/pope-leo-visits-high-andes-testing-recovery-lung-cancer-surgery", "fonte_id": "scmp", "data_pub": "2026-11-15T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão, de 71 anos, enfrentou seu teste físico mais desafiador desde a cirurgia de câncer no pulmão ao visitar a Cusco, no alto Andes, durante sua turnê pela América do Sul. O papa, que teve parte do pulmão removido há um mês, chegou à capital incaica, localizada a mais de 3.400 metros acima do nível do mar.", "titulo_pt": "Papa leão visita cusco aéreo, testando recuperação após cirurgia de câncer no pulmão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265964, "titulo": "Box Office: ‘Club Kid’ Scores Best Limited Expansion of the Year as Younger Audiences Embrace Jordan Firstman’s Oscar Hopeful", "url": "https://www.indiewire.com/news/box-office/box-office-club-kid-best-limited-expansion-of-2026-jordan-firstman-1235228073/", "fonte_id": "indiewire", "data_pub": "2026-11-15T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Club Kid', que teve um lançamento limitado, arrecadou $756,060 em 27 telas, elevando seu total de bilheteria doméstica para quase $1,5 milhão.", "titulo_pt": "Caixa-postal: 'club Kid' obtém melhor expansão limitada do ano, enquanto jovens espectadores adotam filme com esperança de Oscar de Jordan Firstman", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 265966, "titulo": "Watch Wu-Tang Clan Perform at the Rock & Roll Hall of Fame 2026 Induction Ceremony", "url": "https://pitchfork.com/story/watch-wu-tang-clan-perform-at-the-rock-and-roll-hall-of-fame-2026-induction-ceremony/", "fonte_id": "pitchfork", "data_pub": "2026-11-15T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os membros do Wu-Tang Clan, incluindo RZA, GZA, Method Man, Raekwon e Ghostface Killah, apresentaram alguns de seus maiores sucessos durante a cerimônia de indução ao Rock & Roll Hall of Fame em 2026.", "titulo_pt": "Veja Wu-Tang Clan executar hits na cerimônia de indução ao Rock & Roll Hall of Fame em 2026", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 265688, "titulo": "Caravaggio", "url": "https://www.theatlantic.com/books/2026/11/poem-peter-balakian-caravaggio/689422/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-15T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto original se refere a um poema, mas não fornece detalhes adicionais sobre seu conteúdo ou contexto.", "titulo_pt": "Um poema", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 265400, "titulo": "Zezé Motta participa de tributo a Milton Nascimento nesta segunda", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/zeze-motta-participa-de-tributo-milton-nascimento-nesta-segunda", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-15T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cantora e atriz Zezé Motta participará de um concerto em homenagem a Milton Nascimento, que será realizado no Teatro TotalEnergies no Rio de Janeiro. O show, intitulado 'Raça — Uma homenagem a Milton rgentina", "classe": "C"}, {"id": 265411, "titulo": "Mais de 100 mil vão às ruas em novos protestos na França", "url": "https://www.cartacapital.com.br/mundo/mais-de-100-mil-vao-as-ruas-em-novos-protestos-na-franca/", "fonte_id": "cartacapital", "data_pub": "2026-11-15T13:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 mil pessoas participaram de novos protestos na França no quinto sábado consecutivo, contra o alto custo de vida e em defesa de uma educação melhor. A polícia deteve 219 manifestantes durante as manifestações.", "titulo_pt": "Mais de 100 mil vão às ruas em novos protestos na França", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 265550, "titulo": "'Descobriram um tratamento para a demência do meu filho de 5 anos, mas ele custa mais de R$ 20 milhões'", "url": "https://www.bbc.com/portuguese/articles/cqgklye785xko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-15T12:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um medicamento desenvolvido nos Estados Unidos pode retardar os primeiros sinais da doença de Tate McDaid, mas o acesso ao tratamento é difícil de ser obtido devido ao seu custo elevado. O tratamento custa mais de R$ 20 milhões.", "titulo_pt": "Descobriram um tratamento para a demência do meu filho de 5 anos, mas ele custa mais de R$ 20 milhões", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 265857, "titulo": "Respiratory illnesses rise in Gaza with worst to come as winter floods arrive, WHO says", "url": "https://www.japantimes.co.jp/news/2026/11/15/world/respiratory-illness-gaza-floods-who/", "fonte_id": "japan_times", "data_pub": "2026-11-15T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As doenças respiratórias aumentaram em Gaza devido às condições de vida ruins e à superpopulação, segundo a OMS. A situação será ainda mais grave com a chegada das inundações do inverno, conforme informo vavel_duplicata_de": null, "texto_pt": "A fábrica localizada no Entorno do Distrito Federal trata diariamente 9 toneladas de resíduos animais, gerando odor e ruído intensos. O Ministério Público de Goiás (MPGO) está avaliando a possibilidade de interditar o estabelecimento.", "titulo_pt": "Fábrica do fedor transforma rotina de moradores em pesadelo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 265302, "titulo": "70% of Seoul youth see discrimination against women and men: survey", "url": "https://www.koreaherald.com/article/10937528", "fonte_id": "korea_herald", "data_pub": "2026-11-15T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado pela Fundação das Mulheres e Família de Seul, entre 11 e 29 de maio, com 2.647 pessoas na faixa etária de 19 a 34 anos, revelou que 69,2% dos jovens se preocupam com a discriminação baseada no gênero. Cerca de 40,3% dos entrevistados afirmaram serem conscientes de desvantagens estruturais contra as mulheres e de que há discriminação significativa entre homens e mulheres.", "titulo_pt": "70% Dos jovens de seul se preocupam com discriminação de gênero: pesquisa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 265546, "titulo": "Como China finalmente reduziu emissão de poluentes e planeja 'revolução de energias renováveis'", "url": "https://www.bbc.com/portuguese/articles/ckpqgqq307xlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-15T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rápida expansão das energias renováveis fez com que as emissões de carbono da China parassem de aumentar. Cinco gráficos ilustram como o país alcançou este feito.", "titulo_pt": "Como China conseguiu parar o crescimento das emissões de carbono e planeja uma 'revolução de energias renováveis'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 265637, "titulo": "DPR de Atacama advierte aumento del caudal del río en Alto del Carmen y llaman a vecinos a abandonar zonas de riesgo", "url": "https://www.latercera.com/nacional/noticia/dpr-de-atacama-advierte-aumento-del-caudal-del-rio-en-alto-del-carmen-y-llaman-a-vecinos-a-abandonar-zonas-de-riesgo/", "fonte_id": "la_tercera", "data_pub": "2026-11-15T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A delegada presidencial de Atacama, Sofía Cid, alertou para o aumento do nível da água devido a deshielos. A polícia, a polícia civil e o exército foram deslocados para o badén La Vega para coordenar apoio às famílias.", "titulo_pt": "Delegada de Atacama avisa aumento do nível da água e solicita evacuação de áreas de risco", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 265567, "titulo": "Irã diz que afundou supernavio com 2 milhões de barris de petróleo", "url": "https://www.dw.com/pt-br/irã-diz-que-afundou-supernavio-com-2-milhões-de-barris-de-petróleo/a-79952899?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-15T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã afirmou que afundou um supernavio com 2 milhões de barris de petróleo. A embarcação teria atingido uma mina e explodido ao navegar sem autorização pelo Estreito de Ormuz, uma hidrovia estratégica central na guerra com os Estados Unidos.", "titulo_pt": "Irã afirma ter afundado supernavio com 2 milhões de barris de petróleo no estreito de Ormuz", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 265441, "titulo": "Canadá anuncia aporte bilionário em fundo de proteção a florestas após reunião com Lula", "url": "https://veja.abril.com.br/politica/canada-anuncia-aporte-bilionario-em-fundo-de-protecao-a-florestas-apos-reuniao-com-lula/", "fonte_id": "veja", "data_pub": "2026-11-15T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Canadá comprometeu-se a fornecer 400 milhões de dólares (aproximadamente R$ 2,26 bilhões) ao Fundo de Proteção de Florestas ao longo de quatro anos. Além disso, líderes canadenses e brasileiros discutiram um acordo entre Mercosul e Canadá durante a reunião com o presidente Lula.", "titulo_pt": "Canadá anuncia aporte bilionário em fundo de proteção a florestas após reunião com Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 265564, "titulo": "Fundo para florestas tropicais recebe US$ 400 milhões do Canadá e se aproxima de meta", "url": "https://www.jota.info/coberturas-especiais/matriz/fundo-para-florestas-tropicais-recebe-us-400-milhoes-do-canada-e-se-aproxima-de-meta", "fonte_id": "jota", "data_pub": "2026-11-15T12:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fundo para Florestas Tropicais recebeu US$ 400 milhões do Canadá. Este é o segundo aporte desde o resultado do segundo turno das eleições no Brasil.", "titulo_pt": "Fundo para florestas tropicais recebe US$ 400 milhões do Canadá e se aproxima de meta", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 265926, "titulo": "Fire breaks out at underground bus transit center in Seoul's Jamsil", "url": "https://www.koreaherald.com/article/10937751", "fonte_id": "korea_herald", "data_pub": "2026-11-15T12:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu em um centro de transferência de ônibus subterrâneo em Jamsil, Songpa-gu, sul-leste de Seul, por volta das 19h12 no domingo. Os bombeiros controlaram o fogo em cerca de 29 minutos sem registrar feridos.", "titulo_pt": "Incêndio atinge centro de transferência de ônibus subterrâneo em seul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265928, "titulo": "More foreigners seek health screenings in South Korea", "url": "https://www.koreaherald.com/article/10937739", "fonte_id": "korea_herald", "data_pub": "2026-11-15T11:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": " e": null, "texto_pt": "Aproximadamente 5.000 pessoas associadas à Universidade Metropolitana de Hong Kong (HKMU) podem ter tido seus dados pessoais comprometidos em uma incidente de segurança cibernética, com informações sendo oferecidas para venda no mercado negro. A universidade confirmou à South China Morning Post que os dados publicados incluíam nomes, números de cartão de identidade de Hong Kong, números de telefone, endereços e médias de pontos de graduação (GPAs) de estudantes da HKMU.", "titulo_pt": "Aproximadamente 5.000 pessoas ligadas à HKMU podem ter seus dados pessoais expostos em vazamento cibernético", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265409, "titulo": "Com mais mulheres sem véu, regime do Irã mira em boicote", "url": "https://www.cartacapital.com.br/mundo/com-mais-mulheres-sem-veu-regime-do-ira-mira-em-boicote/", "fonte_id": "cartacapital", "data_pub": "2026-11-15T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O movimento de mulheres iranianas que se opõem ao uso obrigatório do hijab está causando reações das autoridades e grupos conservadores do país. O regime iraniano está monitorando a situação, com sinais de que pode haver uma tentativa de boicote ao uso do véu.", "titulo_pt": "Com mais mulheres sem véu, regime do Irã enfrenta reação de autoridades", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 265820, "titulo": "Flames engulf Syrian refugee camp in eastern Lebanon", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/15/flames-engulf-syrian-refugee-camp-in-eastern-lebanon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T14:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu uma acampamento de refugiados sírios em Bar Elias, leste do Líbano.", "titulo_pt": "Fogo destrói acampamento de refugiados sírios no leste do líbano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 265663, "titulo": "Gender-diverse Australian sailors barred from US submarines despite Aukus deal, documents reveal", "url": "https://www.theguardian.com/australia-news/2026/nov/16/gender-diverse-australian-sailors-barred-from-us-submarines-despite-aukus-deal-documents-reveal-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-15T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos revelam que a Marinha Austrílica está impedida de treinar marinheiros transgender e não-binários em submarinos nucleares devido a diretrizes dos EUA, mesmo com o acordo Aukus. Isso ocorre porque os EUA proíbem pessoas transgêneros no serviço militar e os australianos não podem participar dos treinamentos norte-americanos devido a essa proibição.", "titulo_pt": "Marinheiros australianos transgêneros impedidos de treinar em submarinos nucleares dos EUA, apesar do acordo Aukus", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 265895, "titulo": "Jordan sentences 3 men to death over deadly church attack", "url": "https://www.scmp.com/news/world/middle-east/article/3374499/jordan-sentences-3-men-death-over-deadly-church-attack", "fonte_id": "scmp", "data_pub": "2026-11-15T12:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal jordaniano sentenciou três homens à morte por enforcamento após um tiroteio em uma igreja que resultou em nove mortes e 25 feridos. As comemorações de Natal no país foram canceladas em solidariedade às famílias das vítimas.", "titulo_pt": "Jordania condena três homens à morte por ataque letal a igreja", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265571, "titulo": "Com mais mulheres sem véu, regime do Irã mira em boicote a quem rejeita o hijab", "url": "https://www.dw.com/pt-br/com-mais-mulheres-sem-véu-regime-do-irã-mira-em-boicote-a-quem-rejeita-o-hijab/a-79935780?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pu function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
