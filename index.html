 de mascarillas: ¿Hasta cuándo y dónde son obligatorias?", "url": "https://www.latercera.com/servicios/noticia/minsal-extiende-uso-de-mascarillas-hasta-cuando-y-donde-son-obligatorias/", "fonte_id": "la_tercera", "data_pub": "2026-09-03T20:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde estendeu o uso de máscaras como medida preventiva devido à alta circulação de vírus respiratórios. A medida foi anunciada oficialmente sem especificar detalhes sobre o período e os locais obrigatórios.", "titulo_pt": "Ministério da saúde estende uso de máscaras: até quando e em quais locais serão obrigatórias?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 144164, "titulo": "New tool will help countries in Latin America and the Caribbean prevent rabies and other zoonotic diseases through better data on dog and cat populations", "url": "https://www.paho.org/en/news/3-9-2026-new-tool-will-help-countries-latin-america-and-caribbean-prevent-rabies-and-other", "fonte_id": "paho", "data_pub": "2026-09-03T18:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo ferramenta vai auxiliar países da América Latina e do Caribe a prevenir raiva e outras doenças zoonóticas através de dados mais precisos sobre a população de cães e gatos. O objetivo é melhorar a coleta e análise de dados sobre esses animais domésticos.", "titulo_pt": "Nova ferramenta auxiliará países da américa latina e do caribe na prevenção de raiva e outras doenças zoonóticas através de dados mais precisos sobre cães e gatos", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 144347, "titulo": "Clima: sexta terá chuva forte no Sul e baixa umidade no Nordeste", "url": "https://www.metropoles.com/brasil/clima-sexta-tera-chuva-forte-no-sul-e-baixa-umidade-no-nordeste", "fonte_id": "metropoles", "data_pub": "2026-09-04T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Esta sexta-feira (4/9) espera-se chuva forte no Sul do Brasil e baixa umidade no Nordeste. A influência de uma frente fria e de baixa umidade está prevista para marcar as condições climáticas do país.", "titulo_pt": "Clima: sexta terá chuva forte no Sul e baixa umidade no Nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 144872, "titulo": "Nepal floods ruin merchants, traders ahead of crucial festival season", "url": "https://www.japantimes.co.jp/news/2026/09/04/asia-pacific/society/nepal-floods-merchants-traders-festival/", "fonte_id": "japan_times", "data_pub": "2026-09-04T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As enchentes caíram no momento crucial entre setembro e novembro, período em que as celebrações hindus costumam impulsionar a atividade econômica através de um aumento significativo nas vendas.", "titulo_pt": "Flooding na nepal prejudica comerciantes e comerciantes antes da temporada festiva crucial", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 144378, "titulo": "Mercado de alimentos da Amazônia cresce com produção sustentável", "url": "https://www.cnnbrasil.com.br/agro/mercado-de-alimentos-da-amazonia-cresce-com-producao-sustentavel/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região amazônica está investindo em modelos de produção sustentável que combinam o uso da terra com a preservação do bioma. Este mercado valoriza produtos como açaí e castanha.", "titulo_pt": "Mercado de alimentos da Amazônia cresce com produção sustentável", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144619, "titulo": "Australian ski resorts to close up to a month early due to global heating and El Niño", "url": "https://www.theguardian.com/environment/2026/sep/04/australian-ski-resorts-to-close-up-to-a-month-early-due-to-global-heating-and-el-nino", "fonte_id": "guardian_world", "data_pub": "2026-09-04T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resort de esqui em grandes áreas da Austrália estão encerrando suas operações de esqui até um mês antes do esperado devido a condições climáticas desafiadoras e falta de neve. O inverno registrou múltiplos recordes de calor e a neve existente foi rapidamente derretida pela chuva.", "titulo_pt": "Resorts de esqui australianos fecharão até um mês mais cedo devido ao aquecimento global e El Niño", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 144990, "titulo": "2 rescued from tunnel 9 days after Nepal floods", "url": "https://www.koreaherald.com/article/10863002", "fonte_id": "korea_herald", "data_pub": "2026-09-04T05:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatados dois trabalhadores de um túnel hidrelétrico no Nepal noito dias após as cheias, provavelmente causadas pelo colapso de um glaciar, que devastaram cidades e levaram a villages no dia 26 de agosto. As equipes de emergência continuam buscando outros possivelmente presos no local.", "titulo_pt": "Dois resgatados de túnel hidrelétrico no Nepal nove dias após cheias", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 144671, "titulo": "Alerta alimentaria por Listeria: Minsal llama a no consumir pasta de jamón de conocido supermercado", "url": "https://www.latercera.com/nacional/noticia/alerta-alimentaria-por-listeria-minsal-llama-a-no-consumir-pasta-de-jamon-de-conocido-supermercado/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T02:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A autoridade sanitária chilena emitiu uma alerta relacionado a Listeria, recomendando que os consumidores não consumam uma pasta de jamón específica da marca Líder, proveniente de um supermercado conhecido, devido ao risco potencial para a saúde.", "titulo_pt": "Alerta sanitário por Listeria: minsal orienta não consumir pasta de jamón de marca líder", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 144727, "titulo": "Summer 2026 becomes, by far, the hottest ever recorded in France: 'Beating the record by almost 1°C in a single season is huge'", "url": "https://www.lemonde.fr/en/environment/article/2026/09/04/summer-2026-becomes-by-far-the-hottest-ever-recorded-in-france-beating-the-record-by-almost-1-c-in-a-single-season-is-huge_6757141_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-04T00:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O verão de 2026 se tornou, sem sombra de dúvida, o verão mais quente já registrado na França. Uma estação tão quente, com uma probabilidade de 1 em 100 de ocorrer, seria quase impossível sem o aquecimento global causado pelo homem.", "titulo_pt": "Verão de 2026 se torna, por muito, o verão mais quente da história na França: 'batendo o recorde quase 1°C em uma única estação é enorme'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 143789, "titulo": "Reino Unido vai investir R$ 2,7 bi em proteção de florestas no Brasil", "url": "https://www.cnnbrasil.com.br/nacional/brasil/reino-unido-vai-investir-r-27-bi-em-protecao-de-florestas-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo britânico planeja investir 2,7 bilhões de reais em um mecanismo financeiro internacional proposto pelo governo brasileiro para incentivar a preservação das florestas tropicais em países em desenvolvimento.", "titulo_pt": "Reino Unido vai investir R$ 2,7 bi em proteção de florestas no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 143967, "titulo": "Organizaciones exigen reactivar normas ambientales al Gobierno y advierten sus efectos en la salud", "url": "https://www.latercera.com/sustentabilidad/noticia/organizaciones-exigen-reactivar-normas-ambientales-al-gobierno-y-advierten-sus-efectos-en-la-salud/", "fonte_id": "la_tercera", "data_pub": "2026-09-03T20:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 organizações, sociedades científicas e profissionais de saúde pediram ao Ministério do Meio Ambiente que reingrassem duas normas ambientais retiradas há cinco meses. Eles alertam que a postergação dessas normas mantém os padrões atrasados e retarda benefícios sanitários, como a redução de doenças, hospitalizações e mortes prematuras.", "titulo_pt": "Organizações exigem reativação de normas ambientais ao governo e advertem sobre efeitos na saúde", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 144661, "titulo": "The Climate Crisis Is Stretching the Nepali Military Beyond Its Limits", "url": "https://thediplomat.com/2026/09/the-climate-crisis-is-stretching-the-nepali-military-beyond-its-limits/", "fonte_id": "the_diplomat", "data_pub": "2026-09-03T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O clima está excedendo as capacidades das forças armadas nepalesas em resposta a desastres. O foco está na adaptação e transformação das forças armadas diante da crise climática, não se questionando sua participação em respostas a desastres.", "titulo_pt": "A crise climática está excedendo as capacidades das forças armadas nepalesas em resposta a desastres", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 143054, "titulo": "BoM forecasts strongest El Niño on record as research points to ‘alarming’ climate change influence", "url": "https://www.theguardian.com/australia-news/2026/sep/04/bom-forecasts-strongest-el-nino-on-record-as-research-points-to-alarming-climate-change-influence", "fonte_id": "guardian_world", "data_pub": "2026-09-03T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Bureau of Meteorology prevê que o fenômeno El Niño será o mais forte já registrado, com a temperatura do Pacífico superando 2°C em seis meses. Pesquisas sugerem que o aquecimento global reduziu as chances de o El Niño atingir novos recordes de temperatura.", "titulo_pt": "Bom prevê El Niño mais forte na história com forte influência do aquecimento global", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 143249, "titulo": "Chilean penguins fitted with vests to protect healing wounds", "url": "http://www.euronews.com/video/2026/09/03/chilean-penguins-fitted-with-vests-to-protect-healing-wounds", "fonte_id": "euronews", "data_pub": "2026-09-03T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pinguins de Humboldt feridos no Chile estão sendo equipados com coletes de recuperação projetados para proteger feridas e prevenir o dano a suturas em processo de cura.", "titulo_pt": "Pinguins de humboldt no chile recebem coletes para proteger feridas em cura", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 143212, "titulo": "France recorded 'hottest summer ever,' says environment minister", "url": "https://www.lemonde.fr/en/france/article/2026/09/03/france-recorded-hottest-summer-ever-says-environment-minister_6757121_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T13:14:00Z", "idioma": "en", "provavel_duplicata_de": 143210, "texto_pt": "A França registrou o verão mais quente da história, juntamente com Bélgica e Grã-Bretanha, após uma estação que assustou a Europa, a continente que está aquecendo mais rapidamente no globo.", "titulo_pt": "França registrou 'verão mais quente da história', diz ministro do meio ambiente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 141945, "titulo": "Indonésia: incêndios florestais ameaçam liberar \"bombas\" de carbono", "url": "https://www.metropoles.com/mundo/indonesia-incendios-florestais-ameacam-liberar-bombas-de-carbono", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na Indonésia levantam preocupações sobre a liberação de grandes quantidades de carbono, lembrando a crise de 2015 durante o último 'super El Niño'.", "titulo_pt": "Indonésia: incêndios florestais ameaçam liberar 'bombas' de carbono", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142263, "titulo": "Alaska seeks oil revival while grappling with a warming future", "url": "https://www.axios.com/2026/09/03/alaska-oil-revival-warming-future", "fonte_id": "axios", "data_pub": "2026-09-03T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alaska está buscando revitalizar sua indústria do petróleo, que está em declínio há décadas, enquanto enfrenta os efeitos da aquecimento global, como a derivação rápida de geleiras. O estado serve como um exemplo vivo da dependência de combustíveis fósseis à medida que os impactos climáticos se intensificam.", "titulo_pt": "Alaska busca revitalizar a indústria do petróleo enquanto enfrenta o futuro aquecido", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 141948, "titulo": "Clima: frente fria se afasta, mas nova instabilidade ameaça a Região Sul", "url": "https://www.metropoles.com/brasil/clima-frente-fria-se-afasta-mas-nova-instabilidade-ameaca-a-regiao-sul", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A frente fria que atingiu a Região Sul está se afastando, mas uma nova instabilidade atmosférica está prevista para trazer chuva moderada a forte à região.", "titulo_pt": "Clima: alívio temporário, nova chuva ameaça o Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 144370, "titulo": "Romênia denuncia Andrew Tate por tráfico de menores e lavagem de dinheiro", "url": "https://www.cnnbrasil.com.br/internacional/romenia-denuncia-andrew-tate-por-trafico-de-menores-e-lavagem-de-dinheiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T09:07:00Z", "idioma": "pt", "provavel_duplicata_de function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
