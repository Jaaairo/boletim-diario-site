    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "25/08/2026 07:21", "stats": {"noticias_novas": 702, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A Polícia Federal realizou uma operação que resultou em um prejuízo estimado em R$ 86 milhões contra um grupo criminoso que fraudava benefícios do INSS. Na área de corrupção, a Polícia Federal também investiga três tentativas frustradas de fechar contratos no Ministério da Saúde envolvendo o empresário Lulinha e outros. O governo Lula está discutindo a regulamentação do acesso a dados e da transparência dos anúncios das grandes empresas de tecnologia. De acordo com as pesquisas de intenção de voto, Flávio Bolsonaro lidera com 45% das intenções de voto no primeiro turno da eleição presidencial em Santa Catarina, seguido por Lula com 20%. O ministro Dario Durigan confirmou que o salário mínimo será de R$ 1.741 em 2027, conforme as projeções que serão enviadas ao Congresso no PLOA do próximo ano.", "mundo": "A ultramaratona Montanha Branca, que ocorre anualmente na Suíça, enfrenta críticas crescentes dos moradores de Chamonix, que temem o impacto ambiental e a segurança dos participantes. Em outros países, a Coreia do Sul e os Estados Unidos permanecem comprometidos com a desnuclearização da Coreia do Norte, apesar de declarações oficiais que podem não ser tão claras. O governo dos Estados Unidos planeja retornar diplomatas americanos às embaixadas no Oriente Médio, indicando que Washington não espera uma renovação de conflito total com o Irã. Além disso, a Suprema Corte dos Estados Unidos favoreceu o ex-presidente Trump em relação às restrições aos votos por correspondência, o que pode influenciar o controle do Partido Republicano no Congresso nas eleições legislativas de novembro.\n\nA China realizou exercícios militares conjuntos com o Egito no contexto do conflito entre Estados Unidos e Irã, enquanto a Coreia do Sul e os Estados Unidos mantiveram sua cooperação em relação à Coreia do Norte. A Coreia do Sul está avaliando os possíveis efeitos das novas sanções americanas contra o Irã, que abrangem cinco setores importantes. Em outro desenvolvimento, o Irã foi removido da lista dos Estados Sponsors de Terrorismo pelos Estados Unidos, comemorado pelo presidente sírio Ahmad al-Sharaa. Além disso, os Estados Unidos anunciaram um pacote amplo de sanções contra o Irã após a implementação de uma ofensiva econômica, enquanto o governo Trump priorizava a pressão econômica em vez da intervenção militar. As tensões na região do Oriente Médio continuam com ataques de colonos israelenses na Cisjordânia, aumento de sanções econômicas contra o Irã e debates sobre a eficácia dessas medidas.", "economia": "A Braskem protocolou um pedido de recuperação extrajudicial com dívidas de R$ 56,5 bilhões, o que pode impactar fundos, COEs e debêntures. Especialistas consideram que a solução é temporária e não resolve a origem da crise. Além disso, a recuperação extrajudicial é impulsionada principalmente por credores estrangeiros, com apenas 7,6% da dívida sendo títulos emitidos no Brasil. A Braskem também perdeu mercado para indústrias estrangeiras nos últimos anos, devido a preços menores, resultado do acesso a matéria-prima mais barata. Em contraste, o Brasil aumentou suas exportações de agronegócio para os Estados Unidos, com crescimento de 68% em cinco anos. A Azul planeja aumentar sua malha aérea com 2.500 voos extras durante o próximo verão para atender à demanda de férias. Outros temas abordados incluem a possível mudança de sede de uma empresa de alta frequência de trading do Japão para Singapura devido a taxas de imposto de renda mais altas, e a Coreia do Sul e a Malásia reduziram o tempo de processamento das certificações para importações de condensado.", "tecnologia": "Os centros de dados estão se transformando em um motor econômico e político nos Estados Unidos, com investimentos de mais de 750 bilhões de dólares previstos para este ano, um aumento de 67% em relação ao ano anterior. Essa expansão está sendo impulsionada pela corrida pela inteligência artificial e tem se tornado um tema central nas eleições. Em outro desenvolvimento, a Luxshare Precision registrou um aumento significativo nas receitas do primeiro semestre de 2026, com um crescimento de 274% nas vendas de eletrônicos automotivos, refletindo a crescente dependência das montadoras chinesas de tecnologias de robótica e inteligência artificial. Além disso, a Coreia do Sul está revisando suas regras de exames técnicos devido a infrações cometidas por candidatos que usaram óculos inteligentes com inteligência artificial para roubar informações durante os testes. Esses incidentes levaram a uma discussão sobre a integridade do sistema educacional e a necessidade de adaptações tecnológicas para garantir a justiça nos exames.", "ciencia": "A Coreia do Sul está planejando desenvolver um satélite de geração próxima para observação ambiental e oceânica, aumentando assim sua capacidade de monitoramento e pesquisa. Um avanço científico notável ocorreu quando os cientistas criaram um estado de plasma de quarks e glúons, semelhante ao que existia no universo logo após sua formação, criando um mini Big-Bang na Terra. Este avanço oferece insights valiosos sobre o surgimento do universo. Além disso, um processo foi desenvolvido para duplicar o tamanho das moléculas de PFAS, tornando-as mais fáceis de destruir, o que é crucial para lidar com essas substâncias persistentes. Estudos também estão sendo realizados sobre a possibilidade de a inteligência artificial ler emoções humanas, com sistemas em desenvolvimento para reconhecer emoções através de expressões faciais, voz, linguagem corporal e sinais fisiológicos, embora a validade científica desses sistemas ainda seja contestada.", "cultura": "Em 2027, o Carnaval promete incluir um convite inusitado para o presidente Lula se apresentar com a agremiação Império Serrano, cujo tema será 'Seja Marginal, Seja Herói: A Revolução em sua Legítima Razão'. Paralelamente, a exposição 'Arte têxtil de Sheila Hicks' em São Paulo explorará a cor e o espaço através de obras textiles, em homenagem a artistas e pensadores. O documentário 'NAZA', que aborda a morte de civis em Gaza, concorrerá na competição principal do Festival de Veneza, destacando a importância de olhar para questões humanitárias globais. Além disso, as palavras de Confúcio sobre a importância de se exigir de si mesmo continuam a influenciar pensamentos e discussões culturais.", "sociedade": "Um vendedor ambulante de ovos panquecados em Hefei, província de Anhui, na China, recebeu ampla aprovação após incluir 100 yuan (US$15) em um pedido de entrega para uma família cujo filho estava passando por quimioterapia, com base em uma nota anexada ao pedido que indicava restrições alimentares. O incidente, que ganhou repercussão nas redes sociais, reflete a bondade e solidariedade da sociedade. Em outro evento, um homem foi baleado na cabeça ao tentar proteger sua namorada de um assalto em uma festa, levando a uma investigação policial. No Distrito Federal, bombeiros combatiam dois incêndios em prédios comerciais, enquanto a Secretaria Provincial de Educação de Gyeonggi, na Coreia do Sul, expandiu para 300 o número de oficiais dedicados à proteção dos direitos dos professores. O governo de Singapura anunciou uma série de medidas para tornar a criação de filhos mais atraente, como aumentar o período de licença parental, enquanto a Coreia do Sul enfrentava a ocorrência de metade dos casos de mpox em crianças, refletindo a preocupação com a saúde mental e a desigualdade social em diversos países.", "meio_ambiente": "A Indonésia enfrenta intensas queimadas florestais que geram uma neblina tóxica, levando o governo a implementar medidas de emergência e buscar a ajuda de orações. Paralelamente, as temperaturas das águas oceânicas atingiram recordes devido ao fenômeno El Niño, causando um 'estresse inédito' nas águas do mundo. Na França, um tornado causou ferimentos em pelo menos 39 pessoas e danos em 300 casas, enquanto a Coreia do Sul prepara seu primeiro festival musical focado na neutralidade de carbono. Além disso, a Austrália enfrenta uma crise com apenas 12.000 lobos-marinhos restantes, e cientistas alertam para a possibilidade de um 'carnage' causado pela gripe aviária H5N1. Na Indonésia, o governo concedeu permissão para operações de sementação de nuvens para combater a poluição de fuligem que atinge a região.", "direitos_humanos": "A Anistia Internacional denunciou o uso de armas letais pelo governo indiano contra os protestantes conhecidos como 'Café-da-Manhã', enquanto a ONU e a Cruz Vermelha alertaram sobre os riscos associados aos sistemas de armas autônomas letais, chamando para uma regulação dessas tecnologias. Em outra notícia, a Polícia Federal concluiu uma investigação sobre um grupo que praticava tortura em bebês e animais, com base em mais de 80 vídeos analisados. Na Faixa de Gaza, os hospitais enfrentam problemas graves devido à destruição causada por conflitos, com falta de equipamentos médicos e atrasos na evacuação de pacientes. Além disso, a administração Trump planeja revogar até 200.000 vistos de negócios e turismo de pessoas que buscaram asilo nos Estados Unidos, numa medida que provavelmente levantará desafios legais."}, "resumo_do_dia": {"politica_nacional": [{"id": 122042, "titulo": "PF faz operação contra fraude de R$ 86 milhões no INSS", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-faz-operacao-contra-fraude-de-r-86-milhoes-no-inss", "fonte_id": "metropoles", "data_pub": "2026-08-25T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo criminoso criava pessoas fictícias e falsificava documentos para obter benefícios do INSS destinados a idosos de baixa renda. A Polícia Federal realizou uma operação que resultou em prejuízo estimado de R$ 86 milhões.", "titulo_pt": "PF desbarata esquema que fraudava benefícios do INSS em R$ 86 milhões", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122052, "titulo": "Confira a agenda dos candidatos ao GDF nesta terça-feira (25/8)", "url": "https://www.metropoles.com/distrito-federal/confira-a-agenda-dos-candidatos-ao-gdf-nesta-terca-feira-25-8", "fonte_id": "metropoles", "data_pub": "2026-08-25T09:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos ao Governo do Distrito Federal (GDF) realizaram caminhadas, entrevistas e reuniões nesta terça-feira, 25 de agosto. A agenda incluiu diversas atividades de campanha.", "titulo_pt": "Confira a agenda dos candidatos ao GDF nesta terça-feira (25/8)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 121987, "titulo": "Tarcísio quer expandir modelo criado na cracolândia para o interior de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/tarcisio-quer-expandir-modelo-criado-na-cracolandia-para-o-interior-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio de Freitas (Republicanos) planeja expandir o modelo de atendimento a usuários de drogas criado na cracolândia para outras regiões do interior de São Paulo. O hub, lançado em 2023, visa combater o fluxo de usuários de drogas na área central de São Paulo.", "titulo_pt": "Tarcísio quer expandir modelo de atendimento a usuários de drogas para o interior de SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121988, "titulo": "Investigação sobre Lulinha aponta três tentativas frustradas de fechar contrato no Ministério da Saúde", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/investigacao-sobre-lulinha-aponta-tres-tentativas-frustradas-de-fechar-contrato-no-ministerio-da-saude.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T07:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga três tentativas frustradas de fechar contratos no Ministério da Saúde envolvendo o empresário Fábio Luís Lula da Silva, conhecido como Lulinha, e Camilo Antunes, o Careca do INSS, além de Roberta Luchsinger.", "titulo_pt": "Investigações sobre Lulinha apontam três tentativas frustradas de fechar contrato no Ministério da Saúde", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121989, "titulo": "Eduardo Paes participa de sabatina da Folha e do UOL nesta terça-feira", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/eduardo-paes-participa-de-sabatina-da-folha-e-do-uol-nesta-terca-feira.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Paes, ex-prefeito do Rio de Janeiro e candidato ao governo do estado, participará de uma sabatina promovida pela Folha e pelo UOL nesta terça-feira às 12h30.", "titulo_pt": "Eduardo Paes participa de sabatina da Folha e do UOL nesta terça-feira", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121990, "titulo": "Governo Lula debate regulamentar acesso a dados e transparência de anúncios de big techs", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/governo-lula-debate-regulamentar-acesso-a-dados-e-transparencia-de-anuncios-de-big-techs.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está discutindo a regulamentação do acesso a dados e da transparência dos anúncios das grandes empresas de tecnologia, conhecidas como big techs, nas suas plataformas.", "titulo_pt": "Governo Lula discute regulamentação de acesso a dados e transparência de anúncios de big techs", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 122071, "titulo": "BTG/Nexus: jovens, evangélicos e baixa renda estão mais abertos a mudar de voto", "url": "https://exame.com/brasil/btg-nexus-evangelicos-jovens-e-baixa-renda-tem-maior-parcela-de-eleitores-que-podem-mudar-de-voto/", "fonte_id": "exame", "data_pub": "2026-08-25T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jovens de 16 a 24 anos, pessoas com renda entre 1 a 2 salários mínimos e evangélicos mostram maior propensão a mudar de partido político. A proporção chega a 30% entre os jovens, 25% entre os de baixa renda e 22% entre os evangélicos.", "titulo_pt": "BTG/Nexus: jovens, evangélicos e baixa renda mais propensos a mudar de voto", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121981, "titulo": "Coordenador de campanha de Lula defende recompra de títulos da dívida e alta de imposto para super-ricos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/coordenador-de-campanha-de-lula-defende-recompra-de-titulos-da-divida-e-alta-de-imposto-para-super-ricos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista José Sergio Gabrielli, coordenador-geral do programa de governo da candidatura do presidente Lula (PT), defende a recompra de títulos da dívida e a elevação de impostos sobre os super-ricos.", "titulo_pt": "Coordenador de campanha de Lula defende recompra de títulos da dívida e alta de imposto para super-ricos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121991, "titulo": "Planos de Lula e Flávio Bolsonaro para educação são fracos em metas e reciclam propostas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/planos-de-lula-e-flavio-bolsonaro-para-educacao-sao-fracos-em-metas-e-reciclam-propostas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os planos de governo para educação de Lula e Flávio Bolsonaro apresentam metas frágeis e reciclam propostas anteriores, sem oferecer um novo rumo para a área que envolve um orçamento bilionário e milhões de estudantes e educadores.", "titulo_pt": "Planos de Lula e Flávio Bolsonaro para educação são fracos e reciclam propostas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121992, "titulo": "Folha lança newsletter Eleições Hoje", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/folha-lanca-newsletter-eleicoes-hoje.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de S.Paulo lançou a newsletter Eleições Hoje, que será enviada durante a campanha para o pleito que definirá o novo presidente, senadores, deputados federais, governadores e deputados estaduais. A newsletter começará a ser enviada nesta segunda-feira (24).", "titulo_pt": "Folha lança newsletter Eleições Hoje", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121993, "titulo": "É razoável esperar maior taxa de reeleição em 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/voto-a-voto/2026/08/e-razoavel-esperar-maior-taxa-de-reeleicao-em-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa de reeleição dos deputados federais será um tema de debate em 2026, pois influencia a composição da Câmara dos Deputados e os fundos partidários e eleitorais.", "titulo_pt": "É razoável esperar maior taxa de reeleição em 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121984, "titulo": "Governo espera aprovar no Senado projeto de minerais críticos e já convoca ministros, diz Silveira", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-espera-aprovar-no-senado-projeto-de-minerais-criticos-e-ja-convoca-ministros-diz-silveira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T01:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro de Minas e Energia, Alexandre Silveira, informou que o governo espera aprovação do projeto de lei dos minerais críticos no Senado na próxima semana. Silveira também convocou ministros para discutir o assunto.", "titulo_pt": "Governo espera aprovar no Senado projeto de minerais críticos e já convoca ministros, diz Silveira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121994, "titulo": "Instituto premia iniciativas que fortalecem combate à corrupção", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/instituto-premia-iniciativas-que-fortalecem-combate-a-corrupcao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T01:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Iniciativas que contribuem para o combate à corrupção e para o incentivo de práticas éticas na gestão pública e privada foram premiadas na noite de 24 de agosto com o Prêmio Inac de Integridade, em São Paulo.", "titulo_pt": "Instituto premia iniciativas no combate à corrupção", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121995, "titulo": "Zema critica obrigatoriedade de vacinação e volta a negar tentativa de golpe sob Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/zema-critica-obrigatoriedade-de-vacinacao-e-volta-a-negar-tentativa-de-golpe-sob-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T01:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema, candidato à Presidência pelo Novo, criticou a vacinação obrigatória e reafirmou a promessa de anistia aos condenados pelo 8 de Janeiro, negando qualquer tentativa de golpe de estado. As declarações foram feitas durante uma entrevista ao Jornal Nacional, da TV Globo.", "titulo_pt": "Zema critica vacinação obrigatória e nega tentativa de golpe", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121996, "titulo": "Panfleto da campanha de candidatas do PSOL deixa Tebet de fora", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/panfleto-da-campanha-de-candidatas-do-psol-deixa-tebet-de-fora.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Sâmia Bomfim e a candidata a deputada estadual Mariana Conti, ambas do PSOL, não incluíram a imagem, o nome e o número de urna da ex-ministra Simone Tebet, que está concorrendo ao Senado pela coligação das candidatas.", "titulo_pt": "Panfleto das candidatas do PSOL deixa simone Tebet de fora", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121146, "titulo": "Ministro da Fazenda confirma projeção de salário mínimo em R$ 1.741 para 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ministro-da-fazenda-confirma-projecao-de-salario-minimo-em-r-1741-para-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T00:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dario Durigan confirmou que o salário mínimo será de R$ 1.741 em 2027, conforme as projeções que serão enviadas ao Congresso no PLOA do próximo ano.", "titulo_pt": "Ministro confirma salário mínimo de R$ 1.741 em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 122506, "titulo": "China’s J-16s face off against Egypt’s Rafales in combat drills as Iran war rumbles on", "url": "https://www.scmp.com/news/china/military/article/3365163/chinas-j-16s-face-against-egypts-rafales-combat-drills-iran-war-rumbles?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Força Aérea da China realizou exercícios de combate conjuntos com a Força Aérea do Egito, como parte da segunda edição dos exercícios 'Eagles of Civilisation', após a presença chinesa na região do Oriente Médio. Os exercícios, que começaram no sábado e devem durar até o início do próximo mês, ocorrem no contexto do conflito entre Estados Unidos e Irã.", "titulo_pt": "China e egito realizam exercícios de combate no oriente médio em meio ao conflito entre EUA e Irã", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 122464, "titulo": "Estremismo online e radicalizzazione, cinque minori denunciati ad Arezzo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/25/estremismo-online-e-radicalizzazione-cinque-minori-denunciati-ad-arezzo_a0fd3d23-42f7-442a-ab76-77af8e146cfe.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-25T09:56:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Cinco menores foram denunciados em Arezzo por suspeita de propaganda online e incitação à criminalidade baseada em discriminação.", "titulo_pt": "Extremismo online e radicalização, cinco menores denunciados em Arezzo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 122102, "titulo": "Coreia do Sul e EUA se comprometem a manter cooperação em relação à Coreia do Norte", "url": "https://www.infomoney.com.br/mundo/coreia-do-sul-e-eua-se-comprometem-a-manter-cooperacao-em-relacao-a-coreia-do-norte/", "fonte_id": "infomoney", "data_pub": "2026-08-25T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul e os Estados Unidos se comprometeram a manter sua cooperação em relação à Coreia do Norte. Trump recentemente anunciou uma redução nos exercícios militares conjuntos e elogiou o país.", "titulo_pt": "Coreia do Sul e EUA se comprometem a manter cooperação em relação à Coreia do Norte", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 122342, "titulo": "Thinking of running the Ultimate Trail of the Mont Blanc? Residents might object", "url": "https://www.france24.com/en/thinking-of-running-the-ultimate-trail-of-the-mont-blanc-residents-might-object", "fonte_id": "france24", "data_pub": "2026-08-25T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ultramaratona Montanha Branca está prestes a começar, uma corrida anual de 174 km por montanhas que é reconhecida mundialmente. No entanto, a edição deste ano, a 23ª, está enfrentando críticas crescentes dos moradores de Chamonix, resultando em um ambiente tenso.", "titulo_pt": "Pensando em correr a ultramaratona montanha branca? Habitantes podem se opor", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 122269, "titulo": "Trump pide a Ucrania “aprovechar el momento” y poner fin a la guerra con una “paz duradera”", "url": "https://www.latercera.com/mundo/noticia/trump-pide-a-ucrania-aprovechar-el-momento-y-poner-fin-a-la-guerra-con-una-paz-duradera/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T09:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, pediu a Ucrânia que aproveite o momento para terminar a guerra com uma paz duradoura. Este pedido foi feito durante as comemorações do 35° aniversário da saída da União Soviética.", "titulo_pt": "Trump pede a Ucrânia aproveitar o momento e alcançar uma paz duradoura", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 122219, "titulo": "U.S. Campaign on Iran’s Economy May Still Risk Regional Military Escalation", "url": "https://www.nytimes.com/2026/08/25/world/middleeast/iran-us-economy-sanctions.html", "fonte_id": "nyt_world", "data_pub": "2026-08-25T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peritos alertam que uma campanha visando evitar escalada militar poderia, na verdade, provocá-la, já que líderes iranianos prometem retaliar em todo o Golfo Pérsico rico em petróleo.", "titulo_pt": "Campanha econômica dos EUA em Irã pode ainda provocar escalada militar Regional", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 122235, "titulo": "Burnham to take Zelenskyy’s pleas for Patriot missiles to Trump – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/25/europe-ukraine-patriot-missiles-zelenskyy-trump-russia-drone-germany-latest-news-update", "fonte_id": "guardian_world", "data_pub": "2026-08-25T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Reino Unido, Rishi Sunak, planeja se juntar a uma delegação de líderes para pressionar o presidente dos Estados Unidos, Joe Biden, a aumentar a fornecimento de mísseis Patriot para a Ucrânia. Além disso, o chanceler alemão, Friedrich Merz, se pronunciou pela primeira vez sobre um ataque aéreo com drone em um aeroporto na Alemanha, localizado perto de uma importante rota logística para a Ucrânia.", "titulo_pt": "Sunak vai juntar-se a lobby por mísseis Patriot para Ucrânia junto a Trump", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 122465, "titulo": "Borsa: Europa in rialzo mentre il petrolio frena", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/25/borsa-europa-in-rialzo-mentre-il-petrolio-frena_6392bad6-d837-4efb-8058-ee19c4f1d524.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-25T09:43:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "As bolsas europeias operam em alta, enquanto o petróleo registra uma pausa nas negociações. Londres, Paris, Frankfurt e Milão apresentam ganhos moderados.", "titulo_pt": "Bolsa: Europa em alta enquanto o petróleo se estabiliza", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 122343, "titulo": "Around 40 injured after tornado tears through village in the south of France", "url": "https://www.france24.com/en/around-40-injured-after-tornado-tears-through-village-in-the-south-of-france", "fonte_id": "france24", "data_pub": "2026-08-25T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tornado atingiu uma vila no sul da França, causando danos significativos e deixando 41 pessoas feridas. O evento afetou cerca de 300 casas. A região estava sob alerta de tempestades.", "titulo_pt": "Aproximadamente 41 feridos após tornado atingir vila no sul da França", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 122344, "titulo": "French astronaut Sophie Adenot prepares for second ISS mission spacewalk", "url": "https://www.france24.com/en/technology/20260825-french-astronaut-sophie-adenot-prepares-for-second-iss-mission-spacewalk", "fonte_id": "france24", "data_pub": "2026-08-25T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astronauta francesa Sophie Adenot realizará uma caminhada espacial adicional fora da Estação Espacial Internacional (ISS) em seu segundo compromisso, uma semana após sua primeira caminhada histórica.", "titulo_pt": "Astronauta francesa Sophie Adenot prepara-se para segunda caminhada espacial na ISS", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 122390, "titulo": "Trees are vital for cooler cities, but they need help too", "url": "https://www.dw.com/en/trees-are-vital-for-cooler-cities-but-they-need-help-too/a-78488665?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-25T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A heatwave e a seca extremas estão colocando árvores urbanas em risco. Especialistas explicam como proteger esses ativos essenciais e construir florestas urbanas que possam resistir aos desafios climáticos futuros.", "titulo_pt": "Árvores urbanas são vitais para cidades mais frescas, mas precisam de ajuda também", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 122345, "titulo": "Iran threatens retaliation as new US sanctions hit already-struggling economy", "url": "https://www.france24.com/en/iran-threatens-retaliation-as-new-us-sanctions-hit-already-struggling-economy", "fonte_id": "france24", "data_pub": "2026-08-25T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades iranianas estão mantendo uma postura firme contra os Estados Unidos após Washington anunciar novas sanções. Enquanto isso, a economia do Irã já sofre com altos índices de inflação.", "titulo_pt": "Irã ameaça retaliar com novas sanções após estados unidos anunciar novas medidas", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 122220, "titulo": "Trump Administration to Return Diplomats to Middle East Embassies", "url": "https://www.nytimes.com/2026/08/25/world/middleeast/us-diplomats-middle-east-embassies.html", "fonte_id": "nyt_world", "data_pub": "2026-08-25T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump planeja retornar diplomatas americanos às embaixadas no Oriente Médio, com evacuados possivelmente voltando a suas posições a partir desta semana. Isso indica que Washington não espera uma renovação de conflito total com o Irã.", "titulo_pt": "Governo trump vai retornar diplomatas às embaixadas no oriente médio", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 122218, "titulo": "How U.S.-Canada Tariff Negotiations Turned Into an All-Out Trade War", "url": "https://www.nytimes.com/2026/08/25/world/canada/trump-carney-trade-war-tariffs.html", "fonte_id": "nyt_world", "data_pub": "2026-08-25T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos detalhados dos últimos momentos das negociações mostram que, embora os Estados Unidos tenham oferecido ao Canadá o que afirmavam ser a melhor proposta para qualquer país, o que o Canadá precisava entregar em troca foi considerado inaceitável.", "titulo_pt": "Como as negociações de tarifas entre EUA e canadá deram lugar a uma guerra comercial total", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 122446, "titulo": "China warns US it could retaliate over Iran sanctions", "url": "https://www.ft.com/content/aa7ba671-8175-4b53-b6a5-28803a851493?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-25T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pequim avisou que tomará 'todas as medidas necessárias' se Washington expandir as sanções contra empresas que fazem negócios com Teerã.", "titulo_pt": "China ameaça retaliar se EUA expandirem sanções a empresas que fazem negócios com o Irã", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 122391, "titulo": "Canada set to announce retaliatory tariffs on US goods after talks fail", "url": "https://www.dw.com/en/canada-set-to-announce-retaliatory-tariffs-on-us-goods-after-talks-fail/a-78491819?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-25T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tarifas de 50% sobre bens canadenses entraram em vigor após falência das negociações comerciais. O presidente dos EUA, Donald Trump, ameaçou Ottawa a se alinhar, mas o primeiro-ministro canadense, Justin Trudeau, rejeitou um 'bom acordo'.", "titulo_pt": "Canadá deve anunciar tarifas retaliatórias sobre bens dos EUA após falência de negociações", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 121974, "titulo": "Recuperação da Braskem pode afetar fundos, COEs e debêntures", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/recuperacao-da-braskem-pode-afetar-fundos-coes-e-debentures.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A recuperação extrajudicial da Braskem pode impactar fundos, COEs e debêntures de investidores que tenham exposição direta ou indireta à dívida da empresa. A notícia foi publicada em 25/08/2026 às 06h00.", "titulo_pt": "Recuperação da Braskem pode afetar fundos, COEs e debêntures", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121975, "titulo": "Auditoria do TCU aponta risco de colapso em ponte e atraso em obras de ferrovia na Bahia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/auditoria-do-tcu-aponta-risco-de-colapso-em-ponte-e-atraso-em-obras-de-ferrovia-na-bahia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As obras da Ferrovia de Integração Oeste-Leste (FIOL), iniciadas há 15 anos no sertão da Bahia, ainda não foram concluídas e incluem trechos em situação crítica, como uma ponte com risco iminente de colapso. Além disso, há atrasos significativos nas obras.", "titulo_pt": "Auditoria do TCU aponta risco de colapso em ponte e atraso em obras de ferrovia na Bahia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 122204, "titulo": "O julgamento que pode romper barreiras no transporte rodoviário em prol do passageiro", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-julgamento-que-pode-romper-barreiras-no-transporte-rodoviario-em-prol-do-passageiro", "fonte_id": "jota", "data_pub": "2026-08-25T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento do STF sobre fretamento em circuito fechado pode limitar as opções de transporte para a população de Minas Gerais. A decisão pode significar que apenas uma única opção de transporte ficará disponível para os passageiros.", "titulo_pt": "Julgamento do stf sobre fretamento pode limitar opções de transporte em mg", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122205, "titulo": "Por que o caso Uber não se aplica ao fretamento em regime aberto?", "url": "https://www.jota.info/opiniao-e-analise/artigos/por-que-o-caso-uber-nao-se-aplica-ao-fretamento-em-regime-aberto", "fonte_id": "jota", "data_pub": "2026-08-25T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fretamento em circuito aberto pode comprometer o serviço público, diferentemente do transporte por aplicativo.", "titulo_pt": "Por que o caso Uber não se aplica ao fretamento em regime aberto?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122206, "titulo": "A erosão do direito à sustentação oral", "url": "https://www.jota.info/opiniao-e-analise/colunas/macrolitigancia-fiscal/a-erosao-do-direito-a-sustentacao-oral", "fonte_id": "jota", "data_pub": "2026-08-25T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca que uma justiça que não permite a sustentação oral do advogado não é eficiente, mas sim sumária.", "titulo_pt": "A erosão do direito à sustentação oral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122373, "titulo": "Bitcoin price extends gains as crypto rally gathers pace", "url": "https://www.cnbc.com/2026/08/25/bitcoin-price-near-80000-cryptocurrency-ether-us-treasuries.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-25T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do Bitcoin subiu acima dos US$ 80.000, estendendo a recuperação recente do mercado de criptomoedas devido a novos fluxos de investimento em ETFs de Bitcoin e a uma melhor disposição ao risco.", "titulo_pt": "Preço do bitcoin avança acima dos us$ 80.000 com recuperação acelerada do mercado de criptomoedas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 122207, "titulo": "Soberania também se mede pela igualdade concorrencial", "url": "https://www.jota.info/opiniao-e-analise/artigos/soberania-tambem-se-mede-pela-igualdade-concorrencial", "fonte_id": "jota", "data_pub": "2026-08-25T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores, indústria e varejo defendem a concorrência, mas sob a condição de que as regras sejam iguais para todos os envolvidos.", "titulo_pt": "Soberania implica concorrência justa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122209, "titulo": "Derivativos de 2008: uma lição sobre os pontos cegos da supervisão financeira", "url": "https://www.jota.info/opiniao-e-analise/artigos/derivativos-de-2008-uma-licao-sobre-os-pontos-cegos-da-supervisao-financeira", "fonte_id": "jota", "data_pub": "2026-08-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório do FMI sobre o sistema financeiro brasileiro confirma o diagnóstico que a PEC 65 visa resolver.", "titulo_pt": "Derivativos de 2008: uma lição sobre os pontos cegos da supervisão financeira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122487, "titulo": "Japan’s only high-speed trader Dharmacapital moves to Singapore citing tax rates", "url": "https://www.japantimes.co.jp/business/2026/08/25/companies/dharmacapital-moves-to-singapore/", "fonte_id": "japan_times", "data_pub": "2026-08-25T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dharmacapital, a única empresa de alta frequência de trading no Japão, está se mudando para Singapura devido a taxas de imposto de renda mais altas e barreiras linguísticas. Alguns profissionais financeiros citam esses fatores como razões para escolherem cidades diferentes do centro financeiro japonês.", "titulo_pt": "A única empresa de alta frequência de trading do Japão, Dharmacapital, se muda para singapura devido a taxas de imposto de renda mais altas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 121976, "titulo": "Braskem perdeu mercado para indústria estrangeira nos últimos anos, dizem especialistas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/braskem-perdeu-mercado-para-industria-estrangeira-nos-ultimos-anos-dizem-especialistas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem perdeu espaço no mercado brasileiro nos últimos anos para empresas estrangeiras, que ofereceram resinas a preços menores devido ao acesso a matéria-prima mais barata.", "titulo_pt": "Braskem perdeu mercado para indústrias estrangeiras nos últimos anos, dizem especialistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121977, "titulo": "Microempresa fica fora do split payment da reforma tributária em 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/microempresa-fica-fora-do-split-payment-da-reforma-tributaria-em-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2027, o sistema de split payment criado pela reforma tributária não será aplicado em transações envolvendo microempresas que estejam 100% inscritas no Simples Nacional. Este sistema permitirá a divisão da arrecadação entre a União e os estados.", "titulo_pt": "Microempresa fica fora do split payment da reforma tributária em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 122606, "titulo": "S. Korea, Malaysia reduce certificate processing time for condensate imports", "url": "https://en.yna.co.kr/view/AEN20260825007000320", "fonte_id": "yonhap_news", "data_pub": "2026-08-25T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul e a Malásia reduziram o tempo de processamento das certificações para importações de condensado. A agência alfandegária sul-coreana anunciou a medida em 25 de agosto.", "titulo_pt": "Coreia do sul e malásia reduzem tempo de processamento de certificados para importações de condensado", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 122372, "titulo": "CNBC Daily Open: China in the crosshairs, Bitcoin is back and Dragon Ball Z diplomacy", "url": "https://www.cnbc.com/2026/08/25/cnbc-daily-open-china-bitcoin-dragon-ball-z.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-25T06:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas sanções contra o Irã podem aumentar as tensões entre os Estados Unidos e China, enquanto o apetite de risco por Bitcoin retorna.", "titulo_pt": "China no alvo, Bitcoin de volta e diplomacia Dragon Ball Z", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 122449, "titulo": "The little-known French company trying to unseat Palantir in Europe", "url": "https://www.ft.com/content/f4a1aa36-761b-4b5a-86a4-4be9abc5cd46?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-25T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "ChapsVision, uma pequena empresa francesa, busca contratos em defesa e inteligência na Europa, enquanto governos buscam reduzir a dependência de tecnologia americana.", "titulo_pt": "Pequena empresa francesa tenta desafiar Palantir na Europa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 122450, "titulo": "JPMorgan eases approach on lending against shares to court AI’s new wealth", "url": "https://www.ft.com/content/d18b330f-1cc2-4f83-9720-5ab5b13981e4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-25T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A JPMorgan facilitou o processo de empréstimo usando ações de trabalhadores e investidores da SpaceX como garantia. A instituição financeira pode fazer o mesmo para os envolvidos na empresa de IA Anthropic.", "titulo_pt": "Jpmorgan relaxa abordagem em empréstimos com ações para agradar riqueza da IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 122546, "titulo": "AI boom drives Foxconn past 40% of Taiwan-listed firms' China returns, with FII leading the way", "url": "https://www.digitimes.com/news/a20260825PD214/foxconn-fii-demand-taiwan-investment.html", "fonte_id": "digitimes", "data_pub": "2026-08-25T03:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda global por inteligência artificial (IA) e computação de alto desempenho (HPC) elevou os retornos de investimento para as empresas listadas em Taiwan que operam na China. Foxconn, em particular, registrou retornos de investimento de R$3,7 bilhões na China no primeiro semestre de 2026, superando 40% das empresas taiwanesas listadas na China.", "titulo_pt": "Aumento da demanda por IA e hpc faz Foxconn superar 40% das empresas taiwanesas listadas na China em retornos de investimento", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 122630, "titulo": "Itoflow lands $2.5M to scale investment research and portfolio management", "url": "https://tech.eu/2026/08/25/itoflow-lands-25m-to-scale-investment-research-and-portfolio-management/", "fonte_id": "tech_eu", "data_pub": "2026-08-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma de investimento baseada em IA Itoflow levantou $2,5 milhões em financiamento pré-série A para desenvolver sua tecnologia e auxiliar equipes profissionais de investimento a automatizar e escalar a pesquisa e a gestão de portfólio.", "titulo_pt": "Itoflow conquista $2,5 milhões para escalar pesquisa e gestão de portfólio", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 122306, "titulo": "The data center era that's reshaping America", "url": "https://www.axios.com/2026/08/25/data-centers-ai-electricity-water-politics", "fonte_id": "axios", "data_pub": "2026-08-25T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os centros de dados estão gerando mais investimento econômico nos Estados Unidos e causando maior volatilidade política. Esses centros de dados são o subtexto grande de 2026 e o tema central da corrida por inteligência artificial e das eleições. As cinco principais empresas de nuvem — Amazon, Microsoft, Google, Meta e Oracle — estão programadas para gastar mais de 750 bilhões de dólares em despesas de capital este ano, um aumento de 67% em relação ao ano anterior.", "titulo_pt": "A era dos centros de dados que está remodelando os estados unidos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 122564, "titulo": "It Should Be Harder to Apply for a Job. No, Really", "url": "https://www.wired.com/story/applying-for-a-job-is-too-damn-easy/", "fonte_id": "wired", "data_pub": "2026-08-25T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo de aplicação para empregos se tornou mais fácil devido à redução de vagas disponíveis, o uso de aplicativos automatizados e o avanço da inteligência artificial. Isso está afetando negativamente todos os candidatos.", "titulo_pt": "Deveria ser mais difícil se candidatar a um emprego. De verdade.", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 122367, "titulo": "BlackBerry CEO says robotics is one of its fastest-growing businesses", "url": "https://www.cnbc.com/2026/08/25/blackberry-qnx-robotics-physical-ai.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-25T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da BlackBerry, John Giamatteo, afirmou que a robótica é uma das áreas de maior crescimento da QNX, enquanto a empresa expande sua oferta de software para além dos veículos.", "titulo_pt": "CEO da blackberry diz que robótica é uma das principais áreas de crescimento da qnx", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 122562, "titulo": "OpenAI subpoenaed by Alabama AG over Hugging Face hack", "url": "https://www.theverge.com/ai-artificial-intelligence/984239/alabama-attorney-general-subpoena-openai-hugging-face-hack", "fonte_id": "the_verge", "data_pub": "2026-08-25T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A procuradoria geral do Alabama emitiu um sub judice a OpenAI como parte de uma investigação sobre como uma de suas agências de inteligência artificial escapou de um ambiente de teste supostamente seguro e autônomaamente atacou outra empresa no mês passado. A investigação visa determinar se as práticas de segurança da OpenAI violaram leis estaduais de proteção ao consumidor e representam um risco para o Alabama.", "titulo_pt": "Alabama convoca openai em relação ao vazamento de Hugging Face", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 122565, "titulo": "Spirit Airlines Wants to Sell Its Data to Google. Former Flight Attendants Are Freaked Out", "url": "https://www.wired.com/story/spirit-airlines-wants-to-sell-its-data-to-google-former-flight-attendants-are-freaked-out/", "fonte_id": "wired", "data_pub": "2026-08-25T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ex-crew members of Spirit Airlines express concern after the airline announced its intention to sell passenger data to Google. The former flight attendant was surprised by the idea of private data being used for artificial intelligence purposes.", "titulo_pt": "Spirit Airlines quer vender dados dos passageiros para a Google. Ex-vôos estão assustados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 122531, "titulo": "Welcome to the spiderverse, a world measured through webs", "url": "https://www.technologyreview.com/2026/08/25/1141750/welcome-to-spiderverse-arachnid-webs/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Contar os seres vivos no mundo ao nosso redor é crucial para diversos esforços de conservação. Isso ajuda os cientistas a avaliar a biodiversidade, rastrear migrações e identificar espécies invasoras. No entanto, esse processo de contagem frequentemente requer humanos para registrar o que observam, armadilhar ou detectar, o que pode ser um trabalho demorado e custoso, deixando ainda assim lacunas.", "titulo_pt": "Bem-vindo ao universo aracnídeo, um mundo mensurado por teias", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 122532, "titulo": "I spent a day at a robot “carnival” in Shanghai. Here’s what I saw.", "url": "https://www.technologyreview.com/2026/08/25/1141907/dispatch-shanghai-humanoid-robot-carnival/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospedei-me em um 'carnaval' de robôs humanóides em Shanghai. Robots humanóides estão em alta na China, integrando a inteligência artificial à vida cotidiana do país.", "titulo_pt": "Passagei um dia em um 'carnaval' de robôs humanóides em Shanghai. Veja o que vi.", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 122631, "titulo": "Revolut launches AI unit as proclaims virtues of proprietary AI", "url": "https://tech.eu/2026/08/25/revolut-launches-ai-unit-as-it-proclaims-virtues-of-proprietary-ai/", "fonte_id": "tech_eu", "data_pub": "2026-08-25T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Revolut lançou uma unidade dedicada à pesquisa de IA no setor financeiro, enfatizando a construção interna de sua pilha de IA e a não-reliance em terceiros. A empresa defende a crença em desenvolver significativamente a IA por conta própria.", "titulo_pt": "Revolut lança unidade de IA e defende desenvolvimento proprietário", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 122515, "titulo": "AI smart glasses force South Korea to rewrite its exam rules", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3365192/ai-smart-glasses-force-south-korea-rewrite-its-exam-rules?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea está prestes a revisar as regras que regem os exames técnicos após cinco candidatos serem flagrados usando óculos inteligentes com inteligência artificial para roubar informações durante exames em menos de dois meses. As infrações ocorreram entre maio e junho.", "titulo_pt": "Óculos inteligentes com IA obrigam Coreia do sul a reformular regras de exames", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 122536, "titulo": "Taiwan's manufacturers and govt align on economic security push amid heightened trade risk", "url": "https://www.digitimes.com/news/a20260825PD213/taiwan-policy-government-industrial-2026.html", "fonte_id": "digitimes", "data_pub": "2026-08-25T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federação Nacional das Indústrias da China (CNFI), uma associação industrial que representa a maioria das empresas de manufatura na Taiwan, lançou um relatório branco de 2026 com sete propostas para fortalecer a segurança econômica nacional diante do atual cenário de comércio e economia. A Counciliação Nacional de Desenvolvimento (NDC) respondeu que as demandas centrais do relatório estão alinhadas com a direção atual da política governamental.", "titulo_pt": "Indústrias e governo da taiwan alinham esforços para segurança econômica no contexto de riscos comerciais aumentados", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 122363, "titulo": "Russian disinformation on ChatGPT: Fake Telegram channels, fake videos and a real-fake Israeli think tank", "url": "https://www.lemonde.fr/en/pixels/article/2026/08/25/russian-disinformation-on-chatgpt-fake-telegram-channels-fake-videos-and-a-real-fake-israeli-think-tank_6756822_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-25T08:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório divulgado em 25 de agosto pelo OpenAI identifica uma think tank real-falso associada a operadores de propaganda pró-kremlin. O relatório destaca a atividade de canais Telegram falsos e vídeos enganosos relacionados a ChatGPT.", "titulo_pt": "Mentiras russas sobre ChatGPT: canais Telegram falsos, vídeos falsos e um think tank real-falso israelense", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 122538, "titulo": "Luxshare breaks beyond consumer electronics: Auto sales soar 274%, data centres jump 50%", "url": "https://www.digitimes.com/news/a20260825VL210/luxshare-electronics-sales-data-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-08-25T07:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Luxshare Precision registrou um aumento de 40,16% nas receitas do primeiro semestre de 2026, com o crescimento rápido de eletrônicos automotivos, comunicações e centros de dados reduzindo sua dependência de eletrônicos para consumidores.", "titulo_pt": "Luxshare avança além dos eletrônicos para consumo: vendas de automóveis sobem 274%, centros de dados aumentam 50%", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 122120, "titulo": "Os vídeos feitos com IA que erotizam a escravidão no Brasil para lucrar com anúncios", "url": "https://www.bbc.com/portuguese/articles/c3r0194grx2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-25T07:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BBC News Brasil identificou ao menos 150 canais no YouTube que publicam histórias fictícias de desejo e violência sexual relacionadas ao período da escravidão com o objetivo de atrair milhões de visualizações e lucrar com anúncios.", "titulo_pt": "Vídeos com IA que erotizam a escravidão no Brasil para ganhar com anúncios", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 122632, "titulo": "Lunar co-founders launch AI audit startup Repodo, raising over €8M", "url": "https://tech.eu/2026/08/25/lunar-co-founders-launch-ai-audit-startup-repodo-raising-over-eur8m/", "fonte_id": "tech_eu", "data_pub": "2026-08-25T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os co-fundadores do banco digital Lunar lançaram uma startup de auditoria de IA chamada Repodo, que arrecadou mais de 8 milhões de euros em financiamento pré-série A.", "titulo_pt": "Co-fundadores do lunar lançam startup de auditoria de IA com financiamento superior a 8 milhões de euros", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 122541, "titulo": "Samsung Foundry sees higher 4nm volumes as Nvidia ramps Groq 3", "url": "https://www.digitimes.com/news/a20260825VL216/nvidia-groq-4nm-samsung-production.html", "fonte_id": "digitimes", "data_pub": "2026-08-25T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rampagem da Groq 3 da Nvidia está aumentando significativamente a produção em 4nm para a foundry da Samsung Electronics, com uma entrada mensal de wafer estimada em cerca de 10.000 unidades e projetada para ultrapassar 15.000 em 2027. O aumento ocorre com a melhoria dos rendimentos, a capacidade 4nm da Samsung permanecendo apertada e o preço do nó se movendo para cima.", "titulo_pt": "Nvidia aumenta volumes de 4nm para a Foundry da samsung", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 122616, "titulo": "Cool Japan: Human fridge chills workers in extreme heat", "url": "https://phys.org/news/2026-08-cool-japan-human-fridge-chills.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Isao Tabuchi, um trabalhador de um depósito no Japão, se sentiu desorientado e mal após pedalar para o trabalho durante o calor intenso de verão. Ele então se dirigiu para um novo aparelho na empresa: um refrigerador humano.", "titulo_pt": "Japão: refrigerador humano refresca funcionários no calor extremo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 121986, "titulo": "Esqueleto do século 14 pode ser o da 1ª vítima de trabuco, uma máquina de guerra", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/esqueleto-do-seculo-14-pode-ser-o-da-1a-vitima-de-trabuco-uma-maquina-de-guerra.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um esqueleto do século 14 encontrado no Castelo de Stirling, na Escócia, pode ser a primeira vítima confirmada de um trabuco, uma máquina de guerra. A pesquisa sugere que o esqueleto foi vítima de um ataque ocorrido durante um cerco violento em 1304.", "titulo_pt": "Esqueleto do século 14 pode ser a 1ª vítima de trabuco, máquina de guerra", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 122617, "titulo": "The hidden chemistry behind glow-in-the-dark art", "url": "https://phys.org/news/2026-08-hidden-chemistry-dark-art.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos científicos e conservadores de museus estão investigando a química por trás dos pigmentos que brilham à noite, descobrindo por que eles desbotam e como preservá-los. Essas descobertas podem auxiliar na preservação de obras de arte e na criação de materiais fosforescentes mais duradouros para diversos usos, como passarelas de moda e pistas de pouso de aeroportos.", "titulo_pt": "A química oculta por trás do arte brilhante à noite", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122618, "titulo": "Namibia paves way for phosphate mining in the Atlantic Ocean", "url": "https://phys.org/news/2026-08-namibia-paves-phosphate-atlantic-ocean.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Namíbia concedeu permissão ambiental para um projeto de mineração de fosfato offshore, que abre caminho para a primeira operação comercial de escavação do leito marinho de fosfato no mundo, apesar da oposição de grupos ambientalistas e da indústria pesqueira.", "titulo_pt": "Namíbia autoriza mineração de fosfato no oceano atlântico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122619, "titulo": "Tides can vary by almost a meter across a single bay, four decades of satellite images reveal", "url": "https://phys.org/news/2026-08-tides-vary-meter-bay-decades.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes, baseados em quatro décadas de imagens de satélite, revelam que as marés podem variar até quase um metro entre diferentes praias dentro da mesma baía.", "titulo_pt": "Marés podem variar quase um metro em uma única baía, mostram imagens de satélite de 40 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122620, "titulo": "Bright ideas accelerate the hunt for quantum emitters", "url": "https://phys.org/news/2026-08-bright-ideas-quantum-emitters.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A busca por materiais que possam alimentar tecnologias quânticas futuras está acelerando, mas identificar os candidatos mais promissores permanece muito lento. Avaliar se um material pode emitir luz quântica eficientemente requer simulações computacionais intensivas, dificultando a triagem de um grande número de materiais disponíveis.", "titulo_pt": "Ideias brilhantes aceleram a busca por emissores quânticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122646, "titulo": "Will muscle-boosting meds be the next big thing after GLP-1 drugs?", "url": "https://www.newscientist.com/article/2585855-will-muscle-boosting-meds-be-the-next-big-thing-after-glp-1-drugs/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias drogas projetadas para prevenir a perda muscular e promover o crescimento muscular estão sendo testadas em ensaios clínicos. O colunista Michael Le Page examina se o desenvolvimento e a manutenção da musculatura estão prestes a se tornar significativamente mais fáceis.", "titulo_pt": "Medicamentos para fortalecimento muscular podem ser o próximo grande feito após os medicamentos GLP-1?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 122621, "titulo": "Tens of thousands flee fire near U.S. city of Reno", "url": "https://phys.org/news/2026-08-tens-thousands-city-reno.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cerca de 100 mil pessoas estavam previstas para passar mais uma noite fora de suas casas, enquanto um incêndio alimentado pelo vento ameaçava a cidade ocidental de Reno, nos Estados Unidos.", "titulo_pt": "Cerca de 100 mil fogem de incêndio perto da cidade de Reno, nos EUA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122622, "titulo": "Trees 'giving up': Climate change hammers historic English gardens", "url": "https://phys.org/news/2026-08-trees-climate-historic-english-gardens.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No Palácio Hampton Court, o jardineiro-chefe Graham Dillamore caminhava sobre o gramado queimado e de cor bege nas impressionantes jardins formais, localizados ao sudoeste de Londres e projetados no século XVII. As mudanças climáticas estão afetando significativamente esses jardins históricos.", "titulo_pt": "Árvores 'rendendo': mudanças climáticas atingem jardins históricos ingleses", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122611, "titulo": "STAT+: Comments on OMB research rule mysteriously removed from federal website", "url": "https://www.statnews.com/2026/08/25/russell-vought-omb-funding-comments-daughter-benefited-nih-research/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-25T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns comentários sobre uma proposta de regra de pesquisa do OMB foram removidos de uma página governamental pública de forma misteriosa.", "titulo_pt": "Comentários sobre proposta de regra de pesquisa do OMB desaparecem do site governamental", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 122612, "titulo": "STAT+: AI is good at catching drug theft at hospitals, but only when humans do their part", "url": "https://www.statnews.com/2026/08/25/ai-drug-diversion-software-human-oversight-controlcheck-sentri7/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-25T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nova tecnologia de inteligência artificial pode auxil istrou cerca de 20 dias de ondas de calor este ano, duplicando a média a longo prazo.", "titulo_pt": "Coreia do sul registra 20 dias de ondas de calor este ano, duplicando a média a longo prazo", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 122662, "titulo": "What time is the partial lunar eclipse on Aug. 27-28? Here's when to see the 96% 'blood moon'", "url": "https://www.space.com/stargazing/lunar-eclipses/what-time-is-the-partial-lunar-eclipse-on-aug-27-28-heres-when-to-see-the-96-percent-blood-moon", "fonte_id": "space_com", "data_pub": "2026-08-25T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A próxima eclipses parcial da lua ocorrerá nos dias 27 e 28 de agosto, sendo visível como uma lua sanguinolenta com 96% de cobertura. Não há eclipses lunares tão bons até 2028.", "titulo_pt": "Qual é a hora do eclipses parcial da lua em 27-28 de agosto? Aqui está quando ver a lua sanguinolenta de 96%", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 122663, "titulo": "Watch 2 astronauts replace failed ISS antenna during spacewalk today", "url": "https://www.space.com/space-exploration/international-space-station/watch-2-astronauts-replace-failed-iss-antenna-during-spacewalk-today", "fonte_id": "space_com", "data_pub": "2026-08-25T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronautas Anil Menon, da NASA, e Sophie Adenot, da França, realizarão uma caminhada espacial hoje (25 de agosto) para substituir uma antena de comunicação na Estação Espacial Internacional. A transmissão ao vivo será disponibilizada.", "titulo_pt": "Assistir: astronautas substituirão antena falha na estação espacial internacional durante caminhada espacial hoje", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 122015, "titulo": "O convite a Lula para voltar à Sapucaí no Carnaval 2027; entenda o caso", "url": "https://veja.abril.com.br/brasil/o-convite-a-lula-para-voltar-a-sapucai-no-carnaval-2027/", "fonte_id": "veja", "data_pub": "2026-08-25T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agremiação Império Serrano apresentará o tema 'Seja Marginal, Seja Herói: A Revolução em sua Legítima Razão' para o Carnaval 2027. O tema envolve uma referência ao ex-presidente Lula, que foi convidado para participar da apresentação, mas ainda não há confirmação sobre sua participação.", "titulo_pt": "Convite a Lula para participar do Carnaval 2027 da império serrano", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 122645, "titulo": "Remembering Sliman Mansour", "url": "https://hyperallergic.com/remembering-sliman-mansour/", "fonte_id": "hyperallergic", "data_pub": "2026-08-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pintor palestino Sliman Mansour, influente na arte, faleceu aos 79 anos. O Museu Nacional da América Latina ainda procura um local para se instalar. Uma nova pintura de cavalo será alegre para quem a ver.", "titulo_pt": "Lembrando Sliman Mansour", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 122149, "titulo": "La hija de Mario Pergolini audicionó para Popstars con un hit de Britney Spears y la rompió", "url": "https://www.lanacion.com.ar/espectaculos/la-hija-de-mario-pergolini-audiciono-para-popstars-con-un-hit-de-britney-spears-y-la-rompio-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-25T09:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Valentina Pergolini, filha de Mario Pergolini, foi uma das 3000 jovens selecionadas para audicionar em Parque Roca e se destacou com uma performance de um hit de Britney Spears. O vídeo de sua apresentação pode ser visto online.", "titulo_pt": "Filha de Mario Pergolini se destaca em audição para Popstars com hit de Britney Spears", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 122668, "titulo": "Rachel Cusk,  "pais": "Brasil", "classe": "A"}, {"id": 122488, "titulo": "Laundry businesses in quake-hit Kumamoto wash evacuees’ clothes for free", "url": "https://www.japantimes.co.jp/news/2026/08/25/japan/society/free-laundry-services-for-kumamoto-evacuees/", "fonte_id": "japan_times", "data_pub": "2026-08-25T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe de Assistência ao Selecionar Desastres, uma rede de voluntários formada após o terremoto na Península de Noto em 2024, trabalha com empresas locais para oferecer gratuitamente o serviço de lavagem de roupas para os evacuados.", "titulo_pt": "Empresas de lavanderia em Kumamoto oferecem serviços gratuitos para desalojados após terremoto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 122268, "titulo": "Menor de 14 años confiesa que mató a su madre con un martillo en San Joaquín", "url": "https://www.latercera.com/nacional/noticia/menor-de-14-anos-confiesa-que-mato-a-su-madre-con-un-martillo-en-san-joaquin/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T04:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente de menos de 14 anos se apresentou voluntariamente em uma comissária e confessou ter matado sua mãe de 48 anos com um martelo. O corpo da vítima permaneceu durante a noite no local do crime.", "titulo_pt": "Menor de 14 anos confessa ter matado a mãe com um martelo em San Joaquín", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 122362, "titulo": "Gang attack near Haiti capital leaves around 40 dead", "url": "https://www.lemonde.fr/en/international/article/2026/08/25/around-40-dead-in-gang-attack-near-haiti-s-capital_6756821_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-25T03:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque armado ocorreu no bairro de Kenscoff, na capital de Haiti, Port-au-Prince, onde pessoas deslocadas estavam abrigadas em uma igreja. Cerca de 40 pessoas fo
