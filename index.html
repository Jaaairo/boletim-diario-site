vavel_duplicata_de": null, "texto_pt": "O advogado Gustavo Veloso foi temporariamente suspenso após a morte de um menino de 3 anos que estava sob seus cuidados e apresentava sinais de abuso. O menino faleceu na segunda-feira, 3 de agosto.", "titulo_pt": "OAB-TO suspende pai de menino de 3 anos encontrado morto com sinais de maus-tratos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 90717, "titulo": "RJ: líder religioso é preso por transformar fiéis em escravos sexuais", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/rj-lider-religioso-e-preso-por-transformar-fieis-em-escravos-sexuais", "fonte_id": "metropoles", "data_pub": "2026-08-06T09:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O líder religioso Leonardo Ribeiro, de 57 anos, foi preso acusado de abusar sexualmente de fiéis em um centro espírita. Ele seria responsável por uma série de abusos junto com outro líder religioso.", "titulo_pt": "RJ: líder religioso é preso por abuso sexual contra fiéis em centro espírita", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 90757, "titulo": "Mapa da Desigualdade: veja ranking da qualidade de vida na Grande SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/mapa-da-desigualdade-veja-ranking-da-qualidade-de-vida-na-grande-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-06T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo Mapa da Desigualdade analisou a qualidade de vida na Grande São Paulo, com São Caetano do Sul no topo e Pirapora do Bom Jesus em último lugar. O levantamento considerou aspectos como saneamento básico, transporte, saúde, educação, segurança pública e habitação.", "titulo_pt": "Mapa da Desigualdade: veja ranking da qualidade de vida na Grande SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 91707, "titulo": "Ciclone bomba: Rio suspende aulas por risco de ventos acima de 90 km/h", "url": "https://www.metropoles.com/brasil/ciclone-bomba-rio-suspende-aulas-por-risco-de-ventos-acima-de-90-km-h", "fonte_id": "metropoles", "data_pub": "2026-08-07T02:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As aulas foram suspensas preventivamente devido à previsão de rajadas de vento superiores a 90 km/h e ao alerta de um ciclone extratropical intenso no Sul do país.", "titulo_pt": "Ciclone bomba: rio suspende aulas por risco de ventos acima de 90 km/h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 91708, "titulo": "Rajadas de vento atingem 97 km/h no litoral sul, diz Defesa Civil", "url": "https://www.metropoles.com/sao-paulo/rajadas-de-vento-atinge-97-km-h-no-litoral-sul-diz-defesa-civil", "fonte_id": "metropoles", "data_pub": "2026-08-07T02:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rajadas de vento atingiram 97,2 km/h em Itanhaém e 90 km/h em Mongaguá, no litoral sul do estado, conforme informou a Defesa Civil.", "titulo_pt": "Rajadas de vento atingem 97 km/h no litoral sul, diz Defesa Civil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 92348, "titulo": "Industry, climate ministries team up to promote battery recycling industry", "url": "https://en.yna.co.kr/view/AEN20260807002800320", "fonte_id": "yonhap_news", "data_pub": "2026-08-07T01:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ainda não há informações completas sobre as ações específicas das duas secretarias, mas é mencionado que o Ministério do Comércio, Indústria e Recursos e outro ministério estão cooperando para promover o setor de reciclagem de baterias.", "titulo_pt": "Indústria e meio ambiente unem esforços para fomentar indústria de reciclagem de baterias", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 92299, "titulo": "As record heatwave hits Asia, fears of energy crisis and health risks mount", "url": "https://www.scmp.com/week-asia/health-environment/article/3363204/record-heatwave-hits-asia-fears-energy-crisis-and-health-risks-mount?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma onda de calor extremamente quente afeta a Ásia, levando à preocupação com uma crise energética e riscos para a saúde. Em Gwangju, na Coreia do Sul, Chae Young-sun, um aposentado de 69 anos, deixou de caminhar diariamente devido ao calor intenso.", "titulo_pt": "Onada de calor atinge ásia, aumentam temores de crise energética e riscos à saúde", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 92329, "titulo": "Air, sea transport disrupted ahead of Typhoon Dolphin", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/07/2003862094", "fonte_id": "taipei_times", "data_pub": "2026-08-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O transporte aéreo e marítimo foi interrompido à medida que o furacão Dolphin se aproximava. As autoridades locais estão tomando medidas para garantir a segurança dos passageiros e tripulantes.", "titulo_pt": "Transporte aéreo e marítimo interrompidos diante do furacão Dolphin", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 92330, "titulo": "Tainan under climate pressure", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/07/2003862095", "fonte_id": "taipei_times", "data_pub": "2026-08-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tainan está enfrentando pressões climáticas significativas. As cidades costeiras da região estão sob crescente ameaça de eventos climáticos extremos e níveis elevados de maré.", "titulo_pt": "Tainan sob pressão climática", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 92333, "titulo": "Ocean waste reduced by 66 percent with project", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/07/2003862098", "fonte_id": "taipei_times", "data_pub": "2026-08-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto reduziu o lixo marinho em 66%. As informações não mencionam detalhes adicionais sobre o projeto ou a localização específica onde essa redução ocorreu.", "titulo_pt": "Lixo marinho reduzido em 66% com projeto", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 92102, "titulo": "Heatwave forces power plant shutdowns across Europe, putting electricity grid under strain", "url": "https://www.lemonde.fr/en/economy/article/2026/08/07/heatwave-forces-power-plant-shutdowns-across-europe-putting-electricity-grid-under-strain_6756235_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-06T22:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Devido à onda de calor, seis países da União Europeia tiveram que encerrar algumas usinas elétricas por baixos níveis e altas temperaturas nas águas dos rios. O eclipse solar em 12 de agosto também ameaça reduzir significativamente a produção photovoltaica.", "titulo_pt": "Onda de calor força encerramento de usinas em seis países da ue, sobrecarregando o sistema elétrico", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 92580, "titulo": "National Park Service Worries Trump’s Arch Could Defile Historical Sites", "url": "https://www.artforum.com/news/national-park-service-worries-trump-arch-defile-sites-1234756555/", "fonte_id": "artforum", "data_pub": "2026-08-06T18:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Serviço de Parques Nacionais dos Estados Unidos expressou preocupação sobre os possíveis impactos negativos do arco proposto pelo presidente Trump no patrimônio histórico da capital americana. O monumento, um arco dourado com 250 pés de altura, seria construído na Memorial Circle próximo ao Arlington National Cemetery.", "titulo_pt": "Serviço de parques nacionais se preocupa com o arco proposto por Trump", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 91889, "titulo": "‘We expected it, but now it’s here’: on the frontline of Australia’s bird flu outbreak, people are distressed", "url": "https://www.theguardian.com/environment/2026/aug/07/we-expected-it-but-now-its-here-on-the-frontline-of-australias-bird-flu-outbreak-people-are-distressed", "fonte_id": "guardian_world", "data_pub": "2026-08-06T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australiana prepara-se para a possibilidade de uma epidemia de gripe aviária H5 que pode afetar centenas de espécies, enquanto moradores da Costa Limestone já estão registrando encontros com aves doentes ou mortas. Maureen Christie, que tem observado e protegido as aves na região há décadas, está testemunhando os impactos.", "titulo_pt": "‘Acreditávamos nisso, mas agora está aqui’: na linha de frente da epidemia de gripe aviária na austrália, moradores estão abalados", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 92552, "titulo": "Q&A: What is in China’s new five-year plan for climate change?", "url": "https://www.carbonbrief.org/qa-what-is-in-chinas-new-five-year-plan-for-climate-change", "fonte_id": "carbon_brief", "data_pub": "2026-08-06T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China lançou um plano de cinco anos focado no combate ao clima. O plano aborda medidas para responder às mudanças climáticas durante o período 2021-2025.", "titulo_pt": "Perguntas e respostas: qual é o conteúdo do novo plano de cinco anos chinês sobre mudança climática?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 92289, "titulo": "Romanians Urged to Use Less Electricity in Heatwave as Danube Levels Drop", "url": "https://balkaninsight.com/2026/08/06/romanians-urged-to-use-less-electricity-in-heatwave-as-danube-levels-drop/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-06T13:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Romênia foi encorajada a reduzir o consumo de eletricidade durante a onda de calor, devido aos níveis históricos baixos da água no Rio Danúbio que estão aumentando a pressão sobre a rede elétrica.", "titulo_pt": "Romanianas incentivadas a usar menos eletricidade na onda de calor com nível baixo do rio danúbio", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 92121, "titulo": "Moment rare Amur tiger is released into Kazakh wild", "url": "http://www.euronews.com/video/2026/08/06/moment-rare-amur-tiger-is-released-into-kazakh-wild", "fonte_id": "euronews", "data_pub": "2026-08-06T11:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma tigresa amureNSE, chamada Umit, foi libertada no Reserva Natural Ile-Balkhash na Kazáquia. Este é um passo importante em um projeto para restaurar uma população de tigres selvagens na Ásia Central pela primeira vez há mais de 70 anos.", "titulo_pt": "Momento raro: tigre amurense é libertado na natureza da kazáquia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 91039, "titulo": "Climate change is fueling wildfire risk — and anxiety", "url": "https://www.axios.com/2026/08/06/climate-change-fueling-wildfire-risk-anxiety", "fonte_id": "axios", "data_pub": "2026-08-06T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fumacê causado por incêndios florestais que cobre Seattle e grande parte do Oeste dos Estados Unidos serve como um lembrete sombrio de como o risco de incêndios está aumentando. As mudanças climáticas intensificam os incêndios, criando uma sensação de insegurança sobre onde será realmente seguro no futuro.", "titulo_pt": "Clima quente está agravando o risco de incêndios e causando ansiedade", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 91192, "titulo": "As the Danube hits record lows, every centimeter of river counts", "url": "https://www.japantimes.co.jp/environment/2026/08/06/climate-change/danube-river-heat-wave/", "fonte_id": "japan_times", "data_pub": "2026-08-06T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O nível do rio Danúbio está em seu menor registro histórico, afetando o comércio e os cruzeiros turísticos, além de expondo a comunidades ribeirinhas aos impactos do aquecimento global.", "titulo_pt": "Com nível recorde baixo, danúbio interrompe comércio e cruzeiros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91095, "titulo": "Smoke towers above Washington forests as firefighting continues", "url": "http://www.euronews.com/video/2026/08/06/smoke-towers-above-washington-forests-as-firefighting-continues", "fonte_id": "euronews", "data_pub": "2026-08-06T07:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens de helicópteros estão sendo usadas para derramar água sobre incêndios florestais enquanto equipes reforçam as linhas de contenção em áreas centrais e orientais do estado de Washington. A fumaça de vários focos de incêndio paira acima das florestas locais.", "titulo_pt": "Fumaça invade florestas de Washington durante operações de combate a incêndios", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 91781, "titulo": "Caso Fundamenta: los gastos en Colombia y España que pareja de Vivanco financió tras depósito de $13 millones ordenado por Lagos", "url": "https://www.ciperchile.cl/2026/08/06/caso-fundamenta-los-gastos-en-colombia-y-espana-que-pareja-de-vivanco-financio-tras-deposito-de-13-millones-ordenado-por-lagos/?utm_source=rss&utm_medium=rss&utm_campaign=caso-fundamenta-los-gastos-en-colombia-y-espana-que-pareja-de-vivanco-financio-tras-deposito-de-13-millones-ordenado-por-lagos", "fonte_id": "ciper_chile", "data_pub": "2026-08-07T02:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Apareceram gastos em Colombia e Espanha que a parceira de Vivanco pagou após o depósito de 13 milhões forme informou a Organização Mundial da Saúde (OMS).", "titulo_pt": "Epidemia de ebola na república democrática do Congo supera a resposta: OMS", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 91597, "titulo": "'Não adianta nos chamar de guardiões e nos deixar de fora das decisões', diz Sônia Guajajara", "url": "https://exame.com/esg/nao-adianta-nos-chamar-de-guardioes-e-nos-deixar-de-fora-das-decisoes-diz-sonia-guajajara/", "fonte_id": "exame", "data_pub": "2026-08-06T19:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sônia Guajajara alertou sobre a exclusão dos povos indígenas nas decisões climáticas. Ela e Carlos Nobre, cientista do World Climate Foundation, discursaram sobre o ponto de não retorno do clima e a necessidade da união entre ciência e saberes ancestrais.", "titulo_pt": "‘Não adianta nos chamar de guardiões e nos deixar de fora das decisões’, diz Sônia Guajajara", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 91950, "titulo": "China’s ‘Ethnic Unity’ Law is Already Harming Uyghurs", "url": "https://thediplomat.com/2026/08/chinas-ethnic-unity-law-is-already-harming-uyghurs/", "fonte_id": "the_diplomat", "data_pub": "2026-08-06T14:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei chinesa de 'unidade étnica' já está causando danos aos uighures, expandindo restrições que antes eram campaegs regionais e tornando-as mais difíceis de serem desafiadas no âmbito da legislação nacional.", "titulo_pt": "Lei de 'unidade étnica' do china está a causar danos aos uighures", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 91067, "titulo": "Human rights organizations call for war crime probe into Israel's killing of Lebanese journalist", "url": "https://www.lemonde.fr/en/international/article/2026/08/06/human-rights-organizations-call-for-war-crime-probe-into-israel-s-killing-of-lebanese-journalist_6756211_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-06T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações de direitos humanos, como a Amnistia Internacional e a Watch dos Direitos Humanos, estão pedindo uma investigação sobre crimes de guerra relacionados à morte do jornalista libanês Amal Khalil, que trabalhava para o 'Al-Akhbar', um periódico esquerdista próximo ao Hezbollah, no dia 22 de abril.", "titulo_pt": "Organizações de direitos humanos pleiteiam investigação sobre crime de guerra em relação à morte do jornalista libanês", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 90689, "titulo": "STJ decide destino de Marco Buzzi, acusado de assédio sexual", "url": "https://veja.abril.com.br/brasil/stj-decide-destino-de-marco-buzzi-acusado-de-assedio-sexual/", "fonte_id": "veja", "data_pub": "2026-08-06T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Superior Tribunal de Justiça (STJ) vão analisar, em uma sessão fechada, a conclusão do processo disciplinar contra Marco Buzzi, acusado de assédio sexual.", "titulo_pt": "STJ decide destino de Marco Buzzi, acusado de assédio sexual", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 91386, "titulo": "At least 300 children reportedly killed in Gaza in past 300 days", "url": "https://www.unicef.org/press-releases/least-300-children-reportedly-killed-gaza-past-300-days", "fonte_id": "unicef", "data_pub": "2026-08-06T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com relatos, pelo menos 300 crianças foram mortas em Gaza nos últimos 300 dias. Não há detalhes adicionais sobre os eventos específicos ou a origem das informações.", "titulo_pt": "Pelo menos 300 crianças reportadas como mortas em Gaza nos últimos 300 dias", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 91369, "titulo": "63 N. Korean defectors arrive in S. Korea in 1st half, down 35 pct on-year", "url": "https://en.yna.co.kr/view/AEN20260806007400315", "fonte_id": "yonhap_news", "data_pub": "2026-08-06T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No primeiro semestre de 2023, 63 defensores norte-coreanos entraram na Coreia do Sul, uma diminuição de 35% em comparação com o mesmo período do ano anterior.", "titulo_pt": "63 Defensores norte-coreanos chegam à Coreia do sul no primeiro semestre, queda de 35%", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 90931, "titulo": "La ONU asegura que El Niño podría empujar a 49 millones de personas más hacia el hambre aguda", "url": "https://www.latercera.com/mundo/noticia/la-onu-asegura-que-el-nino-podria-empujar-a-49-millones-de-personas-mas-hacia-el-hambre-aguda/", "fonte_id": "la_tercera", "data_pub": "2026-08-06T05:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo do Programa Mundial de Alimentos da ONU indica que o fortalecimento do fenômeno El Niño poderia levar a um agravamento da fome em 45 países já em situação de vulnerabilidade. A organização estima que isso poderia afetar mais 49 milhões de pessoas.", "titulo_pt": "ONU alerta: El Niño pode empurrar 49 milhões de pessoas para a fome aguda", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 90932, "titulo": "Tedros llama a intensificar de forma “masiva” la respuesta al brote de ébola en RDC ante su rápida propagación", "url": "https://www.latercera.com/mundo/noticia/tedros-llama-a-intensificar-de-forma-masiva-la-respuesta-al-brote-de-ebola-en-rdc-ante-su-rapida-propagacion/", "fonte_id": "la_tercera", "data_pub": "2026-08-06T05:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O diretor geral da OMS, Tedros Adhanom Ghebreyesus, chamou para uma resposta 'massiva' ao surto de ebola na República Democrática do Congo. Segundo as autoridades sanitárias, há 3.874 casos confirmados e 1.751 mortes causadas pelo vírus.", "titulo_pt": "Tedros incentiva resposta massiva ao surto de ébola na RDC diante da rápida propagação", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 92246, "titulo": "‘People are going to kill me’: how Haitians got caught in Donald Trump’s crosshairs", "url": "https://www.ft.com/content/dee0188b-54b5-4bfe-b9cf-9c4893d9c7f2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-06T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump tentou encerrar um programa humanitário que afetaria mais de 1 milhão de pessoas. Haitianos foram envolvidos nessa situação.", "titulo_pt": "Pessoas vão me matar: como haitianos caíram nas redes de Donald Trump", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 91028, "titulo": "Malaysia Says It Will Not Deport Rohingya if There Are Risks to Their Safety", "url": "https://thediplomat.com/2026/08/malaysia-says-it-will-not-deport-rohingya-if-there-are-risks-to-their-safety/", "fonte_id": "the_diplomat", "data_pub": "2026-08-06T02:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do primeiro-ministro Anwar Ibrahim anunciou planos para repatriar aproximadamente 5.000 rohingyas com o consentimento da Birmânia.", "titulo_pt": "Malásia afirma que não deportará Rohingya se houver riscos à sua segurança", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 91707, "fonte_id": "metropoles", "titulo": "Ciclone bomba: Rio suspende aulas por risco de ventos acima de 90 km/h", "url": "https://www.metropoles.com/brasil/ciclone-bomba-rio-suspende-aulas-por-risco-de-ventos-acima-de-90-km-h", "data_pub": "2026-08-07T02:49:00Z", "topico": "meio_ambiente", "idioma": "pt", "titulo_pt": "Ciclone bomba: rio suspende aulas por risco de ventos acima de 90 km/h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 91781, "fonte_id": "ciper_chile", "titulo": "Caso Fundamenta: los gastos en Colombia y España que pareja de Vivanco financió tra function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });

    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
