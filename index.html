<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "28/08/2026 15:24", "stats": {"noticias_novas": 941, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva está buscando alianças políticas para beneficiar suas campanhas, especialmente com os líderes do Congresso, Hugo Motta e Alcolumbre. O governo planeja incluir um superávit de R$ 18 a 20 bilhões no Orçamento de 2027, conforme informou o ministro do Planejamento. Aécio Neves confirmou sua candidatura ao Senado pelo estado de Minas Gerais, mesmo após o prazo para registro de candidaturas ter expirado, usando o tema da renúncia do ministro Bruno Dantas em seus anúncios eleitorais. A campanha de Lula negou qualquer relação íntima com a lobista Roberta Luchsinger após fotos dos dois juntos circularem nas redes sociais. A pesquisa Globo/Quaest testa o cenário eleitoral a um mês das eleições de 2026, influenciado pelos casos Lulinha e Dark Horse, colocando Flávio Dino e André Mendonça como os principais adversários em um racha interno do STF.", "mundo": "A Noruega entrou em uma nova era com a morte do rei Harald V, cuja longa e popular reinado terminou com a ascensão de seu filho, o rei Haakon, agora o rei mais jovem da Europa. Expressões de luto foram feitas por líderes internacionais e reis. Em um desenvolvimento geopolítico, o Egito foi acusado de realizar uma 'punição por proxy' ao detener uma mulher britânica de origem egípcia, Eman el-Shazly, que está sendo criticada por supostas motivações políticas. As sanções impostas pelo governo dos Estados Unidos a um banco egípcio também visam pressionar o Irã, parte de uma estratégia maior de isolar a economia iraniana. No Nepal, as cheias continuam devastando aldeias e causando desespero, com centenas de pessoas ainda desaparecidas. A situação é vista como um desafio não apenas humanitário, mas também de planejamento a longo prazo, devido à presença de centenas de lagos de alta altitude prontos para liberar grandes volumes de água.\n\nA guerra na Ucrânia, que completa seis meses, continua a influenciar a geopolítica global. De acordo com oficiais ocidentais, a Rússia está perdendo aproximadamente 6.000 soldados por mês na Ucrânia, enquanto consegue recrutar apenas cerca de 1.000 novos soldados por dia. Este desequilíbrio está se agravando, o que pode levar a Rússia a tomar medidas contra a Otan. Em outro desenvolvimento, a Ucrânia está reforçando Donetsk para interromper o fluxo de armas da Rússia, mudando de estratégia para usar armas europeias em vez das promessas não cumpridas dos sistemas Patriot dos EUA. Além disso, a guerra entre Estados Unidos e Israel contra o Irã completa seis meses sem sinais de desaceleração, com os EUA impor novas sanções ao Irã. Isso ocorre em um contexto de tensões crescentes no Oriente Médio, onde Israel realizou ataques em Gaza, resultando em cinco mortes, incluindo três membros de uma mesma família. A situação em Gaza continua com uma grave insegurança alimentar para os palestinos.", "economia": "O governo brasileiro sancionou a Lei Complementar nº 235 de 2026, permitindo a redução das alíquotas de tributos sobre combustíveis, em resposta ao conflito no Oriente Médio. No exterior, o Federal Reserve, liderado por Kevin Warsh, sinalizou a possibilidade de um aumento das taxas de juros em setembro, dependendo da evolução da inflação. A Braskem anunciou a aprovação judicial para a recuperação extrajudicial, visando reestruturar dívidas de US$ 10,9 bilhões. A Vale, por sua vez, afirmou que os minerais críticos são o novo petróleo da geração atual, destacando o desafio para o Brasil em se manter competitivo globalmente. A economia francesa registrou zero crescimento no segundo trimestre, com persistência do déficit público e aumento dos juros, complicando os planos orçamentários para 2026. No Brasil, o dólar disparou e a bolsa recuou após o discurso de Warsh em Jackson Hole, enquanto o movimento 'Move Brasil' passou a permitir financiamento de carros em até 84 meses para motoristas de aplicativo e taxistas. Além disso, a Betnacional, alvo de uma operação conjunta da Receita Federal e do MPF, foi listada em Wall Street, com a empresa Flutter Entertainment.", "tecnologia": "A tecnologia continua a impulsionar o desenvolvimento econômico e social em diversos setores. A Suécia, por exemplo, está construindo um dos mais vibrantes ecossistemas de startups na Europa, como destaca Sophia Bendz, da Cherry Ventures, em artigo publicado no TechCrunch. Em outro destaque, a Nvidia, apesar de investir em infraestrutura de inteligência artificial, enfrenta críticas de médicos humanos, conforme relatado no Wired. Esses profissionais questionam se a IA realmente substituirá profissionais médicos em diagnósticos. A China, por outro lado, está usando bots de IA para influenciar opiniões nos Estados Unidos, conforme revelado por uma investigação da Axios. Em um desenvolvimento mais positivo, a Anthropic, empresa por trás do Claude, afirma que não tem intenção de destruir concorrentes, conforme declarado pelo CEO Dario Amodei, em reportagem do Exame. A tecnologia também está se infiltrando na indústria cinematográfica e televisiva, com a inteligência artificial se tornando uma presença cada vez mais forte, conforme relatado pelo Veja. Além disso, a corrida pela IA está ganhando impulso em diversos países, com a Coreia do Sul selecionando empresas para construir serviços de IA gratuitos e a China testando um suplemento que promete rejuvenescer o sangue, conforme noticiado pelo MIT Technology Review.", "ciencia": "Os cientistas conseguiram pela primeira vez capturar imagens com nível molecular da reorganização da água durante uma reação crucial para a vida, um avanço importante para a compreensão da fotossíntese e da conversão biológica de energia. Paralelamente, um deslizamento de gelo em uma seção de geleira nos Himalayas do Nepal pode indicar um novo tipo de risco devido ao aquecimento global. A NASA também reconheceu os astronautas da missão Artemis II com a Medalha do Congresso honorária espacial, em reconhecimento ao seu serviço durante a missão. Além disso, uma mulher italiana recuperou a visão em um de seus olhos após um transplante inédito, onde partes de um olho foram transplantadas para o outro. Este avanço médico oferece novas possibilidades de tratamento para o câncer de mama agressivo, que foi identificado como dependente energéticamente, podendo ser explorado como alvo terapêutico.", "cultura": "A cultura brasileira e internacional teve uma semana repleta de eventos significativos. A gravação inédita dos Beatles, com John Lennon e Paul McCartney, foi divulgada, oferecendo uma visão única do processo criativo dos membros do grupo. Em seguida, o Rock in Rio 2026 anunciou um aumento significativo na segurança, com a presença de 4.500 policiais militares e um centro de monitoramento de drones, reforçando a importância do evento para o país. No cenário cultural, o primeiro romance de Helio Gurovitz, 'Meia-Palavra', explorou temas como o tempo e as contradições humanas, destacando a reflexão sobre a transformação pessoal ao longo do tempo. Além disso, a gravação do The Witcher 3: Songs of the Past, uma expansão do jogo original, foi divulgada, permitindo aos jogadores retornarem ao mundo de The Witcher após uma década. Estes eventos refletem a diversidade e a profundidade da produção cultural em diversos formatos, desde a música até os jogos eletrônicos.", "sociedade": "A população de Taiwan está prevista para diminuir, conforme alerta o conselho do país, conforme relata o Taipei Times. Em outro desenvolvimento, um menino de 10 anos acionou a patrulha Maria da Penha usando emojis para salvar a mãe, após o ex-companheiro invadir a casa, mesmo com medida protetiva em vigor, conforme informa a Veja. Em Montenegro, um relatório do Ministério da Assistência Social revela que mais de metade das vítimas de violência doméstica não buscam ajuda após serem agredidas por seus parceiros, destaca o La Tercera. No Rio de Janeiro, funcionários do metrô ganharam destaque nas redes sociais após serem elogiados por passageiros, levando os seguidores a pedirem um calendário com imagens da equipe, relata o Veja. No Espírito Santo, um homem foi detido após filmar uma dança antes de incendiar um veículo da Polícia Militar e explodir uma viatura, conforme o Metropoles. No Brasil, a presença feminina na magistratura está aumentando, mas a representatividade não se reflete nos tribunais superiores, afirma o ministro Gilmar Mendes, citado pela Veja. A viúva de Silvio Santos, Íris Abravanel, está incluída na lista dos maiores bilionários do Brasil, apesar de acompanhar os negócios do SBT com discrição, de acordo com a Veja. No Chile, o presidente Boric lamentou o falecimento de um carabinero baleado em Renca e enfatizou a urgência em avançar com leis que proporcionem mais ferramentas de segurança e proteção no país, conforme o La Tercera. No Japão, milhares de pessoas ainda estão nos centros de evacuação um mês após o terremoto de Kumamoto, e o governo anunciou um pacote de medidas para apoiar a recuperação, incluindo um programa de desconto para viagens para revitalizar o turismo na região de Kyushu, relata o Japan Times.", "meio_ambiente": "Uma avalanche no Himalaia, na fronteira entre Nepal e Tibete, causou quase 600 mortes e 2 mil desaparecidos, de acordo com relatos do BBC Brasil. A Federação da Cruz Vermelha e do Crescente Vermelho Internacional informou que pelo menos 93.000 pessoas estão em situação de grande necessidade devido às cheias que atingiram a região. Isso resultou em 600 mortes e 1.900 desaparecidos. A situação é agravada pelo temor de novos alagamentos, o que tem dificultado os esforços de resgate. Além disso, um novo lago formado na área está em sobrefluência, levando autoridades a alertar para o risco de mais inundações na fronteira entre Nepal e China. As operações de resgate estão sendo interrompidas devido a temores de rompimento de diques de detritos, enquanto equipes trabalham para salvar pessoas presas em um túnel de usina hidrelétrica em Nepal.", "direitos_humanos": "Um tribunal holandês condenou um homem de 66 anos a prisão perpétua por seu papel no genocídio ruandês de 1994, onde ele impediu tutsis de escapar do estádio e atirou uma granada na multidão. A ONU relatou que 160 mil mulheres e meninas foram afetadas por uma enchente no Nepal, enfrentando riscos maiores de violência, exploração e empobrecimento. Em Gaza, quatro crianças morreram em ataques separados que destruíram suprimentos humanitários e danificaram infraestrutura crítica de água. Um artigo do Intercept Brasil destaca que os ataques de Trump mostram que os direitos humanos não são mais um consenso, com a extrema direita americana abandonando a aparência humanitária para avançar sobre o Brasil. Um advogado em Hong Kong alertou contra a divulgação de informações pessoais de outras pessoas nas redes sociais, a fim de evitar o crime de doxxing, após uma empresa de seguros ter suspendido um funcionário associado a uma briga entre três mulheres em um centro comercial."}, "resumo_do_dia": {"politica_nacional": [{"id": 130222, "titulo": "O que Lula, Hugo Motta e Alcolumbre ganham com a nova aliança", "url": "https://veja.abril.com.br/politica/o-que-lula-hugo-motta-e-alcolumbre-ganham-com-a-nova-alianca/", "fonte_id": "veja", "data_pub": "2026-08-28T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente busca pautas populares para a campanha, enquanto os chefes do Congresso miram seus próprios projetos eleitorais. Esta aliança visa beneficiar os interesses de Lula, Hugo Motta e Alcolumbre em suas respectivas campanhas.", "titulo_pt": "O que Lula, Hugo Motta e Alcolumbre ganham com a nova aliança", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 130019, "titulo": "Governo vai prever superávit efetivo de R$ 18 bi a R$ 20 bi no Orçamento de 2027, diz ministro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-vai-prever-superavit-efetivo-de-r-18-bi-a-r-20-bi-no-orcamento-de-2027-diz-ministro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva pretende incluir um superávit de R$ 18 bilhões a R$ 20 bilhões na proposta de Orçamento para 2027, conforme informou o ministro do Planejamento e Orçamento, Bruno Moretti.", "titulo_pt": "Governo prevê superávit de R$ 18 bi a R$ 20 bi no Orçamento de 2027, diz ministro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130056, "titulo": "Presidente e relator da comissão da 6x1 na Câmara usam fim da escala em jingles de campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/presidente-e-relator-da-comissao-da-6x1-na-camara-usam-fim-da-escala-em-jingles-de-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os deputados que foram presidente e relator da comissão que aprovou o fim da escala 6x1 estão utilizando o tema em seus jingles de campanha. Essa prática tem sido criticada por alguns como um abuso.", "titulo_pt": "Presidente e relator da comissão do fim da escala 6x1 usam tema em jingles de campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 130247, "titulo": "Aécio confirma reviravolta e será candidato ao Senado por Minas", "url": "https://www.metropoles.com/minas-gerais/aecio-confirma-reviravolta-e-sera-candidato-ao-senado-por-minas", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aécio Neves confirmou sua candidatura ao Senado pelo PSDB em Minas Gerais, mesmo após o prazo para registro de candidaturas ter expirado. O partido planeja utilizar uma regra especial da lei para registrar a candidatura de Aécio.", "titulo_pt": "Aécio neves será candidato ao Senado por Minas gerais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129994, "titulo": "Daniel Vorcaro depõe à PF em investigação sobre suspeita de favorecimento ao Banco Master", "url": "https://g1.globo.com/politica/noticia/2026/08/28/daniel-vorcaro-depoe-a-pf-em-investigacao-sobre-relacao-com-servidores-do-banco-central.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal ouviu o ex-banqueiro Daniel Vorcaro em depoimento por videoconferência, no inquérito que investiga supostos favorecimentos do Banco Master a dois servidores do Banco Central suspeitos de receber vantagens indevidas. O depoimento durou quatro horas e meia e foi realizado nesta sexta-feira (28).", "titulo_pt": "Daniel Vorcaro depõe à PF em investigação sobre suspeita de favorecimento ao Banco Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 130251, "titulo": "Tarcísio aparece em 1ª propaganda de aliados ao Senado; Haddad é ausência", "url": "https://www.metropoles.com/sao-paulo/propaganda-eleitoral-senado", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na primeira propaganda de aliados ao Senado, Tarcísio Tebet e Marina Silva tiveram menos tempo de tela que Flávio Bolsonaro e André Derrite devido à regra do TSE.", "titulo_pt": "Tarcísio aparece em 1ª propaganda de aliados ao Senado; Haddad é ausência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130252, "titulo": "TRE-DF aceita candidatura de Leandro Grass, do PT, ao GDF", "url": "https://www.metropoles.com/colunas/grande-angular/tre-df-aceita-candidatura-de-leandro-grass-do-pt-ao-gdf", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRE-DF (Tribunal Regional Eleitoral do Distrito Federal) deferiu a candidatura de Leandro Grass, do PT, ao cargo de governador do Distrito Federal. Até o momento, o TRE-DF já deferiu a candidatura de cinco candidatos ao cargo.", "titulo_pt": "TRE-DF aceita candidatura de Leandro Grass ao GDF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129995, "titulo": "Brasil cria 58,5 mil empregos formais em julho, queda de 56% na comparação com mesmo mês de 2025", "url": "https://g1.globo.com/economia/noticia/2026/08/28/brasil-cria-585-mil-empregos-formais-em-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil criou 58,5 mil empregos formais em julho de 2025, uma queda de 56,3% em comparação com o mesmo mês do ano anterior, quando foram gerados cerca de 133,9 mil empregos. Este foi o pior resultado para o mês de julho em seis anos.", "titulo_pt": "Brasil cria 58,5 mil empregos formais em julho, queda de 56,3% na comparação com julho de 2025", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 130260, "titulo": "Roriz, chupa-cabra e Lula: veja estreia de candidatos ao GDF na TV", "url": "https://www.metropoles.com/colunas/grande-angular/roriz-chupa-cabra-e-lula-veja-estreia-de-candidatos-ao-gdf-na-tv", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro candidatos ao Governo do Distrito Federal tiveram suas propagandas eleitorais transmitidas pela televisão nesta sexta-feira (28/8).", "titulo_pt": "Roriz, chupa-cabra e Lula: veja estreia de candidatos ao GDF na TV", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130057, "titulo": "Bruno Dantas antecipa saída do TCU e abre caminho para Pacheco", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/bruno-dantas-antecipa-saida-do-tcu-e-abre-caminho-para-pacheco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do TCU Bruno Dantas decidiu renunciar ao cargo. A informação foi confirmada pela Folha e pela Veja, e a saída foi antecipada por motivos de idade.", "titulo_pt": "Bruno Dantas antecipa saída do TCU e abre caminho para Pacheco", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 130023, "titulo": "Precisamos ter controle sobre negócios de terras raras, diz relator do PL dos minerais críticos na Câmara", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/precisamos-ter-controle-sobre-negocios-de-terras-raras-diz-relator-do-pl-dos-minerais-criticos-na-camara.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Arnaldo Jardim (Cidadania-SP), relator do projeto de lei sobre minerais críticos na Câmara dos Deputados, defende que o Brasil deve ter algum nível de controle governamental sobre as operações de empresas do setor de terras raras. Ele argumenta que é necessário manter algum grau de controle sobre as operações societárias envolvendo esses recursos.", "titulo_pt": "Relator defende controle governamental sobre empresas de terras raras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130058, "titulo": "Dino diz que 'ultraprotagonismo' do Judiciário não é desejável, mas que STF não pode sair correndo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/dino-diz-que-ultraprotagonismo-do-judiciario-nao-e-desejavel-mas-que-stf-nao-pode-sair-correndo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T16:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, afirmou que o 'ultraprotagonismo' do Judiciário não é desejável, mas que a corte não deve recuar diante de pressões ou deixar de proteger direitos fundamentais.", "titulo_pt": "Dino diz que protagonismo excessivo do Judiciário não é desejável, mas que STF não deve recuar", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 129996, "titulo": "Entrevistas dos candidatos à Presidência da República: veja íntegras", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/28/entrevistas-candidatos-a-presidencia-integra.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram realizadas entrevistas com os seis candidatos à Presidência da República mais bem colocados nas pesquisas, conduzidas por Renata Vasconcellos e César Tralli, no Rio de Janeiro. As entrevistas ocorrem de segunda a sábado e são transmitidas ao vivo pelo g1 e GloboNews.", "titulo_pt": "Entrevistas com os principais candidatos à Presidência: veja íntegras", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 130059, "titulo": "Sem citar Lulinha, Andrei diz que PF atua sem proteger ou perseguir e prega atuação técnica", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/sem-citar-lulinha-andrei-diz-que-pf-atua-sem-proteger-ou-perseguir-e-prega-atuacao-tecnica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor-geral da Polícia Federal, Andrei Rodrigues, afirmou que a corporação atua com autonomia e sem proteger ou perseguir, defendendo uma atuação técnica e livre de viés político.", "titulo_pt": "Andrei afirma que PF atua com autonomia e sem proteger ou perseguir", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 130025, "titulo": "Governo atende Braskem e renova alíquota de importação de resinas de plástico", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-atende-braskem-e-renova-aliquota-de-importacao-de-resinas-de-plastico.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T15:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal concedeu a Braskem a renovação da alíquota do imposto de importação de seis tipos de resinas de plástico. Essa medida visa auxiliar a empresa, que enfrenta dificuldades financeiras.", "titulo_pt": "Governo atende Braskem e renova alíquota de importação de resinas de plástico", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130060, "titulo": "Alerta de insegurança do Waze vira arma de 'guerrilha eleitoral' em Fortaleza", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/alerta-de-inseguranca-do-waze-vira-arma-de-guerrilha-eleitoral-em-fortaleza.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T15:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aplicativo Waze foi usado como ferramenta de 'guerrilha eleitoral' em Fortaleza, com alertas de insegurança sendo exibidos nas ruas. O alerta, que normalmente indica perigo de assalto, foi aproveitado para influenciar a opinião pública durante a campanha eleitoral.", "titulo_pt": "Alerta de insegurança do Waze usado como 'guerrilha eleitoral' em Fortaleza", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 130664, "titulo": "Lega, 'pronta proposta di legge per stop a nuovi insediamenti islamici'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/28/lega-pronta-proposta-di-legge-per-stop-a-nuovi-insediamenti-islamici_7c4dc0ab-b536-4bd5-a04c-0a9f8de5223a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-28T17:53:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Lega apresentou uma proposta de lei para impedir novos insediamentos islamicos. Salvini se dirige em breve a Venezia para reafirmar o não a construção de uma mesquita.", "titulo_pt": "Lega apresenta proposta para frear novos insediamentos islâmicos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 130678, "titulo": "Transgender former Israeli spy detained by ICE in US", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/transgender-former-israeli-spy-detained-ice-us", "fonte_id": "middle_east_eye", "data_pub": "2026-08-28T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma ex-agente de inteligência israelense transgênero foi detida pela ICE nos EUA após ser condenada a prisão. De acordo com a ICE, ela tem antecedentes criminais, incluindo ameaça com arma, cárcere e posse de drogas.", "titulo_pt": "Ex-agente de inteligência transgênero israelense detida pela ICE nos EUA", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 130665, "titulo": "Schlein, Meloni attacca l'opposizione invece di pensare alla gente", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/28/schlein-meloni-attacca-lopposizione-invece-di-pensare-alla-gente_eb6a482e-047b-43d3-a3ea-3e01e2dc1099.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-28T17:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Meloni criticou Bonaccini por suas políticas sobre asilos infantis, afirmando que enquanto ele os fez gratuitos, ela os reduziu.", "titulo_pt": "Meloni critica bonaccini sobre políticas de asilos infantis", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 130132, "titulo": "Ataque israelense mata três na Cisjordânia", "url": "https://www.cnnbrasil.com.br/internacional/ataque-israelense-mata-tres-na-cisjordania/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque israelense resultou em três mortos na Cisjordânia. Israel afirma que o alvo era um operador do Hamas.", "titulo_pt": "Ataque israelense mata três na Cisjordânia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130412, "titulo": "Venezuelan opposition up in arms over reports US wants big stake in oil and gas", "url": "https://www.theguardian.com/world/2026/aug/28/us-venezuela-oil-gas-stake", "fonte_id": "guardian_world", "data_pub": "2026-08-28T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que o governo dos EUA planeja obter um grande interesse na produção de petróleo e gás da Venezuela, o que gerou críticas de que a ação é predatória e anti-constitucional. O movimento é visto com desconfiança devido à longa intervenção dos EUA na Venezuela, incluindo a abdução do presidente Nicolás Maduro em janeiro.", "titulo_pt": "Oposição venezuelana se opõe a relatos de que EUA quer grande participação nos recursos energéticos do país", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 130138, "titulo": "Dificuldades na guerra podem levar Rússia a agir contra Otan, dizem fontes", "url": "https://www.cnnbrasil.com.br/internacional/dificuldades-na-guerra-podem-levar-russia-a-agir-contra-otan-dizem-fontes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fontes indicam que a Rússia pode tomar medidas contra a Otan devido às dificuldades enfrentadas na guerra na Ucrânia. O objetivo seria aumentar os custos do apoio à Ucrânia e pressionar por um acordo negociado a favor de Moscou.", "titulo_pt": "Dificuldades na guerra podem levar Rússia a agir contra Otan, dizem fontes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130526, "titulo": "Satellite images reveal scale of flood devastation in Nepal villages", "url": "https://www.bbc.co.uk/news/articles/cd68vpjv21do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-28T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens de satélite mostram a escala da destruição causada pelas cheias em vilas de Nepal, incluindo aldeias, pontes e um importante cruzamento fronteiriço entre Nepal e Tibet.", "titulo_pt": "Imagens de satélite revelam a escala da devastação das cheias em vilas de Nepal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 130520, "titulo": "Thieves steal 600-diamond necklace from Vienna museum in broad daylight", "url": "https://www.bbc.co.uk/news/articles/cqxvwpe0plro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-28T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ladrões roubaram uma joalheria com 600 diamantes de um museu emViena durante o dia. A polícia está buscando dois suspeitos que acreditam ter comprado ingressos para a exposição para ter acesso à joalheria.", "titulo_pt": "Ladrões roubam joalheria com 600 diamantes de museu em viena durante o dia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 130555, "titulo": "Trump loses longshot bid to erase hush money conviction", "url": "https://www.axios.com/2026/08/28/trump-hush-money-conviction-appeal", "fonte_id": "axios", "data_pub": "2026-08-28T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal negou mais uma vez a solicitação do presidente Trump para anular sua condenação por hush money. O juiz argumentou que as argumentações do presidente eram 'neutras e insuficientes do ponto de vista legal'.", "titulo_pt": "Trump perde tentativa desesperada de anular condenação por hush money", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 130385, "titulo": "Mourners in Norway Remember King Harald V", "url": "https://www.nytimes.com/2026/08/28/world/europe/king-harald-norway-death.html", "fonte_id": "nyt_world", "data_pub": "2026-08-28T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Noruegueses lamentaram um monarca que permaneceu popular apesar de escândalos envolvendo a família real. A morte do rei Harald V marca o início de uma nova era para o país.", "titulo_pt": "Mournares na noruega lembram o rei Harald V", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 130647, "titulo": "Trump loses bid to challenge hush-money conviction in federal court", "url": "https://www.ft.com/content/14564843-5960-44c6-8683-944422c042a4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz de Nova York rejeitou os argumentos do presidente Trump contra sua condenação por crime de silenciamento, afirmando que as alegações não eram novas e não tinham base legal suficiente.", "titulo_pt": "Trump perde tentativa de desafiar condenação por crime de silenciamento em tribunal federal", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 130832, "titulo": "President Trump Signs Executive Order to Create US Space Academy", "url": "https://www.nasa.gov/news-release/president-trump-signs-executive-order-to-create-us-space-academy/", "fonte_id": "nasa_news", "data_pub": "2026-08-28T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald J. Trump assinou um Decreto Executivo para criar a primeira Academia Espacial dos Estados Unidos com o objetivo de fortalecer a força de trabalho espacial e desenvolver líderes do futuro. O decreto destaca a importância do espaço para a segurança nacional, crescimento econômico, descobertas científicas e inovação tecnológica dos Estados Unidos.", "titulo_pt": "Presidente Trump assina decreto para criar academia espacial dos EUA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 130679, "titulo": "Unifil records 1,030 projectile launches in south Lebanon in a week", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/unifil-records-1030-projectile-launches-south-lebanon-week", "fonte_id": "middle_east_eye", "data_pub": "2026-08-28T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A força de paz Unifil registrou 1.030 lançamentos de projéteis no sul do Líbano em uma semana. Embora os níveis de violência tenham diminuído em comparação com o início do ano, a situação no sul do Líbano continua frágil, segundo a Unifil.", "titulo_pt": "Unifil registra 1.030 lançamentos de projéteis no sul do líbano em uma semana", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 130666, "titulo": "Cyberattacco contro tre aeroporti in Gb, 'hacker hanno chiesto riscatto'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/28/cyberattacco-contro-tre-aeroporti-in-gb-hacker-hanno-chiesto-riscatto_be0ab49d-bc4f-4974-a415-da4cbcb11ac6.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-28T17:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um ataque cibernético afetou três aeroportos no Reino Unido. Os hackers exigiram um resgate. As autoridades conhecem o grupo criminoso responsável.", "titulo_pt": "Ataque cibernético contra três aeroportos no reino unido; hackers exigem resgate", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 130419, "titulo": "Russia ‘losing 6,000 more troops in Ukraine each month than it can recruit’", "url": "https://www.theguardian.com/world/2026/aug/28/russia-losing-6000-more-troops-than-it-can-recruit-each-month-in-ukraine-says-west", "fonte_id": "guardian_world", "data_pub": "2026-08-28T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo oficiais ocidentais, a Rússia está perdendo aproximadamente 6.000 soldados por mês na Ucrânia, enquanto consegue recrutar apenas cerca de 1.000 por dia. Essa diferença está se agravando, mesmo com o ritmo de recrutamento de novos soldados mantido.", "titulo_pt": "Rússia perde cerca de 6.000 soldados por mês na Ucrânia, dizem oficiais ocidentais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 130590, "titulo": "Trump’s restrictions on mail-in voting stall in the courts", "url": "https://english.elpais.com/usa/2026-08-28/trumps-restrictions-on-mail-in-voting-stall-in-the-courts.html", "fonte_id": "elpais_en", "data_pub": "2026-08-28T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo julgamento judicial colocou em pausa a decretação, que beneficiaria o presidente nas eleições de meios-períodos, por duas semanas.", "titulo_pt": "Decretação sobre votos por correspondência de trump fica em suspenso", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 130100, "titulo": "Governo sanciona lei que permite reduzir tributos sobre combustíveis", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/governo-sanciona-lei-que-permite-reduzir-tributos-sobre-combustiveis", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-28T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidência da República sancionou a Lei Complementar nº 235 de 2026, que permite a redução de alíquotas de tributos sobre combustíveis. A lei foi aprovada pelo Senado após passar pela Câmara dos Deputados e visa aliviar os impactos econômicos decorrentes do conflito no Oriente Médio.", "titulo_pt": "Governo sanciona lei que permite reduzir tributos sobre combustíveis", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 130594, "titulo": "Analysis: Kevin Warsh sharpens inflation warning at Jackson Hole, signaling possible rate hike", "url": "https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-fed-inflation-rate-hike.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-28T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Federal Reserve, Kevin Warsh, utilizou a conferência de Jackson Hole para esclarecer o argumento a favor de aumentos de taxas de juros após confundir o mercado em sua conferência de julho.", "titulo_pt": "Análise: kevin Warsh intensifica alerta sobre inflação em Jackson Hole, sinalizando possível elevação de taxas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 130020, "titulo": "Forbes divulga lista dos 255 bilionários brasileiros; veja os dez maiores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/forbes-divulga-lista-dos-255-bilionarios-brasileiros-veja-os-dez-maiores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A revista Forbes Brasil divulgou a 13ª edição da lista de bilionários brasileiros, contendo 255 nomes, com um patrimônio total de R$ 1,86 trilhão (considerando homens e mulheres). A lista inclui 205 homens e 50 mulheres.", "titulo_pt": "Forbes Brasil divulga lista dos 255 bilionários brasileiros; veja os dez maiores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130646, "titulo": "US manufacturing is booming — but it’s no thanks to Trump’s tariffs", "url": "https://www.ft.com/content/b625e314-ecf9-4385-a687-7a8f8c1bec23?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria manufatureira dos Estados Unidos está em expansão, mas isso não é graças às tarifas impostas pelo presidente Trump.", "titulo_pt": "A produção industrial nos EUA está crescendo — mas não graças às tarifas de Trump", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 130021, "titulo": "Empresas brasileira e chinesa assinam memorando para nacionalizar armazenamento de energia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/empresas-brasileira-e-chinesa-assinam-memorando-para-nacionalizar-armazenamento-de-energia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A UCB Power e a Jinko ESS, uma subsidiária brasileira da JinkoSolar, empresa chinesa de armazenamento de energia, assinaram um memorando de entendimento para a nacionalização de sistemas de armazenamento de energia (SAE).", "titulo_pt": "Empresas brasileira e chinesa assinam memorando para nacionalizar armazenamento de energia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130641, "titulo": "Hawkish Warsh hints Fed will raise rates if inflation does not fall soon", "url": "https://www.ft.com/content/d15851dc-9177-4bfe-9039-8d9994a2e4b3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Federal Reserve, Jerome Powell, sinalizou em seu discurso no Fórum de Jackson Hole que a instituição pode aumentar as taxas de juros em setembro se a inflação não diminuir em breve. Isso levou os investidores a intensificarem suas apostas por um aumento das taxas em setembro.", "titulo_pt": "Powell dá sinais de aumento das taxas de juros em setembro se inflação não baixar", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 130022, "titulo": "Venezuela avalia deixar Opep e amplia dúvidas sobre grupo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/venezuela-avalia-deixar-opep-e-amplia-duvidas-sobre-grupo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Venezuela está avaliando a possibilidade de deixar a Organização dos Países Exportadores de Petróleo (Opep), o que amplia as dúvidas sobre o futuro do grupo. O país, membro fundador, é o segundo a considerar uma saída em meses, o que reflete o enfraquecimento do domínio da Opep no mercado global de petróleo.", "titulo_pt": "Venezuela considera saída da Opep e aumenta incertezas sobre grupo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130643, "titulo": "Read: Warsh’s Jackson Hole address in full", "url": "https://d1e00ek4ebabms.cloudfront.net/production/uploaded-files/warsh20260828a-368f962a-6c63-42b1-906c-5f65f27d83d6.pdf?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O discurso completo de Warsh em Jackson Hole foi lido. O discurso abordou questões econômicas relevantes para a economia americana.", "titulo_pt": "Leia: discurso completo de warsh em Jackson Hole", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 130642, "titulo": "Warsh settles some nerves at Jackson Hole", "url": "https://www.ft.com/content/646b812e-c9de-49ba-90f3-f9d12205f876?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O discurso de Warsh no Fórum de Jackson Hole ofereceu uma visão mais clara sobre como ele interpreta a economia, mas deixou dúvidas sobre a função de reação da Reserva Federal.", "titulo_pt": "Warsh calma alguns nervos no fórum de Jackson Hole", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 130286, "titulo": "Estratégia também se constrói olhando para o ambiente institucional", "url": "https://www.jota.info/opiniao-e-analise/artigos/estrategia-tambem-se-constroi-olhando-para-o-ambiente-institucional", "fonte_id": "jota", "data_pub": "2026-08-28T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O planejamento estratégico não remove as incertezas, mas aumenta a capacidade de gerenciá-las. Estratégia também se constrói considerando o ambiente institucional.", "titulo_pt": "Estratégia também se constrói considerando o ambiente institucional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 130287, "titulo": "EPI não é acessório: por que proteção respiratória deve ser tratada como decisão técnica", "url": "https://www.jota.info/opiniao-e-analise/artigos/epi-nao-e-acessorio-por-que-protecao-respiratoria-deve-ser-tratada-como-decisao-tecnica", "fonte_id": "jota", "data_pub": "2026-08-28T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A utilização adequada de Equipamentos de Proteção Individual (EPI) é crucial para a saúde dos trabalhadores, a produtividade das empresas e a competitividade do país.", "titulo_pt": "EPI não é acessório: por que a proteção respiratória deve ser vista como uma decisão técnica", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 130026, "titulo": "Dono da Centauro prorroga acordo para distribuir produtos da Nike no Brasil até 2034", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/dono-da-centauro-prorroga-acordo-para-distribuir-produtos-da-nike-no-brasil-ate-2034.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo SBF, proprietário da rede de lojas Centauro, prorrogou o acordo de distribuição de produt
