ra pessoas que se aposentam precocemente. O estudo examinou a relação entre a idade de aposentadoria e o risco de desenvolver demência.", "titulo_pt": "Risco maior de demência para quem se aposenta precocemente, pesquisa indica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 182819, "titulo": "Engineers teach spacecraft to 'dream' their way to the space station", "url": "https://phys.org/news/2026-09-spacecraft-space-station.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os engenheiros ensinaram as naves espaciais a 'sonhar' como parte do processo de atracação com a Estação Espacial Internacional (ISS). A manobra é complexa, comparável a estacionar paralelamente em um garagão aberto em uma estrada a 28.000 km/h, sem a resistência do ar para frear naturalmente, e com o risco de destruição total se ocorrerem erros.", "titulo_pt": "Engenheiros ensinam naves espaciais a 'sonhar' para se aproximarem da estação espacial internacional", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182458, "titulo": "Placa tectônica está se rompendo no fundo do Oceano Pacífico e pode gerar terremotos, mas apenas em milhões de anos", "url": "https://www.cnnbrasil.com.br/ciencia/placa-tectonica-esta-se-rompendo-no-fundo-do-oceano-pacifico-e-pode-gerar-terremotos-mas-apenas-em-milhoes-de-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma placa tectônica no fundo do Oceano Pacífico está registrando tremores enquanto outras áreas permanecem estáveis, indicando que a estrutura oceânica está se rompendo. Este processo pode levar a terremotos em milhões de anos.", "titulo_pt": "Placa tectônica está se rompendo no fundo do Oceano Pacífico e pode gerar terremotos em milhões de anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 182528, "titulo": "Tenía 10 años y entrenó orugas para evitar un olor: lo que ocurrió cuando se convirtieron en mariposas sorprendió a los científicos", "url": "https://www.clarin.com/estados-unidos/10-anos-entreno-orugas-evitar-olor-ocurrio-convirtieron-mariposas-sorprendio-cientificos_0_XGKbGaktsV.html", "fonte_id": "clarin", "data_pub": "2026-09-26T17:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jo Nagai realizou um experimento com mariposas cola de golondrina e constatou que cerca de 70% das larvas mantinham uma aversão aprendida antes da metamorfose. O fenômeno já havia sido observado em polillas.", "titulo_pt": "Tenha 10 anos e treine orugas para evitar um odor: o que aconteceu quando se tornaram borboletas surpreendeu os cientistas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 182820, "titulo": "Sparse layers of 10-nanometer silver particles boost CO production from CO₂", "url": "https://phys.org/news/2026-09-sparse-layers-nanometer-silver-particles.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eletrólise pode converter CO2 em CO, um precursor para produtos químicos como combustíveis. Um grupo internacional de cientistas, liderado pelo químico Prashanth Menezes do HZB, estudou camadas de nanopartículas de prata com 10 nanômetros de espessura, variando o tamanho e a densidade das nanopartículas como catalisadores.", "titulo_pt": "Camadas esparsas de nanopartículas de prata de 10 nanômetros aumentam a produção de CO a partir de co2", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182821, "titulo": "A real-time look inside spacecraft heat shields during extreme heat conditions", "url": "https://phys.org/news/2026-09-real-spacecraft-shields-extreme-conditions.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante a reentrada da atmosfera terrestre a alta velocidade, a blindagem térmica dos foguetes enfrenta temperaturas superiores a 3.000 graus Fahrenheit (1.650 graus Celsius). Para sobreviver, a blindagem utiliza materiais especializados que absorvem calor ao se degradarem, um processo chamado ablação, que sacrifica as camadas externas para proteger o veículo e a tripulação.", "titulo_pt": "Visão em tempo real da blindagem térmica de foguetes durante condições extremas de calor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182834, "titulo": "A major risk of breast cancer screening may have been overestimated for decades", "url": "https://www.sciencedaily.com/releases/2026/09/260924020351.htm", "fonte_id": "science_daily", "data_pub": "2026-09-26T15:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova análise sugere que mamografias podem levar a um baixo risco de sobre-diagnóstico de câncer de mama, com uma taxa abaixo de 5%, em vez de estimativas que chegavam a 30% a 50%. Os pesquisadores reavaliaram os oito principais ensaios randomizados de rastreamento e consideraram diferenças no tempo de acompanhamento, frequência de rastreamento e rastreamento após a conclusão dos ensaios.", "titulo_pt": "O risco de sobre-diagnóstico no rastreamento do câncer de mama pode ter sido sobreestimado por décadas", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 182822, "titulo": "Crop protection: A new method for understanding insect sexual communication", "url": "https://phys.org/news/2026-09-crop-method-insect-sexual-communication.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da INRAE, em colaboração com a Université Côte d'Azur e a Nanjing Agricultural University na China, utilizaram uma metodologia inovadora baseada em inteligência artificial para identificar o feromônio sexual da lagarta da lisínea e os receptores olfativos associados a ele. Este método pode abrir novas possibilidades para a identificação de feromônios em outras espécies, sendo cruciais para certas estratégias de controle biológico utilizadas na proteção de cultivos, especialmente na França.", "titulo_pt": "Protetor de cultivos: novo método para entender a comunicação sexual de insetos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182827, "titulo": "That fresh cleaning smell could be filling your home with nanoparticles", "url": "https://www.sciencedaily.com/releases/2026/09/260925093152.htm", "fonte_id": "science_daily", "data_pub": "2026-09-26T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram que limpa-ambientes perfumados podem reagir com ozônio indoor para criar bilhões ou trilhões de nanopartículas invisíveis que podem penetrar profundamente nos pulmões. A poluição é formada em minutos e, em alguns casos, pode produzir uma dose de partículas inaladas equivalente ou maior que a exposta a tráfego pesado.", "titulo_pt": "Essa fragrância de limpeza fresca pode estar enchendo sua casa com nanopartículas", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 182826, "titulo": "Scientists may have misread a 2-billion-year-old clue about Earth", "url": "https://www.sciencedaily.com/releases/2026/09/260925093201.htm", "fonte_id": "science_daily", "data_pub": "2026-09-26T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que uma marca química famosa de 2 bilhões de anos, anteriormente considerada como registro de um grande mudança no ciclo de carbono da Terra, pode ter sido produzida por magma local, hidrocarbonetos e microorganismos que comiam metano. Essa descoberta levanta novas perguntas sobre o que realmente aconteceu enquanto o oxigênio transformava o planeta jovem.", "titulo_pt": "Cientistas podem ter mal interpretado sinal químico de 2 bilhões de anos sobre a terra", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 182314, "titulo": "Lêmures podem ajustar entonação de cantos semelhante a cantores sopranos, sugere estudo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/lemures-podem-ajustar-entonacao-de-cantos-semelhante-a-cantores-sopranos-sugere-estudo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-26T14:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa recente sugere que lêmures cantores, ou indris, podem ajustar a entonação de seus cantos de forma semelhante a cantores sopranos, utilizando mudanças sutis no formato da boca e da garganta para alcançar notas agudas no alto da copa da floresta tropical de Madagascar.", "titulo_pt": "Lêmures podem ajustar entonação de cantos semelhante a cantores sopranos, sugere estudo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 182830, "titulo": "Scientists burned their own scrolls to unlock a 2,000-year-old mystery", "url": "https://www.sciencedaily.com/releases/2026/09/260925005414.htm", "fonte_id": "science_daily", "data_pub": "2026-09-26T14:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ciêntíficos descobriram que pequenas quantidades de chumbo em tinta antiga podem destacar a escrita dentro de rolhas de papiro queimadas em exames de raio-X. A técnica pode ajudar a decifrar textos gregos e romanos perdidos preservados pela erupção do Vesúvio há quase 2.000 anos.", "titulo_pt": "Cientistas queimaram seus próprios rolhos para desvendar um mistério de 2.000 anos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 182315, "titulo": "Quem propaga certezas não é cientista", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/viniciusmota/2026/09/quem-propaga-certezas-nao-e-cientista.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-26T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Princípio Fundamental da Dinâmica estabelece que a variação da velocidade de um corpo é influenciada pela força aplicada e pela massa do corpo. Isaac Newton desenvolveu o cálculo diferencial e a integração para estudar essas variações instantâneas no século 17.", "titulo_pt": "Quem propaga certezas não é cientista", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 182417, "titulo": "Descoberta do Hubble pode explicar galáxias 'estranhas' vistas pelo James Webb", "url": "https://exame.com/ciencia/descoberta-do-hubble-pode-explicar-galaxias-estranhas-vistas-pelo-james-webb/", "fonte_id": "exame", "data_pub": "2026-09-26T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estrelas massivas foram observadas em galáxias anãs, oferecendo novas informações sobre o Universo primitivo. Essas observações podem explicar galáxias 'estranhas' vistas pelo telescópio James Webb.", "titulo_pt": "Descoberta do Hubble pode explicar galáxias 'estranhas' vistas pelo James Webb", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 182835, "titulo": "How a horse flu crisis fueled animals rights advocacy in the U.S.", "url": "https://www.scientificamerican.com/article/how-a-horse-flu-crisis-fueled-animals-rights-advocacy-in-the-u-s/", "fonte_id": "scientific_american", "data_pub": "2026-09-26T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1872, uma epidemia letal em cavalos na Nova York forneceu ao jovem fundador da APA (American Society for the Prevention of Cruelty to Animals) um argumento moral poderoso a favor da proteção dos animais.", "titulo_pt": "Como uma crise de gripe equina na américa do norte impulsionou a advocacy pelos direitos dos animais nos estados unidos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 182829, "titulo": "Quantum computer simulates matter “popping into existence”", "url": "https://www.sciencedaily.com/releases/2026/09/260925005416.htm", "fonte_id": "science_daily", "data_pub": "2026-09-26T13:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas usaram um simulador quântico com 13 íons para recriar um processo de formação de partículas relacionado à física extremada do universo primitivo. Esse avanço indica que computadores quânticos poderiam eventualmente auxiliar na investigação do surgimento e evolução da matéria após o Big Bang.", "titulo_pt": "Computador quântico simula a formação de partículas 'aparecendo do nada'", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 182789, "titulo": "Helping hands", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/27/2003864975", "fonte_id": "taipei_times", "data_pub": "2026-09-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto fala sobre ajuda mútua, mas não fornece detalhes adicionais. Não há informações específicas sobre o contexto ou o conteúdo do trecho original.", "titulo_pt": "Mãos ajudadoras", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 182791, "titulo": "Rescued worker ready to help rebuild Nepal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/27/2003864942", "fonte_id": "taipei_times", "data_pub": "2026-09-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O trabalhador resgatado está pronto para ajudar no processo de reconstrução de Nepal.", "titulo_pt": "Trabalhador resgatado pronto para ajudar na reconstrução de Nepal", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 182797, "titulo": "EDITORIAL CARTOON", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/09/27/2003864948", "fonte_id": "taipei_times", "data_pub": "2026-09-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O editorial cartoon é uma forma de expressão gráfica utilizada para comentar ou criticar assuntos do momento. Este trecho não fornece conteúdo específico para resumo, apenas o tipo de conteúdo.", "t ": "es", "provavel_duplicata_de": null, "texto_pt": "Miguel Varoni nasceu na Argentina e teve seu pai falecido quando tinha apenas 4 meses de idade. Agora, ele se tornou um dos artistas mais populares na televisão colombiana.", "titulo_pt": "Nasceu na Argentina, seu pai morreu aos 4 meses e agora é um dos artistas mais queridos na colômbia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 182348, "titulo": "Caderno de Música aborda relação entre Beethoven e Napoleão", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/caderno-de-musica-aborda-relacao-entre-beethoven-e-napoleao", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-26T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rádio MEC transmite em 27 de outubro, às 12h30, uma edição do programa Caderno de Música que explora a relação entre Beethoven e Napoleão Bonaparte. A série Música e História visa conectar grandes obras musicais com eventos históricos.", "titulo_pt": "Caderno de Música aborda relação entre Beethoven e Napoleão", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 182551, "titulo": "Cuáles son los cinco lugares del mundo donde la gente vive más y qué hacen para conseguirlo", "url": "https://www.lanacion.com.ar/sociedad/cuales-son-los-cinco-lugares-del-mundo-donde-la-gente-vive-mas-y-que-hacen-para-conseguirlo-nid26092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-26T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jorge Tartaglione, cardiologista, explicou em LN+ como alcançar uma velhice saudável, enfatizando a importância de manter uma mentalidade positiva e o impacto do ambiente.", "titulo_pt": "Quais são os cinco lugares do mundo onde as pessoas vivem mais e o que fazem para conseguir isso", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 182665, "titulo": "How Paris, New York and Tokyo are all moving away from car-centric urban planning", "url": "https://www.lemonde.fr/en/economy/article/2026/09/26/how-paris-new-york-and-tokyo-are-all-moving-away-from-car-centric-urban-planning_6757988_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo apresentado em 9 de setembro pelo Workshop de Planejamento Urbano de Paris analisou como os moradores de sete grandes cidades têm se locomovido nas últimas duas décadas. Houve uma transformação significativa no uso do espaço público, com os residentes caminhando, pedalando e utilizando o transporte público com mais frequência.", "titulo_pt": "Como Paris, nova York e tóquio estão mudando do planejamento urbano centrado no carro", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 182837, "titulo": "Rockwell Group eschews 90-degree angles for Skywalker Grill at Lucas Museum", "url": "https://www.dezeen.com/2026/09/26/skywalker-grill-lucas-museum-narrative-art-los-angeles-rockwell-group/", "fonte_id": "dezeen", "data_pub": "2026-09-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Rockwell Group projetou o Skywalker Grill no Lucas Museum of Narrative Art sem usar ângulos retos, seguindo a arquitetura biomórfica do edifício. O projeto inclui um restaurante e um bar que se integram com a arquitetura curvilínea do museu.", "titulo_pt": "Rockwell Group dispensa ângulos retos para Skywalker Grill no museu Lucas", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 182839, "titulo": "How Taylor Swift’s ‘Patient Zero’ Music Video Will (and Will Not) Impact Her Oscar Chances", "url": "https://www.indiewire.com/awards/industry/taylor-swift-patient-zero-oscar-chances-1235218787/", "fonte_id": "indiewire", "data_pub": "2026-09-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O último vídeo musical de Taylor Swift inclui um ator recentemente indicado para o prêm 8, "titulo": "Centenas de milhares em Paris saúdam papa Leão no maior evento de sua viagem à França", "url": "https://www.infomoney.com.br/mundo/centenas-de-milhares-em-paris-saudam-papa-leao-no-maior-evento-de-sua-viagem-a-franca/", "fonte_id": "infomoney", "data_pub": "2026-09-26T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missa ao ar livre em Paris reuniu aproximadamente 800 mil pessoas, sendo o maior evento da viagem do Papa Leão à França.", "titulo_pt": "Centenas de milhares em Paris saúdam papa Leão no maior evento de sua viagem à França", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 182337, "titulo": "'Coração Selvagem' filma o entendimento pleno entre homem e cachorro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/coracao-selvagem-filma-o-entendimento-pleno-entre-homem-e-cachorro.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-26T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Coração Selvagem' conta a história de um subtenente solitário, interpretado por Brad Pitt, que passa a viver no Alasca após perder seus companheiros em uma emboscada durante a guerra. A trama explora o relacionamento entre o homem e a natureza.", "titulo_pt": "Coração Selvagem: filme explora a conexão entre homem e cachorro", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 182625, "titulo": "Pope Leo celebrates open-air mass before 700,000 people in Paris", "url": "https://www.theguardian.com/world/2026/sep/26/pope-leo-celebrates-open-air-mass-before-700000-people-in-paris", "fonte_id": "guardian_world", "data_pub": "2026-09-26T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O papa Leo celebrou uma missa ao ar livre em Paris diante de cerca de 700 mil pessoas durante o segundo dia de sua primeira visita oficial à França em 18 anos. A multidão se concentrou na Place llones_0_E5RjeD82Il.html", "fonte_id": "clarin", "data_pub": "2026-09-26T16:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A crise da obra social dos militares persiste sem solução, com uma dívida que atingiu 500 bilhões de pesos. Há pedidos de informes ao ministro de Defesa sobre o assunto. A obra social começou a apresentar déficit a partir de 2024.", "titulo_pt": "Alegam que a crise da obra social dos militares continua sem solução e a dívida chegou a 500 bilhões", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 182588, "titulo": "Corte Suprema envía a la Cámara de Diputados informe sobre proyecto por medidas de seguridad para NNA en el deporte", "url": "https://www.latercera.com/nacional/noticia/corte-suprema-envia-a-la-camara-de-diputados-informe-sobre-proyecto-por-medidas-de-seguridad-para-nna-en-el-deporte/", "fonte_id": "la_tercera", "data_pub": "2026-09-26T15:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema enviou um informe à Cámara de Diputados sobre um projeto de lei que visa implementar medidas de segurança para não-naturais no esporte, destacando que a proposta apresenta deficiências que afetam a certeza e aplicação da norma.", "titulo_pt": "Corte Suprema envia relatório à câmara sobre segurança para não-naturais no esporte", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 182591, "titulo": "Poder Judicial capacita a adultos mayores en Ñuble para evitar fraudes bancarios ante aumento de casos", "url": "https://www.latercera.com/politica/noticia/poder-judicial-capacita-a-adultos-mayores-en-nuble-para-evitar-fraudes-bancarios-ante-aumento-de-casos/", "fonte_id": "la_tercera", "data_pub": "2026-09-26T15:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A presidenta da Corte de Apelaciones de Chillán, Paulina Gallardo, enfatizou a importância da capacitação de adultos maiores para evitar fraudes bancárias, uma vez que os casos têm aumentado. Ela d tureza que virou ativo nos imóveis de alto padrão", "url": "https://veja.abril.com.br/economia/a-natureza-que-virou-ativo-nos-imoveis-de-alto-padrao/", "fonte_id": "veja", "data_pub": "2026-09-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imóveis de alto padrão estão incluindo pequenas florestas no projeto arquitetônico para reduzir o calor, absorver a água das chuvas e tornar as cidades mais agradáveis para se viver.", "titulo_pt": "A natureza que se tornou ativo nos imóveis de alto padrão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 181683, "titulo": "Super El Niño e ondas de calor aumentam risco de encontros com serpentes; especialista ensina como reagir", "url": "https://www.cnnbrasil.com.br/ciencia/super-el-nino-e-ondas-de-calor-aumentam-risco-de-encontros-com-serpentes-especialista-ensina-como-reagir/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eventos climáticos extremos, como o Super El Niño, aumentam o risco de encontros com serpentes em áreas urbanas e rurais devido às mudanças no habitat dos animais. O calor intensificado também contribui para essa situação.", "titulo_pt": "Super El Niño e ondas de calor aumentam risco de encontros com serpentes; especialista ensina como reagir", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 182015, "titulo": "Climate rallies to be held across France on Saturday after record-breaking summer", "url": "https://www.lemonde.fr/en/environment/article/2026/09/26/climate-rallies-to-be-held-across-france-on-saturday-after-record-breaking-summer_6757975_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-26T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 260 manifestações estão programadas para todo o país no sábado, pedindo um plano de ação climática de emergência. Inicialmente organizadas por ativistas ambientais, essas protestos agora contam com             <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
