ml", "fonte_id": "ansa_italy", "data_pub": "2026-10-08T20:59:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Pentágono estaria elaborando novos planos de ataque contra o Irã, com opções para uma operação de três dias que envolveria porta-aviões.", "titulo_pt": "Novos planos de ataque do pentágono contra o Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 204130, "titulo": "El Gobierno de Milei privatiza el servicio de agua de Buenos Aires 20 años después de su reestatización", "url": "https://elpais.com/argentina/2026-10-08/el-gobierno-de-milei-privatiza-el-servicio-de-agua-de-buenos-aires-20-anos-despues-de-su-reestatizacion.html", "fonte_id": "elpais_america", "data_pub": "2026-10-08T20:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo de Milei privatizou 90% das ações da Aysa, empresa de água de Buenos Aires, por 340 milhões de dólares. O vendedor são um grupo de empresários argentinos, brasileiros e holandeses.", "titulo_pt": "Governo de Milei privatiza serviço de água de Buenos Aires 20 anos após reestatização", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 203844, "titulo": "Polícia do Reino Unido admite ilegalidade em buscas contra o ex-príncipe Andrew", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/policia-do-reino-unido-admite-ilegalidade-em-buscas-contra-o-ex-principe-andrew.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-08T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia do Reino Unido admitiu que os mandados de busca para revistar imóveis ligados a Andrew Mountbatten-Windsor foram emitidos de forma ilegal e devem ser anulados. A investigação sobre o irmão mais novo do rei Charles 3º continua em andamento.", "titulo_pt": "Polícia do Reino Unido confirma ilegalidade em buscas contra ex-príncipe Andrew", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 204282, "titulo": "Black sea and black ops: How exposed is Europe to Ukraine war spillover?", "url": "https://www.france24.com/en/tv-shows/the-debate/20261008-black-sea-and-black-ops-how-exposed-is-europe-to-ukraine-war-spillover", "fonte_id": "france24", "data_pub": "2026-10-08T20:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três navios de carga turcos, que saíam da Ucrânia, foram atingidos por drones suspeitos de serem russos em águas da União Europeia. Um dos navios, o Alfa Watan, afundou na Bulgária com dez tripulantes desaparecidos. A Ucrânia tem atingido navios-tanque russos no Mar Negro, sem sinais de um retorno ao acordo das Nações Unidas para permitir o passagem de navios com grãos, óleo e fertilizantes.", "titulo_pt": "Mar negro e operações ocultas: quão exposta está a Europa ao espalhamento da guerra na Ucrânia?", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 203582, "titulo": "First batch of cash handouts could arrive on Jan. 26", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/09/2003865652", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira parcela de pagamentos em dinheiro pode chegar em 26 de janeiro. Não há informações adicionais sobre o valor ou a origem desses pagamentos.", "titulo_pt": "Primeira parcela de pagamentos em dinheiro pode chegar em 26 de janeiro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 203603, "titulo": "TSMC quarterly revenue surges to NT$1.49 trillion", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/09/2003865635", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A receita trimestral da TSMC atingiu NT$1,49 trilhão. Este é o maior resultado trimestral da empresa até o momento.", "titulo_pt": "Receita trimestral da TSMC surge para NT$1,49 trilhão", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 204297, "titulo": "Nvidia, Oracle, CoreWeave and other AI stocks sink on OpenAI revenue report", "url": "https://www.cnbc.com/2026/10/08/open-ai-revenue-nvidia-oracle-coreweave.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de empresas como Nvidia, Oracle e CoreWeave caíram após a divulgação do relatório de receita da OpenAI, que informou ter atingido aproximadamente $50 bilhões em receita anualizada no final de setembro.", "titulo_pt": "Nvidia, Oracle, CoreWeave e outras ações de IA caem após relatório de receita da OpenAI", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 203836, "titulo": "O debate sobre a reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/braulio-borges/2026/10/o-debate-sobre-a-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária do consumo voltou a ser tema nas campanhas políticas, com Flávio Bolsonaro, candidato do PL, anunciando a intenção de acabar com o split payment, sob o argumento de que o mecanismo prejudica o capital de giro do pequeno empresário. A campanha tem oscilado nas propostas relacionadas à reforma, com sugestões de revogação, suspensão e aprimoramento do texto desde o primeiro semestre.", "titulo_pt": "Debate sobre reforma tributária volta à cena nas campanhas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204298, "titulo": "Why a Starbucks takeover of Chipotle would — and wouldn't — make sense for both companies", "url": "https://www.cnbc.com/2026/10/08/starbucks-chipotle-acquisition.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há relatos de que a Starbucks tem trabalhado com conselheiros para uma proposta de aquisição da Chipotle, mas uma possível transação apresenta vantagens e desvantagens para os investidores.", "titulo_pt": "Por que uma aquisição da Starbucks pela Chipotle faria — e não faria — sentido para ambas as empresas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 204090, "titulo": "ANS abre consulta pública sobre inclusão no Rol de medicamento contra o câncer", "url": "https://www.jota.info/saude/ans-abre-consulta-publica-sobre-inclusao-no-rol-de-medicamento-contra-o-cancer", "fonte_id": "jota", "data_pub": "2026-10-08T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Saúde Suplementar (ANS) está realizando uma consulta pública sobre a inclusão do medicamento cabozantinibe no Rol de Benefícios para o tratamento de tumores neuroendócrinos. A área técnica da ANS deu um parecer desfavorável ao medicamento.", "titulo_pt": "ANS abre consulta pública sobre inclusão no Rol de medicamento para tumores neuroendóricos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 203838, "titulo": "Grupos do setor de defesa alertam que estoque de minerais críticos dos EUA pode elevar preços", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/grupos-do-setor-de-defesa-alertam-que-estoque-de-minerais-criticos-dos-eua-pode-elevar-precos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T19:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas do setor de defesa alertaram que uma iniciativa dos Estados Unidos para formar estoques de minerais críticos pode elevar os preços e aumentar a concorrência com compradores industriais por materiais escassos.", "titulo_pt": "Grupos de defesa alertam sobre aumento de preços com estoques de minerais dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 203839, "titulo": "Tesouro vende R$ 33,3 bi em prefixados após queda dos juros; volume é o maior desde dezembro de 2020", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/tesouro-vende-r-333-bi-em-prefixados-apos-queda-dos-juros-volume-e-o-maior-desde-dezembro-de-2020.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tesouro Nacional realizou uma venda de títulos públicos prefixados no valor de R$ 33,28 bilhões, o maior volume desde dezembro de 2020. Foram vendidos R$ 27,86 bilhões em LTN e R$ 5,43 bilhões em NTN-F com vencimentos entre 2028 e 2037.", "titulo_pt": "Tesouro vende R$ 33,3 bi em prefixados após queda dos juros; volume é o maior desde dezembro de 2020", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 203906, "titulo": "AliExpress e Correios firmam acordo para acelerar entregas no Brasil", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/aliexpress-e-correios-firmam-acordo-para-acelerar-entregas-no-brasil", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-08T19:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas Correios e AliExpress renovaram sua parceria para acelerar as entregas de pedidos no Brasil, especialmente durante eventos de alta demanda como a Black Friday e o dia 11 de novembro. O acordo visa melhorar o tempo de entrega durante esses períodos de maior volume de compras.", "titulo_pt": "Correios e aliexpress renovam parceria para acelerar entregas no Brasil", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 204216, "titulo": "Can a New Credit Rating Agency Help Africans Borrow at Better Rates?", "url": "https://foreignpolicy.com/2026/10/08/africa-credit-rating-agency-borrowing-debt/", "fonte_id": "foreign_policy", "data_pub": "2026-10-08T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Africana está desafiando o método usado pelas três grandes agências de rating para avaliar o risco de empréstimos para os países africanos.", "titulo_pt": "Pode uma nova agência de Rating auxiliar na aquisição de empréstimos a taxas menores para áfrica?", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 203841, "titulo": "Starbucks estuda comprar Chipotle em negócio bilionário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/starbucks-estuda-comprar-chipotle-em-negocio-bilionario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T18:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Starbucks está avaliando a possibilidade de comprar a Chipotle Mexican Grill, em uma aquisição que seria a maior já realizada no setor de restaurantes. A empresa busca unir duas das marcas mais conhecidas dos Estados Unidos.", "titulo_pt": "Starbucks analisa compra da Chipotle em negócio bilionário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204219, "titulo": "The Oil Crisis America Saw Coming", "url": "https://www.theatlantic.com/newsletters/2026/10/us-oil-energy-crisis-1987-middle-east-hormuz/688937/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-08T18:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1987, dois escritores previram um caminho para a independência energética dos Estados Unidos em relação ao Oriente Médio. O que eles não preveem foi o que os Estados Unidos fariam para alcançar essa independência.", "titulo_pt": "A crise do petróleo que os EUA preveem", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 204096, "titulo": "TST invalida cláusula que previa descanso após o sétimo dia consecutivo de trabalho", "url": "https://www.jota.info/trabalho/tst-invalida-clausula-que-previa-descanso-apos-o-setimo-dia-consecutivo-de-trabalho", "fonte_id": "jota", "data_pub": "2026-10-08T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Terceira Turma do Tribunal Superior do Trabalho (TST) declarou nula uma cláusula que permitia um descanso no sexto ou oitavo dia de trabalho, de forma alternada, desde que houvesse pelo menos dois dias de descanso a cada 14 dias.", "titulo_pt": "TST anula cláusula de acordo que permitia descanso após o sétimo dia de trabalho", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 204071, "titulo": "Ibovespa fecha em alta de 1% com Petrobras e pesquisas do 2º turno; dólar vai a R$ 5,02", "url": "https://exame.com/invest/mercados/ibovespa-fecha-em-alta-de-1-com-petrobras-e-pesquisas-do-2o-turno-dolar-vai-a-r-502/", "fonte_id": "exame", "data_pub": "2026-10-08T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa encerrou o pregão em alta de 1%, impulsionado por Petrobras e pesquisas sobre o segundo turno das eleições. O dólar fechou a R$ 5,02. As bolsas de Nova York tiveram desempenho misto, enquanto o preço do petróleo subiu novamente.", "titulo_pt": "Ibovespa fecha em alta de 1% com Petrobras e pesquisas do 2º turno; dólar a R$ 5,02", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 203440, "titulo": "Inflation on many everyday items was entirely due to tariffs, NY Fed says", "url": "https://www.cnbc.com/2026/10/08/inflation-tariffs-trump-fed-consumer-goods.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Federal Reserve de Nova York descobriram que as tarifas adicionaram 2,9 pontos percentuais à inflação em 67 categorias de bens até fevereiro de 2026.", "titulo_pt": "Inflação em muitos itens do dia a dia foi inteiramente devido às tarifas, diz NY Fed", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 203439, "titulo": "Treasury yields are lower after reaching multiyear highs, traders weigh latest bond auction", "url": "https://www.cnbc.com/2026/10/08/us-treasury-yields-30-year-bond-auction.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro estão mais baixos após atingirem máximos multi-anos, enquanto os traders aguardam o resultado de uma leilão de títulos de dívida de longo prazo. Comentários de um alto oficial do Federal Reserve foram considerados durante esse período.", "titulo_pt": "Rendimentos do tesouro caem após máximos multi-anos, traders aguardam leilão de títulos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 204377, "titulo": "Anthropic launches free AI security scans for open-source projects", "url": "https://www.theverge.com/ai-artificial-intelligence/1008521/anthropic-open-source-oss-scanner", "fonte_id": "the_verge", "data_pub": "2026-10-08T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic lançou um novo serviço chamado OSS Scanner que oferece exames de segurança gratuitos e periódicos para projetos de código aberto. Essa iniciativa visa ajudar os projetos de código aberto a identificar vulnerabilidades de segurança mais rapidamente.", "titulo_pt": "Anthropic lança serviço gratuito de exames de segurança para projetos de código aberto", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 204348, "titulo": "Pentagon unveils US$350 million quantum computing push as China rivalry grows", "url": "https://www.scmp.com/news/us/science-technology/article/3370243/pentagon-unveils-us350-million-quantum-computing-push-china-rivalry-grows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pentágono anunciou uma nova iniciativa multimilionária de cerca de 350 milhões de dólares para manter a liderança americana em computação quântica, em meio à crescente concorrência entre os Estados Unidos e China no uso de tecnologia avançada em aplicações militares.", "titulo_pt": "Pentágono anuncia investimento de 350 milhões de dólares em computação quântica no auge da concorrência com a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 204000, "titulo": "Nova IA ajuda pesquisadores a revelar segredos da Grécia Antiga", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/nova-ia-ajuda-pesquisadores-a-revelar-segredos-da-grecia-antiga/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ferramenta Apollo está ajudando pesquisadores a reconstruir manuscritos danificados da Grécia Antiga. Ela promete diminuir significativamente o tempo necessário para pesquisas acadêmicas nesse campo.", "titulo_pt": "Nova IA ajuda pesquisadores a desvendar segredos da Grécia Antiga", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 204123, "titulo": "“A mí también me pasó”: el caso de las fotos de desnudos con IA impulsó nuevos testimonios de estudiantes de todo el país", "url": "https://www.lanacion.com.ar/sociedad/a-mi-tambien-me-paso-el-caso-de-las-fotos-falsas-con-ia-que-impulso-nuevos-testimonios-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Justiça identificou 45 estudantes femininas afetadas no Colegio Modelo Lomas, e dois meninos de 15 anos foram imputados. Várias relações semelhantes foram relatadas por estudantes de todo o país envolvendo o uso de inteligência artificial em fotos de nudez.", "titulo_pt": "A também me aconteceu: caso de fotos de nudez com IA levou a novos relatos de estudantes de todo o país", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 204387, "titulo": "Inside Elon Musk’s Midterm Spending Spree", "url": "https://www.wired.com/story/uncanny-valley-podcast-inside-elon-musks-midterm-spending-spree/", "fonte_id": "wired", "data_pub": "2026-10-08T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa 'Uncanny Valley' discute os gastos em campanha de Elon Musk, a última ideologia que Trump considera perigosa e a reação negativa ao designer responsável pelo logotipo da banda Muse.", "titulo_pt": "Dentro da gasta campanha de Elon Musk", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 203992, "titulo": "SpaceX compra licenças de espectro e avança para disputar mercado de celular nos EUA", "url": "https://www.infomoney.com.br/mercados/spacex-compra-licencas-de-espectro-e-avanca-para-disputar-mercado-de-celular-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-08T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX, empresa de Elon Musk, adquiriu licenças de espectro para expandir sua oferta de serviços de celular nos Estados Unidos. A companhia pretende combinar sua rede de satélites Starlink com infraestrutura terrestre para oferecer cobertura nacional. Após o anúncio, as ações de AT&T, Verizon e T-Mobile sofreram queda.", "titulo_pt": "Spacex compra licenças de espectro e avança para disputar mercado de celular nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 204379, "titulo": "AMD will bring FSR 4 to handhelds by the end of 2026", "url": "https://www.theverge.com/games/1008353/amd-will-bring-fsr-4-to-handhelds-by-the-end-of-2026", "fonte_id": "the_verge", "data_pub": "2026-10-08T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AMD anunciou que trará a tecnologia FSR 4 para algumas consolas portáteis no final de 2026. A empresa havia reservado o direito de não oficializar o lançamento do FSR 4 em consolas mais antigas em junho.", "titulo_pt": "AMD trará FSR 4 para consolas portáteis no final de 2026", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 204368, "titulo": "Pretend you’re sitting at Elizabeth Holmes’ desk on this weirdly detailed website", "url": "https://techcrunch.com/2026/10/08/pretend-youre-sitting-at-elizabeth-holmes-desk-on-this-weirdly-detailed-website/", "fonte_id": "techcrunch", "data_pub": "2026-10-08T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O engenheiro Bo Lau criou um site baseado em mais de mil e-mails, apresentações, mensagens de texto e documentos do processo United States v. Elizabeth Holmes, simulando o que poderia ter sido como vasculhar a mesa de trabalho da fundadora da Theranos.", "titulo_pt": "Pretenda estar sentado na mesa de Elizabeth Holmes neste site detalhado", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 204363, "titulo": "R.I.P. Margaret Hamilton, whose code saved the Apollo 11 Moon landing", "url": "https://arstechnica.com/science/2026/10/r-i-p-margaret-hamilton-whose-code-saved-the-apollo-11-moon-landing/", "fonte_id": "ars_technica", "data_pub": "2026-10-08T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Margaret Hamilton, responsável pelo código que salvou o pouso da Apollo 11 na Lua, também criou o termo 'engenharia de software' e fundou duas empresas de sucesso na área de software.", "titulo_pt": "Margarida Hamilton, cujo código salvou o pouso da Apollo 11 na lua", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 204369, "titulo": "Fired OpenAI safety researchers dispute misconduct claims, warn of chilling effect", "url": "https://techcrunch.com/2026/10/08/fired-openai-safety-researchers-dispute-misconduct-claims-warn-of-chilling-effect/", "fonte_id": "techcrunch", "data_pub": "2026-10-08T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três ex-empregados da OpenAI, que trabalhavam na área de segurança, negam acusações de manipulação inadequada de informações sensíveis e alertam em uma carta aberta que suas demissões estão criando um efeito dissuasivo para a cultura de segurança da IA da empresa.", "titulo_pt": "Ex-empregados de segurança da OpenAI refutam acusações e alertam sobre efeito dissuasivo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 204364, "titulo": "Let's Encrypt cuts certificate lifetimes to 64 days starting February 2027", "url": "https://arstechnica.com/gadgets/2026/10/lets-encrypt-cuts-certificate-lifetimes-to-64-days-starting-february-2027/", "fonte_id": "ars_technica", "data_pub": "2026-10-08T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir de fevereiro de 2027, os certificados SSL/TLS gratuitos oferecidos pelo Let's Encrypt terão uma validade reduzida a 64 dias.", "titulo_pt": "Let's Encrypt reduzirá os prazos de validade dos certificados gratuitos para 64 dias a partir de fevereiro de 2027", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 204334, "titulo": "Microsoft banned from sponsoring foreign workers for US residency", "url": "https://www.ft.com/content/5cfecbba-69ed-42d0-98fd-3ae019144692?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Microsoft foi proibida de patrocinar trabalhadores estrangeiros para residência nos Estados Unidos, afetando vários grupos de tecnologia. Esta decisão representa o último esforço do governo Biden para limitar a imigração.", "titulo_pt": "Microsoft proibida de patrocinar imigrantes para residência nos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 204365, "titulo": "Driver wins $76 after ALPR led to bogus traffic stop, drug searches", "url": "https://arstechnica.com/tech-policy/2026/10/driver-wins-76-after-alpr-led-to-bogus-traffic-stop-drug-searches/", "fonte_id": "ars_technica", "data_pub": "2026-10-08T19:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um motorista ganhou $76 após um sistema de rastreamento por placa automática (ALPR) ter levado a um suposto parada de trânsito injustificada e buscas por drogas. A massificação da vigilância está se tornando cada vez mais ineficaz.", "titulo_pt": "Condutor ganha $76 após parada de trânsito falsa levada a cabo por sistema ALPR", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 204388, "titulo": "She Designed Meta’s New AI Logo. Then Came the Hate", "url": "https://www.wired.com/story/she-designed-metas-new-ai-logo-then-came-the-hate/", "fonte_id": "wired", "data_pub": "2026-10-08T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jessica Hische criou o novo logotipo de inteligência artificial para a Meta, mas não imaginava a magnitude da reação negativa que teria de parte dos usuários.", "titulo_pt": "Ela projeteou o novo logotipo de IA da Meta. Mas não imaginava a reação negativa", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 204366, "titulo": "RFK Jr. unveils sweeping federal initiative to find evidence of vaccine injuries", "url": "https://arstechnica.com/health/2026/10/rfk-jr-unveils-sweeping-federal-initiative-to-find-evidence-of-vaccine-injuries/", "fonte_id": "ars_technica", "data_pub": "2026-10-08T19:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robert F. Kennedy Jr. apresentou uma iniciativa federal abrangente para investigar evidências de danos por vacinas. O trecho original sugere que a agenda antivacina de Kennedy Jr. e Trump está se tornando cada vez mais corrupta e perigosa.", "titulo_pt": "RFK Jr. Anuncia iniciativa federal ampla para investigar danos por vacinas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 203840, "titulo": "Receita da OpenAI fica US$ 20 bilhões abaixo do esperado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/receita-da-openai-fica-us-20-bilhoes-abaixo-do-esperado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T19:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A receita anualizada da OpenAI é aproximadamente US$ 20 bilhões menor do que a empresa havia sinalizado anteriormente, segundo documentos financeiros compartilhados com investidores. Essa diferença reduzirá o otimismo em relação ao crescimento da demanda por inteligência artificial.", "titulo_pt": "Receita da OpenAI fica r$ 100,2 bilhões abaixo do esperado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 204404, "titulo": "Bavaria's ancestral languages: Resisting linguistic genocide", "url": "https://phys.org/news/2026-10-bavaria-ancestral-languages-resisting-linguistic.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As línguas ancestrais bávaras, Boarisch e Schwäbisch, são frequentemente classificadas como dialetos alemães. No entanto, para os membros da comunidade e estudiosos dessas línguas, essa classificação pode ter implicações práticas significativas, como a exclusão dessas línguas da proteção concedida por tratados europeus de línguas.", "titulo_pt": "As línguas ancestrais da baviera: resistindo ao genocídio linguístico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 204405, "titulo": "Lensless imaging method enables long-term monitoring of living cells without staining", "url": "https://phys.org/news/2026-10-lensless-imaging-method-enables-term.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Universidade de Tampere desenvolveram uma nova técnica de imagens sem lente que produz dados quantitativos precisos sobre células vivas a partir de uma única imagem. O sistema compacto pode ser instalado dentro de um incubador padrão de cultivo celular, permitindo o monitoramento contínuo das células vivas por horas ou até mesmo dias sem a necessidade de corantes ou outros rótulos.", "titulo_pt": "Método de imagens sem lente permite monitoramento a longo prazo de células vivas sem corantes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 204401, "titulo": "STAT+: House Democrat seeks to scrap No Surprises Act’s costly arbitration process", "url": "https://www.statnews.com/2026/10/08/house-democrat-proposes-change-to-no-surprises-act-arbitration-process/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo projeto de lei dos democratas na Câmara dos EUA visa abolir o processo de arbitragem controverso do banimento de faturas-surpresa. O projeto enfrentará críticas de grupos de provedores de saúde.", "titulo_pt": "Democrata na câmara propõe abolir processo de arbitragem do banimento de faturas-surpresa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 204406, "titulo": "Atlantic weather pattern shaped southern Greenland's rain and snow for millennia, sediments reveal", "url": "https://phys.org/news/2026-10-atlantic-weather-pattern-southern-greenland.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A variabilidade do padrão climático do Atlântico Norte influenciou as precipitações em forma de chuva e neve na região sul da Groenlândia por milênios, de acordo com sedimentos. As temperaturas estão aumentando mais rapidamente nas áreas polares, o que afeta significativamente as regiões com 'cryosfera', como a Groenlândia.", "titulo_pt": "Padrão climático do atlântico norte moldou a precipitação na groenlândia do sul por milênios, mostram sedimentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 204407, "titulo": "Do we all see anger the same way?", "url": "https://phys.org/news/2026-10-anger.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emoções básicas associadas a expressões faciais incluem felicidade, tristeza, nojo, surpresa, medo, desprezo e raiva. Entre essas emoções, a raiva desempenha um papel particularmente importante, pois frequentemente indica ameaças ou conflitos interpessoais.", "titulo_pt": "Temos todos a mesma percepção da raiva?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 203932, "titulo": "A incrível imagem das montanhas de Marte capturada por rover da Nasa", "url": "https://veja.abril.com.br/ciencia/a-incrivel-imagem-das-montanhas-de-marte-capturada-por-rover-da-nasa/", "fonte_id": "veja", "data_pub": "2026-10-08T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O rover Curiosity da Nasa subiu o Monte Sharp, uma montanha com mais de cinco quilômetros de altura, desde 2014.", "titulo_pt": "Imagem incrível das montanhas de Marte capturada pelo rover curiosity", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 204409, "titulo": "Nitrogen fixation 'off switch' discovery could one day help crops make their own fertilizer", "url": "https://phys.org/news/2026-10-nitrogen-fixation-discovery-day-crops.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta do 'botão de desligar' da fixação de nitrogênio poderia, um dia, ajudar as culturas a produzir seu próprio fertilizante. O nitrogênio é essencial para a vida, sendo necessário para a formação de proteínas, DNA e muitos outros componentes celulares.", "titulo_pt": "Descoberta do 'botão de desligar' de fixação de nitrogênio poderia ajudar culturas a produzir seu próprio fertilizante", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 203822, "titulo": "Um Nobel para quem iluminou o cérebro", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/10/um-nobel-para-quem-iluminou-o-cerebro.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-08T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Karl Deisseroth, mais jovem a receber o Prêmio Nobel de Fisiologia ou Medicina, descobriu métodos que iluminaram o funcionamento do cérebro. Ele compartilhou a história de suas descobertas em uma entrevista recente.", "titulo_pt": "Um Nobel para quem iluminou o cérebro", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 204429, "titulo": "NASA Briefing to Highlight Contributions to Martian Moons Mission", "url": "https://www.nasa.gov/news-release/nasa-briefing-to-highlight-contributions-to-martian-moons-mission/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T20:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA convidou a mídia para uma teleconferência no dia 15 de outubro às 16h EDT para apresentar suas contribuições para a missão Martian Moons eXploration (MMX) da JAXA. A missão está programada para lançamento no dia 19 de outubro EDT (20 de outubro no JST) do Centro Espacial de Tanegashima, no Japão.", "titulo_pt": "Briefing da NASA para destacar contribuições para missão de marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 204430, "titulo": "NASA Announces Bold Science Initiatives for America’s Golden Age Summit", "url": "https://www.nasa.gov/news-release/nasa-announces-bold-science-initiatives-for-americas-golden-age-summit/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA anuncia dois novos programas de ciência e tecnologia para aprofundar o entendimento científico e acelerar a inovação que moldará o futuro da América no espaço. Essas iniciativas são anunciadas durante o 'Summit da Era de Ouro' organizado pelo Gabinete de Ciência e Tecnologia da Casa Branca.", "titulo_pt": "NASA anuncia iniciativas científicas e tecnológicas para a era de ouro da américa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 204435, "titulo": "Mathematicians marvel, and grumble, at OpenAI’s trove of new results", "url": "https://www.scientificamerican.com/article/mathematicians-marvel-and-grumble-at-openais-trove-of-new-results/", "fonte_id": "scientific_american", "data_pub": "2026-10-08T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pacote 'slop drop' apresenta diversos resultados revolucionários, mas a maneira como foi gerado permanece incerta e controversa.", "titulo_pt": "Matemáticos maravilham-se e reclamam com relação aos novos resultados da OpenAI", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 204431, "titulo": "NASA’s SSPICY Mission to Demonstrate In-Space Inspection Technologies", "url": "https://www.nasa.gov/centers-and-facilities/ames/nasas-sspicy-mission-to-demonstrate-in-space-inspection-technologies/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T18:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou a missão SSPICY, que utilizará uma pequena nave espacial para se aproximar de satélites desativados, demonstrando tecnologias para futuros reparos em órbita e redução de detritos espaciais. O lançamento ocorreu em 1º de outubro do Base de Lançamento de Vandenberg, Califórnia.", "titulo_pt": "Missão SSPICY da nasa demonstrará tecnologias de inspeção em órbita", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 204432, "titulo": "Crew-12 Returns to Earth", "url": "https://www.nasa.gov/image-article/crew-12-returns-to-earth/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T18:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cápsula SpaceX Crew Dragon Freedom realizou o pouso na costa da Califórnia no Oceano Pacífico em 8 de outubro de 2026. A tripulação compunha-se de astronautas da NASA Jessica Meir e Jack Hathaway, da ESA Sophie Adenot e do cosmonauta russo Andrey Fedyaev, que estiveram em missão no espaço durante o Crew-12.", "titulo_pt": "Crew-12 retorna à terra", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 204402, "titulo": "NIH funding uncertainty thwarts U.S. researchers", "url": "https://www.statnews.com/2026/10/08/readout-loud-podcast-nih-funding-research-biotech-caribou-nobel-prize/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T18:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O NIH tem enfrentado incertezas orçamentárias que afetam os pesquisadores dos Estados Unidos. O podcast 'The Readout LOUD' aborda como o NIH tem utilizado seu orçamento e as preocupações dos investidores em biotecnologia.", "titulo_pt": "Incerteza orçamentária do NIH atrapalha pesquisadores americanos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 204436, "titulo": "Astronomers discover record-breaking ancient cosmic outburst", "url": "https://www.scientificamerican.com/article/astronomers-discover-record-breaking-ancient-cosmic-outburst/", "fonte_id": "scientific_american", "data_pub": "2026-10-08T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um 'buraco de rádio rápido' detectado pelo array MeerKAT veio de 3 bilhões de anos após o Big Bang. Este evento pode auxiliar na mapeagem da matéria intergaláctica, que é geralmente invisível.", "titulo_pt": "Astronomers discover record-breaking ancient cosmic outburst", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 204433, "titulo": "NASA’s SPHEREx Telescope Sees Menagerie of Brown Dwarfs", "url": "https://www.nasa.gov/missions/spherex/nasas-spherex-telescope-sees-menagerie-of-brown-dwarfs/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A telescope da NASA, SPHEREx, está estudando corpos celestes conhecidos como brown dwarfs, que são objetos que se assemelham a estrelas mas são mais pequenos, e exoplanetas mas são maiores. Os novos achados indicam que esses corpos têm atmosferas quimicamente ricas semelhantes às das gigantes gasosas.", "titulo_pt": "Telescópio SPHEREx da nasa revela atmosferas quimicamente ricas em Brown Dwarfs", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 204112, "titulo": "La voz indócil de Anne Carson se resiste a cualquier encasillamiento", "url": "https://www.lanacion.com.ar/cultura/la-voz-indocil-de-anne-carson-se-resiste-a-cualquier-encasillamiento-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Anne Carson é conhecida por sua voz independente e não se encaixa em categorias convencionais. O artigo destaca a resistência de sua voz a qualquer tipo de classificação ou definição.", "titulo_pt": "A voz ousada de Anne Carson se opõe a qualquer enquadramento", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 204452, "titulo": "Inside ‘Nerve Center,’ InfoWars’ New Flagship Show That Wants to Hold Every Possible Opinion at Once", "url": "https://www.indiewire.com/features/interviews/nerve-center-infowars-new-show-1235220705/", "fonte_id": "indiewire", "data_pub": "2026-10-08T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa 'Nerve Center', novo flagship da InfoWars, reúne os aspectos mais excêntricos da internet em um único programa. Os apresentadores Patti Harrison e David Brown, juntamente com o diretor Alan Resnick, explicam como montaram o show.", "titulo_pt": "Dentro do 'Nerve Center', o novo Flagship da InfoWars que quer abraçar todas as possíveis opiniões", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 204453, "titulo": "TCM Sticking Around Under Skydance, to Be Overseen by Film Group Instead of TV Team", "url": "https://www.indiewire.com/news/business/tcm-sticking-around-under-skydance-1235220941/", "fonte_id": "indiewire", "data_pub": "2026-10-08T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Skydance Media continuará administrando o canal de cabo TCM, com Dana Goldberg e Josh Greenstein tendo o controle de supervisão. Anteriormente, Mike De Luca e Pam Abdy estavam à frente dessa tarefa na Warner Bros.", "titulo_pt": "TCM continuando sob administração da Skydance, com novo time de supervisão", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 204346, "titulo": "Anime is winning over a new generation of fans", "url": "https://www.japantimes.co.jp/culture/2026/10/09/entertainment-news/anime-survey-watching/", "fonte_id": "japan_times", "data_pub": "2026-10-08T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A visualização de anime está aumentando entre os jovens, com 79% dos fãs adolescentes entrevistados afirmando que estão assistindo mais do que há um ano.", "titulo_pt": "Anime conquista uma nova geração de fãs", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 203823, "titulo": "Três receitas na brasa para o Dia da Sobremesa", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/nacao-churrasqueira/2026/10/tres-receitas-na-brasa-para-o-dia-da-sobremesa.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O calor residual da churrasqueira após a carne é aproveitado para caramelizar açúcar e cozinhar frutas, permitindo a preparação de sobremesas. O Dia da Sobremesa, comemorado nesta sexta-feira (9), incentiva o uso deste calor para finalizar a refeição.", "titulo_pt": "Três receitas na brasa para o Dia da Sobremesa", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 204141, "titulo": "Chile presenta “Astros de Tierra” e inicia su camino hacia Frankfurt 2027", "url": "https://www.latercera.com/culto/noticia/chile-presenta-astros-de-tierra-e-inicia-su-camino-hacia-frankfurt-2027/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile apresentou o lema e a identidade gráfica que serão usados em sua participação como Invitado de Honra na Feira do Livro de Frankfurt em 2027. A iniciativa visa fortalecer a projeção internacional da literatura chilena, promover novas traduções e expandir mercados para autores, editoras e outros atores do ecossistema do livro.", "titulo_pt": "Chile apresenta 'Astros de terra' e inicia caminho para Frankfurt 2027", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 204438, "titulo": "In Memoriam: Remembering Art Collectors Lost, From Agnes Gund to Dorothy Vogel", "url": "https://www.artnews.com/list/art-news/news/in-memoriam-top-art-collectors-remembrances-agnes-gund-1234800494/", "fonte_id": "artnews", "data_pub": "2026-10-08T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Curadores e colecionadores prestaram homenagem a amigos falecidos. O artigo menciona Agnes Gund e Dorothy Vogel entre os colecionadores que se foram.", "titulo_pt": "Em memória: lembrando colecionadores perdidos, de Agnes Gund a Dorothy Vogel", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 204454, "titulo": "‘Crazy Rich Asians’ Series Ordered at HBO with Film’s Original Cast Returning", "url": "https://www.indiewire.com/news/breaking-news/crazy-rich-asians-series-hbo-original-cast-returning-1235220956/", "fonte_id": "indiewire", "data_pub": "2026-10-08T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HBO encomendou uma série dramática com um horário de uma hora baseada no filme 'Crazy Rich Asians', com Adele Lim, co-autora do filme de 2018, agindo como showrunner e produtora executiva. O elenco original do filme retornará para a série.", "titulo_pt": "Série 'crazy Rich Asians' pedida na HBO com elenco Original de v "EUA", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 203954, "titulo": "Conselho de Medicina concede carteira póstuma a estudante morto por PMs", "url": "https://www.metropoles.com/sao-paulo/conselho-de-medicina-concede-carteira-postuma-a-estudante-morto-por-pms", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudante de medicina Marco Aurélio Cardenas Acosta foi morto por um policial militar em novembro de 2024. O Conselho de Medicina concedeu uma carteira póstuma a ele.", "titulo_pt": "Conselho de Medicina concede carteira póstuma a estudante morto por PMs", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203936, "titulo": "A exigência da Liga das Escolas de Samba que pode mexer com os direitos do consumidores no RJ", "url": "https://veja.abril.com.br/brasil/a-exigencia-da-liga-das-escolas-de-samba-que-pode-mexer-com-os-direitos-do-consumidores-no-rj/", "fonte_id": "veja", "data_pub": "2026-10-08T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Defesa do Consumidor da Assembleia Legislativa do Rio de Janeiro (Alerj) vai enviar um ofício à direção da Liesa e Ticketmaster solicitando uma alternativa. Isso pode afetar os direitos dos consumidores no estado.", "titulo_pt": "Requerimento da comissão de defesa do consumidor da alerj pode impactar direitos dos consumidores no rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 204121, "titulo": "Grabois cruzó a Pettovello por las denuncias contra estudiantes: “Fanática de los desacatamientos judiciales”", "url": "https://www.lanacion.com.ar/politica/grabois-cruzo-a-pettovello-por-las-denuncias-contra-estudiantes-que-protestaron-en-el-palacio-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dirigente social cuestionou a atitude de denunciar uma manifestação pacífica de estudantes que se cansaram de problemas nas universidades. Pettovello, supostamente, foi criticado por querer acusar judicialmente os jovens.", "titulo_pt": "Grabois criticou Pettovello por querer denunciar estudantes pacíficos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 204001, "titulo": "Homem usa metralhadora para destruir caminhão após briga de trânsito no PA", "url": "https://www.cnnbrasil.com.br/nacional/norte/pa/homem-usa-metralhadora-para-destruir-caminhao-apos-briga-de-transito-no-pa/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi filmado destruindo os faróis de um caminhão com uma metralhadora e ameaçando o motorista em um pedágio no Pará. A Polícia Civil está investigando o caso.", "titulo_pt": "Suspeito destrói caminhão com metralhadora após briga de trânsito no PA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203967, "titulo": "Homem é condenado a 345 anos por estupro de familiares em Minas", "url": "https://www.metropoles.com/minas-gerais/homem-e-condenado-a-345-anos-por-estupro-de-familiares-em-minas", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi condenado a 345 anos de prisão por estuprar familiares em Minas Gerais. A esposa dele, que era também a mãe e madrasta das vítimas, foi condenada a 90 anos por omissão e por não ter impedido os abusos ocorridos em sua casa.", "titulo_pt": "Homem é condenado a 345 anos por estupro de familiares em Minas; esposa condenada a 90 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203944, "titulo": "Filha de Neymar é alvo de ataques nas redes e mãe fala em Justiça", "url": "https://veja.abril.com.br/cultura/filha-de-neymar-e-alvo-de-ataques-nas-redes-e-mae-fala-em-justica/", "fonte_id": "veja", "data_pub": "2026-10-08T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A filha de 2 anos de Neymar, Helena, está sendo alvo de ataques nas redes sociais. A mãe da criança afirmou que buscará justiça.", "titulo_pt": "Filha de Neymar é alvo de ataques nas redes e mãe fala em Justiça", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 204015, "titulo": "Estudante morto por PM recebe carteira profissional de médico póstuma em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/estudante-morto-por-pm-recebe-carteira-profissional-de-medico-postuma-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marco Aurélio Cardenas Acosta, um estudante, foi baleado por um policial militar em um hotel na Vila Mariana em 20 de novembro de 2024. Após sua morte, foi concedida uma carteira profissional de médico póstuma em São Paulo.", "titulo_pt": "Estudante morto por PM recebe carteira profissional de médico póstuma em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203975, "titulo": "Morte de idosa despejada aos 87 anos vira símbolo de luta por moradia na Espanha; direita rejeita medidas para conter crise habitacional", "url": "https://www.brasildefato.com.br/2026/10/08/morte-de-idosa-despejada-aos-87-anos-vira-simbolo-de-luta-por-moradia-na-espanha-direita-rejeita-medidas-para-conter-crise-habitacional/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-08T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A morte de María del Carmen Abascal, uma idosa de 87 anos despejada, se tornou um símbolo de luta por moradia na Espanha. Ela havia sido removida de seu apartamento em Madri em 23 de setembro. A morte dela intensificou mobilizações contra a crise habitacional no país, rejeitadas pela direita política.", "titulo_pt": "Morte de idosa despejada aos 87 anos vira símbolo de luta por moradia na Espanha; direita rejeita medidas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 204034, "titulo": "O que se sabe sobre os três incêndios que aconteceram na UFPE em oito dias e que serão investigados pela PF", "url": "https://www.bbc.com/portuguese/articles/cje36lx0qz5qo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-08T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três incêndios ocorreram na Universidade Federal de Pernambuco (UFPE) em oito dias, afetando laboratórios do Departamento de Física e do Centro de Biociências, além de danificar um prédio que abrigava pesquisas em diversas áreas.", "titulo_pt": "O que se sabe sobre os três incêndios que aconteceram na UFPE em oito dias e que serão investigados pela PF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 204035, "titulo": "A fúria de estudantes que ocupam as ruas da França em protesto: 'Ficamos sem professores por semanas'", "url": "https://www.bbc.com/portuguese/articles/c6m24vx9x2ydo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-08T18:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes franceses estão ocupando as ruas em protesto, motivados por problemas nas escolas e também refletindo a longa tradição francesa de manifestar descontentamento público.", "titulo_pt": "A fúria de estudantes que ocupam as ruas da França em protesto: 'ficamos sem professores por semanas'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 204275, "titulo": "French high school protests: The questions raised by two weeks of police intervention", "url": "https://www.lemonde.fr/en/france/article/2026/10/08/french-high-school-protests-the-questions-raised-by-two-weeks-of-police-intervention_6758395_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-08T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra do Interior francesa, Laurent Nuñez, enfrenta críticas após vídeos mostrarem ações policiais consideradas excessivas e jovens feridos. Durante duas semanas, a polícia realizou 6.059 prisões, um recorde entre os dias 28 de setembro e 5 de outubro.", "titulo_pt": "Protestos nas escolas francesas: as perguntas levantadas pela intervenção policial de duas semanas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 202937, "titulo": "Crianças da Uganda promovem site que troca criptomoedas por voto em Flávio", "url": "https://www.metropoles.com/viralizou/criancas-da-uganda-promovem-site-que-troca-criptomoedas-por-voto-em-flavio", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Crianças na Uganda criaram um site que distribui tokens em troca de compartilhamento de conteúdo promovendo o voto em Flávio Bolsonaro. O site incentiva o voto em Flávio Bolsonaro (PL) através do compartilhamento de conteúdo relacionado à campanha.", "titulo_pt": "Crianças da Uganda criam site que troca tokens por compartilhamento de conteúdo em favor de Flávio bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203086, "titulo": "Con drenaje sostenible, suelo absorbente y farolas peatonales: la Ciudad recuperó un predio usurpado y lo transforma en un nuevo parque que promete beneficiar a más de 50.000 vecinos porteños", "url": "https://www.lanacion.com.ar/sociedad/con-drenaje-sostenible-suelo-absorbente-y-farolas-peatonales-la-ciudad-recupero-un-predio-usurpado-y-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo da Cidade de Buenos Aires recuperou um espaço de 5.900 metros quadrados no Parque Ferroviário Urquiza e transformou-o em um novo parque. Este projeto promete beneficiar mais de 50.000 moradores da região.", "titulo_pt": "Com drenagem sustentável, solo absorvente e lâmpadas para pedestres: a cidade recuperou um terreno usurpado e o transformou em um novo parque que promete beneficiar mais de 50.000 moradores", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203089, "titulo": "Juicio por la muerte de Maradona: la fiscalía pidió que Leopoldo Luque sea condenado a la pena de 12 años de cárcel", "url": "https://www.lanacion.com.ar/seguridad/juicio-por-la-muerte-de-maradona-la-fiscalia-pidio-que-el-leopoldo-luque-sea-condenado-a-la-pena-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os fiscais generais adjuntos de San Isidro, Patricio Ferrari e Cosme Iribarren, apresentaram seus argumentos no tribunal responsável pelo julgamento de Leopoldo Luque, acusado pela morte de Maradona. A fiscalia solicitou que Luque seja condenado a 12 anos de prisão.", "titulo_pt": "Juízo pela morte de Maradona: fiscalia pede 12 anos de prisão para Leopoldo Luque", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202940, "titulo": "Jovem morre de apendicite após 3 idas a hospital; família alega negligência", "url": "https://www.metropoles.com/brasil/jovem-morre-de-apendicite-apos-3-idas-a-hospital-familia-alega-negligencia", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem faleceu devido a complicações de apendicite após ter feito três idas a hospitais, conforme alega a família. Segundo o pai, apenas na terceira visita os médicos diagnosticaram a apendicite e realizaram a internação para a cirurgia.", "titulo_pt": "Jovem morre de apendicite após três idas a hospital; família alega negligência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202943, "titulo": "Mapa interativo revela onde foram encontrados corpos em SP. Confira", "url": "https://www.metropoles.com/sao-paulo/locais-corpos-dentro-de-sacos-de-lixo", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil de São Paulo está investigando casos individuais de corpos encontrados em sacolas plásticas ou cobertores na capital paulista. Um mapa interativo foi criado para mostrar os locais onde esses corpos foram encontrados.", "titulo_pt": "Mapa interativo mostra locais de descobertas de corpos em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 204107, "titulo": "Leonardo DiCaprio compró una isla en Belice para salvar su ecosistema y restauró 104 hectáreas de vegetación nativa", "url": "https://www.lanacion.com.ar/espectaculos/leonardo-dicaprio-compro-una-isla-en-belice-para-salvar-su-ecosistema-y-restauro-104-hectareas-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ator americano Leonardo DiCaprio adquiriu uma ilha em Belice por 1,75 milhões de dólares com o objetivo de recuperar sua biodiversidade e desenvolver um complexo turístico sustentável. Ele restaurou 104 hectares de vegetação nativa na ilha Blackadore Caye.", "titulo_pt": "Leonardo DiCaprio compra ilha em Belice para preservar ecológico e desenvolver turismo sustentável", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 204120, "titulo": "Una fuerte correntada arrastró autos y micros tras el desborde de un canal en Chile", "url": "https://www.lanacion.com.ar/el-mundo/una-fuerte-correntada-arrastro-autos-y-micros-tras-el-desborde-de-un-canal-en-chile-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um forte correntezão arrastou carros e microônibus após o desbordamento de um canal em Las Condes, na Região Metropolitana de Santiago, Chile. O fenômeno foi registrado em vídeo pelos moradores locais.", "titulo_pt": "Correntezão arrasta veículos após desbordamento de canal em las condes, Chile", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203832, "titulo": "Desafio do clima entra no radar europeu, e isso afeta o Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/10/desafio-do-clima-entra-no-radar-europeu-e-isso-afeta-o-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A safra de verão na União Europeia não atingiu as expectativas devido ao calor intenso, seca e perda de umidade do solo, resultando em uma produção menor. Esses eventos climáticos são considerados parte de novos riscos que devem ser estudados com mais atenção, afetando não apenas a Europa, mas também o Brasil.", "titulo_pt": "Desafio do clima entra no radar europeu e afeta o Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204103, "titulo": "Aluvión en Santiago de Chile: las calles se convirtieron en ríos y el barro arrastró autos y colectivos", "url": "https://www.clarin.com/mundo/aluvion-santiago-chile-calles-convirtieron-rios-barro-arrastro-autos-colectivos_0_OLmtNNtS7s.html", "fonte_id": "clarin", "data_pub": "2026-10-08T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Houve uma aluvão em Santiago, Chile, devido a fortes chuvas que desbordaram uma quebrada. O Corpo de Bomberos de Santiago decretou acuartelamento geral de suas equipes.", "titulo_pt": "Aluvão em Santiago de Chile: ruas se transformaram em rios e barro arrastou veículos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 203096, "titulo": "Miden 13 cm y pesan casi un kilo: Gendarmería recuperó seis huevos de ñandú que iban escondidos de forma ilegal debajo del asiento de un auto en la Patagonia", "url": "https://www.lanacion.com.ar/sociedad/miden-13-cm-y-pesan-casi-un-kilo-gendarmeria-recupero-seis-huevos-de-nandu-que-iban-escondidos-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram recuperados seis ovos de ñandú, medindo 13 centímetros e pesando quase um quilograma cada, escondidos ilegalmente debaixo do assento de um carro na Patagonia. O responsável foi investigado de acordo com a lei de fauna, pois o ñandú é uma ave ameaçada.", "titulo_pt": "Medem 13 cm e pesam quase um kilo: gendarmeria recupera seis ovos de ñandú escondidos ilegalmente embaixo do assento de um carro na Patagonia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202985, "titulo": "“Oceano mais quente que já medimos”: Agência da ONU alerta para um dos El Niño mais fortes da história", "url": "https://www.cnnbrasil.com.br/ciencia/oceano-mais-quente-que-ja-medimos-agencia-da-onu-alerta-para-um-dos-el-nino-mais-fortes-da-historia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência da ONU registrou o pico do El Niño em dezembro de 2026, com temperaturas marítimas recordes. Os efeitos intensificados deste fenômeno devem persistir até fevereiro de 2027.", "titulo_pt": "Oceano mais quente que já medimos: agência da ONU alerta para o El Niño mais forte da história", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203230, "titulo": "Seychelles giant tortoise numbers hit record 180,000 in conservation triumph", "url": "https://www.theguardian.com/environment/2026/oct/08/researchers-find-180000-giant-tortoises-living-on-island-in-seychelles", "fonte_id": "guardian_world", "data_pub": "2026-10-08T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população de tartarugas gigantes de Aldabra, na ilha de Aldabra, Seychelles, atingiu um recorde de 180.000 animais, resultado de um programa de recuperação que durou décadas. Essa espécie, uma vez em perigo de extinção, está prosperando em um atol do Oceano Índico.", "titulo_pt": "Números de tartarugas gigantes de aldabra atingem recorde de 180.000 no triunfo da conservação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 202926, "titulo": "Vinícola Aurora conquista selo Carbon Free e levará novidade a 220 produtos", "url": "https://veja.abril.com.br/economia/vinicola-aurora-conquista-selo-carbon-free-e-levara-novidade-a-220-produtos/", "fonte_id": "veja", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vinícola Aurora, maior cooperativa vinícola do Brasil, conquistou o selo Carbon Free e planeja incorporar essa certificação ambiental aos rótulos de seus produtos. A empresa gerou faturamento de R$ 874,8 milhões em 2025.", "titulo_pt": "Vinícola Aurora conquista selo Carbon Free e levará novidade a 220 produtos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 202999, "titulo": "MP denuncia ex-secretária de Meio Ambiente por desmatamento irregular no RN", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/rn/mp-denuncia-ex-secretaria-de-meio-ambiente-por-desmatamento-irregular-no-rn/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-secretária de Meio Ambiente foi denunciada pelo Ministério Público por desmatamento irregular em uma área protegida de Mata Atlântica no Rio Grande do Norte. A área devastada era equivalente a 30 campos de futebol e foi usada para a construção de um loteamento e um centro comercial.", "titulo_pt": "MP denuncia ex-secretária de Meio Ambiente por desmatamento irregular no RN", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203003, "titulo": "Teste de estudantes usa lã de ovelha para evitar derretimento de geleira nos Alpes suíços e combater proliferação de microplásticos", "url": "https://www.cnnbrasil.com.br/ciencia/teste-de-estudantes-usa-la-de-ovelha-para-evitar-derretimento-de-geleira-nos-alpes-suicos-e-combater-proliferacao-de-microplasticos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um experimento demonstrou que a lã de ovelha oferece isolamento térmico igual ao de materiais sintéticos sem poluir o meio ambiente com microplásticos. O teste foi realizado para evitar o derretimento de geleiras nos Alpes suíços.", "titulo_pt": "Teste de estudantes usa lã de ovelha para evitar derretimento de geleiras nos Alpes suíços e combater proliferação de microplásticos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203423, "titulo": "Heavy autumn snow paralyses roads in Russia’s Far East", "url": "https://www.euronews.com/video/2026/10/08/heavy-autumn-snow-paralyses-roads-in-russias-far-east", "fonte_id": "euronews", "data_pub": "2026-10-08T15:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A forte neve no outono paralisou as estradas na região de Magadan, na Rússia, dificultando o movimento de caminhões e interrompendo os serviços de ônibus intercidades.", "titulo_pt": "Neve de outono paralisa estradas na região de magadan, na Rússia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 203546, "titulo": "Climate needs same urgency as defense spending, COP31 chief says", "url": "https://www.japantimes.co.jp/environment/2026/10/08/climate-change/cop-chief-climate-defense-spending/", "fonte_id": "japan_times", "data_pub": "2026-10-08T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro do Meio Ambiente da Turquia e presidente-designado da COP31, Murat Kurum, afirmou que cada país deve demonstrar a mesma responsabilidade e determinação no enfrentamento do clima.", "titulo_pt": "Clima precisa da mesma urgência que gastos com defesa, diz chefe da COP31", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202479, "titulo": "Dry wells and shrinking water holes as drought grips Sri Lanka", "url": "https://www.euronews.com/video/2026/10/08/dry-wells-and-shrinking-water-holes-as-drought-grips-sri-lanka", "fonte_id": "euronews", "data_pub": "2026-10-08T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prolongado período de seca no centro da Sri Lanka está deixando poços secos, prejudicando os meios de subsistência dos agricultores e empurrando a vida selvagem a se aglomerar em poças d'água cada vez menores.", "titulo_pt": "Poços secos e poças d'água encolhendo à medida que a seca atinge o centro da Sri Lanka", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 202099, "titulo": "Crianças sofrerão impacto \"desproporcional\" do El Niño, alerta Unicef", "url": "https://www.metropoles.com/saude/criancas-sofrerao-impacto-desproporcional-do-el-nino-alerta-unicef", "fonte_id": "metropoles", "data_pub": "2026-10-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Unicef alerta que as crianças serão impactadas de forma 'desproporcional' pelo El Niño, devido à sua vulnerabilidade em face das mudanças climáticas urgentes.", "titulo_pt": "Crianças sofrerão impacto 'desproporcional' do El Niño, alerta Unicef", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202129, "titulo": "Dia das Crianças 2026 deve movimentar R$ 9,27 bi no comércio brasileiro", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/dia-das-criancas-2026-deve-movimentar-r-927-bi-no-comercio-brasileiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas do varejo durante o Dia das Crianças 2026 devem atingir R$ 9,27 bilhões, sendo as maiores desde 2014. Brinquedos são os itens mais procurados, enquanto o vestuário perdeu destaque nas intenções de compra.", "titulo_pt": "Dia das Crianças 2026 deve movimentar R$ 9,27 bi no comércio brasileiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202101, "titulo": "Clima: Sul, Sudeste e Centro-Oeste enfrentam chuvas; interior tem calorão", "url": "https://www.metropoles.com/brasil/clima-sul-sudeste-e-centro-oeste-enfrentam-chuvas-interior-tem-calorao", "fonte_id": "metropoles", "data_pub": "2026-10-08T08:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sistemas frontais e corredores de umidade estão causando chuvas expressivas no Sul, Sudeste e Centro-Oeste. O interior dessas regiões, por outro lado, está enfrentando um calor intenso.", "titulo_pt": "Clima: sul, Sudeste e Centro-Oeste enfrentam chuvas; interior tem calorão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 203589, "titulo": "Laws inadequate to fight transnational repression: MAC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/09/2003865663", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comando de Operações de Inteligência (MAC) afirmou que as leis atuais são insuficientes para combater a repressão transnacional. A instituição destacou a necessidade de reformas legais mais robustas.", "titulo_pt": "Leis insuficientes para combater repressão transnacional, afirma MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 204347, "titulo": "Hong Kong rejects US downgrade to lowest tier in human trafficking report", "url": "https://www.scmp.com/news/china/diplomacy/article/3370244/hong-kong-rejects-us-downgrade-lowest-tier-human-trafficking-report?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório anual do Tráfico de Pessoas do Departamento de Estado dos Estados Unidos classificou Hong Kong como o nível mais baixo, Tier 3, rebaixando-o da lista de observação Tier 2 Watch List. A cidade rejeitou essa avaliação, considerando-a 'completamente infundada'.", "titulo_pt": "Hong Kong rejeita rebaixamento dos estados unidos no relatório anual sobre tráfico de pessoas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 203957, "titulo": "\"Meter fogo nos isolados\": militar ex-Funai é condenado a pagar R$ 100 mil", "url": "https://www.metropoles.com/brasil/meter-fogo-nos-isolados-militar-ex-funai-e-condenado-a-pagar-r-100-mil", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-militar da Funai foi condenado a pagar R$ 100 mil. Áudios mostraram que ele incentivava a violência contra os indígenas em território protegido pela Constituição Federal.", "titulo_pt": "Meter fogo nos isolados: militar ex-funai é condenado a pagar R$ 100 mil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204100, "titulo": "La Corte Suprema y una decisión clave sobre la figura del femicidio", "url": "https://www.clarin.com/opinion/corte-suprema-decision-clave-figura-femicidio_0_yDKRgm8ah3.html", "fonte_id": "clarin", "data_pub": "2026-10-08T21:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema deve decidir se é necessária uma relação de parceiro ou histórico de violência para qualificar um assassinato como femicídio. O caso de Julieta González reaviva o debate sobre como julgar crimes motivados por gênero.", "titulo_pt": "A Corte Suprema e uma decisão crucial sobre a figura do femicídio", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 202949, "titulo": "Valdemar se refere a gays como \"essa gente\" e deputado reage: \"LGBTfobia\"", "url": "https://www.metropoles.com/colunas/grande-angular/valdemar-se-refere-a-gays-como-essa-gente-e-deputado-reage-lgbtfobia", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Fábio Felix (PSol) reagiu a uma declaração do presidente nacional do Partido Liberal (PL), Valdemar Costa Neto, em que este se referiu aos gays como \"essa gente\". A reação do parlamentar foi classificada como uma resposta à LGBTfobia.", "titulo_pt": "Deputado reage a valdemar costa neto, que se referiu a gays como 'essa gente'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203102, "titulo": "Suspensión confirmada: un juez falla a favor de inmigrantes que recibían multas de hasta US$1,8 millones", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/suspension-confirmada-un-juez-falla-a-favor-de-inmigrantes-que-recibian-multas-de-hasta-us18-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um juiz confirmou a suspensão do mecanismo de multas a imigrantes que podiam ser cobrados até US$1,8 milhão. O juiz decidiu a favor dos imigrantes, suspendendo temporariamente o sistema de sanciones.", "titulo_pt": "Suspensão confirmada: juiz decide a favor de imigrantes com multas de até US$1,8 milhões", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203103, "titulo": "Juicio por la muerte de Maradona: fue la “internación más deficiente y temeraria de todos los tiempos”, sostuvo la acusación oficial", "url": "https://www.lanacion.com.ar/seguridad/juicio-por-la-muerte-de-maradona-fue-la-internacion-mas-deficiente-y-temeraria-de-todos-los-tiempos-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os fiscais generais adjuntos de San Isidro, Patricio Ferrari e Cosme Iribarren, apresentaram seus argumentos perante o tribunal no processo relacionado à morte de Maradona. Eles afirmaram que a internação médica foi a 'mais deficiente e temerária de todos os tempos'.", "titulo_pt": "Julgamento da morte de Maradona: internação foi 'a mais deficiente e temerária de todos os tempos', afirma acusação oficial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202896, "titulo": "EUA apresenta nova acusação contra Maduro e sua esposa por tortura", "url": "https://www.cartacapital.com.br/cartaexpressa/eua-apresentam-nova-acusacao-contra-maduro-e-sua-esposa-por-tortura/", "fonte_id": "cartacapital", "data_pub": "2026-10-08T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os EUA apresentaram novas acusações contra Maduro e sua esposa por tortura. Além disso, Maduro e Flores foram acusados de narcotráfico e tráfico de armas após serem capturados em uma operação militar em Caracas no dia 3 de janeiro.", "titulo_pt": "EUA apresenta nova acusação contra Maduro e sua esposa por tortura", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 203342, "titulo": "Nicolás Maduro and his wife hit with fresh torture charge", "url": "https://www.axios.com/2026/10/08/maduro-torture-charges-court-case", "fonte_id": "axios", "data_pub": "2026-10-08T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nicolás Maduro e sua esposa foram acusados de organizar tortura de pessoas detidas pelo regime venezuelano. Essas novas acusações foram anuncias em um novo mandado de prisão, acrescentando a acusações anteriores de narcoterrorismo.", "titulo_pt": "Maduro e sua esposa são acusados de novas acusações de tortura", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 203562, "titulo": "Is the Philippines using new anti-spying laws to silence critics?", "url": "https://www.scmp.com/week-asia/politics/article/3370221/philippines-using-new-anti-spying-laws-silence-critics?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto de lei filipino que expande a lei de espionagem do país para incluir atividades de tempo de paz está levantando preocupações entre jornalistas e especialistas em direito, que alertam que suas disposições amplas podem silenciar a livre express
