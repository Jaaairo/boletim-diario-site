ergency care of children in NSW", "url": "https://www.theguardian.com/australia-news/2026/sep/17/bondi-attacks-prompt-creation-of-new-institute-for-emergency-care-of-children-in-nsw", "fonte_id": "guardian_world", "data_pub": "2026-09-16T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo instituto dedicado ao cuidado emergencial de crianças gravemente feridas será estabelecido em Nova South Wales após eventos de trauma recentes. O Instituto de Trauma Pediátrico da Nova South Wales, baseado no Hospital Infantil de Sydney em Randwick, unirá clínicos, pesquisadores e especialistas para fornecer treinamento avançado e simulações em todo o sistema de saúde.", "titulo_pt": "Ataque em bondi leva ao criação de novo instituto para cuidados de emergência pediátricos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 166681, "titulo": "UNGA: PAHO joins global efforts to advance pandemic prevention, preparedness and response", "url": "https://www.paho.org/en/news/16-9-2026-unga-paho-joins-global-efforts-advance-pandemic-prevention-preparedness-and-response", "fonte_id": "paho", "data_pub": "2026-09-16T13:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO se juntou aos esforços globais para avançar na prevenção, preparação e resposta a pandemias. Isso ocorreu durante a 79ª Assembleia Geral das Nações Unidas.", "titulo_pt": "UNGA: PAHO se une aos esforços globais para prevenção, preparação e resposta a pandemias", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 165793, "titulo": "Quando o prontuário do paciente vira questão política", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/politicas-e-justica/2026/09/quando-o-prontuario-do-paciente-vira-questao-politica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T10:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 75% da população brasileira utiliza o SUS, com cerca de 15 milhões de pessoas dependendo exclusivamente do sistema em 1.915 municípios onde não há oferta de saúde privada. A falta de circulação de informações do paciente afeta principalmente essa população.", "titulo_pt": "Quando o prontuário do paciente vira questão política", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165165, "titulo": "Analizan la dieta de 5.000 niños y hallan que el menú cotidiano de los más altos tiene un patrón común", "url": "https://www.clarin.com/sociedad/analizan-dieta-5000-ninos-hallan-menu-cotidiano-altos-patron-comun_0_2E7Pk2p7Dk.html", "fonte_id": "clarin", "data_pub": "2026-09-16T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estudo analisou a dieta de 5.000 crianças e constatou que a ingestão de 100 mg de cálcio por dia reduz cerca de 7% as chances de ter baixo crescimento. Os pesquisadores recomendam incluir esse mineral, presente em laticínios, peixes e vegetais, em uma alimentação rica em proteínas e nutrientes.", "titulo_pt": "Estudo analisa dieta de 5.000 crianças e identifica padrão relacionado ao crescimento", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 165196, "titulo": "Qué funciona mejor para aliviar el dolor de la osteoartritis de rodilla, según una investigación", "url": "https://www.latercera.com/tendencias/noticia/que-funciona-mejor-para-aliviar-el-dolor-de-la-osteoartritis-de-rodilla-segun-una-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-09-16T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A osteoartrite do joelho, também conhecida como artrose, é uma doença degenerativa que resulta do desgaste progressivo do cartilagem articular. Pesquisadores analisaram os resultados de 139 ensaios clínicos para determinar o tratamento mais eficaz para aliviar o desconforto associado à doença.", "titulo_pt": "Qual tratamento funciona melhor para aliviar o desconforto da osteoartrite do joelho, segundo uma pesquisa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 165773, "titulo": "Google faz maior acordo para remoção de carbono com projeto no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/google-faz-maior-acordo-para-remocao-de-carbono-com-projeto-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google fechou a maior compra de remoção de carbono da sua história, em parceria com a Terradot, uma empresa que opera no Brasil e nos Estados Unidos. O projeto inicial será realizado no Rio Grande do Sul e pode se expandir para outras regiões do país no futuro.", "titulo_pt": "Google faz maior acordo para remoção de carbono com projeto no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166352, "titulo": "Huge wildfire in Valencia region burns 690 hectares after Spain’s hottest summer", "url": "https://www.euronews.com/video/2026/09/16/huge-wildfire-in-valencia-region-burns-690-hectares-after-spains-hottest-summer", "fonte_id": "euronews", "data_pub": "2026-09-16T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais estavam em andamento em Tuéjar, na região de Valencia, em 15 de setembro, após chamas se espalharem pelo Alto Turia Biosphere Reserve. O incêndio atingiu uma área de 690 hectares.", "titulo_pt": "Grande incêndio florestal na região de Valencia queima 690 hectares após verão mais quente da Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 166700, "titulo": "Analysis: Global fossil-fuel emissions set to fall in 2026 amid Hormuz crisis", "url": "https://www.carbonbrief.org/analysis-global-fossil-fuel-emissions-set-to-fall-in-2026-amid-hormuz-crisis", "fonte_id": "carbon_brief", "data_pub": "2026-09-16T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de combustíveis fósseis globais devem diminuir em torno de 0,5% em 2026 devido à crise do Hormuz.", "titulo_pt": "Análise: emissões de combustíveis fósseis globais devem cair em 2026 durante a crise do Hormuz", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 165916, "titulo": "Nordeste ganha primeiro hub de reciclagem têxtil em escala industrial", "url": "https://exame.com/esg/nordeste-ganha-primeiro-hub-de-reciclagem-textil-em-escala-industrial/", "fonte_id": "exame", "data_pub": "2026-09-16T12:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Riachuelo, em parceria com a Cotton Move, inaugurou o primeiro hub de reciclagem têxtil em escala industrial no Nordeste, transformando 181 toneladas de algodão em fios novos na fábrica de João Pessoa. O jeans reciclado circular será disponibilizado nas lojas da rede a partir de setembro.", "titulo_pt": "Nordeste recebe primeiro hub de reciclagem têxtil em escala industrial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 165007, "titulo": "Cortes na geração de energia solar e eólica superam 60% em 1 a cada 5 dias", "url": "https://www.cnnbrasil.com.br/infra/cortes-na-geracao-de-energia-solar-e-eolica-superam-60-em-1-a-cada-5-dias/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "De acordo com a consultoria Volt Robotics, os cortes na geração de energia solar e eólica superaram 60% nos últimos cinco meses. A geração renovável não utilizada neste período é 18,3% maior do que no mesmo período de 2025, o que poderia suprir todas as residências de São Paulo, Rio de Janeiro e Fortaleza.", "titulo_pt": "Cortes na geração de energia solar e eólica superam 60% em 1 a cada 5 dias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164979, "titulo": "Prédio desaba, deixa 16 mortos e mais de 100 desaparecidos em Gaza", "url": "https://www.metropoles.com/mundo/predio-desaba-deixa-oito-mortos-e-mais-de-60-desaparecidos-em-gaza", "fonte_id": "metropoles", "data_pub": "2026-09-16T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um prédio desabou em Gaza, deixando 16 mortos e mais de 100 desaparecidos. O prédio tinha sido danificado anteriormente por um ataque israelense.", "titulo_pt": "Prédio desaba, deixa 16 mortos e mais de 100 desaparecidos em Gaza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 165590, "titulo": "Green transition requires more than renewable power, Jeju gov. says", "url": "https://www.koreaherald.com/article/10875707", "fonte_id": "korea_herald", "data_pub": "2026-09-16T05:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador de Jeju, Wi Seong-gon, afirmou que a ilha deve avançar além do aumento da capacidade de energia renovável, construindo infraestrutura e indústrias para aproveitar sua energia limpa. Jeju planeja atingir emissões líquidas zero em 2035, 15 anos antes do prazo nacional.", "titulo_pt": "Transição verde exige mais do que energia renovável, diz governo de Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 164863, "titulo": "Governo define regra para abolir licença ambiental em pesquisa de minerais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/governo-define-regra-para-abolir-licenca-ambiental-em-pesquisa-de-minerais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está prestes a criar uma regra nacional que permitirá a realização de atividades de pesquisa de mineração sem a necessidade de licença ambiental. A intenção é acelerar a busca por minerais críticos como terras raras, níquel, nióbio, potássio e fosfato, usados na produção de fertilizantes.", "titulo_pt": "Governo define regra para abolir licença ambiental em pesquisa de minerais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165397, "titulo": "In Venezuela, South America's largest lake is dying from oil pollution", "url": "https://www.lemonde.fr/en/environment/article/2026/09/16/in-venezuela-south-america-s-largest-lake-is-dying-from-oil-pollution_6757570_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T00:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade da água do maior lago da América do Sul, o Lago Maracaibo, tem piorado drasticamente, ameaçando a subsistência de 20.000 pescadores da região.", "titulo_pt": "No veneza, maior lago da américa do sul está em risco devido à poluição de óleo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 166561, "titulo": "Claude comes for Gemini with its own take on Docs and Slides", "url": "https://www.theverge.com/ai-artificial-intelligence/996234/anthropic-one-claude-cowork-docs-slides", "fonte_id": "the_verge", "data_pub": "2026-09-16T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic está lançando duas novas ferramentas chamadas Docs e Slides, que permitem criar documentos e apresentações por meio de conversas com o Claude, que pode ser exportado, editado e compartilhado com outros usuários. Além disso, a Anthropic está simplificando o funcionamento das conversas com o Claude, unificando as chamadas chats normais e o Cowork em uma única interface.", "titulo_pt": "Claude lança Docs e Slides com suas próprias ferramentas de documentos e apresentações", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 166347, "titulo": "Gaza: Building collapse kills 21, including 11 children as perilous conditions persist for Palestinians", "url": "https://www.euronews.com/2026/09/16/gaza-building-collapse-kills-21-including-11-children-as-perilous-conditions-persist-for-p", "fonte_id": "euronews", "data_pub": "2026-09-16T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um edifício residencial desabou em Gaza após danos causados por ataques israelenses anteriores, resultando em pelo menos 21 mortos, incluindo 11 crianças, e várias pessoas desaparecidas.", "titulo_pt": "Gaza: edifício desaba e mata 21, incluindo 11 crianças, em condições perigosas persistentes", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 166425, "titulo": "Mahsa Amini death four years on: Iranians reflect on ‘Woman, Life, Freedom’", "url": "https://www.aljazeera.com/news/2026/9/16/four-years-on-iranians-reflect-on-impact-of-woman-life?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International afirma que autoridades iranianas cometiram crimes contra a humanidade durante as protestos de 2022-2023. Iranianos refletem sobre o caso de Mahsa Amini, que ocorreu há quatro anos.", "titulo_pt": "Quatro anos após a morte de mahsa Amini: iranianos refletem sobre 'mulher, vida, liberdade'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 166309, "titulo": "French PM remains vague on funding to fight gender-based and sexual violence", "url": "https://www.lemonde.fr/en/france/article/2026/09/16/french-pm-remains-vague-on-funding-to-fight-gender-based-and-sexual-violence_6757592_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T13:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro francês, Sébastien Lecornu, mencionou pela primeira vez um 'plano plurianual' de recursos para combater a violência de gênero e sexual em uma coluna de opinião no Le Monde, mas não especificou quais fundos adicionais poderiam ser alocados.", "titulo_pt": "PM francês mantém-se vago sobre financiamento para combater violência de gênero e sexual", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 166353, "titulo": "Four years after Mahsa Amini's death, rights groups warn Tehran's crackdown persists", "url": "https://www.euronews.com/2026/09/16/four-years-after-mahsa-aminis-death-rights-groups-warn-crackdown-persists", "fonte_id": "euronews", "data_pub": "2026-09-16T12:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações de direitos humanos alertam que aqueles que ordenaram a repressão violenta dos protestos de 2022 ainda controlam o aparelho de segurança da Irã. Além disso, negócios kurdos fecharam em regiões natalinas dos protestos e o Relator Especial da ONU afirma que quatro anos de violência estatal não conseguiram apagar a resistência.", "titulo_pt": "Quatro anos após a morte de Mahsa Amini, grupos de direitos humanos alertam sobre a persistência da repressão em teerã", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 166457, "titulo": "Amnesty calls for arrest of 87 Iran officials over 'crimes against humanity' during protests", "url": "https://www.middleeasteye.net/news/amnesty-calls-87-iranian-officials-face-arrest-over-repression-woman-life-freedom-protests", "fonte_id": "middle_east_eye", "data_pub": "2026-09-16T12:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amnesty International pediu a prisão de 87 oficiais iranianos por 'crimes contra a humanidade' em relação à repressão durante as protestos de 2022. O relatório destaca que a guerra entre EUA e Israel está a agravar a repressão no Irão, quatro anos após os protestos Woman Life Freedom.", "titulo_pt": "Amnesty internacional pede prisão de 87 oficiais iranianos por 'crimes contra a humanidade'", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 166304, "titulo": "Hashim Thaçi, former Kosovo president, sentenced to 25 years for war crimes", "url": "https://www.lemonde.fr/en/international/article/2026/09/16/kosovo-former-president- const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

    : "";

    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
