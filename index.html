<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "20/08/2026 23:16", "stats": {"noticias_novas": 1420, "resumos_gerados": 260}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva realizou um evento em Natal, no Rio Grande do Norte, pedindo votos para seus aliados nas eleições e mencionando a necessidade de 'limpeza no Congresso'. O caso Lulinha, relacionado a investigações sobre o Master, pode levar o Supremo Tribunal Federal a decidir se terá ou não competência para investigar um de seus próprios integrantes. Lula lidera com 39,71% das intenções de voto, seguido por Flávio Bolsonaro com 33,04%. A crise na Casas Bahia, com uma dívida de R$ 17,3 bilhões, foi incorporada na disputa eleitoral, sendo usada por candidatos contrários ao governo Lula para criticar a gestão petista. Além disso, o Tribunal Superior Eleitoral proibiu o empresário Pablo Marçal de acessar recursos do fundo eleitoral, participar de debates e aparecer no horário eleitoral em mídias de rádio e televisão, mesmo ele sendo inelegível.", "mundo": "Um terremoto na Colômbia deixou 319 mortos, 260 desaparecidos e 4.506 feridos, levando o Brasil a enviar ajuda humanitária ao país. Em meio a tensões internacionais, a Coreia do Sul pediu à China que desempenhe um papel construtivo nas negociações com a Coreia do Norte. Os Estados Unidos anunciaram novas sanções contra Cuba. A China rejeitou um relatório do Departamento do Tesouro dos EUA que acusa exportadores chineses de enviar mercadorias através do México para evitar tarifas americanas. Além disso, o presidente dos Estados Unidos, Joe Biden, anunciou que espera se encontrar com o líder norte-coreano, Kim Jong-un, após a Coreia do Norte ter realizado o lançamento de aproximadamente 10 mísseis de curto alcance.\n\nA Coreia do Norte realizou lançamentos de mísseis balísticos recentes, mantendo-se em silêncio sobre os testes. Diplomatas sul-coreanos, americanos e japoneses discutiram uma resposta conjunta. Os Estados Unidos intensificaram sanções econômicas contra o Irã, pedindo apoio chinês, e o Irã reagiu condenando as medidas como 'terrorismo econômico'. Israel realizou ataques em áreas do Líbano e da Síria, enquanto o governo britânico condenou comentários do ministro de Segurança Nacional israelense sobre assassinatos em Gaza. A Coreia do Norte também rejeitou propostas de encontros com o presidente dos Estados Unidos, lançando mísseis de curto alcance no mar. Em contraste, o governo ucraniano denunciou a falta de mísseis Patriot, resultando em perdas humanas, enquanto a Rússia intensificou ataques noturnos no país. Além disso, a Coreia do Sul, Estados Unidos e Israel concordaram que Ali Shaath seria o novo líder de Gaza, enquanto o governo francês enfatizou a necessidade de uma forte vontade política para fortalecer suas defesas cibernéticas.", "economia": "A Coreia do Sul enfrenta pressões econômicas, com o mercado de títulos governamentais sendo monitorado de perto devido às altas taxas de juros globais. As exportações sul-coreanas registraram um aumento significativo de 56% no início de agosto, impulsionadas por exportações de semicondutores. As ações de Seul caíram 1,35% em resposta à subida das taxas de juros nos Estados Unidos. No Brasil, o governo Lula planeja discutir o 'Projeto Nuvem Brasileira' com representantes do mercado, enquanto a Petrobras atingiu sua produção máxima no pré-sal. A aviação doméstica brasileira registrou o maior número de passageiros em 26 anos, com 59 milhões de passageiros entre janeiro e julho de 2026. O Programa Move Brasil, Táxi e Aplicativos aumentou o limite de financiamento para veículos novos, incluindo carros híbridos. O Tesouro dos Estados Unidos planeja comprar títulos de longo prazo, mas em pequena escala, em uma tentativa de aliviar preocupações dos investidores. A inadimplência no Brasil está aumentando de forma generalizada, segundo o Citi, e a Oxfam Brasil destaca a ampliação da desigualdade política devido à concentração de riqueza.", "tecnologia": "A tecnologia continua expandindo-se em diversos setores, com destaque para a inteligência artificial (IA) e robótica. A Kakao Corp., empresa sul-coreana, planeja separar sua principal atividade para fortalecer suas capacidades em IA. Durante o primeiro semestre de 2026, a China exportou mais de 40.000 robôs humanoides, representando 97% das exportações globais. O governo federal do Brasil anunciou a alocação de R$ 2,3 bilhões para a infraestrutura de IA e a instalação de um supercomputador no Parque Tecnológico de Macaíba, no Rio Grande do Norte. Segundo o Financial Times, a Nvidia está bem posicionada para beneficiar da próxima fase da explosão da IA. O Google está implementando uma nova funcionalidade que permitirá aos usuários personalizarem sua feed Discover descrevendo o que desejam ver, usando IA para ajustar automaticamente a feed e lembrar das preferências futuramente. Além disso, a Techman exibiu seus braços robóticos em Taipei, Taiwan, e uma exposição tecnológica aconteceu em Taipei, mostrando possíveis avanços tecnológicos para o futuro.", "ciencia": "O evento mais importante dos artigos é o lançamento da missão Chang'e 7 da China, previsto para o fim de semana. A missão, que envolverá múltiplos satélites, buscará evidências de gelo lunar no polo sul da Lua, representando uma importante etapa na exploração lunar. Paralelamente, a NASA propõe uma grande revisão na árvore genealógica da humanidade, com base em novos fósseis e análises evolutivas, questionando a atual divisão entre os principais grupos de hominíneos. Além disso, a Rock West Composites lançará sua nova linha de produtos STRATOPultrusion™ durante a Conferência Small Satellite em agosto de 2026, em Salt Lake City, Utah. A SpaceWERX selecionou 11 empresas para escalar tecnologias para o espaço militar, entre elas Agile Space Industries, Antares Nuclear, EO Solutions, Hydrosat, Kall Morris, Method Security, Muon Space, Scout Space, Sedaro, Star Catcher Industries e ThinkOrbital. Estes desenvolvimentos refletem avanços significativos em diversos campos da ciência e tecnologia espacial.", "cultura": "Em setembro, parlamentares italianos discutirão um projeto de lei que cria uma 'agência para cinema e mídias audiovisuais', mesmo em um período de austeridade orçamentária, com o objetivo de apoiar a indústria cinematográfica. No entanto, o plano manterá poderes significativos nas mãos das autoridades políticas. Em outro desenvolvimento cultural, o Festival Internacional de Linguagem Eletrônica, em sua 26ª edição, está acontecendo no Centro Cultural Fiesp, em São Paulo, abordando a integração de tecnologia, ciência e arte. O evento começou nesta quinta-feira, 20 de outubro, em um momento de discussão sobre o papel da inteligência artificial na cultura. Além disso, o Festival File reúne obras com inteligência artificial e busca a introspecção humana, explorando como a tecnologia pode influenciar a experiência artística.", "sociedade": "Em Caballito, Buenos Aires, mais de 3.400 pessoas buscaram emprego em uma feira de empregos organizada por 30 empresas, que ofereceram mais de 600 vagas. Metade das buscas foi feita por pessoas com mais de 45 anos. Em contraste, um terremoto na Colômbia resultou em uma imagem tocante de profissionais do Hospital Universitário del Valle cuidando de crianças sob as cinzas do desastre, destacando a importância da assistência médica imediata. Em Taiwan, 70% dos residentes consideram as patrulhas do guarda-costas chinês como manifestações de má vontade. Em Bali, um turista suíço foi condenado a um ano de prisão por insultar uma observância sagrada hindu. Na Colômbia, o julgamento de uma mãe acusada de matar seus três filhos está levantando discussões sobre a psicose pós-parto, uma condição psiquiátrica que pode causar alucinações e delírios. Em Korea, o número de centenários quase triplicou nos últimos dez anos, com um aumento particularmente pronunciado entre os homens. A Organização Pan-Americana da Saúde (OPAS) e a Organização Mundial da Saúde (OMS) apoiam a Colômbia na resposta à saúde após um terremoto. Além disso, a UNICEF fortalece a vigilância e a atuação comunitária em resposta à primeira epidemia de mpox registrada em Guiné-Bissau, onde a metade dos casos suspeitos são crianças. No Japão, um médico local está prestando assistência médica aos deslocados em áreas afetadas por terremotos. Finalmente, as firmas de Wall Street estão contratando estudantes cada vez mais cedo, gerando preocupação entre os alunos e executivos, enquanto os trabalhadores migrantes agora podem se beneficiar do auxílio jurídico para acidentes de trabalho em Taiwan.", "meio_ambiente": "A Alemanha registrou 14 mil mortes devido ao calor extremo desde abril, com o pico da mortalidade ocorrido na última semana de junho. O aumento da temperatura tem causado preocupação, especialmente no contexto das mudanças climáticas. Em paralelo, um ambicioso projeto do Ministério do Meio Ambiente do Chile busca descontaminar o Lago Villarrica em 15 anos, com um investimento estimado de US$ 56 milhões. O rápido crescimento da energia solar na China está afetando a diversidade de aves, conforme uma análise recente. Além disso, a falta de fontes de energia com baixo teor de carbono pode dissuadir investimentos em projetos de energia limpa. Em Sremska Mitrovica, na Sérvia, uma estiagem prolongada revelou um barco a vapor de mais de um século no Rio Sava, devido a um nível baixo de água. A escasseza de água em Bosnia e Herzegovina, devido a baixa precipitação e calor intenso, tem levado à insatisfação da população, que está protestando contra o sistema de abastecimento de água sobrecarregado.", "direitos_humanos": "A Organização das Nações Unidas (ONU) alerta que 94% da população de Gaza, que ultrapassa 2,1 milhões de pessoas, necessita de abrigo e assistência básica, com quatro em cada cinco famílias enfrentando níveis 'críticos ou catastróficos' de fome. Em outro desenvolvimento, um caso contra dois policiais, Andrew David Couchman e Ulrich Weiss, que foram acusados de cometer crimes relacionados ao uso de spray pimenta, Taser e restrições em um homem indígena 'cognitivamente e emocionalmente vulnerável' em custódia policial, foi permanentemente arquivado após uma corte identificar 'defeitos' na investigação subsequente. Além disso, um relatório norueguês identificou casos de corrupção e ameaças relacionados a 61 adoções de crianças chilenas enviadas ao Noruega entre 1987 e 2010. Em um protesto em Nova Deli, centenas de tibetanos organizaram uma manifestação em resposta à lei de unidade étnica da China, levando muitos exilados a se rapar os cabelos como forma de expressar sua oposição. Por fim, a Human Rights Watch emitiu um relatório afirmando que o acordo entre Itália e Albânia para a detenção offshore de solicitantes de asilo e migrantes está colocando em risco a segurança, liberdade e direitos humanos dessas pessoas."}, "resumo_do_dia": {"politica_nacional": [{"id": 113513, "titulo": "Veja como foi a quinta-feira (20) dos candidatos a presidente", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/veja-como-foi-quinta-feira-20-dos-candidatos-presidente", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-21T01:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt":  econômicos' com lobista que negociava contratos no governo Lula, diz PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 113905, "titulo": "Investigação sobre Lulinha deve ficar no STF mesmo após pedido da PGR", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-flavia-maia/investigacao-sobre-lulinha-deve-ficar-no-stf-mesmo-apos-pedido-da-pgr", "fonte_id": "jota", "data_pub": "2026-08-20T23:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A expectativa é que André Mendonça mantenha a relatoria dos inquéritos sobre Lulinha no STF, mesmo após o pedido da PGR para que eles passem a ser investigados pela Polícia Federal.", "titulo_pt": "Investigação sobre Lulinha deve ficar no STF mesmo após pedido da PGR", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 113906, "titulo": "Quem são os candidatos ao Senado por Roraima (RR) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-senado-por-roraima-rr-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-20T23:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Treze candidatos estão concorrendo às duas vagas para o Senado Federal do estado de Roraima nas eleições de 2026.", "titulo_pt": "Quem são os candidatos ao Senado por Roraima nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 113555, "titulo": "Mendonça manda remover vídeo com deepfake de Flávio Bolsonaro ao lado de Daniel Vorcaro", "url": "https://g1.globo.com/politica/noticia/2026/08/20/mendonca-manda-remover-video-com-deepfake-de-flavio-bolsonaro-ao-lado-de-daniel-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-20T23:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do Tribunal Superior Eleitoral, determinou a remoção de um vídeo com deepfake envolvendo o senador Flávio Bolsonaro e o ex-dono do Banco Master Daniel Vorcaro. A ww.japantimes.co.jp/news/2026/08/21/asia-pacific/politics/south-korea-china-trump-kim/", "fonte_id": "japan_times", "data_pub": "2026-08-21T01:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores da Coreia do Sul, Cho Hyun, pediu à China que desempenhe um papel construtivo nas negociações. Essa solicitação ocorreu durante uma reunião entre os ministros das Relações Exteriores das duas nações em Seul.", "titulo_pt": "Coreia do sul busca ajuda da China enquanto Trump promove conversas com Kim", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 114399, "titulo": "Terremoto in Colombia, le vittime accertate sono 319", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/21/terremoto-in-colombia-le-vittime-accertate-sono-319_f992fd24-d6ef-45cd-9879-1c1bd901eb24.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-21T01:32:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um terremoto ocorreu na Colômbia, deixando 319 mortos, 260 desaparecidos e 4.506 feridos.", "titulo_pt": "Terremoto na colômbia: 319 mortos, 260 desaparecidos e 4.506 feridos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 114618, "titulo": "S. Korea, U.S., Japan share information, discuss response to N.K. missile launch", "url": "https://en.yna.co.kr/view/AEN20260821003000315", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diplomatas de Coreia do Sul, Estados Unidos e Japão compartilharam informações e discutiram uma resposta conjunta após o lançamento de uma mísseis pela Coreia do Norte.", "titulo_pt": "Coreia do sul, EUA e Japão compartilham informações e discutem resposta ao lançamento de mísseis da Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 113998, "titulo": "After Six Years, Harry and Meghan Are Coming Home. What Changed?", "url": "https://www.nytimes.com/2026/08/20/world/europe/harry-meghan-britain-return.html", "fonte_id": "nyt_world", "data_pub": "2026-08-21T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Harry e Meghan estão retornando à Grã-Bretanha após seis anos. Recentemente, Harry afirmou que não poderia imaginar trazer sua família de volta ao país.", "titulo_pt": "Depois de seis anos, Harry e Meghan voltam para casa. O que mudou?", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 114620, "titulo": "S. Korea to impose antidumping tariffs on Thai seamless copper pipes", "url": "https://en.yna.co.kr/view/AEN20260821002400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul anunciou que irá impor tarifas antidumping às tubos de cobre sem costura provenientes da Tailândia. A decisão foi tomada pelo Ministério da Finanças sul-coreano.", "titulo_pt": "Coreia do sul vai impor tarifas antidumping a tubos de cobre sem costura tailandeses", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114323, "titulo": "Iran war live: US vows toughest Iran sanctions, urges China support", "url": "https://www.aljazeera.com/news/liveblog/2026/8/21/iran-war-live-us-vows-toughest-iran-sanctions-urges-china-support?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Bessent, afirmou que novas medidas econômicas visam derrubar o governo iraniano. Os EUA prometeram sanções mais rigorosas contra o Irã e pediram apoio chinês para isso.", "titulo_pt": "Irã em guerra: EUA prometem sanções mais rigorosas e pedem apoio chinês", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 114483, "titulo": "US charges woman with Isis-inspired plot to blow up New York State Capitol", "url": "https://www.scmp.com/news/world/united-states-canada/article/3364740/us-charges-woman-isis-inspired-plot-blow-new-york-state-capitol?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-20T23:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mulher de 35 anos, Jessica Bowie, foi acusada de tentar fornecer apoio material ao grupo extremista islâmico Estado Islâmico após confessar a um informante do FBI que desejava destruir o Capitólio do Estado de Nova York. O Capitólio, localizado em Albany, é o centro do governo estadual e abriga as duas casas do legislativo do estado.", "titulo_pt": "EUA acusam mulher de plano inspirado no estado islâmico para explodir capitólio de nova York", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 114057, "titulo": "What Does a Trump Endorsement Actually Mean in 2026?", "url": "https://www.theatlantic.com/newsletters/2026/08/what-does-trump-endorsement-mean/688367/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-20T23:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias recentes derrotas de políticos endossados por Trump não representam um grande desvio, mas complicam a narrativa presidencial.", "titulo_pt": "O que um endosso de Trump significa de fato em 2026?", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 114197, "titulo": "Syrian Kurds announce completion of civil and military integration with Damascus", "url": "https://www.lemonde.fr/en/international/article/2026/08/21/syrian-kurds-announce-completion-of-civil-and-military-integration-with-damascus_6756716_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-20T23:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os curdos sírios anunciaram a conclusão da integração civil e militar com Damasco após meses de negociações. Este acordo seguiu um acordo de janeiro que previa a integração completa das instituições curdas ao estado, considerado histórico pelos Estados Unidos.", "titulo_pt": "Curdos sírios anunciam integração civil e militar com damasco", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 114347, "titulo": "Israeli strikes target southern Lebanon and Syria", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-strikes-target-southern-lebanon-and-syria", "fonte_id": "middle_east_eye", "data_pub": "2026-08-20T22:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou ataques em áreas sulistas do Líbano e da Síria. Segundo a Al Jazeera, tiros de artilharia foram direcionados para áreas agrícolas perto do vilarejo de Jubata al-Khashab, na Síria, e para altitudes próximas ao Líbano.", "titulo_pt": "Ataques israelenses visam sul do líbano e síria", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 114058, "titulo": "An Unsettling Glimpse Into the GOP’s Future", "url": "https://www.theatlantic.com/politics/2026/08/james-fishback-republican-young-voters-florida/688366/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-20T22:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "James Fishback perdeu nas eleições na Flórida, mas demonstrou que há apoio a atitudes de ódio entre os jovens republicanos.", "titulo_pt": "Uma visão incômoda do futuro do GOP", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 114629, "titulo": "(EDITORIAL from Korea JoongAng Daily on Aug. 21)", "url": "https://en.yna.co.kr/view/AEN20260821001000315", "fonte_id": "yonhap_news", "data_pub": "2026-08-20T22:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A unidade da Hyundai Motor anunciou uma greve geral de oito horas para o próximo Friday.", "titulo_pt": "EDITORIAL sobre greve geral da unidade da hyundai motor", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114630, "titulo": "(EDITORIAL from The Korea Times on Aug. 21)", "url": "https://en.yna.co.kr/view/AEN20260821000900315", "fonte_id": "yonhap_news", "data_pub": "2026-08-20T22:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que espera se encontrar com o líder da Coreia do Norte.", "titulo_pt": "EDITORIAL: trump anuncia expectativa de encontro com líder norte-coreano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114631, "titulo": "(EDITORIAL from The Korea Herald on Aug. 21)", "url": "https://en.yna.co.kr/view/AEN20260821000800315", "fonte_id": "yonhap_news", "data_pub": "2026-08-20T22:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de títulos agora oferece sinais de que a dívida pode não ser tão inofensiva quanto era considerada nos anos anteriores, devido à abundância de crédito barato.", "titulo_pt": "EDITORIAL do The Korea Herald sobre a percepção da dívida", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114632, "titulo": "N. Korea remains silent over latest missile launches", "url": "https://en.yna.co.kr/view/AEN20260821000600315", "fonte_id": "yonhap_news", "data_pub": "2026-08-20T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul, 21 de agosto (Yonhap) -- Coreia do Norte manteve-se em silêncio sobre os lançamentos de mísseis balísticos recentes.", "titulo_pt": "Coreia do norte permanece em silêncio sobre lançamentos de mísseis recentes", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 113909, "titulo": "Quem são os candidatos a governador do Distrito Federal (DF) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governador-do-distrito-federal-df-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-20T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Onze políticos se apresentaram como candidatos ao cargo de governador do Distrito Federal nas eleições de 2026. A lista inclui nomes de diferentes partidos e tendências políticas.", "titulo_pt": "Quem são os candidatos a governador do Distrito Federal nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 114263, "titulo": "CNBC Daily Open: Watching Iran's economy; a losing game for bonds", "url": "https://www.cnbc.com/2026/08/21/trump-bessent-treasury-bond-buyback-iran-walmart-moderna-bitcoin-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-21T01:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, afirmou que os Estados Unidos provavelmente não precisarão retomar uma grande escalada de conflito com o Irã. O Irã enfrenta dificuldades econômicas, mas o governo dos EUA não planeja uma ação militar significativa contra o país.", "titulo_pt": "CNBC diário aberto: monitorando a economia do Irã; um jogo perdedor para os títulos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 114617, "titulo": "S. Korea to monitor impact of rising bond yields around globe", "url": "https://en.yna.co.kr/view/AEN20260821002900320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T01:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul vai monitorar de perto o impacto das taxas de juros das dívidas soberanas globais em seu mercado de títulos governamentais.", "titulo_pt": "Coreia do sul vai monitorar impacto de taxas de juros das dívidas soberanas globais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114621, "titulo": "Doosan Enerbility wins 930 bln-won gas plant deal in Oman", "url": "https://en.yna.co.kr/view/AEN20260821002700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T00:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana Doosan Enerbility venceu um contrato de 930 bilhões de ienes para construir uma planta de gás em Omã.", "titulo_pt": "Doosan Enerbility vence contrato de 930 bilhões de ienes para planta de gás em omã", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114396, "titulo": "Panama Canal to cut daily transits as El Niño grips region", "url": "https://www.ft.com/content/25715859-f7a6-4da8-9e75-775610080b94?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T00:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Autoridade do Canal de Panamá planeja reduzir o número de transits diários pela segunda vez, devido à influência do El Niño na região.", "titulo_pt": "Panamá Canal reduzirá transits diários devido ao El Niño", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 114594, "titulo": "Exports up 56% in first 20 days of Aug. on robust chip shipments", "url": "https://www.koreaherald.com/article/10847622", "fonte_id": "korea_herald", "data_pub": "2026-08-21T00:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações sul-coreanas aumentaram 56% em relação ao mesmo período do ano anterior nos primeiros 20 dias de agosto, com as exportações de semicondutores atingindo um novo recorde. O superávit comercial foi de $14 bilhões.", "titulo_pt": "Exportações sul-coreanas aumentam 56% nos primeiros 20 dias de agosto, impulsionadas por exportações de semicondutores", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 114626, "titulo": "Exports up 56 pct in first 20 days of Aug.", "url": "https://en.yna.co.kr/view/AEN20260821002000320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T00:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações da Coreia do Sul aumentaram 56% nos primeiros 20 dias de agosto em comparação com o mesmo período do ano anterior.", "titulo_pt": "Exportações da Coreia do sul crescem 56% nos primeiros 20 dias de agosto", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114627, "titulo": "(URGENT) Seoul shares open 1.35 pct lower as U.S. bond yields climb again", "url": "https://en.yna.co.kr/view/AEN20260821001500320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T00:01:00Z", "idioma": "en", "provavel_duplicata_de": 114593, "texto_pt": "As ações de Seul abriram com uma queda de 1,35%, influenciadas pela elevação das taxas de juros dos Estados Unidos novamente.", "titulo_pt": "Seul abre com queda de 1,35% diante de alta das taxas de juros nos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114389, "titulo": "What is Bessent doing with the $32tn Treasury market — and will it work?", "url": "https://www.ft.com/content/14b25583-c64d-4a97-9f6d-359908638e28?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-20T23:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos Estados Unidos fez uma aposta de alto risco ao tentar contornar os elevados custos de empréstimo. Seu plano envolve a manipulação do mercado de títulos do Tesouro em escala monumental, estimado em 32 trilhões de dólares.", "titulo_pt": "O que Bessent está fazendo com o mercado de títulos do tesouro de 32 trilhões de dólares — e vai funcionar?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 113908, "titulo": "Governo Lula chamará mercado para discutir Nuvem Brasileira", "url": "https://www.jota.info/executivo/governo-lula-chamara-mercado-para-discutir-nuvem-brasileira", "fonte_id": "jota", "data_pub": "2026-08-20T22:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula pretende realizar uma reunião com representantes do mercado para discutir a criação da 'Nuvem Brasileira', uma parceria entre setores público e privado com o objetivo de desenvolver infraestrutura para armazenamento e processamento de dados.", "titulo_pt": "Governo Lula chamará mercado para discutir Nuvem Brasileira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 113910, "titulo": "Ex-CFO do Itaú Alexsandro Broedel é condenado a pagar R$ 2,83 milhões ao banco", "url": "https://www.jota.info/justica/ex-cfo-do-itau-alexsandro-broedel-foi-condenado-a-pagar-r-283-milhoes-ao-banco", "fonte_id": "jota", "data_pub": "2026-08-20T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexsandro Broedel, ex-CFO do Itaú, foi condenado a pagar R$ 2,83 milhões ao banco. Segundo a acusação, Broedel recebeu de volta 40% do valor pago pelo banco a um consultor contratado por ele mesmo.", "titulo_pt": "Ex-cfo do Itaú Alexsandro Broedel é condenado a pagar R$ 2,83 milhões ao banco", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 113544, "titulo": "Navio-plataforma da Petrobras atinge produção máxima no pré-sal", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/navio-plataforma-da-petrobras-atinge-producao-maxima-no-pre-sal", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-20T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O navio-plataforma Alexandre de Gusmão, localizado no Campo de Mero, no pré-sal da Bacia de Santos, atingiu sua produção máxima de 180 mil barris de óleo por dia. O Campo de Mero é o terceiro maior produtor de petróleo do Brasil, após Búzios e Tupi.", "titulo_pt": "Navio-plataforma da Petrobras atinge produção máxima no pré-sal", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 113545, "titulo": "SP: Enel apresenta alegações finais contra caducidade da concessão", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/sp-enel-apresenta-alegacoes-finais-contra-caducidade-da-concessao", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-20T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Enel SP apresentou as alegações finais no processo de recomendação de caducidade do contrato de concessão, iniciado pela Aneel em abril. A Aneel alega que a distribuidora não regularizou as falhas relacionadas ao fornecimento de energia elétrica interrompido entre 2023 e 2025.", "titulo_pt": "SP: enel apresenta alegações finais contra caducidade da concessão", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 113546, "titulo": "Aviação doméstica brasileira tem a maior movimentação em 26 anos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/aviacao-domestica-brasileira-tem-maior-movimentacao-em-26-anos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-20T19:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "De janeiro a julho de 2026, a aviação doméstica brasileira registrou 59 milhões de passageiros, o maior número para o período desde 2000. Isso representa um crescimento de 4,04% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Aviação doméstica brasileira atinge recorde em movimentação de passageiros", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 113547, "titulo": "Crédito para carros de aplicativo tem teto elevado para R$ 200 mil", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/credito-para-carros-de-aplicativo-tem-teto-elevado-para-r-200-mil", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-20T18:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Programa Move Brasil, Táxi e Aplicativos aumentou o limite de financiamento para veículos novos e incluiu carros híbridos entre os modelos elegíveis. A mudança foi oficializada por meio de uma portaria conjunta dos Ministérios do Desenvolvimento, Indústria, Comércio e Serviços (MDIC) e da Fazenda.", "titulo_pt": "Crédito para carros de aplicativo tem teto elevado para R$ 200 mil", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 114394, "titulo": "Quant funds rocked as Treasury boosts buybacks and Moderna shares leap", "url": "https://www.ft.com/content/d3fbfcb7-ce89-4b46-8267-c2fed9c67134?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-20T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A sessão tumultuada aumentou a pressão sobre as apostas de momentum, que já vinham sendo instáveis desde a venda de ações relacionadas ao AI. O Tesouro americano aumentou as compras de ações e as ações da Moderna dispararam.", "titulo_pt": "Fundos quant em tumulto com compras de ações do tesouro e ações da Moderna disparando", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 113767, "titulo": "Ibovespa fecha estável mesmo com forte alta de Vale e Petrobras", "url": "https://exame.com/invest/mercados/ibovespa-fecha-estavel-mesmo-com-forte-alta-de-vale-e-petrobras/", "fonte_id": "exame", "data_pub": "2026-08-20T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa encerrou estável apesar das fortes altas de Vale e Petrobras. O dólar subiu de valor devido a condições externas desfavoráveis e saída de investimentos estrangeiros.", "titulo_pt": "Ibovespa fecha estável com forte alta de Vale e Petrobras, enquanto dólar sobe", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 114615, "titulo": "Kakao Corp. to spinoff core biz to strengthen AI capabilities", "url": "https://en.yna.co.kr/view/AEN20260821004200320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T01:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana Kakao Corp. planeja separar sua principal atividade para fortalecer suas capacidades em inteligência artificial.", "titulo_pt": "Kakao Corp. Planeja separar sua principal atividade para fortalecer suas capacidades em inteligência artificial", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114477, "titulo": "In the embodied AI race, China can opt to look beyond bigger models", "url": "https://www.scmp.com/opinion/china-opinion/article/3364420/embodied-ai-race-china-can-opt-look-beyond-bigger-models?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mundo assistiu a avanços significativos nas capacidades de robôs nos últimos anos. Embora os robôs agora possam caminhar, dançar, correr e realizar movimentos cada vez mais sofisticados, essas demonstrações impressionantes não necessariamente equivalem a valor comercial. Um desafio comum enfrentado por todos os players, incluindo a indústria de robótica embotada chinesa, é a obtenção de dados suficientes para a adoção ampla dos robôs.", "titulo_pt": "Na corrida de inteligência artificial corporal, a China pode optar por olhar além de modelos maiores", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 114616, "titulo": "(LEAD) Philip Morris to launch VEEV e-vapor product in S. Korea", "url": "https://en.yna.co.kr/view/AEN20260821002551320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T01:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Philip Morris Korea planeja lançar o produto de vapor eletrônico VEEV no mercado sul-coreano. A empresa anunciou a intenção de lançamento nesta sexta-feira.", "titulo_pt": "Philip Morris planeja lançar produto de vapor eletrônico VEEV no mercado sul-coreano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 114619, "titulo": "Samsung Electronics wins 45 awards at 2026 IDEA", "url": "https://en.yna.co.kr/view/AEN20260821002800320", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T01:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electronics conquistou 45 prêmios no IDEA de 2026. A empresa anunciou a informação em Seul, Coreia do Sul, em 21 de agosto.", "titulo_pt": "Samsung Electronics vence 45 prêmios no IDEA de 2026", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 113543, "titulo": "RN vai abrigar supercomputador brasileiro de Inteligência Artificial", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/rn-vai-abrigar-supercomputador-brasileiro-de-inteligencia-artificial", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-21T00:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal adquirirá um supercomputador de inteligência artificial por cerca de R$ 1 bilhão, com recursos do Fundo Nacional de Desenvolvimento Científico e Tecnológico, e o Parque Científico e Tecnológico Augusto Severo, na região metropolitana de Natal, será o local escolhido para abrigá-lo.", "titulo_pt": "RN vai abrigar supercomputador brasileiro de Inteligência Artificial", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 113656, "titulo": "EUA planejam mil lançamentos espaciais anuais até 2030", "url": "https://www.cnnbrasil.com.br/ciencia/eua-planejam-mil-lancamentos-espaciais-anuais-ate-2030/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T00:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos planejam realizar mil lançamentos espaciais anuais até 2030, com o objetivo de aumentar a participação de empresas privadas como Blue Origin e SpaceX e fortalecer a competitividade dos EUA em relação à China.", "titulo_pt": "EUA planejam mil lançamentos espaciais anuais até 2030", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 114575, "titulo": "China's humanoid robot shipments hit 40,000 in the first half of 2026", "url": "https://www.digitimes.com/news/a20260820PD225/china-humanoid-robot-shipments-development-2026.html", "fonte_id": "digitimes", "data_pub": "2026-08-20T22:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China exportou mais de 40.000 robôs humanoides no primeiro semestre de 2026, representando 97% das exportações globais, de acordo com um relatório de desenvolvimento divulgado na 2026 World Robot Conference em Beijing.", "titulo_pt": "Exportações de robôs humanoides chineses ultrapassam 40.000 no primeiro semestre de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 114515, "titulo": "Google Discover is getting an AI chatbot-tuned feed", "url": "https://www.theverge.com/tech/983088/google-discover-ai-chatbot-feed", "fonte_id": "the_verge", "data_pub": "2026-08-20T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Google está implementando uma nova funcionalidade que permitirá aos usuários personalizarem sua feed Discover descrevendo o que desejam ver. A ferramenta, que estará disponível em breve no aplicativo Google, usará inteligência artificial para ajustar automaticamente a feed e lembrar das preferências futuramente.", "titulo_pt": "Google Discover ganhará uma feed ajustada por um assistente de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 114546, "titulo": "The Galaxy’s Fastest Star Could Reveal the Secrets of a Supermassive Black Hole", "url": "https://www.wired.com/story/the-galaxys-fastest-star-could-reveal-the-secrets-of-a-supermassive-black-hole/", "fonte_id": "wired", "data_pub": "2026-08-20T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estrela S301 passa perto do buraco negro supermassivo Sagitário A*, o que pode revelar como a rotação do buraco negro distorce o espaço-tempo ao seu redor.", "titulo_pt": "A estrela mais rápida do Galaxy poderia desvendar os mistérios de um buraco negro supermassivo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 113759, "titulo": "Governo anuncia R$ 2,3 bilhões para infraestrutura de IA e supercomputador no Brasil", "url": "https://exame.com/brasil/governo-anuncia-r-23-bilhoes-para-infraestrutura-de-ia-e-supercomputador-no-brasil/", "fonte_id": "exame", "data_pub": "2026-08-20T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo anunciou a alocação de R$ 2,3 bilhões para a infraestrutura de inteligência artificial e para a instalação de um supercomputador no Brasil. O supercomputador será instalado na região do Parque Tecnológico de Macaíba, a cerca de 30 quilômetros de Natal.", "titulo_pt": "Governo anuncia R$ 2,3 bilhões para infraestrutura de IA e supercomputador no Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 114548, "titulo": "Silicon Valley Doesn't Get Why You Hate AI", "url": "https://www.wired.com/story/silicon-valley-doesnt-get-why-you-hate-ai/", "fonte_id": "wired", "data_pub": "2026-08-20T18:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes tecnológicos não parecem compreender as preocupações sociais sobre a inteligência artificial, mas continuam a postar sobre o assunto de qualquer maneira.", "titulo_pt": "Silicon Valley não entende por que você odia a IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 113768, "titulo": "Startup de chips de IA dobra valuation para US$ 21 bilhões após aporte de US$ 700 milhões", "url": "https://exame.com/inteligencia-artificial/startup-de-chips-de-ia-dobra-valuation-para-us-21-bilhoes-apos-aporte-de-us-700-milhoes/", "fonte_id": "exame", "data_pub": "2026-08-20T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup de chips de IA Etched dobrou sua avaliação para US$ 21 bilhões após receber um aporte de US$ 700 milhões liderado pela Jane Street. A empresa testou seu hardware para cargas de trabalho de inteligência artificial.", "titulo_pt": "Startup de chips de IA dobra valuation para US$ 21 bilhões após aporte de US$ 700 milhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 114393, "titulo": "Nvidia looks well placed to benefit from the next stage of the AI boom", "url": "https://www.ft.com/content/b388be2e-67bd-4056-abd2-234e17819a98?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-20T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está utilizando sua folha de pagamento para semear novos mercados e um novo modelo de negócio. A empresa, que é a maior fabricante de chips do mundo, está bem posicionada para beneficiar da próxima fase da explosão da inteligência artificial.", "titulo_pt": "Nvidia está bem posicionada para beneficiar da próxima fase da explosão da inteligência artificial", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 114521, "titulo": "Framework says it’s addressing a BIOS update that bricked some of its older laptops", "url": "https://www.theverge.com/gadgets/982800/framework-laptop-13-amd-7040-bios-320-bricking-warranty", "fonte_id": "the_verge", "data_pub": "2026-08-20T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns proprietários do Framework Laptop 13 com processadores AMD antigos relataram que uma atualização recente da BIOS está danificando seus laptops tanto no Windows quanto no Linux. A versão da BIOS que está causando esse problema é a 3.20 para placas-mãe da série Ryzen 7040, lançada em julho e ainda disponível no site da Framework.", "titulo_pt": "Framework diz que está resolvendo atualização da BIOS que danificou alguns de seus laptops antigos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 114266, "titulo": "AI data center outrage is showing up everywhere from ads to elections", "url": "https://www.cnbc.com/2026/08/20/ai-data-center-election-backlash.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-20T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com menos de três meses para as eleições legislativas, oposição a centrais de dados de IA está se tornando um grito comum entre os dois principais partidos em vários estados.", "titulo_pt": "Oposição a centrais de dados de IA está se espalhando em eleições e anúncios", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 114510, "titulo": "Debates 4724, "titulo": "Elve qualifies millimeter-wave amplifiers for spaceflight", "url": "https://spacenews.com/elve-qualifies-millimeter-wave-amplifiers-for-spaceflight/", "fonte_id": "spacenews", "data_pub": "2026-08-20T22:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup californiana Elve validou sua plataforma de amplificador de ondas milimétricas de 100 watts de tubo de onda viajante para o espaço. O projeto foi financiado pelo Programa de Inovação em Pequenas Empresas da Força Espacial dos EUA.", "titulo_pt": "Elve habilita amplificadores de ondas milimétricas para viagem espacial", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 114725, "titulo": "SpaceWERX selects 11 firms to scale technologies for military space", "url": "https://spacenews.com/spacewerx-selects-11-firms-to-scale-technologies-for-military-space/", "fonte_id": "spacenews", "data_pub": "2026-08-20T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceWERX selecionou 11 empresas para escalar tecnologias para o espaço militar. As empresas escolhidas são Agile Space Industries, Antares Nuclear, EO Solutions, Hydrosat, Kall Morris, Method Security, Muon Space, Scout Space, Sedaro, Star Catcher Industries e ThinkOrbital.", "titulo_pt": "Spacewerx seleciona 11 empresas para escalar tecnologias para o espaço militar", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 113577, "titulo": "Ciclopes existem, sim", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/08/ciclopes-existem-sim.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-20T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A autora relata sua curiosidade na adolescência sobre a falta de imaginação nas representações de extraterrestres. Ela explica que, como neurocientista, entende que não há um centro específico de imaginação no cérebro, mas sim a reorganizaçã ulo": "Rocket Lab launches 9th satellite for iQPS", "url": "https://spacenews.com/rocket-lab-launches-9th-satellite-for-iqps/", "fonte_id": "spacenews", "data_pub": "2026-08-20T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rocket Lab lançou mais um satélite para a empresa japonesa de imagens por radar iQPS em 20 de agosto. Este foi o 9º satélite lançado pela Rocket Lab para a iQPS.", "titulo_pt": "Rocket Lab lança 9º satélite para iqps", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 114701, "titulo": "Europe’s summer of wildfires is just a taste of what’s to come", "url": "https://www.scientificamerican.com/article/europes-summer-of-wildfires-is-just-a-taste-of-whats-to-come/", "fonte_id": "scientific_american", "data_pub": "2026-08-20T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo indica que a área da Europa afetada por incêndios florestais pode triplicar. O verão europeu de incêndios florestais atuais seria apenas uma amostra do que está por vir.", "titulo_pt": "Verão europeu de incêndios florestais: apenas o começo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 113578, "titulo": "Estrela mais rápida já registrada orbita buraco negro no centro da Via Láctea", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/estrela-mais-rapida-ja-registrada-orbita-buraco-negro-no-centro-da-via-lactea.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-20T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas detectaram a estrela mais rápida já conhecida orbitando o buraco negro supermassivo Sagitário A* no centro da Via Láctea. Este objeto pode permitir pela primeira vez a medição da rotação deste buraco negro.", "titulo_pt": "Estrela mais rápida já registrada orbita buraco negro no centro da Via Láctea", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 114702, "titulo": "Orbital data centers could transform our night sky forever", "url": "https://www.scientificamerican.com/article/orbital-data-centers-could-transform-our-night-sky-forever/", "fonte_id": "scientific_american", "data_pub": "2026-08-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sem intervenções drásticas, centros de dados no espaço poderiam interferir em observações científicas e ecossistemas frágeis ao adicionarem incontáveis novas 'estrelas' ao céu noturno.", "titulo_pt": "Centros de dados orbitais poderiam transformar para sempre nosso céu noturno", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 114728, "titulo": "Moog Highlights Huntsville Expansion and New Hardware-in-the-Loop Lab During Space and Missile Defense Symposium", "url": "https://spacenews.com/moog-highlights-huntsville-expansion-and-new-hardware-in-the-loop-lab-during-space-and-missile-defense-symposium/", "fonte_id": "spacenews", "data_pub": "2026-08-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Moog Inc. anunciou uma expansão significativa em sua instalação em Huntsville, AL, que agora inclui um novo laboratório seguro de Hardware-in-the-Loop (HWIL) para hipersônicos e interceptores. Durante o Symposium de Defesa Espacial e Missíliada, a empresa destacou essa expansão e o novo laboratório.", "titulo_pt": "Moog destaca expansão em Huntsville e novo laboratório hwil durante Symposium de defesa espacial e missíliada", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 114201, "titulo": "'Lanterns' on HBO Max: Not your shiny saviors", "url": "https://www.lemonde.fr/en/culture/article/2026/08/21/lanterns-on-hbo-max-not-your-shiny-saviors_6756717_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T00:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série inspirada no 'Green Lantern', um dos quadrinhos de super-heróis m rasil", "classe": "A"}, {"id": 114198, "titulo": "France joins European powers in call for Israel to halt West Bank settlement plan", "url": "https://www.lemonde.fr/en/international/article/2026/08/20/france-joins-european-powers-in-call-for-israel-to-halt-west-bank-settlement-plan_6756712_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-20T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Franceses, britânicos, alemães e italianos condenaram o governo israelense por abrir licitações para construir mais de 1.200 casas em um plano de colonização controverso na Cisjordânia, aprovado no ano anterior.", "titulo_pt": "França se junta a potências europeias na condenação do plano de expansão de assentamentos israelense na cisjordânia", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 113495, "titulo": "'Justino' é cinema popular e retrata ascensão e ruína de pastor gay", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/justino-e-cinema-popular-e-retrata-ascensao-e-ruina-de-pastor-gay.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-20T18:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Justino' é um exemplo de cinema popular que retrata a ascensão e a queda de um pastor gay, nome real não sendo usado para preservar o anonimato. A série 'Brasil 70 - A Saga do Tri' utiliza nomes conhecidos do público em suas ficções, sem necessariamente ser fiel aos fatos reais.", "titulo_pt": "Justino: filme popular sobre pastor gay e série 'Brasil 70 - a saga do tri' usam nomes conhecidos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 113496, "titulo": "Músico de Israel traduz clássicos de Beethoven e Mozart em samba", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/musico-de-israel-traduz-classicos-de-beethoven-e-mozart-em-samba.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-20T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O músico israelense Amitai Kurtz lançou um disco intitulado 'Mas Ele Nasceu no Brasil', onde transformou melodias clássicas de compositores como Beethoven, Mozart, Tchaikovsky e Chopin em sambas. O projeto visa explorar a possibilidade de esses compositores terem nascido no Brasil.", "titulo_pt": "Músico israelense traduz clássicos de Beethoven e Mozart em samba", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 114061, "titulo": "Another Pot of Paint Thrown in the Public’s Face", "url": "https://www.theatlantic.com/technology/2026/08/matisse-sf-moma-ai/688328/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-20T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo questiona se a inteligência artificial realmente tem seu lugar em uma galeria de arte.", "titulo_pt": "Outra tinta lançada no rosto do público", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 113498, "titulo": "Com suas pedras, Denise Milan explora o drama da matéria em nova mostra", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/com-suas-pedras-denise-milan-explora-o-drama-da-materia-em-nova-mostra.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-20T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na nova exposição de Denise Milan, intitulada 'Elementares', no Museu de Arte Sacra de São Paulo, as pedras são o tema central, representando tanto o caminho quanto a origem do trabalho artístico.", "titulo_pt": "Com suas pedras, Denise Milan explora o drama da matéria em nova mostra", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 113499, "titulo": "Festival File reúne obras com inteligência artificial e busca a introspecção humana", "url": "http
