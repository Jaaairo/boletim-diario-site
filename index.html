squisa indica que as empresas de tecnologia estão tomando medidas climáticas, mas não rapidamente o suficiente para compensar a crescente demanda energética associada ao boom da inteligência artificial.", "titulo_pt": "Aumento do AI está testando as promessas climáticas das empresas de tecnologia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142543, "titulo": "STAT+: FDA pilot offers generative AI medical devices a path to patients before they are authorized", "url": "https://www.statnews.com/2026/09/03/tempo-fda-pilor-generative-ai-medical-device-regulation/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O FDA (Agência de Vigilância Sanitária dos EUA) aceitou quatro dispositivos de IA entre eles os produtos de Cadence e Limbic no piloto TEMPO, que permitirá que empresas de saúde digital lancem seus produtos sem autorização de marketing.", "titulo_pt": "FDA piloto oferece caminho para dispositivos médicos de IA cheguem aos pacientes sem autorização", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 142544, "titulo": "Opinion: STAT+: A surprising bright spot at the FDA on regulating unproven stem cells", "url": "https://www.statnews.com/2026/09/03/stem-cell-clinics-fda-cber-warning-letters-marketing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colunista Paul Knoepfler, do STAT Lab Dish, destaca que os sucessos recentes na regulação de células-tronco não comprovadas pela FDA são surpreendentes, dignos de discussão e até mesmo de celebração.", "titulo_pt": "Opinião: um ponto positivo surpreendente na regulação de células-tronco não comprovadas pela FDA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 142545, "titulo": "Opinion: I was a doula before I was an OB-GYN. I wish the two professions understood each other more", "url": "https://www.statnews.com/2026/09/03/doula-turned-ob-gyn-birth-plan-disappointment-urgency/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Debra Eluobaju, que foi doula antes de se tornar obstetra, afirma que muitos conflitos na assistência materna decorrem de uma simples falta de compreensão entre as duas profissões.", "titulo_pt": "Opinião: eu fui doula antes de ser obstetra. Eu espero que as duas profissões se entendam melhor", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 142546, "titulo": "The pediatricians who take in vaccine-skeptical parents others won’t", "url": "https://www.statnews.com/2026/09/03/vaccine-hesitant-parents-how-pediatrician-builds-trust/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pediatras em uma 'última opção' focam em aliviar as preocupações dos pais sobre vacinas sem rejeições rígidas. Esses profissionais atendem pais hesitantes em relação às vacinas que são rejeitados por outros médicos.", "titulo_pt": "Os pediatras que atendem pais hesitantes em relação às vacinas que outros não aceitam", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 142564, "titulo": "Rare trio of Pacific hurricanes fueled by historic El Niño", "url": "https://phys.org/news/2026-09-rare-trio-pacific-hurricanes-fueled.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três hurricanes raramente vistos estavam se formando no Oceano Pacífico na quinta-feira, de acordo com cientistas, que atribuíram o fenômeno a águas aquecidas por um El Niño historicamente forte.", "titulo_pt": "Tríade rara de hurricanes no pacífico alimentada por El Niño histórico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142566, "titulo": "Underwater meadows sustain millions in extreme poverty", "url": "https://phys.org/news/2026-09-underwater-meadows-sustain-millions-extreme.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa fornece a primeira evidência empírica em grande escala de que os mares de seagrass desempenham um papel crítico como rede de segurança para milhões de pessoas costeiras vivendo em extrema pobreza na região Indo-Pacífico.", "titulo_pt": "Meados submarinos sustentam milhões em extrema pobreza", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142593, "titulo": "Hubble's superbubble scene", "url": "https://www.esa.int/ESA_Multimedia/Images/2026/09/Hubble_s_superbubble_scene", "fonte_id": "esa_space", "data_pub": "2026-09-03T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem exibida é uma vista espalhada do Grande Nuvem de Magalhães (LMC), uma das galáxias menores que orbitam a Via Láctea. A nebulosa N44, localizada na constelação Dorado, é conhecida por sua vasta cavidade central e por uma camada de gás denso e fétido.", "titulo_pt": "-Scenes de superbolha do hubble", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 142567, "titulo": "Biodegradable 'nanobone' could one day help regrow bone without painful grafts", "url": "https://phys.org/news/2026-09-biodegradable-nanobone-day-regrow-bone.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Sydney desenvolveram um material biodegradável chamado 'nanobone' que permite que o corpo utilize suas próprias propriedades de cura para regenerar ossos, oferecendo uma possível alternativa futura a cirurgias de transplante de ossos invasivas que não mudaram significativamente há mais de 50 anos.", "titulo_pt": "Boneco biodegradável 'nanobone' poderia um dia ajudar a regenerar ossos sem transplantes dolorosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142585, "titulo": "APOD: 2026 September 3 – The Eclipse and the Stork", "url": "https://science.nasa.gov/image-article/apod-2026-september-3-the-eclipse-and-the-stork/", "fonte_id": "nasa_news", "data_pub": "2026-09-03T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 3 de setembro de 2026 mostra um eclipse solar acompanhado por um estor (pássaro).", "titulo_pt": "Eclipse e estor - 3 de setembro de 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 142547, "titulo": "Why are drug overdose deaths declining?", "url": "https://www.statnews.com/2026/09/03/drug-overdose-deaths-down-sharply-commonwealth-fund-study/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório recente sugere que a utilização de naloxona e medidas de redução de danos pode estar contribuindo para a diminuição dos óbitos por overdose de drogas.", "titulo_pt": "Por que as mortes por overdose de drogas estão diminuindo?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 142586, "titulo": "Peatland Fires Darken Skies in Indonesia", "url": "https://science.nasa.gov/missions/aqua/peatland-fires-darken-skies-in-indonesia/", "fonte_id": "nasa_news", "data_pub": "2026-09-03T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia está passando por uma seca e incêndios estão se espalhando na superfície e debaixo do solo, causando uma névoa densa no ar.", "titulo_pt": "Fogos de pântanos escurecem o céu na indonésia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 142053, "titulo": "Tienen seis hijos y viven en la selva: “Los más pequeños aprenden en casa, preparan la tierra y cuidan a los animales”", "url": "https://www.lanacion.com.ar/lifestyle/tienen-seis-hijos-y-viven-en-la-selva-los-mas-pequenos-aprenden-en-casa-preparan-la-tierra-y-cuidan-nid31082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T09:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A família Porter abandonou sua rotina urbana nos Estados Unidos para viver uma vida autosustentável na selva amazônica do Equador. Os mais jovens aprendem em casa, participam da preparação da terra e cuidam dos animais.", "titulo_pt": "Têm seis filhos e vivem na selva: 'os mais novos aprendem em casa, preparam a terra e cuidam dos animais'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 142270, "titulo": "Leaked Spanish report claims 'total permissiveness' of Morocco over Ceuta crisis", "url": "https://www.lemonde.fr/en/international/article/2026/09/03/leaked-spanish-report-claims-total-permissiveness-of-morocco-over-ceuta-crisis_6757116_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório divulgado afirma que alguns policiais marroquinos auxiliaram os cruzamentos para Ceuta, um enclave espanhol, desafiando a insistência do primeiro-ministro espanhol, Pedro Sánchez, de que Rabat não esteve por trás da crise.", "titulo_pt": "Relatório vazado acusa marrocos de 'permissividade total' em relação à crise de Ceuta", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 142595, "titulo": "Emeco sues Zara Home over chairs designed by Norman Foster", "url": "https://www.dezeen.com/2026/09/03/emeco-sues-zara-home-20-06-chair-norman-foster/", "fonte_id": "dezeen", "data_pub": "2026-09-03T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca americana de móveis Emeco iniciou uma ação legal contra a Zara Home por supostamente copiar um cadeirão e uma banqueta projetados pelo arquiteto Norman Foster. A ação foi apresentada no Tribunal Distrital de Hamburg, na Alemanha, este ano.", "titulo_pt": "Emeco processa Zara Home por cópia de cadeirão e banqueta de Norman Foster", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 142272, "titulo": "China urges France to 'halt' fast-fashion law, warns of countermeasures", "url": "https://www.lemonde.fr/en/economy/article/2026/09/03/china-urges-france-to-halt-fast-fashion-law-warns-of-countermeasures_6757115_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China pediu à França para 'interromper' uma lei sobre moda rápida, advertindo sobre possíveis contramedidas. A lei, que entrou em vigor nesta semana, impõe taxas sobre certos itens que eventualmente chegarão a cerca de 20 euros por peça de vestuário, como parte de uma iniciativa para reduzir os impactos ambientais e econômicos locais da indústria.", "titulo_pt": "China pede para França 'interromper' lei sobre moda rápida e ameaça com contramedidas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 142596, "titulo": "Strut table and pouf by Yağmur Köylü for Yet Design Studio", "url": "https://www.dezeen.com/2026/09/03/strut-table-pouf-yagmur-koylu-yet-design-studio-dezeen-showroom/", "fonte_id": "dezeen", "data_pub": "2026-09-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Yet Design Studio, com sede em Istambul e Londres, lançou uma poltrona de apoio e uma mesa feitas de perfis de alumínio utilizados frequentemente na construção. Esses itens fazem parte de uma coleção de três peças que inclui também uma cadeira Strut lançada durante a Milan Design Week de 2025.", "titulo_pt": "Mesa e poltrona strut pela Yet Design Studio", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 142059, "titulo": "El impactante documental que revive un polémico caso en EE.UU. y pone en jaque a la religión", "url": "https://www.lanacion.com.ar/espectaculos/el-impactante-documental-que-revive-un-polemico-caso-en-eeuu-y-pone-en-jaque-a-la-religion-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T09:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trata-se de uma miniserie de três capítulos que reaviva um caso polêmico nos Estados Unidos e desafia a religião. A série, ideal para maratonear em uma tarde, apresenta um caso que ainda não foi resolvido.", "titulo_pt": "O impactante documental que revive um polêmico caso nos EUA e desafia a religião", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 142438, "titulo": "South Korean police seek tycoon behind K-pop supergroup BTS to be indicted", "url": "https://www.scmp.com/news/asia/east-asia/article/3366240/south-korean-police-seek-tycoon-behind-k-pop-supergroup-bts-be-indicted?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia sul-coreana está pedindo que o magnata do entretenimento Bang Si-hyuk, presidente da agência responsável pelo supergrupo de K-pop BTS, seja indiciado por supostas fraudes de investidor. Ele foi referendado para ser indiciado por supostamente violar a Lei de Mercados Financeiros.", "titulo_pt": "Polícia sul-coreana pede indiciamento de magnata do entretenimento por supostas fraudes de investidor", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 142627, "titulo": "The Latest Literary Scam: Emailing the Long-Dead Legends of 20th-Century Literature", "url": "https://lithub.com/the-latest-literary-scam-emailing-the-long-dead-legends-of-20th-century-literature__trashed-2/", "fonte_id": "lithub", "data_pub": "2026-09-03T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nas primeiras décadas da era da IA, milhares de escritores publicados receberam e-mails que começam com uma frase semelhante a essa: 'Prezado Fred, 'Admiro seus romances há muito tempo, mas acho que 'A Malsinistra Brisa' é o melhor ainda.", "titulo_pt": "A última fraude literária: e-mails a legados de grandes escritores do século xx", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 142628, "titulo": "Here’s What to Read Once You Get Through Weird Girl Lit 101", "url": "https://lithub.com/heres-what-to-read-once-you-get-through-weird-girl-lit-101/", "fonte_id": "lithub", "data_pub": "2026-09-03T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Literatura de garota estranha está em alta. Novos livros e títulos antigos estão sendo agrupados como parte de um tipo de personalidade distinto, com presença em vídeos do TikTok, prateleiras de livrarias independentes e em muitas newsletters.", "titulo_pt": "Aqui está o que ler após o curso de literatura da garota estranha 101", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 142629, "titulo": "Landscapes That Tell Stories: On the Power and Personality of Trees", "url": "https://lithub.com/landscapes-that-tell-stories-on-the-power-and-personality-of-trees/", "fonte_id": "lithub", "data_pub": "2026-09-03T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor observou recentemente um grande deslizamento de terra em Oyarei, Shizuoka, conhecido como Oya-kuzure. O desastre afetou significativamente o Abe river, cujo ponto de origem está localizado na área afetada.", "titulo_pt": "Cenários que contam histórias: sobre o poder e a personalidade das árvores", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 142630, "titulo": "Nobody Thought The Ginger Man Would Sell a Single Copy", "url": "https://lithub.com/nobody-thought-the-ginger-man-would-sell-a-single-copy/", "fonte_id": "lithub", "data_pub": "2026-09-03T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "J.P. Donleavy, apelidado de Guts pelos amigos mais próximos, rejeitou as recusas. O autor famoso de 'O Homem Loiro' era originário do Bronx e sabia boxear.", "titulo_pt": "Nenhum pensou que o homem loiro venderia só uma cópia", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 142631, "titulo": "Inside the Tumultuous Private Life of Muhammad Ali Jinnah, Founder of Pakistan", "url": "https://lithub.com/inside-the-tumultuous-private-life-of-muhammad-ali-jinnah-founder-of-pakistan/", "fonte_id": "lithub", "data_pub": "2026-09-03T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muhammad Ali Jinnah, o fundador da Pakistan, se encontrou com a Comissão Simon no lobby do Western Hotel em fevereiro de 1929. Embora fosse um advogado reservado e político gujarati, tudo indicava que ele logo fundaria o primeiro estado islâmico do mundo, a Pakistan.", "titulo_pt": "Dentro da tumultuada vida privada de Muhammad Ali Jinnah, fundador da Pakistan", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 142632, "titulo": "Searching For the Elusive Snow Leopard Deep in the Himalayas", "url": "https://lithub.com/searching-for-the-elusive-snow-leopard-deep-in-the-himalayas/", "fonte_id": "lithub", "data_pub": "2026-09-03T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em janeiro de 2008, na altitude de 16 graus Celsius negativos, o dia estava relativamente quente para o inverno no Vale de Spiti, Himachal Pradesh, na Índia. A região é uma grande garganta que corta profundamente os montes Himalayenses.", "titulo_pt": "Buscando o leopardo da neve elusivo nas alturas dos Himalayas", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 142394, "titulo": "How Vocaloid became the soundtrack to liminal spaces", "url": "https://www.japantimes.co.jp/culture/2026/09/03/music/vocaloid-backrooms-liminal-horror/", "fonte_id": "japan_times", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes que 'Backrooms' se tornasse um filme, o software de sintetizador de voz Vocaloid era a marca dos espaços límicos e desconfortáveis no Japão.", "titulo_pt": "Como o Vocaloid se tornou a trilha sonora de espaços límicos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 142603, "titulo": "‘Ruin and decay bring a chance of rebirth’: Hidetaka Miyazaki on uniting players in a damaged world", "url": "https://www.theguardian.com/games/2026/sep/03/ruin-and-decay-bring-a-chance-of-rebirth-hidetaka-miyazaki-on-uniting-players-in-a-damaged-world", "fonte_id": "guardian_culture", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hidetaka Miyazaki, diretor de jogos como Dark Souls, fala sobre a conexão entre jogadores em um mundo destruído pela próxima jogo multiplayer The Duskbloods, lançado pela FromSoftware. Miyazaki, conhecido por criar jogos desafiadores e inovadores, influenciou o gênero Soulslike, que agora é amplamente difundido.", "titulo_pt": "Ruin e decaimento trazem uma chance de renascimento: hidetaka Miyazaki sobre unir jogadores em um mundo danificado", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 142604, "titulo": "Queens of the Stone Age’s Josh Homme kicked a woman and his ex-wife alleged domestic abuse. Why the cosy makeover?", "url": "https://www.theguardian.com/music/2026/sep/03/josh-homme-newly-cosy-image-makeover-should-not-let-us-forget-his-violent-history", "fonte_id": "guardian_culture", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Josh Homme, vocalista do Queens of the Stone Age, enfrenta acusações de abuso doméstico, incluindo um relato de que ele bateu a cabeça de sua ex-esposa Brody Dalle com força suficiente para fazê-la ver estrelas e teria sonhado com o assassinato dela. Apesar disso, a banda lançou um número de telefone de reclamações para os fãs, sugerindo que os fãs podem ignorar o passado conturbado do artista.", "titulo_pt": "Josh Homme do queens of the Stone Age enfrenta acusações de abuso doméstico, enquanto a banda promove seu novo álbum", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 141943, "titulo": "Homem é preso por ameaçar e manter mulher em cárcere privado no DF", "url": "https://www.metropoles.com/distrito-federal/homem-e-preso-por-ameacar-e-manter-mulher-em-carcere-privado-no-df", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foragido da Justiça foi preso no local de trabalho após a vítima conseguir enviar um pedido de socorro à Polícia Militar do Distrito Federal. A mulher estava sendo mantida em cárcere privado.", "titulo_pt": "Homem é preso por ameaçar e manter mulher em cárcere privado no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142262, "titulo": "Historic first: Older adults now outnumber the youngest children for the first time", "url": "https://www.axios.com/2026/09/03/older-adults-outnumber-youngest-children-globally", "fonte_id": "axios", "data_pub": "2026-09-03T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pela primeira vez na história, as pessoas com 65 anos ou mais superaram as crianças com 5 anos ou menos no mundo inteiro, de acordo com um relatório do Censo dos Estados Unidos. Esta inversão demográfica, causada pela diminuição global da fertilidade e pela maior longevidade, está prevista para aprofundar-se nos próximos décadas.", "titulo_pt": "Primeira vez: idosos agora superam crianças mais novas no mundo inteiro", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 142016, "titulo": "\"Estamos a la deriva\": productores organizan un tractorazo contra Javier Milei durante su visita a Misiones", "url": "https://www.clarin.com/rural/deriva-productores-organizan-tractorazo-javier-milei-visita-misiones_0_dBgllg2KNn.html", "fonte_id": "clarin", "data_pub": "2026-09-03T09:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Productores de erva-mate planejam realizar uma manifestação com seus antigos tratores e caminhões até o hotel de Puerto Iguazú. O Presidente participará do encerramento da Convencion Anual do Instituto Argentino de Executivos de Finanças na próxima sexta-feira.", "titulo_pt": "Estamos a deriva: produtores organizam um tractorazo contra Javier Milei durante sua visita a Misiones", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 142064, "titulo": "La ley es clara: ¿se paga doble la jornada por el Labor Day este 7 de septiembre en Estados Unidos?", "url": "https://www.lanacion.com.ar/estados-unidos/la-ley-es-clara-se-paga-doble-la-jornada-por-el-labor-day-este-7-de-septiembre-en-estados-unidos-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T09:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ICE realizou operações em Nova York que resultaram em um recorde de detenções migratórias, com mais de 50.000 pessoas sendo presas. O Departamento de Segurança Nacional (DHS) não forneceu detalhes específicos sobre as operações, mas elas tiveram um impacto significativo nas comunidades migrantes.", "titulo_pt": "A lei é clara: o dia do trabalho em 7 de setembro nos EUA tem jornada dobrada?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 142066, "titulo": "Felipe Isidro, profesor de educación física: “A partir de los 70 años, las piernas son mucho más importantes para tu salud de lo que crees”", "url": "https://www.lanacion.com.ar/lifestyle/felipe-isidro-profesor-de-educacion-fisica-a-partir-de-los-70-anos-las-piernas-son-mucho-mas-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O professor de educação física Felipe Isidro destaca a importância das pernas na saúde dos idosos a partir dos 70 anos. Ele enfatiza que o treinamento de força é crucial para a autonomia doméstica nessa faixa etária.", "titulo_pt": "Felipe Isidro, professor de educação física: ‘a partir dos 70 anos, as pernas são muito mais importantes para a sua saúde do que você imagina’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 142067, "titulo": "Nerea, albañila: “Me cuesta encontrar trabajo en la construcción y me rechazan por el simple hecho de ser mujer”", "url": "https://www.lanacion.com.ar/lifestyle/nerea-albanila-me-cuesta-encontrar-trabajo-en-la-construccion-y-me-rechazan-por-el-simple-hecho-de-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma jovem espanhola que reside na Austrália relatou sobre suas experiências de trabalho na construção civil e os desafios que enfrenta, incluindo dificuldades em encontrar emprego devido ao seu sexo.", "titulo_pt": "Nerea, albañila: 'me custa encontrar trabalho na construio e me rechazam por ser mulher'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 141993, "titulo": "70% dos brasileiros creem ser possível alfabetizar todas as crianças", "url": "https://www.cnnbrasil.com.br/educacao/70-brasileiros-creem-ser-possivel-alfabetizar-todas-as-criancas-do-pais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T08:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Segundo a pesquisa, 70% dos brasileiros acreditam que é possível alfabetizar todas as crianças, mas apenas 25% consideram que as crianças estejam aprendendo a ler e escrever no ritmo esperado.", "titulo_pt": "70% Dos brasileiros acreditam ser possível alfabetizar todas as crianças", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141994, "titulo": "53% dos brasileiros querem salários maiores para professores, diz pesquisa", "url": "https://www.cnnbrasil.com.br/educacao/53-dos-brasileiros-querem-salarios-maiores-para-professores-diz-pesquisa/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que 53% dos brasileiros desejam aumentos salariais para professores. A remuneração dos docentes é o tema mais importante nas discussões sobre educação, seguido pela formação dos professores em quarto lugar.", "titulo_pt": "53% Dos brasileiros querem salários maiores para professores, mostra pesquisa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141952, "titulo": "Grupo que cadastrava motoristas sem CNHs em apps de transporte é preso", "url": "https://www.metropoles.com/distrito-federal/na-mira/grupo-que-cadastrava-motoristas-sem-cnhs-em-apps-de-transporte-e-preso", "fonte_id": "metropoles", "data_pub": "2026-09-03T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro pessoas foram presas temporariamente por participar de um grupo que cadastrava motoristas sem Carteira Nacional de Habilitação (CNH) em aplicativos de transporte. Segundo a investigação, indivíduos sem habilitação também eram incluídos no sistema.", "titulo_pt": "Grupo que cadastrava motoristas sem CNHs em apps de transporte é preso", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 141999, "titulo": "33% consideram educação como um desafio para jovens no Brasil, diz Ipsos", "url": "https://www.cnnbrasil.com.br/educacao/s33-considera-educacao-como-um-desafio-para-jovens-no-brasil-diz-ipsos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Ipsos revela que 33% das pessoas consideram a educação um desafio para jovens no Brasil. Outros obstáculos mencionados incluem desigualdade e problemas de saúde mental.", "titulo_pt": "33% Consideram educação como desafio para jovens no Brasil, diz pesquisa Ipsos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 142144, "titulo": "Gang violence is not ‘out of control’ in Sydney, police minister says after two shootings in two days", "url": "https://www.theguardian.com/australia-news/2026/sep/03/gang-violence-is-not-out-of-control-in-sydney-police-minister-says-after-two-shootings-in-two-days", "fonte_id": "guardian_world", "data_pub": "2026-09-03T04:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A police minister de Nova South Wales, Yasmin Catley, negou que a violência de gangues esteja fora de controle após dois assassinatos por disparos de arma de fogo em dois dias. Ela afirmou que a polícia tem recursos suficientes para combater os grupos criminosos.", "titulo_pt": "Polícia não está em desvantagem em Sydney, diz ministro após dois assassinatos em dois dias", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 142162, "titulo": "Tiroteo en Minneapolis deja al menos tres muertos y seis heridos, entre ellos tres policías", "url": "https://www.latercera.com/mundo/noticia/tiroteo-en-minneapolis-deja-al-menos-tres-muertos-y-seis-heridos-entre-ellos-tres-policias/", "fonte_id": "la_tercera", "data_pub": "2026-09-03T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um tiroteio ocorreu em Minneapolis, resultando em pelo menos três mortes e seis feridos, entre os quais três policiais. O suspeito morto foi identificado como Carlton Johnson II, de 35 anos, com antecedentes de ameaças violentas com arma de fogo.", "titulo_pt": "Tiroteio em Minneapolis deixa ao menos três mortos e seis feridos, entre eles três policiais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 141661, "titulo": "People upset over Taipei mayor son’s selection for trip", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/03/2003863607", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população de Taipei está insatisfeita com a escolha do filho do prefeito para participar de uma viagem.", "titulo_pt": "Público insatisfeito com seleção do filho do prefeito para viagem", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 141667, "titulo": "Students spending too much time online, survey says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/03/2003863613", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que os alunos estão gastando muito tempo nas redes online. O estudo não fornece detalhes adicionais sobre os resultados ou métodos utilizados.", "titulo_pt": "Estudantes passando muito tempo nas redes online, pesquisa diz", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 141219, "titulo": "Professor é condenado a 7 anos por comparar aluno negro a chimpanzé em AL", "url": "https://www.metropoles.com/brasil/professor-e-condenado-a-7-anos-por-comparar-aluno-negro-a-chimpanze-em-al", "fonte_id": "metropoles", "data_pub": "2026-09-02T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um professor foi condenado a 7 anos de prisão e ao pagamento de R$ 15 mil de indenização por danos morais a um aluno negro de 13 anos, em Alagoas. O incidente ocorreu em fevereiro.", "titulo_pt": "Professor é condenado a 7 anos e indenização por comparar aluno negro a chimpanzé em alagoas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 141265, "titulo": "Milhares de pessoas protestam em Ceuta por crime migratória", "url": "https://www.cnnbrasil.com.br/internacional/milhares-de-pessoas-protestam-em-ceuta-por-crime-migratoria/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas protestaram em Ceuta, um enclave espanhol, exigindo que autoridades expulsassem migrantes que continuavam no local.", "titulo_pt": "Milhares de pessoas protestam em Ceuta contra crime migratório", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 141945, "titulo": "Indonésia: incêndios florestais ameaçam liberar \"bombas\" de carbono", "url": "https://www.metropoles.com/mundo/indonesia-incendios-florestais-ameacam-liberar-bombas-de-carbono", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na Indonésia levantam preocupações sobre a liberação de grandes quantidades de carbono, lembrando a crise de 2015 durante o último 'super El Niño'.", "titulo_pt": "Indonésia: incêndios florestais ameaçam liberar 'bombas' de carbono", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142263, "titulo": "Alaska seeks oil revival while grappling with a warming future", "url": "https://www.axios.com/2026/09/03/alaska-oil-revival-warming-future", "fonte_id": "axios", "data_pub": "2026-09-03T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alaska está buscando revitalizar sua indústria do petróleo, que está em declínio há décadas, enquanto enfrenta os efeitos da aquecimento global, como a derivação rápida de geleiras. O estado serve como um exemplo vivo da dependência de combustíveis fósseis à medida que os impactos climáticos se intensificam.", "titulo_pt": "Alaska busca revitalizar a indústria do petróleo enquanto enfrenta o futuro aquecido", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 141948, "titulo": "Clima: frente fria se afasta, mas nova instabilidade ameaça a Região Sul", "url": "https://www.metropoles.com/brasil/clima-frente-fria-se-afasta-mas-nova-instabilidade-ameaca-a-regiao-sul", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A frente fria que atingiu a Região Sul está se afastando, mas uma nova instabilidade atmosférica está prevista para trazer chuva moderada a forte à região.", "titulo_pt": "Clima: alívio temporário, nova chuva ameaça o Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142565, "titulo": "In Chile, injured penguins sport copper vests to help them heal", "url": "https://phys.org/news/2026-09-chile-penguins-sport-copper-vests.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores chilenos desenvolveram um novo tipo de roupa para pinguins feridos—casacos vermelhos apertados comcondutos de cobre e zinco, com a esperança de que isso acelere a recuperação dos pássaros aquáticos.", "titulo_pt": "Em Chile, pinguins feridos usam coletes vermelhos com condutores metálicos para auxiliar na recuperação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142344, "titulo": "Floodwaters sweep cars away in eastern China", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/3/floodwaters-sweep-cars-away-in-eastern-china?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T05:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças de enxurrada causadas por chuvas torrenciais atingiram áreas leste da China, inundando ruas e levando embora veículos.", "titulo_pt": "Inundações arrastam carros pelas ruas no leste da China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 142459, "titulo": "Unstable Tibetan Plateau risks cascading disasters as glacier losses mount in Nepal, China", "url": "https://www.scmp.com/news/china/article/3366180/unstable-tibetan-plateau-risks-cascading-disasters-glacier-losses-mount-nepal-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T03:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O responsável pelo Centro Nacional de Clima da China alerta que os gelos da Plataforma Tibetana podem se tornar mais instáveis, levando a mais colapsos e desastres secundários. No último mês, a área dos gelos na Plataforma Tibetana diminuiu cerca de 24% nas últimas 60 anos, com cerca de 7.000 pequenos gelos desaparecendo completamente.", "titulo_pt": "Plataforma tibetana instável em risco de desastres em cadeia devido à perda de geleiras", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 142581, "titulo": "New Mexico’s largest reservoir plunges to just 1.4% full", "url": "https://www.sciencedaily.com/releases/2026/09/260902234454.htm", "fonte_id": "science_daily", "data_pub": "2026-09-03T03:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O maior reservatório de Novo México, o Reservatório Elefante Masoquista, atingiu apenas 1,4% da sua capacidade em julho de 2026 devido a anos de seca extrema e derretimento de neve recorde no outono anterior. A queda dramática expôs detritos submersos há muito tempo e enfatizou a crescente pressão sobre as reservas de água do Rio Grande, utilizadas por fazendas em Novo México e Texas.", "titulo_pt": "Reservatório mais grande de novo México cai para apenas 1,4% da capacidade", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 142587, "titulo": "Analysis: China’s CO2 emissions fall in Q2 2026 due to plummeting oil use", "url": "https://www.carbonbrief.org/analysis-chinas-co2-emissions-fall-in-q2-2026-due-to-plummeting-oil-use", "fonte_id": "carbon_brief", "data_pub": "2026-09-02T23:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono (CO2) na China diminuíram em 1% no segundo trimestre de 2026, devido ao declínio abrupto no consumo de óleo.", "titulo_pt": "Análise: emissões de CO2 na china caem no segundo trimestre de 2026 devido ao declínio no consumo de óleo", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 141275, "titulo": "Sintomas respiratórios atingiram 92% da população brasileira no último ano", "url": "https://www.cnnbrasil.com.br/saude/sintomas-respiratorios-atingiram-92-da-populacao-brasileira-no-ultimo-ano/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Datafolha indicou que 92% da população brasileira apresentaram sintomas respiratórios no último ano. O relatório destaca a normalização desses sintomas e a falta de busca por avaliação médica.", "titulo_pt": "Sintomas respiratórios atingiram 92% da população brasileira no último ano", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141484, "titulo": "The world is whiffing on its biggest climate goal", "url": "https://www.vox.com/today-explained-newsletter/501812/the-world-is-whiffing-on-its-biggest-climate-goal", "fonte_id": "vox", "data_pub": "2026-09-02T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O objetivo climático de manter o aquecimento global abaixo de 1,5°C tem sido o principal foco das políticas climáticas por mais de uma década. No entanto, há preocupações de que esse objetivo possa não ser alcançado.", "titulo_pt": "Mundo negligenciando seu maior objetivo climático", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 140488, "titulo": "“Cada fracción de grado costará vidas”: la ONU admitió que estamos cerca de superar el aumento límite de 1,5°C fijado por el Acuerdo de París", "url": "https://www.lanacion.com.ar/sociedad/cada-fraccion-de-grado-costara-vidas-la-onu-admitio-que-estamos-cerca-de-superar-el-aumento-limite-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório indicou que o limite de 1,5°C estipulado pelo Acordo de Paris pode ser superado nos próximos anos. Autoridades e especialistas internacionais alertaram sobre os riscos para humanos e ecossistemas associated com essa possibilidade.", "titulo_pt": "Cada fração de grau custará vidas: ONU admite que estamos próximos de superar o aumento limite de 1,5°C do acordo de paris", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 140159, "titulo": "Indústria marítima recorre ao vento para reduzir consumo de combustível", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/industria-maritima-recorre-ao-vento-para-reduzir-consumo-de-combustivel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T15:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Maersk, empresa dinamarquesa de logística e transporte marítimo, assinou um acordo para instalar a primeira vela eólica em um navio porta-contêineres. A indústria marítima está retomando uma tecnologia antiga para reduzir o consumo de combustível e atender a regulamentações ambientais mais rigorosas.", "titulo_pt": "Indústria marítima recorre ao vento para reduzir consumo de combustível", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140790, "titulo": "Nepal PM links deadly floods to climate change", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/2/nepal-pm-links-deadly-floods-to-climate-change?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-02T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Nepal relacionou as inundações letais recentes ao aquecimento global e às mudanças climáticas.", "titulo_pt": "PM do nepal relaciona inundações fatais às mudanças climáticas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 140319, "titulo": "Mundo deve ultrapassar limite de 1,5°C e corrida agora é para limitar danos, alerta ONU", "url": "https://exame.com/esg/mundo-deve-ultrapassar-limite-de-15c-e-corrida-agora-e-para-limitar-danos-alerta-onu/", "fonte_id": "exame", "data_pub": "2026-09-02T12:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório do PNUMA indica que o mundo está prestes a ultrapassar a meta de 1,5°C estabelecida pelo Acordo de Paris nos próximos anos, mas destaca que ações rápidas podem limitar os danos e reverter a trajetória de aquecimento.", "titulo_pt": "Mundo deve ultrapassar limite de 1,5°C e corrida agora é para limitar danos, alerta ONU", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 140444, "titulo": "ONU: aumento da temperatura acima de 1,5°C precisa ter magnitude e duração limitados para dar tempo para adaptação", "url": "https://www.jota.info/executivo/onu-aumento-da-temperatura-acima-de-15c-precisa-ter-magnitude-e-duracao-limitados-para-dar-tempo-para-adaptacao", "fonte_id": "jota", "data_pub": "2026-09-02T12:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento da ONU prevê um aumento de temperatura de até 1,8°C, no melhor cenário, embora já existam sinais de que este valor possa ultrapassar os 2°C.", "titulo_pt": "ONU: aumento da temperatura acima de 1,5°C precisa ter magnitude e duração limitados para dar tempo de adaptação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 140916, "titulo": "Indonesian wildfire haze forces 1.4 million students to move to online learning", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366138/indonesian-wildfire-haze-forces-14-million-students-move-online-learning?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T12:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 1,4 milhão de estudantes em seis províncias indonésias tiveram que mudar para aprendizado online devido à qualidade do ar ruim causada por incêndios florestais e de terras. Até 2 de setembro, cerca de 1,43 milhões de estudantes de 12.874 escolas nessas províncias estavam estudando remotamente.", "titulo_pt": "Incêndios florestais fazem 1,4 milhão de estudantes mudarem para ensino online na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 142452, "titulo": "Hong Kong considers DNA testing amid concerns over ‘fighting dog’ classification", "url": "https://www.scmp.com/news/hong-kong/society/article/3366195/hong-kong-considers-dna-testing-amid-concerns-over-fighting-dog-classification?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T05:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Hong Kong estão considerando o uso de testes genéticos como uma ferramenta adicional para identificar raças, em resposta a preocupações públicas sobre a classificação de cães de luta. O Departamento de Agricultura, Pesca e Conservação (AFCD) também informou que donos podem manter seus cães de luta existentes, desde que cumpram com as exigências legais.", "titulo_pt": "Hong Kong considera teste genético para identificar raças de cães após preocupações sobre classificação de cães de luta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 142182, "titulo": "UNHCR Says It Is Not Involved in Malaysia’s Planned Repatriation of Refugees to Myanmar", "url": "https://thediplomat.com/2026/09/unhcr-says-it-is-not-involved-in-malaysias-planned-repatriation-of-refugees-to-myanmar/", "fonte_id": "the_diplomat", "data_pub": "2026-09-03T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações de direitos humanos afirmam que os 1.476 cidadãos de Myanmar estão em alto risco de sofrer tortura, maus-tratos e conscrição forçada ao serem repatriados.", "titulo_pt": "Onu-narref diz não estar envolvido na planejada repatriação de refugiados de Myanmar", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 142612, "titulo": "More than one week on from Nepal's floods, thousands of children remain without safe water and face rising risk of disease", "url": "https://www.unicef.org/press-releases/more-one-week-nepals-floods-thousands-children-remain-without-safe-water-and-face", "fonte_id": "unicef", "data_pub": "2026-09-03T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de uma semana após os inundações na Nepal, milhares de cr function toggleDrill(id) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });

      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
