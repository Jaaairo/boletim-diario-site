ertiram passageiros contra o uso dos aeroportos sauditas um dia após um ataque com mísseis ao aeroporto de Riad que resultou em 12 mortes e mais de 300 feridos. O aeroporto permanecerá fechado pelo menos até à noite de domingo.", "titulo_pt": "Hutitas advertem passageiros contra uso de aeroportos sauditas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 208748, "titulo": "‘Los siete de Cornell’: expertos advierten del “vacío legal” que pesa sobre el caso de la violación grupal", "url": "https://elpais.com/us/2026-10-11/los-siete-de-cornell-expertos-advierten-del-vacio-legal-que-pesa-sobre-el-caso-de-la-violacion-grupal.html", "fonte_id": "elpais_america", "data_pub": "2026-10-11T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A lei de Nueva York dificulta as denúncias de vítimas de violação grupal que consumiram álcool voluntariamente. Expertos alertam sobre o 'vazio legal' que afeta o caso.", "titulo_pt": "Os sete de Cornell: especialistas advertem sobre o 'vazio legal' que pesa sobre o caso de violação grupal", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 208750, "titulo": "Milei vende la ciudadanía argentina a 350.000 dólares por persona y oferta descuentos para familias", "url": "https://elpais.com/argentina/2026-10-11/milei-vende-la-ciudadania-argentina-a-350000-dolares-por-persona-y-oferta-descuentos-para-familias.html", "fonte_id": "elpais_america", "data_pub": "2026-10-11T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O novo regime aprovado por decreto oferece naturalização para estrangeiros na Argentina e não se limita apenas à residência. A oposição tenta impedir a medida no Congresso.", "titulo_pt": "Milei vende cidadania argentina a 350.000 dólares por pessoa e oferece descontos para famílias", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 208756, "titulo": "Jalisco y Colima se preparan para la embestida del huracán ‘Simón’, de categoría cuatro", "url": "https://elpais.com/mexico/2026-10-11/jalisco-y-colima-se-preparan-para-la-embestida-del-huracan-simon-de-categoria-cuatro.html", "fonte_id": "elpais_america", "data_pub": "2026-10-11T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Proteção Civil em Jalisco e Colima declarou o nível máximo de alerta para 28 municípios dos dois estados devido à chegada do huracán 'Simón', de categoria quatro. O Puerto Vallarta cancelou os voos até o próximo Monday.", "titulo_pt": "Jalisco e Colima preparam-se para a chegada do huracan 'Simón', de categoria quatro", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 208758, "titulo": "“El mejor amigo del pueblo judío en el mundo”: el giro exprés de Colombia hacia Israel", "url": "https://elpais.com/america-colombia/2026-10-11/el-mejor-amigo-del-pueblo-judio-en-el-mundo-el-giro-expres-de-colombia-hacia-israel.html", "fonte_id": "elpais_america", "data_pub": "2026-10-11T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Colômbia está intensificando sua relação com Israel devido aos interesses de segurança e à influência da fé evangélica entre seus eleitores.", "titulo_pt": "O melhor amigo do povo judeu no mundo: o rápido giro de colômbia para Israel", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 208854, "titulo": "'Going bankrupt': Iran shopkeepers struggle as war dims demand", "url": "https://www.france24.com/en/video/20261011-going-bankrupt-iran-shopkeepers-struggle-as-war-dims-demand", "fonte_id": "france24", "data_pub": "2026-10-11T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia do Irã tem sido afetada por sanções há anos, mas o conflito iniciado em fevereiro com ataques dos EUA e Israel, bem como um bloqueio americano dos portos do país, estão aumentando a pressão sobre a vida cotidiana. A inflação, que atingiu 89% no ano passado de acordo com dados oficiais, e as flutuações imprevisíveis da taxa de câmbio estão elevando os preços dos itens básicos.", "titulo_pt": "Falência: comerciantes do Irã lutam com a guerra que diminui a demanda", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 208855, "titulo": "Trump urges Zelensky replacement as diesel row rages", "url": "https://www.france24.com/en/video/20261011-trump-urges-zelensky-replacement-as-diesel-row-rages", "fonte_id": "france24", "data_pub": "2026-10-11T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump incentivou a substituição do presidente ucraniano Volodymyr Zelensky após este criticar a diminuição das sanções americanas contra o diesel russo. A pressão de Trump sobre o assunto ocorre semanas antes das eleições legislativas nos Estados Unidos.", "titulo_pt": "Trump incentiva substituição de Zelensky após crise de diesel", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 208940, "titulo": "Zelensky, fermeremo raid su raffinerie se Mosca smetterà di colpire siti energetici", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/11/zelensky-fermeremo-raid-su-raffinerie-se-mosca-smettera-di-colpire-siti-energetici_9f05b932-96b0-4cb7-ad68-9a3c9419f119.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-11T09:21:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelensky declarou que a Ucrânia encerrará os ataques às refinarias se a Rússia parar de atingir infraestruturas energéticas. Qualquer medida de desescalação deve ser recíproca e apoiada por garantias concretas.", "titulo_pt": "Zelensky, encerraremos ataques às refinarias se moscou parar de atingir infraestruturas energéticas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 208941, "titulo": "Almeno 109 migranti morti in un naufragio al largo di Gibuti, oltre 116 i dispersi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/11/almeno-109-migranti-morti-in-un-naufragio-al-largo-di-gibuti-oltre-116-i-dispersi_b5d90649-c51f-4816-a54b-57f3dd906c92.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-11T09:19:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 109 migrantes morreram em um naufrágio perto da costa de Gibuti, e mais de 116 pessoas desapareceram. O número de vítimas pode aumentar, e 15 crianças estavam entre as pessoas falecidas.", "titulo_pt": "Pelo menos 109 migrantes mortos em naufrágio perto de Gibuti, mais de 116 desaparecidos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 208856, "titulo": "At least 4 dead as cyclone Isaias drenches southern US", "url": "https://www.france24.com/en/video/20261011-at-least-4-dead-as-cyclone-isaias-drenches-southern-us", "fonte_id": "france24", "data_pub": "2026-10-11T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos quatro pessoas morreram nos Estados Unidos do Sul devido à passagem do ciclone tropical Isaias, que ameaçava inundações e riscos de tornados.", "titulo_pt": "Pelo menos 4 mortos enquanto ciclone Isaias encharca sul dos EUA", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 208857, "titulo": "France's Seixas claims Il Lombardia glory after world championship heartbreak", "url": "https://www.france24.com/en/tv-shows/sports/20261011-france-s-seixas-claims-il-lombardia-glory-after-world-championship-heartbreak", "fonte_id": "france24", "data_pub": "2026-10-11T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ciclista francês Paul Seixas venceu o Tour of Lombardy, estabelecendo um novo recorde como o vencedor mais jovem da corrida. Ele havia ficado desapontado com sua performance nos Campeonatos Mundiais há duas semanas.", "titulo_pt": "Seixas conquista tour of lombardy após decepção nos campeonatos mundiais", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 208776, "titulo": "Wringing Hope From the Rubble of Gaza", "url": "https://www.nytimes.com/2026/10/11/world/middleeast/wringing-hope-from-the-rubble-of-gaza.html", "fonte_id": "nyt_world", "data_pub": "2026-10-11T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cessamento das hostilidades ocorreu em outubro do ano passado, supostamente pondo fim à guerra israelense em Gaza após os ataques liderados pelo Hamas em 7 de outubro de 2023. No entanto, embora as operações militares israelenses tenham diminuído, elas não cessaram.", "titulo_pt": "Espremendo esperança dos escombros de Gaza", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 208811, "titulo": "Carf decide manter créditos de PIS/Cofins por transporte com trecho internacional", "url": "https://www.jota.info/tributos/carf-decide-manter-creditos-de-pis-cofins-por-transporte-com-trecho-internacional", "fonte_id": "jota", "data_pub": "2026-10-11T09:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho da Receita Federal (CARF) decidiu manter os créditos de PIS/Cofins para o transporte com trecho internacional. Foi também decidido que um único contrato pode abranger tanto serviços de transporte nacional quanto internacional.", "titulo_pt": "Carf mantém créditos de PIS/Cofins para transporte com trecho internacional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 208687, "titulo": "Ofertas y promociones: cae el consumo y empresarios agudizarán estrategias para sostener las ventas", "url": "https://www.clarin.com/economia/ofertas-promociones-cae-consumo-empresarios-agudizaran-estrategias-sostener-ventas_0_hUI34zYkfg.html", "fonte_id": "clarin", "data_pub": "2026-10-11T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A política de vendas com ofertas e promociones continua sendo utilizada, mas a indústria não espera que possa ser eliminada. As consultorias prevêem um crescimento do consumo entre muito ligeiro e negativo tanto para 2026 quanto para o próximo ano.", "titulo_pt": "Ofertas e promocões: consumo diminui e empresários aperfeiçoarão estratégias para manter as vendas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 208688, "titulo": "Luces amarillas en el crecimiento de la economía", "url": "https://www.clarin.com/economia/luces-amarillas-crecimiento-economia_0_mgoKcKDVDW.html", "fonte_id": "clarin", "data_pub": "2026-10-11T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Banco Mundial reduziu a previsão de crescimento da economia para 2026 para 2,1%, após ter estimado 4% em janeiro e revisado para 3,6% em junho. Entre janeiro e julho, a atividade acumulou um crescimento interanual de 1,7%, principalmente impulsionada pela agricultura, mineraria, petróleo e gás.", "titulo_pt": "Luces amarelas no crescimento da economia", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 208690, "titulo": "Una por una, cuáles son las 10 empresas con mejor reputación de la Argentina en 2026", "url": "https://www.clarin.com/economia/10-empresas-mejor-reputacion-argentina-2026_0_yJqnzpfADq.html", "fonte_id": "clarin", "data_pub": "2026-10-11T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mercado Libre, YPF e Toyota lideraram o ranking Merco Empresas em 2026, com várias empresas listadas investindo em projetos significativos.", "titulo_pt": "As 10 empresas com melhor reputação na Argentina em 2026", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 208691, "titulo": "Mercado Libre y su receta contra las plataformas chinas: \"Variedad, precio y también cuándo llega el pedido y qué respuesta recibe el usuario\"", "url": "https://www.clarin.com/economia/mercado-libre-receta-plataformas-chinas-variedad-precio-llega-pedido-respuesta-recibe-usuario_0_NxeGkItZ6g.html", "fonte_id": "clarin", "data_pub": "2026-10-11T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mercado Libre, presidido por Juan Martín De la Serna, destaca a proximidade com os vendedores locais como diferencial em meio à abertura econômica. A empresa liderou novamente o Ranking Merco de Reputação Empresaria por sétimo ano consecutivo.", "titulo_pt": "Mercado Libre e sua receita contra as plataformas chinesas: variedade, preço e prazo de entrega", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 208813, "titulo": "A herança jurisprudencial da reforma tributária", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-heranca-jurisprudencial-da-reforma-tributaria", "fonte_id": "jota", "data_pub": "2026-10-11T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Precedentes do Supremo Tribunal Federal e do Superior Tribunal de Justiça sobre ICMS, PIS e Cofins influenciarão a interpretação das novas alíquotas do IBS e CBS.", "titulo_pt": "A herança jurisprudencial da reforma tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 208610, "titulo": "Debêntures isentas de IR podem chegar perto de R$ 1 tri em 10 anos, diz gestora", "url": "https://www.infomoney.com.br/onde-investir/debentures-isentas-de-ir-podem-chegar-perto-de-r-1-tri-em-10-anos-diz-gestora/", "fonte_id": "infomoney", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gestora projeta que os fundos de investimento possam ganhar espaço entre os compradores de debêntures isentas de imposto de renda em um prazo de 10 anos. A possibilidade de tributação desses investimentos ainda paira como um risco.", "titulo_pt": "Debêntures isentas de IR podem chegar perto de R$ 1 tri em 10 anos, diz gestora", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208611, "titulo": "Em tempos de incerteza, faça estas perguntas antes de tomar uma decisão no trabalho", "url": "https://www.infomoney.com.br/business/global/em-tempos-de-incerteza-faca-estas-perguntas-antes-de-tomar-uma-decisao-no-trabalho/", "fonte_id": "infomoney", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um cenário de incerteza, líderes podem utilizar quatro perguntas estratégicas para reduzir dúvidas, avaliar riscos e tomar decisões mais consistentes. O texto sugere que este método pode ser útil em tempos de instabilidade geopolítica, mudanças climáticas e avanços da inteligência artificial.", "titulo_pt": "Em tempos de incerteza, faça estas perguntas antes de tomar uma decisão no trabalho", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208612, "titulo": "Como um pequeno banco chinês deu a Moscou acesso a Wall Street", "url": "https://www.infomoney.com.br/business/global/como-um-pequeno-banco-chines-deu-a-moscou-acesso-a-wall-street/", "fonte_id": "infomoney", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um pequeno banco chinês ajudou Moscou a obter acesso ao mercado americano, aproveitando brechas no sistema de correspondência bancária que permite o comércio global em dólares, mesmo quando há sanções dos Estados Unidos.", "titulo_pt": "Como um pequeno banco chinês deu a Moscou acesso ao mercado de Wall Street", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208613, "titulo": "Roubo de 30 mil garrafas em vinícola italiana pode ser o maior da história do vinho", "url": "https://www.infomoney.com.br/business/global/roubo-de-30-mil-garrafas-em-vinicola-italiana-pode-ser-o-maior-da-historia-do-vinho/", "fonte_id": "infomoney", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma quadrilha roubou cerca de 30 mil garrafas de vinho, incluindo marcas premium como Tignanello, Solaia e Guado al Tasso, avaliadas em até 8,2 milhões de dólares de um depósito da vinícola Antinori na Toscana, Itália. Este roubo pode ser considerado o maior da história do vinho.", "titulo_pt": "Roubo de 30 mil garrafas em vinícola italiana pode ser o maior da história do vinho", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208614, "titulo": "Informalidade aumenta desafio previdenciário nos países emergentes, diz OCDE", "url": "https://www.infomoney.com.br/economia/informalidade-aumenta-desafio-previdenciario-nos-paises-emergentes-diz-ocde/", "fonte_id": "infomoney", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização para a Cooperação e Desenvolvimento Econômico (OCDE) alerta que apenas 8% dos trabalhadores informais nos países emergentes contribuem para algum tipo de regime previdenciário. Isso aumenta o desafio previdenciário nessas economias.", "titulo_pt": "Informalidade aumenta desafio previdenciário nos países emergentes, diz OCDE", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208615, "titulo": "Peça-chave? O que a nova formação do Congresso pode significar para o mercado", "url": "https://www.infomoney.com.br/mercados/peca-chave-o-que-a-nova-formacao-do-congresso-pode-significar-para-o-mercado/", "fonte_id": "infomoney", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os analistas observam que há um maior potencial para ajustes fiscais devido ao avanço da direita no Congresso, mas ressaltam que a implementação de reformas dependerá de negociações políticas.", "titulo_pt": "Chave para o mercado? O que a nova composição do Congresso pode significar", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208814, "titulo": "IA e contencioso tributário", "url": "https://www.jota.info/opiniao-e-analise/colunas/pauta-fiscal/ia-e-contencioso-tributario", "fonte_id": "jota", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estratégia aborda o uso da inteligência artificial no gerenciamento do estoque do passado e na previsão dos conflitos futuros relacionados ao contencioso tributário.", "titulo_pt": "IA e contencioso tributário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 208815, "titulo": "A responsabilidade entre SAF e associação", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-responsabilidade-entre-saf-e-associacao", "fonte_id": "jota", "data_pub": "2026-10-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei 15.427/2026 introduziu mudanças relacionadas à responsabilidade entre Sistema de Apoio ao Fisco (SAF) e associação.", "titulo_pt": "Responsabilidade entre SAF e associação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 208512, "titulo": "Captação de dívida para IA desacelera diante da crescente cautela dos investidores com a onda de endividamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/captacao-de-divida-para-ia-desacelera-diante-da-crescente-cautela-dos-investidores-com-a-onda-de-endividamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O volume de novas dívidas captadas por empresas de tecnologia para projetos de inteligência artificial diminuiu significativamente no último mês, devido à crescente cautela dos investidores em relação ao endividamento no setor.", "titulo_pt": "Captação de dívida para IA desacelera diante da crescente cautela dos investidores com a onda de endividamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 208887, "titulo": "After France, is Italy next? Goldman Sachs flags bond risks as Rome's deficit widens", "url": "https://www.cnbc.com/2026/10/11/italy-government-bonds-sovereign-debt-giorgia-meloni.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-11T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Goldman Sachs aponta riscos para os títulos de dívida italianos devido aos objetivos de déficit mais altos para 2027-28, à elevação dos juros e à incerteza eleitoral.", "titulo_pt": "Depois da França, será a Itália a próxima? Goldman Sachs avisa riscos para os títulos de dívida", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 209009, "titulo": "How the 2026 Super El Niño and Climate Change Are Related", "url": "https://www.wired.com/story/super-el-nino-climate-change-connections/", "fonte_id": "wired", "data_pub": "2026-10-11T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O El Niño recorde em um planeta recordemente quente está sendo estudado. Os cientistas buscam responder as perguntas mais importantes sobre a relação entre o fenômeno e as mudanças climáticas.", "titulo_pt": "Como o El Niño recorde de 2026 e as mudanças climáticas estão ligados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 209010, "titulo": "California’s Tallest and Most Iconic Trees Are Getting Heatstroke", "url": "https://www.wired.com/story/californias-tallest-and-most-iconic-trees-are-getting-heat-stroke/", "fonte_id": "wired", "data_pub": "2026-10-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sequiosas, as árvores mais altas e icônicas da Califórnia, adaptaram-se a um clima fresco e nebuloso. Um novo estudo demonstra que essas árvores reduzem a fotossíntese quando o ambiente se aquece.", "titulo_pt": "As árvores mais altas e mais icônicas da califórnia estão sofrendo de calor", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 209013, "titulo": "[팟캐스트] (821) 만 2세 미만 아동의 스마트폰 사용률은?", "url": "https://www.koreaherald.com/article/10898684", "fonte_id": "korea_herald", "data_pub": "2026-10-11T08:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento governamental mostrou que mais da metade das crianças com menos de cinco anos começaram a usar smartphones antes dos dois anos de idade. O uso precoce aumentou conforme a frequência de uso de smartphones pelas mães também aumentou.", "titulo_pt": "Uso de smartphones por crianças abaixo de dois anos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 209014, "titulo": "Art Taipei 2026 to explore evolving relationship between humans, technology", "url": "https://www.koreaherald.com/article/10898661", "fonte_id": "korea_herald", "data_pub": "2026-10-11T07:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Art Taipei, uma das feiras de arte internacionais mais antigas da Ásia, retornará a Taipei de 30 de outubro a 2 de novembro de 2026, com 127 galerias participantes explorando a relação evoluída entre humanos e tecnologia sob o tema 'Symbiosis'.", "titulo_pt": "Art Taipei 2026 vai explorar a relação evoluída entre humanos e tecnologia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 209037, "titulo": "Vicor widens AI server power patent fight, seeking new US import ban on Foxconn, Quanta and Delta", "url": "https://www.digitimes.com/news/a20261011VL200/ai-server-foxconn-quanta-ban-hardware.html", "fonte_id": "digitimes", "data_pub": "2026-10-11T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Vicor Corporation está tentando, pela segunda vez este ano, impedir que fabricantes taiwaneses de servidores, incluindo Foxconn, Quanta e Delta, importem hardware de poder para servidores de inteligência artificial para os Estados Unidos. A empresa já obteve uma proibição semelhante no passado.", "titulo_pt": "Vicor amplia disputa de patentes de energia para servidores de IA, buscando nova proibição de importação nos EUA contra Foxconn, Quanta e Delta", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 209015, "titulo": "Yongsan Electronics Market begins reinvention as AI hub", "url": "https://www.koreaherald.com/article/10898624", "fonte_id": "korea_herald", "data_pub": "2026-10-11T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de eletrônicos de Yongsean em Seul está sendo reformatado para se tornar um distrito especializado em inteligência artificial e tecnologias de informação e comunicação no centro da cidade. O primeiro estágio da reforma está programado para começar este mês, conforme anunciado pela Prefeitura Metropolitana de Seul em junho de 2023.", "titulo_pt": "Mercado de yongsean inicia reestruturação como hub de inteligência artificial", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 209016, "titulo": "Solidigm IPO sparks debate over SK hynix shareholder value", "url": "https://www.koreaherald.com/article/10898617", "fonte_id": "korea_herald", "data_pub": "2026-10-11T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SK hynix está considerando a possibilidade de listar sua subsidiária NAND flash Solidigm nos Estados Unidos, o que está dividindo os investidores sobre se isso poderia liberar valor oculto para a fabricante sul-coreana de chips ou diluir os interesses dos acionistas existentes. A Solidigm está discutindo possíveis corretores para uma possível lista nos EUA, e pode ser avaliada em até 150 bilhões de dólares e arrecadar até 15 bilhões de dólares.", "titulo_pt": "IPO da solidigm divide investidores sobre valor para SK hynix", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 208605, "titulo": "O novo profissional em T: como a IA expande seus conhecimentos gerais em segundos", "url": "https://exame.com/inteligencia-artificial/o-novo-profissional-em-t-como-a-ia-expande-seus-conhecimentos-gerais-em-segundos/", "fonte_id": "exame", "data_pub": "2026-10-11T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A integração de habilidades técnicas com um repertório multidisciplinar ganha novas oportunidades graças a ferramentas que explicam conceitos e estabelecem conexões entre diferentes áreas do conhecimento.", "titulo_pt": "O novo profissional em T: como a IA amplia seus conhecimentos gerais em segundos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 209019, "titulo": "AI-powered attacks on Korean financial sectors linked to Chinese DDoS group: report", "url": "https://www.koreaherald.com/article/10898597", "fonte_id": "korea_herald", "data_pub": "2026-10-11T05:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma série recente de ataques cibernéticos baseados em inteligência artificial contra bancos sul-coreanos pode estar relacionada a um grupo chinês que realiza ataques de negação de serviço distribuído (DDoS) por encomenda, de acordo com um relatório divulgado por uma empresa de segurança cibernética sul-coreana chamada Logpresso.", "titulo_pt": "Ataques cibernéticos com IA contra bancos sul-coreanos podem estar ligados a grupo chinês de DDoS: relatório", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 209025, "titulo": "Samsung to expand chip capacity in Vietnam, boost high-end production in Korea", "url": "https://www.koreaherald.com/article/10898561", "fonte_id": "korea_herald", "data_pub": "2026-10-11T04:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung planeja investir 12,26 trilhões de wones (cerca de 9,15 bilhões de dólares) em operações de chip, com 8 trilhões de wones destinados à expansão da capacidade de produção de alto nível na Coreia do Sul e 4,09 bilhões de dólares para instalações de teste de chips de memória em Thai Nguyen, Vietnã. O primeiro linha de produção na Indústria Park Yen Binh está programada para começar a operar.", "titulo_pt": "Samsung expandirá capacidade de chips no vietnã e aumentará produção de alto nível na Coreia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 208933, "titulo": "The problem with your AI therapist", "url": "https://www.ft.com/content/ab9e2f3e-1586-4c63-b423-6a179437fc13?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-11T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Millhões de pessoas estão utilizando chatbots para auxílio em saúde mental, mas a tecnologia limitada a apenas palavras não é suficiente para tratar esses problemas.", "titulo_pt": "O problema com seu terapeuta de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 209038, "titulo": "IPC makers expand US production as supply chains, tariffs shift", "url": "https://www.digitimes.com/news/a20261008PD238/production-manufacturing-pc-ipc-california.html", "fonte_id": "digitimes", "data_pub": "2026-10-11T02:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes de PCs industriais estão aumentando a produção nos Estados Unidos devido à regionalização das cadeias de suprimento, à endurecimento da política de tarifas e à pressão dos compradores governamentais para a aquisição local. Essa mudança indica um reordenamento mais amplo da produção de eletrônicos, com mais trabalhos de alto valor e tempo crítico sendo realizados mais próximos dos clientes norte-americanos.", "titulo_pt": "Fabricantes de pcs industriais expandem produção nos EUA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 209039, "titulo": "Novatek quarterly revenue tops NT$30B as smartphone demand, edge AI chips lift results", "url": "https://www.digitimes.com/news/a20261008PD239/novatek-revenue-chips-smartphone-demand-2026.html", "fonte_id": "digitimes", "data_pub": "2026-10-11T02:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novatek registrou receita trimestral superior a NT$30 bilhões em setembro e no terceiro trimestre de 2026, indicando que a demanda sazonal por smartphones e o crescimento em chips de inteligência artificial em borda estão apoiando a cadeia de suprimentos de displays e chips globais. Os resultados refletem mudanças mais amplas na demanda por eletrônicos de consumo, nos padrões de estoque e nos gastos com hardware relacionado à IA.", "titulo_pt": "Receita trimestral da novatek supera NT$30 bilhões com demanda sazonal por smartphones e crescimento em chips de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 209040, "titulo": "Changs Ascending September revenue jumps 92% on semiconductor plant buildouts", "url": "https://www.digitimes.com/news/a20261008PD229/revenue-plant-equipment-ups-aidc.html", "fonte_id": "digitimes", "data_pub": "2026-10-11T02:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A receita consolidada da Changs Ascending aumentou 92% em setembro de 2026, atingindo aproximadamente US$2,49 milhões, devido a encomendas relacionadas à construção de novos parques fabris, chegada de equipamentos e prazos de aceitação de projetos de clientes de semicondutores.", "titulo_pt": "Ascendência da changs: receita de setembro sobe 92% com construção de fábricas de semicondutores", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 209041, "titulo": "Sysgration bets on battery backup, drones to hit US$314 million in sales by 2028", "url": "https://www.digitimes.com/news/a20261008PD219/revenue-2028-sales-2026-growth.html", "fonte_id": "digitimes", "data_pub": "2026-10-11T02:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sysgration registrou receita mensal consolidada recorde em setembro de 2026, superando pela terceira vez consecutiva a marca de NT$1 bilhão (aproximadamente US$31,4 milhões) no terceiro trimestre. A empresa prevê que as entregas de unidades de bateria de reserva (BBU) e produtos de drone entrarem em crescimento a partir do quarto trimestre de 2026, com metas a médio prazo para superar esses segmentos.", "titulo_pt": "Sysgration aposta em bateria de reserva e drones para atingir vendas de US$314 milhões em 2028", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 209042, "titulo": "Everlight Chemical September revenue rises on strong electronic chemicals demand", "url": "https://www.digitimes.com/news/a20261008PD215/revenue-everlight-demand-2026-growth.html", "fonte_id": "digitimes", "data_pub": "2026-10-11T02:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Everlight Chemical relatou uma receita maior em setembro e para o ano até setembro, com os químicos eletrônicos sendo o principal motor do crescimento. Os resultados indicam a continuidade da resiliência na demanda por materiais industriais e especializados, um tendência relevante para fabricantes globais, cadeias de suprimentos e investidores observando as produtoras químicas asiáticas em meio a condições de mercado variáveis.", "titulo_pt": "Receita da everlight Chemical em setembro cresce devido à alta demanda por químicos eletrônicos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 208977, "titulo": "China’s rich coastal cities to see sea-level rise up to 20% higher than global average", "url": "https://www.scmp.com/news/china/science/article/3370255/chinas-rich-coastal-cities-see-sea-level-rise-20-higher-global-average?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas internacionais alertam que as cidades costeiras chinesas, como Hong Kong e Shanghai, podem experimentar um aumento nas marés de até 20% superior à média global devido ao derretimento do gelo antártico. Isso ocorrerá devido a mudanças gravitacionais causadas pelo diminuto gelo antártico, que redistribuirão a água globalmente, elevando o nível do mar nos riscados litorais chineses.", "titulo_pt": "Cidades costeiras chinesas podem enfrentar aumento de marés 15-20% maior que a média global", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 208640, "titulo": "Estudo associa sintomas de Covid longa à queda de dopamina; entenda", "url": "https://www.cnnbrasil.com.br/saude/estudo-associa-sintomas-de-covid-longa-a-queda-de-dopamina-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T06:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista científica eBioMedicine associou sintomas da Covid-19 prolongada à diminuição de até 20% na dopamina cerebral dos pacientes. A pesquisa identificou uma redução na proteína cerebral em indivíduos com sequelas prolongadas da doença.", "titulo_pt": "Estudo associa sintomas de Covid longa à queda de dopamina; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208642, "titulo": "Tartaruga de 194 anos pode ajudar os humanos a viverem mais tempo", "url": "https://www.cnnbrasil.com.br/ciencia/tartaruga-de-194-anos-pode-ajudar-os-humanos-a-viverem-mais-tempo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram quase trezentas variantes genéticas em uma tartaruga de 194 anos, com o objetivo de orientar pesquisas de saúde e potenciais estudos.", "titulo_pt": "Tartaruga de 194 anos pode ajudar os humanos a viverem mais tempo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209052, "titulo": "The eye has a hidden cleanup system scientists never knew existed", "url": "https://www.sciencedaily.com/releases/2026/10/261008005254.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram um sistema oculto de limpeza nos olhos que drena fluido e resíduos por um caminho desconhecido até então. Essa descoberta, demonstrada em ratos, pode levar ao desenvolvimento de novos tratamentos para glaucoma, degeneração macular e outras causas de cegueira.", "titulo_pt": "O olho possui um sistema de limpeza oculto que os cientistas nunca souberam existir", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 209050, "titulo": "Eating olive oil before carbs has a surprising effect on blood sugar", "url": "https://www.sciencedaily.com/releases/2026/10/261008102700.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T04:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ordem no qual os alimentos são consumidos pode influenciar os níveis de glicose no sangue. Dados de experimentos com ratos mostram que a ingestão de azeite antes de carboidratos pode acelerar a digestão e ativar uma combinação inesperada de hormônios e sinais nervosos, ajudando a regular os níveis de glicose, mesmo em animais com diabetes tipo 2.", "titulo_pt": "Comer azeite antes dos carboidratos pode ter efeitos surpreendentes no açúcar no sangue", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 209054, "titulo": "APOD: 2026 October 11 – Ice Fishing for Cosmic Neutrinos", "url": "https://science.nasa.gov/image-article/apod-2026-october-11-ice-fishing-for-cosmic-neutrinos/", "fonte_id": "nasa_news", "data_pub": "2026-10-11T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do Astronomy Picture of the Day (APOD) de 11 de outubro de 2026 mostra a técnica de 'pesca de neutrinos no gelo', que é usada para detectar neutrinos cósmicos. A imagem destaca a pesquisa científica em andamento no Polo Sul da Terra.", "titulo_pt": "Pesca de Neutrinos no gelo: imagem do dia astronômico de 11 de outubro de 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 209049, "titulo": "Scientists build a nuclear clock that could make atomic clocks obsolete", "url": "https://www.sciencedaily.com/releases/2026/10/261008102701.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T03:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas emViena desenvolveram o primeiro relógio nuclear autostabilizante, um avanço significativo no controle do tempo que pode superar os relógios atômicos mais precisos. O relógio usa núcleos de átomos de torio, que são menos sensíveis às perturbações externas do que os elétrons em átomos.", "titulo_pt": "Cientistas constróem um relógio nuclear que pode tornar os relógios atômicos obsoletos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 208993, "titulo": "Spirit of Hong Kong Awards: biotech firm eyes cervical cancer test breakthrough", "url": "https://www.scmp.com/news/hong-kong/society/article/3370459/spirit-hong-kong-awards-biotech-firm-eyes-cervical-cancer-test-breakthrough?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-11T02:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ricky Chiu Yin-to, empresário de biotecnologia de Hong Kong, busca simplificar o diagnóstico do câncer de colo de útero através de um teste de urina baseado em HPV, utilizando tecnologia de concentração de amostras desenvolvida pela sua empresa, Phase Scientific. A empresa ganhou destaque durante a pandemia de COVID-19 com seu teste de antígeno rápido Indicaid, que recebeu autorização de uso emergencial nos EUA e foi vendido em mais de 30 países.", "titulo_pt": "Prêmio espírito de Hong Kong: empresa de biotecnologia almeja avanço no teste de câncer de colo de útero", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 208965, "titulo": "Trust in science falls as COVID-era confidence fades, global survey finds", "url": "https://www.japantimes.co.jp/news/2026/10/11/world/science-health/trust-in-science-falls-survey/", "fonte_id": "japan_times", "data_pub": "2026-10-11T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A confiança na ciência diminuiu em um estudo global que abrangeu a era do COVID, com consequências potencialmente amplas para a saúde pública, já que as taxas de vacinação estão caindo e doenças preveníveis estão voltando a surgir.", "titulo_pt": "Confiança na ciência diminui com a era do covid, diz pesquisa global", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 209048, "titulo": "A plastic once thought harmless may be fueling fatty liver disease", "url": "https://www.sciencedaily.com/releases/2026/10/261008102718.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T00:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Texas A&M descobriram que microplásticos de polietileno podem contribuir para a doença hepática fígada grasa, com efeitos ainda mais prejudiciais quando associados a uma dieta inadequada. Este plástico, amplamente utilizado, era anteriormente considerado relativamente inofensivo.", "titulo_pt": "Um plástico uma vez considerado inofensivo pode estar agravando a doença hepática fígada grasa", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 209051, "titulo": "Neanderthals may have used prehistoric glue as an ancient antibiotic", "url": "https://www.sciencedaily.com/releases/2026/10/261008005256.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T00:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neandertais podem ter usado uma substância adesiva feita de casca de pinheiro para tratar ferimentos milhares de anos antes da existência de antibióticos. Todos os amostras de turfa de pinheiro antiga inibiram o crescimento de bactérias responsáveis por infecções de ferimentos graves.", "titulo_pt": "Neandertais podem ter usado cola pré-histórica como antibiótico natural antigo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 209046, "titulo": "Zimbabwe's dinosaurs were different from South Africa's: New species offers clues", "url": "https://phys.org/news/2026-10-zimbabwe-dinosaurs-south-africa-species.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nova espécie de dinossauro no Zimbabwe mostra que os dinossauros deste país eram diferentes dos encontrados em África do Sul. A África abriga até 25% das espécies de animais e plantas do planeta, resultado de habitats variados e rica história evolutiva.", "titulo_pt": "Dinossauros do zimbabwe eram diferentes dos da áfrica do sul: nova espécie oferece pistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209053, "titulo": "Scientists created a tiny device that can control your nerves to treat chronic pain", "url": "https://www.sciencedaily.com/releases/2026/10/261008005253.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram um dispositivo injetável miniaturizado que pode controlar a atividade dos nervos sem cirurgia, pilhas ou fios, oferecendo potencialmente uma nova abordagem para o tratamento da dor crônica e distúrbios do movimento. O dispositivo, do tamanho de uma semente, é alimentado de forma sem fio do exterior do corpo e mostrou resultados promissores em testes iniciais.", "titulo_pt": "Cientistas criaram um dispositivo injetável pequeno que pode controlar os nervos para tratar dor crônica", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 209047, "titulo": "A surprisingly simple way to relieve knee arthritis pain without pills or surgery", "url": "https://www.sciencedaily.com/releases/2026/10/261009025434.htm", "fonte_id": "science_daily", "data_pub": "2026-10-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um simples ajuste na posição do pé ao caminhar pode aliviar dores nas articulações do joelho e até retardar o dano nas juntas, sem a necessidade de medicamentos ou cirurgia. Os participantes que adotaram a técnica personalizada de caminhada apresentaram uma deterioração mais lenta na saúde do cartilagem do joelho.", "titulo_pt": "Uma surpreendentemente simples maneira de aliviar dores de artrite do joelho sem medicamentos ou cirurgia", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 209036, "titulo": "Americans trust science more than peers around the world, survey shows", "url": "https://www.statnews.com/2026/10/10/u-s-trust-science-higher-than-other-nations-wellcome-survey/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-10T23:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os americanos expressaram mais confiança em ciência do que a maioria dos países pesquisados, segundo a pesquisa. No entanto, apenas 40% dos americanos confiavam bastante em hospitais e clínicas americanas, o mesmo percentual observado em Portugal e no Uruguai.", "titulo_pt": "Estudantes confiam mais em ciência do que em instituições americanas de saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 208482, "titulo": "Ultraviolet laser pulses engineer diamond defects selectively, leaving quantum qubits intact", "url": "https://phys.org/news/2026-10-ultraviolet-laser-pulses-diamond-defects.html", "fonte_id": "phys_org", "data_pub": "2026-10-10T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um laser ultravioleta é usado para engenhar defeitos específicos em diamantes, preservando assim os qubits quânticos. Os defeitos atômicos em diamantes podem fornecer novas propriedades ópticas e elétricas, e alguns podem servir como sistemas quânticos, mas controlá-los sem perturbar os outros é um desafio.", "titulo_pt": "Pulsos de laser ultravioleta engenham defeitos em diamantes selecionadamente, preservando os qubits quânticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 209071, "titulo": "‘SNL U.K.’ Cold Open Sees Reunion Between Prince William and Kate and Prince Harry and Meghan (With Some Help From Former Prince Andrew): ‘They Must Want Us to Be Royals Again!’", "url": "https://variety.com/2026/tv/global/snl-uk-prince-william-kate-reunite-prince-harry-meghan-1236908054/", "fonte_id": "variety", "data_pub": "2026-10-11T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa 'SNL U.K.' apresentou um encontro contencioso entre os príncipes William e Kate e Harry e Meghan no Sandringham Estate. O episódio retratou uma reunião familiar que parece ter levantado questões entre os membros envolvidos.", "titulo_pt": "SNL U.K.: reunião contenciosa entre príncipes William, Kate e Harry, Meghan (com ajuda do ex-príncipe Andrew)", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 209056, "titulo": "‘We look like soft, made-up blokes, but we’re really tough’: Duran Duran on 80s excess, tabloid scrutiny and their Halloween glow-up", "url": "https://www.theguardian.com/music/2026/oct/11/duran-duran-interview-pop-music-halloween-free-to-love", "fonte_id": "guardian_culture", "data_pub": "2026-10-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duran Duran foram inductados no Rock & Roll Hall of Fame em 2022, reconhecendo sua carreira de cinco décadas e vendas de 100 milhões de álbuns. O grupo, que passou por períodos de luxo e dificuldades, se apresentará em Halloween no O2, um show que marca sua longevidade no mundo da música pop.", "titulo_pt": "Nós parecemos bloquinhos macios, mas somos realmente fortes: Duran Duran sobre excessos dos anos 80, vigilância tabloide e sua transformação para Halloween", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 209058, "titulo": "‘What could be discovered? What is new there?’: blockbuster exhibition celebrates Roy Lichtenstein", "url": "https://www.theguardian.com/artanddesign/2026/oct/11/roy-lichtenstein-exhibition-whitney-museum", "fonte_id": "guardian_culture", "data_pub": "2026-10-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição monumental em honra ao artista pop Roy Lichtenstein, que ocorre no Museu Whitney de Nova York, inclui obras raramente vistas e novas montagens ambiciosas. A exposição celebra a obra de Lichtenstein, que criou um grande mural em 1983 inspirado na técnica de narrativa em série do Tapete de Bayeux, mas este foi destruído conforme seu pedido após seis semanas.", "titulo_pt": "O que poderia ser descoberto? O que é novo lá? Grande exposição celebra Roy Lichtenstein", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 209064, "titulo": "Ten pandemic-era dining sheds that show \"wildly different tastes\" of New Yorkers", "url": "https://www.dezeen.com/2026/10/11/new-york-pandemic-era-dining-sheds-penny-hardy-book/", "fonte_id": "dezeen", "data_pub": "2026-10-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Penny Hardy destaca, em seu livro recentemente anunciado 'Pandemia Arquitetônica: Caixas de Alimentação de Nova York 2020-2024', uma variedade de estruturas de alimentação instaladas em Nova York durante a pandemia de Covid-19, que variam desde barracas improvisadas a estruturas mais elaboradas com sinalização e design cuidadoso.", "titulo_pt": "Dez caixas de alimentação pandêmicas que mostram 'gostos muito diferentes' de nova-iorquinos", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 209012, "titulo": "A 1,232-year-old temple in Seoul finds viral fame with 'moktak clickers'", "url": "https://www.koreaherald.com/article/10898686", "fonte_id": "korea_herald", "data_pub": "2026-10-11T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O templo Bongeunsa, com 1.232 anos de história, está ganhando fama viral devido a um novo tipo de visitante: pessoas interessadas em adquirir um moktak, um instrumento de percussão budista que se tornou um acessório popular como 'clicker' de distrações. O moktak é usado em rituais budistas e seu som ritmado está associado à mindfulness.", "titulo_pt": "Templo de 1.232 anos em seul se torna famoso por 'clickers' de moktak", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 208696, "titulo": "¿Te cuesta comer “bien”? Un chef te dará técnicas para lograrlo en el Bienestar Fest", "url": "https://www.lanacion.com.ar/salud/te-cuesta-comer-bien-un-chef-te-dara-tecnicas-para-lograrlo-en-el-bienestar-fest-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T08:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O chef, divulgador e jornalista Pablo Martín participará do Bienestar Fest com uma palestra onde compartilhará suas técnicas para incorporar hábitos saudáveis de alimentação e melhorar a versão de si mesmo.", "titulo_pt": "Você tem dificuldade em comer bem? Um chef vai te ensinar no Bienestar Fest", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 208974, "titulo": "If Hongkongers’ support for Legco is waning, it isn’t just lawmakers’ fault", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3370301/if-hongkongers-support-legco-waning-it-isnt-just-lawmakers-fault?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-11T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ex-presidente do Legislativo de Hong Kong, Rita Fan Hsu Lai-tai, comentou sobre a possibilidade de reduzir o número de assentos do Legislativo de 90 para 60, afirmando que concorda com essa ideia devido aos custos mais baixos envolvidos. Este comentário surpreendeu muitos, especialmente porque Fan não abordou o assunto inicialmente, mas foi questionada sobre ele durante uma entrevista de rádio.", "titulo_pt": "Se o apoio dos hongkongueses ao legislativo está diminuindo, não é apenas culpa dos legisladores", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 209059, "titulo": "‘I’d wander through the park all angsty listening to Arctic Monkeys’: Arlo Parks’ honest playlist", "url": "https://www.theguardian.com/music/2026/oct/11/arlo-parks-honest-playlist-prince-janet-jackson", "fonte_id": "guardian_culture", "data_pub": "2026-10-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arlo Parks compartilha suas músicas favoritas, incluindo Sweet Dreams (Are Made of This) dos Eurythmics e Fake Tales of San Francisco dos Arctic Monkeys. Ela também menciona que certas músicas a emocionam fortemente, como as de Portishead.", "titulo_pt": "‘Eu passeava no parque triste ouvindo Arctic Monkeys e chorava com portishead’: a playlist honesta de arlo Parks", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 208508, "titulo": "Tom Zé chega aos 90, diz ser 'dodecafonista sertanejo' e que já superou ostracismo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/tom-ze-chega-aos-90-diz-ser-dodecafonista-sertanejo-e-que-ja-superou-ostracismo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-11T07:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tom Zé, aos 90 anos, expressou surpresa com o resultado das eleições, onde houve um empate entre Lula e outro candidato. O artista, conhecido como 'dodecafonista sertanejo', reside há mais de 50 anos no bairro de Perdizes, na zona oeste de São Paulo.", "titulo_pt": "Tom Zé completa 90 e se surpreende com empate nas eleições", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 208509, "titulo": "Como os programas verticais feitos para as redes sociais concorrem com talk shows", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/como-os-programas-verticais-feitos-para-as-redes-sociais-concorrem-com-talk-shows.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ator Andrew Garfield afirma que um verdadeiro DJ deve tocar músicas em discos de vinil, declaração que é concordada por Kareem Rahma, apresentador do programa Subway Takes, produzido para as redes sociais e com duração de um a três minutos por episódio.", "titulo_pt": "Como os programas de redes sociais competem com talk shows", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 208704, "titulo": "Tony Robbins, experto en desarrollo personal: “La única manera de sentir gratitud es salir de vos mismo”", "url": "https://www.lanacion.com.ar/lnmas/tony-robbins-experto-en-desarrollo-personal-la-unica-manera-de-sentir-gratitud-es-salir-de-vos-mismo-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Tony Robbins, especialista em desenvolvimento pessoal, analisou como o ego e a atenção voltada para si mesmo afetam a saúde emocional e sugeriu a gratidão como uma ferramenta imediata para superar isso.", "titulo_pt": "Tony Robbins: a única maneira de sentir gratidão é sair de si mesmo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209065, "titulo": "Architecture is \"much the same\" as music says Daniel Libeskind", "url": "https://www.dezeen.com/2026/10/11/daniel-libeskind-interview-key-projects/", "fonte_id": "dezeen", "data_pub": "2026-10-11T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Daniel Libeskind, arquiteto baseado em Nova York e juiz dos Prêmios Dezeen 2026, conversou com a Dezeen sobre cinco projetos que melhor representam sua abordagem no design. Ele compara a arquitetura à música em sua entrevista.", "titulo_pt": "Arquitetura é 'muito a mesma coisa' que música, diz Daniel Libeskind", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 208599, "titulo": "Qual a história por trás de Mama Afrika, música de Criolo, Amaro e Dino?", "url": "https://www.metropoles.com/metropoles-music/mama-afrika-musica-criolo-amaro-e-dino", "fonte_id": "metropoles", "data_pub": "2026-10-11T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A canção 'Mama Afrika' faz parte do álbum colaborativo 'Criolo, Amaro & Dino'. O trio se apresentará no Festival Estilo Brasil em Brasília no dia 30 de outubro.", "titulo_pt": "Qual é a história por trás de Mama Afrika, música de Criolo, Amaro e Dino?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 208978, "titulo": "Spirit of Hong Kong Awards: Gaza nurse’s obstacle-laden road to becoming a professor", "url": "https://www.scmp.com/news/hong-kong/society/article/3370480/spirit-hong-kong-awards-gaza-nurses-obstacle-laden-road-becoming-professor?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-11T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hammoda Abu-Odah, um enfermeiro de Gaza que se tornou um estudioso em Hong Kong, teve seis oportunidades de estudar no exterior, mas elas foram negadas devido a fechamentos de fronteira e restrições de viagem. Após sete tentativas, ele conseguiu chegar a Hong Kong e prosseguir com sua carreira acadêmica.", "titulo_pt": "Prêmio do espírito de Hong Kong: a jornada de obstáculos de uma enfermeira de gaza que se tornou professora", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 208713, "titulo": "De reinas y princesas. Carolina de Mónaco, siempre fabulosa, Rania deslumbró en una boda e Ingrid de Noruega volvió a reemplazar a su madre", "url": "https://www.lanacion.com.ar/revista-hola/de-reinas-y-princesas-carolina-de-monaco-siempre-fabulosa-rania-deslumbro-en-una-boda-e-ingrid-de-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T06:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A semana foi cheia de eventos para a realeza, com momentos both positive and negative. Carolina de Mónaco e Rania de Jordânia se destacaram em suas aparições, enquanto Ingrid de Noruega também fez sua presença sentida.", "titulo_pt": "Rainhas e princesas. Carolina de Mónaco, sempre fabulosa, Rania impressionou em uma cerimônia e Ingrid de Noruega substituiu sua mãe", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209055, "titulo": "Animals and their people: country shows across the UK – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/oct/11/animals-people-country-shows-across-uk-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-10-11T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fotógrafa Irina Werning, que cresceu no campo na Argentina rodeada de animais, está fotografando animais e suas pessoas em feiras agrícolas e shows de condicionamento rural pelo Reino Unido desde o verão. Seu projeto explora a relação mudando entre humanos e animais, com foco em feiras no Reino Unido e na Argentina.", "titulo_pt": "Animais e suas pessoas: shows rurais pelo reino unido em fotos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 208621, "titulo": "Intestino Irritável: médicos explicam ao Dr. Kalil o papel da saúde mental", "url": "https://www.cnnbrasil.com.br/saude/intestino-irritavel-medicos-explicam-ao-dr-kalil-o-papel-da-saude-mental/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas explicam ao Dr. Kalil que fatores emocionais, sono e atividade física são importantes no tratamento da síndrome do intestino irritável. Os sinais vitais destacam a influência desses aspectos na condição.", "titulo_pt": "Intestino Irritável: especialistas falam sobre o papel da saúde mental, sono e atividade física", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209011, "titulo": "Korea’s daycare center count falls 41% over a decade", "url": "https://www.koreaherald.com/article/10898687", "fonte_id": "korea_herald", "data_pub": "2026-10-11T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rede de creches na Coreia do Sul diminuiu 41% desde o pico em 2013, devido a taxas de natalidade persistentemente baixas. Em 2025, o número de creches caiu para 26.064, um decréscimo de 4.8% em relação a 2024.", "titulo_pt": "Rede de creches na Coreia do sul cai 41% em uma década", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 208588, "titulo": "Brasiliense atingido por onda dá primeiros passos após perder movimentos", "url": "https://www.metropoles.com/distrito-federal/brasiliense-atingido-por-onda-da-primeiros-passos-apos-perder-movimentos", "fonte_id": "metropoles", "data_pub": "2026-10-11T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Filipe de Freitas sofreu um traumatismo raquimedular cervical em 10 de agosto e, exatos dois meses depois, conseguiu tocar violão e nadar.", "titulo_pt": "Brasiliense atingido por onda dá primeiros passos após perder movimentos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 208627, "titulo": "Risco de câncer de mama é maior em mulheres após os 50 anos; veja sinais", "url": "https://www.cnnbrasil.com.br/saude/risco-de-cancer-de-mama-e-maior-em-mulheres-apos-os-50-anos-veja-sinais/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T07:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O risco de câncer de mama é maior em mulheres após os 50 anos, devido a fatores endócrinos e à história reprodutiva associados à exposição a hormônios como o estrogênio, produzido pelo próprio organismo ou administrado externamente.", "titulo_pt": "Risco de câncer de mama é maior após os 50 anos; veja sinais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208641, "titulo": "Obesidade é comum no Brasil e pode levar à morte; veja como prevenir", "url": "https://www.cnnbrasil.com.br/saude/obesidade-e-comum-no-brasil-e-pode-levar-a-morte-veja-como-prevenir/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T06:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A obesidade é uma condição crônica comum no Brasil e está associada a diversos fatores que podem aumentar o risco de diabetes e hipertensão. O Dia de Prevenção da Obesidade, celebrado e milhares sem energia elétrica nos EUA", "url": "https://www.infomoney.com.br/mundo/furacao-isaias-deixa-2-mortos-e-milhares-sem-energia-eletrica-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-10T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias causou duas mortes e deixou milhares sem energia elétrica nos Estados Unidos. O impacto do furacão afetou várias regiões do país, resultando em interrupções significativas de energia e tragédias humanas.", "titulo_pt": "Furacão Isaias causa duas mortes e deixar milhares sem energia nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 206989, "titulo": "São Paulo atinge marco histórico de 2 mil ônibus elétricos na frota", "url": "https://www.metropoles.com/conteudo-especial/sp-onibus-eletricos", "fonte_id": "metropoles", "data_pub": "2026-10-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de São Paulo entregou 250 novos ônibus elétricos, elevando o número total da frota para 2 mil veículos. Com essa ação, a cidade se tornou líder em eletromobilidade no Brasil.", "titulo_pt": "São Paulo atinge marco histórico com 2 mil ônibus elétricos na frota", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 207150, "titulo": "El costo de no anticiparse a los riesgos climáticos en el sistema de salud", "url": "https://www.latercera.com/sustentabilidad/noticia/el-costo-de-no-anticiparse-a-los-riesgos-climaticos-en-el-sistema-de-salud/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute os custos associados à falta de preparo para os riscos climáticos no sistema de saúde. Ele destaca como a não-anticipação pode impactar negativamente o sistema de saúde.", "titulo_pt": "O custo de não se antecipar aos riscos climáticos no sistema de saúde", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207297, "titulo": "Life-threatening Hurricane Isaias makes landfall in Florida, bringing high winds and heavy rain", "url": "https://www.euronews.com/2026/10/10/life-threatening-hurricane-isaias-makes-landfall-in-florida-bringing-high-winds-and-heavy-", "fonte_id": "euronews", "data_pub": "2026-10-10T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias atingiu a Flórida, trazendo ventos fortes e chuva intensa. O Serviço Meteorológico Nacional dos Estados Unidos advertiu sobre uma elevada onda costeira perigosa entre Dauphin Island, Alabama, e Suwannee, Flórida.", "titulo_pt": "Furacão Isaias atinge flórida, trazendo ventos fortes e chuva intensa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 207041, "titulo": "Mudanças bruscas de clima impactam a circulação e o coração; entenda riscos", "url": "https://www.cnnbrasil.com.br/saude/mudancas-bruscas-de-clima-impactam-a-circulacao-e-o-coracao-entenda-riscos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mudanças bruscas de temperatura afetam a circulação e o coração, com o calor dilatando os vasos e baixando a pressão, enquanto o frio os contrai e eleva a frequência cardíaca. Crianças, idosos e pessoas com doenças crônicas são os grupos mais vulneráveis a esses efeitos.", "titulo_pt": "Mudanças bruscas de clima impactam a circulação e o coração; entenda riscos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 207407, "titulo": "Malaysia urged to police its firms in Indonesia as haze shuts schools", "url": "https://www.scmp.com/week-asia/health-environment/article/3370388/malaysia-urged-police-its-firms-indonesia-haze-shuts-schools?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia enfrenta pressão para intensificar o controle sobre suas empresas em relação a supostas conexões com incêndios florestais no e function renderSecao(topico) {

           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

  _fUrl = btn.dataset.url;

    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
