rande taxa sobre empresas tecnológicas americanas que construírem centros de dados de IA no exterior.", "titulo_pt": "Trump ameaça taxa pesada em empresas de tecnologia que construam centros de IA no exterior", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278122, "titulo": "Bukele celebró que sus tropas les están dando una “lección” a las pandillas en Haití, pero perdió dos soldados", "url": "https://www.lanacion.com.ar/el-mundo/bukele-celebra-que-sus-tropas-les-estan-dando-una-leccion-a-las-pandillas-en-haiti-mientras-escala-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente da El Salvador, Bukele, comemorou o desempenho das tropas salvadorenhas em Haiti, onde cerca de 2.500 soldados participam de uma operação contra as facções criminosas. Duas forças armadas, local e das Nações Unidas, relataram 34 mortes durante a operação.", "titulo_pt": "Bukele celebrou que suas tropas estão dando uma ‘aula’ às facções criminosas em haiti, mas perdeu dois soldados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278271, "titulo": "Trump defends Putin relationship, warns AI data centres must stay in US", "url": "https://www.aljazeera.com/news/2026/11/20/trump-defends-putin-relationship-warns-ai-data-centres-must-stay-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, defendeu sua relação com Putin e alertou que centros de dados de inteligência artificial devem permanecer nos EUA. Além disso, ele comentou sobre a guerra no Irã e elogiou sua visita à China durante uma ampla coletiva de imprensa.", "titulo_pt": "Trump defende relação com Putin e alerta sobre centros de AI nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278272, "titulo": "Two Salvadoran soldiers killed in Haiti while handling explosives", "url": "https://www.aljazeera.com/news/2026/11/20/two-salvadoran-soldiers-killed-in-haiti-while-handling-explosives?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois soldados salvadenses morreram em explosão no Haiti enquanto manipulavam explosivos. Outros dois soldados ficaram feridos, sendo este o primeiro incidente fatal envolvendo tropas no país desde outubro.", "titulo_pt": "Dois soldados salvadenses morrem em explosão no Haiti", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 277659, "titulo": "Additional budget passes with no cuts", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868118", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O orçamento adicional foi aprovado sem cortes.", "titulo_pt": "Orçamento adicional aprovado sem cortes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277661, "titulo": "TAIEX plunges almost 18% in worst week since 1991", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868120", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O TAIEX, índice da bolsa de valores de Taiwan, caiu quase 18% em sua pior semana desde 1991. Este declínio foi significativo e marca uma grande volatilidade no mercado de ações taiwanês.", "titulo_pt": "TAIEX cai quase 18% em pior semana desde 1991", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277681, "titulo": "Export orders increase to record high", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/21/2003868104", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As encomendas de exportação atingiram um novo recorde. O aumento nas encomendas reflete uma demanda robusta no mercado internacional.", "titulo_pt": "Encomendas de exportação atingem recorde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277683, "titulo": "Suit alleges Alibaba defrauded shareholders", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/21/2003868106", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo judicial acusa a Alibaba de fraudar acionistas. A alegação sugere que a empresa enganou investidores.", "titulo_pt": "Processo acusa Alibaba de fraudar acionistas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 278264, "titulo": "Zscaler stock jumps 18% on report that CrowdStrike in talks to buy security vendor", "url": "https://www.cnbc.com/2026/11/20/zscaler-crowdstrike-deal.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-20T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de cybersecurity têm buscado aquisições na era da inteligência artificial. O valor das ações da Zscaler aumentou 18% após relatos de que a CrowdStrike está em negociações para adquirir a Zscaler.", "titulo_pt": "Ações da zscaler sobem 18% após relatos de negociações de compra pela CrowdStrike", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 277883, "titulo": "Reino Unido e União Europeia querem interligar mercados de carbono a partir de 2028", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/reino-unido-e-uniao-europeia-querem-interligar-mercados-de-carbono-a-partir-de-2028.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia e o Reino Unido concluíram negociações para interligar seus mercados de emissões a partir de 2028, com o objetivo de aumentar a liquidez e auxiliar as empresas a evitar bilhões de euros em tarifas de carbono na fronteira.", "titulo_pt": "Reino Unido e União Europeia querem interligar mercados de carbono a partir de 2028", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 277884, "titulo": "EUA investigam contabilidade da Nvidia em meio à crise envolvendo ex-CEO, diz jornal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/eua-investigam-contabilidade-da-nvidia-em-meio-a-crise-envolvendo-ex-ceo-diz-jornal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Valores Mobiliários dos Estados Unidos (SEC) está investigando as práticas contábeis da Nvidia. A investigação ocorre em meio a uma crise envolvendo o ex-CEO da empresa.", "titulo_pt": "EUA investigam contabilidade da Nvidia em meio à crise com ex-ceo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 277970, "titulo": "Em sessão volátil, petróleo fecha em alta apesar de fluxo maior em Ormuz", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/em-sessao-volatil-petroleo-fecha-em-alta-apesar-de-fluxo-maior-em-ormuz/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petróleo fechou em alta em uma sessão volátil, apesar do aumento do fluxo de petróleo no Estreito de Ormuz. Donald Trump afirmou que o Irã deseja encerrar a guerra no Oriente Médio, mas não busca um acordo 'aceitável' para republicanos.", "titulo_pt": "Em sessão volátil, petróleo fecha em alta apesar de aumento do fluxo em Ormuz", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277917, "titulo": "IPO da Anthropic não estanca liquidação de ações de tecnologia nos EUA", "url": "https://www.poder360.com.br/poder-economia/ipo-da-anthropic-nao-estanca-liquidacao-das-acoes-de-tecnologia-nos-eua/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IPO da Anthropic não conseguiu estancar a liquidação de ações de tecnologia nos EUA, com o Nasdaq recuando mais de 3,5% e o S&P 500 registrando o pior desempenho em mais de um ano.", "titulo_pt": "IPO da Anthropic não freia queda das ações de tecnologia nos EUA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277886, "titulo": "Quanto da sua carteira deveria estar em renda fixa?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/quanto-da-sua-carteira-deveria-estar-em-renda-fixa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proporção de renda fixa em uma carteira pode variar de 30% a 100%, dependendo dos objetivos do investidor, dos riscos que ele está disposto a assumir e dos retornos do mercado. A escolha ideal não é única e pode mudar com as condições do mercado.", "titulo_pt": "Quanto da sua carteira deveria estar em renda fixa?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 277979, "titulo": "Diretora do Fed defende ação contra inflação: “Não temos esse luxo”", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/diretora-do-fed-defende-acao-contra-inflacao-nao-temos-esse-luxo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lisa Cook defendeu que atrasar ajustes nos juros pode levar o Fed a aumentar os taxas mais tarde, afetando famílias e o sistema financeiro. A diretora do Fed argumenta que não há 'luxo' de adiar essas medidas.", "titulo_pt": "Diretora do Fed defende não adiar medidas contra inflação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277982, "titulo": "Soja sobe após quatro sessões de queda em Chicago; milho e trigo recuam", "url": "https://www.cnnbrasil.com.br/agro/soja-sobe-apos-quatro-sessoes-de-queda-em-chicago-milho-e-trigo-recuam/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços da soja tiveram uma recuperação parcial após quatro sessões de queda em Chicago, impulsionados por compras de oportunidade e pela valorização do farelo. O milho e o trigo encerraram a semana com perdas.", "titulo_pt": "Soja recupera-se após quatro sessões de queda em Chicago; milho e trigo recuam", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277889, "titulo": "Trump ameaça impor taxas pesadas a empresas dos EUA que construírem data centers no exterior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/trump-ameaca-impor-taxas-pesadas-a-empresas-dos-eua-que-construirem-data-centers-no-exterior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que pretende aplicar taxas pesadas às empresas americanas que construam data centers no exterior. A medida visa concentrar investimentos e infraestrutura tecnológica nos Estados Unidos, em meio à concorrência com a China pelo domínio da inteligência artificial.", "titulo_pt": "Trump ameaça taxar empresas americanas que construam data centers no exterior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 277890, "titulo": "Executivo faz fortuna com IPO da Anthropic, mas ganho poderia ser maior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/executivo-faz-fortuna-com-ipo-da-anthropic-mas-ganho-poderia-ser-maior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T19:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores do Vale do Silício e primeiros funcionários da Anthropic estão ganhando fortunas com a oferta pública inicial de ações da empresa de inteligência artificial. O IPO pode ter rendido ainda mais se tivesse sido realizado mais cedo.", "titulo_pt": "Executivo faz fortuna com IPO da Anthropic, mas ganho poderia ser maior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278244, "titulo": "Trump floats major tax on U.S. companies constructing data centers overseas", "url": "https://www.axios.com/2026/11/20/us-ai-trump-data-centers-overseas", "fonte_id": "axios", "data_pub": "2026-11-20T19:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, sugeriu que irá bloquear as empresas americanas de construir data centers no exterior ou impostar um 'grande imposto' sobre elas se fizerem isso. Esta medida visa manter a infraestrutura de inteligência artificial no país, após a expansão de data centers se tornar um ponto de debate nas eleições de meios de mandatos recentes.", "titulo_pt": "Trump considera impor grande imposto a empresas americanas que construam data centers no exterior", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 278303, "titulo": "’Tis the season to be grateful to China", "url": "https://www.ft.com/content/3f972ef6-f945-4139-a2d0-124a5bfdf71e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-20T18:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que China está fazendo mais para o clima do que outros países, ignorando críticas nas conferências internacionais como COP.", "titulo_pt": "É a temporada de agradecer à China", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 277682, "titulo": "House describes Nvidia sales approved to China", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/21/2003868105", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia obteve aprovação para vender seus produtos para a China. O Departamento de Comércio dos Estados Unidos informou que a venda foi aprovada conforme o esperado.", "titulo_pt": "Departamento de comércio dos EUA aprova vendas da Nvidia para a China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 278315, "titulo": "Google's latest search page redesign drops the search button, adds AI sidebar", "url": "https://arstechnica.com/ai/2026/11/googles-latest-search-page-redesign-drops-the-search-button-adds-ai-sidebar/", "fonte_id": "ars_technica", "data_pub": "2026-11-20T21:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova versão da página de busca do Google inclui um painel lateral com ferramentas de inteligência artificial, eliminando o botão de pesquisa. Isso torna mais fácil acessar essas ferramentas diretamente na página de busca.", "titulo_pt": "Google atualiza página de busca sem botão de pesquisa e adiciona painel AI", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 278316, "titulo": "Meta reconsiders 2030 net-zero goal amid record emissions from AI data centers", "url": "https://arstechnica.com/ai/2026/11/meta-reconsiders-2030-net-zero-goal-amid-record-emissions-from-ai-data-centers/", "fonte_id": "ars_technica", "data_pub": "2026-11-20T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta está reconsiderando seus objetivos de sustentabilidade para 2030. A empresa está avaliando as emissões recordes de seus centros de dados de IA no contexto desses objetivos.", "titulo_pt": "Meta reavalia metas de sustentabilidade para 2030 diante de emissões recorde de centros de dados de IA", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 278310, "titulo": "Trump replaces US cyber chief after outages hit flights, banks and NSA", "url": "https://www.scmp.com/news/us/politics/article/3375298/trump-replaces-us-cyber-chief-after-outages-hit-flights-banks-and-nsa", "fonte_id": "scmp", "data_pub": "2026-11-20T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, nomeou a chefe de informações do Pentágono para substituir o antigo chefe de cibersegurança, Sean Cairncross, após uma série de falhas que afetaram voos, bancos e comunicações classificadas. Kirsten Davies será a diretora nacional de cibersegurança interina, mas precisará do consentimento do Senado para manter o cargo permanentemente.", "titulo_pt": "Trump substitui chefe de cibersegurança após falhas impactarem voos, bancos e NSA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277885, "titulo": "Alice Huang, suspeita de espionagem na Nvidia, tem parentes ligados à indústria militar da China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/alice-huang-suspeita-de-espionagem-na-nvidia-tem-parentes-ligados-a-industria-militar-da-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alice Huang, central no escândalo da Nvidia, mantém conexões com a indústria de defesa chinesa através de parentes e associados, de acordo com uma análise de documentos corporativos e uma empresa de pesquisa independentes publicada pelo The New York Times.", "titulo_pt": "Alice Huang, suspeita de espionagem na Nvidia, tem parentes ligados à indústria militar da China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278121, "titulo": "Los políticos echan mano a la IA y a la polémica para llamar la atención: los riesgos de sobregirarse", "url": "https://www.lanacion.com.ar/politica/los-politicos-echan-mano-a-la-ia-y-a-la-polemica-para-llamar-la-atencion-los-riesgos-de-sobregirarse-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T21:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Políticos de diferentes tendências, incluindo libertários, peronistas e dirigentes locais, estão adotando a inteligência artificial e gerando polêmica para chamar a atenção, com o horizonte da campanha eleitoral de 2027.", "titulo_pt": "Políticos recorrem à IA e à polêmica para chamar a atenção: os riscos de exagero", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278200, "titulo": "Silicon Valley Is Scrambling Now", "url": "https://www.theatlantic.com/newsletters/2026/11/karp-musk-trump-midterms/689534/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas estão se esforçando para se preparar para um momento pós-Trump, mas esses esforços estão fazendo delas parecerem tolas.", "titulo_pt": "Silicon Valley está correndo agora", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 278317, "titulo": "Researcher plants 2m canaries into the AI supply chain. A privacy disaster surfaced.", "url": "https://arstechnica.com/security/2026/11/a-leaky-ai-supply-chain-is-exposing-secret-user-data-at-an-alarming-rate/", "fonte_id": "ars_technica", "data_pub": "2026-11-20T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador inseriu 2 milhões de dados de canário fictícios na cadeia de suprimentos de IA. Os resultados demonstraram que a privacidade dos dados não é garantida.", "titulo_pt": "Pesquisador planta 2 milhões de canários na cadeia de suprimentos de IA. Desastre de privacidade se manifesta", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 278322, "titulo": "Experts warn: Nearly everyone in AI is susceptible to a honey-trap scheme right now", "url": "https://techcrunch.com/2026/11/20/experts-warn-nearly-everyone-in-ai-is-susceptible-to-a-honey-trap-scheme-right-now/", "fonte_id": "techcrunch", "data_pub": "2026-11-20T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos alertam que quase todos os profissionais de IA estão suscetíveis a esquemas de armadilha docemente tentadora. Tecnólogos estão desenvolvendo tecnologias que podem avançar todos os aspectos do mundo, mas eles podem estar vulneráveis em seus sentimentos, que é o que os esquemas de armadilha docemente tentadora exploram.", "titulo_pt": "Experts alertam: quase todos os profissionais de IA estão suscetíveis a esquemas de armadilha docemente tentadora", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 278326, "titulo": "YouTube is reportedly preparing to settle social media addiction claims for $3 billion", "url": "https://www.theverge.com/streaming/1039096/youtube-social-media-addiction-school-districts-settlement", "fonte_id": "the_verge", "data_pub": "2026-11-20T20:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "YouTube está prestes a pagar US$ 3 bilhões a milhares de distritos escolares para resolver acusações de que seu 'design aditivo' prejudicou crianças, de acordo com relatos da Bloomberg. O acordo incluiria novas proteções para os adolescentes.", "titulo_pt": "Youtube estaria prestes a pagar us$ 3 bilhões por acusações de vício em redes sociais", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 278318, "titulo": "Watching as a giant star swallowed its neighbor and exploded", "url": "https://arstechnica.com/science/2026/11/astronomers-watched-a-star-spiral-to-its-death-inside-a-giant-companion/", "fonte_id": "ars_technica", "data_pub": "2026-11-20T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma estrela brilhante recentemente observada ocorreu quando uma estrela orbitava dentro de outra, levando a um evento de explosão.", "titulo_pt": "Observando como uma gigante estrela engoliu seu vizinho e explodiu", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 278319, "titulo": "NASA’s new Moon plan is taking shape, but some big questions remain", "url": "https://arstechnica.com/space/2026/11/nasas-new-moon-plan-is-taking-shape-but-some-big-questions-remain/", "fonte_id": "ars_technica", "data_pub": "2026-11-20T20:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano da NASA para a Lua está tomando forma, mas ainda existem grandes questões por resolver. Há um debate contínuo sobre pontos técnicos e metodológicos.", "titulo_pt": "Plano da nasa para a lua avança, mas grandes dúvidas permanecem", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 278323, "titulo": "Daniel Ek backs AI researcher’s fusion power startup. Here’s what they’re building.", "url": "https://techcrunch.com/2026/11/20/daniel-ek-backs-ai-researchers-fusion-power-startup-heres-what-theyre-building/", "fonte_id": "techcrunch", "data_pub": "2026-11-20T19:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Daniel Ek, fundador do Spotify, está apoiando a startup Europa Fusion, que foi fundada por um pesquisador de inteligência artificial. A startup está desenvolvendo tecnologia para gerar energia por fusão nuclear.", "titulo_pt": "Daniel Ek apoia startup de energia nuclear fundada por pesquisador de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 278320, "titulo": "Prisons get OK to jam contraband phones. CTIA says nearby phones will be jammed too.", "url": "https://arstechnica.com/tech-policy/2026/11/prisons-get-ok-to-jam-contraband-phones-ctia-says-nearby-phones-will-be-jammed-too/", "fonte_id": "ars_technica", "data_pub": "2026-11-20T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prisões foram autorizadas a usar dispositivos para interferir com telefones contrabandeados. A CTIA informou que essas interferências podem se estender até duas e meia milhas (aproximadamente 4,02 quilômetros) além do local onde os dispositivos estão sendo usados.", "titulo_pt": "Prisões autorizadas a interferir em telefones contrabandeados e seus efeitos podem se estender a distâncias significativas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 278334, "titulo": "Jensen Huang’s ‘Lying’ Alarmed Nvidia Board Ahead of His Resignation", "url": "https://www.wired.com/story/jensen-huangs-lying-alarmed-nvidia-board-ahead-of-his-resignation/", "fonte_id": "wired", "data_pub": "2026-11-20T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselho de administração da Nvidia estava alarmado com acusações de que o ex-CEO Jensen Huang teria mentido sobre múltiplas relações, incluindo com um subordinado direto e uma suposta agente de inteligência chinesa. O principal problema do conselho era a falta de transparência do ex-CEO.", "titulo_pt": "Acusações de 'mentiras' deputaram conselho da Nvidia antes da demissão de Huang", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 278324, "titulo": "AI claimed a solution to the 167-year-old Riemann Hypothesis — and a human did, too", "url": "https://techcrunch.com/2026/11/20/ai-claimed-a-solution-to-the-167-year-old-riemann-hypothesis-and-a-human-did-too/", "fonte_id": "techcrunch", "data_pub": "2026-11-20T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matemáticos estão impressionados com o último resultado gerado por IA e também há uma solução humana competidora.", "titulo_pt": "IA alega ter encontrado solução para a hipótese de Riemann de 167 anos — e um humano também", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 278341, "titulo": "Caribbean corals are in crisis. Fossil reefs can help point to where corals may persist", "url": "https://phys.org/news/2026-11-caribbean-corals-crisis-fossil-reefs.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os restos fósseis de recifes de corais antigos frequentemente estão a poucos metros de corais vivos no Caribe, onde os recifes declinaram drasticamente nas últimas 70 anos. Esses fósseis podem auxiliar na identificação de áreas onde os corais podem sobreviver ao aquecimento futuro.", "titulo_pt": "Recifes de corais no caribe estão em crise. Restos fósseis podem apontar para a persistência futura dos corais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278370, "titulo": "Quantum effect could reverse gravity and violate Einstein’s theory of relativity", "url": "https://www.newscientist.com/article/2599897-quantum-effect-could-reverse-gravity-and-violate-einsteins-theory-of-relativity/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-20T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas investigações matemáticas propuseram um método que poderia fazer a gravidade produzir repulsão entre objetos, desafiando a compreensão tradicional dessa força. Isso poderia violar a teoria de Einstein sobre a relatividade gravitacional.", "titulo_pt": "Efeito quântico poderia inverter a gravidade e violar a teoria de Einstein sobre a relatividade", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 278342, "titulo": "Ancient bison hunting site in Texas challenges long-held assumptions", "url": "https://phys.org/news/2026-11-ancient-bison-site-texas-held.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos questionavam há décadas se as comunidades nativas do Planalto Sul caçavam bisões empurrando os rebanhos por penhascos, uma técnica sofisticada documentada mais para o norte. Agora, um sítio de caça de bisão antigo no Texas desafia essas suposições antigas.", "titulo_pt": "Sítio de caça de bisão antigo no Texas desafia suposições antigas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278371, "titulo": "What is the Riemann hypothesis and why is its solution so monumental?", "url": "https://www.newscientist.com/article/2600226-what-is-the-riemann-hypothesis-and-why-is-its-solution-so-monumental/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-20T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hipótese de Riemann é considerada o problema mais difícil da matemática, e agora, com a combinação da invenção humana, persistência e poder computacional da inteligência artificial, a solução dessa hipótese pode ter sido finalmente encontrada.", "titulo_pt": "O que é a hipótese de Riemann e por que sua solução é tão monumental?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 278343, "titulo": "Scientists discover twist-tunable interlayer excitons in atomically thin anisotropic semiconductors", "url": "https://phys.org/news/2026-11-scientists-tunable-interlayer-excitons-atomically.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando a luz atinge um semicondutor, elétrons e hólogens (vazios deixados quando os elétrons se movem) se combinam formando um excitôn. Em camadas de semicondutores anisotrópicos atômicos, elétrons e hólogens podem residir em camadas diferentes, formando um excitôn intercamada (IE).", "titulo_pt": "Cientistas descobrem excitôns intercamadas reguláveis por torção em semicondutores anisotrópicos atômicos finos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278338, "titulo": "ICE detention of Princeton scientist rattles academia", "url": "https://www.statnews.com/2026/11/20/princeton-researcher-eva-yi-xie-ice-detention-rattles-interational-scholars/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante de pós-graduação que é pesquisador científico na Princeton foi detido pela ICE enquanto viajava para casa após apresentar em uma conferência de neurociência.", "titulo_pt": "Detenção da ICE de pesquisador da Princeton abala a academia", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 278393, "titulo": "On this day in space! Nov. 20, 1998: Russia launches 1st module of International Space Station as construction begins on the largest human-built structure in orbit", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-20-2026", "fonte_id": "space_com", "data_pub": "2026-11-20T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 20 de novembro de 1998, a Rússia lançou o primeiro módulo da Estação Espacial Internacional. Este evento marcou o início da construção da estrutura orbital mais grande construída pela humanidade até então.", "titulo_pt": "20 De novembro de 1998: Rússia lança primeiro módulo da estação espacial internacional, marcando o início da construção", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 278344, "titulo": "Gamified mobile payment features may drive adoption among Gen-Z users", "url": "https://phys.org/news/2026-11-gamified-mobile-payment-features-gen.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa publicada na International Journal of Business Information Systems sugere que recursos gamificados em aplicativos de pagamento móvel podem aumentar significativamente a adoção entre os consumidores de economias emergentes, com homens e mulheres respondendo de maneira quase idêntica.", "titulo_pt": "Recursos gamificados de pagamento móvel podem impulsionar a adoção entre os jovens", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278345, "titulo": "Record-setting X-ray laser reliably generates flashes with wavelengths shorter than distances between atoms", "url": "https://phys.org/news/2026-11-ray-laser-reliably-generates-wavelengths.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores do DESY e European XFEL conseguiram produzir e transportar flashes de laser X-rádio com uma comprimento de onda de aproximadamente 0,04 nanômetros na European XFEL, estabelecendo um novo recorde. Isso permite estudar materiais com uma resolução espacial maior do que nunca antes.", "titulo_pt": "Laser x-rádio estabelece novo recorde gerando flashes com comprimento de onda menor que as distâncias entre átomos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278364, "titulo": "This year’s El Niño is unlike any other on record", "url": "https://www.sciencenews.org/article/super-el-nino-historic-effect-hurricane", "fonte_id": "science_news", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As águas do Oceano Pacífico atingiram temperaturas históricas em 2026, dramaticamente moldando as estações de furacões e as tendências globais das precipitações.", "titulo_pt": "Este El Niño de 2026 é inédito", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 278367, "titulo": "The AI Riemann hypothesis proof is almost certainly true, independent mathematicians attest", "url": "https://www.scientificamerican.com/article/the-ai-riemann-hypothesis-proof-is-almost-certainly-true-independent-mathematicians-attest/", "fonte_id": "scientific_american", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores estão próximos de concluir a verificação de uma suposta solução para a hipótese de Riemann, considerada o problema matemático mais importante não resolvido.", "titulo_pt": "A prova de inteligência artificial da hipótese de Riemann é quase certamente verdadeira, atestam matemáticos independentes", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 278394, "titulo": "Don't turn the moon into the Wild West, scientists warn", "url": "https://www.space.com/astronomy/moon/dont-turn-the-moon-into-the-wild-west-scientists-warn", "fonte_id": "space_com", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estão pedindo uma pausa na exploração industrial da lua para evitar danos irreversíveis ao ambiente lunar. Eles temem que a corrida por recursos possa levar a danos permanentes à lua se não houver uma regulação adequada.", "titulo_pt": "Cientistas advertem para não transformar a lua em 'oeste selvagem'", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 278097, "titulo": "Hipótese de Riemann: IA pode ter resolvido um dos maiores enigmas da matemática após 167 anos", "url": "https://veja.abril.com.br/tecnologia/hipotese-de-riemann-ia-pode-ter-resolvido-um-dos-maiores-enigmas-da-matematica-apos-167-anos/", "fonte_id": "veja", "data_pub": "2026-11-20T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um matemático da Anthropic afirma ter encontrado uma demonstração para a hipótese de Riemann, um dos maiores problemas abertos da matemática, com auxílio de uma IA chamada Claude. A hipótese, formulada em 1859, tem sido um enigma por 167 anos.", "titulo_pt": "IA pode ter resolvido hipótese de Riemann após 167 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278366, "titulo": "New NASA Seed Funding Primes Small Businesses for Innovation", "url": "https://www.nasa.gov/directorates/rtmd/new-nasa-seed-funding-primes-small-businesses-for-innovation/", "fonte_id": "nasa_news", "data_pub": "2026-11-20T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA selecionou 302 projetos inovadores de pequenas empresas, investindo até US$ 171 milhões, para atender às necessidades tecnológicas mais críticas da agência em explorações lunares e marcianas, ao mesmo tempo em que estimula a economia espacial americana. O programa Small Business Innovation Research/Small Business Technology Transfer (SBIR/STTR) da NASA está financiando projetos que podem levar à inovação tecnológica.", "titulo_pt": "Nova aportes da NASA preparam pequenas empresas para a inovação", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 278346, "titulo": "Digital imaging workshop aims to reveal secrets in medieval manuscripts", "url": "https://phys.org/news/2026-11-digital-imaging-workshop-aims-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores utilizaram tecnologia de imagens multiespectrais para descobrir informações ocultas em manuscritos medievais da Biblioteca de Livros Raros e Manuscritos da Universidade de Illinois Urbana-Champaign. Um workshop de imagens digitais foi realizado em outubro como estudo piloto para analisar documentos frágeis e antigos usando essa tecnologia.", "titulo_pt": "Oficina de imagens digitais visa revelar segredos em manuscritos medievais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278347, "titulo": "New hemp plant produces no detectable THC, potentially reducing risk of crop destruction", "url": "https://phys.org/news/2026-11-hemp-thc-potentially-crop-destruction.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Texas A&M AgriLife Research, parte do Sistema da Universidade do Texas, desenvolveram uma planta de cânhamo que não produz cannabidiol (CBD) ou tetrahidrocannabinol (THC) em quantidades detectáveis.", "titulo_pt": "Nova planta de cânhamo não produz THC detectável, potencialmente reduzindo o risco de destruição da colheita", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 277666, "titulo": "Taiwan to host 2030 International Orchid Symposium", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/21/2003868129", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan será o anfitrião do Simpósio Internacional das Orquídeas em 2030. O evento terá como objetivo promover a pesquisa e o compartilhamento de conhecimentos sobre orquídeas de todo o mundo.", "titulo_pt": "Taiwan sediará simpósio internacional das orquídeas em 2030", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 278372, "titulo": "The Venice Biennale's Sham Awards Cannot Artwash Genocide", "url": "https://hyperallergic.com/the-venice-biennales-sham-awards-cannot-artwash-genocide/", "fonte_id": "hyperallergic", "data_pub": "2026-11-20T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações históricas deste ano mostraram que o ataque israelense à Palestina não será ignorado, e que o poder da boicote é maior do que nunca.", "titulo_pt": "Os prêmios falsos de veneza não podem limpar o genocídio", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 278383, "titulo": "The 16 Most Expensive Artworks Ever Sold at Auction", "url": "https://www.artnews.com/list/art-news/market/most-expensive-artworks-ever-sold-at-auction-1234736898/", "fonte_id": "artnews", "data_pub": "2026-11-20T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada venda recorde estabelece um novo padrão, aumenta as aposta e intensifica a frenesi no mercado de arte leiloada.", "titulo_pt": "As 16 obra de arte mais caras vendidas em leilão", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 278373, "titulo": "So You Want to Run an Artist’s Estate?", "url": "https://hyperallergic.com/so-you-want-to-run-an-artists-estate/", "fonte_id": "hyperallergic", "data_pub": "2026-11-20T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O guia explica como gerenciar o patrimônio de um artista, incluindo inventário, planejamento, avaliação, conservação e outros assuntos relacionados.", "titulo_pt": "Você quer gerenciar o patrimônio de um artista?", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 278384, "titulo": "El Greco Masterpiece Gets Its Colors Back After More Than 400 Years", "url": "https://www.artnews.com/art-news/news/el-greco-martyrdom-saint-maurice-restoration-1234807093/", "fonte_id": "artnews", "data_pub": "2026-11-20T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um trabalho de El Greco, considerado um dos maiores artistas de sua época, teve suas cores restauradas após mais de 400 anos. A restauração foi apoiada pela Callia Foundation, fundada por Carmen Reviriego.", "titulo_pt": "Obra-mestre de el Greco recebe novas cores após mais de 400 anos", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 278374, "titulo": "Threading the Names of Alabama’s Black Belt History", "url": "https://hyperallergic.com/threading-the-names-of-alabamas-black-belt-history/", "fonte_id": "hyperallergic", "data_pub": "2026-11-20T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um centro comunitário ao lado da Igreja Batista Mt. Willing, um grupo de mulheres está bordando as heranças dos escravizados em suas patchwork.", "titulo_pt": "Travando os legados dos escravizados do vale do Alabama em suas tapeçarias", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 278418, "titulo": "Scotland’s Paisley Museum to Reopen in Early 2027", "url": "https://www.artforum.com/news/scotlands-paisley-museum-to-reopen-early-2027-1234763970/", "fonte_id": "artforum", "data_pub": "2026-11-20T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Museu de Paisley, que possui uma das maiores coleções municipais de arte na Escócia, está programado para reabrir ao público no início de 2027 após uma reforma de 150 anos. O projeto de transformação de £68,7 milhões começou em 2018, mas sofreu atrasos devido à pandemia de Covid, problemas de construção e inflação.", "titulo_pt": "Museu de Paisley, na escócia, deve reabrir em 2027", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 278377, "titulo": "‘Disclosure Day’ Did Its Biggest Stunts Practically, So the VFX Team Worked Hard to Look Invisible — Watch", "url": "https://www.indiewire.com/features/craft/disclosure-day-vfx-craft-roundtables-1235229693/", "fonte_id": "indiewire", "data_pub": "2026-11-20T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O supervisor de efeitos visuais de 'Disclosure Day', Matthew Butler, explicou na sessão de painéis de ofícios do IndieWire como a combinação de trabalho de dublê e efeitos especiais pode criar magia cinematográfica. A equipe de VFX trabalhou arduamente para que os efeitos parecessem naturais, mesmo que os maiores truques fossem realizados práticamente.", "titulo_pt": "Dia da revelação: efeitos visuais trabalharam para fazer truques práticos parecerem invisíveis", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 278385, "titulo": "‘Grand Theft Auto VI’’s Vice City Pays Homage to the Bass, Among More Art Easter Eggs", "url": "https://www.artnews.com/art-news/news/grand-theft-auto-vice-city-bass-museum-art-oregano-basel-1234807185/", "fonte_id": "artnews", "data_pub": "2026-11-20T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo 'Grand Theft Auto VI' homenageia a cidade de Miami e inclui referências artísticas, como uma versão de uma composição de pedras chamada 'Miami Mountain', criada por Ugo Rondinone e instalada no estabelecimento Bass.", "titulo_pt": "'Grand Theft Auto VI' rende homenagem a miami e ao Bass com referências artísticas", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 278386, "titulo": "Judge Allows Lawsuit Over Allegedly Stolen Fra Angelico to Move Forward", "url": "https://www.artnews.com/art-news/news/bic-heirs-fra-angelico-lawsuit-feigen-estate-ruling-1234807135/", "fonte_id": "artnews", "data_pub": "2026-11-20T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O juiz permitiu que a ação judicial sobre a pintura atribuída a Fra Angelico, que supostamente foi roubada, continue. A decisão é favorável aos herdeiros Bich, mas ainda há muito a ser decidido sobre a propriedade da obra e se ela realmente foi roubada.", "titulo_pt": "Juiz permite que ação judicial sobre pintura atribuída a Fra Angelico, supostamente roubada, continue", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 278387, "titulo": "How do Artworks Acquire Value? New York Art Dealers David Nolan and Anton Svyatsky Weigh In.", "url": "https://www.artnews.com/art-news/news/david-nolan-anton-svyatsky-art-week-nyc-2026-1234806643/", "fonte_id": "artnews", "data_pub": "2026-11-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Nolan, um veterano do mundo da arte, e Anton Svyatsky, um recém-chegado, oferecem suas perspectivas sobre o papel do colecionador de arte no mercado atual.", "titulo_pt": "Como os objetos de arte adquirem valor? David Nolan e Anton Svyatsky, veterano e novato do mercado de arte, se expressam", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 277874, "titulo": "Léa Seydoux diz não ligar para nova Bond girl e que 007 virou 'algo americano'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/lea-seydoux-diz-nao-ligar-para-nova-bond-girl-e-que-007-virou-algo-americano.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-20T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz Léa Seydoux, que atuou com Daniel Craig em filmes de James Bond, afirmou não se importar com a escolha da nova Bond girl. Ela também comentou que o personagem 007 se tornou 'algo americano'.", "titulo_pt": "Léa Seydoux não se importa com a nova Bond girl e diz que 007 se tornou 'americano'", "veiculo turn", "url": "https://phys.org/news/2026-11-el-nio-skiers-paradise-chile.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "El Niño está causando uma grande quantidade de neve nos Sierra Nevada da Califórnia e nas montanhas do sul dos Rockies, criando condições ideais para esquiadores. No entanto, essa precipitação intensa também pode trazer problemas.", "titulo_pt": "El Niño cria paraíso para esquiadores no Chile - agora é a vez dos Sierra Nevada e Rockies do sul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 277204, "titulo": "Fiona, hipopótamo que viralizou nas redes por nascimento prematuro, morre após engolir gorro de lã em zoológico", "url": "https://www.bbc.com/portuguese/articles/cjn502p90dzxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O hipopótamo Fiona, que virou famoso nas redes sociais por seu nascimento prematuro, morreu após engolir um gorro de lã. Durante as últimas dez dias, o animal passou por tentativas de expelir o objeto.", "titulo_pt": "Fiona, hipopótamo viral nas redes por nascimento prematuro, morre após engolir gorro de lã", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277249, "titulo": "Trabajadores escucharon chillidos en los túneles y cuando fueron a ver de dónde provenían se encontraron con cuatro focas atrapadas", "url": "https://www.lanacion.com.ar/lifestyle/trabajadores-escucharon-chillidos-en-los-tuneles-y-cuando-fueron-a-ver-de-donde-provenian-se-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores ouviram chiados em túneis e, ao investigar, encontraram quatro focas presas em cavernas escurecidas e perigosas. Um grupo que defende a fauna salvou os animais.", "titulo_pt": "Trabalhadores ouviram chiados em túneis e encontraram focas presas em cavernas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 277922, "titulo": "Sem acordo em Antália, COP31 passa do prazo e escancara o desafio de repensar a própria COP", "url": "https://exame.com/esg/sem-acordo-em-antalia-cop31-passa-do-prazo-e-expoe-o-desafio-de-repensar-a-propria-cop/", "fonte_id": "exame", "data_pub": "2026-11-20T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 não chegou a um acordo em Antália, ficando sem texto final e atrasada. Panamá ameaçou barrar o texto final, expôs uma regra que permite a alguns países impedirem a adoção de decisões.", "titulo_pt": "Sem acordo em Antália, COP31 passa do prazo e enfrenta desafio de repensar a própria COP", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277241, "titulo": "Nació una cría de tapir en el Ecoparque porteño: por qué es una buena noticia para una especie amenazada", "url": "https://www.clarin.com/informacion-general/nacio-cria-tapir-ecoparque-porteno-buena-noticia-especie-amenazada_0_XfAyR5owXv.html", "fonte_id": "clarin", "data_pub": "2026-11-20T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Yunga, uma criana de tapir, nasceu no Ecoparque porteño, representando um avanço importante para a conservação de uma espécie ameaçada pela caça furtiva e pela deforestação.", "titulo_pt": "Nasceu uma criana de tapir no Ecoparque porteño: por que é uma boa notícia para uma espécie ameaçada", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 277925, "titulo": "COP31: 'Rússia deve pagar por emissões e danos ambientais da guerra', diz vice-ministro da Ucrânia", "url": "https://exame.com/esg/cop31-russia-deve-pagar-por-emissoes-e-danos-ambientais-da-guerra-diz-vice-ministro-da-ucrania/", "fonte_id": "exame", "data_pub": "2026-11-20T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oleksandr Krasnolutskyi, vice-ministro da Ucrânia, afirmou em entrevista à EXAME durante a COP31 que o clima segue como prioridade do país e que a Rússia deve pagar por suas emissões e danos ambientais causados pela guerra. Ele também criticou as negociações de paz que não chegaram a um acordo.", "titulo_pt": "Ucrânia cobra reparações ambientais da Rússia durante COP31", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277083, "titulo": "Temporal de 114 km/h destelha 5 mil casas no RS; três mortes são investigadas", "url": "https://exame.com/brasil/temporal-de-114-km-h-destelha-5-mil-casas-no-rs-tres-mortes-sao-investigadas/", "fonte_id": "exame", "data_pub": "2026-11-20T13:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um temporal com velocidade de 114 km/h destelhou cerca de 5 mil casas no Rio Grande do Sul, deixando 60 feridos e interrompendo serviços essenciais. O governo gaúcho destinou R$ 2 milhões para a situação.", "titulo_pt": "Temporal de 114 km/h destelha 5 mil casas no RS; 60 feridos e r$ 2 milhões liberados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277128, "titulo": "Venezuela apresenta na COP31 modelo próprio de participação comunitária na proteção ambiental", "url": "https://www.brasildefato.com.br/2026/11/20/venezuela-apresenta-na-cop31-modelo-proprio-de-participacao-comunitaria-na-protecao-ambiental/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-20T13:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Venezuela apresenta um modelo próprio de participação comunitária na proteção ambiental e combate às mudanças climáticas, através de projetos locais e políticas de conservação do território. Essa iniciativa foi apresentada pelo ministro do Poder Popular para o Ecosocialismo, Nelson Rodríguez, durante a 31ª Conferência das Nações Unidas.", "titulo_pt": "Venezuela apresenta modelo de participação comunitária na proteção ambiental na COP31", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 276629, "titulo": "Video shows isolated Awá Indigenous people make contact with government team in Brazil", "url": "https://www.euronews.com/2026/11/20/video-shows-isolated-awa-indigenous-people-make-contact-with-government-team-in-brazil", "fonte_id": "euronews", "data_pub": "2026-11-20T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 20 membros do grupo indígena isolado Awá no Amazonas se aproximaram de uma unidade do governo, pedindo yamãs antes de retornarem à floresta. O encontro raro levanta preocupações sobre a saúde e a possível falta de alimentos dos indígenas.", "titulo_pt": "Vídeo mostra membros isolados do povo Awá entrando em contato com equipe do governo no amazonas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276587, "titulo": "Climate crisis is already reshaping global tourism, top destinations remain unprepared, study finds", "url": "https://www.lemonde.fr/en/economy/article/2026/11/20/climate-crisis-is-already-reshaping-global-tourism-top-destinations-remain-unprepared-study-finds_6785143_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-20T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório Destination Climate RiskScan analisa 2.600 regiões em 263 países e conclui que o risco associado às altas temperaturas está intensificando, exigindo adaptação do setor turístico e redução das emissões de gases de efeito estufa, que estão em aumento.", "titulo_pt": "Crise climática já está remodelando o turismo global, destinos principais não se prepararam, estudo aponta", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 276229, "titulo": "Alerta viral: o que explica o aumento recente dos casos de covid-19 no Brasil", "url": "https://veja.abril.com.br/saude/alerta-viral-o-que-explica-o-aumento-recente-dos-casos-de-covid-19-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vírus da COVID-19 continua sendo um risco para os brasileiros, mesmo após um período de baixa incidência. É importante manter os cuidados e continuar a vacinação.", "titulo_pt": "Alerta viral: o que explica o aumento recente dos casos de covid-19 no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276631, "titulo": "Japan: The dark secret behind an island paradise full of rabbits", "url": "https://www.euronews.com/video/2026/11/20/japan-the-dark-secret-behind-an-island-paradise-full-of-rabbits", "fonte_id": "euronews", "data_pub": "2026-11-20T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de coelhos se movem livremente na Ilha Okunoshima, no Japão, encantando visitantes de todo o mundo. No entanto, a triste história de produção secreta de armas químicas escondida por trás do cenário encantador é um segredo sombrio.", "titulo_pt": "Japão: o segredo escuro por trás de uma ilha paradisíaca cheia de coelhos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276282, "titulo": "Chuvas pressionam produtores de mandioca e margens da indústria no Paraná", "url": "https://www.cnnbrasil.com.br/agro/chuvas-pressionam-produtores-de-mandioca-e-margens-da-industria-no-parana/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas limitaram a oferta de mandioca, elevando os preços da raiz. No entanto, os custos no campo aumentaram e a valorização dos derivados não acompanhou essa tendência, reduzindo a rentabilidade da cadeia produtiva.", "titulo_pt": "Chuvas pressionam produtores de mandioca e rentabilidade da indústria no Paraná", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276636, "titulo": "US sells first deep-sea mining leases off American Samoa, days after court ruled against process", "url": "https://www.euronews.com/2026/11/20/us-sells-first-deep-sea-mining-leases-off-american-samoa-days-after-court-ruled-against-pr", "fonte_id": "euronews", "data_pub": "2026-11-20T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump realizou leilões de mineração marinha em águas próximas a American Samoa, mesmo após um juiz federal determinar que as autoridades violaram a lei de proteção à vida selvagem. Grupos ambientalistas prometeram anular os contratos.", "titulo_pt": "EUA realiza primeiro leilão de mineração marinha em águas americanas, após decisão judicial", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276728, "titulo": "Climate talks ditch call to quit fossil fuels as deal nears", "url": "https://www.japantimes.co.jp/environment/2026/11/20/climate-change/cop-fossil-fuel-language/", "fonte_id": "japan_times", "data_pub": "2026-11-20T03:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas na COP31 em Antalya, Turquia, chegaram a um compromisso em questões polêmicas, aumentando as chances de um acordo amplo, embora diluído. O acordo final pode não incluir uma chamada para abandonar os combustíveis fósseis.", "titulo_pt": "Negociações climáticas na cop31 abandonam chamado para abandonar combustíveis fósseis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 278094, "titulo": "Ativista britânico de extrema direita é preso por atacar bote de migrantes", "url": "https://veja.abril.com.br/mundo/ativista-britanico-de-extrema-direita-e-preso-por-atacar-bote-de-migrantes/", "fonte_id": "veja", "data_pub": "2026-11-20T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Thomas, um ativista britânico de extrema direita, foi condenado a 15 meses de prisão por perfurar uma embarcação inflável usada para transportar migrantes pelo Canal da Mancha com uma faca.", "titulo_pt": "Ativista britânico de extrema direita é condenado por atacar bote de migrantes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278274, "titulo": "Gaza’s displaced children celebrate World Children’s Day", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/gazas-displaced-children-celebrate-world-childrens-day?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças deslocadas se reuniram no acampamento de refugiados al-Nuseirat para celebrar o Dia das Crianças.", "titulo_pt": "Crianças deslocadas comemoram dia internacional da criança em acampamento de refugiados", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278275, "titulo": "Sudan’s war leaves disabled children missing out on education", "url": "https://www.aljazeera.com/news/2026/11/20/sudans-war-leaves-disabled-children-missing-out-on-education?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guerra obriga as escolas e centros de reabilitação a fecharem, deixando crianças com deficiências sem acesso à educação.", "titulo_pt": "Guerra deixa crianças com deficiências sem acesso à educação no sudão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278104, "titulo": "‘Não está funcionando’: Condenado gritou de dor durante execução que levou mais de uma hora nos EUA", "url": "https://veja.abril.com.br/mundo/nao-esta-funcionando-condenado-gritou-de-dor-durante-execucao-que-levou-mais-de-uma-hora-nos-eua/", "fonte_id": "veja", "data_pub": "2026-11-20T19:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um condenado gritou de dor durante uma execução que durou mais de uma hora nos Estados Unidos, levando a novos pedidos pela suspensão das execuções por injeção letal no país.", "titulo_pt": "‘Não está funcionando’: condenado gritou de dor durante execução que levou mais de uma hora nos EUA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278202, "titulo": "A Moment of New Hope for the Rohingya Community", "url": "https://thediplomat.com/2026/11/a-moment-of-new-hope-for-the-rohingya-community/", "fonte_id": "the_diplomat", "data_pub": "2026-11-20T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Refugiados rohingya que passaram quase uma década em acampamentos lotados finalmente vêem justiça com a decisão do TC. Agora, eles esperam por ações significativas que permitam seu retorno à casa.", "titulo_pt": "Um momento de esperança nova para a comunidade Rohingya", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 277205, "titulo": "Homem gritou de dor em execução que durou uma hora no Texas, nos Estados Unidos", "url": "https://www.bbc.com/portuguese/articles/c84gn75r49eno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem gritou de dor durante uma execução que durou uma hora no Texas, EUA, semanas após uma mulher de 50 anos sobreviver a duas injeções letais no Tennessee. O uso de pentobarbital, proibido federalmente nos EUA, ainda é utilizado em alguns estados.", "titulo_pt": "Homem gritou de dor em execução que durou uma hora no Texas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277583, "titulo": "One third of attacks on children worldwide recorded in Palestine", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/one-third-of-attacks-on-children-worldwide-recorded-in-palestine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, um terço das violações registradas contra crianças em todo o mundo ocorreram em Palestina.", "titulo_pt": "Um terço dos ataques a crianças mundialmente registrados em 2025 ocorreram em palestina", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 277607, "titulo": "ARTE Europe Weekly: Gender-Based Violence in the Military", "url": "https://balkaninsight.com/2026/11/20/arte-europe-weekly-gender-based-violence-in-the-military/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-20T15:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos de assédio e abuso estão prejudicando a reputação das forças armadas em alguns países europeus. Trata-se de um problema sistêmico?", "titulo_pt": "ARTE Europe Weekly: violência de gênero nas forças armadas", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 277708, "titulo": "UN court cites military Facebook posts while finding Myanmar guilty of genocide", "url": "https://www.theverge.com/policy/1038450/facebook-myanmar-genocide-un", "fonte_id": "the_verge", "data_pub": "2026-11-20T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Internacional de Justiça declarou que a Myanmar cometeu genocídio estatal contra o povo rohingya em 2016 e 2017. A corte mencionou publicações militares no Facebook como parte do esforço de disseminar discurso de ódio contra a minoria muçulmana do país.", "titulo_pt": "Corte internacional de justiça cita publicações militares no Facebook ao condenar Myanmar por genocídio", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 277587, "titulo": "Blood Gold: The Munduruku’s fight for survival in the Brazilian Amazon", "url": "https://www.aljazeera.com/video/fault-lines/2026/11/20/blood-gold-the-mundurukus-fight-for-survival-in-the-brazilian-amazon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa Fault Lines explora como a mineração ilegal de ouro polui e ameaça as comunidades indígenas na Amazônia brasileira.", "titulo_pt": "Sangue de ouro: a luta pela sobrevivência dos Munduruku na amazônia brasileira", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 277643, "titulo": "Vietnam scraps death sentence for drug trafficking", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375257/vietnam-scraps-death-sentence-drug-trafficking", "fonte_id": "scmp", "data_pub": "2026-11-20T11:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Vietnã aboliu a pena de morte para tráfico de drogas e várias outras infrações, mantendo-a apenas para quatro delitos. Segundo a Amnesty International, mais de 1.200 pessoas ainda aguardavam execução no país no final de 2023.", "titulo_pt": "Vietnã elimina pena de morte para tráfico de drogas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277335, "titulo": "‘Weak and dizzy’: the secretive ICE force-feeding tactics that ended a Cuban father’s hunger strike", "url": "https://www.theguardian.com/us-news/2026/nov/20/ice-cuba-hunger-strike-force-feeding", "fonte_id": "guardian_world", "data_pub": "2026-11-20T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luis Alejandro Cora Pérez, um solicitante de asilo cubano, de 32 anos, que estava em greve de fome há três meses, disse em mensagens ao Guardian que havia interrompido sua greve de fome porque a força alimentação pela ICE o deixava fraco e tonto.", "titulo_pt": "Fraco e desorientado: as táticas secretas de força alimentação da ICE que interromperam a greve de fome de um pai cubano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 276738, "titulo": "Malaysia plans to resettle 10,000 Rohingya in Turkey", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375243/malaysia-plans-resettle-10000-rohingya-turkey", "fonte_id": "scmp", "data_pub": "2026-11-20T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Malásia planeja relocalizar 10.000 refugiados rohingya para a Turquia como parte de esforços para resolver um desafio de refugiados com longa duração envolvendo solicitantes de asilo de países como a Myammar. A proposta foi anunciada pelo vice-primeiro-ministro Ahmad Zahid Hamidi.", "titulo_pt": "Malásia planeja relocalizar 10.000 Rohingya na Turquia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 276301, "titulo": "Mianmar cometeu genocídio contra a minoria rohingya, decide corte da ONU", "url": "https://www.metropoles.com/mundo/mianmar-cometeu-genocidio-contra-a-minoria-rohingya-decide-corte-da-onu", "fonte_id": "metropoles", "data_pub": "2026-11-20T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corte principal da ONU decidiu que o Mianmar cometeu genocídio contra a minoria rohingya. Esta é a primeira decisão do órgão judicial mais importante da ONU que atribui responsabilidade por genocídio a um país.", "titulo_pt": "Mianmar cometeu genocídio contra a minoria rohingya, decide corte da ONU", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276362, "titulo": "A batalha na Justiça para apagar homenagem a expoente do racismo científico no Brasil", "url": "https://www.bbc.com/portuguese/articles/cm4gn08l5ldeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação popular está sendo julgada na segunda instância em dezembro com o objetivo de mudar o nome do Hospital Nina Rodrigues, em São Luís, como forma de reparação histórica. O hospital leva o nome de Nina Rodrigues, considerada um expoente do racismo científico no Brasil.", "titulo_pt": "Batalha na Justiça para mudar nome do hospital nina rodrigues, em são luís", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 276281, "titulo": "Mulheres são 61% das vítimas de racismo online denunciado ao Disque 100", "url": "https://www.cnnbrasil.com.br/nacional/brasil/mulheres-sao-61-das-vitimas-de-racismo-online-denunciado-ao-disque-100/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do Aláfia Lab analisou 1.739 denúncias de racismo online de 2011 a 2025, constatando que 61% das vítimas eram mulheres. O perfil mais frequente era de mulheres pretas com idades entre 25 e 30 anos, e houve falta de informações sobre os agressores em muitos dos registros.", "titulo_pt": "Mulheres são 61% das vítimas de racismo online denunciado ao Disque 100", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 277659, "fonte_id": "taipei_times", "titulo": "Additional budget passes with no cuts", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868118", "data_pub": "2026-11-21T00:00:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "Orçamento adicional aprovado sem cortes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277661, "fonte_id": "taipei_times", "titulo": "TAIEX plunges almost 18% in worst week since 1991", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868120", "data_pub": "2026-11-21T00:00:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "TAIEX cai quase 18% em pior semana desde 1991", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277662, "fonte_id": "taipei_times", "titulo": "Moscow hits Kyiv after Putin’s threat of ‘painful’ response", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868121", "data_pub": "2026-11-21T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Moscou ataca Kyiv após ameaça de resposta dolorosa de Putin", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277666, "fonte_id": "taipei_times", "titulo": "Taiwan to host 2030 International Orchid Symposium", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/21/2003868129", "data_pub": "2026-11-21T00:00:00Z", "topico": "cultura", "idioma": "en", "titulo_pt": "Taiwan sediará simpósio internacional das orquídeas em 2030", "ve
