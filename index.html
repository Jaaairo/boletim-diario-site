<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "09/10/2026 07:20", "stats": {"noticias_novas": 808, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Os governos estão enfrentando críticas por sua gestão da crise de custo de vida, o que tem levado a greves e agitação social, conforme alertou Irving Fisher em 1912. Na corrida presidencial, Flávio Bolsonaro planeja intensificar suas campanhas de rua após o primeiro turno, com foco em regiões estratégicas. Lula e Flávio Bolsonaro estão tecnicamente empatados no segundo turno, com 50,9% para Lula e 49,1% para Bolsonaro, de acordo com uma pesquisa Vox Brasil. A campanha de Lula aponta a falta de equilíbrio fiscal de Bolsonaro, enquanto Bolsonaro busca apoio em regiões onde tem maior base eleitoral. Além disso, a Anatel aprovou um comitê de políticas públicas com poderes reduzidos, e o segundo turno das eleições de 2026 ocorrerá em um dia ainda não definido, com o Rio de Janeiro em situação incerta para a escolha do governador.", "mundo": "Navi Pillay recebeu o Prêmio Nobel da Paz de 2026 por sua investigação sobre o genocídio em Gaza; o secretário de Defesa dos EUA anunciou a transmissão ao vivo da execução militar de Nidal Malik Hasan; um candidato chamado Hitler Mussolini venceu uma votação no Peru; Medellín registrou o menor número de homicídios em mais de meio século; e a Coreia do Norte comemora o aniversário do Partido Comunista Coreano com eventos festivos.\n\nA geopolítica global enfrenta diversos desafios e mudanças. A Coreia do Norte continua sendo um problema de segurança regional, com a Coreia do Sul expressando preocupações sobre a cooperação militar com o Japão para enfrentar as ameaças norte-coreanas. Na mesma linha, a Rússia e a China realizaram exercícios militares significativos na Rússia, com Vladimir Putin presente, o que pode ter implicações geopolíticas na região do Cáucaso e do Mar Cáspio. Em outra frente, a França enfrenta um aumento dos juros devido à sua dívida, levantando preocupações sobre a estabilidade financeira da Europa. Além disso, a guerra no Iêmen continua afetando a economia local, enquanto a Ucrânia e a Rússia buscam formas de resolver o conflito. O Irã e a Rússia também estão buscando ampliar sua influência no Oriente Médio. Finalmente, a Coreia do Sul e os Estados Unidos enfrentam tensões na aliança bilateral, com Seul expressando preocupações sobre a cooperação entre as agências de inteligência.", "economia": "O PIB do Brasil deve decelerar para 1,8% em 2026 e 1,5% em 2027, de acordo com o relatório anual da Unctad, indicando um cenário econômico menos favorável no médio prazo. Em outro desenvolvimento, a Anduril, empresa americana especializada em drones e equipamentos de defesa autônomos, recebeu um contrato do Pentágono para construir submarinos nucleares, investindo US$ 3,7 bilhões na construção de um estaleiro em Maryland. A Latam começará a operar aviões da Embraer em rotas de negócios a partir do dia 30 de novembro, enquanto a JPMorgan prevê que as eleições nos Estados Unidos podem levar a um novo boom em Wall Street, com vencedores previsíveis.", "tecnologia": "As últimas notícias em tecnologia abordam diversos aspectos da indústria, com destaque para a segurança e confiança em inteligência artificial (IA). A Nvidia defendeu a criação de uma coalizão para garantir a segurança da IA, enquanto OpenAI demitiu três pesquisadores após uma investigação. Empresas como Anthropic e OpenAI estão planejando cenários para uma possível revolta pública após um evento catastrófico envolvendo IA, refletindo preocupações sobre a segurança e confiabilidade dessas tecnologias. Além disso, a América Latina lidera o risco de exposição de dados com a adoção de IA, segundo um estudo. O Google lançou uma ferramenta gratuita chamada SynthID Detector para ajudar a verificar conteúdo criado por IA, enquanto a Microsoft está permitindo que os assinantes compartilhem os benefícios da IA com outros usuários da conta. A IA também está sendo usada para práticas tradicionais, como consultoria de destino na Coreia do Sul, e para novos tratamentos médicos, como o desenvolvido pela startup Rakuten Medical.", "ciencia": "Um importante avanço na ciência foi a descoberta de um 'planeta fênix', que surgiu das cinzas de uma estrela moribunda, comparado a fênix da mitologia por sua renovação após a destruição. Além disso, um novo estudo sugere que a complexidade cerebral dos coleópteros, como besouros, caranguejos e outros insetos com cabeça arredondada, pode estar relacionada não apenas ao próprio gene, mas à organização tridimensional do genoma. Em outro desenvolvimento, quatro astronautas retornaram à Terra após permanecerem na Estação Espacial Internacional por oito meses, substituindo um companheiro de equipe doente. Este evento marcou um importante momento na pesquisa espacial.", "cultura": "A exposição 'Marília Mendonça – Sentimento Louco' no Museu da Imagem e do Som em São Paulo celebra a carreira e a memória da cantora falecida em 2021. Paralelamente, a 50ª Mostra Internacional de Cinema de São Paulo, que ocorrerá de 15 a 29 de outubro, exibirá 380 filmes em diversos locais da cidade, comemorando a quinquagésima edição do evento. Em outro desenvolvimento cultural, a 38ª Mostra de Cinema de São Paulo está em preparação, com um programa de dança de grande escala planejado para Sydney em janeiro de 2027, composto por 11 obras internacionais e 174 artistas. Além disso, a cantora Fernanda Montenegro, com 96 anos, reflete sobre a vida e a morte em um documentário dirigido por Pedro Waddington, enquanto o D.O.M., restaurante com duas estrelas Michelin, apresenta um novo cardápio de degustação a cada ano, focado em repensar tradições gastronômicas brasileiras.", "sociedade": "A Polônia enfrentou um segundo ataque escolar com faca em dois dias, resultando na morte de uma funcionária e ferimentos em outras duas pessoas. A ação, realizada por um ex-aluno de 15 anos com uma câmera montada no capacete, levanta preocupações de que o incidente possa ter sido um caso de 'copycat'. Em Santiago, no Chile, uma calamidade pública foi declarada devido a um deslizamento de terra que afetou dezenas de casas na região. No Brasil, vários eventos sociais e legais chamaram a atenção, incluindo a morte de um jovem devido a negligência médica, a condenação de um homem a 345 anos de prisão por estuprar familiares, e a criação de um site na Uganda que incentiva o voto em Flávio Bolsonaro através do compartilhamento de conteúdo. Em Madri, Espanha, milhares marcharam em memória de María del Carmen Abascal, uma pensionista de 87 anos que faleceu após ser despejada de seu apartamento, intensificando protestos contra a crise habitacional no país.", "meio_ambiente": "A situação climática global continua preocupante, com altas temperaturas e fortes chuvas registradas em várias regiões. No Brasil, o fenômeno El Niño está causando impactos significativos, especialmente entre as crianças, conforme alerta a Unicef. Em Santiago, no Chile, fortes chuvas resultaram em severos alagamentos, afetando a vida das pessoas locais. No exterior, o Reino Unido enfrenta um erro de planejamento que duplicou o custo do neto-zero, enquanto na Rússia, a forte neve no outono paralisou as estradas. Internamente, a vinícola Aurora conquistou o selo Carbon Free, demonstrando uma tendência positiva na adoção de práticas sustentáveis. No entanto, o desmatamento irregular em áreas protegidas no Rio Grande do Norte é um contraponto, com a ex-secretária de Meio Ambiente sendo denunciada pelo Ministério Público. Além disso, a população de tartarugas gigantes de Aldabra atingiu um recorde de 180.000 animais, uma vitória importante para a conservação global.", "direitos_humanos": "Navi Pillay, jurista sul-africana e defensora dos direitos humanos, recebeu o Nobel da Paz em 2026 por suas contribuições na promoção do direito internacional e na responsabilização por crimes de guerra e genocídio. Pillay, que já atuou em tribunais internacionais e foi Alta Comissária da ONU para os Direitos Humanos, se tornou a 21ª mulher a ganhar esse prestigiado prêmio. Por outro lado, jornalistas do Egito planejam um protesto no fim de semana após seis colegas serem acusados de terrorismo por supostamente trabalhar para o Irmão Muçulmano, o que levanta questões sobre a liberdade de imprensa e possíveis violações de direitos humanos. Além disso, o Comando de Operações de Inteligência da Coreia do Sul afirmou que as leis atuais são insuficientes para combater a repressão transnacional, indicando a necessidade de reformas legais mais robustas. Em Hong Kong, o relatório anual do Tráfico de Pessoas do Departamento de Estado dos EUA classificou a cidade como o nível mais baixo, Tier 3, rebaixando-a da lista de observação Tier 2 Watch List. Essa classificação foi rejeitada pela cidade como 'completamente infundada'."}, "resumo_do_dia": {"politica_nacional": [{"id": 204486, "titulo": "Os governos estão gerindo mal a crise de custo de vida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/os-governos-estao-gerindo-mal-a-crise-de-custo-de-vida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Governos estão lidando mal com a crise de custo de vida, levando a greves, revoltas e agitação social, conforme argumentou Irving Fisher, economista da Universidade Yale, em 1912.", "titulo_pt": "Governos lidando mal com a crise de custo de vida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204499, "titulo": "Flávio planeja intensificar agendas de rua após semana dedicada a negociar apoios no segundo turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/flavio-planeja-intensificar-agendas-de-rua-apos-semana-dedicada-a-negociar-apoios-no-segundo-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro planeja intensificar as agendas de rua no segundo turno, focando nas cidades onde ele tem maior potencial de crescimento. As viagens ainda estão sendo finalizadas, mas serão priorizadas as regiões onde Flávio tem maior chance de ganhar apoios.", "titulo_pt": "Flávio planeja intensificar agendas de rua após semana dedicada a negociar apoios no segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204500, "titulo": "Podcast discute como comunicação digital guia sonhos e frustrações do eleitorado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/podcasts/2026/10/podcast-discute-como-comunicacao-digital-guia-sonhos-e-frustracoes-do-eleitorado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições deste ano podem mostrar uma mudança nas aspirações de uma grande parte da população, com sonhos cada vez mais relacionados ao consumo e ao trabalho, influenciados pelas redes sociais e pelo empreendedorismo digital.", "titulo_pt": "Podcast explora como comunicação digital molda os sonhos e frustrações dos eleitores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204616, "titulo": "Sem bets, ministros de Lula articulam patrocínio da Caixa ao Corinthians", "url": "https://www.metropoles.com/colunas/igor-gadelha/sem-bets-ministros-de-lula-pressionam-caixa-a-patrocinar-corinthians", "fonte_id": "metropoles", "data_pub": "2026-10-09T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois ministros do governo de Lula estão negociando um patrocínio da Caixa Econômica Federal ao Corinthians, que incluiria o nome do banco na camisa do time e nos direitos de nome do estádio.", "titulo_pt": "Sem betas, ministros de Lula articulam patrocínio da Caixa ao Corinthians", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204670, "titulo": "Horário eleitoral gratuito recomeça nesta sexta (9) para 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/horario-eleitoral-gratuito-recomeca-nesta-sexta-9-para-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O horário eleitoral gratuito para o segundo turno recomeçará nesta sexta-feira (9). Os candidatos Luiz Inácio Lula da Silva e Flávio Bolsonaro terão o mesmo tempo de exposição na rádio e na televisão até 23 de outubro.", "titulo_pt": "Horário eleitoral gratuito para 2º turno recomeça nesta sexta (9)", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 204617, "titulo": "Lembrai-vos da eleição presidencial de 2014, a segunda mais apertada", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/lembrai-vos-da-eleicao-presidencial-de-2014-a-segunda-mais-apertada", "fonte_id": "metropoles", "data_pub": "2026-10-09T07:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mencionada é um retrato do momento atual e não uma profecia. Ela reflete a situação na eleição presidencial de 2014, que foi a segunda mais apertada.", "titulo_pt": "Lembrai-vos da eleição presidencial de 2014, a segunda mais apertada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204619, "titulo": "Frente evangélica de apoio a Lula diz que Flávio eleito seria \"retrocesso\"", "url": "https://www.metropoles.com/brasil/frente-evangelica-de-apoio-a-lula-diz-que-flavio-eleito-seria-retrocesso", "fonte_id": "metropoles", "data_pub": "2026-10-09T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de evangélicos progressistas afirma que Flávio Bolsonaro manipula a religião em proveito próprio e representa um retrocesso para a democracia no Brasil. Eles apoiam Lula e consideram que uma vitória de Flávio seria prejudicial.", "titulo_pt": "Frente evangélica de apoio a Lula diz que vitória de Flávio seria 'retrocesso'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204620, "titulo": "Eleições 2026: confira as agendas de Flávio e Lula nesta sexta (9/10)", "url": "https://www.metropoles.com/brasil/eleicoes-2026-confira-as-agendas-de-flavio-e-lula-nesta-sexta-9-10", "fonte_id": "metropoles", "data_pub": "2026-10-09T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos Flávio e Lula iniciam suas agendas para o segundo turno das eleições de 2026 nesta sexta-feira (9/10), buscando apoio eleitoral.", "titulo_pt": "Eleições 2026: confira as agendas de Flávio e Lula nesta sexta (9/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204677, "titulo": "Flávio ganha 1,7 milhão de seguidores após 1º turno; Lula, 958 mil", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-ganha-17-milhao-de-seguidores-apos-1o-turno-lula-958-mil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro ganhou 1,7 milhão de seguidores nas redes sociais após o primeiro turno das eleições, enquanto Lula ganhou 958 mil seguidores. Após 4 de outubro, Lula publicou quase cinco vezes mais conteúdo do que Flávio.", "titulo_pt": "Flávio ganha 1,7 milhão de seguidores após 1º turno; Lula, 958 mil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 204501, "titulo": "Jarbas Soares nega atuação em aporte para instituto de Mendonça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/10/jarbas-soares-nega-atuacao-em-aporte-para-instituto-de-mendonca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jarbas Soares Junior, ex-procurador-geral de Justiça de Minas Gerais, nega ter intermediado uma operação para aplicar recursos do ex-banqueiro Daniel Vorcaro no Instituto Iter, vinculado ao ministro André Mendonça do Supremo Tribunal Federal.", "titulo_pt": "Jarbas Soares nega ter intermediado aporte para instituto de Mendonça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204502, "titulo": "Oferecer um inimigo ao eleitor pode se tornar mais rentável do que resolver problemas concretos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/oferecer-um-inimigo-ao-eleitor-pode-se-tornar-mais-rentavel-do-que-resolver-problemas-concretos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deputado recebeu quase 80% dos votos em uma cidade, enquanto outro construiu sua audiência em nível estadual. Esses exemplos ilustram os novos incentivos da representação política.", "titulo_pt": "Oferecer um inimigo ao eleitor pode se tornar mais lucrativo do que resolver problemas concretos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204504, "titulo": "Fã-clubes de Anitta a BTS se mobilizam para ampliar votos de Lula no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/fa-clubes-de-anitta-a-bts-se-mobilizam-para-ampliar-votos-de-lula-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após obter 45,16% dos votos válidos no primeiro turno, Lula teve que enfrentar Flávio Bolsonaro no segundo turno. Fã-clubes de artistas populares, como Anitta e BTS, estão mobilizando-se nas redes sociais para tentar aumentar o apoio a Lula.", "titulo_pt": "Fã-clubes de Anitta e BTS mobilizam-se para ampliar votos de Lula no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204505, "titulo": "Vorcaro financiou startup de filha de Otto Alencar e negociou obras de arte com aliado de Jaques Wagner", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/vorcaro-financiou-startup-de-filha-de-otto-alencar-e-negociou-obras-de-arte-com-aliado-de-jaques-wagner.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mensagens do ex-banqueiro Daniel Vorcaro indicam que ele negociou com pessoas ligadas aos senadores Otto Alencar e Jaques Wagner no período antes da Operação Compliance Zero, que resultou na prisão de Vorcaro em novembro de 2025. Ele financiou uma startup de filha de Otto Alencar e negociou obras de arte com um aliado de Jaques Wagner.", "titulo_pt": "Vorcaro financiou startup de filha de Otto Alencar e fez negócios com aliado de Jaques Wagner", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204506, "titulo": "Douglas Ruas deve ser declarado governador eleito do RJ sob investigação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/douglas-ruas-deve-ser-declarado-governador-eleito-do-rj-sob-investigacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da Assembleia do Rio de Janeiro, Douglas Ruas (PL), deve ser declarado governador eleito já sob investigação. A Procuradoria-Geral da Justiça instaurou um procedimento em julho para apurar crimes de peculato, lavagem de dinheiro, fraude licitatória e organização criminosa.", "titulo_pt": "Douglas Ruas deve ser declarado governador eleito do RJ sob investigação", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 204720, "titulo": "Por que o split payment da reforma tributária virou disputa entre Lula e Flávio Bolsonaro", "url": "https://exame.com/brasil/por-que-o-split-payment-da-reforma-tributaria-virou-disputa-entre-lula-e-flavio-bolsonaro/", "fonte_id": "exame", "data_pub": "2026-10-09T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A implementação do split payment, um sistema de pagamento automático de impostos sobre o consumo à União, foi criticada pelo partido de Flávio Bolsonaro e defendida pelo governo de Lula.", "titulo_pt": "Por que o split payment da reforma tributária virou disputa entre Lula e Flávio Bolsonaro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204723, "titulo": "Eleições 2026: propaganda eleitoral do 2º turno começa nesta sexta-feira", "url": "https://exame.com/brasil/eleicoes-2026-propaganda-eleitoral-do-2o-turno-comeca-nesta-sexta-feira/", "fonte_id": "exame", "data_pub": "2026-10-09T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A propaganda eleitoral para o segundo turno das eleições de 2026 começa em 9 de outubro, com Lula e Flávio Bolsonaro dividindo o tempo de rádio e televisão igualmente. As regras para a propaganda serão aplicadas durante este período.", "titulo_pt": "Propaganda eleitoral do segundo turno das eleições de 2026 começa em 9 de outubro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 204978, "titulo": "Left-wing candidate Hitler Mussolini wins local vote in Peru", "url": "https://www.euronews.com/2026/10/09/left-wing-candidate-hitler-mussolini-wins-local-vote-in-peru", "fonte_id": "euronews", "data_pub": "2026-10-09T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hitler Mussolini Simeón Flores venceu uma votação local em Queropalca, um distrito com mais de 730 habitantes no departamento de Huánuco, representando o partido centro-esquerda Ahora Nación. Este não é o primeiro Hitler eleito na Peru, apesar de ser o primeiro com esse nome específico a vencer uma votação.", "titulo_pt": "Candidato da esquerda Hitler Mussolini vence votação local no Peru", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 204926, "titulo": "Fort Hood survivor supports gunman's execution by firing squad but questions livestream", "url": "https://www.bbc.co.uk/news/articles/ck1wvqw4lzdvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alonzo Lunsford apoia a execução do atirador em Fort Hood por fuzilamento, mas questiona a transmissão ao vivo do evento. Ele acredita que a punição corresponde ao crime, mas tem dúvidas sobre a exibição pública.", "titulo_pt": "Sobrevivente de fort Hood apoia execução do atirador mas questiona transmissão ao vivo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 205005, "titulo": "‘ICE out!’: New Yorkers protest shooting of a migrant in the city", "url": "https://english.elpais.com/usa/2026-10-09/ice-out-new-yorkers-protest-shooting-of-a-migrant-in-the-city.html", "fonte_id": "elpais_en", "data_pub": "2026-10-09T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem foi morto a tiros por agentes de imigração federais dentro de um carro que transportava uma criança em Nova York. O prefeito Mamdani falou com o presidente Trump, mas não conseguiu libertar o homem.", "titulo_pt": "‘ICE out!’: nova york protesta contra morte de imigrante por agentes federais", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 204944, "titulo": "Hegseth says Fort Hood shooter's military execution will be 'livestreamed'", "url": "https://www.france24.com/en/tv-shows/press-review/20261009-hegseth-says-fort-hood-shooter-s-military-execution-will-be-livestreamed", "fonte_id": "france24", "data_pub": "2026-10-09T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Defesa dos EUA, Pete Hegseth, anunciou que a execução militar do atirador do Fort Hood, Nidal Malik Hasan, será transmitida ao vivo. A notícia também menciona a aprovação de uma reforma eleitoral controversa na Itália e novas aplicações para domínios de nomes como '.fart' e '.trump'.", "titulo_pt": "Hegseth anuncia que execução militar do atirador do Fort Hood será transmitida ao vivo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 205006, "titulo": "Pentagon to broadcast first firing-squad military execution since 1945", "url": "https://english.elpais.com/usa/2026-10-09/the-pentagon-will-broadcast-the-first-firing-squad-execution-since-1945.html", "fonte_id": "elpais_en", "data_pub": "2026-10-09T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nidal Malik Hasan, um psiquiatra militar anteriormente acusado de matar 13 pessoas no Fort Hood em 2009, será enforcado em 3 de dezembro. Esta será a primeira execução por fuzilamento militar desde 1945.", "titulo_pt": "Pentagon planeja transmitir primeira execução por fuzilamento militar desde 1945", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 204809, "titulo": "Medellín registra cinco homicidios en septiembre, el mes con menos casos en medio siglo", "url": "https://elpais.com/america-colombia/2026-10-09/medellin-registra-cinco-homicidios-en-septiembre-el-mes-con-menos-casos-en-medio-siglo.html", "fonte_id": "elpais_america", "data_pub": "2026-10-09T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Medellín registrou cinco homicídios em setembro, o menor número de casos em mais de meio século. Os especialistas debatem se o crime organizado está enfraquecendo ou se está demonstrando seu poder ao governo nacional.", "titulo_pt": "Medellín registra cinco homicídios em setembro, o mês com menos casos em meio século", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 204812, "titulo": "El desbloqueo de medios anunciado por Delcy Rodríguez se queda a medio camino", "url": "https://elpais.com/america/2026-10-09/el-desbloqueo-de-medios-anunciado-por-delcy-rodriguez-se-queda-a-medio-camino.html", "fonte_id": "elpais_america", "data_pub": "2026-10-09T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Venezuela levantou o veto para várias redes de internet, mas ainda mantém a censura em pelo menos 40 portais críticos. Além disso, há restrições para os vistos de jornalistas estrangeiros.", "titulo_pt": "Desbloqueio de mídias anunciado por Delcy Rodríguez se dá parcialmente em venezuela", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 204814, "titulo": "El gas natural de Estados Unidos pone en jaque, una vez más, al sistema energético mexicano", "url": "https://elpais.com/mexico/economia/2026-10-09/el-gas-natural-de-estados-unidos-pone-en-jaque-una-vez-mas-al-sistema-energetico-mexicano.html", "fonte_id": "elpais_america", "data_pub": "2026-10-09T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Há alguns dias, uma falha técnica em um gasoduto no Texas resultou no encerramento de 20% das importações de gás natural dos Estados Unidos para o México. Isso colocou novamente em questão o sistema energético mexicano.", "titulo_pt": "O gás natural dos Estados Unidos ameaça novamente o sistema energético mexicano", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 204815, "titulo": "La vigilancia y el control digital se expande en América Latina al margen de los signos políticos", "url": "https://elpais.com/america-futura/2026-10-09/la-vigilancia-y-el-control-digital-se-expande-en-america-latina-al-margen-de-los-signos-politicos.html", "fonte_id": "elpais_america", "data_pub": "2026-10-09T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da organização Derechos Digitales revela mais de cem violações de cibersegurança em um ano na América Latina. O relatório documenta práticas de ciberpatrulha em Argentina, bloqueios na Venezuela e Nicaragua, e acusações de acoso com inteligência artificial no Brasil.", "titulo_pt": "A vigilância e o controle digital se expandem na América Latina, independentemente dos sinais políticos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 204816, "titulo": "La huella de Los Mayos y el Cartel Jalisco en el negocio de los conciertos musicales en México", "url": "https://elpais.com/us/2026-10-09/la-huella-de-los-mayos-y-el-cartel-jalisco-en-el-negocio-de-los-conciertos-musicales-en-mexico.html", "fonte_id": "elpais_america", "data_pub": "2026-10-09T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As sanções impostas pelos Estados Unidos a uma rede associada ao Cartel de Los Mayos na Baja California revelaram como os cartéis se infiltraram na organização de concertos no México. Essa situação mostra a extensão da influência de organizações criminosas no setor cultural do país.", "titulo_pt": "A marca dos Mayos e o Cartel Jalisco no negócio de concertos musicais no México", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 204925, "titulo": "Firing squad execution to be livestreamed, Pentagon says", "url": "https://www.bbc.co.uk/news/articles/cmy0r96xygx6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pentágono anunciou que a execução será transmitida ao vivo, enquanto Pete Hegseth afirma que será pública. No entanto, um especialista legal considera a decisão inédita e controversa em termos jurídicos.", "titulo_pt": "Execução por fuzilamento será transmitida ao vivo, diz pentágono", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 205130, "titulo": "Senior defense officials of S. Korea, Japan reaffirm cooperation against N. Korean threats", "url": "https://en.yna.co.kr/view/AEN20261009005300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-09T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Altos oficiais de defesa da Coreia do Sul e do Japão reafirmaram a cooperação para enfrentar as ameaças vindas da Coreia do Norte.", "titulo_pt": "Altos oficiais de defesa da Coreia do sul e do Japão reafirmam cooperação contra ameaças da Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 204791, "titulo": "A nova era da 'guerra às drogas', no centro da estratégia de Trump para a América Latina", "url": "https://www.bbc.com/portuguese/articles/ck87zdg420nro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-09T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos estão implementando uma nova abordagem na América Latina, com apoio de líderes de direita aliados, que envolve maior militarização e compara traficantes a terroristas. Este esforço é parte da estratégia de Trump para a região.", "titulo_pt": "A nova era da 'guerra às drogas', no centro da estratégia de Trump para a América Latina", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 205012, "titulo": "New York police push politician to ground during anti-ICE protest", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/new-york-police-push-politician-to-ground-during-anti-ice-protest?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polícias de Nova York empurraram um político durante uma manifestação contra a ICE.", "titulo_pt": "Polícias de nova York empurram político durante protesto contra a ice", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 204612, "titulo": "Houthis atacam aeroporto de Riade e companhias aéreas suspendem voos", "url": "https://www.metropoles.com/mundo/houthis-atacam-aeroporto-de-riade-e-companhias-aereas-suspendem-voos", "fonte_id": "metropoles", "data_pub": "2026-10-09T08:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aviões comerciais foram danificados por estilhaços durante um ataque dos hutis a um aeroporto em Riade. Como resultado, companhias aéreas suspenderam voos no local.", "titulo_pt": "Ataque dos hutis causa danos em aeroporto de Riade e companhias aéreas suspendem voos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 205108, "titulo": "US-Japan-Poland strategic triangle can encourage a ‘peaceful war’", "url": "https://www.scmp.com/opinion/world-opinion/article/3370030/us-japan-poland-strategic-triangle-can-encourage-peaceful-war?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milícias chinesas estiveram em exercício militar com forças russas, bielorrussas e outras na Rússia, enquanto Vladimir Putin assistia a um exercício militar. O exercício, com mais de 47.000 militares, incorporou lições da guerra na Ucrânia e teve um significado além da região de Chelyabinsk.", "titulo_pt": "Triângulo estratégico eua-japão-polônia pode promover uma 'guerra pacífica'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 204699, "titulo": "Anduril agora vai fazer submarinos autônomos", "url": "https://braziljournal.com/anduril-agora-vai-fazer-submarinos-autonomos/", "fonte_id": "brazil_journal", "data_pub": "2026-10-09T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anduril, empresa americana especializada em drones e equipamentos de defesa autônomos, ganhou um contrato do Pentágono para construir submarinos nucleares. A empresa investirá US$ 3,7 bilhões na construção de um estaleiro em Maryland, que deve entrar em operação em 2030.", "titulo_pt": "Anduril agora vai fabricar submarinos autônomos", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 204701, "titulo": "A oportunidade imperdível dos donos da Equipav na Argentina", "url": "https://braziljournal.com/a-oportunidade-imperdivel-dos-donos-da-equipav-na-argentina/", "fonte_id": "brazil_journal", "data_pub": "2026-10-09T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os donos da Equipav, empresa fundadora da Aegea, estão buscando oportunidades de investimento na Argentina, onde o consórcio liderado pela Arcos, composto pelas famílias Toledo e Vettorazzo, venceu a disputa pela AySA, empresa de água e saneamento.", "titulo_pt": "A oportunidade imperdível dos donos da Equipav na Argentina", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 204702, "titulo": "O pai trouxe a Reebok. O filho quer ganhar o Brasil", "url": "https://braziljournal.com/o-pai-trouxe-a-reebok-o-filho-quer-ganhar-o-brasil/", "fonte_id": "brazil_journal", "data_pub": "2026-10-09T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Marfará é comparado a Jane Fonda no mercado de fitness dos Estados Unidos na década de 1980. Ele foi responsável por introduzir conceitos de academias americanas no Brasil.", "titulo_pt": "O pai trouxe a Reebok. O filho quer ganhar o Brasil", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 204485, "titulo": "PIB do Brasil deve desacelerar para 1,8% em 2026 e 1,5% em 2027, diz órgão da ONU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/pib-do-brasil-deve-desacelerar-para-18-em-2026-e-15-em-2027-diz-orgao-da-onu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PIB do Brasil deve desacelerar para 1,8% em 2026 e 1,5% em 2027, segundo o relatório anual da Unctad. O crescimento do PIB foi projetado após uma alta de 2,3% em 2025.", "titulo_pt": "PIB do Brasil deve desacelerar para 1,8% em 2026 e 1,5% em 2027, diz relatório da ONU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205104, "titulo": "DFI Retail Group says it will continue to invest in Hong Kong supermarkets", "url": "https://www.scmp.com/business/article/3370322/dfi-retail-group-says-it-will-continue-invest-hong-kong-supermarkets?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "DFI Retail Group, que opera a maior rede de supermercados de Hong Kong, afirmou que continuará a investir em novas lojas, apesar da cautela dos consumidores. A empresa busca fortalecer sua rede onde há demanda clara e retornos a longo prazo.", "titulo_pt": "DFI Retail Group anuncia investimentos em supermercados de Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 205168, "titulo": "Eight stocks remain frozen despite pause in delisting proceedings", "url": "https://www.koreaherald.com/article/10897919", "fonte_id": "korea_herald", "data_pub": "2026-10-09T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A bolsa de valores da Coreia do Sul pausou os processos de delistagem de ações, mas oito empresas continuam com suas ações congeladas, impedindo que os acionistas vendam suas participações. Isso ocorre apesar das regras mais rígidas estabelecidas pela autoridade financeira e pela Korea Exchange.", "titulo_pt": "Oito ações permanecem congeladas apesar da pausa na delistagem", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 204796, "titulo": "Auditoria em fundos de investimento como elemento de inteligência fiscal", "url": "https://www.jota.info/opiniao-e-analise/artigos/auditoria-em-fundos-de-investimento-como-elemento-de-inteligencia-fiscal", "fonte_id": "jota", "data_pub": "2026-10-09T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A norma da CVM torna os auditores fundamentais no combate à ocultação patrimonial em fundos de investimento. Essa mudança coloca os auditores em uma posição mais ativa na detecção de irregularidades financeiras.", "titulo_pt": "Auditoria em fundos de investimento como ferramenta-chave no combate à ocultação patrimonial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 204797, "titulo": "O poder normativo das agências reguladoras no Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-poder-normativo-das-agencias-reguladoras-no-brasil", "fonte_id": "jota", "data_pub": "2026-10-09T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O poder normativo das agências reguladoras é um tema importante para o direito público e econômico, exigindo uma resposta jurisprudencial consistente do Supremo Tribunal Federal (STF).", "titulo_pt": "O poder normativo das agências reguladoras no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 205061, "titulo": "Nearly 30 years after IMF rescue, Thailand faces new economic test", "url": "https://www.japantimes.co.jp/business/2026/10/09/economy/thailand-economic-test/", "fonte_id": "japan_times", "data_pub": "2026-10-09T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bangcoc sediará a IMF e Banco Mundial na próxima semana, e o ministro das Finanças busca sair da estagnação econômica que durou décadas.", "titulo_pt": "Quase 30 anos após resgate do fmi, tailândia enfrenta novo teste econômico", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 204799, "titulo": "LC 236/26: a reforma do Código Tributário Nacional", "url": "https://www.jota.info/opiniao-e-analise/artigos/lc-236-26-a-reforma-do-codigo-tributario-nacional", "fonte_id": "jota", "data_pub": "2026-10-09T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto trata das penalidades e do lançamento do crédito tributário no Código Tributário Nacional.", "titulo_pt": "LC 236/26: a reforma do Código Tributário Nacional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 204688, "titulo": "Eleições nos EUA podem levar a novo rali em Wall Street? JPMorgan aponta vencedores", "url": "https://www.infomoney.com.br/mercados/midterms-eleicoes-nos-eua-novo-rali-wall-street-jpmorgan-aponta-vencedores/", "fonte_id": "infomoney", "data_pub": "2026-10-09T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições nos Estados Unidos podem influenciar o desempenho do mercado acionário americano, conforme analisado pela JPMorgan. O histórico geral é positivo para a bolsa, mas um recente rally do mercado americano pode ser um fator limitante.", "titulo_pt": "Eleições nos EUA podem levar a novo rali em Wall Street? Jpmorgan aponta vencedores", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 204487, "titulo": "Latam estreia aviões da Embraer em rotas de negócios no final de novembro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/latam-estreia-avioes-da-embraer-em-rotas-de-negocios-no-final-de-novembro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Latam começará a operar com aviões Embraer E195-E2 em rotas de negócios a partir do dia 30 de novembro. Esses voos serão realizados em rotas consideradas de viagens corporativas.", "titulo_pt": "Latam estreia aviões Embraer em rotas de negócios no final de novembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204488, "titulo": "Ex-CEO da Warner Bros. ganha US$ 600 milhões com venda da empresa à Paramount", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/ex-ceo-da-warner-bros-ganha-us-600-milhoes-com-venda-da-empresa-a-paramount.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Zaslav, ex-CEO da Warner Bros. Discovery, recebeu US$ 600 milhões com a venda da empresa para a Paramount Skydance por US$ 110 bilhões, concluída na última terça-feira (6).", "titulo_pt": "Ex-ceo da Warner Bros. Ganha US$ 600 milhões com venda da empresa à Paramount", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204715, "titulo": "Novo ETF do BTG leva ações chinesas para a B3 e papéis brasileiros às bolsas da China", "url": "https://exame.com/invest/mercados/btg-aposta-em-etf-para-dar-acesso-a-china-aos-investidores-pela-b3/", "fonte_id": "exame", "data_pub": "2026-10-09T06:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BTG Asset firmou um acordo com uma das maiores gestoras de investimentos da China para criar um novo ETF que permitirá a acessão de investidores brasileiros e chineses aos mercados de ações de ambos os países. Este produto financeiro permitirá que os investidores de um país acessem os mercados de ações do outro, através das bolsas respectivas.", "titulo_pt": "Novo ETF do BTG unifica ações chinesas com a B3 e papéis brasileiros na bolsa chinesa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204721, "titulo": "Dólar mais baixo pode reduzir margem da soja em 2026/27", "url": "https://exame.com/agro/dolar-mais-baixo-pode-reduzir-margem-da-soja-para-91-em-2026-27/", "fonte_id": "exame", "data_pub": "2026-10-09T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com a maioria da safra ainda sem preço definido, a valorização do real pode reduzir as margens de lucro da soja e do milho na atual safra, de acordo com uma consultoria. O dólar mais baixo também pode diminuir as receitas previstas para a próxima safra de 2026/2027.", "titulo_pt": "Dólar mais baixo pode reduzir margem da soja em 2026/2027", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204726, "titulo": "Mulheres 50+ sustentam famílias e lideram consumo na economia do cuidado, diz estudo", "url": "https://exame.com/esg/mulheres-50-sustentam-familias-e-lideram-consumo-na-economia-do-cuidado-diz-estudo/", "fonte_id": "exame", "data_pub": "2026-10-09T05:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 3.298 brasileiros destaca as diferenças nos hábitos entre homens e mulheres acima dos 50 anos, destacando o papel delas na sustentação das famílias e no consumo na economia do cuidado. As oportunidades identificadas ainda não são amplamente exploradas pelas empresas.", "titulo_pt": "Mulheres acima de 50 anos sustentam famílias e lideram consumo na economia do cuidado, revela estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 205232, "titulo": "Nvidia defends open source AI alliance, saying hundreds and hundreds of companies being vetted", "url": "https://tech.eu/2026/10/09/nvidia-defends-open-secure-ai-alliance-saying-hundreds-and-hundreds-of-companies-being-vetted/", "fonte_id": "tech_eu", "data_pub": "2026-10-09T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia defendeu uma coalizão criada para desenvolver e compartilhar ferramentas para a segurança de IA e defesa cibernética, afirmando que centenas de empresas estão sendo avaliadas. A empresa respondeu a questionamentos sobre a possibilidade de as participantes evitar certos procedimentos.", "titulo_pt": "Nvidia defende aliança de IA aberta, dizendo que centenas de empresas estão sendo avaliadas", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 205155, "titulo": "OpenAI doubles down on decision to fire three AI safety researchers", "url": "https://www.theverge.com/ai-artificial-intelligence/1008604/openai-defends-decision-fire-safety-researchers", "fonte_id": "the_verge", "data_pub": "2026-10-09T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI manteve sua decisão de demitir três pesquisadores de segurança da IA após uma investigação que descobriu que eles violaram 'políticas claras sobre o tratamento de informações sensíveis'.", "titulo_pt": "Openai reafirma decisão de demitir três pesquisadores de segurança da IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 204919, "titulo": "Scoop: AI companies plot \"day after\" scenarios for public revolt", "url": "https://www.axios.com/2026/10/09/ai-companies-day-after-major-attack", "fonte_id": "axios", "data_pub": "2026-10-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos de empresas de IA, como Anthropic e OpenAI, estão planejando cenários para uma revolta pública e política após um evento catastrófico de IA. Eles se preocupam com a possibilidade de um ciberataque que possa interromper serviços financeiros, conectividade da internet ou até mesmo fornecimento de energia e água.", "titulo_pt": "Pente-fino: empresas de IA planejam cenários para revolta pública após evento catastrófico", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 204580, "titulo": "A ferramenta gratuita do Google para você não cair em conteúdo falso de IA", "url": "https://veja.abril.com.br/coluna/planeta-ia/a-ferramenta-gratuita-do-google-para-voce-nao-cair-em-conteudo-falso-de-ia/", "fonte_id": "veja", "data_pub": "2026-10-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O SynthID Detector é uma ferramenta gratuita do Google que verifica imagens, vídeos e áudios em busca de sinais de conteúdo criado ou alterado por inteligência artificial.", "titulo_pt": "Ferramenta gratuita do Google para detectar conteúdo falso de IA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 205151, "titulo": "We’re putting too much faith in AI’s ability to say no", "url": "https://www.technologyreview.com/2026/10/09/1145728/we-are-putting-too-much-faith-in-ai-to-say-no/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde que se começou a considerar a possibilidade de dar às máquinas uma inteligência semelhante à humana, sempre se assumiu que elas teriam a capacidade de dizer não, como os humanos. A maioria das histórias de ficção científica envolvendo robôs desobedientes são, na verdade, advertências sobre os riscos disso.", "titulo_pt": "Estamos depositando muito fé na capacidade da IA de dizer não", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 205152, "titulo": "Job titles of the future: Delivery drone air traffic controller", "url": "https://www.technologyreview.com/2026/10/09/1145737/job-titles-delivery-drone-air-traffic-controller-trevor-wischnewsky/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trevor Wischnewsky, após ver drones entregando pizza e sushi em seu bairro no Texas, decidiu se envolver com a tecnologia. Ele agora é um RPIC, ou 'piloto remoto em comando', em uma empresa chamada FlyTrex.", "titulo_pt": "Título: títulos de cargo do futuro: controlador de tráfego aéreo de drones de entrega", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 205153, "titulo": "We’re still figuring out the side effects of GLP-1 weight-loss drugs", "url": "https://www.technologyreview.com/2026/10/09/1146094/were-still-figuring-out-the-side-effects-of-glp-1-weight-loss-drugs/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos apresentados em uma reunião sobre envelhecimento em Boston sugerem que os medicamentos GLP-1, usados para emagrecimento, podem afetar ao menos algumas medidas da idade biológica. Pessoas com sobrepeso e diabetes que tomam GLP-1s tendem a ter uma idade biológica cerca de dois a três anos menor que a de pessoas semelhantes.", "titulo_pt": "Ainda estamos descobrindo os efeitos colaterais dos medicamentos GLP-1 para perda de peso", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 205163, "titulo": "America’s Hybrid Hype Has Hit the Used Market", "url": "https://www.wired.com/story/america-hybrid-hype-has-hit-the-used-market/", "fonte_id": "wired", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por veículos híbridos usados é tão alta que alguns desses veículos estão sendo vendidos por preços superiores aos de novos.", "titulo_pt": "A Hype dos híbridos usados nos estados unidos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 205060, "titulo": "Data leaks at travel companies could impact millions of customer records", "url": "https://www.japantimes.co.jp/business/2026/10/09/tech/travel-companies-data-breach/", "fonte_id": "japan_times", "data_pub": "2026-10-09T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias empresas de viagens, incluindo Adventure (que opera o site de reserva de viagens Skyticket), H.I.S. e Temairazu, tiveram vazamentos de dados que podem afetar milhões de registros de clientes.", "titulo_pt": "Vazamentos de dados em empresas de viagens podem impactar milhões de registros de clientes", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 204973, "titulo": "OpenAI defends decision to fire researchers: 'These decisions were not about raising safety concerns or speaking out'", "url": "https://www.cnbc.com/2026/10/09/openai-fired-researchers-ai-concerns.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-09T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI justificou a demissão de três pesquisadores de segurança, descrevendo como uma 'grave violação de confiança'. A decisão não estava relacionada a preocupações de segurança ou a manifestações públicas.", "titulo_pt": "Openai defende demissão de pesquisadores de segurança", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 204669, "titulo": "América Latina é líder em risco de exposição de dados na IA, diz estudo", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/america-latina-e-lider-em-risco-de-exposicao-de-dados-na-ia-diz-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revelou que a América Latina é líder no risco de exposição de dados com a adoção da inteligência artificial. A pesquisa indica que a IA auxilia na detecção de vulnerabilidades, mas as defesas tradicionais ainda não estão à altura desse desafio.", "titulo_pt": "América Latina é líder em risco de exposição de dados na IA, diz estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 205156, "titulo": "Microsoft 365 Family subscribers will finally be able to share AI benefits", "url": "https://www.theverge.com/news/1008581/microsoft-365-family-premium-shared-ai-features-storage-changes", "fonte_id": "the_verge", "data_pub": "2026-10-09T07:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está prestes a permitir que os assinantes da Microsoft 365 Family e Premium compartilhem os benefícios da IA, incluindo Copilot, com outros usuários da conta, além do acesso aos aplicativos do Office e ao armazenamento do OneDrive. Anteriormente, apenas o titular da conta podia acessar os benefícios da IA.", "titulo_pt": "Assinantes da microsoft 365 Family e premium poderão compartilhar benefícios de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 205169, "titulo": "AI brings Korean fortune-telling to screen", "url": "https://www.koreaherald.com/article/10897856", "fonte_id": "korea_herald", "data_pub": "2026-10-09T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está sendo utilizada para praticar a consultoria de destino tradicional coreana, com o uso de grandes conjuntos de dados e códigos de vibração permitindo que os usuários acessem ferramentas assistidas por IA ou até mesmo criem seus próprios sites para interpretar as previsões. Um site de consultoria de destino criado pela influenciadora coreana Roro ganhou popularidade após a utilização do modelo de linguagem Claude.", "titulo_pt": "IA leva a consultoria de destino coreana para a tela", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 205233, "titulo": "Spanish Autentic AI raises €1.5M to accelerate AI-powered market research", "url": "https://tech.eu/2026/10/09/spanish-autentic-ai-raises-eur15m-to-accelerate-ai-powered-market-research/", "fonte_id": "tech_eu", "data_pub": "2026-10-09T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Autentic AI, fundada por Dani Diestre, Aniol Carreras e Jacob Bamio, levantou €1,5 milhão em financiamento pré-série A de fundos de venture capital como Baobab Ventures, Lanai Ventures, Acurio Ventures e Masia VC.", "titulo_pt": "Autentic AI levanta €1,5 milhão para acelerar pesquisa de mercado com inteligência artificial", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 204708, "titulo": "EUA apreendem sete domínios ligados a hackers chineses; entenda", "url": "https://exame.com/mundo/eua-apreendem-sete-dominios-ligados-a-hackers-chineses-entenda/", "fonte_id": "exame", "data_pub": "2026-10-09T06:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos apreenderam sete domínio , "fonte_id": "scmp", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades russas negaram que a morte de uma técnica de laboratório de 28 anos, que trabalhava em uma instituição anti-pestilencial na Sibéria, esteja relacionada com o agente patogênico. O incidente gerou preocupação global, incluindo na China, sobre uma possível propagação da doença e uma falta de transparência.", "titulo_pt": "Rússia revoga medidas relacionadas ao laboratório da peste. China e o mundo devem se aliviar?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 205207, "titulo": "Fish may look fine in urban waters but their genes tell a different story", "url": "https://phys.org/news/2026-10-fish-fine-urban-genes-story.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Blue damselfish são abundantes ao longo das costas urbanizadas de Okinawa, mas a atividade genética desses peixes indica um custo oculto da vida em ambientes impactados pela humanidade.", "titulo_pt": "Peixes podem parecer saudáveis em águas urbanizadas, mas seus genes contam uma história diferente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205208, "titulo": "'Molecular movie' finally reveals how penicillin is made", "url": "https://phys.org/news/2026-10-molecular-movie-reveals-penicillin.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da Universidade de Oxford e colaboradores internacionais capturaram etapas químicas rápidas nunca vistas na formação de antibióticos β-lactâmicos como o penicilina, fornecendo insights valiosos para o desenvolvimento futuro de antibióticos. Os resultados foram publicados na revista Nature Catalysis.", "titulo_pt": "‘Filme molecular’ revela etapas rápidas na formação do penicilina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205209, "titulo": "3D genome 'entanglement' may explain how cephalopods evolved complex brains", "url": "https://phys.org/news/2026-10-3d-genome-entanglement-cephalopods-evolved.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes sugerem que a complexidade cerebral dos coleópteros cefalópodos, como octôpodes, calamares e cuttufios, pode estar relacionada não apenas ao próprio gene, mas à organização tridimensional do genoma. A pesquisa indica que a estrutura 3D do genoma pode ter contribuído para o desenvolvimento de sistemas nervosos avançados e comportamentos complexos.", "titulo_pt": "Organização tridimensional do genoma pode explicar a evolução de cérebros complexos em cefalópodos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205059, "titulo": "Japan sees record number of workers’ compensation approvals for mental health in fiscal 2025", "url": "https://www.japantimes.co.jp/news/2026/10/09/japan/japan-mental-health-compensation-claims/", "fonte_id": "japan_times", "data_pub": "2026-10-09T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de aprovações de indenizações trabalhistas para saúde mental atingiu um recorde em 2025, marcando o sétimo ano consecutivo de crescimento.", "titulo_pt": "Japão registra número recorde de aprovações de indenizações para saúde mental em 2025", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 205210, "titulo": "Hurricane Isaias strengthens en route to US Gulf Coast", "url": "https://phys.org/news/2026-10-hurricane-isaias-en-route-gulf.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hurrican Isaias fortaleceu para uma categoria 2 enquanto se dirige para a costa do Golfo dos Estados Unidos, levando a evacuações obrigatórias e interrompendo a produção de petróleo e gás. O Ce
