<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<script>
const D = {"gerado_em": "09/09/2026 07:26", "stats": {"noticias_novas": 825, "resumos_gerados": 238}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A crise no Supremo Tribunal Federal (STF) continua a dominar o cenário político, com decisões controversas e pressões sobre o presidente do tribunal, Luís Roberto Barroso. Fachin, que enfrenta crescente pressão para agir, ainda não convocou uma sessão plenária para avaliar a conduta dos ministros, segundo especialistas. A decisão do ministro André Mendonça, do STF, de afastar Andrei Rodrigues, diretor-geral da Polícia Federal, agravou a crise institucional, gerando críticas por falta de proporcionalidade e atropelo aos ritos processuais. O afastamento de Rodrigues, que lembra as interferências de Jair Bolsonaro na PF, gerou reações de delegados da corporação e foi defendida por Romeu Zema, presidenciável do Novo. Além disso, a campanha de Flávio Bolsonaro decidiu não pedir a prisão de Andrei após o afastamento, mantendo uma posição mais moderada. Outros eventos relevantes incluem a doação de Haakon Lorentzen, primo do novo rei da Noruega, de R$ 700 mil a candidatos de quatro estados, e a negativa de presidenciáveis em apresentar propostas fiscais concretas, segundo a economista Rafaela Vitória.", "mundo": "A tensão geopolítica continua a dominar o cenário internacional, com destaque para os conflitos na região da Ucrânia. Um ataque a drone russo próximo à fronteira entre Ucrânia e Moldova resultou em pelo menos duas mortes, enquanto 17 drones atingiram o território moldavo em agosto. Esses incidentes refletem a escalada da guerra na região. Em outro front, o Reino Unido está liderando a pressão contra Israel, rompendo com seu histórico alinhamento com a França e os Estados Unidos, em oposição aos assentamentos israelenses, o que pode gerar tensões entre os países. Além disso, a Coreia do Sul está se aproximando de um potencial papel militar no Estreito de Ormuz, refletindo seu dilema de apoiar aliados de segurança importantes sem envolvimento em conflitos que não iniciou.\n\nA situação geopolítica está em destaque, com a escalada de tensões entre os Estados Unidos e o Irã. Os Estados Unidos destruíram cinco petroleiros iranianos e atacaram navios-pipa de petróleo iranianos no Estreito de Ormuz, em resposta a tentativas de ataques do Exército Revolucionário Islâmico do Irã. A Coreia do Norte continua a expandir suas capacidades nucleares, construindo uma nova instalação de enriquecimento de urânio no complexo Yongbyon. Além disso, a China e a Rússia prometem laços mais estreitos e estratégicos com a Coreia do Norte. A China também está progredindo com sua missão Tianwen 3 de retorno de amostras do Marte, planejada para 2028. A Coreia do Sul está considerando o deslocamento de navios para o Estreito de Ormuz. Em outro front, a Ucrânia e a Moldávia enfrentam tensões na fronteira, com ataques a um ponto de passagem fronteiriço resultando em duas mortes. A situação do gás na Europa é preocupante, com preços atingindo o nível mais alto desde 2022. No contexto regional, a Ásia Oriental está recalibrando sua posição em relação à Taiwan, enquanto a Europa se depara com a crescente importância de estratégias de autoajuda em um mundo hostil.", "economia": "Os preços do petróleo Brent subiram para US$ 100 por barril pela primeira vez desde julho, devido a tensões entre Estados Unidos e Irã, que aumentaram as preocupações sobre interrupções no suprimento global de energia. Além disso, o governo dos Estados Unidos impôs uma proibição de importação de produtos canadenses como motocicletas, álcool e produtos lácteos, aprofundando a guerra comercial com o país. O Banco Central do Brasil está elaborando regras para evitar abusos na oferta digital de crédito, enquanto o Ministério de Minas e Energia avisa sobre a possibilidade de paralisação da estatal PPSA por falta de verba. As fusões e aquisições movimentaram R$ 210,7 bilhões até agosto, com os Contratos de Produção Rural (CPRs) representando 49,2% dos recursos contratados no início da safra 2026/27. O Brasil produziu 271,2 mil veículos em agosto, registrando uma alta de 9,4% em comparação com o mesmo mês do ano anterior.", "tecnologia": "Um pesquisador da Anthropic se demitiu expressando preocupações sobre os riscos associados aos laboratórios de inteligência artificial (IA) que estão desenvolvendo sistemas cada vez mais poderosos, refletindo um crescente desconforto entre os trabalhadores na indústria de tecnologia da Silicon Valley. Em outro desenvolvimento, a OpenAI anunciou que sua IA resolviu um dos problemas do Milênio da matemática, embora a comunidade matemática questione a autenticidade do resultado. A Google investirá 13 bilhões de euros na infraestrutura de IA na Finlândia, incluindo centros de dados e infraestrutura para modelos de IA. A Meta lançou um assistente de IA chamado Muse, capaz de fornecer sugestões personalizadas com base em conversas e atividades nas redes sociais WhatsApp e Instagram, apesar de preocupações internas sobre o gerenciamento de dados pessoais. Além disso, a D-Wave, empresa especializada em computação quântica, fechou um acordo de US$ 100 milhões com o Departamento de Comércio dos Estados Unidos para avançar em tecnologias de computação quântica, com o governo obtendo uma participação acionária minoritária na empresa.", "ciencia": "A OpenAI anunciou na terça-feira (8) que sua nova tecnologia de inteligência artificial havia resolvido um dos Problemas do Milênio, uma série de desafios matemáticos importantes ainda não resolvidos. Esses problemas foram criados para desafiar os principais matemáticos do mundo e levar a avanços significativos na área. No entanto, um matemático desafiou a reivindicação. Em outro desenvolvimento, a China e o Nepal enfrentaram inundações, enquanto a China anunciou a possível recuperação de cabelos em pacientes com alopecia através de um medicamento para artrite, além de outros sete pontos científicos importantes. Entre eles, a NASA registrou os solstícios de 4995 a 5001, marcando a passagem de 1 quilômetro de altitude pelo rover Curiosity. No Rio Grande do Norte, o Centro de Lançamento da Barreira do Inferno retomou lançamentos com uma missão de microgravidade chamada PSM-R. Além disso, a FDA nomeou chefes interinos de centros de medicamentos e vacinas para cargos permanentes, trazendo estabilidade a uma agência que vinha sofrendo com as saídas de lideranças de alto nível.", "cultura": "A Fundação Freelands anunciou prêmios de £100.000 para reconhecer o papel crucial da cultura na reconstrução de comunidades, destacando a importância do apoio à criatividade comunitária. No Museu de Arte Moderna de São Paulo, as portas foram reabertas com novos espaços e elementos de comunicação visual, incluindo uma escultura metálica comparada a um gigante aracnídeo. A Fundação Freelands também premiará organizações que promovem criatividade e oportunidades comunitárias, reforçando a conexão entre cultura e reconstrução social.", "sociedade": "A educação foi um tema central nas notícias. A governadora Hochul anunciou a expansão do pré-escolar gratuito em Nova York, com 402 distritos agora oferecendo vagas. No Brasil, 81% dos alunos já estudam sem usar celulares, segundo o estudo PISA, o que indica a necessidade de uma abordagem mais ampla para resolver os desafios educacionais. Em contraste, a violência escolar foi relatada em Seul, com cerca de 2,9% dos estudantes tendo experimentado violência nas escolas. Além disso, a violência contra trabalhadores na América Latina também foi noticiada, com a morte de David Elías Ojeda Vázquez, de 22 anos, em José C. Paz, e a greve dos bancários avançando pelo país, afetando o atendimento em bancos públicos.", "meio_ambiente": "Ainda se teme a falta de segurança hídrica no Reino Unido devido a uma onda de calor que afeta o país, levantando preocupações sobre os níveis nos reservatórios e a suprimento de alimentos. No Chile, uma das maiores florações do Deserto do Atacama em duas décadas está ocorrendo, com as primeiras flores já aparecendo. No Nepal, mais de 1.370 pessoas morreram e mais de 5.100 permanecem desaparecidas devido a inundações na fronteira com China. No Chile, a SMA impôs uma multa de mais de 669 milhões de pesos chilenos a uma empresa de saúde por infrações ambientais na planta de tratamento de esgoto de San Ramón. Um estudo indica que o biometano pode reduzir as emissões do setor de transporte em até 75%, destacando o potencial brasileiro na produção desse combustível e na exportação de tecnologias para o setor. Além disso, três tigres de sumatra, considerados criticamente em perigo de extinção, receberam vacinas e microchipagens em um zoológico perto de Atenas como parte de esforços de conservação.", "direitos_humanos": "Ativistas dos direitos das mulheres realizaram uma manifestação em Paris, França, em protesto contra a proposta de lei sobre violência sexual que está sendo examinada pelo parlamento. Em outro desenvolvimento, uma operação policial nos Estados Unidos resgatou 79 crianças desaparecidas, muitas das quais estavam em situações de exploração e negligência. Em relação aos direitos humanos, uma operação judicial em França resultou em acusações contra o empresário Olivier Bouygues e seus funcionários por estabelecer um sistema de recompensas para a morte de espécies em perigo. Além disso, a Coreia do Sul considera apresentar uma denúncia criminal contra a Google em relação à exposição de informações pessoais de vítimas de crimes sexuais digitais. Outro evento importante foi o relatório que registrou 1.063 vítimas globais de munições de cluster em 2025, um dos maiores números de vítimas anuais registrados."}, "resumo_do_dia": {"politica_nacional": [{"id": 153448, "titulo": "As 10 propostas de súmula que serão votadas pelo Carf em setembro", "url": "https://www.jota.info/tributos/as-10-propostas-de-sumula-que-serao-votadas-pelo-carf-em-setembro", "fonte_id": "jota", "data_pub": "2026-09-09T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Recursos Fiscais (Carf) votará em setembro 10 propostas, incluindo Cide sobre royalties, contratos de conta corrente e IRRF sobre beneficiários identificados.", "titulo_pt": "As 10 propostas de súmula que serão votadas pelo Carf em setembro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 153303, "titulo": "Sem regulamentação, governo tenta sancionar PL dos minerais nesta semana", "url": "https://www.cnnbrasil.com.br/infra/sem-regulamentacao-governo-tenta-sancionar-pl-dos-minerais-nesta-semana/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo tenta sancionar o Projeto de Lei dos minerais nesta semana, mas o evento ainda depende da agenda do presidente Lula. Os critérios para a atuação do conselho de minerais críticos e outras regras ainda precisam ser definidos.", "titulo_pt": "Sem regulamentação, governo tenta sancionar PL dos minerais nesta semana", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 153290, "titulo": "Por que Lula vai frear ataques a Mendonça e Flávio terá cautela com Andrei", "url": "https://www.metropoles.com/colunas/milena-teixeira/por-que-lula-vai-frear-ataques-a-mendonca-e-flavio-tera-cautela-com-andrei", "fonte_id": "metropoles", "data_pub": "2026-09-09T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro planeja ser cauteloso no tratamento do caso Andrei. O ex-presidente Lula pode evitar ataques a Ministro Alexandre de Moraes, enquanto Flávio terá cuidado no manejo das acusações contra o advogado Andrei.", "titulo_pt": "Por que Lula vai evitar ataques a moraes e Flávio terá cautela com Andrei", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 153458, "titulo": "Entenda por que campanha de Flávio vê afastamento de Andrei como ‘mais vantajoso’ que o de Moraes", "url": "https://veja.abril.com.br/brasil/entenda-por-que-campanha-de-flavio-ve-afastamento-de-andrei-como-mais-vantajoso-que-o-de-moraes/", "fonte_id": "veja", "data_pub": "2026-09-09T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio considera que o afastamento de Andrei é mais vantajoso que o de Moraes. A campanha acredita que Flávio precisa do ministro Moraes no STF para manter a pressão e a ligação com Lula.", "titulo_pt": "Entenda por que campanha de Flávio vê afastamento de Andrei como 'mais vantajoso' que o de Moraes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 153208, "titulo": "STJ retoma julgamento para decidir valor dos atrasados pagos a aposentados na Justiça", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/stj-retoma-julgamento-para-decidir-valor-dos-atrasados-pagos-a-aposentados-na-justica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) retoma um julgamento crucial para a determinação do valor dos atrasados pagos a aposentados que buscam benefícios do INSS por meio da Justiça. O julgamento será realizado nesta quarta-feira (9).", "titulo_pt": "STJ retoma julgamento para decidir valor dos atrasados pagos a aposentados na Justiça", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 153222, "titulo": "Primo do novo rei da Noruega doa R$ 700 mil a candidatos de quatro estados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/primo-do-novo-rei-da-noruega-doa-r-700-mil-a-candidatos-de-quatro-estados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haakon Lorentzen, primo do novo rei da Noruega, doou R$ 700 mil para sete candidatos de Rio de Janeiro, Bahia, Sergipe e Maranhão nas eleições deste ano.", "titulo_pt": "Primo do novo rei da Noruega doa R$ 700 mil a candidatos de quatro estados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 153310, "titulo": "O Grande Debate: Decisão de afastar chefe da PF é justa ou excessiva?", "url": "https://www.cnnbrasil.com.br/politica/o-grande-debate-decisao-de-afastar-chefe-da-pf-e-justa-ou-excessiva/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T08:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Andrei Rodrigues foi afastado da direção da Polícia Federal. A decisão foi tomada pelo ministro André Mendonça, do Supremo Tribunal Federal, após pedido do Partido Novo.", "titulo_pt": "O Grande Debate: decisão de afastar chefe da PF é justa ou excessiva?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 153449, "titulo": "A reforma do STF: uma pauta para todos os candidatos e partidos políticos", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-reforma-do-stf-uma-pauta-para-todos-os-candidatos-e-partidos-politicos", "fonte_id": "jota", "data_pub": "2026-09-09T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise recente no Supremo Tribunal Federal não é um acidente, mas reflete o modelo de funcionamento deste órgão. O texto sugere que essa situação é resultado do modo como o STF opera.", "titulo_pt": "A reforma do STF: uma pauta para todos os candidatos e partidos políticos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 153452, "titulo": "Dados pessoais como instrumento de constrangimento público e contracampanha eleitoral", "url": "https://www.jota.info/opiniao-e-analise/artigos/dados-pessoais-como-instrumento-de-constrangimento-publico-e-contracampanha-eleitoral", "fonte_id": "jota", "data_pub": "2026-09-09T08:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sem regulamentação sobre a extração e descarte de dados de celulares, esses dados podem ser utilizados como ferramenta política para constrangimento público e contracampanha eleitoral.", "titulo_pt": "Dados pessoais como instrumento de constrangimento público e contracampanha eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 153388, "titulo": "Fachin sob pressão e 'sem ferramentas': por que presidente do STF não consegue debelar crise às vésperas de eleição", "url": "https://www.bbc.com/portuguese/articles/cm2r1yxmmg1o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-09T07:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, está sob crescente pressão para fornecer respostas rápidas, mas ainda não convocou uma sessão plenária para avaliar a conduta dos ministros. Os especialistas ouvidos pela BBC News Brasil consideram que Fachin tem ferramentas limitadas para atuar na crise à beira da eleição.", "titulo_pt": "Fachin sob pressão e 'sem ferramentas': por que presidente do STF não consegue debelar crise às vésperas de eleição", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 153300, "titulo": "Campanha de Tabata suspeita de ato criminoso em princípio de incêndio em QG", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/campanha-de-tabata-suspeita-de-ato-criminoso-em-principio-de-incendio-em-qg", "fonte_id": "metropoles", "data_pub": "2026-09-09T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipe de Tabata Amaral relatou movimentação suspeita em frente ao comitê de campanha antes e depois de um princípio de incêndio ocorrer. A campanha suspeita de um ato criminoso.", "titulo_pt": "Campanha de Tabata suspeita de ato criminoso em princípio de incêndio em QG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 153319, "titulo": "Não há proposta fiscal concreta dos presidenciáveis, diz Rafaela Vitória", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/nao-ha-proposta-fiscal-concreta-dos-presidenciaveis-diz-rafaela-vitoria/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T07:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economista Rafaela Vitória afirma que nenhum dos candidatos presidenciais apresentou uma proposta fiscal concreta. Segundo ela, todos reconhecem a necessidade de ajuste fiscal, mas não detalharam como pretendem realizar esse ajuste.", "titulo_pt": "Não há proposta fiscal concreta dos presidenciáveis, diz economista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 153223, "titulo": "Crise no STF reflete politização da corte e problema estrutural, dizem especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/crise-no-stf-reflete-politizacao-da-corte-e-problema-estrutural-dizem-especialistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte do Brasil (STF) enfrenta sua 'mais aguda crise de sua história', de acordo com uma carta de ex-presidentes da corte. Especialistas ouvidos pela Folha afirmam que os desgastes recentes refletem uma estrutura que se tornou disfuncional ao longo dos anos.", "titulo_pt": "Crise no STF reflete politização da corte e problema estrutural, dizem especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 153224, "titulo": "Avante tenta sustentar alta de Cury para ampliar bancada e avalia mais financiamento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/avante-tenta-sustentar-alta-de-cury-para-ampliar-bancada-e-avalia-mais-financiamento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Avante está utilizando o crescimento de Augusto Cury nas pesquisas para eleger mais deputados federais e ampliar a bancada do partido. O partido agora busca maneiras de manter o bom momento de Cury até a eleição.", "titulo_pt": "Avante busca manter ascensão de Cury para ampliar bancada", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 153225, "titulo": "Procuradoria vincula 14 candidatos ao crime organizado em 5 estados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/procuradoria-vincula-14-candidatos-ao-crime-organizado-em-5-estados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Eleitoral impugnou registros de candidaturas de pelo menos 14 políticos associados ao crime organizado em cinco estados brasileiros. Este esforço visa impedir a participação de criminosos na política nas eleições de 2026.", "titulo_pt": "Procuradoria impugna candidaturas de 14 políticos ligados ao crime organizado em cinco estados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 153216, "titulo": "Entre presidenciáveis, 4 propõem veto a bets sem compensar R$ 12,2 bi em impacto fiscal; veja planos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/entre-presidenciaveis-4-propoem-veto-a-bets-sem-compensar-r-122-bi-em-impacto-fiscal-veja-planos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro dos candidatos à Presidência propõem a proibição de sites de apostas, conhecidos como bets, mas nenhum destes planos explica como o governo compensará a perda de arrecadação estimada em R$ 12,2 bilhões para 2025.", "titulo_pt": "Quatro presidenciáveis propõem proibição de bets sem explicar compensação fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 153999, "titulo": "China on track to launch Mars sample-return mission in 2028: 'If accurate, this represents a Sputnik moment'", "url": "https://www.space.com/astronomy/mars/china-on-track-to-launch-mars-sample-return-mission-in-2028-if-accurate-this-represents-a-sputnik-moment", "fonte_id": "space_com", "data_pub": "2026-09-09T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está progredindo com sua missão Tianwen 3 de retorno de amostras do Marte, que planeja lançar em 2028 e retornar um conjunto de solo e rochas vermelhas da superfície do planeta à Terra em 2031.", "titulo_pt": "China em trilha para lançar missão de retorno de amostras do marte em 2028: 'se for preciso, isso representa um momento Sputnik'", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 153552, "titulo": "‘Russia’s frontline moving west,’ Moldova’s president warns after border checkpoint attack – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/09/europe-ukraine-russia-zelenskyy-germany-merz-afd-norway-king-harald-v-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-09T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da Moldávia, Maia Sandu, emitiu uma declaração após um ataque a um ponto de passagem fronteiriço com onhap_news", "data_pub": "2026-09-09T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal ordenou que Kwon Hyuk-bin, fundador da Smilegate, pague a sua esposa uma indenização de 2,55 trilhões de wones em divórcio. O caso ocorreu em Seul em 9 de setembro.", "titulo_pt": "Tribunal ordena que fundador da Smilegate pague indenização recorde de 2,55 trilhões de wones à esposa em divórcio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 153368, "titulo": "“Tecnologia virou ponto de partida”: a aposta da Gupy em agentes de IA para o RH", "url": "https://exame.com/negocios/tecnologia-virou-ponto-de-partida-a-aposta-da-gupy-em-agentes-de-ia-para-o-rh/", "fonte_id": "exame", "data_pub": "2026-09-09T06:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Gupy está utilizando tecnologia de inteligência artificial em seu processo de recrutamento e gestão de pessoas. A empresa está implementando soluções que automatizam etapas de contratação e gestão de pessoas.", "titulo_pt": "Tecnologia se tornou ponto de partida: a aposta da Gupy em agentes de IA para o RH", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 153369, "titulo": "IA de shopping atende 83% dos clientes como humana — e até aprendeu árabe sozinha", "url": "https://exame.com/inteligencia-artificial/ia-de-shopping-atende-83-dos-clientes-como-humana-e-ate-aprendeu-arabe-sozinha/", "fonte_id": "exame", "data_pub": "2026-09-09T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Syn planeja implantar ferramentas de inteligência artificial em shoppings como o Cidade São Paulo, Grand Plaza e Tietê Plaza. A IA já atende 83% dos clientes de forma humana e até aprendeu árabe sozinha.", "titulo_pt": "IA de shopping atende 83% dos clientes como humana — e aprendeu árabe sozinha", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 153370, "titulo": "Meta desistiu de medir funcionários pela quantidade de IA. O que isso ensina sobre produtividade?", "url": "https://exame.com/inteligencia-artificial/meta-desistiu-de-medir-funcionarios-pela-quantidade-de-ia-o-que-isso-ensina-sobre-produtividade/", "fonte_id": "exame", "data_pub": "2026-09-09T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta decidiu abandonar o uso da quantidade de inteligência artificial consumida como critério de avaliação de desempenho dos funcionários. Essa mudança ilustra os desafios associados à utilização do consumo de IA como indicador de produtividade no ambiente de trabalho.", "titulo_pt": "Meta deixou de medir funcionários pela quantidade de IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 153376, "titulo": "Um ‘não’ de uma IA de recrutamento pode te barrar em todas as vagas, mostra Stanford", "url": "https://exame.com/carreira/um-nao-de-uma-ia-de-recrutamento-pode-te-barrar-em-todas-as-vagas-mostra-stanford/", "fonte_id": "exame", "data_pub": "2026-09-09T05:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Stanford identificou uma 'monocultura algorítmica' onde o rejeito de uma inteligência artificial de recrutamento por um empregador pode resultar em rejeição em várias outras vagas, mesmo por empresas diferentes.", "titulo_pt": "Um ‘não’ de uma IA de recrutamento pode te barrar em todas as vagas, mostra estudo da Stanford", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 153949, "titulo": "SK hynix union to revote on rejected wage deal next week", "url": "https://en.yna.co.kr/view/AEN20260909007000320", "fonte_id": "yonhap_news", "data_pub": "2026-09-09T05:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os trabalhadores sindicalizados da SK hynix farão uma nova votação na próxima semana sobre um acordo salarial rejeitado.", "titulo_pt": "Trabalhadores da SK hynix irão re votar acordo salarial rejeitado na próxima semana", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 153841, "titulo": "Quartz deposit purity in central China ‘highly similar’ to US Spruce Pine standard: study", "url": "https://www.scmp.com/news/china/science/article/3366916/quartz-deposit-purity-central-china-highly-similar-us-spruce-pine-standard-study?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-09T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Geólogos identificaram uma nova reserva de quartzo no centro da China que pode produzir quartzo de alta pureza comparável à qualidade do quartzo produzido na mina líder mundial de Spruce Pine, nos Estados Unidos. Este quartzo de alta pureza chinesa é descrito como tendo propriedades 'altamente similares' ao produzido na mina de North Carolina.", "titulo_pt": "Pura do depósito de quartzo central da China 'altamente semelhante' ao padrão de Spruce Pine dos EUA: estudo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 153236, "titulo": "IA teria solucionado um dos Problemas do Milênio da matemática, afirma OpenAI", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/ia-teria-solucionado-um-dos-problemas-do-milenio-da-matematica-afirma-openai.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI anunciou na terça-feira (8) que sua nova tecnologia de inteligência artificial teria resolvido um dos Problemas do Milênio, uma série de desafios matemáticos importantes ainda não resolvidos. Esses problemas foram criados para desafiar os principais matemáticos do mundo e levar a avanços significativos na área.", "titulo_pt": "IA teria solucionado um dos Problemas do Milênio da matemática, afirma OpenAI", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 153954, "titulo": "Families' interest in their kids' education is falling around the globe as scores drop, test shows", "url": "https://phys.org/news/2026-09-families-kids-falling-globe-scores.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos países de alta renda, o interesse das famílias na educação dos filhos está diminuindo, conforme mostram resultados recentes de uma prova padronizada realizada em todo o mundo, que indica quedas nas notas escolares.", "titulo_pt": "Interesse das famílias na educação dos filhos diminui em muitos países ricos devido a piores resultados em testes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 153955, "titulo": "Nepal's flood disaster and the impact of climate change loom large in the icy shadow of Mont Blanc", "url": "https://phys.org/news/2026-09-nepal-disaster-impact-climate-loom.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As comunidades de montanhas francesas e italianas que estão nas bases do Monte Branco, a montanha branca, têm observado por séculos geleiras e neve que parecem eternas. O desastre de inundações no Nepal e o impacto do aquecimento global estão se tornando crescentemente visíveis na sombra desta montanha.", "titulo_pt": "Desastre de inundações no nepal e impacto do aquecimento global sobram na sombra do monte branco", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 153956, "titulo": "These bulbs have evolved to avoid being eaten. You can take advantage of that", "url": "https://phys.org/news/2026-09-bulbs-evolved-eaten-advantage.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Plantações que produzem bulbos evoluíram para evitar serem comidos. Os jardineiros podem aproveitar essa característica para proteger suas plantas.", "titulo_pt": "Esses bulbos evoluíram para evitar serem comidos. Você pode aproveitar isso.", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 153690, "titulo": "OpenAI claims to have solved the 90-year-old Navier-Stokes math problem in 88 hours", "url": "https://www.cnbc.com/2026/09/09/openai-navier-stokes-math-problem-solved.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-09T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI afirma que 10.000 de seus agentes resolveram o problema matemático Navier-Stokes de 90 anos em 88 horas, mas um matemático desafiou a reivindicação.", "titulo_pt": "Openai alega ter resolvido o problema matemático Navier-Stokes de 90 anos em 88 horas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 153951, "titulo": "Opinion: Autonomous AI will beat AI-assisted physicians at some medical tasks by 2030", "url": "https://www.statnews.com/2026/09/09/ai-medicine-assisted-physicians-research-autonomy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-09T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ezekiel J. Emanuel e Abe Baker-Butler afirmam que, até 2030, a IA autônoma provavelmente ultrapassará tanto médicos que não recebem assistência de AI quanto médicos que recebem assistência de AI em cinco tarefas cognitivas médicas essenciais.", "titulo_pt": "Opinião: IA autônoma superará médicos assistidos por AI em algumas tarefas médicas até 2030", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 153952, "titulo": "Opinion: AMA CEO: AI won’t replace doctors — it will work alongside them", "url": "https://www.statnews.com/2026/09/09/ai-medicine-doctors-replacement-debate-ama-ceo/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-09T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O objetivo não deve ser reproduzir o sistema de saúde atual com menos humanos, escreve o CEO da American Medical Association, John Whyte.", "titulo_pt": "Opinião: CEO da AMA: AI não substituirá médicos — eles trabalharão juntos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 153953, "titulo": "STAT+: Can AI fix health care? In the chaos of emergency rooms, the technology comes up short", "url": "https://www.statnews.com/2026/09/09/ai-healthcare-limitations-emergency-room-study-medical-scribe-impact/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-09T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de inteligência artificial tem sido prometida como uma solução para muitos problemas de saúde, incluindo o combate ao câncer. No entanto, sua aplicação prática nos ambientes de urgência revela limitações significativas.", "titulo_pt": "A inteligência artificial pode melhorar a saúde? Os desafios na urgência", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 153850, "titulo": "China-Nepal floods; arthritis drug restores alopecia patients’ hair: 7 science highlights", "url": "https://www.scmp.com/news/china/science/article/3366721/china-nepal-floods-arthritis-drug-restores-alopecia-patients-hair-7-science-highlights?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-09T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram identificados sete pontos científicos importantes. Uma companhia satelital chinesa de radar enviou seis satélites para monitorar um colapso de geleira na fronteira entre China e Nepal. Também foi noticiado a possível recuperação de cabelos em pacientes com alopecia através de um medicamento para artrite.", "titulo_pt": "Floods na fronteira china-nepal e tratamento para alopecia: 7 destaques científicos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 153958, "titulo": "Calculative mindsets linked to greater willingness to bend moral rules", "url": "https://phys.org/news/2026-09-mindsets-linked-greater-willingness-moral.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas que tendiam a analisar experiências como problemas de custo-benefício matemático foram mais propensas a ignorar regras morais. Essa tendência foi associada a um maior disposto a fazer compromissos éticos por dinheiro ou status, bem como a aceitar ajuda imoral quando lhes beneficiava.", "titulo_pt": "Pensamento calculista relacionado a maior disposição em ignorar regras morais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 153976, "titulo": "Curiosity Blog, Sols 4995-5001: 5,000 (Martian) Days on Mars", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-4995-5001-5000-martian-days-on-mars/", "fonte_id": "nasa_news", "data_pub": "2026-09-09T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O blog registra os sols 4995 a 5001, marcando a passagem de 1 quilômetro de altitude pelo Curiosity. O rover atingiu essa elevação desde o local de pouso no planeta Marte.", "titulo_pt": "Blog do curiosity, Sols 4995-5001: 5.000 (martianos) dias no marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 153237, "titulo": "Base espacial do RN retoma lançamentos com missão de microgravidade", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/base-espacial-do-rn-retoma-lancamentos-com-missao-de-microgravidade.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-09T05:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Centro de Lançamento da Barreira do Inferno, localizado em Parnamirim, Rio Grande do Norte, iniciou uma missão de microgravidade chamada PSM-R entre os dias 1 e 19 de setembro de 2026.", "titulo_pt": "Base espacial do RN retoma lançamentos com missão de microgravidade", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 153811, "titulo": "Japan looks to clamp down on spread of invasive beetle species", "url": "https://www.japantimes.co.jp/news/2026/09/09/japan/invasive-beetle-combat/", "fonte_id": "japan_times", "data_pub": "2026-09-09T05:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A praga conhecida como escaravelho de pescoço vermelho foi encontrada pela primeira vez em 2012 na Prefeitura de Aichi e pode matar árvores de cerejeira.", "titulo_pt": "Japão pretende controlar espécies de escaravelho invasor", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 153379, "titulo": "Um desafio pessoal levou esse biólogo a criar um aplicativo que apoia pacientes com câncer", "url": "https://exame.com/carreira/um-desafio-pessoal-levou-esse-biologo-a-criar-um-aplicativo-que-apoia-pacientes-com-cancer/", "fonte_id": "exame", "data_pub": "2026-09-09T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um biólogo transformou uma experiência pessoal difícil em uma inovação para auxiliar pacientes com câncer através de um aplicativo. O empreendedor utilizou sua experiência para criar uma solução que apoia os pacientes oncológicos.", "titulo_pt": "Experiência pessoal inspira biólogo a criar aplicativo para pacientes com câncer", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 153858, "titulo": "China needs monkeys: lab animal shortage could hinder biotech growth", "url": "https://www.scmp.com/business/companies/article/3366870/china-needs-monkeys-lab-animal-shortage-could-hinder-biotech-growth?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-09T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de biotecnologia na China aumentou significativamente a demanda por modelos experimentais de primatas, apertando a oferta desses animais em laboratórios. A recuperação de financiamentos e de acordos de sublicenciamento de medicamentos inovadores no país este ano contribuiu para esse crescimento.", "titulo_pt": "China precisa de macacos: escassez de animais de laboratório pode prejudicar o crescimento da biotecnologia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 153245, "titulo": "Justiça nega pedido de Marcos Mion para tirar vídeos de Bento Ribeiro do ar", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/justica-nega-pedido-de-marcos-mion-para-tirar-videos-de-bento-ribeiro-do-ar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça negou o pedido de Marcos Mion para remover vídeos em que ele supostamente é ofendido por Bento Ribeiro. A decisão foi tomada pela 1ª Vara Criminal do TJ-SP.", "titulo_pt": "Justiça nega pedido de Marcos Mion para tirar vídeos de Bento Ribeiro do ar", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 153988, "titulo": "‘Who do you really believe?’: the true crime fans who became a part of the story", "url": "https://www.theguardian.com/tv-and-radio/2026/sep/09/a-killer-story-series-review", "fonte_id": "guardian_culture", "data_pub": "2026-09-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série documental A Killer Story da HBO segue um casal que se torna convencido da inocência de Dana Chandler, mulher acusada do assassinato do ex-marido em 2002 em Topeka, Kansas, apesar da evidência contra ela.", "titulo_pt": "Quem você realmente acredita? Os verdadeiros fãs do crime que se tornaram parte da história", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 153989, "titulo": "Why we’re giving £100,000 apiece to a horse box gallery, high-street drop-in and Midlands museum", "url": "https://www.theguardian.com/artanddesign/2026/sep/09/freelands-awards-open-new-horizons-for-art-engagement-in-the-uk", "fonte_id": "guardian_culture", "data_pub": "2026-09-09T08:00:00Z", "idioma": "en", "provavel_duplicat rought-raises-fears-over-water-security?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-09T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ondas de calor recordes tem afetado os agricultores britânicos, levantando preocupações sobre os níveis nos reservatórios e a suprimento de alimentos.", "titulo_pt": "Totalmente dependente da natureza: estiagem no reino unido aumenta temores sobre a segurança hídrica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 153588, "titulo": "Nepal eleva a cerca de 1.370 los muertos por la inundación en la frontera con China", "url": "https://www.latercera.com/mundo/noticia/nepal-eleva-a-cerca-de-1370-los-muertos-por-la-inundacion-en-la-frontera-con-china/", "fonte_id": "la_tercera", "data_pub": "2026-09-09T08:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As autoridades nepalesas relataram que mais de 1.370 pessoas morreram devido às inundações na fronteira com China. Além disso, mais de 5.100 pessoas permanecem desaparecidas.", "titulo_pt": "Nepal registra mais de 1.370 mortos por inundações na fronteira com China", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 153590, "titulo": "SMA sanciona con más de $669 millones a sanitaria por incumplimientos ambientales en Padre Las Casas", "url": "https://www.latercera.com/nacional/noticia/sma-sanciona-con-mas-de-669-millones-a-sanitaria-por-incumplimientos-ambientales-en-padre-las-casas/", "fonte_id": "la_tercera", "data_pub": "2026-09-09T03:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A SMA impôs uma multa de mais de 669 milhões de pesos chilenos a uma empresa de saúde por infrações ambientais na planta de tratamento de esgoto de San Ramón. As violações incluíam deficiências técnicas, falta de monitoramento e descargas de resíduos no rio Huichahue sem a devida classificação.", "titulo_pt": "SMA sanciona sanitária com mais de 669 milhões por incumprimentos ambientais em san ramón", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 152108, "titulo": "Biometano pode reduzir emissões do transporte em até 75%, aponta estudo", "url": "https://www.cnnbrasil.com.br/agro/biometano-pode-reduzir-emissoes-do-transporte-em-ate-75-aponta-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-08T22:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo aponta que o biometano pode reduzir as emissões do setor de transporte em até 75%. O levantamento também destaca o potencial brasileiro na produção desse combustível e na exportação de tecnologias para o setor.", "titulo_pt": "Biometano pode reduzir emissões do transporte em até 75%, aponta estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 152603, "titulo": "Sumatran tiger cubs receive first health checks at Greek zoo", "url": "http://www.euronews.com/video/2026/09/08/sumatran-tiger-cubs-receive-first-health-checks-at-greek-zoo", "fonte_id": "euronews", "data_pub": "2026-09-08T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três tigres de sumatra, considerados criticamente em perigo de extinção, recebem vacinas e microchipagens em um zoológico perto de Atenas como parte de esforços de conservação.", "titulo_pt": "Leões-marinhos de sumatra recebem primeiras verificações de saúde em zoológico grego", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 153040, "titulo": "Q&A: What can – and cannot – be said about global warming’s role in the 2026 Himalayan floods", "url": "https://www.carbonbrief.org/qa-what-can-and-cannot-be-said-about-global-warmings-role-in-the-2026-himalayan-floods", "fonte_id": "carbon_brief", "data_pub": "2026-09-08T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 26 de agosto, inundações flash assolaram uma região himalayense da fronteira do Nepal e da China. Este evento foi o tema de uma pergunta e resposta sobre o papel do aquecimento global nas inundações himalayenses de 2026.", "titulo_pt": "Perguntas e respostas: o que pode e não pode ser dito sobre o papel do aquecimento global nas inundações himalayenses de 2026", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 153707, "titulo": "Women’s rights activists rally in Paris over sexual violence law", "url": "http://www.euronews.com/video/2026/09/09/womens-rights-activists-rally-in-paris-over-sexual-violence-law", "fonte_id": "euronews", "data_pub": "2026-09-09T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ativistas dos direitos das mulheres se reuniram fora do Ministério da Justiça da França enquanto parlamentares examinam uma proposta de lei sobre violência sexual.", "titulo_pt": "Ativistas dos direitos das mulheres se reúnem em Paris para discutir lei sobre violência sexual", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 153309, "titulo": "Crianças encontradas nos EUA: megaoperação resgata 79 desaparecidos", "url": "https://www.cnnbrasil.com.br/internacional/criancas-encontradas-estados-unidos-operacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T08:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A megaoperação Meridian resgatou 79 crianças desaparecidas em Ohio, encontradas em situações de exploração e negligência.", "titulo_pt": "Crianças encontradas nos EUA: megaoperação resgata 79 desaparecidos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 153664, "titulo": "French billionaire Olivier Bouygues stands trial for killing protected birds", "url": "https://www.lemonde.fr/en/france/article/2026/09/09/french-billionaire-olivier-bouygues-stands-trial-for-killing-protected-birds_6757335_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-09T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário francês Olivier Bouygues e cinco de seus funci            return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

function filtrarSecao(topico) {

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

  _fUrl = btn.dataset.url;

  document.getElementById('flag-nota').value = f ? f.nota : '';

}

  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
