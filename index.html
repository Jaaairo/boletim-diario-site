<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "16/09/2026 15:20", "stats": {"noticias_novas": 1060, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Os ministros do Supremo Tribunal Federal (STF) enfrentam vários desafios e conflitos que podem afetar o processo eleitoral. A crise envolvendo o Banco Master e a atuação do presidente do STF, Luís Roberto Barroso, tem causado tensões entre os ministros, com Barroso perdendo o controle sobre o julgamento. O senador Flávio Bolsonaro criticou ministros do STF indicados por Lula, sugerindo que a presença de ministros do Partido dos Trabalhadores (PT) representa uma ameaça à democracia. O presidente Lula também se envolveu na crise, afirmando que a sociedade descobrirá 'quem foi fazer suruba' e que o escândalo foi 'orgia pura'. A sessão extraordinária do STF que julgou a situação de Alexandre de Moraes foi noticiada pela imprensa internacional e gerou 'consequências imprevisíveis' para a eleição presidencial. Além disso, a crise no STF pode influenciar a eleição, conforme especialistas afirmam, e há debates sobre a licença-maternidade e a presença de ministros no processo.", "mundo": "Os Estados Unidos e a Bielorrússia anunciaram a liberdade de 25 prisioneiros políticos em troca do alívio das sanções impostas pelo país, sinalizando um possível melhoramento nas relações entre os dois governos. Em outro desenvolvimento, a União Europeia propôs que o Canadá se torne o primeiro 'membro associado' da União Europeia, em um esforço para fortalecer as relações em um cenário global hostil. O presidente do Líbano, Joseph Aoun, está negociando um acordo de segurança com Israel após a retirada das tropas israelenses do território libanês, com a finalidade de estabilizar a fronteira antes de chegar a um tratado completo. Além disso, a Suécia rejeitou recentemente a ideia de dar mais poder aos partidos de extrema-direita, mas a Europa deve aprender com o envolvimento perigoso da Suécia com ideologias de extrema-direita, já que uma formação com raízes neonazistas tem influenciado o governo sueco há quatro anos.\n\nUm relatório de direitos humanos afirma que Israel está intensificando os ataques contra palestinos na Cisjordânia ocupada, alegando 'eliminação' das condições de vida dos palestinos. Em outro desenvolvimento, o ex-presidente do Kosovo, Hashim Thaçi, foi condenado a 25 anos de prisão por crimes de guerra, o que gerou protestos em Pristina. O Irã custou cerca de 38 bilhões de dólares aos Estados Unidos com a guerra, afetando negativamente a economia e a campanha presidencial de Donald Trump. Além disso, a China propôs um acordo comercial envolvendo uma ampla gama de países do Rim do Pacífico, incluindo os Estados Unidos, durante um fórum de economias asiáticas-pacíficas em novembro, embora a implementação desse acordo possa ser difícil.", "economia": "A Continental Resources, empresa liderada pelo aliado de Trump Harold Hamm, planeja investir na Venezuela após uma avaliação independente das oportunidades no país, em resposta ao pedido do presidente dos Estados Unidos. O Brasil enfrenta desafios no setor previdenciário devido ao mercado dinâmico, conforme destacou Castello Branco, presidente da FenaPrevi. O Banco Mundial nomeou Michael Kremer, vencedor do Prêmio Nobel, como seu próximo economista-chefe, substituindo Indermit Gill. O petróleo caiu quase 2% nesta quarta-feira após ataques da Arábia Saudita a instalações houthis no Iêmen, afetando o mercado global. O IBC-Br, indicador do Banco Central, registrou uma retração de 0,2% em julho, mas cresceu 1,1% em comparação com julho de 2025. O Superior Tribunal de Justiça (STJ) decidiu que o ICMS não compõe a base de cálculo para o PIS/Cofins, seguindo o entendimento do Supremo Tribunal Federal (STF).", "tecnologia": "O avanço da inteligência artificial (IA) continua a gerar debates e preocupações em diversos países e empresas. O Papa Francisco alertou sobre o risco de IA substituir decisões humanas, enquanto o secretário do Tesouro dos EUA, Scott Bessent, indicou que os EUA estão dispostos a discutir riscos compartilhados com a China durante conversas sobre IA. A Apple está planejando retornar ao mercado de servidores para atender à crescente demanda por poder computacional, devido ao avanço da IA. Além disso, o secretário-geral da ONU alertou sobre os riscos associados à IA, após o presidente dos EUA, Donald Trump, minimizar a questão. Executivos de empresas como OpenAI e Anthropic têm chamado para uma pausa no desenvolvimento de IA avançada, enquanto a Anthropic lançou o 'Word do Claude', um assistente de texto integrado ao Microsoft Word. A Novo Nordisk estabeleceu uma parceria com a Anthropic para explorar a IA no processo de descoberta de novos medicamentos. Em meio a esses debates, Bill Gates anunciou uma parceria de 50 milhões de dólares entre sua fundação e o OpenAI com o objetivo de melhorar a saúde no Rwanda.", "ciencia": "A NASA comemorou a restauração de sua Estação Remota em Guam, que sofreu danos significativos após o super tufão Mawar em 2023. A agência concluiu a reconstrução em 1º de julho, retomando as operações normais. Em outro desenvolvimento, cientistas da NASA monitoram as mudanças sazonais no centro de massa da Terra, que são influenciadas pela distribuição de água, com implicações para navegação por satélite e medições de elevação. Outro estudo, realizado no Chile, associou um alimento a um maior risco de desenvolver câncer de próstata, destacando a importância de pesquisas alimentares em saúde. Além disso, um novo estudo sugere que o tigre-da-tasmânia era um caçador de presas pequenas e ágeis, similar ao lobo-guará, desmentindo a ideia de que era um superpredador. A NASA confirmou recentemente o descobrimento de um planeta jovem chamado Elias 2-24 b, que é o mais jovem conhecido, com menos de um milhão de anos de existência.", "cultura": "O Brasil conquistou destaque na cultura global com o filme 'Feito Pipa', que foi selecionado para representar o país no Oscar de 2027. A novela 'Quem Ama Cuida' superou 'Três Graças' e se tornou a mais vista do Globoplay desde a sua fundação. Além disso, a cantora chilena Mon Laferte recebeu seis indicações aos Grammy Latinos, dominando as categorias mais importantes. A segunda temporada de 'Avenida Brasil' abordará temas relacionados à realidade do Rio de Janeiro, como a presença da milícia em bairros periféricos. A banda Anthrax lançou seu 12º álbum, 'Cursum Perficio', reafirmando sua presença no cenário musical. Em Taiwan, um livro foi incluído na lista curta dos finalistas para o Prêmio Nacional de Literatura. No Chile, a cantora e compositora Zanna foi indicada ao Grammy Latino 2026 na categoria Canção do Ano por 'Nilo', uma parceria com Massimo Giovanardi.", "sociedade": "Um agropecuarista foi julgado por um acidente de trânsito que resultou na morte de uma família inteira em fevereiro de 2022, na rodovia 29, próximo a General Belgrano. O julgamento recente teve início recentemente. O Brasil supera países europeus em termos de mulheres na liderança, com 32,2% de mulheres ocupando posições de liderança, conforme um estudo do LinkedIn. A falta de circulação de informações afeta principalmente a população que utiliza o SUS, com mais de 75% da população brasileira utilizando o sistema. Além disso, a PAHO participou da 79ª Assembleia Geral das Nações Unidas, contribuindo para os esforços globais na prevenção, preparação e resposta a pandemias.", "meio_ambiente": "O Google assinou o maior acordo de remoção de carbono da sua história em parceria com a Terradot, uma empresa brasileira, para um projeto no Rio Grande do Sul, com a possibilidade de expansão para outras regiões. Paralelamente, em 15 de setembro, ocorreu um grande incêndio florestal na região de Tuéjar, na Espanha, destruindo 690 hectares. As emissões de combustíveis fósseis globais devem diminuir cerca de 0,5% em 2026 devido à crise do Estreito de Ormuz. No Nordeste, a Riachuelo, em parceria com a Cotton Move, inaugurou o primeiro hub de reciclagem têxtil em escala industrial, transformando 181 toneladas de algodão em fios novos. Além disso, a geração de energia solar e eólica caiu mais de 60% nos últimos cinco meses, impactando significativamente a distribuição de energia renovável no Brasil.", "direitos_humanos": "Um edifício residencial desabou em Gaza após danos causados por ataques israelenses anteriores, resultando em pelo menos 21 mortos, incluindo 11 crianças, e várias pessoas desaparecidas. Além disso, autoridades iranianas foram acusadas de cometerem crimes contra a humanidade durante os protestos de 2022-2023, conforme relatório da Amnesty International. O primeiro-ministro francês, Sébastien Lecornu, mencionou um 'plano plurianual' de recursos para combater a violência de gênero e sexual, mas não detalhou os fundos alocados. Em outros desenvolvimentos, a advogada dos direitos humanos palestina Noura Erakat foi detida em Flórida após criticar o investimento em Israel Bonds. O Brasil manteve a 72ª posição no ranking global de igualdade de gênero, com uma pequena queda de 0,4 ponto percentual em comparação com o ano anterior. No entanto, a descoberta de sete corpos de mulheres nas proximidades do aeroporto internacional de Joanesburgo na África do Sul gerou medo, tristeza e raiva em relação à falta de progresso no combate ao feminicídio."}, "resumo_do_dia": {"politica_nacional": [{"id": 165759, "titulo": "Ministros veem próximas sessões do STF contaminadas pela crise do Master, e desgaste de Fachin se agrava", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ministros-veem-proximas-sessoes-do-stf-contaminadas-pela-crise-do-master-e-desgaste-de-fachin-se-agrava.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do STF consideram que as próximas sessões de julgamento estarão influenciadas pela crise do Banco Master, após intensas brigas e provocações entre magistrados na terça-feira (15).", "titulo_pt": "Ministros veem próximas sessões do STF contaminadas pela crise do Master e desgaste de Fachin se agrava", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 165926, "titulo": "Vice do PT critica estratégia da campanha de Lula: \"Pregar para convertido\"", "url": "https://www.metropoles.com/brasil/vice-do-pt-critica-estrategia-da-campanha-de-lula-pregar-para-convertido", "fonte_id": "metropoles", "data_pub": "2026-09-16T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente do PT, Washington Quaquá, criticou a estratégia da campanha de Lula, afirmando que ela não aborda a 'vida real'. Quaquá, que é prefeito de Maricá, acredita que a campanha não está alcançando efetivamente o público-alvo.", "titulo_pt": "Vice do PT critica estratégia da campanha de Lula: 'pregar para convertido'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 165760, "titulo": "Flávio Bolsonaro endurece críticas e diz que 'sem ministros do Lula no Supremo, a democracia vive'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-bolsonaro-endurece-criticas-e-diz-que-sem-ministros-do-lula-no-supremo-a-democracia-vive.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro criticou os ministros do STF indicados por Lula e afirmou que, se eleito presidente, poderá indicar cinco integrantes da corte. Ele endureceu as críticas, sugerindo que a presença de ministros do PT no Supremo representa uma ameaça à democracia.", "titulo_pt": "Flávio Bolsonaro endurece críticas e afirma que 'sem ministros do Lula no Supremo, a democracia vive'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 165884, "titulo": "Ministros do STF veem Fachin perder comando sobre crise na Corte", "url": "https://www.cnnbrasil.com.br/politica/ministros-do-stf-veem-fachin-perder-comando-sobre-crise-na-corte/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do Supremo Tribunal Federal (STF) avaliaram que o presidente do tribunal, Fachin, teve dificuldades para conduzir o julgamento e controlar os embates entre os colegas.", "titulo_pt": "Ministros do STF veem Fachin perder comando sobre crise na Corte", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 165761, "titulo": "Lula cita acesso de ministros do STF a celular de Vorcaro e diz que país saberá 'quem foi fazer suruba'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/lula-cita-acesso-de-ministros-do-stf-a-celular-de-vorcaro-e-diz-que-pais-sabera-quem-foi-fazer-suruba.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que o escândalo do Banco Master foi 'orgia pura' e que a sociedade descobrirá 'quem foi fazer suruba'. Ele também mencionou que informações sobre o senador Flávio Bolsonaro virão à tona.", "titulo_pt": "Lula: país saberá 'quem foi fazer suruba' no e inistro Moraes tem prazo de 90 dias para decidir se há necessidade de uma sessão conjunta para que Barroso participe do julgamento.", "titulo_pt": "Cenários para Moraes e barroso caso empate prevaleça no julgamento de flávio dino", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 165896, "titulo": "STF se reúne pela primeira vez após impasse no caso Moraes; assista", "url": "https://www.cnnbrasil.com.br/politica/stf-se-reune-pela-primeira-vez-apos-impasse-no-caso-moraes-assista/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) realiza uma sessão extraordinária para discutir o processo envolvendo André Mendonça. Fachin pretende detalhar o procedimento a ser adotado durante a sessão.", "titulo_pt": "STF se reúne pela primeira vez após impasse no caso Moraes; assista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166056, "titulo": "STF AO VIVO – Licença-maternidade de mães biológicas e adotivas – sessão de 16/9/2026", "url": "https://www.jota.info/stf/do-supremo/stf-ao-vivo-licenca-maternidade-de-maes-biologicas-e-adotivas-sessao-de-16-9-2026", "fonte_id": "jota", "data_pub": "2026-09-16T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) analisará na sessão de 16 de setembro de 2026 se a licença-maternidade deve diferenciar entre mães biológicas e adotivas, de acordo com o regime jurídico aplicável.", "titulo_pt": "STF AO VIVO – Licença-maternidade de mães biológicas e adotivas – sessão de 16/9/2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165763, "titulo": "Em livro, Cury se compara a Jesus, Lincoln e Luther King como 'sonhador' que contribuiu com humanidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/em-livro-cury-se-compara-a-jesus-lincoln-e-luther-king-como-sonhador-que-contribuiu-com- ávio Bolsonaro (PL).", "titulo_pt": "TRE usa 'rachadinha' para vetar candidatura de ex-deputado citado no mesmo relatório de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 165953, "titulo": "Brasil não pode abrir mão dos EUA, mas eles não têm se mostrado aliados, diz ministro", "url": "https://www.infomoney.com.br/politica/brasil-nao-pode-abrir-mao-dos-eua-mas-eles-nao-tem-se-mostrado-aliados-diz-ministro/", "fonte_id": "infomoney", "data_pub": "2026-09-16T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Márcio Elias Rosa afirmou que a relação entre o Brasil e os Estados Unidos tem se tornado difícil desde maio do ano passado. O Brasil não pode abrir mão da aliança com os EUA, mas eles não têm se mostrado aliados.", "titulo_pt": "Brasil não pode abrir mão dos EUA, mas eles não têm se mostrado aliados, diz ministro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 166407, "titulo": "Belarus frees 25 political prisoners in return for US sanctions relief", "url": "https://www.aljazeera.com/news/2026/9/16/belarus-frees-25-political-prisoners-in-return-for-us-sanctions-relief?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos anunciou a libertação de 25 prisioneiros políticos da Bielorrússia em troca da alívio das sanções impostas pelo país. A administração Trump afirmou que mais liberações ocorrerão em breve devido ao melhoramento das relações entre os dois países.", "titulo_pt": "Bielorrússia liberta 25 prisioneiros políticos em troca de alívio de sanções dos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 166447, "titulo": "Israel trying to 'eliminate' living conditions for Palestinians in occupied West Bank, says report", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-trying-eliminate-living-conditions-palestinians-occupied-west", "fonte_id": "middle_east_eye", "data_pub": "2026-09-16T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório de uma organização de direitos humanos afirma que Israel está sistematicamente tentando 'eliminar' as condições de vida dos palestinos na Cisjordânia ocupada, através de constantes ataques por parte de colonos e soldados israelenses. O relatório, intitulado 'O Projeto de Eliminação', indica que Israel está intensificando severamente suas ações em todos os aspectos da vida palestina na Cisjordânia.", "titulo_pt": "Israel tentando 'eliminar' condições de vida dos palestinos na cisjordânia, diz relatório", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 166408, "titulo": "Kosovo’s former president guilty of war crimes", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/16/kosovos-former-president-guilty-of-war-crimes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hashim Thaci, ex-presidente do Kosovo e líder do KLA, foi condenado por crimes de guerra em Haia.", "titulo_pt": "Ex-presidente do kosovo condenado por crimes de guerra", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 166411, "titulo": "‘Nowhere to go’: Gaza’s damaged buildings turn deadly", "url": "https://www.aljazeera.com/news/2026/9/16/nowhere-to-go-gazas-damaged-buildings-turn-deadly?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um edifício danificado pela guerra desabou em Gaza City, causando ao menos 21 mortes entre palestinos e revelando preocupações sobre estruturas insalubres.", "titulo_pt": "Sem lugar para ir: edifícios danificados em gaza tornam-se perigosos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 165997, "titulo": "Mbappé, Vini e Konaté escondem mensagem de apoio a Ceuta antes de jogo do Real Madrid", "url": "https://www.bbc.com/portuguese/articles/cr74kwyzpyyko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-16T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os jogadores Mbappé, Vini e Konaté tentaram esconder camisetas com a mensagem 'Todos somos caballas' antes de um jogo do Real Madrid contra o Elche. O gesto foi realizado após uma crise migratória que levou milhares de pessoas a Ceuta.", "titulo_pt": "Mbappé, Vini e Konaté escondem mensagem de apoio a Ceuta antes de jogo do Real Madrid", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 166448, "titulo": "Gaza building collapse kills 21, including five children", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/21-including-five-children-killed-gaza-building-collapse", "fonte_id": "middle_east_eye", "data_pub": "2026-09-16T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um edifício de seis andares, que abrigava pelo menos 100 deslocados, desabou na área de Tal al-Hawa, Gaza, matando 21 pessoas, entre elas cinco crianças, após sofrer danos em ataques israelenses anteriores. Os rescatistas estavam desenterrando corpos sob os escombros no local.", "titulo_pt": "Colapso de prédio em gaza mata 21, incluindo cinco crianças", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 166343, "titulo": "Kosovo war crimes court jails ex-president Hashim Thaçi for 25 years, sparking mass protests", "url": "https://www.euronews.com/video/2026/09/16/kosovo-war-crimes-court-jails-ex-president-hashim-thaci-for-25-years-sparking-mass-protest", "fonte_id": "euronews", "data_pub": "2026-09-16T16:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente de Kosovo, Hashim Thaçi, foi condenado a 25 anos de prisão por crimes de guerra, o que gerou protestos massiv cute seu último livro, 'O Caldeirão', e como a violência moldou o Oriente Médio moderno.", "titulo_pt": "Os atrocidades que formaram o oriente médio moderno", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 166303, "titulo": "In this Netanyahu bastion, Israel's opposition is cautiously hopeful", "url": "https://www.lemonde.fr/en/international/article/2026/09/16/in-this-netanyahu-bastion-israel-s-opposition-is-cautiously-hopeful_6757598_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições de 27 de outubro se aproximam e os eleitores estão baseando suas decisões principalmente na percepção do ataque ocorrido em 7 de outubro de 2023, com apoiantes inabaláveis do primeiro-ministro e eleitores críticos à gestão do governo desse incidente.", "titulo_pt": "Neste bastião de Netanyahu, a oposição israelense é cautelosamente esperançosa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 166344, "titulo": "Latest news bulletin | September 16th, 2026 – Evening", "url": "https://www.euronews.com/video/2026/09/16/latest-news-bulletin-september-16th-2026-evening", "fonte_id": "euronews", "data_pub": "2026-09-16T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatados os principais acontecimentos da Europa e do mundo no dia 16 de setembro de 2026, abrangendo notícias, notícias em tempo real, Mundo, Negócios, Entretenimento, Política, Cultura e Viagens.", "titulo_pt": "Boletim de notícias mais importantes do dia 16 de setembro de 2026 - tarde", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 166359, "titulo": "Continental Resources to develop massive oil patch in Venezuela", "url": "https://www.cnbc.com/2026/09/16/continental-resources-to-develop-massive-oil-patch-in-venezuela-.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-16T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Continental Resources anunciou que irá desenvolver uma grande área de extração de petróleo na Venezuela após uma avaliação independente das oportunidades no país. Isso ocorreu em resposta ao presidente dos Estados Unidos, Donald Trump, que pediu à indústria que investisse na Venezuela.", "titulo_pt": "Continental Resources vai desenvolver grande área de extração de petróleo na Venezuela", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 165925, "titulo": "Grupo que movimentou R$ 30 milhões com “falso consignado” é alvo da polícia", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/grupo-que-movimentou-r-30-milhoes-com-falso-consignado-e-alvo-da-policia", "fonte_id": "metropoles", "data_pub": "2026-09-16T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma operação conjunta entre as polícias civis do Distrito Federal e do Rio de Janeiro foi realizada na terça-feira (16/9) para desmontar uma quadrilha que movimentou R$ 30 milhões através de um esquema de consignado falso.", "titulo_pt": "Grupo que movimentou R$ 30 milhões com 'falso consignado' é alvo da polícia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 166306, "titulo": "French health authority reports almost 8,000 excess deaths over heatwave-struck summer", "url": "https://www.lemonde.fr/en/france/article/2026/09/16/french-health-authority-reports-almost-8-000-excess-deaths-over-heatwave-struck-summer_6757604_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autoridade de saúde francesa relatou quase 8.000 mortes a mais durante o verão de 2023, afetado por ondas de calor. Embora o número não seja ainda final e possa aumentar, ele já indica fortemente o impacto das ondas de calor na França.", "titulo_pt": "Autoridade de saúde francesa relata quase 8.000 mortes a mais durante verão atingido por ondas de calor", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 166444, "titulo": "Trump oil ally Harold Hamm to invest in Venezuela", "url": "https://www.ft.com/content/7be92efe-13d6-4d02-9f77-0e8229b3b8fa?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-16T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Continental Resources, comandada pelo aliado de Trump Harold Hamm, planeja investir na Venezuela, marcando a mais recente incursão de uma produtora de petróleo ocidental no país, após a intervenção militar dos Estados Unidos que levou à destituição do presidente Nicolás Maduro.", "titulo_pt": "Aliado de trump, Harold Hamm vai investir na Venezuela", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 165875, "titulo": "Mercado dinâmico traz desafios para previdência, diz Castello, da FenaPrevi", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/mercado-dinamico-traz-desafios-para-previdencia-diz-castello-da-fenaprevi/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O executivo da FenaPrevi, Castello, destacou que o Brasil está passando por uma transformação profunda no setor previdenciário. O mercado dinâmico apresenta desafios para a previdência.", "titulo_pt": "Mercado dinâmico traz desafios para previdência, diz Castello, da FenaPrevi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166036, "titulo": "Presupuesto 2027: fuerte suba del gasto en ciberseguridad, recortes en organismos técnicos y suspensión del fondo anticíclico", "url": "https://www.lanacion.com.ar/politica/presupuesto-2027-fuerte-suba-del-gasto-en-ciberseguridad-recortes-en-organismos-tecnicos-y-nid16092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-16T17:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de orçamento para 2027 aumenta significativamente o gasto em cibersegurança, reduz as verbas do INTA, CONAE e INTI em termos nominais e inclui a suspensão do fundo anticíclico. O projeto será discutido pela primeira vez na Câmara dos Deputados na primeira semana de outubro.", "titulo_pt": "Orçamento 2027: aumento do gasto em cibersegurança, redução nas verbas técnicas e suspensão do fundo anticíclico", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 165770, "titulo": "Alta do petróleo e dos combustíveis pressiona governos e economias pelo mundo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/alta-do-petroleo-e-dos-combustiveis-pressiona-governos-e-economias-pelo-mundo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alta dos preços do petróleo e dos combustíveis está pressionando governos e economias em todo o mundo, especialmente devido a tensões entre Estados Unidos, Israel e Irã.", "titulo_pt": "Alta do petróleo e dos combustíveis pressiona governos e economias pelo mundo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166439, "titulo": "Traders expect Fed to raise interest rates for first time in 3 years", "url": "https://www.ft.com/content/61b5fbae-9dd6-4980-bd1f-effe54b72d84", "fonte_id": "financial_times", "data_pub": "2026-09-16T16:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Comerciantes de câmbio esperam que a Fed aumente as taxas de juros pela primeira vez em três anos. Este movimento pode irritar Donald Trump, que está nas semanas finais antes das eleições legislativas dos EUA.", "titulo_pt": "Comerciantes esperam aumento das taxas de juros pela Fed pela primeira vez em três anos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 165772, "titulo": "Banco Mundial nomeia Nobel de Economia como próximo economista-chefe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/banco-mundial-nomeia-nobel-de-economia-como-proximo-economista-chefe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Mundial nomeou Michael Kremer, ganhador do Prêmio Nobel e professor da Universidade de Chicago, como seu próximo economista-chefe, substituindo Indermit Gill, que se aposentou recentemente.", "titulo_pt": "Banco Mundial nomeia Nobel de Economia como próximo economista-chefe", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165774, "titulo": "Renault e Geely lançarão novo elétrico no Brasil em 2027 e aumentarão R$ 1,89 bi em investimento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/renault-e-geely-lancarao-novo-eletrico-no-brasil-em-2027-e-aumentarao-r-189-bi-em-investimento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Renault Geely do Brasil anunciou investimentos adicionais de R$ 1,89 bilhão e planeja lançar um novo veículo elétrico em 2027. A empresa também produzirá o modelo 100% elétrico Geely EX2.", "titulo_pt": "Renault Geely anunciará novo elétrico no Brasil e investirá R$ 1,89 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165775, "titulo": "JBS anuncia parceria com Viva Holding e cria gigante global de couro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/jbs-anuncia-parceria-com-viva-holding-e-cria-gigante-global-de-couro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A JBS anunciou uma parceria com a Viva Holding para combinar ativos de processamento de couro, criando a JBS Viva, que se tornará a maior empresa do setor no mundo. A JBS já detinha esse título desde 2013, após a compra da uruguaia Zenda.", "titulo_pt": "JBS anuncia parceria com Viva Holding e cria gigante global de couro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166058, "titulo": "Quando o risco opera em rede: o papel da auditoria interna em interfaces da governança", "url": "https://www.jota.info/opiniao-e-analise/colunas/gestao-politica-sociedade/quando-o-risco-opera-em-rede-o-papel-da-auditoria-interna-em-interfaces-da-governanca", "fonte_id": "jota", "data_pub": "2026-09-16T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com a presença do crime organizado em estruturas legítimas, controles isolados não são suficientes. O papel da auditoria interna em interfaces de governança é crucial para mitigar riscos.", "titulo_pt": "Quando o risco opera em rede: o papel da auditoria interna em interfaces de governança", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165776, "titulo": "OpenAI avalia nova captação que pode elevar valor de mercado para US$ 1,2 tri", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/openai-avalia-nova-captacao-que-pode-elevar-valor-de-mercado-para-us-12-tri.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T15:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI esteve em negociações para uma nova rodada de captação de recursos avaliada em US$ 1,2 trilhão antes de sua IPO planejada, buscando aproveitar o sucesso de seu mais recente modelo de inteligência artificial.", "titulo_pt": "Openai considera nova captação de US$ 1,2 trilhão antes de ipo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165779, "titulo": "Veja quanto custam os novos planos de assinatura da Meta no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/veja-quanto-custam-os-novos-planos-de-assinatura-da-meta-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T14:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta lançou no Brasil o Meta One, um novo plano de assinatura que oferece recursos adicionais para usuários do Instagram, WhatsApp e Facebook, além de acesso a ferramentas de inteligência artificial.", "titulo_pt": "Veja quanto custam os novos planos de assinatura do Meta no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166358, "titulo": "World's top-performing sovereign wealth fund warns of looming pullback in U.S. stock market", "url": "https://www.cnbc.com/2026/09/16/new-zealand-sovereign-wealth-fund-stock-market.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-16T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos fundos de riqueza soberana mais bem-sucedidos do mundo, o de Nova Zelândia, com um valor de $54 bilhões, registrou uma rentabilidade de 14,2% no ano até junho. O fundo emitiu um alerta sobre uma possível correção no mercado acionário dos Estados Unidos.", "titulo_pt": "Topo fundo de riqueza soberana do mundo avisa sobre possível correção no mercado de ações dos EUA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 166059, "titulo": "8ª edição do ‘Questões controvertidas no Carf’ discutirá subvenções e outros temas", "url": "https://www.jota.info/tributos/8a-edicao-do-questoes-controvertidas-no-carf-discutira-subvencoes-e-outros-temas", "fonte_id": "jota", "data_pub": "2026-09-16T14:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A oitava edição do 'Questões Controvertidas no Carf' reunirá mais de 40 conselheiros para debates sobre subvenções e outros temas nos dias 28, 29 e 30 de outubro, no Rio de Janeiro. O evento é promovido pela OAB-RJ e Firjan.", "titulo_pt": "8ª edição do 'Questões controvertidas no Carf' discutirá subvenções e outros temas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 165874, "titulo": "Papa Leão alerta sobre Inteligência Artificial substituir decisões humanas", "url": "https://www.cnnbrasil.com.br/internacional/papa-leao-alerta-sobre-inteligencia-artificial-substituir-decisoes-humanas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco alertou sobre o risco de inteligência artificial substituir decisões humanas e tornar as relações mais impessoais, transferindo o controle para algoritmos.", "titulo_pt": "Papa francisco alerta sobre Inteligência Artificial substituir decisões humanas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166295, "titulo": "Scoop: U.S. open to discuss AI \"shared risks\" with China, Bessent says", "url": "https://www.axios.com/2026/09/16/us-open-ai-shared-risks-china-bessent", "fonte_id": "axios", "data_pub": "2026-09-16T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, indicou que os EUA estão dispostos a discutir riscos compartilhados com a China durante conversas sobre IA neste fim de semana. Essas negociações podem oferecer uma oportunidade para discutir a segurança da IA entre os EUA e a China.", "titulo_pt": "EUA abertos para discutir riscos compartilhados de IA com a China", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 166558, "titulo": "Apple might make servers again to cash in on the AI rush", "url": "https://www.theverge.com/tech/996321/apple-servers-ai-nvidia", "fonte_id": "the_verge", "data_pub": "2026-09-16T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com informações da The Information, a Apple está planejando retornar ao mercado de servidores e pode colaborar com a Nvidia para realizar essa iniciativa. A Apple parou de produzir servidores Xserve em 2011 e tem deixado a produção de máquinas empresariais para outras fabricantes, mas o crescimento na demanda por poder computacional, devido ao avanço da indústria de IA, pode estar motivando essa mudança.", "titulo_pt": "Apple pode voltar a produzir servidores para aproveitar a corrida pela IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 166296, "titulo": "AI environmental concerns build as lawmakers grapple with tech panic", "url": "https://www.axios.com/2026/09/16/ai-concerns-congress-regulation", "fonte_id": "axios", "data_pub": "2026-09-16T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de metade dos americanos expressa preocupação extremada ou muito grande com os impactos ambientais da IA, um aumento superior a dez pontos percentuais em comparação com o ano anterior, de acordo com pesquisas recentes. Essa preocupação é parte de uma ampla gama de temores sobre a IA que legisladores estão trabalhando para abordar, junto com outras questões tecnológicas.", "titulo_pt": "Preocupações ambientais com a IA crescem entre os legisladores", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 165771, "titulo": "Papa Leão 14 faz novo alerta contra riscos da inteligência artificial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/papa-leao-14-faz-novo-alerta-contra-riscos-da-inteligencia-artificial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O papa Leão 14 emitiu um novo alerta contra a delegação de decisões humanas aos algoritmos, em meio à crescente preocupação com a inteligência artificial.", "titulo_pt": "Papa Leão 14 faz novo alerta contra riscos da inteligência artificial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166559, "titulo": "Your ‘health age’ is fake", "url": "https://www.theverge.com/column/995939/optimizer-health-age-wearables-longevity", "fonte_id": "the_verge", "data_pub": "2026-09-16T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante a apresentação da Apple Watch, o autor expressou sua desaprovação em voz alta. O newsletter Optimizer, escrito por Victoria Song, foi mencionado como uma publicação semanal que analisa produtos e soluções prometendo transformar a vida das pessoas.", "titulo_pt": "Sua 'idade de saúde' é falsa", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 166560, "titulo": "Google will now let any AI agent run your smart home", "url": "https://www.theverge.com/tech/996310/google-home-mcp-integration-agentic-ai-smart-home-price-release-date", "fonte_id": "the_verge", "data_pub": "2026-09-16T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google está permitindo que agentes de IA, como Claude e Open Claw, acessem e controlem os dispositivos inteligentes da sua casa e analisem os dados de sua casa através do Protocolo de Contexto de Modelo Padronizado. Esta nova integração, chamada Google Home MCP, permite que terceiros controlem e monitorem o seu ambiente doméstico inteligente e agam nele.", "titulo_pt": "Google permitirá que qualquer agente de IA gerencie sua casa inteligente", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 166632, "titulo": "Rethinking Robot Safety in the Age of AI", "url": "https://spectrum.ieee.org/physical-ai-robot-cybersecurity-vicone", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-16T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A segurança de robôs está sendo reconsiderada com o avanço da IA, pois os robôs modernos interpretam o contexto usando modelos de IA e transformam essas interpretações em ações físicas. A nova questão é como garantir a segurança dos robôs quando um atacante altera suas percepções, decisões ou ações, mesmo que nada pareça ter falhado.", "titulo_pt": "Reconsiderando a segurança dos robôs na era da IA", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 165958, "titulo": "Secretário-geral da ONU alerta sobre riscos da IA após Trump minimizar questão", "url": "https://www.infomoney.com.br/mundo/secretario-geral-da-onu-alerta-sobre-riscos-da-ia-apos-trump-minimizar-questao/", "fonte_id": "infomoney", "data_pub": "2026-09-16T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário-geral da ONU alertou sobre os riscos associados à inteligência artificial após o presidente dos EUA, Donald Trump, minimizar a questão. Líderes de grandes empresas do setor pediram que o desenvolvimento tecnológico seja desacelerado.", "titulo_pt": "Secretário-geral da ONU alerta sobre riscos da IA após Trump minimizar questão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 166589, "titulo": "Huawei aims to become 'China's Nvidia,' rules out building satellites or spacecraft", "url": "https://www.digitimes.com/news/a20260916PD224/huawei-nvidia-technology-apple.html", "fonte_id": "digitimes", "data_pub": "2026-09-16T16:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Guo Ping, presidente do conselho de supervisão da Huawei, discutiu com novos funcionários sobre os planos da empresa para se tornar uma 'Nvidia da China' e seus futuros objetivos em inteligência artificial, computação e semicondutores, sem mencionar a construção de satélites ou espaçonaves.", "titulo_pt": "Huawei almeja se tornar 'a Nvidia da China', mas não planeja construir satélites ou espaçonaves", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 166594, "titulo": "Chipotle Is Working With Palantir to Track Food Safety Risks", "url": "https://www.wired.com/story/chipotle-is-working-with-palantir-on-food-safety/", "fonte_id": "wired", "data_pub": "2026-09-16T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chipotle está trabalhando com a Palantir para desenvolver uma plataforma que monitora incidentes de pragas, doenças dos funcionários e outros fatores relacionados à segurança alimentar. Este acordo surge após um verão difícil para a segurança alimentar nos Estados Unidos.", "titulo_pt": "Chipotle e Palantir trabalham em plataforma para rastrear riscos de segurança alimentar", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 166298, "titulo": "Exclusive: Warren backs pause on advanced AI", "url": "https://www.axios.com/2026/09/16/warren-ai-pause", "fonte_id": "axios", "data_pub": "2026-09-16T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A senadora Elizabeth Warren, do Partido Democrata de Massachusetts, é a última figura proeminente do partido a apoiar uma pausa no desenvolvimento de inteligência artificial avançada. Warren vai chamar para uma pausa, mas não para uma proibição, diferentemente do senador Bernie Sanders.", "titulo_pt": "Exclusivo: warren apoia pausa no avanço da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 166555, "titulo": "Meet a mouse whose brain cortex is made up of human cells", "url": "https://www.technologyreview.com/2026/09/16/1144210/meet-a-mouse-whose-brain-cortex-is-made-up-of-human-cells/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-16T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma câmera monitorou uma camundonga que andava em um pequeno areão. Um computador registrou sua posição e velocidade, deixando rastros na tela. O motivo da atenção aos detalhes do comportamento do roedor era que quase metade do seu córtex cerebral estava composto por células humanas.", "titulo_pt": "Conheça uma camundonga cujo córtex cerebral é composto por células humanas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 166443, "titulo": "AI must not outrun safety controls, DeepMind co-founder warns", "url": "https://www.ft.com/content/0fc3ae6d-732e-4f08-950e-8669b1fcfd8e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-16T14:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shane Legg, codiretor da DeepMind, alerta que a inteligência artificial não deve avançar mais rápido do que os controles de segurança. Um novo Instituto DeepMind está sendo lançado para explorar as implicações da inteligência artificial geral, em meio a crescentes chamados para uma pausa na indústria.", "titulo_pt": "Codiretor da DeepMind alerta: IA não deve avançar mais rápido do que os controles de segurança", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 165902, "titulo": "Anthropic lança o \"Word do Claude\" e mira direto no império da Microsoft", "url": "https://exame.com/inteligencia-artificial/anthropic-lanca-o-word-do-claude-e-mira-direto-no-imperio-da-microsoft/", "fonte_id": "exame", "data_pub": "2026-09-16T14:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic lançou o 'Word do Claude', um assistente de texto integrado ao Microsoft Word. A empresa agora visa se tornar um espaço de trabalho completo, não apenas um plugin dentro dessas ferramentas.", "titulo_pt": "Anthropic lança 'Word do Claude' e se destaca contra a Microsoft", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 165904, "titulo": "Uso de IA generativa sem autorização preocupa 66% dos executivos, diz estudo", "url": "https://exame.com/inteligencia-artificial/uso-de-ia-generativa-sem-autorizacao-preocupa-66-dos-executivos-diz-estudo/", "fonte_id": "exame", "data_pub": "2026-09-16T14:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Peers Consulting + Technology revelou que 66% dos executivos estão preocupados com o uso não autorizado de inteligência artificial gerativa. Mesmo em organizações com políticas rígidas, 64% relataram possíveis utilizações não autorizadas de tecnologia.", "titulo_pt": "Uso de IA gerativa sem autorização preocupa 66% dos executivos, diz estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 165758, "titulo": "O diamante raro que pode contar a história das profundezas da Terra", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/ciencia-fundamental/2026/09/o-diamante-raro-que-pode-contar-a-historia-das-profundezas-da-terra.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-16T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A superfície da Terra é amplamente explorada, mas seu interior permanece um desafio científico. No entanto, os diamantes podem fornecer acesso direto a essas regiões profundas, permitindo o estudo das profundezas do globo terrestre.", "titulo_pt": "O diamante raro que pode contar a história das profundezas da Terra", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 166633, "titulo": "WHO expresses cautious optimism about bid to control Ebola outbreak in DRC", "url": "https://www.statnews.com/2026/09/16/ebola-outbreak-drc-who-cautious-optimism/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T16:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OMS expressa otimismo cauteloso sobre a trajetória da atual epidemia de Ebola na República Democrática do Congo.", "titulo_pt": "OMS expressa otimismo cauteloso sobre a trajetória da epidemia de Ebola na república democrática do congo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 166683, "titulo": "NASA Celebrates Restoration of Guam Station Damaged by Typhoon Mawar", "url": "https://www.nasa.gov/technology/space-comms/nasa-celebrates-restoration-of-guam-station-damaged-by-typhoon-mawar/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA comemorou a restauração completa de sua Estação Remota em Guam com uma cerimônia de corte de fita em 10 de setembro, após mais de três anos de recuperação de danos causados pela Super Tufão Mawar em 2023. Engenheiros da agência finalizaram a última etapa complexa da reconstrução em 1 de julho, restituindo a estação às operações normais.", "titulo_pt": "NASA comemora restauração completa da estação em Guam danificada pelo super tufão Mawar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166684, "titulo": "NASA Watches Earth’s Weight, Finds Center of Mass", "url": "https://www.nasa.gov/science-research/earth-science/nasa-watches-earths-weight-finds-center-of-mass/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As mudanças sazonais redistribuem água na Terra, fazendo com que o centro de massa do planeta se mova de poucos milímetros em relação ao seu centro geométrico. Cientistas da NASA monitoram essas oscilações, pois o centro de massa é um ponto de referência crucial para navegação por satélite e medições de elevação.", "titulo_pt": "NASA observa peso da terra, encontra seu centro de massa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166685, "titulo": "Indonesia’s Anak Krakatau", "url": "https://www.nasa.gov/image-article/indonesias-anak-krakatau/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T15:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anak Krakatau erupcionou cinzas e gases vulcânicos em 5 de setembro de 2026, conforme registrado pelo OLI na Landsat 8. As erupções são eventos comuns neste pequeno vulcão localizado entre as ilhas de Java e Sumatra, na Indonésia.", "titulo_pt": "Eruption de Anak Krakatau", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166686, "titulo": "Curiosity Postcard Celebrates Rover’s 5,000th Day on Mars", "url": "https://science.nasa.gov/photojournal/curiosity-postcard-celebrates-rovers-5000th-day-on-mars/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T15:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Curiosity da NASA, estacionado em uma duna de areia conhecida como Chocolatal, capturou panoramas em duas sessões diferentes de um dia marciano. As imagens foram tiradas em 30 de agosto de 2026, às 9h56 (hora local marciana) e em 2 de setembro de 2026, às 17h39 (hora local marciana).", "titulo_pt": "Cartão-postal do curiosity comemora 5.000º dia no marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166687, "titulo": "NASA Visits Schools Strengthening Florida’s Skilled Workforce", "url": "https://www.nasa.gov/image-article/nasa-visits-schools-strengthening-floridas-skilled-workforce/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA concedeu recentemente $10,5 milhões a sete organizações pelo país através de sua nova iniciativa State Hubs. O Space Florida foi selecionado para o Projeto ORBIT, que visa expandir as oportunidades para estudantes do ensino médio e superior, aumentar o número de inscritos em programas técnicos-chave e criar um portal estatal conectando trabalhadores qualificados a empregadores do setor aeroespacial.", "titulo_pt": "NASA destina fundos para expandir oportunidades educacionais em flórida", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166634, "titulo": "STAT+: Scientists made mice with half a brain. Then they filled them with human organoids", "url": "https://www.statnews.com/2026/09/16/human-brain-organoids-neuro-chimeric-mice-study-published-nature/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas criaram ratos com metade do cérebro e preencheram-os com organoides humanos, o que pode abrir novas possibilidades para a pesquisa, mas também levanta questões éticas.", "titulo_pt": "Cientistas criaram ratos com metade do cérebro e preencheram com organoides humanos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 166677, "titulo": "These mice have human (nerve cells) on the brain", "url": "https://www.sciencenews.org/article/mice-brain-human-organoid-cells", "fonte_id": "science_news", "data_pub": "2026-09-16T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas cultivaram tecido cerebral humano para preencher a maior parte do córtex de um mouse, criando um novo modelo para estudar doenças cerebrais e circuitos neurais.", "titulo_pt": "Estes roedores têm cérebro humano no cérebro", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 166689, "titulo": "NASA’s Integrated Medical Model (IMM)", "url": "https://www.nasa.gov/general/nasas-integrated-medical-model-imm/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA desenvolveu o Modelo Integrado Médico (IMM) para prever as necessidades médicas em missões espaciais de longa duração, como viagens à Lua e Marte. O IMM é uma ferramenta de apoio à decisão que considera fatores como radiação cósmica, microgravidade e distância da Terra.", "titulo_pt": "Modelo integrado médico (IMM) da nasa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166690, "titulo": "Newfound ‘Baby’ Planet Smashes Record for Youngest Known World", "url": "https://science.nasa.gov/universe/newfound-baby-planet-smashes-record-for-youngest-known-world/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T14:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos confirmaram a existência de um planeta com menos de um milhão de anos como o mais jovem conhecido, usando dados de arquivos da NASA. O planeta, chamado Elias 2-24 b, ainda orbita em seu disco natal de poeira e gás.", "titulo_pt": "Novo 'bebe' planeta quebra Record de ser o mais jovem mundo conhecido", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 166678, "titulo": "The U.S. has weapons in space. Here’s what that could mean", "url": "https://www.sciencenews.org/article/united-states-space-weapon-announcement", "fonte_id": "science_news", "data_pub": "2026-09-16T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma declaração misteriosa suscita dúvidas sobre o tipo de armas espaciais e como elas poderiam ser utilizadas. Uma especialista foi consultada sobre as possíveis consequências.", "titulo_pt": "Os estados unidos têm armas no espaço. E agora?", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 166636, "titulo": "STAT+: Pharmalittle: We’re reading about faster FDA approvals, access to experimental drugs in Montana, and more", "url": "https://www.statnews.com/pharmalot/2026/09/16/fda-plans-to-speed-approvals-experimental-drugs-in-montana/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T13:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA está abrindo inscrições para um programa piloto que visa acelerar o processo de teste de medicamentos em humanos. O programa visa reduzir o tempo necessário para que as empresas farmacêuticas iniciem os testes clínicos de seus produtos.", "titulo_pt": "Pharmalittle: inscrições abertas para programa piloto da FDA para acelerar testes de medicamentos em humanos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 166663, "titulo": "Blood test shows promise in detecting pancreatic cancer early—a ‘holy grail’ for the field", "url": "https://www.scientificamerican.com/article/blood-test-shows-promise-in-detecting-pancreatic-cancer-early-a-holy-grail-for-the-field/", "fonte_id": "scientific_american", "data_pub": "2026-09-16T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um teste sanguíneo promissor está sendo desenvolvido para detectar câncer pancreático no estágio inicial. A detecção precoce desse tipo de câncer é considerada um 'holy grail' pela comunidade médica, pois é geralmente diagnosticado em estágios avançados, quando o tratamento é mais difícil.", "titulo_pt": "Teste sanguíneo mostra promessa na detecção precoce de câncer pancreático - um 'holy grail' para o campo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 166679, "titulo": "Alzheimer’s damage may begin outside the brain", "url": "https://www.sciencenews.org/article/alzheimers-damage-brain-lymph-nodes", "fonte_id": "science_news", "data_pub": "2026-09-16T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A remoção de um tipo de célula imune dos nodos linfáticos de ratos reduziu a inflamação cerebral e o dano cellular em um modelo de doença alzheimer-like.", "titulo_pt": "Dano do alzheimer pode começar fora do cérebro", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 166637, "titulo": "U.S. reaches highest number of measles deaths in decades", "url": "https://www.statnews.com/2026/09/16/health-news-us-reaches-measles-death-high-in-decades/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T11:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos registrou o maior número de mortes por sarampo em décadas. O artigo também aborda como as eleições podem influenciar a saúde pública, um sedativo contaminado que está circulando no mercado negro de fentanil, e outras notícias de saúde.", "titulo_pt": "Estados unidos atinge maior número de mortes por sarampo em décadas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 166510, "titulo": "Taiwanese book longlisted for National Book Award", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/17/2003864421", "fonte_id": "taipei_times", "data_pub": "2026-09-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um livro taiwanês foi incluído na lista curta dos finalistas para o Prêmio Nacional de Literatura.", "titulo_pt": "Liv
