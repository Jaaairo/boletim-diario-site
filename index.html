<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 25/07/2026 19:50 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <option value="resumo_impreciso">Resumo impreciso</option>

    <label for="flag-nota">Nota (opcional)</label>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "25/07/2026 19:50", "stats": {"noticias_novas": 627, "resumos_gerados": 239}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Partido Liberal (PL) oficializou a candidatura de Flávio Bolsonaro à Presidência da República durante uma convenção realizada no Pacaembu, em São Paulo. O evento foi marcado por referências constantes ao pai Jair Bolsonaro e à memória do ex-presidente. Além disso, Flávio contou com o apoio de Javier Milei, um líder político argentino que chamou o ministro Alexandre de Moraes de 'lixo careca' durante uma convenção do PL em São Paulo, gerando reações duras do presidente do STF, Luís Roberto Barroso. O Partido dos Trabalhadores (PT) lançou Fernando Haddad como candidato ao governo do Estado de São Paulo e enfatizou São Paulo como local estratégico para reeleger Lula no primeiro turno, criticando a gestão do governador Tarcísio de Freitas e tentando associá-lo à família Bolsonaro.", "mundo": "Um incidente de trânsito ocorrido durante as comemorações do Dia do Orgulho LGBTQIA+ em Berlim, Alemanha, resultou em pelo menos uma morte e várias feridas. Um carro atingiu a multidão perto da Porta de Brandenburgo no sábado à noite, levando a uma busca intensa pelo condutor. No Brasil, o presidente Luiz Inácio Lula da Silva negou vistos a dois funcionários dos Estados Unidos que pretendiam avaliar o sistema eleitoral antes das eleições de 4 de outubro. A Ucrânia acusa a Rússia de planejar mobilizar cerca de 30 mil norte-coreanos para a guerra, um movimento que pode aumentar as tensões globais. Em outro desenvolvimento, o governo americano tentou enviar assessores ao Brasil para questionar as eleições, mas a Itamaraty negou os vistos.\n\nOs Estados Unidos interromperam suas incursões noturnas contra o Irã após 13 noites consecutivas, sem explicação imediata de Washington. Em contraste, a Ucrânia anunciou ataques contra navios de transporte de material militar associados ao Irã, e relatos indicam que pelo menos 15 pessoas morreram em ataques de aviões não tripulados da Rússia e lançamentos de foguetes na Ucrânia. O ministro da Educação do Índia renunciou após 36 dias de protestos liderados por jovens sobre vazamento de provas, enquanto o chefe da polícia no norte do Gaza foi morto em um ataque aéreo israelense. Além disso, o presidente do Cazaquistão expressou preocupação com a guerra na Ucrânia durante uma conversa telefônica com o presidente russo Vladimir Putin, e o ministro dos Negócios Estrangeiros da Síria pediu ao Israel imediato e incondicional retirada do país.", "economia": "A economia global enfrenta diversos desafios e mudanças nos mercados internacionais. O CPC anunciou que aumentará os preços do gasolina e diesel no mercado interno a partir da próxima semana, refletindo as flutuações globais de preços do petróleo. Em outro desenvolvimento, o presidente dos Estados Unidos, Joe Biden, reimplantou tarifas comerciais, influenciando diretamente os mercados mundiais. Um conflito no Irã também eleva os preços do petróleo. As pequenas empresas brasileiras estão entrando com ações judiciais contra as novas tarifas impostas por Trump, sinalizando uma resistência legal às medidas comerciais unilaterais. Na América Latina, o novo imperativo estratégico é mobilizar capital para um futuro baseado em impacto, inovação e sustentabilidade. Na Rússia, a economia enfrenta previsões de crescimento zero devido à crise energética. No Brasil, a maioria admira o crescimento das fortunas, mas poucos se perguntam sobre sua durabilidade diante de eventos imprevistos. A inflação dos alimentos já provoca embates entre o governo de Lula e a oposição. Além disso, o aluguel no Rio de Janeiro aumentou 18% em um ano, refletindo pressões locais na economia imobiliária.", "tecnologia": "O debate sobre o futuro da inteligência artificial (IA) está ganhando força internacional. Mais de 200 economistas e pesquisadores assinaram uma carta aberta alertando para os impactos econômicos significativos que a IA pode causar, comparáveis à Revolução Industrial. Em outro desenvolvimento, a Warner Bros. moveu uma ação judicial contra a Amazon por supostas contratações ilegais de executivos, reavivando debates sobre as leis trabalhistas e contratações temporárias na indústria tecnológica. As preocupações com a segurança dos dados também estão em alta, especialmente com o avanço da computação quântica, que pode desafiar as técnicas criptográficas atualmente usadas, ameaçando a privacidade e a integridade dos dados armazenados.", "ciencia": "Um estudo publicado na revista International Journal of Enterprise Network Management revela que os usuários de mídias sociais desempenham um papel crucial no compartilhamento de informações falsas, desafiando a percepção anterior sobre essa responsabilidade. A pesquisa sugere que as iniciativas para combater a 'fake news' devem focar tanto na compreensão dos motivos pelos quais os usuários compartilham enganosamente quanto em identificar aqueles que criam esse conteúdo. Em outra notícia, cientistas do Equador descobriram geneticamente 8.000 novas espécies de insetos em uma floresta protegida do Chocó Andino, reforçando a biodiversidade da região. Além disso, um navio bizantino foi encontrado na costa croata com joias de ouro a bordo, sugerindo que transportava uma pessoa de alta patente e sua comitiva. Arqueólogos chegaram a essa conclusão baseado nos achados. Na arqueologia, 18 sepultamentos foram descobertos no Egito, incluindo um sarcófago lacrado, indicando uma mistura entre tradições egípcias e greco-romanas.", "cultura": "A Festa Literária Internacional de Paraty (Flip) celebrou a diversidade cultural com diversos eventos. Nathacha Appanah, escritora franco-mauriciana, foi um dos destaques na 24ª edição do evento, apresentando sua obra recente sobre violência doméstica. A poeta angolana Ana Paula Tavares discursou sobre as feridas históricas de seu país durante a Flip, abordando temas como colonialismo e patriarcalismo. O evento também foi marcado por um momento conturbado com confusão entre o público no auditório principal. Além disso, a escritora Carla Madeira destacou a necessidade de empatia para entender a exaustão materna durante uma mesa-redonda da Flip. Outros eventos culturais incluíram a apresentação do projeto 7 Leituras com a obra 'Um Limite entre Nós' de August Wilson, além de discussões sobre gêneros literários e artísticos como telenovelas e tatuagens. A cultura também foi retratada através da arte, com o roubo de um colar celta de 2500 anos em França e a aquisição de obras por colecionadores internacionais.", "sociedade": "Um incidente violento ocorreu durante a Parada LGBT+ de Berlim, na Alemanha. Uma camioneta atropelou uma multidão no parque Tiergarten, resultando em um morto e pelo menos 15 feridos. As autoridades estão buscando os suspeitos e o evento foi cancelado após o incidente. Em São Paulo, o governo federal anunciou a liberação de recursos para cidades afetadas por uma tempestade que deixou um morto e causou danos significativos à infraestrutura no interior paulista. No Brasil, Delson Carlos Barros, jornalista de Goiânia, foi assassinado em um apartamento nobre do bairro Setor Bueno. As circunstâncias ainda estão sendo investigadas. Em Arica, Chile, a primeira etapa do desalojo de mais de 250 casas está em andamento e afetou cerca de 700 pessoas ao longo de dois dias.", "meio_ambiente": "Mais de 250 mil pessoas foram obrigadas a se mudar devido aos incêndios florestais na França e Espanha, conforme relatos da CNN Brasil e do Taipei Times. A situação é particularmente grave no norte da Espanha, onde um morador faleceu após os incêndios, e na região de Bordeaux, na França, onde o vento forte alimenta as chamas. Em resposta, autoridades francesas mobilizaram as Forças Armadas para auxiliar os bombeiros, enquanto a Espanha declarou estado de emergência nacional. Paralelamente, um tufão chamado Noul atingiu a China, levando à evacuação de mais de 340 mil pessoas e ao cancelamento de voos em Hong Kong, conforme informado pela Infomoney.", "direitos_humanos": "Volker Turk foi reeleito por mais quatro anos como chefe das Nações Unidas para os direitos humanos, com 144 votos a favor e apenas 10 contra. Esta vitória aconteceu apesar da oposição dos Estados Unidos, Israel e Rússia. Em Berlim, um acidente de trânsito durante a Parada LGBTQIA+ resultou na morte de uma pessoa e deixou pelo menos 15 feridos. Navid Manafi Rasi, que fugiu do Irã por ser gay, agora conta sua história no Brasil após encontrar liberdade. Na Gaza, o conflito israelo-palestiniano está causando um aumento nos nascimentos prematuros e colocando a saúde materna em risco. Além disso, foram realizados funerais noturnos para quatro palestinos mortos perto de Nablus."}, "resumo_do_dia": {"politica_nacional": [{"id": 72303, "titulo": "Fachin reage após Milei chamar Moraes de “lixo careca”: “Desrespeitosa”", "url": "https://www.cnnbrasil.com.br/politica/fachin-reage-apos-milei-chamar-moraes-de-lixo-careca-desrespeitosa/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Dias Toffoli, reagiu após o deputado argentino Matías Milei chamar o ministro Alexandre Moraes de 'lixo careca', afirmando que a declaração é incompatível com a civilidade nas relações entre Estados.", "titulo_pt": "Toffoli reage após Milei chamar Moraes de ‘lixo careca’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72326, "titulo": "Colapso de ferragens em obra deixa um morto e cinco feridos no Morumbi", "url": "https://www.infomoney.com.br/brasil/colapso-de-ferragens-em-obra-deixa-um-morto-e-cinco-feridos-no-morumbi/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um trabalhador morreu e cinco ficaram feridos após o colapso de ferragens durante uma obra no Morumbi. A informação foi dada pelo capitão Jaelson Nobre, da Polícia Militar, em entrevista à SP1, da TV Globo.", "titulo_pt": "Colapso de ferragens em obra deixa um morto e cinco feridos no Morumbi", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72329, "titulo": "Michelle Bolsonaro grava vídeo para convenção do PL, mas só cita Flávio uma vez", "url": "https://www.infomoney.com.br/politica/michelle-bolsonaro-grava-video-para-convencao-do-pl-mas-so-cita-flavio-uma-vez/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro gravou um vídeo para a convenção do PL, onde discursou mais sobre o PL Mulher e a importância do voto feminino nas eleições deste ano. Flávio Bolsonaro foi mencionado apenas uma vez.", "titulo_pt": "Michelle Bolsonaro grava vídeo para convenção do PL, mas cita Flávio apenas uma vez", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72221, "titulo": "Apesar de ataques a Lula em evento do PL, Milei não se juntou a coro que pediu petista na prisão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/apesar-de-ataques-a-lula-em-evento-do-pl-milei-nao-se-juntou-a-coro-que-pediu-petista-na-prisao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apesar dos ataques a Lula e Moraes, Javier Milei, presidente da Argentina, não pediu a prisão do petista durante o evento do PL em São Paulo. Ele exerceu algum autocontrole em alguns momentos.", "titulo_pt": "Milei não pede prisão de Lula em evento do PL", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 72331, "titulo": "Como Abhijeet Dipke tornou-se a face do 1º protesto da Geração Z na Índia", "url": "https://www.infomoney.com.br/mundo/como-abhijeet-dipke-tornou-se-a-face-do-1o-protesto-da-geracao-z-na-india/", "fonte_id": "infomoney", "data_pub": "2026-07-25T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Abhijeet Dipke se tornou a face do primeiro grande protesto da Geração Z na Índia contra o governo de Narendra Modi.", "titulo_pt": "Como Abhijeet Dipke se tornou a face do primeiro protesto da Geração Z na Índia", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72222, "titulo": "Fachin, presidente do STF, reage a Milei após argentino atacar Moraes em convenção de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/presidente-do-stf-rechaca-fala-de-milei-sobre-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, reagiu à declaração do presidente da Argentina, Alberto Fernández, que chamou o ministro Alexandre de Moraes de 'lixo careca' durante um evento político no Brasil.", "titulo_pt": "Fachin responde a fernández após argentino ofender Moraes em convenção bolsonarista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 72161, "titulo": "Após Milei chamar Moraes de 'lixo careca', presidente do STF diz que fala é 'incompatível com civilidade' entre países", "url": "https://g1.globo.com/politica/noticia/2026/07/25/apos-milei-chamar-moraes-de-lixo-careca-presidente-do-stf-diz-que-fala-e-incompativel-com-civilidade-entre-paises.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-25T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, declarou que as declarações de Javier Milei sobre o ministro Alexandre de Moraes são incompatíveis com a civilidade entre países. Milei havia chamado Moraes de 'lixo careca' durante uma convenção do Partido Liberal no Brasil.", "titulo_pt": "Fachin diz que fala de Milei sobre Moraes é incompatível com a civilidade", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 72321, "titulo": "Deterioração financeira de estatais é preocupante, diz IFI", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/deterioracao-financeira-de-estatais-e-preocupante-diz-ifi/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da IFI destaca a deterioração dos indicadores financeiros das estatais, aumentando o risco fiscal para o governo federal. O especialista Alexandre Andrade alerta sobre essa situação preocupante.", "titulo_pt": "Deterioração financeira de estatais é preocupante, diz relatório da IFI", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72158, "titulo": "PT lança candidatura de Fernando Haddad ao governo de São Paulo", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/pt-lanca-candidatura-de-fernando-haddad-ao-governo-de-sao-paulo", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-25T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) lançou a candidatura de Fernando Haddad para o governo do Estado de São Paulo e escolheu Márcio França como vice-governador. A decisão foi tomada durante uma convenção partidária em Campinas, SP.", "titulo_pt": "PT lança candidatura de Fernando Haddad ao governo de São Paulo", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 72224, "titulo": "Republicanos oficializa Garotinho como candidato a governador do RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/republicanos-oficializa-garotinho-como-candidato-a-governador-do-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T19:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Republicanos confirmou Anthony Garotinho como candidato a governador do Rio de Janeiro em uma convenção realizada na Tijuca, zona norte da capital fluminense.", "titulo_pt": "Republicanos oficializa Garotinho como candidato a governador do RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 72390, "titulo": "Quem são os pré-candidatos a governador do Pará (PA) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-pre-candidatos-a-governador-do-para-pa-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-07-25T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Até o momento, seis nomes são considerados possíveis para concorrer ao cargo de governador do Pará nas eleições de 2026.", "titulo_pt": "Quem são os pré-candidatos a governador do Pará em 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 72225, "titulo": "Tarcísio diz que trabalhará por apoio do Republicanos a Flávio e ainda vê chance de aliança", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/tarcisio-diz-que-trabalhara-por-apoio-do-republicanos-a-flavio-e-ainda-ve-chance-de-alianca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas, afirmou que trabalhará para conseguir o apoio do Republicanos ao senador Flávio Bolsonaro. Ele ainda vê possibilidade de aliança com o partido.", "titulo_pt": "Tarcísio diz que trabalhará por apoio do Republicanos a Flávio e ainda vê chance de aliança", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 72391, "titulo": "PT lança Haddad e vê SP como local estratégico para reeleger Lula no primeiro turno", "url": "https://www.jota.info/eleicoes/eleicoes-2026/pt-lanca-haddad-e-ve-sp-como-local-estrategico-para-reeleger-lula-no-primeiro-turno", "fonte_id": "jota", "data_pub": "2026-07-25T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) lançou Fernando Haddad como candidato à presidência e enfatizou São Paulo como local estratégico para reeleger Lula no primeiro turno. Durante a convenção, o partido criticou a gestão do governador Tarcísio e tentou associá-lo à família Bolsonaro.", "titulo_pt": "PT lança Haddad e vê SP como local estratégico para reeleger Lula no primeiro turno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 72375, "titulo": "Sem Michelle e com Milei, Flávio oficializa candidatura e promete que Bolsonaro subirá a rampa do Planalto em 2027", "url": "https://www.bbc.com/portuguese/articles/ce3406eye9eo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-25T19:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro oficializou sua candidatura presidencial sem a participação de Michelle Bolsonaro, que enviou um vídeo 'abençoando' a campanha. O evento exibiu um vídeo do ex-presidente Jair Bolsonaro, supostamente feito por inteligência artificial.", "titulo_pt": "Sem Michelle e com Milei, Flávio oficializa candidatura e promete que Bolsonaro subirá a rampa do Planalto em 2027", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 72226, "titulo": "Sombra de Bolsonaro e Milei refletem isolamento de Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/sombra-de-bolsonaro-e-milei-refletem-isolamento-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T18:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convenção do PL que confirmou Flávio Bolsonaro como candidato à Presidência destacou o apoio de Jair Bolsonaro e de Javier Milei, um líder político argentino. O evento refletiu o isolamento crescente de Flávio no cenário político brasileiro.", "titulo_pt": "Sombra de Bolsonaro e Milei refletem isolamento de Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 72392, "titulo": "Flávio Bolsonaro é oficializado candidato a presidente com IA do pai e Milei como cabo eleitoral", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-e-oficializado-candidato-a-presidente-com-ia-do-pai-e-milei-como-cabo-eleitoral", "fonte_id": "jota", "data_pub": "2026-07-25T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro foi oficializado como candidato a presidente no evento, com a participação do IA do pai Jair e de Lucho Milei como cabo eleitoral. O senador ainda não tem vice-liderança definida para a campanha.", "titulo_pt": "Flávio Bolsonaro é oficializado candidato a presidente com IA do pai e Milei como cabo eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 72401, "titulo": "Al menos un muerto y varios heridos por un atropello durante el Día del Orgullo en Berlín", "url": "https://elpais.com/internacional/2026-07-25/varios-heridos-por-un-atropello-durante-el-dia-del-orgullo-en-berlin.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T21:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um carro atingiu a multidão perto da Porta de Brandenburgo, durante o Dia do Orgulho em Berlim. Pelo menos uma pessoa morreu e várias ficaram feridas.", "titulo_pt": "Pelo menos um morto e vários feridos por atropelamento durante o dia do orgulho em berlim", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 72635, "titulo": "Furgone contro la folla a Berlino, 'un morto e 15 feriti'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/25/furgone-contro-la-folla-a-berlino-un-morto-e-15-feriti_fe78e490-ef86-499d-8b3b-cbc38ba93b1d.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-25T21:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um furgão colidiu com uma multidão em Berlim, resultando em uma morte e 15 feridos. Este foi o relato da polícia.", "titulo_pt": "Furgão contra a multidão em berlim: um morto e 15 feridos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 72650, "titulo": "U.S. pauses nightly strikes on Iran as Houthis clash with Saudis", "url": "https://www.japantimes.co.jp/news/2026/07/26/world/us-halts-iran-strikes-houthis/", "fonte_id": "japan_times", "data_pub": "2026-07-25T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos pausaram as suas incursões noturnas contra o Irã após uma série de 13 noites consecutivas. Washington não forneceu imediatamente uma explicação para essa interrupção repentina das operações de escalada.", "titulo_pt": "EUA pausam incursões noturnas contra Irã após 13 noites seguidas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 72324, "titulo": "Ucrânia anuncia ataques contra navios de transporte de material militar ligados a Irã", "url": "https://www.infomoney.com.br/mundo/ucrania-anuncia-ataques-contra-navios-de-transporte-de-material-militar-ligados-a-ira/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia anunciou ataques contra navios de transporte de material militar associados ao Irã. Além disso, foram relatados ataques em várias regiões da Rússia nos últimos dias, incluindo uma refinaria pertencente à Lukoil em Filanovski.", "titulo_pt": "Ucrânia anuncia ataques contra navios de transporte de material militar ligados ao Irã", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72557, "titulo": "Kazakh leader to Putin: The Ukraine war should end", "url": "https://www.lemonde.fr/en/international/article/2026/07/25/kazakh-leader-to-putin-the-ukraine-war-should-end_6755836_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-25T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Kazáquia, Kassym-Jomart Tokayev, expressou sua preocupação com a guerra na Ucrânia durante uma conversa telefônica com o presidente russo Vladimir Putin. Ele mencionou que jovens estão morrendo e que tudo isso precisa ser parado.", "titulo_pt": "Líder kazajo a Putin: guerra na Ucrânia deve acabar", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 72586, "titulo": "Berlin CSD Pride parade canceled after vehicle drives into crowd", "url": "https://www.dw.com/en/berlin-csd-pride-parade-canceled-after-vehicle-drives-into-crowd/a-78116146?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-25T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um veículo atingiu várias pessoas durante celebrações do Pride de Berlim, conhecidas localmente como Christopher Street Day (CSD), no sábado à noite. A polícia iniciou uma busca pelo condutor.", "titulo_pt": "P Pride de berlim cancelado após veículo atingir multidão", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 72553, "titulo": "Several injured at Berlin Pride after reports vehicle drove into crowd, police say", "url": "https://www.bbc.co.uk/news/articles/clyqzylz3zno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-25T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há relatos de pessoas feridas durante a festa da diversidade sexual em Berlim, após um veículo supostamente colidir contra o público. As autoridades estão realizando uma busca intensa pelo condutor.", "titulo_pt": "Várias feridas na Pride de berlim após relato de veículo atingir a multidão", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 72216, "titulo": "Carro avança contra pessoas durante parada LGBT+ na Alemanha e deixa feridos em estado grave", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/parada-lgbt-e-interrompida-na-alemanha-apos-carro-avancar-contra-pessoas.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-25T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um carro atropelou pessoas durante celebrações do orgulho LGBTQIA+ em Berlim, na Alemanha, ferindo várias vítimas gravemente. A informação foi confirmada pela polícia da capital alemã.", "titulo_pt": "Carro atinge multidão durante festivais LGBT+ em berlim e deixa feridos graves", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 72603, "titulo": "Israeli forces tear gas journalists reporting Nablus shootout", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/25/israeli-forces-tear-gas-journalists-reporting-nablus-shootout?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses dispararam gás lacrimogêneo contra palestinos e jornalistas em Tal um dia após um tiroteio letal em Nablus.", "titulo_pt": "Forças israelenses lançam gases lacrimogêneos sobre jornalistas e palestinos em tal", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 72636, "titulo": "Media, 'veicolo contro la folla a Berlino a margine del Gay Pride, feriti'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/25/media-veicolo-contro-la-folla-a-berlino-a-margine-del-gay-pride-feriti_6d7b77c0-2b46-410a-84cf-28f00d364fa7.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-25T21:01:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Houve incidentes com veículos contra multidões em Berlim durante o evento Gay Pride, resultando em feridos. Os bombeiros, médicos e paramédicos estavam presentes no local para atender às vítimas.", "titulo_pt": "Mídia relata incidente com veículos contra a população em berlim durante evento Gay; bombeiros e profissionais de saúde no local", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 72438, "titulo": "Lula negó la visa a dos funcionarios de EE.UU. y prometió una “dura respuesta” ante una eventual injerencia", "url": "https://www.lanacion.com.ar/estados-unidos/lula-nego-la-visa-a-dos-funcionarios-de-eeuu-y-prometio-una-dura-respuesta-ante-una-eventual-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula negou a entrada de dois funcionários dos Estados Unidos e prometeu uma 'dura resposta' caso haja eventual interferência. Os enviados planejavam avaliar o sistema eleitoral brasileiro antes das eleições de 4 de outubro.", "titulo_pt": "Lula negou vistos a dois funcionarios dos EUA e prometeu uma ‘dura resposta’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 72604, "titulo": "How India’s ‘Cockroach’ protesters shook the Modi government", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/25/how-indias-cockroach-protesters-shook-the-modi-government?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T20:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministro da Educação de Índia renunciou após 36 dias de protestos contínuos liderados pelo partido Cockroach Janta.", "titulo_pt": "Como os 'protestantes de lagarta' abalaram o governo Modi", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 72223, "titulo": "TSE diz que foi procurado por governo Trump, mas que tema da agenda não foi informado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/tse-diz-que-foi-procurado-por-governo-trump-mas-que-tema-da-agenda-nao-foi-informado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TSE foi contatado pela embaixada dos Estados Unidos sobre a visita de funcionários do Departamento de Estado ao Brasil, mas o tema da agenda não foi informado. A viagem foi negada pelo Itamaraty.", "titulo_pt": "TSE foi procurado por embaixada dos EUA sobre visita de funcionários do departamento de estado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 72313, "titulo": "“Desrespeito à soberania”, diz Amorim à CNN sobre missão eleitoral dos EUA", "url": "https://www.cnnbrasil.com.br/politica/desrespeito-a-soberania-diz-amorim-a-cnn-sobre-missao-eleitoral-dos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro dos Negócios Estrangeiros, Antônio Patriota (Amorim), criticou a missão eleitoral dos Estados Unidos no Brasil. O presidente do Partido Trabalhista Brasileiro (PTB), Edinho Silva, se posicionou contra o discurso de Javier Milei durante a convenção do Partido Libertador (PL), que atacou Lula e Alexandre de Moraes.", "titulo_pt": "Amorim critica missão eleitoral dos EUA no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72316, "titulo": "Zelensky diz que Rússia planeja levar 30 mil norte-coreanos para guerra", "url": "https://www.cnnbrasil.com.br/internacional/zelensky-diz-que-russia-planeja-levar-30-mil-norte-coreanos-para-guerra/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T20:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ucrânia afirma ter informações consistentes sobre planos russos de mobilização que incluiriam a entrada de 30 mil norte-coreanos e o recebimento de lançadores de mísseis da Coreia do Norte.", "titulo_pt": "Zelensky diz que Rússia planeja levar 30 mil norte-coreanos para guerra", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72752, "titulo": "Houthis claim attack on Saudi oil refinery as Iran war widens to Red Sea", "url": "https://www.washingtonpost.com/world/2026/07/25/houthis-claim-attack-saudi-oil-refinery-iran-war-widens-red-sea/", "fonte_id": "washington_post_world", "data_pub": "2026-07-25T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rebelos hutíes, apoiados pelo Irã, afirmam ter atacado uma refinaria de petróleo na Arábia Saudita. Essa ação pode aumentar as pressões nos mercados globais de petróleo, além das interrupções causadas pela fechamento do Estreito de Ormuz.", "titulo_pt": "Hutíes afirmam ter atacado refinaria saudita enquanto guerra com o Irã se expande para a mar roja", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 72708, "titulo": "CPC to raise domestic gasoline, diesel prices next week", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/26/2003861373", "fonte_id": "taipei_times", "data_pub": "2026-07-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir da próxima semana, o CPC (Comitê de Preços de Petróleo) aumentará os preços do gasolina e diesel no mercado interno.", "titulo_pt": "CPC vai aumentar preços de gasolina e diesel na próxima semana", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 72710, "titulo": "Japanese buyers driving record jewelry sales", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/26/2003861375", "fonte_id": "taipei_times", "data_pub": "2026-07-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As compras de joias por compradores japoneses estão impulsionando as vendas de joias. Os consumidores do Japão têm demonstrado um interesse crescente nas joias, contribuindo significativamente para o aumento das vendas no setor.", "titulo_pt": "Compradores japoneses impulsionam vendas de joias", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 72323, "titulo": "Plataforma P-52 da Petrobras está fechada faz nove meses – e pode não voltar em 2026", "url": "https://www.infomoney.com.br/mercados/plataforma-p-52-da-petrobras-esta-fechada-faz-nove-meses-e-pode-nao-voltar-em-2026/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma P-52 da Petrobras está fechada desde há nove meses e pode não retornar até 2026. O campo localizado na Bacia de Campos atingiu seu pico de produção em 2011 e tem vindo a declinar desde então.", "titulo_pt": "Plataforma P-52 da Petrobras está fechada há nove meses – e pode não voltar até 2026", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72430, "titulo": "El megaexitoso sistema de pagos que conquistó Brasil y desató una batalla con Trump", "url": "https://www.lanacion.com.ar/el-mundo/el-megaexitoso-sistema-de-pagos-que-conquisto-brasil-y-desato-una-batalla-con-trump-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T21:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema de pagamentos público, gratuito e amplamente utilizado deslocou o dinheiro físico no Brasil e acendeu alertas nas grandes empresas americanas. O sistema ficou no centro das discussões sobre as tarifas impostas por Washington.", "titulo_pt": "O megaexitoso sistema de pagos que conquistou o Brasil e despertou a atenção de Trump", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 72327, "titulo": "Pequenas empresas entram com ações na Justiça contra novas tarifas de Trump", "url": "https://www.infomoney.com.br/mundo/pequenas-empresas-entram-com-acoes-na-justica-contra ação do Rioprevidência ligada ao Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/justica-manda-bloquear-ate-r-481-mi-para-resgate-de-aplicacao-do-rioprevidencia-ligada-ao-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Rio de Janeiro determinou o bloqueio de até R$ 481,5 milhões de uma gestora e dois diretores para garantir o resgate de investimento do Rioprevidência no fundo Revolution, ligado ao Banco Master.", "titulo_pt": "Justiça bloqueia até R$ 481 mi para resgate de aplicação do Rioprevidência ligada ao Master", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 72343, "titulo": "O fim do contrato do Banco Master com um tribunal brasileiro", "url": "https://veja.abril.com.br/brasil/o-fim-do-contrato-do-banco-master-com-um-tribunal-brasileiro/", "fonte_id": "veja", "data_pub": "2026-07-25T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O contrato do Banco Master com um tribunal brasileiro, especificamente o TRT da 4ª Região, está terminando. O banco tinha permissão para oferecer empréstimos a magistrados, servidores e pensionistas desse tribunal.", "titulo_pt": "Fim do contrato do Banco Master com tribunal brasileiro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 72394, "titulo": "O imposto mínimo global e o custo da convergência", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-imposto-minimo-global-e-o-custo-da-convergencia", "fonte_id": "jota", "data_pub": "2026-07-25T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As multinacionais começaram a recolher o adicional da CSLL neste mês, mas só detalharão a apuração à Receita Federal em 2027.", "titulo_pt": "O imposto mínimo global e o prazo de detalhamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 72237, "titulo": " 3:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O podcast do analista Luke Lin da DIGITIMES aborda dois temas principais: a disposição da SK Hynix de construir fábricas nos Estados Unidos e o motivo por trás da promessa adicional de investimento de US$100 bilhões da TSMC no país.", "titulo_pt": "Podcast: SK Hynix, TSMC e Intel enfrentam inflexão em chips de IA e fluxo de caixa", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 72716, "titulo": "SpaceX eyes tower catch for next Starship after auspicious end to 13th flight", "url": "https://arstechnica.com/space/2026/07/spacex-eyes-tower-catch-for-next-starship-after-auspicious-end-to-13th-flight/", "fonte_id": "ars_technica", "data_pub": "2026-07-25T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX planeja tentar capturar o Starship de volta ao local de lançamento na próxima missão. A empresa obteve um resultado positivo no 13º voo do veículo.", "titulo_pt": "Spacex planeja tower catch para próximo voo do Starship", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 72727, "titulo": "Kalshi demands Netflix take down trailer for ‘Prediction Games’ documentary", "url": "https://techcrunch.com/2026/07/25/kalshi-demands-netflix-take-down-trailer-for-prediction-games-documentary/", "fonte_id": "techcrunch", "data_pub": "2026-07-25T16:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kalshi afirma que o trailer do documentário 'Prediction Games' é difamatório e contém documentos fabricados e declarações falsas e enganosas.", "titulo_pt": "Kalshi pede para Netflix remover trailer do documentário ‘Prediction Games’", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 72731, "titulo": "'I get caught up in the numbers game': Why useful social media content gets lost online", "url": "https://phys.org/news/2026-07-caught-game-social-media-content.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amy posta fotos de si mesma no Instagram e percebe que as imagens em biquíni recebem muitos likes, enquanto conteúdo explicativo sobre sua stoma (um orifício na barriga que direciona os resíduos para uma bolsa conectada a ela) tem menos visibilidade. Isso ilustra como conteúdo útil pode ser negligenciado em redes sociais.", "titulo_pt": "Eu me envolvo no jogo dos números: por que conteúdo socialmente valioso é perdido na internet", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72732, "titulo": "Unwritten social rules, not government oversight, help keep forest land sustainable", "url": "https://phys.org/news/2026-07-unwritten-social-oversight-forest-sustainable.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa analisou mais de 18.000 áreas florestais ao redor do mundo e descobriu que a agricultura swidden, frequentemente chamada de 'corta-e-baixa', tem um impacto ambiental mais complexo e menos destrutivo do que o termo sugere. Segundo o estudo, regras sociais não escritas em pequenas comunidades, e não a regulação governamental, são as principais responsáveis por manter o uso da terra sustentável ao longo do tempo.", "titulo_pt": "Regras sociais, não fiscalização governamental, ajudam na sustentabilidade das florestas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72733, "titulo": "Syria's ancient sites face widespread looting and systematic bulldozing, satellite images reveal", "url": "https://phys.org/news/2026-07-syria-ancient-sites-widespread-looting.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias centenas de sítios arqueológicos foram destruídos por roubos durante a guerra civil síria, que durou de 2011 a 2024. O dano recente aos locais de patrimônio cultural desde 2016, incluindo os sítios da UNESCO como Palmyra e a antiga cidade romana de Apamea, tem sido desconhecido até agora.", "titulo_pt": "Sítios arqueológicos antigos da síria sofrem devastação generalizada por roubos e demolições sistemáticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72199, "titulo": "8.000 novas espécies de insetos são identificadas por meio do DNA no Equador", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/8000-novas-especies-de-insetos-sao-identificadas-por-meio-do-dna-no-equador.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-25T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Equador identificaram geneticamente 8.000 novas espécies de insetos em uma floresta protegida do Chocó Andino, que foi declarada reserva mundial da biosfera.", "titulo_pt": "8.000 Novas espécies de insetos são identificadas por meio do DNA no Equador", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 72266, "titulo": "Quem é melhor na multitarefa? Estudo surpreende ao comparar homens e mulheres", "url": "https://exame.com/ciencia/quem-e-melhor-na-multitarefa-estudo-surpreende-ao-comparar-homens-e-mulheres/", "fonte_id": "exame", "data_pub": "2026-07-25T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo simulou situações do cotidiano e constatou que homens e mulheres apresentaram desempenho semelhante ao realizar tarefas simultaneamente. O experimento comparou os dois gêneros em contextos de multitarefa, encontrando resultados iguais entre eles.", "titulo_pt": "Quem é melhor na multitarefa? Estudo não encontra diferença entre homens e mulheres", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 72734, "titulo": "New model maps how social media users repeatedly spread misinformation", "url": "https://phys.org/news/2026-07-social-media-users-misinformation.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa publicada na International Journal of Enterprise Network Management sugere que os usuários de mídias sociais têm um papel mais significativo no compartilhamento de informações falsas do que se pensava. Os pesquisadores argumentam que as iniciativas para combater a 'fake news' devem concentrar-se tanto na compreensão dos motivos pelos quais os usuários compartilham informações enganosas quanto em identificar aqueles que criam conteúdo enganoso.", "titulo_pt": "Novo modelo mapeia como usuários de mídias sociais repetidamente espalham desinformação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72735, "titulo": "Cameras attached to whale sharks capture krill chases never witnessed before", "url": "https://phys.org/news/2026-07-cameras-whale-sharks-capture-krill.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Câmeras instaladas nos tubarões-baleia capturaram cenas de caça a crustáceos krill que nunca foram vistas antes. Estes peixes, os maiores do mundo, despertam curiosidade e interesse pelos observadores.", "titulo_pt": "Câmeras em tubarões-baleia registram caças a krill inéditos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72737, "titulo": "Spain fights to 'save lives' as wildfire evacuees shelter in Madrid", "url": "https://phys.org/news/2026-07-spain-wildfire-evacuees-madrid.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro espanhol Pedro Sánchez afirmou que bombeiros estão trabalhando para salvar vidas nas chamas que se alastram próximo a Madrid. Além disso, um incêndio em outra região do país já resultou em uma morte.", "titulo_pt": "Espanha luta para 'salvar vidas' com evacuados de incêndios no madri", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72738, "titulo": "SpaceX launches Starship on another test flight, this time with the most advanced Starlinks", "url": "https://phys.org/news/2026-07-spacex-starship-flight-advanced-starlinks.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou o foguete Starship em mais uma viagem de teste, desta vez lançando 20 dos Starlinks mais avançados. O voo se estendeu por metade do mundo.", "titulo_pt": "Spacex realiza outro voo de teste do Starship com os Starlinks mais avançados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72595, "titulo": "Latest news bulletin | July 25th, 2026 – Evening", "url": "http://www.euronews.com/video/2026/07/25/latest-news-bulletin-july-25th-2026-evening", "fonte_id": "euronews", "data_pub": "2026-07-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatadas as principais notícias da Europa e do mundo no dia 25 de julho de 2026, abrangendo os setores de notícia geral, economia, entretenimento, política, cultura e viagens.", "titulo_pt": "Boletim das últimas notícias | 25 de julho de 2026 – noite", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 72739, "titulo": "The hunt for a natural molecule that can release cellular energy", "url": "https://phys.org/news/2026-07-natural-molecule-cellular-energy.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Todos os células do corpo humano utilizam energia gerada pela molécula ATP para realizar processos celulares, como o batimento cardíaco e a movimentação dos dedos. A liberação da energia armazenada no ATP ocorre apenas quando sua decomposição é iniciada por uma enzima.", "titulo_pt": "A busca por uma molécula natural que libere energia celular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72754, "titulo": "We talk with astronaut Michael Foale about the 1997 Space Station Mir crisis: 'He took all the blame of the collision on his shoulders'", "url": "https://www.space.com/entertainment/space-movies-shows/we-talk-with-astronaut-michael-foale-about-the-1997-space-station-mir-crisis-he-took-all-the-blame-of-the-collision-on-his-shoulders", "fonte_id": "space_com", "data_pub": "2026-07-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michael Foale, astronauta, afirma que a tripulação salvou a Estação Espacial Mir naquele dia. Ele assumiu toda a responsabilidade pelo acidente de colisão.", "titulo_pt": "Astronauta Michael Foale fala sobre a crise da estação espacial Mir em 1997: 'ele levou toda a culpa do choque nas costas'", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 72740, "titulo": "Ancient bones from smaller Maya communities reveal heavy reliance on maize and local subsistence patterns", "url": "https://phys.org/news/2026-07-ancient-bones-smaller-maya-communities.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos de ossadas de comunidades menores maiaicas mostraram uma forte dependência da milho e padrões locais de subsistência. Os historiadores e arqueólogos já sabem que o milho era um alimento central e símbolo cultural no mundo maia antigo, mas a maioria do conhecimento vêm de pesquisas em cidades maiores e sepultamentos nobres.", "titulo_pt": "Ossadas antigas das menores comunidades maiaicas revelam forte dependência do milho e padrões locais de subsistência", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72755, "titulo": "This Week In Space podcast: Episode 220 — First on Mars", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-220-first-on-mars", "fonte_id": "space_com", "data_pub": "2026-07-25T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 220ª edição do podcast This Week In Space, Rod Pyle e Tariq Malik recebem Dr. Pascal Lee e a astrobióloga Dr. Penny Boston para comemorar o aniversário de 50 anos desde que a Viking 1 pousou em Marte.", "titulo_pt": "Esta semana no espaço: episódio 220 — primeira pousada em marte", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 72747, "titulo": "A single dose reversed autism-like symptoms in adult mice within hours", "url": "https://www.sciencedaily.com/releases/2026/07/260724061436.htm", "fonte_id": "science_daily", "data_pub": "2026-07-25T15:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma dose única de rapamicina melhorou quase todos os sintomas semelhantes ao autismo em camundongos adultos dentro de duas horas. Mesmo uma inflamação leve durante a gravidez pode levar a atividade cerebral excessiva, sensibilidade sensorial aumentada e comportamentos repetitivos nos filhotes, além de um risco maior de crises epilépticas.", "titulo_pt": "Uma dose única revertiu sintomas semelhantes ao autismo em camundongos adultos rapidamente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 72200, "titulo": "Navio da era bizantina tem quantidade impressionante de ouro, segundo arqueólogo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/navio-da-era-bizantina-tem-quantidade-impressionante-de-ouro-segundo-arqueologo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-25T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um navio da era bizantina descoberto há mais de uma década na costa sul da Croácia continha joias de ouro, sugerindo que transportava uma pessoa de alta patente e sua comitiva. Arqueólogos fizeram esta conclusão baseada nos achados.", "titulo_pt": "Navio bizantino contém quantidade impressionante de ouro, indica arqueólogo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 72496, "titulo": "Suspenden marcha del Orgullo en Berlín tras atropello que dejó varios heridos", "url": "https://www.latercera.com/mundo/noticia/suspenden-marcha-del-orgullo-en-berlin-tras-atropello-que-dejo-varios-heridos/", "fonte_id": "la_tercera", "data_pub": "2026-07-25T21:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um veículo atingiu um grupo de pessoas perto do parque Tiergarten, na vizinhança da Porta de Brandemburgo, em Berlim. A polícia alemã realizou uma operação intensa e está buscando suspeitos.", "titulo_pt": "Marcha do orgulho em berlim é suspensa após atropelo que deixou vários feridos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 72654, "titulo": "Berlin Pride parade called off after car drives into crowd", "url": "https://www.scmp.com/news/world/europe/article/3361856/berlin-pride-parade-called-after-car-drives-crowd?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-25T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um carro atingiu uma multidão durante as celebrações do Pride de Berlim no sábado à noite, ferindo várias pessoas. A polícia está buscando suspeitos e enviou serviços de emergência ao Parque Tiergarten, perto da Porta de Brandemburgo.", "titulo_pt": "Passeata do orgulho de berlim é cancelada após carro atingir a multidão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 72186, "titulo": "Escritora Nathacha Appanah é um dos destaques internacionais da Flip", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-07/escritora-nathacha-appanah-e-um-dos-destaques-internacionais-da-flip", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-07-25T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Festa Literária de Paraty (Flip) na 24ª edição apresentou escritores de diversos países e trajetórias, destacando a franco-mauriciana Nathacha Appanah. Sua obra mais recente aborda os destinos de mulhe
