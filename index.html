const D = {"gerado_em": "14/11/2026 15:23", "stats": {"noticias_novas": 618, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-presidente Jair Bolsonaro enfrentou críticas e boicotes de quadros da extrema esquerda, conforme relatou o deputado André Janones. O PT propôs incluir joias e obras de arte no cálculo do imposto sobre fortunas, enquanto o projeto que isenta policiais e bombeiros militares do Imposto de Renda foi apresentado. O pacote fiscal aprovado no Senado estabelece limites para o crescimento dos gastos públicos e inclui prazos para discutir supersalários, mas parlamentares de esquerda e do PSOL rejeitaram a proposta. O STF arquivou um inquérito contra o senador Rogério Marinho, ex-coordenador da campanha de Flávio Bolsonaro, e o ministro Gilmar Mendes criticou a afirmação de Sergio Moro sobre a anulação da condenação de Lula no caso do triplex no Guarujá. O governo federal decidiu cancelar financiamentos públicos para a construção de dez prédios de luxo, afetando projetos em diversas regiões do país. Além disso, a Receita Federal cancelará automaticamente dívidas de contribuição previdenciária dos Microempreendedores Individuais (MEIs) vencidas até esta sexta-feira (13).", "mundo": "A reunião trilateral entre os presidentes dos Estados Unidos, Rússia e China, marcada para 19 de novembro em Shenzhen, durante a cúpula APEC, será um momento histórico para discutir a redução de armas nucleares, apesar de se esperar que os resultados concretos sejam limitados. O encontro, que envolverá os presidentes Vladimir Putin, Xi Jinping e Donald Trump, será a primeira reunião tripla entre líderes mundiais sobre esse assunto. Além disso, o secretário de Transportes dos Estados Unidos, Sean Duffy, anunciou que a normalização dos voos após a paralisação generalizada na sexta-feira será um processo lento, devido a falhas no equipamento de telecomunicação. A suspensão de mais de 16 mil voos nos EUA foi causada por um problema com fios de cobre nos sistemas de comunicação da aviação, e a Administração Federal de Aviação (FAA) está investigando a possibilidade de que a falha tenha sido devido a equipamentos obsoletos ou até mesmo a um ataque cibernético, embora nenhuma ação tenha sido tomada pelo Departamento de Comércio até o momento.\n\nA geopolítica global está em foco com negociações complexas envolvendo a Ucrânia e a Rússia. O presidente ucraniano Volodymyr Zelenskiy propôs a cedência de territórios ucranianos, incluindo o Donbas, à Rússia em troca da adesão à OTAN, uma proposta que gerou controvérsia. Zelenskiy afirmou que os Estados Unidos levantaram a hipótese durante negociações em Abu Dhabi, mas a Rússia rejeitou a ideia de trégua energética. A China também está intensificando sua presença na área de inteligência artificial, com o empresário Jensen Huang sendo apontado como um dos principais responsáveis. Em outro contexto, Israel ocupou a casa de um palestino-americano na Cisjordânia por 17 dias, enquanto a Turquia e o Qatar assinaram um acordo de defesa para uma posição unificada em face de ameaças externas. A reunião inédita entre os presidentes dos Estados Unidos, Rússia e China na cúpula da APEC na China será um ponto de destaque na agenda geopolítica global.", "economia": "O Brasil enfrenta desafios econômicos e legais, com a Corte de Contas da Federação (Carf) afastando o IRPJ e CSLL sobre incentivos de ICMS concedidos à Cervejaria Petrópolis, reduzindo o valor em discussão para aproximadamente R$ 200 milhões. Em contraste, o Morgan Stanley prevê uma nova era para a Bolsa da Coreia do Sul, com o índice KOSPI tendo potencial para atingir os 10 mil pontos nos próximos três a cinco anos. No cenário internacional, o setor de tecnologia enfrenta mudanças, com a Nvidia enfrentando riscos de ações judiciais após a saída de seu CEO, Jensen Huang, e a Binance prevendo a retomada total dos saques até a próxima semana. Além disso, a economia global enfrenta desafios como a possível crise de dívidas da Trump Media Group, devido à queda nas ações e nos preços das criptomoedas, e a confusão causada pelo ground stop da FAA nos Estados Unidos, com quase 3.300 voos cancelados nos primeiros dias da semana.", "tecnologia": "Os Estados Unidos enfrentaram significativas interrupções no tráfego aéreo devido a um blackout no controle do tráfego aéreo, inicialmente atribuído a uma atualização de equipamento rotineira, mas posteriormente descartado. O secretário de Transportes dos EUA, Sean Duffy, informou que todos os sistemas da Administração Federal de Aviação (FAA) já estão de volta às operações normais, reiterando a necessidade de financiamento para melhorias na infraestrutura. A empresa norte-americana Meta foi multada em 805 milhões de euros pela Agência Europeia de Proteção de Dados por acessar fotos e vídeos de usuários do Android sem consentimento, um caso que reforça as preocupações com a privacidade e a segurança dos dados. A indústria de inteligência artificial enfrenta uma crise de confiança, com a ascensão do Partido Democrata, a oposição dos americanos à IA e aos centros de dados, e a prioridade do novo Congresso em estabelecer regulamentos. Estas crises ameaçam interromper o avanço aparentemente ininterrupto da IA. Além disso, a Neousys Technology registrou resultados operacionais recorde no terceiro trimestre de 2026, impulsionada por envios para clientes e projetos, e picos de envios para o mercado norte-americano, com expectativa de crescimento em segmentos como defesa, inteligência artificial em borda, e aplicações envolvendo veículos guiados automaticamente (AGVs) e robôs móveis autônomos (AMRs), além de humanóides e desenvolvimento de saúde para 2027.", "ciencia": "Um dos eventos mais relevantes mencionados é o possível retorno do Starship da SpaceX ao solo após um aborto do pouso 'chopsticks', um esforço inédito da empresa para capturar o veículo em seu local de lançamento. O Lago Baikal, o maior lago de água doce do mundo, está em recuperação após décadas de declínio, abrigando cerca de 20% das águas doces do planeta e sendo um importante ambiente para a biodiversidade. Em um estudo recente, cientistas da Universidade do Missouri descobriram que idosos que seguem rotinas diárias consistentes relatam menos dor física e menos sintomas de depressão, mesmo quando enfrentam insônia, sugerindo que manter horários regulares pode auxiliar na regulação do relógio biológico do corpo e na saúde geral. Além disso, a Voyager 1 da NASA está prestes a atingir um novo recorde de distância no espaço, enquanto a Euclid, um telescópio espacial, lançou imagens de um bilhão de objetos cósmicos, proporcionando insights valiosos sobre a formação do universo.", "cultura": "A cantora filipina Carmelle venceu a primeira edição asiática do Eurovision Song Contest com sua performance de dança-pop 'Sobra-Sobra', superando 10 outros concorrentes no concurso realizado em Bangkok, Tailândia. Outro destaque cultural é a transmissão deste domingo, às 22h, pelo programa 'Grandes Compositores da Broadway', apresentado por Ruy Castro, focado no compositor Irving Berlin. O programa também é exibido nas segundas-feiras, às 22h, pela Rádio Nacional. A 8ª edição do Festival Melanina Acentuada encerra em São Paulo, após 14 anos de ausência, com espetáculos teatrais e ateliês gratuitos, além de espetáculos pagos. Entre as novidades literárias, a escritora sino-americana R. F. Kuang aborda na obra 'História de Taipei' a experiência de uma universitária chinesa que passa dez semanas em Taipei para estudar chinês, explorando os desafios linguísticos enfrentados pela personagem.", "sociedade": "Um estudo do Instituto Natura e da Lupa Social indica que aumentar o percentual de crianças alfabetizadas aos 7 anos para 95% poderia beneficiar 1 milhão de jovens ao concluir o Ensino Médio em quatro anos, destacando a importância da alfabetização na idade certa para o futuro das gerações jovens no Brasil. Em contraste, um relatório mostra que 55% dos jovens entre 18 e 34 anos da região do Biobío, no Chile, considerariam migrar para Santiago em busca de emprego, refletindo as desigualdades regionais na América Latina. Do outro lado do mundo, o Chile enfrenta a paradoxo de valorizar a democracia, mas poucos acreditam em sua contribuição para o seu bem-estar, conforme revelado por uma pesquisa intitulada 'Cuidar a democracia hoje'. Em outro cenário, a sociedade chilena também se depara com o aumento potencial de 44% no número de adultos com diabetes até 2050, conforme dados da International Diabetes Federation, sinalizando um desafio de saúde pública emergente.", "meio_ambiente": "Em 2026, o mundo enfrentou eventos climáticos extremos e letais, conforme relatos da Guardian World, com mais de 100.000 mortes já registradas, sendo essa uma estimativa conservadora. O Chile se prepara para um verão extremo com alto risco de incêndios, devido à seca prolongada causada pelo El Niño e à vegetação seca, com a Conaf estabelecendo uma meta de 7.000 km de cortafuegos e os bombeiros contando com novas tecnologias de informação satelital. No Brasil, o Ceará decretou situação de emergência em 65 cidades devido ao risco de seca associado ao fenômeno El Niño, com a validade de 180 dias, enquanto o Ibama afirma que os incêndios na floresta do Pará são intencionais, aproveitando as condições climáticas para eliminar a vegetação. Além disso, o Parque del Jaguar, no México, protege jaguars com uma parede de 18 km de limestone, permitindo a passagem de vida selvagem e protegendo mais de 1.000 hectares de floresta.", "direitos_humanos": "Em 2020, um produtor musical em França foi agredido por três policiais, um incidente que levou a um processo judicial. Cinco jovens que estavam presentes na gravação subterrânea testemunharam a violência e agora estão envolvidos na ação como demandantes, relatando o trauma que ainda sentem. No contexto americano, a política de detenção de imigrantes implementada pelo governo de Trump sobrecarrega os tribunais dos Estados Unidos, com entidades de direitos humanos criticando o uso de recursos públicos para defender prisões consideradas ilegais. Além disso, a empresa Meta foi multada em 805 milhões de euros pela Itália por acessar informações e dados de 20 milhões de usuários sem consentimento. Em Gaza, uma menina de 6 anos, Masa Yassin, enfrenta dificuldades para obter um tratamento necessário devido a restrições impostas por Israel, que impede a importação do plástico necessário para o protetor facial. Embora o artigo sobre denúncias falsas e a epidemia silenciosa de diabetes não contenha detalhes específicos, eles refletem preocupações importantes sobre abusos de poder e saúde pública, respectivamente, que impactam a sociedade em diversos aspectos."}, "resumo_do_dia": {"politica_nacional": [{"id": 263856, "titulo": "Janones acusa 'extrema esquerda' de boicote a Lula e a canal no WhatsApp", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/janones-acusa-extrema-esquerda-de-boicote-a-lula-e-a-canal-no-whatsapp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal André Janones acusou quadros de esquerda de promoverem um boicote ao presidente Lula e ao canal do WhatsApp por meio de críticas às medidas adotadas pelo governo após a reeleição do petista.", "titulo_pt": "Janones acusa 'extrema esquerda' de boicote a Lula e ao canal do WhatsApp", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 263928, "titulo": "PT quer incluir joias e obras de arte no cálculo do imposto sobre fortunas", "url": "https://www.metropoles.com/colunas/grande-angular/pt-quer-incluir-joias-e-obras-de-arte-no-calculo-do-imposto-sobre-fortunas", "fonte_id": "metropoles", "data_pub": "2026-11-14T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores apresentou um projeto que inclui joias, metais e obras de arte no cálculo do imposto sobre fortunas. A frequência das avaliações será regulamentada separadamente.", "titulo_pt": "PT quer incluir joias, obras de arte e metais no cálculo do imposto sobre fortunas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263898, "titulo": "Um recado nada velado do STF ao senador Rogério Marinho", "url": "https://veja.abril.com.br/politica/um-recado-nada-velado-do-stf-ao-senador-rogerio-marinho/", "fonte_id": "veja", "data_pub": "2026-11-14T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-coordenador da campanha presidencial do senador Flávio Bolsonaro, Rogério Marinho, candidato à Presidência do Senado, teve um inquérito arquivado há anos no Supremo Tribunal Federal.", "titulo_pt": "Mensagem não disfarçada do STF ao senador Rogério Marinho", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263918, "titulo": "Nvidia nega busca por CEO depois de renúncia de Huang", "url": "https://www.poder360.com.br/poder-internacional/nvidia-nega-busca-por-ceo-depois-de-renuncia-de-huang/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conselho da Nvidia negou buscas por um novo CEO após a renúncia de Jensen Huang. As especulações sobre possíveis sucessores foram classificadas como prematuras pela empresa.", "titulo_pt": "Nvidia nega busca por CEO após renúncia de Huang", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263899, "titulo": "Rouquidão de Lula: presidente cancela dois discursos nas Filipinas após ficar sem voz", "url": "https://veja.abril.com.br/brasil/lula-cancela-dois-discursos-nas-filipinas-apos-ficar-sem-voz/", "fonte_id": "veja", "data_pub": "2026-11-14T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula cancelou dois discursos nas Filipinas devido à rouquidão, deixando de fazer declarações à imprensa e um pronunciamento em um fórum empresarial. O texto sobre relações bilaterais foi divulgado pelo Planalto.", "titulo_pt": "Rouquidão de Lula: presidente cancela discursos nas Filipinas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263919, "titulo": "São Paulo tem rodovias estaduais mais bem avaliadas do país, diz CNT", "url": "https://www.poder360.com.br/poder-infra/sao-paulo-tem-rodovias-estaduais-mais-bem-avaliadas-do-pais-diz-cnt/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Confederação Nacional do Transporte mostrou que 91% das rodovias estaduais em São Paulo receberam classificação ótima ou boa. Essa porcentagem indica que as rodovias paulistas são consideradas as melhores do país.", "titulo_pt": "São Paulo tem rodovias estaduais mais bem avaliadas do país, de acordo com pesquisa da CNT", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263920, "titulo": "Projeto isenta policiais e bombeiros militares do Imposto de Renda", "url": "https://www.poder360.com.br/poder-congresso/projeto-isenta-policiais-e-bombeiros-militares-do-imposto-de-renda/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto propõe isentar policiais e bombeiros militares do Imposto de Renda. Além disso, guardas municipais também seriam beneficiados. A proposta precisa passar pela Câmara e pelo Senado para se tornar lei.", "titulo_pt": "Projeto isenta policiais, bombeiros militares e guardas municipais do Imposto de Renda", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264000, "titulo": "TRE-SP envia agradecimento à SPTrans por colaboração nas eleições", "url": "https://www.cnnbrasil.com.br/eleicoes/tre-sp-envia-agradecimento-a-sptrans-por-colaboracao-nas-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral de São Paulo (TRE-SP) enviou um agradecimento à SPTrans pela colaboração durante as eleições. A parceria incluiu a implementação do Programa Seu Voto Importa, que oferece transporte para eleitores com deficiência ou mobilidade reduzida.", "titulo_pt": "TRE-SP agradece colaboração da SPTrans nas eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263935, "titulo": "Associação pede ao STF acesso a registros de provas da Compliance Zero", "url": "https://www.metropoles.com/colunas/grande-angular/associacao-pede-ao-stf-acesso-a-registros-de-provas-da-compliance-zero", "fonte_id": "metropoles", "data_pub": "2026-11-14T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma associação solicitou ao Supremo Tribunal Federal (STF) acesso a registros de provas da operação Compliance Zero. A petição não especifica quem a Civitas representa.", "titulo_pt": "Associação pede ao STF acesso a registros de provas da Compliance Zero", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263902, "titulo": "Investigação da CGU evita superfaturamento de quase R$ 90 milhões no governo Lula", "url": "https://veja.abril.com.br/brasil/investigacao-da-cgu-evita-superfaturamento-de-quase-r-90-milhoes-no-governo-lula/", "fonte_id": "veja", "data_pub": "2026-11-14T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CGU (Controladoria-Geral da União) evitou um superfaturamento de quase R$ 90 milhões em um edital de manutenção de rodovia no estado de Rondônia, lançado pelo Dnit (Departamento Nacional de Infraestrutura de Transportes) durante o governo Lula.", "titulo_pt": "Investigação da CGU evita superfaturamento de quase R$ 90 milhões em edital de manutenção de rodovia no governo Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263922, "titulo": "Mercado estima impacto do ajuste fiscal abaixo de R$ 60 bilhões", "url": "https://www.poder360.com.br/poder-economia/mercado-estima-impacto-do-ajuste-fiscal-abaixo-de-r-60-bilhoes/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado estima que o impacto do ajuste fiscal seja inferior a R$ 60 bilhões em 2027, com projeções variando de R$ 27,9 bilhões a R$ 56,1 bilhões. Especialistas questionam a dependência de receitas para o ajuste.", "titulo_pt": "Mercado estima impacto do ajuste fiscal abaixo de R$ 60 bilhões", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263923, "titulo": "Entenda como o pacote fiscal limita o crescimento dos gastos", "url": "https://www.poder360.com.br/poder-economia/entenda-como-o-pacote-fiscal-limita-o-crescimento-dos-gastos/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pacote fiscal aprovado no Senado estabelece limites para o crescimento dos gastos públicos e inclui prazos para discutir supersalários. O texto-base também permite despesas extras para investimentos.", "titulo_pt": "Entenda como o pacote fiscal limita o crescimento dos gastos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263924, "titulo": "PT, PC do B e Psol articulam pacote contra ajuste fiscal de Lula", "url": "https://www.poder360.com.br/poder-congresso/pt-pc-do-b-e-psol-articulam-pacote-contra-ajuste-fiscal-de-lula/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT), o Partido Comunista do Brasil (PC do B) e o Partido Socialismo e Liberdade (Psol) estão articulando um pacote de medidas que inclui a taxação de bancos e grandes fortunas. Além disso, foram apresentados dois projetos que flexibilizam as metas fiscais e protegem investimentos.", "titulo_pt": "PT, PC do B e Psol articulam pacote contra ajuste fiscal de Lula", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263905, "titulo": "Por que aliados de esquerda e do PSOL rejeitam o ajuste fiscal do governo Lula", "url": "https://veja.abril.com.br/politica/por-que-aliados-de-esquerda-e-do-psol-rejeitam-o-ajuste-fiscal-do-governo-lula/", "fonte_id": "veja", "data_pub": "2026-11-14T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares de esquerda e do PSOL rejeitam o ajuste fiscal aprovado no Senado. Eles convocam mobilizações nas ruas, alegando que a proposta contraria o resultado das eleições.", "titulo_pt": "Por que esquerdistas e do PSOL rejeitam o ajuste fiscal de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263925, "titulo": "Gilmar Mendes chama de “desfaçatez” fala de Moro sobre triplex", "url": "https://www.poder360.com.br/poder-justica/gilmar-mendes-chama-de-desfacatez-fala-de-moro-sobre-triplex/", "fonte_id": "poder360", "data_pub": "2026-11-14T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, decano do Supremo Tribunal Federal (STF), criticou a afirmação do ex-ministro Sergio Moro sobre a anulação da condenação de Lula no caso do triplex no Guarujá, afirmando que Moro atribuiu a decisão a motivos formais e políticos.", "titulo_pt": "Gilmar Mendes critica afirmação de Moro sobre anulação da condenação de lula", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263994, "titulo": "Pane aérea nos EUA: governo afirma que troca de cabos para fibra óptica causou apagão", "url": "https://www.infomoney.com.br/mercados/pane-aerea-nos-eua-governo-afirma-que-troca-de-cabos-para-fibra-optica-causou-apagao/", "fonte_id": "infomoney", "data_pub": "2026-11-14T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma falha na troca de cabos para fibra óptica interrompeu decolagens aéreas nos Estados Unidos por cerca de quatro horas. As companhias ainda enfrentam atrasos e cancelamentos neste sábado.", "titulo_pt": "Apagão aéreo nos EUA: troca de cabos para fibra óptica causou interrupção", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 264344, "titulo": "US firms tout orbital threat detection", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867754", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas americanas estão promovendo a detecção de ameaças orbitais.", "titulo_pt": "Empresas americanas destacam detecção de ameaças orbitais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264345, "titulo": "Allies tout Taiwan at climate conference", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867755", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alies enfatizaram a importância de Taiwan na conferência sobre clima. O país participou como observador em discussões sobre mudanças climáticas.", "titulo_pt": "Aliados destacam Taiwan na conferência sobre clima", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264348, "titulo": "French protests to focus on children and police bill", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/15/2003867758", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manifestações francesas se concentrarão em questões relacionadas a crianças e a um projeto de lei policial.", "titulo_pt": "Protestos franceses se concentrarão em crianças e projeto de lei policial", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 263862, "titulo": "De onde surgiu a teoria de que haverá um 'apagão mundial' no dia 17 de novembro (e por que ele é improvável)", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/de-onde-surgiu-a-teoria-de-que-havera-um-apagao-mundial-no-dia-17-de-novembro-e-por-que-ele-e-improvavel.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-14T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A teoria de que ocorrerá um 'apagão mundial' no dia 17 de novembro surgiu de uma data marcada no calendário dos Estados Unidos, um episódio da série Os Simpsons e recomendações governamentais para preparação de emergência. Este evento é improvável de ocorrer.", "titulo_pt": "De onde surgiu a teoria de que haverá um 'apagão mundial' no dia 17 de novembro (e por que ele é improvável)", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 264102, "titulo": "Armada realiza operativo de búsqueda tras desaparición de persona que ingresó al agua en Viña del Mar", "url": "https://www.latercera.com/nacional/noticia/armada-realiza-operativo-de-busqueda-tras-desaparicion-de-persona-que-ingreso-al-mar-en-vina-del-mar/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T17:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "De acordo com informações preliminares, uma pessoa teria entrado na água na Praia Caleta Abarca em circunstâncias ainda não esclarecidas e posteriormente desaparecido. Uma operação de busca foi realizada pela marinha.", "titulo_pt": "Marinha realiza operação de busca após desaparecimento de pessoa que entrou na água em Viña del Mar", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264330, "titulo": "Netanyahu insiste, 'governo di unità nazionale per chiudere i conti con l'Iran'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/14/netanyahu-insiste-governo-di-unita-nazionale-per-chiudere-i-conti-con-liran_c8608ef7-07b3-4696-a067-57f6719bef73.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-14T17:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Netanyahu afirma que apenas uma coalizão com seu partido garante a segurança de Israel. O premiê israelense insiste em formar um governo de união nacional para fechar contas com o Irã.", "titulo_pt": "Netanyahu reitera necessidade de governo de união nacional para garantir segurança de israel", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 264104, "titulo": "Rusia confirma reunión entre Trump, Putin y Xi Jinping el 19 de noviembre en China para abordar reducción de armas nucleares", "url": "https://www.latercera.com/mundo/noticia/rusia-confirma-reunion-entre-trump-putin-y-xi-jinping-el-19-de-noviembre-en-china-para-abordar-reduccion-de-armas-nucleares/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T17:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Rússia confirmou que um encontro tripartite entre os presidentes Putin, Xi e Trump será realizado em 19 de novembro em Shenzhen, durante a cúpula APEC, para discutir a redução de armas nucleares.", "titulo_pt": "Rússia confirma reunião entre Trump, Putin e Xi Jinping em 19 de novembro na China para tratar de redução de armas nucleares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264251, "titulo": "Elon Musk's SpaceX aborts booster recovery due to technical issues", "url": "https://www.france24.com/en/elon-musk-s-spacex-aborts-booster-recovery-due-to-technical-issues", "fonte_id": "france24", "data_pub": "2026-11-14T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX, de Elon Musk, estava realizando o 15º teste do foguete Starship. O plano era recuperar tanto o boostér quanto a nave, mas um problema técnico levou à abertura da operação de recuperação do boostér, que caiu no Golfo do México.", "titulo_pt": "SpaceX cancela recuperação do boostér do starship devido a problemas técnicos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 263997, "titulo": "Ucranianos aprendem técnicas de combate em treinamento da UE na Alemanha", "url": "https://www.cnnbrasil.com.br/internacional/ucranianos-aprendem-tecnicas-de-combate-em-treinamento-da-ue-na-alemanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ucranianos estão participando de um treinamento da União Europeia na Alemanha que envolve técnicas de combate realistas, incluindo o uso de drones, fumaça e efeitos sonoros.", "titulo_pt": "Ucranianos aprendem técnicas de combate em treinamento da UE na Alemanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263989, "titulo": "EUA levantam hipótese de Ucrânia ceder Donbas à Rússia em troca da Otan", "url": "https://www.infomoney.com.br/mundo/eua-levantam-hipotese-de-ucrania-ceder-donbas-a-russia-em-troca-da-otan/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Volodymyr Zelenskiy revelou que os EUA levantaram a hipótese de Ucrânia ceder o Donbas à Rússia em troca da adesão à Otan.", "titulo_pt": "EUA levantam hipótese de Ucrânia ceder Donbas à Rússia em troca da Otan", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264253, "titulo": "France and Cambodia share their love for pétanque in Phnom Penh", "url": "https://www.france24.com/en/video/20261114-france-and-cambodia-share-their-love-for-p%C3%A9tanque-in-phnom-penh", "fonte_id": "france24", "data_pub": "2026-11-14T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Phnom Penh está sediando o 20º Summit da Francôfonia neste domingo e segunda-feira. Durante uma visita oficial de três dias a Camboja, o presidente francês Emmanuel Macron participará do evento. França e Camboja compartilham uma paixão por pétanque, apesar de sua história complexa e profunda.", "titulo_pt": "França e camboja compartilham amor por pétanque durante summit da francôfonia em Phnom Penh", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 264254, "titulo": "Washington divided over how to deal with fallout from the Nvidia case", "url": "https://www.france24.com/en/washington-divided-over-how-to-deal-with-fallout-from-the-nvidia-case", "fonte_id": "france24", "data_pub": "2026-11-14T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agências do governo americano estão em conflito sobre como lidar com as consequências da demissão de Jensen Huang da Nvidia. O Tesouro queria proibir um empresa de Singapura envolvida no escândalo, mas o Departamento de Comércio não tomou nenhuma ação.", "titulo_pt": "Washington dividido sobre como lidar com os efeitos do caso Nvidia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 264295, "titulo": "COP31: Protesters, UN urge swift climate deal", "url": "https://www.dw.com/en/cop31-protesters-un-urge-swift-climate-deal/a-79948501?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-14T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe das Nações Unidas para assuntos climáticos advertiu que atrasos táticos nas negociações climáticas COP31 na Turquia poderiam impedir um acordo para frear o aquecimento global.", "titulo_pt": "COP31: chefe da ONU alerta para riscos de atrasos nas negociações climáticas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 264242, "titulo": "Copper wire upgrade caused nationwide flight suspension, US transport secretary says", "url": "https://www.bbc.co.uk/news/articles/c6wy9lynq4qno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-14T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um problema com fios de cobre causou um suspension nacional de voos nos Estados Unidos, conforme informou o secretário de transportes. O governo americano está investigando se a confusão foi devido a 'incompetência' ou a equipamentos defeituosos.", "titulo_pt": "Problema com fios de cobre causou suspensão nacional de voos, diz secretário de transportes", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 264203, "titulo": "China’s Intelligence Coup in the AI War", "url": "https://www.theatlantic.com/national-security/2026/11/jensen-huang-chinese-intelligence-nvidia/689430/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-14T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China tem trabalhado há anos para espionar seu caminho para a dominação na inteligência artificial. Com Jensen Huang, o país pode ter alcançado seu maior feito até agora.", "titulo_pt": "A Coup de inteligência da china na guerra da IA", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 263921, "titulo": "EUA sugerem que Ucrânia ceda Donbas para entrar na Otan", "url": "https://www.poder360.com.br/poder-internacional/eua-sugerem-que-ucrania-ceda-donbas-para-entrar-na-otan/", "fonte_id": "poder360", "data_pub": "2026-11-14T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zelensky afirmou que a proposta norte-americana sobre a Ucrânia ceder o Donbas para se juntar à Otan foi apresentada pela primeira vez e que a decisão final dependerá da sociedade ucraniana.", "titulo_pt": "EUA sugerem que Ucrânia ceda Donbas para entrar na Otan", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 264364, "titulo": "Finance and tech talent is beginning to return to Venezuela", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/15/2003867742", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há sinais de que talentos financeiros e tecnológicos estão retornando à Venezuela. A situação é vista como uma possível indicação de melhora econômica ou estabilidade no país.", "titulo_pt": "Financeiros e tecnológicos começam a retornar à Venezuela", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 263986, "titulo": "Em vídeo, ministro afirma que ajuste fiscal preserva direitos e combate privilégios", "url": "https://www.infomoney.com.br/politica/em-video-ministro-afirma-que-ajuste-fiscal-preserva-direitos-e-combate-privilegios/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Bruno Moretti mencionou supersalários e benefícios fiscais em um vídeo, afirmando que o ajuste fiscal preserva direitos e combate privilégios. O texto ainda está em tramitação no Congresso e enfrenta desconfiança tanto do mercado quanto de setores do governo.", "titulo_pt": "Em vídeo, ministro afirma que ajuste fiscal preserva direitos e combate privilégios", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264289, "titulo": "Nvidia board urged to consider 'potential return of Jensen Huang' by two major investors", "url": "https://www.cnbc.com/2026/11/14/nvidia-investors-jensen-huang-return-board-letter.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois investidores da Nvidia que detêm aproximadamente $2,13 bilhões em ações estão pedindo uma busca deliberada por liderança após a renúncia de Huang. Eles sugerem que a empresa considere a possibilidade de recontratar Huang.", "titulo_pt": "Investidores da nvidia pressionam para considerar 'potencial retorno de Jensen Huang'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 263987, "titulo": "A parte da força de trabalho da Tesla e da Amazon que nunca cansa (nem pede salário)", "url": "https://www.infomoney.com.br/business/global/a-forca-de-trabalho-da-tesla-e-da-amazon-nunca-cansa-nem-pede-salario/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Robôs estão tomando espaço nas fábricas e armazéns da Tesla e da Amazon, influenciando o debate sobre o futuro do trabalho. Esses robôs não cansam e não pedem salário.", "titulo_pt": "A parte da força de trabalho da Tesla e da Amazon que nunca cansa (nem pede salário)", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263990, "titulo": "Mpox: variante que causou crise na África avança no Brasil; veja sintomas", "url": "https://www.infomoney.com.br/mercados/mpox-variante-que-causou-crise-na-africa-avanca-no-brasil-veja-sintomas/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou 1.009 casos de mpox e confirmou a primeira morte causada pela doença em um paciente do Rio de Janeiro. A variante africana da doença está se espalhando no país.", "titulo_pt": "Mpox: variante africana que causou crise na África avança no Brasil; veja sintomas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263933, "titulo": "Chefe da aviação federal dos EUA pede desculpas após caos aéreo", "url": "https://www.metropoles.com/mundo/chefe-da-aviacao-federal-dos-eua-pede-desculpas-apos-caos-aereo", "fonte_id": "metropoles", "data_pub": "2026-11-14T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe da aviação federal dos EUA pediu desculpas após um caos aéreo. O problema foi causado por uma troca de fiação, que interrompeu a comunicação de tráfego.", "titulo_pt": "Chefe da aviação federal dos EUA pede desculpas após caos aéreo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263991, "titulo": "Sonda Voyager 1 da Nasa atingirá marco histórico a 26 bilhões de km da Terra", "url": "https://www.infomoney.com.br/mundo/sonda-voyager-1-da-nasa-atingira-marco-historico-a-26-bilhoes-de-km-da-terra/", "fonte_id": "infomoney", "data_pub": "2026-11-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Voyager 1, da Nasa, atingirá um marco histórico a 26 bilhões de quilômetros da Terra após 49 anos de operação. A Voyager 1 e a Voyager 2 foram lançadas para explorar os planetas no sistema solar exterior antes de seguir em direção ao espaço interestelar.", "titulo_pt": "Sonda Voyager 1 da Nasa atingirá marco histórico a 26 bilhões de km da Terra", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263992, "titulo": "Binance prevê retomada total dos saques até a próxima semana", "url": "https://www.infomoney.com.br/onde-investir/binance-preve-retomada-total-dos-saques-ate-a-proxima-semana/", "fonte_id": "infomoney", "data_pub": "2026-11-14T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance retomou gradualmente os saques em fases neste mês, após cobrir 95% dos US$6,3 bilhões em tokens roubados de sua plataforma. A empresa prevê a retomada total dos saques até a próxima semana.", "titulo_pt": "Binance prevê retomada total dos saques até a próxima semana", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263993, "titulo": "Musk: ‘sem Huang, muitos acordos críticos feitos em aperto de mão serão perdidos’", "url": "https://www.infomoney.com.br/business/musk-sem-huang-muitos-acordos-criticos-feitos-em-aperto-de-mao-serao-perdidos/", "fonte_id": "infomoney", "data_pub": "2026-11-14T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Huang deixou sua posição após escândalos relacionados a um suposto relacionamento com uma espiã chinesa. Musk afirmou que muitos acordos importantes, feitos informalmente, podem ser perdidos sem Huang.", "titulo_pt": "Musk: 'sem Huang, muitos acordos críticos feitos em aperto de mão serão perdidos'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 263926, "titulo": "EUA têm mais de 4.000 voos cancelados neste sábado após suspensão aérea", "url": "https://www.poder360.com.br/poder-internacional/eua-tem-voos-cancelados-neste-sabado-apos-suspensao-aerea/", "fonte_id": "poder360", "data_pub": "2026-11-14T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos registraram mais de 4.000 voos cancelados neste sábado após a suspensão aérea. No Brasil, 3.019 operações tiveram atrasos até as 13h de Brasília.", "titulo_pt": "EUA têm mais de 4.000 voos cancelados neste sábado após suspensão aérea", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263849, "titulo": "State Grid emite R$ 2,5 bi em 'panda bonds' para financiar transmissão de energia no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/state-grid-emite-r-25-bi-em-panda-bonds-para-financiar-transmissao-de-energia-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A State Grid Brasil emitiu R$ 2,5 bilhões em 'panda bonds' para financiar obras de transmissão de energia em uma linha que liga as regiões Nordeste e Centro-Oeste.", "titulo_pt": "State Grid emite R$ 2,5 bi em 'panda bonds' para financiar transmissão de energia no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263912, "titulo": "Até quando passageiros vão enfrentar transtornos para voar nos EUA, segundo secretário de Transportes", "url": "https://veja.abril.com.br/mundo/ate-quando-passageiros-vao-enfrentar-transtornos-para-voar-nos-eua-segundo-secretario-de-transportes/", "fonte_id": "veja", "data_pub": "2026-11-14T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 3.800 voos foram cancelados e mais de 2.100 atrasos registrados na manhã deste sábado nos Estados Unidos. O secretário de Transportes abordou a questão das dificuldades enfrentadas pelos passageiros durante os voos no país.", "titulo_pt": "Até quando passageiros vão enfrentar transtornos para voar nos EUA, segundo secretário de Transportes?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 264037, "titulo": "Setor aponta risco de distorção em novas metas do RenovaBio", "url": "https://www.jota.info/tributos-e-empresas/infraestrutura/setor-aponta-risco-de-distorcao-em-novas-metas-do-renovabio", "fonte_id": "jota", "data_pub": "2026-11-14T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há discussões sobre o risco de distorção nas novas metas do RenovaBio, motivadas por uma revisão regulatória prevista pela Lei 15.082/2024.", "titulo_pt": "Setor aponta risco de distorção em novas metas do RenovaBio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263850, "titulo": "Plano fiscal precisa ir além e mudar regras do mínimo, da saúde e da educação, dizem economistas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/plano-fiscal-precisa-ir-alem-e-mudar-regras-do-minimo-da-saude-e-da-educacao-dizem-economistas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os economistas sugerem que o plano fiscal anunciado pelo governo é insuficiente, pois não aborda as principais propostas em discussão, como a reforma do mínimo, da saúde e da educação. O plano prevê um superávit de 0,5% do PIB em 2027, mas é considerado gradual demais por parte dos economistas.", "titulo_pt": "Plano fiscal deve ir além das propostas atuais, afirmam economistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 264291, "titulo": "Berkshire breaks out to record high with fourth-quarter rally reaching 19%", "url": "https://www.cnbc.com/2026/11/14/berkshire-breaks-out-to-record-high-with-fourth-quarter-rally-reaching-19percent.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Berkshire Hathaway atingiram novos picos históricos durante uma semana forte, com quatro fechamentos consecutivos em recordes altos.", "titulo_pt": "Berkshire atinge novo recorde com quatro fechamentos consecutivos em alta", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 264294, "titulo": "Retailers are turning to entertainment to win shoppers’ attention", "url": "https://www.cnbc.com/2026/11/14/retailers-invest-entertainment.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lojas estão cada vez mais investindo em estúdios de entretenimento para atrair a atenção dos consumidores, uma tendência que está se intensificando.", "titulo_pt": "Lojas estão investindo em entretenimento para conquistar a atenção dos consumidores", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 264387, "titulo": "Transportation secretary blames ‘routine’ equipment upgrade for grounding flights nationwide", "url": "https://techcrunch.com/2026/11/14/transportation-secretary-blames-routine-equipment-upgrade-for-grounding-flights-nationwide/", "fonte_id": "techcrunch", "data_pub": "2026-11-14T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Transportes dos Estados Unidos atribuiu o cancelamento de voos em todo o país a uma 'atualização de equipamento rotineira'. O administrador da Administração Federal de Aviação (FAA), Bryan Bedford, afirmou que não há evidências de que a atualização esteja relacionada a inteligência artificial.", "titulo_pt": "Secretário de transportes culpa 'atualização de equipamento rotineira' pelo cancelamento de voos em massa", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 264340, "titulo": "Passengers face widespread disruption after US air traffic control outage", "url": "https://www.ft.com/content/f66f9811-59a2-4e52-a944-c7ed81dabc50?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-14T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de voos foram atrasados ou cancelados devido a uma falha no controle do tráfego aéreo dos Estados Unidos. A disputa política aumentou enquanto os passageiros enfrentam interrupções generalizadas.", "titulo_pt": "Passageiros enfrentam interrupções generalizadas de voos após falha no controle de tráfego aéreo dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 264036, "titulo": "Por que nem os criadores de 'Grand Theft Auto' puderam jogar 'GTA 6', o maior lançamento da história dos games", "url": "https://www.bbc.com/portuguese/articles/cmx2xnpeked2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-14T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O próximo título da renomada série 'Grand Theft Auto' está programado para ser lançado em 19 de novembro. Este jogo, que começou com um orçamento baixo, se tornou uma influência significativa até mesmo no cinema.", "titulo_pt": "Por que nem os criadores de 'Grand Theft Auto' poderão jogar 'GTA 6', o maior lançamento da história dos games", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 264430, "titulo": "Lite-On sees AI server orders through 2028 as 800V DC reshapes power market", "url": "https://www.digitimes.com/news/a20261112PD231/lite-on-market-2028-ai-server-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-11-14T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lite-On espera que as receitas relacionadas à IA representem 40% a 50% do total de receitas em 2027, impulsionadas pelo crescimento forte nos sistemas de energia de alto nível para IA. A visibilidade das encomendas da empresa estende-se até 2028, enquanto as especificações 800VDC estão sendo revisadas, o que atrasará a produção em massa para o final de 2027.", "titulo_pt": "Lite-on vê pedidos de servidores de IA até 2028 com a reconfiguração do mercado de energia DC de 800V", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 264431, "titulo": "Lite-On targets LEO satellites and enterprise AI servers for edge computing growth", "url": "https://www.digitimes.com/news/a20261112PD234/lite-on-leo-satellite-ai-server-edge-computing-revenue-business.html", "fonte_id": "digitimes", "data_pub": "2026-11-14T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lite-On Technology reorganizou suas divisões de negócios de TI, lançando a divisão de Computação em Pontos de Edges e Soluções de Energia (ECES) no terceiro trimestre, focando em oportunidades de computação em borda, especialmente em satélites de baixa órbita (LEO) e servidores empresariais on-premises, com expectativa de crescimento significativo nos próximos dois a três anos.", "titulo_pt": "Lite-on almeja oportunidades em satélites LEO e servidores empresariais para o crescimento da computação em borda", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 264218, "titulo": "FAA back at \"full operations\" after Friday outage, Transportation Sec. says", "url": "https://www.axios.com/2026/11/14/faa-ground-stop-outage-update", "fonte_id": "axios", "data_pub": "2026-11-14T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Secretário de Transportes dos EUA, Sean Duffy, informou que todos os sistemas da FAA retornaram às operações normais após um blackout de várias horas que interrompeu o tráfego aéreo no país na sexta-feira à noite. Duffy reiterou a necessidade de financiamento para melhorias na infraestrutura de controle do tráfego aéreo, alegando que tais melhorias poderiam ter evitado o blackout.", "titulo_pt": "FAA volta às operações completas após falha no sistema na sexta-feira, diz secretário de transportes", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 263847, "titulo": "Itália multa Meta em US$ 887 milhões por acessar fotos de usuários sem consentimento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/italia-multa-meta-em-us-887-milhoes-por-acessar-fotos-de-usuarios-sem-consentimento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência italiana de proteção de dados multou a Meta em 805 milhões de euros por acessar fotos e vídeos de usuários do Android sem consentimento. O anúncio foi feito neste sábado (14/11/2026).", "titulo_pt": "Itália multa Meta em 805 milhões de euros por acessar fotos de usuários sem consentimento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 264109, "titulo": "No fue la IA ni Microsoft: qué dejó a EE.UU. sin vuelos por 4 horas", "url": "https://www.latercera.com/tecnologia/noticia/que-dejo-a-eeuu-sin-vuelos-por-4-horas-faa-ia-microsoft-routers/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T16:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Por mais de quatro horas, nenhum voo comercial decolou nos Estados Unidos nesta sexta-feira. Inicialmente, a suspeita recaiu sobre a nova ferramenta de inteligência artificial SMART da FAA e o colapso do Microsoft 365, mas o governo de Donald Trump apontou outro responsável.", "titulo_pt": "Não foi a IA nem o Microsoft: qual foi o culpado pelo cancelamento de voos nos EUA por 4 horas?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264388, "titulo": "Asian governments react to Nvidia CEO Jensen Huang’s exit", "url": "https://techcrunch.com/2026/11/14/asian-governments-react-to-nvidia-ceo-jensen-huangs-exit/", "fonte_id": "techcrunch", "data_pub": "2026-11-14T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns governos asiáticos confirmaram compromissos de fornecimento de chips, enquanto outros estão monitorando o impacto na realização de projetos locais ou lidando com investigações em andamento.", "titulo_pt": "Governo asiático reage à saída do CEO da Nvidia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 263907, "titulo": "A multa bilionária aplicada pela Itália à Meta por acesso de fotos sem consentimento", "url": "https://veja.abril.com.br/mundo/a-multa-bilionaria-aplicada-pela-italia-a-meta-por-acesso-de-fotos-sem-consentimento/", "fonte_id": "veja", "data_pub": "2026-11-14T16:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em outubro, a Meta foi multada bilionariamente na Itália por acessar fotos sem consentimento dos usuários. Antes disso, a empresa já havia sido condenada em Novo México, Estados Unidos.", "titulo_pt": "Multação bilionária aplicada à Meta pela Itália por acesso indevido a fotos sem consentimento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263908, "titulo": "Pane na Microsoft: a situação confirmada pela empresa após problema no Outlook, Teams e Copilot", "url": "https://veja.abril.com.br/tecnologia/pane-na-microsoft-a-situacao-confirmada-pela-empresa-apos-problema-no-outlook-teams-e-copilot/", "fonte_id": "veja", "data_pub": "2026-11-14T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft confirmou uma interrupção nos serviços Outlook, Teams e Copilot devido a um problema técnico não relacionado à cibersegurança nem à inteligência artificial.", "titulo_pt": "Problema técnico na Microsoft: interrupção nos serviços Outlook, Teams e Copilot", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 264293, "titulo": "How Nvidia turmoil and a Democratic Congress could reshape the AI trade, according to ETF experts", "url": "https://www.cnbc.com/2026/11/14/nvidia-ai-trade-data-centers-congress.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos em ETFs afirmam que os problemas de liderança na Nvidia e o controle democrata do Congresso podem redirecionar a demanda por inteligência artificial (IA) a favor de outras empresas de tecnologia grandes e de fabricantes de chips rivais.", "titulo_pt": "Turbulência na Nvidia e congresso democrata podem redirecionar a demanda de IA, afirmam expertos em etfs", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 264382, "titulo": "The OpenAI board member who fired Sam Altman says we still can’t trust AI CEOs", "url": "https://www.theverge.com/podcast/1032907/helen-toner-openai-cset-ai-safety-policy-interview", "fonte_id": "the_verge", "data_pub": "2026-11-14T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Helen Toner, diretora executiva do Centro para Segurança e Tecnologia Emergente da Georgetown University, é entrevistada sobre a confiabilidade de CEOs de IA. Ela foi membro do conselho de administração do OpenAI e foi responsável por demitir Sam Altman.", "titulo_pt": "Membro do conselho do OpenAI que demitiu Sam Altman diz que ainda não podemos confiar em CEOs de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 263853, "titulo": "Tesla convida clientes para comprar robotáxi para uso pessoal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/tesla-convida-clientes-para-comprar-robotaxi-para-uso-pessoal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T14:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Tesla convidou clientes selecionados a comprar o robotáxi Cybercab para uso pessoal, com o objetivo de avançar na entrega de veículos totalmente autônomos aos consumidores. Esta iniciativa visa desenvolver e disponibilizar veículos autônomos para uso privado.", "titulo_pt": "Tesla convida clientes a adquirirem robotáxi para uso pessoal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263952, "titulo": "EUA lançaram 480 mi de agulhas no espaço há 63 anos — e restos ainda orbitam a Terra", "url": "https://exame.com/ciencia/eua-lancaram-480-mi-de-agulhas-no-espaco-ha-63-anos-e-restos-ainda-orbitam-a-terra/", "fonte_id": "exame", "data_pub": "2026-11-14T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto, parte da Guerra Fria, lançou 480 milhões de agulhas de cobre no espaço há 63 anos. Estes restos ainda orbitam a Terra e formam um anel de filamentos para garantir comunicações militares em caso de ataques à infraestrutura terrestre.", "titulo_pt": "EUA lançaram 480 milhões de agulhas no espaço há 63 anos — e restos ainda orbitam a Terra", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264371, "titulo": "Zero capital, 116 projects: AI spots the devils in the details of China corruption case", "url": "https://www.scmp.com/news/china/politics/article/3374314/zero-capital-116-projects-ai-spots-devils-details-china-corruption-case", "fonte_id": "scmp", "data_pub": "2026-11-14T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Wuhan, capital provincial da província de Hubei no centro da China, um modelo de dados grande alertou sobre uma possível corrupção. O alerta notou que uma empresa que assumiu mais de 10 projetos este ano teve seu capital registrado reduzido de 50 milhões de yuan para 10 milhões, mas ainda não possui capital pago. Além disso, mais de 80% dos projetos assumidos foram comunidades residenciais.", "titulo_pt": "Zero capital, 116 projetos: inteligência artificial detecta possíveis casos de corrupção em China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 264408, "titulo": "Some of the oldest rocks ever discovered shed light on Earth's early history", "url": "https://phys.org/news/2026-11-oldest-earth-early-history.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estimativas indicam que a Terra tem cerca de 4,5 bilhões de anos. Recentes descobertas de rochas na China datam de 3,95 bilhões de anos, sendo as mais antigas já conhecidas, e estão fornecendo novas informações sobre a formação e evolução da crosta terrestre.", "titulo_pt": "Algumas das rochas mais antigas já descobertas oferecem novos insights sobre a história inicial da terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264403, "titulo": "Do ice baths help muscles recover after a workout? A new study suggests not", "url": "https://www.scientificamerican.com/article/do-ice-baths-help-muscles-recover-after-a-workout-a-new-study-suggests-not/", "fonte_id": "scientific_american", "data_pub": "2026-11-14T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo sugere que banhos de água fria não são necessariamente a melhor maneira de se recuperar após o exercício. Não está claro que banhos de água fria sejam realmente a melhor opção para a recuperação pós-exercício.", "titulo_pt": "Banhos de água fria não são necessariamente a melhor maneira de se recuperar após o exercício, sugere novo estudo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 264437, "titulo": "This Week In Space podcast: Episode 236 — Alienspotting", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-236-alienspotting", "fonte_id": "space_com", "data_pub": "2026-11-14T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 236ª episódio do This Week In Space, Tariq Malik, Rod Pyle e Mikhail Tikhonov discutem sobre como a vida pode assumir formas mais incomuns, que podem não ser reconhecidas facilmente.", "titulo_pt": "Episódio 236 do this Week In Space: Alienspotting", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 264409, "titulo": "World's largest freshwater lake is recovering after decades of decline", "url": "https://phys.org/news/2026-11-world-largest-freshwater-lake-recovering.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O maior lago de água doce do mundo, o Lago Baikal na Sibéria, está se recuperando após décadas de declínio. O lago abriga cerca de 20% das águas doces do planeta e é um importante ambiente para a biodiversidade, tendo sido declarado Patrimônio Mundial da UNESCO em 1996.", "titulo_pt": "O maior lago de água doce do mundo está se recuperando após décadas de declínio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264309, "titulo": "NASA’s Voyager 1 to hit new space distance record of one light-day", "url": "https://www.aljazeera.com/news/2026/11/14/nasas-voyager-1-to-hit-new-space-distance-record-of-one-light-day?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1 foi lançado em 1977 e continua a enviar dados espaciais para uma equipe de cientistas da NASA.", "titulo_pt": "Voyager 1 deve bater novo recorde de distância no espaço de um dia-luz", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 263845, "titulo": "O que a relação entre um jumento e um touro revela sobre sexualidade", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/o-que-a-relacao-entre-um-jumento-e-um-touro-revela-sobre-sexualidade.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-14T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um planalto etíope, um touro chamado Aquiles estabeleceu uma relação incomum com um jumento chamado Pátroclo, passando tempo juntos, se lambendo e praticando sexo com penetração repetidamente.", "titulo_pt": "O que a relação entre um touro e um jumento revela sobre sexualidade", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 264438, "titulo": "'Alien: Fireteam Elite 2' is a good old-fashioned bug hunt, ironically plagued by bugs", "url": "https://www.space.com/entertainment/space-games/alien-fireteam-elite-2-is-a-good-old-fashioned-bug-hunt-ironically-plagued-by-bugs", "fonte_id": "space_com", "data_pub": "2026-11-14T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo 'Aliens: Fireteam Elite 2' é uma busca tradicional pelos Xenomorfos, mas enfrenta problemas técnicos. Os jogadores novamente sentem medo dos Xenomorfos, lembrando que as antigas buscas por inimigos devem continuar sendo relevantes.", "titulo_pt": "Aliens: fireteam Elite 2 é uma boa caça aos insetos tradicional, ironicamente assolada por bugs", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 264439, "titulo": "Why did Starship Flight 15 booster abort 'chopsticks' landing catch? SpaceX still investigating (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-says-starship-flight-15-booster-aborted-chopsticks-landing-catch-after-launch-due-to-guidance-issue-video", "fonte_id": "space_com", "data_pub": "2026-11-14T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX está investigando o motivo pelo qual o foguete Starship da missão 15 falhou no primeiro dos dois pousos planejados durante o teste realizado em 13 de novembro.", "titulo_pt": "Por que o Starship da missão 15 falhou no primeiro pouso planejado? Spacex ainda investigando", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 264440, "titulo": "On this day in space! Nov. 14, 1969: NASA's Apollo 12 astronauts launch to the moon on a 'pinpoint landing' lunar mission", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-14-2026", "fonte_id": "space_com", "data_pub": "2026-11-14T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 14 de novembro de 1969, os astronautas da missão Apollo 12 lançaram-se para a lua. Este foi um 'pouso de precisão' na missão lunar.", "titulo_pt": "Neste dia na história do espaço! 14 de novembro de 1969: astronautas da Apollo 12 lançam-se para a lua em missão de pouso preciso", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 264034, "titulo": "Como canetas emagrecedoras têm 'revolucionado' o tratamento de diabetes", "url": "https://www.bbc.com/portuguese/articles/c8g46qzzn3gvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-14T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tratamentos atuais para diabetes, quando iniciados precocemente, podem ser bem-sucedidos e se aproximarem do que os leigos chamam de 'cura'. No entanto, o texto não menciona canetas emagrecedoras como parte do tratamento.", "titulo_pt": "Como tratamentos precoces têm 'revolucionado' o tratamento de diabetes", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 263949, "titulo": "Casos graves de Covid-19 voltam a crescer no Brasil; veja quem pode se vacinar pelo SUS", "url": "https://exame.com/brasil/casos-graves-de-covid-19-voltam-a-crescer-no-brasil-veja-quem-pode-se-vacinar-pelo-sus/", "fonte_id": "exame", "data_pub": "2026-11-14T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Fiocruz indica um aumento nos casos graves de Covid-19 em seis estados brasileiros e no Distrito Federal. Especialistas enfatizam a importância da vacinação e das medidas preventivas.", "titulo_pt": "Casos graves de Covid-19 crescem no Brasil; especialistas reforçam a importância da vacinação e de medidas preventivas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264404, "titulo": "See new images from the Euclid space telescope, spanning one billion cosmic objects", "url": "https://www.scientificamerican.com/article/see-new-images-from-the-euclid-space-telescope-spanning-one-billion-cosmic-objects/", "fonte_id": "scientific_american", "data_pub": "2026-11-14T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Euclid, uma telescope espacial, lançou imagens de um bilhão de objetos cósmicos como parte de sua primeira grande liberação de dados.", "titulo_pt": "Veja novas imagens do telescópio espacial Euclid, que capturam um bilhão de objetos cósmicos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 264410, "titulo": "Archaeologists shed new light on wealth and status among Europe's early herders", "url": "https://phys.org/news/2026-11-archaeologists-wealth-status-europe-early.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os arqueólogos estão explorando a desigualdade social em sociedades pré-históricas de pastores europeus antigas. Como essas comunidades não deixaram registros escritos, taxas ou dados demográficos, os pesquisadores buscam outras formas de medir a riqueza e o status.", "titulo_pt": "Arqueólogos iluminam a desigualdade e o status entre as primeiras sociedades de pastores da Europa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264315, "titulo": "How does Iran view shift in US approach after JD Vance ordered away?", "url": "https://www.aljazeera.com/news/2026/11/14/how-does-iran-view-shift-in-us-approach-after-vance-ordered-away?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T13:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração dos Estados Unidos acredita que bloqueio marítimo, interrupção das fronteiras terrestres, restrições ao ar e sanções isolantes estão funcionando. Iranistas americanos estão avaliando como as mudanças nos Estados Unidos afetam as relações com Irã, após o recuo do senador JD Vance.", "titulo_pt": "Como o Irã vê a mudança na abordagem dos EUA após JD Vance ser ordenado a se retirar?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 263955, "titulo": "Por que as pessoas aprendem a gostar de café amargo? Resposta pode estar no cérebro", "url": "https://exame.com/ciencia/por-que-as-pessoas-aprendem-a-gostar-de-cafe-amargo-resposta-pode-estar-no-cerebro/", "fonte_id": "exame", "data_pub": "2026-11-14T13:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou uma via de dopamina que responde a sinais do intestino, contribuindo para a explicação de como as preferências alimentares são aprendidas. O café amargo pode ser um exemplo disso.", "titulo_pt": "Por que as pessoas aprendem a gostar de café amargo? Resposta pode estar no cérebro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264405, "titulo": "Is there a better way of diagnosing obesity than BMI?", "url": "https://www.scientificamerican.com/article/is-there-a-better-way-of-diagnosing-obesity-than-bmi/", "fonte_id": "scientific_american", "data_pub": "2026-11-14T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo importante sugere uma nova abordagem para identificar pessoas cujo excesso de gordura corporal está afetando sua saúde. O método proposto visa melhorar a detecção de riscos relacionados à obesidade além do Índice de Massa Corporal (IMC).", "titulo_pt": "Há uma maneira melhor de diagnosticar a obesidade do que o imc?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 264369, "titulo": "Philippines’ Carmelle storms to victory in Eurovision Asia debut in Bangkok", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3374455/philippines-carmelle-storms-victory-eurovision-asia-debut-bangkok", "fonte_id": "scmp", "data_pub": "2026-11-14T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cantora filipina Carmelle venceu a primeira edição asiática do Eurovision Song Contest com sua performance de dança-pop 'Sobra-Sobra', superando 10 outros concorrentes no final do concurso realizado em Bangkok, Tailândia. O dueto tailandês Mang x Daou ficou em segundo lugar com 'Aroma', e o Vietnamita Toc Tien terminou em terceiro.", "titulo_pt": "Carmelle filipina vence Eurovision Asia na estreia na tailândia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264457, "titulo": "Could ‘Rubber Soul’ Be the Best Beatles Album? (Yes)", "url": "https://www.rollingstone.com/music/music-features/rubber-soul-best-beatles-album-1235657869/", "fonte_id": "rolling_stone_music", "data_pub": "2026-11-14T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo Edição Especial lembra por que Rubber Soul, de 1965, é considerado o melhor álbum dos Beatles, sendo ao mesmo tempo o mais melancólico e inteligente do grupo.", "titulo_pt": "Rubber Soul: poderia ser o melhor álbum dos Beatles?", "veiculo": "Rolling Stone - Música", "pais": "EUA", "classe": "C"}, {"id": 264456, "titulo": "Simple Plan, Hoobastank, and The Used Turn Southwest Flight into In-Air Concert", "url": "https://consequence.net/2026/11/simple-plan-hoobastank-and-the-used-turn-southwest-flight-into-in-air-concert/", "fonte_id": "consequence_sound", "data_pub": "2026-11-14T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bandas Simple Plan, Hoobastank e The Used realizaram concertos a bordo de um voo da Southwest Airlines poucas horas antes da FAA emitir um paralisação nacional de voos. Os passageiros puderam apreciar as músicas 'The Reason', 'I’m Just a Kid' e 'The Taste of Ink' durante o voo.", "titulo_pt": "Simple Plan, Hoobastank e The Used transformam voo da Southwest em concerto aéreo", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 264085, "titulo": "La embajada de Francia en la Argentina distinguió a Alina Diaconú, Carmen Guarini y Luciana Blasco por sus aportes a la cultura", "url": "https://www.lanacion.com.ar/cultura/la-embajada-de-francia-en-la-argentina-distinguio-a-alina-diaconu-carmen-guarini-y-luciana-blasco-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T17:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A embaixada francesa na Argentina premiou Alina Diaconú, Carmen Guarini e Luciana Blasco por suas contribuições para a cultura. O embaixador francês Romain Nadal destacou suas trajetórias e o empenho que elas dedicam ao seu trabalho.", "titulo_pt": "Embaixada francesa distingue Alina Diaconú, Carmen Guarini e Luciana Blasco pela contribuição à cultura", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264087, "titulo": "El error que pocos conocen al empezar a hacer ejercicio, según el cuerpo y la edad", "url": "https://www.lanacion.com.ar/sociedad/el-error-que-pocos-conocen-al-empezar-a-hacer-ejercicio-segun-el-cuerpo-y-la-edad-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O kinesiólogo Emiliano Gallegos destacou na LN+ os cuidados iniciais importantes a serem tomados quando se retoma a atividade física. Esses cuidados incluem atenção especial ao corpo e à idade do indivíduo.", "titulo_pt": "O erro que poucos conhecem ao iniciar exercícios, segundo o corpo e a idade", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 263895, "titulo": "Rádio MEC exibe neste domingo programa inédito da série de Ruy Castro", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/radio-mec-exibe-neste-domingo-programa-inedito-da-serie-de-ruy-castro", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-14T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rádio MEC transmitirá neste domingo, às 22h, o terceiro episódio da série 'Grandes Compositores da Broadway', apresentada por Ruy Castro, focado no compositor Irving Berlin. O programa também é exibido pela Rádio Nacional nas segundas-feiras, às 22h.", "titulo_pt": "Rádio MEC exibe neste domingo programa inédito da série de Ruy Castro", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 264447, "titulo": "‘Club Kid’ Cinematographer Adam Newport-Berra on Capturing Intimate and Authentic New York Moments", "url": "https://variety.com/2026/artisans/news/club-kid-cinematography-new-york-adam-newport-berra-1236938607/", "fonte_id": "variety", "data_pub": "2026-11-14T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adam Newport-Berra, fotógrafo de câmera, trabalha com diretores que também atuam em seus filmes. Este ano, ele colaborou com Olivia Wilde em 'The Invite' e com Jordan Firstman em 'Club Kid', dirigido e estrelado por Firstman.", "titulo_pt": "Cinematografador Adam Newport-Berra sobre capturar momentos íntimos e autênticos de nova York", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 263871, "titulo": "Miriam Mehler estreia como uma transgressora divertida em nova peça sobre gerações", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/miriam-mehler-estreia-como-uma-transgressora-divertida-em-nova-peca-sobre-geracoes.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-14T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Miriam Mehler, de 91 anos, e Rafael Primot, de 44 anos, se tornaram amigos próximos ao compartilhar o camarim da peça 'A Herança', de Matthew Lopez, em São Paulo em 2023. A peça reuniu artistas de diferentes gerações em uma colaboração inusitada.", "titulo_pt": "Miriam Mehler estreia como uma transgressora divertida em nova peça sobre gerações", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 263896, "titulo": "Programa na Rádio MEC celebra Proclamação da República neste sábado", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/programa-na-radio-mec-celebra-proclamacao-da-republica-neste-sabado", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-14T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Música e Músicos do Brasil, da Rádio MEC, transmitido no sábado às 19h, celebra a Proclamação da República com obras de quatro compositores do final do século XIX. O repertório abrange diferentes caminhos da música de concerto brasileira durante um período de transformações políticas e culturais.", "titulo_pt": "Programa na Rádio MEC celebra Proclamação da República neste sábado", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 264423, "titulo": "James Blunt: ‘Do I have a nickname? Yes, it rhymes with blunt’", "url": "https://www.theguardian.com/music/2026/nov/15/james-blunt-10-chaotic-questions-interview", "fonte_id": "guardian_culture", "data_pub": "2026-11-14T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "James Blunt fala sobre seu amor por Ibiza, o comportamento mais estranho que fez em nome do romance e sobre ter sido inscrito sem seu consentimento para a série Celebrity Traitors. Ele menciona que, embora inicialmente surpreso com a reação negativa, seu humor constante é admirável.", "titulo_pt": "James Blunt: 'eu tenho um apelido? Sim, ele rimas com Blunt'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 263897, "titulo": "Em São Paulo, festival Melanina Acentuada tem atrações até domingo", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/festival-melanina-acentuada-tem-atracoes-ate-domingo-em-sao-paulo", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-14T13:11:00Z", "idioma": "pt", "provave  "classe": "A"}, {"id": 264424, "titulo": "Masterpieces haunted by brutal past could send records tumbling at Sotheby’s", "url": "https://www.theguardian.com/artanddesign/2026/nov/14/legendary-collection-sothebys-van-gogh-cezanne-blaquier-arrieta", "fonte_id": "guardian_culture", "data_pub": "2026-11-14T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doze raras obras-mestre, incluindo pinturas de Van Gogh, Cézanne e Monet, serão leiloadas em Sotheby’s em Nova York. A coleção, que inclui acusações de abdução e assassinato, consiste em obras magníficas que refletem um pequeno museu Courtauld.", "titulo_pt": "Obras-mestre assombradas pelo passado brutal podem quebrar recordes no Sotheby’s", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 264425, "titulo": "Mesh masks, Nana’s lampshade and the other Beck: what to watch for at Eurovision Asia", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/14/eurovision-asia-bangkok-thailand", "fonte_id": "guardian_culture", "data_pub": "2026-11-14T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro concurso de Eurovision Asia será realizado no sábado na Tailândia, com 11 países participantes. O evento será mais conciso em comparação com a versão europeia e não incluirá elementos tão excentricos como cantores de peru ou lobos comendo bananas.", "titulo_pt": "Eurovision Asia: o que assistir no primeiro concurso da ásia", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 264426, "titulo": "I felt nothing but numbness at my dad’s death – but then I read the book he gave me on my wedding day", "url": "https://www.theguardian.com/culture/2026/nov/14/my-cultural-awakening-under-milk-wood-dylan-thomas-helped-me-grieve", "fonte_id": "guardian_culture", "data_pub": "2026-11-14T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora não sentiu emoções fortes após a morte do pai, mas leu 'Abaixo
