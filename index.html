para urso em uma floresta de Nagano, no Japão, após um sensor ser acionado. A região está enfrentando um aumento nas agressões de ursos, levando a medos e à cativeira de milhares de animais.", "titulo_pt": "No monte do Japão, uma abordagem diferente para gerenciar ursos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136727, "titulo": "Consumo pré-colombiano do cacau chegou até a Geórgia, nos Estados Unidos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/consumo-pre-colombiano-do-cacau-chegou-ate-a-georgia-nos-estados-unidos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O consumo de cacau, originário da Amazônia e importante para as civilizações da América Central, foi encontrado em uma área próxima a Atlanta, Estados Unidos, antes da chegada dos europeus.", "titulo_pt": "Consumo pré-colombiano do cacau foi descoberto em área próxima a atlanta, EUA", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 137469, "titulo": "Food innovation in your kitchen: Giving peas, beans and lentils a surprisingly meat-like bite", "url": "https://phys.org/news/2026-08-food-kitchen-peas-beans-lentils.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inovação na produção de alimentos pode envolver a separação de ingredientes como proteínas, amido e gorduras, dos alimentos agrícolas, e a subsequente recombinação desses componentes para criar produtos específicos. Este processo pode levar ao desperdício de fibras dietéticas, vitaminas e minerais no produto final.", "titulo_pt": "Inovação culinária em sua cozinha: dando um sabor inesperadamente similar ao carne a ervilha, feijão e grão-de-bico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 137470, "titulo": "Declining star formation not caused by simple 'fuel crisis,' new measurements suggest", "url": "https://phys.org/news/2026-08-declining-star-formation-simple-fuel.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A formação de estrelas tem diminuído ao longo dos últimos 4,5 bilhões de anos, mas a quantidade de material necessário para a formação de estrelas não diminuiu significativamente. Isso sugere que a redução na formação de estrelas não é simplesmente devido a uma crise de 'combustível'.", "titulo_pt": "Declínio da formação estelar não causado por simples 'crise de combustível', indicam novas medições", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 137528, "titulo": "The best new science-fiction books of September 2026", "url": "https://www.newscientist.com/article/2585976-the-best-new-science-fiction-books-of-september-2026/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vários autores renomados, incluindo China Miéville, Brandon Sanderson e uma homenagem a Ursula K. Le Guin, lançaram novos romances de ficção científica neste mês de setembro de 2026. Além disso, foi publicada uma nova história do Doctor Who.", "titulo_pt": "Os melhores novos livros de ficção científica de setembro de 2026", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 137529, "titulo": "'Orbitals' is a co-op sci-fi adventure that recaptures the magic of Saturday morning cartoons", "url": "https://www.space.com/entertainment/space-games/orbitals-is-a-co-op-sci-fi-adventure-that-recaptures-the-magic-of-saturday-morning-cartoons", "fonte_id": "space_com", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Orbitals é um jogo de aventura em equipe no gênero sci-fi inspirado em 'It Takes Two', combinando elementos de desenhos animados de sábado de manhã com ação cooperativa.", "titulo_pt": "'Orbitals' é uma aventura em equipe de ficção científica que recaptura a magia dos desenhos animados de sábado de manhã", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 137471, "titulo": "Researchers catch sharks off NY's Hamptons, attach trackers to toothy predators", "url": "https://phys.org/news/2026-09-sharks-ny-hamptons-trackers-toothy.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador de tubarões chamado Greg Metzger captura uma jovem, mas poderosa, sand-tiger-shark perto das praias famosas dos Hamptons, Nova York, e equipa o animal com um rastreador.", "titulo_pt": "Pesquisador captura tubarões na costa dos Hamptons e equipa com rastreadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 137472, "titulo": "Eruption of Sinabung volcano on Indonesia's Sumatra island prompts higher alert", "url": "https://phys.org/news/2026-09-eruption-sinabung-volcano-indonesia-sumatra.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vulcão Sinabung, na ilha de Sumatra na Indonésia, erupcionou na segunda-feira, lançando uma coluna de cinzas e fumaça de 3.500 metros no ar.", "titulo_pt": "Eruption de Sinabung no Sumatra da indonésia eleva nível de alerta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 137465, "titulo": "STAT+: NIH proposal to cap research grants draws mixed reception, agency says", "url": "https://www.statnews.com/2026/09/01/nih-grant-cap-proposal-researcher-feedback/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O NIH propôs limitar o número de bolsas de pesquisa que pesquisadores podem receber, gerando uma reação mista.", "titulo_pt": "Proposta do NIH de cota para bolsas de pesquisa divide opiniões", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 137467, "titulo": "As MAHA champions nutrition, it’s ignoring the experts, dietitians say", "url": "https://www.statnews.com/2026/09/01/maha-nutrition-makeover-hampered-dietitian-workforce-crisis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A implementação de uma importante parte da Agenda Make America Healthy Again pode ser prejudicada devido a uma força de trabalho registrada de nutricionistas encolhida e sobrecarregada.", "titulo_pt": "As MAHA promovem a nutrição, mas ignora os especialistas, dizem dieteticas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 137371, "titulo": "Japan bear project aims to show coexistence, not culling, can prevent attacks", "url": "https://www.scmp.com/news/asia/east-asia/article/3365932/japan-bear-project-aims-show-coexistence-not-culling-can-prevent-attacks?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T05:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cientista Akiko Takii capturou um jovem urso asiático de aproximadamente 18 meses em uma armadilha noentes, onde os ataques crescentes de ursos têm causado medo e levado à cativeira de milhares de animais. O projeto visa mostrar que a coexistência, não a cativeira, pode prevenir os ataques.", "titulo_pt": "Projeto japonês visa mostrar que coexistência, não cativeiro, pode prevenir ataques de urso", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 137497, "titulo": "APOD: 2026 September 1 – A Plane Lunar Eclipse", "url": "https://science.nasa.gov/image-article/apod-2026-september-1-a-plane-lunar-eclipse/", "fonte_id": "nasa_news", "data_pub": "2026-09-01T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1 de setembro de 2026, ocorrerá uma eclipses lunares planejada. A imagem do dia do APOD ap t", "provavel_duplicata_de": null, "texto_pt": "O Brasil ocupa o primeiro lugar no ranking mundial de ansiedade e enfrenta uma epidemia silenciosa de vícios em jogos.", "titulo_pt": "Saúde mental é política de Estado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136932, "titulo": "Epilepsia no Brasil: inovação avançou, mas SUS não reorganizou o cuidado", "url": "https://www.jota.info/opiniao-e-analise/colunas/estado-da-saude/epilepsia-no-brasil-inovacao-avancou-mas-sus-nao-reorganizou-o-cuidado", "fonte_id": "jota", "data_pub": "2026-09-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inovação no tratamento da epilepsia no Brasil avançou, mas o Sistema Único de Saúde (SUS) não reorganizou adequadamente o cuidado. O Plano de Cargos, Carreiras e Salários (PCDT) de 2018, a rede de cuidados fragmentada e a incorporação lenta das terapias avançadas limitam o acesso aos tratamentos mais modernos.", "titulo_pt": "Epilepsia no Brasil: inovação avançou, mas SUS não reorganizou o cuidado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136872, "titulo": "Setembro Amarelo: busca por estética acende alerta para dismorfia corporal", "url": "https://www.cnnbrasil.com.br/saude/setembro-amarelo-busca-por-estetica-acende-alerta-para-dismorfia-corporal/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cirurgiã Carine Barreto salienta a necessidade de investigar expectativas irrealistas para preservar a saúde mental dos pacientes. O fenômeno da 'estética acuada' no mês de setembro levanta alertas sobre a dismorfia corporal.", "titulo_pt": "Setembro Amarelo: busca pela perfeição estética acende alerta para dismorfia corporal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137370, "titulo": "Excitement and anxiety as pupils return to school, aided by new well-being campaign", "url": "https://www.scmp.com/news/hong-kong/education/article/3365935/primary-pupils-return-school-mixed-emotions-well-being-campaign-rolls-out?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos das escolas primárias de Hong Kong retornaram às aulas nesta terça-feira com misto de excitação e ansiedade sobre o ano letivo. A secretária de Educação, Christine Choi Yuk-lin, anunciou a implementação de uma campanha para melhorar o bem-estar dos alunos, focada em prevenir bullying.", "titulo_pt": "Excitação e ansiedade dos alunos na volta às aulas, com campanha de bem-estar escolar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 137072, "titulo": "Jugaba en una plaza: niña de 5 años queda herida de gravedad tras balacera en Cerro Navia", "url": "https://www.latercera.com/nacional/noticia/nina-de-5-anos-herida-de-gravedad-producto-de-balacera-en-cerro-navia/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T00:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma menina de 5 anos ficou gravemente ferida após ser atingida por uma bala em um local de jogos em Cerro Navia. Ela foi levada a um hospital onde precisou passar por uma intervenção cirúrgica. A investigação foi encarregada à PDI e ao ECOH da Fiscalía.", "titulo_pt": "Jogava em uma praça: menina de 5 anos fica gravemente ferida em tiroteio em Cerro Navia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 135897, "titulo": "Health ministry expands health subsidy categories", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863485", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde expandiu as categorias de subsídio de saúde, incluindo novos serviços e tratamentos no programa.", "titulo_pt": "Ministério da saúde expande categorias de subsídio de saúde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 136208, "titulo": "Quem era o criminoso mais antigo do CV em atividade preso no Rio", "url": "https://veja.abril.com.br/brasil/quem-era-o-criminoso-mais-antigo-do-cv-em-atividade-preso-no-rio/", "fonte_id": "veja", "data_pub": "2026-08-31T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O criminoso conhecido como Sombra foi preso em atividade no Rio de Janeiro. Ele já tinha passagens pela cadeia desde 1998 e acumulava períodos como foragido.", "titulo_pt": "Quem era o criminoso mais antigo do CV em atividade preso no Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136301, "titulo": "Educação financeira para jovens: estratégias para falar sobre dinheiro", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/educacao-financeira-para-jovens-estrategias-para-falar-sobre-dinheiro-2/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ensinar educação financeira a jovens pode ajudar a formar adultos mais preparados para gerenciar suas finanças, considerando os níveis recordes de endividamento das famílias no Brasil.", "titulo_pt": "Educação financeira para jovens: estratégias para falar sobre dinheiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135268, "titulo": "Decisão do CNJ facilita inventários em cartórios para famílias sem liquidez financeira", "url": "https://veja.abril.com.br/brasil/decisao-do-cnj-facilita-inventarios-em-cartorios-para-familias-sem-liquidez-financeira/", "fonte_id": "veja", "data_pub": "2026-08-31T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do Conselho Nacional de Justiça facilita os processos de inventário em cartórios para famílias que não possuem liquidez financeira. O benefício visa auxiliar herdeiros que detêm imóveis, mas não dispõem de dinheiro em caixa. No entanto, a cobrança do imposto permanece intacta.", "titulo_pt": "Decisão do CNJ simplifica inventários para famílias sem recursos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135601, "titulo": "Gobierno presenta agenda nacional para fortalecer el sistema de protección de la niñez", "url": "https://www.latercera.com/nacional/noticia/gobierno-presenta-agenda-nacional-para-fortalecer-el-sistema-de-proteccion-de-la-ninez/", "fonte_id": "la_tercera", "data_pub": "2026-08-31T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em setembro, será apresentado um projeto para fortalecer a segurança em residências ameaçadas por redes de exploração infantil, incluindo controles de acesso, vigilância, patrulhamento e proteção de vítimas e denunciantes.", "titulo_pt": "Governo apresenta agenda nacional para fortalecer o sistema de proteção da infância", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 135274, "titulo": "Controle a pressão para manter distância do Alzheimer, conclui maior estudo já feito sobre o tema", "url": "https://veja.abril.com.br/saude/controle-a-pressao-para-manter-distancia-do-alzheimer-diz-maior-estudo-ja-feito-sobre-o-tema/", "fonte_id": "veja", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo, considerado o maior já realizado sobre o tema, concluiu que o tratamento da hipertensão pode reduzir em 15% o risco de desenvolver demência. A pesquisa foi apresentada no Congresso Europeu de Cardiologia.", "titulo_pt": "Controle a pressão para manter distância do Alzheimer, conclui maior estudo já feito sobre o tema", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135275, "titulo": "Planos de saúde chamam a polícia", "url": "https://veja.abril.com.br/economia/planos-de-saude-chamam-a-policia/", "fonte_id": "veja", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As principais operadoras de planos de saúde estão intensificando suas parcerias com as Polícias Civis com o objetivo de combater as fraudes que afetam o setor. Essa medida visa restringir as atividades fraudulentas que têm causado prejuízos significativos ao setor de planos de saúde.", "titulo_pt": "Planos de saúde intensificam parcerias com polícias civis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135414, "titulo": "A corrida contra o tempo para resgatar mais de 600 trabalhadores presos em túneis após avalanche no Nepal e no Tibete", "url": "https://www.bbc.com/portuguese/articles/cr503rrgg6mo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-31T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate estão realizando explosões controladas nos túneis para localizar e resgatar mais de 600 trabalhadores presos nas usinas hidrelétricas do Nepal e do Tibete. As autoridades nepalesas informaram sobre a operação.", "titulo_pt": "Corrida contra o tempo para resgatar mais de 600 trabalhadores presos em túneis após avalanche no Nepal e no Tibete", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 135283, "titulo": "Eleições 2026: o que é empate técnico nas pesquisas eleitorais", "url": "https://veja.abril.com.br/politica/eleicoes-2026-o-que-e-empate-tecnico-nas-pesquisas-eleitorais/", "fonte_id": "veja", "data_pub": "2026-08-31T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empate técnico nas pesquisas eleitorais ocorre quando as margens de erro dos candidatos se sobrepõem, dificultando a identificação de um líder. Entenda como a margem de erro influencia na interpretação desses levantamentos.", "titulo_pt": "Eleições 2026: o que é empate técnico nas pesquisas eleitorais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 136877, "titulo": "Clima: ciclone extratropical provoca ventos intensos no centro-sul do país", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-provoca-ventos-intensos-no-centro-sul-do-pais", "fonte_id": "metropoles", "data_pub": "2026-09-01T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone extratropical se formou na costa da Região Sul, causando ventos intensos no centro-sul do país. As temperaturas caem no Sul, enquanto no Norte e Nordeste chegam a 41ºC.", "titulo_pt": "Ciclone extratropical causa ventos fortes no centro-sul do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 136881, "titulo": "Lobo-guará é resgatado dentro de casa no DF e depois devolvido à natureza", "url": "https://www.metropoles.com/distrito-federal/lobo-guara-e-resgatado-dentro-de-casa-no-df-e-depois-devolvido-a-natureza", "fonte_id": "metropoles", "data_pub": "2026-09-01T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um lobo-guará foi resgatado dentro de uma casa no Distrito Federal e posteriormente solto na Estação Ecológica Jardim Botânico, local adequado para sua preservação e segurança.", "titulo_pt": "Lobo-guará é resgatado em casa no DF e devolvido à natureza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 137499, "titulo": "Guest post: Why tough methane cuts are crucial for keeping warming ‘well-below’ 2C", "url": "https://www.carbonbrief.org/guest-post-why-tough-methane-cuts-are-crucial-for-keeping-warming-well-below-2c", "fonte_id": "carbon_brief", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O metano é um gás de efeito estufa poderoso e o segundo maior contribuinte para o aquecimento global após o dióxido de carbono (CO2). Reduções rigorosas do metano são cruciais para manter o aquecimento 'bem abaixo' de 2°C.", "titulo_pt": "Post convidado: por que cortes rigorosos de metano são cruciais para manter o aquecimento 'bem abaixo' de 2°C", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 137051, "titulo": "Sydney records warmest winter on record as Melbourne equals previous hottest temperatures", "url": "https://www.theguardian.com/australia-news/2026/sep/01/sydney-records-warmest-winter-on-record-as-melbourne-equals-previous-hottest-temperatures", "fonte_id": "guardian_world", "data_pub": "2026-09-01T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nova Gales do Sul, Vitoria e Tasmânia registraram seus invernos mais quentes na história. O BoM prevê temperaturas acima da média para todo o país durante o outono, com maior probabilidade de máximas muito elevadas.", "titulo_pt": "Sídney registra inverno mais quente da história enquanto Melbourne iguala recordes de calor", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 136866, "titulo": "Nepal registra mais de mil mortes e 4 mil desaparecidos após enchentes", "url": "https://www.cnnbrasil.com.br/internacional/nepal-registra-mais-de-mil-mortes-e-4-mil-desaparecidos-apos-enchentes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de mil pessoas morreram e cerca de 4 mil desapareceram no Nepal devido às enchentes. Equipes de resgate escavaram escombros em áreas remotas do Himalaia para resgatar trabalhadores presos.", "titulo_pt": "Nepal registra mais de mil mortes e 4 mil desaparecidos após enchentes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137205, "titulo": "Death toll passes 1,000 from catastrophic flooding in Nepal and China, officials say", "url": "http://www.euronews.com/2026/09/01/death-toll-passes-1000-from-catastrophic-flooding-in-nepal-and-china-officials-say", "fonte_id": "euronews", "data_pub": "2026-09-01T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre ocorrido em 26 de agosto no Himalaia começou com a colapso de um gelo, que liberou grandes quantidades de rochas, gelo e água derretida para vales abaixo, desencadeando fortes inundações a jusante. O número de mortos superou a marca de 1.000 em Nepal e China, de acordo com autoridades.", "titulo_pt": "Óbitos ultrapassam 1.000 em inundações catastróficas no Nepal e na China", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 136901, "titulo": "Dados de 40 anos mostram como a seca na Amazônia já ameaça o agro, alerta especialista", "url": "https://exame.com/esg/a-amazonia-esta-perto-do-ponto-de-nao-retorno-para-especialista-crise-ja-e-sistemica/", "fonte_id": "exame", "data_pub": "2026-09-01T05:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada por uma cientista brasileira associada a Princeton indica que a seca na Amazônia já afeta o agronegócio, com 57% da renda do setor no Brasil dependendo das chuvas nas Terras Indígenas da região.", "titulo_pt": "Dados de 40 anos mostram como a seca na Amazônia já ameaça o agro, alerta especialista", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 137207, "titulo": "Two dead and one still unaccounted for in Grand Canyon flash floods, officials say", "url": "http://www.euronews.com/2026/09/01/two-dead-and-one-still-unaccounted-for-in-grand-canyon-flash-floods-officials-say", "fonte_id": "euronews", "data_pub": "2026-09-01T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois pessoas morreram e uma ainda está desaparecida devido às cheias repentinas no Grand Canyon, conforme informaram as autoridades. As operações de resgate foram prejudicadas por mais chuvas intensas que atingiram a região na segunda-feira, parte normal da monção estacional que frequentemente causa cheias repentinas.", "titulo_pt": "Dois mortos e um desaparecido em cheias repentinas no Grand Canyon, dizem autoridades", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 137194, "titulo": "As unprecedented wildfires rage in Algeria, authorities remain largely silent", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/09/01/as-unprecedented-wildfires-rage-in-algeria-authorities-remain-largely-silent_6757032_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T23:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais de intensidade incomum devastaram as regiões de Jijel e Béjaïa, resultando em mais de 200 mortes. As autoridades atribuem a criminalidade a alguns dos incêndios e pedem respostas judiciais mais severas, enquanto muitos questionam a falta de preparação governamental.", "titulo_pt": "Incêndios florestais sem precedentes atingem aléria, autoridades se mantêm em silêncio", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 137500, "titulo": "Explainer: The CMIP7 emissions scenarios – and how they explore future climate change", "url": "https://www.carbonbrief.org/explainer-the-cmip7-emissions-scenarios-and-how-they-explore-future-climate-change", "fonte_id": "carbon_brief", "data_pub": "2026-08-31T23:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cada seis a sete anos, grupos de modelagem climática ao redor do mundo realizam uma série coordenada de simulações que exploram como…", "titulo_pt": "Explicação: os cenários de emissões CMIP7 – e como eles exploram o clima futuro", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 136281, "titulo": "PLOA prevê R$ 29,7 bilhões para crédito climático em 2027", "url": "https://www.cnnbrasil.com.br/agro/ploa-preve-r-297-bilhoes-para-credito-climatico-em-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Plano Longo Prazo de Ação (PLOA) prevê um investimento de R$ 29,7 bilhões no crédito climático em 2027, com recursos do Fundo Clima destinados à recuperação de pastagens, plantio direto, bioinsumos e sistemas integrados de produção.", "titulo_pt": "PLOA prevê R$ 29,7 bilhões para crédito climático em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134890, "titulo": "Flash flood hits Grand Canyon’s Phantom Ranch, more than 20 people missing", "url": "http://www.euronews.com/video/2026/08/31/flash-flood-hits-grand-canyons-phantom-ranch-more-than-20-people-missing", "fonte_id": "euronews", "data_pub": "2026-08-31T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma cheia repentina atingiu a Fenda do Grande Cañão perto da Ranch de Fantasma, lançando detritos no Rio Colorado, destruindo pontes de madeira e deixando mais de 20 pessoas desaparecidas ou não localizadas.", "titulo_pt": "Cheia repentina atinge fenda do grande cañão, mais de 20 pessoas desaparecidas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134622, "titulo": "China alerta que lago formado após deslizamento pode subir com chuva", "url": "https://www.cnnbrasil.com.br/internacional/china-alerta-que-lago-formado-apos-deslizamento-pode-subir-com-chuva/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T08:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China alertou que o nível do lago formado após o deslizamento pode aumentar com a chuva. A temperatura pode cair para até 8°C, com uma grande diferença entre o dia e a noite, e o clima pode ficar úmido e frio.", "titulo_pt": "China avisa que nível do lago pode subir com chuva após deslizamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [{"titulo": "Nepal eleva número de mortos por inundações na fronteira com China, que registra 16 mortos e 550 desaparecidos", "sumario": "Nepal registra mais de mil mortos e cerca de 3.900 desaparecidos devido às inundações na fronteira com China, enquanto no território chinês foram registrados pelo menos 16 mortos e 550 desaparecidos. Mais de 4.000 pessoas permanecem desaparecidas após inundações letais que atingiram Nepal e Tibet, deixando famílias em desespero. No desastre de um deslizamento de lama na fronteira entre a China e o Nepal, 16 pessoas morreram e 546 desapareceram na região do posto fronteiriço de Gyirong, no Tibete, em 26 de agosto.", "artigos": [{"id": 137069, "titulo": "Nepal eleva a cerca de mil los muertos por las inundaciones en la frontera con China, que deja unos 3.900 desaparecidos", "url": "https://www.latercera.com/mundo/noticia/nepal-eleva-a-cerca-de-mil-los-muertos-por-las-inundaciones-en-la-frontera-con-china-que-deja-unos-3900-desaparecidos/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T09:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Nepal registra mais de mil mortos e cerca de 3.900 desaparecidos devido às inundações na fronteira com China, enquanto no território chinês foram registrados pelo menos 16 mortos e 550 desaparecidos.", "titulo_pt": "Nepal eleva número de mortos por inundações na fronteira com China, que registra 16 mortos e 550 desaparecidos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 135783, "titulo": "Photos: Nearly 1,000 dead, thousands missing in Nepal–China border floods", "url": "https://www.aljazeera.com/gallery/2026/8/31/photos-nearly-1000-dead-thousands-missing-in-nepal-china-border?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 4.000 pessoas permanecem desaparecidas após inundações letais que atingiram Nepal e Tibet, deixando famílias em desespero.", "titulo_pt": "Imagens: quase 1.000 mortos, milhares desaparecidos nas inundações da fronteira entre Nepal e China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 135298, "titulo": "China registra 16 mortos e 546 desaparecidos no desastre da fronteira com o Nepal", "url": "https://www.brasildefato.com.br/2026/08/31/china-registra-16-mortos-e-546-desaparecidos-no-desastre-da-fronteira-com-o-nepal/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-31T13:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No desastre de um deslizamento de lama na fronteira entre a China e o Nepal, 16 pessoas morreram e 546 desapareceram na região do posto fronteiriço de Gyirong, no Tibete, em 26 de agosto. As informações foram divulgadas pelo governo regional chinês.", "titulo_pt": "China registra 16 mortos e 546 desaparecidos no desastre da fronteira com o Nepal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}]}], "direitos_humanos": [{"id": 137133, "titulo": "NAACP's call for Black athletes' boycott of southern schools hits an NIL wall", "url": "https://www.axios.com/2026/09/01/naacp-black-athletes-boycott-nil", "fonte_id": "axios", "data_pub": "2026-09-01T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Civil rights grupos estão pedindo que atletas negros boicoteem escolas nos Estados do sul que estão revogando direitos de voto. No entanto, atletas altamente remunerados da era do NIL estão se mostrando relutantes em se envolver em protestos. Isso ilustra uma discrepância entre os ativistas que usam métodos de protesto de 1960 e os atletas proeminentes de hoje, que operam em um mercado de NIL de $3 bilhões e têm uma visão diferente de como se envolverem em ativismo, não querendo sacrificar oportunidades financeiras inéditas.", "titulo_pt": "Chamado da naacp para boicote de atletas negros a escolas do sul encontra obstáculos no NIL", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 137307, "titulo": "Women Survivors of Bosnia’s War Watch Tributes to Mladic with Despair", "url": "https://balkaninsight.com/2026/09/01/women-survivors-of-bosnias-war-watch-tributes-to-mladic-with-despair/btj/", "fonte_id": "balkan_insight", "data_pub": "2026-09-01T05:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas mulheres que sobreviveram aos crimes cometidos pelas forças de Ratko Mladic durante a guerra de 1992-95 relatam como o falecimento de Mladic trouxe novo sofrimento, pois jovens sérvios em Bosnia glorificavam sua herança.", "titulo_pt": "Mulheres sobreviventes da guerra de Bosnia assistem a homenagens a Mladic com desespero", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 137185, "titulo": "'The hardest report I've ever done': Photographing young girls sold by their parents in Afghanistan", "url": "https://www.lemonde.fr/en/culture/article/2026/09/01/the-hardest-report-i-ve-ever-done-photographing-young-girls-sold-by-their-parents-in-afghanistan_6757038_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-01T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fotógrafa jornalista Elise Blanchard exibe suas fotografias na festa Visa pour l'Image em Perpignan, sul da França, retratando garotas jovens vendidas por seus pais no Afeganistão, sob o governo do Talibã.", "titulo_pt": "O relatório mais difícil que já fiz: fotografando garotas jovens vendidas pelos pais no afeganistão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 136976, "titulo": "Presidente Kast asegura que conoce a Cerimedo pero que nunca lo contrató; exministra Steinert desiste de solicitud de reconsideración ante Contraloría, y gobierno presenta agenda de fortalecimiento de protección a la niñez", "url": "https://www.ciperchile.cl/2026/08/31/radar-31-08-2026/?utm_source=rss&utm_medium=rss&utm_campaign=radar-31-08-2026", "fonte_id": "ciper_chile", "data_pub": "2026-09-01T00:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Kast afirma conhecer Cerimedo, mas nunca o contratou. A ex-ministra Steinert desistiu de solicitar uma reconsideração à Contraloria. O governo apresentou uma agenda para fortalecer a proteção à infância.", "titulo_pt": "Kast afirma conhecer Cerimedo, mas nunca o contratou; Steinert desiste de solicitar reconsideração à Contraloría e governo apresenta agenda para proteção à infância", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 136201, "titulo": "Irã condena mulheres à morte por participação em manifestações contra governo", "url": "https://veja.abril.com.br/mundo/ira-condena-mulheres-a-morte-por-participacao-em-manifestacoes-contra-governo/", "fonte_id": "veja", "data_pub": "2026-08-31T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã está executando mulheres por sua participação em manifestações contra o governo. Protestos contra o governo ganharam força a partir do final de dezembro, motivados pelo colapso econômico e pela desvalorização da moeda local.", "titulo_pt": "Irã executa mulheres por participação em protestos contra governo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136405, "titulo": "Associação de cannabis medicinal contesta no STF uso de drogômetro em blitze", "url": "https://www.jota.info/saude/associacao-de-cannabis-medicinal-contesta-no-stf-uso-de-drogometro-em-blitze", "fonte_id": "jota", "data_pub": "2026-08-31T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A associação de cannabis medicinal contesta no Supremo Tribunal Federal (STF) a utilização de drogômetros em blitzes, alegando que o equipamento pode penalizar pacientes que utilizam medicamentos cannabisícolas mesmo sem comprovar alteração da capacidade psicomotora.", "titulo_pt": "Associação de cannabis medicinal contesta uso de drogômetro em blitzes no STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 135257, "titulo": "Israel fecha acordo de US$ 3,5 bi para defesa aérea da Grécia", "url": "https://www.poder360.com.br/poder-internacional/israel-fecha-acordo-de-us-35-bi-para-defesa-aerea-da-grecia/", "fonte_id": "poder360", "data_pub": "2026-08-31T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel e a Grécia fecharam um acordo no valor de 3,5 bilhões de dólares para a defesa aérea do país europeu. O sistema de defesa cobrirá mísseis, aeronaves e drones e faz parte do programa de modernização militar grego.", "titulo_pt": "Israel fecha acordo de 3,5 bi para defesa aérea da Grécia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 135500, "titulo": "Corte de Talca sanciona a conservador Najle por emitir certificados que permitieron vender inmuebles embargados", "url": "https://www.ciperchile.cl/2026/08/31/corte-de-talca-sanciona-a-conservador-najle-por-emitir-certificados-que-permitieron-vender-inmuebles-embargados/?utm_source=rss&utm_medium=rss&utm_campaign=corte-de-talca-sanciona-a-conservador-najle-por-emitir-certificados-que-permitieron-vender-inmuebles-embargados", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte de Talca sancionou o conservador Najle por emitir certificados que permitiram a venda de imóveis embargados. O caso foi publicado inicialmente pelo CIPER Chile.", "titulo_pt": "Corte de Talca sanciona conservador Najle por emitir certificados que permitiram vender imóveis embargados", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 135501, "titulo": "Imágenes históricas inéditas: las fotos del ataque a La Moneda tomadas por la cámara de uno de los aviones Hawker Hunter", "url": "https://www.ciperchile.cl/2026/08/31/imagenes-historicas-ineditas-las-fotos-del-ataque-a-la-moneda-tomadas-por-la-camara-de-uno-de-los-aviones-hawker-hunter/?utm_source=rss&utm_medium=rss&utm_campaign=imagenes-historicas-ineditas-las-fotos-del-ataque-a-la-moneda-tomadas-por-la-camara-de-uno-de-los-aviones-hawker-hunter", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T15:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram publicadas imagens históricas inéditas do ataque a La Moneda, capturadas pela câmera de um dos aviões Hawker Hunter.", "titulo_pt": "Imagens históricas inéditas: as fotos do ataque a La Moneda tomadas por uma câmera de um avião Hawker Hunter", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 135871, "titulo": "Freed Hongkonger sent back to jail as storm delays deportation from Philippines", "url": "https://www.scmp.com/news/hong-kong/article/3365869/freed-hongkonger-sent-back-jail-storm-delays-deportation-philippines?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T12:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de Hong Kong foi levado de volta para uma prisão filipina, conforme criticado por sua equipe legal como 'detenção ilegal', após o atraso na deportação devido a uma tempestade que interrompeu seu processo após sua libertação. As autoridades prisionais conduziram Tang Lung-wai ao Bureau of Immigration na sexta-feira, mas devido à suspensão das atividades governamentais devido a um tufão passando, ele foi devolvido à prisão máxima New Bilibid.", "titulo_pt": "Homem de hong kong liberado e depois enviado de volta à prisão na filipinas, devido a tempestade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 135882, "titulo": "Countries must consider reparations for slave trade, UN committee says", "url": "https://www.scmp.com/news/world/article/3365856/countries-must-consider-reparations-slave-trade-un-committee-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T10:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um comitê da ONU afirmou que os países estão legalmente obrigados a considerar indenizações pelo comércio transatlântico de escravos e a adotar outras medidas para abordar a persistente discriminação racial. Essa obrigação surge do Convenio de 1965 sobre discriminação racial, não do que existia na época do comércio de escravos.", "titulo_pt": "Comitê da ONU diz que países devem considerar indenizações pelo tráfico de escravos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134891, "titulo": "UN racial discrimination committee presents legal case for broad slavery reparations", "url": "http://www.euronews.com/2026/08/31/un-racial-discrimination-committee-presents-legal-case-for-broad-slavery-reparations", "fonte_id": "euronews", "data_pub": "2026-08-31T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documento aprovado recentemente, mas publicado recentemente, está previsto para fornecer um novo instrumento legal que apoia as reivindicações de indenizações relacionadas à discriminação racial. Este documento, que foi aprovado pela Comissão da ONU contra a Discriminação Racial, visa fortalecer os argumentos para reparações abrangentes por escravidão.", "titulo_pt": "Comissão da ONU contra a discriminação racial apresenta caso legal para reparações amplos por escravidão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 135502, "titulo": "Ley Lafkenche y el teatro del absurdo: cuatro ECMPO rechazados en Los Lagos", "url": "https://www.ciperchile.cl/2026/08/31/ley-lafkenche-y-el-teatro-del-absurdo-cuatro-ecmpo-rechazados-en-los-lagos/?utm_source=rss&utm_medium=rss&utm_campaign=ley-lafkenche-y-el-teatro-del-absurdo-cuatro-ecmpo-rechazados-en-los-lagos", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T08:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título refere-se à rejeição de quatro ECMPO (Entidades de Comunicação, Mídia e Publicidade) em Los Lagos, Chile, em relação ao projeto Ley Lafkenche e o teatro do absurdo.", "titulo_pt": "Ley Lafkenche e o teatro do absurdo: quatro ECMPO rejeitados em Los Lagos", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 134754, "titulo": "Australians missing in Nepal targeted by ‘heartbreaking’ and ‘abhorrent’ racist slurs", "url": "https://www.theguardian.com/australia-news/2026/aug/31/australians-missing-in-nepal-targeted-by-heartbreaking-and-abhorrent-racist-slurs", "fonte_id": "guardian_world", "data_pub": "2026-08-31T06:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australianos desaparecidos na Nepal-Tibet são alvo de comentários racistas nas redes sociais, levando a pedidos de maior responsabilidade function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

  flags[_fUrl] = {

  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
