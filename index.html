ebater-onda-de-ataques-de-bolsonaristas", "fonte_id": "metropoles", "data_pub": "2026-10-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio se tornou alvo de ataques de bolsonaristas após criticar a carta aberta de Flávio que contesta o resultado das eleições.", "titulo_pt": "Aliados de Tarcísio unem-se para rebater onda de ataques de bolsonaristas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236800, "titulo": "Voto distrital misto divide Centrão e oposição e ganha força no Congresso", "url": "https://www.metropoles.com/brasil/voto-distrital-misto-divide-centrao-e-oposicao-e-ganha-forca-no-congresso", "fonte_id": "metropoles", "data_pub": "2026-10-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hugo Motta está trabalhando para votar a PEC (Proposta de Emenda à Constituição) ainda em 2026. Enquanto partidos de centro apoiam a mudança, o PL se posiciona contra o novo modelo de voto distrital misto.", "titulo_pt": "Voto distrital misto divide Centrão e oposição e ganha força no Congresso", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236825, "titulo": "Lula avalia convidar opositores de Milei para posse", "url": "https://www.cnnbrasil.com.br/politica/lula-avalia-convidar-opositores-de-milei-para-posse/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T07:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva estaria considerando convidar adversários políticos, como o economista Rossieli Sobral, para participar da cerimônia de posse. Peronista Axel Kicillof é apontado como o favorito para disputar a presidência pelo Partido Peronista Argentino no Brasil.", "titulo_pt": "Lula considera convidar opositores para posse", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236674, "titulo": "Veja regras para trabalho no feriado de Finados nesta segunda (2)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/veja-regras-para-trabalho-no-feriado-de-finados-nesta-segunda-2.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O feriado nacional de Finados, nesta segunda-feira (2), obriga alguns trabalhadores a trabalharem, enquanto outros terão folga. Os profissionais que trabalharem terão direito a uma folga compensatória em outro dia ou ao pagamento em dobro.", "titulo_pt": "Veja regras para trabalho no feriado de Finados nesta segunda (2)", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236705, "titulo": "Rota de fuga de Flávio abriga foragido do 8/1 e foi usada por bolsonaristas que deixaram país", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/rota-de-fuga-de-flavio-abriga-foragido-do-81-e-foi-usada-por-bolsonaristas-que-deixaram-pais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Se Flávio Bolsonaro realmente entrou na Argentina por Foz do Iguaçu, antes de ir para Miami, ele passou por uma área com forte presença bolsonarista e histórico de apoio a integrantes do grupo, mesmo após ações golpistas que os tornaram alvo de ordens de prisão.", "titulo_pt": "Rota de fuga de Flávio passa por área bolsonarista e abriga foragido do 8/1", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 236804, "titulo": "Moraes manda PF prender eletricista condenado pelos atos de 8 de Janeiro", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-manda-pf-prender-eletricista-condenado-pelos-atos-de-8-de-janeiro", "fonte_id": "metropoles", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eletricista condenado pelos atos ocorridos no dia 8 de janeiro foi mandado prender pela juíza Moraes. O homem, de 50 anos, está sob monitória por tornozeleira e terá que cumprir pena de 14 anos em regime fechado.", "titulo_pt": "Moraes ordena prisão de eletricista condenado pelos atos de 8 de Janeiro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236805, "titulo": "O que explica mudança de tom no PL sobre fraude e isolamento de Flávio", "url": "https://www.metropoles.com/brasil/o-que-explica-mudanca-de-tom-no-pl-sobre-fraude-e-isolamento-de-flavio", "fonte_id": "metropoles", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido PL mudou seu tom em relação a Flávio Bolsonaro, após criticar uma carta dele sobre a fuga para os EUA e reconhecer o resultado das eleições. Em 2022, o PL foi multado.", "titulo_pt": "O que explica a mudança de tom do PL em relação a Flávio bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236806, "titulo": "Trump adota tom distinto com Flávio em relação a líderes da direita", "url": "https://www.metropoles.com/mundo/trump-tom-distinto-flavio-lideres-direita", "fonte_id": "metropoles", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump não expressou apoio a Flávio Bolsonaro, mas endossou as candidaturas de líderes da direita latino-americana, como Javier Milei e Bukele.", "titulo_pt": "Trump adota tom distinto com Flávio em relação a líderes da direita", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236833, "titulo": "Avanço da oposição leva centrão a se aliar a Lula, diz cientista política", "url": "https://www.cnnbrasil.com.br/politica/ww-especial-brasil-apos-eleicoes-lara-mesquita/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cientista política Lara Mesquita afirmou que o avanço da oposição e a perda de cadeiras para o PL podem levar o centrão a se aliar ao governo de Lula no Congresso.", "titulo_pt": "Avanço da oposição faz cientista política dizer que centrão pode se aliar a Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236686, "titulo": "Fundos de investimento perdem R$ 157,5 bilhões após reeleição de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/fundos-de-investimento-perdem-r-1575-bilhoes-apos-reeleicao-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria de fundos de investimentos brasileira registrou uma perda de R$ 157,5 bilhões em patrimônio, equivalente a 1,44% da rentabilidade, após a reeleição de Luiz Inácio Lula da Silva. Os fundos de ações sofreram perdas de dois dígitos.", "titulo_pt": "Investimentos perdem R$ 157,5 bilhões após reeleição de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236707, "titulo": "Elos de Milei em fuga de Flávio Bolsonaro incluem suspeitas sobre jato e assessor; entenda o que se sabe", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/elos-de-milei-em-fuga-de-flavio-bolsonaro-incluem-suspeitas-sobre-jato-e-assessor-entenda-o-que-se-sabe.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-31T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro dias após os rumores sobre Flávio Bolsonaro viajar para os Estados Unidos, o grau de envolvimento do governo de Javier Milei na suposta operação ainda não está claro. Flávio Bolsonaro só embarcou no avião na madrugada de quarta-feira (28).", "titulo_pt": "Elos de Milei em fuga de Flávio Bolsonaro incluem suspeitas sobre jato e assessor; entenda o que se sabe", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 237157, "titulo": "Manovra: 48 milioni in più per il Gcap, il caccia con Londra e Tokyo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/31/manovra-48-milioni-in-piu-per-il-gcap-il-caccia-con-londra-e-tokyo_a897b0de-b689-4987-a06e-c6ebe71b5579.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-31T09:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O orçamento para o Gcap aumentou em 48 milhões de euros. O número de funcionários do Gcap aumentou de 180 para 300.", "titulo_pt": "Manobra: 48 milhões a mais para o Gcap, caza com londres e tóquio", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 237084, "titulo": "Massive Gen Z protests set to sweep cities across Germany", "url": "https://www.dw.com/en/massive-gen-z-protests-set-to-sweep-cities-across-germany/live-79814694?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-31T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em cerca de 34 cidades na Alemanha, jovens estão realizando manifestações pedindo maior participação política e um futuro mais promissor. Essas manifestações se juntam a uma onda de protestos de jovens em toda a Europa.", "titulo_pt": "Grandes manifestações de Gen Z estão prestes a tomar as cidades da Alemanha", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 237158, "titulo": "Eurocontrol, 'prezzo medio del carburante per aerei a 4,84 dollari al gallone, +114%'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/31/eurocontrol-prezzo-medio-del-carburante-per-aerei-a-484-dollari-al-gallone_adf2c1e5-6db8-429d-95c7-a2878f69cfa8.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-31T09:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O preço médio do combustível para aviões atingiu 4,84 dólares por galão em outubro, um aumento de 114% em comparação com o início da crise médio-oriental.", "titulo_pt": "Preço médio do combustível para aviões atinge 4,84 dólares por galão, +114%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 237091, "titulo": "'Atmosphere of fear': Trump moves to curtail voting rights ahead of the midterms", "url": "https://www.france24.com/en/americas/20261031-united-states-atmosphere-of-fear-trump-moves-to-curtail-voting-rights-ahead-of-the-midterms", "fonte_id": "france24", "data_pub": "2026-10-31T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os americanos votam em 3 de novembro nas eleições médias que poderiam resultar em perda de controle do Congresso pelos republicanos, ameaçando o programa legislativo do presidente Donald Trump. Embora as eleições sejam organizadas pelos estados nos EUA, Trump tenta ainda influenciar o processo.", "titulo_pt": "Atmosfera de medo: trump tenta limitar direitos de voto antes das eleições médias", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 237159, "titulo": "In ping pong dei voli, Milano-Catania? Conviene con scalo a Valencia e Tirana", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/31/in-ping-pong-dei-voli-milano-catania-conviene-con-scalo-a-valencia_e0ee44a9-a1f7-43ed-b6ce-e9106406659a.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-31T09:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Há ofertas de voos de ping-pong entre Milão e Catânia, com escalas em Valencia e Tirana, que podem economizar até 60% no custo do voo. O serviço RimborsoAlVolo está oferecendo essas opções.", "titulo_pt": "Voos de ping-pong entre milão e catânia com escalas em Valencia e Tirana", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 237160, "titulo": "E' già caro-voli di Natale, 430 euro per volare da Milano a Reggio Calabria", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/31/e-gia-caro-voli-di-natale-430-euro-per-volare-da-milano-a-reggio_6a26c096-506a-4352-a078-d8847d70739d.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-31T09:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os preços dos voos entre cidades italianas estão altos, com passagens de Milão a Reggio Calabria custando 430 euros. Os aumentos nas tarifas continuam nos voos internos.", "titulo_pt": "Já são caros-vôos de natal, 430 euros para voar de milão a Reggio Calabria", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 237128, "titulo": "Rival US and Russian resolutions on Western Sahara fail at UN", "url": "https://www.aljazeera.com/news/2026/10/31/rival-us-and-russian-resolutions-on-western-sahara-fail-at-un?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-31T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Assembleia de Segurança das Nações Unidas rejeitou as propostas conflitantes dos Estados Unidos e da Rússia sobre o Saara Ocidental, deixando a missão de manutenção da paz sem uma extensão aprovada.", "titulo_pt": "Propostas americanas e russas sobre o saara ocidental são rejeitadas pela ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 237161, "titulo": "Mimit, i prezzi dri carburanti sono in lieve calo, benzina self a 2,011 euro", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/31/mimit-i-prezzi-dri-carburanti-sono-in-lieve-calo-benzina-self-a-2011_4cd5259f-549c-4aea-b17f-7012e6c9a526.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-31T09:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os preços dos combustíveis tiveram um leve deságio. A gasolina self custa atualmente 2,011 euros por litro, enquanto o gasóleo custa 2,242 euros por litro. Na rede autoestrada, o gasóleo está valendo 2,288 euros por litro.", "titulo_pt": "Mimi, os preços dos carburantes caem levemente, gasolina self a 2,011 euros", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 237093, "titulo": "Protesters gather at Poland's Top court", "url": "https://www.france24.com/en/protesters-gather-at-poland-s-top-court", "fonte_id": "france24", "data_pub": "2026-10-31T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polícia polonesa aumentou o patrulhamento em torno do Tribunal Constitucional após dezenas de protestos contra a suspensão do presidente pelo governo, que os manifestantes consideram ilegal. Várias pessoas foram detidas quando alguns manifestantes violaram o perímetro do prédio do tribunal.", "titulo_pt": "Protestantes se reúnem perto do tribunal constitucional da polônia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 236959, "titulo": "Freedom Fuel, la red de gasolineras MAGA promocionadas por Trump, acumula denuncias y sospechas de fraude", "url": "https://elpais.com/us/2026-10-31/freedom-fuel-la-red-de-gasolineras-maga-promocionadas-por-trump-acumula-denuncias-y-sospechas-de-fraude.html", "fonte_id": "elpais_america", "data_pub": "2026-10-31T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A rede de estações de combustível Freedom Fuel, promovida pelo presidente Trump, enfrenta denúncias e suspeitas de fraude. Embora os preços sejam mais baixos, a maioria dos clientes não conhece a ligação da empresa com o presidente e acorre devido à baixa qualidade do serviço oferecido.", "titulo_pt": "Liberdade de combustível, rede de estações de gasolina promovida por Trump, acumula denúncias e suspeitas de fraude", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236960, "titulo": "Las 300 mujeres de la tercera edad que rompen el molde de los cubanoamericanos en Miami: “Ni todos somos republicanos, ni todos trumpistas”", "url": "https://elpais.com/us/2026-10-31/las-300-mujeres-de-la-tercera-edad-que-rompen-el-molde-de-los-cubanoamericanos-en-miami-ni-todos-somos-republicanos-ni-todos-trumpistas.html", "fonte_id": "elpais_america", "data_pub": "2026-10-31T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um grupo de 300 mulheres cubano-americanas na terceira idade em Miami luta para preservar a democracia americana para suas gerações futuras, evitando que ela sofra o mesmo destino que ocorreu em Cuba.", "titulo_pt": "As 300 mulheres de idade que quebram o molde dos cubano-americanos em Miami: 'não todos somos republicanos, nem todos trumpistas'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236961, "titulo": "Andrea R. Flores: “Los demócratas llevan una década de retraso en su respuesta a Trump”", "url": "https://elpais.com/us/migracion/2026-10-31/andrea-r-flores-los-democratas-llevan-una-decada-de-retraso-en-su-respuesta-a-trump.html", "fonte_id": "elpais_america", "data_pub": "2026-10-31T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Andrea R. Flores, advogada e especialista em imigração, afirma que a legalização de milhares de imigrantes indocumentados deve ser a prioridade dos democratas, em vez de reformar o ICE.", "titulo_pt": "Andrea R. Flores: 'os democratas têm uma década de atraso na resposta a Trump'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236962, "titulo": "Venezuela, 10 meses después, parece que empezó la transición", "url": "https://elpais.com/america/2026-10-31/venezuela-10-meses-despues-parece-que-empezo-la-transicion.html", "fonte_id": "elpais_america", "data_pub": "2026-10-31T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ditadura mostra um pragmatismo sem nostalgia revolucionária, enquanto os interesses em jogo buscam manter um controle fino. Depois de 10 meses, a transição parece estar em andamento.", "titulo_pt": "Venezuela, 10 meses depois, parece que começou a transição", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236964, "titulo": "Buenos Aires incorpora las demandas de las ‘familias multiespecie’ y crea un cementerio para mascotas", "url": "https://elpais.com/argentina/2026-10-31/buenos-aires-incorpora-las-demandas-de-las-familias-multiespecie-y-crea-un-cementerio-para-mascotas.html", "fonte_id": "elpais_america", "data_pub": "2026-10-31T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A cidade de Buenos Aires implementou medidas para atender às demandas das 'familias multiespecie' e criou um cemitério para animais de estimação. A iniciativa visa dar maior proteção e acompanhamento aos pets, em uma cidade onde há mais cães do que crianças.", "titulo_pt": "Buenos Aires incorpora as demandas das 'famílias multiespecie' e cria um cemitério para animais de estimação", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 237129, "titulo": "Lebanon charges 13 over confiscated Hezbollah explosives", "url": "https://www.aljazeera.com/news/2026/10/31/lebanon-charges-13-over-hezbollah-confiscated-explosives?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-31T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo acusa as acusações de serem injustas, afirmando que as armas foram destinadas para serem usadas contra forças israelenses no sul do Líbano.", "titulo_pt": "Líbano acusa 13 pessoas por explosivos apreendidos do Hezbollah", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 237215, "titulo": "Russia-occupied Oleshky evacuees arrive in Belarus, Ukraine next", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3372828/russia-occupied-oleshky-evacuees-arrive-belarus-ukraine-next", "fonte_id": "scmp", "data_pub": "2026-10-31T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes evacuados da cidade ucraniana de Oleshky, ocupada pela Rússia, chegaram ao aeroporto de Gomel na Bielorrússia. Os evacuados viajarão de ônibus pela península de Crimea até a cidade russa de Anapa, onde depois embarcarão em voos para a Bielorrússia, e prosseguirão para a Ucrânia por uma fronteira.", "titulo_pt": "Residentes evacuados de Oleshky, na Ucrânia ocupada pela Rússia, chegam à bielorrússia e à Ucrânia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 236811, "titulo": "BoJ tenta estimular economia do Japão há muito tempo, diz economista", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/boj-tenta-estimular-economia-do-japao-ha-muito-tempo-diz-economista/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Autoridade Monetária do Japão manteve a taxa básica de juros em 1,5% ao ano, conforme esperado. O tom do comunicado sugere que haverá uma nova alta nas taxas em dezembro.", "titulo_pt": "Boj mantém taxa de juros e sugere alta para dezembro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236925, "titulo": "Dois repousos, um calendário: a escala 5×2 e o contrato especial de trabalho desportivo", "url": "https://www.jota.info/opiniao-e-analise/artigos/dois-repousos-um-calendario-a-escala-5x2-e-o-contrato-especial-de-trabalho-desportivo", "fonte_id": "jota", "data_pub": "2026-10-31T08:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A emenda que aboliu a escala 6x1 não fez exceção para o desporto. O texto original discute a escala 5×2 e o contrato especial de trabalho desportivo.", "titulo_pt": "Dois repousos, um calendário: a escala 5×2 e o contrato especial de trabalho desportivo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 236820, "titulo": "Após euforia, bolsas em NY vivem semana de ressaca com pressão de IA", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/apos-euforia-bolsas-em-ny-vivem-semana-de-ressaca-com-pressao-de-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T07:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Nova York vivem uma semana de queda após uma fase de euforia, com a Nasdaq acumulando uma retração de 7,8% em relação à sua máxima histórica registrada no início do mês. O índice sofreu seu pior declínio mensal desde março de 2025.", "titulo_pt": "Após euforia, bolsas de NY enfrentam semana de queda com pressão de IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236926, "titulo": "Reforma tributária expõe fragilidade jurídica de negócios digitais que cresceram sem estrutura", "url": "https://www.jota.info/opiniao-e-analise/artigos/reforma-tributaria-expoe-fragilidade-juridica-de-negocios-digitais-que-cresceram-sem-estrutura", "fonte_id": "jota", "data_pub": "2026-10-31T07:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária destaca problemas legais nas empresas digitais que expandiram sem seguir estruturas legais adequadas.", "titulo_pt": "Reforma tributária expõe fragilidades jurídicas de negócios digitais que cresceram sem estrutura", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 236675, "titulo": "Kalshi é avaliada em US$ 40 bilhões e se aproxima de possível IPO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/kalshi-e-avaliada-em-us-40-bilhoes-e-se-aproxima-de-possivel-ipo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Kalshi, cofundada pela brasileira Luana Lopes Lara, foi avaliada em US$ 40 bilhões e superou sua concorrente Polymarket na avaliação de investidores. A empresa está se aproximando de uma possível oferta inicial de ações (IPO).", "titulo_pt": "Kalshi é avaliada em 40 bilhões de dólares e se aproxima de possível IPO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236927, "titulo": "Anulação de sentença arbitral estrangeira quando a lex arbitri for a lei brasileira", "url": "https://www.jota.info/opiniao-e-analise/artigos/anulacao-de-sentenca-arbitral-estrangeira-quando-a-lex-arbitri-for-a-lei-brasileira", "fonte_id": "jota", "data_pub": "2026-10-31T06:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a anulação de sentenças arbitrais estrangeiras sob a jurisprudência brasileira, com foco na Convenção de Nova Iorque e o princípio do favor arbitral.", "titulo_pt": "Anulação de sentença arbitral estrangeira quando a lei brasileira for a lex arbitri", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 237106, "titulo": "Trump called out Big Oil profits. Here’s how much their refining earnings have surged since", "url": "https://www.cnbc.com/2026/10/31/trump-big-oil-refining-profits.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-31T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump criticou a indústria do petróleo por fazer 'demais dinheiro', mas as empresas de petróleo maiores relataram lucros crescentes na refino devido à escassez de suprimentos de combustível.", "titulo_pt": "Trump criticou a Big Oil por lucros excessivos. Veja como as receitas de refino das principais empresas petrolíferas dispararam desde então", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 236928, "titulo": "Eficácia horizontal 2.0: o STF diante das Big Techs", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/eficacia-horizontal-2-0-o-stf-diante-das-big-techs", "fonte_id": "jota", "data_pub": "2026-10-31T05:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a atuação do STF em relação às Big Techs e menciona a possibilidade de redes sociais excluir contas de usuários por um período indeterminado.", "titulo_pt": "Eficácia horizontal 2.0: o STF diante das Big Techs", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 236929, "titulo": "Quando o tributo não passa pelo caixa: os desafios empresariais do split payment", "url": "https://www.jota.info/opiniao-e-analise/artigos/quando-o-tributo-nao-passa-pelo-caixa-os-desafios-empresariais-do-split-payment", "fonte_id": "jota", "data_pub": "2026-10-31T05:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O split payment pode alterar como as empresas financiam suas atividades, negociam com fornecedores, formam preços e medem a rentabilidade. Este mecanismo tem potencial para transformar diversos aspectos do negócio.", "titulo_pt": "Quando o split payment não passa pelo caixa: os desafios empresariais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 237124, "titulo": "Lula’s surprise election victory sends agri-commodities tumbling", "url": "https://www.ft.com/content/f0ca6771-20a2-4146-bd3f-4796d3c86094?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-31T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A surpreendente vitória eleitoral de Lula levou a uma forte queda no valor do real brasileiro, tornando as exportações do país mais competitivas e diminuindo o poder de negociação dos agricultores de outros países.", "titulo_pt": "Vitória eleitoral de lula faz agro-commodities cair", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 237176, "titulo": "Japan considers paying low-income workers ¥5,000 through benefit program", "url": "https://www.japantimes.co.jp/news/2026/10/31/japan/japan-5000-benefit/", "fonte_id": "japan_times", "data_pub": "2026-10-31T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão está considerando um programa que fornecerá um benefício fixo de ¥5.000 a trabalhadores de baixa renda que ganham até ¥1.19 milhão anualmente.", "titulo_pt": "Japão considera pagar trabalhadores de baixa renda ¥5.000 através de programa de benefícios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 236676, "titulo": "Voltados a investidores, imóveis pequenos são 29% dos lançamentos em SP", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/voltados-a-investidores-imoveis-pequenos-sao-29-dos-lancamentos-em-sp.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em São Paulo, nos primeiros oito meses de 2026, foram lançados 91.361 novas unidades imobiliárias, um aumento de 19,8% em comparação com o mesmo período do ano anterior. Os imóveis pequenos voltados a investidores representam 29% desses lançamentos.", "titulo_pt": "Pequenos imóveis para investidores representam 29% dos lançamentos em SP", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236677, "titulo": "Após queda brusca da Bolsa, analistas recomendam cautela aos investidores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/apos-queda-brusca-da-bolsa-analistas-recomendam-cautela-aos-investidores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os especialistas do mercado financeiro recomendam cautela aos investidores após a queda brusca da Bolsa brasileira. Os investidores devem evitar reações impulsivas.", "titulo_pt": "Depois da queda repentina da Bolsa, especialistas orientam cautela aos investidores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236687, "titulo": "Itaú corta projeção do PIB de 2027 para 0,5% e vê inflação acima da meta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/itau-corta-projecao-do-pib-de-2027-para-05-e-ve-inflacao-acima-da-meta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T01:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itaú reduziu sua projeção de crescimento do PIB para 2027 para 0,5% e espera uma inflação significativamente acima do teto da meta para 2026.", "titulo_pt": "Itaú corta projeção do PIB de 2027 para 0,5% e vê inflação acima da meta", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236688, "titulo": "Oncoclínicas diz que obteve adesão necessária de credores para recuperação extrajudicial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/oncoclinicas-diz-que-obteve-adesao-necessaria-de-credores-para-recuperacao-extrajudicial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T01:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Oncoclínicas informou que conseguiu a adesão necessária dos credores para prosseguir com o pedido de homologação de plano de recuperação extrajudicial.", "titulo_pt": "Oncoclínicas obtém adesão suficiente dos credores para recuperação extrajudicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236689, "titulo": "Wikipédia defende meio-termo em disputa judicial entre New York Times e OpenAI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/wikipedia-defende-meio-termo-em-disputa-judicial-entre-new-york-times-e-openai.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T01:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação Wikimedia defendeu uma posição intermediária na disputa judicial entre o jornal New York Times e a OpenAI sobre direitos autorais no treinamento de inteligência artificial.", "titulo_pt": "Wikimedia defende posição intermediária em disputa judicial entre New York Times e OpenAI", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 237213, "titulo": "AI could turn China’s social credit system into surveillance tool: government-funded study", "url": "https://www.scmp.com/news/china/science/article/3372510/ai-could-turn-chinas-social-credit-system-surveillance-tool-government-funded-study", "fonte_id": "scmp", "data_pub": "2026-10-31T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo financiado pelo governo chinês alertou que a utilização de inteligência artificial no sistema de crédito social do país poderia transformá-lo em uma ferramenta de grande escala de vigilância. Embora o sistema de crédito social chinesa seja amplamente percebido como um projeto de pontuação autoritário, a maioria das pessoas dentro do país não sente sua influência prática.", "titulo_pt": "AI poderia transformar o sistema de crédito social chinês em ferramenta de vigilância, diz estudo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237249, "titulo": "Are Memories Transferable? Meet the Scientists Replicating an Infamous Study to Find Out", "url": "https://www.wired.com/story/are-memories-transferable-meet-the-scientists-replicating-an-infamous-study-to-find-out/", "fonte_id": "wired", "data_pub": "2026-10-31T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No início dos anos 60, um experimento incomum mostrou que vermes planares podiam transferir memórias ao se alimentarem um do outro. No entanto, os vermes pararam de aprender após algum tempo.", "titulo_pt": "Lembranças transferíveis? Conheça os cientistas replicando um estudo infame para descobrir", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 236898, "titulo": "Cuando la IA es solo discurso", "url": "https://www.lanacion.com.ar/economia/negocios/cuando-la-ia-es-solo-discurso-nid31102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-31T09:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Quando as promessas sobre a inteligência artificial avançam mais rápido que a implementação, o escepticismo e a desconfiança crescem nas organizações em relação aos líderes.", "titulo_pt": "Quando a IA é apenas discurso", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 237250, "titulo": "Best Sunrise Alarm Clock (2026): Hatch, Lumie", "url": "https://www.wired.com/story/should-you-get-a-sunrise-alarm-clock/", "fonte_id": "wired", "data_pub": "2026-10-31T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor nunca se acordou facilmente pela manhã, mas este relógio de despertar colocado na mesa de cabeceira foi o único dispositivo a mudar isso.", "titulo_pt": "Melhor relógio de despertar para orixias (2026): hatch, Lumie", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 237251, "titulo": "White Dwarfs Aren’t Just White. Scientists Discover Dying Stars Turning Pink and Green", "url": "https://www.wired.com/story/white-dwarfs-arent-just-white-scientists-discover-dying-stars-turning-pink-and-green/", "fonte_id": "wired", "data_pub": "2026-10-31T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram que a densidade de um branco-anão e o tipo de material que ele absorveu de seu ambiente podem produzir uma gama de cores no atmosfera da estrela. Isso significa que os brancos-anãos não são apenas brancos, podendo aparecer em tons de rosa e verde.", "titulo_pt": "Brancos-anãos não são apenas brancos. Astrônomos descobrem estrelas moribundas mudando para rosa e verde", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 237237, "titulo": "(LEAD) Samsung execs meet Open AI's Sam Altman to discuss AI transformation", "url": "https://en.yna.co.kr/view/AEN20261031002651315", "fonte_id": "yonhap_news", "data_pub": "2026-10-31T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos-chefes de importantes filiais da Samsung se reuniram com Sam Altman, CEO da Open AI, para discutir a transformação por meio da inteligência artificial.", "titulo_pt": "Executivos da Samsung se reúnem com Sam Altman da Open AI para discutir AI", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 237218, "titulo": "Can battery swapping and energy storage power CATL’s next phase of growth?", "url": "https://www.scmp.com/business/climate-and-energy/article/3372711/can-battery-swapping-and-energy-storage-power-catls-next-phase-growth", "fonte_id": "scmp", "data_pub": "2026-10-31T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Contemporary Amperex Technology Ltd (CATL) está apostando em novos negócios como troca de baterias e armazenamento de energia para buscar novos motores de crescimento, enquanto enfrenta intensificadas guerras de preços e pressões sobre a rentabilidade. No entanto, o caminho não é fácil, já que players estabelecidos como Nio e BYD já têm uma forte presença nessas áreas.", "titulo_pt": "CATL pode troca de baterias e armazenamento de energia impulsionar seu próximo estágio de crescimento?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237191, "titulo": "Siemens CEO outlines path to bring industrial AI to smaller manufacturers", "url": "https://www.koreaherald.com/article/10921341", "fonte_id": "korea_herald", "data_pub": "2026-10-31T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Siemens, Roland Busch, discursou sobre como levar a inteligência artificial para pequenas empresas industriais, destacando a necessidade de modelos treinados com conhecimento industrial e dados, além de uma estratégia de adoção adequada para empresas com recursos limitados. Enquanto a IA promete mudanças industriais significativas, transformar essa promessa em ganhos práticos nas fábricas e beneficiar as pequenas empresas permanece um desafio em andamento.", "titulo_pt": "CEO da siemens explica caminho para levar IA industrial para pequenas empresas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 237202, "titulo": "Samsung executives meet OpenAI's Altman to discuss AI strategy", "url": "https://www.koreaherald.com/article/10921312", "fonte_id": "korea_herald", "data_pub": "2026-10-31T06:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sessenta executivos sêniores da Samsung se reuniram com o CEO da OpenAI, Sam Altman, para discutir como a inteligência artificial pode transformar a gestão corporativa e criar novas oportunidades de negócios. O encontro foi realizado no Centro de Desenvolvimento de Pessoal da Samsung em Yongin, Gyeonggi Province, com a presença de presidentes e outros executivos-chave de várias divisões da empresa.", "titulo_pt": "Executivos da samsung se reúnem com ceo da OpenAI para discutir estratégia de IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 236770, "titulo": "Executivos sem conhecimentos em IA podem perder espaço no mercado de trabalho?", "url": "https://exame.com/inteligencia-artificial/executivos-sem-conhecimentos-em-ia-podem-perder-espaco-no-mercado-de-trabalho/", "fonte_id": "exame", "data_pub": "2026-10-31T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A transformação das empresas requer que profissionais em cargos de liderança tenham compreensão da tecnologia da inteligência artificial, mesmo sem dominar aspectos técnicos de seu desenvolvimento. Executivos sem conhecimentos básicos em IA podem perder espaço no mercado de trabalho.", "titulo_pt": "Executivos sem conhecimentos em IA podem perder espaço no mercado de trabalho?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 237108, "titulo": "AI is coming to construction sites. But does it make workers safer?", "url": "https://www.cnbc.com/2026/10/31/ai-construction-worker-safety.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-31T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de inteligência artificial está identificando riscos em canteiros de obras, mas os pesquisadores afirmam que há evidências limitadas de que essa tecnologia evita ferimentos.", "titulo_pt": "A IA está chegando aos canteiros de obras. Mas ela torna os trabalhadores mais seguros?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 237228, "titulo": "From digital pets to robot pals: how AI is changing Hong Kong classrooms", "url": "https://www.scmp.com/news/hong-kong/education/article/3372812/digital-pets-robot-pals-how-ai-changing-hong-kong-classrooms", "fonte_id": "scmp", "data_pub": "2026-10-31T05:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos de uma sala de aula primária em Hong Kong debateram sobre o que seu pet virtual precisava mais, vale-compras ou cartões de jogo mais recentes, usando inteligência artificial (IA) e ferramentas web. O objetivo era ensinar a eles sobre poupança e orçamento, ajudando-os a perceber as consequências das decisões de gastos imprudentes.", "titulo_pt": "De pets digitais a amigos robóticos: como a IA está transformando as salas de aula de Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237120, "titulo": "Is this the first clear evidence of AI’s impact on the labour market?", "url": "https://www.ft.com/content/7f27aa5f-5994-4f82-aed8-1cade18fb487?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-31T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produtividade aumentou e o emprego diminuiu no setor de tecnologia, mas em outras áreas, a situação é menos clara. A pesquisa busca identificar se há evidências claras do impacto da inteligência artificial no mercado de trabalho.", "titulo_pt": "Este é o primeiro sinal claro do impacto da IA no mercado de trabalho?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 237229, "titulo": "As AI cyber risks grow, Chinese chip expert urges shared ethics standards with US rivals", "url": "https://www.scmp.com/tech/article/3372807/ai-cyber-risks-grow-chinese-chip-expert-urges-shared-ethics-standards-us-rivals", "fonte_id": "scmp", "data_pub": "2026-10-31T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O co-fundador da gigante chinesa de chips Cambricon Technologies, Chen Yunji, sugeriu a adoção de padrões éticos universais para modelos de inteligência artificial chineses e americanos para mitigar os riscos sociais crescentes. Isso ocorre em meio a um avanço rápido de sistemas de IA globalmente, resultando em uma série de ataques cibernéticos de alto perfil que ameaçam infraestruturas críticas e servidores governamentais.", "titulo_pt": "Cientista chinês de chips sugere ética compartilhada para modelos de IA com rivais americanos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237244, "titulo": "Pile-ins, payouts, and pacing pressure: the investors behind the VCs open up", "url": "https://techcrunch.com/2026/10/30/pile-ins-payouts-and-pacing-pressure-the-investors-behind-the-vcs-open-up/", "fonte_id": "techcrunch", "data_pub": "2026-10-31T04:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os investidores por trás dos investidores nas startups estão, em geral, satisfeitos. A pressão para manter o ritmo das rodadas de financiamento e os lucros está aumentando.", "titulo_pt": "Pile-ins, payouts e pressão para manter o ritmo: os investidores por trás dos investidores abrem o jogo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 237232, "titulo": "Kim Jong-un urges drone expansion as North Korea showcases new unmanned tech", "url": "https://www.scmp.com/news/asia/east-asia/article/3372809/kim-jong-un-urges-drone-expansion-north-korea-showcases-new-unmanned-tech", "fonte_id": "scmp", "data_pub": "2026-10-31T03:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder norte-coreano Kim Jong-un assistiu a uma exposição de drones e incentivou a expansão rápida da tecnologia de drones do país, conforme relatado pela mídia estatal. A exposição ocorre em um momento em que as ameaças militares do regime contra a Coreia do Sul e os Estados Unidos intensificaram.", "titulo_pt": "Kim Jong-un incentiva expansão de tecnologia de drones em exposição norte-coreana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 236673, "titulo": "Paleontólogos identificam primeiro anfíbio que levava vida 100% marinha", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/paleontologos-identificam-primeiro-anfibio-que-levava-vida-100-marinha.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paleontólogos identificaram um anfíbio que vivia 100% no mar, em contraste com a suposição de que a pele dos anfíbios não suportaria a salinidade marinha. Essa espécie, encontrada em rochas datadas do período dos primeiros dinossauros, passava a maior parte do tempo no fundo do mar à procura de presas.", "titulo_pt": "Paleontólogos identificam primeiro anfíbio que levava vida 100% marinha", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 237220, "titulo": "China joins global race to reawaken brain-injury patients through ultrasound therapy", "url": "https://www.scmp.com/tech/tech-trends/article/3372779/china-joins-global-race-reawaken-brain-injury-patients-through-ultrasound-therapy", "fonte_id": "scmp", "data_pub": "2026-10-31T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um paciente chinesa que passou três meses em coma após uma hemorragia cerebral recuperou a capacidade de falar, comer e caminhar com apoio, resultado de um ensaio clínico inicial que usa ondas sonoras direcionadas para estimular regiões profundas do cérebro danificado sem cirurgia.", "titulo_pt": "China participa na corrida global para reanimar pacientes com lesões cerebrais através da terapia com ultrassom", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236769, "titulo": "Exercício físico pode fazer mais do que fortalecer o coração — estudo revela novo efeito", "url": "https://exame.com/ciencia/exercicio-fisico-pode-fazer-mais-do-que-fortalecer-o-coracao-estudo-revela-novo-efeito/", "fonte_id": "exame", "data_pub": "2026-10-31T06:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa envolvendo universidades brasileiras descobriu alterações na estrutura das células nervosas após uma participação de dez semanas em atividades aeróbicas. O estudo revela um novo efeito do exercício físico além do fortalecimento do coração.", "titulo_pt": "Exercício físico pode fazer mais do que fortalecer o coração — estudo revela novo efeito", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 236772, "titulo": "Como os crocodilos escaparam da extinção que matou os dinossauros?", "url": "https://exame.com/ciencia/como-os-crocodilos-escaparam-da-extincao-que-matou-os-dinossauros/", "fonte_id": "exame", "data_pub": "2026-10-31T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Análise de milhares de fósseis e 245 milhões de anos de mudanças climáticas ajudaram a explicar como os crocodilos sobreviveram à extinção que matou os dinossauros.", "titulo_pt": "Como os crocodilos escaparam da extinção que matou os dinossauros?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 237309, "titulo": "Happy Halloween! SpaceX launches 27 Starlink satellites to orbit from California", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-starlink-launch-falcon-9-group-15-18-landing-ocisly", "fonte_id": "space_com", "data_pub": "2026-10-31T05:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou mais 27 satélites Starlink da Califórnia por volta da meia-noite no Dia das Máscaras (31 de outubro).", "titulo_pt": "Feliz dia das máscaras! Spacex lança 27 satélites Starlink da califórnia", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 237276, "titulo": "Math Puzzle: Mysterious pyramid", "url": "https://www.scientificamerican.com/article/math-puzzle-mysterious-pyramid/", "fonte_id": "scientific_american", "data_pub": "2026-10-31T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desafio apresenta um pyramid incomum que os leitores podem tentar subir. O texto sugere que há um enigma ou problema matemático relacionado a essa pirâmide.", "titulo_pt": "Puzzle matemático: pirâmide misteriosa", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 237277, "titulo": "APOD: 2026 October 31 – Night on a Spooky Planet", "url": "https://science.nasa.gov/image-article/apod-2026-october-31-night-on-a-spooky-planet/", "fonte_id": "nasa_news", "data_pub": "2026-10-31T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da NASA para 31 de outubro de 2026 mostra a noite em um planeta com atmosfera espelhada, destacando o aspecto fantasmagórico do local.", "titulo_pt": "APOD: 31 de outubro de 2026 – noite em um planeta fantasmagórico", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 237231, "titulo": "Mao vs Rao: Cell Press probe clears editor but Chinese biologist keeps up pressure", "url": "https://www.scmp.com/news/china/science/article/3372707/mao-vs-rao-cell-press-probe-clears-editor-chinese-biologist-keeps-pressure", "fonte_id": "scmp", "data_pub": "2026-10-31T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O biólogo chinês Rao Yi está recusando-se a desistir após a Cell Press afirmar não ter encontrado evidências de que o editor-chefe Steve Mao tenha buscado propinas de cientistas chineses. A Cell Press, uma das principais editoras científicas do mundo, declarou que sua investigação ‘largamente concluiu’ e ‘não encontrou evidências que sustentem as acusações mencionadas’.", "titulo_pt": "Mao vs Rao: cell Press afirma falta de evidências, mas biólogo chinês não desiste", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237272, "titulo": "Spatial mapping reveals how human urogenital organs codevelop during organogenesis", "url": "https://phys.org/news/2026-10-spatial-reveals-human-urogenital-codevelop.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente mapeou o desenvolvimento dos órgãos urogenitais humanos em seu contexto espacial natural, mostrando como órgãos vizinhos coordenam seu desenvolvimento através da comunicação celular e sinais moleculares durante a organogenese.", "titulo_pt": "Mapeamento espacial revela o desenvolvimento dos órgãos urogenitais humanos e suas interações durante a organogenese", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237273, "titulo": "Scientists develop new system to boost prime editing in dicot plants", "url": "https://phys.org/news/2026-10-scientists-boost-prime-dicot.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram um novo sistema de edição genética que pode facilitar a introdução de mudanças genéticas precisas em culturas como tomates, soja e colza. O sistema, chamado SmartPE, aumenta a eficiência da edição primária em várias plantas dicotiledôneas, superando um importante limite da técnica.", "titulo_pt": "Cientistas desenvolvem novo sistema para potencializar edição primária em plantas dicotiledôneas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237274, "titulo": "Figuring out where cosmic neutrinos come from is tricky—radio telescopes could help find 'ghost particles' origin", "url": "https://phys.org/news/2026-10-figuring-cosmic-neutrinos-tricky-radio.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os neutrinos são partículas leves que são um dos componentes mais evasivos do universo. Eles podem vir de fontes variadas, desde bananas até supernovas, e passam por grandes distâncias sem interagir com outros corpos.", "titulo_pt": "Decifrar a origem dos neutrinos cósmicos é complicado—telescópios de rádio podem ajudar a localizar a 'partícula fantasma'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237310, "titulo": "The world mourns the passing of 'Star Trek's' Patrick Stewart with a galaxy of tearful tributes", "url": "https://www.space.com/entertainment/the-world-mourns-the-passing-of-star-treks-patrick-stewart-with-a-galaxy-of-tearful-tributes", "fonte_id": "space_com", "data_pub": "2026-10-30T23:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mundo lamenta a passagem de Patrick Stewart, conhecido por sua atuação em 'Star Trek', com tributos emocionais de todo o universo. Ele era um homem que exibia suas emoções abertamente, tornando-se confiável e adorado por muitos, incluindo o autor desta citação.", "titulo_pt": "Mundo se solidariza com a passagem de 'Star Trek's' Patrick Stewart, através de tributos estelares", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 237275, "titulo": "Livestock guardian dogs enlisted in efforts to conserve Texas' smallest fox", "url": "https://phys.org/news/2026-10-livestock-guardian-dogs-efforts-texas.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um pasto do Texas Panhandle, dois cães pastores protegem um rebanho de gado que pastoreia nas Rita Blanca National Grasslands. Embora seu objetivo principal seja proteger o rebanho de predadores, sua presença pode ser benéfica para a conservação da vida selvagem.", "titulo_pt": "Cães pastores engajados na conservação da pequena raposa do Texas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236180, "titulo": "Anvisa aprova novo comprimido para tratar doença rara progressiva", "url": "https://veja.abril.com.br/saude/anvisa-aprova-novo-comprimido-para-tratar-doenca-rara-progressiva/", "fonte_id": "veja", "data_pub": "2026-10-30T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa aprovou o comprimido Evrysdi Go (risdiplam) para o tratamento da atrofia muscular espinhal 5q em adultos e crianças acima de 2 anos.", "titulo_pt": "Anvisa aprova comprimido para tratar atrofia muscular espinhal 5q em adultos e crianças", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 236603, "titulo": "New home for orangutans rescued from Indonesia's burning forests", "url": "https://phys.org/news/2026-10-home-orangutans-indonesia-forests.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conservacionistas abrem uma grade em uma floresta da Borneu, Indonésia, liberando uma orangotango e seu bebê, que logo se escondem nas altas árvores, seguras finalmente.", "titulo_pt": "Novo lar para orangotangos resgatados das florestas em chamas da indonésia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236604, "titulo": "For many, striped bass fishing is a way of life. But the iconic species could face collapse", "url": "https://phys.org/news/2026-10-striped-bass-fishing-life-iconic.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Jakob tem mais de 60 anos de paixão pela pesca de peixes-estripes, e lembra um tempo em que ele conseguia pescar oito a nove peixes de até 40 libras (18 kg) por noite, o que era considerado uma grande captura por qualquer padrão.", "titulo_pt": "Para muitos, a pesca de peixes-estripes é uma forma de vida, mas a espécie icônica pode enfrentar colapso", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 237212, "titulo": "How ancient Chinese stayed cosy using gadgets found in classical literature, historic artwork", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3372826/how-ancient-chinese-stayed-cosy-using-gadgets-found-classical-literature-historic-artwork", "fonte_id": "scmp", "data_pub": "2026-10-31T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em antiga China, sem eletricidade, as pessoas se aqueciam em casa durante invernos gelados usando cestos de aquecimento, que têm sido utilizados há mais de 2.000 anos. Esses cestos tinham um carvão abaixo de uma capa de bambu e foram mencionados pela primeira vez nas dinastias Qin e Han (221 a.C. a 220 d.C.).", "titulo_pt": "Como os antigos chineses se mantinham aconchegados usando artefatos mencionados em literatura clássica e obras históricas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236906, "titulo": "Purificaron orina que encontraron en la calle, juntaron 350.000 colillas y hacen del arte una reflexión sobre la basura", "url": "https://www.lanacion.com.ar/conversaciones-de-domingo/purificaron-orina-que-encontraron-en-la-calle-juntaron-350000-colillas-y-hacen-del-arte-una-nid31102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-31T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O coletivo mexicano Tres, liderado por Ilana Boltvinik e Rodrigo Viñas, realiza projetos artísticos baseados em pesquisas sobre lixo. Durante uma passagem por Buenos Aires, eles conversaram sobre sua trajetória, os desafios da pesquisa e a criação de uma crítica ecológica.", "titulo_pt": "Purificaram urina encontrada na rua, juntaram 350.000 charutos e transformam o lixo em arte crítico", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 236939, "titulo": "El ocaso de un imaginario migratorio", "url": "https://www.latercera.com/opinion/noticia/el-ocaso-de-un-imaginario-migratorio/", "fonte_id": "la_tercera", "data_pub": "2026-10-31T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o declínio de uma suposta migração imaginária. Não há detalhes específicos sobre o contexto ou as conclusões do autor.", "titulo_pt": "O ocaso de um migratório imaginário", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 236943, "titulo": "Michael Krisch: “El periodismo ha hecho un trabajo deficiente al no plantear preguntas difíciles a las empresas tecnológicas”", "url": "https://www.latercera.com/tendencias/noticia/michael-krisch-el-periodismo-ha-hecho-un-trabajo-deficiente-al-no-plantear-preguntas-dificiles-a-las-empresas-tecnologicas/", "fonte_id": "la_tercera", "data_pub": "2026-10-31T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Michael Krisch, diretor do Instituto Brown, sugere que o jornalismo precisa fazer mais perguntas difíceis sobre as empresas tecnológicas em relação às ferramentas de inteligência artificial. Ele alerta para os riscos de uma adoção não reflexiva dessas tecnologias, focando menos na localização dos centros de dados e mais no impacto delas sobre sentimentos e compreensão do mundo.", "titulo_pt": "Michael Krisch: 'o jornalismo fez um trabalho deficiente ao não questionar as empresas tecnológicas sobre as ferramentas de IA'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 237283, "titulo": "‘Never big enough’: inside the booming penis enlargement industry", "url": "https://www.theguardian.com/film/2026/oct/31/manhood-movie-penis-enlargement-industry", "fonte_id": "guardian_culture", "data_pub": "2026-10-31T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentário expõe um mundo influenciado pelo desejo de aparência perfeita, onde a capital social está ligada à aparência. A obsessão masculina com o tamanho do pênis é retratada desde tempos antigos, com referências em arte e cultura popular, e hoje impulsionada por uma indústria de bem-estar íntimo em crescimento, composta por procedimentos estéticos e terapias.", "titulo_pt": "Maior nunca será suficiente: dentro da indústria em expansão dos produtos para aumentar o pênis", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 237288, "titulo": "‘Being hated is very bracing’: Helen Garner on surviving three marriages and being called a ‘rotten feminist’", "url": "https://www.theguardian.com/books/2026/oct/31/being-hated-is-very-bracing-helen-garner-on-surviving-three-marriages-and-being-called-a-rotten-feminist", "fonte_id": "guardian_culture", "data_pub": "2026-10-31T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Helen Garner, autora australiana conhecida por sua ficção crua e escrita sobre crimes reais, discute suas relações, resiliência e reconhecimento global em uma entrevista. Ela considerou escrever sobre futebol de Australian Rules, mas desistiu por causa da dificuldade de aprender as regras.", "titulo_pt": "‘Sentir ódio é muito estimulante’: helen Garner sobre sobreviver a três casamentos e ser chamada de ‘feminista ruim’", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 237169, "titulo": "After Louvre heist and string of thefts, Europe’s smaller museums are on guard", "url": "https://www.japantimes.co.jp/news/2026/10/31/world/crime-legal/europe-small-museums-theft-guard/", "fonte_id": "japan_times", "data_pub": "2026-10-31T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há crescentes preocupações de que criminosos estejam cada vez mais alvo de pequenas instituições com menos recursos para proteger coleções valiosas. Isso se segue a um furto no Louvre e uma série de outros roubos.", "titulo_pt": "Depois do roubo no Louvre e de uma série de outros furtos, museus europeus menores estão em alerta", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 236697, "titulo": "Precarização dos artistas vem de muito antes da IA, diz escritor Odorico Leal", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/precarizacao-dos-artistas-vem-de-muito-antes-da-ia-diz-escritor-odorico-leal.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O escritor Odorico Leal afirma que a precarização dos artistas já existia antes da inteligência artificial. Em um conto de sua coletânea 'Sonhos da Pessoa Física', artistas como escritores e ilustradores recebem um auxílio governamental devido à perda de renda causada pela inteligência artificial.", "titulo_pt": "Precarização dos artistas antecede a inteligência artificial, diz Odorico Leal", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 237192, "titulo": "South African novelist wants to write a love story. But can he separate it from history?", "url": "https://www.koreaherald.com/article/10919266", "fonte_id": "korea_herald", "data_pub": "2026-10-31T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritor sul-africano Damon Galgut, cuja ficção explora a história, a desigualdade racial e as vidas moldadas por ambos, foi nomeado vencedor do 15º Prêmio Park Kyongni. Galgut expressou desejo de escrever além das restrições históricas e políticas que moldaram a literatura sul-africana, reconhecendo no entanto a obrigação de refletir sobre o passado turbulento do país.", "titulo_pt": "Escritor sul-africano quer escrever uma história de amor, mas como separá-la da história?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 237193, "titulo": "In ‘Final Interview,’ landing the job means burying your friends", "url": "https://www.koreaherald.com/article/10919321", "fonte_id": "korea_herald", "data_pub": "2026-10-31T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Final Interview' é uma história de mistério que se passa em uma situação em que seis graduados estão prestes a ser entrevistados para seus sonhos de emprego, mas todos têm segredos do passado que poderiam comprometer suas chances. A narrativa se concentra em com sarelas e novas obras: rota Mogiana passa à iniciativa privada com pacote de melhorias", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 236924, "titulo": "Un nuevo informe indica cómo estará el clima en la Costa Atlántica durante enero en el marco del Super Niño", "url": "https://www.clarin.com/sociedad/nuevo-informe-indica-clima-costa-atlantica-enero-marco-super-nino_0_1wIVe1huzp.html", "fonte_id": "clarin", "data_pub": "2026-10-31T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A tendência de dias mais frios e chuvosos continuará durante o verão, conforme informa o Serviço Meteorológico Nacional. Para o fim de semana, espera-se novas chuvas, seguidas de um aumento gradual das temperaturas nos dias seguintes.", "titulo_pt": "Novo relatório indica condições climáticas na Costa atlântica em janeiro", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 237233, "titulo": "Hong Kong’s Jumbo Floating Restaurant catches fire before opening, kills 34 – SCMP archive", "url": "https://www.scmp.com/news/hong-kong/article/3372522/hong-kongs-jumbo-floating-restaurant-catches-fire-opening-kills-34-scmp-archive", "fonte_id": "scmp", "data_pub": "2026-10-31T03:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 30 de outubro de 1971, um grande incêndio destruiu o restaurante Jumbo Flutuante em Aberdeen, Hong Kong, causando a morte de 13 pessoas e ferindo pelo menos 42. O fogo consumiu rapidamente o restaurante de quatro andares, deixando apenas um esqueleto carbonizado.", "titulo_pt": "Incêndio destrói Jumbo flutuante em aberdeen, matando 13 pessoas em 1971", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236678, "titulo": "Empresas ampliam programas de reciclagem de embalagens e buscam fidelizar clientes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/empresas-ampliam-programas-de-reciclagem-de-embalagens-e-buscam-fidelizar-clientes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas brasileiras estão expandindo programas de reciclagem de embalagens visando aumentar a logística reversa, que consiste na destinação ambientalmente correta dos resíduos gerados após o consumo dos produtos.", "titulo_pt": "Empresas brasileiras ampliam programas de reciclagem de embalagens e buscam fidelizar clientes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 237076, "titulo": "In Brazil, Lula faces limited room for maneuver on environmental protection", "url": "https://www.lemonde.fr/en/environment/article/2026/10/31/in-brazil-lula-faces-limited-room-for-maneuver-on-environmental-protection_6767851_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-31T01:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para seu quarto mandato, o presidente Luiz Inácio Lula da Silva enfrenta uma presença acentuada do direito radical no Congresso, onde os deputados e senadores, principalmente, apoiam interesses da agroindústria.", "titulo_pt": "Em seu quarto mandato, Lula enfrenta limitações na proteção ambiental", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 235848, "titulo": "Ministry approves first carbon sequestration exploration", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/31/2003866904", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério aprovou a primeira exploração de sequestramento de carbono. Este é o primeiro passo importante para o desenvolvimento de tecnologias de sequestramento de carbono no país.", "titulo_pt": "Ministério aprova primeira exploração de sequestramento de carbono", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 236354, "titulo": "“Súper Niño”: un especialista en Ciencias Ambientales explicó qué impacto tendrá y cuándo se intensificará en la Argentina", "url": "https://www.lanacion.com.ar/sociedad/super-nino-un-especialista-en-ciencias-ambientales-explico-que-impacto-tendra-y-cuando-se-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T21:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, licenciado em Ciências Ambientais, analisou a relação entre a nubosidade persistente e as temperaturas frescas de outubro. Ele previu que o processo atingirá seu pico em dezembro e que os efeitos se estenderão para os primeiros meses do próximo ano.", "titulo_pt": "Super Niño: especialista em ciências ambientais explica impacto e previsão de intensificação na Argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 236492, "titulo": "Fire Devastated a Mongolian Nature Reserve. Who’s to Blame?", "url": "https://thediplomat.com/2026/10/fire-devastated-a-mongolian-nature-reserve-whos-to-blame/", "fonte_id": "the_diplomat", "data_pub": "2026-10-30T18:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio no Numrug afetou um reservatório natural mongolês, levantando questões sobre riscos de conformidade com capitais fronteiriços e mudanças geopolíticas impactando a ecologia da Ásia Oriental.", "titulo_pt": "Incêndio devastou reservatório natural mongolês. Quem é responsável?", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 235776, "titulo": "Indonesia: nine orangutans rescued from wildfires return to the forest", "url": "https://www.euronews.com/video/2026/10/30/indonesia-nine-orangutans-rescued-from-wildfires-return-to-the-forest", "fonte_id": "euronews", "data_pub": "2026-10-30T11:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove orangotangos resgatados de incêndios florestais devastadores na Borneu, Indonésia, foram devolvidos à natureza após semanas de reabilitação. Entre eles estão quatro mães com seus filhos, incluindo três fêmeas grávidas.", "titulo_pt": "Indonésia: nove orangotangos resgatados de incêndios florestais retornam à floresta", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234598, "titulo": "Novo foco de doença em aves em SC. O risco agora são os vizinhos", "url": "https://braziljournal.com/novo-foco-de-doenca-em-aves-em-sc-o-risco-agora-sao-os-vizinhos", "fonte_id": "brazil_journal", "data_pub": "2026-10-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produção de aves no Brasil está em alerta máximo após a confirmação do terceiro foco da doença de Newcastle em uma granja comercial de perus em Nova Erechim, Santa Catarina, na terça-feira.", "titulo_pt": "Novo foco de doença em aves em santa catarina aumenta risco", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 234942, "titulo": "How drought and oil expansion are eroding livelihoods in Iraq's Hawizeh Marshes", "url": "https://www.middleeasteye.net/news/how-drought-and-oil-expansion-are-eroding-livelihoods-iraqs-hawizeh-marshes", "fonte_id": "middle_east_eye", "data_pub": "2026-10-30T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seca e a expansão da extração de óleo estão destruindo o meio ambiente nos pântanos de Hawizeh, no Iraque, afetando a vida dos moradores que dependem daquele ecossistema frágil. A Unesco protege oficialmente os pântanos, mas a situação dos residentes está se deteriorando.", "titulo_pt": "Como a seca e a expansão do óleo estão destruindo a vida nos pântanos de Hawizeh, no iraque", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 234637, "titulo": "Clima: sexta-feira tem alertas de temporais e calorão pelo Brasil", "url": "https://www.metropoles.com/brasil/clima-sexta-feira-tem-alertas-de-temporais-e-calorao-pelo-brasil", "fonte_id": "metropoles", "data_pub": "2026-10-30T08:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço de uma frente fria sobre o centro-sul do Brasil favorece a formação de nuvens carregadas, resultando em pancadas de chuvas volumosas. Alertas de temporais e calorão serão emitidos para esta sexta-feira.", "titulo_pt": "Clima: sexta-feira terá alertas de temporais e calorão pelo Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 234896, "titulo": "Smoke from wildfires killed 3,500 people in Indonesia in September: Report", "url": "https://www.aljazeera.com/news/2026/10/30/smoke-from-wildfires-killed-3500-people-in-indonesia-in-september-report?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatório indica que 3.500 pessoas morreram devido a fumaça proveniente de incêndios florestais em setembro na Indonésia. As chamas, causadas por secas prolongadas, cobriram a região com fuligem.", "titulo_pt": "Fumaça de incêndios florestais matou 3.500 pessoas na indonésia em setembro, relatório aponta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234879, "titulo": "DR Congo: MSF celebrates Ebola patient discharges in Ituri province", "url": "https://www.euronews.com/video/2026/10/30/dr-congo-msf-celebrates-ebola-patient-discharges-in-ituri-province", "fonte_id": "euronews", "data_pub": "2026-10-30T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Danzas e cantos eclodiram em um centro de tratamento de Ebola na República Democrática do Congo quando os últimos pacientes foram liberados. É a primeira vez desde maio que o centro administrado pela MSF não tem casos confirmados em tratamento, apesar da epidemia continuar em escala maior.", "titulo_pt": "República democrática do Congo: MSF comemora saídas de pacientes de Ebola na província de Ituri", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234581, "titulo": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "url": "https://www.cnnbrasil.com.br/ciencia/cinco-regioes-de-corais-no-brasil-estao-em-estado-critico-e-correm-risco-de-colapso/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso devido a poluição marinha, atividades de navegação e mudanças climáticas. A exploração de petróleo e gás também contribuem para o branqueamento dos corais.", "titulo_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234963, "titulo": "Fire pollution killed 3,560 people in Indonesia in September, report says", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-wildfire-toll/", "fonte_id": "japan_times", "data_pub": "2026-10-30T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que 3.560 pessoas morreram devido à poluição de fumaça em setembro na Indonésia. Cerca de 57,8 milhões de pessoas nesse mesmo mês estavam expostas a ar considerado inadequado ou perigoso.", "titulo_pt": "Incêndios causaram a morte de 3.560 pessoas na indonésia em setembro, relatório diz", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234995, "titulo": "Indonesia’s wildfire smoke crisis claims over 3,500 lives in September", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372692/indonesias-wildfire-smoke-crisis-claims-over-3500-lives-september", "fonte_id": "scmp", "data_pub": "2026-10-30T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que cerca de 3.560 mortes no arquipélago indonésio em setembro foram causadas pela poluição resultante de fumos emitidos por incêndios florestais que duraram meses. Cerca de 57,8 milhões de pessoas na Indonésia estav function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;
