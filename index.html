tps://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/servidores-tem-salarios-zerados-por-greve-e-decisao-agrava-conflito-no-ibge-diz-sindicato.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Servidores do IBGE tiveram salários zerados por dias de greve em agosto e setembro, segundo a Assibge. A decisão agrava o conflito com a categoria.", "titulo_pt": "Servidores têm salários zerados por greve, e decisão agrava conflito no IBGE, diz sindicato", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247476, "titulo": "Enem 2026: como ver o local de prova e o cartão de confirmação?", "url": "https://exame.com/brasil/enem-2026-como-ver-o-local-de-prova-e-o-cartao-de-confirmacao/", "fonte_id": "exame", "data_pub": "2026-11-06T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Estudos e Pesquisas Educacionais (Inep) liberou o Cartão de Confirmação de Inscrição para o Exame Nacional do Ensino Médio (Enem) 2026 na terça-feira, 27 de outubro. Este documento contém informações importantes sobre o local de prova.", "titulo_pt": "Enem 2026: como consultar o cartão de confirmação de inscrição?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 247945, "titulo": "7 out of 10 'multicultural' marriages in Korea involve foreign wives", "url": "https://www.koreaherald.com/article/10928631", "fonte_id": "korea_herald", "data_pub": "2026-11-06T05:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 70% dos casamentos multiculturalistas em Coreia do Sul em 2025 envolveram mulheres estrangeiras e homens coreanos. Além disso, mais de um terço dessas uniões tinham homens com pelo menos 10 anos a mais do que suas esposas.", "titulo_pt": "7 Em 10 casamentos multiculturalistas em Coreia do sul envolvem mulheres estrangeiras", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 247728, "titulo": "From the Paris suburbs, France's Gen Z take to the streets: 'It's up to us to establish a new balance of power'", "url": "https://www.lemonde.fr/en/france/article/2026/11/06/from-the-paris-suburbs-france-s-gen-z-take-to-the-streets-it-s-up-to-us-to-establish-a-new-balance-of-power_6773199_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T04:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jovens franceses na faixa dos 20 anos, oriundos dos subúrbios de Paris, foram inspirados pelo movimento dos estudantes de escola, ampliando as demandas de uma geração mais consciente e engajada nas redes sociais.", "titulo_pt": "Dos subúrbios de Paris, a geração Z francesa toma as ruas: 'é nossa vez de estabelecer um novo equilíbrio de poder'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 247834, "titulo": "Noto quake victims’ family sues government and building owner over fatal collapse", "url": "https://www.japantimes.co.jp/news/2026/11/06/japan/crime-legal/noto-quake-fatal-collapse-lawsuit/", "fonte_id": "japan_times", "data_pub": "2026-11-06T02:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um prédio de sete andares caiu durante o terremoto de 2024, matando a esposa e a filha de uma família, e destruindo a casa e restaurante vizinhos.", "titulo_pt": "Família afetada pelo terremoto de noto processa governo e proprietário do edifício por colapso fatal", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 248750, "titulo": "Ministry to test impact of carbon capture schemes", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867322", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério planeja testar o impacto das propostas de captura de carbono. A intenção é avaliar a eficácia dessas iniciativas ambientais.", "titulo_pt": "Ministério vai testar impacto de propostas de captura de carbono", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 248364, "titulo": "Quase 90 milhões de deslocados vivem em países altamente expostos à crise climática, alerta ACNUR", "url": "https://www.jota.info/internacional/quase-90-milhoes-de-deslocados-vivem-em-paises-altamente-expostos-a-crise-climatica-alerta-acnur", "fonte_id": "jota", "data_pub": "2026-11-06T14:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ACNUR alerta que quase 90 milhões de deslocados vivem em países altamente expostos à crise climática. Durante a última década, desastres climáticos causaram mais de 255 milhões de deslocamentos internos.", "titulo_pt": "Quase 90 milhões de deslocados vivem em países altamente expostos à crise climática, alerta ACNUR", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 248430, "titulo": "Most Europeans want action to tackle climate crisis but not at any cost, poll shows", "url": "https://www.theguardian.com/world/2026/nov/06/europeans-want-action-climate-crisis-yougov-poll", "fonte_id": "guardian_world", "data_pub": "2026-11-06T12:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa YouGov realizada em seis países europeus mostrou que a maioria das pessoas acredita em mudanças climáticas causadas pelo homem e apoia ações como plantio de árvores e impostos sobre emissões, mas se opõe a medidas que afetem significativamente sua vida, como taxas de combustível e viagens aéreas.", "titulo_pt": "A maioria dos europeus quer ação contra a crise climática, mas não a qualquer custo, pesquisa mostra", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 248551, "titulo": "2026 'most likely' to be second-hottest year on record says EU monitor", "url": "https://www.lemonde.fr/en/environment/article/2026/11/06/2026-most-likely-to-be-second-hottest-year-on-record-says-eu-monitor_6773395_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T10:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com um padrão climático El Niño excepcionalmente forte acelerando o aquecimento global causado pela humanidade, o serviço Copernicus de Mudanças Climáticas afirma que há ainda uma '20% de chances de este ano empatar ou superar' 2024 como o ano mais quente jamais registrado.", "titulo_pt": "2026 'Provavelmente' será o segundo ano mais quente na história, diz monitor da ue", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 247603, "titulo": "Construyen el puente para animales más grande del mundo, una obra que busca reconectar hábitats y proteger a pumas aislados", "url": "https://www.lanacion.com.ar/el-mundo/construyen-el-puente-para-animales-mas-grande-del-mundo-una-obra-que-busca-reconectar-habitats-y-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em California, está sendo finalizado o Wallis Annenberg Wildlife Crossing, que será o maior puente para animais do mundo. A estrutura visa conectar habitats e proteger pumas isolados, reduzindo a endogamia genética nesses felinos.", "titulo_pt": "Construem o puente para animais mais grande do mundo, uma obra que busca reconectar habitats e proteger pumas aislados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 247977, "titulo": "‘Simply staggering’: Rapidly developing ‘super El Niño’ on track to peak in December", "url": "https://www.carbonbrief.org/simply-staggering-rapidly-developing-super-el-nino-on-track-to-peak-in-december", "fonte_id": "carbon_brief", "data_pub": "2026-11-06T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 'super El Niño' atual está em desenvolvimento rápido e está programado para atingir seu pico em dezembro. As temperaturas globais médias podem ser afetadas significativamente quando o fenômeno atingir seu pico no final do ano.", "titulo_pt": "Absurdo: 'super El Niño' em desenvolvimento rápido previsto para atingir pico em dezembro", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 247753, "titulo": "Grizzly bear hunt underway after mother and daughter killed in Canada", "url": "https://www.euronews.com/2026/11/06/grizzly-bear-hunt-underway-after-mother-and-daughter-killed-in-canada", "fonte_id": "euronews", "data_pub": "2026-11-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe e sua filha foram encontradas mortas após um suposto ataque de urso pardo perto de Bella Coola, no Canadá. Oficiais de conservação afirmam que podem ter sido envolvidos múltiplos ursos pardos, e as operações de armadilhas estão em andamento. A autoridade local estabeleceu um curfew enquanto a investigação continua.", "titulo_pt": "Caça ao urso pardo em andamento após mortes de mãe e filha em território canadense", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 247859, "titulo": "Indonesia doubles down on climate goals despite surging wildfire emissions", "url": "https://www.scmp.com/week-asia/health-environment/article/3373544/indonesia-doubles-down-climate-goals-despite-surging-wildfire-emissions", "fonte_id": "scmp", "data_pub": "2026-11-06T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia aumentou suas metas climáticas, apesar das intensas queimadas que contradizem essa estratégia. O ministro do Meio Ambiente, Jumhur Hidayat, enfatizou que os objetivos climáticos não devem prejudicar o desenvolvimento nacional.", "titulo_pt": "Indonésia reforça metas climáticas frente a intensas queimadas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 247949, "titulo": "Record-breaking El Nino raises prospect of warmer, wetter winter in Korea", "url": "https://www.koreaherald.com/article/10928548", "fonte_id": "korea_herald", "data_pub": "2026-11-06T04:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia Meteorológica Administrativa informou que o El Niño mais forte registrado está previsto para afetar a Península Coreana durante o inverno, trazendo condições mais quentes e úmidas. No entanto, condições climáticas podem mudar abruptamente em janeiro com a chegada de ar frio.", "titulo_pt": "El niño record-breaking promete inverno mais quente e úmido na Coreia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 246747, "titulo": "Em 2026, cidade de SP tem segundo outubro mais chuvoso desde 1995, diz CGE", "url": "https://www.metropoles.com/sao-paulo/em-2026-cidade-de-sp-tem-segundo-outubro-mais-chuvoso-desde-1995-diz-cge", "fonte_id": "metropoles", "data_pub": "2026-11-06T00:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, a cidade de São Paulo registrou o segundo outubro mais chuvoso desde 1995, com 220,3 mm de precipitação, um volume 96,7% superior à média esperada. O mês teve 26 dias com chuva.", "titulo_pt": "Em 2026, cidade de SP tem segundo outubro mais chuvoso desde 1995, diz CGE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247312, "titulo": "Analysis: China’s quarterly CO2 falls 3% in largest drop since Covid", "url": "https://www.carbonbrief.org/analysis-chinas-quarterly-co2-falls-3-in-largest-drop-since-covid", "fonte_id": "carbon_brief", "data_pub": "2026-11-06T00:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono (CO2) na China caíram 3,1% no terceiro trimestre de 2026, sendo este o maior decréscimo desde a pandemia de COVID-19.", "titulo_pt": "Análise: emissões de CO2 trimestrais da china caem 3% no maior decréscimo desde a pandemia de Covid-19", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 248186, "titulo": "Tráfico humano: PF investiga envio de brasileiras para exploração na Suíça", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/trafico-humano-pf-investiga-envio-de-brasileiras-para-exploracao-na-suica", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal deflagrou uma operação em Pernambuco para investigar o tráfico humano envolvendo brasileiras que seriam enviadas para a Suíça. A Justiça autorizou o bloqueio de R$ 1 milhão nas contas dos investigados.", "titulo_pt": "PF investiga tráfico humano de brasileiras para a Suíça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248269, "titulo": "Pai de Meghan Markle é preso sob suspeita de posse de material de abuso sexual infantil", "url": "https://www.bbc.com/portuguese/articles/c34g11eerrpno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-06T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pai de Meghan Markle foi detido na Flórida, Estados Unidos, sob suspeita de posse de material relacionado ao abuso sexual infantil. A duquesa de Sussex ainda não foi informada sobre a prisão.", "titulo_pt": "Pai de Meghan Markle é detido sob suspeita de posse de material de abuso sexual infantil", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 248713, "titulo": "Call to end ‘unjust’ national security cases as Hong Kong slams ‘malicious attacks’", "url": "https://www.scmp.com/news/hong-kong/politics/article/3373613/call-end-unjust-national-security-cases-hong-kong-slams-malicious-attacks", "fonte_id": "scmp", "data_pub": "2026-11-06T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dez países, incluindo aliados da 'Five Eyes', pediram um fim imediato das 'proações injustas' sob a lei de segurança nacional de Hong Kong após o ativista oposicionista Joshua Wong Chi-fung ser condenado a 10 anos de prisão. O governo local incentivou as forç function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}

              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;

                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>

         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;

  const drillId = "drill-" + (++drillCounter);

    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  });
}

}

  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
