ia, com 52,8% dos votos favoráveis ao 'Não'. Este resultado, que já não pode ser alterado, foi confirmado por emissoras de televisão e veículos internacionais. Em outro desenvolvimento, o Nepal enfrenta a possibilidade de novos alagamentos após o aumento do nível do rio Bhotekoshi, o que dificulta as operações de resgate e assistência no país. Além disso, o Japão planeja suspender a exigência de que as empresas limitem a hora extra de seus funcionários a 45 horas por mês, o que levanta dúvidas sobre o futuro das reformas de estilo de trabalho no país.\n\nO Estreito de Ormuz, localizado no Golfo Pérsico, permanece fechado devido a ações militares dos Estados Unidos contra o Irã, conforme declarado pela Guarda Revolucionária Iraniana. Este evento é crucial na geopolítica regional, já que o estreito é vital para o comércio marítimo global, especialmente para o transporte de petróleo. Em um contexto mais amplo, a guerra entre os Estados Unidos e Israel contra o Irã continua sem uma solução, com o ministro das Relações Exteriores iraniano, Abbas Araghchi, exigindo que o Japão se responsabilize pelo uso de sua base aérea por forças armadas dos EUA. Além disso, o presidente russo, Vladimir Putin, assinou um decreto para controlar infraestruturas críticas após ataques, enquanto o Irã busca novos acordos regionais para fortalecer a unidade muçulmana. Estes eventos refletem a complexidade e a crescente tensão na geopolítica global, com implicações significativas para as economias e relações internacionais.", "economia": "A dívida dos Estados Unidos atingiu quase 40 trilhões de dólares, gerando preocupações financeiras e econômicas. O Brasil e a Índia buscam expandir suas relações comerciais para alcançar metas bilionárias. O Copacabana Palace, em seu centenário, inaugurou uma nova ala com suítes de alto luxo. A governança transversal é destacada como o DNA da resiliência nas organizações modernas, enquanto a governança da internet pode ser adaptada de acordo com as funções e riscos específicos. A Coreia do Sul enfrenta pressões inflacionárias devido ao forte crescimento nas exportações, enquanto o número de empregos para jovens adultos atingiu um recorde baixo. Em um cenário global turbulento, a Coreia do Sul cancelou a viagem do ministro das Finanças ao G20 devido a questões políticas. A Vale considera a exploração de terras raras através da mineração circular, enquanto a China investe bilionários em robótica industrial para competir com os Estados Unidos. O varejo brasileiro enfrenta desafios, com a C&A se destacando no cenário competitivo. A Meta enfrenta um julgamento federal por promover produtos viciantes, comparado ao enfrentado pela indústria do tabaco.", "tecnologia": "A China está estabelecendo seu primeiro padrão nacional de resfriamento líquido para racks de inteligência artificial (IA), em resposta à crescente potência desses equipamentos, especialmente com a geração Vera Rubin da Nvidia. Este desenvolvimento reflete a necessidade de adaptações tecnológicas para lidar com o aumento da potência das GPUs. Paralelamente, a empresa de chips ChangXin Memory Technologies (CXMT) entrou na crescente lista de empresas tecnológicas chinesas que processaram o governo dos Estados Unidos por sua inclusão em listas negras do Pentágono, juntando-se a outras empresas como a fabricante de drones DJI e a empresa de biotecnologia WuXi AppTec. Em um desenvolvimento relacionado, a OpenAI anunciou que vai encerrar o acesso da plataforma Cursor aos seus modelos de inteligência artificial, cortando o acesso da empresa recentemente adquirida pela SpaceX, de Elon Musk, após preocupações sobre a propriedade intelectual. Estes eventos destacam a crescente importância da IA e das questões éticas e legais associadas a ela, bem como os desafios enfrentados pelas empresas tecnológicas globais.", "ciencia": "O lançamento do Telescópio Espacial Roman, da NASA, está programado para este domingo, a partir de um foguete SpaceX no Cabo Canaveral, Flórida. Este telescópio orbital visa abrir uma nova era de descobertas astronômicas, buscando entender a energia escura e exoplanetas. Paralelamente, especialistas em neurologia concordam que as sonecas prolongadas não compensam as dívidas de sono, sugerindo a importância de hábitos noturnos e equipamentos adequados para o descanso. Além disso, cientistas da Universidade de Queensland descobriram que os copos de papel usados para bebidas de takeout, quando expostos a líquidos quentes, liberam milhões de partículas de microplástico, levantando preocupações sobre a contaminação do café. Estas notícias destacam avanços significativos na ciência, desde a exploração espacial até questões cotidianas como a saúde e o meio ambiente.", "cultura": "A cultura global continua a se expandir e diversificar. Um exemplo disso foi a exibição do filme 'The Odyssey' na Seoul Fashion Week, que se tornou o maior filme estrangeiro do ano no mercado sul-coreano. Em outro evento, a 20ª edição do Biênial de Busan celebrou a música como forma de resistência e comunicação, homenageando a tradição de ativismo operário e protestos pró-democracia da cidade. No cinema, o filme 'Vingadores: Ultimato Encore' retorna aos cinemas em setembro, enquanto a Seoul Fashion Week de 2027 promete uma extensão de seis dias, dividindo-se entre dois locais. Em um projeto arquitetônico, a Foster + Partners desenvolveu um conceito de showroom para a Norton Motorcycles, destacando a herança de engenharia da marca enquanto promove uma imagem moderna. A atriz francesa Isabelle Huppert falou sobre sua abordagem na atuação e a importância da primeira gestualidade no teatro, enquanto a Mostra Internacional de Cinema de São Paulo terá James Gray como um dos principais homenageados, exibindo seu filme 'Tigre de Papel'.", "sociedade": "A incerteza econômica, que limita recursos e atenção para pensar em alternativas, continua afetando a sociedade. No campo da saúde, um novo programa de transparência nos indicadores de desempenho dos hospitais privados visa aumentar a confiança dos pacientes. Em relação à segurança, o Brasil enfrenta um aumento da violência doméstica, com 93,6% das vítimas não registradas oficialmente. A Europa lidera os casos de violência doméstica contra brasileiras no exterior. A sociedade também luta com questões de infraestrutura e segurança, como o incêndio em uma comunidade indígena no Distrito Federal e o roubo de um carro com uma menina de 3 anos como refém em São Paulo. O Nepal continua lutando para resgatar os desaparecidos, com mais de 3 mil pessoas ainda desaparecidas após desastres naturais e humanos. Além disso, a assistência básica é testada em experimentos como o fornecimento de $700 a todos os cidadãos em Kamala, Malawi, que está mostrando resultados positivos para a economia local.", "meio_ambiente": "Um desastre de enxurrada catastrófico na fronteira entre Nepal e Tibet em 26 de agosto causou mais de 600 mortes, destruiu casas, estradas e pontes, e deixou milhares de pessoas desaparecidas, incluindo mais de 500 estrangeiros de mais de 30 países. O Nepal estima que a reconstrução possa custar até US$ 5 bilhões, enquanto o número de desaparecidos aumentou para quase 2.000, incluindo 933 funcionários de centrais hidroelétricas e 622 turistas estrangeiros. As autoridades nepalesas alertaram para o aumento da água que pode complicar os esforços de resgate, enquanto trabalhadores de resgate tentaram evacuar uma rota principal que conecta Katmandu a uma área severamente afetada pelas inundações de quarta-feira. Além disso, o Nepal também emitiu alertas de inundações e trabalhadores de resgate tentaram evacuar uma rota principal que conecta Katmandu a uma área severamente afetada pelas inundações de quarta-feira.", "direitos_humanos": "O direito à vida e à segurança enfrenta desafios significativos em diversos contextos globais, conforme evidenciado por vários eventos recentes. Em primeiro lugar, o Paquistão suspendeu oito funcionários após um incêndio letal em uma unidade materna de um hospital em Islamabad, que resultou na morte de 14 bebês. O relatório preliminar indica que o fogo consumiu a unidade em apenas dois minutos após as 6h30 de quarta-feira, salvo um bebê por uma enfermeira. Em segundo lugar, a situação humanitária na cidade de El Obeid e nos dois acampamentos próximos no Sudão está se agravando, com mais de 15.000 famílias chegando desde julho, de acordo com dados do governo. A Organização das Nações Unidas relata que mais de 200.000 pessoas já haviam fugido no primeiro semestre do ano devido ao conflito entre as Forças Armadas do Sudão e a Milícia Rapid Support Forces (RSF). Em terceiro lugar, a Amnesty International pediu ação após Israel ameaçar expulsar palestinos por voar kites em Gaza, com o ministro de Defesa, Israel Katz, instruindo o exército a expulsar palestinos de áreas onde crianças estão voando kites e liberando balões. Esses eventos ilustram os desafios atuais na proteção dos direitos humanos, especialmente em situações de conflito e emergências humanitárias."}, "resumo_do_dia": {"politica_nacional": [{"id": 133133, "titulo": "A nova biografia de Lacerda, o político genial que atraiu admiração e repulsa", "url": "https://braziljournal.com/a-nova-biografia-de-lacerda-o-politico-genial-que-atraiu-admiracao-e-repulsa/", "fonte_id": "brazil_journal", "data_pub": "2026-08-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor teve a oportunidade de conhecer Carlos Lacerda, político de destaque do século XX, em várias ocasiões, sobretudo por meio de senador Gilberto Marinho e jornalista Helio Fernandes. A biografia recente de Lacerda, que foi um político ambivalentemente admirado e repelido, foi publicada há meio século após sua morte.", "titulo_pt": "A nova biografia de Lacerda, o político genial que atraiu admiração e repulsa", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 133134, "titulo": "OPINIÃO. Para mudar a política, reclamar não é uma estratégia", "url": "https://braziljournal.com/opiniao-para-mudar-a-politica-reclamar-nao-e-uma-estrategia/", "fonte_id": "brazil_journal", "data_pub": "2026-08-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há duas semanas, ouvi uma frase comum: 'eu desisti da política brasileira'. A pessoa que disse isso é bem informada e dirige uma empresa com muitos funcionários.", "titulo_pt": "Para mudar a política, reclamar não é uma estratégia", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 133029, "titulo": "Governo do DF busca empresas para substituir BRB na gestão de pontos turísticos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/governo-do-df-busca-empresas-para-substituir-brb-na-gestao-de-pontos-turisticos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Distrito Federal busca empresas para gerir dois dos principais pontos turísticos de Brasília, atualmente administrados pelo BRB. O anúncio foi feito em 08/30/2026.", "titulo_pt": "Governo do DF procura empresas para gerir pontos turísticos de brasília", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 133187, "titulo": "Dez anos depois, impeachment de Dilma ainda não terminou", "url": "https://www.jota.info/opiniao-e-analise/artigos/dez-anos-depois-impeachment-de-dilma-ainda-nao-terminou", "fonte_id": "jota", "data_pub": "2026-08-30T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O processo de impeachment de Dilma Rousseff iniciado há dez anos ainda não foi concluído. Durante essa década, a legalidade manteve suas formas, mas perdeu parte de sua capacidade de ser entendida como uma linguagem comum na democracia.", "titulo_pt": "Dez anos depois, impeachment de Dilma ainda não terminou", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 133073, "titulo": "Flávio vai interromper campanha para visitar aliado na cadeia", "url": "https://www.metropoles.com/colunas/igor-gadelha/flavio-vai-interromper-campanha-para-visitar-aliado-na-cadeia", "fonte_id": "metropoles", "data_pub": "2026-08-30T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro pretende interromper sua campanha presidencial para visitar Filipe Martins na cadeia duas vezes nesta semana.", "titulo_pt": "Flávio bolsonaro interromperá campanha para visitar aliado na cadeia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133079, "titulo": "Sudeste ganha peso na campanha de Lula e Flávio após pesquisas", "url": "https://www.metropoles.com/brasil/sudeste-ganha-peso-na-campanha-de-lula-e-flavio-apos-pesquisas", "fonte_id": "metropoles", "data_pub": "2026-08-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos intensificaram suas agendas nos estados do Sudeste com o objetivo de melhorar suas posições nas pesquisas de intenção de voto. A região é considerada estratégica para a campanha.", "titulo_pt": "Sudeste ganha peso na campanha de Lula e Flávio após pesquisas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133101, "titulo": "Campanha de Lula tenta conter desgaste após divulgação de fotos com lobista", "url": "https://www.cnnbrasil.com.br/politica/campanha-de-lula-tenta-conter-desgaste-apos-divulgacao-de-fotos-com-lobista/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula tenta contornar o desgaste causado pela divulgação de fotos do ex-presidente com Roberta Luchsinger, uma lobista. Lula negou conhecer a empresária, apesar de existirem mais de dez fotos entre eles.", "titulo_pt": "Campanha de Lula tenta conter desgaste com divulgação de fotos com lobista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133080, "titulo": "Suposto operador de gabinete do ódio em PE recebeu R$ 642 mil do governo", "url": "https://www.metropoles.com/colunas/andreza-matais/operador-gabinete-odio-raquel-lyra-eleicoes-2026-pagamentos-amisadai", "fonte_id": "metropoles", "data_pub": "2026-08-30T07:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa de Amisadai Silva recebeu R$ 642 mil do governo de Pernambuco, obtendo 21% a mais em pagamentos neste ano. Raquel Lyra, do PSD, classificou a denúncia como parte de velhas práticas do PSB.", "titulo_pt": "Suposto operador de gabinete do ódio em PE recebeu R$ 642 mil do governo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133106, "titulo": "TSE deve definir limites para uso de IA em campanhas nesta terça-feira (1º)", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-deve-definir-limites-para-uso-de-ia-em-campanhas-nesta-terca-feira-1o/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) deve definir os limites para o uso de inteligência artificial (IA) em campanhas eleitorais nesta terça-feira (1º). O julgamento pode estabelecer uma tese sobre o uso da tecnologia na propaganda eleitoral, com potencial para orientar outros casos envolvendo IA analisados pela Justiça Eleitoral.", "titulo_pt": "TSE deve definir limites para uso de IA em campanhas nesta terça-feira", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133107, "titulo": "Um terço dos candidatos a governador são “forasteiros” em seus estados", "url": "https://www.cnnbrasil.com.br/eleicoes/um-terco-dos-candidatos-a-governador-sao-forasteiros-em-seus-estados/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terço dos candidatos a governador são nascidos em outros estados, segundo um levantamento. O Distrito Federal tem o maior número de candidatos nascidos fora do estado, com 72%.", "titulo_pt": "Um terço dos candidatos a governador são 'forasteiros' em seus estados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133081, "titulo": "Fundo que recebeu R$ 481 milhões do Rioprevidência alega falta de caixa", "url": "https://www.metropoles.com/colunas/manoela-alcantara/fundo-que-recebeu-r-481-milhoes-do-rioprevidencia-alega-falta-de-caixa", "fonte_id": "metropoles", "data_pub": "2026-08-30T06:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fundo que recebeu R$ 481 milhões do Rioprevidência deixou de pagar R$ 14,8 milhões em taxas cobradas pela gestora dos investimentos, que está sendo investigada pela PF. O fundo, ligado ao Master, não pagou as taxas conforme o contrato.", "titulo_pt": "Fundo que recebeu R$ 481 milhões do Rioprevidência alega falta de caixa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133086, "titulo": "Confira a agenda dos candidatos ao Governo do DF deste domingo (30/8)", "url": "https://www.metropoles.com/distrito-federal/confira-a-agenda-dos-candidatos-ao-governo-do-df-deste-domingo-30-8", "fonte_id": "metropoles", "data_pub": "2026-08-30T05:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos ao Governo do Distrito Federal têm programadas atividades para este domingo (30/8), como caminhadas, carreatas e encontros com apoiadores em diferentes regiões administrativas do DF.", "titulo_pt": "Confira a agenda dos candidatos ao Governo do DF deste domingo (30/8)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133087, "titulo": "Quaest: no DF, 21% dos eleitores de Lula declaram voto em Celina Leão", "url": "https://www.metropoles.com/distrito-federal/quaest-no-df-21-dos-eleitores-de-lula-declaram-voto-em-celina-leao", "fonte_id": "metropoles", "data_pub": "2026-08-30T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Quaest revela que 21% dos eleitores de Lula no Distrito Federal declaram intenção de votar em Celina Leão. Celina aparece empatada com Grass e Arruda entre os eleitores de Lula.", "titulo_pt": "21% Dos eleitores de Lula no DF declaram voto em Celina Leão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133191, "titulo": "Quem são os candidatos a governador do Amapá (AP) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governador-do-amapa-ap-nas-eleicoes-2026-29-agosto", "fonte_id": "jota", "data_pub": "2026-08-30T02:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos a governador do Amapá nas eleições de 2026 incluem Clécio Luís, que disputará a reeleição, e Dr. Furlan, ex-prefeito de Macapá, além de outros três candidatos.", "titulo_pt": "Quem são os candidatos a governador do Amapá nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 133192, "titulo": "Quem são os candidatos a governador de Rondônia (RO) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governador-de-rondonia-ro-nas-eleicoes-2026-29-agosto", "fonte_id": "jota", "data_pub": "2026-08-30T02:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Seis candidatos disputam o cargo de governador de Rondônia nas eleições de 2026. A lista inclui nomes que concorrem à presidência do Palácio Rio Madeira.", "titulo_pt": "Quem são os candidatos a governador de Rondônia nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 133030, "titulo": "A corrupção é e será tema central da campanha eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/08/a-corrupcao-e-e-sera-tema-central-da-campanha-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corrupção é e será um tema central da campanha eleitoral. Este assunto já era relevante em tempos passados, como na época de Lacerda e Juscelino Kubitschek.", "titulo_pt": "A corrupção será tema central da campanha eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 133330, "titulo": "Nepal warns of possible fresh flooding as communities grapple with devastation", "url": "https://www.npr.org/2026/08/30/nx-s1-5949239/nepal-warns-fresh-flooding", "fonte_id": "npr_news", "data_pub": "2026-08-30T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades nepalesas advertiram para a possibilidade de novos alagamentos e pediram para que os residentes nas áreas afetadas pelo rio Bhotekoshi fiquem em alerta, devido ao aumento do nível da água no rio.", "titulo_pt": "Nepal avisa sobre possíveis novos alagamentos", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 133404, "titulo": "Iceland voters reject EU accession talks", "url": "https://www.dw.com/en/iceland-voters-reject-eu-accession-talks/a-78560633?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-30T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os eleitores da Islândia rejeitaram as negociações para aderir à União Europeia em um referendo nacional. Apesar das tensões geopolíticas no Atlântico Norte, não houve apoio suficiente para reiniciar as negociações de adesão.", "titulo_pt": "Eleitores da islândia rejeitam negociações para aderir à ue", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 133443, "titulo": "Giappone, cacciatorpediniere rientra con i Tomahawk Usa a bordo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/30/giappone-cacciatorpediniere-rientra-con-i-tomahawk-usa-a-bordo_a4049869-68fa-40f8-aefa-345c30d87725.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-30T09:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um navio de guerra japonês retornou ao porto com mísseis Tomahawk dos Estados Unidos a bordo. A mudança na postura permitirá que o Japão ataque bases inimigas.", "titulo_pt": "Japão, navio de guerra retorna com míssegl Tomahawk a bordo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 133435, "titulo": "Iceland rejects reopening talks on EU entry", "url": "https://www.ft.com/content/53b5abd8-2919-4dc6-8dd6-81fc054e8b6f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-30T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os icelândicos rejeitaram as negociações para reabrir a possibilidade de adesão à União Europeia em um referendo apertado, desencadeado pelas ameaças de Donald Trump sobre a anexação do Groenlândia.", "titulo_pt": "Icelando rejeita reabrir negociações para entrada na ue", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 133410, "titulo": "Araghchi calls for accountability over US use of Japan's airbase to attack Iran", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/araghchi-calls-accountability-over-us-use-japans-airbase-attack-iran", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores do Irã, Abbas Araghchi, pediu responsabilização ao público japonês em relação ao uso de uma base aérea no Japão por forças armadas dos Estados Unidos durante operações contra o Irã. Segundo relatos, jatos F-16 da Força Aérea dos EUA, deslocados do Base Aérea de Misawa, participaram dessas operações.", "titulo_pt": "Araghchi pede responsabilização pelo uso de base japonesa por EUA em operações contra o Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133379, "titulo": "The home front: How Israel, Iran, and US leaders have been hit by the war", "url": "https://www.aljazeera.com/news/2026/8/30/the-home-front-how-israel-iran-and-us-leaders-have-been-hit-by-the-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Six meses após o início da guerra entre os Estados Unidos e Israel contra a Irã, os governos dos três países estão enfrentando batalhas políticas internas.", "titulo_pt": "O front doméstico: como os governos de Israel, Irã e estados unidos lidam com a guerra", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 133353, "titulo": "🔴 Iceland rejects restarting EU accession talks in referendum", "url": "https://www.france24.com/en/europe/20260830-iceland-rejects-restarting-eu-accession-talks-in-referendum", "fonte_id": "france24", "data_pub": "2026-08-30T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cidadãos da Islândia rejeitaram, em referendo, a possibilidade de retomar as negociações de adesão à União Europeia.", "titulo_pt": "Islândia rejeita reabertura de negociações de adesão à ue em referendo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 133354, "titulo": "Harry Potter: Versailles turns into wizarding school for a day", "url": "https://www.france24.com/en/video/20260830-harry-potter-versailles-turns-into-wizarding-school-for-a-day", "fonte_id": "france24", "data_pub": "2026-08-30T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi comemorado o aniversário de 25 anos do lançamento do primeiro filme do Harry Potter com uma reunião especial em Versalhes, França. O palácio foi transformado momentaneamente em Hogwarts, a escola de magia e bruxaria do universo Harry Potter.", "titulo_pt": "Harry Potter: versalhes se transforma em escola de magia por um dia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 133381, "titulo": "Nepal-China flood disaster: What’s the latest toll, how many are missing?", "url": "https://www.aljazeera.com/news/2026/8/30/nepal-china-flood-disaster-whats-the-latest-toll-how-many-are-missing?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 3.000 pessoas permanecem desaparecidas após o colapso de um glaciar que gerou inundações devastadoras perto da fronteira entre China e Nepal. A situação continua crítica, com muitos ainda não localizados.", "titulo_pt": "Desastre de inundações por colapso de geleira na fronteira nepal-china: quantos desaparecidos?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 133346, "titulo": "Russian strike kills 38 near Kyiv, raising concerns over Ukrainian sensitive urban sites", "url": "https://www.lemonde.fr/en/international/article/2026/08/30/russian-strike-kills-38-near-kyiv-raising-concerns-over-ukrainian-sensitive-urban-sites_6756984_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-30T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque que visou um depósito de munições na zona urbana de Kiev, capital da Ucrânia, resultou em 38 mortes, sendo um dos ataques mais letais na região desde o início da invasão russa.", "titulo_pt": "Ataque russo mata 38 perto de kiev, aumentando preocupações sobre áreas sensíveis urbanas da Ucrânia", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 133355, "titulo": "Nepal: Glacial collapse leaves 3,000 missing", "url": "https://www.france24.com/en/nepal-glacial-collapse-leaves-3-000-missing", "fonte_id": "france24", "data_pub": "2026-08-30T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As operações de resgate e assistência em Nepal e Tibet foram atrasadas neste domingo devido a chuvas intensas e níveis crescentes dos rios. O número de mortos subiu para 750, enquanto mais de 3.000 pessoas permanecem desaparecidas. As autoridades de desastres de Nepal estão pedindo cautela aos equipes de resgate devido a condições climáticas ruins, rios cheios e o risco de novos alagamentos.", "titulo_pt": "Nepal: colapso glacial deixa 3.000 desaparecidos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 133339, "titulo": "Manhunt after shooting at Swiss rave kills woman, 22, and injures five", "url": "https://www.bbc.co.uk/news/articles/c9qr750je1go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-30T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 22 anos foi morta e cinco outras pessoas, na faixa dos 20 anos, foram feridas após disparos em uma rave em Aarau, perto de Zurique, na noite anterior.", "titulo_pt": "Busca após tiroteio em rave na Suíça mata mulher e feri cinco pessoas", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 133356, "titulo": "Gunman kills one at Swiss rave party", "url": "https://www.france24.com/en/gunman-kills-one-at-swiss-rave-party", "fonte_id": "france24", "data_pub": "2026-08-30T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tiroteio ocorreu em uma rave party na cidade de Aarau, Suíça, deixando uma pessoa morta e outras cinco feridas. A polícia está investigando o incidente e pede para que possíveis testemunhas compartilhem fotos ou vídeos com os investigadores.", "titulo_pt": "Assassino mata uma pessoa em rave na Suíça", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [{"titulo": "Islândia rejeita proposta de retomar negociações para ingressar na ue", "sumario": "Os eleitores da Islândia rejeitaram, por 52,8% dos votos, a proposta do governo de retomar as negociações para adesão à União Europeia. O 'Não' venceu em 52,8% dos votos no referendo islandês. A Islândia rejeitou neste sábado retomar as negociações de adesão com a União Europeia.", "artigos": [{"id": 133340, "titulo": "Iceland votes against restarting talks on joining EU", "url": "https://www.bbc.co.uk/news/articles/c70le8ed1plo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-30T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os eleitores da Islândia rejeitaram, por 52,8% dos votos, a proposta do governo de retomar as negociações para adesão à União Europeia.", "titulo_pt": "Islândia rejeita proposta de retomar negociações para ingressar na ue", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 133444, "titulo": "Referendum Islanda, il 52,8% dice no ai negoziati con l'Ue", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/30/referendum-islanda-il-528-dice-no-ai-negoziati-con-lue_a86dfc35-6e71-4be4-8479-d0750cc1f821.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-30T09:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O 'Não' venceu em 52,8% dos votos no referendo islandês. Só o 'Sim' prevaleceu nos dois distritos da capital Reykjavík.", "titulo_pt": "Referendo na islândia: 52,8% rejeitam negociações com a união europeia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 133049, "titulo": "Islândia recusa retomar negociações com a União Europeia, diz TV", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/islandia-recusa-retomar-negociacoes-com-a-uniao-europeia-diz-tv.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-30T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Islândia rejeitou neste sábado retomar as negociações de adesão com a União Europeia. O resultado final, que já não pode ser alterado, deve ser divulgado nas próximas horas.", "titulo_pt": "Islândia rejeita retomar negociações com a União Europeia", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}]}], "economia": [{"id": 133126, "titulo": "Na corrida da IA, o contexto dos arquivos ganha espaço na disputa entre ferramentas", "url": "https://www.infomoney.com.br/carreira/ia-no-trabalho-e-contexo-de-ferramentas/", "fonte_id": "infomoney", "data_pub": "2026-08-30T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Modelos de inteligência artificial estão se tornando cada vez mais semelhantes em termos de capacidade, mas o acesso a arquivos, documentos e contexto pode ter um impacto significativo na produtividade nas empresas. O acesso a esses elementos está ganhando importância na disputa entre diferentes ferramentas de IA.", "titulo_pt": "Na corrida da IA, o contexto dos arquivos ganha espaço na disputa entre ferramentas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133186, "titulo": "STJ: contribuinte que recolheu ICMS sobre TUSD/TUST não pode pedir restituição", "url": "https://www.jota.info/tributos/stj-contribuinte-que-recolheu-icms-sobre-tusd-tust-nao-pode-pedir-restituicao", "fonte_id": "jota", "data_pub": "2026-08-30T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STJ decidiu que um contribuinte que recolheu ICMS sobre TUSD/TUST não tem direito à restituição do imposto, mesmo que modulação de divergência proteja os efeitos de decisões favoráveis.", "titulo_pt": "STJ: contribuinte que recolheu ICMS sobre TUSD/TUST não pode pedir restituição", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 133141, "titulo": "O plano bilionário da China para fazer uma nova revolução industrial com milhões de robôs", "url": "https://www.bbc.com/portuguese/articles/c9w4j2555qro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-30T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo chinês está investindo 20 bilhões de dólares para levar o país à liderança na inovação robótica industrial e competir com os Estados Unidos.", "titulo_pt": "Plano bilionário da China para liderar a inovação robótica industrial e concorrer com os EUA", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 133021, "titulo": "Acordo da Meta frustra quem esperava desfecho similar ao vivido pela indústria do tabaco", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/acordo-da-meta-frustra-quem-esperava-desfecho-similar-ao-vivido-pela-industria-do-tabaco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta, proprietária do Facebook e do Instagram, enfrenta um julgamento em tribunal federal por cerca de 47 estados que acusam a empresa de promover produtos viciantes e prejudiciais para jovens. O processo é comparado ao enfrentado pela indústria do tabaco.", "titulo_pt": "Acordo da Meta frustra quem esperava desfecho semelhante ao vivido pela indústria do tabaco", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 133127, "titulo": "Vale (VALE3) quer avançar em terras raras? Entenda os planos da empresa", "url": "https://www.infomoney.com.br/mercados/vale-vale3-quer-avancar-em-terras-raras-entenda-os-planos-da-empresa/", "fonte_id": "infomoney", "data_pub": "2026-08-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vale não inclui a exploração de minerais no seu plano atual, mas pode se interessar por terras raras através da mineração circular. O post original do InfoMoney explica os planos da empresa em relação a esses recursos.", "titulo_pt": "Vale (VALE3) quer avançar em terras raras? Entenda os planos da empresa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133486, "titulo": "How China’s liquor heartland traded old spirits for new energy", "url": "https://www.scmp.com/economy/china-economy/article/3365655/how-chinas-liquor-heartland-traded-old-spirits-new-energy?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wuliangye é a segunda maior produtora de licor na China, mas a cidade de Yibin, na província de Sichuan, tem ficado em segundo plano. Durante uma viagem de imprensa recente para Yibin, os organizadores precisaram explicar a localização da cidade, que está escondida nas montanhas ocidentais da China.", "titulo_pt": "Como a região de bebidas da China trocou espíritos antigos por novas fontes de energia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133128, "titulo": "Copacabana Palace: após 103 anos, hotel ganha nova ala com suítes de R$ 30 mil", "url": "https://www.infomoney.com.br/business/copacabana-palace-apos-103-anos-hotel-ganha-nova-ala-com-suites-de-r-30-mil/", "fonte_id": "infomoney", "data_pub": "2026-08-30T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Copacabana Palace, após 103 anos, recebeu uma nova ala com suítes que custam R$ 30 mil cada. A reforma do antigo anexo dos anos 1940 aumentou a capacidade total do hotel para 208 quartos e suítes, com a inauguração prevista para novembro.", "titulo_pt": "Copacabana Palace: após 103 anos, hotel ganha nova ala com suítes de R$ 30 mil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133189, "titulo": "A governança transversal como DNA da resiliência nas organizações modernas", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-governanca-transversal-como-dna-da-resiliencia-nas-organizacoes-modernas", "fonte_id": "jota", "data_pub": "2026-08-30T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em tempos de imprevisibilidade, decisões integradas entre áreas se tornam o diferencial competitivo das empresas. A governança transversal é considerada o DNA da resiliência nas organizações modernas.", "titulo_pt": "A governança transversal como DNA da resiliência nas organizações modernas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 133190, "titulo": "Serviço, risco e regulação no Marco Civil da Internet", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-concorrencia-regulacao/servico-risco-e-regulacao-no-marco-civil-da-internet", "fonte_id": "jota", "data_pub": "2026-08-30T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ANPD pode ajustar as obrigações de acordo com as funções e riscos específicos de cada serviço na internet.", "titulo_pt": "Regulação e obrigações da anpd baseadas nas funções e riscos dos serviços na Internet", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 133074, "titulo": "Índia busca ampliar comércio com Brasil para alcançar meta bilionária", "url": "https://www.metropoles.com/mundo/india-busca-ampliar-comercio-com-brasil-para-alcancar-meta-bilionaria", "fonte_id": "metropoles", "data_pub": "2026-08-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brasil e Índia buscam atingir a marca de 20 bilhões de dólares no comércio bilateral até 2030. Ambos os países estão buscando expandir suas relações comerciais para alcançar essa meta.", "titulo_pt": "Índia busca ampliar comércio com Brasil para alcançar meta bilionária", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133078, "titulo": "Fortuna de Musk supera PIB de 11 países da América do Sul, exceto do Brasil", "url": "https://www.metropoles.com/brasil/fortuna-de-musk-supera-pib-de-11-paises-da-america-do-sul-exceto-do-brasil", "fonte_id": "metropoles", "data_pub": "2026-08-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Elon Musk, dono da Tesla e do X, possui uma fortuna que excede o Produto Interno Bruto (PIB) de 11 países da América do Sul, exceto do Brasil. Seu patrimônio líquido de US$ 870 bilhões é maior que o PIB da Argentina.", "titulo_pt": "Fortuna de Musk supera PIB de 11 países da América do Sul, exceto do Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133103, "titulo": "Dívida dos EUA supera US$ 40 trilhões — mas quanto valem US$ 40 trilhões?", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/divida-dos-eua-supera-us-40-trilhoes-mas-quanto-valem-us-40-trilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dívida dos Estados Unidos ultrapassou os 40 trilhões de dólares, com o endividamento do país crescendo aproximadamente 7 bilhões de dólares por dia. Este montante equivale a mais de 117 mil dólares por habitante americano.", "titulo_pt": "Dívida dos EUA supera 40 trilhões de dólares", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133104, "titulo": "Agosto caminha para mês com menor participação estrangeira na Bolsa em 2026", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/agosto-caminha-para-mes-com-menor-participacao-estrangeira-na-bolsa-em-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação de investidores estrangeiros na Bolsa de Valores no mês de agosto de 2026 está diminuindo devido a preocupações fiscais, desaceleração econômica e expectativa de aumento dos juros nos Estados Unidos.", "titulo_pt": "Agosto registra menor participação estrangeira na Bolsa em 2026", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133430, "titulo": "What’s the fiscal hit from higher yields?", "url": "https://www.ft.com/content/63311687-676b-4548-9bd8-3d7ad96d7ce5", "fonte_id": "financial_times", "data_pub": "2026-08-30T04:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute o impacto financeiro das taxas de juros mais altas. Ele explora as consequências econômicas de um aumento nas taxas de juros, focando na dimensão financeira deste fenômeno.", "titulo_pt": "Qual é o impacto fiscal das taxas de juros mais altas?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 133130, "titulo": "Justiça passa a ter sistema único digital para penhora e arresto de imóveis", "url": "https://www.infomoney.com.br/brasil/justica-passa-a-ter-sistema-unico-digital-para-penhora-e-arresto-de-imoveis/", "fonte_id": "infomoney", "data_pub": "2026-08-30T04:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema digital único para penhora e arresto de imóveis passa a ser obrigatório em todos os tribunais e cartórios do país. Ordens de sequestro de bens também serão processadas pela nova plataforma.", "titulo_pt": "Justiça adota sistema único digital para penhora e arresto de imóveis", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133429, "titulo": "Rising bond yields add tens of billions to G7 countries’ debt costs", "url": "https://www.ft.com/content/bbe90db5-64ac-441d-87e4-e984c5ef8629?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-30T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os países do G7 estão enfrentando custos de dívida adicionais bilionários devido a uma elevação nas taxas de juros desde o início da guerra entre Estados Unidos e Irã, o que está pesando nas finanças públicas.", "titulo_pt": "Aumento das taxas de juros eleva custos da dívida em bilhões para os países do G7", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 133132, "titulo": "OPINIÃO. AI é para ‘automation’ ou ‘augmentation’? O que aprendi em Stanford", "url": "https://braziljournal.com/opiniao-ai-e-para-automation-ou-augmentation-o-que-aprendi-em-stanford/", "fonte_id": "brazil_journal", "data_pub": "2026-08-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor passou seis semanas na escola de negócios de Stanford, onde teve uma aula do professor Rob Reich sobre inteligência artificial e o futuro do trabalho.", "titulo_pt": "AI é para ‘automação’ ou ‘augmentação’? O que aprendi em Stanford", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 133135, "titulo": "OPINIÃO. Os limites éticos da AI – de Platão e Goethe a Sam Altman", "url": "https://braziljournal.com/opiniao-os-limites-eticos-da-ai-de-platao-e-goethe-a-sam-altman/", "fonte_id": "brazil_journal", "data_pub": "2026-08-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A máquina mais inteligente que o homem não permitirá retrocesso. Para definir os limites éticos da inteligência artificial, pode-se buscar reflexões antigos, como as do mito de Giges e Platão.", "titulo_pt": "OPINIÃO. Os limites éticos da IA – de Platão a Sam Altman", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 133483, "titulo": "CXMT joins growing list of Chinese tech firms suing US Pentagon over blacklists", "url": "https://www.scmp.com/tech/big-tech/article/3365751/cxmt-joins-growing-list-chinese-tech-firms-suing-us-pentagon-over-blacklists?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de chips ChangXin Memory Technologies (CXMT) ingressou na crescente lista de empresas tecnológicas chinesas que estão processando o governo dos Estados Unidos por sua inclusão em listas negras do Pentágono. Decisões recentes envolvendo outras empresas tecnológicas chinesas, como a fabricante de sensores lidar Hesai Group, a fabricante de drones DJI e a empresa de biotecnologia WuXi AppTec, sugerem que os juízes estão dispostos a examinar as evidências apresentadas pelo governo americano.", "titulo_pt": "CXMT se junta a lista crescente de empresas tecnológicas chinesas que processam o pentágono dos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133510, "titulo": "Scientists Create the Littlest Big Bang to Study the Universe's Origins", "url": "https://www.wired.com/story/scientists-create-littlest-big-bang-to-study-universe-origins/", "fonte_id": "wired", "data_pub": "2026-08-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas criaram um microbig-bang para estudar as origens do universo. A descoberta redefine o tamanho necessário dos átomos para produzir o estado extremo de matéria encontrado no início do universo.", "titulo_pt": "Cientistas criam microbig-bang para estudar origens do universo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 133489, "titulo": "Not a token effort: beer meets artificial intelligence at bar in China’s capital", "url": "https://www.scmp.com/tech/tech-trends/article/3365740/not-token-effort-beer-meets-artificial-intelligence-bar-chinas-capital?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bar em Beijing, China, está utilizando inteligência artificial para atrair clientes, oferecendo acesso ilimitado a modelos de IA. Os frequentadores podem configurar um agente de IA para acessar tokens gratuitos fornecidos pelo estabelecimento.", "titulo_pt": "Não é um esforço superficial: cerveja e inteligência artificial se encontram em bar de beijing", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133514, "titulo": "What Seoul wants its smart-city initiative to fix first", "url": "https://www.koreaherald.com/article/10856529", "fonte_id": "korea_herald", "data_pub": "2026-08-30T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes de Seul consideram o congestionamento de tráfego, o crime noturno e a poluição de poeira fina como os principais problemas que gostariam de ver resolvidos com a ajuda da tecnologia. Essa é a conclusão de uma pesquisa realizada em fevereiro de 2025 com 8.531 pessoas da cidade.", "titulo_pt": "O que seul quer que a iniciativa de cidade inteligente resolva primeiro", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 133119, "titulo": "O erro de digitação que muda completamente a resposta de uma IA (e quase ninguém percebe)", "url": "https://exame.com/inteligencia-artificial/o-erro-de-digitacao-que-muda-completamente-a-resposta-de-uma-ia-e-quase-ninguem-percebe/", "fonte_id": "exame", "data_pub": "2026-08-30T06:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um erro de digitação ou uma informação ambígua pode modificar significativamente a resposta de uma inteligência artificial. Essa mudança não é percebida por grande parte das pessoas.", "titulo_pt": "O erro de digitação que muda completamente a resposta de uma IA (e quase ninguém percebe)", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 133527, "titulo": "YMTC to boost NAND output as Korean rivals hold back", "url": "https://www.koreaherald.com/article/10856454", "fonte_id": "korea_herald", "data_pub": "2026-08-30T05:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Yangtze Memory Technologies, da China, planeja aumentar a produção de wafers NAND em cerca de 25% no próximo ano para se aproximar de seus rivais coreanos, cujas expansões significativas não estão previstas até 2028. Segundo a Omdia, a produção anual de NAND da YMTC deve aumentar para 2,50 milhões de wafers em 2027, de 2,01 milhões este ano.", "titulo_pt": "YMTC planeja aumentar produção de NAND enquanto rivais coreanos se mantêm estáticos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 133121, "titulo": "A IA está fazendo o trabalho dos iniciantes? O risco para quem está começando a carreira", "url": "https://exame.com/inteligencia-artificial/a-ia-esta-fazendo-o-trabalho-dos-iniciantes-o-risco-para-quem-esta-comecando-a-carreira/", "fonte_id": "exame", "data_pub": "2026-08-30T05:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atividades tradicionalmente utilizadas para introduzir jovens profissionais na carreira podem agora ser automatizadas ou aceleradas por ferramentas de inteligência artificial. Isso levanta preocupações sobre como as empresas vão formar novos talentos.", "titulo_pt": "IA está fazendo o trabalho dos iniciantes? O risco para quem está começando a carreira", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 133546, "titulo": "Samsung Electronics, SK hynix's corporate tax tops 11 tln won in H1", "url": "https://en.yna.co.kr/view/AEN20260830001800320", "fonte_id": "yonhap_news", "data_pub": "2026-08-30T03:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas Samsung Electronics e SK hynix pagaram impostos corporativos no valor superior a 11 trilhões de wones no primeiro semestre de 2023.", "titulo_pt": "Impostos corporativos de samsung Electronics e SK hynix superam 11 trilhões de wones no primeiro semestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 133507, "titulo": "Shinkong Synthetic Fibers eyes cautious 2H26 on higher-value, recycled materials", "url": "https://www.digitimes.com/news/a20260828PD200/materials-ssfc-business-2026-disruption.html", "fonte_id": "digitimes", "data_pub": "2026-08-29T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shinkong Synthetic Fibers Corporation está cautelosamente otimista sobre as operações no segundo semestre de 2026, esperando apoio da vantagem tarifária dos EUA, novos produtos de maior valor, materiais reciclados, aplicações de IA e investimentos diversificados.", "titulo_pt": "Shinkong Synthetic Fibers cautelosamente otimista para o segundo semestre de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 133508, "titulo": "China writes its first national liquid-cooling standard as AI racks approach 1MW", "url": "https://www.digitimes.com/news/a20260828VL206/cooling-nvidia-rubin-infrastructure-data-center.html", "fonte_id": "digitimes", "data_pub": "2026-08-29T23:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China estabeleceu seu primeiro padrão nacional de resfriamento líquido, em resposta à aproximação de racks de inteligência artificial (IA) com potência próxima a 1MW. O aumento da potência das GPUs, especialmente com a geração Vera Rubin da Nvidia, está levando a mudanças paralelas no resfriamento, na distribuição de energia e no design de centrais de dados.", "titulo_pt": "China estabelece primeiro padrão nacional de resfriamento líquido para racks de IA próximos a 1MW", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 133509, "titulo": "Humanoid robot shipments top 22,000 in 1H26 as industrial use gains ground", "url": "https://www.digitimes.com/news/a20260828VL213/robot-industrial-shipments-data-expansion.html", "fonte_id": "digitimes", "data_pub": "2026-08-29T23:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de robôs humanoidas superaram 22.000 unidades no primeiro semestre de 2026, refletindo o crescimento da utilização industrial. A inteligência incorporada está tomando forma física, à medida que a capacidade de produção nesse setor expande, tornando-se cada vez mais possível visualizar uma sociedade onde a linha entre a inteligência humana e a atividade mecânica se torna gradualmente menos distinta com o avanço da IA.", "titulo_pt": "Exportações de robôs humanoidas superam 22.000 unidades no primeiro semestre de 2026, com uso industrial em ascensão", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 133140, "titulo": "Quanto ganha um motorista de Uber em São Paulo e outras capitais?", "url": "https://canaltech.com.br/carros/quanto-ganha-um-motorista-de-uber-em-sao-paulo-e-outras-capitais/", "fonte_id": "canaltech", "data_pub": "2026-08-29T22:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trabalhar como motorista de aplicativo em 2026 continua sendo uma opção de renda principal ou complementar, mas os ganhos variam dependendo de vários fatores, como o tempo de jornada, a cidade, a demanda, o tipo de viagem e os custos de manutenção do veículo. A Uber afirma que os rendimentos são dinâmicos e dependem do momento, local e frequência de uso do veículo pelo motorista.", "titulo_pt": "Quanto ganha um motorista de Uber em São Paulo e outras capitais?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132808, "titulo": "Por que só Android e iOS dominam os sistemas para celulares?", "url": "https://canaltech.com.br/apps/por-que-so-android-e-ios-dominam-os-sistemas-para-celulares/", "fonte_id": "canaltech", "data_pub": "2026-08-29T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de sistemas operacionais para celulares é dominado por Android e iOS, enquanto outras opções, como o sistema operacional da Microsoft, não conseguiram se estabelecer com sucesso. A disponibilidade de aplicativos é um fator crucial nesse domínio.", "titulo_pt": "Por que só Android e ios dominam os sistemas para celulares?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 132800, "titulo": "Gigantes da música acusam Anthropic de pirataria para treinar IA", "url": "https://olhardigital.com.br/2026/08/29/inteligencia-artificial/gigantes-da-musica-acusam-anthropic-de-pirataria-para-treinar-ia/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sony Music e a Warner Music ingressaram com uma ação judicial contra a Anthropic, acusando-a de pirataria no treinamento de inteligência artificial.", "titulo_pt": "Gigantes da música acusam Anthropic de pirataria para treinar IA", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 133345, "titulo": "Roman, NASA's new space telescope, sets out to search for dark energy and exoplanets", "url": "https://www.lemonde.fr/en/science/article/2026/08/30/roman-nasa-s-new-space-telescope-sets-out-to-search-for-dark-energy-and-exoplanets_6756983_10.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-30T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O telescópio Roman, da NASA, está programado para ser lançado neste domingo a bordo de um foguete SpaceX do Cabo Canaveral, Flórida, sendo a missão científica mais ambiciosa da agência americana desde a Telescópio Webb em 2021.", "titulo_pt": "Roman, o novo telescópio espacial da NASA, em busca de energia escura e exoplanetas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 133048, "titulo": "'Precisamos nos arriscar mais na ciência', diz Hugo Aguilaniu, que se prepara para deixar o Serrapilheira", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/precisamos-nos-arriscar-mais-na-ciencia-diz-hugo-aguilaniu-que-se-prepara-para-deixar-o-serrapilheira.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ciência brasileira ainda não se arrisca o suficiente, segundo Hugo Aguilaniu. Isso ocorre porque as agências de fomento não avaliam corretamente projetos com potencial de falhar.", "titulo_pt": "Nós precisamos nos arriscar mais na ciência, afirma Hugo Aguilaniu", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 133558, "titulo": "Scientists melted a diamond and cracked a secret of ice giants", "url": "https://phys.org/news/2026-08-scientists-diamond-secret-ice-giants.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas derreteram diamantes pela primeira vez para recriar o processo que acredita-se criar a precipitação de diamantes nos interiores de gigantes de gelo como Netuno e Urano. Este fenômeno é considerado uma das condições meteorológicas mais estranhas do sistema solar.", "titulo_pt": "Cientistas derreteram diamantes para desvendar o segredo dos gigantes de gelo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 133471, "titulo": "Myopia prevention in Japan reaches a milestone", "url": "https://www.japantimes.co.jp/commentary/2026/08/30/japan/children-myopia-policy/", "fonte_id": "japan_times", "data_pub": "2026-08-30T00:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A política básica do Japão inclui pela primeira vez uma menção sobre a prevenção da miopia infantil. Embora seja um passo importante, ainda há muito trabalho a ser feito.", "titulo_pt": "Prevenção da miopia em crianças atinge marco no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 133573, "titulo": "NASA's Roman Space Telescope is ready for launch aboard SpaceX Falcon Heavy rocket", "url": "https://www.space.com/space-exploration/launches-spacecraft/nasas-roman-space-telescope-is-ready-for-launch-aboard-spacex-falcon-heavy-rocket", "fonte_id": "space_com", "data_pub": "2026-08-29T22:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nave espacial Nancy Grace Roman Space Telescope está prestes a ser lançada no dia 30 de agosto a bordo do foguete SpaceX Falcon Heavy. Este telescópio orbital visa iniciar uma nova era de descobertas astronômicas.", "titulo_pt": "Telescópio espacial nancy grace Roman está pronto para o lançamento no Falcon Heavy", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132850, "titulo": "Los especialistas en neurología coinciden: no sirven las siestas prolongadas para compensar deudas de sueño", "url": "https://www.lanacion.com.ar/sociedad/los-especialistas-en-neurologia-coinciden-no-sirven-las-siestas-prolongadas-para-compensar-deudas-de-nid29082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-29T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Especialistas em neurologia concordam que as siestas prolongadas não compensam as deudas de sono. Pablo Ferrero, um neurólogo, detalhou aspectos importantes para otimizar o descanso, incluindo a escolha do equipamento e hábitos noturnos necessários.", "titulo_pt": "Especialistas em neurologia concordam: siestas prolongadas não compensam deudas de sono", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 133009, "titulo": "Strategic irrigation stress can lift lucerne seed yield and returns", "url": "https://phys.org/news/2026-08-strategic-irrigation-stress-lucerne-seed.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cultivo de sementes de lucerne não necessariamente produz mais se receber mais água. Um experimento de cinco anos, realizado perto de Keith, no Sul da Austrália, mostrou que adiar estratégicamente a irrigação até que as plantas mostrassem sinais precoces de caída das folhas geralmente aumentou a produção de sementes e forneceu a maior margem bruta constante.", "titulo_pt": "Irrigação estratégica pode aumentar a produção de sementes de lucerne e lucratividade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132746, "titulo": "Especialistas no Chile alertam que geleiras dos Andes podem repetir Nepal", "url": "https://www.cnnbrasil.com.br/internacional/especialistas-no-chile-alertam-que-geleiras-dos-andes-podem-repetir-nepal/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas chilenos alertam que geleiras dos Andes podem sofrer um destino semelhante ao que afetou geleiras no Nepal. Pesquisadores recomendam um monitoramento mais rigoroso de áreas montanhosas, utilizando observações por satélite, drones, estações meteorológicas e modelos hidrodinâmicos.", "titulo_pt": "Especialistas no Chile alertam que geleiras dos Andes podem repetir Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133010, "titulo": "Airborne tuberculosis bacteria may mutate as they dry, revealing a target to curb drug resistance", "url": "https://phys.org/news/2026-08-airborne-tuberculosis-bacteria-mutate-dry.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tuberculócitos expelidos no ar dos indivíduos infectados seca e forma partículas infecciosas, sendo apenas superadas pela varicela em contagiosidade. Estudos realizados por investigadores da Weill Cornell Medicine descobriram mecanismos específicos que permitem que os tuberculócitos não apenas sobrevivam à secagem, mas também gerem mutações relacionadas à resistência antimicrobiana, sugerindo que a transmissão envolve mais do que o simples movimento passivo de bactérias entre pessoas e pode ser um período durante o qual o patógeno evolui.", "titulo_pt": "Bactérias de tuberculose no ar podem mutar à medida que secam, indicando um alvo para combater a resistência a medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132747, "titulo": "‘Supermachos’ são criados por cientistas para combater espécie invasora de peixe", "url": "https://www.cnnbrasil.com.br/ciencia/supermachos-sao-criados-por-cientistas-para-combater-especie-invasora-de-peixe/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas criaram trutas-das-fontes que são todos machos, com o objetivo de combater uma espécie invasora de peixe. A população resultante será composta apenas por machos idosos, incapazes de se reproduzir.", "titulo_pt": "Supermachos de truta são criados para combater espécie invasora de peixe", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132621, "titulo": "How everyday household tasks impact relationships", "url": "https://phys.org/news/2026-08-everyday-household-tasks-impact-relationships.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade de Queensland examinou os impactos das tarefas domésticas no bem-estar das relações casais, considerando os carregamentos físico, cognitivo e emocional associados à administração da casa. O estudo analisou o que é chamado de 'tri-load' doméstico, que inclui tarefas físicas, cognitivas e emocionais.", "titulo_pt": "Como tarefas domésticas diárias afetam as relações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132622, "titulo": "Most people would sacrifice some life satisfaction in exchange for a more equal society", "url": "https://phys.org/news/2026-08-people-sacrifice-life-satisfaction-exchange.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa questiona qual tipo de sociedade as pessoas prefeririam viver, uma igualitária com baixo padrão de vida geral ou uma desigual com maioria prosperando, mas minoria em dificuldades. Ela sugere uma escolha entre sociedades antes do nascimento sem conhecimento do próprio destino.", "titulo_pt": "A maioria sacrificaria algum nível de satisfação pessoal por uma sociedade mais igualitária", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132623, "titulo": "How plastic welds retain a molecular 'memory' of their former surfaces to strengthen pipe joints", "url": "https://phys.org/news/2026-08-plastic-welds-retain-molecular-memory.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A soldagem de plástico é uma parte crucial da engenharia diária, especialmente para evitar vazamentos em tubos subterrâneos de água e gás. A razão pela qual as juntas soldadas de tubos de polietileno podem ser tão fortes quanto o próprio tubo ou até mais forte permanece um mistério por décadas.", "titulo_pt": "Como soldas de plástico mantêm uma 'memória' molecular das superfícies antigas para fortalecer as junções de tubos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132624, "titulo": "A never-before-seen picture of eagle migrations", "url": "https://phys.org/news/2026-08-picture-eagle-migrations.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1899, os cientistas começaram a rastrear a migração de aves colocando anéis identificadores nos tornozelos das aves, mas os percursos entre os pontos de captura permaneciam desconhecidos. Hoje, os rastreadores GPS permitem que os pesquisadores vejam todos os estágios da migração de aves, transformando a migração de uma descrição teórica em um mapa exato. No entanto, muitos caminhos das espécies em suas respectivas rotas de migração ainda não foram descritos.", "titulo_pt": "Imagem inédita da migração de águias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132625, "titulo": "Takeaway cups may be releasing microplastics into your coffee", "url": "https://phys.org/news/2026-08-takeaway-cups-microplastics-coffee.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Queensland descobriram que os copos de papel usados para bebidas de takeout, quando expostos a líquidos quentes, liberam milhões de partículas de microplástico.", "titulo_pt": "Garrafas descartáveis podem liberar microplásticos no seu café", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132796, "titulo": "Eleições 2026: MP pede bloqueio de mais de 900 candidaturas e SP lidera pedidos", "url": "https://exame.com/brasil/eleicoes-2026-mp-pede-bloqueio-de-mais-de-900-candidaturas-e-sp-lidera-pedidos/", "fonte_id": "exame", "data_pub": "2026-08-29T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público pediu o bloqueio de mais de 900 candidaturas para as eleições de 2026, com mais de 70% dos pedidos voltados para candidatos a deputado estadual e federal. Condenações e irregularidades nas contas são alguns dos motivos para esses pedidos.", "titulo_pt": "Eleições 2026: MP pede bloqueio de mais de 900 candidaturas e SP lidera pedidos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 133275, "titulo": "Definitely no or maybe yes: what tipped the Icelandic referendum | Miranda Bryant", "url": "https://www.theguardian.com/world/2026/aug/30/definitely-no-or-maybe-yes-what-tipped-the-icelandic-referendum", "fonte_id": "guardian_world", "data_pub": "2026-08-30T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A campanha contra (não) a reiniciação das negociações com a União Europeia estava bem financiada e acusava oponentes de espalhar pânico. No entanto, a formulação da pergunta do referendo também pode ter influenciado os resultados. O resultado final mostrou uma divisão significativa na opinião pública islandesa, com a campanha contrária obtendo cerca de 52,8% dos votos.", "titulo_pt": "Definitivamente não ou talvez sim: o que influenciou o referendo islandês", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133169, "titulo": "Cuando el oro inca iba a financiar las guerras religiosas en Europa", "url": "https://www.clarin.com/viva/oro-inca-iba-financiar-guerras-religiosas-europa_0_GbuYTM29rK.html", "fonte_id": "clarin", "data_pub": "2026-08-30T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 1533, o rei Carlos I da Espanha recebeu um botim proveniente do sequestro do inca Atahualpa e dos saqueos cometidos na América. Esses recursos foram gastos nas chamadas 'guerras de religião'.", "titulo_pt": "Quando o ouro inca foi usado para financiar as guerras religiosas na Europa", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 133453, "titulo": "Realism and research underpin film with autistic protagonist", "url": "https://www.japantimes.co.jp/culture/2026/08/30/film/syoutarou-kobayasi-interview/", "fonte_id": "japan_times", "data_pub": "2026-08-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Syoutarou Kobayasi reflete sobre seu cuidadoso abordagem ao retratar a experiência de uma pessoa autista no filme 'Lives at Right Angles'.", "titulo_pt": "Realismo e pesquisa fundamentam filme com protagonista autista", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 133572, "titulo": "Olivia Rodrigo Delivers Magic With Stevie Nicks, Sarah McLachlan, Alanis Morissette at Daisy Chain", "url": "https://www.rollingstone.com/music/music-news/olivia-rodrigo-stevie-nicks-sarah-mclachlan-alanis-perform-1235614614/", "fonte_id": "rolling_stone_music", "data_pub": "2026-08-30T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Olivia Rodrigo encerrou seu festival all-women com um show impressionante e convidou suas ídolas ao palco.", "titulo_pt": "Olivia Rodrigo convida ídolos ao palco no encerramento de seu festival all-women", "veiculo": "Rolling Stone - Música", "pais": "EUA", "classe": "C"}, {"id": 133513, "titulo": "It's official: 'The Odyssey' is Korea's biggest foreign hit of the year", "url": "https://www.koreaherald.com/article/10856552", "fonte_id": "korea_herald", "data_pub": "2026-08-30T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "The Odyssey superou Spider-Man: Brand New Day no box office sul-coreano, se tornando o maior lançamento internacional do ano. Ambos os filmes, de Hollywood, estiveram em competição durante todo o mês.", "titulo_pt": "É oficial: 'the Odyssey' é o maior sucesso estrangeiro do ano na Coreia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 133488, "titulo": "23,000 bronzes, 14 years, 60 volumes: how China is mapping lost heritage held abroad", "url": "https://www.scmp.com/news/china/diplomacy/article/3365643/23000-bronzes-14-years-60-volumes-how-china-mapping-lost-heritage-held-abroad?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma sala de pesquisa da Universidade de Beijing, 60 volumes pesados contêm detalhes de mais
