igencia-artificial/claude-ajudou-a-revelar-estrutura-molecular-inedita-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ferramenta auxiliou na identificação de uma nova estrutura molecular em apenas 34 horas, mas os pesquisadores ainda não descobriram sua função biológica.", "titulo_pt": "Claude ajudou a mapear estrutura molecular inédita em 34 horas, mas a função biológica ainda é desconhecida", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274374, "titulo": "Homo erectus teeth found in China’s rainforest topple theory of human evolution", "url": "https://www.scmp.com/news/china/science/article/3374985/homo-erectus-teeth-found-chinas-rainforest-topple-theory-human-evolution", "fonte_id": "scmp", "data_pub": "2026-11-19T06:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Chongzuo, Guangxi, nas proximidades da foz do rio Zuojiang, foram encontrados nove dentes antigos de Homo erectus em cavernas. Essa descoberta pode reescrever a teoria da evolução humana.", "titulo_pt": "Dentes de homo erectus encontrados na floresta tropical chinesa desafiam teoria da evolução humana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274504, "titulo": "APOD: 2026 November 19 – The Horsehead and Flame Nebulas", "url": "https://science.nasa.gov/image-article/apod-2026-november-19-the-horsehead-and-flame-nebulas/", "fonte_id": "nasa_news", "data_pub": "2026-11-19T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 19 de novembro de 2026 apresenta as Névoas Cavalo e Vela. Essa imagem revela detalhes fascinantes dessas estruturas interestelares.", "titulo_pt": "APOD: 19 de novembro de 2026 – as névoas cavalo e vela", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 274505, "titulo": "El Niño Rains Paint the Atacama", "url": "https://science.nasa.gov/earth/earth-observatory/el-nino-rains-paint-the-atacama/", "fonte_id": "nasa_news", "data_pub": "2026-11-19T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Precipitação invernal acordou sementes adormecidas no norte do Chile, cobrindo o deserto com uma das maiores florescências da era satelital da região.", "titulo_pt": "Chuvas de el Niño pintam o Atacama", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 274472, "titulo": "Voyager 1 reaches a historic milestone: one light-day from Earth", "url": "https://www.sciencenews.org/article/voyager-1-light-day-earth-distance", "fonte_id": "science_news", "data_pub": "2026-11-19T00:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1 foi lançado em 1977 e atingiu um marco histórico ao se distanciar a uma distância equivalente a um dia-luz da Terra.", "titulo_pt": "Voyager 1 atinge marco histórico: uma distância equivalente a um dia-luz da terra", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 272783, "titulo": "NASA’s Voyager 1 reaches one light-day milestone after 50 years in space", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868002", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1, da NASA, atingiu uma marca de um dia-luz após 50 anos no espaço. Este feito marca uma importante distância percorrida pelo satélite.", "titulo_pt": "Voyager 1 atinge marca de um dia-luz após 50 anos no espaço", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 274471, "titulo": "STAT+: Epic Systems defends competitive practices, promises to let AI access its records", "url": "https://www.statnews.com/2026/11/18/epic-defends-competitive-practices-promises-ai-access-to-records/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-18T23:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos da Epic, maior fornecedora de registros eletrônicos de saúde, defenderam suas práticas competitivas durante uma discussão em um painel no HLTH.", "titulo_pt": "Epic defende práticas competitivas e promete permitir que a IA tenha acesso aos seus registros", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 274506, "titulo": "NASA Sets Coverage for Northrop Grumman CRS-25 Launch, Prelaunch", "url": "https://www.nasa.gov/news-release/nasa-sets-coverage-for-northrop-grumman-crs-25-launch-prelaunch/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T22:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA, Northrop Grumman e SpaceX agendaram uma lançamento sem precedentes às 10:47h de domingo, 29 de novembro, com a intenção de levar experimentos científicos, suprimentos e equipamentos para a Estação Espacial Internacional. A agência também planeja realizar uma teleconferência de imprensa pré-voo na segunda-feira, 23 de novembro.", "titulo_pt": "NASA agendará cobertura para lançamento da Northrop Grumman CRS-25 e teleconferência pré-voo", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 274041, "titulo": "Abrieron una cápsula del tiempo tras 25 años y las cartas del pasado los dejaron sin palabras", "url": "https://www.lanacion.com.ar/lifestyle/abrieron-una-capsula-del-tiempo-tras-25-anos-y-las-cartas-del-pasado-los-dejaron-sin-palabras-nid19112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T09:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2023, em Córdoba, uma cápsula do tempo foi aberta após 25 anos, contendo cartas escritas pelos moradores com diversos temas. O conteúdo gerou surpresa entre os participantes.", "titulo_pt": "Abriram uma cápsula do tempo após 25 anos e as cartas do passado deixaram os presentes sem palavras", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274045, "titulo": "Los expertos en psicología coinciden: las personas que rechazan los abrazos pueden estar condicionadas por experiencias de la infancia", "url": "https://www.lanacion.com.ar/lifestyle/los-expertos-en-psicologia-coinciden-las-personas-que-rechazan-los-abrazos-pueden-estar-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T09:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Expertos em psicología concordam que algumas pessoas evitam abraços, o que pode estar relacionado a experiências de infância. Este comportamento não está associado necessariamente a uma falta de carinho ou confiança, mas sim a fatores condicionais.", "titulo_pt": "Perfis que rejeitam abraços podem estar condicionados por experiências de infância, diz psicologia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274048, "titulo": "Barbara Handler Segal, la mujer de 85 años que en su adolescencia fue la inspiración de la muñeca Barbie", "url": "https://www.lanacion.com.ar/lifestyle/barbara-handler-segal-la-mujer-de-85-anos-que-en-su-adolescencia-fue-la-inspiracion-de-la-muneca-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T09:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Barbara Handler Segal, de 85 anos, foi a inspiração para a muñeca Barbie na sua adolescência. Ela mantém um perfil baixo e se lembra, na velhice, do legado de seus pais na empresa Mattel.", "titulo_pt": "Barbara Handler Segal, a mulher de 85 anos que inspirou a muñeca Barbie na adolescência", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274426, "titulo": "Pens down, smiles and sighs of relief after Suneung", "url": "https://www.koreaherald.com/article/10943147", "fonte_id": "korea_herald", "data_pub": "2026-11-19T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes que realizaram o teste Suneung, o exame de habilidades acadêmicas para ingresso na universidade na Coreia do Sul, exibiram alívio após concluir a prova. Alguns saíram dos centros de teste sorridentes, enquanto outros choraram ao abraçar seus pais. Famílias receberam os estudantes com flores e abraços calorosos.", "titulo_pt": "Pensamentos, sorrisos e alívios após Suneung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274510, "titulo": "Bugs bassist Jordan Brunoli dies aged 31, one year after cancer diagnosis", "url": "https://www.theguardian.com/music/2026/nov/19/bugs-bassist-jordan-brunoli-dies-aged-31-cancer", "fonte_id": "guardian_culture", "data_pub": "2026-11-19T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jordan Brunoli, baixista da banda The Bugs, faleceu aos 31 anos, um ano após ser diagnosticado com câncer colorretal em estágio quatro. Ele havia anunciado publicamente que estava entrando na última fase de sua vida devido à ineficácia do quimioterapia em deter o avanço da doença.", "titulo_pt": "Bassistas da the bugs, Jordan Brunoli, morre aos 31 anos, após diagnóstico de câncer", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 274433, "titulo": "Could you pass Joseon's civil service exam? The final test came from the king", "url": "https://www.koreaherald.com/article/10943081", "fonte_id": "korea_herald", "data_pub": "2026-11-19T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exame gwageo, ou exame de serviço civil, era crucial para os homens da elite joseonida, pois representava não apenas uma carreira, mas também uma oportunidade de acesso ao governo, salários, status e poder. Desde cedo, meninos das famílias yangban, a classe aristocrática do Joseon, eram preparados para este exame, enquanto suas famílias investiam tempo e esforço para garantir seu sucesso.", "titulo_pt": "Você poderia passar no exame de serviço civil do Joseon?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274509, "titulo": "The Altruists review – two of TV’s best actors light up this chaotic crypto tale", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/19/the-altruists-review-anthony-boyle-julia-garner", "fonte_id": "guardian_culture", "data_pub": "2026-11-19T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Julia Garner e Anthony Boyle interpretam os fundadores da FTX em 'The Altruists', que retrata uma das maiores fraudes na história dos EUA. A história envolve pessoas muito inteligentes em posições de poder na internet, governando o mundo virtual que nos afeta diariamente.", "titulo_pt": "Avaliação de the Altruists – dois dos melhores atores da TV iluminam essa narrativa caótica sobre criptomoedas", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 274333, "titulo": "Competition to promote Japan’s Niigata held in London", "url": "https://www.japantimes.co.jp/news/2026/11/19/japan/niigata-promotion-competition-in-london/", "fonte_id": "japan_times", "data_pub": "2026-11-19T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O evento, o quarto de sua natureza, foi organizado por estudantes japoneses da London Business School e apoiado pela ANA Strategic Research Institute. O objetivo era promover Niigata, uma província do Japão.", "titulo_pt": "Concurso para promover Niigata realizado em londres", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 274370, "titulo": "Side by side in Shenzhen: inside Xi Jinping and Peng Liyuan’s first-couple diplomacy", "url": "https://www.scmp.com/news/china/diplomacy/article/3375044/side-side-shenzhen-inside-xi-jinping-and-peng-liyuans-first-couple-diplomacy", "fonte_id": "scmp", "data_pub": "2026-11-19T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peng Liyuan, esposa de Xi Jinping, assumiu um papel de liderança durante um intervalo de uma reunião de cúpula, apontando para o próximo líder asiático e conversando brevementamente com seu marido. O casal chinês se aproximou enquanto conversavam, demonstrando a dinâmica de sua diplomacia conjunta.", "titulo_pt": "Ao lado de Xi Jinping e Peng Liyuan: a diplomacia do casal-chefe em Shenzhen", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 273765, "titulo": "Documentário usa a história do Vasco para dissecar o racismo no futebol", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/documentario-usa-a-historia-do-vasco-para-dissecar-o-racismo-no-futebol.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos primeiros anos da década de 1920, o Vasco da Gama incluía jogadores negros e pobres em seus quadros, o que era considerado incomum para a época, já que o futebol era visto como um esporte de elite. A agremiação foi alvo de críticas e represálias por essa inclusão.", "titulo_pt": "Documentário explora a história do Vasco para analisar o racismo no futebol", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 274511, "titulo": "Bet they look good on the dancefloor: Mark McNulty’s party people – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/nov/19/bet-they-look-good-on-the-dancefloor-mark-mcnultys-party-people-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-11-19T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fotógrafo britânico Mark McNulty capturou momentos de festas noturnas nos anos 90, incluindo eventos na Cream e na Haçienda. Sua nova obra homenageia essas noites animadas.", "titulo_pt": "Eles devem parecer ótimos no dancefloor: pessoas da festa de mark McNulty - em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 274513, "titulo": "The Hill by Harriet Clark review – distinctive debut of growing up with a mother in prison", "url": "https://www.theguardian.com/books/2026/nov/19/the-hill-by-harriet-clark-review-distinctive-debut-of-growing-up-with-a-mother-in-prison", "fonte_id": "guardian_culture", "data_pub": "2026-11-19T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira novela da autora americana Harriet Clark, 'The Hill', narra a história de Suzanna, uma menina cuja mãe está presa por um crime político. O relato é intercalado com memórias da avó e retrata o crescimento de Suzanna sob a tutela dos avós.", "titulo_pt": "The Hill: primeiro romance de Harriet Clark sobre a infância de uma menina com mãe em prisão", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 274437, "titulo": "Andrew Lloyd Webber says AI could never have come up with 'Cats' or 'Phantom'", "url": "https://www.koreaherald.com/article/10942956", "fonte_id": "korea_herald", "data_pub": "2026-11-19T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Lloyd Webber afirmou que a inteligência artificial não teria sugerido 'Cats' ou 'The Phantom of the Opera' após 'Evita'. Ele explicou que após uma série de produções sem um amor verdadeiro como tema, decidiu escrever 'The Phantom of the Opera' como uma mudança de direção.", "titulo_pt": "Andrew Lloyd Webber afirma que AI não teria criado 'Cats' ou 'Phantom'", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274438, "titulo": "Suneung designed to exclude 'killer questions,' as Korean section deemed easier", "url": "https://www.koreaherald.com/article/10942929", "fonte_id": "korea_herald", "data_pub": "2026-11-19T06:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exame Suneung, que este ano mapeou o desempenho acadêmico dos alunos, foi projetado para distinguir entre os estudantes com base no que aprenderam na escola, segundo o presidente da comissão responsável pela elaboração das questões. Foram evitadas perguntas que poderiam dar vantagem a alunos que aprenderam técnicas de testes e passaram por treinamento repetitivo através de educação privada.", "titulo_pt": "Suneung projetado para evitar 'perguntas assassinas', visto como seção mais fácil para coreanos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274439, "titulo": "Riize airport incident reignites controversy over excessive security for K-pop stars", "url": "https://www.koreaherald.com/article/10942926", "fonte_id": "korea_herald", "data_pub": "2026-11-19T06:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vídeo circulou nas redes sociais mostrando uma fã feminina sendo empurrada forçosamente para um objeto no aeroporto por um homem que se acredita ser o gerente ou segurança de uma integrante do grupo Riize. O incidente reavivou debates sobre as medidas de segurança excessivas para estrelas de K-pop nos aeroportos.", "titulo_pt": "Incidente no aeroporto reaviva debates sobre segurança excessiva para estrelas de K-pop", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 273766, "titulo": "Grupo Gattu apresenta espetáculo gratuito na zona norte de SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/grupo-gattu-apresenta-espetaculo-gratuito-na-zona-norte-de-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T06:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Gattu encerra a série de espetáculos dedicados às estações do ano com 'Primavera', apresentado gratuitamente no Cine e Teatro do Sol, em Santana, zona norte de São Paulo.", "titulo_pt": "Grupo Gattu apresenta espetáculo gratuito na zona norte de SP", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 273850, "titulo": "Feriado da Consciência Negra: o que abre e o que fecha no DF", "url": "https://www.metropoles.com/distrito-federal/feriado-da-consciencia-negra-o-que-abre-e-o-que-fecha-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria dos serviços públicos funcionará parcialmente e alguns serão interrompidos durante o feriado da Consciência Negra no Distrito Federal.", "titulo_pt": "Feriado da Consciência Negra: o que abre e o que fecha no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273853, "titulo": "Troca de tiros na Marginal Pinheiros: polícia mata 2 suspeitos de roubos", "url": "https://www.metropoles.com/sao-paulo/troca-de-tiros-na-marginal-pinheiros-policia-mata-2-suspeitos-de-roubos", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas pessoas suspeitas de roubos foram mortas durante uma troca de tiros com a polícia na Marginal Pinheiros. A dupla fugiu por cerca de 5 quilômetros antes de ser confrontada pelos policiais da Caep.", "titulo_pt": "Troca de tiros na Marginal Pinheiros: polícia mata dois suspeitos de roubos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273973, "titulo": "\"Dejé a un lado mi orgullo y volví a vivir con mis padres después de quedarme sin trabajo. Me alegro de haberlo hecho\"", "url": "https://www.clarin.com/estados-unidos/deje-lado-orgullo-volvi-vivir-padres-despues-quedarme-trabajo-alegro-haberlo-hecho_0_YKOddn6cHj.html", "fonte_id": "clarin", "data_pub": "2026-11-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Erika Lindquist perdeu seu emprego em Nova York, retornou para viver com os pais após meses de busca por outro trabalho e, no que inicialmente foi visto como uma derrota, acabou encontrando o espaço necessário para reconstruir sua carreira e confiança.", "titulo_pt": "Deixei meu orgulho de lado e retornei para viver com meus pais após perder o emprego", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 273746, "titulo": "Veja quais são os direitos de quem trabalha no feriado da Consciência Negra", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/veja-quais-sao-os-direitos-de-quem-trabalha-no-feriado-da-consciencia-negra.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dia da Consciência Negra, comemorado nesta sexta-feira (20), pode proporcionar uma folga que emenda com o fim de semana para muitos trabalhadores. A lei garante que, se forem convocados para trabalhar, eles têm direito a receber o dia em dobro ou a obter uma folga compensatória.", "titulo_pt": "Veja quais são os direitos de quem trabalha no feriado da Consciência Negra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272784, "titulo": "More rational antibiotic use needed, hospital says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868008", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hospital enfatiza a necessidade de um uso mais racional de antibióticos. A instituição destaca a importância de uma utilização correta para evitar a resistência aos medicamentos.", "titulo_pt": "Mais uso racional de antibióticos necessário, diz hospital", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272785, "titulo": "Legalize cancer drug fund: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868009", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos estão pedindo a legalização de um fundo para medicamentos contra o câncer.", "titulo_pt": "Legalize fundo para medicamentos contra o câncer: grupos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272786, "titulo": "Taipei indicts escape room owner over worker’s death", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868010", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um proprietário de uma sala de escape foi indiciado pela morte de um funcionário. As autoridades taiwanesas investigaram o incidente e levantaram suspeitas sobre as condições de trabalho na sala de escape.", "titulo_pt": "Taipei indicia dono de sala de escape por morte de funcionário", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 273253, "titulo": "Vendedora de trufas é agredida em briga com funcionária da ViaMobilidade", "url": "https://www.metropoles.com/sao-paulo/vendedora-de-trufas-e-agredida-em-briga-com-funcionaria-da-viamobilidade", "fonte_id": "metropoles", "data_pub": "2026-11-18T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma vendedora de trufas teve uma briga com uma funcionária da ViaMobilidade. A comerciante alega que o conflito aconteceu após ser acusada de preconceito, mas a funcionária nega ter feito tal acusação.", "titulo_pt": "Vendedora de trufas é agredida em briga com funcionária da ViaMobilidade", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273071, "titulo": "Caldeira explode em fábrica da Klabin em SC e dez trabalhadores são hospitalizados; veja vídeo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/caldeira-explode-em-fabrica-da-klabin-em-sc-e-dez-trabalhadores-sao-hospitalizados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma explosão de uma caldeira na fábrica da Klabin em Otacílio Costa, Santa Catarina, levou a hospitalização de pelo menos dez trabalhadores nesta quarta-feira (18).", "titulo_pt": "Caldeira explode em fábrica da Klabin em SC e dez trabalhadores são hospitalizados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273291, "titulo": "Muçulmanos devem superar cristãos em número até 2035 e se tornar maior grupo religioso do mundo", "url": "https://www.dw.com/pt-br/muçulmanos-devem-superar-cristãos-em-número-até-2035-e-se-tornar-maior-grupo-religioso-do-mundo/a-79986215?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-18T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comunidade muçulmana deve ultrapassar os cristãos nas próximas décadas, impulsionada principalmente por taxas de fecundidade mais altas. Este fenômeno será o principal fator que levará os muçulmanos a se tornarem o maior grupo religioso do mundo até 2035.", "titulo_pt": "Muçulmanos devem superar cristãos em número até 2035 e se tornar maior grupo religioso do mundo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 273263, "titulo": "Criança de 2 anos é esfaqueada em festa familiar ao se recusar a tirar foto", "url": "https://www.metropoles.com/distrito-federal/na-mira/crianca-de-2-anos-e-esfaqueada-em-festa-de-familia-apos-recusar-tirar-foto", "fonte_id": "metropoles", "data_pub": "2026-11-18T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma criança de 2 anos foi esfaqueada durante uma festa familiar no Paraná após se recusar a tirar foto. A suspeita, uma servidora pública de 46 anos, foi desarmada por um convidado e posteriormente presa em flagrante por policiais militares.", "titulo_pt": "Criança de 2 anos é esfaqueada em festa familiar ao se recusar a tirar foto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273839, "titulo": "Prefeituras comandadas por mulheres dobram em 24 anos, mas seguem sendo minoria", "url": "https://exame.com/esferabrasil/prefeituras-comandadas-por-mulheres-dobram-em-24-anos-mas-seguem-sendo-minoria/", "fonte_id": "exame", "data_pub": "2026-11-18T21:25:00Z", "idioma": "pt", "provavel_duplicata_de" verde/cruzamento-de-dados-mostra-que-el-nino-deve-atingir-as-areas-mais-vulneraveis-do-brasil/", "fonte_id": "veja", "data_pub": "2026-11-18T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados cruzados indicam que o fenômeno El Niño pode afetar as áreas mais vulneráveis do Brasil, especialmente aquelas com menor capacidade de adaptação às mudanças climáticas. Regiões de vulnerabilidade social estão sob risco.", "titulo_pt": "Cruzamento de dados mostra que El Niño deve atingir as áreas mais vulneráveis do Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 273177, "titulo": "El Niño e o desafio de preparar o sistema elétrico para eventos extremos", "url": "https://www.cnnbrasil.com.br/infra/el-nino-como-preparar-a-operacao-do-sistema-eletrico-para-eventos-extremos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute os desafios relacionados à preservação da segurança e confiabilidade do Sistema Interligado Nacional diante das adversidades climáticas, com foco no fenômeno El Niño.", "titulo_pt": "El Niño e o desafio de preparar o sistema elétrico para eventos extremos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273293, "titulo": "Como a economia verde pode ajudar a reverter as mudanças climáticas", "url": "https://www.dw.com/pt-br/como-a-economia-verde-pode-ajudar-a-reverter-as-mudanças-climáticas/a-79983684?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-18T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O crescimento verde sugere que países podem prosperar sem comprometer o meio ambiente, mas a viabilidade dessa perspectiva ainda é questionada. A economia verde promete um desenvolvimento sustentável, mas sua realidade prática é incerta.", "titulo_pt": "Como a economia verde pode ajudar a reverter as mudanças climáticas", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 274191, "titulo": "'Make polluters pay': COP31 sees mounting calls to tax fossil fuels to finance climate action", "url": "https://www.lemonde.fr/en/environment/article/2026/11/18/make-polluters-pay-cop31-sees-mounting-calls-to-tax-fossil-fuels-to-finance-climate-action_6783790_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T19:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O financiamento para combater e se adaptar ao aquecimento global continua insuficiente, enquanto as empresas de petróleo e gás registram lucros sem precedentes. Há crescentes chamados para criar uma 'COP sobre Tributação' que possa ajudar a transformar como as multinacionais são tributadas.", "titulo_pt": "Make polluters pay: cúpula 31 vê crescentes pedidos para taxar combustíveis fósseis para financiar ação climática", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 273413, "titulo": "Embalses almacenan cerca de 30% más de agua que hace un año y la mayoría de destinados a riego está casi al 100%", "url": "https://www.latercera.com/pulso/noticia/embalses-casi-un-tercio-mas-de-agua-que-hace-un-ano-y-mayoria-riego-casi-al-100/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T19:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "De acordo com a DGA, nove dos 16 açudes de irrigação estão com o nível máximo de armazenamento. Em Coquimbo, o açude La Paloma aumentou significativamente seu volume de água. Peñuelas, no entanto, está abaixo dos 20% de capacidade.", "titulo_pt": "Açudes de irrigação armazenam cerca de 30% mais água do que há um ano e a maioria está quase no nível máximo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 272447, "titulo": "RADAR LT: Santiago enfrenta el desafío hídrico entre lluvias récord y calor extremo", "url": "https://www.latercera.com/videos/noticia/radar-lt-santiago-enfrenta-el-desafio-hidrico-entre-lluvias-record-y-calor-extremo/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T17:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A escassez hídrica persiste em Santiago, apesar do aumento nas chuvas. O Fundo de Agua Santiago-Maipo alerta para a necessidade de implementar soluções naturais para conservar água e lidar com o calor extremo.", "titulo_pt": "RADAR LT: santiago enfrenta desafio hídrico entre chuvas recordistas e calor extremo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 272202, "titulo": "Temporais ameaçam o Brasil e El Niño preocupa produção de alimentos", "url": "https://www.cnnbrasil.com.br/nacional/temporais-ameacam-o-brasil-e-el-nino-preocupa-producao-de-alimentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño está causando temporais no Sul do Brasil e seca no Norte. A Câmara dos Deputados aprovou um crédito extraordinário para mitigar os impactos na agricultura.", "titulo_pt": "El Niño ameaça agricultura com temporais no sul e seca no norte; câmara aprova crédito para mitigar impactos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 272245, "titulo": "Mais de 100 mi de caranguejos tomam ilha na Austrália durante migração; veja imagens", "url": "https://exame.com/ciencia/mais-de-100-mi-de-caranguejos-tomam-ilha-na-australia-durante-migracao-veja-imagens/", "fonte_id": "exame", "data_pub": "2026-11-18T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 milhões de caranguejos migram anualmente para a Ilha Christmas na Austrália para reprodução, causando o fechamento de estradas e a construção de passagens especiais.", "titulo_pt": "Mais de 100 milhões de caranguejos tomam ilha na Austrália durante migração; veja imagens", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272253, "titulo": "COP31: 'Se você acha que as mudanças climáticas não são nada, venha ao Nepal', diz ministra", "url": "https://exame.com/esg/cop31-se-voce-acha-que-as-mudancas-climaticas-nao-sao-nada-venha-ao-nepal-diz-ministra/", "fonte_id": "exame", "data_pub": "2026-11-18T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra do Meio Ambiente do Nepal, Gita Chaudhary, ressaltou a urgência de justiça climática e responsabilização dos países mais poluentes após a tragédia climática que deixou mais de 1400 mortos e causou perdas equivalentes a 10% do PIB do país.", "titulo_pt": "Se você acha que as mudanças climáticas não são nada, venha ao Nepal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272258, "titulo": "Ciclone vai atingir o Brasil? Veja o que diz o Inmet e onde há alertas", "url": "https://exame.com/brasil/ciclone-vai-atingir-o-brasil-veja-o-que-diz-o-inmet-e-onde-ha-alertas/", "fonte_id": "exame", "data_pub": "2026-11-18T13:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) monitora a formação de um ciclone na costa argentina, enquanto a Defesa Civil prevê ventos acima de 90 km/h no Rio Grande do Sul. Até o momento, não há alertas específicos para o Brasil, mas o Inmet continua monitorando a situação.", "titulo_pt": "Ciclone pode atingir o Brasil? Veja o que diz o Inmet e onde há alertas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 273852, "titulo": "Pastor que torturava e abusava de fiéis é condenado a 100 anos de prisão", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pastor-que-torturava-e-abusava-de-fieis-e-condenado-a-100-anos-de-prisao", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Gonçalves da Silva, líder da comunidade Shekinah House Church em Paço do Lumiar, Maranhão, foi condenado a 100 anos de prisão por torturar e abusar sexualmente de fiéis.", "titulo_pt": "Pastor condenado a 100 anos de prisão por torturar e abusar de fiéis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274412, "titulo": "2 men sentenced to prison terms over killing of film director", "url": "https://en.yna.co.kr/view/AEN20261119007300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois homens foram condenados a pena de prisão por agressão e assassinato de um diretor de cinema.", "titulo_pt": "Dois homens condenados por assassinato de diretor de cinema", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274092, "titulo": "One in four women globally unable to refuse sex within marriage, says UN", "url": "https://www.theguardian.com/global-development/2026/nov/19/women-girls-rights-rape-sexual-violence-africa-marriage-unfpa", "fonte_id": "guardian_world", "data_pub": "2026-11-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um em cada quatro mulheres no mundo inteiro não têm poder para negar consentimento sexual se seu marido ou parceiro exigir. Em África ocidental e central, quase metade das mulheres (45%) não podem dizer não em suas próprias casamentos, de acordo com um relatório da UNFPA.", "titulo_pt": "Um em quatro mulheres globalmente não conseguem negar consentimento sexual, diz ONU", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 274195, "titulo": "A new antisemitism law sparks controversy in Italy", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/a-new-antisemitism-law-sparks-controversy-in-italy_6784120_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T03:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei aprovada em 17 de novembro define antisemitismo de uma maneira que, segundo seus críticos, confunde a distinção entre discurso de ódio contra judeus e crítica à política israelense.", "titulo_pt": "Nova lei sobre antisemitismo causa controvérsia na Itália", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 274029, "titulo": "Libertarios amenazan con acusación constitucional contra Chomali tras rechazo de indicación para restringir financiamiento de tratamientos hormonales en menores", "url": "https://www.latercera.com/politica/noticia/libertarios-amenazan-con-acusacion-constitucional-contra-chomali-tras-rechazo-de-indicacion-para-restringir-financiamiento-de-tratamientos-hormonales-en-menores/", "fonte_id": "la_tercera", "data_pub": "2026-11-19T02:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os deputados Hans Marowski e Pier Karlezi ameaçaram apresentar uma acusação constitucional contra a ministra de Saúde após ela rejeitar uma indicação para limitar o financiamento público de tratamentos hormonais para menores de 18 anos. A proposta de restrição orçamentária foi rejeitada no Senado por um voto empate de 21 votos.", "titulo_pt": "Libertários ameaçam acusação constitucional contra ministra de saúde após rejeição de indicação para limitar tratamentos hormonais em menores", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 273133, "titulo": "STJ favorece Xuxa em processo e reduz R$ 70 milhões da indenização que apresentadora deve pagar", "url": "https://veja.abril.com.br/cultura/stj-favorece-xuxa-em-processo-e-reduz-r-70-milhoes-da-indenizacao-que-apresentadora-deve-pagar/", "fonte_id": "veja", "data_pub": "2026-11-18T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) reduziu a indenização que a apresentadora Xuxa deve pagar em um processo que envolve Léo Soltz, relacionado ao uso indevido de personagens da Turma do Cabralzinho. O caso está em discussão há 26 anos.", "titulo_pt": "STJ reduz indenização para Xuxa em processo sobre uso de personagens", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 273399, "titulo": "Reforma al INDH: Naciones Unidas advierte sobre posibles retrocesos en autonomía y facultades del organismo", "url": "https://www.latercera.com/nacional/noticia/reforma-al-indh-naciones-unidas-advierte-sobre-posibles-retrocesos-en-autonomia-y-facultades-del-organismo/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T20:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O diretor do instituto indicou que o informe financiero da iniciativa poderia implicar a desvinculação de todos os seus advogados. As Nações Unidas advertiram sobre possíveis retrocessos na autonomia e nas faculdades do organismo.", "titulo_pt": "Reforma ao INDH: ONU avisa sobre possíveis retrocessos na autonomia e competências do órgão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 272710, "titulo": "Bahrain sentences Shia clerics to life over alleged Iran plot amid torture allegations", "url": "https://www.euronews.com/2026/11/18/bahrain-sentences-shia-clerics-to-life-over-alleged-iran-plot-amid-torture-allegations", "fonte_id": "euronews", "data_pub": "2026-11-18T10:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bahrain prendeu dezenas de clérigos xiitas desde o início da guerra com o Irã em fevereiro. Autoridades acusam-os de conspirar com Teerã, enquanto grupos de direitos humanos levantam preocupações sobre tortura e confissões forçadas. Os estados do Golfo apoiaram a jurisdição de Bahrain.", "titulo_pt": "Bahrain condena clérigos xiitas a prisão perpétua em meio a acusações de tortura", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 272946, "titulo": "Remarks by UNICEF Deputy Executive Director, ASG Ted Chaiban, at the Second Global Ministerial Conference on Ending Violence Against Children", "url": "https://www.unicef.org/press-releases/remarks-unicef-deputy-executive-director-asg-ted-chaiban-second-global-ministerial", "fonte_id": "unicef", "data_pub": "2026-11-18T10:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-diretor executivo adjunto da UNICEF, Ted Chaiban, participou da Segunda Conferência Global Ministerial sobre o Fim da Violência Contra Crianças. O evento teve como objetivo discutir estratégias para combater a violência contra crianças em todo o mundo.", "titulo_pt": "Comentários do vice-diretor executivo adjunto da UNICEF, Ted Chaiban, na segunda conferência Global Ministerial sobre o fim da violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 272778, "titulo": "Serbia’s Criminal Police Chief Detained for Alleged Torture", "url": "https://balkaninsight.com/2026/11/18/serbias-criminal-police-chief-detained-for-alleged-torture/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-18T10:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Diretório de Polícia Criminal da Sérvia, Marko Kricak, foi detido sob acusações de torturar manifestantes em agosto de 2025. Ele já enfrenta outras acusações relacionadas ao abuso de poder e tortura.", "titulo_pt": "Chefe da polícia Criminal da sérvia detido suspeito de torturar protestantes", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 271736, "titulo": "‘We want to go back’: Rohingya refugees pin hopes on ICJ genocide verdict", "url": "https://www.aljazeera.com/features/2026/11/18/we-want-to-go-back-rohingya-refugees-pin-hopes-on-icj-genocide-verdict?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Refugiados rohingya, que vivem no exílio há quase uma década, esperam que o TJ Internacional decida a seu favor. No entanto, não está claro se isso ajudará a permitir seu retorno.", "titulo_pt": "Queremos voltar”: refugiados rohingya esperam decisão favorável do tj internacional", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 272546, "titulo": "¿Más poder, menos responsabilidad? La reforma al mercado de capitales y su efecto en las sociedades anónimas", "url": "https://www.ciperchile.cl/2026/11/18/mas-poder-menos-responsabilidad-la-reforma-al-mercado-de-capitales-y-su-efecto-en-las-sociedades-anonimas/?utm_source=rss&utm_medium=rss&utm_campaign=mas-poder-menos-responsabilidad-la-reforma-al-mercado-de-capitales-y-su-efecto-en-las-sociedades-anonimas", "fonte_id": "ciper_chile", "data_pub": "2026-11-18T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A reforma no mercado de capitais e seu impacto nas sociedades anónimas são temas abordados no texto original. O título traduzido para o português brasileiro é: 'Mais poder, menos responsabilidade? A reforma ao mercado de capitais e seu efeito nas sociedades anónimas'.", "titulo_pt": "Mais poder, menos responsabilidade? A reforma ao mercado de capitais e seu efeito nas sociedades anónimas", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 271979, "titulo": "UNICEF FAST FACTS: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/unicef-fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos mundiais se encontram em Manila para discutir a eliminação da violência contra crianças. O evento visa promover ações para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para combater violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 272947, "titulo": "Fast facts: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos globais se reuniram em Manila para discutir e tomar medidas para combater a violência contra crianças. O encontro visa promover ações concretas para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para acabar com a violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 271565, "titulo": "‘Devastating consequences’: One Nation plan to slash Australia’s refugee program denounced", "url": "https://www.theguardian.com/australia-news/2026/nov/18/one-nation-refugee-intake-immigration-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-18T05:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido One Nation propôs cortar drasticamente o programa de refugiados da Austrália em 90% e eliminar o programa de vistos permanentes para pais e pais idosos. A proposta foi criticada por oponentes políticos e organizações de advocacy como uma 'ataque barato' aos refugiados.", "titulo_pt": "Consequências devastadoras: plano do one Nation para reduzir programa de refugiados da austrália condenado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 272528, "titulo": "The Rohingya Are Not a Legal Test Case. We Are a People Waiting for Justice.", "url": "https://thediplomat.com/2026/11/the-rohingya-are-not-a-legal-test-case-we-are-a-people-waiting-for-justice/", "fonte_id": "the_diplomat", "data_pub": "2026-11-18T04:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma decisão judicial não pode devolver a um filho assassinado à sua mãe ou devolver os anos roubados a uma geração. No entanto, a reconhecimento e ser ouvidos importam.", "titulo_pt": "Os rohingyas não são um caso Legal. Somos um povo esperando justiça.", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 273803, "fonte_id": "veja", "titulo": "Fertilização in vitro pode afetar a saúde dos filhos no longo prazo?", "url": "https://veja.abril.com.br/col ticamente, o encontro forneceu um quadro para futuras negociações e alinhamento estratégico entre as três potências. Embora a reunião tenha sido vista como uma vitória para Putin, em termos de diplomacia, ela não resolveu os problemas fundamentais que afetam a estabilidade global. O encontro também teve implicações científicas, com possíveis avanços em cooperação tecnológica entre as nações. O desfecho do encontro foi marcado por cumprimentos e gestos de amizade, como o abraço entre Xi Jinping e Donald Trump, refletindo a complexidade das relações internacionais na era atual.", "data_edicao": "2026-11-19", "artigos": [{"id": 274405, "titulo": "(URGENT) Trump, Xi, Putin begin their first-ever trilateral summit in China", "url": "https://en.yna.co.kr/view/AEN20261119006700315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T08:30:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "O presidente dos Estados Unidos, Donald Trump, o presidente da Rússia, Vladimir Putin, e o presidente da China, Xi Jinping, iniciaram seu primeiro encontro trilateral em solo chinês.", "titulo_pt": "Trump, Xi e Putin iniciam seu primeiro encontro trilateral na China", "texto_pt": "O presidente dos Estados Unidos, Donald Trump, o presidente da Rússia, Vladimir Putin, e o presidente da China, Xi Jinping, iniciaram seu primeiro encontro trilateral em solo chinês.", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 273877, "titulo": "Trump, Putin e Xi Jinping se reúnem na China em encontro histórico", "url": "https://www.cnnbrasil.com.br/internacional/comeca-reuniao-trilateral-entre-trump-putin-e-xi-jinping-na-china/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T08:29:00Z", "topico": "politica_internacional", "idioma": "pt", "texto_resumo": "O presidente dos Estados Unidos, Donald Trump, o presidente da Rússia, Vladimir Putin, e o presidente da China, Xi Jinping, se reuniram durante a cúpula da APEC em Shenzhen.", "titulo_pt": "Trump, Putin e Xi Jinping se reúnem na China em encontro histórico", "texto_pt": "O presidente dos Estados Unidos, Donald Trump, o presidente da Rússia, Vladimir Putin, e o presidente da China, Xi Jinping, se reuniram durante a cúpula da APEC em Shenzhen.", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274319, "titulo": "Trump, Putin and Xi begin historic trilateral meeting", "url": "https://www.ft.com/content/fcf6d27b-a04c-4cef-8b03-ce2423566f1f", "fonte_id": "financial_times", "data_pub": "2026-11-19T07:43:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "O encontro trilateral entre Trump, Putin e Xi começou na cidade sulista de Shenzhen durante uma semana de diplomacia de alto nível.", "titulo_pt": "Trump, Putin e Xi iniciam histórico encontro trilateral em shenzhen", "texto_pt": "O encontro trilateral entre Trump, Putin e Xi começou na cidade sulista de Shenzhen durante uma semana de diplomacia de alto nível.", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273823, "titulo": "Trump, Putin e Xi iniciam reunião histórica e discutem segurança mundial; veja imagens", "url": "https://exame.com/mundo/trump-putin-e-xi-iniciam-reuniao-historica-e-discutem-seguranca-mundial/", "fonte_id": "exame", "data_pub": "2026-11-19T06:47:00Z", "topico": "politica_internacional", "idioma": "pt", "texto_resumo": "O encontro trilateral entre Trump, Putin e Xi começou nesta quinta-feira com discussões sobre Ucrânia, armas nucleares e segurança energética. Xi propôs mecanismos para evitar conflitos.", "titulo_pt": "Trump, Putin e Xi iniciam encontro trilateral e discutem segurança mundial", "texto_pt": "O encontro trilateral entre Trump, Putin e Xi começou nesta quinta-feira com discussões sobre Ucrânia, armas nucleares e segurança energética. Xi propôs mecanismos para evitar conflitos.", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274274, "titulo": "‘It’s my friend’: Moment Trump greets Putin at Chin const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")

    ? `<div class="eventos">

                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

  const list = Object.values(flags);

  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">

  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
