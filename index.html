  </div>
</div>

<script>
const D = {"gerado_em": "25/11/2026 19:28", "stats": {"noticias_novas": 643, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios políticos e econômicos sob o governo de Lula, com destaque para a decisão dos Estados Unidos de impor novas tarifas sobre produtos brasileiros e a rejeição de um pedido pelo TCU para abrir um crédito extraordinário. A vitória de Lula sobre Jair Bolsonaro fortaleceu a imagem do Brasil como uma democracia vitoriosa, transformando-o em símbolo mundial do combate à extrema-direita. O TSE planeja criar um grupo para combater candidaturas falsas e fraudes na cota de gênero, enquanto a Assembleia do Rio de Janeiro discute reajustes salariais para o governador eleito e seus principais colaboradores. O governo Lula também deve renovar o subsídio ao diesel por mais 30 dias, o que pode custar entre R$ 8 bilhões e R$ 10,5 bilhões.", "mundo": "A Coreia do Norte expulsou um diplomata suíço por causa de disputas relacionadas a sanções, mantendo relações através do embaixado da Suíça em Berna e do embaixado da Coreia do Norte em Beijing. Em outro desenvolvimento, um incêndio perto do Cairo, no Egito, causado por um acidente envolvendo um caminhão carregado com petróleo, resultou em pelo menos 31 mortos e 21 feridos. O primeiro-ministro israelense Benjamin Netanyahu enfrenta uma possível suspensão do processo de corrupção contra ele, enquanto o governo brasileiro expressou indignação com a proposta dos EUA de impor novas tarifas sobre aeronaves e açúcar brasileiros, reafirmando que não cederá a esse tipo de ameaça. Na Austrália, a senadora Leah Blyth se juntou ao Partido One Nation, após o senador Barnaby Joyce, em uma defecção de alto perfil do governo para o partido.\n\nO uso de inteligência artificial (IA) para influenciar eleições em Taiwan e a proposta de novas tarifas dos Estados Unidos sobre 14 parceiros comerciais, incluindo Taiwan e China, refletem a crescente tensão geopolítica na região. O líder norte-coreano Kim Jong-un enfatizou o uso de armas nucleares táticas em várias áreas, enquanto a Arábia Saudita e a coalizão que lidera enfrentam ataques de hutitas do Iêmen, demonstrando a instabilidade na região do Oriente Médio. Paralelamente, a Ucrânia continua a frustrar os planos da Rússia para cercar o Donbass, e a França enfrenta ameaças de nacionalismo populista que poderiam desafiar a União Europeia. Além disso, a SpaceX foi autorizada a lançar até um milhão de satélites de centro de dados orbitais, o que pode revolucionar a infraestrutura de processamento de dados global.", "economia": "A economia dos Estados Unidos registrou um crescimento acima das expectativas no último trimestre, com o PIB avançando a uma taxa anualizada de 4,3%, impulsionado principalmente por investimentos empresariais. No entanto, a inflação medida pelo índice PCE acelerou em outubro e permanece acima da meta do Federal Reserve. Diante disso, o governo brasileiro reagiu a propostas de novas tarifas dos EUA, que visam pressionar o sistema de pagamento Pix e outros mercados, solicitando negociação. O Banco Central do Brasil pode sinalizar uma tendência de aumento dos juros se o cenário econômico não melhorar. Em meio a essas tensões comerciais, o governo Lula declarou que a recomendação de novas tarifas contra o Brasil é inaceitável, destacando que não houve demandas comerciais enviadas ao país. A economia brasileira enfrenta desafios como a necessidade de resolver a situação dos juros elevados, com a inflação persistente acima da meta desde 1999, e a proposta de aumentar o capital regulatório de emissores de cartão de crédito para frear o endividamento dos brasileiros.", "tecnologia": "A Universidade Nacional de Taiwan desenvolveu chips para inteligência artificial gerativa em dispositivos locais, visando melhorar a eficiência e a privacidade no processamento de IA nos próprios equipamentos. Paralelamente, a FCC autorizou a SpaceX a implantar 1 milhão de satélites equipados com chips de inteligência artificial, um projeto que aumentaria significativamente o número de satélites em órbita. A WhatsApp agora permite agendar mensagens em chats individuais e grupais, com opções de agendamento de 10 minutos a 14 dias após o envio. Além disso, a Character AI enfrenta contestações legais de procuradores-gerais dos estados norte-americanos em relação ao leilão de dados pessoais de usuários.", "ciencia": "Pesquisadores da Universidade de Jyväskylä identificaram mais de 300 estruturas estáveis de metallenas em sanduíche, utilizando aprendizado de máquina e computação avançada. Isso oferece um guia prático para a fabricação de novos metais bidimensionais. Em outra pesquisa, cientistas internacionais descobriram que certos fungos promovem a formação de novas células conductoras de água em plantas, aumentando a tolerância dessas plantas ao estresse por seca. A NASA está reestruturando seu programa de fornecedores de pequenas empresas e anunciou um novo acordo de mentoria e protégé entre a The Boeing Company e a GRACE, com o objetivo de fortalecer a base industrial aeroespacial doméstica para apoiar futuras missões de exploração. A missão da ESA (Agência Espacial Europeia) revelou as primeiras imagens do asteroide Dimorphos, que foi atingido pela nave DART da NASA em 2022, como parte do primeiro teste de um sistema de defesa planetária. Além disso, a NASA's Europa Clipper está se preparando para um voo próximo à Terra antes de se dirigir a Júpiter, onde o orbital buscará determinar se o oceano sob o manto de gelo da lua europaana tem os ingredientes para a vida.", "cultura": "O ano de 2026 foi marcante para a cultura brasileira e internacional, com diversos eventos e notícias importantes. O Prêmio LeYa, um dos mais prestigiados da literatura portuguesa, não selecionou nenhum livro para a edição de 2026, justificando a falta de qualidade. Em outro destaque, o artista mineiro Rafael LaCruz exibirá seu curta-metragem 'Legacy, a Coroa de Bilú' no Festival Bogoshorts, em Bogotá, Colômbia, em dezembro. Além disso, a Tate Liverpool planeja reabrir em outono de 2027 com uma exposição sobre surrealismo, incluindo obras de Salvador Dalí, Eileen Agar e Man Ray. Essas notícias refletem a diversidade e a importância da cultura em diversos contextos, desde o cinema e a literatura até o design e a arquitetura.", "sociedade": "A justiça de São Paulo autorizou um jovem a retirar o nome da mãe de seus documentos após relatos de agressões físicas e exploração sexual durante a infância, destacando-se como um caso de violência intrafamiliar. Em outro destaque, a expectativa de vida em Cuba caiu pela primeira vez em quase 80 anos, segundo a Organização Mundial da Saúde, devido a um embargo petrolífero que levou a uma contração econômica sem precedentes. O Dia Internacional de Eliminação da Violência Contra a Mulher também foi abordado, com o objetivo de apoiar mulheres em situações de violência, reconhecendo que o apego emocional pode coexistir com o medo. Além disso, a Polícia Civil do Rio de Janeiro investiga um esquema envolvendo estrangeiros que traficavam recém-nascidos para a Tailândia, destacando a violência contra crianças.", "meio_ambiente": "A Amazônia, no Brasil, enfrenta um grave problema ambiental, pois uma publicação em uma revista científica revelou que as ações humanas, acentuadas pela crise climática, fizeram a região emitir mais carbono do que absorver, transformando-a em uma fonte de emissões que contribuem para o aquecimento global. Em outro desenvolvimento, o El Niño pode aumentar o risco de doenças infecciosas no Chile, conforme alerta de investigadores do Instituto Milenio em Inmunología e Inmunoterapia (IMII). No contexto de negociações climáticas, a COP31 terminou em fracasso no final de semana, com Marina Silva declarando que as negociações ficaram paralisadas devido a impasses entre grandes potências e bloqueios em temas centrais. Além disso, um ciclone extratropical atinge o Sul do Brasil, trazendo chuvas fortes e uma nova frente fria, enquanto um incêndio florestal ameaça casas e propriedades em uma ilha remota na Austrália. No Brasil, a Sabesp realiza mais de dois milhões de testes anuais para garantir a qualidade da água, e a cidade de São Paulo inicia a vacinação contra mpox com novas doses.", "direitos_humanos": "O Brasil lidera o ranking de feminicídios na América Latina e Caribe, com 1.453 casos em um ano, conforme um relatório publicado em 2026. Em 26 países e territórios analisados, pelo menos 11 mulheres são mortas por dia devido a violência de gênero. Além disso, a Itália registrou 880 incidentes de abuso sexual infantil entre 2001 e 2021, com 57 padres presos por esse crime. Em Israel, a ONG Public Committee Against Torture in Israel (PCATI) denunciou que centenas de palestinos passaram por processos criminais com base em confissões extraídas sob tortura, incluindo o caso de Ghassan Al Najjar, um agricultor palestino e defensor dos direitos humanos que foi detido pelas forças israelenses em 2026. Na Arábia Saudita, a repressão a dissidentes intensificou-se, com mais de 200 execuções e uma crescente perseguição contra vozes críticas em 2026. A UNICEF alertou para a nova ameaça de inverno para milhares de crianças em Nepal, três meses após devastadoras inundações. Além disso, em Gaza, a situação humanitária se deteriorou com a continuação do conflito, levando a uma crescente violação dos direitos humanos, incluindo o uso excessivo de força contra civis e a deterioração das condições de saúde e de abrigo."}, "resumo_do_dia": {"politica_nacional": [{"id": 287428, "titulo": "Governo Lula diz que 'não cederá a ameaças' após tarifas dos EUA para aeronaves e açúcar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-lula-diz-que-nao-cedera-a-ameacas-apos-tarifas-dos-eua-para-aeronaves-e-acucar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula criticou a decisão dos Estados Unidos de propor novas tarifas sobre produtos importados do Brasil, incluindo açúcar e aeronaves, afirmando que não cederá a ameaças.", "titulo_pt": "Governo Lula critica tarifas dos EUA e afirma não ceder a ameaças", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287563, "titulo": "Zanin leva ao plenário virtual do STF pedido do PSD por 2º turno na eleição do Rio", "url": "https://www.infomoney.com.br/politica/zanin-leva-ao-plenario-virtual-do-stf-pedido-do-psd-por-2o-turno-na-eleicao-do-rio/", "fonte_id": "infomoney", "data_pub": "2026-11-25T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Zanin apresentou ao plenário virtual do STF um pedido do PSD para o segundo turno na eleição do Rio de Janeiro. O julgamento do mérito da ação está marcado para ocorrer entre os dias 4 e 15 de dezembro.", "titulo_pt": "Zanin leva ao plenário virtual do STF pedido do PSD por segundo turno na eleição do Rio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 287444, "titulo": "Brasil em busca de um lugar no mundo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/maria-herminia-tavares/2026/11/brasil-em-busca-de-um-lugar-no-mundo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vitória do presidente Lula sobre Flávio Bolsonaro fortaleceu a imagem do Brasil como país onde a democracia venceu duas vezes o populismo autoritário. Isso transformou Lula em símbolo mundial do combate dos progressistas à direita extremada.", "titulo_pt": "Brasil conquista lugar no cenário mundial após vitória eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 287429, "titulo": "TCU livra Dilma de multas por irregularidades fiscais em 2014", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/poder/2026/11/tcu-livra-dilma-de-multas-por-irregularidades-fiscais-em-2014.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU eximiu a ex-presidente Dilma Rousseff e ex-integrantes de sua equipe econômica de multas relacionadas a irregularidades fiscais e orçamentárias em 2014, que incluíam as chamadas 'pedaladas fiscais'. Essas irregularidades levaram ao impeachment de Dilma em 2016.", "titulo_pt": "TCU exonera Dilma e equipe de multas por irregularidades fiscais em 2014", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287687, "titulo": "Atuação de ofício de juízes na venda de precatórios previdenciários divide opiniões", "url": "https://www.jota.info/justica/atuacao-de-oficio-de-juizes-na-venda-de-precatorios-previdenciarios-divide-opinioes", "fonte_id": "jota", "data_pub": "2026-11-25T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas concordam que a cessão de crédito de precatórios previdenciários é possível, mas há divergência sobre o controle judicial necessário.", "titulo_pt": "Atuação de ofício de juízes na venda de precatórios previdenciários divide opiniões", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 287453, "titulo": "TSE vai mapear atuação do crime organizado nas eleições para ampliar combate", "url": "https://g1.globo.com/politica/noticia/2026/11/25/tse-vai-mapear-atuacao-do-crime-organizado-nas-eleicoes-para-ampliar-combate.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-25T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal Superior Eleitoral (TSE), Kassio Nunes Marques, decidiu criar um grupo de trabalho para mapear as dificuldades relacionadas ao crime organizado nas eleições e elaborar medidas de prevenção. A presença de facções criminosas no processo eleitoral é apontada como uma das principais preocupações da Justiça Eleitoral.", "titulo_pt": "TSE vai mapear atuação do crime organizado nas eleições para ampliar combate", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 287508, "titulo": "TSE cria grupo para combater candidaturas falsas e fraude à cota de gênero", "url": "https://www.metropoles.com/colunas/manoela-alcantara/tse-cria-grupo-para-combater-candidaturas-falsas-e-fraude-a-cota-de-genero", "fonte_id": "metropoles", "data_pub": "2026-11-25T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) formou um grupo de trabalho com 100 dias para elaborar propostas contra a fraude na cota de gênero e a candidatura fictícia.", "titulo_pt": "TSE cria grupo para combater candidaturas falsas e fraude à cota de gênero", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 287445, "titulo": "Moraes rejeita pedido da PGR para pagar penduricalhos com crédito extra de R$ 324 milhões", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/moraes-rejeita-pedido-da-pgr-para-pagar-penduricalhos-com-credito-extra-de-r-324-milhoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, negou o pedido da PGR para que o governo abrisse um crédito extraordinário de R$ 324 milhões para cobrir verbas adicionais para o Ministério Público. O pedido foi rejeitado e não haverá crédito extra neste ano.", "titulo_pt": "Moraes nega pedido para crédito extra de R$ 324 milhões para ministério público", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 287454, "titulo": "Caso Master: defesa de Vorcaro pede que Nunes Marques deixe relatoria de ação no STF contra Fachin", "url": "https://g1.globo.com/politica/noticia/2026/11/25/defesa-de-vorcaro-pede-troca-de-kassio-na-relatoria-da-acao-contra-fachin.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-25T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Daniel Vorcaro pediu que o ministro Kassio Nunes Marques deixe a relatoria da ação que questiona a atuação do ministro Edson Fachin no caso Master. Os advogados argumentam que o ministro Gilmar Mendes seria o mais indicado para relatar o caso.", "titulo_pt": "Defesa de Vorcaro pede que Nunes Marques deixe relatoria de ação contra Fachin no STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 287494, "titulo": "Governo deve renovar subsídio ao diesel por mais 30 dias", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/governo-deve-renovar-subsidio-ao-diesel-por-mais-30-dias", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-25T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe econômica vai prorrogar por mais 30 dias o subsídio de R$ 2,12 por litro de diesel, o que pode custar entre R$ 8 bilhões e R$ 10,5 bilhões. O impacto total das políticas de controle de preços de combustíveis em 2026 deve chegar a cerca de R$ 85 bilhões.", "titulo_pt": "Governo deve renovar subsídio ao diesel por mais 30 dias", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 287584, "titulo": "Análise: PT busca mais escuta de Lula em nova “Carta ao Povo Brasileiro”", "url": "https://www.cnnbrasil.com.br/politica/analise-pt-busca-mais-escuta-de-lula-em-nova-carta-ao-povo-brasileiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT lançou uma nova 'Carta ao Povo Brasileiro' com seu projeto nacional desenvolvimentista e alertas sobre a extrema-direita para o próximo governo.", "titulo_pt": "PT lança nova 'Carta ao Povo Brasileiro' buscando mais escuta de Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287457, "titulo": "USP diz que Haddad voltará a dar aulas na pós-graduação em Ciência Política em 2027", "url": "https://g1.globo.com/politica/noticia/2026/11/25/usp-haddad-pos-graduacao-2027.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-25T19:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Fernando Haddad será credenciado para lecionar novamente na Universidade de São Paulo (USP) em 2027, na disciplina de Ciência Política. Haddad foi licenciado enquanto ocupava cargos governamentais.", "titulo_pt": "Haddad volta a dar aulas na USP em 2027", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 287446, "titulo": "Defensores públicos alertam que redução da maioridade penal fortalece facções", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/defensores-publicos-alertam-que-reducao-da-maioridade-penal-fortalece-faccoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T19:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Defensores públicos alertam que a redução da maioridade penal de 18 para 16 anos pode aumentar o recrutamento de adolescentes por facções criminosas, fortalecendo-as.", "titulo_pt": "Defensores públicos alertam que redução da maioridade penal fortalece facções", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 287690, "titulo": "Lula não ofereceu cargo a Haddad em conversa, dizem aliados", "url": "https://www.jota.info/executivo/lula-nao-ofereceu-cargo-a-haddad-em-conversa-dizem-aliados", "fonte_id": "jota", "data_pub": "2026-11-25T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados afirmam que Lula não ofereceu cargo a Haddad em conversa. Durante o encontro, o ex-ministro discutiu sobre o quarto mandato, mas não expressou intenção de compô-lo.", "titulo_pt": "Lula não ofereceu cargo a Haddad em conversa, dizem aliados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 287447, "titulo": "Assembleia do RJ articula aumento de salário para Douglas Ruas e secretários", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/assembleia-do-rj-articula-aumento-de-salario-para-douglas-ruas-e-secretarios.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Assembleia Legislativa do Rio de Janeiro, presidida pelo governador eleito Douglas Ruas, está discutindo o reajuste dos salários do chefe do Executivo, vice, secretários e subsecretários. A discussão está sendo realizada nesta semana.", "titulo_pt": "Assembleia do RJ planeja aumento de salário para Douglas Ruas e secretários", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 287439, "titulo": "Discriminação por ideologia política e suas implicações trabalhistas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/politicas-e-justica/2026/11/discriminacao-por-ideologia-politica-e-suas-implicacoes-trabalhistas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após as eleições, surgiram relatos de que influenciadores digitais estariam incentivando a recusa de contratação e até a demissão de empregados por suas escolhas políticas. A Constituição Federal do Brasil estabelece que os princípios da dignidade da pessoa humana e dos valores sociais do trabalho e da livre iniciativa devem ser interpretados conjuntamente.", "titulo_pt": "Discriminação por ideologia política e suas implicações trabalhistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 287188, "titulo": "US report warns of Chinese AI persona tactics targeting Taiwan elections", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/26/2003868404", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório americano alerta para o uso de técnicas de inteligência artificial de personalidades chinesas que podem ser direcionadas para influenciar as eleições taiwanesas. A informação sugere que o uso de AI pode ser uma estratégia para manipular a opinião pública na região.", "titulo_pt": "Relatório americano avisa sobre uso de AI por parte da china em campanhas eleitorais de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 287189, "titulo": "US proposed new tariffs on 14 trading partners, including Taiwan, China", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/26/2003868405", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": 287077, "texto_pt": "Os Estados Unidos propuseram novas tarifas sobre 14 parceiros comerciais, incluindo Taiwan e China. Essa medida visa potencialmente aumentar as taxas sobre importações de essas economias.", "titulo_pt": "EUA propõem novas tarifas sobre 14 parceiros comerciais, incluindo Taiwan e China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 287196, "titulo": "Foreign ministry details ongoing aid to Ukraine", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868417", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério das Relações Exteriores detalhou os esforços de ajuda continuos ao Ucrânia. As informações não especificam os tipos de assistência fornecida, mas confirmam a continuidade do apoio.", "titulo_pt": "Ministério das relações exteriores detalha assistência contínua à Ucrânia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 287916, "titulo": "Champions: l'Inter batte lo Stoccarda, la Roma pareggia col Psg", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/champions-linter-batte-lo-stoccarda-la-roma-pareggia-col-psg_7b044764-5748-4171-b472-55b9f724c3d3.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-25T21:56:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Inter venceu o Stoccarda por 2-0 em casa. A Roma empatou 2-2 com o PSG em Paris.", "titulo_pt": "Campeões: inter vence Stoccarda, Roma empatou com o Psg", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 287749, "titulo": "Lukoil to Sell Foreign Assets, but Not to Kushner and Witkoff Associates", "url": "https://www.nytimes.com/2026/11/25/us/politics/lukoil-deal.html", "fonte_id": "nyt_world", "data_pub": "2026-11-25T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa russa de energia Lukoil planeja vender ativos internacionais para um consórcio liderado por americanos. No entanto, empresas de negócios do Oriente Médio associadas a dois enviados do governo Trump desistiram da negociação devido a mudanças políticas.", "titulo_pt": "Lukoil vai vender ativos estrangeiros, mas não para associados de Kushner e Witkoff", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 287917, "titulo": "Morto Andy Taylor, ex chitarrista dei Duran Duran", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/morto-andy-taylor-ex-chitarrista-dei-duran-duran_08714bc5-1af8-49ef-b7fe-d063c2a5985a.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-25T21:52:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Andy Taylor, ex-guitarrista dos Duran Duran, faleceu. Ele tinha 65 anos e foi diagnosticado com câncer de próstata em 2018.", "titulo_pt": "Morto Andy Taylor, ex-guitarrista dos Duran Duran", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 287559, "titulo": "Citigroup avalia retorno à Venezuela após cinco anos e negocia sanções com os EUA", "url": "https://www.infomoney.com.br/mercados/citigroup-avalia-retorno-a-venezuela-apos-cinco-anos-e-negocia-sancoes-com-os-eua/", "fonte_id": "infomoney", "data_pub": "2026-11-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Citigroup está discutindo com a administração Trump as condições para retornar às operações na Venezuela após cinco anos. A empresa também está negociando alívios nas sanções impostas pelos Estados Unidos.", "titulo_pt": "Citigroup avalia retorno à Venezuela após cinco anos e negocia sanções com os EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 287868, "titulo": "North Korea expels Swiss diplomat in sanctions row", "url": "https://www.bbc.co.uk/news/articles/cq0l34e4kkr5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-25T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte expulsou um diplomata suíço em razão de disputas relacionadas a sanções. Apesar disso, oficiais suíços disseram que manteriam relações através do embaixado da Suíça em Berna e do embaixada da Coreia do Norte em Beijing.", "titulo_pt": "Coreia do norte expulsa diplomata suíço em disputa sobre sanções", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 287776, "titulo": "Australian politics live: Hanson ‘delighted’ as Liberal senator defects to One Nation; Bowen says global tensions ‘infected’ Cop31", "url": "https://www.theguardian.com/australia-news/live/2026/nov/26/labor-anthony-albanese-pauline-hanson-one-nation-angus-taylor-coalition-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-25T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pauline Hanson declarou-se satisfeita com a defecção da senadora Leah Blyth para seu partido, One Nation, na Austrália. Blyth se juntará ao partido após o senador Barnaby Joyce, sendo a segunda defecção de alto perfil do governo para One Nation.", "titulo_pt": "Hanson satisfeita com defecção de senadora para One Nation", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 287900, "titulo": "Loud explosions rock Riyadh as Houthis attack Saudi ports", "url": "https://www.middleeasteye.net/news/loud-booms-rock-riyadh-houthis-attack-saudi-ports", "fonte_id": "middle_east_eye", "data_pub": "2026-11-25T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Explosões foram ouvidas em Riyadh na Arábia Saudita, enquanto os hutis do Iêmen afirmaram ter atacado os portos de Jeddah e Jazan na costa do Mar Vermelho. As capacidades de detergência e defesa da Arábia Saudita continuam sendo desafiadas por esses ataques.", "titulo_pt": "Explodiram em Riyadh durante ataques hutis aos portos da arábia saudita", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 287714, "titulo": "Manifestaciones 25-N contra la violencia de género, en directo | Decenas de miles de mujeres inundan las calles de las principales ciudades contra la violencia de género", "url": "https://elpais.com/sociedad/2026-11-25/manifestaciones-25-n-contra-la-violencia-de-genero-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-25T21:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Decenas de milhares de mulheres marcham nas principais cidades contra a violência de género. Ana Redondo afirma que não há equidistância na defesa das mulheres que sofrem violência machista.", "titulo_pt": "Manifestações 25-N contra a violência de gênero, em directo | milhares de mulheres ocupam as ruas contra a violência de gênero", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 287948, "titulo": "N.K. leader stresses use of tactical nukes in diverse areas", "url": "https://en.yna.co.kr/view/AEN20261126000500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder norte-coreano Kim Jong-un visitou uma fábrica nuclear. Ele enfatizou o uso de armas nucleares táticas em diversas áreas.", "titulo_pt": "Líder norte-coreano destaca uso de armas nucleares táticas em diversos locais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 287944, "titulo": "Grand gestures at Apec in Shenzhen. But what about the small things?", "url": "https://www.scmp.com/opinion/china-opinion/article/3375592/grand-gestures-apec-shenzhen-what-about-small-things", "fonte_id": "scmp", "data_pub": "2026-11-25T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após a saída dos líderes mundiais dos locais da Apec em Shenzhen na quinta-feira, as entregas de comida recomeçaram e começou a chover. Durante os dias anteriores, a área havia sido limpa e o tempo havia sido favorável, com flores nas ruas sob céu azul.", "titulo_pt": "Grandes gestos na Apec em Shenzhen, mas e os detalhes pequenos?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [{"titulo": "Incêndio perto do Cairo deixa pelo menos 31 mortos após acidente com caminhão carregado com petróleo", "sumario": "Um incêndio perto do Cairo, no Egito, causado por um acidente envolvendo um caminhão carregado com petróleo, resultou em pelo menos 31 mortes e 21 feridos. Um acidente envolvendo um caminhão de combustível ocorreu na Ring Road, em Giza, perto do Cairo. Um incêndio causado por uma carreta tanque que capotou na rodovia movimentada da capital egípcia de Cairo deixou pelo menos 30 mortos e 19 feridos.", "artigos": [{"id": 287747, "titulo": "Road Fire Near Cairo Kills Dozens After Petroleum-Laden Truck Crashes", "url": "https://www.nytimes.com/2026/11/25/world/middleeast/road-fire-near-cairo-kills-dozens-after-petroleum-laden-truck-crashes.html", "fonte_id": "nyt_world", "data_pub": "2026-11-25T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio perto do Cairo, no Egito, causado por um acidente envolvendo um caminhão carregado com petróleo, resultou em pelo menos 31 mortes e 21 feridos.", "titulo_pt": "Incêndio perto do Cairo deixa pelo menos 31 mortos após acidente com caminhão carregado com petróleo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 287871, "titulo": "Egypt: At least 31 dead after fuel truck overturns on highway", "url": "https://www.dw.com/en/egypt-at-least-31-dead-after-fuel-truck-overturns-on-highway/a-80055175?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-25T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acidente envolvendo um caminhão de combustível ocorreu na Ring Road, em Giza, perto do Cairo. Várias ambulâncias estão no local e o número de mortos pode aumentar.", "titulo_pt": "Egito: pelo menos 31 mortos após caminhão de combustível capotar na rodovia", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 287865, "titulo": "At least 30 killed in massive fire as fuel tanker crashes on Cairo highway", "url": "https://www.bbc.co.uk/news/articles/cqy7rn30v314o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-25T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio causado por uma carreta tanque que capotou na rodovia movimentada da capital egípcia de Cairo deixou pelo menos 30 mortos e 19 feridos.", "titulo_pt": "Pelo menos 30 mortos em incêndio após caminhão tanque capotar na rodovia de Cairo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}]}], "economia": [{"id": 287560, "titulo": "Brasileira no Brasil e americana nos EUA: como a JBS cresce sendo local no mundo", "url": "https://www.infomoney.com.br/business/brasileira-no-brasil-e-americana-nos-eua-como-a-jbs-cresce-sendo-local-no-mundo/", "fonte_id": "infomoney", "data_pub": "2026-11-25T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os principais executivos da JBS explicaram na sede da empresa, em São Paulo, que a companhia trata cada país em que atua como uma casa, não como parte do 'resto do mundo'.", "titulo_pt": "Brasileira no Brasil e americana nos EUA: como a JBS cresce sendo local no mundo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 287568, "titulo": "Economia dos EUA cresce mais que o estimado no último trimestre", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/economia-dos-eua-cresce-mais-que-o-estimado-no-ultimo-trimestre/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PIB dos Estados Unidos avançou a uma taxa anualizada de 4,3% no último trimestre, impulsionado por investimentos empresariais. A inflação medida pelo índice PCE acelerou em outubro e permanece acima da meta do Federal Reserve.", "titulo_pt": "Economia dos EUA cresce mais que o estimado no último trimestre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287571, "titulo": "Brasil precisa resolver anomalia dos juros, diz Honorato ao CNN Money", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/brasil-precisa-resolver-anomalia-dos-juros-diz-honorato-ao-cnn-money/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista-chefe do Bradesco, Honorato, afirma que o Brasil precisa resolver a situação dos juros elevados que coexistem com uma inflação persistente acima da meta desde 1999.", "titulo_pt": "Brasil precisa resolver anomalia dos juros, diz economista do bradesco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287574, "titulo": "Ativos da Lukoil são vendidos a grupo liderado por bilionário dos EUA", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/ativos-da-lukoil-sao-vendidos-a-grupo-liderado-por-bilionario-dos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um consórcio liderado por um bilionário dos Estados Unidos comprou ativos da Lukoil em 11 países. O negócio ainda aguarda aprovação do Tesouro dos EUA.", "titulo_pt": "Ativos da Lukoil são vendidos a grupo liderado por bilionário dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287579, "titulo": "Planalto diz que tarifa dos EUA mira pressão sobre o Pix e cobra negociação", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/planalto-diz-que-tarifa-dos-eua-mira-pressao-sobre-o-pix-e-cobra-negociacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro afirmou que as tarifas dos Estados Unidos visam pressionar o sistema de pagamento Pix e solicitou negociação. A manifestação ocorreu após o USTR anunciar uma nova consulta pública sobre a ampliação das medidas tarifárias adotadas no âmbito da Seção 301.", "titulo_pt": "Planalto diz que tarifa dos EUA mira pressão sobre o Pix e cobra negociação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287430, "titulo": "IA X ferrovias: duas histórias de expansão dos investimentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/ia-x-ferrovias-duas-historias-de-expansao-dos-investimentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 15 de setembro de 1896, o maquinista Frank Barnes recordou-se da chegada de duas locomotivas vistosas para a estação: a número 999, verde com detalhes vermelhos, e a número 1001, vermelha com detalhes verdes, que seguiram em direções opostas.", "titulo_pt": "IA X ferrovias: duas histórias de expansão dos investimentos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287431, "titulo": "Proposta de novas tarifas dos EUA surpreende Brasil e expõe impasse nas negociações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/proposta-de-novas-tarifas-dos-eua-surpreende-brasil-e-expoe-impasse-nas-negociacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro foi surpreendido pela proposta dos Estados Unidos de alterar as tarifas sobre açúcar e aeronaves importadas do Brasil. A medida é vista como uma resposta às recentes ações brasileiras contra as barreiras comerciais impostas pelos Estados Unidos.", "titulo_pt": "Proposta de novas tarifas dos EUA surpreende Brasil e expõe impasse nas negociações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287619, "titulo": "Podia ter sido pior: as novas tarifas de Trump contra o Brasil", "url": "https://braziljournal.com/podia-ter-sido-pior-as-novas-tarifas-de-trump-contra-o-brasil", "fonte_id": "brazil_journal", "data_pub": "2026-11-25T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos EUA propôs novas tarifas sobre açúcar e aeronaves brasileiras, com o objetivo de aumentar a pressão nas negociações comerciais com o Brasil. Essas medidas parecem ter um impacto econômico limitado, mas são estratégicas para forçar o país a modificar suas políticas.", "titulo_pt": "Podia ter sido pior: novas tarifas de Trump contra o Brasil", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 287884, "titulo": "Tech stocks sink but close well off the lows, Anthropic struggles to rebound above IPO price", "url": "https://www.cnbc.com/2026/11/25/nvidia-ai-stock-tech-selloff.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-25T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações de tecnologia caíram, mas terminaram o dia bem distantes dos mínimos atingidos, enquanto a Anthropic teve dificuldade em recuperar o valor de sua oferta inicial. As ações de Nvidia e outras relacionadas à IA sofreram devido a preocupações sobre o gasto com IA, inflação e riscos de taxas mais altas.", "titulo_pt": "Ações de tecnologia caem, mas se recuperam; Anthropic luta para se recuperar acima do preço da IPO", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 287432, "titulo": "Por que vender o investimento que rende menos pode ser um erro?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/por-que-vender-o-investimento-que-rende-menos-pode-ser-um-erro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Você abre o extrato e constata que parte dos seus investimentos está rendendo menos que o restante. A sugestão é não vender esses investimentos apenas porque eles estão rendendo menos, pois essa diferença de desempenho pode indicar que sua carteira está sendo gerenciada de forma eficaz.", "titulo_pt": "Por que vender o investimento que rende menos pode ser um erro?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287688, "titulo": "Desembargador derruba liminar que suspendia parte do novo PAT a empresas da ABBT", "url": "https://www.jota.info/trabalho/desembargador-derruba-liminar-que-suspendia-parte-do-novo-pat-a-empresas-da-abbt", "fonte_id": "jota", "data_pub": "2026-11-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um desembargador derrubou uma liminar que suspendia parte do novo PAT a empresas da ABBT, mas a suspensão da liminar permanece válida até o julgamento colegiado no TRF1.", "titulo_pt": "Desembargador derruba liminar sobre novo PAT para empresas da ABBT, mas suspensão permanece", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 287433, "titulo": "Grão Investimentos, do Grupo Primo, lança ETF de Tesouro Prefixado na B3", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/grao-investimentos-do-grupo-primo-lanca-etf-de-tesouro-prefixado-na-b3.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Grão Investimentos, uma gestora do Grupo Primo com R$ 3 bilhões sob gestão, lançou na B3 um ETF de Tesouro Prefixado com o código GPRE11. As cotas têm um aporte inicial de R$ 25.", "titulo_pt": "Grão Investimentos, do Grupo Primo, lança ETF de Tesouro Prefixado na B3", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287434, "titulo": "Ciro Possobom renuncia ao cargo de CEO da Volkswagen do Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/ciro-possobom-renuncia-ao-cargo-de-ceo-da-volkswagen-do-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen anunciou que Ciro Possobom está deixando o cargo de presidente da empresa no Brasil a pedido por motivos pessoais e familiares. A saída ocorreu nesta quarta-feira (25).", "titulo_pt": "Ciro Possobom renuncia à presidência da Volkswagen do Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287671, "titulo": "Wall Street recorta sus pérdidas y el Dow Jones borra caída de más de 1.100 puntos en una volátil sesión", "url": "https://www.latercera.com/pulso/noticia/wall-street-repunta-volatil-sesion/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T20:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Wall Street reduziu suas perdas e o Dow Jones recuperou parte das perdas iniciais, registrando uma sessão volátil. No Chile, o IPSA seguiu a tendência positiva da Bolsa de Nova York e evitou fechar no vermelho.", "titulo_pt": "Wall Street corta perdas e Dow Jones recupera parte das perdas em sessão volátil; ipsa segue tendência positiva", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 287436, "titulo": "CVM pede que Abraicc seja assistente em ação contra OPA da Oncoclínicas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/cvm-pede-que-abraicc-seja-assistente-em-acao-contra-opa-da-oncoclinicas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CVM pediu que a Abraicc ingresse como assistente no processo judicial movido pelo fundo Josephina III contra a OPA da Oncoclínicas, que está sendo julgado na 21ª Vara Cível Federal de São Paulo.", "titulo_pt": "CVM solicita que Abraicc seja assistente na ação contra OPA da Oncoclínicas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 287689, "titulo": "Associações comerciais pedem ao STF que escala 5×2 passe a valer em outubro de 2027", "url": "https://www.jota.info/trabalho/associacoes-comerciais-pedem-ao-stf-que-escala-5x2-passe-a-valer-em-outubro-de-2027", "fonte_id": "jota", "data_pub": "2026-11-25T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Associações comerciais solicitaram ao STF que a escala 5×2 comece a valer em outubro de 2027. A entidade questionou o regime de transição do fim da escala 6x1 e as regras para a implantação.", "titulo_pt": "Associações comerciais pedem ao STF que escala 5×2 passe a valer em outubro de 2027", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 287198, "titulo": "NTU develops chips for on-device generative AI", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868419", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade Nacional de Taiwan desenvolveu chips para inteligência artificial gerativa em dispositivos locais. O objetivo é melhorar a eficiência e a privacidade no processamento de IA nos próprios equipamentos.", "titulo_pt": "NTU desenvolve chips para IA gerativa em dispositivos locais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 287953, "titulo": "Google’s patent for custom AI video feeds paints a bleak picture of entertainment’s future", "url": "https://www.theverge.com/entertainment/1042221/google-my-channel-ai-video-patent", "fonte_id": "the_verge", "data_pub": "2026-11-25T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google apresentou um patente para um sistema chamado My Channel, que visa criar feeds personalizados de vídeos e anúncios gerados por inteligência artificial com base nas informações conhecidas sobre os usuários. Embora o patente tenha sido rejeitada, há o risco de uma possível recuperação ou resubmissão, levando a implementação desse sistema.", "titulo_pt": "Patente do google para feeds personalizados de vídeo AI retrata um futuro sombrio para entretenimento", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 287503, "titulo": "Musk recebe autorização dos EUA para lançar 1 milhão de satélites no espaço", "url": "https://www.metropoles.com/mundo/musk-recebe-autorizacao-dos-eua-para-lancar-1-milhao-de-satelites-no-espaco", "fonte_id": "metropoles", "data_pub": "2026-11-25T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos autorizou a SpaceX a lançar 1 milhão de satélites de dados orbitais. Essa aprovação permite que a empresa avance com sua constelação de satélites.", "titulo_pt": "Musk recebe autorização dos EUA para lançar 1 milhão de satélites no espaço", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 287950, "titulo": "Banks' bad-loan ratio down in Q3", "url": "https://en.yna.co.kr/view/AEN20261125008800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de empréstimos problemáticos dos bancos sul-coreanos diminuiu levemente no terceiro trimestre.", "titulo_pt": "Taxa de empréstimos problemáticos dos bancos sul-coreanos diminuiu no terceiro trimestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 287966, "titulo": "Google search alternative Kagi launches Gmail rival", "url": "https://arstechnica.com/gadgets/2026/11/google-search-alternative-kagi-launches-gmail-rival/", "fonte_id": "ars_technica", "data_pub": "2026-11-25T20:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kagi, uma alternativa ao Google Search, lançou uma rival do Gmail. O pitch do serviço é uma combinação incomum de promessas de privacidade e características de inteligência artificial.", "titulo_pt": "Kagi lança rival do Gmail como alternativa ao google search", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 287959, "titulo": "FCC approves SpaceX plan to put AI data centers in space", "url": "https://techcrunch.com/2026/11/25/fcc-approves-spacex-plan-to-put-ai-data-centers-in-space/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FCC aprovou o plano da SpaceX de implantar centros de dados de IA no espaço, descartando algumas das principais preocupações levantadas pelos oponentes, como os supostos riscos para a pesquisa científica, porque o agente determinou que essas preocupações estavam fora do seu escopo regulatório.", "titulo_pt": "FCC aprova plano da SpaceX para colocar centros de dados de IA no espaço", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287859, "titulo": "\"The flashing red lights couldn't be brighter\": Democrats demand new restrictions on AI", "url": "https://www.axios.com/2026/11/25/democrats-ai-safety-restrictions-openai-anthropic-axios", "fonte_id": "axios", "data_pub": "2026-11-25T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Políticos democratas nos Estados Unidos estão pedindo novas restrições ao desenvolvimento de inteligência artificial após relatos de que funcionários de OpenAI e Anthropic temem que seus modelos mais poderosos não possam ser liberados de forma segura. O debate político sobre a IA está expandindo além das consequências econômicas para uma questão mais existencial: se as empresas deveriam ser permitidas a construir sistemas que podem não serem controlados.", "titulo_pt": "Luvas vermelhas piscando: democratas pedem novas restrições à IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 287960, "titulo": "OpenAI says heavy ChatGPT users may hit limits sooner as it merges Chat and Work", "url": "https://techcrunch.com/2026/11/25/openai-says-heavy-chatgpt-users-may-hit-limits-sooner-as-it-merges-chat-and-work/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI introduzirá um único limite de uso para o ChatGPT ao combinar as experiências de Chat e Work. Isso pode afetar os usuários maisativos do ChatGPT mais rapidamente.", "titulo_pt": "Openai alerta que usuários ativos do ChatGPT podem atingir os limites mais rápido com a unificação de Chat e Work", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287961, "titulo": "Jensen Huang broke Nvidia’s code of conduct, and his employees may not forget it", "url": "https://techcrunch.com/2026/11/25/jensen-huang-broke-nvidias-code-of-conduct-and-his-employees-may-not-forget-it/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T19:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang violou o código de conduta da Nvidia, o que pode ter consequências significativas para a empresa e seus funcionários. O código de conduta reflete a cultura corporativa, e essa violação pode ter impacto duradouro.", "titulo_pt": "Jensen Huang violou o código de conduta da Nvidia, e os funcionários podem não esquecer isso", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287962, "titulo": "The canceled Tesla Cybertruck is the fastest-selling used truck in America", "url": "https://techcrunch.com/2026/11/25/the-canceled-tesla-cybertruck-is-the-fastest-selling-used-truck-in-america/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T19:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Tesla Cybertruck se tornou o caminhão usado mais rápido a ser vendido nos Estados Unidos, ficando no mercado por média de 39,1 dias, contra 65,5 dias para os caminhões em geral.", "titulo_pt": "O Cybertruck cancelado é o caminhão usado mais vendido nos EUA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287963, "titulo": "Anthropic’s Dario Amodei calls accusations of surrendering human control to AI ‘absurd’", "url": "https://techcrunch.com/2026/11/25/anthropics-dario-amodei-calls-accusations-of-surrendering-human-control-to-ai-absurd/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dario Amodei, CEO da Anthropic, rechaça acusações de que ele apoia a cedência do controle humano para a inteligência artificial, enquanto as principais empresas de IA automatizam cada vez mais suas próprias pesquisas e desenvolvimento de modelos.", "titulo_pt": "Dario Amodei da anthropic considera acusações de cedência ao controle da IA ‘absurdas’", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287860, "titulo": "Anthropic CEO pushes back on Axios reporting on AI and free will", "url": "https://www.axios.com/2026/11/25/anthropic-dario-amodei-ai-free-will-contro-axios", "fonte_id": "axios", "data_pub": "2026-11-25T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Anthropic, Dario Amodei, rejeitou a ideia de que humanos devem ceder a liberdade de escolha para a inteligência artificial. Ele se posicionou contra a cedência de governança para a IA, mas é mais cauteloso sobre a automação de tarefas específicas.", "titulo_pt": "CEO da anthropic se posiciona contra cedência de liberdade de escolha para a IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 287964, "titulo": "1Password said hackers broke into its internal systems, but customer passwords are safe", "url": "https://techcrunch.com/2026/11/25/1password-said-hackers-broke-into-its-internal-systems-but-customer-passwords-are-safe/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T18:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa 1Password informou que hackers conseguiram acessar um dos seus sistemas corporativos através de uma conta de funcionário e obtiveram algumas informações dos clientes, mas os dados das senhas dos clientes permanecem seguros.", "titulo_pt": "1Password afirma que hackers invadiram seus sistemas internos, mas as senhas dos clientes estão seguras", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287967, "titulo": "Backblaze explains why it's sharing customer information with advertisers", "url": "https://arstechnica.com/information-technology/2026/11/backblaze-explains-why-its-sharing-customer-information-with-advertisers/", "fonte_id": "ars_technica", "data_pub": "2026-11-25T18:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Backblaze informou à Ars Technica que não compartilhará os arquivos de backup e armazenamento dos usuários com anunciantes. A empresa explicou que a informação compartilhada é apenas sobre o uso do serviço, não os dados pessoais.", "titulo_pt": "Backblaze explica por que compartilhará informações dos usuários com anunciantes", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 287969, "titulo": "The Iowa Lead Detonation Happened. Now the Real Work Begins to Study It", "url": "https://www.wired.com/story/iowa-lead-detonation-real-monitoring-work-begins/", "fonte_id": "wired", "data_pub": "2026-11-25T18:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resultados preliminares indicam que há sinais mínimos de chumbo no ambiente, mas a testagem mais rigorosa levará alguns dias para ser concluída.", "titulo_pt": "A detonação no Iowa deu causa. Agora começa o trabalho Real de estudo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 287968, "titulo": "The FCC has authorized SpaceX to deploy 1 million satellites", "url": "https://arstechnica.com/space/2026/11/the-fcc-has-authorized-spacex-to-deploy-1-million-satellites/", "fonte_id": "ars_technica", "data_pub": "2026-11-25T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FCC autorizou a SpaceX a implantar 1 milhão de satélites. Este conjunto de satélites aumentaria significativamente o número de satélites em órbita, aproximadamente 50 vezes.", "titulo_pt": "A FCC autorizou a SpaceX a implantar 1 milhão de satélites", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 287975, "titulo": "Stabilizing atomically thin metals with sandwich structures: Machine learning expands the search", "url": "https://phys.org/news/2026-11-stabilizing-atomically-thin-metals-sandwich.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Universidade de Jyväskylä identificaram mais de 300 estruturas estáveis de metallenas em sanduíche usando aprendizado de máquina e computação de alto desempenho. Os resultados oferecem a pesquisa um guia prático para a fabricação de novos metais bidimensionais.", "titulo_pt": "Estabilizando metais ultrathin com estruturas de sanduíche: aprendizado de máquina amplia a busca", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287976, "titulo": "Smartphone app uses AI to identify illegal wildlife products", "url": "https://phys.org/news/2026-11-smartphone-app-ai-illegal-wildlife.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aplicativos de smartphones usam inteligência artificial para identificar produtos ilegais de vida selvagem. A troca ilegal e insustentável de animais é um importante fator na perda de biodiversidade.", "titulo_pt": "Aplicativo de smartphone usa IA para identificar produtos ilegais de vida selvagem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287973, "titulo": "Why Medicare’s 2027 physician pay changes worry some specialists", "url": "https://www.statnews.com/2026/11/25/medicare-physician-fee-schedule-change-worry-some-specialists/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-25T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cortes nas taxas de pagamento do Medicare para certos serviços médicos prestados no mesmo dia podem afetar alguns especialistas mais do que outros.", "titulo_pt": "Cortes no pagamento de médicos pelo Medicare em 2027 preocupam alguns especialistas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 288025, "titulo": "On this day in space! Nov. 25, 1970: NASA's 'wingless' M2-F3 'lifting body' aircraft makes its 1st powered flight ahead of supersonic tests", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-25-2026", "fonte_id": "space_com", "data_pub": "2026-11-25T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 25 de novembro de 1970, o avião experimental Northrop M2-F3 realizou seu primeiro voo com propulsão. Este voo foi importante porque o M2-F3 era um 'corpo levantador' sem asas, projetado para testes supersonicos.", "titulo_pt": "25 De novembro de 1970: o avião experimental northrop M2-F3 realiza seu primeiro voo com propulsão", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 287977, "titulo": "Certain fungi turn specialized plant cells into water-carrying cells using one protein", "url": "https://phys.org/news/2026-11-fungi-specialized-cells-protein.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisa, liderado pela Universidade de Göttingen, descobriu como certos fungos promovem a formação de novas células conductoras de água em plantas, aumentando a tolerância dessas plantas à estresse por seca. Os resultados foram publicados na revista Cell Host & Microbe.", "titulo_pt": "Certos fungos transformam células especializadas de plantas em células de transporte de água usando uma única proteína", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287978, "titulo": "Carbon nanotube measurements reveal quantum model better explains collective electron behavior", "url": "https://phys.org/news/2026-11-carbon-nanotube-reveal-quantum-electron.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de cientistas da Lituânia, Finlândia e Israel realizou pesquisas teóricas e experimentais em nanotubos de carbono, sendo os primeiros a demonstrar qual modelo físico governa o movimento e as interações de elétrons dentro deles.", "titulo_pt": "Medições em nanotubos de carbono revelam que o modelo quântico explica melhor o comportamento coletivo dos elétrons", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287979, "titulo": "Five reasons why we should still make things with our hands", "url": "https://phys.org/news/2026-11-five-reasons-why-we-should.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história começa às 7 da manhã, com Alex acordando para uma agenda cheia, incluindo uma reunião importante às 8h30. No café da manhã, Alex usa um assistente virtual para ajustar a temperatura do café.", "titulo_pt": "Cinco razões pelas quais ainda devemos fazer coisas com as mãos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287974, "titulo": "STAT+: FDA approves Cogent’s drug for rare stomach cancer", "url": "https://www.statnews.com/2026/11/25/biotech-news-fda-approves-cogents-drug-for-rare-stomach-cancer/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-25T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou o tratamento contra câncer de estômago da Cogent Biosciences, em combinação com o medicamento Sutent, fabricado pela Pfizer.", "titulo_pt": "FDA aprova tratamento da Cogent para câncer raro do estômago", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 287980, "titulo": "New inhibitor restores antibiotic activity against drug-resistant bacteria", "url": "https://phys.org/news/2026-11-inhibitor-antibiotic-drug-resistant-bacteria.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Imperial College London e colaboradores identificaram um inibidor de pequenas moléculas potente que pode restaurar a atividade do antibiótico ciprofloxacin contra o Stafilococo aureus resistente à meticilina (MRSA).", "titulo_pt": "Novo inibidor restaura a atividade do antibiótico contra bactérias resistentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287981, "titulo": "NASA's Europa Clipper zooming by Earth on way to Jupiter's icy moon", "url": "https://phys.org/news/2026-11-nasa-europa-clipper-earth-jupiter.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Europa Clipper da NASA vai realizar um voo próximo à Terra antes de se dirigir a Júpiter, onde o orbital buscará determinar se o oceano sob o manto de gelo da lua europaana tem os ingredientes para a vida. O voo passará por aqui para economizar combustível e preparar a missão para a coleta de dados científicos.", "titulo_pt": "Europa Clipper da nasa se aproximará da terra em caminho para o manto de gelo da lua europaana de júpiter", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287702, "titulo": "Sonda Hera revela primeiras imagens do asteroide atingido pela Nasa", "url": "https://veja.abril.com.br/ciencia/sonda-hera-revela-primeiras-imagens-do-asteroide-atingido-pela-nasa/", "fonte_id": "veja", "data_pub": "2026-11-25T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão da ESA (Agência Espacial Europeia) chegou ao asteroide Dimorphos dois anos após o lançamento, com o objetivo de investigar os efeitos do impacto causado pela nave DART da NASA, que alterou a órbita do corpo celeste.", "titulo_pt": "Sonda Hera revela primeiras imagens do asteroide atingido pela Nasa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 287982, "titulo": "Shopping as a 'collector' makes us want to buy more, new research shows", "url": "https://phys.org/news/2026-11-collector-buy.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que compradores tendem a adquirir mais produtos e a pagar mais quando têm uma mentalidade de colecionador. Isso foi descrito em pesquisa co-autoria da Bayes Business School (City St George's, University of London).", "titulo_pt": "Compras com mentalidade de colecionador fazem consumidores gastarem mais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287983, "titulo": "Giant lambda-shaped stellar nursery found in the Milky Way's outskirts", "url": "https://phys.org/news/2026-11-giant-lambda-stellar-nursery-milky.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram uma rede grande de filamentos de gás molecular nas regiões externas da Via Láctea, chamada λ-complex. Este sistema de filamentos é maior do que a maioria dos sistemas conhecidos de hubs-filamentos.", "titulo_pt": "Nuvem estelar gigante do tipo lambda encontrada nos limites da via láctea", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287984, "titulo": "Sustainable procurement in multinational corporations depends on people and the operating environment", "url": "https://phys.org/news/2026-11-sustainable-multinational-corporations-people-environment.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa de doutorado de Elizabeth Jeromaa, a ser examinada na Universidade de Vaasa, mostra que é possível para empresas multinacionais implementarem práticas de compra sustentável ambientalmente, mas não existe um modelo universalmente aplicável.", "titulo_pt": "Compras sustentáveis em empresas multinacionais dependem de pessoas e do ambiente operacional", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287985, "titulo": "Heaven scent: Study shows link between a partner's body odor and sexual intimacy", "url": "https://phys.org/news/2026-11-heaven-scent-link-partner-body.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa demonstra que o cheiro natural do parceiro pode estar relacionado à intimidade sexual. Muitas pessoas gastam tempo e dinheiro para esconder seu odor natural, mas para alguns, este odor pode ser parte do que faz um casal se entender bem.", "titulo_pt": "Cheiro do céu: estudo mostra ligação entre o odor natural do parceiro e a intimidade sexual", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287986, "titulo": "Using lunar craters as free radiation shields for moon base nuclear reactors", "url": "https://phys.org/news/2026-11-lunar-craters-free-shields-moon.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T19:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A energia para qualquer base lunar futura representa um desafio de engenharia significativo. Para superar a falta de energia durante a noite lunar de duas semanas, os engenheiros planejam usar um reator nuclear para pelo menos parcialmente suprir as necessidades energéticas da futura colonização lunar.", "titulo_pt": "Usando crateras lunares como proteção gratuita contra radiação para reatores nucleares de base na lua", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 287418, "titulo": "Prêmio LeYa decide não selecionar nenhum livro em 2026 por 'falta de qualidade'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/premio-leya-decide-nao-selecionar-nenhum-livro-em-2026-por-falta-de-qualidade.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O júri do Prêmio LeYa se reuniu em 24 de novembro de 2026 e decidiu não selecionar nenhum livro para a edição de 2026, citando falta de qualidade. O vencedor da edição deste ano ainda não foi anunciado.", "titulo_pt": "Prêmio LeYa não seleciona livro em 2026 por 'falta de qualidade'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 288003, "titulo": "Andy Taylor, guitarist in Duran Duran, dies aged 65", "url": "https://www.theguardian.com/music/2026/nov/25/andy-taylor-duran-duran-guitarist-dead", "fonte_id": "guardian_culture", "data_pub": "2026-11-25T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Taylor, guitarrista da banda Duran Duran, faleceu aos 65 anos após ser diagnosticado com câncer de próstata em estágio avançado em 2018. Ele revelou sua condição pública em 2022, quando a banda estava prestes a ser inductada no Rock and Roll Hall of Fame.", "titulo_pt": "Andy Taylor, guitarrista do Duran Duran, morre aos 65 anos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 287722, "titulo": "Una mendocina de 23 años ganó el Miss Mundo Argentina y representará al país en el certamen internacional", "url": "https://www.lanacion.com.ar/sociedad/una-mendocina-de-23-anos-gano-el-miss-mundo-argentina-y-representara-al-pais-en-el-certamen-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-25T21:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Giuliana Mangani, de 23 anos, venceu o Miss Mundo Argentina e será a representante do país no concurso internacional, que ocorrerá no próximo ano em Tanzania. Ela estuda Economia e apresentou um projeto sobre a inclusão laboral de idosos.", "titulo_pt": "Meninoense de 23 anos vence Miss Mundo Argentina e representará o país no concurso internacional", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 287696, "titulo": "Ator de ‘Um Amor para Recordar’ estará em filme dirigido por brasileira", "url": "https://veja.abril.com.br/cultura/ator-de-um-amor-para-recordar-estara-em-filme-dirigido-por-brasileira/", "fonte_id": "veja", "data_pub": "2026-11-25T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Shane West, conhecido por seu papel em 'Um Amor para Recordar', está se juntando a Michel Gomes e André Ramiro no elenco de um filme dirigido por uma brasileira. O filme se chama 'Harriet saparecidos após mina ilegal de ouro se encher na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285756, "titulo": "Por que as negociações climáticas travaram na COP31 e foram um ‘fracasso’, segundo Marina Silva", "url": "https://veja.abril.com.br/agenda-verde/por-que-as-negociacoes-climaticas-travaram-na-cop31-e-foram-um-fracasso-segundo-marina-silva/", "fonte_id": "veja", "data_pub": "2026-11-25T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As negociações climáticas na COP31 ficaram paralisadas devido a impasses entre grandes potências e bloqueios em temas centrais, resultando em um 'fracasso' conforme declarou Marina Silva.", "titulo_pt": "Por que as negociações climáticas na COP31 travaram e foram um ‘fracasso’, segundo Marina Silva", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285797, "titulo": "Clima: ciclone extratropical avança pelo Sul e provoca nova frente fria", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-avanca-pelo-sul-e-provoca-nova-frente-fria", "fonte_id": "metropoles", "data_pub": "2026-11-25T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Inmet prevê chuvas fortes em áreas do Sul, Sudeste e Centro-Oeste do Brasil. No Nordeste, o calor pode chegar a 41°C.", "titulo_pt": "Ciclone extratropical avança pelo Sul e provoca nova frente fria, com chuvas fortes e calor no nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286018, "titulo": "Large bushfire threatens homes and properties on remote island off Tasmania", "url": "https://www.theguardian.com/australia-news/2026/nov/25/large-bushfire-threatens-homes-and-properties-on-remote-island-off-tasmania", "fonte_id": "guardian_world", "data_pub": "2026-11-25T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal em Flinders Island, uma ilha remota no Estreito de Bass, ameaça casas e propriedades após se
