/*https://www1.folha.uol.com.br/ilustrada/2026/11/alaide-costa-e-comedia-natalina-o-que-ver-na-tv-e-no-streaming-nesta-segunda.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-21T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alaíde Costa foi uma das pioneiras da bossa nova e a única mulher negra no gênero. Seu documentário 'A Noite de Alaíde', dirigido por Liliane Mutti, foi lançado sessenta anos após sua injusta exclusão de uma apresentação no Carnegie Hall, em Nova York.", "titulo_pt": "Alaíde Costa e comédia natalina: o que ver na TV e no streaming nesta segunda", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 279961, "titulo": "Jeff Goldblum Performs a Piano Medley and Reflects on His Career at Marrakech Film Festival: ‘The Stories That We Tell Matter’", "url": "https://variety.com/2026/film/global/jeff-goldblum-career-marrakech-film-festival-tilda-swinton-1236954972/", "fonte_id": "variety", "data_pub": "2026-11-21T19:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jeff Goldblum recebeu um prêmio de homenagem no Festival de Cinema de Marrakech, surpreendendo o público com uma performance ao piano antes de refletir sobre sua carreira de mais de meio século, enfatizando que 'as histórias que contamos importam'.", "titulo_pt": "Jeff Goldblum recebe homenagem e se apresenta ao Piano no Festival de Marrakech", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 279757, "titulo": "Renunció Julio Bocca al Ballet del Teatro Colón y Herman Cornejo será el nuevo director", "url": "https://www.clarin.com/cultura/renuncio-julio-bocca-ballet-teatro-colon-herman-cornejo-nuevo-director_0_TaVWIkLUzk.html", "fonte_id": "clarin", "data_pub": "2026-11-21T19:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Julio Bocca, que liderou o Ballet Estable do Teatro Colón por quase dois anos, deixou sua posição e será substituído por Herman Cornejo. Cornejo, que tem experiência no American Ballet Theatre e como coach e produtor, buscará fortalecer a identidade da companhia, cuidar dos seus integrantes e projetá-la internacionalmente.", "titulo_pt": "Julio Bocca deixa diretoria do Ballet do Teatro Colón e Herman Cornejo assume", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279962, "titulo": "Russell Crowe’s Request to Shoot ‘A Beautiful Mind’ Chronologically Added $1 Million to the Budget, Says Ron Howard: ‘It Was the Right Kind of Investment’", "url": "https://variety.com/2026/film/news/russell-crowe-a-beautiful-mind-sequence-ron-howard-1236955038/", "fonte_id": "variety", "data_pub": "2026-11-21T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ron Howard, diretor de 'A Bela Mente', afirmou que a sugestão de Russell Crowe para gravar o filme cronologicamente, o que custou um extra de $1 milhão ao orçamento, foi 'o tipo certo de investimento'. O filme de 2001 segue a carreira acadêmica do matemático John Forbes Nash Jr., interpretado por Crowe, enquanto ele luta com esquizofrenia.", "titulo_pt": "Requisito de russell Crowe para gravação cronológica de 'A bela mente' custo $1 milhão adicional, diz Ron Howard", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 279963, "titulo": "How the ‘Elsinore’ Makeup Team Transformed Stars Andrew Scott and Olivia Colman to Bring the Story of Ian Charleson to Life", "url": "https://variety.com/2026/artisans/news/elsinore-makeup-olivia-colman-andrew-scott-1236954968/", "fonte_id": "variety", "data_pub": "2026-11-21T19:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Scott interpreta Ian Charleson, um ator que realizou sua última performance enquanto lutava com o AIDS. 'Elsinore' narra a história emocionante e inspiradora de Charleson enfrentando sua morte com coragem, honestidade e senso de humor.", "titulo_pt": "Como a equipe de maquiagem de 'Elsinore' transformou atores para recontar a história de Ian Charleson", "veiculo": "Variety", "pais": "EUA", "classe": "C"}], "cultura__eventos": [], "sociedade": [{"id": 279715, "titulo": "Sobe para 5 número de mortos em Tupanciretã (RS); 265 ficaram feridos", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/sobe-para-5-o-numero-de-mortos-em-tupancireta-rs-265-ficaram-feridos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos em Tupanciretã, no Rio Grande do Sul, subiu para cinco. Cerca de 265 pessoas ficaram feridas. Os ventos de até 114 km/h destelharam quase 8 mil casas, afetando 99% dos moradores da cidade.", "titulo_pt": "Subiu para 5 o número de mortos em Tupanciretã; 265 ficaram feridos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279672, "titulo": "Homem sobrevive após ter uma faca cravada na nuca, em Machado (MG)", "url": "https://www.metropoles.com/minas-gerais/homem-sobrevive-apos-ter-uma-faca-cravada-na-nuca-em-machado-mg", "fonte_id": "metropoles", "data_pub": "2026-11-21T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem sobreviveu após ter uma faca cravada na nuca em Machado, Minas Gerais. Ele foi submetido a um procedimento cirúrgico em Alfenas e recebeu alta hospitalar na quinta-feira, 19 de novembro.", "titulo_pt": "Homem sobrevive após ter uma faca cravada na nuca, em Machado (MG)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 279836, "titulo": "Brigadas Rojas. Con el arresto de otra mujer, suman seis los detenidos por ser parte de un grupo que apoyó la fuga de Bertulazzi", "url": "https://www.lanacion.com.ar/seguridad/brigadas-rojas-con-el-arresto-de-otra-mujer-suman-seis-los-detenidos-por-ser-parte-de-un-grupo-que-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T21:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Seis pessoas foram detidas por supostamente terem colaborado com o fugitivo italiano Bertulazzi. A busca pelo exterrorista continua enquanto são identificadas e presas outras pessoas envolvidas no caso.", "titulo_pt": "Brigadas vermelhas. Com a detenção de mais uma mulher, chegam a seis os detidos por colaborar com a fuga de Bertulazzi", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 279742, "titulo": "Duas horas para agir: o que já vale para proteger mulheres da violência digital", "url": "https://www.jota.info/opiniao-e-analise/colunas/tabus-e-mulheres/duas-horas-para-agir-o-que-ja-vale-para-proteger-mulheres-da-violencia-digital", "fonte_id": "jota", "data_pub": "2026-11-21T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute as mudanças que ocorreram para as vítimas de violência digital que denunciam o crime, bem como os aspectos ainda em desenvolvimento. Aborda o tempo limitado disponível para ação em situações de violência digital.", "titulo_pt": "Dois horas para agir: o que já vale para proteger mulheres da violência digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 279751, "titulo": "La ruta del dinero de la AFA: piden rastrear nuevas cuentas por los US$ 300 millones de ganancias de la Selección", "url": "https://www.clarin.com/politica/ruta-dinero-afa-piden-rastrear-nuevas-cuentas-us-300-millones-ganancias-seleccion_0_YuhEzW3GMr.html", "fonte_id": "clarin", "data_pub": "2026-11-21T20:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O empresário Guillermo Tofoni pediu à Justiça que ampliasse o pedido para rastrear movimentações financeiras de novos agentes de cobrança da AFA em Dubai e Malta. Além disso, solicitou a embargos de fundos de imputados e o arrolamento de sedes da AFA.", "titulo_pt": "Rota do dinheiro da AFA: empresário pede rastreamento de novas contas por US$ 300 milhões", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279801, "titulo": "Condenan a presidio perpetuo a dos hombres por homicidio de padre que acompañó a su hijo a vender una PlayStation en Rancagua", "url": "https://www.latercera.com/nacional/noticia/condenan-a-presidio-perpetuo-a-dos-hombres-por-homicidio-de-padre-que-acompano-a-su-hijo-a-vender-una-playstation-en-rancagua/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T19:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dois homens foram condenados a prisão perpétua pelo assassinato de um pai que acompanhou seu filho durante uma venda de PlayStation em Rancagua em julho de 2025. Um terceiro indivíduo, que era adolescente no momento dos fatos, recebeu uma pena de 10 anos de internação em regime fechado.", "titulo_pt": "Condenam a prisão perpétua a dois homens pelo assassinato do pai que acompanhou o filho a vender uma PlayStation em Rancagua", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279862, "titulo": "‘Six, seven, maybe more preventable deaths’: Queensland’s LNP faces reckoning over broken health system", "url": "https://www.theguardian.com/australia-news/2026/nov/22/queensland-health-ambulance-deaths-lnp-labor-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-21T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Queensland, que está no poder há mais de dois anos, finalmente está sendo forçado a assumir responsabilidades e parece não mais poder blame seus antecessores do Partido Trabalhista. Durante a semana inicial de outra sessão parlamentar da Queensland, fontes anônimas estavam ativas, agora fornecendo informações contra o líder do oposição, Steven Miles, do Partido Trabalhista.", "titulo_pt": "Seis, sete, talvez mais mortes evitáveis: governo da queensland enfrenta reconta pelo sistema de saúde quebrado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 279864, "titulo": "Australian neo-Nazis among far-right groups raising hundreds of thousands via global crowdfunding platform", "url": "https://www.theguardian.com/australia-news/2026/nov/22/australian-neo-nazis-among-far-right-groups-raising-hundreds-of-thousands-via-global-crowdfunding-platform-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-21T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australianos neonazistas arrecadaram centenas de milhares de dólares através da plataforma de crowdfunding global GiveSendGo. Dois de seus fundraiser, incluindo o Partido Austríaco Branco, arrecadaram quantias significativas, com um total de $200.000 para uma batalha judicial.", "titulo_pt": "Neonazistas australianos arrecadam centenas de milhares em plataforma de crowdfunding", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 279655, "titulo": "Homem tem faca atravessada no pescoço pela própria mulher e sobrevive", "url": "https://veja.abril.com.br/brasil/mulher-e-presa-suspeita-de-esfaquear-o-marido-no-pescoco-em-minas-gerais/", "fonte_id": "veja", "data_pub": "2026-11-21T18:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem teve uma faca atravessada no pescoço, passando por uma cirurgia bem-sucedida e sendo dado alta. O incidente ocorreu em Minas Gerais.", "titulo_pt": "Homem sobrevive após ter faca atravessada no pescoço em minas gerais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 279740, "titulo": "'O futuro para mulheres na pós-menopausa não é catastrófico, é libertador'", "url": "https://www.bbc.com/portuguese/articles/c94g1gk54e2ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-21T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A escritora venezuelana-peruana Melanie Pérez Arias explorou temas como identidade, perdas, corpo feminino e amizade em seu primeiro romance, usando a queda inexplicável de cabelo de uma mulher como ponto de partida.", "titulo_pt": "O futuro para mulheres na pós-menopausa não é catastrófico, é libertador", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, plicata_de": null, "texto_pt": "Um nadador britânico de 56 anos percorreu o Estreito de Ormuz em três dias para chamar a atenção para o impacto ambiental causado pelo conflito entre Irã e Estados Unidos. Ele enfatizou a beleza natural do local e pediu para que as hostilidades parassem e a contaminação fosse limpa para preservar o ecossistema.", "titulo_pt": "Um britânico nageia o estreito de Ormuz para alertar sobre o impacto ambiental da guerra", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279380, "titulo": "French protesters rally for sixth weekend over living costs, public services, inequality", "url": "https://www.lemonde.fr/en/france/article/2026/11/21/french-protesters-rally-for-sixth-weekend-over-living-costs-public-services-inequality_6786265_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos na França continuaram por uma sexta semana consecutiva, iniciados por estudantes em setembro, contra aumentos de preços, serviços públicos insuficientes e violência policial.", "titulo_pt": "Protestos franceses por sexta semana seguida contra custos de vida, serviços públicos e violência policial", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279190, "titulo": "COP31 avança além do prazo e segue sem consenso sobre combustíveis fósseis", "url": "https://www.dw.com/pt-br/cop31-avança-além-do-prazo-e-segue-sem-consenso-sobre-combustíveis-fósseis/a-80010347?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-21T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As delegações continuam sem chegar a um consenso após o prazo oficial, e divergências sobre recursos para adaptação climática e a linguagem do texto final aumentam o risco de fracasso das negociações. O COP31 avança além do prazo oficial e segue sem consenso sobre combustíveis fósseis.", "titulo_pt": "COP31 avança além do prazo e segue sem consenso sobre combustíveis fósseis", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 279253, "titulo": "Armada advierte aumento de marejadas durante la temporada estival por fenómeno de El Niño", "url": "https://www.latercera.com/nacional/noticia/armada-advierte-aumento-de-marejadas-durante-la-temporada-estival-por-fenomeno-de-el-nino/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T15:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A marinha advertiu que haverá um aumento significativo das marés durante a estação veraniega devido ao fenômeno El Niño. As marejadas podem começar a se intensificar desde novembro, não apenas a partir do dia 15 de dezembro.", "titulo_pt": "Marinha avisa sobre aumento de marejadas durante a estação veraniega devido ao fenômeno El Niño", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 278702, "titulo": "China commits to low-carbon electrification and help for others to improve", "url": "https://www.theguardian.com/environment/2026/nov/21/china-commits-low-carbon-electrification-help-others-improve", "fonte_id": "guardian_world", "data_pub": "2026-11-21T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China está incentivando a electrificação rápida de sua economia através de fontes de energia de baixo carbono e prometendo ajudar outros países a fazerem o mesmo. Isso foi dito por um membro sênior da delegação chinesa no Cop31, um evento da ONU sobre clima.", "titulo_pt": "China se compromete com eletrificação de baixo carbono e assistência a outros países", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 278603, "titulo": "La cumbre ambiental COP31 y las diferencias entre Brasil y Argentina", "url": "https://www.clarin.com/rural/cumbre-ambiental-cop31-diferencias-brasil-argentina_0_asZHbwqT4A.html", "fonte_id": "clarin", "data_pub": "2026-11-21T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lu -beaches_6785837_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T03:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidades costeiras da Califórnia do Sul enfrentam danos devido a níveis de mar elevados e praias que desaparecem. Em um ano marcado por uma El Niño particularmente poderosa, residências danificadas, inundações, deslizamentos de terra e estradas fechadas são comuns.", "titulo_pt": "Cidades costeiras da califórnia do sul atingidas por níveis de mar elevados e praias que desaparecem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 279522, "titulo": "Asian American women face fallout of Nvidia affair scandal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/22/2003868154", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As asiáticas americanas enfrentam consequências do escândalo envolvendo a Nvidia. O incidente tem afetado a comunidade asiática americana, especialmente as mulheres.", "titulo_pt": "As asiáticas americanas enfrentam consequências do escândalo da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279918, "titulo": "Impunity fuels surge in settler violence across occupied West Bank", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/21/impunity-fuels-surge-in-settler-violence-across-occupied-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento na violência dos colonos na Cisjordânia ocupada está alimentado pela impunidade.", "titulo_pt": "Impunidade alimenta aumento da violência dos colonos na cisjordânia ocupada", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 279939, "titulo": "French police officers jailed for racist violence against black man in landmark ruling", "url": "https://www.scmp.com/news/world/europe/article/3375350/french-police-officers-jailed-racist-violence-against-black-man-landmark-ruling", "fonte_id": "scmp", "data_pub": "2026-11-21T20:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado de um homem negro, Michel Zecler, que foi agredido por três policiais franceses, comemorou uma 'decisão histórica' após um tribunal reconhecer a natureza racista da violência e condenar os policiais a prisão de um a dois anos. A agressão, ocorrida há seis anos durante a pandemia de coronavírus, foi filmada e mostrava os policiais batendo nele e usando spray de pimenta e gás lacrimogêneo sem motivo aparente.", "titulo_pt": "Advogado de homem negro comemora 'decisão histórica' após policiais franceses serem condenados por violência racista", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 279749, "titulo": "Asesinó a una mujer mientras cumplía una condena en suspenso por un violento ataque contra otra: lo condenaron a cadena perpetua", "url": "https://www.clarin.com/internacional/asesino-mujer-cumplia-condena-suspenso-violento-ataque-condenaron-cadena-perpetua_0_UdsaMLJv2A.html", "fonte_id": "clarin", "data_pub": "2026-11-21T20:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem foi condenado a cadeia perpétua por assassinar uma mulher que estava cumprindo uma condenação suspensa por um ataque violento. Antes desse crime, ele já havia agredido uma colega de trabalho.", "titulo_pt": "Matou uma mulher sob vigilância de condenação por ataque violento; recebeu pena de cadeia perpétua", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279621, "titulo": "Policiais são investigados na França por violência contra manifestantes", "url": "https://www.cartacapital.com.br/mundo/policiais-sao-investigados-na-franca-por-violencia-contra-manifestantes/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T19:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais franceses estão sendo investigados por violência contra manifestantes, incluindo um caso de suposta agressão sexual envolvendo a agarrada e aperto de órgãos genitais.", "titulo_pt": "Policiais são investigados na França por violência contra manifestantes", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 279196, "titulo": "Os cidadãos impedidos pelo governo Ortega de voltar à Nicarágua: 'Sou ilegal no meu próprio país'", "url": "https://www.bbc.com/portuguese/articles/c60rknr0jg4zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-21T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU registrou pelo menos 318 casos de nicaraguenses impedidos de entrar no próprio país entre junho de 2018 e agosto de 2025. Esses cidadãos foram impedidos pelo governo Ortega de voltar à Nicarágua.", "titulo_pt": "Cidadãos nicaraguenses impedidos pelo governo Ortega de retornar ao país", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 279125, "titulo": "Empresa é condenada por racismo após chefe dizer que negros lembram macacos", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/empresa-e-condenada-por-racismo-apos-chefe-dizer-que-negros-lembram-macacos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma empresa foi condenada a pagar R$ 15 mil de indenização a um auxiliar de limpeza que sofreu racismo, incluindo ofensas comparando negros a macacos, em um ambiente escolar.", "titulo_pt": "Empresa condenada por racismo após chefe comparar negros a macacos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279583, "titulo": "An Iranian Woman Falls Pregnant to Avoid Execution in ‘Inherited’: Situation in Iran Is ‘Increasingly Complex’", "url": "https://variety.com/2026/film/global/morteza-alizadeh-morally-knotty-inherited-iran-1236954820/", "fonte_id": "variety", "data_pub": "2026-11-21T13:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Morteza Alizadeh, um cineasta iraniano, foi inspirado por uma foto que mostrava mulheres e crianças dentro de uma prisão feminina. Ele decidiu explorar essa realidade pouco conhecida ao criar a obra 'Inherited'.", "titulo_pt": "Uma iraniana grávida para evitar execução em 'Inherited': situação no Irã se torna 'cada vez mais complexa'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 278667, "titulo": "Avanza el ICE en Texas: un nuevo condado firmó un acuerdo de colaboración con la agencia migratoria", "url": "https://www.lanacion.com.ar/estados-unidos/texas/avanza-el-ice-en-texas-un-nuevo-condado-firmo-un-acuerdo-de-colaboracion-con-la-agencia-migratoria-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T09:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O condado de Travis, no Texas, assinou um acordo com o ICE, permitindo que um oficial carcelário execute ordens migratórias civis dentro da prisão. Mais um condado se juntou à colaboração com a agência de imigração.", "titulo_pt": "Avanço do ICE no Texas: novo condado firma acordo de colaboração com a agência migratória", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278496, "titulo": "O Brasil racista", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/o-brasil-racista", "fonte_id": "metropoles", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete discute o tema do racismo no Brasil. O título original 'O Brasil racista' sugere que o questionário aborda questões relacionadas à discriminação racial no país.", "titulo_pt": "O Brasil racista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278888, "titulo": "French Senate approves police shootings law dubbed ‘licence to kill’ by critics", "url": "https://www.scmp.com/news/world/europe/article/3375320/french-senate-approves-police-shootings-law-dubbed-licence-kill-critics", "fonte_id": "scmp", "data_pub": "2026-11-21T06:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado francês aprovou uma lei que presume que policiais que usam armas estão agindo legalmente, com votos de 205 a 110. A proposta, que foi criticada por parlamentares de esquerda, concede aos policiais um benefício de dúvida no caso de mortes por disparos, a menos que haja provas contrárias.", "titulo_pt": "Senado francês aprova lei que presume legalidade de disparos policiais, chamada de 'licença para matar' pelos críticos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278832, "titulo": "Three French police officers sentenced over racist assault on Black man", "url": "https://www.aljazeera.com/news/2026/11/21/three-french-police-officers-sentenced-over-racist-assault-on-black-man?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T03:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses foram condenados por um ataque racista contra o produtor musical Michel Zecler em 2020. O tribunal criminal de Paris considerou que o racismo foi um fator agravante no caso.", "titulo_pt": "Três policiais franceses condenados por ataque racista a produtor musical", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278774, "titulo": "La Suprema desmantela la “doctrina Rabat”", "url": "https://www.ciperchile.cl/2026/11/20/la-suprema-desmantela-la-doctrina-rabat/?utm_source=rss&utm_medium=rss&utm_campaign=la-suprema-desmantela-la-doctrina-rabat", "fonte_id": "ciper_chile", "data_pub": "2026-11-21T02:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte desmontou a 'doctrina Rabat'. O título original foi publicado inicialmente no CIPER Chile.", "titulo_pt": "A Suprema desmonta a 'doctrina Rabat'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 278767, "titulo": "Police beating of Black music producer: Court recognizes racist nature of violence, sentences officers to prison, raising hopes for new legal precedent", "url": "https://www.lemonde.fr/en/france/article/2026/11/21/police-beating-of-black-music-producer-court-recognizes-racist-nature-of-violence-sentences-officers-to-prison-raising-hopes-for-new-legal-precedent_6785803_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T01:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um produtor musical negro foi agredido pela polícia em 2020, fora de seu estúdio de música, e os policiais relataram posteriormente que ele os atacou. Entretanto, a gravação de segurança contradiz essa versão dos fatos.", "titulo_pt": "Agressão policial contra produtor musical negro: tribunal reconhece natureza racista da violência, sentenciando policiais a prisão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 278862, "titulo": "Myanmar genocide judgment may bolster Gaza case against Israel", "url": "https://www.japantimes.co.jp/news/2026/11/21/world/crime-legal/myanmar-ruling-bolster-gaza-case/", "fonte_id": "japan_times", "data_pub": "2026-11-21T01:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O julgamento que estabeleceu que intenção genocida pode coexistir com um objetivo militar pode fortalecer o caso de Gaza contra Israel. Especialistas em direito acreditam que esse julgamento estabelece um precedente importante.", "titulo_pt": "Julgamento sobre genocídio pode fortalecer caso de Gaza contra Israel", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 279501, "fonte_id": "taipei_times", "titulo": "FSC announces measures after stock market losses", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868166", "data_pub": "2026-11-22T00:00:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "FSC anuncia medida const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
