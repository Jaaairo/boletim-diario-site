titulo": "Apple prepara iPhone dobrável de mais de US$ 2.000 em meio a alta de custos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/apple-prepara-iphone-dobravel-de-mais-de-us-2000-em-meio-a-alta-de-custos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Apple, John Ternus, deve apresentar na quarta-feira (9) novos produtos, incluindo um iPhone dobrável com preço superior a US$ 2.000. Essa será a primeira vez que a empresa lança um dispositivo com tela dobrável e um preço tão elevado.", "titulo_pt": "Apple prepara iphone dobrável acima de r$ 2.000 com novo ceo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 151215, "titulo": "Best Tech Labor Day Sales I’d Shop Myself (2026): Vacuums, Headphones, and More", "url": "https://www.wired.com/story/tech-labor-day-sales-2026/", "fonte_id": "wired", "data_pub": "2026-09-07T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias tecnologias populares, incluindo aspiradores sem fio e fones de ouvido sem fio, estão com desconto durante o feriado de Dia do Trabalho este ano.", "titulo_pt": "Melhores vendas de dia do trabalho em tecnologia: aspiradores, fones de ouvido e mais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 151212, "titulo": "What we expect from the upcoming Apple launch", "url": "https://techcrunch.com/2026/09/07/what-we-expect-from-the-upcoming-apple-launch/", "fonte_id": "techcrunch", "data_pub": "2026-09-07T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançará seu primeiro iPhone dobrável chamado Ultra em setembro, e também haverá anúncios sobre AirPods e HomePods durante o evento. O lançamento está programado para o dia 9 de setembro.", "titulo_pt": "O que esperar do próximo lançamento da Apple", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 151179, "titulo": "China’s Xiaomi unveils folding phone with home-grown chip as it takes on Apple, Huawei", "url": "https://www.scmp.com/tech/tech-trends/article/3366682/chinas-xiaomi-unveils-folding-phone-home-grown-chip-it-takes-apple-huawei?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Xiaomi lançou uma série de novos produtos, incluindo um telefone dobrável com chip proprietário e novos modelos do SUV premium Skynomad. A empresa chinês está intensificando sua concorrência contra rivais como Tesla, Apple e Huawei com tecnologias domesticadas.", "titulo_pt": "Xiaomi apresenta telefone dobrável com chip nacional em competição com Apple e Huawei", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 151264, "titulo": "Robbie Williams-backed ticketing platform Tickets for Good raises £3.9M", "url": "https://tech.eu/2026/09/07/tickets-for-good-raises-ps39m-to-expand-low-cost-access-to-live-events-globally/", "fonte_id": "tech_eu", "data_pub": "2026-09-07T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma de bilhetes Tickets for Good, apoiada por Robbie Williams, levantou £3,9 milhões para expandir internacionalmente e aumentar sua equipe. O investimento foi feito pelo NPIF II – Mercia Equity Finance, gerenciado pela Me...", "titulo_pt": "Plataforma de bilhetes Tickets for Good levanta £3,9 milhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 151265, "titulo": "Flex IT and T1A combine to create €150M European circular IT platform", "url": "https://tech.eu/2026/09/07/flex-it-and-t1a-combine-to-create-eur150m-european-circular-it-platform/", "fonte_id": "tech_eu", "data_pub": "2026-09-07T14:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flex IT e T1A Group uniram-se para formar uma plataforma europeia de tecnologia circular com receita de aproximadamente 150 milhões de euros. O valor total da combinação não foi especificado no trecho fornecido.", "titulo_pt": "Flex IT e T1A unem-se para formar plataforma circular de tecnologia europeia com faturamento de 150 milhões de euros", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 150755, "titulo": "China endurece regras sobre IA contra deepfakes e clonagem de voz", "url": "https://www.cartacapital.com.br/mundo/china-endurece-regras-sobre-ia-contra-deepfakes-e-clonagem-de-voz/", "fonte_id": "cartacapital", "data_pub": "2026-09-07T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As diretrizes chinesas endurecem as regras sobre a utilização da IA, proibindo o uso de tecnologias de deepfakes e clonagem de voz sem o consentimento das pessoas envolvidas. Essas medidas visam evitar a criação e distribuição de réplicas digitais reconhecíveis de outras pessoas.", "titulo_pt": "China endurece regras sobre IA contra deepfakes e clonagem de voz", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 150655, "titulo": "IA pode agregar US$ 600 bilhões por ano à economia do clima até 2028, revela BCG", "url": "https://exame.com/esg/ia-pode-agregar-us-600-bilhoes-por-ano-a-economia-do-clima-ate-2028-revela-bcg/", "fonte_id": "exame", "data_pub": "2026-09-07T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa inédita em colaboração com a Temasek indica que a inteligência artificial pode adicionar US$ 600 bilhões por ano à economia do clima até 2028. A tecnologia vai além de melhorar a eficiência e cria novos modelos de negócios que combinam lucros financeiros com redução das emissões de gases de efeito estufa.", "titulo_pt": "IA pode agregar US$ 600 bilhões por ano à economia do clima até 2028, revela estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 151266, "titulo": "UK chancellor unveils £150M northern scaleup fund", "url": "https://tech.eu/2026/09/07/uk-chancellor-unveils-ps150m-northern-scaleup-fund/", "fonte_id": "tech_eu", "data_pub": "2026-09-07T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Reino Unido anunciou um fundo de £150 milhões para investir em spinoffs universitários no Norte da Inglaterra, com o objetivo de acelerar o crescimento fora da capital. O fundo será utilizado para fazer investimentos nesses projetos.", "titulo_pt": "Chanceler do reino unido anuncia fundo de £150 milhões para startups universitárias no norte da inglaterra", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 151188, "titulo": "AI titans’ ‘circular deals’ are starting to look like ‘daisy chains’", "url": "https://www.scmp.com/opinion/world-opinion/article/3366149/ai-titans-circular-deals-are-starting-look-daisy-chains?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As 'transações cíclicas' entre gigantes da IA estão cada vez mais parecidas com as 'cadeias de margaridas' da crise dos bancos de poupança e empréstimos dos anos 1980. Essas transações interconectadas escondiam os perigos, multiplicavam os riscos sistêmicos e ajudaram a inflar os valores dos ativos, levando à falência de cerca de um terço dos bancos de poupança americanos na época.", "titulo_pt": "Acordos cíclicos dos gigantes da IA começam a lembrar as cadeias de margaridas da crise dos anos 1980", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 151201, "titulo": "The Download: the hunt for underground hydrogen and more rogue OpenAI agents", "url": "https://www.technologyreview.com/2026/09/07/1143592/the-download-underground-hydrogen-search-rogue-openai-agents/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-07T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Explorações estão sendo realizadas para encontrar depósitos de hidrogênio subterrâneos, que poderiam ser uma fonte valiosa de combustível zerocarbono. O interesse por esse recurso está aumentando com a busca por soluções de energia mais sustentáveis.", "titulo_pt": "Download: a busca por hidrogênio subterrâneo e agentes OpenAI errantes", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 150672, "titulo": "ChatGPT recomenda site falso de criptomoedas e usuário perde mais de US$ 2 milhões", "url": "https://exame.com/future-of-money/chatgpt-recomenda-site-falso-de-criptomoedas-e-usuario-perde-mais-de-us-2-milhoes/", "fonte_id": "exame", "data_pub": "2026-09-07T12:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O assistente de inteligência artificial ChatGPT recomendou um site falso de criptomoedas a um usuário, resultando em perdas financeiras de mais de 2 milhões de dólares.", "titulo_pt": "Chatgpt indica site falso de criptomoedas e usuário perde mais de 2 milhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 151216, "titulo": "Two of the Universe's Great Mysteries May Have Their Own Dimension", "url": "https://www.wired.com/story/dark-energy-matter-may-have-own-dimension/", "fonte_id": "wired", "data_pub": "2026-09-07T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores estão considerando a possibilidade de que a energia escura esteja perdendo força e que essa mudança possa estar relacionada a interações com a matéria escura em uma 'dimensão escura'.", "titulo_pt": "Dois dos mistérios maiores do universo podem ter sua própria dimensão", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 151154, "titulo": "Fossil link for sea turtles found off coast of Taiwan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/08/2003863881", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fósseis de tartarugas marinhas foram encontrados na costa de Taiwan. Esses fósseis fornecem uma ligação importante para a evolução das tartarugas marinhas.", "titulo_pt": "Fósseis de tartarugas marinhas encontrados na costa de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151233, "titulo": "New report offers lessons for preserving cultural heritage in crisis zones", "url": "https://phys.org/news/2026-09-lessons-cultural-heritage-crisis-zones.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório 'Preservação digital do patrimônio cultural para coleções vulneráveis: Reflexões sobre a história e o inventário do projeto Memória do Sudão', foi escrito por Dr. Laura Gibson, Sara El-Nager e Dr. Hannah Ishmael. Baseia-se em 14 entrevistas realizadas por El-Nager com contribuidores do projeto Memória do Sudão, o primeiro grande projeto de digitalização realizada no Sudão.", "titulo_pt": "Novo relatório oferece lições para a preservação do patrimônio cultural em zonas de crise", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151234, "titulo": "Entangled particles revive a 35-year-old test of the Standard Model", "url": "https://phys.org/news/2026-09-entangled-particles-revive-year-standard.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos da Colaboração BESIII utilizaram uma técnica não explorada há 35 anos para reavivar um teste antigo da ideia mais importante do Modelo Estándard. Este teste visa validar um dos conceitos fundamentais do Modelo Estándard.", "titulo_pt": "Partículas entrelaçadas reavivam teste de 35 anos do modelo estándard", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151236, "titulo": "Climate and air quality are closely linked, report highlights", "url": "https://phys.org/news/2026-09-climate-air-quality-linked-highlights.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um aumento na poluição proveniente de incêndios florestais e ondas de calor pode comprometer os esforços internacionais para melhorar a qualidade do ar e proteger a saúde humana e ecológica, conforme destacado em um relatório da Organização Meteorológica Mundial (OMM). O relatório explora as complexas relações entre a qualidade do ar e o clima.", "titulo_pt": "Clima e qualidade do ar estão intimamente ligados, relatório destaca", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151237, "titulo": "Can atmospheric methane removal limit peak warming?", "url": "https://phys.org/news/2026-09-atmospheric-methane-limit-peak.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Programa das Nações Unidas para o Meio Ambiente concluiu que o aquecimento global está previsto para ultrapassar 1,5°C nos próximos anos. Isso torna cada vez mais importantes as perguntas sobre quão alto os temperaturas irão subir e por quanto tempo o aumento durará.", "titulo_pt": "Pode a remoção de metano atmosférico limitar o aquecimento máximo?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 150703, "titulo": "Bactéria que causa câncer do estômago age sem sintomas; entenda riscos", "url": "https://www.cnnbrasil.com.br/saude/bacteria-que-causa-cancer-do-estomago-age-sem-sintomas-entenda-riscos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas alertam para a infecção silenciosa causada pela bactéria que provoca câncer do estômago. O câncer gástrico é o quinto mais comum no Brasil, mas é frequentemente diagnosticado sem sinais prévios.", "titulo_pt": "Bactéria que causa câncer do estômago age sem sintomas; entenda riscos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151238, "titulo": "Self-processing brain systems show both conservation and reorganization across primates", "url": "https://phys.org/news/2026-09-brain-primates.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ning Liu, do Instituto de Biologia, da Academia Chinesa de Ciências, investigou se as estruturas cerebrais responsáveis pela auto-processedação são conservadas em primatas, incluindo humanos, chimpanzés e macacos. O estudo foi publicado na revista JNeurosci.", "titulo_pt": "Sistemas cerebrais para auto-processedação mostram conservação e reorganização em primatas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151239, "titulo": "Excavations at Prado Vargas now span 140 square meters of a Neanderthal layer", "url": "https://phys.org/news/2026-09-excavations-prado-vargas-span-square.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As escavações na Gruta Prado Vargas, no norte da província de Burgos, Espanha, expandiram a área de exploração do nível 4D neandertal por 32 metros quadrados, totalizando 140 metros quadrados. Foram recuperados mais de 1.500 restos de animais e ferramentas de pedra, indicando um acampamento neandertal de cerca de 46.000 anos de idade.", "titulo_pt": "Escavações na Prado Vargas agora abrangem 140 metros quadrados de camada neandertal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151290, "titulo": "Super El Niño set to cause ‘terribly dangerous’ drought in the Amazon", "url": "https://www.newscientist.com/article/2587998-super-el-nino-set-to-cause-terribly-dangerous-amazon-drought/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-07T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas alertam que a fase atual do El Niño será a mais danosa para a Amazônia na história, aumentando o risco de incêndios florestais catastróficos.", "titulo_pt": "Super El Niño deve causar ‘perigosamente perigosa’ seca na amazônia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 150708, "titulo": "Cientistas podem usar Terra para detectar matéria escura, diz estudo", "url": "https://www.cnnbrasil.com.br/ciencia/cientistas-podem-usar-terra-para-detectar-materia-escura-diz-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo japonês indica que a Terra pode ser usada como um detector de alta precisão para sinais de matéria escura. A pesquisa sugere que o planeta pode atuar como um detector gigante para a detecção dessa substância misteriosa.", "titulo_pt": "Cientistas podem usar Terra para detectar matéria escura, diz estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151240, "titulo": "Could bats self-medicate? More than 50 wild bats offer clues", "url": "https://phys.org/news/2026-09-medicate-wild-clues.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 morcegos selvagens foram observados alterando seus comportamentos quando doentes, possivelmente buscando alívio, o que sugere que eles podem se auto-medicar. O estudo examina se os morcegos estão usando estratégias semelhantes às das pessoas para se sentir melhor.", "titulo_pt": "Será que morcegos se auto-medicam? Mais de 50 morcegos selvagens oferecem pistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151241, "titulo": "Dark plasma regions reveal overlooked source of reactive atomic oxygen", "url": "https://phys.org/news/2026-09-dark-plasma-regions-reveal-overlooked.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade Metropolitana de Tóquio descobriram como tornar o plasma mais eficaz para diversas aplicações, incluindo uso antimicrobiano e condicionamento de superfícies na indústria de semicondutores. Eles mapearam a produção de oxigênio atômico, um ingrediente crucial do plasma de oxigênio, enquanto uma alta tensão era aplicada em gás de oxigênio.", "titulo_pt": "Regiões de plasma escuro revelam fonte sobravente de oxigênio atômico reativo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 150936, "titulo": "¿Será la influenza la próxima gran pandemia global?", "url": "https://www.latercera.com/lt-board/noticia/sera-la-influenza-la-proxima-gran-pandemia-global/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T16:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Francisco Aravena conversa com a microbióloga Claudia Saavedra sobre seu trabalho com um vírus próximo aos humanos, mas ainda desconhecido, no Instituto One Health da Universidade Andrés Bello. O diálogo faz parte do programa Mentes em movimento e discute possibilidades de uma influenza como próxima grande pandemia global.", "titulo_pt": "Será a influenza a próxima grande pandemia global?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 151242, "titulo": "Ancient charcoal reveals evidence of wildfires near the South Pole", "url": "https://phys.org/news/2026-09-ancient-charcoal-reveals-evidence-wildfires.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Charcoal encontrada em uma área próxima ao Polo Sul indica que houve incêndios florestais durante o Cretáceo tardio. A região era um florestal úmido com coníferas e gimnospermas, onde dinossauros viviam em um clima quente e ameno, com temperaturas médias anuais de 12°C.", "titulo_pt": "Carvão antigo revela evidências de incêndios florestais perto do polo sul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151243, "titulo": "Galileo, Copernicus, Cleansky, IRIS² must work together to secure Europe's place in the space race", "url": "https://phys.org/news/2026-09-galileo-copernicus-cleansky-iris-europe.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Galileu, Copérnico, Cleansky e IRIS² devem colaborar para garantir a posição de Europa na corrida espacial. Thomas Pesquet, astronauta francês, enfatizou a interdependência da humanidade ao observar a Terra do espaço.", "titulo_pt": "Galileu, copérnico, Cleansky e IRIS² devem trabalhar juntos para assegurar a posição de Europa na corrida espacial", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151291, "titulo": "I made a free AI chatbot solve a decade-long maths problem in 13 minutes", "url": "https://www.newscientist.com/article/2587148-i-made-a-free-ai-chatbot-solve-a-decade-long-maths-problem-in-13-minutes/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-07T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jornalista Matthew Sparkes testou um chatbot de inteligência artificial gratuito e ficou surpreso com a rapidez com que o chatbot resolveu um problema matemático que havia sido aberto por décadas em apenas 13 minutos.", "titulo_pt": "Eu fiz um chatbot de IA gratuita resolver um problema matemático de décadas em 13 minutos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 151303, "titulo": "‘Monsters of God’ Director Eric Goode Breaks Down the Finale Reveal: ‘He Was Like an Alcoholic Running a Liquor Store’", "url": "https://www.indiewire.com/features/interviews/monsters-of-god-eric-goode-interview-finale-tiger-king-1235215289/", "fonte_id": "indiewire", "data_pub": "2026-09-07T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentarista Emmy-nominado Eric Goode fala sobre o momento em sua série HBO que revelou a frase 'sometimes it's only the bars that separates the guard from the prisoner' e como 'Tiger King' inemakers forecast 30-year low harvest after severe drought and heat", "url": "https://www.theguardian.com/world/2026/sep/07/french-winemakers-forecast-30-year-low-harvest-after-severe-drought-and-heat", "fonte_id": "guardian_world", "data_pub": "2026-09-07T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de vinho na França está prevista para atingir um nível não visto em 30 anos devido a uma severa estiagem e ondas de calor. As vinhas também estão preocupadas com a possibilidade de 'taint de fumaça' causada por incêndios florestais afetar a qualidade do vinho.", "titulo_pt": "Produtoras de vinho francesas prevêem colheita de 30 anos atrás devido a estiagem severa e calor extremo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 150545, "titulo": "Peça 'Na Sala dos Espelhos' faz temporada grátis na Biblioteca Mário de Andrade, em SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/09/peca-na-sala-dos-espelhos-faz-temporada-gratis-na-biblioteca-mario-de-andrade-em-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-07T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O espetáculo 'Na Sala dos Espelhos' terá seis sessões gratuitas na Biblioteca Mário de Andrade, em São Paulo, até o começo de outubro, com quatro sessões seguidas de debates.", "titulo_pt": "Peça 'Na Sala dos Espelhos' faz temporada grátis Na Biblioteca Mário de Andrade, em SP", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 151281, "titulo": "Can breath be art? Liz Larner on sculpting with hair, lashes, leather – and international group exhalation", "url": "https://www.theguardian.com/artanddesign/2026/sep/07/breath-liz-larner-hair-lashes-nasa-asteroids", "fonte_id": "guardian_culture", "data_pub": "2026-09-07T14:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Liz Larner, uma escultora amer :12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Encuesta de Bienestar de la Juventud 2026, realizada pela Universidade Andrés Bello, revelou altas taxas de percepção de insegurança entre jovens de países da América do Sul. No que diz respeito à saúde mental, 55% dos jovens chilenos entrevistados expressaram desejo por mais apoio emocional e mental.", "titulo_pt": "Saúde mental, segurança e economia: os temas que mais preocupam os jovens, de acordo com estudo UNAB", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150591, "titulo": "Adolescente pula de carro em movimento para fugir de sequestro no Rio; veja vídeo", "url": "https://veja.abril.com.br/brasil/adolescente-pula-de-carro-em-movimento-para-fugir-de-sequestro-no-rio-veja-video/", "fonte_id": "veja", "data_pub": "2026-09-07T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente pular de um carro em movimento para fugir de um sequestro ocorreu no Rio de Janeiro. A menina sofreu escoriações apenas no joelho e está bem. A família já registrou uma ocorrência na 23ª DP (Méier).", "titulo_pt": "Adolescente pula de carro em movimento para fugir de sequestro no Rio; veja vídeo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150592, "titulo": "O novo caso do bebê torturado: o que a psicologia (não) explica", "url": "https://veja.abril.com.br/coluna/mens-sana/o-novo-caso-do-bebe-torturado-o-que-a-psicologia-nao-explica/", "fonte_id": "veja", "data_pub": "2026-09-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um caso de violência criminosa contra um bebê no interior de São Paulo trouxe à luz uma situação de tortura injustificável. O que poderia estar por trás dessa violência não foi esclarecido pela psicologia.", "titulo_pt": "Novo caso de bebê torturado: o que a psicologia (não) explica", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150594, "titulo": "Monitoramento por drone mostra quantas pessoas foram ao ato de Augusto Cury em Copacabana", "url": "https://veja.abril.com.br/politica/monitoramento-por-drone-mostra-quantas-pessoas-foram-ao-ato-de-augusto-cury-em-copacabana/", "fonte_id": "veja", "data_pub": "2026-09-07T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um monitoramento por drone registrou a participação de pessoas no ato de Augusto Cury em Copacabana. O escritor e presidenciável ocupa o terceiro lugar nas pesquisas eleitorais para a Presidência da República em 2022.", "titulo_pt": "Monitoramento por drone registra participação no ato de Augusto Cury em Copacabana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150595, "titulo": "Mobilização nas redes no 7 de Setembro cai e é quase a metade do ano anterior", "url": "https://veja.abril.com.br/politica/mobilizacao-nas-redes-no-7-de-setembro-cai-e-e-quase-a-metade-do-ano-anterior/", "fonte_id": "veja", "data_pub": "2026-09-07T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mobilização nas redes sociais no Dia da Independência (7 de Setembro) de 2026 foi quase a metade do que foi registrado no ano anterior. De acordo com o levantamento do instituto Democracia em Xeque, o acumulado até o momento foi 42% menor do que em 2025.", "titulo_pt": "Mobilização nas redes no 7 de Setembro de 2026 cai e é quase a metade do ano anterior", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150596, "titulo": "Adolescente é apreendida com 22 peças de picanha furtadas de supermercado no Rio", "url": "https://veja.abril.com.br/brasil/adolescente-e-apreendida-com-22-pecas-de-picanha-furtadas-de-supermercado-no-rio/", "fonte_id": "veja", "data_pub": "2026-09-07T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente foi apreendida com 22 peças de picanha furtadas de um supermercado em Nova Iguaçu, no Rio de Janeiro. As equipes da Segurança Presente recuperaram 25 produtos avaliados em cerca de R$ 3 mil.", "titulo_pt": "Adolescente é apreendida com 22 peças de picanha furtadas de supermercado no Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151171, "titulo": "Kazakhstan aims to become education hub, but experts say jobs must match skills", "url": "https://www.scmp.com/news/hong-kong/education/article/3366687/kazakhstan-aims-become-education-hub-experts-say-jobs-must-match-skills?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kazáquia visa se tornar um centro educacional na Ásia Central, mas especialistas afirmam que é necessário garantir que os jovens tenham acesso suficiente a oportunidades que correspondam aos seus níveis de habilidades durante a rápida transformação econômica do país. Há também planos para colaboração com universidades de Hong Kong e da China continental, devido à crescente demanda por especialistas que compreendam os ambientes de negócios de ambos os países.", "titulo_pt": "Kazáquia busca se tornar centro educacional, mas especialistas dizem que os empregos devem corresponder às habilidades", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150824, "titulo": "Los desafíos del trabajo colaborativo para la inclusión", "url": "https://www.ciperchile.cl/2026/09/07/los-desafios-del-trabajo-colaborativo-para-la-inclusion/?utm_source=rss&utm_medium=rss&utm_campaign=los-desafios-del-trabajo-colaborativo-para-la-inclusion", "fonte_id": "ciper_chile", "data_pub": "2026-09-07T13:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute os desafios do trabalho colaborativo na inclusão.", "titulo_pt": "Desafios do trabalho colaborativo para a inclusão", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 150031, "titulo": "Parir con dolor: el cambio en una ley en la Ciudad reveló por qué la anestesia peridural se aplica poco en los hospitales públicos del país", "url": "https://www.clarin.com/sociedad/parir-dolor-cambio-ley-ciudad-revelo-anestesia-peridural-aplica-hospitales-publicos-pais_0_3CwBK9AT6T.html", "fonte_id": "clarin", "data_pub": "2026-09-07T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A lei na Cidade de Buenos Aires agora garante a disponibilidade da anestesia peridural para parturientes que a necessitam. Um levantamento da Clarín em 24 jurisdições revelou uma aplicação desigual, atribuída à falta de anestesistas para acompanhar o parto.", "titulo_pt": "Parir com dor: mudança na lei na cidade revela escassez de anestesistas em hospitais públicos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 149930, "titulo": "Gravidez após os 35 anos: especialistas explicam riscos a Dr. Kalil", "url": "https://www.cnnbrasil.com.br/saude/gravidez-apos-os-35-anos-especialistas-explicam-riscos-a-dr-kalil/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas discutem os riscos de gravidez após os 35 anos, incluindo complicações como pré-eclâmpsia e diabetes gestacional, enfatizando a importância do acompanhamento médico.", "titulo_pt": "Gravidez após 35 anos: especialistas explicam riscos e a importância do acompanhamento médico", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150010, "titulo": "“Falsa sensación de seguridad”: ocho mitos que persisten y favorecen el avance de las infecciones de transmisión sexual", "url": "https://www.lanacion.com.ar/sociedad/falsa-sensacion-de-seguridad-ocho-mitos-que-persisten-y-favorecen-el-avance-de-las-infecciones-de-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma campanha da Sociedade Argentina de Dermatologia destaca falsas crenças que persistem durante consultas médicas, contribuindo para o avanço das infecções de transmissão sexual. O estudo aborda oito mitos comuns.", "titulo_pt": "Falsa sensação de segurança: oito mitos que persistem e favorecem a propagação das infecções de transmissão sexual", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 150011, "titulo": "Hacia una sociedad de propietarios", "url": "https://www.lanacion.com.ar/economia/hacia-una-sociedad-de-propietarios-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a possibilidade de se construir uma sociedade baseada no princípio do proprietário, onde a propriedade privada desempenha um papel central. Não há detalhes específicos sobre as medidas ou políticas sugeridas para alcançar esse objetivo.", "titulo_pt": "Para uma sociedade de proprietários", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 150012, "titulo": "Fuertes contrastes en la mayor provincia del país", "url": "https://www.lanacion.com.ar/economia/fuertes-contrastes-en-la-mayor-provincia-del-pais-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título do artigo indica fortes contrastes na maior província do país, mas não há detalhes adicionais sobre os contrastes específicos mencionados. O texto original não fornece informações mais concretas sobre o assunto abordado.", "titulo_pt": "Fortes contrastes na maior província do país", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 150704, "titulo": "Itália tem verão mais quente em mais de 75 anos, diz instituto", "url": "https://www.cnnbrasil.com.br/internacional/italia-tem-verao-mais-quente-em-mais-de-75-anos-diz-instituto/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os dados indicam que 2026 será o ano mais quente na Itália desde o início da coleta de informações meteorológicas. O Instituto italiano de meteorologia registrou que 2026 terminará como o ano mais quente do país em mais de 75 anos de registro.", "titulo_pt": "Itália registra verão mais quente em mais de 75 anos, diz instituto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150602, "titulo": "Enorme erupção vulcânica na Indonésia cancela voos e afeta 270.000 passageiros; veja vídeo", "url": "https://veja.abril.com.br/mundo/enorme-erupcao-vulcanica-na-indonesia-cancela-voos-e-afeta-270-000-passageiros-veja-video/", "fonte_id": "veja", "data_pub": "2026-09-07T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma enorme erupção vulcânica no Anak Krakatoa, perto de Jacarta, Indonésia, cancelou voos e afetou cerca de 270.000 passageiros. A erupção expeliu lava e gerou uma explosão ouvida a centenas de quilômetros de distância.", "titulo_pt": "Enorme erupção vulcânica na Indonésia cancela voos e afeta 270.000 passageiros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151051, "titulo": "Passengers face flight chaos in Indonesia after Anak Krakatau eruption", "url": "http://www.euronews.com/video/2026/09/07/passengers-face-flight-chaos-in-indonesia-after-anak-krakatau-eruption", "fonte_id": "euronews", "data_pub": "2026-09-07T15:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias aeroportos na Indonésia foram fechados devido à erupção do vulcão Anak Krakatau, cancelando 2.300 voos e deixando mais de 268.000 passageiros em situação de espera por reembolsos.", "titulo_pt": "Viajantes enfrentam caos aéreo na indonésia após erupção do vulcão Anak Krakatau", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 150907, "titulo": "Record strength El Niño could mean bigger supermarket bills for Australians, experts warn", "url": "https://www.theguardian.com/business/2026/sep/08/record-strength-el-nino-could-mean-bigger-supermarket-bills-for-australians-experts-warn", "fonte_id": "guardian_world", "data_pub": "2026-09-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um El Niño extremamente forte, conforme previsto, pode levar a preços mais altos dos alimentos nos próximos 12 meses devido a condições climáticas quentes e secas nas regiões de cultivo da Austrália oriental. Especialistas alertam que isso aumentará a pressão sobre os lares já sobrecarregados com a elevação dos preços dos alimentos pós-pandemia e complicará os esforços do Banco da Reserva para controlar a inflação.", "titulo_pt": "Força recorde do El Niño pode causar aumentos nos preços dos alimentos na austrália, alertam especialistas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 150553, "titulo": "Combater poluição e mudança climática pode elevar PIB global em 2,8% até 2035, diz ONU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/combater-poluicao-e-mudanca-climatica-pode-elevar-pib-global-em-28-ate-2035-diz-onu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T13:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Combater a poluição do ar e as mudanças climáticas pode aumentar o PIB global em 2,8% até 2035, de acordo com um relatório da ONU. A maior parte da população mundial ainda está exposta a níveis de poluição acima dos padrões globais.", "titulo_pt": "Combater poluição e mudança climática pode elevar PIB global em 2,8% até 2035, diz ONU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 149956, "titulo": "Como a China tenta cortar a poluição antes que ela chegue ao ar", "url": "https://veja.abril.com.br/coluna/giro-pelo-oriente/como-a-china-tenta-cortar-a-poluicao-antes-que-ela-chegue-ao-ar/", "fonte_id": "veja", "data_pub": "2026-09-07T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China está investindo em energia renovável, redes elétricas inteligentes, veículos de nova energia e mudanças na indústria com o objetivo de reduzir as emissões em suas cidades.", "titulo_pt": "Como a China tenta cortar a poluição antes que ela chegue às cidades", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150240, "titulo": "Clowns take over the streets of Brazil’s historic Mariana", "url": "http://www.euronews.com/video/2026/09/07/clowns-take-over-the-streets-of-brazils-historic-mariana", "fonte_id": "euronews", "data_pub": "2026-09-07T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Acerca de 100 palhaços e fãs de circo se reuniram no centro histórico da cidade de Mariana, no Brasil, para participar de um encontro internacional que celebra circo, música e cor.", "titulo_pt": "Palhaços tomam conta do centro histórico de Mariana, no Brasil", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 149928, "titulo": "Enchente relâmpago no Nepal e na China soma quase 1.400 mortos", "url": "https://www.cnnbrasil.com.br/internacional/numero-de-mortos-em-enchentes-no-nepal-sobe/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T09:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enchente relâmpago que atingiu a fronteira entre Nepal e China deixou quase 1.400 mortos. O número total de desaparecidos é superior a 5 mil pessoas, e 13 mil foram resgatadas.", "titulo_pt": "Enchente relâmpago no Nepal e na China soma quase 1.400 mortos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150381, "titulo": "Nepal’s US$2.5 billion flood bill puts UN climate fund to its biggest test yet", "url": "https://www.scmp.com/week-asia/health-environment/article/3366581/nepals-us25-billion-flood-bill-puts-un-climate-fund-its-biggest-test-yet?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal solicitou auxílio financeiro após as catástrofes causadas por inundações que resultaram em  "provavel_duplicata_de": null, "texto_pt": "Um relatório do Australian Institute of Health and Welfare (AIHW) revela que as gerações de indígenas australianos forçosamente removidos sob políticas de integração governamentais enfrentam desafios de saúde físicos maiores em comparação com a população indígena e não-indígena em geral. O relatório foi encomendado pelo Healing Foundation, uma entidade de advocacy indígena.", "titulo_pt": "Vitima da geração roubada tem mais desafios de saúde que outros povos indígenas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 151183, "titulo": "UN rights chief warns AI could pose ‘existential’ risk to humanity’", "url": "https://www.scmp.com/news/world/europe/article/3366672/un-rights-chief-warns-ai-could-pose-existential-risk-humanity?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe das direitos humanos da ONU, Volker Turk, alertou que a inteligência artificial pode representar um risco existencial para a humanidade e prometeu pressionar as empresas de AI a reduzir riscos, como interrupções de serviços, comunicações e sistemas democráticos. Ele também exigiu responsabilidade sobre mortes em custódia de imigrantes nos EUA e condenou o uso supostamente autônomo de armas por Russia.", "titulo_pt": "Chefe da ONU sobre direitos humanos avisa que IA pode representar risco existencial para a humanidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150998, "titulo": "Anne-Cécile Mailfert, president of Fondation Des Demmes: 'For the first time, perhaps, a gender-violence bill was shaped from the victims' perspective'", "url": "https://www.lemonde.fr/en/le-monde-festival/article/2026/09/07/anne-cecile-mailfert-president-of-fondation-des-demmes-for-the-first-time-perhaps-a-gender-violence-bill-was-shaped-from-the-victims-perspective_6757251_97.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-07T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anne-Cécile Mailfert, presidente da Fondation Des Demmes, participou das discussões que levaram à proposta legislativa sobre violência de gênero. Ela explica as origens, conteúdo e como a proposta chegou ao agenda parlamentar após o caso de Lyhanna, uma menina de 11 anos.", "titulo_pt": "Anne-cécile Mailfert, presidente da Fondation Des Demmes: 'pela primeira vez, talvez, uma proposta de lei sobre violência de gênero foi formulada partindo do ponto de vista das vítimas'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 150825, "titulo": "Víctimas, parejas o “narco reinas”: los estereotipos sobre las mujeres en el crimen organizado", "url": "https://www.ciperchile.cl/2026/09/07/victimas-parejas-o-narco-reinas-los-estereotipos-sobre-las-mujeres-en-el-crimen-organizado/?utm_source=rss&utm_medium=rss&utm_campaign=victimas-parejas-o-narco-reinas-los-estereotipos-sobre-las-mujeres-en-el-crimen-organizado", "fonte_id": "ciper_chile", "data_pub": "2026-09-07T12:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo explora os estereótipos associados às mulheres no crime organizado, abordando suas papéis como vítimas, parceiras ou 'narco rainhas'.", "titulo_pt": "Vítimas, parceiras ou 'narco rainhas': os estereótipos sobre as mulheres no crime organizado", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 151053, "titulo": "UN rights chief urges 'accountability' after 23 die in US immigration custody in 2026", "url": "http://www.euronews.com/2026/09/07/un-rights-chief-urges-accountability-after-23-die-in-us-immigration-custody-in-2026", "fonte_id": "euronews", "data_pub": "2026-09-07T10:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório conjunto da Human Rights Watch e Physicians for Human Rights, divulgado em junho, afirma que o número de mortes de pessoas em detenção da ICE atingiu o                ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
