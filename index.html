<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "10/08/2026 15:20", "stats": {"noticias_novas": 910, "resumos_gerados": 262}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Uma pesquisa da Palver mostrou que o presidente Lula e Flávio Bolsonaro estão empatados com 46% de intenção de voto no segundo turno das eleições presidenciais, apesar de Lula ter liderado o primeiro turno. O ministro Edson Fachin, vice-presidente do STF (Supremo Tribunal Federal), defendeu a necessidade de uma lei para regulamentar os salários dos juízes e reforçou a importância da transparência no Judiciário durante um seminário promovido pela Folha em parceria com a OAB-SP. Em Pernambuco, a governadora Raquel Lyra registrou um boletim de ocorrência após um vídeo deepfake que simulava sua imagem pedindo dinheiro online, considerado uma nova ameaça às eleições de 2026.", "mundo": "Um terremoto de magnitude 7,4 atingiu a Colômbia, causando ao menos 80 mortes e severos danos em várias cidades do país. O epicentro do sismo ocorreu no departamento de Chocó, resultando no colapso de estruturas importantes como a torre da catedral de Manizales. A região afetada é uma das mais turísticas do país. Estados Unidos e México ofereceram ajuda humanitária após o desastre. O governo colombiano declarou estado de calamidade nacional, enquanto os prefeitos de Cali e Pereira pediram que as pessoas saíssem dos prédios danificados. Além disso, outros eventos internacionais foram noticiados, incluindo a repressão do Irã aos espaços de liberdade civis, um incêndio florestal no Canadá e a intensificação das tensões na Ártica entre Groenlândia e Estados Unidos.\n\nA Ucrânia realizou um ataque com drones contra instalações de refino de petróleo na cidade de Nizhnekamsk, na Rússia. O ataque resultou em pelo menos 13 mortes. Este incidente faz parte de uma série de ataques aéreos longinquos da Ucrânia sobre alvos distantes da linha de frente, intensificando as operações militares em áreas estratégicas do país vizinho. No mesmo contexto geopolítico, Israel realizou um ataque no sul do Líbano, causando uma explosão major e levantando preocupações sobre a escalada das tensões regionais. Paralelamente, na Colômbia, um terremoto de magnitude 7,4 causou danos significativos em várias cidades, resultando em pelo menos 69 mortes e deixando milhares deslocados. Essas notícias refletem os complexos desafios geopolíticos enfrentados atualmente, incluindo conflitos armados, crises humanitárias e ameaças naturais.", "economia": "A Embraer liderou as altas do Ibovespa após anunciar um recorde na carteira de pedidos firmes, que atingiu US$ 34,5 bilhões. Isso representa um crescimento superior a 16% em comparação com o mesmo período do ano anterior. A empresa também registrou um aumento de 25% no lucro líquido no segundo trimestre de 2026 e elevou suas projeções para o desempenho anual, prevendo resultados melhores do que inicialmente esperados. O dólar subiu nesta segunda-feira devido às incertezas relacionadas ao conflito no Oriente Médio e à reabertura do estreito de Hormuz, importante rota marítima para o transporte de petróleo e gás natural. Além disso, a TSMC registrou um aumento de 45% nas vendas mensais de chips de inteligência artificial, indicando uma demanda persistente nesse setor, apesar da volatilidade do mercado.", "tecnologia": "As empresas chinesas de robôs humanóides dominaram 97% das exportações no primeiro semestre de 2023, conforme relatório do Taipei Times. A Agência Espacial Sul-Coreana anunciou uma revisão que simplificará os procedimentos para múltiplos lançamentos de foguetes, informou o Yonhap News. A Meta divulgou parâmetros para seu novo modelo de IA chamado Muse Glimmer e planeja liberar os pesos do Muse Spark 1.2, conforme anunciou o SCMP. O CEO da Meta, Mark Zuckerberg, publicou um manifesto extenso sobre a coexistência entre humanidade e inteligência artificial, argumentando que o maior risco é uma única entidade ter muito controle sobre a tecnologia, conforme relatado pelo The Verge. Outro destaque foi a decisão da Boeing de vender suas subsidiárias de táxi aéreo elétrico para a Archer Aviation, informada pelo The Verge. Além disso, o financiamento de inteligência artificial na Europa manteve-se resiliente em julho de 2026, com as empresas levantando €8,6 bilhões em 267 rodadas de financiamento, conforme relatado pelo Tech.eu.", "ciencia": "A NASA+ está expandindo suas transmissões para novas plataformas de streaming, incluindo o discovery+ e o Max. O discovery+ oferecerá uma transmissão ao vivo contínua do conteúdo da NASA+, enquanto o Max exibirá eventos especiais, como a missão Artemis III em 2027. Além disso, um eclipse solar total será visível na Europa continental nesta quarta-feira (12), sendo o primeiro de sua espécie em quase 30 anos. A Lua cobrirá o Sol, criando uma sombra sobre a Terra e oferecendo oportunidades únicas para observação científica. Vale mencionar que durante este eclipse solar total, as auroras boreais podem ser visíveis em regiões mais setentrionais da Europa, embora não se trate do evento principal. Em um desenvolvimento importante para a indústria farmacêutica, a FDA rejeitou um tratamento radiofarmacêutico devido a problemas de fabricação, interrompendo o desenvolvimento de uma possível concorrente para o tratamento da Novartis. Além disso, um estudo sugere que cachorros podem distinguir entre expressões de medo, raiva ou tristeza em rostos humanos, com base na atividade cerebral analisada ao ver imagens dessas expressões.", "cultura": "Um dos eventos mais importantes mencionados nos artigos é o julgamento de um ex-líder de uma gangue, acusado de ter planejado e fornecido a arma para o assassinato de Tupac Shakur. Este processo ocorre em Las Vegas, 30 anos após a morte do rapper, e durará aproximadamente um mês. O julgamento investiga se Duane 'Keffe D' Davis ordenou o crime durante um tiroteio drive-by no rapper. Além disso, a CazéTV está buscando uma emissora para sublicenciar os jogos do Campeonato Espanhol antes da estreia da temporada, com o objetivo de concluir um acordo até essa data. Outro destaque é a estreia do documentário sobre Sócrates na Globo em setembro, coincidindo com o mês de aniversário do Corinthians. O documentário ressalta a importância do jogador para a equipe e a seleção brasileira nas Copas de 1982 e 1986. Por fim, a atriz Juliette Lewis estreou no palco da Broadway como a criada Magenta em 'Rocky Horror Show', trazendo o espetáculo de volta ao palco. 'Rocky Horror Show' é um musical criado por Richard O'Brien em 1973 que celebra a irreverência e a cultura pop do filme original, que foi lançado no mesmo ano.", "sociedade": "A população de um país registrou uma diminuição consecutiva durante 31 meses, o que representa o período mais longo de declínio populacional observado nas estatísticas recentes. Em outro evento, a atriz Catherine Fulop participou de uma coletânea solidária em Palermo para auxiliar as vítimas dos terremotos na Venezuela. Além disso, moradores da Asa Norte relataram uma série de furtos, incluindo o roubo de equipamentos valiosos de um fotógrafo. A ministra de Estado da Mulher anunciou prioridades legislativas para os próximos meses com foco na violência contra mulheres e na corresponsabilidade. Outro caso notável envolve uma mãe que pede justiça após o duplo homicídio das suas filhas pelo pai no Dia dos Pais, enquanto um zelador espancado por um morador de rua permanece inconsciente em estado grave.", "meio_ambiente": "As águas do mundo registraram julho como o mês mais quente desde que as medições começaram, refletindo um aquecimento global crescente. Em paralelo, a Europa bateu recordes de temperatura durante o verão com ondas de calor e incêndios florestais, com temperaturas médias 2,79°C acima da média histórica. Na Colômbia, um terremoto de magnitude 7,4 deixou mais de 70 mortos e causou a queda de mais de duas dúzias de edifícios em Cali, levando o governo a declarar 'desastre nacional'. Na Inglaterra, 71,3% do território está em estado de seca, com uma quinta onda de calor prevista para a próxima semana. Os Estados Unidos criaram um corredor marinho na Flórida para proteger suas costas, buscando recuperar arrecifes, manguezais e outras espécies marinhas. Além disso, incêndios florestais assolaram áreas como a região de Okanagan no Canadá e Castellón na Espanha, com mais de 300 bombeiros e 21 aeronaves combatendo o fogo em Tírig, na Espanha Oriental.", "direitos_humanos": "Um tribunal de Hong Kong confirmou um último recurso apresentado por 11 políticos e ativistas oposicionistas presos, anulando suas condenações por conspiração à subversão. A decisão foi tomada após uma análise de cinco questões legais pelo Tribunal de Recursos. De outro lado, a Agência Nacional de Polícia da Coreia anunciou que vai intensificar medidas para incentivar denúncias e proteger os informantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia. Além disso, o Sindicato dos Jornalistas Palestinos registrou 108 ataques israelenses contra jornalistas e trabalhadores da mídia palestinos em julho, incluindo detenções, agressões físicas e uso de granadas de efeito sonoro. Finalmente, a nova lei de Kathy Hochul exige que 12 agências da Polícia de Nova York encerrarem seus acordos com o ICE até 25 de agosto, visando limitar a cooperação entre as forças policiais locais e imigrações federais."}, "resumo_do_dia": {"politica_nacional": [{"id": 96591, "titulo": "Flávio se inspira em carta de Bolsonaro para criar marca de campanha", "url": "https://www.metropoles.com/colunas/igor-gadelha/flavio-se-inspira-em-carta-de-bolsonaro-para-criar-marca-de-campanha", "fonte_id": "metropoles", "data_pub": "2026-08-10T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A marca de campanha do senador Flávio Bolsonaro foi inspirada na letra escrita pelo próprio pai, Jair Bolsonaro, em uma carta divulgada no final de 2025.", "titulo_pt": "Flávio se inspira em carta de Bolsonaro para criar marca de campanha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96635, "titulo": "Palver: governo Lula tem 55% de desaprovação e 45% de aprovação", "url": "https://www.cnnbrasil.com.br/politica/palver-governo-lula-tem-55-de-desaprovacao-e-45-de-aprovacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que 55% dos entrevistados desaprovam a gestão do governo Lula, enquanto 45% aprovam. Outros 4% consideram a administração regular.", "titulo_pt": "Palver: governo Lula tem 55% de desaprovação e 45% de aprovação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96607, "titulo": "PE: governadora Raquel Lyra faz B.O. após vídeo deepfake pedir Pix", "url": "https://www.metropoles.com/brasil/pe-governadora-raquel-lyra-faz-b-o-apos-video-deepfake-pedir-pix", "fonte_id": "metropoles", "data_pub": "2026-08-10T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Raquel Lyra registrou um boletim de ocorrência após um vídeo deepfake que mostra sua imagem pedindo dinheiro online. Pixs recebidos por contas desconhecidas foram registrados após a divulgação do vídeo.", "titulo_pt": "PE: governadora Raquel Lyra faz B.O. Após vídeo deepfake pedir Pix", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96639, "titulo": "Palver: Lula tem maior rejeição, com 52%, seguido por Flávio, com 51%", "url": "https://www.cnnbrasil.com.br/eleicoes/palver-lula-tem-maior-rejeicao-com-52-seguido-por-flavio-com-51/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que Lula tem a maior rejeição, com 52%, seguida por Flávio, com 51%. A pesquisa foi realizada entre os dias 3 e 7 de agosto com 5.000 eleitores e tem uma margem de erro de 3 pontos percentuais.", "titulo_pt": "Lula lidera em rejeição, seguido por Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96608, "titulo": "PGR foi a favor de operação no Iprev de Maceió, mas fez ressalvas", "url": "https://www.metropoles.com/colunas/manoela-alcantara/pgr-foi-a-favor-de-operacao-no-iprev-de-maceio-mas-fez-ressalvas", "fonte_id": "metropoles", "data_pub": "2026-08-10T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) apoiou as buscas e apreensões, mas se opôs à operação contra o presidente do Iprev de Maceió e a chefe de gabinete. No entanto, Mendonça autorizou a operação.", "titulo_pt": "PGR apoiou operação no Iprev de Maceió, mas fez ressalvas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96954, "titulo": "Partido vai ao STF contra licença remunerada a servidor durante mandato sindical", "url": "https://www.jota.info/stf/do-supremo/partido-vai-ao-stf-contra-licenca-remunerada-a-servidor-durante-mandato-sindical", "fonte_id": "jota", "data_pub": "2026-08-10T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido apresentou uma ação no STF questionando a licença remunerada concedida aos servidores durante mandatos sindicais. Alega que há falta de simetria com a Constituição Federal.", "titulo_pt": "Partido apresenta ação no STF contra licença remunerada a servidor durante mandato sindical", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96644, "titulo": "Palver: Lula e Flávio têm 46% no 2º turno", "url": "https://www.cnnbrasil.com.br/noticias/palver-lula-e-flavio-tem-46-no-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que Lula e Flávio têm 46% das intenções de voto no segundo turno. Petista supera simulações contra Renan, Caiado e Zema.", "titulo_pt": "Lula e Flávio lideram com 46% no segundo turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96582, "titulo": "Nova pesquisa Quaest volta a testar Lula x Flávio após diferença cair para 5 pontos no segundo turno", "url": "https://veja.abril.com.br/politica/nova-quaest-volta-a-testar-lula-x-flavio-apos-diferenca-cair-para-5-pontos-no-segundo-turno/", "fonte_id": "veja", "data_pub": "2026-08-10T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa Quaest será realizada para medir a preferência dos eleitores entre Lula e Flávio no segundo turno, após uma diferença de 5 pontos percentuais ser registrada.", "titulo_pt": "Nova pesquisa Quaest volta a testar Lula x Flávio após diferença cair para 5 pontos no segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96583, "titulo": "Pix, deepfake e campanha: caso de Raquel Lyra expõe novos desafios das eleições de 2026", "url": "https://veja.abril.com.br/brasil/pix-deepfake-e-campanha-caso-de-raquel-lyra-expoe-novos-desafios-das-eleicoes-de-2026/", "fonte_id": "veja", "data_pub": "2026-08-10T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora de Pernambuco registrou um Boletim de Ocorrência após um vídeo com deepfake que simulou sua imagem e voz solicitando transferências. Este caso ilustra novos desafios para as eleições de 2026.", "titulo_pt": "Pix, deepfake e campanha: caso de Raquel Lyra expõe novos desafios das eleições de 2026", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96614, "titulo": "Conheça as categorias especiais do Prêmio Congresso em Foco", "url": "https://www.congressoemfoco.com.br/noticia/121141/conheca-as-categorias-especiais-do-premio-congresso-em-foco", "fonte_id": "congresso_em_foco", "data_pub": "2026-08-10T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A edição do Prêmio Congresso em Foco de 2026 apresenta sete categorias especiais, destinadas a reconhecer parlamentares que se destacam em temas sociais de alta relevância.", "titulo_pt": "Conheça as categorias especiais do Prêmio Congresso em Foco", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 96584, "titulo": "Tarcísio x Haddad: quem errou ou distorceu mais dados no debate da Band", "url": "https://veja.abril.com.br/politica/tarcisio-x-haddad-quem-errou-ou-distorceu-mais-dados-no-debate-da-band/", "fonte_id": "veja", "data_pub": "2026-08-10T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento da Agência Lupa, que especializa em checagem de fatos, identificou imprecisões, omissões ou erros nas declarações dos candidatos Tarcísio de Almeida e João Doria no debate da Band para a gubernatorial do estado de São Paulo.", "titulo_pt": "Tarcísio x dória: quem cometeu mais erros ou distorções nos debates?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96529, "titulo": "Após ser alvo de adversários, governadora do DF estuda não ir aos próximos debates", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/apos-ser-alvo-de-adversarios-governadora-do-df-estuda-nao-ir-aos-proximos-debates.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-10T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora do Distrito Federal, Celina Leão (PP), que foi alvo preferido dos adversários no primeiro debate televisivo, está considerando não participar de futuros debates.", "titulo_pt": "Governo do DF estuda não comparecer a próximos debates", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 96680, "titulo": "Do raio X à inteligência artificial: como a tecnologia transforma o diagnóstico por imagem", "url": "https://www.brasildefato.com.br/2026/08/10/do-raio-x-a-inteligencia-artificial-como-a-tecnologia-transforma-o-diagnostico-por-imagem/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-10T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tecnologia auxilia no diagnóstico por imagem desde a descoberta dos raios X há mais de 130 anos, com algoritmos ajudando na identificação de lesões e avaliação de riscos. No entanto, o avanço também apresenta desafios éticos e de segurança de dados.", "titulo_pt": "Do raio-x à inteligência artificial: como a tecnologia transforma o diagnóstico por imagem", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 96616, "titulo": "Erika propõe auxílio-aluguel para vítimas de violência doméstica", "url": "https://www.congressoemfoco.com.br/noticia/121140/erika-propoe-auxilio-aluguel-para-vitimas-de-violencia-domestica", "fonte_id": "congresso_em_foco", "data_pub": "2026-08-10T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto proposto pela parlamentar Erika visa fornecer um auxílio-aluguel para mulheres vítimas de violência doméstica, visando garantir sua independência financeira em relação ao agressor.", "titulo_pt": "Erika sugere auxílio-aluguel para mulheres vítimas de violência doméstica", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 96617, "titulo": "PF faz buscas no Iprev de Maceió por aporte de R$ 97 milhões no Master", "url": "https://www.congressoemfoco.com.br/noticia/121139/pf-faz-buscas-no-iprev-de-maceio-por-aporte-de-r-97-milhoes-no-master", "fonte_id": "congresso_em_foco", "data_pub": "2026-08-10T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal autorizou buscas no Instituto de Previdência de Maceió (Iprev) relacionadas a um possível aporte de R$ 97 milhões em investimentos irregularidades no Banco Master. O ministro André Mendonça permitiu as buscas e o bloqueio de até R$ 97 milhões envolvidos na investigação.", "titulo_pt": "PF realiza buscas no Iprev de Maceió suspeitas de aporte de R$ 97 milhões em investimentos", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 96589, "titulo": "O pedido do setor de desenvolvimento aos candidatos", "url": "https://veja.abril.com.br/brasil/o-pedido-do-setor-de-desenvolvimento-aos-candidatos/", "fonte_id": "veja", "data_pub": "2026-08-10T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma associação do setor de desenvolvimento divulgou uma carta aos candidatos à Presidência e ao Legislativo. O documento apresenta pedidos específicos do setor.", "titulo_pt": "Associação do setor de desenvolvimento envia cartas aos candidatos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 97302, "titulo": "Taiwan slows mobile Internet for drills", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/11/2003862277", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan reduziu temporariamente o velocidade da Internet móvel durante exercícios militares. Essa medida foi tomada para garantir a segurança e a eficiência dos drill.", "titulo_pt": "Taiwan diminui velocidade da Internet móvel para drills", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 97010, "titulo": "We are chasing Ebola virus - it is ahead of us, WHO warns", "url": "https://www.bbc.co.uk/news/articles/c5ydx7m8gzeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_p ": "Terremoto de magnitude 7,4 atinge região próxima a bogotá; 69 mortos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 97133, "titulo": "La Corte Suprema russa esclude il partito d'opposizione Yabloko dalle elezioni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/10/la-corte-suprema-russa-esclude-il-partito-dopposizione-yabloko-dalle-elezioni_925a9e27-dc2d-43cd-be11-9f6cba6477ab.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-10T16:58:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema russa excluiu o partido de oposição Yabloko das eleições. As votações para a Duma estão previstas para setembro.", "titulo_pt": "Corte Suprema russa excluirá partido de oposição Yabloko das eleições", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 97135, "titulo": "Trump, 'Iran chiede un risarcimento? Dovrei chiederlo io'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/10/trump-iran-chiede-un-risarcimento-dovrei-chiederlo-io_2788ef64-0f65-43b9-8021-29db00cbdf78.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-10T16:49:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, fez uma declaração sobre o Irã, sugerindo que deveria pedir compensação por vítimas de bombas plantadas em estradas. Trump questionou se o Irã não deveria ser responsabilizado pelas mortes causadas por essas explosões.", "titulo_pt": "Trump: 'Irã quer reparações? Deveria eu pedi-las?'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 97209, "titulo": "Pentagon official renews calls for allies' greater defense contributions", "url": "https://en.yna.co.kr/view/AEN20260811000200315", "fonte_id": "yonhap_news", "data_pub": "2026-08-10T16:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um alto funcionário do Pentágono reiterou chamados para que aliados aumentem suas contribuições para a defesa.", "titulo_pt": "A rada. Antes disso, casos da doença foram erroneamente atribuídos à malária e tifoides.", "titulo_pt": "Epidemia de Ebola na rdc começou meses antes da declaração oficial, diz OMS", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 96951, "titulo": "O tarifaço dos EUA e o reequilíbrio de contratos de longo prazo", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-tarifaco-dos-eua-e-o-reequilibrio-de-contratos-de-longo-prazo", "fonte_id": "jota", "data_pub": "2026-08-10T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novas tarifas nos Estados Unidos estão afetando concessões no Brasil e criando oportunidades para reequilibrar contratos de longo prazo.", "titulo_pt": "Tarifaço norte-americano e reequilíbrio de contratos de longo prazo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96538, "titulo": "Beyoncé adquire participação da LVMH na marca de uísque SirDavis", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/beyonce-adquire-participacao-da-lvmh-na-marca-de-uisque-sirdavis.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Beyoncé adquiriu o controle total da marca de uísque SirDavis após a venda da participação do grupo francês LVMH.", "titulo_pt": "Beyoncé compra controle total da marca de uísque SirDavis", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 96953, "titulo": "Eficiências em fusões: estamos analisando do jeito errado?", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-da-abde/eficiencias-em-fusoes-estamos-analisando-do-jeito-errado", "fonte_id": "jota", "data_pub": "2026-08-10T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio não é reduzir o rigor da análise, mas adaptá-la a uma realidade onde eficiência, inovação e concorrência estão cada vez mais interligadas.", "titulo_pt": "Eficiências em fusões: estamos analisando do jeito errado?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96581, "titulo": "Enel investe R$ 4 milhões para cortar conta de luz de hospitais em SP", "url": "https://veja.abril.com.br/economia/enel-investe-r-4-milhoes-para-cortar-conta-de-luz-de-hospitais-em-sp/", "fonte_id": "veja", "data_pub": "2026-08-10T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Enel investiu R$ 4 milhões em projetos de eficiência energética em três unidades de saúde em São Paulo, com o objetivo de reduzir os gastos com energia. Essas medidas devem resultar em economias anuais de R$ 505 mil.", "titulo_pt": "Enel investe R$ 4 milhões para cortar conta de luz de hospitais em SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96648, "titulo": "Custo da cesta básica cai em 26 das 27 capitais brasileiras em julho", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/custo-da-cesta-basica-cai-em-26-das-27-capitais-brasileiras-em-julho/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em julho, o custo da cesta básica diminuiu em 26 das 27 capitais brasileiras. São Paulo permaneceu como a capital com o maior valor para a cesta básica, que ficou em R$ 915,01, após uma redução mensal de 5,23%.", "titulo_pt": "Custo da cesta básica diminui em 26 das 27 capitais brasileiras em julho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96539, "titulo": "Ações da Embraer sobem até 9% após alta do lucro no segundo trimestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466706", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T15:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Embraer subi its-millions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de US$38 milhões em reembolsos de tarifas, juntamente com juros acumulados, foram creditados nas contas bancárias de cinco empresas chinesas listadas desde o último mês. Esses reembolsos estão previstos para aumentar as receitas dessas empresas.", "titulo_pt": "Ondulação de reembolsos de tarifas dos EUA chega às empresas chinesas, elevando lucros em milhões", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 97045, "titulo": "Revolut claims to have secured French banking license, boosting European retail bank push", "url": "https://www.lemonde.fr/en/economy/article/2026/08/10/revolut-claims-to-have-secured-french-banking-license-boosting-european-retail-bank-push_6756346_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-10T14:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fintech britânica Revolut afirmou ter obtido uma licença bancária francesa completa, um passo importante que reforça sua posição entre os bancos de varejo estabelecidos da Europa.", "titulo_pt": "Revolut diz ter conquistado licença bancária francesa, fortalecendo presença no mercado europeu", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 96540, "titulo": "Malbec é uma das três fragrâncias masculinas mais vendida do mundo; Boticário aumenta investimento na marca em 30%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/malbec-se-torna-3a-fragrancia-mais-vendida-do-mundo-boticario-aumenta-investimento-na-marca-em-30.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A marca Malbec, pertencente ao Boticário, é uma das três fragrâncias masculinas mais vendidas do mundo, conforme relatório da Euromonitor International. O Boticário aumentou seu investimento na marca em 30%.", "titulo_pt": "Malbec é uma das três fragrâncias masculinas mais vendidas do mundo; Boticário aumenta investimento em 30%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 96541, "titulo": "BC discute medida para impedir ofensas e ameaças em mensagens nas transações via Pix", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/bc-discute-medida-para-impedir-ofensas-e-ameacas-em-mensagens-nas-transacoes-via-pix.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T14:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central identificou o uso inadequado do campo de mensagens nas transações via Pix, que tem sido usado para propagar ameaças e ofensas. Em conjunto com instituições financeiras, o BC está estudando medidas para impedir esse tipo de uso.", "titulo_pt": "BC discute medida para impedir ameaças e ofensas em mensagens nas transações via Pix", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 96542, "titulo": "China diz que é afetada por tarifaço e pede para entrar em ação do Brasil contra EUA na OMC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/eua-aceitam-pedido-de-consulta-do-brasil-na-omc-sobre-novo-tarifaco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China solicitou formalmente participar das consultas na OMC contra o tarifaço de até 37,5% imposto pelo governo dos EUA ao Brasil. A China afirma estar sendo afetada por essas medidas comerciais.", "titulo_pt": "China solicita participação em consulta da OMC contra tarifaço dos EUA ao Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 96565, "titulo": "Desenrola Adimplentes começa a operar nesta segunda-feira", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/desenrola-adimplentes-comeca-operar-nesta-segunda-feira", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-10T14:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Começa a operação do Desenrola Adimplentes, modalidade do programa Desenrola destinada a trabalhadores informais que mantenham seus compromissos financeiros em dia. A linha permite trocar empréstimos mais caros por crédito com juros de até 1,99% ao mês e valores até R$ 15 mil.", "titulo_pt": "Desenrola Adimplentes começa a operar nesta segunda-feira", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 96916, "titulo": "Car owners should challenge insurers on steep price hikes and ‘call their bluff’, Asic says", "url": "https://www.theguardian.com/australia-news/2026/aug/11/car-insurance-prices-asic", "fonte_id": "guardian_world", "data_pub": "2026-08-10T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Australian Securities and Investments Commission (ASIC) aconselha proprietários de veículos a questionarem as seguradoras sobre os aumentos significativos nas primas, pois muitas empresas estariam aumentando os preços mais rapidamente do que a inflação. O relatório da ASIC mostrou que nenhuma das oito seguradoras analisadas explicou adequadamente aos clientes os motivos por trás dos cálculos de primas ou as razões pelas quais as primas haviam mudado.", "titulo_pt": "Donos de carros devem desafiar seguradoras sobre reajustes exorbitantes, diz Asic", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 97127, "titulo": "Yen sinks as effect of US-Japan intervention fades", "url": "https://www.ft.com/content/47d2ab3c-0423-49ed-89ca-68683761ed98?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-10T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene perdeu valor após a eficácia da intervenção conjunta com os Estados Unidos diminuir. Investidores apontam a falta de uma 'voz unificada' entre as autoridades monetárias como motivo para o movimento.", "titulo_pt": "Iene cai após efeito da intervenção us-japão esmorecer", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 97323, "titulo": "China humanoid robot makers hold 97% of shipments in H1, report says", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/11/2003862265", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com o relatório, as empresas chinesas de robôs humanóides dominaram 97% das exportações no primeiro semestre de 2023. O relatório não fornece detalhes adicionais sobre a participação de outras empresas nesse mercado.", "titulo_pt": "Fabricantes chineses de robôs humanóides detêm 97% das exportações no primeiro semestre, diz relatório", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 96892, "titulo": "Inteligencia Artificial parlamentaria: Cámara obligará a diputados y equipos a transparentar uso de IA", "url": "https://www.latercera.com/politica/noticia/inteligencia-artificial-parlamentaria-camara-obligara-a-diputados-y-equipos-a-transparentar-uso-de-ia/", "fonte_id": "la_tercera", "data_pub": "2026-08-10T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O parlamento aprovou um protocolo para declarar o uso de inteligência artificial pelos deputados e seus equipes, utilizando selos de cores: verde para conteúdo sem IA, amarelo para uso parcial, vermelho para uso predominante e azul indicando intervenção humana total.", "titulo_pt": "Inteligência Artificial parlamentar: câmara obligará deputados e equipes a transparentar uso de IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 97122, "titulo": "Wall Street giants partner with Nvidia on $500bn AI financing deal", "url": "https://www.ft.com/content/98a8fd17-15b6-4f67-9cb4-825722b11348?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-10T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grandezas de Wall Street, como Apollo, Blackstone e Goldman Sachs, estão colaborando com a Nvidia para arrecadar capital para o boom das centrais de dados.", "titulo_pt": "Gigantes de wall Street se associam à Nvidia em acordo de financiamento de AI por us$ 500 bilhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 97214, "titulo": "Four takeaways from Mark Zuckerberg’s massive AI manifesto", "url": "https://www.theverge.com/tech/977395/meta-mark-zuckerberg-superintelligent-ai-ramble", "fonte_id": "the_verge", "data_pub": "2026-08-10T15:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Meta, Mark Zuckerberg, publicou um extenso manifesto de mais de 6.500 palavras sobre como a humanidade e a inteligência artificial podem coexistir no futuro idealizado por ele.", "titulo_pt": "Quatro pontos principais do manifesto de AI de Mark Zuckerberg", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 97222, "titulo": "One of China's workhorse rockets just exploded in flight", "url": "https://arstechnica.com/space/2026/08/one-of-chinas-workhorse-rockets-just-exploded-in-flight/", "fonte_id": "ars_technica", "data_pub": "2026-08-10T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos foguetes principais da China falhou durante o voo, possivelmente envolvendo o motor YF-100. Isso levanta preocupações mais amplas para o programa espacial chinês.", "titulo_pt": "Um dos foguetes workhorse da China explodiu em voo", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 97210, "titulo": "KASA announces revision easing permit procedures for multiple rocket launches", "url": "https://en.yna.co.kr/view/AEN20260810005700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-10T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Espacial Sul-Coreana anunciou uma revisão que facilitará os procedimentos de permissão para múltiplos lançamentos de foguetes.", "titulo_pt": "KASA anuncia revisão para facilitar procedimentos de permissão para lançamentos de foguetes múltiplos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 97234, "titulo": "Orange Crush: TAG Heuer Drops a Bright Revamp of the Original Metal F1 Watch", "url": "https://www.wired.com/story/orange-crush-tag-heuer-drops-a-bright-revamp-of-the-original-metal-f1-watch/", "fonte_id": "wired", "data_pub": "2026-08-10T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TAG Heuer lançou uma edição limitada com energia solar para marcar a última Grande Premiação da Holanda no Zandvoort. A versão colorida esperada pela WIRED foi revelada.", "titulo_pt": "Orange Crush: TAG Heuer lança edição especial e colorida para última grande premiação da holanda", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 96657, "titulo": "O alerta do banco central dos bancos centrais sobre IA que chega ao bolso do trabalhador", "url": "https://exame.com/inteligencia-artificial/o-alerta-do-banco-central-dos-bancos-centrais-sobre-ia-que-chega-ao-bolso-do-trabalhador/", "fonte_id": "exame", "data_pub": "2026-08-10T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BIS advertiu sobre os possíveis impactos do avanço da inteligência artificial na economia, incluindo mudanças nos investimentos, produtividade e inflação, bem como no modo como os bancos centrais analisam a economia.", "titulo_pt": "Alerta do bis sobre IA chega ao bolso do trabalhador", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 97217, "titulo": "What happens to Bose when headphones become AI?", "url": "https://www.theverge.com/podcast/975732/bose-ceo-lila-snyder-ai-wearables-licensing-headphones-audio", "fonte_id": "the_verge", "data_pub": "2026-08-10T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bose, uma das marcas mais conhecidas na tecnologia de consumo, é liderada por Lila Snyder, sua CEO. A empresa começou há 60 anos vendendo alto-falantes e se destacou pela pesquisa e desenvolvimento, o que a tornou líder em ambos os campos.", "titulo_pt": "O que acontece com a Bose quando os fones de ouvido se tornarem inteligentes?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 97218, "titulo": "Boeing is selling its air taxi startups to Archer Aviation", "url": "https://www.theverge.com/transportation/977306/boeing-selling-evtol-archer-wisk-air-taxi", "fonte_id": "the_verge", "data_pub": "2026-08-10T13:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Boeing está vendendo três de suas subsidiárias de táxi aéreo elétrico (eVTOL) para a Archer Aviation, além de adquirir uma participação indeterminada na empresa sediada em São José. As subsidiárias a serem adquiridas pela Archer incluem Wisk Aero e SkyGrid.", "titulo_pt": "Boeing vende suas startups de táxi aéreo elétrico para a Archer Aviation", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 97180, "titulo": "Enterprise AI costs hit 2026 low driven by price wars, Chinese open-source models: research", "url": "https://www.scmp.com/tech/tech-trends/article/3363549/enterprise-ai-costs-hit-2026-low-driven-price-wars-chinese-open-source-models-research?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os custos para empresas operarem modelos de inteligência artificial atingiram o nível mais baixo anual, segundo pesquisa da Jefferies. O motivo é a concorrência global no preço e o aumento na adoção de ferramentas open-source chinesas de baixo custo, como as do DeepSeek.", "titulo_pt": "Custos de IA para empresas atingem nível mais baixo anual, impulsionados por guerra de preços globais e modelos open-source chineses", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 97181, "titulo": "Uber partners with Hong Kong firm to launch its first premium service outside US", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3363565/uber-partners-hong-kong-firm-launch-its-first-premium-service-outside-us?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T13:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uber se associou a uma empresa de transporte hongkonesa para lançar seu primeiro serviço premium fora dos Estados Unidos. A parceria visa introduzir o Uber Elite, que oferece viagens reservadas em veículos Mercedes-Benz com motoristas uniformizados e outros serviços adicionais.", "titulo_pt": "Uber se associa a empresa hongkonesa para lançar serviço premium na cidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96668, "titulo": "O que pode mudar na Cursor com a compra pela SpaceX", "url": "https://exame.com/inteligencia-artificial/o-que-pode-mudar-na-cursor-com-a-compra-pela-spacex/", "fonte_id": "exame", "data_pub": "2026-08-10T13:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A compra da marca Cursor pela SpaceX no valor de 60 bilhões de dólares pode ser concluída em até duas semanas. A marca Cursor deve desaparecer nos produtos futuros, e um novo produto pode ser chamado de 'Grok Bot'.", "titulo_pt": "O que muda na Cursor com a compra pela SpaceX", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 96548, "titulo": "Meta divulga parâmetros de novo modelo de IA e Zuckerberg volta a defender código aberto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/meta-divulga-parametros-de-novo-modelo-de-ia-e-zuckerberg-volta-a-defender-codigo-aberto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta divulgou os parâmetros do novo modelo de IA chamado Muse Glimmer, permitindo que desenvolvedores baixem e modifiquem o código. A empresa também prometeu exibir as especificações técnicas de seu modelo mais potente, o Muse Spark, nas próximas semanas.", "titulo_pt": "Meta divulga parâmetros do novo modelo de IA e volta a defender código aberto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97060, "titulo": "Meta to open source its most powerful AI model as it takes swipe at OpenAI, Anthropic", "url": "https://www.cnbc.com/2026/08/10/meta-muse-glimmer-open-weight-ai.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-10T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta anunciou o lançamento do Muse Glimmer e planeja liberar os pesos do Muse Spark 1.2, com Zuckerberg buscando liderança dos Estados Unidos na IA aberta.", "titulo_pt": "Meta abrirá fonte de seu modelo AI mais poderoso como resposta a OpenAI e Anthropic", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 97123, "titulo": "Just how big is the hidden leverage of AI hyperscalers?", "url": "https://www.ft.com/content/a0a07cce-6d19-4b1e-a73b-9855a06ba7b3", "fonte_id": "financial_times", "data_pub": "2026-08-10T12:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pergunta central é sobre o tamanho do crédito oculto associado às grandes empresas de inteligência artificial.", "titulo_pt": "Quão grande é realmente o crédito oculto das gigantes da IA?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 97337, "titulo": "NASA+ Debuts on discovery+, Coming Soon to HBO Max", "url": "https://www.nasa.gov/news-release/nasa-debuts-on-discovery-coming-soon-to-hbo-max/", "fonte_id": "nasa_news", "data_pub": "2026-08-10T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA+ est tm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "RFK Jr. apresentou uma nova proposta que exigirá notícias sobre aditivos alimentares, fechando o chamado 'buraco GRAS' na indústria alimentícia; os defensores da nutrição forneceram críticas mistas a essa medida.", "titulo_pt": "FDA exigirá notícias de aditivos alimentares pela primeira vez", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 97328, "titulo": "Sad or afraid? Dogs may be able to read your face", "url": "https://www.sciencenews.org/article/dogs-understand-emotions-humans-face", "fonte_id": "science_news", "data_pub": "2026-08-10T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa que utiliza imagens cerebrais sugere que os cães podem ser capazes de distinguir entre certas emoções negativas humanas apenas olhando para as faces das pessoas.", "titulo_pt": "Triste ou assustado? Cães podem ler as expressões faciais humanas", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 97285, "titulo": "STAT+: Ban prior auth? And hospitals cut jobs", "url": "https://www.statnews.com/2026/08/10/advocate-ban-prior-authorization-340b-limits-impact-on-hospitals/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo examina uma proposta para reformar como as seguradoras de saúde operam e também analisa os efeitos das restrições do programa 340B.", "titulo_pt": "Reforma nas seguradoras? E os impactos das restrições do 340b?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 97286, "titulo": "STAT+: FDA panel to weigh Grail’s Galleri test", "url": "https://www.statnews.com/2026/08/10/biotech-news-fda-panel-to-weigh-grail-galleri-test/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um painel da FDA vai avaliar o teste Galleri desenvolvido pela Grail. A China está restringindo seu motor de inovação biotecnológica e há um boom na indústria de radiofármacos enfrentando obstáculos inesperados.", "titulo_pt": "FDA analisará teste Galleri da Grail; china restringe inovação biotecnológica e radiofármacos enfrentam desafios", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 96528, "titulo": "Eclipse solar desta quarta (12) terá menos de 2 minutos de totalidade; tire suas dúvidas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/eclipse-solar-desta-quarta-12-tera-2-minutos-de-totalidade-tire-suas-duvidas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-10T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar total será visível na Europa continental nesta quarta-feira (12), sendo o primeiro de sua espécie em quase 30 anos. A Lua cobrirá o Sol, criando uma sombra sobre a Terra.", "titulo_pt": "Eclipse solar total desta quarta terá menos de 2 minutos de totalidade; tire suas dúvidas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 97335, "titulo": "Lion Nebula roars to life for Webb", "url": "https://www.esa.int/ESA_Multimedia/Images/2026/08/Lion_Nebula_roars_to_life_for_Webb", "fonte_id": "esa_space", "data_pub": "2026-08-10T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA/ESA/CSA James Webb Space Telescope capturou imagens do Nebuloso da Leoa (NGC 2392), uma nebulosa planetária, em ondas de luz infravermelhas, fornecendo uma visão mais nítida e detalhada do objeto comparado às imagens obtidas pela NASA/ESA Hubble Space Telescope em 2000.", "titulo_pt": "Nebuloso da leoa desperta para Webb", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 97338, "titulo": "Lion Nebula Roars to Life With NASA’s Webb", "url": "https://science.nasa.gov/missions/webb/lion-nebula-roars-to-life-with-nasas-webb/", "fonte_id": "nasa_news", "data_pub": "2026-08-10T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's James Webb Space Telescope capturou novas imagens da NGC 2392, conhecida como Nuvem de Leão. Essa nuvem de gás e poeira foi anteriormente fotografada pela NASA's Hubble em 2000.", "titulo_pt": "Nuvem de leão acorda com Webb", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 97339, "titulo": "Launch Into a New School Year With NASA", "url": "https://www.nasa.gov/learning-resources/launch-into-a-new-school-year-with-nasa/", "fonte_id": "nasa_news", "data_pub": "2026-08-10T13:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova escola traz oportunidades para se envolver com a NASA. A instituição oferece experiências que aproximam os estudantes das atividades espaciais, idealmente no início de uma era de exploração renovada.", "titulo_pt": "Embarque na nova escola ano com a NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 97287, "titulo": "STAT+: Pharmalittle: We’re reading about a Sanofi drug shortage, a Jazz Pharma deal, and more", "url": "https://www.statnews.com/pharmalot/2026/08/10/sanofi-drug-shortage-jazz-pharma-deal/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T13:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanofi está enfrentando escassez de dois medicamentos usados para tratar a doença de Pompe após o FDA advertir a empresa sobre problemas na produção.", "titulo_pt": "Pharmalittle: leitura sobre escassez de medicamento da Sanofi, acordo da Jazz Pharma e outros", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 97331, "titulo": "Chinese Long March 7A rocket explodes shortly after liftoff", "url": "https://spacenews.com/chinese-long-march-7a-rocket-explodes-shortly-after-liftoff/", "fonte_id": "spacenews", "data_pub": "202 e-e-encontros.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-10T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Tribalistas criam música por e-mail e telefone, mas a convivência entre Marisa Monte, Arnaldo Antunes e Carlinhos Brown é considerada fundamental. A dinâmica do grupo será discutida no programa Conversa com Bial na Globo.", "titulo_pt": "Tribalistas usam e-mail e telefone para criar música, mas valorizam a convivência", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 97415, "titulo": "Who Thought Using a Podcast Hosted by AI Dogs to Promote ‘The End of Oak Street’ Was a Good Idea?", "url": "https://www.indiewire.com/news/general-news/end-of-oak-street-ai-dogs-podcast-1235209765/", "fonte_id": "indiewire", "data_pub": "2026-08-10T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No fim de semana, houve uma forte reação negativa online a um promocional de 90 segundos para o filme 'The End of Oak Street', dirigido por David Robert Mitchell, que foi apresentado por um podcast conduzido por cães de inteligência artificial.", "titulo_pt": "Quem pensou que usar um Podcast Hosted por cães de inteligência artificial para promover ‘The End of Oak Street’ era uma boa ideia?", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 96555, "titulo": "CazéTV procura emissoras para tentar sublicenciar jogos do Campeonato Espanhol", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/08/cazetv-procura-emissoras-para-tentar-sublicenciar-jogos-do-campeonato-espanhol.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-10T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CazéTV está buscando uma emissora para sublicenciar os jogos do Campeonato Espanhol antes da estreia da temporada, que ocorre no sábado (15). O objetivo é concluir um acordo até essa data.", "titul , "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz Juliette Lewis estreou no palco da Broadway como a criada Magenta, trazendo de volta o espetáculo 'Rocky Horror Show', um musical criado por Richard O'Brien em 1973.", "titulo_pt": "Rocky Horror na Broadway: revê a irreverência que faz o musical ser cult", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 97356, "titulo": "Joby Talbot’s Path of Miracles / György Kurtág’s Kafka Fragments review – Bristol Proms reach for the heavenly", "url": "https://www.theguardian.com/music/2026/aug/10/joby-talbots-path-of-miracles-gyorgy-kurtags-kafka-fragments-bristol-proms-reach-for-the-heavenly", "fonte_id": "guardian_culture", "data_pub": "2026-08-10T15:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na tarde de domingo, dois concertos encerraram o fim-de-semana dos Proms em Bristol. A primeira apresentação foi da Tenebrae e do seu diretor Nigel Short comemorando seus 25 anos, enquanto Sakari Oramo, habitualmente maestro, tocou violino no dueto com sua esposa Anu Komsi. Ambos os concertos proporcionaram diferentes experiências musicais, uma de grandeza e espetáculo, a outra de ritual e simplicidade.", "titulo_pt": "Revisão dos concertos tenebrae e sakari oramo nos Proms de Bristol", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 97359, "titulo": "‘I can’t watch it without sobbing’: your happiest TV endings", "url": "https://www.theguardian.com/tv-and-radio/2026/aug/10/i-cant-watch-it-without-sobbing-your-happiest-tv-endings", "fonte_id": "guardian_culture", "data_pub": "2026-08-10T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Guardian leitores apontam as finais mais encorajadoras e emocionantes da TV, incluindo despedidas poéticas e monos de pelúcia adoráveis. Estes momentos são descritos como capazes de fazer os leitores chorarem de alegria.", "titulo_pt": "‘Não consigo assistir sem chorar’: as
