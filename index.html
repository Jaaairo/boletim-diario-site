sse": "B"}, {"id": 210247, "titulo": "Mulheres e clima: transversalidade em políticas públicas", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/mulheres-e-clima-transversalidade-em-politicas-publicas", "fonte_id": "jota", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Opinião Consultiva da CIDH destaca a importância de implementar políticas climáticas que considerem o gênero no Brasil. O documento reforça a urgência de ações que levem em conta as diferentes experiências e impactos do clima entre homens e mulheres.", "titulo_pt": "Mulheres e clima: transversalidade em políticas públicas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210650, "titulo": "Gov't finalizes 6th Suicide Prevention Basic Plan", "url": "https://en.yna.co.kr/view/AEN20261012002800315", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano finalizou o Plano Básico de Prevenção ao Suicídio de 6ª geração. O plano inclui uma série de medidas para prevenir suicídios.", "titulo_pt": "Governo finaliza 6º plano básico de prevenção ao suicídio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210171, "titulo": "Alunos em risco: 33 escolas no Entorno funcionam sem inspeção dos bombeiros", "url": "https://www.metropoles.com/distrito-federal/entorno/alunos-em-risco-33-escolas-no-entorno-funcionam-sem-inspecao-dos-bombeiros", "fonte_id": "metropoles", "data_pub": "2026-10-12T06:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trinta e três escolas no Entorno do Distrito Federal funcionam sem inspeção dos bombeiros. Após 10 anos de acompanhamento do Ministério Público do Estado de Goiás (MPGO) em Novo Gama, 14 escolas têm projetos, mas as obras aguardam aprovação.", "titulo_pt": "Alunos em risco: 33 escolas no Entorno funcionam sem inspeção dos bombeiros", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210616, "titulo": "As births rise, parents still struggle to get daycare spots", "url": "https://www.koreaherald.com/article/10899825", "fonte_id": "korea_herald", "data_pub": "2026-10-12T06:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pai de 35 anos, com dois filhos de 2 e 4 anos, aguarda há 18 meses por uma vaga em um centro de creche pública em Gwangjin-gu, Seul. Devido à falta de vagas, a renda da família diminuiu enquanto a mãe trabalha em horário parcial para cuidar dos filhos.", "titulo_pt": "Nascimento cresce, mas pais ainda lutam por vagas em creches", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 210172, "titulo": "Sem comida e na rua: os 18 dias em que menina passou sequestrada pelo pai", "url": "https://www.metropoles.com/sao-paulo/os-18-dias-menina-sequestrada-pai", "fonte_id": "metropoles", "data_pub": "2026-10-12T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 20 de setembro, uma menina de 10 anos foi sequestrada pelo pai em Barueri. Ela foi resgatada 18 dias depois pela Polícia Militar na Praia Grande.", "titulo_pt": "Sem comida e na rua: os 18 dias em que menina passou sequestrada pelo pai", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210191, "titulo": "‘Mulher não ajuda mulher’: o receio que uma executiva de compliance levou para a sala de aula", "url": "https://exame.com/carreira/mulher-nao-ajuda-mulher-o-receio-que-uma-executiva-de-compliance-levou-para-a-sala-de-aula/", "fonte_id": "exame", "data_pub": "2026-10-12T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rudmila Onha Cruz, ex-executiva de compliance de empresas como Votorantim e Azul, relata como o ABP-W, da Saint Paul, superou um receio e transformou-se em uma rede de apoio.", "titulo_pt": "‘Mulher não ajuda mulher’: o receio que uma executiva de compliance desfez e virou rede de apoio", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 210323, "titulo": "“Ha sido un invierno duro para Chile”: Kast lamenta muerte de trabajadores tras alud de nieve en El Teniente", "url": "https://www.latercera.com/nacional/noticia/ha-sido-un-invierno-duro-para-chile-kast-lamenta-muerte-de-trabajadores-tras-alud-de-nieve-en-el-teniente/", "fonte_id": "la_tercera", "data_pub": "2026-10-12T04:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Kast expressou condolências às famílias e colegas dos trabalhadores falecidos no deslizamento de neve em El Teniente. Os corpos dos operários foram localizados neste domingo no setor Rajo Sur da divisão de Codelco.", "titulo_pt": "Foi um inverno difícil para Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 210329, "titulo": "Cadem: 51% cree que aluvión en Las Condes se pudo haber evitado si autoridades se hubieran anticipado", "url": "https://www.latercera.com/nacional/noticia/cadem-51-cree-que-aluvion-en-las-condes-se-pudo-haber-evitado-si-autoridades-se-hubieran-anticipado/", "fonte_id": "la_tercera", "data_pub": "2026-10-12T02:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mostrou que 51% das pessoas acreditam que a aluvão em Las Condes poderia ter sido evitado se as autoridades tivessem se antecipado. Além disso, 82% consideram que o país não está preparado para lidar com eventos climáticos relacionados a El Niño.", "titulo_pt": "Cadem: 51% acham que aluvão em Las Condes poderia ter sido evitado com antecipação das autoridades", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 209630, "titulo": "Reports of elder-abuse exceed 26,000", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/12/2003865814", "fonte_id": "taipei_times", "data_pub": "2026-10-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há relatos de mais de 26.000 casos de abuso contra idosos. Este número reflete a quantidade de denúncias registradas.", "titulo_pt": "Relatos de abuso contra idosos ultrapassam 26.000", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 209634, "titulo": "Couple detained after death of two-year-old", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/12/2003865818", "fonte_id": "taipei_times", "data_pub": "2026-10-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um casal foi detido após a morte de um duas anos de idade.", "titulo_pt": "Casal detido após morte de duas anos de idade", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 210337, "titulo": "Tragedia en El Teniente: hallan muertos a dos trabajadores tras alud y sindicato pide indagar por qué efectuaban labores en zona crítica", "url": "https://www.latercera.com/nacional/noticia/tragedia-en-el-teniente-hallan-muertos-a-dos-trabajadores-tras-alud-y-sindicato-pide-indagar-por-que-trabajaban-en-zona-critica/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T23:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores de uma subcontratista, San Lorenzo, que prestava serviços através da Aura, foram encontrados mortos após um deslizamento de terra no mina El Teniente. Eles realizavam inspeções em áreas do rajo aberto, que estavam paralisadas devido ao mau tempo.", "titulo_pt": "Tragédia em El Teniente: trabalhadores mortos após deslizamento e sindicato pede investigação", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 209832, "titulo": "PMs envolvidos em morte de jovem atingido por 27 tiros são afastados em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/pms-envolvidos-em-morte-de-jovem-atingido-por-27-tiros-sao-afastados-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Polícias militares envolvidos em morte de jovem atingido por 27 tiros foram afastados em São Paulo. Segundo os agentes, eles teriam confundido o celular da vítima com uma arma de fogo. O incidente ocorreu na madrugada deste sábado na zona Sul da capital.", "titulo_pt": "Pms envolvidos em morte de jovem atingido por 27 tiros são afastados em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209800, "titulo": "Policiais militares são afastados após matar jovem com 27 tiros em SP", "url": "https://www.metropoles.com/sao-paulo/policiais-militares-sao-afastados-apos-matar-jovem-com-27-tiros-em-sp", "fonte_id": "metropoles", "data_pub": "2026-10-11T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pelo menos quatro policiais militares foram afastados após uma ação que resultou na morte de um jovem com 27 tiros. Os policiais teriam confundido um celular com uma arma.", "titulo_pt": "Policiais militares são afastados após matar jovem com 27 tiros em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209803, "titulo": "Despedida de PMs mortos em queda de avião em MG é marcada por forte comoção", "url": "https://www.metropoles.com/minas-gerais/despedida-de-pms-mortos-em-queda-de-aviao-em-mg-e-marcada-por-forte-comocao", "fonte_id": "metropoles", "data_pub": "2026-10-11T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Familiares, amigos e autoridades, incluindo o governador Mateus Simões, realizaram as últimas homenagens aos três policiais militares mortos em uma queda de avião em Belo Horizonte.", "titulo_pt": "Despedida de PMs mortos em queda de avião em MG é marcada por forte comoção", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 210157, "titulo": "Enchente e deslizamento no Nepal deixam mais de 100 estrangeiros ilhados", "url": "https://www.metropoles.com/mundo/enchente-e-deslizamento-no-nepal-deixam-mais-de-100-estrangeiros-ilhados", "fonte_id": "metropoles", "data_pub": "2026-10-12T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de socorro no Nepal resgataram 96 pessoas, das quais nove eram estrangeiras, e autoridades pediram a evacuação de áreas de risco devido a enchente e deslizamento de terra. Até o momento, mais de 100 estrangeiros estão ilhados.", "titulo_pt": "Enchente e deslizamento deixam mais de 100 estrangeiros ilhados no Nepal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210472, "titulo": "Tens of thousands march in Brussels demanding urgent climate action", "url": "https://www.euronews.com/video/2026/10/12/tens-of-thousands-march-in-brussels-demanding-urgent-climate-action", "fonte_id": "euronews", "data_pub": "2026-10-12T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de milhares de pessoas marcharam por Bruxelas no domingo, 11 de outubro, exigindo ações mais rápidas sobre o clima antes da COP31, que ocorrerá em Antalya, Turquia, no mês seguinte.", "titulo_pt": "Centenas de milhares marcham em bruxelas exigindo ação climática urgente", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 210215, "titulo": "O que sabemos sobre incêndios que atingem mais de 30 cidades do Amazonas", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/o-que-sabemos-sobre-incendios-que-atingem-mais-de-30-cidades-do-amazonas/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T07:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Amazonas registrou um aumento de 271% nos focos de incêndio nos dez primeiros dias de outubro de 2025, com 1.380 ocorrências registradas, contra 372 no mesmo período do ano anterior.", "titulo_pt": "O que sabemos sobre incêndios que atingem mais de 30 cidades do Amazonas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210593, "titulo": "Singapore tops global air pollution ranks again, rolls out haze subsidies", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3370563/singapore-tops-global-air-pollution-ranks-again-rolls-out-haze-subsidies?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Singapura foi novamente classificada como a cidade mais poluída do mundo de acordo com o monitor de qualidade do ar da Suíça, IQAir, devido às fogueiras nas ilhas de Borneo e Sumatra, intensificadas pelo fenômeno El Niño. A cidade fez subsídios para tratamentos médicos relacionados à névoa tóxica e fechou algumas escolas em áreas vizinhas da Malásia, enquanto ambos os países lidam com a qualidade do ar persistente e insaudável devido aos incêndios na Indonésia.", "titulo_pt": "Singapura é novamente a cidade mais poluída do mundo por causa da névoa tóxica", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210175, "titulo": "Brasil sob extremos: chuvas de até 300 mm e inundações ameaçam o Centro-Sul", "url": "https://www.metropoles.com/brasil/brasil-sob-extremos-chuvas-de-ate-300-mm-e-inundacoes-ameacam-o-centro-sul", "fonte_id": "metropoles", "data_pub": "2026-10-12T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As áreas de instabilidade se estendem por pelo menos cinco estados do Centro-Sul do Brasil nos próximos 10 dias, levando a chuvas intensas e inundações.", "titulo_pt": "Brasil sob extremos: chuvas de até 300 mm e inundações ameaçam o Centro-Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210561, "titulo": "Five people missing after Nepal flash floods sweep away houses", "url": "https://www.japantimes.co.jp/news/2026/10/12/asia-pacific/nepal-new-flash-floods/", "fonte_id": "japan_times", "data_pub": "2026-10-12T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns 45 casas foram levadas pelas águas, além de três projetos hidrelétricos e quatro pontes que sofreram danos. Cinco pessoas estão desaparecidas após inundações repentinas em Nepal.", "titulo_pt": "Cinco pessoas desaparecidas após inundações em Nepal arruinar casas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 209777, "titulo": "Governo reconhece estado de emergência em 36 cidades do Amazonas por avanço de incêndios", "url": "https://veja.abril.com.br/brasil/governo-reconhece-estado-de-emergencia-em-36-cidades-do-amazonas-por-avanco-de-incendios/", "fonte_id": "veja", "data_pub": "2026-10-11T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo reconheceu um estado de emergência em 36 cidades do Amazonas devido ao avanço de incêndios. Desde o início da estiagem, em julho, foram extintos 229 focos de incêndio nas florestas do estado.", "titulo_pt": "Governo declara estado de emergência em 36 cidades do Amazonas por causa de incêndios", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209805, "titulo": "FAB envia reforço aéreo para combater queimadas no Amazonas", "url": "https://www.metropoles.com/brasil/fab-envia-reforco-aereo-para-combater-queimadas-no-amazonas", "fonte_id": "metropoles", "data_pub": "2026-10-11T20:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Força Aérea Brasileira (FAB) enviou reforço aéreo para combater as queimadas no Amazonas. A qualidade do ar na capital e em cinco outros municípios do estado está sendo afetada negativamente pelos incêndios florestais.", "titulo_pt": "FAB envia reforço aéreo para combater queimadas no Amazonas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209241, "titulo": "ONU alerta para os riscos do calor extremo à saúde na gravidez", "url": "https://www.metropoles.com/saude/onu-alerta-para-os-riscos-do-calor-extremo-a-saude-na-gravidez", "fonte_id": "metropoles", "data_pub": "2026-10-11T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) alerta para os riscos do calor extremo à saúde das gestantes, associando altas temperaturas a partos prematuros e complicações. A ONU enfatiza a necessidade de proteger as gestantes nos planos climáticos atuais.", "titulo_pt": "ONU alerta para os riscos do calor extremo à saúde na gravidez", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209300, "titulo": "Mark Ruffalo compró más de 20 hectáreas en Nueva York para frenar el “fracking” y creó un santuario agrícola sostenible", "url": "https://www.lanacion.com.ar/espectaculos/mark-ruffalo-compro-mas-de-20-hectareas-en-nueva-york-para-frenar-el-fracking-y-creo-un-santuario-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ator Mark Ruffalo adquiriu mais de 20 hectares de terra nas montanhas Catskill, em Nova York, após conhecer os planos de exploração do fracking na região. Ele transformou a propriedade em um santuário agrícola sostenível, instalando paneleiros solares e sistemas de cultivo orgânico para demonstrar a viabilidade das energias renováveis.", "titulo_pt": "Mark Ruffalo compra mais de 20 hectares em nova York para frear o fracking e criar um santuário agrícola sustentável", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209222, "titulo": "Focos de incêndio no Amazonas sobem 271% nos primeiros dias de outubro", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/focos-de-incendio-no-amazonas-sobem-271-nos-primeiros-dias-de-outubro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de focos de incêndio no Amazonas aumentou 271% nos primeiros dias de outubro em comparação com o mesmo período do ano anterior. Foram registrados 1.380 focos nos primeiros dez dias deste mês, contra 372 no mesmo período do ano passado.", "titulo_pt": "Focos de incêndio no Amazonas sobem 271% nos primeiros dias de outubro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209818, "titulo": "Amazonas tem 36 cidades em emergência por incêndios: ‘mais grave do que eu imaginava’, diz ministro", "url": "https://exame.com/esg/amazonas-tem-36-cidades-em-emergencia-por-incendios-mais-grave-do-que-eu-imaginava-diz-ministro/", "fonte_id": "exame", "data_pub": "2026-10-11T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Amazonas está em emergência devido a 36 cidades afetadas por incêndios. O ministro João Paulo Capobianco considera a situação mais grave do que imaginava, criticando ações que ele acredita serem criminosas contra a mata preservada.", "titulo_pt": "Amazonas tem 36 cidades em emergência por incêndios: 'mais grave do que eu imaginava', diz ministro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 209690, "titulo": "Hurricane Simon strengthens as it nears western Mexico", "url": "https://phys.org/news/2026-10-hurricane-simon-nears-western-mexico.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Simon fortaleceu e se tornou um poderoso furacão da Categoria 4 e estava previsto para tocar terra ou passar pela costa do México central ou oeste no domingo, conforme informado pelo Centro Nacional de Furacões dos Estados Unidos.", "titulo_pt": "Furacão Simon fortalece e se dirige para o México", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209195, "titulo": "Deslizamento de terra bloqueia rio e causa nova enchente no Nepal", "url": "https://exame.com/mundo/deslizamento-de-terra-bloqueia-rio-e-causa-nova-enchente-no-nepal/", "fonte_id": "exame", "data_pub": "2026-10-11T11:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deslizamento de terra bloqueou um rio no Nepal, causando uma nova enchente. Não há relatos de mortos ou feridos, mas cinco pessoas estão desaparecidas.", "titulo_pt": "Deslizamento de terra bloqueia rio e causa nova enchente no Nepal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 208725, "titulo": "Sistema frontal llega este domingo: advierten que suelos saturados podrían favorecer emergencias en sectores precordilleranos de la RM", "url": "https://www.latercera.com/nacional/noticia/sistema-frontal-llega-este-domingo-advierten-que-suelos-saturados-podrian-favorecer-emergencias-en-sectores-precordilleranos-de-la-rm/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T07:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Sistema Frontal chega na Região Metropolitana do Chile neste domingo, com alerta amarelo para toda a região e alerta vermelho para dez comunas por risco de deslizamento de terra.", "titulo_pt": "Sistema frontal chega neste domingo: senapred mantém alerta amarela para RM e vermelha por risco de deslizamento em dez comunas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 208885, "titulo": "Four dead as Isaias continues to push across the Southeast US, bringing strong winds and heavy rain", "url": "https://www.euronews.com/2026/10/11/four-dead-as-isaias-continues-to-push-across-the-southeast-us-bringing-strong-winds-and-he", "fonte_id": "euronews", "data_pub": "2026-10-11T07:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Isaias atingiu a cidade de Destin, na Florida Panhandle, como um furacão da categoria 2 na sexta-feira à noite. O sistema tem continuado a se mover pela região sudeste dos Estados Unidos, causando fortes ventos e chuva intensa, deixando quatro mortos.", "titulo_pt": "Quatro mortos enquanto Isaias avança pelo sudeste dos EUA, trazendo ventos fortes e chuva intensa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 210142, "titulo": "Por que pena de morte persiste nos Estados Unidos? Americanos apoiam", "url": "https://veja.abril.com.br/coluna/mundialista/por-que-pena-de-morte-persiste-nos-estados-unidos-americanos-apoiam/", "fonte_id": "veja", "data_pub": "2026-10-12T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os casos de Christa Pike e Nidal Hasan têm agitado a discussão sobre a pena de morte nos Estados Unidos, mas a maioria da população ainda apoia essa prática.", "titulo_pt": "Por que a pena de morte persiste nos Estados Unidos? Americanos apoiam", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 210551, "titulo": "UNRWA warns Gaza is becoming an increasingly unlivable place", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/unrwa-health-chief-gaza/", "fonte_id": "japan_times", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O UNRWA alerta que Gaza enfrenta persistentes escassezes de suprimentos médicos devido a restrições nas entregas. As condições de higiene também permanecem ruins.", "titulo_pt": "UNRWA avisa que Gaza está se tornando um lugar cada vez menos habitável", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 210704, "titulo": "Statement by Etleva Kadilli, UNICEF Regional Director for Eastern and Southern Africa, on the tragic loss of lives, including at least 15 children, after migrant boat capsized off the coast of Djibouti", "url": "https://www.unicef.org/press-releases/statement-etleva-kadilli-unicef-regional-director-eastern-and-southern-africa-tragic", "fonte_id": "unicef", "data_pub": "2026-10-12T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora regional da UNICEF para a África Oriental e do Sul do África, Etleva Kadilli, emitiu uma declaração sobre a tragédia da capotagem de uma embarcação de migrantes perto da costa do Djibouti, que resultou em pelo menos 15 mortes, incluindo crianças.", "titulo_pt": "Declaração da diretora Regional da UNICEF para a áfrica oriental e do sul do áfrica sobre a tragédia marítima que resultou em pelo menos 15 mortes, incluindo crianças, perto da costa do Djibouti", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 210473, "titulo": "Opposition figures and journalists allege police abuses during India protests", "url": "https://www.euronews.com/2026/10/12/opposition-figures-and-journalists-allege-police-abuses-during-india-protests", "fonte_id": "euronews", "data_pub": "2026-10-12T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Figuras da oposição e jornalistas acusam a polícia de abusos durante protestos em India. Os protestos foram iniciados por acusações de manipulação de listas eleitorais durante uma revisão nacional que os críticos alegam beneficiar o Partido Bharatiya Janata, do primeiro-ministro Narendra Modi.", "titulo_pt": "Figuras da oposição e jornalistas acusam abusos policiais durante protestos em India", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 210617, "titulo": "‘Bring an interpreter’: Migrant workers struggle to seek justice", "url": "https://www.koreaherald.com/article/10899819", "fonte_id": "korea_herald", "data_pub": "2026-10-12T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Migrantes enfrentam dificuldades por causa de barreiras linguísticas em escritórios de trabalho, impedindo-os de apresentar reclamações ou acompanhar seus casos. Alguns trabalhadores aguardam anos para receber respostas.", "titulo_pt": "Leve um intérprete: trabalhadores migrantes lutam para buscar justiça", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 210603, "titulo": "‘Just a little spark’: disability advocate on inclusion, belonging in Hong Kong", "url": "https://www.scmp.com/news/hong-kong/society/article/3370532/just-little-spark-disability-advocate-inclusion-belonging-hong-kong?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T03:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Faride Shroff, uma advogada de pessoas com deficiência, afirma que a maior conscientização sobre deficiência em Hong Kong não necessariamente facilitou o emprego para pessoas com deficiência. Ela destaca que orçamentos corporativos mais apertados e um mercado de trabalho difícil tornam a inclusão adicional mais desafiadora.", "titulo_pt": "Apenas um pequeno fósforo: defensora de pessoas com deficiência sobre inclusão e pertencimento em Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210429, "titulo": "'We are still in the Middle Ages': Women on sexual violence in e-sports", "url": "https://www.lemonde.fr/en/pixels/article/2026/10/12/we-are-still-in-the-middle-ages-women-on-sexual-violence-in-e-sports_6758495_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-12T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma streamer e comentadora famosa de League of Legends foi acusada de estupro em julho. O caso ilustra o problema de violência sexual no e-sports, um setor dominado por homens em que as vozes das mulheres frequentemente são ignoradas.", "titulo_pt": "Somos ainda da idade média: mulheres sobre violência sexual no e-sports", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 210571, "titulo": "Anti-sexual assault certification set for Japan’s cram schools", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/society/cram-schools-anti-sexual-assault-certification/", "fonte_id": "japan_times", "data_pub": "2026-10-12T02:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As escolas de preparação para exames no Japão estão prestes a implementar um certificado contra assédio sexual. A medida será lançada no dia 25 de dezembro, em uma versão adaptada do Serviço de Declaração e Exclusão do Reino Unido.", "titulo_pt": "Certificado contra assédio sexual para escolas de preparação no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 209914, "titulo": "Claudia, salvadoreña con TPS en Houston: “No puedo transmitirles mi miedo”", "url": "https://www.lanacion.com.ar/estados-unidos/texas/claudia-salvadorena-con-tps-en-houston-no-puedo-transmitirles-mi-miedo-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T21:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Claudia, uma salvadorenha com TPS em Houston, tem medo de se separar de suas três filhas americanas e considera a possibilidade de deixar o país se perder sua proteção migratória.", "titulo_pt": "Claudia, salvadorenha com TPS em Houston: ‘não posso transmitir-lhes meu medo’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209934, "titulo": "Los cubanos recurren a las farmacias comunitarias y gratuitas para sobrellevar la escasez de medicamentos", "url": "https://www.clarin.com/mundo/cubanos-recurren-farmacias-comunitarias-gratuitas-sobrellevar-escasez-medicamentos_0_onnZkdMtp6.html", "fonte_id": "clarin", "data_pub": "2026-10-11T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As farmácias estatais cubanas possuem apenas um terço dos medicamentos do quadro básico de saúde pública. A falta de matérias-primas importadas levou a laboratórios estatais, como BioCubafarma, a suspender a produção de vários fármacos.", "titulo_pt": "Os cubanos recorrem às farmácias comunitárias e gratuitas para enfrentar a escassez de medicamentos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 209918, "titulo": "150.000 inmigrantes en un limbo en Florida tras el fin del TPS y sin opción por miedo al ICE y sus redadas", "url": "https://www.lanacion.com.ar/estados-unidos/florida/150000-inmigrantes-en-un-limbo-en-florida-tras-el-fin-del-tps-y-sin-opcion-por-miedo-al-ice-y-sus-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T20:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 150 mil imigrantes estão em situação precária na Flórida após o fim do TPS, enfrentando o risco de deportação e evitando saídas para não serem encontrados pela ICE, o que pode resultar em perda de emprego. Familias do sul do estado estão reduzindo suas atividades externas devido ao medo de serem deportadas para países violentos.", "titulo_pt": "150 Mil imigrantes em situação precária na flórida após fim do TPS", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209959, "titulo": "Muerte de Aliste Vega reabre debate por indultos: de exigir “celeridad” en tramitación a advertir límites por lesa humanidad", "url": "https://www.latercera.com/politica/noticia/muerte-de-aliste-vega-reabre-debate-por-indultos-de-exigir-celeridad-en-tramitacion-a-advertir-limites-por-lesa-humanidad/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T19:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Partido Republicano pressionou pela aceleração dos indultos para pessoas com doenças terminais, enquanto Lautaro Carmona advertiu sobre a não extensão dessa discussão para condenados por crimes contra a humanidade. Ximena Ossandón chamou para uma avaliação individual de cada caso.", "titulo_pt": "Morte de Aliste Vega renova debate sobre indultos: aceleração para doentes terminais, mas limites para crimes contra a humanidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 209872, "titulo": "'Eu simplesmente aguentei': o abuso sexual de pessoas com deficiências que abalou a Coreia do Sul", "url": "https://www.bbc.com/portuguese/articles/c5pvg2309g8vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-11T18:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatos de abuso sexual em uma residência assistida para pessoas com deficiência intelectual na Coreia do Sul causaram choque no país e levantaram questionamentos sobre o atendimento às pessoas com deficiência pelo governo. A BBC conversou com uma das vítimas.", "titulo_pt": "Eu simplesmente aguentei': o abuso sexual de pessoas com deficiências que abalou a Coreia do Sul", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 209355, "titulo": "Casi 200 carabineros terminan curso de formación en DD.HH. en la Facultad de Derecho de la U. de Chile", "url": "https://www.latercera.com/nacional/noticia/casi-200-carabineros-terminan-curso-de-formacion-en-ddhh-en-la-facultad-de-derecho-de-la-u-de-chile/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T17:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O curso de formação em direitos humanos foi concluído por aproximadamente 200 carabineros que atuam diretamente com pessoas em situação de vulnerabilidade. O programa foi direcionado a servidores cujas funções envolvem assistência a indivíduos e grupos em situação de vulnerabilidade.", "titulo_pt": "Quase 200 carabineros concluem curso de formação em direitos humanos na faculdade de direito da usp", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 209220, "titulo": "Índia: Líderes do “movimento das baratas” são soltos, mas prisões continuam", "url": "https://www.cnnbrasil.com.br/internacional/india-lideres-do-movimento-das-baratas-sao-soltos-mas-prisoes-continuam/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tribunal ordenou a libertação dos líderes do grupo conhecido como 'movimento das baratas', que tem grande apoio entre a geração Z, sob a condição de manter a ordem pública. No entanto, prisões continuam.", "titulo_pt": "Índia: líderes do 'movimento das baratas' são soltos, mas prisões continuam", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209547, "titulo": "At least 139 migrants dead after boat capsizes off Djibouti, UN says", "url": "https://www.euronews.com/2026/10/11/at-least-139-migrants-dead-after-boat-capsizes-off-djibouti-un-says", "fonte_id": "euronews", "data_pub": "2026-10-11T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 139 migrantes morreram após uma embarcação afundar perto de Djibouti, conforme informou a OIM. Anualmente, milhares de migrantes viaj            const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const d = D.destaque;

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

    </div>` : ""}
  </div>`;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
