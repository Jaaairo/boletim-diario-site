y-43-reprueba-la-gestion-del-gobierno-frente-a-la-movilizacion/", "fonte_id": "la_tercera", "data_pub": "2026-11-16T00:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mostrou que 79% dos chilenos aprovaram o paro dos camionistas, enquanto 43% desaprovaram a gestão do governo em relação à movilização. A maioria (84%) também acredita que o governo deveria ter intervido antes das manifestações chegarem às estradas. Entre as medidas populares, estão a redução do diesel e o congelamento dos combustíveis até março de 2027.", "titulo_pt": "Cadem: 79% aprovam paralisação de caminhoneiros e 43% desaprovam gestão governamental", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 265882, "titulo": "EDITORIAL: Vote for the life you want", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/11/16/2003867795", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O editorial incentiva os leitores a votar para alcançar a vida que desejam. Ele sugere que o voto pode ser uma ferramenta para moldar o futuro pessoal e coletivo.", "titulo_pt": "Vote pelo estilo de vida que deseja", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 266171, "titulo": "“Empresarios sin vergüenza”: temor en Lanús y fuertes consignas en una nueva protesta tras la explosión con un muerto", "url": "https://www.lanacion.com.ar/sociedad/los-vecinos-de-lanus-alertan-por-una-nueva-fuga-de-gas-en-la-zona-de-la-explosion-y-el-municipio-y-nid15112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-15T21:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Desde o viernes, há preocupação em relação a uma explosão em Lanús que resultou em um morto, vários feridos e danos materiais. Autoridades e a distribuidora foram descartados após verificações rigorosas.", "titulo_pt": "Empresários sem vergonha: medo em Lanús e fortes consignas em nova protesta após explosão com um morto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 266173, "titulo": "Lanús se presenta ante la Justicia contra Metrogas: “Es evidente el incumplimiento de los protocolos de emergencias”", "url": "https://www.lanacion.com.ar/sociedad/lanus-se-presenta-ante-la-justicia-contra-metrogas-es-evidente-el-incumplimiento-de-los-protocolos-nid15112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-15T21:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O município de Lanús apresentou uma queixa à justiça contra a empresa Metrogas, alegando incumprimento dos protocolos de emergência. Os moradores relatam ocorrências de vazamentos de gás, mas até o momento não foram confirmados relatos relacionados à explosão ocorrida no últimoFriday. As pessoas que residem na área afetada ainda não podem retornar às suas casas.", "titulo_pt": "Lanús apresenta queixa contra Metrogas por incumprimento de protocolos de emergência", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 266062, "titulo": "Policial militar morre após ser baleado durante patrulhamento em Salvador", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ba/policial-militar-morre-apos-ser-baleado-durante-patrulhamento-em-salvador/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial militar identificado como Marco Antônio Ramos da Silva foi morto após ser baleado na cabeça durante uma ação de policiamento no bairro de Nova Brasília, em Salvador.", "titulo_pt": "Policial militar morre após ser baleado durante patrulhamento em Salvador", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266127, "titulo": "Homem esfaqueia companheira e genro após briga por uso de drogas em SP", "url": "https://www.metropoles.com/sao-paulo/homem-esfaqueia-companheira-e-genro-apos-briga-por-uso-de-drogas-em-sp", "fonte_id": "metropoles", "data_pub": "2026-11-15T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um pintor esfaqueou sua companheira e seu genro após uma briga relacionada ao uso de drogas em São Paulo. O incidente ocorreu em duas etapas: primeiro, houve uma briga à noite, e na manhã seguinte, os ferimentos mais graves foram registrados.", "titulo_pt": "Homem esfaqueia companheira e genro após briga por uso de drogas em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 266448, "titulo": "Brasil cria saída para exportar à UE após nova lei antidesmatamento", "url": "https://www.metropoles.com/brasil/brasil-cria-saida-para-exportar-a-ue-apos-nova-lei-antidesmatamento", "fonte_id": "metropoles", "data_pub": "2026-11-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova lei antidesmatamento da União Europeia entrará em vigor em pouco mais de um mês e pode afetar as exportações brasileiras. O Brasil está buscando soluções para se adaptar às novas regras.", "titulo_pt": "Brasil encontra saída para exportar à UE após nova lei antidesmatamento", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 266795, "titulo": "More than 2,000 migrants arrive in Spain’s Canary Islands in two days", "url": "https://www.euronews.com/video/2026/11/16/more-than-2000-migrants-arrive-in-spains-canary-islands-in-two-days", "fonte_id": "euronews", "data_pub": "2026-11-16T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 2.200 migrantes chegaram às Ilhas Canárias da Espanha em dois dias, com equipes de resgate auxiliando barcos cheios perto da Ilha de El Hierro.", "titulo_pt": "Mais de 2.200 migrantes chegam às ilhas canárias da Espanha em dois dias", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 266889, "titulo": "Push to electrify global economy stalls at U.N. climate talks", "url": "https://www.japantimes.co.jp/environment/2026/11/16/energy/electrify-global-economy-climate-talks/", "fonte_id": "japan_times", "data_pub": "2026-11-16T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vinte e quatro nações não apoiam a reconhecimento do compromisso de aumentar a participação da eletricidade no consumo final de energia global para 35% até 2035.", "titulo_pt": "Esforço para eletrificar economia global estagnado nas negociações climáticas da ONU", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 266922, "titulo": "‘Zombie fish’ found in Thailand raise fears of heavy metals in Mekong River", "url": "https://www.scmp.com/week-asia/health-environment/article/3374563/zombie-fish-found-thailand-raise-fears-heavy-metals-mekong-river", "fonte_id": "scmp", "data_pub": "2026-11-16T07:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pescadores na Tailândia relataram a ocorrência de peixes com lesões incomuns, crescimentos estranhos e finos descoloridos, conhecidos localmente como 'peixes-zumbi'. Esses relatos levantaram preocupações de que mineração nas proximidades estaria poluindo o rio Mekong com metais pesados como arsênico.", "titulo_pt": "Peixes-zumbi encontrados na tailândia causam preocupação com metais pesados no rio Mekong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 266611, "titulo": "Incêndio atinge edifício com moradias e comércio e mata 11 pessoas na Tailândia", "url": "https://exame.com/mundo/incendio-atinge-edificio-com-moradias-e-comercio-e-mata-11-pessoas-na-tailandia/", "fonte_id": "exame", "data_pub": "2026-11-16T06:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu um edifício que abrigava moradias e comércio em Tailândia, resultando em 11 mortes. A suspeita inicial é de que o incêndio tenha sido causado por um curto-circuito em um poste.", "titulo_pt": "Incêndio mata 11 pessoas em edifício com moradias e comércio na Tailândia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 266038, "titulo": "Em viagem ao Peru, papa Leão visita cidade amazônica ameaçada por desmatamento", "url": "https://veja.abril.com.br/mundo/em-viagem-ao-peru-papa-leao-visita-cidade-amazonica-ameacada-por-desmatamento/", "fonte_id": "veja", "data_pub": "2026-11-15T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O papa Leão está em uma viagem de 12 dias pela América do Sul, visitando o Peru, Uruguai e Argentina. Durante esta viagem, ele está se deslocando por uma cidade amazônica ameaçada por desmatamento.", "titulo_pt": "Em viagem ao Peru, papa Leão visita cidade amazônica ameaçada por desmatamento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 266130, "titulo": "Na Amazônia, Leão 14 condena \"exploração irresponsável\" da floresta", "url": "https://www.dw.com/pt-br/na-amazônia-leão-14-condena-exploração-irresponsável-da-floresta/a-79953690?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-15T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco condenou a 'exploração irresponsável' da floresta amazônica, citando a produção de ouro e petróleo, e pediu esclarecimentos sobre os assassinatos de lideranças indígenas. A viagem do chefe do Vaticano ao Brasil causou alvoroço.", "titulo_pt": "No amazonas, francisco condena 'exploração irresponsável' da floresta", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 266040, "titulo": "A preocupação do setor de saúde com o projeto de ajuste fiscal", "url": "https://veja.abril.com.br/brasil/a-preocupacao-do-setor-de-saude-com-o-projeto-de-ajuste-fiscal/", "fonte_id": "veja", "data_pub": "2026-11-15T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Consenso apresentou uma manifestação ao Senado pedindo a derrubada de um artigo específico do projeto de ajuste fiscal.", "titulo_pt": "Preocupação do setor de saúde com projeto de ajuste fiscal", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 266072, "titulo": "Brasil deve registrar temperaturas acima de 30°C até o fim de novembro", "url": "https://www.cnnbrasil.com.br/nacional/brasil/brasil-deve-registrar-temperaturas-acima-de-30c-ate-o-fim-de-novembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T20:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A previsão indica que temperaturas acima de 30°C serão comuns até o final de novembro, especialmente nas regiões Norte, Nordeste e Centro-Oeste, apesar de possíveis chuvas.", "titulo_pt": "Brasil deve registrar temperaturas acima de 30°C até o fim de novembro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 265546, "titulo": "Como China finalmente reduziu emissão de poluentes e planeja 'revolução de energias renováveis'", "url": "https://www.bbc.com/portuguese/articles/ckpqgqq307xlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-15T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rápida expansão das energias renováveis fez com que as emissões de carbono da China parassem de aumentar. Cinco gráficos ilustram como o país alcançou este feito.", "titulo_pt": "Como China conseguiu parar o crescimento das emissões de carbono e planeja uma 'revolução de energias renováveis'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 265637, "titulo": "DPR de Atacama advierte aumento del caudal del río en Alto del Carmen y llaman a vecinos a abandonar zonas de riesgo", "url": "https://www.latercera.com/nacional/noticia/dpr-de-atacama-advierte-aumento-del-caudal-del-rio-en-alto-del-carmen-y-llaman-a-vecinos-a-abandonar-zonas-de-riesgo/", "fonte_id": "la_tercera", "data_pub": "2026-11-15T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A delegada presidencial de Atacama, Sofía Cid, alertou para o aumento do nível da água devido a deshielos. A polícia, a polícia civil e o exército foram deslocados para o badén La Vega para coordenar apoio às famílias.", "titulo_pt": "Delegada de Atacama avisa aumento do nível da água e solicita evacuação de áreas de risco", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 265567, "titulo": "Irã diz que afundou supernavio com 2 milhões de barris de petróleo", "url": "https://www.dw.com/pt-br/irã-diz-que-afundou-supernavio-com-2-milhões-de-barris-de-petróleo/a-79952899?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-15T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã afirmou que afundou um supernavio com 2 milhões de barris de petróleo. A embarcação teria atingido uma mina e explodido ao navegar sem autorização pelo Estreito de Ormuz, uma hidrovia estratégica central na guerra com os Estados Unidos.", "titulo_pt": "Irã afirma ter afundado supernavio com 2 milhões de barris de petróleo no estreito de Ormuz", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 265441, "titulo": "Canadá anuncia aporte bilionário em fundo de proteção a florestas após reunião com Lula", "url": "https://veja.abril.com.br/politica/canada-anuncia-aporte-bilionario-em-fundo-de-protecao-a-florestas-apos-reuniao-com-lula/", "fonte_id": "veja", "data_pub": "2026-11-15T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Canadá comprometeu-se a fornecer 400 milhões de dólares (aproximadamente R$ 2,26 bilhões) ao Fundo de Proteção de Florestas ao longo de quatro anos. Além disso, líderes canadenses e brasileiros discutiram um acordo entre Mercosul e Canadá durante a reunião com o presidente Lula.", "titulo_pt": "Canadá anuncia aporte bilionário em fundo de proteção a florestas após reunião com Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 265564, "titulo": "Fundo para florestas tropicais recebe US$ 400 milhões do Canadá e se aproxima de meta", "url": "https://www.jota.info/coberturas-especiais/matriz/fundo-para-florestas-tropicais-recebe-us-400-milhoes-do-canada-e-se-aproxima-de-meta", "fonte_id": "jota", "data_pub": "2026-11-15T12:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fundo para Florestas Tropicais recebeu US$ 400 milhões do Canadá. Este é o segundo aporte desde o resultado do segundo turno das eleições no Brasil.", "titulo_pt": "Fundo para florestas tropicais recebe US$ 400 milhões do Canadá e se aproxima de meta", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 265926, "titulo": "Fire breaks out at underground bus transit center in Seoul's Jamsil", "url": "https://www.koreaherald.com/article/10937751", "fonte_id": "korea_herald", "data_pub": "2026-11-15T12:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu em um centro de transferência de ônibus subterrâneo em Jamsil, Songpa-gu, sul-leste de Seul, por volta das 19h12 no domingo. Os bombeiros controlaram o fogo em cerca de 29 minutos sem registrar feridos.", "titulo_pt": "Incêndio atinge centro de transferência de ônibus subterrâneo em seul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265928, "titulo": "More foreigners seek health screenings in South Korea", "url": "https://www.koreaherald.com/article/10937739", "fonte_id": "korea_herald", "data_pub": "2026-11-15T11:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de estrangeiros que buscam exames de saúde em South Korea tem aumentado, com 65.228 pacientes estrangeiros realizando esses exames no país no ano passado, um crescimento de 17% em comparação com o ano anterior. Esse aumento parece estar se mantendo neste ano.", "titulo_pt": "Mais estrangeiros buscam exames de saúde em South Korea", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 266568, "titulo": "El debate que toma fuerza en un condado latino de Florida: dejar al ICE fuera de cualquier             </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
