<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 02/11/2026 15:20 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>

    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "02/11/2026 15:20", "stats": {"noticias_novas": 877, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A reeleição de Luiz Inácio Lula da Silva como presidente do Brasil pode marcar um novo período de governo focado em avanços constitucionais, segundo análise do Jota. Nesse cenário, o Congresso brasileiro terá um recorde de mulheres em 2027, apesar de o aumento ser liderado pela direita, conforme informa a DW Brasil. A defesa de Daniel Vorcaro, dono do Banco Master, acionou a Comissão Interamericana de Direitos Humanos e aguarda uma audiência no STF para tentar reverter sua prisão preventiva. Outro desenvolvimento importante é que a Unesco registrou 189 jornalistas mortos no mundo em 2024 e 2025, o maior número de mortes desde 2014/2015, o que destaca a importância da proteção dos jornalistas no Brasil e no mundo.", "mundo": "As eleições médias de 2026 nos Estados Unidos estão sendo focalizadas, com o Partido Democrata buscando ampliar sua maioria no Congresso. O ex-presidente Joe Biden e o Partido Democrata apresentaram casos importantes, como o questionamento de 20.000 votos em California no Supremo Tribunal, enquanto a popularidade de candidatos do DSA representa um desafio para o Partido Democrata. Além disso, pesquisas indicam uma vantagem dos democratas, mas a incerteza persiste devido à presença de eleitores indecisos. Em outros assuntos internacionais, o Irã e os Estados Unidos continuam em negociações intensas para evitar novos conflitos, enquanto o presidente ucraniano Volodymyr Zelensky relatou um ataque devastador em Komysuhvakha, resultando em 18 mortos. O Brasil também está em destaque, com o presidente Lula iniciando sua sucessão política, e a Grécia anunciando a compra de aviões de transporte da Embraer, fortalecendo a posição da aeronave no mercado europeu.\n\nAs tensões geopolíticas continuam a dominar o cenário internacional. De acordo com um oficial do Serviço de Informações da Região Administrativa Especial de Macau, o governo chinês planeja intensificar suas ações agressivas. Em um desenvolvimento relacionado, o Irã pode reabrir o Estreito de Ormuz em dois dias, se as condições estabelecidas pelos Estados Unidos forem atendidas, conforme informou o porta-voz do ministério das Relações Exteriores do Irã, Esmaeil Baghaei. Por outro lado, o Japão está considerando aumentar seu orçamento de defesa em cerca de 50% nos próximos cinco anos, parte de uma iniciativa da primeira-ministra Sanae Takaichi para fortalecer as capacidades militares do país. Essas ações refletem o crescente protagonismo de países como China, Irã e Japão no cenário geopolítico global.", "economia": "Os mercados financeiros internacionais enfrentam diversos desafios e oportunidades, conforme evidenciado pelos principais eventos recentes. De acordo com uma pesquisa, a confiança pública nos serviços financeiros da Taiwan atingiu 64,1%. Em outro desenvolvimento, a Anthropic divulgou seu prospecto S-1, informando uma receita de US$ 17 bilhões no terceiro trimestre e compromissos de compra revisados em US$ 895,4 bilhões. O preço do petróleo caiu mais de 7% devido às esperanças de que as negociações diplomáticas entre Estados Unidos e Irã possam avançar, afetando diretamente os custos de importação e os preços dos combustíveis nos Estados Unidos. A Embraer firmou um acordo com a Grécia para a venda de três KC-390, enquanto o Banco Central da China anunciou uma nova rodada de uma ferramenta de troca para injetar cerca de 15 bilhões de dólares nos mercados acionários onshore, após a maior venda-livre em mais de uma década. Esses eventos refletem a complexidade do cenário econômico global, marcado por incertezas políticas e econômicas, mas também por oportunidades de crescimento e inovação.", "tecnologia": "Um ataque cibernético recente afetou supermercados em sete países europeus, incluindo Bélgica, Luxemburgo, Suécia e Estônia, elevando as temperaturas nos freezers para até 55°C, resultando em perda de alimentos. A Anthropic, uma empresa de inteligência artificial, anunciou compromissos de gastos de 90 bilhões de dólares antes de sua oferta inicial de ações (IPO), mas os custos de infraestrutura do seu principal produto, o Claude, estão aumentando mais rapidamente do que as receitas. A Marvell Technology anunciou a aquisição da Lumentum por 115 bilhões de dólares em ações e dívidas, visando fortalecer sua posição no mercado de data centers para inteligência artificial. Além disso, a startup Raras Health usa inteligência artificial para acelerar o diagnóstico de doenças raras e já faturou 20 milhões de reais, enquanto a startup chinesa Easy-Logic Technology foi adquirida pela Empyrean Technology, reforçando a busca pelo autoabastecimento tecnológico e apoiando as ambições semicondutores da Huawei Technologies.", "ciencia": "Os cientistas desenvolveram um novo material semiconductor com propriedades promissoras para aplicações tecnológicas avançadas. Paralelamente, pesquisadores da Universidade de Cape Town nomearam os ninhos de terceiro-estado de formigas extintas após a cidade de Calitzdorp, no Little Karoo, destacando a conexão da comunidade local com o patrimônio fóssil da região. O microsatélite ERMIS-3 estabeleceu com sucesso uma conexão laser com uma estação terrestre óptica, um passo importante para a validação das comunicações ópticas em satélites pequenos. Além disso, a NASA está preparando o lançamento de uma nave Cygnus XL para transportar experimentos científicos, suprimentos e equipamentos para a Estação Espacial Internacional. Uma plataforma automatizada utiliza a síntese de proteínas celulares livres e o design guiado por inteligência artificial para otimizar a produção de enzimas, essenciais em diversos processos industriais. Além disso, um estudo importante explora como o entendimento incompleto pode impulsionar o progresso científico, mostrando que mesmo em áreas de conhecimento especializado, uma compreensão completa pode permanecer fora de alcance, incentivando a continuidade da pesquisa. A NASA está usando o telescópio Espacial James Webb para descobrir novas evidências sobre as origens do cometa 3I/ATLAS e sobre as condições de formação de planetas em sistemas estelares similares. Este estudo é crucial para a compreensão do universo e das origens do sistema solar. Além disso, a missão simulada a Marte, que encerrou um período de isolamento de um ano, auxiliou nos preparativos para uma futura viagem ao planeta vermelho.", "cultura": "A Real Academia Española (RAE) lançou a edição 'nativa digital' do Dicionário da Língua Espanhola, que inclui mais de seis mil novas entradas em comparação com a edição de 2014, marcando o fim de uma série de dicionários que começaram há 300 anos. No Brasil, o Rio de Janeiro lançou um álbum com sambas-enredo para o Carnaval de 2027, enquanto o festival gastronômico da Folha incluirá pratos mineiros como galinhada, leitoa com curau e pão de queijo com pastrami. Em outro destaque cultural, a exposição 'Crossings', de Laura Pannack, ganhou o primeiro prêmio Tom Stoddart de excelência em 2025, documentando o percurso escolar e seus desafios psicológicos e físicos para jovens na África do Sul. Além disso, a adaptação cinematográfica de 'Razão e Sensibilidade', dirigida por Georgia Oakley, traz uma abordagem jovial ao clássico romance de Jane Austen, equilibrando a crítica social com o romance juvenil.", "sociedade": "Clara Thaís, jovem cuja garganta foi cortada após a vitória de Lula, está apresentando melhoras, o que é uma notícia aliviante para a comunidade. Em um caso mais grave, um policial militar faleceu após ser arremessado de uma moto e atropelado por uma carreta, com o motorista preso. O caso do gato Perseo resultou no fortalecimento do estatuto jurídico que protege os animais, definindo que as mascotas são seres sintientes cujos interesses devem ser priorizados sobre os donos. Além disso, o governo planeja investir 645 bilhões de dólares em infraestrutura de saúde para 2027, com a expectativa de abrir três hospitais em 2028.", "meio_ambiente": "Um relatório da ONU alerta para danos irreversíveis do aquecimento global nas geleiras e banquisas, com riscos aumentados acima de 1,5ºC de aquecimento. A aviação, um dos maiores emissores de CO2, pode reduzir os impactos ambientais através de alterações nas rotas de voo e o uso de combustíveis sustentáveis. Delegados se encontrarão em Antalya para as negociações climáticas da COP31. O vórtice polar estratosférico pode desestabilizar-se antecipadamente, alterando os padrões climáticos na Europa e aumentando a probabilidade de condições mais frias. O Inmet emitiu alertas de perigo e de perigo potencial para diferentes regiões do Brasil durante o feriado de Finados, com previsão de chuvas e baixa umidade do ar.", "direitos_humanos": "Pelo menos sete migrantes morreram em um naufrágio enquanto tentavam chegar às Ilhas Canárias, refletindo as perigosas condições enfrentadas pelos imigrantes. Por outro lado, o Reino Unido implementou novas regras que obrigam parte dos migrantes a esperar 10 anos para obter o direito de residência, em uma série de medidas mais rigorosas adotadas pelo governo após um aumento súbito no número de chegadas de imigrantes. Em outro caso, uma mulher de 72 anos está sendo julgada em França por acusações de tortura fatais a sua filha de 4 anos nos anos 1980, em um processo que ocorre em Blois, com ativistas dos direitos da criança exigindo justiça. Além disso, uma petição pedindo o fechamento do canal CNews, frequentemente comparado ao Fox News dos EUA, já ultrapassou 500 mil assinaturas após um incidente racista, enquanto a missão de paz da ONU no Saara Ocidental chegou ao fim após uma disputa no Conselho de Segurança das Nações Unidas, deixando refugiados em um estado de incerteza."}, "resumo_do_dia": {"politica_nacional": [{"id": 240499, "titulo": "André Lara Resende quer conselho para levar Selic a 7,5%", "url": "https://www.poder360.com.br/poder-economia/andre-lara-resende-quer-conselho-para-levar-selic-a-75/", "fonte_id": "poder360", "data_pub": "2026-11-02T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Lara Resende sugere em um artigo que o Banco Central aumente gradualmente a Selic para um intervalo a ser definido em 12 meses. O economista propõe uma estratégia para alavancar a taxa básica da Selic para um novo nível.", "titulo_pt": "André Lara Resende quer conselho para levar Selic a 7,5%", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 240500, "titulo": "Entenda o que se sabe da queda de avião na Flórida", "url": "https://www.poder360.com.br/poder-internacional/entenda-o-que-se-sabe-da-queda-de-aviao-na-florida/", "fonte_id": "poder360", "data_pub": "2026-11-02T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um avião caiu no estado da Flórida no domingo, 1º de novembro, resultando na morte de todas as 9 pessoas a bordo.", "titulo_pt": "Entenda o que se sabe sobre a queda de avião na Flórida", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 240483, "titulo": "Como Alexandre de Moraes controla assuntos que podem mudar a cena política no país", "url": "https://veja.abril.com.br/politica/como-alexandre-de-moraes-controla-assuntos-que-podem-mudar-a-cena-politica-no-pais/", "fonte_id": "veja", "data_pub": "2026-11-02T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre de Moraes, ministro que é considerado adversário do bolsonarismo, é responsável por processos que envolvem a dosimetria de penas para condenados e as regras para acordos de delação premiada.", "titulo_pt": "Como Alexandre de Moraes controla assuntos que podem mudar a cena política no país", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 240572, "titulo": "Político que pede boicote devia abrir mão do salário, diz Cleitinho", "url": "https://www.cnnbrasil.com.br/politica/politico-que-pede-boicote-devia-abrir-mao-do-salario-diz-cleitinho/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador eleito de Minas Gerais criticou o movimento de boicote após a reeleição do presidente Lula. Cleitinho sugeriu que políticos que pedem boicote deveriam abrir mão do salário.", "titulo_pt": "Cleitinho diz que políticos que pedem boicote deviam abrir mão do salário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 240573, "titulo": "Fonteles enaltece equilíbrio fiscal em meio a racha no PT", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/fonteles-enaltece-equilibrio-fiscal-em-meio-a-racha-no-pt/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador do Piauí, cotado para assumir o Ministério da Fazenda, defende um equilíbrio fiscal, enquanto integrantes do partido PT apoiam uma proposta para reduzir os juros, gerando um racha no partido.", "titulo_pt": "Fontelles enaltece equilíbrio fiscal em meio a divisão no PT", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 240458, "titulo": "Defesa de Vorcaro recorre a comissão internacional e alega violações em prisão preventiva", "url": "https://www.cartacapital.com.br/justica/defesa-de-vorcaro-recorre-a-comissao-internacional-e-alega-violacoes-em-prisao-preventiva/", "fonte_id": "cartacapital", "data_pub": "2026-11-02T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-dono do Banco Master está detido há oito meses e foi indiciado pela Polícia Federal recentemente. A defesa dele recorreu a uma comissão internacional, alegando violações durante a prisão preventiva.", "titulo_pt": "Defesa de Vorcaro recorre a comissão internacional e alega violações em prisão preventiva", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 240521, "titulo": "Folga pós-eleições? Projeto prevê feriado após votação geral e municipal", "url": "https://www.metropoles.com/sao-paulo/folga-pos-eleicoes-projeto-preve-feriado-apos-votacao-geral-e-municipal", "fonte_id": "metropoles", "data_pub": "2026-11-02T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma deputada propôs um projeto que sugere o estabelecimento de um feriado após as eleições gerais e municipais para facilitar o retorno de eleitores que tenham viajado para votar.", "titulo_pt": "Feriado após eleições? Projeto prevê dia de folga para eleitores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 240589, "titulo": "Unesco: 189 jornalistas foram mortos no mundo em 2024 e 2025", "url": "https://www.brasildefato.com.br/2026/11/02/unesco-189-jornalistas-foram-mortos-no-mundo-em-2024-e-2025/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-02T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Unesco registrou 189 jornalistas mortos no mundo em 2024 e 2025, o maior número de mortes desde 2014/2015, quando foram observadas 215 ocorrências.", "titulo_pt": "Unesco: 189 jornalistas foram mortos no mundo em 2024 e 2025", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 240525, "titulo": "Após acionar OEA, defesa de Vorcaro terá audiência no STF", "url": "https://www.metropoles.com/colunas/manoela-alcantara/apos-acionar-oea-defesa-de-vorcaro-tera-audiencia-no-stf", "fonte_id": "metropoles", "data_pub": "2026-11-02T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os advogados de Vorcaro terão uma audiência no STF nesta terça-feira (3/11) com um juiz auxiliar de Fachin, onde discutirão pedidos pendentes, incluindo a soltura do banqueiro.", "titulo_pt": "Defesa de Vorcaro terá audiência no STF após acionar OEA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 240526, "titulo": "Ana Elisa e irmão de Cleitinho disputam versões sobre preço do combustível", "url": "https://www.metropoles.com/minas-gerais/ana-elisa-e-irmao-de-cleitinho-disputam-versoes-sobre-preco-do-combustivel", "fonte_id": "metropoles", "data_pub": "2026-11-02T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Governos estaduais aprovaram o aumento do ICMS do combustível a partir de 1º de fevereiro de 2027. Ana Elisa e irmão de Cleitinho estão fornecendo versões diferentes sobre o preço do combustível.", "titulo_pt": "Ana Elisa e irmão de Cleitinho disputam versões sobre preço do combustível", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 240527, "titulo": "Quem são os irmãos envolvidos em discussão e morte sobre Lula e Bolsonaro", "url": "https://www.metropoles.com/distrito-federal/na-mira/homem-mata-irmao-apos-provocacao-em-bar-e-discussao-sobre-lula-e-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-11-02T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem de 52 anos foi morto a tiros em um bar na comunidade Santa Marta. Um suspeito de 60 anos, envolvido na discussão que levou à morte da vítima, ainda está foragido da polícia.", "titulo_pt": "Quem são os irmãos envolvidos em discussão e morte sobre Lula e Bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 240590, "titulo": "Novas regras do SAC entram em vigor com exigência de atendimento humano", "url": "https://www.brasildefato.com.br/2026/11/02/novas-regras-do-sac-entram-em-vigor-com-exigencia-de-atendimento-humano/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-02T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entraram em vigor novas diretrizes do Serviço de Atendimento ao Consumidor (SAC), obrigando empresas reguladas pelo governo federal a oferecer atendimento humano diariamente, inclusive nos finais de semana, das 8h às 20h, por telefone e em canais digitais.", "titulo_pt": "Novas regras do SAC entram em vigor com exigência de atendimento humano", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 240501, "titulo": "“Corra como Flávio Bolsonaro”, ironiza cartaz na Maratona de NY", "url": "https://www.poder360.com.br/poder-internacional/corra-como-flavio-bolsonaro-ironiza-cartaz-na-maratona-de-ny/", "fonte_id": "poder360", "data_pub": "2026-11-02T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um cartaz ironizava Flávio Bolsonaro durante a Maratona de Nova York em 1º de novembro, com a mensagem 'Corra como Flávio Bolsonaro'. O senador havia fugido para os Estados Unidos.", "titulo_pt": "Cartaz ironiza Flávio Bolsonaro durante Maratona de NY", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 240584, "titulo": "Abcon quer adiar efeitos da reforma tributária no saneamento básico", "url": "https://www.cnnbrasil.com.br/infra/abcon-quer-adiar-efeitos-da-reforma-tributaria-no-saneamento-basico/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Abcon, associação que representa empresas de saneamento básico, quer adiar os efeitos da reforma tributária no setor. Christianne Dias, diretora-presidente da entidade, alerta para o risco de 'silêncio regulatório'.", "titulo_pt": "Abcon quer adiar impactos da reforma tributária no saneamento básico", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 240425, "titulo": "Vale-tíquete: máquinas terão de aceitar todos os cartões a partir de 7 de novembro, diz Ministério do Trabalho", "url": "https://g1.globo.com/economia/noticia/2026/11/02/vale-tiquete-maquinas-terao-de-aceitar-todos-os-cartoes-a-partir-de-7-de-novembro-diz-ministerio-do-trabalho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-02T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de 7 de novembro de 2026, todas as máquinas de cartão deverão aceitar qualquer cartão de vale-alimentação ou vale-refeição, independentemente da operadora ou bandeira. Esta medida foi estabelecida em um decreto presidencial de 2025 e tem como objetivo implementar a 'interoperabilidade plena' do Programa de Alimentação do Trabalhador (PAT).", "titulo_pt": "Máquinas terão de aceitar todos os cartões de vale-alimentação a partir de 7 de novembro, diz mte", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 240503, "titulo": "MacBook Pro de R$ 183 mil: saiba o que dá para comprar com esse valor", "url": "https://www.poder360.com.br/poder-tech/macbook-pro-de-r-183-mil-saiba-o-que-da-para-comprar-com-esse-valor/", "fonte_id": "poder360", "data_pub": "2026-11-02T16:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O valor de R$ 183 mil pode comprar 112 salários mínimos, 198 cestas básicas, 10 motos populares ou um carro elétrico, com dinheiro de sobra.", "titulo_pt": "Macbook Pro de R$ 183 mil: veja o que pode ser comprado com esse valor", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 241016, "titulo": "Beijing to step up aggression: MAC official", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/03/2003867047", "fonte_id": "taipei_times", "data_pub": "2026-11-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo chinês planeja intensificar suas ações agressivas. Essa in Galapagos Capital firmou uma parceria com a corretora de seguros MDS Brasil para comercializar seguros e soluções de gestão de riscos exclusivamente em suas áreas de wealth management, investment banking e asset management.", "titulo_pt": "Galapagos integra seguros na gestão de fortunas e ativos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 240748, "titulo": "Sob a ótica da neutralidade, como devemos lidar com o IVA Dual?", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/sob-a-otica-da-neutralidade-como-devemos-lidar-com-o-iva-dual", "fonte_id": "jota", "data_pub": "2026-11-02T13:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estrutura tributária deve ser projetada para evitar distorções que reduzam a produtividade, garantindo que não haja prejuízo à produção. Isso deve ser aplicado, por exemplo, no contexto do IVA Dual.", "titulo_pt": "Como lidar com o IVA Dual sob a ótica da neutralidade tributária?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 240749, "titulo": "Consignado para trabalhadores CLT ainda não atingiu ‘ápice’ de potencialidade, diz diretor da ABBC", "url": "https://www.jota.info/tributos-e-empresas/consignado-para-trabalhadores-clt-ainda-nao-atingiu-apice-de-potencialidade-diz-diretor-da-abbc", "fonte_id": "jota", "data_pub": "2026-11-02T13:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor Everton Gonçalves da ABBC destacou os esforços para melhorias operacionais. O consignado para trabalhadores CLT ainda não atingiu seu 'ápice' de potencialidade.", "titulo_pt": "Consignado para trabalhadores CLT ainda não atingiu ‘ápice’ de potencialidade, diz diretor", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 240750, "titulo": "TST rejeita compensação financeira de advogado por cláusula de não concorrência e de não profanação", "url": "https://www.jota.info/trabalho/tst-rejeita-compensacao-financeira-de-advogado-por-clausula-de-nao-concorrencia-e-de-nao-profanacao", "fonte_id": "jota", "data_pub": "2026-11-02T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior do Trabalho rejeitou a solicitação de compensação financeira de um advogado que alegou ter perdido clientes e sua prática ter sido limitada devido a cláusulas de não concorrência e não profanação.", "titulo_pt": "TST rejeita compensação de advogado por cláusulas de não concorrência e não profanação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 241105, "titulo": "A Right-Wing Think Tank Has a Plan to Prevent Democrats From Being Seated in Congress", "url": "https://www.wired.com/story/a-right-wing-think-tank-has-a-plan-to-prevent-democrats-from-being-seated-in-congress/", "fonte_id": "wired", "data_pub": "2026-11-02T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Centro para Renovar a América, um think tank de extrema-direita, propõe que 'progressistas neo-marxistas' e 'muçulmanos anti-Ocidente' não podem jurar de forma sincera para proteger a Constituição e, portanto, não devem ser nomeados para cargos em Congresso.", "titulo_pt": "Um Think Tank de extrema-direita propõe restringir a posse de democratas em congresso", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 241072, "titulo": "Raising the quality of insights in agentic analytics", "url": "https://www.technologyreview.com/2026/11/02/1147660/raising-the-quality-of-insights-in-agentic-analytics/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-02T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de inteligência artificial gerativa transformou o analytics empresarial em apenas alguns anos, tornando-o acessível a usuários em todo o organograma. A Agentic AI promete ir além, automatizando fluxos de trabalho inteiros e tomando ações com base nas insights geradas por agentes, mas há um problema: a qualidade das insights atualmente geradas pelos agentes é questionada.", "titulo_pt": "Aumentando a qualidade das insights em analytics agêntico", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 241106, "titulo": "Anti-Oligarchy Activists Plan to Dox Elon Musk and Hundreds of Billionaire-Linked Homes", "url": "https://www.wired.com/story/anti-oligarchy-activists-plan-to-dox-elon-musk-and-hundreds-of-billionaire-linked-homes/", "fonte_id": "wired", "data_pub": "2026-11-02T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Capytistas, um grupo secreto que reivindica mais de 1,2 milhão em apoio, planeja divulgárias informações pessoais de Elon Musk e centenas de residências associadas a bilionários. Os membros argumentam que aqueles que compram poder político merecem a mesma atenção que eles pretendem aplicar.", "titulo_pt": "Ativistas anti-oligarquia planejam divulgar informações pessoais de Elon Musk e de milhares de residências relacionadas a bilionários", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 240757, "titulo": "Shop fridges and freezers across Europe hit by fresh suspected cyber-attack", "url": "https://www.theguardian.com/world/2026/nov/02/supermarket-freezers-across-europe-hit-by-second-suspected-cyber-attack", "fonte_id": "guardian_world", "data_pub": "2026-11-02T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lojas em pelo menos sete países europeus relataram que as temperaturas nos refrigeradores e freezers subiram para até 50C durante a noite, semelhante a um ataque cibernético recente na França que causou milhões de euros em dano. Várias cadeias de supermercados confirmaram terem sido hackeadas.", "titulo_pt": "Lojas de refrigeradores e freezers em vários países da Europa enfrentam novo ataque cibernético suspeito", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 240987, "titulo": "Anthropic reveals $900bn AI spending commitments ahead of IPO", "url": "https://www.ft.com/content/4d91dbab-6fe4-45ab-beee-d77e091cb37f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-02T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic revelou compromissos de gastos de US$ 90 bilhões com inteligência artificial (IA) antes de sua oferta inicial de ações (IPO). Os custos de infraestrutura da Claude, um dos principais produtos da empresa, estão aumentando mais rapidamente do que as receitas, levando os investidores a examinarem os aspectos econômicos do boom da IA.", "titulo_pt": "Anthropic revela compromissos de gastos de us$ 90 bilhões com IA antes de IPO", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 240986, "titulo": "European supermarket freezers overheat in fresh cyber attack", "url": "https://www.ft.com/content/2526056c-c616-4116-94b1-ac278da21cca?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-02T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As temperaturas nos freezers de dezenas de lojas em países europeus, como Suécia, Bélgica, Irlanda e Estônia, subiram para até 55°C em uma nova ação cibernética.", "titulo_pt": "Freezers de supermercados europeus superaquecem em nova operação cibernética", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 240494, "titulo": "Temor com IA faz mais de 2 trilhões de dólares evaporarem das bolsas estrangeiras", "url": "https://veja.abril.com.br/economia/temor-com-ia-faz-mais-de-trilhoes-de-dolares-evaporarem-das-bolsas-estrangeiras/", "fonte_id": "veja", "data_pub": "2026-11-02T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O temor em relação à inteligência artificial fez mais de 2 trilhões de dólares desaparecerem dos mercados acionários internacionais, afetando principalmente as ações de tecnologia. No entanto, uma recuperação na Coreia e uma reavaliação do Deutsche Bank sugerem que a situação pode estar se estabilizando.", "titulo_pt": "Temor com IA faz mais de 2 trilhões de dólares evaporarem das bolsas estrangeiras", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 240680, "titulo": "IA consegue criar vírus que se espalha por conta própria em eletrodomésticos", "url": "https://www.dw.com/pt-br/ia-consegue-criar-vírus-que-se-espalha-por-conta-própria-em-eletrodomésticos/a-79828161?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-02T14:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic está testando como 'vermes' de inteligência artificial se comportam em smart TVs. Esses vírus se propagam por conta própria para outros dispositivos explorando falhas de segurança e se adaptam a diferentes tipos de equipamentos.", "titulo_pt": "IA testa 'vermes' em smart tvs", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 241066, "titulo": "(LEAD) Personal information of Lee, presidential staff leaked: report", "url": "https://en.yna.co.kr/view/AEN20261102013251320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Informações pessoais do presidente Lee Jae Myung e de membros da sua equipe foram vazadas, de acordo com um relatório.", "titulo_pt": "Informações pessoais do presidente Lee e da equipe dele vazadas: relatório", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 241049, "titulo": "Supermarket fridges in Europe hit by new cyberattack: ‘everything is destroyed’", "url": "https://www.scmp.com/news/world/europe/article/3373032/supermarket-fridges-europe-hit-new-cyberattack-everything-destroyed", "fonte_id": "scmp", "data_pub": "2026-11-02T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque cibernético atingiu supermercados na Europa, afetando refrigeradores e freezers de lojas na Bélgica, Luxemburgo, Suécia e outros países, forçando as lojas a descartar alimentos. A aç e-of-money/hack-do-mercado-bitcoin-expoe-riscos-de-seguranca-especialistas-dizem-como-se-proteger/", "fonte_id": "exame", "data_pub": "2026-11-02T13:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A segurança dos mercados de criptomoedas não depende apenas da tecnologia das blockchains. O incidente recente no Mercado Bitcoin ilustra os riscos existentes e a necessidade de medidas de proteção adicionais.", "titulo_pt": "Hack do Mercado Bitcoin expõe riscos de segurança", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 241054, "titulo": "China’s EDA champion buys start-up to address weak link, support Huawei’s Tau Scaling Law", "url": "https://www.scmp.com/tech/big-tech/article/3373005/chinas-eda-champion-buys-start-address-weak-link-support-huaweis-tau-scaling-law", "fonte_id": "scmp", "data_pub": "2026-11-02T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empyrean Technology, a principal fornecedora chinesa de ferramentas de automação de design eletrônico (EDA), planeja adquirir uma participação majoritária de 50,38% na empresa de start-up doméstica Easy-Logic Technology por 218,8 milhões de yuan, reforçando a busca pelo autoabastecimento tecnológico e apoiando as ambições semicondutores da Huawei Technologies.", "titulo_pt": "Empyrean technology adquire start-up para fortalecer EDA e apoiar ambiciosos planos de semicondutores da Huawei", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 241073, "titulo": "Stop counting tokens, start counting what ships", "url": "https://www.technologyreview.com/2026/11/02/1147702/stop-counting-tokens-start-counting-what-ships/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-02T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desenvolvedor envia uma tarefa de codificação para um agente de IA, que realiza várias etapas, incluindo planejamento, geração de código e execução de testes. Este processo pode utilizar de 10 a 50 vezes mais tokens do que um prompt básico de chat, à medida que o agente se torna mais útil.", "titulo_pt": "Para de contar tokens, comece a contar o que realmente importa", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 241074, "titulo": "The Download: the agentic web arrives and the drive for safer roads", "url": "https://www.technologyreview.com/2026/11/02/1147889/the-download-agentic-web-arrives-eliminating-traffic-deaths/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-02T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agente web chegou. Em 2001, Tim Berners-Lee propôs uma nova visão para a internet, onde software agente autônomo navegaria na web em nosso nome.", "titulo_pt": "Download: o agente web chega e a busca por estradas mais seguras", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 241028, "titulo": "Researchers develop new semiconductor material", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/03/2003867066", "fonte_id": "taipei_times", "data_pub": "2026-11-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores desenvolveram um novo material semiconductor. O material apresenta propriedades promissoras para aplicações em tecnologia avançada.", "titulo_pt": "Pesquisadores desenvolvem novo material semiconductor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 241126, "titulo": "400,000-year-old fossilized termite nests named after Little Karoo town", "url": "https://phys.org/news/2026-11-year-fossilized-termite-karoo-town.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Cape Town (UCT) nomearam uma série de ninhos de terceiro-estado de formigas extintas, datados há aproximadamente 400.000 anos, após a cidade de Calitzdorp, no Little Karoo, próximo à qual os ninhos foram encontrados. Em outubro de 2026, a equipe de pesquisa apresentou um poster documentando a descoberta ao Museu de Calitzdorp, auxiliando a conectar a comunidade local com o patrimônio fóssil da região.", "titulo_pt": "Ninhos fósseis de 400.000 anos são nomeados após cidade do Little Karoo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241127, "titulo": "CubeSat achieves challenging laser link to ground", "url": "https://phys.org/news/2026-11-cubesat-laser-link-ground.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O microsatélite ERMIS-3, desenvolvido pela Universidade Nacional e Kapodistria de Atenas, estabeleceu com sucesso uma conexão laser com uma estação terrestre óptica, um passo importante para a validação das comunicações ópticas em satélites pequenos. O demonstrativo foi realizado com o apoio da Agência Espacial Europeia e utilizou terminais ópticos desenvolvidos pela empresa lituana Astrolight, ocorrendo apenas algumas semanas após a comissão do satélite.", "titulo_pt": "Microsatélite estabelece link laser com estação terrestre", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241128, "titulo": "Volcanic eruptions in the tropics are a major factor in Earth's thermostat", "url": "https://phys.org/news/2026-11-volcanic-eruptions-tropics-major-factor.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eruptions de volcanos na tropicais têm um impacto significativo no termômetro do planeta. Esses eventos não apenas afetam visualmente e localmente, mas também têm efeitos globais.", "titulo_pt": "Eruptions de volcanos na tropicais são um fator importante no termostato da terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241173, "titulo": "NASA Invites Media to Northrop Grumman CRS-25 Station Resupply Launch", "url": "https://www.nasa.gov/news-release/nasa-invites-media-to-northrop-grumman-crs-25-station-resupply-launch/", "fonte_id": "nasa_news", "data_pub": "2026-11-02T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está aceitando credenciamentos de mídia para o próximo lançamento que transportará experimentos científicos, suprimentos e equipamentos para a Estação Espacial Internacional. O lançamento será realizado por uma nave Cygnus XL da Northrop Grumman, em novembro, usando um foguete Falcon 9 da SpaceX.", "titulo_pt": "NASA convida mídia para lançamento de suprimento para a estação espacial no novembro", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 241129, "titulo": "Automated platform optimizes enzyme production using cell-free protein synthesis and AI-driven design", "url": "https://phys.org/news/2026-11-automated-platform-optimizes-enzyme-production.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enzimas são cruciais em diversos processos industriais, incluindo a produção de ingredientes farmacêuticos ativos, químicos especializados e ingredientes para cosméticos, além de serem essenciais para a indústria alimentícia. Uma plataforma automatizada utiliza a síntese de proteínas celulares livres e o design guiado por inteligência artificial para otimizar a produção de enzimas.", "titulo_pt": "Plataforma automatizada otimiza produção de enzimas usando síntese de proteínas celulares livres e design guiado por IA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241130, "titulo": "New study explores how incomplete understanding fuels scientific progress", "url": "https://phys.org/news/2026-11-explores-incomplete-fuels-scientific.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo explora como o entendimento incompleto pode impulsionar o progresso científico. Os cientistas dedicam suas carreiras para compreender como o mundo funciona, mas mesmo em suas especialidades, uma compreensão completa pode permanecer fora de alcance.", "titulo_pt": "Novo estudo examina como o entendimento incompleto alimenta o progresso científico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241151, "titulo": "Newborn survival improves when families receive financial support", "url": "https://www.sciencenews.org/article/newborn-cash-support-survival", "fonte_id": "science_news", "data_pub": "2026-11-02T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa chamado Rx Kids, que oferece transferências financeiras sem condições para grávidas e bebês recém-nascidos, reduziu a mortalidade neonatal em Flint, Michigan.", "titulo_pt": "A sobrevivência de recém-nascidos melhora com apoio financeiro para famílias", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 240677, "titulo": "Missão da Nasa para simular Marte termina após equipe ficar 378 dias isolada nos EUA", "url": "https://www.dw.com/pt-br/missão-da-nasa-para-simular-marte-termina-após-equipe-ficar-378-dias-isolada-nos-eua/a-79832967?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-02T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma missão da NASA para simular uma viagem a Marte terminou após quatro participantes ficarem isolados por 378 dias nos Estados Unidos. Durante o experimento, a comunicação com autoridades e familiares era limitada e os participantes não tiveram contato com a luz solar.", "titulo_pt": "Missão da Nasa para simular Marte termina após equipe ficar 378 dias isolada nos EUA", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 241131, "titulo": "Beyond visitor numbers: Understanding overtourism risk in suburban Tokyo", "url": "https://phys.org/news/2026-11-visitor-overtourism-suburban-tokyo.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O overtourismo tem se tornado uma preocupação crescente em destinos turísticos populares, onde grandes números de visitantes podem colocar pressão sobre as comunidades locais e as atrações. No entanto, não todas as áreas enfrentam os mesmos desafios, pois enquanto centros urbanos movimentados podem lutar para gerir multidões, áreas suburbanas menos visitadas frequentemente enfrentam o problema oposto: atrair suficientes visitantes.", "titulo_pt": "O além dos números de visitantes: compreendendo o risco de overtourismo em áreas suburbanas de tóquio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241121, "titulo": "STAT+: The health care affordability midterms, and billing urgent care as ER", "url": "https://www.statnews.com/2026/11/02/health-care-affordability-midterms-hybrid-er-urgent-care-clinics-health-care-inc/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acessibilidade à saúde é um problema importante para os eleitores, e um novo tipo de clínica médica está gerando grandes contas para alguns pacientes.", "titulo_pt": "Saúde acessível: um problema para os eleitores e clínicas gerando grandes contas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 240459, "titulo": "EUA aprova versão genérica de tratamento preventivo contra HIV", "url": "https://www.cartacapital.com.br/mundo/eua-aprova-versao-generica-de-tratamento-preventivo-contra-hiv/", "fonte_id": "cartacapital", "data_pub": "2026-11-02T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As autoridades americanas aprovaram um tratamento genérico para prevenção do HIV. A Dr. Reddy's Laboratories, uma empresa farmacêutica indiana, é responsável pelo desenvolvimento desse medicamento.", "titulo_pt": "EUA aprova versão genérica de tratamento preventivo contra HIV", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 241132, "titulo": "Single molecules could provide the building blocks for future quantum networks", "url": "https://phys.org/news/2026-11-molecules-blocks-future-quantum-networks.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moléculas individuais podem servir como blocos de construção para redes quânticas futuras. Computadores quânticos dependem de qubits como unidades de informação, e para conectar esses qubits em uma rede maior a longa distância, a transmissão de informação quântica através de luz é necessária.", "titulo_pt": "Moléculas individuais poderiam fornecer os blocos de construção para redes quânticas futuras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241208, "titulo": "James Webb Space Telescope uncovers new clues about the origins of 'interstellar invader' comet 3I/ATLAS", "url": "https://www.space.com/astronomy/asteroids/james-webb-space-telescope-uncovers-new-clues-about-the-origins-of-interstellar-invader-comet-3i-atlas", "fonte_id": "space_com", "data_pub": "2026-11-02T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb descobriu novas evidências sobre as origens do cometa 3I/ATLAS e sobre as condições de formação de planetas em sistemas estelares similares.", "titulo_pt": "James Webb Space Telescope desvenda novas pistas sobre as origens do 'intruso interestelar' cometa 3I/ATLAS", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 241122, "titulo": "STAT+: Psilocybin’s lasting benefits prove elusive in mice", "url": "https://www.statnews.com/2026/11/02/biotech-news-psilocybin-lasting-benefits-prove-elusive-in-mice/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco laboratórios da Baía de São Francisco compareceram para avaliar os efeitos duradouros da psilocibina no comportamento ansioso e depressivo em camundongos, mas obtiveram resultados limitados.", "titulo_pt": "Benefícios duradouros da psilocibina em camundongos são incertos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 241133, "titulo": "Climate-vulnerable Africa faces significant gaps in early warning systems, leaving millions at risk from extreme weather", "url": "https://phys.org/news/2026-11-climate-vulnerable-africa-significant-gaps.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, eventos climáticos afetaram pelo menos 13 milhões de pessoas na África. Durante a última década, o clima extremo afetou populações africanas de forma desproporcional, com ciclones tropicais e secas causando grandes impactos.", "titulo_pt": "África vulnerável ao clima enfrenta lacunas significativas nos sistemas de alerta precoce, deixando milhões em risco de eventos climáticos extremos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 241291, "titulo": "‘The Fall and Rise of Reggie Dinkins’ Is the Funniest Series of the Year", "url": "https://www.indiewire.com/criticism/shows/the-fall-and-rise-of-reggie-dinkins-season-2-review-1235224563/", "fonte_id": "indiewire", "data_pub": "2026-11-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um período dominado por revivals esquecíveis e comedias escassas, a equipe de '30 Rock' criou algo novo, mantendo seu estilo riquíssimo em piadas, culto à cultura pop e agradável às redes. O resultado é considerado o programa mais engraçado do ano.", "titulo_pt": "A descent e ascensão de Reggie Dinkins é o comedieiro do ano", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 241176, "titulo": "EU Looking to Downgrade Money Laundering Risk in Art and Antiquities Trade", "url": "https://www.artnews.com/art-news/market/eu-downgrade-money-launderin  "data_pub": "2026-11-02T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre 2020 e 2024, os votantes da geração Z se inclinaram para o direito mais do que 20 pontos percentuais, mas agora estão voltando para longe do presidente eleito.", "titulo_pt": "Geração Z não pode permitir a guerra cultural", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 240267, "titulo": "Millions in China moved by student who quit school to care for seriously ill mother", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3373000/millions-china-moved-student-who-quit-school-care-seriously-ill-mother", "fonte_id": "scmp", "data_pub": "2026-11-02T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhões de chineses se emocionaram com a história de uma graduada de escola secundária que deixou a universidade para cuidar de sua mãe gravemente doente. Cao Feng decidiu abandonar seu lugar na universidade para cuidar de sua mãe hospitalizada, que tem miastenia grave generalizada.", "titulo_pt": "Milhões de chineses tocados por estudante que deixou universidade para cuidar de mãe doente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240275, "titulo": "Tempers fray as thousands of Bangladeshi garment workers protest for pay rise", "url": "https://www.scmp.com/news/asia/south-asia/article/3372963/cheap-fashion-under-pressure-bangladeshi-garment-workers-protest-pay-hike", "fonte_id": "scmp", "data_pub": "2026-11-02T07:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de trabalhadores da indústria têxtil do Bangladesh bloquearam uma importante via e entraram em conflito com a polícia, exigindo um salário mínimo mensal que seja mais do que o dobro do atual. As manifestações se espalharam por centros industriais do país, que é o segundo maior exportador mundial de roupas, após a China.", "titulo_pt": "Nervos à flor da pele em protestos de milhares de trabalhadores do setor têxtil do bangladesh", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 239872, "titulo": "Moradora e condomínio do DF travam batalha judicial por causa de ciclovia", "url": "https://www.metropoles.com/distrito-federal/moradora-e-condominio-do-df-travam-batalha-judicial-por-causa-de-ciclovia", "fonte_id": "metropoles", "data_pub": "2026-11-02T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma moradora e um condomínio no Distrito Federal estão envolvidos em uma batalha judicial relacionada à construção de uma ciclovia. A Justiça autorizou a construção após o condomínio apresentar um recurso, embora as escavações tenham causado rachaduras na residência da moradora.", "titulo_pt": "Moradora e condomínio do DF travam batalha judicial por causa de ciclovia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 240480, "titulo": "O alerta da ONU para danos ‘irreversíveis’ do aquecimento global em geleiras e banquisas", "url": "https://veja.abril.com.br/agenda-verde/o-alerta-da-onu-para-danos-irreversiveis-do-aquecimento-global-em-geleiras-e-banquisas/", "fonte_id": "veja", "data_pub": "2026-11-02T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da ONU alerta que um aquecimento global acima de 1,5ºC aumentará os riscos de inundações, danos econômicos e ecológicos, além da escassez de água.", "titulo_pt": "Alerta da ONU sobre danos 'irreversíveis' do aquecimento global em geleiras e banquisas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 240678, "titulo": "Reduzir emissões da aviação evitaria prejuízos bilionários ao clima", "url": "https://www.dw.com/pt-br/reduzir-emissões-da-aviação-evitaria-prejuízos-bilionários-ao-clima/a-79831627?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-02T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aviação é um
