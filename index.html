<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "27/09/2026 15:17", "stats": {"noticias_novas": 648, "resumos_gerados": 227}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As pesquisas de intenção de voto para o primeiro turno das eleições presidenciais de 2026 indicam que Lula lidera, embora esteja tecnicamente empatado com Flávio Bolsonaro. O eleitorado brasileiro no exterior atingiu um novo recorde, chamando a atenção dos simpatizantes de ambos os principais candidatos. Em Aracaju, Flávio Bolsonaro participou de um ato de campanha onde afirmou que Lula tem dois filhos. O ministro do STF Flávio Dino revogou a decisão do TSE e permitiu a publicação de conteúdo sobre a lei que declarou Nossa Senhora Aparecida padroeira do Brasil. A Medida Provisória assinada pelo presidente Lula proíbe a operação, a publicidade e o patrocínio de casas de apostas no Brasil, enquanto a crise envolvendo Alexandre de Moraes e André Mendonça no STF intensificou as discussões sobre possíveis mudanças na corte.", "mundo": "A Coreia do Sul conquistou cinco medalhas de ouro nos Jogos Asiáticos, destacando-se com atletas de beisebol e um skatista jovem. Em outro evento, uma avalanche no Nepal deixou dois mortos e pelo menos 14 desaparecidos. No Reino Unido, um incidente envolvendo a base aérea de Fairford levou à prisão de cinco suspeitos de terrorismo. Na Suíça, a maioria dos votantes rejeitou um plano para fortalecer a neutralidade do país. Nos Estados Unidos, Donald Trump rejeitou a última proposta de negociação com o Irã, indicando dificuldades para alcançar um acordo. Além disso, um navio de pesquisa chinês foi observado na Zona Econômica Exclusiva do Japão, levantando preocupações sobre potenciais atividades marítimas não declaradas.\n\nA situação geopolítica continua instável, com conflitos e tensões em várias regiões. Na Ucrânia, ataques russos resultaram em pelo menos três mortes em Sumy, Kharkiv e Kiev, mostrando que a guerra persiste desde 2022. Em outro desenvolvimento, o Irã rejeitou a proposta dos EUA para reabrir o Estreito de Ormuz, mantendo sua posição firme. Além disso, ataques de drones russos em três cidades ucranianas resultaram em pelo menos cinco mortos e múltiplos feridos, aumentando a tensão no conflito. No Iêmen, um ataque aéreo saudita em Taiz deixou sete mortos e 40 feridos, enquanto no Líbano, o petróleo líbio se torna cada vez mais desejado, criando oportunidades e desafios para o país.", "economia": "A Suprema Corte brasileira decidiu retirar o PSDB-Cidadania da coligação de Raquel Lyra, o que afeta a política estadual. A elevação das taxas de juros no mercado global está impactando a construção de infraestrutura de inteligência artificial, com empresas americanas considerando alternativas mais econômicas. No exterior, a Coreia do Sul conquistou o quinto título consecutivo de ouro no baseball da Ásia, enquanto a China sinalizou a possibilidade de liberar a compra de novos chips da Nvidia para empresas locais como ByteDance e Alibaba. Na economia doméstica, a taxa Selic está prevista para ser aumentada para 4,6%, seu nível mais alto desde 2011, o que pode reduzir os preços imobiliários e aumentar os pagamentos mensais típicos das hipotecas. A campanha presidencial também está em foco, com Lula e Flávio disputando os últimos votos, enquanto investidores buscam proteção e diversificação de carteiras devido à incerteza eleitoral. Além disso, a produtividade no Brasil depende do uso eficiente da inteligência artificial e das instituições sólidas, conforme sugere Acemoglu, em um cenário que também vê a Tata Group enfrentando uma crise de sucessão e a Armani iniciando negociações para a venda de participação com LVMH e L'Oréal.", "tecnologia": "O avanço da inteligência artificial (IA) continua sendo um tema de grande importância, com especialistas alertando para os riscos associados. Segundo o especialista Celso Camilo, o avanço da IA exige cuidado na sua utilização pelos seres humanos, destacando que o problema não está nas ferramentas em si, mas na maneira como elas são aplicadas. O boom da IA está alimentando uma divisão 'k-formada', beneficiando os já bem-sucedidos e prejudicando os demais, conforme apontado em um artigo do Taipei Times. Além disso, a Anvisa está investigando 13 casos de perda de visão relacionada a canetas utilizadas para controle de diabetes e emagrecimento, apesar de, até o momento, não ter sido comprovada a relação entre o uso dessas canetas e os efeitos adversos. No campo tecnológico, a seleção de câmeras de segurança em promoção na Amazon e a oferta de soundbars e fones Bluetooth portáteis também chamam a atenção, oferecendo opções para monitorar casas ou empresas e para uso em diversas ocasiões, desde festas até viagens.", "ciencia": "A missão BepiColombo, uma joint-venture entre Japão e Europa, está prestes a entrar em órbita de Mercúrio após uma jornada de oito anos. Este evento marca a segunda missão a realizar tal feito, após a sonda americana Messenger, que chegou ao planeta em 2011. Paralelamente, pesquisadores descobriram que bactérias realizam quimossíntese em peixes do coral, revelando um microbioma complexo que pode desempenhar um papel importante na saúde dos peixes. Em outro estudo, a Anvisa investiga 13 notificações relacionadas a neuropatia óptica isquêmica associada a canetas emagrecedoras, que podem levar à perda permanente da visão. Além disso, a presença de oxigênio em ambientes marinhos é crucial para a evolução de formas de vida mais complexas, conforme revelado por rochas antigas na Austrália. Estudos também abordam a relação entre a inflamação e a persistência da dor na artrite reumatoide, bem como a possibilidade de um 'plano B' nas células para sobrevivência, o que pode abrir novos caminhos para a pesquisa em câncer.", "cultura": "O evento mais importante dos artigos é a volta de Ping Ping e Fu Shuang, dois pandas-gigantes, aos Estados Unidos. Os animais chegaram ao Zoo Atlanta, iniciando uma nova fase de cooperação entre o zoológico e a China. Este evento é destacado em duas fontes, incluindo o Infomoney e o Le Monde, que menciona a visita do presidente chinês Xi Jinping aos Estados Unidos. A chegada dos pandas-gigantes gerou uma nova onda de 'panda-mania', com a exposição dos animais em um ambiente de zoológico que despertou grande interesse público. Além disso, o Festival Neutral 2026, que retornou após oito anos, também merece destaque, com performances energéticas de bandas como Candelabro, Hesse Kassel, Estoy Bien e María e os Templos, celebrando uma escena musical propositiva e em ascensão.", "sociedade": "O PAHO Walk for Health reuniu funcionários, familiares, parceiros e delegados antes da 63ª Diretora Executiva, no dia 27 de setembro de 2026. Em São Paulo, três hospitais municipais foram destacados em rankings internacionais, com o Vila Santa Catarina e M’Boi Mirim entre os 50 melhores da América Latina. A campanha Setembro Verde no Brasil promove a doação de órgãos, focando na autorização dada pelos familiares após a morte. A tramitação da Proposta de Emenda à Constituição (PEC) 171/1993 sobre a redução da maioridade penal é questionada quanto a se trata de uma política criminal ou responde a um clamor social. A polícia sul-africana busca suspeitos após dois tiroteios que resultaram em 27 mortes, reavivando debates sobre a proteção dos locadores e a violência de gangues no país.", "meio_ambiente": "Em várias cidades francesas, ocorreram 260 manifestações envolvendo 120 mil pessoas em prol do clima, da vida, da paz e da justiça social. No entanto, uma onda de calor intensa está afetando 8 estados brasileiros, com previsão de temperaturas acima de 40ºC até a próxima quarta-feira (30), e merece atenção. O Nepal enfrenta desafios climáticos na produção de energia hidrelétrica, com danos extensos aos seus projetos fluviais, levantando dúvidas sobre a segurança energética do país. Uma forte tempestade chamada 'nor’easter' atingiu a costa leste dos Estados Unidos, causando mortes, inundações e deixando cerca de 150.000 residências sem energia.", "direitos_humanos": "Há centenas de muçulmanos reunidos na cidade de Ujjain, na Índia, para protestar contra a demolição parcial de uma mesquita histórica que tem mais de 600 anos. Em uma região fronteiriça, um resgateiro experiente arrisca sua vida para encontrar o filho de uma mulher nas áreas de fronteira entre Estados Unidos e México. Nos Estados Unidos, Casey Revkin, que começou a ajudar menores afetados pelas políticas migratórias durante o primeiro mandato de Donald Trump, continua a fazer depósitos nas contas das famílias detidas no centro de detenção de Dilley, no Texas. Em Oleshky, uma cidade ocupada pela Rússia, os últimos moradores estão comendo plantas para sobreviver, pois o suprimento de alimentos se esgotou, com cerca de 2.000 civis, incluindo 50 crianças, sem acesso a alimentos. Finalmente, em Seul, Coreia do Sul, o número de investigações ocultas realizadas pela polícia sobre crimes digitais sexuais aumentou mais do que triplicou este ano, refletindo preocupações sobre a violação dos direitos humanos em diferentes contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 183790, "titulo": "Em Aracaju, Flávio Bolsonaro diz que Lula tem dois filhos: \"Lulinha e o tigrinho\"", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/em-aracaju-flavio-bolsonaro-diz-que-lula-tem-dois-filhos-lulinha-e-o-tigrinho.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro participou de um ato de campanha em Aracaju, Sergipe, no domingo, com início atrasado. Durante o evento, ele afirmou que Lula tem dois filhos: Lulinha e o tigrinho.", "titulo_pt": "Flávio Bolsonaro afirma que Lula tem dois filhos em evento de campanha em Aracaju", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183791, "titulo": "A metástase institucional do caso Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcus-melo/2026/09/a-metastase-institucional-do-caso-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As recentes revelações sobre Davi Alcolumbre adicionam uma dimensão grave à crise política. Seu comportamento poderia ser explicado pela dinâmica institucional de um presidente com maioria mínima frente a um Legislativo adverso, com Alcolumbre sendo o agente representativo de uma maioria parlamentar.", "titulo_pt": "A metástase institucional do caso alcolumbre", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183792, "titulo": "Estudo internacional investiga relação entre canhoto e destro e escolha política", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/estudo-internacional-investiga-relacao-entre-canhoto-e-destro-e-escolha-politica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo internacional baseado em 18 países ocidentais observou que os canhotos tendem a se posicionar mais à esquerda politicamente. O resultado aponta uma relação entre a identidade e a preferência política, não sendo explicado pela renda, idade ou escolaridade.", "titulo_pt": "Estudo internacional associa canhotos a esquerdistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183846, "titulo": "Pesquisas eleitorais mostram números de Lula nos levantamentos da última semana", "url": "https://veja.abril.com.br/politica/pesquisas-eleitorais-mostram-numeros-de-lula-nos-levantamentos-da-ultima-semana/", "fonte_id": "veja", "data_pub": "2026-09-27T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As pesquisas eleitorais da última semana mostram que Lula lidera nos cenários de primeiro turno, mas está empatado tecnicamente com Flávio nos levantamentos.", "titulo_pt": "Pesquisas eleitorais mostram números de Lula nos levantamentos da última semana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 183827, "titulo": "Saiba como as bets adoeceram e endividaram os brasileiros", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/saiba-como-bets-adoeceram-e-endividaram-os-brasileiros", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-27T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kaio, de 42 anos, perdeu o carro, a casa e o emprego devido às dívidas de apostas online e hoje vive em um dormitório no chão, temendo por sua segurança. A proibição das bets no Brasil foi vista por ele como um grande alívio após anos de dificuldades financeiras.", "titulo_pt": "Entenda como as apostas online adoeceram e endividaram os brasileiros", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 183793, "titulo": "Ato da esquerda em SP adota discurso religioso após disputa sobre Nossa Senhora Aparecida", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ato-da-esquerda-em-sp-adota-discurso-religioso-apos-disputa-sobre-nossa-senhora-aparecida.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos de esquerda realizaram uma missa seguida de um ato público em prol das mulheres no centro de São Paulo. A religião se tornou um tema importante na campanha política durante essa semana.", "titulo_pt": "Ato de esquerda em SP combina religião e direitos das mulheres", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183794, "titulo": "Dino anula decisão do TSE e libera publicação sobre Nossa Senhora que causou dano a Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/dino-anula-decisao-do-tse-e-libera-publicacao-sobre-nossa-senhora-que-causou-dano-a-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, revogou a decisão do ministro André Mendonça e permitiu a publicação nas redes sociais sobre a lei que declarou Nossa Senhora Aparecida padroeira do Brasil.", "titulo_pt": "Dino revoga decisão e libera publicação sobre Nossa Senhora", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183795, "titulo": "Mendonça amplia influência no TCE-SP com aliados indicados por Tarcísio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/mendonca-amplia-influencia-no-tce-sp-com-aliados-indicados-por-tarcisio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF André Mendonça expandiu sua influência no TCE-SP devido à proximidade com os conselheiros recentemente indicados durante o governo de Tarcísio de Freitas (Republicanos).", "titulo_pt": "Mendonça amplia influência no TCE-SP com aliados indicados por Tarcísio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183800, "titulo": "Fio do Professor Felipe Nunes: análise das pesquisas estaduais da Quaest para presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/27/fio-do-professor-felipe-nunes-analise-das-pesquisas-quaest.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-27T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest para o 1º turno da eleição presidencial mostra que Lula está à frente em 10 estados, Flávio Bolsonaro em 8 e 9 estados estão empatados. O Sudeste é um dos três blocos de estados onde o resultado está mais equilibrado, com Flávio Bolsonaro à frente no Rio de Janeiro, São Paulo, Minas Gerais e Rio Grande do Sul.", "titulo_pt": "Análise das pesquisas Quaest para presidente: lula, flávio bolsonaro e empates no 1º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 183857, "titulo": "A dobradinha que vem dando resultados no Distrito Federal", "url": "https://veja.abril.com.br/politica/a-dobradinha-que-vem-dando-resultados-no-distrito-federal/", "fonte_id": "veja", "data_pub": "2026-09-27T13:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro está realizando uma campanha similar à do partido PL, que pode resultar na conquista das duas vagas do Senado pelo PL no Distrito Federal.", "titulo_pt": "A dobradinha que pode levar o pl ao senado no df", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 183796, "titulo": "Eleitorado brasileiro no exterior bate recorde e atrai a atenção de lulistas e bolsonaristas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/eleitorado-brasileiro-no-exterior-bate-recorde-e-atrai-atencao-de-lulistas-e-bolsonaristas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T13:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O eleitorado brasileiro no exterior atingiu um novo recorde, chamando a atenção tanto de simpatizantes do PT quanto de apoiadores do Bolsonaro. As contas Núcleo PT de Roma e o perfil Liga Conservadora Brasil-Alemanha publicaram mensagens nas redes sociais sobre a postura de diferentes países em relação à soberania brasileira.", "titulo_pt": "Eleitorado brasileiro no exterior bate recorde e atrai a atenção de lulistas e bolsonaristas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183798, "titulo": "Maioria dos principais doadores da campanha de Lula tem cargo no governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/maioria-dos-principais-doadores-da-campanha-de-lula-tem-cargo-no-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T13:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados parciais de prestação de contas mostram que a maioria das doações mais significativas feitas por pessoas físicas diretamente à campanha de reeleição de Lula saíram de ocupantes de cargos no governo ou de empresas estatais.", "titulo_pt": "Maioria dos principais doadores da campanha de Lula tem cargo no governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183859, "titulo": "Nunes Marques suspende jingle da campanha de Lula que associa Flávio Bolsonaro a Vorcaro", "url": "https://veja.abril.com.br/politica/nunes-marques-suspende-jingle-da-campanha-de-lula-que-associa-flavio-bolsonaro-a-vorcaro/", "fonte_id": "veja", "data_pub": "2026-09-27T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jingle de campanha de Lula, que associa Flávio Bolsonaro a Vorcari, foi suspenso por Nunes Marques. A música, com ritmo de um meme viral nas redes sociais, foi exibida sete vezes entre 28 e 31 de agosto em quatro emissoras de rádio.", "titulo_pt": "Nunes Marques suspende jingle de campanha de Lula que associa Flávio Bolsonaro a vorcari", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 183860, "titulo": "Destino de Alexandre de Moraes pode ficar para depois do Carnaval, avaliam ministros", "url": "https://veja.abril.com.br/politica/destino-de-alexandre-de-moraes-pode-ficar-para-depois-do-carnaval-avaliam-ministros/", "fonte_id": "veja", "data_pub": "2026-09-27T13:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O destino da indicação de Alexandre de Moraes para o Supremo Tribunal Federal pode ser adiado para após o Carnaval, conforme avaliam os ministros. O pedido de vista do ministro Flávio Dino é um dos fatores, mas não o único.", "titulo_pt": "Destino de Alexandre de Moraes pode ficar para depois do Carnaval, avaliam ministros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 183799, "titulo": "Lula chama sindicalista e candidato a deputado de 'minha cópia' no Congresso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/lula-chama-sindicalista-e-candidato-a-deputado-de-minha-copia-no-congresso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou em um vídeo que o candidato a deputado federal Moisés Selerges será 'sua cópia' no Congresso se for eleito. Selerges acompanhou Lula na gravação.", "titulo_pt": "Lula chama candidato a deputado de 'minha cópia' no Congresso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183828, "titulo": "Conheça os candidatos que disputam o governo estadual em São Paulo", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/conheca-os-candidatos-que-disputam-o-governo-estadual-em-sao-paulo", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-27T11:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Seis candidatos disputam o governo de São Paulo nas elei ch.com/2026/09/27/techcrunch-mobility-av-companies-pick-their-lanes/", "fonte_id": "techcrunch", "data_pub": "2026-09-27T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TechCrunch Mobility retorna com foco no futuro do transporte, destacando o papel cada vez maior do inteligência artificial nessas tecnologias. Várias empresas de veículos autônomos estão se especializando em diferentes áreas de atuação.", "titulo_pt": "Techcrunch Mobility: empresas de veículos autônomos escolhem suas áreas de atuação", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 183986, "titulo": "Hora de renovar o som: fones Bluetooth em promoção na Amazon", "url": "https://olhardigital.com.br/2026/09/27/reviews/hora-de-renovar-o-som-fones-bluetooth-em-promocao-na-amazon-2/", "fonte_id": "olhar_digital", "data_pub": "2026-09-27T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Existem três opções de fones Bluetooth em oferta na Amazon, adequados para uso diário e treinamento intenso. É um bom momento para renovar o som com dispositivos sem fio.", "titulo_pt": "Hora de renovar o som: fones Bluetooth em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 183909, "titulo": "Avanço da IA exige atenção à forma como ela é utilizada, diz especialista", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/avanco-da-ia-exige-atencao-a-forma-como-ela-e-utilizada-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O especialista Celso Camilo, doutor em IA e professor, destaca que o avanço da inteligência artificial exige cuidado na sua utilização pelos seres humanos. O problema não reside nas ferramentas de IA em si, mas sim na maneira como elas são aplicadas.", "titulo_pt": "Avanço da IA exige atenção à forma como ela é utilizada, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183987, "titulo": "Esquema usa TikTok, Telegram e PIX para vender material de abuso sexual infantil", "url": "https://olhardigital.com.br/2026/09/27/seguranca/esquema-usa-tiktok-telegram-e-pix-para-vender-material-de-abuso-sexual-infantil/", "fonte_id": "olhar_digital", "data_pub": "2026-09-27T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criminosos utilizam TikTok para atrair compradores de material de abuso sexual infantil, transferindo as negociações para o Telegram e efetuando pagamentos via PIX.", "titulo_pt": "Esquema usa TikTok, Telegram e PIX para vender material de abuso sexual infantil", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 184384, "titulo": "Can Bionic Reading really help you read faster? Scientists put it to the test", "url": "https://phys.org/news/2026-09-bionic-faster-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bionic Reading é uma técnica que enfatiza certas letras em palavras, supostamente para aumentar a velocidade e compreensão da leitura. A ideia é que focalizar nas letras iniciais destacadas permita ao cérebro completar a palavra. Os cientistas testaram se direcionar o olhar de fato auxilia na leitura.", "titulo_pt": "Bionic Reading realmente ajuda na leitura mais rápida? Cientistas realizam testes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184385, "titulo": "Soil protection measures can make agri-photovoltaics more sustainable", "url": "https://phys.org/news/2026-09-soil-agri-photovoltaics-sustainable.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa realizada pelo Leibniz Centre for Agricultural Landscape Research (ZALF) foi a primeira a medir como a fase de construção de instalações de agri-photovoltaicidade afeta a estrutura do solo. Essa análise visa garantir que a combinação de geração de eletricidade e agricultura funcione de maneira sustentável no longo prazo.", "titulo_pt": "Medidas de proteção do solo podem tornar a agri-photovoltaicidade mais sustentável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184386, "titulo": "More moral language doesn't always mean more engagement online", "url": "https://phys.org/news/2026-09-moral-language-doesnt-engagement-online.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T16:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de linguagem moral nas postagens de mídia social e outros conteúdos online é comum, mas não está claro se essa linguagem sempre resulta em maior engajamento dos usuários.", "titulo_pt": "Mais linguagem moral não sempre significa mais engajamento online", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184387, "titulo": "How has evolution shaped men's and women's minds? A new book tells an outdated story", "url": "https://phys.org/news/2026-09-evolution-men-women-minds-outdated.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro de Steve Stewart-Williams, intitulado 'Um Bilhão de Anos de Diferenças Sexuais: Como a Evolução Moldou os Pensamentos de Homens e Mulheres', aborda três questões principais sobre como a evolução moldou os pensamentos de homens e mulheres. O campo da psicologia evolutiva, frequentemente usado e distorcido pelo movimento masculino, é o foco do terceiro livro do autor sobre o assunto.", "titulo_pt": "Como a evolução moldou os pensamentos de homens e mulheres? Novo livro conta uma história ultrapassada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184388, "titulo": "Waste bulrush transformed into copper-enhanced material for dye removal from wastewater", "url": "https://phys.org/news/2026-09-bulrush-copper-material-dye-wastewater.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bulrush, um material de resíduo, foi transformado em um material enriquecido com cobre para a remoção de corantes sintéticos da água residual industrial. Estes corantes podem ser liberados na água por atividades industriais como a produção têxtil, produção de papel, processamento de couro e processamento de alimentos, sendo quimicamente estáveis, difíceis de biodegradar e persistentes ambientalmente.", "titulo_pt": "Bulrush transformado em material enriquecido com cobre para remoção de corantes da água residual", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184389, "titulo": "Astronomers discover a radio galaxy with evidence of four separate jet outbursts", "url": "https://phys.org/news/2026-09-astronomers-radio-galaxy-evidence-jet.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos identificaram possivelmente o primeiro exemplo de uma nova classe de galáxia de rádio, cujo buraco negro central parece ter lançado jatos poderosos em quatro ocasiões separadas. Observações de alta resolução com o Telescópio Metrotérmico Grande Ajustado (GMRT), combinadas com dados do MeerKAT e do Very Large Array, revelam quatro pares de estruturas de rádio dispostas simetricamente em torno da galáxia central.", "titulo_pt": "Astrônomos descobrem galáxia de rádio com evidências de quatro jatos separados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 183917, "titulo": "Como mineração a céu aberto pode 'despertar' falhas geológicas a 20 km", "url": "https://exame.com/ciencia/como-mineracao-a-ceu-aberto-pode-despertar-falhas-geologicas-a-20-km/", "fonte_id": "exame", "data_pub": "2026-09-27T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A retirada de grandes volumes de água subterrânea pode provocar o afundamento do solo e afetar estruturas preexistentes. A mineração a céu aberto pode 'despertar' falhas geológicas a 20 km de profundidade.", "titulo_pt": "Como mineração a céu aberto pode 'despertar' falhas geológicas a 20 km", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183919, "titulo": "Trump convida Dario Amodei, CEO da Anthropic, para jantar na Casa Branca", "url": "https://exame.com/inteligencia-artificial/trump-convida-dario-amodei-ceo-da-anthropic-para-jantar-na-casa-branca/", "fonte_id": "exame", "data_pub": "2026-09-27T13:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, convidou o CEO da Anthropic, Dario Amodei, para um jantar na Casa Branca. Este será o primeiro encontro direto entre eles após meses de tensão entre a empresa e o governo americano, e ocorrerá antes de uma reunião com outros principais CEOs de inteligência artificial marcada para a terça-feira.", "titulo_pt": "Trump convida CEO da Anthropic para jantar na Casa Branca", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 184392, "titulo": "Glucosamine, a popular joint supplement, linked to faster Alzheimer’s progression", "url": "https://www.sciencedaily.com/releases/2026/09/260927033754.htm", "fonte_id": "science_daily", "data_pub": "2026-09-27T13:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise de registros de saúde grandes associou o uso de glucosamina a um risco 25% maior de deterioração da função cognitiva leve para demência. Experimentos laboratoriais sugerem que o popular suplemento para os joelhos pode intensificar um processo de envelhecimento abnormal do cérebro em pessoas com Alzheimer, mas pesquisadores afirmam que são necessários ensaios clínicos para determinar se ele realmente causa danos.", "titulo_pt": "Glucosamina, suplemento popular para os joelhos, relacionado a progressão mais rápida da Alzheimer", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 184397, "titulo": "Atrial fibrillation patients saw 69% lower risk with common blood thinners", "url": "https://www.sciencedaily.com/releases/2026/09/260925005439.htm", "fonte_id": "science_daily", "data_pub": "2026-09-27T13:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo randomizado SINGLE-AF mostrou que os anticoagulantes orais diretos reduziram em 69% o risco de eventos clínicos graves em pacientes com fibrilação atrial e risco intermediário de ictus. O benefício principal foi menor ocorrência de ictus isquêmico, sem aumento no risco de hemorragia major.", "titulo_pt": "Medicamentos anticoagulantes reduzem 69% o risco de eventos graves em pacientes com fibrilação atrial", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 184398, "titulo": "One CRISPR treatment cut “bad” cholesterol in half for a full year", "url": "https://www.sciencedaily.com/releases/2026/09/260925005434.htm", "fonte_id": "science_daily", "data_pub": "2026-09-27T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tratamento experimental com terapia CRISPR em dose única reduziu aproximadamente metade do colesterol LDL e das triglicerídios em pacientes com distúrbios lipídicos difíceis de tratar. Essas reduções permaneceram presentes um ano após o tratamento.", "titulo_pt": "Uma única dose de terapia CRISPR reduziu metade do colesterol ldl e triglicerídios por um ano", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 183920, "titulo": "Canetas emagrecedoras podem afetar ovulação e ciclo menstrual, sugere estudo", "url": "https://exame.com/ciencia/canetas-emagrecedoras-podem-afetar-ovulacao-e-ciclo-menstrual-sugere-estudo/", "fonte_id": "exame", "data_pub": "2026-09-27T13:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo sugere que canetas emagrecedoras podem afetar a ovulação e o ciclo menstrual, com relatos de sangramento intenso, coágulos e ciclos sem ovulação. Análises da FDA indicam possíveis efeitos negativos desses produtos.", "titulo_pt": "Canetas emagrecedoras podem afetar ovulação e ciclo menstrual, sugere estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183922, "titulo": "'Algo nunca visto': estrela morta produz onda de choque que desafia astrônomos", "url": "https://exame.com/ciencia/algo-nunca-visto-estrela-morta-produz-onda-de-choque-que-desafia-astronomos/", "fonte_id": "exame", "data_pub": "2026-09-27T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram uma estrutura a 730 anos-luz da Terra que parece persistir há pelo menos mil anos, desafiando os mecanismos conhecidos. Esta onda de choque produzida por uma estrela morta persiste por um período mais longo do esperado com base nos conhecimentos atuais.", "titulo_pt": "Algo nunca visto: estrutura produzida por estrela morta desafia astrônomos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 184396, "titulo": "New soil test could reveal how soil microbes help feed plants", "url": "https://www.sciencedaily.com/releases/2026/09/260925005441.htm", "fonte_id": "science_daily", "data_pub": "2026-09-27T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas simplificaram um método para medir o fósforo ligado ao DNA no solo, tornando-o mais econômico e fácil de realizar sem comprometer a precisão. A técnica pode revelar como microrganismos do solo reciclam fósforo e eventualmente apoiar uma gestão mais sustentável de fertilizantes e nutrientes.", "titulo_pt": "Novo teste de solo poderia revelar como microrganismos ajudam a alimentar plantas", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 183821, "titulo": "Missão nipo-europeia se prepara para chegada a Mercúrio", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/09/missao-nipo-europeia-se-prepara-para-chegada-a-mercurio.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-27T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão BepiColombo está prestes a entrar em órbita de Mercúrio após uma jornada de oito anos. Esta será a segunda missão a realizar esse feito, após a sonda americana Messenger, que chegou ao planeta em 2011.", "titulo_pt": "Missão nipo-europeia se prepara para chegada a Mercúrio", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 184390, "titulo": "DNA reveals chemosynthesis genes in bacteria living on coral reef fish gills", "url": "https://phys.org/news/2026-09-dna-reveals-chemosynthesis-genes-bacteria.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bactérias que realizam quimossíntese foram documentadas em diversos ambientes marinhos e associadas a hospedeiros invertebrados como anelídeos e moluscos, mas sua presença em peixes é uma nova descoberta. Os achados indicam que os rins de peixes abrigam um microbioma complexo e especializado que ainda não é bem compreendido, mas que pode desempenhar um papel importante na metabolismo, imunidade e saúde dos peixes.", "titulo_pt": "DNA revela genes de quimossíntese em bactérias vivendo nos rins de peixes de recifes de corais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 183784, "titulo": "Grifes rebatem monotonia a partir de seus próprios evangelhos em Milão", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/grifes-rebatem-monotonia-a-partir-de-seus-proprios-evangelhos-em-milao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Miuccia Prada apresentou uma coleção com 63 saias em seu desfile, abrindo o calendário de moda italiano. As saias apresentadas eram flexíveis, adaptáveis e variadas, incluindo saias plissadas, lápis e assimétricas.", "titulo_pt": "Grifes rebatem monotonia com saias em desfile de Milão", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 183945, "titulo": "Panda-mania de volta: Ping Ping e Fu Shuang chegam a Atlanta (EUA)", "url": "https://www.infomoney.com.br/mundo/ping-ping-fu-shuang-pandas-chineses-atlanta/", "fonte_id": "infomoney", "data_pub": "2026-09-27T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois pandas-gigantes, Ping Ping e Fu Shuang, chegaram aos Estados Unidos e iniciaram uma nova fase de cooperação entre o Zoo Atlanta e a China.", "titulo_pt": "Pandamania de volta: Ping Ping e Fu Shuang chegam a Atlanta (EUA)", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 184083, "titulo": "Festival Neutral 2026: la contundente celebración de una escena electrizante, propositiva y en ascenso", "url": "https://www.latercera.com/culto/noticia/festival-neutral-2026-la-contundente-celebracion-de-una-escena-electrizante-propositiva-y-en-ascenso/", "fonte_id": "la_tercera", "data_pub": "2026-09-27T16:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Festival Neutral retornou após oito anos em M100 com uma grande recepção, incluindo salas lotadas e performances energéticas. Bandas como Candelabro, Hesse Kassel, Estoy Bien e María e os Templos destacaram-se no evento.", "titulo_pt": "Festival Neutral 2026: a contundente celebração de uma cena em ascensão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 184223, "titulo": "The search for unknown insects in the Borneo jungle: 'I think I've found something incredible'", "url": "https://www.lemonde.fr/en/environment/article/2026/09/27/the-search-for-unknown-insects-in-the-borneo-jungle-i-think-i-ve-found-something-incredible_6758011_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas ainda não identificaram uma pequena fração das espécies de insetos que habitam a Terra. Para ampliar seus conhecimentos, entomologistas regularmente coletam espécimes no campo.", "titulo_pt": "Busca por insetos desconhecidos na selva da borneu: 'acho que encontrei algo incrível'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 184430, "titulo": "Sabrina Carpenter to Play Ginger Rogers in Fred Astaire Biopic", "url": "https://pitchfork.com/story/sabrina-carpenter-to-play-ginger-rogers-in-fred-astaire-biopic/", "fonte_id": "pitchfork", "data_pub": "2026-09-27T15:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sabrina Carpenter será a atriz que interpreta Ginger Rogers no biopic sobre Fred Astaire, que ainda não tem título definitivo. Ela fará parte do elenco ao lado de Tom Holland e Margaret Qualley, dirigido por Paul King.", "titulo_pt": "Sabrina Carpenter interpretará Ginger Rogers em Biopic sobre Fred Astaire", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 184227, "titulo": "Pope Leo XIV urges Church to confront clerical sex abuse and reject assisted dying", "url": "https://www.lemonde.fr/en/international/article/2026/09/27/pope-leo-xiv-urges-french-church-to-confront-clerical-sex-abuse-and-reject-assisted-dying_6758009_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T15:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O papa Leão XIV pediu aos bispos que permaneçam vigilantes em relação ao abuso sexual na Igreja e criticou a nova legislação francesa que permite o suicídio assistido.", "titulo_pt": "Papa leão XIV incentiva igreja a enfrentar abuso sexual clerical e rejeitar eutanásia assistida", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 184133, "titulo": "Pope Leo urges healing of ‘deep wounds’ before meeting child sexual abuse survivors in France", "url": "https://www.theguardian.com/world/2026/sep/27/pope-leo-france-child-sexual-abuse-survivors", "fonte_id": "guardian_world", "data_pub": "2026-09-27T15:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O papa Leo pediu que a Igreja Católica curasse 'feridas profundas' e 'erros dolorosos' antes de se encontrar com sobreviventes de abuso sexual infantil durante sua visita de quatro dias à França. Durante um discurso em um campo perto do santuário católico de Lourdes, ele criticou o suicídio assistido como 'compaixão falsa' sem mencionar diretamente escândalos de abuso sexual na França que afetaram pelo menos 330.000 crianças ao longo de sete décadas.", "titulo_pt": "Papa Leo incentiva cura de 'feridas profundas' antes de se encontrar com sobreviventes de abuso sexual infantil na França", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 183785, "titulo": "'Star Wars' terá filme dirigido por Jon Watts, que antes fez trilogia do Homem-Aranha", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/star-wars-tera-filme-dirigido-por-jon-watts-que-antes-fez-trilogia-do-homem-aranha.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T15:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um filme de 'Star Wars' será dirigido por Jon Watts, que anteriormente comandou a trilogia do Homem-Aranha com Tom Holland. Ele não esteve envolvido no mais recente filme do Homem-Aranha, 'Um Novo Dia', que foi dirigido por Destin Daniel Cretton.", "titulo_pt": "Star Wars terá novo filme com direção de Jon Watts", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 183786, "titulo": "Chef Henrique Fogaça estende menu-degustação ao Sal Gastronomia do shopping Cidade Jardim", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/restaurantes/2026/09/chef-henrique-fogaca-estende-menu-degustacao-ao-sal-gastronomia-do-shopping-cidade-jardim.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chef Henrique Fogaça adicionou duas novas opções de menu-degustação ao Sal Gastronomia, localizado no shopping Cidade Jardim, na região oeste de São Paulo.", "titulo_pt": "Chef Henrique Fogaça expande menu-degustação no Sal Gastronomia do shopping Cidade Jardim", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 184431, "titulo": "Here’s What Went Down at Olivia Rodrigo’s Unraveled Tour Opener", "url": "https://pitchfork.com/story/heres-what-went-down-at-olivia-rodrigos-unraveled-tour-opener/", "fonte_id": "pitchfork", "data_pub": "2026-09-27T14:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No show de abertura da turnê Unraveled de Olivia Rodrigo em Hartford, Connecticut, houve um vestido que derreteu, um campo de flores rosa e referências às gomas Sour.", "titulo_pt": "O que aconteceu no abertura da turnê Unraveled de Olivia Rodrigo em hartford, connecticut", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 184406, "titulo": "A24’s ‘Primetime’ Opens to Impressive $19.2 Million, Proving Robert Pattinson’s Box Office Drawing Power", "url": "https://www.indiewire.com/news/box-office/a24-primetime-box-office-opening-robert-pattinson-star-power-1235218868/", "fonte_id": "indiewire", "data_pub": "2026-09-27T14:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A24's 'Primetime' arrecadou $19,2 milhões no lançamento, demonstrando que Robert Pattinson continua sendo um ator com poder de atrair público para filmes de grande bilheteria. Pattinson tem enfrentado desafios em sua carreira comercial, mas 'The Drama' e 'The Odyssey' têm sido sucessos em 2026.", "titulo_pt": "A24's 'Primetime' abre com impressionantes $19,2 milhões, comprovando o poder de bilheteria de Robert Pattinson", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 183855, "titulo": "Novo livro de Octavio Guedes revela figuras que mudaram o Brasil por acaso", "url": "https://veja.abril.com.br/coluna/veja-recomenda/novo-livro-de-octavio-guedes-revela-figuras-que-mudaram-o-brasil-por-acaso/", "fonte_id": "veja", "data_pub": "2026-09-27T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro 'Heróis por acaso', de Octavio Guedes, apresenta histórias menos conhecidas que retratam figuras que contribuíram significativamente para a história do Brasil de forma inesperada. O autor reúne relatos que não foram incluídos nos livros didáticos tradicionais.", "titulo_pt": "Novo livro de Octavio Guedes revela figuras que mudaram o Brasil por acaso", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 184408, "titulo": "Are Mitchell and Webb the baddies now? It's not quite that simple | Brian Logan", "url": "https://www.theguardian.com/commentisfree/2026/sep/27/mitchell-and-webb-bbc-iplayer-culture-war-comedy", "fonte_id": "guardian_culture", "data_pub": "2026-09-27T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eliminação de 11 velhos esquetes do repertório dos Mitchell and Webb da plataforma iPlayer do BBC foi alvo de críticas. Isso levanta questões sobre as mudanças na sociedade em relação ao que é considerado ofensivo.", "titulo_pt": "Os Mitchell and Webb agora são os vilões? Não é tão simples", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 183787, "titulo": "Assassino de Arthur volta a agir após reviravolta em 'Quem Ama Cuida'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/09/assassino-de-arthur-volta-a-agir-apos-reviravolta-em-quem-ama-cuida.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T13:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O assassino de Arthur, que foi condenado por Adriana, vai voltar a atuar na trama. Uma nova perícia questiona a condenação de Adriana e uma prova crucial do crime desaparece misteriosamente.", "titulo_pt": "Assassino de Arthur volta a agir em 'Quem Ama Cuida'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 184225, "titulo": "'Prize-contending author Orélien's AI controversy challenges the literary world's postcard image of the solitary writer'", "url": "https://www.lemonde.fr/en/opinion/article/2026/09/27/prize-contending-author-orelien-s-ai-controversy-challenges-the-literary-world-s-postcard-image-of-the-solitary-writer_6758007_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um livro de ficção escrita pelo autor canadense-haitiano Orélien, que está no topo das vendas e concorrendo a prêmios, teria sido auxiliado por inteligência artificial. Isso levanta questões sobre o futuro da literatura.", "titulo_pt": "Controvérsia envolvendo IA desafia a imagem tradicional do escritor solitário na literatura", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 184310, "titulo": "Giant pandas Ping Ping and Fu Shuang touch down in the US under new loan deal", "url": "https://www.scmp.com/news/china/diplomacy/article/3368964/giant-pandas-ping-ping-and-fu-shuang-touch-down-us-under-new-loan-deal?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T12:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois pandas gigantes, Ping Ping e Fu Shuang, chegaram a Atlanta para residir no zoológico da cidade sul-americana. Os animais partiram de Chengdu, na China, poucos dias após a visita estatal do presidente chinês Xi Jinping aos Estados Unidos.", "titulo_pt": "Pandas Ping Ping e Fu Shuang chegam aos EUA em novo acordo de empréstimo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 184401, "titulo": "PAHO Walk for Health brings together staff, families, partners and delegates ahead of 63rd Directing Council", "url": "https://www.paho.org/en/news/27-9-2026-paho-walk-health-brings-together-staff-families-partners-and-delegates-ahead-63rd", "fonte_id": "paho", "data_pub": "2026-09-27T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PAHO Walk for Health reuniu funcionários, familiares, parceiros e delegados antes da 63ª Diretora Executiva. O evento ocorreu em 27 de setembro de 2026.", "titulo_pt": "PAHO Walk for saúde reúne funcionários, familiares, parceiros e delegados antes da 63ª diretora executiva", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 183370, "titulo": "Cuando la salud se vuelve una obsesión: cómo darse cuenta que la sufrís y cuánto pesa la hipervigilancia de los biomarcadores", "url": "https://www.lanacion.com.ar/salud/cuando-la-salud-se-vuelve-una-obsesion-como-darse-cuenta-y-cuanto-pesa-la-hipervigilancia-de-los-nid27092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-27T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Com o uso de relógios e anéis inteligentes, surge uma nova realidade onde as pessoas ficam atentas aos marcadores biológicos, como sono, saturação de oxigênio, ritmo cardíaco e consumo de calorias. Embora alguns casos sejam úteis, outros podem causar preocupação excessiva, o que pode ser negativo.", "titulo_pt": "Quando a saúde se torna uma obsessão: como identificar quando você sofre e quanto a hipervigilância de biomarcadores pesa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 183267, "titulo": "São Paulo tem três hospitais municipais em rankings internacionais", "url": "https://www.metropoles.com/conteudo-especial/sao-paulo-hospitais-municipais", "fonte_id": "metropoles", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os hospitais municipais Vila Santa Catarina e M’Boi Mirim estão entre os 50 melhores da América Latina em rankings internacionais. O Hospital Municipal Menino Jesus também foi incluído em um ranking de excelência.", "titulo_pt": "São Paulo tem três hospitais municipais em rankings internacionais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183301, "titulo": "Dia da Doação de Órgãos: veja como vidas são transformadas por transplantes", "url": "https://www.cnnbrasil.com.br/saude/dia-da-doacao-de-orgaos-veja-como-vidas-sao-transformadas-por-transplantes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, a autorização para doação de órgãos é feita pelos familiares após a morte. A campanha Setembro Verde promove conversas entre familiares sobre a intenção de doação de órgãos.", "titulo_pt": "Dia da Doação de Órgãos: veja como vidas são transformadas por transplantes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183441, "titulo": "Redução da maioridade penal: política criminal ou resposta ao clamor social?", "url": "https://www.jota.info/opiniao-e-analise/artigos/reducao-da-maioridade-penal-politica-criminal-ou-resposta-ao-clamor-social", "fonte_id": "jota", "data_pub": "2026-09-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tramitação da Proposta de Emenda à Constituição (PEC) 171/1993 é questionada sobre se a medida visa uma política criminal ou responde a um clamor social.", "titulo_pt": "Redução da maioridade penal: política criminal ou resposta ao clamor social?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183545, "titulo": "Protestors in Madrid demand better tenant protection", "url": "https://www.lemonde.fr/en/international/article/2026/09/27/protestors-in-madrid-demand-better-tenant-protection_6758000_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expulsão de Maricarmen Abascal, uma idosa de 87 anos, de sua residência em Madri após a polícia arrombar sua porta e a levar em uma maca, reavivou o debate sobre a proteção dos locadores e mobilizou os protestos.", "titulo_pt": "Protestos em madri exigem melhor proteção para inquilinos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183659, "titulo": "South Africa police hunt suspects after 27 killed in two separate shootings", "url": "https://www.japantimes.co.jp/news/2026/09/27/world/crime-legal/south-africa-shooting/", "fonte_id": "japan_times", "data_pub": "2026-09-27T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia sul-africana está buscando suspeitos após dois tiroteios que resultaram em 27 mortes. A violência de gangues e o crime organizado são problemas significativos no país, que possui uma das taxas de homicídio per capita mais altas do mundo.", "titulo_pt": "Polícia sul-africana procura suspeitos após 27 mortos em dois tiroteios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183486, "titulo": "At least 27 dead after two mass shootings in South Africa, police say", "url": "https://www.theguardian.com/world/2026/sep/27/mass-shootings-south-africa-johannesburg-cape-town", "fonte_id": "guardian_world", "data_pub": "2026-09-27T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de pessoas morreram em dois atos de tiroteio em massa em South Africa. Em Johannesburg, 17 pessoas foram mortas e 15 ficaram feridas em um ataque a um bar. Em Cape Town, 10 pessoas foram mortas em um incidente separado em um local de churrasco.", "titulo_pt": "Pelo menos 27 mortos após dois atos de tiroteio em massa na áfrica do sul, polícia relata", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 183444, "titulo": "Crime organizado: entre novas leis e a integração institucional", "url": "https://www.jota.info/opiniao-e-analise/artigos/crime-organizado-entre-novas-leis-e-a-integracao-institucional", "fonte_id": "jota", "data_pub": "2026-09-27T08:10:00Z", "idio
