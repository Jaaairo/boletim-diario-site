<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

  </div>
</div>

<script>
const D = {"gerado_em": "06/11/2026 15:25", "stats": {"noticias_novas": 945, "resumos_gerados": 238}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo brasileiro enfrenta diversos desafios, desde a transição energética até a gestão econômica. O presidente Luiz Inácio Lula da Silva (PT) enfatizou a importância da responsabilidade fiscal e do cumprimento dos prazos das suas propostas, rejeitando a ideia de que a população 'paga a conta' por meio de cortes. O Brasil aprovou mapas para a transição energética, incluindo ações contra combustíveis fósseis e desmatamento, após um impasse na COP30. Além disso, a secretária Miriam Belchior informou que o governo adiou a regulamentação do Redata para após a viagem do presidente à COP. No âmbito político, o PDT aprovou a entrada em uma federação com PRD, Solidariedade e Avante, enquanto a defesa de um ex-diretor do Banco Master contesta o indiciamento pela Procuradoria-Geral da República.", "mundo": "A vitória democrata nas eleições médias dos Estados Unidos marcou o 'começo do fim' para o domínio de Donald Trump, conforme declarou John Bolton, ex-conselheiro de segurança nacional. Os democratas recuperaram o controle da Câmara dos Representantes e do Senado, e elegeram James Talarico, um senador de 37 anos, para dar à esquerda seu primeiro triunfo estatal em décadas. Em contraste, o Partido Liberal (PL) de São Paulo manteve sua candidatura à Câmara Municipal, apesar de um aliado do deputado federal Eduardo Nunes ter se apresentado. No Paraguai, a quebra do banco Ueno levou ao renúncia do presidente Santiago Peña, que era acionista de uma empresa associada ao grupo do banco. A renúncia de Peña foi precedida por protestos violentos contra o Ueno Bank, com manifestantes queimando pneus, lançando pedras e fazendo bombas. No exterior, a França enfrentou protestos massivos de 1,6 milhão de pessoas em 193 cidades, exigindo melhores salários e defendendo o direito à manifestação. O Papa Leão 14 realizará uma viagem à América do Sul, passando pelo Uruguai, Argentina e Peru, em meio a declínios do catolicismo na região, após ter passado por uma cirurgia no pulmão.\n\nA Coreia do Sul concluiu um transporte marítimo de cargas pela rota do Ártico, com apoio da Rússia, reduzindo em dez dias o tempo de viagem até a Europa. Este movimento geopolítico é visto com preocupação por potências europeias, que temem que esta rota alternativa possa enfraquecer esforços para isolar Moscou. Em desenvolvimento relacionado, Israel e os Estados Unidos intensificaram suas tensões, com a cidade de Providence votando a favor de divestir de investimentos que apoiam o que considera genocídio. Por outro lado, a administração de Taiwan decidiu fechar sua repartição em Papua-Nova Guiné. As tensões na região do Estreito de Ormuz continuam, com um parlamentar iraniano de alto escalão afirmando que o impasse não é sustentável e pedindo ao governo americano que levante o bloqueio naval. Além disso, a mídia estatal chinesa exibiu mísseis ICBM, alimentando especulações sobre testes nucleares, enquanto o governo da Coreia do Sul avança com a rota marítima alternativa no Ártico.", "economia": "A economia brasileira enfrenta desafios significativos, com a transição para o quarto mandato do presidente Lula marcada por impasses, especialmente em relação à reforma tributária. A confiança das grandes empresas do comércio em São Paulo atingiu o menor nível em dez anos, refletindo preocupações com juros elevados, vendas fracas e incertezas econômicas. O PIB do Brasil cresceu 3,4% em 2024, atingindo R$ 11,7 trilhões, conforme informado pelo IBGE, mas a divulgação detalhada do PIB anual definitivo está temporariamente suspensa. No cenário internacional, o mercado de trabalho dos Estados Unidos gerou 165 mil novos postos de trabalho em outubro, superando as expectativas. As ações tecnológicas da Nasdaq recuperaram-se após um dia de instabilidade. Além disso, o Banco Central do Paraguai anunciou regras para devolver dinheiro aos clientes do Ueno Bank, que entrou em colapso, enquanto o petróleo atingiu US$ 100 na sessão de negociação desta sexta-feira, mas caiu quase 2% em seguida.", "tecnologia": "A tecnologia e a inteligência artificial (IA) continuam sendo focos de interesse global, com destaque para ações legais e políticas em torno dessas tecnologias. A polícia de Kaohsiung prendeu um suspeito acusado de roubar dados relacionados à IA, enquanto a OpenAI continuará investindo em centros de dados de IA, apesar dos resultados das eleições. O Brasil também está se preparando para a corrida latino-americana de IA, embora ainda precise de mais previsibilidade para atrair investimentos. As empresas de IA estão adquirindo arquivos internos de outras empresas para treinar seus modelos, levantando questionamentos sobre privacidade. O Nubank suspendeu temporariamente as transferências diretas de criptomoedas, enquanto a GOPAX, uma exchange de criptomoedas sul-coreana, suspendeu as retiradas e as operações após ameaças de hacking. Além disso, a reputação e a IA estão ganhando peso no cenário empresarial, com o Google investindo em IA para melhorar a acessibilidade na educação no Brasil. O Brasil também aprovou um roteiro nacional para frear e reverter o desmatamento até 2030, enquanto a Tesla reduzirá a produção do Cybertruck e dedicará mais recursos à produção do Cybercab, um modelo de táxi autônomo.", "ciencia": "Os cientistas alcançaram um novo recorde de temperatura muito baixa na estação espacial Tiangong, criando condições ideais para estudar física quântica e novos estados de matéria. Isso pode levar ao desenvolvimento de novas gerações de experimentos em física quântica e a medições mais precisas no espaço. Além disso, um estudo com 352 mulheres associou a menopausa tardia a menos sinais de danos nos pequenos vasos sanguíneos do cérebro, relacionando a maior exposição ao estrogênio a menos danos nos vasos cerebrais. A NASA participará da Supercomputing 2026, no Booth #4038, com apresentações de especialistas da agência, discutindo modelos de Fortran 2028 e a combinação de versões diferentes de software. Por fim, os polvos adotam duas estratégias para passar por buracos minúsculos, variando a disposição dos braços e do corpo conforme a abertura se torna mais estreita, o que pode inspirar o desenvolvimento de robôs projetados para entrar em espaços confinados.", "cultura": "A cultura global registrou novidades importantes em diversos setores. Nota-se, em particular, a possível aquisição do Letterboxd pelo The New York Times por cerca de 1,7 bilhão de reais, em uma transação que envolve uma plataforma social voltada para cinéfilos. Outra novidade destacada é a atribuição do título de doutor honoris causa à escritora Conceição Evaristo pela UFRJ, em reconhecimento ao seu trabalho notável na literatura. O diretor de teatro Trevor Nunn dirigiu 'Speculations', uma peça de conspiração que explora teorias da conspiração sobre os Kennedys, incluindo Marilyn Monroe, em um contexto histórico específico. Entre outras notícias, a Netflix anunciou uma nova série relacionada a 'Stranger Things' e Keanu Reeves será o dublador de um filme de animação pré-sequência da franquia 'John Wick'.", "sociedade": "Um suspeito foi preso pela polícia suspeito de matar sua companheira a facadas em São Vicente, no litoral de São Paulo, após uma criança de 4 anos encontrar o corpo da mãe, vítima de feminicídio, e informar a polícia. No campo da saúde, a fome oculta, que se manifesta por falta de nutrientes, causa cerca de 50 mil mortes por ano na Alemanha, afetando principalmente as famílias mais carentes. Além disso, a Anvisa deve avaliar os riscos dos implantes hormonais sem ignorar as pacientes, uma vez que uma mulher não deve escolher entre o sofrimento da doença ou do tratamento quando há alternativas terapêuticas.", "meio_ambiente": "O super El Niño, que está em desenvolvimento rápido, está programado para atingir seu pico em dezembro, potencialmente afetando significativamente as temperaturas globais. Em outubro de 2026, São Paulo registrou o segundo outubro mais chuvoso desde 1995, com 220,3 mm de precipitação, 96,7% acima da média esperada. Por outro lado, a China registrou uma redução de 3,1% nas emissões de dióxido de carbono no terceiro trimestre de 2026, o maior decréscimo desde a pandemia de COVID-19. Ao mesmo tempo, a Indonésia aumentou suas metas climáticas, apesar das intensas queimadas que contradizem essa estratégia. Para proteger a biodiversidade, está sendo construído o maior viaduto para animais do mundo na Califórnia, que visa conectar habitats e proteger pumas isolados. A ACNUR alertou que quase 90 milhões de deslocados vivem em países altamente expostos à crise climática, com desastres climáticos causando mais de 255 milhões de deslocamentos internos durante a última década. Diante dessas preocupações ambientais, a pesquisa YouGov mostrou que a maioria das pessoas em seis países europeus apoia ações climáticas como plantio de árvores e impostos sobre emissões, mas se opõe a medidas que afetem significativamente sua vida, como taxas de combustível e viagens aéreas.", "direitos_humanos": "O governo de Hong Kong enfrenta críticas internacionais após condenar o ativista oposicionista Joshua Wong Chi-fung a mais 10 anos de prisão, totalizando 20 anos. Dez países, incluindo aliados da 'Five Eyes', pediram um fim imediato das 'prisões injustas' sob a lei de segurança nacional, criticando as 'ataques infundados' vindos de forças estrangeiras. Paralelamente, a Organização das Nações Unidas alerta para o risco de milhões de refugiados sudafricanos perderem o abrigo devido à escassez de fundos. Em território nacional, a Polícia Federal deflagrou uma operação em Pernambuco para investigar o tráfico humano envolvendo brasileiras que seriam enviadas para a Suíça, enquanto uma auxiliar de quarto foi sentenciada a cinco meses de prisão por abusar sexualmente de uma menor em casa."}, "resumo_do_dia": {"politica_nacional": [{"id": 248094, "titulo": "Ao vivo: governo divulga saldo de exportações e importações de outubro", "url": "https://www.poder360.com.br/poder-economia/ao-vivo-governo-divulga-saldo-de-exportacoes-e-importacoes-de-outubro/", "fonte_id": "poder360", "data_pub": "2026-11-06T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Desenvolvimento, Indústria e Comércio Exterior (MDIC) divulgou os dados consolidados de exportações e importações para outubro de 2023 às 15h desta sexta-feira, 3 de novembro.", "titulo_pt": "Governo divulga saldo de exportações e importações de outubro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 248073, "titulo": "Executiva do PDT aprova ingresso em federação com PRD, Solidariedade e Avante", "url": "https://www.cartacapital.com.br/cartaexpressa/executiva-do-pdt-aprova-ingresso-em-federacao-com-prd-solidariedade-e-avante/", "fonte_id": "cartacapital", "data_pub": "2026-11-06T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A executiva do PDT aprovou a entrada de sua legenda em uma federação com PRD, Solidariedade e Avante. A cúpula da sigla também decidiu apoiar a inclusão do PSB na união de partidos, o que ainda depende da aprovação do TSE.", "titulo_pt": "Executiva do PDT aprova ingresso em federação com PRD, Solidariedade e Avante", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 248096, "titulo": "Regulamentação do Redata fica para depois de viagem de Lula à COP", "url": "https://www.poder360.com.br/poder-energia/regulamentacao-do-redata-fica-para-depois-de-viagem-de-lula-a-cop/", "fonte_id": "poder360", "data_pub": "2026-11-06T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A secretária Miriam Belchior, da Casa Civil, informou que o governo já enviou diretrizes para a nova política relacionada a data centers. A regulamentação do Redata foi adiada para após a viagem do presidente Lula à COP.", "titulo_pt": "Regulamentação do Redata será adiada após viagem de Lula à COP", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 248042, "titulo": "Lula volta a defender responsabilidade nas contas e diz que será 'fiscal' de entregas do governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-volta-a-defender-responsabilidade-nas-contas-e-diz-que-sera-fiscal-de-entregas-do-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) reafirmou seu compromisso com a responsabilidade das contas públicas e anunciou que passará a acompanhar pessoalmente as entregas de suas ideias, cobrando o cumprimento dos prazos.", "titulo_pt": "Lula reafirma compromisso com responsabilidade fiscal e anuncia acompanhamento pessoal das entregas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248358, "titulo": "Desembargadora que autorizou bets a funcionarem compartilhou posts contra Lula e em defesa de Bolsonaro", "url": "https://www.jota.info/justica/desembargadora-que-autorizou-bets-a-funcionarem-compartilhou-posts-contra-lula-e-em-defesa-de-bolsonaro", "fonte_id": "jota", "data_pub": "2026-11-06T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma desembargadora que autorizou a realização de apostas esportivas compartilhou publicações contra Lula e a favor de Bolsonaro. Ela também afirmou no Facebook que 'não há governo mais corrupto do que os do PT'.", "titulo_pt": "Desembargadora que permitiu bets compartilhou posts contra Lula e em defesa de Bolsonaro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 248097, "titulo": "Leia as notas divulgadas por Alexandre de Moraes sobre Vorcaro", "url": "https://www.poder360.com.br/poder-integras/leia-as-notas-divulgadas-por-alexandre-de-moraes-sobre-vorcaro/", "fonte_id": "poder360", "data_pub": "2026-11-06T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes negou ter interagido com o fundador do Banco Master, que está preso, em documentos de 44 páginas e em três notas.", "titulo_pt": "Leia as notas divulgadas por Alexandre de Moraes sobre Vorcaro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 248098, "titulo": "Brasil aprova mapas do caminho contra combustíveis fósseis e desmatamento", "url": "https://www.poder360.com.br/poder-governo/brasil-aprova-mapas-do-caminho-contra-combustiveis-fosseis-e-desmatamento/", "fonte_id": "poder360", "data_pub": "2026-11-06T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil aprovou mapas para a transição energética, incluindo ações contra combustíveis fósseis e desmatamento. Após um impasse na COP30, Lula enfatizou a necessidade de planos nacionais e a presidência brasileira elaborou roteiros internacionais para a transição energética.", "titulo_pt": "Brasil aprova mapas para a transição energética e combate ao desmatamento", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 248074, "titulo": "Eventos climáticos extremos atingem 83% das regiões turísticas do Brasil", "url": "https://www.cartacapital.com.br/sustentabilidade/eventos-climaticos-extremos-atingem-83-das-regioes-turisticas-do-brasil/", "fonte_id": "cartacapital", "data_pub": "2026-11-06T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade de Brasília (UnB) revela que eventos climáticos extremos afetaram 83% das regiões turísticas do Brasil. O estudo destaca que, embora o número de visitantes tenha aumentado, as medidas de prevenção aos impactos climáticos não foram suficientemente implementadas.", "titulo_pt": "Eventos climáticos extremos atingem 83% das regiões turísticas do Brasil", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 248185, "titulo": "Romário terá 20% do salário penhorado para pagamento de dívida a advogado", "url": "https://www.metropoles.com/celebridades/romario-tera-20-do-salario-penhorado-para-pagamento-de-divida-a-advogado", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romário, senador e ex-jogador, enfrenta processos na Justiça do Distrito Federal relacionados a dívidas de aluguel de uma mansão no Lago Sul.", "titulo_pt": "Romário terá 20% do salário penhorado para pagamento de dívida a advogado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248099, "titulo": "Lula critica a Globo e diz que imprensa ignora notícias boas do governo", "url": "https://www.poder360.com.br/poder-governo/lula-critica-a-globo-e-diz-que-imprensa-ignora-noticias-boas-do-governo/", "fonte_id": "poder360", "data_pub": "2026-11-06T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula criticou a Globo, afirmando que a imprensa evita divulgar resultados positivos do governo por medo de parecerem favoráveis demais. Ele alega que as notícias boas do governo são ignoradas pelos meios de comunicação.", "titulo_pt": "Lula critica a Globo por ignorar notícias boas do governo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 248200, "titulo": "Lula cita “seriedade fiscal” e descarta “pobre pagar a conta” de cortes", "url": "https://www.cnnbrasil.com.br/politica/lula-cita-seriedade-fiscal-e-descarta-pobre-pagar-a-conta-de-cortes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente citou a necessidade de 'seriedade fiscal' durante uma reunião do Conselho Nacional de Política Energética, rejeitando a ideia de que a população 'paga a conta' por meio de cortes.", "titulo_pt": "Lula defende 'seriedade fiscal' e descarta 'pobre pagar a conta' de cortes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 248100, "titulo": "Governo discutirá soluções para transformar resíduos em energia", "url": "https://www.poder360.com.br/poder-governo/governo-discutira-solucoes-para-transformar-residuos-em-energia/", "fonte_id": "poder360", "data_pub": "2026-11-06T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Política Energética (CNPE) aprovou a criação de um grupo de trabalho para discutir a transformação de resíduos em energia. O objetivo é encontrar soluções para o aproveitamento de materiais como fonte de energia.", "titulo_pt": "Governo discutirá soluções para transformar resíduos em energia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 248203, "titulo": "Debate sobre maioridade é relevante e exige “todo cuidado”, diz ministro", "url": "https://www.cnnbrasil.com.br/politica/debate-sobre-maioridade-e-relevante-e-exige-todo-cuidado-diz-ministro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Proposta de Emenda à Constituição (PEC) da Segurança Pública foi aprovada no Senado sem a emenda que tratava da redução da maioridade penal. O ministro afirmou que o presidente discutirá o assunto com lideranças no Congresso.", "titulo_pt": "Debate sobre maioridade é relevante e exige ‘todo cuidado’, diz ministro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 248193, "titulo": "No DF, mais de 82 mil candidatos vão fazer as provas do Enem 2026", "url": "https://www.metropoles.com/distrito-federal/no-df-mais-de-82-mil-candidatos-vao-fazer-as-provas-do-enem-2026", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 82 mil candidatos farão as provas do Enem 2026 no Distrito Federal. Dos inscritos, 42.127 tiveram direito à gratuidade e 40.142 pagaram a taxa de inscrição.", "titulo_pt": "Mais de 82 mil candidatos farão as provas do Enem 2026 no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248205, "titulo": "Maria do Carmo é alvo de buscas após caso envolvendo adversário no AM", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/maria-do-carmo-e-alvo-de-buscas-apos-caso-envolvendo-adversario-no-am/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maria do Carmo, ex-candidata do PL, está sendo investigada por suspeita de envolvimento em uma publicação com uma montagem envolvendo a filha adolescente de Omar Aziz, candidato do PSD. Buscas foram realizadas em relação a ela.", "titulo_pt": "Maria do Carmo é alvo de buscas após caso envolvendo adversário no AM", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 248194, "titulo": "A expectativa da cúpula da PF para a recriação do Ministério da Segurança", "url": "https://www.metropoles.com/colunas/igor-gadelha/a-expectativa-da-cupula-da-pf-para-a-recriacao-do-ministerio-da-seguranca", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula discutirá a recriação do Ministério da Segurança durante uma reunião com dois ministros do governo na sexta-feira (6/11).", "titulo_pt": "Expectativa de reunião sobre recriação do Ministério da Segurança", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 248738, "titulo": "Taiwan to activate NSF amid stock rout", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/07/2003867305", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan está prestes a ativar o Fundo de Estabilização de Mercado de Valores Mobiliários (NSF) em resposta à queda significativa nos mercados de ações.", "titulo_pt": "Taiwan ativará fundo de estabilização de mercado de ações", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 248740, "titulo": "Taiwan to close its office in Papua New Guinea", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/07/2003867307", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A repartição de Taiwan em Papua-Nova Guiné será fechada. Esta decisão foi anunciada pela administração taiwanesa.", "titulo_pt": "Taiwan fechará sua repartição em papua-nova Guiné", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 248744, "titulo": "Japan accelerating defense buildup: report", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867316", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatório indica que o Japão está acelerando o aumento de suas forças militares. O país estaria intensificando suas atividades de defesa de maneira significativa.", "titulo_pt": "Japão acelerando aumento das forças militares: relatório", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 248222, "titulo": "Como a quebra do banco Ueno, no Paraguai, acabou com o governo do presidente Santiago Peña", "url": "https://apublica.org/2026/11/como-a-quebra-do-banco-ueno-no-paraguai-acabou-com-o-governo-do-presidente-santiago-pena/", "fonte_id": "agencia_publica", "data_pub": "2026-11-06T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A quebra do banco Ueno, no Paraguai, resultou no fim do governo do presidente Santiago Peña. O crescimento do Ueno contou com ajuda política e uso de dinheiro público, e o presidente era acionista de uma empresa associada ao grupo do banco.", "titulo_pt": "Como a falência do banco Ueno, no Paraguai, levou ao fim do governo de Santiago Peña", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 248401, "titulo": "After Israel’s Election, Who Will Get the First Chance to Form a Government?", "url": "https://www.nytimes.com/2026/11/06/world/middleeast/israel-election-government-herzog.html", "fonte_id": "nyt_world", "data_pub": "2026-11-06T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Isaac Herzog está prestes a nomear alguém para tentar formar um governo após duas dias de negociações com líderes de partidos e funcionários, em virtude de uma eleição inconclusiva.", "titulo_pt": "Depois das eleições em Israel, quem formará o governo?", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 248329, "titulo": "Jubilaciones: un fallo declara inconstitucional la ley de movilidad de Alberto Fernández, pero dispone un efecto limitado", "url": "https://www.lanacion.com.ar/economia/jubilaciones-un-fallo-declara-inconstitucional-la-ley-de-movilidad-de-alberto-fernandez-pero-dispone-nid06112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma sentença de segunda instância em Buenos Aires declarou inconstitucional a lei de movimentação das aposentadorias de Alberto Fernández, mas ordenou uma reparação a partir de uma data específica e não abrangendo todo o período. O caso se refere a antecedentes sobre o tema das aposentadorias.", "titulo_pt": "Aposentadorias: um _pt": "PL persiste na corrida pela Câmara mesmo com candidatura de aliado de Nunes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248271, "titulo": "Hegseth sob pressão após fiasco republicano nas eleições dos EUA", "url": "https://www.dw.com/pt-br/hegseth-sob-pressão-após-fiasco-republicano-nas-eleições-dos-eua/a-79878899?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-06T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A oposição democrata já prepara ações contra Pete Hegseth, que obteve maioria no Congresso. Republicanos culpam Hegseth por sua role na guerra no Irã e por ter sido um dos principais incentivadores dessa ação.", "titulo_pt": "Hegseth sob pressão após fiasco republicano nas eleições dos EUA", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 248688, "titulo": "Domani la Francia di nuovo in piazza, polizia schierata al massimo con 70.000 agenti", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/06/domani-la-francia-di-nuovo-in-piazza-polizia-schierata-al-massimo-con-70.000-agenti_54f29a27-d4a4-4ccb-9ec3-df97a2ff6747.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-06T17:29:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A França estará novamente nas ruas amanhã, com a polícia posicionada em força com 70.000 agentes. O ministro do Interior alertou sobre apelos nas redes sociais para violência, bloqueios e insurreição.", "titulo_pt": "A França de novo nas ruas, policiais em força com 70.000 agentes", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 248268, "titulo": "Santiago Peña não comparece a sessão sobre impeachment no Congresso do Paraguai", "url": "https://www.bbc.com/portuguese/articles/c5x2vvxw8m04o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-06T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Santiago Peña não compareceu à sessão sobre impeachment na economia", "url": "https://www.jota.info/opiniao-e-analise/artigos/jota-principal-transicao-para-4o-mandato-de-lula-e-marcada-por-impasses-na-economia-2", "fonte_id": "jota", "data_pub": "2026-11-06T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A transição para o quarto mandato do presidente Lula está enfrentando dificuldades econômicas, com destaque para a pressão por adiamento da reforma tributária e ajustes nas contas públicas.", "titulo_pt": "Transição para 4º mandato de Lula enfrenta impasses econômicos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 248107, "titulo": "Confiança das grandes empresas do comércio cai ao menor nível em dez anos", "url": "https://veja.abril.com.br/economia/confianca-das-grandes-empresas-do-comercio-cai-ao-menor-nivel-em-dez-anos/", "fonte_id": "veja", "data_pub": "2026-11-06T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A confiança das grandes empresas do comércio em São Paulo atingiu o menor nível em dez anos, de acordo com uma pesquisa da FecomercioSP. O otimismo dessas empresas caiu 8,2% devido a juros elevados, vendas fracas e incertezas econômicas.", "titulo_pt": "Confiança das grandes empresas do comércio atinge nível mais baixo em dez anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 248331, "titulo": "Tras inflación de octubre la UF llegará a $41.500 y anotará nuevo récord", "url": "https://www.latercera.com/pulso/noticia/tras-inflacion-de-octubre-la-uf-superara-los-41500-y-anotara-nuevo-record/", "fonte_id": "la_tercera", "data_pub": "2026-11-06T17:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Unidade de Fomento (UF) aumentará em R$206,48, atingindo um novo recorde máximo de R$41.501,94 em 9 de dezembro. Este valor supera o máximo anterior registrado em 9 de novembro, quando a UF estava em R$41.295,46.", "titulo_pt": "Depois da inflação de outubro, a UF atingirá r$41.500 e registrar novo recorde", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 248043, "titulo": "Novo leilão do Banco Master tem chopeira, adega e TV gigante dos escritórios de Vorcaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/novo-leilao-do-banco-master-tem-chopeira-adega-e-tv-gigante-dos-escritorios-de-vorcaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O leilão online do Banco Master, pertencente a Daniel Vorcaro, está disponível para lances prévios a partir desta sexta-feira (6) na Kwara. São 250 lotes com valores variando de R$ 20 a R$ 60,2 mil, encerrando no dia 30 de novembro às 13h30.", "titulo_pt": "Novo leilão do Banco Master tem chopeira, adega e TV gigante dos escritórios de Vorcaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248044, "titulo": "Febrafite propõe manter reforma tributária em janeiro, mas sem multas relacionadas à adaptação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/febrafite-propoe-manter-reforma-tributaria-em-janeiro-mas-sem-multas-relacionadas-a-adaptacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes dos auditores fiscais estaduais sugerem manter o cronograma da reforma tributária para janeiro de 2027, mas propõem um prazo de 180 dias sem aplicação de multas punitivas para adaptação ao novo sistema.", "titulo_pt": "Febrafite sugere manter reforma tributária em janeiro, mas sem multas de adaptação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248210, "titulo": "Nubank e Mercado Pago suspendem operações de criptomoedas; entenda", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/nubank-e-mercado-pago-suspendem-operacoes-de-criptomoedas-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank e a Mercado Pago suspenderam temporariamente as operações relacionadas a criptomoedas devido a instabilidades recentes que afetaram outras corretoras de ativos digitais.", "titulo_pt": "Nubank e Mercado Pago suspendem operações de criptomoedas; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 248046, "titulo": "Assaí relata alta nas vendas após veto às bets e mira expansão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/assai-relata-alta-nas-vendas-apos-veto-as-bets-e-mira-expansao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Assaí registrou um impacto positivo nas vendas após o governo de Lula proibir as bets. O CEO da empresa, Belmiro Gomes, mencionou essa percepção durante a teleconferência de resultados do terceiro trimestre.", "titulo_pt": "Assaí registra alta nas vendas após veto às bets e planeja expansão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248221, "titulo": "PIB do Brasil cresce 3,4% em 2024 e atinge R$ 11,7 trilhões, segundo IBGE", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/pib-brasileiro-cresceu-34-em-2024-totalizando-r-117-tri-mostram-dados-definitivos-do-ibge/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T16:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PIB do Brasil cresceu 3,4% em 2024, atingindo R$ 11,7 trilhões, conforme informou o IBGE. A divulgação detalhada do PIB anual definitivo está temporariamente suspensa, mantendo-se apenas estimativas agregadas devido à transição para a nova base 2021.", "titulo_pt": "PIB do Brasil cresce 3,4% em 2024 e atinge R$ 11,7 trilhões, informa IBGE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 248048, "titulo": "Four Seasons volta a São Paulo com hotel e residências de luxo em projeto de R$ 1 bilhão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/four-seasons-volta-a-sao-paulo-com-hotel-e-residencias-de-luxo-em-projeto-de-r-1-bilhao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T15:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rede hoteleira Four Seasons está retornando a São Paulo com um projeto de luxo no Itaim Bibi, zona oeste da capital, em parceria com a Catuaí Real Estate e a Iguatemi. O empreendimento incluirá hotelaria, residências, gastronomia e bem-estar, com um investimento estimado em R$ 1 bilhão.", "titulo_pt": "Four Seasons retorna a São Paulo com hotel e residências de luxo em projeto de R$ 1 bilhão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248653, "titulo": "US stocks rebound after tech rout", "url": "https://www.ft.com/content/642b32dc-e3a1-4df8-ae91-5c84bdeb89e0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações tecnológicas da Nasdaq recuperaram-se durante a sessão da manhã após um dia de instabilidade.", "titulo_pt": "Ações tecnológicas dos EUA se recuperam após dia de turbulência", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 248051, "titulo": "Bolsas do Japão têm maior queda desde tarifas de Trump; Coreia do Sul aciona circuit breaker", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/bolsas-do-japao-tem-maior-queda-desde-tarifas-de-trump-coreia-do-sul-aciona-circuit-breaker.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T15:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações japonesas sofreram a maior queda em um único pregão desde abril de 2025, quando Donald Trump anunciou as tarifas. Na Coreia do Sul, a forte desvalorização das ações de tecnologia acionou o circuit breaker por 20 minutos.", "titulo_pt": "Bolsas do Japão têm maior queda desde tarifas de Trump; Coreia do Sul aciona circuit breaker", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248654, "titulo": "US economy outstrips forecasts to add 165,000 jobs in October", "url": "https://www.ft.com/content/f84c722c-99a9-4628-84dc-c42a192cb35c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T15:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de trabalho americano gerou 165.000 postos de trabalho em outubro, superando as expectativas. O aumento foi liderado pelo setor de serviços profissionais, indicando a força do mercado de trabalho americano.", "titulo_pt": "Economia dos EUA excede projeções ao criar 165.000 postos de trabalho em outubro", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 248053, "titulo": "Brasil tem que afastar gargalos para não perder liderança em renováveis, diz presidente de aliança global", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/c-level-entrevista/2026/11/brasil-tem-que-afastar-gargalos-para-nao-perder-lideranca-em-renovaveis-diz-presidente-de-alianca-global.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da Aliança Global pelas Energias Renováveis, Ben Backwell, alerta que o Brasil não está aproveitando as oportunidades de crescimento do mercado de energias renováveis. Hoje, a expansão está sendo liderada pela Ásia.", "titulo_pt": "Brasil precisa se afastar de gargalos para não perder liderança em renováveis, diz presidente de aliança global", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248362, "titulo": "Empregador não arca integralmente com recomposição da reserva de plano de previdência, diz STJ", "url": "https://www.jota.info/justica/empregador-nao-arca-integralmente-com-recomposicao-da-reserva-de-plano-de-previdencia-diz-stj", "fonte_id": "jota", "data_pub": "2026-11-06T14:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) decidiu que o empregador não é responsável pela integral recomposição da reserva de plano de previdência. No caso específico, o Banco do Brasil é responsável apenas pela recomposição da cota patronal.", "titulo_pt": "Empregador não arca integralmente com recomposição da reserva de plano de previdência, decide STJ", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 248054, "titulo": "O banco digital que se tornou símbolo de ostentação no Paraguai entrou em colapso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/o-banco-digital-que-se-tornou-simbolo-de-ostentacao-no-paraguai-entrou-em-colapso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T14:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ueno Bank, um banco digital que se tornou uma presença significativa no Paraguai, atende 2,9 milhões de paraguaios, quase dois terços da população adulta, mesmo tendo recebido sua licença bancária apenas em 2023. O banco patrocina diversos eventos e atividades, incluindo futebol, música e feiras de artesanato, mas agora está em colapso.", "titulo_pt": "Banco digital que se tornou símbolo de ostentação no Paraguai entra em colapso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 248745, "titulo": "Police arrest man over AI data theft in Kaohsiung", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867317", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Kaohsiung prendeu um homem suspeito de roubar dados relacionados à inteligência artificial.", "titulo_pt": "Polícia prende homem por suposto roubo de dados de IA em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 248769, "titulo": "Kobo will soon let you upload and sync your own ebooks across devices, for a price", "url": "https://www.theverge.com/tech/1028715/kobo-stack-cloud-sync-ebooks-epub-pdf-email-files", "fonte_id": "the_verge", "data_pub": "2026-11-06T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Kobo está lançando um novo serviço de assinatura mensal chamado Stack que permite aos usuários carregar seus próprios eBooks e documentos para servidores da empresa, onde eles serão sincronizados em múltiplos dispositivos e aplicativos, incluindo o progresso de leitura, marcações e anotações. O Stack é semelhante à função Send to Kindle da Amazon, que também permite o upload de conteúdo.", "titulo_pt": "Kobo permitirá que você carregue e sincronize seus próprios ebooks em vários dispositivos, por um custo", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 248596, "titulo": "OpenAI will keep investing in AI data centers despite election results, CFO tells CNBC", "url": "https://www.cnbc.com/2026/11/06/open-ai-data-centers-election.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-06T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar dos resultados das eleições, a OpenAI continuará investindo em centros de dados de inteligência artificial, conforme informou o CFO à CNBC. Eleitores do país expressaram apoio a candidatos que prometem estabelecer restrições ao desenvolvimento de centros de dados.", "titulo_pt": "Openai manterá investimentos em centros de dados de IA, diz CFO à CNBC", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 248199, "titulo": "O Brasil está pronto para disputar a corrida latino-americana da IA?", "url": "https://www.cnnbrasil.com.br/infra/o-brasil-esta-pronto-para-disputar-a-corrida-latino-americana-da-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil possui uma matriz elétrica de baixo carbono, o que lhe dá uma vantagem na corrida latino-americana pela infraestrutura de inteligência artificial. No entanto, o país ainda precisa oferecer mais previsibilidade para atrair investimentos.", "titulo_pt": "O Brasil está pronto para disputar a corrida latino-americana da IA?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 248773, "titulo": "Big Tech lost big in the 2026 election", "url": "https://www.theverge.com/podcast/1028731/2026-midterms-tech-ai-vergecast", "fonte_id": "the_verge", "data_pub": "2026-11-06T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na eleição de 2026, milhões de eleitores americanos votaram majoritariamente em favor dos Democratas e contra a inteligência artificial. O confronto contra as grandes tecnológicas está prestes a intensificar-se, especialmente em relação aos projetos de centrais de dados.", "titulo_pt": "Grandes tecnológicas perderam na eleição de 2026", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 248047, "titulo": "Reações negativas em relação à IA podem atrasar IPO da Anthropic, dizem potenciais investidores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/reacoes-negativas-em-relacao-a-ia-podem-atrasar-ipo-da-anthropic-dizem-potenciais-investidores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Potenciais investidores do IPO da Anthropic estão expressando preocupações sobre o impacto das reações negativas à IA na programação da empresa, o que pode atrasar a realização do IPO planejado para novembro.", "titulo_pt": "Reações negativas à IA podem atrasar IPO da Anthropic, dizem investidores potenciais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 248791, "titulo": "AI Companies Really, Really Want to Buy Your Work Files and Emails", "url": "https://www.wired.com/story/ai-companies-really-really-want-to-buy-your-work-files-and-emails/", "fonte_id": "wired", "data_pub": "2026-11-06T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de inteligência artificial estão adquirindo diversos arquivos internos das empresas para treinar seus modelos. Não todos estão satisfeitos com essa prática.", "titulo_pt": "Empresas de IA realmente querem comprar seus arquivos de trabalho e Emails", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 248775, "titulo": "This see-through camera lets photographers maintain eye contact with their subjects", "url": "https://www.theverge.com/tech/1028632/lutra-humans-of-authenticity-hoa-a1-transparent-digital-camera", "fonte_id": "the_verge", "data_pub": "2026-11-06T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup sul-coreana Lutra lançou uma nova marca chamada Humans of Authenticity (HOA) e apresentou uma câmera digital sem tela que inclui um grande visor aberto em seu design. A câmera lembra a Godox C100, mas a HOA A1 posiciona seu objetivo e sensor mais próximo do centro.", "titulo_pt": "Esta câmera transparente permite que os fotógrafos mantenham contato visual com seus sujeitos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 248281, "titulo": "Brian Chesky comanda o Airbnb de dia. De noite, toca um lab de AI", "url": "https://braziljournal.com/brian-chesky-comanda-o-airbnb-de-dia-de-noite-toca-um-lab-de-ai", "fonte_id": "brazil_journal", "data_pub": "2026-11-06T15:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brian Chesky, fundador e CEO do Airbnb, fundou um laboratório de inteligência artificial que ele está financiando com recursos próprios. Essa iniciativa levanta questionamentos sobre a capacidade de Chesky gerenciar duas empresas simultaneamente.", "titulo_pt": "Brian Chesky lidera o Airbnb durante o dia e financia um lab de IA à noite", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 248811, "titulo": "How Do You Land on a Moon With Almost No Gravity?", "url": "https://spectrum.ieee.org/mmx-mission-to-phobos", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-06T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em agosto do ano passado, a rover Perseverance, da NASA, registrou um eclipse solar causado pela passagem do satélite natural de Marte, Phobos, enquanto estava na superfície do planeta vermelho.", "titulo_pt": "Como você pousa em um satélite com quase nenhuma gravidade?", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 248719, "titulo": "What’s next after airlines? Asia data breach raises wider cyber fears", "url": "https://www.scmp.com/week-asia/politics/article/3373605/whats-next-after-airlines-asia-data-breach-raises-wider-cyber-fears", "fonte_id": "scmp", "data_pub": "2026-11-06T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande vazamento de dados afetou várias companhias aéreas asiáticas, levando analistas a alertarem para a necessidade de indústrias da região reexaminarem sua dependência de fornecedores terceiros. Eles advertiram que infraestruturas mais críticas podem ser afetadas no futuro.", "titulo_pt": "O que vem depois das companhias aéreas? Brecha de dados na ásia aciona alerta sobre segurança cibernética", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 248792, "titulo": "RIP Cybertruck. You Were Unloved, Unwanted, and Utterly Absurd", "url": "https://www.wired.com/story/rip-cybertruck-you-were-unloved-unwanted-and-utterly-absurd/", "fonte_id": "wired", "data_pub": "2026-11-06T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção do Cybertruck, pickup da Tesla que gerou controvérsia, foi interrompida, marcando o fim de um erro.", "titulo_pt": "Adeus Cybertruck. Você foi desamado, desconhecido e incrívelmente atolo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 248133, "titulo": "Brasil tem 2,1 milhões de influenciadores: o que o profissional de marketing precisa saber", "url": "https://exame.com/carreira/brasil-tem-21-milhoes-de-influenciadores-o-que-o-profissional-de-marketing-precisa-saber/", "fonte_id": "exame", "data_pub": "2026-11-06T14:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento da Influency.me indica que o Brasil terá 2,1 milhões de influenciadores em 2025, representando um aumento de 8% em comparação com o atual cenário. Outras fontes estimam um número maior, chegando a 3,8 milhões ou mais, mas a diferença entre esses números está na metodologia utilizada.", "titulo_pt": "Brasil terá 2,1 milhões de influenciadores em 2025, segundo levantamento", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 248135, "titulo": "Você sabe o que a IA diz sobre você?", "url": "https://exame.com/marketing/voce-sabe-o-que-a-ia-diz-sobre-voce/", "fonte_id": "exame", "data_pub": "2026-11-06T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reputação tem valor, e agora a inteligência artificial pode organizar rapidamente os sinais que levam anos para serem construídos.", "titulo_pt": "Você sabe o que a IA diz sobre você?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 248724, "titulo": "Tesla’s Musk pulls plug on Cybertruck for robotaxi push after years of poor sales", "url": "https://www.scmp.com/news/world/united-states-canada/article/3373598/teslas-musk-pulls-plug-cybertruck-robotaxi-push-after-years-poor-sales", "fonte_id": "scmp", "data_pub": "2026-11-06T13:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tesla reduzirá a produção do Cybertruck na fábrica de Texas a partir do meio de 2027, conforme anunciado pelo CEO Elon Musk. A empresa dedicará mais recursos à produção do Cybercab, um modelo de táxi autônomo que Musk tem priorizado devido a baixas vendas do Cybertruck.", "titulo_pt": "Musk suspende produção do Cybertruck para focar no cybercab", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 248763, "titulo": "The Download: a humanoid cleans house and Samsung builds for the AI boom", "url": "https://www.technologyreview.com/2026/11/06/1148154/the-download-humanoid-robot-cleaner-samsung-ai-chip-boom/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-06T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um robô humanoide foi visto limpando uma residência, proporcionando uma visão do futuro. A Samsung está se preparando para o boom de inteligência artificial.", "titulo_pt": "Download: um robô humanoide limpa a casa e a Samsung se prepara para a era da IA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 248813, "titulo": "SynFit guides enzyme engineering by balancing several useful traits at once", "url": "https://phys.org/news/2026-11-synfit-enzyme-traits.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enzimas são químicos biológicos que auxiliam na construção, quebra e rearranjo de moléculas de maneira rápida e precisa. A engenharia enzimática consiste em modificar enzimas, testar as mudanças e selecionar versões que performem melhor, permitindo que enzimas realizem reações que não foram evoluídas para fazer.", "titulo_pt": "Synfit direciona a engenharia enzimática ao equilibrar várias características úteis ao mesmo tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248814, "titulo": "'I heard a barnacle'—how paying attention to nature's background noise can reveal animal secrets", "url": "https://phys.org/news/2026-11-heard-barnacle-paying-attention-nature.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor passou quatro dias na Península de Olympic, na Washington, observando diversos animais, incluindo uma marmota olympica, quatro espécies de abelhas-trabalhadoras, três espécies de caranguejos-hermítos e cinco orcas. Qualquer um desses animais poderia ter sido o ponto alto da viagem.", "titulo_pt": "Eu ouvi um casca-grossa — como prestar atenção ao som de fundo da natureza pode revelar segredos dos animais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248838, "titulo": "STAT+: Democrats’ midterm landslide spells relief for hospitals", "url": "https://www.statnews.com/2026/11/06/why-democrats-midterm-landslide-helps-hospital-industry/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-06T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas podem se concentrar em reverter cortes no Medicaid e expandir a cobertura de seguros, beneficiando provavelmente os provedores de saúde.", "titulo_pt": "Ganho expressivo dos democratas nas eleições intercalares promete alívio para hospitais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 248815, "titulo": "Vibrating mirrors of light create analog of a black hole event horizon", "url": "https://phys.org/news/2026-11-vibrating-mirrors-analog-black-hole.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cavidades ópticas são pares de espelhos que capturam luz e são fundamentais para o funcionamento de lasers, relógios atômicos e diversos sensores precisos. Embora algumas teorias prevejam que, se a distância entre os espelhos for alterada rapidamente, as ondas dentro deles se agrupem em pulsos intensos e curtos, essa previsão ainda não foi testada diretamente.", "titulo_pt": "Espelhos vibrantes de luz criam analogia da horizonte de eventos de um buraco negro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248816, "titulo": "The John Lewis Christmas ad captures the deep need for grandmothers", "url": "https://phys.org/news/2026-11-john-lewis-christmas-ad-captures.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor aprecia o anúncio de Natal da John Lewis, como acontece anualmente. Este ano, destaca-se a presença central de uma avó no comercial.", "titulo_pt": "Anúncio de natal da John Lewis destaca a importância das avós", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248182, "titulo": "Menopausa tardia é associada a menos danos nos vasos do cérebro em estudo", "url": "https://www.metropoles.com/saude/menopausa-tardia-e-associada-a-menos-danos-nos-vasos-do-cerebro-em-estudo", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 352 mulheres associou a menopausa tardia a menos sinais de danos nos pequenos vasos sanguíneos do cérebro. A maior exposição ao estrogênio foi relacionada a menos danos nos vasos cerebrais.", "titulo_pt": "Menopausa tardia associada a menos danos nos vasos do cérebro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248817, "titulo": "Atom-scale model could help improve material growth for advanced electronics", "url": "https://phys.org/news/2026-11-atom-scale-material-growth-advanced.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade do Pensilvânia aperfeiçoaram um modelo atômico que explora como o silício carbeto se transforma em vapor durante a formação de cristais. Este avanço pode auxiliar na produção de materiais de maior qualidade para eletrônicos avançados, minimizando experimentos caros e empíricos.", "titulo_pt": "Modelo atômico refinado pode ajudar na produção de materiais para eletrônicos avançados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248818, "titulo": "States tax sports betting heavily, but gamblers may barely feel it", "url": "https://phys.org/news/2026-11-states-tax-sports-heavily-gamblers.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aposta em esportes cresceu exponencialmente desde 2018, após uma decisão do Supremo Tribunal Federal que derrubou a proibição federal. Anualmente, os americanos apostam mais de 165 bilhões de dólares em esportes, fazendo com que o setor seja maior que os loterias estatais, excluindo mercados de previsão como o Kalshi e o Polymarket.", "titulo_pt": "Estados taxam pesadamente a aposta esportiva, mas jogadores podem não perceber", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248839, "titulo": "Democrats’ midterm victory, and a questionable fertility procedure", "url": "https://www.statnews.com/2026/11/06/readout-loud-podcast-midterm-elections-fertility-ivf-mrt-therapy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-06T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resultado das eleições de meia legislatura pode impactar a política de preços de medicamentos. Além disso, muitas mulheres estão viajando para clínicas de fertilidade no exterior.", "titulo_pt": "Vitória democrata nas eleições de meia legislatura e o aumento do turismo para clínicas de fertilidade no exterior", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 248488, "titulo": "The decency was the point", "url": "https://www.vox.com/politics/509733/cruelty-decency-midterms-maga-trump-vivek-trans-bullying-talarico-hamilton", "fonte_id": "vox", "data_pub": "2026-11-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições de 2026 foram vistas como um confronto entre decência e crueldade. Durante quase uma década, o tom dominante foi marcado por bullying, culpabilização e maldade geral.", "titulo_pt": "A decência foi o ponto", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 248819, "titulo": "Scientists achieve record-breaking low temperature on China's space station, paving the way for new physics experiments", "url": "https://phys.org/news/2026-11-scientists-temperature-china-space-station.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses conseguiram um novo recorde de temperatura muito baixa a bordo da estação espacial Tiangong, criando condições ideais para estudar física quântica e novos estados de matéria. Este avanço pode levar ao desenvolvimento de novas gerações de experimentos em física quântica e medições precisas no espaço.", "titulo_pt": "Cientistas chineses estabelecem novo recorde de temperatura baixa na estação espacial tiangong, abrindo caminho para novos experimentos em física quântica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248820, "titulo": "Evolutionary history and genetic basis of spruce diversification revealed", "url": "https://phys.org/news/2026-11-evolutionary-history-genetic-basis-spruce.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A genêra Picea (abeto) é amplamente distribuída no Hemisfério Norte e é componente dominante de florestas boreais e montanhosas. Entender os processos evolutivos que moldaram a diversificação e a diferenciação regional na genêra requer uma filogenia bem resolvida de Picea, mas a história evolutiva de Picea tem sido obscura devido a sinais genéticos conflitantes.", "titulo_pt": "História evolutiva e base genética da diversificação do abeto reveladas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248920, "titulo": "Giant exoplanet emerges from the dark when the James Webb Space Telescope turns out the starlight", "url": "https://www.space.com/astronomy/exoplanets/giant-exoplanet-emerges-from-the-dark-when-the-james-webb-space-telescope-turns-out-the-starlight", "fonte_id": "space_com", "data_pub": "2026-11-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos filtraram a luz estelar nas observações do Telescópio Espacial James Webb para visualizar um exoplaneta gigante em meio à escuridão.", "titulo_pt": "Grande exoplaneta emerge da escuridão quando o telescópio espacial James Webb apaga a luz estelar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 248821, "titulo": "Researchers establish G0 founder population carrying targeted mutations in marine mollusks", "url": "https://phys.org/news/2026-11-g0-founder-population-mutations-marine.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores estabeleceram uma população fundadora G0 de moluscos marinhos que carregam mutações alvo através da edição genômica. No entanto, o avanço na edição genômica na aquicultura avançou rapidamente, enquanto o progresso em moluscos marinhos tem sido mais lento devido ao desafio de criar um grupo fundador G0 viável mantendo os poucos larvas editadas até a metáforose.", "titulo_pt": "Pesquisadores estabelecem população fundadora G0 de moluscos marinhos com mutações alvo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248822, "titulo": "Technique that spots tRNAs in action could accelerate drug development for inherited diseases", "url": "https://phys.org/news/2026-11-technique-trnas-action-drug-inherited.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A técnica que identifica tRNAs em ação pode acelerar o desenvolvimento de medicamentos para doenças hereditárias. As tRNAs são pequenas moléculas que leem o código genético três letras por vez e trazem os aminoácidos correspondentes ao aparelho de síntese de proteínas, o ribossomo.", "titulo_pt": "Técnica que identifica trnas em ação pode acelerar desenvolvimento de medicamentos para doenças hereditárias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 248215, "titulo": "Nave registra imagem inédita de asteroide antes de ser jogada intencionalmente para colidir com rocha em teste para alterar sua órbita", "url": "https://www.cnnbrasil.com.br/ciencia/nave-registra-imagem-inedita-de-asteroide-antes-de-ser-jogada-intencionalmente-para-colidir-com-rocha-em-teste-para-alterar-sua-orbita/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A espaçonave registrou uma imagem inédita de um asteroide a cerca de 60 quilômetros de distância. O sistema é composto por dois asteroides: Didymos e Dimorphos. Este teste visa alterar a órbita de Dimorphos através de uma colisão intencional.", "titulo_pt": "Nave registra imagem inédita de asteroide antes de colisão para testar alteração de órbita", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 248017, "titulo": "New York Times avança na compra de rede social de filmes Letterboxd por R$ 1,7 bilhão", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/new-york-times-avanca-na-compra-de-rede-social-de-filmes-letterboxd-por-r-17-bilhao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-06T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O The New York Times está em negociações para adquirir o Letterboxd, uma rede social voltada para cinéfilos, por aproximadamente R$ 1,7 bilhão. Ainda não há acordo fechado.", "titulo_pt": "The new York Times avança na compra de rede social de filmes Letterboxd por R$ 1,7 bilhão", "veiculo": "Folha de S.Paulo - Il
