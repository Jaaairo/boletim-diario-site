vai investigar show sem alvará de Natanzinho Lima em Paraisópolis (SP)", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/mp-vai-investigar-show-sem-alvara-de-natanzinho-lima-em-paraisopolis-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público vai investigar um show realizado em Paraisópolis, zona Sul de São Paulo, que não possuía alvará. O procedimento vai avaliar as condições de segurança e a ausência de autorizações para um evento que poderia ter atraído até 50 mil pessoas.", "titulo_pt": "MP vai investigar show sem alvará de Natanzinho Lima em Paraisópolis (SP)", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 252564, "titulo": "Homem morre e mulher fica ferida após ataque com arma branca em bar de SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/homem-morre-e-mulher-fica-ferida-apos-ataque-com-arma-branca-em-bar-de-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi morto e uma mulher ficou ferida após um ataque com arma branca em um bar na avenida Nove de Julho, região da Bela Vista, na manhã desta segunda-feira (9). A Polícia Civil está investigando o caso.", "titulo_pt": "Homem morre e mulher fica ferida após ataque com arma branca em bar de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 252652, "titulo": "Massacre põe em xeque sensação de segurança na Polônia", "url": "https://www.dw.com/pt-br/massacre-põe-em-xeque-sensação-de-segurança-na-polônia/a-79900997?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-09T16:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque executado por um polonês em Cracóvia deixou seis mortos e 15 feridos, abalando a sensação de segurança no país. Apesar do medo, a cidade turística pretende manter suas atividades abertas.", "titulo_pt": "Massacre questiona sensação de segurança na Polônia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 251621, "titulo": "Sin jóvenes conectados, no hay futuro para el campo", "url": "https://www.clarin.com/rural/jovenes-conectados-futuro-campo_0_0l7ZnbadeH.html", "fonte_id": "clarin", "data_pub": "2026-11-09T09:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A falta de jovens na agricultura nas áreas rurais leva a uma perda de geração capaz de adotar tecnologias modernas. Somente 63% da população nas zonas rurais utiliza internet.", "titulo_pt": "Sem jovens conectados, não há futuro para o campo", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 251701, "titulo": "Mujer muere tras ser baleada frente a recinto asistencial en Pedro Aguirre Cerda", "url": "https://www.latercera.com/nacional/noticia/mujer-muere-tras-ser-baleada-frente-a-recinto-asistencial-en-pedro-aguirre-cerda/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma mulher morreu após ser baleada em frente a um estabelecimento assistencial em Pedro Aguirre Cerda. Os agressores fugiram em uma motocicleta.", "titulo_pt": "Mulher morre após ser baleada em frente a estabelecimento assistencial em Pedro Aguirre Cerda", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 251969, "titulo": "Senegal: Dakar surf school helps young Africans reclaim the waves", "url": "https://www.euronews.com/video/2026/11/09/senegal-dakar-surf-school-helps-young-africans-reclaim-the-waves", "fonte_id": "euronews", "data_pub": "2026-11-09T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Dakar, uma escola de surfe está tornando as ondas acessíveis a crianças locais. O fundador Ibra Samb, que aprendeu a surfar em plástico laminado, espera inspirar uma nova geração.", "titulo_pt": "Senegal: escola de surfe em dakar ajuda jovens africanos a dominar as ondas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 252176, "titulo": "For Korean moms, time off depends on where they work", "url": "https://www.koreaherald.com/article/10931011", "fonte_id": "korea_herald", "data_pub": "2026-11-09T07:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim, uma funcionária de 37 anos em Seul que espera seu segundo filho em janeiro, notou que é mais fácil tirar um dia de folga quando seu filho precisa dela. Park, uma moradora de Seul com um filho de dois anos, também se sente mais à vontade com as novas políticas de licença parental.", "titulo_pt": "Para mães coreanas, as férias dependem do local de trabalho", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 252205, "titulo": "A doctor was murdered in South Korea. 8 years on, ‘nothing has changed’", "url": "https://www.scmp.com/week-asia/health-environment/article/3373762/doctor-was-murdered-south-korea-8-years-nothing-has-changed", "fonte_id": "scmp", "data_pub": "2026-11-09T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um psiquiatra foi morto em Seul, Coreia do Sul, há quase oito anos, levando à aprovação de uma lei que aumentou as penas para agressões a profissionais de saúde. No entanto, um ataque recente em um hospital da capital fez os médicos questionarem a segurança inadequada ainda existente nos hospitais do país.", "titulo_pt": "Médico foi morto na Coreia do sul há 8 anos; 'nada mudou'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 253091, "titulo": "Nuclear would slow down net zero transition: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/10/2003867475", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos afirmam que a adoção de tecnologias nucleares retardaria o processo de transição para um equilíbrio de zero em termos de emissões de carbono.", "titulo_pt": "Nuclear dificilmente aceleraria a transição para o equilíbrio de zero: grupos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 252521, "titulo": "‘O tempo está acabando’, alerta Johan Rockström sobre o futuro da Amazônia", "url": "https://veja.abril.com.br/agenda-verde/o-tempo-esta-acabando-alerta-johan-rockstrom-sobre-o-futuro-da-amazonia/", "fonte_id": "veja", "data_pub": "2026-11-09T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O climatologista Johan Rockström alerta para o acelerado aquecimento global e o risco de transformações irreversíveis na Amazônia brasileira.", "titulo_pt": "O tempo está se esgotando", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 252675, "titulo": "COP31 começa sob alerta de que 2026 pode ser ano mais quente da história", "url": "https://www.bbc.com/portuguese/articles/cwgkvk10rpk3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-09T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na abertura da COP31, cientistas preveem que este pode ser o ano mais quente já registrado. O evento alerta para a possibilidade de 2026 ser o ano mais quente da história.", "titulo_pt": "COP31 começa sob alerta de que 2026 pode ser o ano mais quente da história", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 252470, "titulo": "Agronegócio amplia perdas com mudanças climáticas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/prejuizos-com-eventos-climaticos-extremos-sobem-67-no-primeiro-semestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T12:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os prejuízos causados por eventos climáticos extremos no agronegócio brasileiro aumentaram 67,4% no primeiro semestre de 2026, passando de R$ 31 bilhões para R$ 51,9 bilhões. O número de eventos extremos também dobrou, passando de 10 para 24 ocorrências.", "titulo_pt": "Agronegócio amplia perdas com mudanças climáticas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252627, "titulo": "No primeiro dia de COP31, Noruega investe R$ 350 mi no Fundo Amazônia", "url": "https://exame.com/esg/no-primeiro-dia-de-cop31-noruega-investe-r-350-mi-no-fundo-amazonia/", "fonte_id": "exame", "data_pub": "2026-11-09T12:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro dia da COP31, a Noruega investiu R$ 350 milhões no Fundo Amazônia. Este aporte demonstra o compromisso do país com a redução do desmatamento na Amazônia, que atingiu o menor nível desde 1988.", "titulo_pt": "No primeiro dia de COP31, Noruega investe R$ 350 mi no Fundo Amazônia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 252964, "titulo": "Gaza residents despair after torrential rains flood tens of thousands of makeshift shelters", "url": "https://www.lemonde.fr/en/international/article/2026/11/09/gaza-residents-despair-after-torrential-rains-flood-tens-of-thousands-of-makeshift-shelters_6775837_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T11:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cheia no Gaza revela o grau de destruição causado pela guerra israelense desde 7 de outubro de 2023. Israel continua a impedir a entrega de ajuda humanitária e materiais necessários para a reconstrução.", "titulo_pt": "Residentes do gaza desesperados após fortes chuvas inundaarem centenas de moradias improvisadas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 252834, "titulo": "Deadly floods hit Iraq as thunderstorms sweep across region", "url": "https://www.theguardian.com/environment/2026/nov/09/deadly-floods-iraq-thunderstorms-iran-portugal-japan-snow", "fonte_id": "guardian_world", "data_pub": "2026-11-09T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods hit o norte da Irak e partes da Irã, causando danos significativos a residências e empresas em Erbil. A chuva torrencial que caiu superou as previsões, resultando em pelo menos duas mortes.", "titulo_pt": "Inundações letais atingem o irak com tempestades violentas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 253003, "titulo": "Gaza storm kills five and leaves 70,000 displaced people's tents flooded", "url": "https://www.euronews.com/2026/11/09/storm-killed-five-in-gaza-as-sandstone-slab-collapsed-onto-tents", "fonte_id": "euronews", "data_pub": "2026-11-09T10:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um temporal em Gaza resultou em cinco mortes, incluindo três crianças e duas mulheres, e deixou 70.000 pessoas com suas tendas alagadas.", "titulo_pt": "Temporal em gaza mata cinco e deixa 70.000 pessoas com suas tendas alagadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 251479, "titulo": "Clima: chuvas e temporais atingem várias regiões do Brasil nesta 2ª", "url": "https://www.metropoles.com/brasil/clima-chuvas-e-temporais-atingem-varias-regioes-do-brasil-nesta-2a", "fonte_id": "metropoles", "data_pub": "2026-11-09T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instabilidades atmosféricas estão afetando principalmente o Sul, Centro-Oeste e Sudeste do Brasil. Oito estados e o Distrito Federal estão sob alerta amarelo para temporais.", "titulo_pt": "Clima: chuvas e temporais atingem várias regiões do Brasil nesta segunda-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 251967, "titulo": "Russia: HIV spreads beyond risk groups in 27 regions, epidemiologists say", "url": "https://www.euronews.com/2026/11/09/russia-hiv-spreads-beyond-risk-groups-in-27-regions-epidemiologists-say", "fonte_id": "euronews", "data_pub": "2026-11-09T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com os dados mais recentes do Rospotrebnadzor, o vírus HIV está se espalhando em 27 regiões da Federação Russa, atingindo a população em geral e não apenas grupos de risco. Pessoas infectadas estão transmitindo o vírus sem se dar conta de que estão infectadas.", "titulo_pt": "Rússia: HIV se espalha em 27 regiões, afetando a população em geral, dizem epidemiologistas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 251409, "titulo": "Bacia do Alto Paraguai perde milhões de hectares de vegetação em 40 anos", "url": "https://veja.abril.com.br/agenda-verde/bacia-do-alto-paraguai-perde-milhoes-de-hectares-de-vegetacao-em-40-anos/", "fonte_id": "veja", "data_pub": "2026-11-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mapeamento do MapBiomas mostrou que 61% do bioma da Bacia do Alto Paraguai sofreu avanço de queimadas entre 1985 e 2025, resultando na perda de milhões de hectares de vegetação.", "titulo_pt": "Bacia do Alto Paraguai perde milhões de hectares de vegetação em 40 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 251923, "titulo": "'A supersized El Niño is colliding with a planet already superheated': 2026 will be among hottest years on record", "url": "https://www.lemonde.fr/en/environment/article/2026/11/09/a-supersized-el-nino-is-colliding-with-a-planet-already-superheated-2026-will-be-among-hottest-years-on-record_6775606_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Supersíndice El Niño está colidindo com um planeta já superaquecido. O relatório anual do estado do clima da Organização Meteorológica Mundial foi lançado durante a COP31, que se abre na Turquia em 2026.", "titulo_pt": "A supersíndice El Niño colide com um planeta já superaquecido: 2026 será um dos anos mais quentes da história", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 252197, "titulo": "Cop31 leaders urge world to accelerate fight against global warming", "url": "https://www.scmp.com/news/world/article/3373785/cop31-leaders-urge-world-accelerate-fight-against-global-warming", "fonte_id": "scmp", "data_pub": "2026-11-09T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes do Cop31, um summit sobre clima, pediram para que o mundo acelerasse as ações contra o aquecimento global, diante do aumento das temperaturas e dos desastres climáticos que ameaçam vidas e a economia mundial. O evento, uma conferência anual das Nações Unidas, começou na Turquia e busca chamar a atenção dos governos para o clima, mesmo com outras crises internacionais competindo por atenção.", "titulo_pt": "Líderes do cop31 incentivam aceleração das ações contra o aquecimento global", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 252327, "titulo": "Q&A: What is the Belém-Antalya mechanism for a ‘just transition’?", "url": "https://www.carbonbrief.org/qa-what-is-the-belem-antalya-mechanism-for-a-just-transition", "fonte_id": "carbon_brief", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COP31, que será realizado em Antalya, Turquia, espera-se que resulte no lançamento do Mecanismo Belém-Antalya para uma 'transição justa'. Este mecanismo visa promover a transição justa para países e comunidades afetadas pelas mudanças climáticas.", "titulo_pt": "Perguntas e respostas: o que é o mecanismo Belém-Antalya para uma 'transição justa'?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 252023, "titulo": "Which countries and industries emit the most greenhouse gases?", "url": "https://www.aljazeera.com/news/2026/11/9/which-countries-and-industries-emit-the-most-greenhouse-gases?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos são os maiores emitentes de r deadly sinking", "url": "https://www.aljazeera.com/news/2026/11/9/senegal-human-rights-group-demands-government-action-after-deadly-sinking?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organização de direitos humanos em Senegal pediu ação do governo após um naufrágio fatal. Milhares de pessoas morreram nos últimos anos ao tentar chegar às ilhas Canárias da Espanha partindo da África Ocidental.", "titulo_pt": "Grupão de direitos humanos em senegal pede ação após naufrágio fatal", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 252836, "titulo": "‘Exceedingly heavy-handed’: ACT police criticised by magistrate for Tasering disabled Aboriginal woman", "url": "https://www.theguardian.com/australia-news/2026/nov/10/exceedingly-heavy-handed-act-police-officers-criticised-by-magistrate-for-taser-arrest-of-disabled-aboriginal-woman-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-09T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz criticou policiais do ACT por usarem um Taser em uma mulher indígena com deficiência intelectual durante uma prisão em janeiro. A mulher pediu aos policiais que não usassem o esticão elétrico, afirmando estar sem armas.", "titulo_pt": "‘Muito pesado’: juiz critica policiais do ACT por usar taser em mulher indígena com deficiência intelectual", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 252876, "titulo": "Después de la Teletón: la inclusión no se construye, se vive", "url": "https://www.ciperchile.cl/2026/11/09/despues-de-la-teleton-la-inclusion-no-se-construye-se-vive/?utm_source=rss&utm_medium=rss&utm_campaign=despues-de-la-teleton-la-inclusion-no-se-construye-se-vive", "fonte_id": "ciper_chile", "data_pub": "2026-11-09T12:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo explora a questão da inclusão, sugerindo que function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>

    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {

});

      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
