<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>

s notícias.", "mundo": "Em meio às tensões globais, vários países e regiões enfrentam desafios políticos e sociais. Na América do Sul, a situação dos venezolanos sem documentos em Colômbia continua complicada, com a ameaça de deportações gerando incertezas. No Brasil, há debates sobre a influência do presidente dos Estados Unidos, Donald Trump, na política nacional, com críticas sobre possíveis interferências na eleição atual. No cenário internacional, o presidente dos Estados Unidos, Donald Trump, considera seriamente a implementação de uma proibição de exportação de diesel devido a uma crise global de suprimento. A China e os Estados Unidos buscam avanços tangíveis em sua trégua, após a visita de Xi Jinping a Washington. Na Ucrânia, os ataques russos resultaram em oito mortes, enquanto Moscou afirma que continuará a guerra. Em outros pontos do mundo, a Arábia Saudita adotou um plano de aprendizado remoto devido a tensões crescentes no Golfo Pérsico.\n\nO cenário geopolítico global apresenta tensões significativas em vários pontos do mundo. Em primeiro lugar, a Ucrânia relatou que 14 pessoas morreram e 57 ficaram feridas após uma intensa ofensiva de drones russos que atingiram infraestruturas em Kyiv e Odesa no dia 27 de setembro. O presidente ucraniano Zelenskyy afirmou que Moscou lançou cerca de 4.000 drones, bombas aéreas e mísseis na Ucrânia nas últimas semanas. Em segundo lugar, as tensões entre Israel e o Hamas aumentaram, com Khaled Meshaal, membro do bureau político do Hamas, alertando que as ações israelenses no Monte do Templo estão preparando o caminho para um controle total sobre o local. Além disso, Israel fechou as fronteiras da Cisjordânia por uma semana, limitando o movimento dos palestinos e o acesso aos locais sagrados. Em seguida, o presidente dos Estados Unidos, Donald Trump, ofereceu a venda de armas à China durante a visita de Xi Jinping, apesar dos Estados Unidos estarem legalmente obrigados a fornecer armas à Taiwan devido à Lei de Relações com a Taiwan de 1979. Estas ações refletem a complexidade e a intensidade das relações internacionais atuais.", "economia": "O rendimento das dívidas do Tesouro dos EUA a 10 anos chegou a 5,2%, enquanto o petróleo Brent subiu acima de 108 dólares o barril, refletindo a diminuição das esperanças de um acordo entre Estados Unidos e Irã, conforme informou o Financial Times. O Brasil está acelerando a exploração de petróleo para aproveitar a janela de oportunidade antes que o consumo global diminua, afirmou Roberto Ardenghi, presidente do IBP. Além disso, a Indonésia reduziu o preço mínimo de negociação das ações para aumentar a liquidez dos mercados. No cenário político, Lula defendeu a revogação do Fundo Eleitoral como parte de uma grande reforma política para combater a 'promiscuidade política', enquanto o Ibovespa perdeu força na reta final da campanha eleitoral, pressionado por juros, commodities e cautela dos investidores estrangeiros.", "tecnologia": "A Nvidia lançou uma plataforma de software para prevenir comportamentos inadequados de agentes de inteligência artificial (IA), em resposta a incidentes recentes. A empresa também está expandindo uma fábrica de 12 polegadas em Singapura, em parceria com a Vanguard International Semiconductor. Este será o maior investimento da NXP Semiconductors desde a aquisição da Freescale em 2015. Em outro desenvolvimento, a Xiaomi, com o apoio da Zhuhai Amicro Technology, está preparando uma oferta inicial de ações em Hong Kong com um valor superior a 100 milhões de dólares americanos. O boom da IA está alimentando uma divisão 'k-formada', beneficiando os já bem-sucedidos e prejudicando os demais, conforme relata o Taipei Times. A China está redefinindo a corrida de EUV, buscando alternativas às fontes de luz EUV e desenvolvendo equipamentos nacionais equivalentes à plataforma de litografia da ASML. Além disso, a Sony decidiu não participar da CES, uma vez que encerrou seu projeto com a Honda sobre veículos elétricos, focando-se em jogos, música e filmes. A Alibaba está investindo pesadamente na IA com um novo chip projetado para competir com a Nvidia, além de planos para expansão significativa de data centers e crescimento acelerado de sua receita de nuvem, incluindo o Brasil nos planos de expansão da empresa.", "ciencia": "A SpaceX está prestes a realizar sua primeira tentativa de colocar o foguete Starship em órbita terrestre, um passo crucial no desenvolvimento do veículo de lançamento para missões à Lua e Marte. Este evento marca um avanço significativo na exploração espacial privada. Em um desenvolvimento relacionado, os cientistas descobriram que a creatina pode aumentar a força muscular, mesmo para pessoas que não praticam exercícios, sugerindo novas aplicações para este suplemento. Outro avanço na medicina é a nova formulação de vacinas RNA que permite seu armazenamento em temperaturas mais elevadas, facilitando a distribuição em regiões com infraestrutura limitada. Além disso, os astrônomos identificaram uma galáxia de rádio com evidências de quatro jatos poderosos lançados pelo seu buraco negro central, um achado que pode revolucionar nossa compreensão sobre a atividade de buracos negros. Estes avanços mostram o amplo espectro de descobertas científicas e tecnológicas em andamento.", "cultura": "Madonna foi a artista mais premiada do MTV Video Music Awards 2026, ganhando o prêmio de Artista do Ano e sete categorias entre as 13 indicações. A cerimônia, que também homenageou Dolly Parton, George Michael e Nirvana, viu Taylor Swift quebrar seu próprio recorde de premiações, com seis vitórias. Em outro destaque, Rod Stewart anunciou que sua próxima turnê será sua última, após mais de cinco décadas de carreira. No Brasil, o trio Criolo, Amaro & Dino apresentará um projeto indicado ao Grammy Latino no Festival Estilo Brasil, com a participação especial de Iza. Além disso, a geração Z está adotando o jazz em suas rotinas musicais, preferindo espaços de escuta ao vivo e incluindo o gênero em suas playlists, superando estilos como o house e o K-pop.", "sociedade": "Os protestos em Madri, na Espanha, continuaram por uma segunda noite após a expulsão de Maricarmen, uma idosa de 87 anos, de seu apartamento. A ação levou a uma ampla mobilização contra a crise habitacional na cidade, com manifestantes acampados na Praça da Porta do Sol. Em outro evento, a África do Sul registrou um aumento significativo de violência relacionada a tiroteios em bares, com 27 mortes em dois incidentes separados na África do Sul. A situação reflete a crescente criminalidade e a presença de gangues no país. No Brasil, o caso de Isabelle Caracristi continua gerando especulações, com a investigação focada em áudios enviados por ela antes de morrer e a ausência de câmeras no local do incidente. O país também celebra o Dia da Doação de Órgãos, destacando a importância do transplante de córnea, que aumentou em 24% nas últimas seis meses, beneficiando 6,8 milhões de pessoas com a 'ambulância aérea' que realiza cerca de 50 transportes mensais.", "meio_ambiente": "Enchentes na Tailândia deixaram pelo menos oito mortos e afetaram 580 mil casas, com milhares de pessoas desalojadas, principalmente em Bangkok. As chuvas intensas causaram novas evacuações no leste do país. Em Bangladesh, pelo menos 62 pessoas morreram devido a fortes chuvas e inundações no norte do país, o que levou a interrupções no transporte e afetou as atividades comerciais. Na Califórnia, o nível do mar elevado destruiu casas e cobriu praias, resultante de uma série de ciclones e furacões intensificados pelo fenômeno El Niño.", "direitos_humanos": "A Corte Suprema da Índia exigiu maior responsabilidade em relação a casos recentes de estupro no Distrito Nacional e nas proximidades, afirmando que refletem uma 'falha na aplicação da lei'. Centenas de estudantes protestaram em Delhi na semana anterior, exigindo maior segurança para mulheres após uma adolescente ter afirmado ter sido estuprada por três homens em um parque da cidade. Em Oleshky, uma cidade ucraniana ocupada pela Rússia, os últimos moradores estão comendo plantas para sobreviver, pois o suprimento de alimentos se esgotou. A cidade, cercada pelas forças ucranianas, tem cerca de 2.000 civis, incluindo 50 crianças, sem acesso a alimentos. Além disso, centenas de muçulmanos se reuniram em Ujjain, na Índia, para protestar contra a demolição parcial de uma mesquita histórica que tem mais de 600 anos. Em Durban, na África do Sul, refugiados temem novos ataques após serem expulsos de um acampamento improvisado, com um prazo final de 30 de setembro se aproximando. No entanto, a situação humanitária em Oleshky é particularmente alarmante, com as pessoas enfrentando a possibilidade de morrer de fome."}, "resumo_do_dia": {"politica_nacional": [{"id": 184828, "titulo": "Pesquisa: a distância entre Lula e Flávio Bolsonaro nos eleitorados católico e evangélico", "url": "https://veja.abril.com.br/politica/pesquisa-a-distancia-entre-lula-e-flavio-bolsonaro-nos-eleitorados-catolico-e-evangelico/", "fonte_id": "veja", "data_pub": "2026-09-28T09:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa BTG/Nexus mostrou diferenças significativas entre os eleitorados católico e evangélico, com Jair Bolsonaro (Flávio Bolsonaro) liderando entre os evangélicos e Luiz Inácio Lula da Silva (Lula) tendo vantagem entre os católicos.", "titulo_pt": "Pesquisa: distâncias entre Lula e Flávio Bolsonaro nos eleitorados católico e evangélico", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 185080, "titulo": "STF invalida suspensão unilateral, por SP, de benefício de ICMS para áreas de livre comércio", "url": "https://www.jota.info/tributos/stf-invalida-suspensao-unilateral-por-sp-de-beneficio-de-icms-para-areas-de-livre-comercio", "fonte_id": "jota", "data_pub": "2026-09-28T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF (Supremo Tribunal Federal) invalidou a suspensão unilateral de um
