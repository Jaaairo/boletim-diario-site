<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "02/09/2026 15:23", "stats": {"noticias_novas": 1018, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal (STF) está enfrentando um novo escândalo envolvendo o ministro Alexandre de Moraes, com revelações de mensagens sugestivas de propina e ameaças. O ministro do Tribunal Superior Eleitoral, Kassio Nunes Marques, removeu publicações de Eduardo Bolsonaro contestando a segurança das urnas eletrônicas. Além disso, o STF deve anunciar medidas sobre as conversas entre Moraes e Daniel Vorcaro nos próximos dias. Em outros eventos, a Comissão Mista do Congresso Nacional aprovou a MP da 'taxa das blusinhas', que agora segue para análise dos plenários da Câmara e do Senado. A pesquisa Quaest indica que Augusto Cury está ganhando apoio nas intenções de voto, pressionando os candidatos, enquanto a disputa presidencial se intensifica, com Flávio Bolsonaro e Lula figurando como principais nomes na corrida eleitoral.", "mundo": "Em um evento significativo, o ministro de Relações Exteriores de Israel, Gideon Sa'ar, declarou que Israel responderia com severidade a um ataque iraniano, após uma série de intensas operações militares entre os dois países. O Irã negou envolvimento em ataques recentes a navios e aeroportos, com a Arábia Saudita denunciando um ataque a um navio-tanque que resultou em mortes. As tensões entre os países continuam, com a Alemanha anunciando medidas punitivas após atribuir à Rússia uma tentativa de ataque com drone, embora especialistas considerem que essas medidas provavelmente não dissuadirão Moscou. Em outro evento notável, a fundação Magnani Rocca retornou três obras-primas roubadas em março, que foram expostas novamente, enquanto o Supremo Tribunal Federal do Brasil realizava sua primeira sessão após a crise envolvendo os ministros Fachin e Vargas, com o ministro Edson Fachin decidindo se um relatório sobre as mensagens entre eles será apresentado ao plenário.\n\nO presidente dos Estados Unidos, Joe Biden, enviou uma mensagem ao Irã, indicando que o país tem controle sobre o Estreito de Ormuz, em um momento de tensão na região. O espaço aéreo russo está se tornando perigoso para voos comerciais devido ao aumento do número de drones ucranianos voando sobre o território russo, conforme declarou o presidente ucraniano Volodymyr Zelenskyy. O Irã lançou mísseis e drones contra bases militares americanas na região como resposta a ataques americanos que resultaram em pelo menos 18 mortos, incluindo crianças. Além disso, o presidente chinês Xi Jinping visitou o Egito, fortalecendo as relações entre os dois países, que incluem tecnologia, defesa e uma parceria estratégica com implicações regionais. A União Europeia está considerando uma resposta após o ataque com drone em Leipzig, enquanto a Alemanha oficialmente culpa Moscou.", "economia": "A economia brasileira e internacional apresentou notícias relevantes nos últimos dias. A produção industrial no Brasil registrou crescimento em julho após duas quedas consecutivas, avançando 0,20% em relação ao mês anterior, conforme informou o IBGE. No entanto, o desempenho no início do terceiro trimestre foi inferior às expectativas. Em outro desenvolvimento, a Magalu passou a vender produtos no Mercado Livre a partir de 2 de fevereiro, ampliando sua base de clientes. No cenário internacional, a Chevron anunciou um investimento de 7 bilhões de dólares na Venezuela com o objetivo de dobrar a produção de petróleo até 2031. O secretário de Energia dos EUA, Chris Wright, confirmou que Washington cederá 20% das reservas venezuelanas. Além disso, a Anac suspendeu as operações da Total Linhas Aéreas, companhia aérea de carga que transporta mercadorias dos Correios, a partir de 9 de fevereiro de 2026. As empresas enfrentam insegurança com as alíquotas da reforma tributária ainda indefinidas, enquanto o Banco Central destaca o alto endividamento das famílias e prepara novas medidas no mercado de crédito.", "tecnologia": "A Google lançou os modelos de inteligência artificial Gemini 3.8 Flash e 3.8 Flash Cyber, projetados para programação avançada e cibersegurança. Esses modelos foram desenvolvidos para oferecer soluções específicas para diferentes áreas técnicas. Em outra notícia importante, a OpenAI e seu CEO Sam Altman estão sendo processados em 30 novas ações judiciais. Essas ações acusam a empresa de fornecer 'assistência significativa e incentivo' ao suspeito do tiroteio escolar em Tumbler Ridge, no Canadá. Além disso, a inteligência artificial está se integrando na rotina estratégica de líderes, auxiliando nas análises, cenários e decisões sem substituir o julgamento humano. Finalmente, a Anemoi Marine Technologies busca estreitar parcerias com construtoras e empresas de navegação sul-coreanas, em face da crescente pressão para reduzir o consumo de combustível e emissões, aproveitando a excelência da Coreia do Sul na construção naval e engenharia marítima.", "ciencia": "Um dos eventos mais importantes mencionados nos artigos é a possível descoberta de evidências da matéria escura. Cientistas do Experimento de Matéria Escura LZ, localizado em South Dakota, observaram indícios de matéria escura durante um experimento subterrâneo, embora a confirmação oficial ainda dependa da avaliação da comunidade científica. Esta descoberta, se confirmada, poderia ser fundamental para entender a natureza da matéria escura, que influencia o movimento de galáxias e estrelas. Além disso, a NASA realizou uma missão de foguete para examinar as camadas atmosféricas espontâneas, fornecendo insights sobre o comportamento dessas camadas imprevisíveis. Outros assuntos abordados incluem a reconstrução digital do rosto de Pé Pequeno, um ancestral humano de 3,67 milhões de anos, e a expansão do centro de pesquisa da Agile Space Industries em Durango, Colorado.", "cultura": "O Papa Francisco visitará a Argentina de 8 a 11 de novembro, com programações em várias cidades, incluindo Palermo, Luján, Córdoba, e visitas à cadeia de Devoto e ao Cottolengo de Claypole. A programação completa será anunciada pela Santa Sé. Em outro destaque, o Festival de Veneza começou com ênfase na política, justificando a presença de filmes dramáticos e politizados na programação. A HBO lançou um novo trailer da série 'Harry Potter e a Pedra Filosofal', que adapta o primeiro livro da saga de J.K. Rowling. O Festival Favela Gourmet, em sua segunda edição, começa nesta sexta-feira no Rio de Janeiro, com cerca de 40 estabelecimentos das comunidades da Rocinha e Vidigal. A atriz e diretora Maggie Gyllenhaal afirmou que o setor cinematográfico enfrenta um 'problema sistêmico' de sexismo, destacando que apenas duas diretoras concorrem ao Golden Lion no Festival de Veneza deste ano.", "sociedade": "A negligência médica levou à morte de Miranir de Souza Dias, que teve um mal-estar após uma endoscopia em uma clínica particular no Distrito Federal. A investigação policial está em andamento. Em outro caso, um casal foi preso por emboscar e matar Clara Victória de Oliveira Palhares, uma adolescente de 17 anos, em sua casa. Eles levaram a vítima a um hospital, mas ela não sobreviveu. A polícia também está investigando a morte de uma professora que teve alta médica duas vezes em um hospital público, mas sem detalhes sobre a eventual causa da morte. No Japão, o governo vai subsidiar esforços comunitários para prevenir suicídios infantis, em um momento em que o número de suicídios entre estudantes atingiu um recorde. Além disso, uma pesquisa mostrou que a desigualdade de renda entre servidores públicos brasileiros é maior do que a observada no conjunto do país, conforme um estudo do auditor Sergio Guedes-Reis.", "meio_ambiente": "A ONU alertou que o mundo está prestes a superar o limite de 1,5°C estabelecido pelo Acordo de Paris, com relatórios indicando que a temperatura pode chegar a 1,8°C no cenário mais otimista. O Nepal enfrentou inundações letais devido ao aquecimento global, com mais de 1.100 mortos e milhares desaparecidos. A ONU também advertiu sobre os maiores riscos no setor agrícola devido ao aquecimento superior a 1,5°C. A indústria marítima está adotando tecnologias antigas, como velas eólicas, para reduzir o consumo de combustível e atender a regulamentações ambientais. Em Indonésia, incêndios florestais e de terras causaram qualidade de ar ruim, forçando 1,4 milhão de estudantes a migrarem para o aprendizado online. Na República Democrata do Congo, a atual epidemia de Ebola registrou mais de 6.000 casos e quase 3.000 mortes desde maio. O clima está mudando, trazendo novos riscos para projetos de hidrelétrica na região conhecida como teto do mundo, e quase metade dos agricultores do mundo são intoxicados por pesticidas a cada ano, de acordo com um estudo.", "direitos_humanos": "Um homem palestino-australiano acusa a polícia do estado de Nova South Wales de ter batido nele durante uma manifestação contra o político Isaac Herzog, quando ele tentava impedir a perturbação de um grupo de oração. Ele ingressou com uma ação cível na corte district de NSW, alegando que foi falsamente acusado e injustamente detido pela polícia. Em Hong Kong, Joshua Wong, um dos ativistas pró-democracia mais proeminentes, admitiu culpa em um segundo caso relacionado à Lei de Segurança Nacional de Pequim, o que pode resultar em uma extensão mínima de três anos ou até mesmo em prisão perpétua para sua sentença. Além disso, Yalda Moaiery, uma jornalista fotográfica iraniana, foi condenada a 15 anos de prisão pelo governo iraniano por compartilhar imagens das repressões contra os protestos internos com mídias estrangeiras. Essas notícias ilustram a ampla gama de violações dos direitos humanos em diferentes partes do mundo, desde ações policiais controversas até prisões arbitrárias e condenações baseadas em acusações políticas."}, "resumo_do_dia": {"politica_nacional": [{"id": 140098, "titulo": "Oposição cobra Alcolumbre e diz querer investigação individualizada de autoridades para preservar instituições", "url": "https://g1.globo.com/politica/noticia/2026/09/02/oposicao-cobra-alcolumbre-e-diz-querer-investigacao-individualizada-de-autoridades-para-preservar-instituicoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças do PL na Câmara e no Senado exigiram investigações individualizadas para autoridades envolvidas no Caso Master. O partido também pressionou o presidente do Senado, Davi Alcolumbre, para avançar com processos contra ministros do STF.", "titulo_pt": "Oposição cobra investigações individualizadas e pressiona Alcolumbre para avanço de processos contra ministros do stf", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 140154, "titulo": "Sessão da 6x1 tem choro de senadores, lembrança de pai morto e bate-boca", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/sessao-da-6x1-tem-choro-de-senadores-lembranca-de-pai-morto-e-bate-boca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sessão de análise da PEC que propõe o fim da escala 6x1 na CCJ do Senado Federal teve momentos de emoção, com senadores chorando e lembrando o pai falecido, e também momentos de conflito verbal entre os parlamentares.", "titulo_pt": "Sessão sobre pec do fim da escala 6x1 tem choro, lembrança de pai morto e discussões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140099, "titulo": "STF faz primeira sessão após revelação de mensagens de Vorcaro para Moraes", "url": "https://g1.globo.com/politica/ao-vivo/supremo-sessao-apos-mensagens-de-vorcaro-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) realizou sua primeira sessão após a revelação de mensagens entre Daniel Vorcaro e um número atribuído a Alexandre de Moraes. As mensagens sugerem que Vorcaro ofereceu contratos e experiências de luxo ao ministro do STF. Além disso, eles se encontraram oito vezes.", "titulo_pt": "STF realiza primeira sessão após revelação de mensagens entre Vorcaro e Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 140141, "titulo": "PF vê omissão da AGU em crise com Mendonça, e orgão de Messias diz que evitou risco à investigação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/pf-ve-omissao-da-agu-em-crise-com-mendonca-e-orgao-de-messias-diz-que-evitou-risco-a-investigacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Integrantes da Polícia Federal relatam que a Advocacia-Geral da União (AGU) teria se omitido na crise que levou ao pedido de um relatório sobre mensagens entre ministros do STF. O ministro André Mendonça ordenou a elaboração desse relatório.", "titulo_pt": "PF vê omissão da AGU em crise com Mendonça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 140142, "titulo": "PGR pede que investigação contra Lulinha sobre atuação na Dataprev vá para 1ª instância", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/pgr-pede-que-investigacao-contra-lulinha-sobre-atuacao-na-dataprev-va-para-1a-instancia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República defendeu o envio de um inquérito contra Fábio Luis, filho do presidente Lula, para a 1ª instância. O inquérito se refere à atuação de Lulinha na Dataprev.", "titulo_pt": "PGR defende envio de inquérito contra Lulinha para 1ª instância", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 140211, "titulo": "Comissão aprova MP da taxa das blusinhas: texto segue a plenários", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/comissao-aprova-mp-da-taxa-das-blusinhas-texto-segue-plenarios", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-02T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão Mista do Congresso Nacional aprovou o texto da medida provisória (MP) que zera o imposto de 20% sobre compras internacionais até US$ 50 feitas pela internet por meio de remessas postais. O texto agora segue para análise dos plenários da Câmara e do Senado, com expectativa de aprovação nas duas Casas nesta semana.", "titulo_pt": "Comissão aprova MP da 'taxa das blusinhas': texto segue para plenários", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 140143, "titulo": "Câmara confirma indicação de Rodrigo Pacheco para ministro do TCU", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/camara-confirma-indicacao-de-rodrigo-pacheco-para-ministro-do-tcu.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou a indicação de Rodrigo Pacheco para ministro do TCU. O ex-presidente do Senado foi confirmado para ocupar uma vaga no tribunal.", "titulo_pt": "Câmara confirma indicação de Rodrigo Pacheco para ministro do TCU", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 140376, "titulo": "Pesquisa revela as primeiras ‘vítimas’ do crescimento de Augusto Cury nas intenções de voto", "url": "https://veja.abril.com.br/politica/pesquisa-revela-as-primeiras-vitimas-do-crescimento-de-augusto-cury-nas-intencoes-de-voto/", "fonte_id": "veja", "data_pub": "2026-09-02T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostra que o escritor Augusto Cury está ganhando apoio e pressionando os candidatos nas intenções de voto. Este avanço o coloca como uma figura de fora das eleições que agora está ganhando força.", "titulo_pt": "Pesquisa mostra as primeiras ‘vítimas’ do crescimento de Augusto Cury nas intenções de voto", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 140284, "titulo": "Nunes Marques manda remover postagens de Eduardo que contestam urnas", "url": "https://www.cnnbrasil.com.br/eleicoes/nunes-marques-manda-remover-postagens-de-eduardo-que-contestam-urnas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-deputado Eduardo sugeriu que as urnas eletrônicas brasileiras poderiam ser violadas. Em resposta, o ministro do STF, Nunes Marques, ordenou a remoção de suas postagens.", "titulo_pt": "Nunes Marques ordena remover postagens de Eduardo sobre urnas eletrônicas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 140100, "titulo": "Fim da 6x1: relator lê parecer; presidente da CCJ concede vista de uma hora após pedido da oposição", "url": "https://g1.globo.com/politica/noticia/2026/09/02/fim-da-6x1-relator-le-parecer-presidente-da-ccj-concede-vista-de-uma-hora-apos-pedido-da-oposicao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da Comissão de Constituição e Justiça do Senado, Otto Alencar, concedeu uma hora de vista para análise do relatório sobre o fim da escala 6x1. Após este prazo, a CCJ pode iniciar a votação da Proposta de Emenda à Constituição (PEC).", "titulo_pt": "Fim da 6x1: relator lê parecer; presidente da CCJ concede vista de uma hora", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 140404, "titulo": "STF deve blindar Moraes de investigação, diz especialista: 'Ainda não vi ministros do Supremo perderem nada em qualquer cenário'", "url": "https://www.bbc.com/portuguese/articles/c7708nnn3g3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-02T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista em Direito afirma que o Supremo Tribunal Federal (STF) provavelmente protegerá o ministro Alexandre Moraes de qualquer investigação. O corporativismo da Corte pode dificultar a apuração sobre o ministro e o escândalo envolvendo o Master.", "titulo_pt": "STF deve blindar Moraes de investigação, diz especialista", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 140101, "titulo": "Nunes Marques mantém peça de campanha de Lula que associa Flávio Bolsonaro ao Master", "url": "https://g1.globo.com/politica/noticia/2026/09/02/nunes-marques-rejeita-pedido-de-flavio-contra-campanha-de-lula-que-associou-senador-ao-master.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T16:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kassio Nunes Marques, presidente do Tribunal Superior Eleitoral, rejeitou um pedido de Flávio Bolsonaro para proibir uma propaganda de Lula que associa Flávio ao escândalo do caso Master. Marques argumentou que a ligação é parte da crítica política e que não há implicação de autoria ou participação nas fraudes.", "titulo_pt": "Nunes Marques mantém propaganda de Lula que associa Flávio Bolsonaro ao Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 140102, "titulo": "Quaest: 44% acham que Flávio não é mais moderado que a família Bolsonaro", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/02/flavio-moderacao-bolsonaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest indica que 44% dos entrevistados acreditam que Flávio Bolsonaro não é mais moderado do que a família Bolsonaro, enquanto 37% consideram que ele é mais moderado. A diferença entre as percepções diminuiu em comparação com um levantamento anterior.", "titulo_pt": "44% Acham que Flávio não é mais moderado que a família Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 140144, "titulo": "Mendonça confirma depoimento de Vorcaro sem PF e diz que Moraes não foi tema do encontro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/mendonca-confirma-depoimento-de-vorcaro-sem-pf-mas-nega-ter-tratado-de-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF André Mendonça confirmou que Daniel Vorcaro, ex-banqueiro preso no escândalo do Banco Master, deu um depoimento recentemente, com a presença do Ministério Público e sem a Polícia Federal. O tema do encontro não incluiu a decisão do ministro Moraes.", "titulo_pt": "Mendonça confirma depoimento de Vorcaro sem PF e diz que Moraes não foi tema", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 140145, "titulo": "Relatório da PF revela possível interferência de Gonet em eleição de conselho de procuradores", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/relatorio-da-pf-revela-possivel-interferencia-de-gonet-em-eleicao-de-conselho-de-procuradores.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Polícia Federal indica que o procurador-geral da República, Paulo Gonet, pode ter interferido na eleição para a presidência do CNPG. O relatório foi divulgado em 09/02/2026.", "titulo_pt": "Relatório da PF sugere possível interferência de Gonet em eleição de conselho de procuradores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 140146, "titulo": "Estudo desmonta caricatura da eleitora evangélica e mostra mudanças na visão sobre feminismo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/estudo-desmonta-caricatura-da-eleitora-evangelica-e-mostra-mudancas-na-visao-sobre-feminismo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo, realizado pelo Instituto de Estudos da Religião (Iser) entre 2022 e 2025, entrevistou 45 mulheres evangélicas, predominantemente pretas e pardas, de 16 a 65 anos, das classes C e D. O objetivo foi desmontar a caricatura da eleitora evangélica e explorar as mudanças na visão sobre o feminismo.", "titulo_pt": "Estudo desmonta caricatura da eleitora evangélica e mostra mudanças na visão sobre feminismo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 140486, "titulo": "Trump envía un mensaje a Irán y dice que el estrecho de Ormuz debería llevar su nombre", "url": "https://www.lanacion.com.ar/el-mundo/trump-envia-un-mensaje-a-iran-y-dice-que-el-estecho-de-ormuz-deberia-llevar-su-nombre-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T17:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, enviou um sinal a Irã, afirmando que o país tem controle sobre o estreito de Ormuz. O estreito está passando por um período de tensão devido a ataques recorrentes.", "titulo_pt": "Trump envia mensagem a Irã sobre controle do estreito de Ormuz", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 140543, "titulo": "The ‘Miracle House’ That Survived Nepal’s Floods", "url": "https://www.nytimes.com/2026/09/02/world/asia/nepal-flood-miracle-house-dhunge-bazaar.html", "fonte_id": "nyt_world", "data_pub": "2026-09-02T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas estão vindo tirar fotos da casa verde que protegeu a família Pyakurel durante as inundações que destruíram a área ao seu redor.", "titulo_pt": "A ‘casa miraculosa’ que salvou a família pyakurel das inundações no Nepal", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 140876, "titulo": "(LEAD) S. Korean, Japanese, Turkish frigates being considered for new U.S. frigate class: report", "url": "https://en.yna.co.kr/view/AEN20260902010551315", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos está considerando designs de fragatas sul-coreanas, japonesas e turcas para uma nova classe de fragatas americanas, de acordo com um relatório.", "titulo_pt": "Estados unidos considera designs de fragatas sul-coreanas, japonesas e turcas para nova classe de fragatas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 140802, "titulo": "Malta, assolto presunto mandante dell'omicidio di Daphne Caruana Galizia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/02/malta-assolto-presunto-mandante-dellomicidio-di-daphne-caruana-galizia_93da241d-d88c-4601-88c6-5774cb6ac848.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-02T17:53:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um júri absolveu o magnata Fenech no caso do assassinato de Daphne Caruana Galizia com uma votação de 8 a 1.", "titulo_pt": "Malta: magnata absolvido no julgamento do assassinato de Daphne Caruana Galizia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 140343, "titulo": "STF faz 1ª sessão após crise provocada por mensagens entre Vorcaro e Moraes", "url": "https://www.metropoles.com/colunas/manoela-alcantara/stf-faz-1a-sessao-apos-crise-provocada-por-mensagens-entre-vorcaro-e-moraes", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira sessão do Supremo Tribunal Federal (STF) após a crise gerada pelas mensagens entre os ministros Fachin e Vorcaro foi realizada. No momento, o ministro Edson Fachin decide se o relatório da Polícia Federal sobre essas mensagens será apresentado ao plenário.", "titulo_pt": "STF realiza 1ª sessão após crise das mensagens entre fachin e Vorcaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140201, "titulo": "Itamaraty vê organização da China como caminho para soberania digital", "url": "https://www.poder360.com.br/poder-tech/itamaraty-ve-organizacao-da-china-como-caminho-para-soberania-digital/", "fonte_id": "poder360", "data_pub": "2026-09-02T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O embaixador brasileiro informou que a adesão do Brasil à Waico, fundada em julho, não ocorreu devido a um 'alinhamento político'.", "titulo_pt": "Itamaraty vê adesão do Brasil à waico como resultado de alinhamento político", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 140567, "titulo": "Maltese tycoon found not guilty of involvement in Daphne Caruana Galizia murder", "url": "https://www.theguardian.com/world/2026/sep/02/maltese-tycoon-yorgen-fenech-daphne-caruana-galizia-killing-not-guilty", "fonte_id": "guardian_world", "data_pub": "2026-09-02T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yorgen Fenech, um dos homens mais ricos de Malta, foi julgado não culpado de envolvimento no assassinato da jornalista anti-corrupção Daphne Caruana Galizia. A decisão, que pode ser recurrida, desilude a família da vítima e ativistas que consideram o caso crucial para a liberdade de imprensa na Europa.", "titulo_pt": "Millionário maltese é absolvido no caso da morte da jornalista Daphne Caruana Galizia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 140686, "titulo": "Israeli FM Gideon Sa'ar: 'I hope Iran will not make the mistake of attacking us'", "url": "https://www.france24.com/en/tv-shows/t%C3%AAte-%C3%A0-t%C3%AAte/20260902-israeli-fm-gideon-sa-ar-i-hope-iran-will-not-make-the-mistake-of-attacking-us", "fonte_id": "france24", "data_pub": "2026-09-02T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro de Relações Exteriores de Israel, Gideon Sa'ar, afirmou em entrevista à FRANCE 24 que Israel responderia com uma resposta severa em caso de ataque iraniano. Sa'ar também acusou Teerã de manter intenções nucleares, afirmando que Israel não permitirá que isso ocorra.", "titulo_pt": "Ministro de relações exteriores de israel espera que Irã não cometa erro ao atacar o país", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 140265, "titulo": "Rússia rejeita acusação da Alemanha sobre tentativa de ataque em aeroporto", "url": "https://www.cnnbrasil.com.br/internacional/russia-rejeita-acusacao-da-alemanha-sobre-tentativa-de-ataque-em-aeroporto/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério das Relações Exteriores da Rússia convocou o encarregado de negócios da Alemanha em Moscou para rejeitar acusações de que a Rússia tentou realizar um ataque no aeroporto. As denúncias foram descritas como totalmente fabricadas.", "titulo_pt": "Rússia rejeita acusações da Alemanha sobre tentativa de ataque no aeroporto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 140542, "titulo": "U.S. and Iran Survey the Damage After a Night of Intense Strikes", "url": "https://www.nytimes.com/2026/09/02/world/middleeast/us-iran-strikes.html", "fonte_id": "nyt_world", "data_pub": "2026-09-02T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército americano afirmou que seus bombardeios foram uma resposta às recentes ações contra forças americanas e tráfego marítimo. Autoridades iranianas declararam que um casamento foi atingido e civis mortos.", "titulo_pt": "Estados unidos e Irã avaliam danos após noite de intensos atos de força", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 140735, "titulo": "Berlin's punitive measures unlikely to deter Putin: experts", "url": "https://www.dw.com/en/berlin-s-punitive-measures-unlikely-to-deter-putin-experts/a-78803217?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-02T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha anunciou medidas punitivas após atribuir à Rússia uma tentativa de ataque com drone a um aeroporto. No entanto, especialistas, incluindo ex-diplomatas e analistas políticos e de segurança, sugerem que isso provavelmente não dissuadirá o Kremlin.", "titulo_pt": "Medidas punitivas da berlim pouco prováveis de dissuadir o kremlin: especialistas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 140736, "titulo": "Unity at last: Is Libya's damaging power struggle at an end?", "url": "https://www.dw.com/en/unity-at-last-is-libya-s-damaging-power-struggle-at-an-end/a-78758325?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-02T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Libia tem estado dividida entre dois governos opositores há mais de uma década. Agora, eleições são agendadas para unificar o país dentro de dois anos.", "titulo_pt": "União finalmente alcançada: as disputas prejudiciais de poder em libia podem estar chegando ao fim?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 140661, "titulo": "Iranian attack on Saudi tanker killed two Filipino sailors, Saudi Arabia says", "url": "https://www.bbc.co.uk/news/articles/cx2zxgg4mx9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-02T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita informou que dois marinheiros filipinos morreram em um ataque a um navio-tanque chamado Sidr, ocorrido na Straits of Hormuz. O ataque, que envolveu projéteis desconhecidos, foi condenado pela Arábia Saudita.", "titulo_pt": "Ataque iraniano a navio-tanque saudita mata dois marinheiros filipinos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 140687, "titulo": "Videos and debris raise questions over alleged US strike on Iranian wedding", "url": "https://www.france24.com/en/middle-east/20260902-videos-and-debris-raise-questions-over-alleged-us-strike-on-iranian-wedding", "fonte_id": "france24", "data_pub": "2026-09-02T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1º de setembro, um suposto ataque com mísseis e drones dos Estados Unidos contra uma cidade no sul da Irã teria atingido um casamento, causando pelo menos cinco mortes, incluindo uma criança de quatro anos. A FRANCE 24 localizou o impacto direto em um prédio civil, que estava a mais de 135 metros da suposta alvo, um torre de comunicação.", "titulo_pt": "Vídeos e detritos levantam dúvidas sobre suposto ataque dos EUA a casamento na Irã", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 140353, "titulo": "Ratinho volta a criticar Erika Hilton e dispara: “Trans não é mulher”", "url": "https://www.metropoles.com/colunas/fabia-oliveira/ratinho-volta-a-criticar-erika-hilton-e-dispara-trans-nao-e-mulher", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O apresentador Ratinho continuou a criticar a deputada Erika Hilton, chamando trans de não mulher. Ele se referiu à deputada como presidente de Comissão da Mulher, mantendo sua posição anterior sobre ela.", "titulo_pt": "Ratinho mantém crítica a Erika Hilton e chama trans de 'não mulher'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140546, "titulo": "In Nepal and Tibet, Pollution on Glaciers Could Fuel More Flood Disasters", "url": "https://www.nytimes.com/2026/09/02/climate/pollution-soot-glaciers-melting-himalayas.html", "fonte_id": "nyt_world", "data_pub": "2026-09-02T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As geleiras da região estão escurecidas pelo fuligem proveniente de veículos e fábricas, absorvendo mais calor e se derretendo a taxas perigosas.", "titulo_pt": "Na Nepal e na Tibet, poluição nas geleiras pode aumentar desastres hídricos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 140433, "titulo": "Fazenda se recusa a organizar reunião com DF e bancos sobre BRB", "url": "https://www.jota.info/executivo/fazenda-se-recusa-a-organizar-reuniao-com-df-e-bancos-sobre-brb", "fonte_id": "jota", "data_pub": "2026-09-02T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério afirma que a articulação com as instituições financeiras não é de sua responsabilidade. A governadora do Distrito Federal permanece isolada no assunto BRB.", "titulo_pt": "Fazenda se recusa a organizar reunião com DF e bancos sobre BRB", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 140153, "titulo": "Anac suspende operações da Total Linhas Aéreas, que presta serviço aos Correios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/anac-suspende-operacoes-da-total-linhas-aereas-que-presta-servico-aos-correios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anac suspendeu as operações da Total Linhas Aéreas, companhia aérea de carga que transporta mercadorias dos Correios. A decisão foi tomada em 09/02/2026 às 14h48.", "titulo_pt": "Anac suspende operações da Total Linhas Aéreas, que presta serviço aos Correios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140155, "titulo": "Raia Drogasil vê vendas de protetor solar crescerem não com calor, mas com radiação UV", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/raia-drogasil-ve-vendas-de-protetor-solar-crescerem-nao-com-calor-mas-com-radiacao-uv.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento da Impulso, empresa de mídia do grupo Raia Drogasil, mostrou que as vendas de protetor solar no Brasil estão mais relacionadas à radiação UV do que à temperatura. A radiação UV é a variável com maior correlação estatística com as vendas de protetor solar no país.", "titulo_pt": "Raia Drogasil observa que vendas de protetor solar crescem mais com radiação UV do que com calor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140774, "titulo": "Chevron to double Venezuela oil production with $7bn pledge", "url": "https://www.ft.com/content/a76721db-36e1-4198-aad8-8c90137aace9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-02T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Chevron se comprometeu a dobrar a produção de petróleo na Venezuela com um investimento de 7 bilhões de dólares em joint ventures. O anúncio foi feito em meio à pressão do governo americano para uma significativa elevação da produção no país.", "titulo_pt": "Chevron promete dobrar tml", "fonte_id": "cnbc_international", "data_pub": "2026-09-02T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Energia Chris Wright conversou com o jornalista Brian Sullivan da CNBC na Venezuela, após o presidente Donald Trump anunciar um grande acordo de petróleo com Caracas. Wright informou que mais de 17 milhões de barris de petróleo transitaram pelo Estreito de Ormuz naquele dia.", "titulo_pt": "Secretário de energia Chris Wright diz a CNBC que mais de 17 milhões de barris de petróleo transitaram pelo estreito de Ormuz naquele dia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 140158, "titulo": "Tribunal do Cade vai contra área técnica e aprova compra de central de registros pela B3", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/tribunal-do-cade-vai-contra-area-tecnica-e-aprova-compra-de-central-de-registros-pela-b3.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T15:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Cade aprovou a compra da CRDC pela B3, aumentando o poder de mercado da Bolsa de Valores brasileira. A decisão foi tomada contra a recomendação da área técnica.", "titulo_pt": "Tribunal do Cade aprova compra da crdc pela B3, contra recomendação técnica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140160, "titulo": "Dropbox teve 5.000 contas invadidas por hackers em agosto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/dropbox-teve-5000-contas-invadidas-por-hackers-em-agosto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dropbox relatou que cerca de 5.000 contas foram invadidas em agosto, permitindo que hackers visualizassem e baixassem conteúdo armazenado na plataforma de nuvem.", "titulo_pt": "Dropbox r edir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/data-centers-de-ia-exigirao-us-32-tri-ate-2050-diz-pwc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T14:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os gastos globais com data centers para inteligência artificial devem atingir US$ 31,6 trilhões até 2050, de acordo com a PricewaterhouseCoopers. Isso representa um investimento sem precedentes para atender à crescente demanda por IA.", "titulo_pt": "Gastos com data centers de IA chegarão a US$ 31,6 trilhões até 2050, diz PwC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140164, "titulo": "Magalu passa a vender produtos pelo Mercado Livre para ampliar base de clientes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/magalu-passa-a-vender-produtos-pelo-mercado-livre-para-ampliar-base-de-clientes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de 2 de fevereiro, produtos do grupo Magalu estarão disponíveis para venda no Mercado Livre. O acordo envolve 27 mil itens de diferentes marcas do grupo, incluindo móveis, eletrodomésticos, games, produtos de informática e cosméticos.", "titulo_pt": "Magalu passa a vender produtos no Mercado Livre para ampliar base de clientes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140773, "titulo": "A vital tenet of US equity markets is under threat", "url": "https://www.ft.com/content/38d5c39f-901f-4306-9412-f7e1d7553174?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-02T14:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reformas propostas pela SEC podem ameaçar a capacidade dos investidores compararem empresas listadas nos mercados de ações dos Estados Unidos.", "titulo_pt": "Princípio vital dos mercados de ações  anos 1960, a NASA começou a desenvolver um sistema de navios espaciais reutilizáveis com o objetivo de tornar seu trabalho mais eficiente e reduzir custos. Estes navios poderiam lançar-se como foguetes, operar na órbita terrestre e pousar como aviões, além de transportar satélites grandes entre a Terra e a órbita.", "titulo_pt": "Nasa nomeia braço robótico de carga como 300º marco IEEE", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 140487, "titulo": "Google presenta Gemini 3.8 Flash y 3.8 Flash Cyber, sus modelos de IA rápida para programación avanzada y ciberseguridad", "url": "https://www.lanacion.com.ar/tecnologia/google-presenta-gemini-38-flash-y-38-flash-cyber-sus-modelos-de-ia-rapida-para-programacion-avanzada-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Google lançou os modelos de IA Gemini 3.8 Flash e 3.8 Flash Cyber, projetados para programação avançada e cibersegurança. Estes modelos visam oferecer soluções específicas para diferentes áreas técnicas.", "titulo_pt": "Google apresenta Gemini 3.8 Flash e 3.8 Flash Cyber, seus modelos de IA para programação avançada e cibersegurança", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 140929, "titulo": "Amazon’s AI assistant can now spot fake emails from the company", "url": "https://www.theverge.com/tech/988518/amazon-alexa-for-shopping-verify-emails", "fonte_id": "the_verge", "data_pub": "2026-09-02T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon introduziu uma nova funcionalidade que permite ao assistente virtual Alexa verificar se um e-mail, mensagem de texto ou chamada telefônica realmente veio da empresa. O recurso usa inteligência artificial para comparar a mensagem recebida com as informações do sistema da Amazon.", "titulo_pt": "Amazon desenvolve recurso para alexa identificar e-mails falsos da empresa", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 140882, "titulo": "Pangram’s Max Spero on why AI detection is harder than ‘Real or Fake’", "url": "https://techcrunch.com/video/pangrams-max-spero-on-why-ai-detection-is-harder-than-real-or-fake/", "fonte_id": "techcrunch", "data_pub": "2026-09-02T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A internet enfrenta um problema de confiança, não apenas devido ao aumento de conteúdo gerado por IA em feeds de mídia social, mas também devido à incorporação de texto e imagens gerados por IA em aplicativos de recrutamento, avaliações de produtos e reivindicações de seguros, dificultando a distinção entre o que é real e o que não é. Várias startups têm surgido recentemente para lidar com essa questão.", "titulo_pt": "Pangram’s Max Spero sobre por que a detecção de IA é mais difícil do que ‘Real ou Fake’", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 140883, "titulo": "X shifts US creator payouts from Stripe to X Money", "url": "https://techcrunch.com/2026/09/02/x-shifts-us-creator-payouts-from-stripe-to-x-money/", "fonte_id": "techcrunch", "data_pub": "2026-09-02T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A X informou que os pagamentos para criadores nos EUA serão gerenciados pelo seu serviço de pagamentos X Money, substituindo o sistema anteriormente alimentado pela Stripe.", "titulo_pt": "X muda sistema de pagamentos para criadores nos EUA para X Money", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 140884, "titulo": "US government sides with OpenAI on issue of training LLMs on copyrighted material", "url": "https://techcrunch.com/2026/09/02/u-s-government-sides-with-openai-on-issue-of-training-llms-on-copyrighted-material/", "fonte_id": "techcrunch", "data_pub": "2026-09-02T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos apoiou a OpenAI em relação ao uso de material protegido por direitos autorais durante o treinamento de modelos de inteligência artificial. O governo destaca o interesse em manter e fortalecer sua indústria de IA competitiva e inovadora, com práticas que servem de modelo global.", "titulo_pt": "Governo dos EUA apoia OpenAI em questão de treinamento de modelos de IA com material protegido por direitos autorais", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 140862, "titulo": "Anemoi courts Korean shipbuilders for wind propulsion", "url": "https://www.koreaherald.com/article/10860861", "fonte_id": "korea_herald", "data_pub": "2026-09-02T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa britânica Anemoi Marine Technologies busca estreitar parcerias com construtoras e empresas de navegação sul-coreanas, em face da crescente pressão para reduzir o consumo de combustível e emissões. A Coreia do Sul se destaca pela excelência na construção naval, proprietários sofisticados de navios e fortes capacidades de engenharia marítima, segundo declarou o vice-presidente comercial da Anemoi.", "titulo_pt": "Anemoi busca parcerias com construtoras sul-coreanas de navios para propulsão eólica", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 140877, "titulo": "Lutnick: Trump gov't considering 'targeted,' thoughtful' tariff policy for semiconductors", "url": "https://en.yna.co.kr/view/AEN20260903000200315", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Comércio dos Estados Unidos, Howard Lutnick, comentou sobre uma possível política de tarifas 'seletivas e ponderadas' para semicondutores que está sendo considerada pelo governo de Donald Trump.", "titulo_pt": "Lutnick: governo trump considera 'política de tarifas seletivas e ponderadas' para semicondutores", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 140885, "titulo": "Enhanced geothermal notches another win as Google buys 400 MW from Fervo", "url": "https://techcrunch.com/2026/09/02/enhanced-geothermal-notches-another-win-as-google-buys-400-mw-from-fervo/", "fonte_id": "techcrunch", "data_pub": "2026-09-02T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google adquiriu 400 MW de energia geotérmica da Fervo, com potencial para expansão até 1 gigawatt. Esta energia poderia suprir um grande centro de dados de IA em Utah.", "titulo_pt": "Google compra 400 MW de energia geotérmica da Fervo, com potencial para expansão até 1 gigawatt", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 140866, "titulo": "MiniMax, Z.ai revenues surge on API demand but adjusted losses widen", "url": "https://www.digitimes.com/news/a20260902VL221/demand-z.ai-revenue-api-technology.html", "fonte_id": "digitimes", "data_pub": "2026-09-02T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas das primeiras empresas de desenvolvimento de modelos de fundação listadas na China estão demonstrando que a demanda por sua tecnologia pode resultar em receitas rapidamente crescentes. No entanto, transformar essa demanda em lucro permanece um problema mais difícil de resolver.", "titulo_pt": "Minimax, Z.Ai: receita cresce com demanda por apis, mas perdas ajustadas se expandem", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 140932, "titulo": "Researchers fear safety disaster ahead of OpenAI’s Astra release", "url": "https://www.theverge.com/ai-artificial-intelligence/988334/openai-astra-ai-monitoring-safety", "fonte_id": "the_verge", "data_pub": "2026-09-02T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores expressam preocupação com potenciais desastres de segurança em relação à liberação iminente do modelo de IA mais poderoso da OpenAI, Astra, após atrasos nas últimas semanas para fortalecer os protocolos de segurança. Detalhes do modelo estão sendo divulgados gradualmente, mas já h ", "classe": "B"}, {"id": 140272, "titulo": "Reconstrução digital revela o rosto de ‘Pé Pequeno’, um ancestral humano de quase 4 milhões de anos", "url": "https://www.cnnbrasil.com.br/ciencia/reconstrucao-digital-revela-o-rosto-de-pe-pequeno-um-ancestral-humano-de-quase-4-milhoes-de-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fóssil de Pé Pequeno, datado de 3,67 milhões de anos, foi usado para reconstruir digitalmente o rosto do ancestral humano, oferecendo dados importantes para a compreensão da evolução humana. Este fóssil, com 90% de integridade, é mais bem preservado que o de Lucy e proporciona informações valiosas para a pesquisa científica.", "titulo_pt": "Reconstrução digital revela o rosto de Pé Pequeno, um ancestral humano de quase 4 milhões de anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141013, "titulo": "Rising Over Louisiana", "url": "https://www.nasa.gov/image-article/rising-over-louisiana/", "fonte_id": "nasa_news", "data_pub": "2026-09-02T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 28 de agosto de 2026, ocorreu uma profunda eclipses parcial lunar quando a Lua passou pela sombra da Terra. No momento máximo do eclipse, 96,3% da superfície lunar estava na umbra, a parte mais escura da sombra onde a luz do sol era completamente bloqueada.", "titulo_pt": "Subindo sobre Louisiana", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 140969, "titulo": "Top medical leaders urge Americans to get their flu and COVID shots in lieu of CDC vaccine campaign", "url": "https://www.scientificamerican.com/article/top-medical-leaders-urge-americans-to-get-their-flu-and-covid-shots-in-lieu-of-cdc-vaccine-campaign/", "fonte_id": "scientific_american", "data_pub": "2026-09-02T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes médicos americanos estão incentivando a população a se , "pais": "EUA", "classe": "A"}, {"id": 140971, "titulo": "The risk of high blood pressure in pregnancy is rising—and the damage can be life-changing", "url": "https://www.scientificamerican.com/article/high-blood-pressure-during-pregnancy-is-becoming-more-common/", "fonte_id": "scientific_american", "data_pub": "2026-09-02T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O risco de hipertensão durante a gravidez tem aumentado significativamente, com um crescimento de 73% entre 2016 e 2024 conforme analisado pelo CDC. O dano potencial pode ser duradouro.", "titulo_pt": "O risco de hipertensão durante a gravidez está aumentando e o dano pode ser duradouro", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 141014, "titulo": "NASA Rocket Takes First Multi-Point Look Inside Radio-Disrupting Clouds", "url": "https://science.nasa.gov/science-research/heliophysics/nasa-rocket-takes-first-multi-point-look-inside-radio-disrupting-clouds/", "fonte_id": "nasa_news", "data_pub": "2026-09-02T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um foguete de sondagem da NASA realizou uma nova missão para examinar as camadas de E sporádicas, nuvens de alta altitude formadas pelo vapor de meteoritos queimados. Os resultados obtidos podem fornecer insights sobre o comportamento dessas camadas imprevisíveis.", "titulo_pt": "Foguete da NASA realiza primeiro olhar multifacetado nas nuvens radio-interferentes", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 140313, "titulo": "Manaus vira laboratório do MIT para estudar como reduzir o calor em cidades tropicais", "url": "https://exame.com/esg/manaus-vira-laboratorio-do-mit-para-estudar-como-reduzir-o-calor-em-cidades-tropicais/", "fonte_id": "exame", "data_pub": "2026-09-02T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MIT estabeleceu um projeto em Manaus para monitorar as temperaturas em diferentes pontos da cidade e util
