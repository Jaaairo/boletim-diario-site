<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

dia de sua morte. Ela estava prestes a assinar um contrato de aluguel por oito anos para recuperar sua casa, o que levantou questionamentos sobre despejos e desigualdades sociais. O caso de Maricarmen, que se tornou um símbolo da crise habitacional em Espanha, inspirou protestos massivos e levou a eleições nacionais. Em outro desenvolvimento, o governo dos Estados Unidos, sob a administração de Donald Trump, está considerando terminar o contrato com assessores Chris LaCivita e James Blair, que estariam orientando um partido pró-rússia menos de um mês antes das eleições legislativas. Além disso, a Organização Mundial da Saúde pede mais detalhes sobre o caso suspeito de pústula pulmonar em um trabalhador de laboratório na Sibéria, enquanto Israel comemora o terceiro aniversário do ataque de 7 de outubro de 2023 com novas operações militares em Gaza, apesar das falhas de segurança e das causas subjacentes dos ataques continuarem sem serem adequadamente abordadas.\n\nA guerra no Iêmen continua a fazer mais de 200 mil pessoas deixarem suas casas, segundo a ONU, em conflitos entre hutitas e forças do governo apoiadas pelos sauditas. Em outro ponto do mundo, Israel está exigindo que o Reino Unido feche seu consulado em Jerusalém Oriental, alegando ilegalidade, enquanto testemunhas relatam a presença de tropas eritreias no norte da Etiópia, aumentando as tensões entre os dois países. A Rússia realizou uma ampla ofensiva noturna na Ucrânia, utilizando 130 drones, 48 mísseis cruise e mísseis balísticos, resultando em pelo menos 24 mortes. As tensões entre Israel e Gaza persistem, com ataques aéreos israelenses em Gaza e relatos de um prédio em Pryluky, Ucrânia, ser bombardeado no aniversário de Vladimir Putin, resultando em nove mortos, incluindo três crianças. A guerra contra o Irã, que começou há oito meses, ainda não tem um fim visível, com o Pentágono avaliando opções para um possível ataque. Além disso, a China está adotando uma abordagem colaborativa que está conquistando outros estados. Por fim, o presidente dos Estados Unidos, Donald Trump, está considerando um plano para um possível ataque ao Irã antes das eleições de meados de outubro.", "economia": "As exportações brasileiras de carnes caíram 15% em receita e 12% em volume em setembro de 2026, devido a bloqueios impostos pela China e pela União Europeia, conforme relatório da Folha Mercado. O Banco Central da Índia aumentou pela primeira vez desde 2023 a taxa de juros, em resposta à aceleração da inflação e do crescimento econômico do país. A Petrobras liderou os leilões de áreas de petróleo, arrecadando R$ 3,2 bilhões para o governo, responsável por 90% da arrecadação total, conforme informou a Folha Mercado. O Banco Central da Coreia do Sul (BOK) informou que o país registrou um superávit de conta corrente de US$46,1 bilhões em agosto, durante a superciclo da produção de chips. A Folha Mercado relata que o TCU não identificou irregularidades na operação para emitir títulos da dívida na China, dentro do limite autorizado pelo Senado e com impacto marginal sobre a dívida pública. Além disso, a Anfavea revisou para cima as projeções de produção e vendas de veículos leves e pesados para 2026, aumentando as expectativas para um crescimento de 15,2% nas vendas e 6,7% na produção. A Folha Mercado também destaca que a Anac autorizou a empresa aérea canadense WestJet a operar voos regulares no Brasil, transportando passageiros e carga.", "tecnologia": "A tecnologia dominou o noticiário recentemente, com destaque para a cerimônia de entrega de medalhas de ciência e inovação pelo presidente Donald Trump, que incluiu a entrega da Medalha Nacional de Ciência a Elon Musk. A Microsoft lançou um novo laptop equipado com chips da Nvidia, visando transformar o Windows em uma plataforma para tarefas de inteligência artificial, permitindo que agentes de IA realizem tarefas locais sem a necessidade de acesso à nuvem. A OpenAI lançou uma nova funcionalidade chamada 'Inteligente UI' no ChatGPT, permitindo respostas interativas com imagens, gráficos e botões. Além disso, a SpaceX enfrenta crescentes preocupações sobre seu risco de crédito devido à corrida para obter empréstimos, enquanto a inteligência artificial enfrenta desafios éticos e regulatórios, como a necessidade de regras claras antes que veículos autônomos de guerra possam operar juntos.", "ciencia": "A inteligência artificial ainda gera mais perguntas do que respostas no campo da matemática, de acordo com especialistas. O avanço das ferramentas de IA tem levantado preocupações sobre o treinamento de futuros pesquisadores e a possibilidade de aumentar as desigualdades no campo. Por outro lado, o Nobel de Química de 2026 foi inspirado por uma cuba de vinho. A descoberta de uma substância gerada durante o processo de produção de vinho levou a importantes avanços. A NASA e a SpaceX programaram a 35ª missão de reabastecimento para a Estação Espacial Internacional, com o objetivo de levar experimentos científicos, suprimentos e equipamentos, incluindo o último conjunto de Painéis Solares Desdobráveis. Um estudo mostrou que metade dos pacientes com retinitis pigmentosa recuperou a sensibilidade à luz com a utilização de optogenética, indicando potencial para esse método. Além disso, cientistas identificaram um alvo para reduzir a inflamação no cérebro, o que pode auxiliar na investigação de medicamentos para doenças neurodegenerativas como Alzheimer e Parkinson.", "cultura": "Em São Paulo, a Caixa Cultural comemorou os 90 anos de Tom Zé, cantor e compositor baiano, com uma exposição sensorial e interativa que explora sua carreira, influências e inovações artísticas. Paralelamente, a Série B do Campeonato Brasileiro superou a audiência de torneios europeus na ESPN, quebrou recordes de visualização. A Record está negociando uma parceria com a TV Fronteira, emissora de Presidente Prudente, após um processo judicial contra a Globo. Simultaneamente, a Skydance mantém os estúdios de filmagens da Warner Bros. e da Paramount, separando a produção de cinema de produções de TV e streaming. No exterior, o Festival de Cinema Colombiano em São Paulo exibe sete filmes contemporâneos, enquanto a marca de luxo francesa Louis Vuitton investe em reformas de duas ruas próximas à sua futura loja flagship em Paris, com o apoio do prefeito local.", "sociedade": "Maricarmen Abascal, uma idosa de 87 anos que se tornou símbolo dos protestos contra despejos na Espanha, faleceu após ser expulsa do apartamento onde morava há 70 anos. O caso de Maricarmen reflete a crescente crise habitacional no país, com idosos sendo removidos devido a problemas financeiros. Em outros países, protestos estudantis e confrontos com a polícia ocorrem em várias cidades, refletindo a ira dos estudantes sobre custos educacionais e condições escolares. Na França, manifestações contra a crise fiscal e a falta de professores se intensificam, enquanto em Liège, na Bélgica, mais de 50 pessoas foram detidas durante protestos estudantis. O caso de Maricarmen Abascal e os protestos estudantis em vários países ilustram questões sociais e políticas que estão em foco atualmente, desde a moradia até a educação.", "meio_ambiente": "Um estudo publicado no The Guardian mostrou que a conversão de áreas de floresta abertas em florestas densas após a colonização na Austrália aumentou o risco de incêndios mais intensos, criando um 'loop de incêndios catastróficos' que tornou a Austrália sudeste mais propensa a incêndios florestais alimentados pelo clima. Além disso, a poluição do ar em Singapura atingiu o nível mais alto do mundo devido à fuligem proveniente das queimadas na Indonésia, fechando escolas em Kuala Lumpur, Malásia, conforme relatado pelo South China Morning Post. Em Hermanus, na África do Sul, baleias-jubarte retornaram à costa, atraindo multidões, enquanto um foca-dos-sul surpreendeu banhistas na praia de Copacabana, no Rio de Janeiro, gerando buzz nas redes sociais. No Brasil, populações que já enfrentaram eventos climáticos extremos podem experimentar um 'estresse climático antecipatório' com a chegada do Super El Niño, segundo a BBC Brasil.", "direitos_humanos": "Ualid Rabah, da Federação Palestina, denunciou o fracasso dos acordos de paz, a fome impostada aos palestinos e a impunidade do Israel, em um relatório que desmonta a narrativa dos Estados Unidos e Israel, afirmando que o cessar-fogo nunca ocorreu. Em outro desenvolvimento, um ex-bispo católico foi condenado por abusar de homens indígenas na Austrália, refletindo os recentes escândalos de abuso na Igreja Católica na Austrália. Além disso, uma operação conjunta entre França e Estados Unidos encerrou uma plataforma online que vendia conteúdo sexual privado de mais de 17.000 mulheres, resultando na prisão de dois irmãos do Norte da França e na apreensão de mais de 700.000 euros em bitcoin. A Disney também entrou em um julgamento, afirmando que o ex-presidente dos Estados Unidos, Donald Trump, praticava censura e violava a Constituição ao pressionar a empresa a alterar decisões editoriais, alegando medo de represálias e dano irreparável. Uma garota de 13 anos de Tuvalu pediu aos líderes mundiais que agirem sobre o clima, enquanto Christa Pike, uma mulher que sobreviveu a uma execução fracassada nos EUA, permanece consciente e recebendo cuidados médicos intensivos, com advogados pedindo que as autoridades preservem evidências da execução falhada."}, "resumo_do_dia": {"politica_nacional": [{"id": 200936, "titulo": "Ato por reeleição de Lula organizado pela UNE leva estudantes às ruas do Rio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ato-por-reeleicao-de-lula-organizado-pela-une-leva-estudantes-as-ruas-do-rio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T22:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes secundaristas e universitários participaram de um ato no centro do Rio de Janeiro em apoio à reeleição do presidente Lula, com foco na gratuidade e expansão das escolas públicas, e contra cortes no orçamento do setor.", "titulo_pt": "Ato por reeleição de Lula mobiliza estudantes no Rio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 201006, "titulo": "A nova ofensiva de coordenador de campanha de Flávio Bolsonaro contra Moraes", "url": "https://veja.abril.com.br/politica/a-nova-ofensiva-de-coordenador-de-campanha-de-flavio-bolsonaro-contra-moraes/", "fonte_id": "veja", "data_pub": "2026-10-07T22:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O coordenador de campanha de Flávio Bolsonaro, Fabrício Marinho, fez uma nova declaração em que afirmou que nenhuma autoridade ou órgão público está acima da fiscalização, da prestação de contas e do escrutínio público. Marinho parece estar se referindo a uma possível investigação ou fiscalização relacionada a Flávio Bolsonaro.", "titulo_pt": "Nova declaração do coordenador de campanha de Flávio Bolsonaro sobre fiscalização", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 201036, "titulo": "Flávio Bolsonaro volta a falar em 'redemocratizar' o Brasil: 'instituições precisam voltar a ser respeitadas'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/07/flavio-bolsonaro-volta-a-falar-em-redemocratizar-o-brasil-instituicoes-precisam-voltar-a-ser-respeitadas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-07T22:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à Presidência pelo PL, afirmou que precisa 'redemocratizar' o Brasil, enfatizando a importância de proteger as instituições. Ele reiterou que o STF não está funcionando da forma como deveria e que não se deve abaixar a cabeça diante das críticas.", "titulo_pt": "Flávio Bolsonaro diz que Brasil precisa ser 'redemocratizado' e instituições respeitadas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 200937, "titulo": "'Papai, por que você votou no Hitler?'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/conrado-hubner-mendes/2026/10/papai-por-que-voce-votou-no-hitler.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T22:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 5 de março de 1933, um menino de 5 anos, Otto, presenciou uma discussão entre seus pais sobre a eleição, onde a mãe discordava do voto do pai no candidato que prometia emprego e prosperidade durante a crise econômica.", "titulo_pt": "Pai, por que você votou no Hitler?", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 201037, "titulo": "Republicanos declara apoio a Flávio Bolsonaro no segundo turno", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/07/republicanos-declara-apoio-a-flavio-bolsonaro-no-segundo-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-07T22:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Republicanos declarou apoio a Flávio Bolsonaro no segundo turno da eleição presidencial contra Luiz Inácio Lula da Silva. O anúncio foi feito após uma reunião com lideranças partidárias e membros do governo.", "titulo_pt": "Republicanos declaram apoio a Flávio Bolsonaro no segundo turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 200919, "titulo": "Flávio Bolsonaro recebe apoio de partidos e fala em mudar Constituição", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/flavio-bolsonaro-recebe-apoio-de-partidos-e-fala-em-mudar-constituicao", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-07T22:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL à presidência, recebeu apoio formal da federação União Progressista, composta pelos partidos União Brasil e Progressistas, e do partido Novo, do candidato Romeu Zema. Bolsonaro reforçou a intenção de mudar a Constituição durante uma entrevista coletiva em Brasília.", "titulo_pt": "Flávio Bolsonaro recebe apoio de partidos e fala em mudar Constituição", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 200938, "titulo": "Republicanos oficializa apoio a Flávio Bolsonaro no segundo turno da eleição presidencial", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/republicanos-oficializa-apoio-a-flavio-bolsonaro-no-segundo-turno-da-eleicao-presidencial.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T22:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Republicanos confirmou apoio a Flávio Bolsonaro no segundo turno da eleição presidencial. O presidente nacional do partido, Marcos Pereira, anunciou oficialmente o apoio durante uma cerimônia na sede do Republicanos em Brasília.", "titulo_pt": "Republicanos oficializa apoio a Flávio Bolsonaro no segundo turno da eleição presidencial", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 200939, "titulo": "Lula muda tom nas redes e grava vídeo em formato selfie após 1º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/lula-muda-tom-nas-redes-e-grava-video-em-formato-selfie-apos-1o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva, candidato à reeleição, publicou um vídeo em formato selfie pedindo apoio aos seus apoiadores. A gravação representa uma mudança na comunicação digital da campanha petista após o primeiro turno.", "titulo_pt": "Lula grava vídeo em formato selfie após 1º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 201038, "titulo": "STF exclui crédito de ICMS da base de cálculo de impostos federais e União estima impacto de R$16,5 bilhões", "url": "https://g1.globo.com/economia/noticia/2026/10/07/stf-exclui-credito-de-icms-da-base-de-calculo-de-impostos-federais-e-uniao-deve-perder-r165-bilhoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-07T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal decidiu que incentivos fiscais via ICMS não devem entrar na base de cálculo de PIS e Cofins, com impacto estimado em R$16,5 bilhões para a União. A decisão foi unânime, votando 7 a 4.", "titulo_pt": "STF exclui crédito de ICMS da base de cálculo de impostos federais e União estima impacto de R$16,5 bilhões", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 200899, "titulo": "Flávio Bolsonaro negocia o tribunal dos sobreviventes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/10/flavio-bolsonaro-negocia-o-tribunal-dos-sobreviventes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL, está ativamente negociando e agindo como se já estivesse no cargo de presidente, mesmo ainda não ter ganho a eleição. A campanha dele e seus integrantes também estão agindo de maneira presumptiva sobre o futuro governo.", "titulo_pt": "Flávio Bolsonaro negocia como se já fosse presidente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200903, "titulo": "O que acontece com seus investimentos nos Estados Unidos quando você morre?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/o-que-acontece-com-seus-investimentos-nos-estados-unidos-quando-voce-morre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É fácil para brasileiros investirem nos Estados Unidos, com a disponibilidade de aplicativos em português, atendimento no Brasil e transferências facilitadas. No entanto, a sucessão desses investimentos pode não seguir as regras brasileiras.", "titulo_pt": "O que acontece com seus investimentos nos Estados Unidos quando você morre?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200940, "titulo": "Conselho dos Direitos da Criança repudia imagens de menino com arma após resultado do 1º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/10/conselho-dos-direitos-da-crianca-repudia-imagens-de-menino-com-arma-apos-resultado-do-1o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conanda, do Ministério dos Direitos Humanos, repudiou imagens de um menino segurando um objeto semelhante a uma arma de fogo e cobrou uma apuração rápida e a responsabilização de adultos envolvidos.", "titulo_pt": "Conanda repudia imagens de menino com arma após resultado do 1º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 201039, "titulo": "Gabinete diz que Janja seguirá na campanha de Lula; atuação da primeira-dama é alvo de críticas", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/07/gabinete-diz-que-janja-seguira-na-campanha-de-lula-atuacao-da-primeira-dama-e-alvo-de-criticas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-07T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O gabinete da primeira-dama Janja da Silva afirmou que ela continuará na campanha de Lula à reeleição, independentemente das críticas. Na terça-feira, a campanha petista teve uma reunião em Brasília onde foram feitas críticas à área de comunicação e à atuação da primeira-dama.", "titulo_pt": "Gabinete de Janja afirma que ela continuará na campanha de Lula; críticas à atuação da primeira-dama", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 200905, "titulo": "Oposição tenta evitar PEC 6x1 antes do 2º turno, mas Alcolumbre diz que votação está mantida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/oposicao-tenta-evitar-pec-6x1-antes-do-2o-turno-mas-alcolumbre-diz-que-votacao-esta-mantida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A votação da PEC do fim da escala 6x1 está mantida para a próxima semana, segundo Davi Alcolumbre, presidente do Senado. Apesar das tentativas da oposição para adiar a votação, a sessão continua agendada.", "titulo_pt": "Oposição tenta evitar PEC 6x1 antes do 2º turno, mas votação está mantida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200941, "titulo": "PF arquiva pedido do governo para investigar suspeita de interferência estrangeira nas eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pf-arquiva-pedido-do-governo-para-investigar-suspeita-de-interferencia-estrangeira-nas-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal arquivou um pedido da Advocacia-Geral da União para investigar suspeita de interferência estrangeira nas eleições de 2026.", "titulo_pt": "PF arquiva pedido do governo para investigar suspeita de interferência estrangeira nas eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 200942, "titulo": "Exército vê civil bolsonarista como ministro da Defesa se Flávio vencer", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/exercito-ve-bolsonarista-como-ministro-da-defesa-se-flavio-vencer.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Integrantes da cúpula militar brasileira discutem cenários para a possibilidade de Flávio Bolsonaro, senador pelo PL do Rio de Janeiro, vencer as eleições presidenciais. A adesão do atual governo ao bolsonarismo já causou danos que a cúpula militar ainda está se recuperando.", "titulo_pt": "Exército considera cenários com civil bolsonarista como ministro da Defesa se Flávio vencer", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 201422, "titulo": "Última hora tras la muerte de Maricarmen, en directo | Feijóo pide que no se haga una “utilización interesada” de la muerte de Maricarmen", "url": "https://elpais.com/espana/2026-10-07/ultima-hora-de-las-elecciones-generales-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-10-07T22:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A abogada de Maricarmen afirmou que, se o despejo tivesse sido suspenso, a situação atual não existiria. Houve uma manifestação com pelo menos mil pessoas que marcharam até o Congresso e acenderam velas em memória de Maricarmen, gritando 'asesinos'. O PP vetou um minuto de silêncio por Maricarmen na Assembleia de Madrid.", "titulo_pt": "Últimas notícias após a morte de Maricarmen, em tempo real | Feijóo pede que não se faça uma 'utilização interessada' da morte de Maricarmen", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 201131, "titulo": "Guerra força mais de 200 mil pessoas a abandonarem suas casas no Iêmen", "url": "https://www.metropoles.com/mundo/guerra-forca-mais-de-200-mil-pessoas-a-abandonarem-suas-casas-no-iemen", "fonte_id": "metropoles", "data_pub": "2026-10-07T22:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) estima que mais de 200 mil pessoas deixaram suas casas no Iêmen devido a confrontos entre forças hutitas e forças do governo apoiadas pelos sauditas.", "titulo_pt": "Guerra força mais de 200 mil pessoas a abandonarem suas casas no Iêmen", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 201471, "titulo": "DNC sues Trump administration over taxpayer-funded TV ads promoting president", "url": "https://www.france24.com/en/americas/20261007-dnc-sues-trump-administration-taxpayer-funded-tv-ads", "fonte_id": "france24", "data_pub": "2026-10-07T22:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comitê Nacional Democrata processou o governo de Donald Trump por causa de anúncios de televisão pagos pelo contribuinte que promovem a mensagem política do presidente. A ação judicial busca impedir o financiamento federal para esses anúncios, que custaram mais de 12 milhões de dólares antes das eleições intermunicipais de novembro.", "titulo_pt": "Comitê democrata processa governo Trump por anúncios de televisão pagos pelo contribuinte", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 201113, "titulo": "Trump diz que merece Prêmio Nobel da Paz, mas tem dúvidas sobre suas chances", "url": "https://www.infomoney.com.br/mundo/trump-diz-que-merece-premio-nobel-da-paz-mas-tem-duvidas-sobre-suas-chances/", "fonte_id": "infomoney", "data_pub": "2026-10-07T22:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou que merece o Prêmio Nobel da Paz, mas expressou dúvidas sobre suas chances de ganhar o prêmio.", "titulo_pt": "Trump diz que merece Prêmio Nobel da Paz, mas tem dúvidas sobre suas chances", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 201612, "titulo": "‘No to the father, no to the son’: Thousands march in Rio against Bolsonaro", "url": "https://www.aljazeera.com/gallery/2026/10/7/no-to-the-father-no-to-the-son-thousands-march-in-rio-against-bolsonaro-2?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-07T22:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam em Rio de Janeiro contra Flávio Bolsonaro após ele avançar para a segunda volta da corrida presidencial no Brasil.", "titulo_pt": "Nem pai nem filho: milhares marcham contra Bolsonaro em Rio de janeiro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 201472, "titulo": "No longer the same Israel? October 7th and the future of the Jewish State", "url": "https://www.france24.com/en/tv-shows/the-debate/20261007-no-longer-the-same-israel-october-7th-and-the-future-of-the-jewish-state", "fonte_id": "france24", "data_pub": "2026-10-07T22:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Até o momento, Benjamin Netanyahu permanece como primeiro-ministro de Israel. Mesmo após os ataques de 7 de outubro de 2023, considerados o pior dia de violência na história do país, as falhas de segurança e as causas subjacentes dos ataques continuam sem serem adequadamente abordadas, e Netanyahu ainda concorre para reeleição.", "titulo_pt": "Israel ainda é o mesmo? 7 de outubro e o futuro do estado judaico", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 201312, "titulo": "Rubio in Greece digs into past to tout Trump’s ‘America first’ approach", "url": "https://www.theguardian.com/us-news/2026/oct/07/rubio-greece-trump-america-first-speech", "fonte_id": "guardian_world", "data_pub": "2026-10-07T22:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado americano, Marco Rubio, fez uma palestra em Atenas, usando referências históricas para justificar a abordagem 'America first' de Donald Trump. Ele comparou os fundadores, filósofos e conquistadores da antiguidade com o espírito americano moderno.", "titulo_pt": "Rubio em Grécia explora passado para defender abordagem 'America first' de Trump", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 201473, "titulo": "Thousands protest Flavio Bolsonaro, fearing far-right return in Brazil", "url": "https://www.france24.com/en/americas/20261007-thousands-protest-flavio-bolsonaro-far-right-brazil", "fonte_id": "france24", "data_pub": "2026-10-07T22:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas participaram de uma manifestação estudantil no centro do Rio de Janeiro na quarta-feira para se opor a Flávio Bolsonaro. O primeiro turno das eleições presidenciais mostrou liderança de Bolsonaro, levando os manifestantes a apoiarem o atual presidente Lula e a se contrapor ao retorno do extremismo de direita ao poder.", "titulo_pt": "Milhares protestam contra flávio Bolsonaro, temendo retorno do extremismo de direita no Brasil", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 201410, "titulo": "The WHO seeks more details on the death of a plague research lab employee in Russia", "url": "https://www.npr.org/2026/10/07/nx-s1-5993873/russia-death-plague-research-institute", "fonte_id": "npr_news", "data_pub": "2026-10-07T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde pede mais detalhes sobre a causa da morte de uma funcionária em um laboratório de pesquisa sobre peste na Rússia. A Rússia afirma que a mulher morreu de pneumonia de origem desconhecida.", "titulo_pt": "OMS busca mais detalhes sobre a morte de funcionária em laboratório de pesquisa sobre peste na Rússia", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 201474, "titulo": "Israel marks three years since October 7 attack ahead of elections", "url": "https://www.france24.com/en/middle-east/20261007-israel-three-years-october-7-attack-elections", "fonte_id": "france24", "data_pub": "2026-10-07T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel comemorou o terceiro aniversário do ataque de 7 de outubro de Hamas com momentos de silêncio e novas operações militares em Gaza. Enquanto isso, a discussão política aumentou à medida que se aproximam as eleições.", "titulo_pt": "Israel marca o terceiro aniversário do ataque de 7 de outubro de hamas antes das eleições", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 201465, "titulo": "Spanish pensioner whose eviction sparked nationwide protests dies, union says", "url": "https://www.bbc.co.uk/news/articles/c6e3x21ev9wwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-07T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, uma pensionista de 87 anos, foi forçosamente removida de seu apartamento de mais de 70 anos em setembro. Ela faleceu, conforme informado pela sindicância.", "titulo_pt": "Pensionista espanhola cuja expulsão despertou protestos nacionais morre, diz sindicância", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 201378, "titulo": "Pakistan’s Opposition on the March", "url": "https://foreignpolicy.com/2026/10/07/pakistan-imran-khan-opposition-long-march-islamabad/", "fonte_id": "foreign_policy", "data_pub": "2026-10-07T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A frustração crescente em relação à prisão do ex-líder Imran Khan está empurrando os protestantes para as ruas e cada vez mais próximos de Islamabad.", "titulo_pt": "Oposição ao avanço no paquistão", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 201614, "titulo": "Pro-Palestine university groups march in London on October 7 anniversary", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/7/pro-palestine-university-groups-march-in-london-on-october-7-anniversary?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-07T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes pró-palestinos marcharam pelas ruas de Londres em 7 de outubro, apesar das chamadas das autoridades policiais para adiar a manifestação.", "titulo_pt": "Grupos pró-palestinos realizam marcha em londres em 7 de outubro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 201475, "titulo": "UN health agency wants more details from Russia on suspected pneumonic plague case", "url": "https://www.france24.com/en/un-health-agency-wants-more-details-from-russia-on-suspected-pneumonic-plague-case", "fonte_id": "france24", "data_pub": "2026-10-07T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma alta autoridade da Organização Mundial da Saúde disse que não sabe como um trabalhador de laboratório na Sibéria morreu. A agência pediu à Rússia mais detalhes sobre um caso suspeito de pústula pulmonar que gerou preocupações globais.", "titulo_pt": "Agência da OMS quer mais detalhes da Rússia sobre suposto caso de pústula pulmonar", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 201608, "titulo": "Trump considers ‘terminating’ campaign advisers over Balkans trip", "url": "https://www.ft.com/content/ea58254a-947e-4e87-86d2-95ffbd8a1c9d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-07T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump está considerando terminar o contrato com os assessores Chris LaCivita e James Blair. Eles estariam orientando um partido pró-russo menos de um mês antes das eleições legislativas.", "titulo_pt": "Trump considera 'terminar' assessores de campanha por orientar partido pró-russo antes das eleições", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 201541, "titulo": "Christa Pike 'angry and confused' after botched execution", "url": "https://www.dw.com/en/christa-pike-angry-and-confused-after-botched-execution/a-79586250?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-07T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Christa Pike expressou raiva e confusão após o fracasso do seu execução. Um juiz ordenou que as autoridades do estado preservem todas as evidências relacionadas ao falho processo de execução.", "titulo_pt": "Christa Pike 'ira e confusa' após execução falhada", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 201787, "titulo": "S. Korea extends current account surplus in Aug. amid solid exports", "url": "https://en.yna.co.kr/view/AEN20261008001100320", "fonte_id": "yonhap_news", "data_pub": "2026-10-07T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul registrou um superávit na conta corrente em agosto, mantendo a tendência positiva de exportações.", "titulo_pt": "Coreia do sul mantém superávit na conta corrente em agosto com exportações sólidas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 201788, "titulo": "(URGENT) S. Korea logs US$46.1 bln current account surplus in Aug. amid chip supercycle: BOK", "url": "https://en.yna.co.kr/view/AEN20261008001000320", "fonte_id": "yonhap_news", "data_pub": "2026-10-07T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul registrou um superávit de conta corrente de US$46,1 bilhões em agosto, durante a superciclo da produção de chips, conforme informou o Banco da Reserva da Coreia do Sul (BOK).", "titulo_pt": "Coreia do sul registra superávit de US$46,1 bilhões na conta corrente em agosto durante superciclo de chips: BOK", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 201029, "titulo": "TCU não vê irregularidade em plano para emitir títulos da dívida na China", "url": "https://www.poder360.com.br/poder-economia/tcu-nao-ve-irregularidade-em-plano-para-emitir-titulos-da-divida-na-china/", "fonte_id": "poder360", "data_pub": "2026-10-07T22:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU (Tribunal de Contas da União) não identificou irregularidades na operação para emitir títulos da dívida na China. A operação está dentro do limite autorizado pelo Senado e tem um impacto marginal sobre a dívida pública.", "titulo_pt": "TCU não encontra irregularidades na emissão de títulos da dívida na China", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 200894, "titulo": "Empresas importam 9,6 bilhões de litros de diesel entre janeiro e agosto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/empresas-importam-96-bilhoes-de-litros-de-diesel-entre-janeiro-e-agosto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T22:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As distribuidoras brasileiras importaram 9,6 bilhões de litros de diesel entre janeiro e agosto de 2026, de acordo com dados da ANP. O volume foi usado para atender à demanda interna e reduzir a dependência da Petrobras, enquanto o setor enfrenta dificuldades devido à Guerra no Irã.", "titulo_pt": "Brasil importa 9,6 bilhões de litros de diesel entre janeiro e agosto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200895, "titulo": "Anglo American ameaça fechar unidade de níquel no Brasil caso UE bloqueie venda à chinesa MMG", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/anglo-american-ameaca-fechar-unidade-de-niquel-no-brasil-caso-ue-bloqueie-venda-a-chinesa-mmg.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anglo American declarou que encerrará suas operações de níquel no Brasil se a União Europeia bloquear a venda da unidade para a MMG. A empresa minera afirmou que a decisão depende do resultado da aprovação da venda pela UE.", "titulo_pt": "Anglo American ameaça fechar operação de níquel no Brasil caso união europeia bloqueie venda à MMG", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 201163, "titulo": "EUA projetam pagamentos recordes de US$ 13,8 bi a agricultores", "url": "https://www.cnnbrasil.com.br/agro/eua-projetam-pagamentos-recordes-de-us-138-bi-a-agricultores/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-07T22:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos projetam pagamentos recordes de US$ 13,8 bilhões aos agricultores no ciclo agrícola de 2025, representando o maior montante anual desembolsado pelos programas americanos desde 2014.", "titulo_pt": "EUA projetam pagamentos recordes de US$ 13,8 bi a agricultores", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 201115, "titulo": "Rali perde força e taxas de juros fecham de lado, com dúvidas sobre quadro fiscal", "url": "https://www.infomoney.com.br/mercados/rali-perde-forca-e-taxas-de-juros-fecham-de-lado-com-duvidas-sobre-quadro-fiscal/", "fonte_id": "infomoney", "data_pub": "2026-10-07T22:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As taxas de juros fecharam estáveis, sem direção clara, devido à perda de força do rally no mercado. O principal motivo é a incerteza em relação ao plano fiscal que possa permitir uma redução maior dos juros.", "titulo_pt": "Rali perde força e taxas de juros fecham estáveis, com dúvidas sobre plano fiscal", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 200896, "titulo": "Anac autoriza aérea canadense WestJet a operar voos regulares no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/anac-autoriza-aerea-canadense-westjet-a-operar-voos-regulares-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anac autorizou a empresa aérea canadense WestJet a operar voos regulares no Brasil, transportando passageiros e carga. A decisão foi anunciada em 10 de julho de 2026.", "titulo_pt": "Anac autoriza aérea canadense WestJet a operar voos regulares no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 201379, "titulo": "IMF Chief Issues Stark Economic Warning for 2027", "url": "https://foreignpolicy.com/2026/10/07/imf-speech-georgieva-economy-energy-oil-yields-ai-inflation/", "fonte_id": "foreign_policy", "data_pub": "2026-10-07T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kristalina Georgieva, chefe do FMI, alerta para problemas econômicos em 2027 e incentiva líderes mundiais a implementarem medidas protetivas.", "titulo_pt": "Chefe do fmi emite aviso econômico grave para 2027", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 200900, "titulo": "Petrobras lidera leilões de áreas de petróleo e garante R$ 3,2 bilhões ao governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/petrobras-lidera-leiloes-de-areas-de-petroleo-e-garante-r-32-bilhoes-ao-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras liderou os leilões de áreas de petróleo, arrecadando R$ 3,2 bilhões ao governo, responsável por 90% da arrecadação total. A estatal arrematou 21 blocos em dois leilões realizados na quarta-feira (7).", "titulo_pt": "Petrobras lidera leilões de áreas de petróleo e garante R$ 3,2 bilhões ao governo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200901, "titulo": "Restaurantes criticam Keeta por uso de informações sem contrato em 'compra intermediada'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/restaurantes-criticam-keeta-por-uso-de-informacoes-sem-contrato-em-compra-intermediada.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Redes de restaurantes estão insatisfeitas com a estratégia da
