<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "22/09/2026 13:46", "stats": {"noticias_novas": 1230, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva falou na Assembleia-Geral da ONU, defendendo a soberania nacional e criticando a imposição de tarifas. Ele também abordou temas como eleição, interferência externa, meio ambiente, segurança pública e soberania nacional. Lula afirmou que os brasileiros escolherão entre democracia e negacionismo nas eleições de 4 de outubro e rejeitou a ideia de terceirizar o combate ao crime organizado no Brasil. Em outro destaque, a arrecadação federal em agosto atingiu um recorde de R$ 235,6 bilhões, um aumento real de 8,25% em comparação com o mesmo período do ano anterior. O ministro da Justiça, Ricardo Lewandowski, pediu que o ministro do STF, Alexandre Moraes, fosse investigado por denunciação caluniosa, solicitando acesso ao inquérito das fake news.", "mundo": "Em setembro de 2025, o presidente dos Estados Unidos, Joe Biden, e o presidente do Brasil, Luiz Inácio Lula da Silva, participaram da 81ª Assembleia Geral das Nações Unidas. Lula criticou as tarifas, defendeu a agenda climática, pediu a regulação de empresas tecnológicas e de inteligência artificial, e fez críticas implícitas ao ex-presidente Donald Trump, abordando temas de sua campanha eleitoral. Biden, por sua vez, discursou sobre a proteção do Hemisfério Ocidental. Nota-se que o Banco Mundial contratou a Noble Reach, uma organização associada à CIA, para enviar oito funcionários norte-americanos para os escritórios do banco no Brasil, Panamá e Colômbia. Paralelamente, o primeiro-ministro do Japão, Shigeru Ishiba, viajou a Nova York para participar da Assembleia Geral das Nações Unidas e planeja conversar com Trump sobre a China antes de uma cúpula entre os dois países.\n\nA guerra entre Rússia e Ucrânia, em sua quinta ano, continua com atividades militares e diplomáticas intensas. A Rússia está modernizando bombas em Moscou e São Petersburgo, enquanto drones ucranianos atingem uma refinaria russa. O presidente dos Estados Unidos, Donald Trump, anunciou a construção de duas bases militares em Groenlândia e ameaçou aniquilar o Irã. A União Europeia removeu sanções a dois oligarcas pró-Putin, mas a decisão foi criticada pela Ucrânia. A China e os Estados Unidos se reúnem em uma cúpula crucial para construir confiança, com foco em inteligência artificial. O Mar Cáspio se torna um hub comercial importante, enquanto a Arábia Saudita recebe apoio do Reino Unido para combater os hutitas no Iêmen. A Lituânia recebe novas tropas americanas, contrariando ameaças passadas de Donald Trump. A Croácia pressiona a Frontex para maior presença em fronteiras europeias, e a tecnologia de inteligência artificial continua sendo debatida internacionalmente.", "economia": "A arrecadação federal atingiu R$ 2,019 trilhões nos primeiros oito meses de 2026, um crescimento de 7,12% em relação ao mesmo período de 2025, conforme informou a Agência Brasil Economia. O Comitê de Política Monetária do Banco Central reduziu a taxa Selic em 0,25 ponto percentual, para 13,75% ao ano, devido à desaceleração da atividade econômica, da inflação e aos efeitos dos juros elevados sobre o crédito e a demanda, conforme a ata da reunião divulgada. O dólar registrou uma leve alta e a bolsa caiu com a repercussão da ata do Copom e de uma pesquisa eleitoral, informou a Folha Mercado. Além disso, a Vale adquiriu 30% da mineradora Ligga S.A. por US$ 190 milhões, com o objetivo de expandir a produção e garantir a exclusividade na compra do minério produzido, conforme a Jornal do Comércio. A União Europeia e as Filipinas chegaram a um acordo inicial de livre comércio, enquanto a UE e a China tiveram um déficit comercial de 1 bilhão de euros por dia em julho, com as importações da UE da China superando as exportações para o país três vezes, de acordo com dados alfandegários.", "tecnologia": "A empresa AMD atingiu pela primeira vez um valor de mercado de US$ 1 trilhão, impulsionada pela demanda por ações relacionadas à inteligência artificial (IA), refletindo a crescente importância deste campo tecnológico. Em contraste, pesquisadores de alto nível de empresas como Aisi, OpenAI, Anthropic e Google DeepMind relatam sintomas de esgotamento e estresse no desenvolvimento de IA poderosa, destacando preocupações sobre o impacto social e moral dessas tecnologias. A Coreia do Sul entregou o primeiro lote de produção em massa do caça KF-21 Boramae à Força Aérea sul-coreana, um marco importante no programa de desenvolvimento de um caça nacional. Paralelamente, a China intensificou seus investimentos em IA com o lançamento de um novo chip e de um modelo maior, enquanto os Estados Unidos e China consideram a criação de um canal de comunicação sobre IA para lidar com desafios emergentes no campo tecnológico.", "ciencia": "Um dos eventos mais notáveis mencionados é a descoberta de uma cratera gigantesca na Lua, formada por um meteorito em 2024, conforme relatado pela Folha de S. Paulo. Este achado reforça a constante atividade de impactos na superfície lunar. Em outro desenvolvimento, a NASA anunciou que um astronauta, Anil Menon, responderá a perguntas de estudantes de New Hampshire sobre ciência, tecnologia, engenharia e matemática durante sua estadia na Estação Espacial Internacional. Este evento será transmitido ao vivo no canal YouTube da NASA. Em um estudo publicado na Scientific American, matemáticos e entusiastas resolveram um problema matemático 'inverse Galois' que havia resistido a uma solução por décadas, encontrando todas as 25.000 soluções. Este feito revolucionará a compreensão do funcionamento celular e pode levar a novos tratamentos para doenças como câncer e condições autoimunes.", "cultura": "A exposição 'Magritte: This Is Still Not a Pipe' no Gagosian Gallery em Londres apresenta obras que satirizam tanto o psicanalismo quanto o surrealismo, destacando a natureza enigmática e não convencional das obras de Magritte. Em outro evento cultural, a atriz britânica Miranda Richardson, conhecida por papéis em produções como 'Ruth Ellis' e 'Queenie', recebeu diversos prêmios, incluindo um Bafta, duas Globos de Ouro e uma indicação ao Oscar. O leilão de itens pessoais de Brigitte Bardot arrecadou quase 1 milhão de euros em Paris, superando a estimativa inicial, e os fundos irão para a fundação de bem-estar animal da atriz e seu filho. A obra 'Autumn' de Kate Mosse, que explora a cultura e paisagem de seu Sussex favorito, é outro destaque na cena cultural, oferecendo reflexões ternas sobre tempo e lugar. Além disso, a peça 'Catarina e a Beleza de Matar Fascistas', que causou indignação em teatros europeus, foi bem aceita no Reino Unido, com o público assistindo pacientemente até o fim, apenas boicotando o ato final.", "sociedade": "Um morador de rua foi esfaqueado e morreu em um restaurante no Distrito Federal. Logo após o crime, uma mulher que também vivia em situação de rua foi presa. Em outro incidente, uma enfermeira iniciou o atendimento a um paciente com parada cardíaca em uma Unidade Básica de Saúde (UBS) do DF, já que o médico estava de licença. A morte de Bruno Avelar foi confirmada, e a equipe expressou profundo pesar. A campanha de Flávio não planeja realizar um grande ato até o primeiro turno das eleições, uma avaliação que sugere que os correligionários devem se dedicar às suas bases eleitorais. A partir de 1º de outubro, os planos de saúde serão obrigados a cobrir o DIU hormonal para mulheres com endometriose, atendendo a uma necessidade específica dessas pacientes.", "meio_ambiente": "O chefe da ONU, António Guterres, criticou as maiores empresas de combustíveis fósseis durante a Assembleia Geral das Nações Unidas, afirmando que elas devem fazer mais para combater o dano causado pela poluição. Em outro desenvolvimento, o furacão Polo atingiu a força máxima da Categoria 5 no Oceano Pacífico perto da costa do México, mas está previsto para permanecer em alto mar. Em contraste, o temporal que já deixou vítimas no Rio Grande do Sul ameaça causar inundações em 699 municípios do Sul do Brasil. Na Indonésia, mais de 170.000 casos de problemas respiratórios foram registrados devido a incêndios florestais que continuam a espalhar a névoa tóxica pelo archipélago. Por fim, autoridades de Busan estão buscando maneiras de devolver um tubarão de 3,5 metros ao mar após cinco dias consecutivos de sua presença em um parque costeiro.", "direitos_humanos": "O secretário-geral da ONU, António Guterres, alertou sobre o risco de limpeza étnica em Cisjordânia e sobre a devastação sem precedentes em Gaza, três anos após o ataque de Hamás. Guterres ressaltou que a violência em Cisjordânia, os deslocamentos e o crescimento dos assentamentos ameaçam uma solução de dois Estados. Em outro desenvolvimento, um relatório da UN Group of Human Rights Experts indicou que pelo menos oito mortes em custódia ocorreram na Nicarágua desde 2018, durante a repressão à oposição e às instituições democráticas. Além disso, drones atingiram o estado do Norte Kordofan no Sudão, destruindo mais de 330.000 materiais educacionais. Por fim, um homem foi detido e permanece em prisão após ser baleado por um agente da ICE, com o projétil alojado nas costas dele, em um incidente que levanta preocupações sobre a segurança e os direitos humanos. A ADEPA, associação de jornalistas da Argentina, também emitiu uma análise crítica sobre um projeto de lei de soberania que, segundo a associação, poderia ter impactos negativos na liberdade de imprensa."}, "resumo_do_dia": {"politica_nacional": [{"id": 175659, "titulo": "Entre a ONU e as urnas: os recados de Lula ao Brasil", "url": "https://www.metropoles.com/colunas/matheus-leitao/entre-a-onu-e-as-urnas-os-recados-de-lula-ao-brasil", "fonte_id": "metropoles", "data_pub": "2026-09-22T15:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula discursou na ONU abordando temas como eleição, interferência externa, meio ambiente, segurança pública e soberania nacional.", "titulo_pt": "Entre a ONU e as urnas: os recados de Lula ao Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 175492, "titulo": "Cury fará pente-fino e grosso nos gastos, mas mexer em regras da Previdência é inaceitável, diz Hauly", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/c-level-entrevista/2026/09/cury-fara-pente-fino-e-grosso-nos-gastos-mas-mexer-em-regras-da-previdencia-e-inaceitavel-diz-hauly.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato à Presidência pelo Avante, planeja realizar um pente-fino nas despesas do governo e na economia das compras governamentais, caso eleito. Segundo o assessor econômico da campanha, Luiz Carlos Hauly, mexer nas regras da Previdência não será aceitável.", "titulo_pt": "Cury fará pente-fino nos gastos, mas não mexerá na Previdência, diz Hauly", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175467, "titulo": "Lula afirma na ONU que bets destroem famílias e critica big techs: 'Brasil não vai tolerar'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/lula-afirma-na-onu-que-bets-destroem-familias-e-critica-big-techs-brasil-nao-vai-tolerar.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-22T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva afirmou na Assembleia-Geral da ONU que o Brasil não tolerará o modelo de negócios das bets e das big techs, criticando que essas empresas transferem os riscos para as famílias.", "titulo_pt": "Lula critica big techs e bets na ONU e diz que Brasil não tolerará", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 175468, "titulo": "Generais do golpe têm privilégios na prisão se comparados a presos comuns no DF; veja dez pontos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/generais-do-golpe-tem-privilegios-na-prisao-se-comparados-a-presos-comuns-no-df-veja-dez-pontos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os quatro generais de quatro estrelas condenados por golpe de Estado, que cumprem pena há dez meses, gozam de privilégios na prisão em comparação com os presos comuns no Distrito Federal. A comparação destaca diferentes condições de detenção entre os militares e os outros presos.", "titulo_pt": "Generais do golpe têm privilégios na prisão se comparados a presos comuns no DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 175469, "titulo": "Generais do golpe seguem recebendo R$ 38,5 mil, e crise no STF vira munição para manter patentes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/generais-do-golpe-seguem-recebendo-r-385-mil-e-crise-no-stf-vira-municao-para-manter-patentes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro generais de quatro estrelas, condenados por crimes relacionados ao golpe de Estado, continuam recebendo salários como oficiais da reserva, que variam entre R$ 38,5 mil e R$ 39,8 mil. A crise no Supremo Tribunal Federal (STF) se tornou uma ferramenta para manter suas patentes.", "titulo_pt": "Generais condenados pelo golpe continuam recebendo salários e crise no STF mantém patentes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 175470, "titulo": "Casamento do filho de Moraes terá fala do escritor Gabriel Chalita", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/casamento-do-filho-de-moraes-tera-fala-do-escritor-gabriel-chalita.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-22T14:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O escritor Gabriel Chalita, ex-secretário de Educação, será o orador no casamento do filho do ministro Alexandre de Moraes, do Supremo Tribunal Federal, que ocorrerá no próximo sábado em São Paulo. O convite foi feito pelo casal de noivos, que inclui o advogado Alexandre Barci de Moraes.", "titulo_pt": "Chalita será orador no casamento do filho de Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 175554, "titulo": "Leia a íntegra do discurso de Lula na Assembleia Geral da ONU", "url": "https://g1.globo.com/politica/noticia/2026/09/22/leia-a-integra-do-discurso-de-lula-na-assembleia-geral-da-onu.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula fez o discurso de abertura do debate geral da 81ª edição da Assembleia Geral da ONU, defendendo a soberania nacional e criticando a imposição de tarifas, além de mencionar a reforma do Conselho de Segurança da ONU e o pleito brasileiro para reeleição.", "titulo_pt": "Leia a íntegra do discurso de Lula na Assembleia Geral da ONU", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175555, "titulo": "Em discurso na ONU, Lula defende soberania, combate ao crime organizado, regulação de big techs e critica o 'tarifaço'", "url": "https://g1.globo.com/politica/noticia/2026/09/22/em-discurso-na-onu-lula-defende-soberania-combate-ao-crime-organizado-regulacao-de-big-techs-e-critica-o-tarifaco.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula defendeu a soberania dos países e a não interferência interna durante discurso na ONU. Ele também criticou a classificação do Primeiro Comando da Capital pelos Estados Unidos e rejeitou a ideia de terceirizar o combate ao crime organizado no Brasil.", "titulo_pt": "Lula defende soberania e combate ao crime organizado em discurso na ONU", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175556, "titulo": "Na ONU, Lula diz que, nas eleições, brasileiros vão escolher entre democracia e negacionismo; e que não permitirá interferências", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/22/na-onu-lula-diz-que-nas-eleicoes-brasileiros-vao-escolher-entre-democracia-e-negacionismo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, durante discurso na Assembleia Geral da ONU, afirmou que os brasileiros escolherão entre democracia e negacionismo nas eleições de 4 de outubro. O presidente petista defendeu a soberania e o sistema eleitoral brasileiro, rejeitando interferências.", "titulo_pt": "Lula na ONU: eleições de outubro serão entre democracia e negacionismo, afirma presidente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175557, "titulo": "Na ONU, Lula defende o PIX, regras globais para inteligência artificial e regulação de big techs", "url": "https://g1.globo.com/politica/noticia/2026/09/22/na-onu-lula-defende-regras-globais-para-inteligencia-artificial.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula defendeu o PIX, a regulação de grandes empresas tecnológicas e a criação de regras globais para a inteligência artificial durante a 81ª Assembleia Geral da ONU. Ele criticou a tentativa de impor uma versão de neoliberalismo digital sem regras nem transparência.", "titulo_pt": "Lula defende o PIX, regras globais para IA e regulação de big techs na ONU", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175558, "titulo": "Na ONU, Lula defende multilateralismo e chama tarifas comerciais de 'armas de coerção' e de 'chantagem'", "url": "https://g1.globo.com/politica/noticia/2026/09/22/na-onu-lula-defende-multilateralismo-e-chama-tarifas-comerciais-de-chantagem.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula defendeu o multilateralismo e criticou as tarifas comerciais como armas de coerção e chantagem durante sua declaração na abertura da 81ª Assembleia Geral das Nações Unidas. O presidente também alertou que campanhas contra vacinas estão levando doenças antigas de volta.", "titulo_pt": "Lula defende multilateralismo e chama tarifas comerciais de 'armas de coerção'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175560, "titulo": "Na ONU, Lula defende soberania e diz que Brasil 'não cabe no quintal de ninguém'", "url": "https://g1.globo.com/politica/noticia/2026/09/22/na-onu-lula-defende-soberania-em-meio-a-eleicao-no-brasil-e-tensao-com-governo-trump.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula defendeu a soberania dos países e a não interferência em assuntos internos durante seu discurso na ONU. Ele afirmou que 'o Brasil não cabe no quintal de ninguém'.", "titulo_pt": "Lula defende soberania do Brasil na ONU", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175561, "titulo": "Na ONU, Lula diz estar movido pela 'indignação', critica 'imobilismo' do Conselho de Segurança e cobra fim das guerras", "url": "https://g1.globo.com/politica/noticia/2026/09/22/na-onu-lula-cobra-reforma-do-conselho-de-seguranca-e-defende-negociacao-para-encerrar-guerras.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula criticou o 'imobilismo' do Conselho de Segurança da ONU e defendeu uma reforma para melhorar a prevenção e solução de conflitos globais. Ele também mencionou que a democracia está em xeque, citando as eleições.", "titulo_pt": "Lula critica 'imobilismo' do Conselho de Segurança e cobra reforma na ONU", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175865, "titulo": "Mendonça fala em investigar Moraes por denunciação caluniosa e quer acesso ao inquérito das fake news", "url": "https://www.jota.info/stf/do-supremo/mendonca-fala-em-investigar-moraes-por-denunciacao-caluniosa-e-quer-acesso-ao-inquerito-das-fake-news", "fonte_id": "jota", "data_pub": "2026-09-22T14:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Justiça, Anderson Molon, solicitou que o ministro do STF, Alexandre Moraes, seja investigado por denunciação caluniosa e pediu acesso ao inquérito das fake news. Além disso, Molon também requer o arquivamento da representação contra ele mesmo e solicita a apuração sobre um relatório da Polícia Federal.", "titulo_pt": "Mendonça pede investigação de Moraes por denunciação e busca acesso ao inquérito das fake news", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 175471, "titulo": "Lula prova do próprio veneno no incentivo ao antagonismo político", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/09/lula-prova-do-proprio-veneno-no-incentivo-ao-antagonismo-politico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-22T14:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ganhar a eleição no primeiro turno é a meta de todos os candidatos, mas é uma tarefa quase impossível, considerando que, das últimas nove disputas presidenciais, apenas duas foram decididas nessa etapa.", "titulo_pt": "Lula prova do próprio veneno no incentivo ao antagonismo político", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 175562, "titulo": "Arrecadação federal soma R$ 235 bilhões em agosto, recorde para o mês", "url": "https://g1.globo.com/economia/noticia/2026/09/22/arrecadacao-federal-soma-r-235-bilhoes-em-agosto-recorde-para-o-mes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal em agosto de 2023 atingiu R$ 235,6 bilhões, um recorde para o mês e um aumento real de 8,25% em comparação com o mesmo período do ano anterior. Este é o maior valor arrecadado em agosto desde 1995.", "titulo_pt": "Arrecadação federal soma R$ 235 bilhões em agosto, recorde para o mês", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 176188, "titulo": "Russia quietly modernises bomb shelters in Moscow and St Petersburg", "url": "https://www.euronews.com/2026/09/22/russia-quietly-modernises-bomb-shelters-in-moscow-and-st-petersburg", "fonte_id": "euronews", "data_pub": "2026-09-22T15:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo russo destinou milhões de rúpias para a manutenção de abrigos em distritos de Moscou e estações do metrô de São Petersburgo, enquanto drones ucranianos atingiram outra refinaria russa no domingo. A guerra entre Rússia e Ucrânia, declarada pelo Kremlin, está em sua quinta ano.", "titulo_pt": "Rússia moderniza silos de emergência em moscou e são petersburgo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 175862, "titulo": "Lula leva eleição brasileira a discurso da ONU e manda recados indiretos a Trump", "url": "https://www.jota.info/executivo/lula-leva-eleicao-brasileira-a-discurso-da-onu-e-manda-recados-indiretos-a-trump", "fonte_id": "jota", "data_pub": "2026-09-22T15:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula participou da eleição presidencial brasileira e fez um discurso na ONU, onde criticou tarifas, defendeu a agenda climática e pediu a regulação de empresas tecnológicas e inteligência artificial.", "titulo_pt": "Lula na ONU: discurso critica tarifas, defende clima e pede regulação de tecnologia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 175996, "titulo": "US to build ‘two very major’ bases in Greenland, Trump says, and calls to ‘stop the killing’ in Ukraine - Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/22/eu-trump-russia-putin-sanctions-ukraine-greenland-denmark-zelenskyy-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-22T15:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos anunciou a construção de duas bases militares significativas em Groenlândia e pediu para parar os assassinatos na Ucrânia. Em Groenlândia, há uma mistura de esperança, ceticismo e medo devido a um novo acordo sobre segurança arctica entre EUA, Groenlândia e Dinamarca, que ainda não foi detalhado.", "titulo_pt": "Estados unidos planeja construir duas bases significativas em groenlândia e pede fim aos assassinatos na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 176335, "titulo": "Croatia Pushes for Stronger Frontex Role on Western Balkan Migrant Route", "url": "https://balkaninsight.com/2026/09/22/croatia-pushes-for-stronger-frontex-role-on-western-balkan-migrant-route/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-22T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Croácia pressiona a Agência da União Europeia para Fronteiras (Frontex) para que aumente sua presença em Bosnia, um país por onde muitos imigrantes irregulares passam para a Europa. Ministros de Interior da Croácia, Itália e Eslovênia se reúnem para discutir cooperação nessa questão.", "titulo_pt": "Croácia pressiona por papel mais ativo do Frontex na rotunda dos bálcãs ocidentais", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 176146, "titulo": "EU removes two oligarchs reputedly close to Putin from sanctions list", "url": "https://www.lemonde.fr/en/international/article/2026/09/22/usmanov-and-fridman-two-oligarchs-close-to-putin-are-exempted-from-eu-sanctions_6757821_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-22T15:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia removeu dois oligarcas, Alisher Usmanov e Mikhail Fridman, da lista de sanções após solicitação da França e do Luxemburgo. A decisão foi criticada pela Ucrânia.", "titulo_pt": "Ue remove dois oligarcas próximos a Putin da lista de sanções", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 175551, "titulo": "Na ONU, Trump fala em 'proteger' Hemisfério Ocidental; Lula defende soberania e diz que Brasil 'não é quintal'", "url": "https://g1.globo.com/mundo/ao-vivo/assembleia-geral-da-onu-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidentes dos Estados Unidos, Joe Biden, e do Brasil, Luiz Inácio Lula da Silva, discursaram na Assembleia Geral da ONU. Lula enfatizou a soberania do Brasil, enquanto Biden falou sobre proteger o Hemisfério Ocidental.", "titulo_pt": "Trump fala em 'proteger' Hemisfério Ocidental; Lula defende soberania e diz que Brasil 'não é quintal'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 176244, "titulo": "Trump to UN: do I ‘annihilate’ Iran or ‘make a deal?’", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/22/trump-to-un-do-i-annihilate-iran-or-make-a?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-22T15:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, informou à Assembleia Geral da ONU que tem uma decisão importante a tomar em relação ao Irã.", "titulo_pt": "Trump à ONU: posso ‘aniquilar’ o Irã ou ‘negociar’?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 175552, "titulo": "Na ONU, Lula manda recados para os EUA, mas também faz discurso de campanha voltado ao Brasil", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/09/22/na-onu-lula-manda-recados-para-os-eua-mas-tambem-faz-discurso-em-tom-de-campanha-voltado-ao-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T15:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula, em seu discurso na Assembleia Geral das Nações Unidas, fez críticas implícitas ao presidente dos Estados Unidos, Donald Trump, e abordou temas de sua campanha eleitoral, como o PIX, o combate às bets e a reforma do horário de trabalho no Brasil.", "titulo_pt": "Lula, na ONU, critica EUA e toca em temas de campanha para Brasil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 176295, "titulo": "Saudi Arabia signals East-West pipeline reopening", "url": "https://www.ft.com/content/5b4f8738-3b93-40c8-88d6-08c8ea684e83?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-22T15:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rota crucial para o petróleo saudita chegar ao Mar Vermelho está fechada há duas semanas devido a ataques com drones.", "titulo_pt": "Arábia saudita sinaliza reabertura de oleoduto oriente-ocidente", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 175493, "titulo": "Organização ligada à CIA vai treinar e financiar funcionários do Banco Mundial no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/organizacao-ligada-a-cia-vai-treinar-e-financiar-funcionarios-do-banco-mundial-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Mundial contratou a Noble Reach, uma organização associada à CIA, para enviar oito funcionários norte-americanos para os escritórios do banco no Brasil, Panamá e Colômbia.", "titulo_pt": "Organização ligada à CIA vai treinar e financiar funcionários do Banco Mundial no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 176039, "titulo": "Washington Should Embrace Space Warfare", "url": "https://foreignpolicy.com/2026/09/22/space-force-washington-nuclear-china-russia-satellite/", "fonte_id": "foreign_policy", "data_pub": "2026-09-22T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O espaço já está se tornando militarizado. Os Estados Unidos não devem deixar que seus adversários tomem a iniciativa.", "titulo_pt": "Washington deve abrace a guerra espacial", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 176189, "titulo": "New rotation of US troops bound for Lithuania, Lithuanian president says", "url": "https://www.euronews.com/2026/09/22/new-rotation-of-us-troops-bound-for-lithuania-lithuanian-president-says", "fonte_id": "euronews", "data_pub": "2026-09-22T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há um novo deslocamento de tropas americanas para a Lituânia, conforme informou o presidente lituano. Isso ocorre apesar das repetidas ameaças do ex-presidente dos Estados Unidos, Donald Trump, de reduzir a presença militar norte-americana na Europa.", "titulo_pt": "Novo deslocamento de tropas americanas para a lituânia, diz presidente", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 175863, "titulo": "Novos vazamentos do celular de Vorcaro e escândalos em série mantêm STF sob tensão", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-flavia-maia/novos-vazamentos-do-celular-de-vorcaro-e-escandalos-em-serie-mantem-stf-sob-tensao", "fonte_id": "jota", "data_pub": "2026-09-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novos vazamentos sobre o celular de Vorcaro e novos escândalos estão mantendo o STF sob tensão. O pedido de vista não está ajudando a decantar a situação, ao contrário, está expondo fissuras cada vez maiores no tribunal.", "titulo_pt": "Novos vazamentos e escândalos mantêm STF sob tensão", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 175553, "titulo": "Delegação dos EUA não aplaude discurso de Lula na ONU em nenhum momento", "url": "https://g1.globo.com/mundo/noticia/2026/09/22/delegacao-dos-eua-nao-aplaude-discurso-de-lula-na-onu.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-22T14:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Brasil, Luiz Inácio Lula da Silva, fez um discurso durante a 81ª Assembleia Geral das Nações Unidas, em 22 de setembro de 2026, mas a delegação dos Estados Unidos não o aplaudiu em nenhum momento. Howard Lutnick, secretário do Comércio dos EUA, estava presente durante o discurso.", "titulo_pt": "Delegação dos EUA não aplaudiu discurso de Lula na ONU em nenhum momento", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 175735, "titulo": "Trump exalta força dos EUA e ameaça ‘aniquilar’ Irã em discurso na ONU", "url": "https://www.infomoney.com.br/mundo/trump-exalta-forca-dos-eua-e-ameaca-aniquilar-ira-em-discurso-na-onu/", "fonte_id": "infomoney", "data_pub": "2026-09-22T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, proferiu um discurso na ONU onde destacou a força dos EUA e ameaçou aniquilar o Irã. Trump também defendeu sua política externa e reafirmou que o Irã não poderá desenvolver armas nucleares.", "titulo_pt": "Trump exalta força dos EUA e ameaça ‘aniquilar’ Irã em discurso na ONU", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 176247, "titulo": "UN Chief condemns Gaza destruction, West Bank settlements", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/22/un-chief-condemns-gaza-destruction-west-bank-settlements?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-22T14:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antonio Guterres, em seu último discurso na Assembleia Geral das Nações Unidas como secretário-geral, condenou os assassinatos em Gaza. Ele também se referiu às colonizações na Cisjordânia.", "titulo_pt": "Chefe da ONU condena destruição em Gaza e colonizações na cisjordânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 175728, "titulo": "Juros altos são a fatura da gastança dos EUA, não distorção, diz Howard Marks", "url": "https://www.infomoney.com.br/onde-investir/juros-altos-sao-a-fatura-da-gastanca-dos-eua-nao-distorcao-diz-howard-marks/", "fonte_id": "infomoney", "data_pub": "2026-09-22T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Howard Marks, cofundador da Oaktree, afirma em novo memorando que os juros altos são consequência da gastança dos EUA e não de uma distorção econômica. Ele argumenta que a ação do Tesouro não resolve diretamente o déficit, a inflação e a demanda por capital que pressionam os rendimentos dos títulos longos.", "titulo_pt": "Juros altos são a fatura da gastança dos EUA, não distorção, diz Howard Marks", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 175707, "titulo": "Meridian prevê US$ 322 milhões para desenvolver mina de ouro e cobre em MT", "url": "https://www.cnnbrasil.com.br/noticias/meridian-preve-us-322-milhoes-para-desenvolver-mina-de-ouro-e-cobre-em-mt/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-22T15:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meridian prevê investir US$ 322 milhões para desenvolver uma mina de ouro e cobre em Mato Grosso, com produção esperada por quase 14 anos e retorno do investimento em menos de um ano. O empreendimento ainda aguarda a licença de instalação.", "titulo_pt": "Meridian projeta investimento de US$ 322 milhões para mina de ouro e cobre em MT", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 176298, "titulo": "EU to lift sanctions on two Russian oligarchs", "url": "https://www.ft.com/content/760091dd-20be-4152-aa0d-561475a99ee8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-22T15:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As sanções contra Mikhail Fridman e Alisher Usmanov, oligarcas russos, serão levantadas sob um acordo que estende as restrições por mais três anos.", "titulo_pt": "Ue vai levantar sanções contra dois oligarcas russos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 175494, "titulo": "Data centers serão motor e foco de tensão global, aponta Fórum Econômico Mundial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/data-centers-serao-motor-e-foco-de-tensao-global-aponta-forum-economico-mundial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial, apesar de ser vista como uma fonte de otimismo para a economia, pode enfrentar resistência local devido aos aumentos de preços de energia e água, resultantes do crescimento dos data centers.", "titulo_pt": "Data centers serão motor e foco de tensão global, aponta Fórum Econômico Mundial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175495, "titulo": "Está chovendo caixas em entregas da Amazon com drones e irritando moradores nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/esta-chovendo-caixas-em-entregas-da-amazon-com-drones-e-irritando-moradores-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Moradores nos Estados Unidos estão se irritando com o som de caixas sendo entregues por drones pela Amazon. O ruído repentino tem causado desconforto para a população.", "titulo_pt": "Está chovendo caixas em entregas de drones da Amazon irritando moradores nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175997, "titulo": "European drugmakers say they are ‘losing ground’ to US and Chinese rivals", "url": "https://www.theguardian.com/business/2026/sep/22/european-drugmakers-losing-ground-us-chinese-rivals", "fonte_id": "guardian_world", "data_pub": "2026-09-22T15:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove das maiores empresas farmacêuticas da Europa, incluindo AstraZeneca, GSK e Novo Nordisk, escreveram a líderes nacionais pedindo ações para proteger suas empresas, pois o continente estaria perdendo espaço para concorrentes dos EUA e China no desenvolvimento de novos medicamentos e atração de investimentos.", "titulo_pt": "Farmacêuticas europeias dizem estar 'perdendo terreno' para rivais dos EUA e china", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 175731, "titulo": "Lula diz que Brasil baterá recorde de exportações apesar de tarifaço dos EUA", "url": "https://www.infomoney.com.br/politica/lula-diz-que-brasil-batera-recorde-de-exportacoes-apesar-de-tarifaco-dos-eua/", "fonte_id": "infomoney", "data_pub": "2026-09-22T14:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula afirmou que o Brasil alcançará um recorde em exportações, apesar das tarifas impostas pelos Estados Unidos.", "titulo_pt": "Lula afirma que Brasil baterá recorde de exportações apesar das tarifas dos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 175496, "titulo": "JBS amplia linha da Seara e aposta em alimentos proteicos que vão de salgadinho a bebidas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/jbs-amplia-linha-da-seara-e-aposta-em-alimentos-proteicos-que-vao-de-salgadinho-a-bebidas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T14:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A JBS expandiu sua linha de produtos proteicos da Seara e criou novas iniciativas para auxiliar outras empresas a desenvolver produtos com alto teor de proteína. A empresa está diversificando sua oferta para incluir alimentos como salgadinhos e bebidas.", "titulo_pt": "JBS expande linha de alimentos proteicos da Seara e auxilia outras empresas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175603, "titulo": "Arrecadação federal ultrapassa R$ 2 trilhões em oito meses", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/arrecadacao-federal-ultrapassa-r-2-trilhoes-em-oito-meses", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-22T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal atingiu R$ 2,019 trilhões nos primeiros oito meses de 2026, crescendo 7,12% em comparação com o mesmo período de 2025. Em agosto, a arrecadação foi de R$ 235,5 bilhões, representando um aumento de 8,25% na comparação anual.", "titulo_pt": "Arrecadação federal ultrapassa R$ 2 trilhões em oito meses", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 175864, "titulo": "Bets no Brasil: da legalização às novas restrições regulatórias", "url": "https://www.jota.info/opiniao-e-analise/colunas/mulheres-na-regulacao/bets-no-brasil-da-legalizacao-as-novas-restricoes-regulatorias", "fonte_id": "jota", "data_pub": "2026-09-22T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de apostas no Brasil que cresceu sob regras menos restritivas agora enfrenta um debate sobre a adoção de novas limitações regulatórias estabelecidas pelo Estado.", "titulo_pt": "Aposta no Brasil: da legalização às novas restrições regulatórias", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 176232, "titulo": "10-year Treasury yield slips further below 5% as traders await Fed comments", "url": "https://www.cnbc.com/2026/09/22/treasury-yield-us-bond-market-trump.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-22T14:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro dos Estados Unidos de 10 anos diminuíram, enquanto os investidores aguardavam novas indicações sobre o estado da economia americana. Os traders estavam particularmente atentos às observações do Federal Reserve sobre a economia.", "titulo_pt": "Rendimentos do tesouro de 10 anos nos EUA caem abaixo de 5% à espera de comentários do Fed", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 175498, "titulo": "Petróleo cai quase 3%, volta a ficar abaixo de US$ 100 e tem menor valor em duas semanas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/petroleo-cai-mais-de-3-volta-a-ficar-abaixo-de-us-100-e-tem-menor-valor-em-duas-semanas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo caiu quase 3% e retornou abaixo dos US$ 100, tendo o menor valor em duas semanas. Isso ocorreu após a Arábia Saudita indicar a possibilidade de reabrir o oleoduto Leste-Oeste e uma autoridade do Irã afirmar que o estreito de Hormuz pode ter a navegação liberada em até sete dias.", "titulo_pt": "Petróleo cai quase 3%, volta a ficar abaixo de US$ 100 e tem menor valor em duas semanas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175499, "titulo": "Vale compra 30% da Ligga e fecha acordo para compra de minério", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/vale-compra-30-da-ligga-e-fecha-acordo-de-minerio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T13:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vale adquiriu 30% da mineradora Ligga S.A. por US$ 190 milhões, com o objetivo de expandir a produção e garantir a exclusividade na compra do minério produzido. O acordo foi confirmado pela empresa nesta terça-feira (22).", "titulo_pt": "Vale compra 30% da Ligga e fecha acordo para expansão de produção", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175866, "titulo": "Redata: a nova fronteira da desoneração digital no Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/redata-a-nova-fronteira-da-desoneracao-digital-no-brasil", "fonte_id": "jota", "data_pub": "2026-09-22T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo regime combina incentivos fiscais e obrigações para atrair investimentos em data centers e infraestrutura digital. Este novo esquema visa promover a desoneração digital no Brasil, incentivando a implantação de tecnologias avançadas.", "titulo_pt": "Redata: a nova fronteira da desoneração digital no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 176513, "titulo": "STAT+: Pharmalittle: We’re reading about pharma seeking to protect China deals, a Roche obesity drug, and more", "url": "https://www.statnews.com/pharmalot/2026/09/22/pharma-seeks-to-protect-china-deals-roche-obesity-drug/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-22T13:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas farmacêuticas ocidentais estão pedindo ao governo de Trump que permita que continuem fazendo negócios com empresas chinesas para candidatos a medicamentos. Isso se refere a acordos de desenvolvimento de medicamentos que estão sendo feitos entre empresas de diferentes países.", "titulo_pt": "Pharmalittle: empresas farmacêuticas ocidentais pedem ao governo trump para manter acordos com empresas chinesas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 175500, "titulo": "Dólar sobe e Bolsa cai com repercussão da ata do Copom e de pesquisa eleitoral", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/dolar-abre-em-alta-com-investidores-repercutindo-ata-do-copom.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T13:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar registra leve alta nesta terça-feira (22), com investidores repercutindo a ata do Copom, que indicou perda de força da atividade econômica devido a juros altos e queda da inflação. A bolsa, por outro lado, está em baixa.", "titulo_pt": "Dólar sobe e Bolsa cai com ata do Copom e pesquisa eleitoral", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 175497, "titulo": "Funcionários de empresas de IA relatam burnout e estresse mental com avanço da tecnologia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/funcionarios-de-empresas-de-ia-relatam-burnout-e-estresse-mental-com-avanco-da-tecnologia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T14:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Funcionários de empresas e instituições de IA de ponta estão experimentando maior desgaste mental devido ao trabalho em sistemas que podem causar danos graves à sociedade. Esses profissionais relatam estresse mental avançado com o avanço tecnológico.", "titulo_pt": "Funcionários de empresas de IA relatam burnout e estresse mental com avanço da tecnologia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 176477, "titulo": "Barbara Mazzolai Wants to Build a New Field of Robotics", "url": "https://spectrum.ieee.org/sustainability-robotics-barbara-mazzolai", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Barbara Mazzolai é uma robótica que busca inspiração na natureza em sua carreira. Ela desenvolve robôs baseados em organismos vivos como octópus, raízes de plantas e sementes, e agora quer assegurar que suas tecnologias contribuam para o meio ambiente.", "titulo_pt": "Barbara Mazzolai quer criar uma nova área de robótica", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 176381, "titulo": "Roundtables: The Deadly Failures of The Virtual Border Wall", "url": "https://www.technologyreview.com/2026/09/22/1144890/roundtables-the-deadly-failures-of-the-virtual-border-wall/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-22T13:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O EUA gastou bilhões de dólares nos últimos 25 anos construindo uma 'muralha virtual' de torres de vigilância ao longo de sua fronteira sul, prometendo que essas torres ajudariam a detectar e prender infratores e salvar vidas. No entanto, uma investigação inovadora do MIT Technology Review documentou mais de mil pessoas que passaram por áreas sob vigência dessas torres.", "titulo_pt": "Redondas: os falhas letais da muralha Virtual de fronteira", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 176415, "titulo": "Viture’s Vonder Glasses Are Meant to Map Your Mind", "url": "https://www.wired.com/story/viture-vonder-glasses-are-meant-to-map-your-mind/", "fonte_id": "wired", "data_pub": "2026-09-22T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os óculos inteligentes da Viture não possuem câmeras e usam microfones de condução óssea para gravar as reflexões diárias de forma privada.", "titulo_pt": "Viture’s Vonder Glasses: óculos inteligentes sem câmeras", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 176416, "titulo": "Adobe Premiere, One of the iPhone’s Best Video-Editing Apps, Is Now on Android", "url": "https://www.wired.com/story/adobe-premiere-now-on-android/", "fonte_id": "wired", "data_pub": "2026-09-22T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aplicativo de edição de vídeo Premiere, que já estava disponível para iPhone, agora está disponível para Android com layouts únicos para telas de barra de chocolate e dispositivos dobráveis. É gratuito e já está disponível para download.", "titulo_pt": "Premiere, uma das melhores Apps de edição de vídeo do iphone, agora disponível para Android", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 176417, "titulo": "AI Models Built From Rat Brains Just Got Closer to Reality", "url": "https://www.wired.com/story/ai-models-built-from-rat-brains-are-about-to-become-a-reality/", "fonte_id": "wired", "data_pub": "2026-09-22T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Biological Computing Company está integrando suas ferramentas de IA com o Amazon Web Services, expandindo um campo que busca combinar a biologia com o código informático.", "titulo_pt": "Modelos de IA construídos a partir de cérebros de ratos estão mais próximos da realidade", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 176478, "titulo": "The Future Is Fanless: 100% Heat Capture for Liquid Cooled AI Servers", "url": "https://spectrum.ieee.org/fanless-liquid-cooled-ai-servers-coolit", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-22T12:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de refrigeração líquida pode ser usada para servidores de IA acima de 250 kW, onde uma abordagem híbrida de líquido e ar não é suficiente. A CoolIT desenvolve sistemas de loops líquidos modulares que capturam quase toda a calor, permitindo que os servidores operem sem ventiladores. Esses sistemas já foram testados em seis gerações de designs sem ventiladores.", "titulo_pt": "Futuro sem ventiladores: 100% de captura de calor para servidores de IA líquidos", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 176382, "titulo": "The Download: why AI’s latest breakthroughs and fears may be more hype than reality", "url": "https://www.technologyreview.com/2026/09/22/1144910/the-download-dont-believe-ai-hype/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-22T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este é o boletim diário The Download, que fornece notícias sobre o mundo da tecnologia. A discussão sugere que as recentes avanços e preocupações em inteligência artificial podem ser mais especulação do que realidade.", "titulo_pt": "Download: por que os avanços e preocupações mais recentes em AI podem ser mais especulação do que realidade", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 176427, "titulo": "1st mass-produced KF-21 delivered to Air Force, marking milestone for homegrown fighter program", "url": "https://www.koreaherald.com/article/10882615", "fonte_id": "korea_herald", "data_pub": "2026-09-22T11:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro lote de produção em massa do caça KF-21 Boramae foi entregue à Força Aérea sul-coreana, marcou um importante marco no programa de desenvolvimento de um caça nacional da Coreia do Sul. O avião decolou de uma fábrica da Korea Aerospace Industries e voou para sua primeira base operacional.", "titulo_pt": "Primeira produção em massa do KF-21 boramae entregue à força aérea, marco para programa de caça nacional", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 175508, "titulo": "AMD atinge US$ 1 tri em valor de mercado, impulsionada pela demanda por ações ligadas à IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/amd-atinge-us-1-tri-em-valor-de-mercado-impulsionada-pela-demanda-por-acoes-ligadas-a-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-22T11:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A AMD (Advanced Micro Devices) atingiu pela primeira vez uma valor de mercado de US$ 1 trilhão, se juntando a um pequeno grupo de fabricantes de chips que alcançaram esse patamar. Este feito ocorreu nesta segunda-feira (22), impulsionado pela demanda por ações ligadas à IA.", "titulo_pt": "AMD atinge US$ 1 trilhão em valor de mercado, impulsionada pela demanda por ações ligadas à IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 176312, "titulo": "Fake and divisive ads proliferate in Israel’s first AI election", "url": "https://www.japantimes.co.jp/news/2026/09/22/world/fake-ads-israel-ai-election/", "fonte_id": "japan_times", "data_pub": "2026-09-22T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições em Israel serão as primeiras desde os ataques letais do Hamas no sul do país em 7 de outubro de 2023. A campanha eleitoral incluirá anúncios falsos e divisivos.", "titulo_pt": "Anúncios falsos e divisivos proliferam nas primeiras eleições de Israel após ataques do hamas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 176296, "titulo": "AI staff complain of mental toll over fears of threat to society", "url": "https://www.ft.com/content/60870960-f433-48ca-bc2c-708686a69ae7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-22T11:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de alto nível de empresas como Aisi, OpenAI, Anthropic e Google DeepMind relatam sintomas de esgotamento e estresse em relação ao desenvolvimento de inteligência artificial poderosa.", "titulo_pt": "Funcionários de AI relatam esgotamento e estresse sobre riscos sociais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 176383, "titulo": "Don’t be fooled by this summer of AI hype", "url": "https://www.technologyreview.com/2026/09/22/1144867/dont-be-fooled-summer-ai-hype/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-22T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há meses, há uma grande especulação em torno da inteligência artificial, com empresas como Anthropic e OpenAI anunciando avanços em suas tecnologias. Em abril, a Anthropic afirmou que seu modelo Claude Mythos é mais eficaz na detecção de vulnerabilidades em software do que a maioria dos especialistas em segurança. Em seguida, ocorreram incidentes de hacking envolvendo modelos de ambas as empresas, que foram revelados por Anthropic e Meta.", "titulo_pt": "Não se iluda com essa estação de hype da IA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 176419, "titulo": "The UK Government Faces a Reckoning Over Palantir", "url": "https://www.wired.com/story/the-uk-government-faces-a-reckoning-over-palantir/", "fonte_id": "wired", "data_pub": "2026-09-22T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Burnham, agora primeiro-ministro do Reino Unido, enfrenta a primeira prova de seu governo ao considerar rescindir o contrato de £330 milhões da Palantir com o Serviço Nacional de Saúde (NHS) e potencialmente criar uma tensão com a tecnologia de grande porte e Washington.", "titulo_pt": "Reino unido enfrenta desafio com Palantir", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 176420, "titulo": "Everything You Know About Political Violence Is Probably Wrong", "url": "https://www.wired.com/story/book-excerpt-political-violence-robert-pape-our-own-worst-enemies/", "fonte_id": "wired", "data_pub": "2026-09-22T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Debates sobre o aumento da violência política e quem é responsável por ela não são motivados apenas por ideologias, mas também por definições diferentes sobre o que deve ser contabilizado.", "titulo_pt": "Tudo que você sabe sobre violência política provavelmente está errado", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 176313, "titulo": "As Trump and Xi meet, investors play both sides of AI divide", "url": "https://www.japantimes.co.jp/business/2026/09/22/investors-ai-divide/", "fonte_id": "japan_times", "data_pub": "2026-09-22T10:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os investimentos públicamente divulgados conectam as empresas em uma rivalidade que analistas comparam à corrida espacial da Guerra Fria.", "titulo_pt": "Trump e Xi se encontram, investidores se dividem entre as competidoras AI", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 176580, "titulo": "NASA’s Chandra Finds Unusual Objects in Pinwheel Galaxy", "url": "https://www.nasa.gov/image-article/nasas-chandra-finds-unusual-objects-in-pinwheel-galaxy/", "fonte_id": "nasa_news", "data_pub": "2026-09-22T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Usando o Observatório Espacial X Chandra da NASA, os pesquisadores descobriram objetos estranhos em uma galáxia denominada Pinhão, que emitem raios-X de baixa energia, mas níveis intensos de radiação ultravioleta. Uma imagem dessa galáxia, M101, foi divulgada em 9 de setembro de 2026.", "titulo_pt": "Nasa encontra objetos misteriosos no pinhão", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 176351, "titulo": "Learning from Ukraine war, Chinese military doctors target injuries from drones", "url": "https://www.scmp.com/news/china/military/article/3368392/learning-ukraine-war-chinese-military-doctors-target-injuries-drones?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Military médicos chineses estão desenvolvendo tratamentos para ferimentos comuns causados por drones, baseando-se em lições aprendidas nas guerras na Ucrânia e no Oriente Médio, segundo a CCTV. Cranio-maxilo-facial, ou ferimentos na cabeça, têm se tornado um problema significativo em conflitos dominados por drones, de acordo com Chen Juxiang, um médico militar sênior chinês.", "titulo_pt": "Médicos militares chineses aprendem com guerra na Ucrânia para tratar ferimentos de drones", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 176548, "titulo": "Meet the ‘fire amoeba,’ a record-breaking survivor of extreme heat", "url": "https://www.sciencenews.org/article/fire-amoeba-record-breaking-heat", "fonte_id": "science_news", "data_pub": "2026-09-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incendiamoeba cascadensis é uma amoeba que pode se replicar a 145°F, quebrando o recorde de tolerância ao calor para eucariotos, um reino de organismos que inclui plantas e animais.", "titulo_pt": "Conheça a 'amoeba fogo', uma sobrevivente extremamente resistente ao calor", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 176562, "titulo": "RFK, Jr., is focusing attention on electromagnetic fields. Here’s what the science says about exposure", "url": "https://www.scientificamerican.com/article/rfk-jr-is-focusing-attention-on-electromagnetic-fields-heres-what-the-science-says-about-exposure/", "fonte_id": "scientific_american", "data_pub": "2026-09-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pesquisas sobre como ondas eletromagnéticas e radiação de frequência radioelétrica afetam a saúde têm sido afetadas por estudos de baixa qualidade. O filho do ex-presidente americano, RFK Jr., está direcionando atenção para esses campos eletromagnéticos.", "titulo_pt": "RFK Jr. Está direcionando atenção para campos eletromagnéticos. Veja o que a ciência diz sobre a exposição", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 176511, "titulo": "STAT+: Novo may be getting a better deal than expected with Medicare’s Bridge program", "url": "https://www.statnews.com/2026/09/22/biotech-news-novo-may-be-getting-a-better-deal-than-expected-with-medicare-bridge/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-22T14:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eli Lilly e Novo Nordisk estavam recebendo uma vantagem significativa com o programa piloto do governo Trump que cobria medicamentos para obesidade para idosos a um custo de $245 mensais. O programa Medicare Bridge está proporcionando um benefício maior do que se esperava para essas empresas.", "titulo_pt": "Novo pode estar recebendo um melhor acordo do que esperado com o programa Bridge do Medicare", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 176563, "titulo": "This year’s El Niño just broke another sobering record", "url": "https://www.scientificamerican.com/article/this-years-el-nino-just-broke-another-sobering-record/", "fonte_id": "scientific_american", "data_pub": "2026-09-22T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano, o fenômeno El Niño provavelmente se tornou o evento mais extremo registrado até o momento, segundo um cientista do clima.", "titulo_pt": "Este ano’s El Niño bateu outro recorde desolador", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 175529, "titulo": "Pesquisadores usam fezes humanas para criar concreto mais resistente", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/pesquisadores-usam-fezes-humanas-para-criar-concreto-mais-resistente.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-22T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": nul
