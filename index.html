<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "11/10/2026 15:27", "stats": {"noticias_novas": 650, "resumos_gerados": 209}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-presidente Jair Bolsonaro e seu filho Flávio Bolsonaro, candidato à Presidência, continuam disputando o segundo turno das eleições. Flávio Bolsonaro venceu Lula em todos os 52 municípios de Rondônia no primeiro turno. O ex-presidente Jair Bolsonaro se reuniu com prefeitos em São Paulo para orientar a campanha nas cidades. Por sua vez, o presidente Lula comentou sobre a necessidade de votar o fim da escala 6×1 e a PEC da Segurança Pública na quarta-feira. Ele também reagiu contra a censura do TSE ao canal 'Exército do Lula' e anunciou que a votação ocorreria naquela quarta-feira. A campanha de Lula também planeja um evento com caminhoneiros, e a plataforma Meta atribuiu a 'problemas técnicos' a diminuição do alcance das postagens relacionadas à campanha do candidato Lula.", "mundo": "Raphaël Glucksmann venceu a primária do Partido Socialista francês com 66,13% dos votos, garantindo sua posição como candidato do centro-esquerda para a próxima eleição presidencial francesa. Em outro desenvolvimento, mais de cem migrantes morreram após a capotagem de uma embarcação perto de Djibuti, com 15 crianças entre as vítimas. O presidente dos Estados Unidos, Donald Trump, anunciou um cessar-fogo energético entre Ucrânia e Rússia sem consultar o presidente ucraniano, Volodymyr Zelenskyy, que negou ter conhecimento sobre o acordo. Além disso, um projétil atingiu um terminal de passageiros no aeroporto de Riad, na Arábia Saudita, em um novo ataque atribuído aos hutíes, agravando a tensão na região.\n\nAs tensões geopolíticas no Oriente Médio continuam a crescer, com ataques recorrentes e confrontos entre países. Um ataque aéreo no aeroporto internacional de Riad, na Arábia Saudita, foi atribuído aos hutíes, resultando em 12 mortos e cerca de 300 feridos. Este foi o incidente mais letal na Arábia Saudita em mais de uma década. O Irã considera a resposta dos Estados Unidos insuficiente em relação ao Estreito de Ormuz, e o chefe da segurança iraniano, Mohsen Rezaei, acusa o governo dos Estados Unidos de envolver 'ladrões' na costa do Omã para esvaziar o bloqueio iraniano. Além disso, Israel estendeu o 'Limite Amarelo' em Gaza, enquanto o governo do Irã condena a resposta dos Estados Unidos sobre a passagem de Ormuz. A Arábia Saudita está avaliando sua resposta a este ataque, que foi o mais letal em uma década.", "economia": "A economia global enfrenta diversos desafios e oportunidades, conforme indicam os artigos. A China destaca-se na produção de tambaqui, um fato que ganhou destaque no discurso econômico. O cancelamento de participantes de um congresso de energia em Riad, devido a um ataque aéreo, reflete preocupações com a segurança e a estabilidade dos mercados. A Volkswagen, liderada por Oliver Blume, busca apoio dos formuladores de políticas europeus para reestruturar a empresa, em meio a uma concorrência intensa com montadoras chinesas. A economia argentina enfrenta uma retração significativa, com mais de 32 mil empresas fechando durante o governo de Javier Milei, resultando em uma perda de 121 mil postos de trabalho. A Organização para a Cooperação e Desenvolvimento Econômico (OCDE) alerta sobre o desafio previdenciário enfrentado pelos países emergentes, devido à informalidade generalizada. O Banco Central realiza um teste regulatório de ativos digitais, com o primeiro indeferimento previsto para 30 de outubro, que pode influenciar a interpretação das novas alíquotas do IBS e CBS. A informalidade também é um problema na Índia, onde a construção de um data center de 75 bilhões de dólares pela Google enfrenta oposição ambiental. A cautela dos investidores em relação ao endividamento para projetos de inteligência artificial desacelera a captação de dívida para IA. Os riscos para os títulos de dívida italianos também são destacados, com a ampliação dos objetivos de déficit para 2027-28, aumento dos juros e incerteza eleitoral levantados pelo Goldman Sachs.", "tecnologia": "A Microsoft enfatizou a necessidade de um 'freio de emergência' na inteligência artificial (IA), argumentando que é crucial ter um mecanismo para parar o desenvolvimento em situações perigosas. Essa preocupação sobre a segurança da IA foi acentuada por alertas de outros especialistas, como Bill Gates, que advertiu sobre o risco crescente de ciberataques impulsionados por IA no próximo ano. Na área de tecnologia, a Amazon está promovendo uma variedade de produtos, incluindo headsets para jogos, fones de ouvido Bluetooth e memórias RAM DDR5. Além disso, a NASA disponibilizou online mais de 800GB de dados científicos da missão Artemis II. Na pesquisa médica no Brasil, a IA está revolucionando o desenvolvimento de medicamentos, acelerando o processo e tornando-o mais preciso e inclusivo.", "ciencia": "A confiança na ciência diminuiu globalmente, de acordo com um estudo que abrangeu a era do COVID-19. Isso pode ter implicações significativas para a saúde pública. Em outro desenvolvimento, cientistas chineses, liderados por Shing-Tung Yau, formaram uma aliança com o objetivo de integrar a inteligência artificial na pesquisa matemática, visando superar o atraso em relação aos Estados Unidos. Além disso, um estudo publicado na revista eBioMedicine associou sintomas da COVID-19 prolongada à diminuição de até 20% na dopamina cerebral dos pacientes, destacando o impacto da doença na saúde mental.", "cultura": "Oscar é a única maneira de trazer as pessoas aos cinemas hoje, afirma John Malkovich durante o London Film Festival. Ele comparou as campanhas atuais ao Oscar com as de décadas atrás, salientando a intensidade das campanhas modernas. No programa 'Em Família', Faustão fez uma rara aparição para homenagear Sabrina Sato, que está grávida de seu segundo filho. O musical 'Meu Filho É um Musical', sobre Paulo Gustavo, completou sua centésima apresentação no Teatro Renault em São Paulo, encerrando sua temporada. A Globo e a Endemol Shine Brasil assinaram um contrato para produzir novos programas sem roteiro a partir de 2027, incluindo reality shows e documentários. O Santuário Nacional de Aparecida realizará missas, consagrações e procissões no Dia da Nossa Senhora Aparecida, movimentando o turismo paulista com expectativa de mais de 500 mil fiéis. A prefeita de Manchester, Bev Craig, anunciou um investimento de 2 milhões de libras para apoiar artistas locais, independentemente do gênero musical, argumentando que a cena musical de Manchester é mais diversa do que a dos Oasis. O ator Richard E. Grant admitiu que sua saída prematura do programa 'The Celebrity Traitors' ocorreu porque ele não imaginou que seus colegas de competição o levariam a sério. O projeto 'L'Aiguilleuse' transformou uma antiga caixa de sinalização ferroviária em um kiosque-bar no Jardins de l'Estuaire, em Nantes, França, preservando a história industrial do local.", "sociedade": "Um casal foi detido após a morte de um menino de dois anos, destacando a gravidade dos casos de negligência infantil. Em outro incidente, Bernardo Tertuliano Visioná, um campeão mirim de hipismo de 13 anos, faleceu em um acidente no Rio de Janeiro, junto com a mãe, os tios e a prima. Esses eventos refletem a vulnerabilidade de crianças e adolescentes em situações de risco. No que diz respeito à saúde mental, a psiquiatra Lilliane, que descobriu câncer de mama aos 45 anos, compartilhou sua experiência, enfatizando a importância de lidar com a condição em um mundo que exige cuidados contínuos. Além disso, a obesidade continua a ser um problema de saúde pública no Brasil, com o Dia de Prevenção da Obesidade celebrado neste domingo, reforçando a necessidade de medidas preventivas. Em um contexto mais amplo, a inteligência artificial está questionando o modelo educacional tradicional, levantando dúvidas sobre a eficácia do sistema atual.", "meio_ambiente": "No início de outubro, o número de focos de incêndio no Amazonas aumentou 271% em comparação com o mesmo período do ano anterior, totalizando 1.380 focos nos primeiros dez dias, de acordo com um relatório do CNN Brasil. A Organização das Nações Unidas (ONU) alerta para os riscos do calor extremo à saúde das gestantes, associando altas temperaturas a partos prematuros e complicações, conforme informa o Metrópoles.", "direitos_humanos": "Pelo menos 139 migrantes morreram após uma embarcação afundar perto de Djibouti, de acordo com a OIM. Anualmente, milhares de migrantes viajam pela África Oriental através de Djibouti, em direção ao Estreito de Bab el-Mandeb, com o objetivo de chegar a países do Golfo. Em outro incidente, um menino palestino de sete anos morreu após ser baleado por forças israelenses em um acampamento de refugiados em Jabalia, no norte da Faixa de Gaza, no sábado, 14 de outubro de 2023. O incidente ocorreu no sábado, e desde 7 de outubro de 2023, 74.377 palestinos morreram e 175.398 foram feridos em Gaza devido a confrontos com as forças israelenses. Além disso, um tribunal na Índia ordenou a libertação dos líderes do 'movimento das baratas', que tem grande apoio entre a geração Z, sob a condição de manter a ordem pública, embora as prisões continuem. Em outro desenvolvimento, a 100 anos da Convenção sobre a Escravidão, novas regulamentações foram discutidas, mas persistem omissões. Um ex-treinador olímpico de natação da Irlanda, George Gibney, de 77 anos, será julgado por abusar de quatro jovens atletas nos anos 1970 e 1980. Por fim, dois grupos de direitos humanos pediram o libertamento de três ativistas detidos em Hong Kong e Tailândia, em Seul, Coreia do Sul, no dia 11 de outubro."}, "resumo_do_dia": {"politica_nacional": [{"id": 209150, "titulo": "Votação do 6×1 tem que ser agora para mostrar o que o PL apoia, diz Lula", "url": "https://veja.abril.com.br/economia/votacao-do-6x1-tem-que-ser-agora-para-mostrar-o-que-o-pl-apoia-diz-lula/", "fonte_id": "veja", "data_pub": "2026-10-11T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula comentou sobre a necessidade de realizar a votação do projeto de lei (PL) com a proposta de 6 votos contra 1 imediatamente, durante um ato realizado no domingo na Avenida Paulista, em São Paulo. O objetivo seria demonstrar o apoio do PL.", "titulo_pt": "Votação do 6×1 deve ocorrer agora para mostrar apoio ao PL, afirma Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209230, "titulo": "Eduardo diz que ministros de eventual governo Flávio terão aval de Jair Bolsonaro", "url": "https://www.infomoney.com.br/politica/eduardo-diz-que-ministros-de-eventual-governo-flavio-terao-aval-de-jair-bolsonaro/", "fonte_id": "infomoney", "data_pub": "2026-10-11T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo afirmou que os ministros de um eventual governo de Flávio terão o aval de Jair Bolsonaro. Ele se colocou à disposição para assumir o Itamaraty.", "titulo_pt": "Eduardo diz que ministros de eventual governo Flávio terão aval de Jair Bolsonaro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209242, "titulo": "\"Espero que a Justiça continue\", diz Flávio sobre retirada de canal de Lula", "url": "https://www.metropoles.com/brasil/flavio-sobre-retirada-canal-lula", "fonte_id": "metropoles", "data_pub": "2026-10-11T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro comentou sobre a retirada do canal de WhatsApp 'Exército do Lula'. Ministro Kassio Nunes Marques, do TSE, determinou a suspensão do canal neste domingo (11/10).", "titulo_pt": "Flávio comenta sobre suspensão do canal de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209243, "titulo": "Em nova ofensiva, Lula compara tesouraço de Flávio com o de Milei", "url": "https://www.metropoles.com/colunas/igor-gadelha/em-nova-ofensiva-lula-compara-tesouraco-de-flavio-com-o-de-milei", "fonte_id": "metropoles", "data_pub": "2026-10-11T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha do candidato Lula está focada em explorar o medo de que o Brasil experimente os efeitos negativos dos cortes orçamentários realizados pelo presidente argentino Milei. O candidato Lula comparou as políticas econômicas do presidente Flávio com as do presidente argentino Milei, sugerindo que as medidas de Flávio teriam efeitos semelhantes.", "titulo_pt": "Em nova ofensiva, Lula compara tesouraço de Flávio com o de Milei", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209151, "titulo": "PT elege seus culpados após a derrota de Lula no primeiro turno", "url": "https://veja.abril.com.br/politica/pt-elege-seus-culpados-apos-a-derrota-de-lula-no-primeiro-turno/", "fonte_id": "veja", "data_pub": "2026-10-11T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após a derrota de Lula no primeiro turno das eleições, o PT atribuiu a responsabilidade à falta de coragem para criticar o presidente. Os nomes de Edinho Silva, Sidônio Palmeira e Rosângela da Silva foram mencionados como responsáveis pela falta de coragem.", "titulo_pt": "PT atribui derrota de Lula a falta de coragem", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209244, "titulo": "Mendonça manda Lula suspender impulsionamento de posts contra Flávio", "url": "https://www.metropoles.com/colunas/grande-angular/mendonca-manda-lula-suspender-impulsionamento-de-posts-contra-flavio", "fonte_id": "metropoles", "data_pub": "2026-10-11T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do TSE André Mendonça determinou que Lula suspenda o impulsionamento de posts que contêm a frase 'se Flávio Bolsonaro vencer, você perde'. A decisão foi publicada neste domingo (11).", "titulo_pt": "Mendonça determina que Lula suspenda impulsionamento de posts contra Flávio bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209234, "titulo": "Lula: ‘Vamos votar fim da escala 6×1 na quarta-feira, já está conversado’", "url": "https://www.infomoney.com.br/politica/lula-vamos-votar-fim-da-escala-6x1-na-quarta-feira-ja-esta-conversado/", "fonte_id": "infomoney", "data_pub": "2026-10-11T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula anunciou que a votação do fim da escala 6x1 será realizada na quarta-feira. Além disso, foi mencionada a votação da PEC da Segurança Pública, com a participação do governo federal na área de segurança.", "titulo_pt": "Lula: vamos votar fim da escala 6x1 na quarta-feira, já está conversado", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209153, "titulo": "O estado onde Lula perdeu em todas as cidades no primeiro turno", "url": "https://veja.abril.com.br/politica/o-estado-onde-lula-perdeu-em-todas-as-cidades-no-primeiro-turno/", "fonte_id": "veja", "data_pub": "2026-10-11T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro venceu Lula em todos os 52 municípios de Rondônia no primeiro turno das eleições.", "titulo_pt": "O estado onde flávio bolsonaro venceu Lula em todas as cidades no primeiro turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209113, "titulo": "Flávio Bolsonaro se reúne com prefeitos em SP e orienta campanha nas cidades: 'Não podemos baixar a guarda'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/11/flavio-bolsonaro-se-reune-com-prefeitos-de-sp-e-orienta-campanha-nas-cidades-nao-podemos-baixar-a-guarda.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-11T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador e candidato à Presidência, se reuniu com prefeitos em São Paulo e enfatizou a importância de não baixar a guarda para a vitória nas eleições de 2026.", "titulo_pt": "Flávio Bolsonaro reúne prefeitos em SP e orienta sobre campanha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 209236, "titulo": "139 imigrantes morrem após naufrágio de barco que ia de Djibuti ao Iêmen, diz ONU", "url": "https://www.infomoney.com.br/mundo/139-imigrantes-morrem-apos-naufragio-de-barco-que-ia-de-djibuti-ao-iemen-diz-onu/", "fonte_id": "infomoney", "data_pub": "2026-10-11T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um naufrágio de um barco que transportava imigrantes de Djibuti para o Iêmen resultou na morte de 139 pessoas, de acordo com a ONU. Cerca de 82 sobreviventes foram resgatados.", "titulo_pt": "139 Imigrantes morrem após naufrágio de barco que IA de Djibuti ao Iêmen, diz ONU", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209107, "titulo": "Deputada que fez campanha de tornozeleira é indiciada pela PF sob suspeita de desvios no INSS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/deputada-que-fez-campanha-de-tornozeleira-e-indiciada-pela-pf-sob-suspeita-de-desvios-no-inss.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal indiciou a deputada Gorete Pereira (MDB-CE) e outras 28 pessoas na Operação Sem Desconto, por suspeita de desvios em benefícios do INSS. A deputada é acusada de ter participado de associações para aposentados e pensionistas que realizaram retiradas não autorizadas.", "titulo_pt": "Deputada que fez campanha de tornozeleira é indiciada pela PF por desvios no INSS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 209254, "titulo": "Marcos Harter vira alvo da Justiça após excluir petistas de vaga de emprego", "url": "https://www.metropoles.com/colunas/fabia-oliveira/marcos-harter-vira-alvo-da-justica-apos-excluir-petistas-de-vaga-de-emprego", "fonte_id": "metropoles", "data_pub": "2026-10-11T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Eleitoral registrou uma denúncia na Justiça Eleitoral contra Marcos Harter e sua empresa por excluir petistas de uma vaga de emprego.", "titulo_pt": "Marcos Harter se torna alvo da Justiça após excluir petistas de vaga de emprego", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209154, "titulo": "Nunes Marques atende Flávio Bolsonaro e tira do ar ‘Exército do Lula’", "url": "https://veja.abril.com.br/politica/nunes-marques-atende-flavio-bolsonaro-e-tira-do-ar-exercito-do-lula/", "fonte_id": "veja", "data_pub": "2026-10-11T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Nunes Marques removeu um canal de WhatsApp gerido por André Janones, do partido Rede-MG, após determinar que ele estaria difundindo notícias falsas. O canal era conhecido como 'Exército do Lula'.", "titulo_pt": "Nunes Marques remove 'Exército do Lula' após acusação de notícias falsas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209092, "titulo": "Tarcísio adota figurino de cabo eleitoral contra Lula nas redes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/tarcisio-adota-figurino-de-cabo-eleitoral-contra-lula-nas-redes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas (Republicanos), passou a atuar como cabo eleitoral contra o presidente Lula nas redes sociais após o primeiro turno das eleições.", "titulo_pt": "Tarcísio adota papel de cabo eleitoral contra Lula nas redes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 209155, "titulo": "Críticas a Janja motivaram Lula a atacar lobista amiga de Lulinha", "url": "https://veja.abril.com.br/politica/criticas-a-janja-motivaram-lula-a-atacar-lobista-amiga-de-lulinha/", "fonte_id": "veja", "data_pub": "2026-10-11T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula passou a chamar Roberta Luchsinger de 'pilantra' devido a mensagens em que ela e seu filho criticavam a primeira-dama. As críticas à Janja feitas por Luchsinger motivaram Lula a atacá-la.", "titulo_pt": "Críticas a Janja levaram Lula a chamar luchsinger de 'pilantra'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209257, "titulo": "Canal oficial da Casa Civil publica xingamento a bolsonaristas e apaga post", "url": "https://www.metropoles.com/colunas/manoela-alcantara/canal-oficial-da-casa-civil-publica-xingamento-a-bolsonaristas-e-apaga-post", "fonte_id": "metropoles", "data_pub": "2026-10-11T16:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um canal oficial da Casa Civil compartilhou um tuíte com um xingamento dirigido a apoiadores de Bolsonaro e posteriormente apagou a publicação. O conteúdo foi distribuído por um canal no WhatsApp e incluía um comentário ofensivo.", "titulo_pt": "Canal da Casa Civil compartilha xingamento a bolsonaristas e apaga post", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 209620, "titulo": "Stop hostile talk, Taiwan urges China", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/12/2003865798", "fonte_id": man-who-wants-to-be-french-president", "fonte_id": "france24", "data_pub": "2026-10-11T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raphaël Glucksmann venceu a primária para representar o centro-esquerda francês na próxima eleição presidencial, obtendo 66% dos votos.", "titulo_pt": "Perfis: Raphaël Glucksmann, o homem que quer ser presidente da França", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 209580, "titulo": "Six Pakistanis wounded and Indian national dies after Riyadh airport attack", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/six-pakistanis-wounded-and-indian-national-dies-after-riyadh-airport", "fonte_id": "middle_east_eye", "data_pub": "2026-10-11T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis cidadãos paquistaneses ficaram feridos e um cidadão indiano morreu após um ataque dos hutis a um aeroporto de Riad. O primeiro-ministro paquistanês se pronunciou sobre os feridos e informou que a embaixada está auxiliando as famílias afetadas.", "titulo_pt": "Seis paquistaneses feridos e um indiano morto após ataque a aeroporto de riad", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 209526, "titulo": "🔴 Raphaël Glucksmann wins French left-wing primary with 66% of vote", "url": "https://www.france24.com/en/france/20261011-rapha%C3%ABl-glucksmann-wins-french-primary-with-66-of-vote", "fonte_id": "france24", "data_pub": "2026-10-11T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raphaël Glucksmann venceu a primária do lado esquerdo da França com 66% dos votos. O candidato conquistou a preferência dos simpatizantes do partido de esquerda franceses.", "titulo_pt": "Raphaël Glucksmann vence primária do lado esquerdo francês com 66% dos votos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 209390, "titulo": "India’s Youth Protests Challenge Narendra Modi", "url": "https://www.nytimes.com/2026/10/11/world/asia/india-crackdown-narendra-modi.html", "fonte_id": "nyt_world", "data_pub": "2026-10-11T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Narendra Modi deu mostras de ter conseguido isolar e minar seus oponentes no passado. No entanto, as manifestações da geração Z apresentam um desafio que ele nunca enfrentou antes.", "titulo_pt": "Juventude em protesto desafia Narendra Modi na Índia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 209610, "titulo": "'Trump minaccia blocco delle armi a Kiev per gli attacchi alla raffinerie russe'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/11/trump-minaccia-blocco-delle-armi-a-kiev-per-gli-attacchi-alla_724b2141-0c92-4672-8a32-c3c8bfe5c9e7.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-11T17:39:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Trump ameaça bloquear armas para Kiev em resposta aos ataques à refinaria russa. Fontes europeias foram citadas pela informação.", "titulo_pt": "Trump ameaça bloquear armas a Kiev por ataques à refinaria russa", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 209331, "titulo": "La oleada de ataques hutíes contra aeropuertos de Arabia Saudí impulsa otra escalada que puede arrastrar a Trump", "url": "https://elpais.com/internacional/2026-10-11/la-oleada-de-ataques-huties-contra-aeropuertos-de-arabia-saudi-impulsa-otra-escalada-que-puede-arrastrar-a-trump.html", "fonte_id": "elpais_america", "data_pub": "2026-10-11T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo projétil atingiu o aeroporto de Riad, no dia seguinte a um bombardeamento que resultou em pelo menos 12 mortes. Essa ação dos hutíes pode levar a uma escalada de tensões que envolva o presidente Trump.", "titulo_pt": "Onda de ataques hutíes contra aeroportos de arábia saudita impulsiona escalada que pode envolver Trump", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 209392, "titulo": "Over 100 Migrants Are Dead After Boat Capsizes Near Djibouti", "url": "https://www.nytimes.com/2026/10/11/world/africa/migrant-boat-capsize-djibouti-dead-yemen.html", "fonte_id": "nyt_world", "data_pub": "2026-10-11T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de cem migrantes morreram após a capotagem de uma embarcação perto de Djibuti. O Órgão Internacional de Migração informou que entre os mortos estão 15 crianças e há ainda pessoas desaparecidas.", "titulo_pt": "Mais de cem migrantes morrem em naufrágio perto de djibuti", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 209495, "titulo": "Poland detains man suspected of planning assassination of PM Tusk", "url": "https://www.bbc.co.uk/news/articles/c6n9rvynl5p5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-11T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia polonesa deteve um homem suspeito de planejar o assassinato do ex-primeiro-ministro Donald Tusk. Segundo as autoridades, eles receberam informações credíveis sobre possíveis ataques contra Tusk e seu ministro da Defesa.", "titulo_pt": "Polônia detém suspeito de planear assassinato do ex-pm Tusk", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 209397, "titulo": "Trump announces partial ceasefire in Ukraine war as Zelenskyy says deal is ‘news to me’", "url": "https://www.theguardian.com/world/2026/oct/11/zelenskyy-trump-ukraine-russia-energy-ceasefire", "fonte_id": "guardian_world", "data_pub": "2026-10-11T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou um cessar-fogo energético entre Ucrânia e Rússia sem consultar o presidente ucraniano, Volodymyr Zelenskyy, que negou conhecimento sobre o acordo. Trump afirmou em suas redes sociais que a Ucrânia e a Rússia concordaram em parar os ataques a refinarias de petróleo.", "titulo_pt": "Trump anuncia cessar-fogo energético em guerra ucraniana sem consultar Zelenskyy", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 209387, "titulo": "Saudi Arabia Has Few Options as Houthis Aim at Heart of Its Ambitions", "url": "https://www.nytimes.com/2026/10/11/world/middleeast/saudi-arabia-options-houthis.html", "fonte_id": "nyt_world", "data_pub": "2026-10-11T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três ataques letais dos hutitas, apoiados pelo Irã, em um aeroporto na capital saudita enfatizaram a natureza asimétrica de sua conflito com o reino. Esses ataques destacaram a vulnerabilidade do coração dos ambiciosos planos sauditas.", "titulo_pt": "Arábia saudita tem poucas opções diante dos objetivos dos hutitas", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 209600, "titulo": "US threatens to block arms for Ukraine over attacks on Russian refineries", "url": "https://www.ft.com/content/68fd8c4f-6f34-4f6e-a52c-76f635164031?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-11T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos ameaça bloquear a venda de armas para a Ucrânia devido a ataques a refinarias russas. Funcionários estão pressionando capitais europeias e Kiev após um acordo de diesel entre Trump e Putin.", "titulo_pt": "EUA ameaçam bloquear armas para Ucrânia por ataques a refinarias russas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 209265, "titulo": "Corredor Andes-Atlântico: o que se sabe sobre o ambicioso projeto dos EUA para acessar recursos estratégicos da Argentina (e competir com a China)", "url": "https://www.bbc.com/portuguese/articles/cmp30v645lz2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-11T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto Corredor Andes-Atlântico demonstra o interesse dos EUA em aumentar sua presença na América Latina e reduzir a influência da China na região.", "titulo_pt": "Corredor Andes-Atlântico: o que se sabe sobre o ambicioso projeto dos EUA para acessar recursos estratégicos da Argentina (e competir com a China)", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 209557, "titulo": "Israel pushes its ‘Yellow Line’ deeper into Gaza", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/11/israel-pushes-its-yellow-line-deeper-into-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-11T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel estende o 'Limite Amarelo' em Gaza.", "titulo_pt": "Israel expande o 'limite amarelo' em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 209635, "titulo": "Line platform gives farmers helping hand: institute", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/12/2003865819", "fonte_id": "taipei_times", "data_pub": "2026-10-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma Line ofereceu apoio a agricultores. O instituto responsável pela plataforma anunciou essa iniciativa.", "titulo_pt": "Plataforma line oferece ajuda aos agricultores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 209229, "titulo": "Beber mais água ajuda a emagrecer? Veja o que diz a ciência", "url": "https://www.infomoney.com.br/saude/beber-mais-agua-ajuda-a-emagrecer-veja-o-que-diz-a-ciencia/", "fonte_id": "infomoney", "data_pub": "2026-10-11T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O consumo adequado de água pode aumentar a sensação de saciedade, reduzir a ingestão de calorias e favorecer a perda de peso, conforme indica a ciência.", "titulo_pt": "Beber mais água ajuda a emagrecer? Veja o que diz a ciência", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209231, "titulo": "Lula acusa TSE de decisões “tendenciosas” após suspensão do canal “Exército do Lula”", "url": "https://www.infomoney.com.br/politica/lula-acusa-tse-de-decisoes-tendenciosas-apos-suspensao-do-canal-exercito-do-lula/", "fonte_id": "infomoney", "data_pub": "2026-10-11T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petista Lula acusou o TSE de tomar decisões tendenciosas após a suspensão do canal 'Exército do Lula'. Ele disse que pedirá explicações à Justiça Eleitoral e que não aceitará interferências indevidas na campanha.", "titulo_pt": "Lula acusa TSE de decisões 'tendenciosas' após suspensão do canal 'Exército do Lula'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209105, "titulo": "A China produz mais tambaqui que o Brasil?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/ronaldolemos/2026/10/a-china-produz-mais-tambaqui-que-o-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A afirmação de que a China produz mais tambaqui do que o Brasil se tornou comum no discurso sobre o desenvolvimento chinês. Esta afirmação até inspirou uma marchinha de carnaval em Manaus em 2026.", "titulo_pt": "A China produz mais tambaqui que o Brasil?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 209605, "titulo": "Oil chiefs pull out of Riyadh energy congress after airport missile strike", "url": "https://www.ft.com/content/a01776ea-4a12-4195-8820-e43a885ba5fe?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-11T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresários do petróleo cancelaram sua participação no congresso de energia em Riad após um ataque aéreo que resultou em 12 mortes. A BP e outras empresas não compareceram à reunião do World Petroleum Council devido ao ataque.", "titulo_pt": "Chefs de petróleo desistem do congresso de energia em riad após ataque aéreo no aeroporto", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 209393, "titulo": "Volkswagen boss backs EU plan to bolster domestic European industry", "url": "https://www.theguardian.com/business/2026/oct/11/volkswagen-boss-backs-eu-plan-to-boost-domestic-european-industry", "fonte_id": "guardian_world", "data_pub": "2026-10-11T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da Volkswagen, Oliver Blume, apoiou as propostas do EU para fortalecer a indústria europeia, argumentando que regras 'Feito na Europa' devem recompensar a 'criação real de valor' na Europa. Ele enfatizou a necessidade de competir com condições comparáveis às das rivais chinesas.", "titulo_pt": "Chefe da volkswagen apoia planos EU para fortalecer indústria doméstica europeia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 209108, "titulo": "Volkswagen cobra apoio da Europa em reestruturação contra montadoras da China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/volkswagen-cobra-apoio-da-europa-em-reestruturacao-contra-montadoras-da-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente-executivo da Volkswagen, Oliver Blume, pediu apoio dos formuladores de políticas europeus para a reestruturação da empresa, em meio a esforços de Bruxelas para proteger a indústria contra concorrentes chineses. Blume espera que as condições necessárias para o sucesso dessa reestruturação sejam criadas pela Europa.", "titulo_pt": "Volkswagen pede apoio da Europa em reestruturação contra montadoras chinesas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 209109, "titulo": "Fazenda investiga 14 bets por subdeclaração de receita ": 209688, "titulo": "Conservation groups alarmed at marine mammals' deaths in Spain", "url": "https://phys.org/news/2026-10-groups-alarmed-marine-mammals-deaths.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos de conservação condenaram a morte de um delfim transferido de França para um parque marinho espanhol, afirmando que isso se soma às mortes de outros mamíferos marinhos recentemente transferidos da Canadá para a Espanha.", "titulo_pt": "Grupos de conservação alarmados com mortes de mamíferos marinhos na Espanha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209310, "titulo": "Aterosclerosis y trombosis: alimentaron animales con remolacha forrajera y el resultado fue sorprendente", "url": "https://www.lanacion.com.ar/economia/campo/aterosclerosis-y-trombosis-alimentaron-animales-con-remolacha-forrajera-y-el-resultado-fue-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T16:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo do INTA na Norpatagonia descobriu que a carne dos animais alimentados com remolacha forrajera apresentou qualidade similar à dos sistemas pastoril com maíz. As pesquisadoras destacaram a necessidade de mais avaliações.", "titulo_pt": "Aterosclerose e tromboses: estudo com remolacha forrajera surpreendeu", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209689, "titulo": "Jurassic fossil reveals ancient origins of how mammals drink milk", "url": "https://phys.org/news/2026-10-jurassic-fossil-reveals-ancient-mammals.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de pesquisadores descobriu evidências que iluminam as origens evolutivas de uma das características definidoras dos mamíferos: a capacidade de amamentar e consumir leite durante a infância. Seus achados sugerem que estruturas anatômicas cruciais para a mamada, deglutição e amamentação evoluíram há quase 165 milhões de anos, muito antes da aparição dos mamíferos modernos.", "titulo_pt": "Fósselia jurassica revela antigas origens da amamentação em mamíferos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209261, "titulo": "Guerra nuclear e IA podem extinguir a humanidade até 2100, alertam especialistas", "url": "https://olhardigital.com.br/2026/10/11/ciencia-e-espaco/guerra-nuclear-e-ia-podem-extinguir-a-humanidade-ate-2100-alertam-especialistas/", "fonte_id": "olhar_digital", "data_pub": "2026-10-11T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas avaliaram 17 grandes ameaças à saúde global e alertaram que a guerra nuclear e a inteligência artificial podem levar à extinção da humanidade até 2100. A avaliação foi publicada na revista The Lancet.", "titulo_pt": "Guerra nuclear e IA podem extinguir a humanidade até 2100, alertam especialistas", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 209691, "titulo": "South Korea completes trial of Arctic shipping route", "url": "https://phys.org/news/2026-10-south-korea-trial-arctic-shipping.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio contêiner sul-coreano retornou após uma viagem de teste pelo Ártico, avaliando um novo itinerário aberto devido à deriva da geleira, enquanto conflitos no Oriente Médio afetam o comércio marítimo global.", "titulo_pt": "Coreia do sul conclui teste de rota arctica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209692, "titulo": "Egypt's Fayoum mummy portraits to travel abroad for first time after restoration", "url": "https://phys.org/news/2026-10-egypt-fayoum-mummy-portraits.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Egipto apresentou uma ve : 209579, "titulo": "Sweet protein brazzein shows promise in reducing blood sugar spikes: Study", "url": "https://www.aljazeera.com/news/2026/10/11/sweet-protein-brazzein-shows-promise-in-reducing-blood-sugar-spikes-study?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-11T12:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa russa indica que a proteína brazzein pode auxiliar na redução de picos de glicemia no sangue. O estudo sugere que essa substância tem potencial para ser utilizada em contextos relacionados ao controle da glicemia.", "titulo_pt": "Proteína brazzein mostra promessa na redução de picos de glicemia: estudo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 209448, "titulo": "Your kid wants to go vegan. Should you let them?", "url": "https://www.vox.com/future-perfect/505747/kid-moral-choices-vegan-parenting", "fonte_id": "vox", "data_pub": "2026-10-11T12:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Shayla Love, jornalista científica e fã do Your Mileage May Vary, está substituindo temporariamente a colunista Sigal Samuel durante suas férias maternidade. Ela abordará perguntas enviadas pelos leitores, analisando-as a partir de perspectivas filosóficas, psicológicas e outras.", "titulo_pt": "Seu filho quer seguir uma dieta vegana. Você deve deixá-lo?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 209090, "titulo": "Dois casos fascinantes de estrelas canibais", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/10/dois-casos-fascinantes-de-estrelas-canibais.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-11T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois estudos independentes foram publicados na última edição da revista Nature Astronomy relatando casos de estrelas canibais. Esses fenômenos revelam um universo menos pacífico e ranklin-madrinha-do-dna.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-11T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rosalind Franklin, uma cristalógrafa britânica, foi crucial na obtenção da chapa de raio-X do DNA que ajudou a desvendar a estrutura da dupla hélice. Novos detalhes extraídos de seus cadernos reforçam sua importância na pesquisa sobre a molécula da herança genética.", "titulo_pt": "Justiça para rosalind, a madrinha do DNA", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 209695, "titulo": "Could Tutankhamun's tomb hold clues to a mysterious Egyptian queen?", "url": "https://www.scientificamerican.com/article/could-tutankhamuns-tomb-hold-clues-to-a-mysterious-egyptian-queen/", "fonte_id": "scientific_american", "data_pub": "2026-10-11T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sinais de câmaras ocultas nas paredes da famosa tumba do menino-rei Tutancámon levantaram esperanças entre os pesquisadores de que possam encontrar pistas sobre o local de descanso eterno de Nefertiti, sua madrasta e sogra.", "titulo_pt": "Poderiam as câmaras ocultas na tumba de tutancámon revelar o local de descanso de nefertiti?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 208977, "titulo": "China’s rich coastal cities to see sea-level rise up to 20% higher than global average", "url": "https://www.scmp.com/news/china/science/article/3370255/chinas-rich-coastal-cities-see-sea-level-rise-20-higher-global-average?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas internacionais alertam que as cidades costeiras chinesas, como Hong Kong e Shanghai, podem experimentar um aumento nas marés de até 20% superior à média global devido ao derretimento do gelo antártico. Isso ocorrerá devido a mudanças gravitacionais causadas pelo diminuto gelo antártico, que redistribuirão a água globalmente, elevando o nível do mar nos riscados litorais chineses.", "titulo_pt": "Cidades costeiras chinesas podem enfrentar aumento de marés 15-20% maior que a média global", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 209097, "titulo": "Oscar é a única maneira de levar as pessoas aos cinemas hoje, diz John Malkovich", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/oscar-e-a-unica-maneira-de-levar-as-pessoas-aos-cinemas-hoje-diz-john-malkovich.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-11T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "John Malkovich afirmou durante o London Film Festival que as campanhas pelo Oscar eram muito diferentes na última vez em que ele foi indicado, há mais de 30 anos. Ele lembrou que, na época, lhe foram dadas apenas informações sobre a indicação sem uma campanha intensa.", "titulo_pt": "John Malkovich: oscar é a única maneira de levar as pessoas aos cinemas hoje", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 209098, "titulo": "Faustão faz rara aparição em programa de Eliana para homenagear Sabrina Sato", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/10/faustao-faz-rara-aparicao-em-programa-de-eliana-para-homenagear-sabrina-sato.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-11T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Faustão fez uma rara aparição no programa Em Família, de Eliana, na Globo, no domingo (11), para homenagear Sabrina Sato, que está grávida de seu segundo filho.", "titulo_pt": "Faustão faz rara aparição em programa de Eliana para homenagear Sabrina Sato", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 209099, "titulo": "Musical sobre Paulo Gus etrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209300, "titulo": "Mark Ruffalo compró más de 20 hectáreas en Nueva York para frenar el “fracking” y creó un santuario agrícola sostenible", "url": "https://www.lanacion.com.ar/espectaculos/mark-ruffalo-compro-mas-de-20-hectareas-en-nueva-york-para-frenar-el-fracking-y-creo-un-santuario-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ator Mark Ruffalo adquiriu mais de 20 hectares de terra nas montanhas Catskill, em Nova York, após conhecer os planos de exploração do fracking na região. Ele transformou a propriedade em um santuário agrícola sostenível, instalando paneleiros solares e sistemas de cultivo orgânico para demonstrar a viabilidade das energias renováveis.", "titulo_pt": "Mark Ruffalo compra mais de 20 hectares em nova York para frear o fracking e criar um santuário agrícola sustentável", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209222, "titulo": "Focos de incêndio no Amazonas sobem 271% nos primeiros dias de outubro", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/focos-de-incendio-no-amazonas-sobem-271-nos-primeiros-dias-de-outubro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de focos de incêndio no Amazonas aumentou 271% nos primeiros dias de outubro em comparação com o mesmo período do ano anterior. Foram registrados 1.380 focos nos primeiros dez dias deste mês, contra 372 no mesmo período do ano passado.", "titulo_pt": "Focos de incêndio no Amazonas sobem 271% nos primeiros dias de outubro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209690, "titulo": "Hurricane Simon strengthens as it nears western Mexico", "url": "https://phys.org/news/2026-10-hurricane-simon-nears-western-mexico.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T16:00:00Z", "idio y rain", "url": "https://www.euronews.com/2026/10/11/four-dead-as-isaias-continues-to-push-across-the-southeast-us-bringing-strong-winds-and-he", "fonte_id": "euronews", "data_pub": "2026-10-11T07:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Isaias atingiu a cidade de Destin, na Florida Panhandle, como um furacão da categoria 2 na sexta-feira à noite. O sistema tem continuado a se mover pela região sudeste dos Estados Unidos, causando fortes ventos e chuva intensa, deixando quatro mortos.", "titulo_pt": "Quatro mortos enquanto Isaias avança pelo sudeste dos EUA, trazendo ventos fortes e chuva intensa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 208953, "titulo": "Indonesia releases eight orangutans rescued from fires to protected forest", "url": "https://www.japantimes.co.jp/news/2026/10/11/asia-pacific/science-health/indonesia-fires-orangutan-released/", "fonte_id": "japan_times", "data_pub": "2026-10-11T05:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oito orangotãos resgatados de áreas afetadas por incêndios foram libertados em uma floresta protegida. Ao todo, 46 orangotãos foram resgatados entre agosto e o último dia mencionado.", "titulo_pt": "Indonésia libera oito orangotãos resgatados de incêndios para floresta protegida", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 209355, "titulo": "Casi 200 carabineros terminan curso de formación en DD.HH. en la Facultad de Derecho de la U. de Chile", "url": "https://www.latercera.com/nacional/noticia/casi-200-carabineros-terminan-curso-de-formacion-en-ddhh-en-la-facultad-de-derecho-de-la-u-de-chile/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T17:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O curso de formação em direitos humanos foi concluído por aproximadamente 200 carabineros que atuam diretamente com pessoas em situação de vulnerabilidade. O pr const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>

           </div>`;

    : "";

    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;

  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
