 de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 280456, "titulo": "APOD: 2026 November 22 – Swirls and Colors on Jupiter from Juno", "url": "https://science.nasa.gov/image-article/apod-2026-november-22-swirls-and-colors-on-jupiter-from-juno/", "fonte_id": "nasa_news", "data_pub": "2026-11-22T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 22 de novembro de 2026 exibe as vórtices e cores na superfície de Júpiter, capturadas pela sonda Juno.", "titulo_pt": "Imagem do dia: 22 de novembro de 2026 – vórtices e cores em júpiter pela Juno", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 280455, "titulo": "Single feathers may reveal whether eastern black rails stay in Texas or migrate north", "url": "https://phys.org/news/2026-11-feathers-reveal-eastern-black-rails.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisadora caminha pela planície pantanosa à noite, empurrando uma corda com vários brinquedos de gato dentro de garrafas plásticas, para atrair e capturar aves de estribo preto do leste. O objetivo é determinar se essas aves permanecem em Texas ou se migram para o norte.", "titulo_pt": "Unhas de aves podem revelar se as aves de estribo preto do leste permanecem em Texas ou migram para o norte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279514, "titulo": "FEATURE: Farmer revives climate-resilient oil millet", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/22/2003868185", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agricultor está revitalizando o cultivo de milheto de óleo, uma cultura resistente ao clima. Este cultivo pode oferecer uma alternativa sustentável para alimentos e óleos vegetais.", "titulo_pt": "Agricultor revive cultivo de milheto de óleo resistente ao clima", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279708, "titulo": "Epilepsia infantil: Genética impacta tratamento, dizem médicos a Dr. Kalil", "url": "https://www.cnnbrasil.com.br/saude/epilepsia-infantil-genetica-impacta-tratamento-dizem-medicos-a-dr-kalil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Avanços em biologia molecular permitem diagnósticos genéticos que orientam a escolha de medicamentos e terapias para crianças com epilepsia. Especialistas em neurologia discutem o tema com o CNN Sinais Vitais.", "titulo_pt": "Epilepsia infantil: genética influencia tratamento, afirmam médicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279949, "titulo": "The avian champions of long-distance migration keep surprising scientists", "url": "https://phys.org/news/2026-11-avian-champions-distance-migration-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história toda começou com uma ave extinta da Ilha Hispânia, conforme declarou Min Zhao, um ex-assistente pós-doutoral do Museu de História Natural da Flórida (agora um pesquisador pós-doutoral na Universidade de Uppsala).", "titulo_pt": "As campeãs de migração de longa distância de aves continuam surpreendendo os cientistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279950, "titulo": "Repeated bending strengthens sugar-based hydrogel instead of wearing it down", "url": "https://phys.org/news/2026-11-sugar-based-hydrogel.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa liderado por Chenfeng Ke, um professor de química na Universidade Washington em St. Louis, desenvolveu um polímero que se fortalece com o uso, contrariando a regra comum de degradação dos materiais.", "titulo_pt": "Repetida dobragem fortalece hidrogel de base de açúcar em vez de enfraquecê-lo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279951, "titulo": "Dropping degree requirements linked to higher pay for workers without degrees", "url": "https://phys.org/news/2026-11-degree-requirements-linked-higher-pay.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exigências estabelecidas pelos departamentos de recursos humanos (RH) têm um grande impacto nas oportunidades profissionais disponíveis para diferentes grupos da população. Baixar essas exigências pode levar a aumentos de salários para trabalhadores sem diplomas.", "titulo_pt": "Redução das exigências de grau associada a maiores pagamentos para trabalhadores sem grau", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279092, "titulo": "Réptil de 156 milhões de anos com 'chifres' é encontrado nos EUA", "url": "https://www.metropoles.com/ciencia/reptil-de-156-milhoes-de-anos-com-chifres-e-encontrado-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-11-21T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tomografias revelaram uma nova espécie de réptil com chifres nos Estados Unidos. O animal, com 45 cm de comprimento, recebeu o nome em homenagem ao death metal.", "titulo_pt": "Novo réptil de 156 milhões de anos com 'chifres' é encontrado nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 279687, "titulo": "Tenho que me vacinar de novo contra a Covid-19? O que diz a Fiocruz", "url": "https://exame.com/brasil/tenho-que-me-vacinar-de-novo-contra-a-covid-19-o-que-diz-a-fiocruz/", "fonte_id": "exame", "data_pub": "2026-11-21T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiocruz informa que a linhagem PJ.2.1 foi encontrada em 58% dos genomas sequenciados no Rio de Janeiro, sendo avaliada pela OMS para possivelmente ser classificada como variante sob monitoramento.", "titulo_pt": "Tenho que me vacinar de novo contra a Covid-19? O que diz a Fiocruz sobre a linhagem pj.2.1 no rio de janeiro?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279587, "titulo": "On this day in space! Nov. 21, 1676: Danish astronomer discovers speed of light — by accident — while observing Jupiter's moon Io", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-21-2026", "fonte_id": "space_com", "data_pub": "2026-11-21T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 21 de novembro de 1676, o astrônomo dinamarquês Ole Rømer descobriu a velocidade da luz ao observar a lua de Júpiter Io. Este achado ocorreu por acaso durante seus estudos astronômicos.", "titulo_pt": "21 De novembro de 1676: astrônomo dinamarquês descobre a velocidade da luz — por acaso — ao observar a lua de júpiter Io", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 279548, "titulo": "Babies in ancient Greek colony started solid food at 3 months but nursed for nearly 4 years, chemical signatures suggest", "url": "https://phys.org/news/2026-11-babies-ancient-greek-colony-solid.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Himera, uma colônia grega habitada por sicilianos locais, fenícios e gregos há mais de 2.500 anos, começou a amamentar seus bebês com sólidos aos três meses, mas continuou por quase 4 anos, independentemente de suas diferentes origens culturais.", "titulo_pt": "Bebês na colônia grega antiga de himera começaram a alimentação sólida aos 3 meses, mas amamentaram por quase 4 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279691, "titulo": "Covid-19: o que se sabe sobre a PJ.2.1, variante que domina casos no Rio e avança no Brasil", "url": "https://exame.com/brasil/covid-19-o-que-se-sabe-sobre-a-pj-2-1-variante-que-domina-casos-no-rio-e-avanca-no-brasil/", "fonte_id": "exame", "data_pub": "2026-11-21T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A variante PJ.2.1, detectada no Canadá em maio, é responsável por 58% das amostras sequenciadas pela Fiocruz no Rio de Janeiro e tem se espalhado pelo Brasil sem que as vacinas actuais ofereçam proteção eficaz contra ela.", "titulo_pt": "Covid-19: o que se sabe sobre a PJ.2.1, variante que domina casos no Rio e avança no Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279552, "titulo": "AI may not work like the human brain after all, scientists discover", "url": "https://www.sciencedaily.com/releases/2026/11/261120075701.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que a inteligência artificial pode não pensar como o cérebro humano, mesmo que modelos de IA prevejam atividade cerebral de forma semelhante. Essa descoberta questiona a confiabilidade dessas modelos na pesquisa neurociêntifica.", "titulo_pt": "A inteligência artificial pode não pensar como o cérebro humano, revela nova descoberta", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279588, "titulo": "This Week In Space podcast: Episode 237 — A Fond Farewell", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-237-a-fond-farewell", "fonte_id": "space_com", "data_pub": "2026-11-21T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neste episódio do Podcast This Week In Space, Tariq Malik e Rod Pyle se despedem temporariamente, abordando notícias espaciais, piadas espaciais e uma recapitulação de alguns dos momentos mais engraçados do programa.", "titulo_pt": "Episódio 237 do podcast this Week In Space: uma saudade sentida", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 280465, "titulo": "SXSW Forges Partnership With Egypt’s UTH Festival Dedicated to Youth Culture", "url": "https://variety.com/2026/film/global/sxsw-partnership-egypt-uth-festival-youth-culture-1236955220/", "fonte_id": "variety", "data_pub": "2026-11-22T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A South by Southwest Film e TV Festival de Austin estabeleceu uma parceria com o UTH Festival, focado na cultura jovem no Egito. O acordo visa identificar talentos emergentes e criar oportunidades para realizadores, músicos, criadores, fundadores e líderes empresariais egípcios interagirem com a rede internacional da SXSW.", "titulo_pt": "SXSW estabelece parceria com Festival UTH do egito", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 280151, "titulo": "David Rieff: “La gente se cansa de la batalla cultural. Cuando hay crisis económica, las guerras culturales pasan a segundo plano”", "url": "https://www.latercera.com/mundo/noticia/david-rieff-la-gente-se-cansa-de-la-batalla-cultural-cuando-hay-crisis-economica-las-guerras-culturales-pasan-a-segundo-plano/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "David Rieff, filho de Susan Sontag e Philip Rieff, reflete sobre o aumento da subjetividade e das identidades, em função do lançamento do ensaio de seu pai, 'O Triunfo do Terapêutico', na Chile. Ele analisa o esgotamento de Donald Trump, dos populismos de direita e o fim do antigo ordenamento mundial, vivendo em Kiev, onde enfrenta ameaças de bombardeios russos.", "titulo_pt": "David Rieff: 'a gente se cansa das batalhas culturais. Quando há crise econômica, as guerras culturais passam para segundo plano'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 280466, "titulo": "Neon-Backed Biopic ‘Caesar,’ About Syrian Officer Who Blew the Whistle on Assad Regime Torture, to Be Directed by Ameer Fakher Eldin", "url": "https://variety.com/2026/film/global/ameer-fakher-eldin-caesar-syrian-assad-torture-1236955196/", "fonte_id": "variety", "data_pub": "2026-11-22T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um filme biográfico sobre o soldado sírio Farid Al-Madhhan, que denunciou a tortura e os assassinatos cometidos pelo regime de Bashar Assad, será dirigido por Ameer Fakher Eldin. Taim Hassan, um ator sírio, foi escalado para interpretar o protagonista.", "titulo_pt": "Biopic 'Caesar' sobre soldado sírio que denunciou tortura do Regime Assad", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 280457, "titulo": "‘I do a really good version of AC/DC’s Highway to Hell, which throws people’: Sharleen Spiteri’s honest playlist", "url": "https://www.theguardian.com/music/2026/nov/22/sharleen-spiteri-texas-honest-playlist-acdc-elvis-costello", "fonte_id": "guardian_culture", "data_pub": "2026-11-22T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sharleen Spiteri, cantora da Texas, se apaixonou por Nancy Sinatra desde criança devido à canção 'These Boots Are Made for Walkin’'. Mais tarde, ela descobriu que Sinatra foi encorajada a interpretar a música de forma mais provocativa, o que pode ter influenciado sua personalidade forte e independente.", "titulo_pt": "‘Eu faço uma versão ótima de AC/DC’s Highway to Hell, o que surpreende as pessoas’: sharleen Spiteri fala sobre suas músicas que a mudaram", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 280364, "titulo": "Main hall of Okinawa’s Shuri Castle restored seven years after fire", "url": "https://www.japantimes.co.jp/news/2026/11/22/japan/shuri-castle-restored/", "fonte_id": "japan_times", "data_pub": "2026-11-22T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O principal salão da Cidade Real de Shuri em Okinawa foi restaurado sete anos após o incêndio que destruiu o edifício em 31 de outubro de 2019, junto com o salão norte e o salão sul e outras estruturas.", "titulo_pt": "Principal salão da cidade real de Shuri em Okinawa restaurado após sete anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 280467, "titulo": "Katseye Brings Out Camila Cabello for ‘Gabriela’ Dance at Los Angeles Show", "url": "https://variety.com/2026/music/news/katseye-brings-out-camila-cabello-gabriela-los-angeles-1236955210/", "fonte_id": "variety", "data_pub": "2026-11-22T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A artista Katseye, composta por Daniela Avanzini e Lara Raj, convidou Camila Cabello para se juntar ao grupo no palco durante um show em Los Angeles, para executar a coreografia da música 'Gabriela'.", "titulo_pt": "Katseye traz Camila Cabello para coreografia de 'Gabriela' em Show em Los Angeles", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 280468, "titulo": "Karla Sofia Gascon Says ‘Emilia Perez’ Oscar Controversy Came From People Who ‘Didn’t Want Someone Like Me to Receive an Award’", "url": "https://variety.com/2026/film/festivals/karla-sofia-gascon-emilia-perez-oscar-furor-trans-rights-1236955205/", "fonte_id": "variety", "data_pub": "2026-11-22T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atriz espanhola Karla Sofia Gascon, que obteve a primeira indicação a um Oscar para o papel de 'Emilia Pérez', afirma que a controvérsia em torno de sua campanha foi criada por pessoas que não queriam ver alguém como ela ganhar. Gascon diz que a polêmica veio de pessoas que não queriam vê-la receber um prêmio.", "titulo_pt": "Karla Sofia Gascon diz que controvérsia do Oscar para 'Emilia pérez' veio de pessoas que não queriam vê-la ganhar", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 279978, "titulo": "Política vira motivo de riso e diversão em Hollywood que se isenta de debates públicos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/politica-vira-motivo-de-riso-e-diversao-em-hollywood-que-se-isenta-de-debates-publicos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No filme 'I Love Boosters', uma aspirante a estilista precisa escolher entre seguir carreira ou liderar uma revolução contra magnatas da moda. O filme, dirigido por Boots Riley, aborda a luta de classes nos Estados Unidos.", "titulo_pt": "Política vira motivo de riso e diversão em Hollywood que se isenta de debates públicos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 280458, "titulo": "Lend them your ears! Julius Caesar is staged with just four actors – and a great big gong", "url": "https://www.theguardian.com/stage/2026/nov/22/julius-caesar-four-actors-sam-wanamaker-playhouse-review", "fonte_id": "guardian_culture", "data_pub": "2026-11-22T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma versão truncada e iluminada por velas de Julius César, com apenas quatro atores e um grande gongo, foi apresentada no Sam Wanamaker Playhouse em Londres. A produção, dirigida por Joe Hill-Gibbins, não alcança a profundidade e originalidade da versão all-feminina de 2012, mas oferece uma abordagem diferente do clássico.", "titulo_pt": "Emprestem seus ouvidos! Julius césar é encenado com apenas quatro atores e um grande gongo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 280459, "titulo": "Grammy snubs and a Stevie Wonder vs Lauryn Hill Showdown | The Close Up Culture Swap", "url": "https://www.theguardian.com/culture/video/2026/nov/22/grammy-snubs-and-a-stevie-wonder-vs-lauryn-hill-showdown-the-close-up-culture-swap", "fonte_id": "guardian_culture", "data_pub": "2026-11-22T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As indicações para os Grammys foram divulgadas e Carys e Lanre estão trocando suas escolhas para o álbum do ano vencedor. Além disso, há discussões sobre as omissões nas indicações e sobre qual de dois álbuns clássicos, de Stevie Wonder e Lauryn Hill, mereceria ser premiado novamente.", "titulo_pt": "Grammy: indicações são divulgadas com troca de opiniões sobre álbuns clássicos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 280396, "titulo": "South Korea’s education minister quits amid backlash over anti-cheating exam checks", "url": "https://www.scmp.com/news/asia/east-asia/article/3375362/south-koreas-education-minister-quits-amid-backlash-over-anti-cheating-exam-checks", "fonte_id": "scmp", "data_pub": "2026-11-22T06:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Educação da Coreia do Sul renunciou após uma escândalo de fraude no exame, que envolveu o uso de inteligência artificial. A Coreia do Sul tem temido pela possibilidade de fraude no exame de admissão à universidade, conhecido como Suneung, após um candidato confesar ter usado um mini-câmera e smartphone com inteligência artificial no exame nacional de contabilidade.", "titulo_pt": "Ministro da educação da Coreia do sul renuncia em meio a escândalo de fraude com inteligência artificial no exame de admissão à universidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 280462, "titulo": "TV tonight: Michael Socha stars in a spooky Welsh drama", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/22/tv-tonight-michael-socha-stars-in-a-spooky-welsh-drama", "fonte_id": "guardian_culture", "data_pub": "2026-11-22T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A BBC One exibe uma dramatização gótica chamada 'The Witch Farm' às 21h, com o ator Michael Socha. O programa apresenta atividade sobrenatural assustadora. Também haverá a volta de 'Sorry, I Didn’t Know', um programa de painel com recordes de audiência.", "titulo_pt": "TV desta noite: michael Socha estrela uma dramatização gótica na bbc one", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 280398, "titulo": "Malaysia’s Chetti Melaka: how a Hindu-Malay community keeps its roots alive", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3375247/malaysias-chetti-melaka-how-hindu-malay-community-keeps-its-roots-alive", "fonte_id": "scmp", "data_pub": "2026-11-22T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kampung Chetti, um vilarejo centenário na região histórica do estado de Melaka na Malásia, possui uma arquibancada decorada com divindades hindus, incluindo Shiva, Parvati, Ganesha e Murugan. O local é o lar da comunidade Chetti Melaka, que mantém tradições ancestrais vivas em suas casas modestas.", "titulo_pt": "Kampung Chetti: como uma comunidade hindu-malaiu mantém suas raízes vivas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 280463, "titulo": "Jony Ive and Margaret Calvert create posters to celebrate decade of Design Museum in Kensington", "url": "https://www.dezeen.com/2026/11/22/jony-ive-margaret-calvert-posters-decade-london-design-museum-kensington/", "fonte_id": "dezeen", "data_pub": "2026-11-22T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dez designers renomados lançaram posters para comemorar os 10 anos do Design Museum em Kensington, Londres. Jony Ive e Margaret Calvert foram alguns dos criadores desses posters.", "titulo_pt": "Jony Ive e Margaret Calvert criam posters para comemorar década do Design Museum em Kensington", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 280373, "titulo": "Japan to expand kōsen education into agriculture", "url": "https://www.japantimes.co.jp/news/2026/11/22/japan/kosen-education-agriculture/", "fonte_id": "japan_times", "data_pub": "2026-11-22T04:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Japão planeja expandir a educação kōsen para incluir áreas agrícolas. Também está considerando adicionar campos relacionados a criação de conteúdo, como mangás e animes, em resposta a uma demanda.", "titulo_pt": "Japão vai expandir educação kōsen para agronegócio e criar conteúdo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 280166, "titulo": "Ed Sheeran en Chile: un hombre, una guitarra y hits para conquistar un estadio", "url": "https://www.latercera.com/culto/noticia/ed-sheeran-en-chile-un-hombre-una-guitarra-y-hits-para-conquistar-un-estadio/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T02:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ed Sheeran retornou ao Chile após um intervalo de nove anos, realizando seu primeiro show em duas noites no Bicentenario de La Florida. O artista apresentou uma performance que focou na construção musical ao vivo, tocando seus maiores sucessos com energia e atratividade típicas de um grande concerto multitudinário.", "titulo_pt": "Ed Sheeran no Chile: um homem, uma guitarra e hits para conquistar um estádio", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 280300, "titulo": "Portugal: Workers brave downpours to demand a more affordable life", "url": "https://www.euronews.com/video/2026/11/22/portugal-workers-brave-downpours-to-demand-a-more-affordable-life", "fonte_id": "euronews", "data_pub": "2026-11-22T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam por Lisboa, Portugal, no sábado, 21 de novembro de 2026, enfrentando forte chuva para exigir aumentos salariais, melhoras nas aposentadorias e medidas para combater o aumento dos custos de vida. A demonstração ocorreu alguns dias antes do voto de orçamento parlamentar em Portugal.", "titulo_pt": "Portugal: trabalhadores enfrentam chuva para exigir vida mais acessível", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 280059, "titulo": "Dr. Kalil: Cirurgia para epilepsia não deve ser vista como último recurso", "url": "https://www.cnnbrasil.com.br/saude/dr-kalil-cirurgia-para-epilepsia-nao-deve-ser-vista-como-ultimo-recurso/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neurologistas Carlos Guerreiro e Kette Valente explicam que a epilepsia refratária ocorre quando a doença não responde a tratamentos convencionais e que a cirurgia deve ser considerada quando outros métodos não forem eficazes. A cirurgia não deve ser vista como último recurso, mas como uma opção válida no tratamento da epilepsia.", "titulo_pt": "Cirurgia para epilepsia não deve ser vista como último recurso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 280317, "titulo": "Photos: People rally across France over living costs, public services", "url": "https://www.aljazeera.com/gallery/2026/11/22/photos-people-rally-across-france-over-living-costs-public-services?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-22T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos ocorrem pela sexta semana consecutiva, com milhares de pessoas marchando em França sobre questões de desigualdade. Organizadores planejam mais manifestações.", "titulo_pt": "Fotos: pessoas se mobilizam em França por sexto fim de semana contra custos de vida e serviços públicos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 280061, "titulo": "Faculdade em SC diz que 1 em cada 4 alunos abriu empresa na graduação", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/empreendedorismo-e-trabalho/faculdade-em-sc-diz-que-1-em-cada-4-alunos-abriu-empresa-na-graduacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T09:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A PIB The New College, uma faculdade na Santa Catarina, implementou um modelo que incorpora a criação de negócios na graduação, oferecendo mentorias de empresários e contato com investidores. Um levantamento revelou que 25% dos alunos desta instituição abriram empresas durante o período acadêmico.", "titulo_pt": "1 Em cada 4 alunos de uma faculdade em SC abriu empresa durante a graduação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 280149, "titulo": "\"Mientras no haya cuerpo, no hay nada\": el pacto de silencio en la desaparición de un joven detenido por policías", "url": "https://www.clarin.com/policiales/cuerpo-pacto-silencio-desaparicion-joven-detenido-policias_0_nXIZYSBAwj.html", "fonte_id": "clarin", "data_pub": "2026-11-22T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A justiça de Posadas processou 15 oficiais da comissária de Dos de Mayo por maus-tratos a Mario Fabián Golemba (27), que foi levado esposado e agredido brutalmente. O caso, que começou em março de 2008, ficou parado por 13 anos e os restos mortais de Golemba nunca foram encontrados.", "titulo_pt": "Enquanto não houver corpo, não há nada: o pacto de silêncio na desaparição de um jovem detido por policiais", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 280033, "titulo": "\"Síndicos do terror\": facções expulsam famílias e tomam casas no Brasil", "url": "https://www.metropoles.com/brasil/sindicos-do-terror-faccoes-expulsam-familias-e-tomam-casas-no-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Facções criminosas estão usando táticas como extorsão, expulsão de famílias e monitoramento populacional para garantir a blindagem de seus territórios. Essa estratégia visa fortalecer o controle sobre as áreas que ocupam.", "titulo_pt": "Síndicos do terror: facções criminosas expulsam famílias e tomam controle de casas no Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280164, "titulo": "Fiscalía confirma muerte de lactante de 11 meses por sobredosis de droga en Curicó", "url": "https://www.latercera.com/nacional/noticia/fiscalia-confirma-muerte-de-lactante-de-11-meses-por-sobredosis-de-droga-en-el-hospital-de-curico/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T03:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um lactante de 11 meses morreu em Curicó devido a uma sobredose de droga, conforme confirmou a fiscalía. O bebê apresentava graves dificuldades respiratórias sob a responsabilidade de sua avó, e exames preliminares sugerem possível exposição a substâncias ilícitas.", "titulo_pt": "Fiscalia confirma morte de lactante de 11 meses por sobredose de droga em Curicó", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 280384, "titulo": "French protesters rally for sixth weekend over living costs, public services", "url": "https://www.japantimes.co.jp/news/2026/11/22/world/french-protesters-living-costs-public-services/", "fonte_id": "japan_times", "data_pub": "2026-11-21T23:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manifestações, que começaram com estudantes exigindo melhores condições de aprendizado, se expandiram para uma campanha nacional que abrange preços, serviços públicos e violência policial.", "titulo_pt": "Protestos franceses continuam por sexto fim de semana sobre custo de vida e serviços públicos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 279715, "titulo": "Sobe para 5 número de mortos em Tupanciretã (RS); 265 ficaram feridos", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/sobe-para-5-o-numero-de-mortos-em-tupancireta-rs-265-ficaram-feridos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos em Tupanciretã, no Rio Grande do Sul, subiu para cinco. Cerca de 265 pessoas ficaram feridas. Os ventos de até 114 km/h destelharam quase 8 mil casas, afetando 99% dos moradores da cidade.", "titulo_pt": "Subiu para 5 o número de mortos em Tupanciretã; 265 ficaram feridos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279672, "titulo": "Homem sobrevive após ter uma faca cravada na nuca, em Machado (MG)", "url": "https://www.metropoles.com/minas-gerais/homem-sobrevive-apos-ter-uma-faca-cravada-na-nuca-em-machado-mg", "fonte_id": "metropoles", "data_pub": "2026-11-21T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem sobreviveu após ter uma faca cravada na nuca em Machado, Minas Gerais. Ele foi submetido a um procedimento cirúrgico em Alfenas e recebeu alta hospitalar na quinta-feira, 19 de novembro.", "titulo_pt": "Homem sobrevive após ter uma faca cravada na nuca, em Machado (MG)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 279836, "titulo": "Brigadas Rojas. Con el arresto de otra mujer, suman seis los detenidos por ser parte de un grupo que apoyó la fuga de Bertulazzi", "url": "https://www.lanacion.com.ar/seguridad/brigadas-rojas-con-el-arresto-de-otra-mujer-suman-seis-los-detenidos-por-ser-parte-de-un-grupo-que-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T21:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Seis pessoas foram detidas por supostamente terem colaborado com o fugitivo italiano Bertulazzi. A busca pelo exterrorista continua enquanto são identificadas e presas outras pessoas envolvidas no caso.", "titulo_pt": "Brigadas vermelhas. Com a detenção de mais uma mulher, chegam a seis os detidos por colaborar com a fuga de Bertulazzi", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 279742, "titulo": "Duas horas para agir: o que já vale para proteger mulheres da violência digital", "url": "https://www.jota.info/opiniao-e-analise/colunas/tabus-e-mulheres/duas-horas-para-agir-o-que-ja-vale-para-proteger-mulheres-da-violencia-digital", "fonte_id": "jota", "data_pub": "2026-11-21T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute as mudanças que ocorreram para as vítimas de violência digital que denunciam o crime, bem como os aspectos ainda em desenvolvimento. Aborda o tempo limitado disponível para ação em situações de violência digital.", "titulo_pt": "Dois horas para agir: o que já vale para proteger mulheres da violência digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 279751, "titulo": "La ruta del dinero de la AFA: piden rastrear nuevas cuentas por los US$ 300 millones de ganancias de la Selección", "url": "https://www.clarin.com/politica/ruta-dinero-afa-piden-rastrear-nuevas-cuentas-us-300-millones-ganancias-seleccion_0_YuhEzW3GMr.html", "fonte_id": "clarin", "data_pub": "2026-11-21T20:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O empresário Guillermo Tofoni pediu à Justiça que ampliasse o pedido para rastrear movimentações financeiras de novos agentes de cobrança da AFA em Dubai e Malta. Além disso, solicitou a embargos de fundos de imputados e o arrolamento de sedes da AFA.", "titulo_pt": "Rota do dinheiro da AFA: empresário pede rastreamento de novas contas por US$ 300 milhões", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279801, "titulo": "Condenan a presidio perpetuo a dos hombres por homicidio de padre que acompañó a su hijo a vender una PlayStation en Rancagua", "url": "https://www.latercera.com/nacional/noticia/condenan-a-presidio-perpetuo-a-dos-hombres-por-homicidio-de-padre-que-acompano-a-su-hijo-a-vender-una-playstation-en-rancagua/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T19:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dois homens foram condenados a prisão perpétua pelo assassinato de um pai que acompanhou seu filho durante uma venda de PlayStation em Rancagua em julho de 2025. Um terceiro indivíduo, que era adolescente no momento dos fatos, recebeu uma pena de 10 anos de internação em regime fechado.", "titulo_pt": "Condenam a prisão perpétua a dois homens pelo assassinato do pai que acompanhou o filho a vender uma PlayStation em Rancagua", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279862, "titulo": "‘Six, seven, maybe more preventable deaths’: Queensland’s LNP faces reckoning over broken health system", "url": "https://www.theguardian.com/australia-news/2026/nov/22/queensland-health-ambulance-deaths-lnp-labor-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-21T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Queensland, que está no poder há mais de dois anos, finalmente está sendo forçado a assumir responsabilidades e parece não mais poder blame seus antecessores do Partido Trabalhista. Durante a semana inicial de outra sessão parlamentar da Queensland, fontes anônimas estavam ativas, agora fornecendo informações contra o líder do oposição, Steven Miles, do Partido Trabalhista.", "titulo_pt": "Seis, sete, talvez mais mortes evitáveis: governo da queensland enfrenta reconta pelo sistema de saúde quebrado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 279864, "titulo": "Australian neo-Nazis among far-right groups raising hundreds of thousands via global crowdfunding platform", "url": "https://www.theguardian.com/australia-news/2026/nov/22/australian-neo-nazis-among-far-right-groups-raising-hundreds-of-thousands-via-global-crowdfunding-platform-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-21T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australianos neonazistas arrecadaram centenas de milhares de dólares através da plataforma de crowdfunding global GiveSendGo. Dois de seus fundraiser, incluindo o Partido Austríaco Branco, arrecadaram quantias significativas, com um total de $200.000 para uma batalha judicial.", "titulo_pt": "Neonazistas australianos arrecadam centenas de milhares em plataforma de crowdfunding", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 280144, "titulo": "\"Tenemos derecho al agua\": agricultores y trabajadores de rancho se pronuncian sobre los preocupantes niveles del río Colorado", "url": "https://www.clarin.com/estados-unidos/derecho-agua-agricultores-trabajadores-rancho-pronuncian-preocupantes-niveles-rio-colorado_0_PNz4DFMglx.html", "fonte_id": "clarin", "data_pub": "2026-11-22T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A falta de neve está deixando sem água uma das maiores regiões agrícolas dos Estados Unidos. Alguns produtores já tiveram que abandonar cultivos e vender gado.", "titulo_pt": "Temos direito à água: agricultores e trabalhadores de rancho se pronunciam sobre os preocupantes níveis do rio Colorado", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 280302, "titulo": "New COP31 draft deal tabled as countries scramble to salvage climate talks", "url": "https://www.euronews.com/2026/11/22/new-cop31-draft-deal-tabled-as-countries-scramble-to-salvage-climate-talks", "fonte_id": "euronews", "data_pub": "2026-11-22T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo projeto de acordo foi apresentado, mas ele não mencionou os combustíveis fósseis, que se tornaram um ponto de conflito nas negociações.", "titulo_pt": "Novo projeto de acordo apresentado, mas ignora combustíveis fósseis", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 280368, "titulo": "Fossil fuels still missing from latest COP31 draft deal", "url": "https://www.japantimes.co.jp/environment/2026/11/22/climate-change/cop31-climate-talks/", "fonte_id": "japan_times", "data_pub": "2026-11-22T05:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O último projeto de acordo do COP31 mantém os objetivos globais de eletrificação, mas deixa as tensões relacionadas aos combustíveis fósseis sem resolução.", "titulo_pt": "Combustíveis fósseis ainda ausentes no último projeto de acordo do COP31", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 280375, "titulo": "Nagano farmers are running out of altitude as warming hits key celery crop", "url": "https://www.japantimes.co.jp/environment/2026/11/22/climate-change/celery-harvest-climate-change/", "fonte_id": "japan_times", "data_pub": "2026-11-22T03:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os agricultores no Nagano estão enfrentando dificuldades devido ao aumento da temperatura, pois estão se esgotando de altitudes disponíveis para plantar azevinho, que requer condições mais frescas.", "titulo_pt": "Agricultores do nagano estão se esgotando de altitude devido ao aquecimento global afetando a cultura de azevinho", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 279503, "titulo": "Temperatures could drop to 11°C in low areas: CWA", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868168", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A previsão indica que as temperaturas podem baixar para 11°C em áreas baixas. Essa informação foi fornecida pelo CWA (Centro Weather Administration).", "titulo_pt": "Temperaturas podem cair para 11°C em baixas áreas: CWA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279744, "titulo": "Temporal no RS afeta 24 mil pessoas e deixa quatro mortos", "url": "https://www.dw.com/pt-br/temporal-no-rs-afeta-24-mil-pessoas-e-deixa-quatro-mortos/a-80011201?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-21T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma supercélula causou ventos de até 114 km/h no Rio Grande do Sul, afetando 36 municípios e deixando quase 9 mil residências danificadas.", "titulo_pt": "Temporal no RS afeta 24 mil pessoas e deixa quatro mortos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 279792, "titulo": "Declaran estado de emergencia preventiva en Atacama y Coquimbo por riesgo de deshielos y crecidas", "url": "https://www.latercera.com/nacional/noticia/declaran-estado-de-emergencia-preventiva-en-atacama-y-coquimbo-por-riesgo-de-deshielos-y-crecidas/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo declarou estado de emergência preventiva nas regiões de Atacama e Coquimbo devido ao risco de deshielos e crecidas. A decisão se baseia em indicadores que mostram uma diminuição rápida da neve acumulada nas montanhas e aumento no volume de água nos rios associado ao derretimento da neve.", "titulo_pt": "Declarado estado de emergência preventiva em Atacama e Coquimbo por risco de deshielos e crecidas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279650, "titulo": "Britânico atravessa Estreito de Ormuz a nado para denunciar impacto ambiental da guerra", "url": "https://veja.abril.com.br/mundo/britanico-atravessa-estreito-de-ormuz-a-nado-para-denunciar-impacto-ambiental-da-guerra/", "fonte_id": "veja", "data_pub": "2026-11-21T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um nadador britânico atravessou o Estreito de Ormuz a nado para denunciar o impacto ambiental da guerra entre Irã e Estados Unidos na região. O nadador pede o fim dos combates.", "titulo_pt": "Britânico atravessa Estreito de Ormuz a nado para denunciar impacto ambiental da guerra", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280028, "titulo": "Desfecho da COP31 fica para domingo, com cadeiras vazias e sauditas contra 130 países", "url": "https://exame.com/esg/desfecho-da-cop31-fica-para-domingo-com-cadeiras-vazias-e-sauditas-contra-130-paises/", "fonte_id": "exame", "data_pub": "2026-11-21T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 ficará sem desfecho no domingo, com representantes de 130 países ausentes e os sauditas em posição contrária. A plenária está emperrada em itens de rotina, e a versão final do texto deve ser apresentada às 9h em Antália. A Europa ameaça sair sem um acordo.", "titulo_pt": "Desfecho da COP31 fica para domingo, com cadeiras vazias e sauditas contra 130 países", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279627, "titulo": "Terremoto de magnitude 6,7 deixa 15 feridos no Peru", "url": "https://www.cartacapital.com.br/mundo/terremoto-de-magnitude-67-deixa-15-feridos-no-peru/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T18:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 6,7 ocorreu na região andina do Peru, a aproximadamente 300 quilômetros ao leste de Lima, deixando 15 feridos.", "titulo_pt": "Terremoto de magnitude 6,7 deixa 15 feridos no Peru", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 279201, "titulo": "Un británico cruza Ormuz a nado para alertar del impacto ambiental de la guerra", "url": "https://www.clarin.com/estados-unidos/un-britanico-cruza-ormuz-a-nado-para-alertar-del-impacto-ambiental-de-la-guerra_0_uYofTPg1oo.html", "fonte_id": "clarin", "data_pub": "2026-11-21T17:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um nadador britânico de 56 anos percorreu o Estreito de Ormuz em três dias para chamar a atenção para o impacto ambiental causado pelo conflito entre Irã e Estados Unidos. Ele enfatizou a beleza natural do local e pediu para que as hostilidades parassem e a contaminação fosse limpa para preservar o ecossistema.", "titulo_pt": "Um britânico nageia o estreito de Ormuz para alertar sobre o impacto ambiental da guerra", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279380, "titulo": "French protesters rally for sixth weekend over living costs, public services, inequality", "url": "https://www.lemonde.fr/en/france/article/2026/11/21/french-protesters-rally-for-sixth-weekend-over-living-costs-public-services-inequality_6786265_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos na França continuaram por uma sexta semana consecutiva, iniciados por estudantes em setembro, contra aumentos de preços, serviços públicos insuficientes e violência policial.", "titulo_pt": "Protestos franceses por sexta semana seguida contra custos de vida, serviços públicos e violência policial", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279190, "titulo": "COP31 avança além do prazo e segue sem consenso sobre combustíveis fósseis", "url": "https://www.dw.com/pt-br/cop31-avança-além-do-prazo-e-segue-sem-consenso-sobre-combustíveis-fósseis/a-80010347?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-21T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As delegações continuam sem chegar a um consenso após o prazo oficial, e divergências sobre recursos para adaptação climática e a linguagem do texto final aumentam o risco de fracasso das negociações. O COP31 avança além do prazo oficial e segue sem consenso sobre combustíveis fósseis.", "titulo_pt": "COP31 avança além do prazo e segue sem consenso sobre combustíveis fósseis", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 279253, "titulo": "Armada advierte aumento de marejadas durante la temporada estival por fenómeno de El Niño", "url": "https://www.latercera.com/nacional/noticia/armada-advierte-aumento-de-marejadas-durante-la-temporada-estival-por-fenomeno-de-el-nino/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T15:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A marinha advertiu que haverá um aumento significativo das marés durante a estação veraniega devido ao fenômeno El Niño. As marejadas podem começar a se intensificar desde novembro, não apenas a partir do dia 15 de dezembro.", "titulo_pt": "Marinha avisa sobre aumento de marejadas durante a estação veraniega devido ao fenômeno El Niño", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 278702, "titulo": "China commits to low-carbon electrification and help for others to improve", "url": "https://www.theguardian.com/environment/2026/nov/21/china-commits-low-carbon-electrification-help-others-improve", "fonte_id": "guardian_world", "data_pub": "2026-11-21T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China está incentivando a electrificação rápida de sua economia através de fontes de energia de baixo carbono e prometendo ajudar outros países a fazerem o mesmo. Isso foi dito por um membro sênior da delegação chinesa no Cop31, um evento da ONU sobre clima.", "titulo_pt": "China se compromete com eletrificação de baixo carbono e assistência a outros países", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 278603, "titulo": "La cumbre ambiental COP31 y las diferencias entre Brasil y Argentina", "url": "https://www.clarin.com/rural/cumbre-ambiental-cop31-diferencias-brasil-argentina_0_asZHbwqT4A.html", "fonte_id": "clarin", "data_pub": "2026-11-21T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lula destacou as ações já implementadas, como a adoção de uma gasolina com 30% de etanol a partir de agosto de 2025. A demora na atualização da legislação no Brasil resulta em prejuízos para a sociedade, afetando investimentos e a mitigação de problemas de saúde e meio ambiente.", "titulo_pt": "COP31 e as diferenças entre Brasil e Argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 280148, "titulo": "Nati Jota denunció amenazas de abuso sexual y acoso: los mensajes intimidatorios que recibió", "url": "https://www.clarin.com/fama/nati-jota-denuncio-amenazas-abuso-sexual-acoso-mensajes-intimidatorios-recibio_0_n1Qoi7bl6w.html", "fonte_id": "clarin", "data_pub": "2026-11-22T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A apresentadora de Sería Increíble, Nati Jota, denunciou ameaças de abuso sexual e acusou um homem de a hostigar nas redes sociais. Ela compartilhou capturas de tela dos mensagens intimidadoras que recebeu.", "titulo_pt": "Nati Jota denunciou ameaças de abuso sexual e acusou hostigamento nas redes sociais", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 280284, "titulo": "Irène Sapir escaped the Holocaust. Far-right councilors opposed naming a school after her.", "url": "https://www.lemonde.fr/en/politics/article/2026/11/22/irene-sapir-escaped-the-holocaust-far-right-councilors-opposed-naming-a-school-after-her_6786463_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-22T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma escola em Bergerac, sul-oeste da França, foi renomeada em homenagem à Irène Sapir, uma figura com 89 anos localmente conhecida por ter escapado da deportação durante a operação Vél d'Hiv em 1942 e por manter viva a memória do evento. Os conselheiros do partido RN de Marine Le Pen votaram contra a renomeação, causando controvérsia.", "titulo_pt": "Irène Sapir, sobrevivente do holocausto, teve escola renomeada em sua homenagem, mas partido de marine le pen se opôs", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 280405, "titulo": "‘Horrific’ ICE arrests at Seattle airport jet bridge rattle passengers, fuel outrage", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375353/horrific-ice-arrests-seattle-airport-jet-bridge-rattles-passengers-fuels-outrage", "fonte_id": "scmp", "data_pub": "2026-11-22T02:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imigrantes americanos detiveram duas pessoas em um píncaro de passageiros no jet bridge de um aeroporto em Seattle no sábado. O incidente, que foi filmado, causou um cenário perturbador para passageiros e funcionários e atrasou o voo para Los Angeles. Uma mulher gritou que sua filha estava sendo levada e que ela tinha um permesso de trabalho.", "titulo_pt": "Detenção de imigrantes causa escândalo no jet bridge do aeroporto de Seattle", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 279522, "titulo": "Asian American women face fallout of Nvidia affair scandal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/22/2003868154", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As asiáticas americanas enfrentam consequências do escândalo envolvendo a Nvidia. O incidente tem afetado a comunidade asiática americana, especialmente as mulheres.", "titulo_pt": "As asiáticas americanas enfrentam consequências do escândalo da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279918, "titulo": "Impunity fuels surge in settler violence across occupied West Bank", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/21/impunity-fuels-surge-in-settler-violence-across-occupied-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento na violência dos colonos na Cisjordânia ocupada está alimentado pela impunidade.", "titulo_pt": "Impunidade alimenta aumento da violência dos colonos na cisjordânia ocupada", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 279939, "titulo": "French police officers jailed for racist violence against black man in landmark ruling", "url": "https://www.scmp.com/news/world/europe/article/3375350/french-police-officers-jailed-racist-violence-against-black-man-landmark-ruling", "fonte_id": "scmp", "data_pub": "2026-11-21T20:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado de um homem negro, Michel Zecler, que foi agredido por três policiais franceses, comemorou uma 'decisão histórica' após um tribunal reconhecer a natureza racista da violência e condenar os policiais a prisão de um a dois anos. A agressão, ocorrida há seis anos durante a pandemia de coronavírus, foi filmada e mostrava os policiais batendo nele e usando spray de pimenta e gás lacrimogêneo sem motivo aparente.", "titulo_pt": "Advogado de homem negro comemora 'decisão histórica' após policiais franceses serem condenados por violência racista", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 279749, "titulo": "Asesinó a una mujer mientras cumplía una condena en suspenso por un violento ataque contra otra: lo condenaron a cadena perpetua", "url": "https://www.clarin.com/internacional/asesino-mujer-cumplia-condena-suspenso-violento-ataque-condenaron-cadena-perpetua_0_UdsaMLJv2A.html", "fonte_id": "clarin", "data_pub": "2026-11-21T20:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem foi condenado a cadeia perpétua por assassinar uma mulher que estava cumprindo uma condenação suspensa por um ataque violento. Antes desse crime, ele já havia agredido uma colega de trabalho.", "titulo_pt": "Matou uma mulher sob vigilância de condenação por ataque violento; recebeu pena de cadeia perpétua", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279621, "titulo": "Policiais são investigados na França por violência contra manifestantes", "url": "https://www.cartacapital.com.br/mundo/policiais-sao-investigados-na-franca-por-violencia-contra-manifestantes/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T19:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais franceses estão sendo investigados por violência contra manifestantes, incluindo um caso de suposta agressão sexual envolvendo a agarrada e aperto de órgãos genitais.", "titulo_pt": "Policiais são investigados na França por violência contra manifestantes", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 279196, "titulo": "Os cidadãos impedidos pelo governo Ortega de voltar à Nicarágua: 'Sou ilegal no meu próprio país'", "url": "https://www.bbc.com/portuguese/articles/c60rknr0jg4zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-21T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU registrou pelo menos 318 casos de nicaraguenses impedidos de entrar no próprio país entre junho de 2018 e agosto de 2025. Esses cidadãos foram impedidos pelo governo Ortega de voltar à Nicarágua.", "titulo_pt": "Cidadãos nicaraguenses impedidos pelo governo Ortega de retornar ao país", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 280288, "titulo": "Afghanistan's humanitarian crisis worsens due to Taliban policies and lack of funding: 'We are left to fend for ourselves'", "url": "https://www.lemonde.fr/en/international/article/2026/11/21/afghanistan-s-humanitarian-crisis-worsens-due-to-taliban-policies-and-lack-of-funding-we-are-left-to-fend-for-ourselves_6786332_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As crises humanitárias em Afghanistan se agravam devido a cortes na ajuda internacional, aumento dos preços dos alimentos e retorno em massa de refugiados de Irã e Paquistão. As crianças são as primeiras vítimas, com o fechamento de centros de saúde reduzindo as oportunidades de tratamento.", "titulo_pt": "Crise humanitária em afghanistan se agrava devido a políticas do Taliban e falta de fundos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279125, "titulo": "Empresa é condenada por racismo após chefe dizer que negros lembram macacos", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/empresa-e-condenada-por-racismo-apos-chefe-dizer-que-negros-lembram-macacos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma empresa foi condenada a pagar R$ 15 mil de indenização a um auxiliar de limpeza que sofreu racismo, incluindo ofensas comparando negros a macacos, em um ambiente escolar.", "titulo_pt": "Empresa condenada por racismo após chefe comparar negros a macacos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279583, "titulo": "An Iranian Woman Falls Pregnant to Avoid Execution in ‘Inherited’: Situation in Iran Is ‘Increasingly Complex’", "url": "https://variety.com/2026/film/global/morteza-alizadeh-morally-knotty-inherited-iran-1236954820/", "fonte_id": "variety", "data_pub": "2026-11-21T13:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Morteza Alizadeh, um cineasta iraniano, foi inspirado por uma foto que mostrava mulheres e crianças dentro de uma prisão feminina. Ele decidiu explorar essa realidade pouco conhecida ao criar a obra 'Inherited'.", "titulo_pt": "Uma iraniana grávida para evitar execução em 'Inherited': situação no Irã se torna 'cada vez mais complexa'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 278667, "titulo": "Avanza el ICE en Texas: un nuevo condado firmó un acuerdo de colaboración con la agencia migratoria", "url": "https://www.lanacion.com.ar/estados-unidos/texas/avanza-el-ice-en-texas-un-nuevo-condado-firmo-un-acuerdo-de-colaboracion-con-la-agencia-migratoria-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T09:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O condado de Travis, no Texas, assinou um acordo com o ICE, permitindo que um oficial carcelário execute ordens migratórias civis dentro da prisão. Mais um condado se juntou à colaboração com a agência de imigração.", "titulo_pt": "Avanço do ICE no Texas: novo condado firma acordo de colaboração com a agência migratória", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278496, "titulo": "O Brasil racista", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/o-brasil-racista", "fonte_id": "metropoles", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete discute o tema do racismo no Brasil. O título original 'O Brasil racista' sugere que o questionário aborda questões relacionadas à discriminação racial no país.", "titulo_pt": "O Brasil racista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278888, "titulo": "French Senate approves police shootings law dubbed ‘licence to kill’ by critics", "url": "https://www.scmp.com/news/world/europe/article/3375320/french-senate-approves-police-shootings-law-dubbed-licence-kill-critics", "fonte_id": "scmp", "data_pub": "2026-11-21T06:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado francês aprovou uma lei que presume que policiais que usam armas estão agindo legalmente, com votos de 205 a 110. A proposta, que foi criticada por parlamentares de esquerda, concede aos policiais um benefício de dúvida no caso de mortes por disparos, a menos que haja provas contrárias.", "titulo_pt": "Senado francês aprova lei que presume legalidade de disparos policiais, chamada de 'licença para matar' pelos críticos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278832, "titulo": "Three French police officers sentenced over racist assault on Black man", "url": "https://www.aljazeera.com/news/2026/11/21/three-french-police-officers-sentenced-over-racist-assault-on-black-man?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T03:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses foram condenados por um ataque racista contra o produtor musical Michel Zecler em 2020. O tribunal criminal de Paris considerou que o racismo foi um fator agravante no caso.", "titulo_pt": "Três policiais franceses condenados por ataque racista a produtor musical", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 280200, "fonte_id": "canaltech", "titulo": "5 melho function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
