<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 11/10/2026 19:12 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "11/10/2026 19:12", "stats": {"noticias_novas": 355, "resumos_gerados": 179}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Manifestantes depredaram estações de metrô durante um ato de apoio a Lula na Avenida Paulista, em São Paulo. O evento, que reuniu milhares de pessoas, terminou com grades e painéis pichados, além de danos a infraestrutura. Em outra frente, Flávio Bolsonaro, candidato do PL, acusa a campanha de Lula de promover 'divulgação de mentiras em massa' e pede a investigação do diretor-geral da Polícia Federal, Andrei Rodrigues, por supostamente beneficiar o PT nas eleições. O corregedor do TSE, Ricardo Villas Bôas Cueva, suspendeu a decisão do presidente do TSE, Kassio Nunes Marques, e restabeleceu o canal 'Exército do Lula', criado no WhatsApp para apoios a Lula. Além disso, Lula afirmou que a PEC que aboliu a escala 6x1 tem data de votação marcada para antes do segundo turno, e Flávio Bolsonaro reuniu Tarcísio e prefeitos em São Paulo, esperando mais agilidade da Justiça Eleitoral para combater as fake news da campanha de Lula.", "mundo": "O mundo enfrenta vários desafios em diferentes regiões. Primeiramente, a Ucrânia e a Rússia continuam em conflito, com ataques aeroportuários e a refinarias de petróleo. A Ucrânia denuncia ataques hutíes a aeroportos sauditas, enquanto a Rússia permanece em silêncio sobre um suposto 'ceio de paz' energética proposto por Donald Trump. O presidente dos Estados Unidos também ameaça bloquear armas para a Ucrânia em resposta a ataques a refinarias russas. Em seguida, a eleição presidencial no Brasil ganha destaque, com o presidente Lula mobilizando uma grande manifestação vermelha para tentar reverter sua situação nas pesquisas de intenção de voto. Além disso, a Índia enfrenta desafios com protestos de jovens contra o primeiro-ministro Narendra Modi, enquanto a China e os Estados Unidos buscam influenciar a Ucrânia através de acordos de armas e combustível. Finalmente, a Itália lamenta a morte de Wilma De Angelis, cantora, atriz e apresentadora de televisão, aos 96 anos, e se prepara para as eleições presidenciais com Raphaël Glucksmann vencendo a primária do lado esquerdo da França.\n\nA Arábia Saudita enfrenta ataques letais de grupos rebeldes, com o aeroporto de Dammam sendo atingido e 13 pessoas morrendo em um ataque ao aeroporto de Riad, o mais letal na história do país em mais de uma década. O presidente dos Estados Unidos, Donald Trump, propôs um 'cessar-fogo energético' entre Rússia e Ucrânia, com a condição de que os ataques a refinarias de petróleo sejam interrompidos, mas o presidente ucraniano Volodimir Zelensky afirmou não ter sido informado sobre tal acordo. Diante das tensões geopolíticas, o Irã considera a resposta dos Estados Unidos sobre a passagem de Ormuz 'insuficiente', exigindo esclarecimentos sobre questões pendentes. Além disso, o ex-comandante das Forças Armadas de Taiwan sugeriu que o Japão deveria vender armas para o país, enquanto a China e a Índia mantêm relações diplomáticas mais amenas, mas persistem tensões militares, com a escalada de ataques aéreos em áreas ocupadas no Líbano e no Sudão.", "economia": "A crise dos títulos franceses tem reavivado preocupações sobre a dívida soberana na Europa, com o governo francês enfrentando dificuldades para manter suas finanças públicas em uma trajetória sustentável. Isso pode levar a turbulências na zona do euro até a eleição de abril. No contexto econômico mais amplo, o calendário econômico destaca a inflação nos Estados Unidos e a atividade econômica no Brasil como prioridades para os investidores na próxima semana. As preocupações com a dívida e a inflação também estão impactando as apostas para juros em grandes economias, elevando os custos de financiamento e apertando as condições financeiras. Além disso, a BP está preparando a retomada da produção de petróleo no Golfo do México.", "tecnologia": "A Microsoft alertou sobre a importância de implementar um 'freio de emergência' para a inteligência artificial (IA), argumentando que é crucial ter um mecanismo que possa interromper o desenvolvimento da IA em situações perigosas. O CEO da Microsoft, Satya Nadella, defendeu essa medida em um artigo publicado no The Verge. A empresa também planeja anunciar um novo hub de casa inteligente chamado HomeView na próxima segunda-feira, conforme informado pelo jornalista Mark Gurman. O Windows 11 26H2, uma atualização gratuita do sistema operacional, também merece destaque, trazendo novidades como uma Barra de Tarefas personalizável e um Explorador de Arquivos com mais ações. Além disso, a NASA está desenvolvendo um telescópio para a missão LISA, que será feito de um composto de vidro e cerâmica, com o objetivo de observar ondas gravitacionais no espaço-tempo. Por fim, a SpaceX investiu US$ 40 bilhões para adquirir licenças de frequências terrestres de 800 MHz com o objetivo de criar uma rede híbrida de telefonia móvel, combinando tecnologia de satélites da Starlink com redes terrestres.", "ciencia": "Um estudo publicado na revista The Lancet alerta que a guerra nuclear e a inteligência artificial podem levar à extinção da humanidade até 2100, conforme especialistas. O estudo avaliou 17 grandes ameaças à saúde global e destacou a urgência de abordar essas questões. Paralelamente, cientistas do Mubadala Arabian Center for Climate and Environmental Sciences (ACCESS), na NYU Abu Dhabi, desenvolveram um algoritmo que pode prever o avanço da geleada arctica até nove meses antes, oferecendo uma nova maneira de antecipar mudanças climáticas. Em outros desenvolvimentos científicos, pesquisadores do INTA na Norpatagonia descobriram que a carne de animais alimentados com remolacha forrajera apresentou qualidade similar à dos sistemas pastoril com maíz, sugerindo possíveis alternativas alimentares. Além disso, cientistas da Texas A&M identificaram que microplásticos de polietileno podem contribuir para a doença hepática fígado grasa, com efeitos ainda mais prejudiciais quando associados a uma dieta inadequada.", "cultura": "O Círio de Nazaré, celebrado em outubro, reúne fiéis e turistas em Belém e foi considerado patrimônio cultural pela Unesco. A festa, que percorre as ruas da cidade, reafirma a força da fé entre as gerações. Em outro evento cultural, a Globo anunciou a venda de sua série 'Vermelho Sangue' para o Reino Unido, em um acordo inédito com a BBC. A série, produzida pelo Globoplay e criada por Rosane Svartman, foi um sucesso na plataforma de streaming da Globo. A emissora também apresenta 'To Love is to Care', uma novela de grande impacto emocional criada pelo autor Walcyr Carrasco, com atores renomados brasileiros, como parte do conceito de 'super drama'.", "sociedade": "Mais de 26.000 casos de abuso contra idosos foram registrados, de acordo com o Taipei Times. Em São Paulo, um casal foi detido após a morte de um idoso de 62 anos, enquanto quatro policiais militares foram afastados após a morte de um jovem de 27 anos, supostamente confundido com uma arma de fogo. Em Minas Gerais, o governo realizou as últimas homenagens aos três policiais militares mortos em uma queda de avião. O risco de câncer de mama é maior após os 50 anos, informa o CNN Brasil, e a obesidade é uma condição crônica comum no Brasil, podendo levar à morte, alerta a mesma fonte. O Brasil também registrou 117 acidentes viais e seis mortes no fim de semana prolongado, informa a Metrópoles. Além disso, um campeão mirim de hipismo de 13 anos, junto com a mãe, tios e prima, faleceu no Rio de Janeiro em um acidente fatal.", "meio_ambiente": "O governo do Amazonas declarou estado de emergência em 36 cidades devido ao avanço de incêndios florestais, com 229 focos extintos desde o início da estiagem em julho. Nos primeiros dias de outubro, o número de focos de incêndio no Amazonas aumentou 271%, totalizando 1.380 focos. A Força Aérea Brasileira (FAB) enviou reforço aéreo para combater as queimadas. A ONU alertou para os riscos do calor extremo na saúde das gestantes, associando altas temperaturas a partos prematuros e complicações. O ator Mark Ruffalo adquiriu mais de 20 hectares de terra em Nova York para combater o fracking e criar um santuário agrícola sustentável. No México, o furacão Simon fortaleceu e se aproxima da costa central, prevendo-se toque de solo no domingo. No sudeste dos Estados Unidos, o furacão Isaias causou fortes ventos e chuva intensa, deixando quatro mortos. Em Indonésia, oito orangotãos foram libertados em uma floresta protegida após serem resgatados de áreas afetadas por incêndios.", "direitos_humanos": "Pelo menos 139 migrantes morreram em um naufrágio perto de Djibouti, segundo a OIM, enquanto 116 estão desaparecidos. O incidente ocorreu quando um barco transportando 350 pessoas capotou durante a noite de 8 para 9 de outubro. O evento reforça a gravidade da situação dos migrantes na África Oriental, onde milhares viajam anualmente em direção ao Estreito de Bab el-Mandeb com o objetivo de chegar a países do Golfo. Em outro desenvolvimento, um menino palestino de sete anos foi morto após ser baleado por forças israelenses em um acampamento de refugiados em Jabalia, no norte da Faixa de Gaza, levantando novas preocupações sobre a violência contra civis em conflitos armados. Além disso, Claudia, uma salvadorenha com proteção temporária de imigrantes (TPS) em Houston, expressou seus temores sobre a possibilidade de deportação e a separação de suas crianças americanas, destacando as tensões associadas à política migratória atual. Um grupo de imigrantes salvadorenhos em Florida, após o fim do TPS, enfrenta dilemas sobre a legalidade de sua permanência nos EUA, com medo de serem sequestrados pelo ICE. Em outro contexto, a Índia libertou líderes do 'movimento das baratas', mas as prisões continuam, enquanto em Hong Kong e Tailândia, organizações de direitos humanos pedem a liberação de três ativistas detidos. Por fim, a formação de 198 carabineros em direitos humanos na Faculdade de Direito da U. de Chile representa um passo importante na promoção desses direitos no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 209776, "titulo": "Manifestantes depredam estações de metrô em ato de apoio a Lula na avenida Paulista", "url": "https://veja.abril.com.br/politica/manifestantes-depredam-metro-em-ato-de-apoio-a-lula-na-avenida-paulista/", "fonte_id": "veja", "data_pub": "2026-10-11T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Manifestantes depredaram estações de metrô durante um ato de apoio a Lula na Avenida Paulista. Acessos foram pichados e grades quebradas durante a dispersão do evento em São Paulo.", "titulo_pt": "Manifestantes depredam estações de metrô em ato de apoio a Lula na avenida Paulista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 209928, "titulo": "Flávio Bolsonaro x Lula – Quem são os candidatos a presidente no segundo turno das eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-lula-quem-sao-os-candidatos-a-presidente-no-segundo-turno-das-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-11T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro terminou o primeiro turno das eleições com 2,2 milhões de votos a mais que Jair Bolsonaro. Lula é outro candidato a presidente no segundo turno das eleições 2026.", "titulo_pt": "Flávio Bolsonaro x Lula – Quem são os candidatos a presidente no segundo turno das eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 209790, "titulo": "CCJ do Senado vota PEC da Segurança na próxima quarta-feira (14/10)", "url": "https://www.metropoles.com/brasil/ccj-do-senado-vota-pec-da-seguranca-na-proxima-quarta-feira-14-10", "fonte_id": "metropoles", "data_pub": "2026-10-11T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Constituição e Justiça do Senado irá votar a Proposta de Emenda à Constituição (PEC) da Segurança na próxima quarta-feira, 14 de outubro. A proposta, prioridade do governo, avançou após a reaproximação entre o presidente e Alcolumbre e ainda possui três destaques pendentes.", "titulo_pt": "CCJ do Senado vota PEC da Segurança na próxima quarta-feira (14/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209791, "titulo": "Defesa da democracia e virada de votos mobilizam ato com Lula na Paulista", "url": "https://www.metropoles.com/sao-paulo/defesa-da-democracia-e-virada-de-votos-mobilizam-ato-com-lula-na-paulista", "fonte_id": "metropoles", "data_pub": "2026-10-11T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula participou de um ato na Paulista defendendo a democracia. Alckmin mencionou o empenho de São Paulo pela Constituição de 1932.", "titulo_pt": "Defesa da democracia e mobilização de votos movimentam ato com Lula na Paulista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209737, "titulo": "O mito do Nordeste vermelho, outra vez", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcus-melo/2026/10/o-mito-do-nordeste-vermelho-outra-vez.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, o artigo mostrou que o núcleo do centrão e o PL haviam eleito 35% dos deputados federais nordestinos, com os partidos de esquerda obtendo 33%. As participações dos partidos PL, PP e Republicanos nas bancadas nordestinas eram semelhantes à nacional.", "titulo_pt": "O mito do Nordeste vermelho, outra vez", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 209795, "titulo": "Apoiadores realizam atos pró-Lula no país inteiro neste domingo (11/10)", "url": "https://www.metropoles.com/brasil/apoiadores-realizam-atos-pro-lula-no-pais-inteiro-neste-domingo-11-10", "fonte_id": "metropoles", "data_pub": "2026-10-11T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apoiadores realizaram atos pró-Lula em todo o país neste domingo (11/10). O presidente Lula participou de um ato na Avenida Paulista, em São Paulo, que, segundo a campanha petista, reuniu 1 milhão de pessoas.", "titulo_pt": "Apoiadores realizam atos pró-lula no país inteiro neste domingo (11/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 209831, "titulo": "Campanha de Flávio pede investigação de Andrei por suposto beneficio a Lula", "url": "https://www.cnnbrasil.com.br/eleicoes/campanha-de-flavio-pede-investigacao-de-andrei-por-suposto-beneficio-a-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro acusa Andrei de usar seu cargo na Polícia Federal para beneficiar grupos políticos durante o primeiro turno das eleições. A ação pede uma investigação sobre essas supostas ações.", "titulo_pt": "Campanha de Flávio pede investigação de Andrei por suposto benefício a grupos políticos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209738, "titulo": "Flávio Bolsonaro pede que diretor-geral da PF seja investigado por suposto benefício ao PT na eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/10/flavio-bolsonaro-pede-que-diretor-geral-da-pf-seja-investigado-por-suposto-beneficio-ao-pt-na-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro apresentou uma notícia-crime à Justiça Eleitoral pedindo a investigação do diretor-geral da Polícia Federal, Andrei Rodrigues, por supostamente beneficiar o PT nas eleições. A informação foi divulgada em 11 de novembro de 2026.", "titulo_pt": "Flávio Bolsonaro pede investigação do diretor-geral da PF por suposto benefício ao PT", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 209745, "titulo": "Se seus pais deixarem de herança mais dívidas do que bens, você terá de pagar a diferença?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/se-seus-pais-deixarem-de-heranca-mais-dividas-do-que-bens-voce-tera-de-pagar-a-diferenca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ao morrer, uma pessoa deixou R$ 2 milhões em bens, mas também R$ 3 milhões em dívidas, resultando em uma dívida líquida de R$ 1 milhão. Os herdeiros podem ter que pagar a diferença se os bens não cobrirem as dívidas.", "titulo_pt": "Se seus pais deixarem herança com mais dívidas do que bens, você terá de pagar a diferença?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 209853, "titulo": "PM-SP afasta policiais após jovem morrer com 27 tiros em abordagem em Moema", "url": "https://www.infomoney.com.br/brasil/pm-sp-afasta-policiais-apos-jovem-morrer-com-27-tiros-em-abordagem-em-moema/", "fonte_id": "infomoney", "data_pub": "2026-10-11T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria da Segurança Pública de São Paulo abriu um inquérito para apurar a conduta dos policiais envolvidos na abordagem fatal que resultou na morte de um jovem com 27 tiros em Moema. Câmeras corporais, armas e celular da vítima serão periciados.", "titulo_pt": "PM-SP afasta policiais após jovem morrer com 27 tiros em abordagem em Moema", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209751, "titulo": "Mendonça proíbe PT de impulsionar vídeo que dize que Flávio Bolsonaro é contra a escala 6x1", "url": "https://g1.globo.com/politica/noticia/2026/10/11/mendonca-proibe-pt-de-impulsionar-videos-que-dizem-que-flavio-bolsonaro-e-contra-a-escala-6x1.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-11T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente do Tribunal Superior Eleitoral (TSE), André Mendonça, proibiu a campanha do PT de impulsionar um vídeo que afirma que Flávio Bolsonaro é contra a escala 6x1. A decisão foi tomada após um pedido da campanha de Flávio Bolsonaro para suspensão do conteúdo que 'desqualifica' o candidato.", "titulo_pt": "Mendonça proíbe PT de impulsionar vídeo que diz que Flávio Bolsonaro é contra a escala 6x1", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 209856, "titulo": "Flávio alerta para falsas promessas de cargos e chama intermediários de “picaretas”", "url": "https://www.infomoney.com.br/politica/flavio-alerta-para-falsas-promessas-de-cargos-e-chama-intermediarios-de-picaretas/", "fonte_id": "infomoney", "data_pub": "2026-10-11T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PL, Flávio Bolsonaro, advertiu sobre falsas promessas de cargos e chamou intermediários de 'picaretas'. Ele afirmou que as nomeações serão discutidas apenas após o segundo turno das eleições.", "titulo_pt": "Flávio avisa sobre promessas falsas de cargos e acusa intermediários de 'picaretas'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209857, "titulo": "Flávio volta a descartar reeleição e diz que fará apenas um mandato se eleito", "url": "https://www.infomoney.com.br/politica/flavio-volta-a-descartar-reeleicao-e-diz-que-fara-apenas-um-mandato-se-eleito/", "fonte_id": "infomoney", "data_pub": "2026-10-11T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio afirmou que não pretende disputar um segundo mandato presidencial e que sua candidatura não é uma busca por poder. Ao lado de Tarcísio de Freitas, o senador declarou que fará apenas um mandato se eleito.", "titulo_pt": "Flávio rejeita reeleição e diz que fará apenas um mandato se eleito", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209858, "titulo": "Lula aposta em jovens e promete revolução tecnológica em ato na Paulista", "url": "https://www.infomoney.com.br/politica/lula-aposta-em-jovens-e-promete-revolucao-tecnologica-em-ato-na-paulista/", "fonte_id": "infomoney", "data_pub": "2026-10-11T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula enfatizou o engajamento dos jovens e convocou os idosos a votarem no segundo turno. Ele prometeu investir em tecnologias como inteligência artificial, indústria digital e segurança pública.", "titulo_pt": "Lula aposta em jovens e promete revolução tecnológica em ato na Paulista", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 209806, "titulo": "Ato pró-Lula toma o Eixo Norte e leva brasilienses às ruas do DF", "url": "https://www.metropoles.com/distrito-federal/ato-pro-lula-toma-o-eixo-norte-e-leva-brasilienses-as-ruas-do-df", "fonte_id": "metropoles", "data_pub": "2026-10-11T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vídeos nas redes sociais mostram apoiadores de Lula manifestando-se a favor do presidente e contra a governadora Celina Leão. O ato levou pessoas às ruas no Eixo Norte de Brasília.", "titulo_pt": "Ato pró-lula toma o Eixo Norte e leva brasilienses às ruas do DF", "veiculo": "Metrópoles", "pais": "Brasil", "cl ropa em reestruturação contra montadoras da China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/volkswagen-cobra-apoio-da-europa-em-reestruturacao-contra-montadoras-da-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente-executivo da Volkswagen, Oliver Blume, pediu apoio dos formuladores de políticas europeus para a reestruturação da empresa, em meio a esforços de Bruxelas para proteger a indústria contra concorrentes chineses. Blume espera que as condições necessárias para o sucesso dessa reestruturação sejam criadas pela Europa.", "titulo_pt": "Volkswagen pede apoio da Europa em reestruturação contra montadoras chinesas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 209822, "titulo": "Com ou sem obrigatoriedade IFRS, a fronteira da transição climática é a implementação", "url": "https://exame.com/esg/com-ou-sem-obrigatoriedade-ifrs-a-fronteira-da-transicao-climatica-e-a-implementacao/", "fonte_id": "exame", "data_pub": "2026-10-11T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio para pequenas e médias empresas é reduzir custos, organizar dados e transformar as exigências de transparência climática em uma vantagem competitiva. A transição climática não depende da obrigatoriedade do IFRS.", "titulo_pt": "Com ou sem obrigatoriedade IFRS, a fronteira da transição climática é a implementação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 209109, "titulo": "Fazenda investiga 14 bets por subdeclaração de receita; só Blaze pode ter gerado prejuízo de R$ 96 mi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/fazenda-investiga-14-bets-por-subdeclaracao-de-receita-so-blaze-pode-ter-gerado-prejuizo-de-r-96-mi.shtml", "fonte_id": "folha_mercado", "data_pub": "2 2026-10-11T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns sistemas físicos clássicos podem explorar muitas configurações ao longo do tempo até que seu comportamento a longo prazo não revele mais suas condições iniciais. Esta propriedade, chamada de ergodicidade, envolve a amostragem das configurações disponíveis de acordo com a distribuição estatística apropriada.", "titulo_pt": "Marcas quânticas mantêm vestígios duradouros do passado do sistema", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210074, "titulo": "New study shows effects of hypoxia in Florida's Banana River", "url": "https://phys.org/news/2026-10-effects-hypoxia-florida-banana-river.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo conduzido pelo assistente de ciências marinhas da Florida Tech, Austin Fox, PhD '15, descobriu que níveis baixos de oxigênio estão liberando nutrientes enterrados no leito do rio que alimentam algas nocivas. O estudo foi baseado em testes de oxigênio realizados pela primeira vez em larga escala ao longo do Rio Banana.", "titulo_pt": "Novo estudo mostra efeitos da hipóxia no rio Banana da flórida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209688, "titulo": "Conservation groups alarmed at marine mammals' deaths in Spain", "url": "https://phys.org/news/2026-10-groups-alarmed-marine-mammals-deaths.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos de conservação condenaram a morte de um delfim transferido de França para um parque marinho espanhol, afirmando que isso se soma às mortes de outros mamíferos marinhos recentemente transferidos da Canadá para a Espanha.", "titulo_pt": "Grupos de conservação alarmados com mortes de mamíferos marinhos na Espanha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209310, "titulo": "Aterosclerosis y trombosis: alimentaron animales con remolacha forrajera y el resultado fue sorprendente", "url": "https://www.lanacion.com.ar/economia/campo/aterosclerosis-y-trombosis-alimentaron-animales-con-remolacha-forrajera-y-el-resultado-fue-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T16:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo do INTA na Norpatagonia descobriu que a carne dos animais alimentados com remolacha forrajera apresentou qualidade similar à dos sistemas pastoril com maíz. As pesquisadoras destacaram a necessidade de mais avaliações.", "titulo_pt": "Aterosclerose e tromboses: estudo com remolacha forrajera surpreendeu", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209689, "titulo": "Jurassic fossil reveals ancient origins of how mammals drink milk", "url": "https://phys.org/news/2026-10-jurassic-fossil-reveals-ancient-mammals.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de pesquisadores descobriu evidências que iluminam as origens evolutivas de uma das características definidoras dos mamíferos: a capacidade de amamentar e consumir leite durante a infância. Seus achados sugerem que estruturas anatômicas cruciais para a mamada, deglutição e amamentação evoluíram há quase 165 milhões de anos, muito antes da aparição dos mamíferos modernos.", "titulo_pt": "Fósselia jurassica revela antigas origens da amamentação em mamíferos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209261, "titulo": "Guerra nuclear e IA podem extinguir a humanidade até 2100, alertam especialistas", "url": "https://olhardigital.com.br/2026/10/11/ciencia-e-espaco/guerra-nuclear-e-ia-podem-extinguir-a-humanidade-ate-2100-alertam-especialistas/", "fonte_id": "olhar_digital", "data_pub": "2026-10-11T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas avaliaram 17 grandes ameaças à saúde global e alertaram que a guerra nuclear e a inteligência artificial podem levar à extinção da humanidade até 2100. A avaliação foi publicada na revista The Lancet.", "titulo_pt": "Guerra nuclear e IA podem extinguir a humanidade até 2100, alertam especialistas", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 209691, "titulo": "South Korea completes trial of Arctic shipping route", "url": "https://phys.org/news/2026-10-south-korea-trial-arctic-shipping.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio contêiner sul-coreano retornou após uma viagem de teste pelo Ártico, avaliando um novo itinerário aberto devido à deriva da geleira, enquanto conflitos no Oriente Médio afetam o comércio marítimo global.", "titulo_pt": "Coreia do sul conclui teste de rota arctica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209692, "titulo": "Egypt's Fayoum mummy portraits to travel abroad for first time after restoration", "url": "https://phys.org/news/2026-10-egypt-fayoum-mummy-portraits.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Egipto apresentou uma versão restaurada da pintura 'Tondo dos Dois Irmãos', um valioso retrato do século II proveniente das famosas pinturas de Fayoum. Este é o primeiro viajão internacional após a restauração.", "titulo_pt": "Pinturas momiﬁcadas de Fayoum do egito viajarão pelo mundo pela primeira vez após restauro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209089, "titulo": "Corrida à Lua expõe zona cinzenta sobre propriedade de recursos do satélite", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/corrida-a-lua-expoe-zona-cinzenta-sobre-propriedade-de-recursos-do-satelite.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-11T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corrida à Lua expõe a questão da propriedade sobre os recursos do satélite. Um magnata fictício em 'O Homem que Vendeu a Lua', de Robert Heinlein, embarca em uma missão para ser o primeiro a chegar à Lua e leiloa direitos sobre a superfície lunar.", "titulo_pt": "Corrida à Lua expõe questão de propriedade sobre recursos do satélite", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 209693, "titulo": "New algorithm could predict Arctic sea ice up to 9 months ahead, offering new climate insights", "url": "https://phys.org/news/2026-10-algorithm-arctic-sea-ice-months.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Mubadala Arabian Center for Climate and Environmental Sciences (ACCESS) na NYU Abu Dhabi desenvolveram um novo algoritmo que pode prever o extenso da geleada arctica até nove meses antes, oferecendo uma nova maneira de antecipar mudanças no Ártico que podem afetar o sistema climático global.", "titulo_pt": "Novo algoritmo pode prever geleada arctica até 9 meses adiantado, oferecendo novas perspectivas climáticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209579, "titulo": "Sweet protein brazzein shows promise in reducing blood sugar spikes: Study", "url": "https://www.aljazeera.com/news/2026/10/11/sweet-protein-brazzein-shows-promise-in-reducing-blood-sugar-spikes-study?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-11T12:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa russa indica que a proteína brazzein pode auxiliar na redução de picos de glicemia no sangue. O estudo sugere que essa substância tem potencial para ser utilizada em contextos relacionados ao controle da glicemia.", "titulo_pt": "Proteína brazzein mostra promessa na redução de picos de glicemia: estudo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 209448, "titulo": "Your kid wants to go vegan. Should you let them?", "url": "https://www.vox.com/future-perfect/505747/kid-moral-choices-vegan-parenting", "fonte_id": "vox", "data_pub": "2026-10-11T12:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Shayla Love, jornalista científica e fã do Your Mileage May Vary, está substituindo temporariamente a colunista Sigal Samuel durante suas férias maternidade. Ela abordará perguntas enviadas pelos leitores, analisando-as a partir de perspectivas filosóficas, psicológicas e outras.", "titulo_pt": "Seu filho quer seguir uma dieta vegana. Você deve deixá-lo?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 209090, "titulo": "Dois casos fascinantes de estrelas canibais", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/10/dois-casos-fascinantes-de-estrelas-canibais.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-11T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois estudos independentes foram publicados na última edição da revista Nature Astronomy relatando casos de estrelas canibais. Esses fenômenos revelam um universo menos pacífico e mais selvagem do que pode parecer a primeira vista.", "titulo_pt": "Dois casos fascinantes de estrelas canibais", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 209653, "titulo": "Leading Chinese mathematicians unite behind use of AI in research", "url": "https://www.scmp.com/news/china/science/article/3370492/leading-chinese-mathematicians-unite-behind-use-ai-research?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-11T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matemáticos chineses liderados por Shing-Tung Yau lançaram uma aliança em Beijing com o objetivo de integrar a inteligência artificial na pesquisa matemática, visando superar o atraso em relação aos Estados Unidos. A aliança envolverá oito instituições de destaque e pretende criar uma rede de mais de mil membros.", "titulo_pt": "Líderes matemáticos chineses unem-se para integrar IA na pesquisa matemática", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 209694, "titulo": "Spinach nanoparticles help failing rat hearts via 'borrowed photosynthesis'", "url": "https://phys.org/news/2026-10-spinach-nanoparticles-rat-hearts-photosynthesis.html", "fonte_id": "phys_org", "data_pub": "2026-10-11T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nanopartículas de espinafre foram introduzidas em células cardíacas de ratos com o objetivo de testar se a 'fotossíntese emprestada' poderia auxiliar um coração sobrecarregado. O espinafre pode converter luz em energia química, enquanto um coração em crise não consegue fazer isso.", "titulo_pt": "Nanopartículas de espinafre ajudam corações fracassados através de 'fotossíntese emprestada'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 209091, "titulo": "Justiça para Franklin, madrinha do DNA", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/marceloleite/2026/10/justica-para-franklin-madrinha-do-dna.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-11T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rosalind Franklin, uma cristalógrafa britânica, foi crucial na obtenção da chapa de raio-X do DNA que ajudou a desvendar a estrutura da dupla hélice. Novos detalhes extraídos de seus cadernos reforçam sua importância na pesquisa sobre a molécula da herança genética.", "titulo_pt": "Justiça para rosalind, a madrinha do DNA", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 210076, "titulo": "John Stamos Addresses Mike Love’s Health as Beach Boys Concert Footage Raises Con id": 209934, "titulo": "Los cubanos recurren a las farmacias comunitarias y gratuitas para sobrellevar la escasez de medicamentos", "url": "https://www.clarin.com/mundo/cubanos-recurren-farmacias-comunitarias-gratuitas-sobrellevar-escasez-medicamentos_0_onnZkdMtp6.html", "fonte_id": "clarin", "data_pub": "2026-10-11T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As farmácias estatais cubanas possuem apenas um terço dos medicamentos do quadro básico de saúde pública. A falta de matérias-primas importadas levou a laboratórios estatais, como BioCubafarma, a suspender a produção de vários fármacos.", "titulo_pt": "Os cubanos recorrem às farmácias comunitárias e gratuitas para enfrentar a escassez de medicamentos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 209918, "titulo": "150.000 inmigrantes en un limbo en Florida tras el fin del TPS y sin opción por miedo al ICE y sus redadas", "url": "https://www.lanacion.com.ar/estados-unidos/florida/150000-inmigrantes-en-un-limbo-en-florida-tras-el-fin-del-tps-y-sin-opcion-por-miedo-al-ice-y-sus-nid11102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-11T20:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 150 mil imigrantes estão em situação precária na Flórida após o fim do TPS, enfrentando o risco de deportação e evitando saídas para não serem encontrados pela ICE, o que pode resultar em perda de emprego. Familias do sul do estado estão reduzindo suas atividades externas devido ao medo de serem deportadas para países violentos.", "titulo_pt": "150 Mil imigrantes em situação precária na flórida após fim do TPS", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 209959, "titulo": "Muerte de Aliste Vega reabre debate por indultos: de exigir “celeridad” en tramitación a advertir límites por lesa humanidad", "url": "https://www.latercera.com/politica/noticia/muerte-de-aliste-vega-reabre-debate-por-indultos-de-exigir-celeridad-en-tramitacion-a-advertir-limites-por-lesa-humanidad/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T19:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Partido Republicano pressionou pela aceleração dos indultos para pessoas com doenças terminais, enquanto Lautaro Carmona advertiu sobre a não extensão dessa discussão para condenados por crimes contra a humanidade. Ximena Ossandón chamou para uma avaliação individual de cada caso.", "titulo_pt": "Morte de Aliste Vega renova debate sobre indultos: aceleração para doentes terminais, mas limites para crimes contra a humanidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 209872, "titulo": "'Eu simplesmente aguentei': o abuso sexual de pessoas com deficiências que abalou a Coreia do Sul", "url": "https://www.bbc.com/portuguese/articles/c5pvg2309g8vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-11T18:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatos de abuso sexual em uma residência assistida para pessoas com deficiência intelectual na Coreia do Sul causaram choque no país e levantaram questionamentos sobre o atendimento às pessoas com deficiência pelo governo. A BBC conversou com uma das vítimas.", "titulo_pt": "Eu simplesmente aguentei': o abuso sexual de pessoas com deficiências que abalou a Coreia do Sul", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 209355, "titulo": "Casi 200 carabineros terminan curso de formación en DD.HH. en la Facultad de Derecho de la U. de Chile", "url": "https://www.latercera.com/nacional/noticia/casi-200-carabineros-terminan-curso-de-formacion-en-ddhh-en-la-facultad-de-derecho-de-la-u-de-chile/", "fonte_id": "la_tercera", "data_pub": "2026-10-11T17:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O curso de formação em direitos humanos foi concluído por aproximadamente 200 carabineros que atuam diretamente com pessoas em situação de vulnerabilidade. O programa foi direcionado a servidores cujas funções envolvem assistência a indivíduos e grupos em situação de vulnerabilidade.", "titulo_pt": "Quase 200 carabineros concluem curso de formação em direitos humanos na faculdade de direito da usp", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 209220, "titulo": "Índia: Líderes do “movimento das baratas” são soltos, mas prisões continuam", "url": "https://www.cnnbrasil.com.br/internacional/india-lideres-do-movimento-das-baratas-sao-soltos-mas-prisoes-continuam/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tribunal ordenou a libertação dos líderes do grupo conhecido como 'movimento das baratas', que tem grande apoio entre a geração Z, sob a condição de manter a ordem pública. No entanto, prisões continuam.", "titulo_pt": "Índia: líderes do 'movimento das baratas' são soltos, mas prisões continuam", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 209547, "titulo": "At least 139 migrants dead after boat capsizes off Djibouti, UN says", "url": "https://www.euronews.com/2026/10/11/at-least-139-migrants-dead-after-boat-capsizes-off-djibouti-un-says", "fonte_id": "euronews", "data_pub": "2026-10-11T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 139 migrantes morreram após uma embarcação afundar perto de Djibouti, conforme informou a OIM. Anualmente, milhares de migrantes viajam pela África Oriental através de Djibouti em direção ao Estreito de Bab el-Mandeb, com o objetivo de chegar a países do Golfo.", "titulo_pt": "Pelo menos 139 migrantes morrem após embarcação afundar perto de Djibouti", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 209347, "titulo": "A 100 años de la Convención sobre la Esclavitud: nuevas regulaciones, viejas omisiones", "url": "https://www.ciperchile.cl/2026/10/11/a-100-anos-de-la-convencion-sobre-la-esclavitud-nuevas-regulaciones-viejas-omisiones/?utm_source=rss&utm_medium=rss&utm_campaign=a-100-anos-de-la-convencion-sobre-la-esclavitud-nuevas-regulaciones-viejas-omisiones", "fonte_id": "ciper_chile", "data_pub": "2026-10-11T12:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A 100 anos da Convenção sobre a Escravidão: novas regulamentações, velhas omissões. O texto discute o centenário da Convenção internacional contra a escravidão, apontando para novas regulamentações e omissões persistentes.", "titulo_pt": "A 100 anos da convenção sobre a escravidão: novas regulamentações, velhas omissões", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 209596, "titulo": "Palestinian child killed by Israeli gunfire in northern Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/palestinian-child-killed-israeli-gunfire-northern-gaza", "fonte_id": "middle_east_eye", "data_pub": "2026-10-11T11:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um menino palestino de sete anos morreu após ser baleado por forças israelenses em um acampamento de refugiados em Jabalia, no norte da Faixa de Gaza, no sábado. Até à data, 74.377 palestinos morreram e 175.398 foram feridos em Gaza desde 7 de outubro de 2023 devido a uma suposta 'genocídio' israelense.", "titulo_pt": "Menino palestino de sete anos morto por tiros israelenses em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 208867, "titulo": "109 migrants dead, 116 missing after boat capsizes off Djibouti, UN says", "url": "https://www.lemonde.fr/en/international/article/2026/10/11/109-migrants-dead-116-missing-after-boat-capsizes-off-djibouti-un-says_6758475_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-11T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um barco transportando 350 pessoas de Djibouti para o Iêmen capotou durante a noite de 8 para 9 de outubro, de acordo com uma agência da ONU. Mais de 80 pessoas sobreviveram ao naufrágio, todas etíopes. 109 pessoas morreram e 116 estão desaparecidas.", "titulo_pt": "109 Imigrantes mortos, 116 desaparecidos após barco capotar perto de Djibouti, diz ONU", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 208788, "titulo": "Former Irish Olympic swimming coach and child abuser George Gibney to be sentenced", "url": "https://www.theguardian.com/world/2026/oct/11/george-gibney-former-irish-olympic-swimming-coach-to-be-sentenced", "fonte_id": "guardian_world", "data_pub": "2026-10-11T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "George Gibney, de 77 anos, será julgado por abusar de quatro jovens atletas nos anos 1970 e 1980. Gibney, ex-treinador olímpico de natação da Irlanda que abusou de crianças há mais de meio século, fugiu para os Estados Unidos e só agora enfrentará justiça.", "titulo_pt": "Antigo treinador olímpico de natação irlandês e abusador George Gibney para ser julgado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 209001, "titulo": "Rights groups call for release of 3 detained activists in Hong Kong, Thailand", "url": "https://en.yna.co.kr/view/AEN20261011002000315", "fonte_id": "yonhap_news", "data_pub": "2026-10-11T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois grupos de direitos humanos pediram o libertamento de três ativistas detidos em Hong Kong e Tailândia. A solicitação foi feita em Seul, Coreia do Sul, no dia 11 de outubro.", "titulo_pt": "Grupos de direitos humanos pedem liberdade para três ativistas em Hong Kong e tailândia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 208994, "titulo": "More support needed for ethnic minority children with special needs, charity says", "url": "https://www.scmp.com/news/hong-kong/education/article/3370458/more-support-needed-ethnic-minority-children-special-needs-charity-says?utm_source=rss_feed", "fonte_id": "scmp", "da const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

        }).join("")}

       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;

           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);

  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
