o de empresas de tecnologia, participou de uma conferência em São Francisco onde expressou preocupação com os avanços da IA.", "titulo_pt": "Mundo tem razão em temer avanços da IA, diz Sam Altman", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 167360, "titulo": "Pulley, a Carta rival, is shutting down", "url": "https://techcrunch.com/2026/09/16/pulley-a-carta-rival-is-shutting-down/", "fonte_id": "techcrunch", "data_pub": "2026-09-16T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma de gerenciamento de cap table Pulley, apoiada por investidores como General Catalyst, Stripe e Founders Fund, anunciou que encerrará suas operações em dezembro.", "titulo_pt": "Pulley, a concorrente da Carta, está encerrando operações", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 167346, "titulo": "Nonprofit that tracks meteors taken down by \"critical blow\" from a cyberattack", "url": "https://arstechnica.com/security/2026/09/nonprofit-that-tracks-meteors-taken-down-by-critical-blow-from-a-cyberattack/", "fonte_id": "ars_technica", "data_pub": "2026-09-16T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo que monitora meteoros foi afetado por um ataque cibernético 'crítico' e planeja estar fora de funcionamento por several weeks (várias semanas).", "titulo_pt": "Organização que rastreia meteoros afetada por 'golpe crítico' de ataque cibernético", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 167361, "titulo": "Anthropic and OpenAI want to embed safety evaluators. Will they really be independent?", "url": "https://techcrunch.com/2026/09/16/anthropic-and-openai-want-to-embed-safety-evaluators-will-they-really-be-independent/", "fonte_id": "techcrunch", "data_pub": "2026-09-16T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic e OpenAI pretendem incorporar avaliadores de segurança independentes em suas instâncias de IA. Embora os pesquisadores sejam favoráveis ao acesso inédito, eles alertam que uma supervisão significativa requer transparência, independência e, eventualmente, regulação.", "titulo_pt": "Anthropic e OpenAI querem incorporar avaliadores de segurança independentes. Serão eles realmente independentes?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 167369, "titulo": "Washington Won’t Be Regulating AI Anytime Soon", "url": "https://www.wired.com/story/washington-wont-be-regulating-ai-anytime-soon/", "fonte_id": "wired", "data_pub": "2026-09-16T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A regulamentação da inteligência artificial nos Estados Unidos não está prevista no curto prazo, mesmo com crescentes preocupações sobre modelos de IA se comportando de maneira imprevista. O governo federal, incluindo a Casa Branca, se opõe à supervisão da IA.", "titulo_pt": "Washington não regulamentará a IA pelo menos por enquanto", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 167409, "titulo": "U.S. trade commission institutes probe into Samsung, Apple, Google following patent infringement claims", "url": "https://en.yna.co.kr/view/AEN20260917000700315", "fonte_id": "yonhap_news", "data_pub": "2026-09-16T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Federal de Comércio dos Estados Unidos anunciou na sexta-feira uma investigação sobre alegações de violação de patentes envolvendo Samsung, Apple e Google.", "titulo_pt": "Agência de comércio dos EUA inicia investigação após alegações de violação de patentes por Samsung, Apple e Google", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 167356, "titulo": "The AI data center e-waste problem is huge — and getting bigger", "url": "https://www.theverge.com/ai-artificial-intelligence/996470/ai-data-center-e-waste-ban", "fonte_id": "the_verge", "data_pub": "2026-09-16T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório alerta que o resíduo eletrônico gerado pela onda de inteligência artificial (IA) foi subestimado e que, até 2050, poderia chegar a ser suficiente para preencher 23 milhões de contêineres marítimos, o equivalente a 40 pés de contêineres circundando o mundo seis vezes. Este é um estimado significativamente maior do que os estudos anteriores sobre o resíduo eletrônico da IA.", "titulo_pt": "O problema de resíduo eletrônico da IA é enorme — e está se tornando ainda maior", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 167380, "titulo": "[Wang Son-taek] Missing questions in the AI debate", "url": "https://www.koreaherald.com/article/10875965", "fonte_id": "korea_herald", "data_pub": "2026-09-16T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um debate notável surgiu nos Estados Unidos sobre a velocidade com que a inteligência artificial deve avançar. Dario Amodei, CEO da Anthropic, alertou que as capacidades de IA podem avançar mais rapidamente do que os humanos conseguem compreender ou controlar, sugerindo que as empresas de IA devem limitar o desenvolvimento das capacidades para que as medidas de segurança possam acompanhar.", "titulo_pt": "Questões pendentes no debate sobre IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 167381, "titulo": "[Lee Moon-won] Hair loss focus turns to prevention", "url": "https://www.koreaherald.com/article/10875964", "fonte_id": "korea_herald", "data_pub": "2026-09-16T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora observou duas mulheres em um consultório: uma com cabelos finos e outra com cabelos completos. A mulher com cabelos finos estava hesitante, enquanto a outra acabou conversando mais sobre prevenção de calvície.", "titulo_pt": "Foco na prevenção de calvície", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 167348, "titulo": "Not just Proton: Getting to know Valve's new SteamOS compatibility layers", "url": "https://arstechnica.com/gaming/2026/09/not-just-proton-getting-to-know-valves-new-steamos-compatibility-layers/", "fonte_id": "ars_technica", "data_pub": "2026-09-16T20:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Valve introduziu novas ferramentas de nível de sistema que permitem a integração de placas de processamento Arm e aplicativos Android APKs no ecossistema Steam.", "titulo_pt": "Não só Proton: conhecendo as novas camadas de compatibilidade do SteamOS da Valve", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 167362, "titulo": "After accusations of selling ‘perv glasses,’ Meta prepares to sell a pair without a camera", "url": "https://techcrunch.com/2026/09/16/after-accusations-of-selling-perv-glasses-meta-prepares-to-sell-a-pair-without-a-camera/", "fonte_id": "techcrunch", "data_pub": "2026-09-16T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta está preparando para lançar um novo produto sem câmera após acusações de vender 'lentes de espião'. A empresa tenta evitar as acusações de que seu produto seria usado para atividades pervertidas.", "titulo_pt": "Meta prepara novo produto sem câmera após acusações de vender 'lentes de espião'", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 167363, "titulo": "X will now let US users trade via Cashtags", "url": "https://techcrunch.com/2026/09/16/x-will-now-let-u-s-users-trade-via-cashtags/", "fonte_id": "techcrunch", "data_pub": "2026-09-16T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa X agora permitirá que os usuários dos EUA realizem negociações através de Cashtags, fechando o gap entre as discussões de mercado na linha do tempo e o próprio mercado.", "titulo_pt": "X permitirá negociações via Cashtags para usuários dos EUA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 167274, "titulo": "Anthropic policy chief says AI companies can't be expected to operate on 'honor code'", "url": "https://www.cnbc.com/2026/09/16/anthropic-policy-chief-says-ai-companies-cant-operate-on-honor-code.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-16T19:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sarah Heck, chefe de política pública da Anthropic, afirmou que as empresas de IA não podem ser esperadas a operar com base em um código de honra. A discussão sobre a regulamentação do desenvolvimento de modelos de IA está se intensificando.", "titulo_pt": "Chefe de política da anthropic diz que empresas de IA não podem depender de um código de honra", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 167223, "titulo": "The Most Powerful Man in AI Isn’t Worried at All", "url": "https://www.theatlantic.com/technology/2026/09/jensen-huang-ai-anti-doomer/688654/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-16T19:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang não é pessimista sobre o desenvolvimento da inteligência artificial. Ele é considerado uma figura poderosa nesse campo.", "titulo_pt": "O homem mais poderoso em IA não está preocupado", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 166861, "titulo": "Cofundador do DeepMind alerta que IA não pode avançar sem segurança", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/cofundador-do-deepmind-alerta-que-ia-nao-pode-avancar-sem-seguranca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cofundador do Google DeepMind, Shane Legg, advertiu que o progresso da IA não deve ser priorizado acima da segurança. Isso ocorre enquanto há crescente pressão para retardar o desenvolvimento de modelos avançados de IA.", "titulo_pt": "Cofundador do DeepMind avisa que avanço da IA não pode ignorar a segurança", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 167382, "titulo": "New method reveals how virus particles can build themselves, molecule by molecule", "url": "https://phys.org/news/2026-09-method-reveals-virus-particles-molecule.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da Universidade de Oxford capturaram o processo passo a passo da montagem de partículas vírus semelhantes, revelando como interações moleculares simples podem construir estruturas biológicas complexas de maneira confiável. Os resultados foram publicados na Nature em 16 de setembro.", "titulo_pt": "Novo método revela como partículas vírus se construem, molécula por molécula", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 167383, "titulo": "AI struggles to decipher 'animal language' because sound doesn't equal meaning, experts say", "url": "https://phys.org/news/2026-09-ai-struggles-decipher-animal-language.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de Tel Aviv University descobriram que os modelos de inteligência artificial têm dificuldades para decifrar a comunicação animal porque se concentram nas propriedades físicas dos sons, sem compreender o significado atribuído a esses sons pelos animais.", "titulo_pt": "IA enfrenta dificuldades para decifrar 'línguas animais' devido à falta de compreensão do significado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 167384, "titulo": "Time of day may be key in speech therapy for youth", "url": "https://phys.org/news/2026-09-day-key-speech-therapy-youth.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A dificuldade de fala em pessoas com apraxia de fala da infância (CAS) pode persistir além da infância. Diferentemente de muitas outras disfunções de fala infantis que melhoram com o tempo, as pessoas com CAS podem continuar a ter erros de fala na adolescência e na juventude e geralmente necessitam de terapia intensiva e individualizada.", "titulo_pt": "Hora do dia pode ser crucial para terapia de fala para jovens", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 167385, "titulo": "Iron, sulfur and purple light unlock greener carbon-carbon bond formation", "url": "https://phys.org/news/2026-09-iron-sulfur-purple-greener-carbon.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Julian West, do Rice University, desenvolveu uma nova técnica para catalisar reações de carbono-carbono, mais econômica, rápida e ecológica. Este avanço foi publicado na revista Nature Catalysis.", "titulo_pt": "Ferro, sulfeto e luz violeta desbloqueiam formações de ligação carbono-carbono mais verdes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 166994, "titulo": "Creatina pode ter efeito contra a privação do sono e até a depressão; entenda", "url": "https://www.cnnbrasil.com.br/curiosidades/creatina-pode-ter-efeito-contra-a-privacao-do-sono-e-ate-a-depressao-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O suplemento creatina pode ter efeitos positivos na recuperação do sono e na prevenção da depressão. Além de seus benefícios conhecidos para a recuperação muscular, estudos sugerem que a creatina pode desempenhar um papel na melhoria da qualidade do sono e na saúde mental.", "titulo_pt": "Creatina pode ter efeito contra a privação do sono e até a depressão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 167386, "titulo": "Bacterial invasion proteins could improve detection of live crop pathogens", "url": "https://phys.org/news/2026-09-bacterial-invasion-proteins-crop-pathogens.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Penn State desenvolveram um novo método para detecção de Pseudomonas syringae, uma bactéria comum que infecta diversos cultivos, vegetais e plantas ornamentais arbustivas. Esta técnica promete ser uma ferramenta valiosa para cientistas, médicos, empresas de sementes e outros no diagnóstico de patógenos bacterianos em plantações.", "titulo_pt": "Proteínas invasoras bacterianas podem melhorar a detecção de patógenos vivos em cultivos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 167387, "titulo": "AI can be more comforting than a person—our research shows why", "url": "https://phys.org/news/2026-09-ai-comforting-person.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa demonstra que, em alguns casos, o uso de inteligência artificial gerativa (gen AI) pode ser mais confortável do que conversar com uma pessoa. Isso ocorre quando usamos chatbots para discutir sentimentos difíceis, como uma má jornada ou ansiedade antes de uma apresentação.", "titulo_pt": "IA pode ser mais confortável do que uma pessoa—nossa pesquisa explica por quê", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 167388, "titulo": "Ultrathin membranes unlock nano-infrared views of biomolecules in water", "url": "https://phys.org/news/2026-09-ultrathin-membranes-nano-infrared-views.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova técnica combinando nanospectroscopia infravermelha (s-SNOM) com membranas ultradelgadas de silício permite a análise de amostras biológicas muito pequenas, incluindo moléculas biomoleculares individuais, sob condições próximas às fisiológicas, utilizando a raia de raios infravermelhos BESSY II.", "titulo_pt": "Membranas ultradelgadas liberam visões nano-infravermelhas de biomoléculas em água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 167413, "titulo": "Passion Meets Precision at NASA’s Flight Research Lab", "url": "https://www.nasa.gov/people-of-nasa/armstrong-people/passion-meets-precision-at-nasas-flight-research-lab/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Derek Abramson, Justin Hall e Justin Link, que antes construíam aeronaves radiocontroladas em seus garagens e casas, agora trabalham no Laboratório de Pesquisa Aérea Subescala de Dale Reed da NASA, que está envolvida em futuros avanços aeronáuticos. Seu entusiasmo inicial por aeronaves radiocontroladas alimenta seu trabalho atual na NASA.", "titulo_pt": "Paixão me encontra precisão no laboratório de pesquisa aérea da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 167406, "titulo": "STAT+: GOP aims to change Medicare adviser’s math so it’s more favorable to health insurers", "url": "https://www.statnews.com/2026/09/16/medicare-advantage-overpayments-analysis-medpac-change-apples-to-apples-act/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto do GOP instrui o MedPAC a estudar sobre sobrecustos para planos Medicare Advantage de uma maneira mais favorável às seguradoras de saúde.", "titulo_pt": "GOP quer mudar a análise do medpac sobre sobrecustos de planos Medicare advantage para beneficiar as seguradoras", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 167407, "titulo": "STAT+: Senators highlight the power Chris Klomp wields at confirmation hearings", "url": "https://www.statnews.com/2026/09/16/senators-highlight-chris-klomp-power-rfk-jr-second-in-command/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T19:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chris Klomp já desempenhou um papel significativo no governo Trump e na agenda Make America Healthy Again. Ele exerce influência considerável durante as sessões de confirmação.", "titulo_pt": "Senadores destacam o poder que Chris Klomp exerce em audiências de confirmação", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 166851, "titulo": "SpaceX se prepara para primeiro voo orbital do megafoguete Starship", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/spacex-se-prepara-para-primeiro-voo-orbital-do-megafoguete-starship.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-16T18:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX, empresa aeroespacial de Elon Musk, anunciou que pretende colocar em órbita seu megafoguete Starship nos próximos dias, uma etapa crucial no desenvolvimento deste veículo concebido para viagens à Lua e Marte.", "titulo_pt": "Spacex se prepara para primeiro voo orbital do megafoguete Starship", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 167414, "titulo": "NASA’s Moon Orbiter Spots New, ‘Once-in-Century’ Moon Crater", "url": "https://science.nasa.gov/solar-system/moon/nasas-moon-orbiter-spots-new-once-in-century-moon-crater/", "fonte_id": "nasa_news", "data_pub": "2026-09-16T18:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cientista da NASA, Robert Wagner, estava realizando uma verificação de qualidade de dados quando notou uma cratera lunar nova e incomum, sugerindo que o material lunar na área foi movimentado. O evento é considerado raro e quase uma vez por século.", "titulo_pt": "Nave da nasa descobre nova e 'rara uma vez no século' cratera na lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 167016, "titulo": "Cientistas identificam nascimento de sistema solar pela 1ª vez; Como isso pode criar novos planetas?", "url": "https://exame.com/ciencia/cientistas-identificam-nascimento-de-sistema-solar-pela-1a-vez-como-isso-pode-criar-novos-planetas/", "fonte_id": "exame", "data_pub": "2026-09-16T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos identificaram sinais de processos que podem explicar a formação de planetas rochosos, como a Terra, usando dados dos telescópios ALMA e James Webb.", "titulo_pt": "Cientistas identificam formação do sistema solar pela 1ª vez", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 167019, "titulo": "Japão passa da marca de 100 mil pessoas com mais de 100 anos: o que explica a longevidade recorde?", "url": "https://exame.com/ciencia/japao-passa-da-marca-de-100-mil-pessoas-com-mais-de-100-anos-o-que-explica-a-longevidade-recorde/", "fonte_id": "exame", "data_pub": "2026-09-16T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão ultrapassou a marca de 100 mil pessoas com mais de 100 anos. A longevidade japonesa é resultado da combinação de hábitos alimentares saudáveis, atividade física e avanços médicos, mas ocorre em um contexto de transformação populacional.", "titulo_pt": "Japão atinge marca de 100 mil pessoas com mais de 100 anos: o que explica a longevidade recorde?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 165758, "titulo": "O diamante raro que pode contar a história das profundezas da Terra", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/ciencia-fundamental/2026/09/o-diamante-raro-que-pode-contar-a-historia-das-profundezas-da-terra.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-16T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A superfície da Terra é amplamente explorada, mas seu interior permanece um desafio científico. No entanto, os diamantes podem fornecer acesso direto a essas regiões profundas, permitindo o estudo das profundezas do globo terrestre.", "titulo_pt": "O diamante raro que pode con : "Brasil", "classe": "B"}, {"id": 165937, "titulo": "Professores de escolas particulares de BH entram em greve", "url": "https://www.metropoles.com/minas-gerais/professores-de-escolas-particulares-de-bh-entram-em-greve", "fonte_id": "metropoles", "data_pub": "2026-09-16T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Professores de escolas particulares em Belo Horizonte entram em greve por conta do impasse nas negociações e da rejeição à divisão da convenção coletiva entre os níveis de ensino.", "titulo_pt": "Professores de escolas particulares de BH entram em greve", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 165938, "titulo": "Dupla de ladrões toma bolsas de mulheres na saída de academia em Taguatinga", "url": "https://www.metropoles.com/distrito-federal/dupla-de-ladroes-toma-bolsas-de-mulheres-na-saida-de-academia-em-taguatinga", "fonte_id": "metropoles", "data_pub": "2026-09-16T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um duplo roubo ocorreu na noite de segunda-feira, na QSB 2, em Taguatinga. Após o crime, os ladrões trocaram de roupa para evitar serem identificados pela PM, mas sem sucesso.", "titulo_pt": "Dupla de ladrões roubam bolsas de mulheres na saída de academia em Taguatinga", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 165892, "titulo": "“Perdi o direito de ficar doente”, desabafa esposa de Lito Sousa", "url": "https://www.cnnbrasil.com.br/pop/celebridades/perdi-o-direito-de-ficar-doente-desabafa-esposa-de-lito-sousa/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lito Sousa, um influenciador, foi diagnosticado com uma doença rara e sem cura há algumas semanas. Sua esposa expressou sua situação desafiadora.", "titulo_pt": "Perdi o direito de ficar doente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 166986, "titulo": "Acúmulo de umidade no frio? Mofo pode causar alergias e impulsionar problemas respiratórios", "url": "https://www.cnnbrasil.com.br/saude/acumulo-de-umidade-no-frio-mofo-pode-causar-alergias-e-impulsionar-problemas-respiratorios/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A umidade acumulada em ambientes frios pode causar o desenvolvimento de mofo, que pode levar a alergias e problemas respiratórios. Especialistas alertam sobre os riscos dos fungos presentes em paredes e roupas molhadas para o sistema respiratório.", "titulo_pt": "Mofo na umidade fria pode causar alergias e problemas respiratórios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 166960, "titulo": "Bombeiros combatem incêndio florestal há 4 dias no Pico da Formosa, em MG", "url": "https://www.metropoles.com/minas-gerais/bombeiros-combatem-incendio-florestal-ha-4-dias-no-pico-da-formosa-em-mg", "fonte_id": "metropoles", "data_pub": "2026-09-16T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os bombeiros estão combatendo um incêndio florestal há quatro dias na área de preservação da Serra do Espinhaço, próxima ao Pico da Formosa. O local é de difícil acesso, o que complica as operações de combate às chamas.", "titulo_pt": "Bombeiros combatem incêndio florestal há 4 dias no Pico da Formosa, em MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 166897, "titulo": "Desabamento de mina de ouro no Sudão deixa mais de 80 mortos", "url": "https://veja.abril.com.br/mundo/desabamento-de-mina-de-ouro-no-sudao-deixa-mais-de-80-mortos/", "fonte_id": "veja", "data_pub": "2026-09-16T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um desabamento em uma mina de ouro no Sudão resultou em mais de 80 mortes. Poços da mina de Al-Zaraa começaram a ruir na terça-feira e há um número indeterminado de pessoas ainda presas sob os escombros.", "titulo_pt": "Desabamento de mina de ouro no Sudão deixa mais de 80 mortos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 167042, "titulo": "França registra quase 8 mil mortes adicionais em verão de temperatura recorde", "url": "https://www.cartacapital.com.br/clima/franca-registra-quase-8-mil-mortes-adicionais-em-verao-de-temperatura-recorde/", "fonte_id": "cartacapital", "data_pub": "2026-09-16T18:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O verão de 2026 foi o mais quente da França desde 1900, de acordo com autoridades climáticas. O balanço de mortes atribuídas ao calor ainda pode aumentar.", "titulo_pt": "França registra quase 8 mil mortes adicionais em verão de temperatura recorde", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 165773, "titulo": "Google faz maior acordo para remoção de carbono com projeto no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/google-faz-maior-acordo-para-remocao-de-carbono-com-projeto-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google fechou a maior compra de remoção de carbono da sua história, em parceria com a Terradot, uma empresa que opera no Brasil e nos Estados Unidos. O projeto inicial será realizado no Rio Grande do Sul e pode se expandir para outras regiões do país no futuro.", "titulo_pt": "Google faz maior acordo para remoção de carbono com projeto no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 166352, "titulo": "Huge wildfire in Valencia region burns 690 hectares after Spain’s hottest summer", "url": "https://www.euronews.com/video/2026/09/16/huge-wildfire-in-valencia-region-burns-690-hectares-after-spains-hottest-summer", "fonte_id": "euronews", "data_pub": "2026-09-16T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "F ": "cnn_brasil", "data_pub": "2026-09-16T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "De acordo com a consultoria Volt Robotics, os cortes na geração de energia solar e eólica superaram 60% nos últimos cinco meses. A geração renovável não utilizada neste período é 18,3% maior do que no mesmo período de 2025, o que poderia suprir todas as residências de São Paulo, Rio de Janeiro e Fortaleza.", "titulo_pt": "Cortes na geração de energia solar e eólica superam 60% em 1 a cada 5 dias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164979, "titulo": "Prédio desaba, deixa 16 mortos e mais de 100 desaparecidos em Gaza", "url": "https://www.metropoles.com/mundo/predio-desaba-deixa-oito-mortos-e-mais-de-60-desaparecidos-em-gaza", "fonte_id": "metropoles", "data_pub": "2026-09-16T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um prédio desabou em Gaza, deixando 16 mortos e mais de 100 desaparecidos. O prédio tinha sido danificado anteriormente por um ataque israelense.", "titulo_pt": "Prédio desaba, deixa 16 mortos e mais de 100 desaparecidos em Gaza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 165590, "titulo": "Green transition requires more than renewable power, Jeju gov. says", "url": "https://www.koreaherald.com/article/10875707", "fonte_id": "korea_herald", "data_pub": "2026-09-16T05:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador de Jeju, Wi Seong-gon, afirmou que a ilha deve avançar além do aumento da capacidade de energia renovável, construindo infraestrutura e indústrias para aproveitar sua energia limpa. Jeju planeja atingir emissões líquidas zero em 2035, 15 anos antes do prazo nacional.", "titulo_pt": "Transição verde exige mais do que energia renovável, diz governo de Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 164863, "titulo": "Governo define regra para abolir licença ambiental em pesquisa de minerais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/governo-define-regra-para-abolir-licenca-ambiental-em-pesquisa-de-minerais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está prestes a criar uma regra nacional que permitirá a realização de atividades de pesquisa de mineração sem a necessidade de licença ambiental. A intenção é acelerar a busca por minerais críticos como terras raras, níquel, nióbio, potássio e fosfato, usados na produção de fertilizantes.", "titulo_pt": "Governo define regra para abolir licença ambiental em pesquisa de minerais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165397, "titulo": "In Venezuela, South America's largest lake is dying from oil pollution", "url": "https://www.lemonde.fr/en/environment/article/2026/09/16/in-venezuela-south-america-s-largest-lake-is-dying-from-oil-pollution_6757570_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T00:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade da água do maior lago da América do Sul, o Lago Maracaibo, tem piorado drasticamente, ameaçando a subsistência de 20.000 pescadores da região.", "titulo_pt": "No veneza, maior lago da américa do sul está em risco devido à poluição de óleo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 167338, "titulo": "Why women in China are still at risk of abduction and forced marriage", "url": "https://www.scmp.com/opinion/china-opinion/article/3367606/why-women-china-are-still-risk-abduction-and-forced-marriage?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-16T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma noite chuvosa recente, um motorista chamado He presenciou a abd 6/gaza-building-collapse-kills-21-including-11-children-as-perilous-conditions-persist-for-p", "fonte_id": "euronews", "data_pub": "2026-09-16T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um edifício residencial desabou em Gaza após danos causados por ataques israelenses anteriores, resultando em pelo menos 21 mortos, incluindo 11 crianças, e várias pessoas desaparecidas.", "titulo_pt": "Gaza: edifício desaba e mata 21, incluindo 11 crianças, em condições perigosas persistentes", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 166425, "titulo": "Mahsa Amini death four years on: Iranians reflect on ‘Woman, Life, Freedom’", "url": "https://www.aljazeera.com/news/2026/9/16/four-years-on-iranians-reflect-on-impact-of-woman-life?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International afirma que autoridades iranianas cometiram crimes contra a humanidade durante as protestos de 2022-2023. Iranianos refletem sobre o caso de Mahsa Amini, que ocorreu há quatro anos.", "titulo_pt": "Quatro anos após a morte de mahsa Amini: iranianos refletem sobre 'mulher, vida, liberdade'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 166309, "titulo": "French PM remains vague on funding to fight gender-based and sexual violence", "url": "https://www.lemonde.fr/en/france/article/2026/09/16/french-pm-remains-vague-on-funding-to-fight-gender-based-and-sexual-violence_6757592_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T13:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro francês, Sébastien Lecornu, mencionou pela primeira vez um 'plano plurianual' de recursos para combater a violência de gênero e sexual em uma coluna de opinião no Le Monde, mas não especificou quais fundos adicionais poderiam ser alocados.", "titulo_pt": "PM francês mantém-se vago sobre financiamento para combater violência de gênero e sexual", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 167326, "titulo": "Turkey Stages Wide-Ranging LGBT Crackdown for ‘Family Safety’", "url": "https://balkaninsight.com/2026/09/16/turkey-stages-wide-ranging-lgbt-crackdown-for-family-safety/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-16T13:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Turquia realizou uma ampla repressão contra grupos LGBTQ+ sob o pretexto de 'segurança familiar', além de impor prisões e restrições à internet, afetando também jornalistas independentes e organizações de direitos humanos que relatavam sobre a operação policial.", "titulo_pt": "Turquia executa extensa repressão lgbtq+ em nome de 'segurança familiar'", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 166353, "titulo": "Four years after Mahsa Amini's death, rights groups warn Tehran's crackdown persists", "url": "https://www.euronews.com/2026/09/16/four-years-after-mahsa-aminis-death-rights-groups-warn-crackdown-persists", "fonte_id": "euronews", "data_pub": "2026-09-16T12:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações de direitos humanos alertam que aqueles que ordenaram a repressão violenta dos protestos de 2022 ainda controlam o aparelho de segurança da Irã. Além disso, negócios kurdos fecharam em regiões natalinas dos protestos e o Relator Especial da ONU afirma que quatro anos de violência estatal não conseguiram apagar a resistência.", "titulo_pt": "Quatro anos após a morte de Mahsa Amini, grupos de direitos humanos alertam sobre a persistência da repressão em teerã", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 166457, "titulo": "Amnesty calls for arrest of 87 Iran officials over 'crimes against humanity' during protests", "url": "https://www.middleeasteye.net/news/amnesty-calls-87-iranian-officials-face-arrest-over-repression-woman-life-freedom-protests", "fonte_id": "middle_east_eye", "data_pub": "2026-09-16T12:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amnesty International pediu a prisão de 87 oficiais iranianos por 'crimes contra a humanidade' em relação à repressão durante as protestos de 2022. O relatório destaca que a guerra entre EUA e Israel está a agravar a repressão no Irão, quatro anos após os protestos Woman Life Freedom.", "titulo_pt": "Amnesty internacional pede prisão de 87 oficiais iranianos por 'crimes contra a humanidade'", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 166304, "titulo": "Hashim Thaçi, former Kosovo president, sentenced to 25 years for war crimes", "url": "https://www.lemonde.fr/en/international/article/2026/09/16/kosovo-former-president-thaci-given-25-year-sentence-for-war-crimes_6757586_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T10:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hashim Thaçi, ex-presidente de Kosovo, foi condenado a 25 anos de prisão por crimes de guerra em uma corte na Haya.", "titulo_pt": "Hashim Thaçi, ex-presidente do Kosovo, condenado a 25 anos por crimes de guerra", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 165435, "titulo": "Human rights lawyer Noura Erakat arrested at hearing against Israel Bonds", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/16/human-rights-lawyer-noura-erakat-arrested-at-hearing-against-israel-bonds?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A advogada dos direitos humanos palestina Noura Erakat foi detida em Flórida após fazer uma intervenção contra o investimento em Israel Bonds.", "titulo_pt": "Advogada dos direitos humanos Noura Erakat presa após se pronunciar contra investimento em Israel Bonds", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 164969, "titulo": "B const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;

  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
