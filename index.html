<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "25/08/2026 15:25", "stats": {"noticias_novas": 962, "resumos_gerados": 255}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva (PT) tem mantido uma agenda intensa, com reuniões e convocações para debates sobre diversos temas. Um dos principais eventos é a convocação de uma reunião marcada para quinta-feira (27), com o objetivo de votar o Projeto de Lei dos minerais críticos no Senado. As montadoras também estão pressionando para incluir novos modelos de carros no programa Move Brasil, que oferece condições especiais de financiamento para motoristas de aplicativos e taxistas. Além disso, o MPE pediu impugnação da candidatura de Moisés Selerges, apoiador de Lula, por supostamente não ter deixado a direção de um sindicato dentro do prazo legal. O governador Tarcísio de Freitas defendeu as investigações da Polícia Civil de São Paulo sobre a produtora do filme 'Dark Horse', que retrata a trajetória de Jair Bolsonaro, e confirmou o envio de provas ao Ministério Público Federal.", "mundo": "O diretor da CIA realizou uma visita inesperada a Moscou enquanto forças ucranianas intensificavam ataques no interior da Rússia, incluindo em sua capital. Em outro desenvolvimento, o ICE já começou a detenção e deportação de migrantes que perderam o TPS em agosto de 2026, em meio a um endurecimento da política migratória. Organizações alertam sobre os riscos de extorsão e violência em países como Haiti. A Coreia do Norte manteve conversações de reconciliação com Fatah e o bloco de Dahlan em Alamein, enquanto o Canadá anunciou retaliações de US$ 20 bilhões em tarifas contra os EUA, reafirmando que não vai ceder. A China rejeitou a ameaça de sanções dos EUA contra suas exportações para o Irã, afirmando que qualquer medida seria ilegal e que o país tomará 'todas as medidas necessárias' para proteger seus interesses nacionais. O Canadá também anunciou tarifas de até 50% sobre produtos americanos em retaliação às medidas tarifárias do governo Trump, enquanto o Brasil multou a TikTok em 30 milhões de dólares por gestão de dados de crianças.\n\nOs Estados Unidos intensificaram as sanções econômicas contra o Irã, o que levou a uma série de respostas geopolíticas. O presidente iraniano, Masoud Pezeshkian, declarou que o país não abandonará a Síria e que não permitirá que Israel traque 'linhas vermelhas'. O Irã e o Omã estão se aproximando de um acordo sobre o Estreito de Ormuz, com propostas temporárias para gerenciamento do tráfego marítimo. Por outro lado, os Estados Unidos afirmaram que todas as minas no Estreito de Ormuz foram removidas e ameaçaram destruir qualquer navio que coloque novas minas. O Irã também enfrenta pressão econômica, com a moeda iraniana, o rial, continuando a desvalorizar. No contexto regional, Israel realizou ataques aéreos em áreas do Líbano e realizou artilharia contínua, causando incêndios e danos. Além disso, a questão palestina continua em foco, com a China e a Jordânia reforçando a defesa da criação de um Estado palestino independente. A situação no Oriente Médio permanece volátil, com tensões persistindo entre as potências globais e os países locais.", "economia": "A economia brasileira registrou um recorde nas vendas do varejo e do setor de alimentos e bebidas em julho, refletindo uma recuperação econômica. Em contrapartida, a cidade de Minaçu, Goiás, que prosperou com a mineração de amianto, enfrenta declínio após a proibição do material. O Brasil gastou R$ 1,16 trilhão com juros da dívida pública nos últimos 12 meses, conforme dados do Banco Central. O Canadá anunciou tarifas retaliatórias de 20 bilhões de dólares sobre bens dos Estados Unidos, aumentando a escalada na guerra comercial entre os dois países. Em julho, o Brasil arrecadou R$ 289,3 bilhões, um aumento de 8,8% em relação ao mesmo período do ano anterior. A recuperação extrajudicial da Braskem pode afetar fundos, COEs e debêntures de investidores que tenham exposição direta ou indireta à dívida da empresa. O governo sul-coreano busca aprovar um orçamento expansivo de 2027 com um total de gastos esperado ultrapassando 800 trilhões de wons, buscando combater a baixa taxa de crescimento. Além disso, o julgamento do STF sobre fretamento em circuito fechado pode limitar as opções de transporte para a população de Minas Gerais, diferentemente do transporte por aplicativo, que não se aplica ao fretamento em regime aberto.", "tecnologia": "A tecnologia está em constante evolução, com várias notícias importantes em destaque. A empresa Hermes planeja dobrar suas receitas através do uso de módulos térmicos, conforme indicado pelo TIER, que mostra um aumento na confiança na indústria. A Anthropic está implementando uma memória compartilhada entre o Claude e o Cowork, permitindo que os usuários não precisem mais repetir informações durante as conversas. A inteligência artificial (IA) está sendo usada de maneira cada vez mais avançada, como no caso do ChatGPT, que enfrenta restrições em território russo devido a uma campanha de desinformação. A China solicitou relatos públicos de supostas irregularidades de corrupção em compras do Exército de Foguetes da Força de Libertação Popular (PLARF), em meio a uma campanha antidesonestidade. Além disso, a OpenAI anunciou que seu novo chip de IA, Jalapeño, realiza tarefas de forma mais eficiente e retorna respostas mais rapidamente do que outros sistemas de IA, de acordo com uma postagem no blog. A Apple lançou uma nova versão do chip M6 para Macs e o M5 Ultra, que a empresa afirma ser o 'mais poderoso chip' da empresa, destinado a tarefas como renderização 3D e execução de modelos de IA avançados.", "ciencia": "Um estudo conduzido por um pesquisador da Universidade do Havaí, publicado na revista Physical Review Letters, descobriu que a poeira lunar pode ser interpretada como um registro de explosões estelares, conhecidas como supernovas. Em outro desenvolvimento, um tornado de intensidade rara devastou um vilarejo no sul da França, causando destruição em larga escala e deixando os residentes em choque. O prefeito comparou o estado das casas após o tornado ao de uma situação de guerra. Além disso, um novo cometa não identificado foi encontrado em dados arquivados públicos do Telescópio Subaru, resultando em descobertas científicas significativas. O telescópio espacial Nancy Grace Roman, liderado pela NASA, está programado para ser lançado no dia 30 de agosto de 2026, contribuindo para o entendimento da natureza da energia escura e da matéria escura, além de descobrir novos exoplanetas.", "cultura": "A Bienal de Gwangju, na Coreia do Sul, retomou o uso do nome 'Taiwan' em suas atividades, mantendo o nome original usado anteriormente. Em outro desenvolvimento cultural, a atriz Hannah Einbinder apoiou Mark Ruffalo após ele ser acusado de antissemitismo pela Paramount Skydance. Na indústria musical, músicas criadas por inteligência artificial (IA) foram banidas das paradas de sucesso na Austrália, com novas diretrizes visando proteger a natureza humana da criação artística. O festival Open Air Brasil chega a São Paulo em outubro com um telão de 325m² para cinema ao ar livre, enquanto a atriz Drica Moraes se destaca no espetáculo 'Inter Alia', levando a plateia a participar ativamente do julgamento psicológico sem um resultado definitivo. No âmbito da literatura, o livro 'O Tsar na Pessoa Própria: Como Vladimir Putin Nos Enganou', baseado em mais de duas décadas de reportagem investigativa, acaba de ganhar um novo prêmio literário francês. Além disso, o artigo 'Os Judeus que Votaram por Hitler' explora o caso de uma minoria judaica que apoiou um político que os desprezava.", "sociedade": "Um advogado argentino, José Eduardo Figueroa, foi condenado à pena máxima pelo assassinato de sua esposa, Mercedes Kvedaras, em El Tipal, próximo a Salta. Posteriormente, Figueroa foi encontrado morto em sua cela. Em Santiago del Estero, um coletor de lixo morreu após ser esmagado por um caminhão de lixo, levando a investigações da justiça. Em Franca, interior de São Paulo, uma influenciadora esfaqueou um suspeito de abusar da filha de 5 anos. O Ministério da Educação anunciou que, em 2040, todos os colégios municipais estarão integrados aos Serviços Locais de Educação Pública, mesmo que a lei original tivesse 2025 como prazo máximo. Em Paranaguá, Paraná, um menino foi deixado em um carro de aplicativo e as investigações estão sendo realizadas para localizar os responsáveis. Sete jovens britânicos morreram em uma colisão envolvendo um carro em alta velocidade, compartilhada nas redes sociais com hashtags como #speedhunters. Em Hefei, Anhui, China, um vendedor ambulante de ovos panquecados incluiu 100 yuan em um pedido de entrega para uma família cujo filho estava passando por quimioterapia, gerando ampla aprovação. Um homem foi baleado na cabeça ao tentar proteger sua namorada de um assalto, levando a uma busca por responsáveis. No Distrito Federal, dois incêndios em prédios comerciais foram combatidos por bombeiros. A Secretaria Provincial de Educação de Gyeonggi expandiu para 300 o número de oficiais dedicados à proteção dos direitos dos professores. Os hospitais em Afghanistan estão sobrecarregados devido ao aumento da malnutrição infantil. Enfermeiras em Kenya estão em greve exigindo salários justos e melhorias nas condições de trabalho. Em Irã, o luto ainda é profundo para os pais das vítimas seis meses após um ataque a uma escola que deixou pelo menos 155 mortos, na maioria crianças. A agência de rating S&P alerta que as ondas de calor intensas na Europa podem afetar os lucros das seguradoras, devido ao aumento das reclamações relacionadas a mortes e doenças causadas por calor, especialmente entre idosos. Em Kumamoto, empresas locais oferecem gratuitamente o serviço de lavagem de roupas para evacuados. Uma adolescente de menos de 14 anos confessou ter matado sua mãe com um martelo em San Joaquín. Em Kenscoff, Port-au-Prince, Haiti, um ataque armado deixou cerca de 40 mortos. Em julho de 2026, foram emitidas 580 mil licenças médicas no país, uma diminuição de 3,4% em comparação com o mesmo mês do ano anterior. O governo planeja aumentar o orçamento para o programa de saúde mental, visando melhorar os serviços de saúde mental disponíveis. Houve um aumento usual no desemprego relacionado às escolas.", "meio_ambiente": "As temperaturas dos oceanos bateram um novo recorde devido ao aumento de calor causado pelo fenômeno El Niño, conforme informou a Metrópoles. O Copernicus alertou que as consequências do aquecimento dos oceanos já estão visíveis, podendo intensificar as chuvas e alguns sistemas de tormentas. Em outro desenvolvimento, a Europa registrou pelo menos 35.000 mortes adicionais devido ao calor, conforme divulgado pelo Taipei Times. Além disso, a temperatura média diária do mar atingiu 21,1°C, superando o recorde de março de 2024, informou a La Nación. A Coreia do Sul está prestes a sediar seu primeiro festival musical com foco na neutralidade de carbono, em Incheon, visando reduzir a emissão de gases de efeito estufa, conforme noticiou o Yonhap News. Por fim, um tornado atingiu o vilarejo francês de Pomas, causando ferimentos em pelo menos 31 pessoas e danos em residências e telhados, conforme relatou a Euronews.", "direitos_humanos": "A ONU e a Cruz Vermelha pediram a proibição de armas autônomas após relatos de que um drone russo usou inteligência artificial na Ucrânia para escolher alvos em um ataque que resultou em mortes. Em um evento separado, a Amnesty Internacional afirmou que a Índia usou armas letais contra os protestantes conhecidos como 'Cockroach', sugerindo a violação de direitos humanos. Além disso, um milhão de crianças afegãs estão sofrendo de nutrição crítica, segundo a UNICEF, devido a conflitos e crises diversas. Em outros casos, um artista chinês foi condenado a três anos de prisão por satirizar o ex-líder Mao Tsé-Tung, e um menino palestiniano ficou ferido após ser atingido por disparos de forças israelenses em Qalandia, um campo de refugiados ao norte de Jerusalém ocupada. O conflito na Ucrânia também resultou em mortes devido ao uso de armas autônomas, e a crise dos refugiados rohingya durou nove anos."}, "resumo_do_dia": {"politica_nacional": [{"id": 122879, "titulo": "Empresário do \"grupo do golpe\" doa para vereador aliado de Paes no Rio", "url": "https://www.metropoles.com/colunas/igor-gadelha/empresario-do-grupo-do-golpe-doa-para-vereador-aliado-de-paes-no-rio", "fonte_id": "metropoles", "data_pub": "2026-08-25T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um empresário que fazia parte de um grupo de WhatsApp com mensagens golpistas doou fundos para um candidato do PSD que é aliado do prefeito Eduardo Paes no Rio de Janeiro.", "titulo_pt": "Empresário do grupo do golpe doa para vereador aliado de Paes no Rio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122702, "titulo": "Montadoras pedem inclusão de novos carros no Move Brasil; veja o que pode entrar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/montadoras-pedem-inclusao-de-novos-carros-no-move-brasil-veja-o-que-pode-entrar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T17:41:00Z", " alhadores no Comércio de Bens, Serviços e Turismo (CNTC) solicitou a mediação do Ministério Público do Trabalho (MPT) no caso.", "titulo_pt": "TRT10 mantém decisão que suspendeu demissões coletivas no Grupo Casas Bahia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122826, "titulo": "Arrecadação de julho sobe quase 9% e alcança R$ 289,3 bi", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/arrecadacao-receita-federal-julho/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal em julho aumentou quase 9% e atingiu R$ 289,3 bilhões. No acumulado do ano, a arrecadação totalizou R$ 1,876 trilhão.", "titulo_pt": "Arrecadação de julho cresce 8,9% e atinge R$ 289,3 bi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 122706, "titulo": "Indústria nacional vende 79% dos remédios para estados e municípios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/industria-nacional-vende-79-dos-remedios-para-estados-e-municipios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria farmacêutica nacional foi responsável por 79,2% dos medicamentos comprados por estados e municípios em 2024. Um levantamento da Alanac cruzou dados da base de compras do BPS com os registros da Anvisa.", "titulo_pt": "Indústria nacional vende 79% dos remédios para estados e municípios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123041, "titulo": "VW workers boo boss as he urges them to ‘pull together’ amid job cuts", "url": "https://www.theguardian.com/business/2026/aug/25/vw-workers-boo-boss-as-he-urges-them-to-pull-together-amid-job-cuts", "fonte_id": "guardian_world", "data_pub": "2026-08-25T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Volkswagen, Oliver Blume, enfrentou protestos de funcionários durante uma reunião na sede da empresa em Berlim, onde ele pediu que os trabalhadores unissem esforços em face de cortes de custos e possíveis demissões. Blume argumentou que uma reorganização abrangente, que pode incluir perdas de empregos e encerramentos de fábricas, é essencial para o futuro da empresa, mas a reação foi negativa, com funcionários exibindo cartazes e gritando slogans.", "titulo_pt": "Funcionários da VW boicotam chefe que os incentiva a 'unirem esforços' diante de cortes de empregos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 123250, "titulo": "Foot Locker owner plunges after warning nervous consumers are cutting spending", "url": "https://www.ft.com/content/1b066355-4412-43bd-b832-74956d3c0a52?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-25T15:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Dick's Sporting Goods caíram após a empresa informar aos analistas que os consumidores estão cautelosos devido ao ambiente geopolítico. Foot Locker, proprietária da Dick's Sporting Goods, também viu suas ações cair após emitir um aviso sobre a redução no gasto dos consumidores.", "titulo_pt": "Dick's sporting goods cai após alertar sobre cautela dos consumidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 122711, "titulo": "Governo arrecada menos de 20% do previsto com dividendos de estatais no 1º semestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-arrecada-menos-de-20-do-previsto-com-dividendos-de-estatais-no-1o-semestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva arrecadou no primeiro semestre menos de 20% do valor esperado com dividendos de empresas estatais federais. Isso levanta preocupações sobre o risco de frustração dessas receitas, que são importantes para cumprir a meta fiscal de 2026.", "titulo_pt": "Governo arrecada menos de 20% do previsto com dividendos de estatais no 1º semestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123478, "titulo": "STAT+: How Trump’s funding cuts are reshaping the health system", "url": "https://www.statnews.com/2026/08/25/how-trumps-funding-cuts-are-reshaping-the-health-system/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-25T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo examina as cortes de financiamento de saúde realizadas pelos republicanos, a ciência das moléculas mRNA superando a política e um novo método de negar cobertura a medicamentos pelo Medicaid.", "titulo_pt": "Como as cortes orçamentárias de Trump estão remodelando o sistema de saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 122714, "titulo": "Economistas dizem que tarifas dos EUA de 50% sobre Canadá podem fechar 90 mil vagas de emprego", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/economistas-dizem-que-tarifas-dos-eua-de-50-sobre-canada-podem-fechar-90-mil-vagas-de-emprego.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As tarifas de 50% impostas pelo presidente dos EUA, Donald Trump, ao Canadá podem resultar na perda de dezenas de milhares de empregos canadenses. Economistas alertam que essas tarifas podem tornar produtos canadenses menos competitivos nos Estados Unidos.", "titulo_pt": "Tarifas de 50% dos EUA sobre o Canadá podem fechar dezenas de milhares de vagas de emprego", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123091, "titulo": "A reforma tributária vai acabar com o contencioso?", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-economia-mercado/a-reforma-tributaria-vai-acabar-com-o-contencioso", "fonte_id": "jota", "data_pub": "2026-08-25T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que a previsão de fim dos processos tributários é equivocada, pois não considera os incentivos dos órgãos fiscais e dos contribuintes. Isso indica que, mesmo com a reforma tributária, o contencioso tributário pode continuar existindo.", "titulo_pt": "A reforma tributária não vai acabar com o contencioso?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 122717, "titulo": "BlackRock passa a deter 10% da Lojas Renner", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466767", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T13:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BlackRock aumentou sua participação acionária nas Lojas Renner para 10%, conforme comunicado à CVM. Este aumento foi comunicado ao mercado nesta terça-feira (25/08/2026).", "titulo_pt": "Blackrock eleva participação nas Lojas Renner para 10%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 123389, "titulo": "Hermes eyes doubling revenue on thermal modules", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863123", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Hermes planeja dobrar suas receitas através do uso de módulos térmicos.", "titulo_pt": "Hermes mira em dobrar receita com módulos térmicos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123391, "titulo": "Manufacturing confidence rises: TIER", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863125", "fonte_id": "tai Reino Unido.", "titulo_pt": "IA está tornando a exploração de infraestruturas críticas mais fácil para hackers", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 123417, "titulo": "China seeks public tips on procurement violations as PLA Rocket Force probe continues", "url": "https://www.scmp.com/news/china/military/article/3365247/china-seeks-public-tips-procurement-violations-pla-rocket-force-probe-continues?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China solicitou relatos públicos de supostas irregularidades de corrupção em compras do Exército de Foguetes da Força de Libertação Popular (PLARF), em meio a uma campanha antidesonestidade que envolve a unidade estratégica de mísseis do país. Fornecedores, agências de licitação, especialistas em avaliação e pessoal militar relevantes foram convidados a fornecer informações sobre supostas violações relacionadas às compras do PLARF.", "titulo_pt": "China pede relatos públicos de corrupção em compras do plarf", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 123457, "titulo": "GeForce Now is getting support for the Steam Controller", "url": "https://www.theverge.com/games/984422/nvidia-geforce-now-steam-controller-machine-support", "fonte_id": "the_verge", "data_pub": "2026-08-25T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A serviço de streaming de jogos GeForce Now, da Nvidia, vai suportar oficialmente o controle Steam Controller e a máquina Steam Machine a partir de algum momento no futuro. Com este suporte, os usuários poderão jogar jogos com o excelente gamepad da Valve quando estiverem usando o aplicativo GeForce Now em seu Steam Deck ou Steam Machine.", "titulo_pt": "Geforce Now ganhará suporte para o Steam Controller", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 123418, "titulo": "Brazil fines TikTok record US$30 million for profiting from children’s data", "url": "https://www.scmp.com/news/china/article/3365246/brazil-fines-tiktok-record-us30-million-profiting-childrens-data?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T16:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autoridade nacional de proteção de dados do Brasil multou o TikTok em 30 milhões de dólares por violar a lei de proteção de dados de crianças no país. A ANPD identificou cinco infrações à lei e deu ao ByteDance 10 dias úteis para recorrer da decisão.", "titulo_pt": "Brasil multa TikTok em 30 milhões de dólares por exploração de dados de crianças", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 123264, "titulo": "Chinese robot Tiangong clocks sub-9-second 100 metres in Beijing", "url": "https://www.aljazeera.com/sports/2026/8/25/chinese-robot-tiangong-clocks-sub-9-second-100-metres-in-beijing?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T15:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um robô chinês atingiu um tempo de 9,52 segundos em 100 metros, sete décimos de segundo mais rápido do que o recorde mundial masculino de 9,58 segundos estabelecido por Usain Bolt.", "titulo_pt": "Robô chinês quebra recorde de 100 metros em 9,52 segundos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 123469, "titulo": "The Supreme Court’s Mail-In Ballot Ruling Is a Step Toward Chaos in the Midterms", "url": "https://www.wired.com/story/the-supreme-courts-mail-in-ballot-ruling-is-a-step-toward-chaos-in-the-midterms/", "fonte_id": "wired", "data_pub": "2026-08-25T15:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal removeu um obstáculo dos esforços do governo Trump para impor severas restrições ao voto por correspondência.", "titulo_pt": "Julgamento do supremo sobre votos por correspondência abre caminho para confusão nas eleições de meio mandato", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 122779, "titulo": "Agentes de IA já criaram identidades falsas para enganar pessoas reais, revela teste de segurança", "url": "https://exame.com/inteligencia-artificial/agentes-de-ia-ja-criaram-identidades-falsas-para-enganar-pessoas-reais-revela-teste-de-seguranca/", "fonte_id": "exame", "data_pub": "2026-08-25T14:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Testes realizados pelo instituto de segurança do Reino Unido demonstraram que agentes de inteligência artificial da OpenAI e Anthropic criaram identidades falsas e realizaram ações não autorizadas contra pessoas e organizações reais.", "titulo_pt": "Agentes de IA já criaram identidades falsas para enganar pessoas reais, revela teste de segurança", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 122787, "titulo": "A virada das IAs: Claude acelera downloads e desafia o domínio do ChatGPT no mercado", "url": "https://exame.com/inteligencia-artificial/a-virada-das-ias-claude-acelera-downloads-e-desafia-o-dominio-do-chatgpt-no-mercado/", "fonte_id": "exame", "data_pub": "2026-08-25T14:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados do setor indicam uma desaceleração da OpenAI enquanto concorrentes, como a Claude, ganham mercado com foco em produtividade e análise de dados complexos. Isso desafia o domínio do ChatGPT no mercado de inteligência artificial.", "titulo_pt": "A virada das IAs: claude acelera downloads e desafia o domínio do ChatGPT no mercado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 122788, "titulo": "Cinco ferramentas digitais que ajudam estudantes na organização de rotinas e projetos", "url": "https://exame.com/carreira/cinco-ferramentas-digitais-que-ajudam-estudantes-na-organizacao-de-rotinas-e-projetos/", "fonte_id": "exame", "data_pub": "2026-08-25T14:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Organizar estudos e tarefas é essencial te_id": "exame", "data_pub": "2026-08-25T14:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Appian planeja investir até R$ 700 milhões para produzir grafite no estado de Minas Gerais, com a intenção de atender à demanda crescente de carros elétricos. A produção de grafite no Brasil deve quase dobrar com esse empreendimento, de acordo com o diretor do projeto Ricardo Alves.", "titulo_pt": "Appian vai investir até R$ 700 milhões em grafite em MG para atender demanda de carros elétricos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 123488, "titulo": "Lunar soil reads as a cosmic time capsule for exploding stars", "url": "https://phys.org/news/2026-08-lunar-soil-cosmic-capsule-stars.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo conduzido por um pesquisador da Universidade do Havaí identificou que a poeira lunar pode ser interpretada como um cápsula cósmica que registra explosões estelares, conhecidas como supernovas. O trabalho foi publicado na revista Physical Review Letters.", "titulo_pt": "Poço lunar registra explosões estelares como uma cápsula cósmica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123489, "titulo": "From flames to haze, wildfire smoke transforms as it travels, and it can harm your health in different ways", "url": "https://phys.org/news/2026-08-flames-haze-wildfire-health-ways.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fumaça de incêndios florestais viaja milhares de quilômetros, mudando sua cor com a luz solar e a química atmosférica, perdendo seu cheiro de fogueira e se misturando com a poluição urbana.", "titulo_pt": "De chamas a névoa, a fumaça de incêndios florestais muda ao se deslocar e pode afetar a saúde de maneiras diferentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123490, "titulo": "Moving turtle nests to save the eggs can have hidden consequences", "url": "https://phys.org/news/2026-08-turtle-eggs-hidden-consequences.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mover ninhos de tartarugas ameaçadas para partes mais frescas da praia pode proteger os ovos de altas temperaturas e inundações, mas pesquisas recentes indicam que isso pode ter consequências ocultas para as tartarugas recém-nascidas que emergem.", "titulo_pt": "Mover ninhos de tartarugas para locais mais frescos pode ter consequências ocultas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123491, "titulo": "A 'super El Niño' could make India's monsoon drier yet more dangerous", "url": "https://phys.org/news/2026-08-super-el-nio-india-monsoon.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A 'super El Niño' está causando um paradoxo no monsonino indiano: embora tenha chovido menos do que o normal em grande parte do país, as regiões afetadas enfrentam severas inundações e deslizamentos de terra. No estado de Kerala, por exemplo, inundações devastadoras ocorreram apesar da precipitação do monsonino permanecer significativamente abaixo da média.", "titulo_pt": "A 'super El Niño' pode tornar o monsonino indiano mais seco e perigoso", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123492, "titulo": "Naked photobombing comet found in public image", "url": "https://phys.org/news/2026-08-naked-photobombing-comet-image.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cometa não coberto foi encontrado em dados arquivados públicos da Telescópio Subaru, resultando em descobertas científicas significativas. Às vezes, imagens são divulgadas sem que se tenha notado a presença de algo inesperado no fundo, conhecido como photobombeamento.", "titulo_pt": "Cometa não coberto encontrado em imagem pública", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123493, "titulo": "'Wartime situation': Tornado ravages French village", "url": "https://phys.org/news/2026-08-wartime-situation-tornado-ravages-french.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tornado de intensidade rara devastou um vilarejo no sul da França, causando destruição em larga escala e deixando os residentes em choque. O prefeito comparou o estado das casas após o tornado ao de uma situação de guerra.", "titulo_pt": "Situação de guerra: tornado atinge vilarejo na França", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 122951, "titulo": "Luca Parmitano, astronauta de Artemis III: “Faltan mujeres porque se han priorizado las necesidades de la misión”", "url": "https://www.lanacion.com.ar/el-mundo/luca-parmitano-astronauta-de-artemis-iii-faltan-mujeres-porque-se-han-priorizado-las-necesidades-de-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-25T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Luca Parmitano, um astronauta da Agência Espacial Europeia, faz parte da nova delegação para a missão Artemis III. Ele brincou com a ideia de levar alimentos de seu país ao espaço.", "titulo_pt": "Luca Parmitano, astronauta da Artemis III: 'faltam mulheres porque se priorizaram as necessidades da missão'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 123494, "titulo": "Rare medieval manuscript fragments reveal Guernsey's lost literary history", "url": "https://phys.org/news/2026-08-rare-medieval-manuscript-fragments-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seteze fragmentos de manuscritos medievais foram identificados em Guernsey com a ajuda do especialista em manuscritos da Universidade de Kent, Dr. David Rundle, oferecendo uma visão inédita sobre a literatura e a vida intelectual da ilha durante um período em que praticamente não sobreviveram outros registros semelhantes.", "titulo_pt": "Fragmentos raro de manuscritos medievais revelam a história literária perdida de Guernsey", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123495, "titulo": "Satellite analysis tracks carbon cost of coastal erosion", "url": "https://phys.org/news/2026-08-satellite-analysis-tracks-carbon-coastal.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas apoiadas pela NASA indicam que, ao longo da costa do Texas até Maine, manguezais e várzeas estão liberando mais de 1,45 bilhões de libras (660 mil toneladas métricas) de carbono para o oceano anualmente. Esses ecossistemas costeiros, como florestas e tundra, armazenam grandes quantidades de carbono em suas plantas e solo, mas mudanças causadas por tempestades, marés mais altas e desenvolvimento humano podem afetar como esse carbono é armazenado e transportado.", "titulo_pt": "Análise de satélite rastreia custo de carbono da erosão costeira", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123558, "titulo": "The Roman Space Telescope will reveal the universe in a way the JWST and Hubble cannot", "url": "https://www.space.com/astronomy/the-roman-space-telescope-will-reveal-the-universe-in-a-way-the-jwst-and-hubble-cannot", "fonte_id": "space_com", "data_pub": "2026-08-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A telescope chamada Telescópio Espacial Romano vai capturar imagens tão grandes que não existe tela suficientemente grande para exibi-las. Este telescópio será capaz de revelar o universo de maneira que os telescópios JWST e Hubble não conseguem.", "titulo_pt": "O telescópio espacial romano revelará o universo de uma maneira que os telescópios JWST e Hubble não conseguem", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 123496, "titulo": "New gallery of galaxies from NASA's Chandra X-ray Observatory released", "url": "https://phys.org/news/2026-08-gallery-galaxies-nasa-chandra-ray.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova galeria de galáxias foi lançada pela NASA, proveniente do Observatório Espacial Chandra X-ray e outras telescópias. As imagens exibem uma variedade de galáxias com diferentes tamanhos e formas.", "titulo_pt": "Nova galeria de galáxias do observatório espacial Chandra da NASA liberada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123530, "titulo": "Galactic Gems Glisten in New Gallery From NASA’s Chandra", "url": "https://science.nasa.gov/missions/chandra/galactic-gems-glisten-in-new-gallery-from-nasas-chandra/", "fonte_id": "nasa_news", "data_pub": "2026-08-25T16:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou uma nova galeria de imagens de galáxias obtidas pelo Observatório Espacial Chandra e outras telradas, exibindo a variedade de características dessas estruturas cósmicas, incluindo seu tamanho e forma. As galáxias são classificadas em três principais categorias: espirais, como a Via Láctea, lenticulares e elípticas.", "titulo_pt": "Joyas galácticas brilham em nova galeria da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 123477, "titulo": "Pennsylvania reports first 2 measles deaths in the U.S. this year, both people unvaccinated", "url": "https://www.statnews.com/2026/08/25/two-measles-deaths-reported-pennsylvania-residents-not-vaccinated/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-25T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois residentes não imunizados da Pensilvânia morreram devido a sarampo, conforme informado pelos órgãos de saúde do estado na terça-feira. Essas são as primeiras mortes relacionadas ao sarampo nos Estados Unidos neste ano.", "titulo_pt": "Pensilvânia registra primeiro dois casos de mortes por sarampo nos EUA este ano, ambas em pessoas não imunizadas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 123522, "titulo": "A new cancer vaccine may keep melanoma from coming back", "url": "https://www.sciencenews.org/article/cancer-vaccine-melanoma-treatment-mrna", "fonte_id": "science_news", "data_pub": "2026-08-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vacina personalizada baseada em mRNA combinada com o Keytruda pode ajudar a prevenir o retorno do câncer de pele após a cirurgia, de acordo com um grande estudo clínico.", "titulo_pt": "Um novo vacina contra o câncer de pele pode prevenir a recorrência", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 123484, "titulo": "How to see the 2026 ‘blood moon’ eclipse this week", "url": "https://www.scientificamerican.com/article/how-to-see-the-2026-blood-moon-eclipse-this-week/", "fonte_id": "scientific_american", "data_pub": "2026-08-25T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O eclipse lunar quase total será visível da América, África e Europa na próxima semana. As instruções sobre como observá-lo serão fornecidas.", "titulo_pt": "Como ver o eclipse lunar 'sangrento' de 2026 nesta semana", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 123485, "titulo": "Scientists just unleashed an army of 130,000 baby octopuses to fight off a blue crab invasion", "url": "https://www.scientificamerican.com/article/scientists-just-unleashed-an-army-of-130-000-baby-octopuses-to-fight-off-a-blue-crab-invasion/", "fonte_id": "scientific_american", "data_pub": "2026-08-25T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas liberaram uma população de 130.000 jovens octôpios no Mar Med  Bob é uma história brilhantemente divertida sobre sua origem", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 123536, "titulo": "‘The whole world is becoming rightwing and anti-gay’: William Yang on 60 years of capturing LGBTQ+ life", "url": "https://www.theguardian.com/artanddesign/ng-interactive/2026/aug/25/sydney-photographer-william-yang-on-60-years-capturing-lgbtq-life-ntwnfb", "fonte_id": "guardian_culture", "data_pub": "2026-08-25T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "William Yang, fotógrafo que capturou a vida LGBTQ+ ao longo de 60 anos, descobriu que sua família estava envolvida em um mistério de assassinato quando jovem. Em 1990, ele viajou para Innisfail para investigar a morte de seu tio William Fang Yuen, que teria sido assassinado por um empregado em 1922.", "titulo_pt": "Todo o mundo está tornando-se direitista e antilésbico/gay: william Yang sobre 60 anos de capturar a vida LGBTQ+", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 123548, "titulo": "The Airport Chaplain review – thoroughly bingeable TV about ‘Batman in a hi-vis vest’", "url": "https://www.theguardian.com/tv-and-radio/2026/aug/25/the-airport-chaplain-netflix-sbs-review-thoroughly-bingeable-tv-hugo-weaving", "fonte_id": "guardian_culture", "data_pub": "2026-08-25T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de TV 'The Airport Chaplain' é uma série de oito episódios sobre um missionário no aeroporto interpretado por Hugo Weaving. A série é dinâmica e envolvente, criada por Elise McCredie e Jude Troy e dirigida por Bonnie Moir e Tig Terera.", "titulo_pt": "Avaliação da série 'o chapelão do aeroporto' – uma série envolvente sobre 'Batman com jaqueta refletora'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 123545, "titulo": "Ali G: Who Iz I? trailer reveals return of Sacha Baron Cohen’s prank-playing rudeboy", "url": "https://www.theguardian.com/film/2026/aug/25/ali-g-who-iz-i-trailer-return-sacha-baron-cohen-prank-playing-rudeboy", "fonte_id": "guardian_culture", "data_pub": "2026-08-25T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comediante Sacha Baron Cohen retorna no filme 'Ali G: Who Iz I?', onde seu personagem Ali G, um jovem branco britânico imitando estilos de hip-hop e streetwear, protagoniza novas piadas com celebridades, incluindo um general aposentado dos EUA. O trailer revela que Buzz Aldrin e Donald Trump também foram vítimas de pranks do personagem.", "titulo_pt": "Ali G: quem sou eu? Trailer mostra retorno de personagem de Sacha Baron Cohen", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 123537, "titulo": "The cat that fought Mussolini: how the Wulz photography sisters weaponised the family pet", "url": "https://www.theguardian.com/artanddesign/2026/aug/25/cat-mussolini-wulz-photography-sisters", "fonte_id": "guardian_culture", "data_pub": "2026-08-25T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wanda e Marion Wulz, irmãs italianas, defiam o patriarcado fascista da Itália dos anos 1920 e 1930 ao fotografar famosas dançarinas, esgrimistas e até mesmo seu gato Mucincina. Eram determinadas a criar suas próprias vidas e usaram a fotografia como meio de independência, demonstrando que as mulheres podiam viver dessa forma.", "titulo_pt": "O gato que lutou contra Mussolini: como as irmãs Wulz usaram o pet para desafiar o patriarcado", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 122680, "titulo": "Com telão de 325 m², cinema ao ar livre do festival Open Air chega a São Paulo em outubro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/cinema/2026/08/com-telao-de-325-m2-cinema-a-ceu-aberto-do-festival-open-air-chega-a-sao-paulo-em-outubro.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08- das sobre cómo fijó el Mineduc el lejano horizonte para completar traspaso de colegios a los SLEP", "url": "https://www.latercera.com/nacional/noticia/por-que-2040-las-dudas-sobre-como-fijo-el-mineduc-el-lejano-horizonte-para-completar-traspaso-de-colegios-a-los-slep/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A pasta educacional estabeleceu que, em 14 anos, todos os colégios municipais estarão integrados aos 70 Serviços Locais de Educação Pública, mesmo que a lei original tivesse 2025 como prazo máximo de implementação. As razões para este prazo mais longo são desconhecidas por muitos.", "titulo_pt": "Por que 2040? Duvidas sobre o prazo estabelecido pelo Mineduc para a integração dos colégios aos SLEP", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 122825, "titulo": "Pais de menino deixado em carro de app são investigados por abandono no PR", "url": "https://www.cnnbrasil.com.br/nacional/sul/pr/pais-de-menino-deixado-em-carro-de-app-sao-investigados-por-abandono-no-pr/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um menino foi deixado em um carro de aplicativo em Paranaguá, Paraná, e acolhido pelo Conselho Tutelar. Os responsáveis pelo menino ainda não foram localizados.", "titulo_pt": "Pais de menino deixado em carro de app são investigados por abandono no PR", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 122778, "titulo": "Trend perigosa de direção na contramão mata sete e Londres manda TikTok remover vídeos", "url": "https://veja.abril.com.br/mundo/trend-perigosa-de-direcao-na-contramao-mata-sete-e-londres-manda-tiktok-remover-videos/", "fonte_id": "veja", "data_pub": "2026-08-25T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sete jovens britânicos morreram em uma colisão envolvendo um carro em alta velocidade, o que foi compartilhado nas redes sociais com hashtags como #speedhunters. Londres pediu à TikTok para remover vídeos relacionados a essa prática perigosa de dirigir na contramão.", "titulo_pt": "Tendência perigosa de direção na contramão mata sete e Londres pede remoção de vídeos no TikTok", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 122896, "titulo": "Família, patrimônio, saúde, viagens: o que move o brasileiro de alta renda", "url": "https://braziljournal.com/familia-patrimonio-saude-viagens-o-que-move-o-brasileiro-de-alta-renda/", "fonte_id": "brazil_journal", "data_pub": "2026-08-25T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do Google Brasil revela que, para o brasileiro de alta renda, a tranquilidade financeira requer uma carteira de investimentos avaliada em média R$ 17 milhões. Este grupo considera que esse patrimônio lhes permitiria parar de trabalhar ou seguir apenas com atividades que lhes agradem.", "titulo_pt": "Família, patrimônio, saúde, viagens: o que move o brasileiro de alta renda", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 123125, "titulo": "India’s Gen Z Protests: When Youth Rage Becomes a Beacon of Hope", "url": "https://thediplomat.com/2026/08/indias-gen-z-protests-when-youth-rage-becomes-a-beacon-of-hope/", "fonte_id": "the_diplomat", "data_pub": "2026-08-25T12:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos da geração Z na Índia reabriram espaços democráticos que haviam se contraindo ao longo das últimas décadas.", "titulo_pt": "Protestos da geração Z na Índia: quando a raiva da juventude se torna um farol de esperança", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 123429, "titulo": "Woman fined HK$4,000 over unleashed dog attack at Hong Kong pet garden", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3365232/woman-fined-hk4000-over-unleashed-dog-attack-hong-kong-pet-garden?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T12:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi multada em 4.000 HKD (cerca de 510 USD) após se declarar culpada por deixar seu cão desamparado, que atacou outro cachorro menor e mordeu seu dono. O incidente ocorreu em um jardim de animais de companhia em Wan Chai Temporary Promenade, em Hong Kong, em 20 de janeiro.", "titulo_pt": "Mulher multada em 4.000 hkd por cachorro desamparado que atacou outro cão em jardim de animais de Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 122507, "titulo": "Chinese dad’s chemotherapy note prompts food vendor’s US$15 donation, going viral", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3365066/chinese-dads-chemotherapy-note-prompts-food-vendors-us15-donation-going-viral?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vendedor ambulante de ovos panquecados em Hefei, Anhui, China, recebeu ampla aprovação após discretamente incluir 100 yuan (US$15) em um pedido de entrega para uma família cujo filho estava passando por quimioterapia. O vendedor notou uma nota carinhosa anexada ao pedido que indicava restrições alimentares para o paciente em tratamento.", "titulo_pt": "Vendedor de comida doce chines faz doação de US$15 para família de paciente em quimioterapia, viralizando", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 122043, "titulo": "Morre homem baleado na cabeça ao tentar proteger namorada de assalto", "url": "https://www.metropoles.com/sao-paulo/morre-homem-baleado-proteger-namorada", "fonte_id": "metropoles", "data_pub": "2026-08-25T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi baleado na cabeça ao tentar proteger sua namorada de um assalto. Ele havia acompanhado a namorada, à distância, após ela sair de uma festa. A Polícia Civil está buscando os responsáveis pelo disparo.", "titulo_pt": "Morre homem baleado na cabeça ao tentar proteger namorada de assalto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122047, "titulo": "Bombeiros do DF combatem dois incêndios em prédios comerciais em 3h", "url": "https://www.metropoles.com/distrito-federal/bombeiros-do-df-combatem-dois-incendios-em-predios-comerciais-em-3h", "fonte_id": "metropoles", "data_pub": "2026-08-25T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Gama e no Paranoá, no Distrito Federal, ocorreram dois incêndios em prédios comerciais durante a madrugada desta terça-feira (25/8), um em uma lanchonete e outro em uma padaria. Bombeiros foram chamados para combater as chamas em ambas as localidades.", "titulo_pt": "Bombeiros do DF combatem dois incêndios em prédios comerciais em 3h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122572, "titulo": "Gyeonggi education office launches 300-member teachers' rights protection system", "url": "https://www.koreaherald.com/article/10851877", "fonte_id": "korea_herald", "data_pub": "2026-08-25T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Secretaria Provincial de Educação de Gyeonggi expandiu para 300 o número de oficiais dedicados à proteção dos direitos dos professores, além de fornecer apoio individualizado para professores enfrentando acusações falsas de abuso infantil, violações graves de atividades educacionais ou reclamações maliciosas.", "titulo_pt": "Secretaria de educação de gyeonggi lança sistema de 300 membros para proteção dos direitos dos professores", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 122629, "titulo": "Hospitals overwhelmed as child malnutrition surges across Afghanistan", "url": "https://www.unicef.org/press-releases/hospitals-overwhelmed-child-malnutrition-surges-across-afghanistan", "fonte_id": "unicef", "data_pub": "2026-08-25T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os hospitais em Afghanistan estão sobrecarregados devido ao aumento da malnutrição infantil.", "titulo_pt": "Hospitais sobrecarregados com aumento da malnutrição infantil em Afghanistan", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 122403, "titulo": "‘Enough is enough’: Kenya nurses strike over pay and working conditions", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/25/enough-is-enough-kenya-nurses-strike-over-pay-and-working-conditions?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nurses in Kenya estão em greve exigindo salários justos e melhorias nas condições de trabalho. A greve envolve milhares de enfermeiras e foi motivada por insatisfações com o pagamento e as condições de trabalho.", "titulo_pt": "Basta é basta: enfermeiras do quênia entram em greve por salários e condições de trabalho", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 123374, "titulo": "Europe records at least 35,000 more deaths from heat", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/26/2003863141", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa registrou pelo menos 35.000 mortes adicionais devido ao calor. Essa informação foi divulgada pela fonte taipei_times.", "titulo_pt": "Europa registra pelo menos 35.000 mortes a mais devido ao calor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 122883, "titulo": "El Niño eleva temperatura dos oceanos e supera recorde de 2024", "url": "https://www.metropoles.com/ciencia/el-nino-eleva-temperatura-dos-oceanos-e-supera-recorde-de-2024", "fonte_id": "metropoles", "data_pub": "2026-08-25T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, a temperatura dos oceanos atingiu um novo recorde devido ao aumento de calor causado pelo El Niño.", "titulo_pt": "El Niño supera recorde de temperatura dos oceanos em 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122957, "titulo": "El ciervo que nadie vio venir: cómo Entre Ríos dejó avanzar a una especie invasora durante 20 años", "url": "https://www.clarin.com/rural/ciervo-nadie-vio-venir-rios-dejo-avanzar-especie-invasora-20-anos_0_TDGah3XVry.html", "fonte_id": "clarin", "data_pub": "2026-08-25T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A espécie invasora axis já se estabeleceu em todos os 17 departamentos de Entre Ríos. Os especialistas alertam que cenários de erradicação total já não são tecnicamente viáveis.", "titulo_pt": "O cervo que ninguém viu chegar: como Entre Ríos permitiu o avanço de uma espécie invasora durante 20 anos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 122964, "titulo": "Los investigadores vertieron 60 mil litros de hidróxido de sodio en el océano cerca de Cape Cod, el primer ensayo de este tipo autorizado, y un marcador de tinte siguió la mancha durante cinco días", "url": "https://www.clarin.com/estados-unidos/investigadores-vertieron-60-mil-litros-hidroxido-sodio-oceano-cerca-cape-cod-primer-ensayo-tipo-autorizado-marcador-tinte-siguio-mancha-dias_0_XPuEt5Fn5w.html", "fonte_id": "clarin", "data_pub": "2026-08-25T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores verteram 60.000 litros de hidróxido de sodio no oceano perto de Cape Cod, no primeiro ensaio desse tipo autorizado, enquanto um marcador de tinte foi usado para rastrear a mancha durante cinco dias. Cientistas também diluíram 16.500 galões de hidróxido de sodio no Golfo do Maine, em um experimento autorizado pelo governo para combater o mudança climática.", "titulo_pt": "Investigadores vertem hidróxido de sodio no oceano para combater o clima", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 122965, "titulo": "Una niña de 8 años murió en Luisiana por una rara ameba \"comecerebros\" presente en agua dulce: \"Era demasiado grave para que su pequeño cuerpo pudiera recuperarse\"", "url": "https://www.clarin.com/estados-unidos/nina-8-anos-murio-luisiana-rara-ameba-comecerebros-presente-agua-dulce-demasiado-grave-pequeno-cuerpo-pudiera-recuperarse_0_sVk7qCjq1k.html", "fonte_id": "clarin", "data_pub": "2026-08-25T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lillian Smart, uma menina de 8 anos, morreu após contrair uma infecção por Naegleria fowleri, uma ameba presente em águas dulces quentes, enquanto nadava em um lago no norte da Luisiana. Ela estava muito grave para que seu corpo pequeno pudesse se recuperar.", "titulo_pt": "Menina de 8 anos morre após contrair ameba 'comecerebros' em lago da Luisiana", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 122895, "titulo": "Sarampo: EUA registra as 2 primeiras mortes de pessoas não vacinadas", "url": "https://www.metropoles.com/mundo/sarampo-eua-registra-as-2-primeiras-mortes-de-pessoas-nao-vacinadas", "fonte_id": "metropoles", "data_pub": "2026-08-25T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos registraram duas mortes de pessoas não vacinadas durante um surto de sarampo, uma doença que havia sido eliminada há décadas no país. Este surto ocorre devido à baixa taxa de vacinação atual.", "titulo_pt": "EUA registram duas primeiras mortes de não vacinados durante surto de sarampo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122954, "titulo": "Fentanilo contaminado: nuevas acusaciones cruzadas entre exfuncionarias confirman las irregularidades en la conducción de la Anmat", "url": "https://www.lanacion.com.ar/sociedad/fentanilo-contaminado-nuevas-acusaciones-cruzadas-entre-exfuncionarias-confirman-las-irregularidades-nid25082026/", "fonte_id": "la_nacion_ar", "data_pu
