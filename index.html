<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 18/09/2026 19:15 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "18/09/2026 19:15", "stats": {"noticias_novas": 579, "resumos_gerados": 236}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Ministério Público do Trabalho processou Rico Melquíades por assédio eleitoral, pedindo uma indenização de R$ 5 milhões. Em outro caso, o Tribunal Regional Eleitoral de São Paulo rejeitou a candidatura do policial Edjane ao governo de SP por falta de comprovação do seu afastamento do cargo público. A campanha de Lula inaugurou um espaço cultural em São Paulo para recrutar voluntários e mobilizar jovens. A Advocacia-Geral da União defendeu a constitucionalidade do reajuste do Bolsa Família. A pesquisa Datafolha mostrou que Ciro Gomes lidera o segundo turno na disputa pelo governo do Ceará, com 51% das intenções de voto. O presidente Lula anunciou o reajuste de 15% no Bolsa Família, mas a medida ainda depende de três etapas para ser implementada. A campanha de Lula enfrenta críticas após reunião com mulheres, com Edinho Silva admitindo desgaste eleitoral. Além disso, a campanha do Republicanos em São Paulo pode emergir como grande força nas eleições, com candidatos como Paes e Lyra.", "mundo": "O presidente dos Estados Unidos, Donald Trump, anunciou uma série de medidas controversas, incluindo a proibição de veículos de notícias como CNN, MSN Now e Politico de acessarem o White House, em resposta a coberturas que ele considera negativas. Este movimento aumenta a tensão entre a administração Trump e a mídia, com grupos de liberdade de imprensa pedindo que as publicações se defendam contra essas proibições. Além disso, Trump anunciou um acordo com a Dinamarca para assumir o controle total da segurança do Groenlândia, afirmando que o governo americano manterá a capacidade completa de agir no território para defendê-lo. Em outro desenvolvimento, a Rússia anunciou a confiscação de ativos da Nestlé e de três grupos franceses, sob a administração temporária do governo russo, devido a sanções americanas. No cenário político, o presidente do Brasil, Luiz Inácio Lula da Silva rebateu as declarações de Trump sobre a classificação de facções criminosas, afirmando que Jair Bolsonaro é o verdadeiro terrorista.\n\nOs Estados Unidos anunciaram um acordo para expandir a presença militar na Groenlândia, permitindo um controle permanente sobre a segurança do território. Este movimento reforça a presença norte-americana no Ártico. O presidente Donald Trump também proibiu três grandes veículos de notícias – CNN, MSNBC e Politico – de entrarem no White House, justificando a medida com a publicação de 'notícias falsas'. Em outro desenvolvimento, a Arábia Saudita cancelou as entregas de petróleo para refinarias europeias, acentuando a crise energética na Europa. Além disso, Israel realizou um ataque a uma motocicleta em Gaza, resultando em uma morte e várias feridas. O conflito no Iêmen continua, com mais de 112 mil pessoas deslocadas. A crise energética também levou os Estados Unidos a levantarem sanções contra o Exército e entidades chaves da Eritreia, devido à sua localização estratégica no Mar Vermelho.", "economia": "Os Estados Unidos adiaram a aplicação de tarifas até a cúpula entre Biden e Xi, evitando a implementação imediata. O Banco do Japão (BoJ) aumentou as taxas de juros em uma decisão dividida, enfrentando pressão dos EUA. A Petrobras assinou contratos para explorar oito blocos na Costa do Marfim, na África, expandindo sua atuação na região. O Ibovespa teve variações durante a semana, refletindo o cenário fiscal do Brasil e os preços do petróleo. A Aneel autorizou 30,7 GW de novos acessos à rede de transmissão para 2026. O dólar operou sem direção única e o iene se desvalorizou após a elevação das taxas de juros do BoJ. As bolsas de Nova York fecharam sem direção única em uma semana volátil, após a elevação dos juros pela Fed. O índice de risco país atingiu seu valor mais alto em um mês, levando a uma queda de até 7% nas ações de Wall Street. O Banco Central permitiu o uso do Pix Automático em contas-salário e estabeleceu regras para a cobrança híbrida. A Petrobras pressionou o governo para impedir medidas propostas pela ANP que visam aumentar a concorrência no mercado de gás natural. O benefício do Bolsa Família será aumentado para R$ 164 por pessoa a partir de outubro. A CVM promete usar inteligência artificial para acelerar julgamentos em meio a processos parados. A Assaí anunciou a compra de 18 postos de combustíveis em São Paulo. Os credores da Braskem rejeitaram o plano de reestruturação proposto pela empresa, aumentando a pressão sobre a Petrobras para fornecer novos recursos.", "tecnologia": "O governador da Califórnia, Gavin Newsom, está liderando esforços para uma supervisão mais rigorosa da inteligência artificial (IA), incluindo a possibilidade de exigir um 'botão de desligamento' para modelos avançados, através de um novo decreto executivo. Este decreto direciona o estado a formar um grupo de especialistas que deverão apresentar recomendações em duas meses sobre como abordar a questão. Além disso, a Anthropic, uma das principais empresas de IA, informou que seus sistemas estão se tornando cada vez mais capazes de criar versões futuras de si mesmas, aumentando as preocupações sobre os riscos associados à tecnologia. Em um contexto mais amplo, empresas como a Nvidia e a OpenAI expressam otimismo apesar das preocupações relacionadas à IA, enquanto a Europa pondera sobre como abordar a segurança da IA em um cenário de potenciais cenários piores. Estes desenvolvimentos refletem a crescente importância do debate sobre a segurança e supervisão da IA no panorama global tecnológico.", "ciencia": "A NASA e a SpaceX anunciaram três novas missões de transporte de tripulação para a Estação Espacial Internacional, reforçando a importância da colaboração na exploração espacial. Em outra novidade científica, pesquisadores da Radboud University e da Columbia University criaram um gás molecular quântico extremamente estável, permitindo novos estudos sobre sistemas interativos fortes. Além disso, foi descoberta uma nova espécie de gato, a primeira em mais de um século, reforçando a diversidade animal. Outros temas abordados incluem a percepção do poder e suas implicações, a busca por evidências de microagujeros negros no Grande Colisor de Hádrons, e a descoberta de um material extremamente bom isolante térmico para aplicações práticas.", "cultura": "Um rápido e forte temporal atingiu Florença no dia 17 de setembro, causando cerca de duas polegadas de chuva em uma hora e inundando a Galeria Uffizi e o histórico Palazzo Pitti, levantando preocupações sobre as obras-mestras expostas. Em Brasília, a sessão do filme 'Se Eu Fosse Vivo? Vivia', dirigido por André Novais Oliveira, lotou o Cine Brasília, com cerca de 50 pessoas esperando para entrar, mesmo com os ingressos esgotados e a sala lotada. No Museu Guggenheim, a exposição de Taryn Simon 'No One Is Accountable' aborda a injustiça sistêmica, sugerindo que a corrupção não é resultado de indivíduos agindo mal, mas parte de um sistema maior. A influenciadora digital Virginia Fonseca decidiu não mais fazer propaganda para casas de apostas em suas redes sociais, rompendo um contrato recentemente.", "sociedade": "Uma menina de 12 anos foi atropelada enquanto vendia pipoca em um sinal da W3 Norte. O motorista, que estava usando o celular, fugiu sem prestar socorro e a vítima foi levada ao Hospital de Base do Distrito Federal (HBDF). Em outro caso, um detento foi encontrado morto durante uma atividade de banho de sol no presídio de Goiás, o que está sendo investigado pelas polícias Civil e Penal. Em Limache, no Chile, um homem foi detido como suspeito de um homicídio após ser atacado com uma arma cortante. Um jovem de 12 anos, que saiu da cadeia há menos de um mês, foi estuprado por um homem com antecedentes criminais em Itaquaquecetuba, na região do morro do Borges. A OAB-RJ defendeu o filho de Luiz Fux após ele ter sido noticiado por mensagens com o ex-ministro do STF, Gilmar Mendes, negando conduta atípica. O candidato Garotinho cancelou compromissos políticos na região da Baixada Fluminense após sua mãe falecer. A Defesa Civil interditou 15 casas em bairros do Arapoanga após um temporal causou danos em 56 residências e afetou diretamente 117 pessoas. Além disso, um paciente de 54 anos morreu após sofrer um ataque cardíaco ao engasgar com uma refeição comum em vez da comida mole necessária no Hospital Príncipe de Gales, em Sha Tin, Hong Kong, levando a uma investigação interna. No Brasil, menos de 30% das pessoas com deficiência estão empregadas e a renda dessas pessoas é geralmente menor que a média nacional, segundo dados do IBGE.", "meio_ambiente": "Queimadas ameaçam o fornecimento de energia na região Norte, de acordo com a Aneel. Em setembro, o Pará liderou o ranking nacional com 48,8 mil interrupções de energia causadas por queimadas. Além disso, a Conaf questionou vídeos de turistas em Torres del Paine, no Chile, advertindo sobre práticas perigosas em áreas protegidas. O vulcão Nevados de Chillán registrou um novo pulso eruptivo, mantendo a Alerta Amarela em vigor. Na região Sul do Brasil, o tempo volta a fechar, com chuvas fortes, ventos fortes e granizo. Estudos indicam que o número de dias extremamente quentes deve aumentar significativamente até o final do século.", "direitos_humanos": "Uma missão da ONU apontou crimes de guerra em ataques dos Estados Unidos a uma escola infantil no Afeganistão, resultando na morte de 178 pessoas, a maioria crianças. Em outro evento, a ativista chinesa Sophia Huang Xueqin, defensora do movimento #MeToo, está prestes a ser libertada após um período de prisão, mas amigos e grupos de direitos humanos expressam preocupação com sua situação após a liberdade. Na África do Sul, nove mulheres foram encontradas mortas em um período de dois meses, aumentando as preocupações sobre a segurança das mulheres no país. Um estudo sobre a experiência de 18 anos de uma festa comum aborda as diferenças nas experiências ao longo desse período. Por fim, escritores etíopes desaparecidos desde 2001 são o foco de uma campanha liderada por nobelistas Olga Tokarczuk e JM Coetzee, pedindo informações sobre a vida de 12 deles."}, "resumo_do_dia": {"politica_nacional": [{"id": 170185, "titulo": "Assédio eleitoral: MPT processa Rico Melquíades e pede indenização de R$ 5 milhões", "url": "https://www.jota.info/trabalho/assedio-eleitoral-mpt-processa-rico-melquiades-e-pede-indenizacao-de-r-5-milhoes", "fonte_id": "jota", "data_pub": "2026-09-18T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Trabalho (MPT) processou Rico Melquíades por assédio eleitoral e solicitou uma indenização de R$ 5 milhões. Ele publicou nas redes sociais mensagens que expunham e coagiam suas empregadas domésticas devido a divergências políticas.", "titulo_pt": "MPT processa Rico Melquíades e pede indenização de R$ 5 milhões por assédio eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 169986, "titulo": "Em decisão, Gilmar Mendes diz que reajuste do Bolsa Família feito por Lula não fere regras eleitorais", "url": "https://g1.globo.com/politica/noticia/2026/09/18/gilmar-mendes-diz-que-reajuste-do-bolsa-familia-feito-por-lula-nao-fere-regras-eleitorais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-18T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do Supremo Tribunal Federal, decidiu que o reajuste de 15% no Bolsa Família, feito por Lula, não viola as regras eleitorais. A decisão afirma que a medida é uma atualização periódica conforme estabelecido no marco legal da política pública.", "titulo_pt": "Decisão de Gilmar Mendes confirma que reajuste do Bolsa Família não viola regras eleitorais", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 170023, "titulo": "Lula x Flávio: o placar da disputa nas regiões do Brasil, segundo pesquisa", "url": "https://veja.abril.com.br/politica/lula-x-flavio-o-placar-da-disputa-nas-regioes-do-brasil-segundo-pesquisa/", "fonte_id": "veja", "data_pub": "2026-09-18T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa do Datafolha avaliou a corrida presidencial nas regiões do Sudeste, Nordeste, Sul e no agrupamento Centro-Oeste/Norte.", "titulo_pt": "Lula x Flávio: o placar da disputa nas regiões do Brasil, segundo pesquisa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 170069, "titulo": "TRE rejeita candidatura de Policial Edjane ao governo de SP", "url": "https://www.cnnbrasil.com.br/eleicoes/tre-rejeita-candidatura-de-policial-edjane-ao-governo-de-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral de São Paulo (TRE-SP) rejeitou a candidatura do policial Edjane por falta de comprovação de seu afastamento do cargo público.", "titulo_pt": "TRE rejeita candidatura de Policial Edjane ao governo de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170070, "titulo": "Quem é Marília Campos, candidata ao Senado por Minas Gerais", "url": "https://www.cnnbrasil.com.br/eleicoes/quem-e-marilia-campos-candidata-ao-senado-por-minas-gerais/", " l", "classe": "A"}, {"id": 169987, "titulo": "AGU pede que STF reconheça que decreto que reajustou valor do Bolsa Família é constitucional", "url": "https://g1.globo.com/politica/noticia/2026/09/18/agu-pede-que-stf-reconheca-que-decreto-que-reajustou-valor-do-bolsa-familia-e-constitucional.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-18T20:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral da União pediu ao Supremo Tribunal Federal que reconheça a constitucionalidade do decreto que reajustou os valores do Bolsa Família em 15,04%. O governo argumenta que a reposição da inflação não viola a lei eleitoral.", "titulo_pt": "AGU pede que STF reconheça constitucionalidade do reajuste do Bolsa Família", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 169972, "titulo": "Datafolha: Ciro Gomes tem 47% e Elmano de Freitas, 40%, no Ceará", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/datafolha-ciro-gomes-tem-47-e-elmano-de-freitas-40-no-ceara.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que Ciro Gomes tem 47% das intenções de voto e Elmano de Freitas tem 40% na disputa pelo Governo do Ceará. A pesquisa foi divulgada nesta sexta-feira (18).", "titulo_pt": "Ciro Gomes lidera com 47% e Elmano de Freitas tem 40% na pesquisa do Ceará", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169973, "titulo": "Abraji oferece curso gratuito sobre IA aplicada à análise documental", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/09/abraji-oferece-curso-gratuito-sobre-ia-aplicada-a-analise-documental.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T19:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Abraji oferece um curso gratu essos-a-rede-de-transmissao-em-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Pnast (Programa Nacional de Aceleração do Crescimento) autorizou 30,7 GW de novos acessos à rede de transmissão para 2026. A política introduziu um sistema de temporadas de acesso e estabeleceu regras para disputas quando as solicitações excederem a capacidade disponível.", "titulo_pt": "Pnast aprova 30,7 GW em acessos à rede de transmissão em 2026", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170034, "titulo": "Ibovespa desvaloriza de olho em cenário fiscal brasileiro e preços do petróleo", "url": "https://veja.abril.com.br/economia/ibovespa-desvaloriza-de-olho-em-cenario-fiscal-brasileiro-e-precos-do-petroleo/", "fonte_id": "veja", "data_pub": "2026-09-18T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa teve variações durante a semana, refletindo o cenário fiscal do Brasil e os preços do petróleo.", "titulo_pt": "Ibovespa oscila de olho em cenário fiscal e preços do petróleo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 169980, "titulo": "Economia mundial busca alternativas aos EUA diante de dúvidas sobre dólar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/economia-mundial-busca-alternativas-aos-eua-diante-de-duvidas-sobre-dolar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores globais estão evitando títulos americanos e governos estrangeiros estão retirando seu ouro dos cofres nos Estados Unidos. As discussões sobre a perda de força do dólar estão ganhando espaço.", "titulo_pt": "Mundo procura alternativas ao dólar diante das dúvidas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170099, "titulo": "Dólar opera sem sinal único e iene de até 7% após a elevação das taxas de juros pela Fed esta semana.", "titulo_pt": "Mal tempo: risco país atingiu nível máximo em um mês e ações caíram até 7% em Wall Street", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 170383, "titulo": "Oracle’s $18bn data centre debt under strain amid local pushback", "url": "https://www.ft.com/content/bd441859-6c94-4874-894f-9362c1703127?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T20:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores se tornam cautelosos diante dos atrasos na obtenção de permissões e na construção, enquanto a oposição cresce no Novo México em relação a um centro de dados da Oracle avaliado em 18 bilhões de dólares.", "titulo_pt": "Dívida de dados da oracle de 18 bilhões de dólares sob pressão devido a contratempos locais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 169981, "titulo": "CVM promete uso de IA para acelerar julgamentos em meio a processos parados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/cvm-promete-uso-de-ia-para-acelerar-julgamentos-em-meio-a-processos-parados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da CVM, Otto Lobo, anunciou que a comissão planeja utilizar inteligência artificial para acelerar a análise de processos e prevenir fraudes no mercado financeiro. Entre as prioridades do mandato de Lobo está a implementação dessa tecnologia para melhorar o funcionamento da CVM.", "titulo_pt": "CVM promete usar IA para acelerar julgamentos e combater fraudes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170103, "titulo": "Um jovem Arnault no ‘board’ de uma Nike desesperada", "url": "https://braziljournal.com/um-jovem-arnault-no-board-de-uma-nike-desesperada/", "fonte_id": "brazil_journal", "data_pub": "2026-09-18T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nike anunciou que Alexandre Arnault, de 34 anos, um dos filhos de Bernard Arnault, controlador da LVMH, e atual número dois da Moët Hennessy, será incorporado ao conselho de administração da empresa. A decisão ocorre em meio a uma crise sem precedentes para a Nike.", "titulo_pt": "Jovem Arnault no conselho da Nike desesperada", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 170302, "titulo": "Fitch Ratings mantiene la calificación de riesgo de Chile y ve que deuda pública terminará este año bajo 43% del PIB", "url": "https://www.latercera.com/pulso/noticia/fitch-ratings-mantiene-la-calificacion-de-riesgo-de-chile-y-ve-que-deuda-publica-terminara-este-ano-bajo-43-del-pib/", "fonte_id": "la_tercera", "data_pub": "2026-09-18T20:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Fitch Ratings manteve a classificação de risco de Chile e projetou que a dívida pública terminará o ano abaixo de 43% do PIB. O relatório destaca a governança sólida do país e suas políticas macroeconômicas credíveis, além de mencionar a megareforma e a agenda para o mercado de trabalho e de capitais. O PIB para 2026 foi ajustado para 0,7%.", "titulo_pt": "Fitch Ratings mantém classificação de risco do Chile e projeta dívida abaixo de 43% do PIB", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 169707, "titulo": "ITRI touts technological collaboration with the US", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/19/2003864530", "fonte_id": "taipei_times", "data_pub": "2026-09-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ITRI (Instituto Industrial de Tecnologia) destaca a colaboração tecnológica com os Estados Unidos. A instituição enfatiza as parcerias tecnológicas com o país norte-americano.", "titulo_pt": "ITRI destaca colaboração tecnológica com os estados unidos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 169723, "titulo": "Nvidia optimistic despite AI anxieties", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/19/2003864506", "fonte_id": "taipei_times", "data_pub": "2026-09-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia expressa otimismo apesar das preocupações relacionadas à inteligência artificial.", "titulo_pt": "Nvidia otimista apesar das preocupações com a inteligência artificial", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 170190, "titulo": "Chefes de empresas de tecnologia pedem desaceleração da IA — mas o que a China pensa?", "url": "https://www.bbc.com/portuguese/articles/cqgmrly2e9zgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-18T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresários de tecnologia pedem uma desaceleração no desenvolvimento da inteligência artificial devido a preocupações sobre os riscos associados. A rivalidade entre China e Estados Unidos dificulta uma resposta unificada a esses desafios.", "titulo_pt": "Empresários de tecnologia pedem desaceleração da IA — mas o que a China pensa?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 170380, "titulo": "Anthropic selects Accenture as first embedded evaluator to help implement Amodei's slowdown proposal", "url": "https://www.cnbc.com/2026/09/18/anthropic-accenture-ai-safety.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-18T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic escolheu a Accenture como primeiro avaliador integrado para ajudar a implementar a proposta de Amodei de reduzir o ritmo de desenvolvimento de IA. As empresas Anthropic e OpenAI têm sido submetidas a rigoroso questionamento após pesquisadores alertarem sobre o potencial de IA para causar danos catastróficos à humanidade.", "titulo_pt": "Anthropic escolhe Accenture para implementar proposta de Amodei de reduzir o ritmo de desenvolvimento de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 170477, "titulo": "OpenAI and Microsoft knew they were starting a ‘doom loop’ for the web", "url": "https://www.theverge.com/ai-artificial-intelligence/997633/openai-microsoft-chatgpt-ai-new-york-times-doom-loop-theft-google-zero", "fonte_id": "the_verge", "data_pub": "2026-09-18T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Recentes documentos judiciais desvelados pelo New York Times revelam que tanto a OpenAI quanto a Microsoft reconheciam estar iniciando um 'loop de destruição' que poderia prejudicar a web. As empresas descreveram o uso de dados roubados para treinar seus modelos como o maior roubo de trabalho na história humana.", "titulo_pt": "Openai e Microsoft sabiam que estavam iniciando um 'loop de destruição' para a web", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 170476, "titulo": "Here’s How an AI Slowdown Could Actually Be Enforced", "url": "https://www.wired.com/story/heres-how-an-ai-slowdown-could-actually-work/", "fonte_id": "wired", "data_pub": "2026-09-18T19:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mesmo que grandes empresas de IA concordem em uma pausa, garantir que ninguém tente avançar sem permissão pode ser difícil.", "titulo_pt": "Aqui está como uma pausa na IA poderia realmente ser implementada", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 170379, "titulo": "Elon Musk talks up AI safety while fighting regulation in wild week of strange alliances", "url": "https://www.cnbc.com/2026/09/18/after-decade-of-clashes-in-ai-elon-musk-forging-strange-alliances.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-18T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No último semana, Elon Musk concordou com os CEOs da Anthropic e da OpenAI, enquanto foi contradito por Presidente Trump e por Jensen Huang, da Nvidia.", "titulo_pt": "Elon Musk defende segurança da IA enquanto luta contra regulamentação em semana cheia de alianças estranhas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 170312, "titulo": "Why Europe has been absent from the great AI safety debate", "url": "https://www.theguardian.com/technology/2026/sep/18/europe-ai-safety-debate", "fonte_id": "guardian_world", "data_pub": "2026-09-18T18:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa tem medidas que abordam como os consumidores podem interagir com a IA, mas a tecnologia ainda afetará os europeus se os cenários mais pessimistas se concretizarem. O presidente do Banco Central Europeu, Christine Lagarde, propôs duas opções: rejeitar a tecnologia e perder crescimento, ou adotá-la e ficar dependentes de ferramentas desenvolvidas pelos EUA e China. A discussão global sobre a segurança da IA pode tornar essas escolhas menos relevantes se os cenários mais pessimistas se concretizarem.", "titulo_pt": "Por que a Europa tem sido ausente das grandes discussões sobre a segurança da IA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 170478, "titulo": "Virginia governor creates an AI task force and moves to restrain data centers", "url": "https://www.theverge.com/policy/997573/virginia-governor-spanberger-data-center-ai-task-force", "fonte_id": "the_verge", "data_pub": "2026-09-18T18:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A governadora da Virgínia, Abigail Spanberger, criou uma força-tarefa para o AI e estabeleceu uma ordem executiva que proíbe os funcionários do executivo estadual de assinar acordos de não-divulgação. A medida visa dar mais poder às comunidades locais na aprovação de centros de dados e retardar os processos de aprovação em um estado que já abriga a capital mundial dos centros de dados.", "titulo_pt": "Governo da virgínia cria força-tarefa para AI e restringe aprovações de centros de dados", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 170479, "titulo": "Disney’s first CTO is Character.AI’s former CEO", "url": "https://www.theverge.com/entertainment/997555/karandeep-anand-disney-character-ai", "fonte_id": "the_verge", "data_pub": "2026-09-18T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Disney nomeou Karandeep Anand como seu primeiro chefe de tecnologia. Anand, anteriormente CEO da Character.AI, será subordinado ao recém-nomeado executivo da empresa.", "titulo_pt": "Disney nomeia seu primeiro CTO, ex-ceo da Character.Ai", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 169985, "titulo": "Funcionários da Microsoft e da OpenAI temem que IA cometa 'maior roubo de trabalho da história'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/funcionarios-da-microsoft-e-da-openai-temem-que-ia-cometa-maior-roubo-de-trabalho-da-historia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T18:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Documentos judiciais revelaram preocupações significativas dentro da Microsoft e da OpenAI sobre o uso de milhões de artigos jornalísticos para desenvolver sistemas de inteligência artificial. Essa preocupação se relaciona com o medo de que a IA possa cometer o 'maior roubo de trabalho da história'.", "titulo_pt": "Funcionários da Microsoft e da OpenAI temem que IA cometa 'maior roubo de trabalho da história'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170497, "titulo": "Turning Tech Talent Into Leadership Legacy", "url": "https://spectrum.ieee.org/tech-talent-into-leadership-legacy", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-18T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A transição de um cargo técnico ou executivo de nível superior para uma posição de liderança é uma das fases mais desafiadoras em uma carreira de STEM. Isso envolve mudar a mentalidade para o conceito de 'líder de legado', onde o sucesso não é mais medido pelos próprios feitos, mas pela capacidade de inspirar e empoderar outros.", "titulo_pt": "Convertendo talentos técnicos em legado lideresal", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 169081, "titulo": "Ministro das Comunicações abrirá feira sobre tecnologia em SP", "url": "https://veja.abril.com.br/brasil/ministro-das-comunicacoes-abrira-feira-sobre-tecnologia-em-sp/", "fonte_id": "veja", "data_pub": "2026-09-18T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Comunicações, Frederico Siqueira, abrirá a Futurecom 2026, uma feira sobre tecnologia, com um painel focado no Brasil Digital e a participação de líderes do setor.", "titulo_pt": "Ministro das Comunicações abrirá futurecom 2026 em SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 169800, "titulo": "Gavin Newsom is pushing for an AI kill switch", "url": "https://www.theverge.com/policy/997516/california-governor-newsom-ai-kill-switch", "fonte_id": "the_verge", "data_pub": "2026-09-18T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador da Califórnia, Gavin Newsom, está buscando liderar a supervisão de IA no estado, incluindo a possibilidade de exigir um 'botão de desligamento' para modelos avançados, através de um novo decreto executivo. O decreto direciona o estado a formar um grupo de especialistas que deverão apresentar recomendações em duas meses sobre como abordar a questão.", "titulo_pt": "Gavin Newsom quer impulsionar supervisão de IA no estado com 'botão de desligamento'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 170131, "titulo": "Ele ajudou a criar o ChatGPT — e agora constrói uma IA que se recusa a conversar", "url": "https://exame.com/inteligencia-artificial/ele-ajudou-a-criar-o-chatgpt-e-agora-constroi-uma-ia-que-se-recusa-a-conversar/", "fonte_id": "exame", "data_pub": "2026-09-18T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diogo Almeida, cofundador da TypeSafe AI, contribuiu para o desenvolvimento do ChatGPT e Claude. Sua nova startup recebeu investimento de 40 milhões de dólares para criar um modelo de inteligência artificial que não gera texto e se concentra em decisões autônomas sem alucinações.", "titulo_pt": "Ele ajudou a criar o ChatGPT — e agora constrói uma IA que não gera texto", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170132, "titulo": "Filosofia, neurociência e macroeconomia: 3 lentes para decisões de negócios mais complexas", "url": "https://exame.com/carreira/filosofia-neurociencia-e-macroeconomia-3-lentes-para-decisoes-de-negocios-mais-complexas/", "fonte_id": "exame", "data_pub": "2026-09-18T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos em neuroeconomia e incerteza demonstram como fatores humanos e macroeconômicos afetam decisões de investimento, risco e estratégia nas empresas. A filosofia, a neurociência e a macroeconomia oferecem três perspectivas úteis para compreender e melhorar tais decisões complexas.", "titulo_pt": "Filosofia, neurociência e macroeconomia: 3 lentes para decisões de negócios mais complexas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 170485, "titulo": "PAHO: Strengthening El Niño raises growing health risks across the Americas", "url": "https://www.paho.org/en/news/18-9-2026-paho-strengthening-nino-raises-growing-health-risks-across-americas", "fonte_id": "paho", "data_pub": "2026-09-18T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intensificação do El Niño aumenta os riscos à saúde na América Latina e no Caribe. A Organização Pan-Americana da Saúde (PAHO) alerta sobre esses riscos crescentes.", "titulo_pt": "PAHO: intensificação do El Niño aumenta riscos à saúde na américa", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 170387, "titulo": "New cat species found, first in more than 100 years", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/18/new-cat-species-found-first-in-more-than-100-years?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-18T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova espécie de gato foi identificada pela primeira vez em mais de um século. Essa é a primeira descoberta de uma espécie de gato viva em mais de 100 anos.", "titulo_pt": "Nova espécie de gato descoberta, primeira em mais de 100 anos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 170029, "titulo": "Estudo relaciona bactéria que afeta estômago a um em cada cinco casos de câncer colorretal", "url": "https://veja.abril.com.br/saude/estudo-relaciona-bacteria-que-afeta-estomago-a-um-em-cada-cinco-casos-de-cancer-colorretal/", "fonte_id": "veja", "data_pub": "2026-09-18T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo que analisou 43 estudos com dados de 48.694.403 pessoas de todo o mundo relacionou uma bactéria que afeta o estômago a um em cada cinco casos de câncer colorretal. Eliminar a bactéria diminui o risco, mas isso só ocorre após dez anos.", "titulo_pt": "Estudo relaciona bactéria que afeta estômago a um em cada cinco casos de câncer colorretal", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 170486, "titulo": "North Korea's nuclear testing may have triggered hundreds of earthquakes over several years", "url": "https://phys.org/news/2026-09-north-korea-nuclear-triggered-hundreds.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre 2006 e 2017, Coreia do Norte realizou seis testes nucleares subterrâneos em sua vasta instalação de testes em Mount Mantap, na província de North Hamgyong. Geólogos detectaram uma atividade sísmica significativamente maior após o último teste, que persistiu por anos.", "titulo_pt": "Testes nucleares da Coreia do norte podem ter causado centenas de terremotos ao longo de vários anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170498, "titulo": "NASA Invites Media to Albania Artemis Accords Signing Ceremony", "url": "https://www.nasa.gov/news-release/nasa-invites-media-to-albania-artemis-accords-signing-ceremony/", "fonte_id": "nasa_news", "data_pub": "2026-09-18T19:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A República da Albânia vai assinar os Acordos Artemis durante uma cerimônia às 12h de EDT na segunda-feira, 21 de setembro, na sede da NASA em Washington, tornando-se o 73º país assinante. O vice-administrador da NASA, Matt Anderson, será o anfitrião do Ministro para Europa e Assuntos Exteriores da Albânia, Ferit Hoxha, e do Cônsul Geral da Albânia.", "titulo_pt": "NASA convida mídia para cerimônia de assinatura dos acordos Artemis na albânia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 170487, "titulo": "Medieval Chinese skeleton may reveal first evidence of a brutal punishment", "url": "https://phys.org/news/2026-09-medieval-chinese-skeleton-reveal-evidence.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos chineses descobriram um esqueleto de uma mulher datado há aproximadamente 700 anos que pode ser a primeira evidência de uma punição brutal envolvendo a amputação da narina. Até agora, não havia provas fósseis de que o corte da narina era uma prática comum na China medieval.", "titulo_pt": "Esqueleto medieval chinês pode revelar primeiro exemplo de punição brutal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170488, "titulo": "Workplace AI adoption remains slow, informal and uneven, survey finds", "url": "https://phys.org/news/2026-09-workplace-ai-uneven-survey.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A adoção de IA no ambiente de trabalho continua lenta, informal e desigual, conforme constatado pelo terceiro levantamento do estudo AI de Konstanz, que ouviu 1.105 empregados em maio de 2026. A proporção de empregados que utilizam IA no trabalho aumentou apenas de 35% para 38% em comparação com o ano anterior.", "titulo_pt": "Adoção de IA no ambiente de trabalho continua lenta e desigual, aponta estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170489, "titulo": "To read 2,000-year-old burned scrolls, scientists burn their own", "url": "https://phys.org/news/2026-09-year-scrolls-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas obtiveram papiro e canetas de junco do Egito e tinta de carvão tradicional do Japão, e pediram para alguns estudantes do ensino fundamental escreverem linhas de Star Wars, o Velho Testamento e uma citação de uma série de ficção científica dos anos 60, The Outer Limits, no papiro.", "titulo_pt": "Para ler rolhas de papiro de 2.000 anos, cientistas queimam as suas próprias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170490, "titulo": "Power breeds suspicion: In cases of wrongdoing, people point to leaders more quickly", "url": "https://phys.org/news/2026-09-power-suspicion-cases-wrongdoing-people.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos da Universidade da Amsterdã analisaram quase 100.000 conflitos cotidianos no subreddit 'Am I the Asshole?'. Os resultados mostram que pessoas com poder são mais rapidamente acusadas quando ocorrem erros, pois as outras acreditam que elas podem 'fazer o que quiserem'.", "titulo_pt": "Poder gera suspeita: quando algo dá errado, líderes são mais rapidamente acusados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170491, "titulo": "Europe can lower emissions without deindustrializing, say researchers", "url": "https://phys.org/news/2026-09-europe-emissions-deindustrializing.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia se comprometeu a atingir neutralidade climática até 2050, o que exigirá reduções rápidas e significativas das emissões de gases de efeito estufa em todos os setores econômicos.", "titulo_pt": "Europa pode reduzir emissões sem desindustrializar, afirmam pesquisadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170492, "titulo": "Amino acids and a bone mineral may help control magnesium implant breakdown, three student papers suggest", "url": "https://phys.org/news/2026-09-amino-acids-bone-mineral-magnesium.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três teses relacionadas a um mesmo grupo de pesquisa resultaram em publicações científicas em um período de três meses, o que é considerado extremamente raro. Essa situação ocorreu no grupo de Elsebeth Schröder, da Divisão de Física de Dispositivos Quânticos.", "titulo_pt": "Ácidos aminoicos e um mineral ósseo podem auxiliar na regulagem da quebra de implantes de magnésio, sugerem três teses", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170493, "titulo": "Physicists extend the search for quantum black holes at the LHC", "url": "https://phys.org/news/2026-09-physicists-quantum-black-holes-lhc.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos da Universidade da Califórnia em Santa Bárbara estenderam a busca por evidências de microagujeros negros gerados no Grande Colisor de Hádrons (LHC) da Organização Europeia para a Investigação Nuclear (CERN). Este método de busca demonstra uma nova abordagem para a identificação de novas partículas.", "titulo_pt": "Físicos estendem a busca por microagujeros negros no LHC", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170494, "titulo": "Who do you trust in an emergency? Researchers ask people in places hit by extreme weather", "url": "https://phys.org/news/2026-09-emergency-people-extreme-weather.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dia de agosto de 2025, um pastor paquistanês, Abuzar Hussain, estava cuidando de ovelhas e cabras nas encostas de Shijar. Por volta das 18h, um rugido ensurdecedor interrompeu o silêncio do vale.", "titulo_pt": "Quem você confia em uma emergência? Pesquisadores perguntam às pessoas em locais afetados por climas extremos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170495, "titulo": "Why AI is speeding up scientific research but not lab experiments", "url": "https://www.scientificamerican.com/article/why-ai-is-speeding-up-scientific-research-but-not-lab-experiments/", "fonte_id": "scientific_american", "data_pub": "2026-09-18T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório recente da Google, Google DeepMind e M.I.T. revela que os pesquisadores estão utilizando muito a inteligência artificial, mas ela não está melhorando significativamente os experimentos laboratoriais.", "titulo_pt": "Por que a IA está acelerando a pesquisa científica, mas não os experimentos no laboratório", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 170499, "titulo": "NASA-JAXA XRISM Mission Sees Pulsar Gathering Companion’s ‘Wind’", "url": "https://science.nasa.gov/missions/xrism/xrism-sees-pulsar-gathering-companions-wind/", "fonte_id": "nasa_news", "data_pub": "2026-09-18T18:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observara function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
