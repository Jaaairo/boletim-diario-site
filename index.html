ome prices", "url": "https://www.koreaherald.com/article/10937467", "fonte_id": "korea_herald", "data_pub": "2026-11-15T04:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tens of thousands of people marched in more than 30 cities and towns across Portugal on Saturday to protest against rising housing costs. The housing crisis has fueled weeks of demonstrations, with some activists camping in central squares in Lisbon and Porto.", "titulo_pt": "Marcha contra os preços imobiliários atinge portugal", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265203, "titulo": "Zimbabwe’s HIV gains face a test among young people", "url": "https://www.aljazeera.com/news/2026/11/15/zimbabwes-hiv-gains-face-a-test-among-young-people?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T04:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas ferramentas de prevenção oferecem esperança, mas chegar aos jovens continua sendo um desafio.", "titulo_pt": "Zimbábue: avanços contra HIV enfrentam desafio com jovens", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 264920, "titulo": "Cacique Raoini tem boa evolução clínica, mas continua sob monitorização", "url": "https://www.cnnbrasil.com.br/pop/celebridades/cacique-raoini-tem-boa-evolucao-clinica-mas-continua-sob-monitorizacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T01:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cacique Raoini apresenta melhoras no estado de saúde, mas ainda está sob monitorização médica. Não há previsão para alta hospitalar.", "titulo_pt": "Cacique Raoini tem evolução clínica positiva, mas continua sob monitorização", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264921, "titulo": "Família esquece criança de 7 anos em avião após desembarcar em Porto Alegre", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/familia-esquece-crianca-de-7-anos-em-aviao-apos-desembarcar-em-porto-alegre/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T01:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma criança de 7 anos foi esquecida a bordo de um avião após o desembarque no Aeroporto de Porto Alegre. A criança foi encontrada 15 minutos depois pelo time da companhia aérea e entregue à mãe.", "titulo_pt": "Família esquece criança de 7 anos a bordo de avião após desembarque em Porto Alegre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264643, "titulo": "Triple crimen. Cayó otro de los integrantes de la banda que ejecutó los brutales asesinatos de Brenda, Morena y Lara", "url": "https://www.lanacion.com.ar/seguridad/triple-crimen-cayo-otro-de-los-integrantes-de-la-banda-que-ejecuto-los-brutales-asesinatos-de-brenda-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um suspeito envolvido no triple crime que resultou nos assassinatos brutais de Brenda, Morena e Lara foi preso em Lima. A captura envolveu uma operação conjunta entre a Polícia Federal Argentina e a polícia peruana.", "titulo_pt": "Triple crime: outro integrante da banda foi preso", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264527, "titulo": "Advogada que usava brindes 3D para viciar jovens é condenada por tráfico", "url": "https://www.metropoles.com/distrito-federal/advogada-que-usava-brindes-3d-para-viciar-jovens-e-condenada-por-trafico", "fonte_id": "metropoles", "data_pub": "2026-11-14T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A advogada Bruna Calland, junto com seu companheiro Henrique Sampaio, foi condenada por tráfico de drogas após serem flagrados usando brindes 3D para viciar jovens dentro de um apartamento de alto padrão no Sudoeste.", "titulo_pt": "Advogada que usava brindes 3D para viciar jovens é condenada por tráfico", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264597, "titulo": "Protestos tomam conta de Portugal contra crise habitacional", "url": "https://www.dw.com/pt-br/protestos-tomam-conta-de-portugal-contra-crise-habitacional/a-79949804?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-14T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de pessoas protestaram em mais de 30 cidades portuguesas contra a crise habitacional. O país registrou o maior aumento da relação entre preços dos imóveis e renda média na União Europeia nos últimos dez anos.", "titulo_pt": "Protestos tomam conta de Portugal contra crise habitacional", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 264584, "titulo": "França tem novos protestos contra violência policial e custo de vida", "url": "https://www.brasildefato.com.br/2026/11/14/franca-tem-novos-protestos-contra-violencia-policial-e-custo-de-vida/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-14T18:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas protestaram na França neste sábado contra o aumento do custo de vida e um projeto de lei que protege policiais que usam armas. A mobilização faz parte de uma campanha nacional que já dura cinco dias.", "titulo_pt": "França tem novos protestos contra violência policial e aumento do custo de vida", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 264080, "titulo": "Su hijo murió, sus amigos nunca le devolvieron el dinero prestado y quedó en bancarrota: el actor de las mil risas que terminó en un geriátrico", "url": "https://www.lanacion.com.ar/espectaculos/su-hijo-murio-sus-amigos-nunca-le-devolvieron-el-dinero-prestado-y-quedo-en-bancarrota-el-actor-de-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Larry Fine foi um comediante famoso como parte do trio 'Os Três Chiflados', mas enfrentou problemas financeiros após o sucesso diminuir, chegando a ficar em um asilo de idosos. Ele perdeu seu filho, seus amigos não devolveram o dinheiro emprestado e acabou em situação de bancarrota.", "titulo_pt": "Seu filho morreu, seus amigos nunca lhe devolveram o dinheiro emprestado e ele ficou em um asilo: o comediante que se tornou bancarrota", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264240, "titulo": "Lo que el presupuesto no dice en educación", "url": "https://www.ciperchile.cl/2026/11/14/lo-que-el-presupuesto-no-dice-en-educacion/?utm_source=rss&utm_medium=rss&utm_campaign=lo-que-el-presupuesto-no-dice-en-educacion", "fonte_id": "ciper_chile", "data_pub": "2026-11-14T16:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute aspectos da educação que não são abordados no orçamento. O título traduzido para português brasileiro é: O que o orçamento não revela sobre educação.", "titulo_pt": "O que o orçamento não revela sobre educação", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 264897, "titulo": "Sul tem previsão de ciclone fraco e de rápida duração, diz meteorologista", "url": "https://www.cnnbrasil.com.br/nacional/sul/sul-tem-previsao-de-ciclone-fraco-e-de-rapida-duracao-diz-meteorologista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um sistema meteorológico pode atingir áreas do Rio Grande do Sul e Santa Catarina, mas não há previsão de impactos expressivos. O ciclone fraco e de rápida duração deve afetar essas regiões.", "titulo_pt": "Sul tem previsão de ciclone fraco e de rápida duração, diz meteorologista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264911, "titulo": "Em encontro com Lula, Carney promete US$ 400 mi para proteção de florestas", "url": "https://www.cnnbrasil.com.br/internacional/em-encontro-com-lula-carney-promete-us-400-mi-para-protecao-de-florestas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T04:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em encontro com Lula, Carney promete US$ 400 milhões para proteção de florestas durante cúpula da ASEAN nas Filipinas. Entre as discussões estavam o acordo Mercosul-Canadá.", "titulo_pt": "Em encontro com Lula, Carney promete US$ 400 mi para proteção de florestas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264366, "titulo": "Afghanistan’s olive groves give farmers hope", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/15/2003867744", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pomares de oliveiras em Afganistão estão dando esperança aos agricultores locais. Essa atividade agrícola está ajudando a melhorar as condições econômicas das comunidades rurais.", "titulo_pt": "Os pomares de oliveiras dão esperança aos agricultores afegãos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264629, "titulo": "El generoso gesto de Harrison Ford: donó 150 hectáreas de su rancho en Wyoming para proteger la naturaleza", "url": "https://www.lanacion.com.ar/espectaculos/el-generoso-gesto-de-harrison-ford-dono-150-hectareas-de-su-rancho-en-wyoming-para-proteger-la-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Harrison Ford doou 150 hectares de seu rancho em Wyoming para proteger a natureza. O ator blindou legalmente parte de sua propriedade para preservar a biodiversidade local contra especulações comerciais.", "titulo_pt": "A generosa ação de Harrison Ford: doou 150 hectares de seu rancho em Wyoming para proteger a natureza", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264663, "titulo": "Crecida del río El Carmen: gobernador de Atacama pide a Kast decretar estado de emergencia por deshielos", "url": "https://www.latercera.com/nacional/noticia/crecida-del-rio-el-carmen-gobernador-de-atacama-pide-a-kast-decretar-estado-de-emergencia-tras-deshielos/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T21:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma crescente no rio El Carmen levou o governador de Atacama a pedir ao presidente Kast que decretasse estado de emergência devido a deshielos. O fenômeno causou danos em infraestruturas hídricas e deixou famílias isoladas na comuna de Alto do Carmen. A Senapred ativou avisos de alerta SAE e recomendou evitar aproximações à margem do rio.", "titulo_pt": "Crescida no rio El Carmen: governador de Atacama solicita estado de emergência a Kast", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264665, "titulo": "Armada emite aviso por probables trombas marinas entre Arauco y Los Ríos", "url": "https://www.latercera.com/servicios/noticia/armada-emite-aviso-por-probables-trombas-marinas-entre-arauco-y-los-rios/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T21:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Marinha emitiu um aviso para trombas marinas entre as regiões de Arauco e Los Ríos. A alerta está em vigor de 11h00 às 21h00 deste domingo, 15 de novembro.", "titulo_pt": "Marinha emite aviso para trombas marinas entre Arauco e Los Ríos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264786, "titulo": "For Bangladesh and others, climate disasters should not add to debt burdens", "url": "https://www.scmp.com/opinion/asia-opinion/article/3374115/bangladesh-and-others-climate-disasters-should-not-add-debt-burdens", "fonte_id": "scmp", "data_pub": "2026-11-14T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões da COP31, a conferência de mudanças climáticas da ONU realizada em Antalya, Turquia, são cruciais para os países vulneráveis ao clima na Global South, incluindo o Bangladesh, que sofre as consequências das mudanças climáticas sem ter contribuído significativamente para as emissões globais. É fundamental que o financiamento para ação climática chegue a tempo, alcance os destinatários corretos e não aprofunde as dívidas.", "titulo_pt": "Para Bangladesh e outros, desastres climáticos não devem aumentar a carga de dívidas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264596, "titulo": "Agropecuária aposta em solo compartilhado com painéis solares", "url": "https://www.dw.com/pt-br/agropecuária-aposta-em-solo-compartilhado-com-painéis-solares/a-79950021?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-14T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agricultura e a produção solar estão explorando uma nova estratégia chamada agrivoltaica, que promete beneficiar tanto as culturas quanto a geração de energia renovável. No entanto, a adoção dessa técnica ainda é lenta e não é sempre bem-sucedida.", "titulo_pt": "Agropecuária investe em solo compartilhado com painéis solares", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 264929, "titulo": "Mpox ultrapassa mil casos e registra primeira morte no Brasil em 2026", "url": "https://exame.com/brasil/mpox-ultrapassa-mil-casos-e-registra-primeira-morte-no-brasil-em-2026/", "fonte_id": "exame", "data_pub": "2026-11-14T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mpox ultrapassou a marca de mil casos no Brasil em 2026, com a primeira morte registrada. As infecções são concentradas principalmente em São Paulo e Rio de Janeiro, e o governo adquiriu 25 mil doses de vacina para combater a doença.", "titulo_pt": "Mpox atinge mil casos e registra primeira morte no Brasil em 2026", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264574, "titulo": "Amazonas tem 39 cidades sob alerta para qualidade do ar em meio à estiagem", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/amazonas-tem-39-cidades-sob-alerta-para-qualidade-do-ar-em-meio-a-estiagem/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T19:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Amazonas registra 39 cidades sob alerta para a qualidade do ar devido à estiagem. Parintins é a cidade com o pior índice, classificado como péssimo. O estado também declarou emergência em 50 municípios devido à seca, que afetou mais de 165 mil famílias.", "titulo_pt": "Amazonas tem 39 cidades sob alerta para qualidade do ar em meio à estiagem", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264931, "titulo": "COP31: Marcha pelo Clima leva 10 mil às ruas em protesto contra líderes mundiais e inação climática", "url": "https://exame.com/esg/cop31-marcha-pelo-clima-leva-10-mil-as-ruas-em-protesto-contra-lideres-mundiais-e-inacao-climatica/", "fonte_id": "exame", "data_pub": "2026-11-14T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Marcha pelo Clima reuniu cerca de 10 mil pessoas em Antalya, protestando contra líderes mundiais e a inação climática. Os manifestantes carregaram cartazes criticando Trump, Musk, Netanyahu e usaram uma Estátua da Liberdade como símbolo da poluição, percorrendo o centro da cidade por aproximadamente duas horas.", "titulo_pt": "Marcha pelo Clima mobiliza 10 mil pessoas em protesto contra líderes e inação climática", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263942, "titulo": "Mpox avança em outubro e novembro, e Brasil chega a 1.055 casos com 1 morte", "url": "https://www.metropoles.com/saude/mpox-avanca-em-outubro-e-novembro-e-brasil-chega-a-1-055-casos-com-1-morte", "fonte_id": "metropoles", "data_pub": "2026-11-14T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de outubro e até a metade de novembro, foram registrados 552 casos de mpox no Brasil, somando um total de 1.055 casos. A maioria desses casos não é considerada grave.", "titulo_pt": "Mpox avança em outubro e novembro, e Brasil chega a 1.055 casos com 1 morte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264078, "titulo": "La creciente escasez de salmones, un drama en Alaska", "url": "https://www.clarin.com/estados-unidos/la-creciente-escasez-de-salmones-un-drama-en-alaska_0_1piJw77Ozg.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em Alaska, a pesca de arrastre ameaça o salmão, essencial para as comunidades locais. O desequilíbrio causado pelo aquecimento global está agravando a escassez desta espécie. O debate sobre a pesca industrial está se intensificando, enquanto os residentes buscam medidas que protejam o ecossistema sem prejudicar a economia regional.", "titulo_pt": "A crescente escassez de salmão, um drama em Alaska", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}], "meio_ambiente__eventos": [{"titulo": "Ceará declara situação de emergência em 65 cidades por efeitos do El Niño", "sumario": "O estado do Ceará declarou situação de emergência em 65 cidades devido aos efeitos do El Niño. O Ceará decretou situação de emergência em 65 cidades devido ao risco de seca associado ao fenômeno El Niño. O Ceará decretou situação de emergência em 65 municípios para se preparar para possíveis impactos de uma seca intensa em 2027, devido ao El Niño.", "artigos": [{"id": 264564, "titulo": "Ceará declara situação de emergência em 65 cidades por efeitos do El Niño", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ce/ceara-declara-situacao-de-emergencia-em-65-cidades-por-efeitos-do-el-nino/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado do Ceará declarou situação de emergência em 65 cidades devido aos efeitos do El Niño. O governo intensificou o monitoramento hidrológico e planeja parcerias com as prefeituras para garantir a segurança hídrica.", "titulo_pt": "Ceará declara situação de emergência em 65 cidades por efeitos do El Niño", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263906, "titulo": "Ceará decreta situação de emergência em 65 cidades por risco de seca com El Niño", "url": "https://veja.abril.com.br/agenda-verde/ceara-decreta-situacao-de-emergencia-em-65-cidades-por-risco-de-seca-com-el-nino/", "fonte_id": "veja", "data_pub": "2026-11-14T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará decretou situação de emergência em 65 cidades devido ao risco de seca associado ao fenômeno El Niño. A medida, válida por 180 dias, prevê a implementação de obras e serviços emergenciais para enfrentar ameaças ao abastecimento de água e à produção agropecuária.", "titulo_pt": "Ceará decreta situação de emergência em 65 cidades por risco de seca com El Niño", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263948, "titulo": "Ceará decreta situação de emergência em 65 municípios diante dos riscos do El Niño", "url": "https://exame.com/brasil/ceara-decreta-situacao-de-emergencia-em-65-municipios-diante-dos-riscos-do-el-nino/", "fonte_id": "exame", "data_pub": "2026-11-14T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará decretou situação de emergência em 65 municípios para se preparar para possíveis impactos de uma seca intensa em 2027, devido ao El Niño. A medida tem validade de 180 dias.", "titulo_pt": "Ceará decreta situação de emergência em 65 municípios diante dos riscos do El Niño", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}]}], "direitos_humanos": [{"id": 265193, "titulo": "Jordan sentences three men to death by hanging after deadly church attack", "url": "https://www.aljazeera.com/news/2026/11/15/jordan-sentences-three-men-to-death-by-hanging-after-deadly-church-attack?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T08:15:00Z", "idioma": "en", "provavel_dup tes de Trump sobrecarrega tribunais dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264123, "titulo": "Italia multa a Meta con 805 millones de euros por acceder a fotos y datos de 20 millones de usuarios sin consentimiento", "url": "https://www.latercera.com/mundo/noticia/italia-multa-a-meta-con-805-millones-de-euros-por-acceder-a-fotos-y-datos-de-20-millones-de-usuarios-sin-consentimiento/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T14:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Meta foi multada em 805 milhões de euros pela Itália por acessar informações e dados de 20 milhões de usuários sem seu consentimento. A empresa utilizou a função 'Obter sugerências de fotos enquanto navega por Facebook' para coletar essas informações.", "titulo_pt": "Itália multa a Meta com 805 milhões de euros por acessar dados de 20 milhões de usuários sem consentimento", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263704, "titulo": "6-year-old Gaza burn victim caught in Israeli dispute over aid", "url": "https://www.japantimes.co.jp/news/2026/11/14/world/society/gaza-6-year-old-burn-victim/", "fonte_id": "japan_times", "data_pub": "2026-11-14T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Masa Yassin, uma menina de 6 anos que sofreu queimaduras em Gaza, precisa de um novo protetor facial para controlar as cicatrizes, mas Israel está impedindo a importação do plástico necessário para o tratamento.", "titulo_pt": "Menina de 6 anos com queimaduras em Gaza precisa de tratamento, mas israel impede importação de material necessário", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 263590, "titulo": "El proyecto sobre denuncias falsas y la cifra que nadie ha medido", "url": "https://www.ciperchile.cl/2026/11/14/el-proyecto-sobre-denuncias-falsas-y-la-cifra-que-nadie-ha-medido/?utm_source=rss&utm_medium=rss&utm_campaign=el-proyecto-sobre-denuncias-falsas-y-la-cifra-q                   </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
