<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

<script>

o pode continuar a aumentar. Em um desenvolvimento na relação comercial entre Estados Unidos e Canadá, o premier de Ontário, Doug Ford, incentivou uma resolução pacífica das tensões, afirmando que os dois países são os melhores amigos. No entanto, as tensões entre Estados Unidos e Irã persistem, com os Estados Unidos realizando operações militares contra lançadores de foguetes iranianos no Estreito de Ormuz, o primeiro ataque desde julho. O presidente da Venezuela, Nicolás Maduro, e sua esposa, Cilia Flores, foram detidos em uma operação militar dos EUA em Caracas em janeiro, e a informação foi divulgada por Maduro em suas redes sociais. Além disso, a Índia registrou pelo menos dois feridos no ataque dos Estados Unidos, e a Guarda Revolucionária Iraniana prometeu uma resposta.\n\nOs Estados Unidos intensificaram suas atividades militares no Golfo Pérsico, realizando ataques em ilhas iranianas e no Estreito de Ormuz. Em 30 de agosto, os EUA atacaram lançadores de foguetes iranianos no Estreito de Ormuz, marcando a primeira ação direta desde julho. O Irã respondeu com promessas de retaliação, com a Guarda Revolucionária Islâmica afirmando que o ataque resultou em mortes e feridos. Além disso, em 1º de outubro, as forças americanas atingiram dois lançadores iranianos em uma ilha chamada Larak, no Irã, em sua primeira operação de ataque contra o Irã desde julho. Essas ações, juntamente com as promessas de retaliação do Irã, sugerem uma escalada da tensão na região, com ambas as partes acusando-se de cometerem atos estratégicos e mortíferos.", "economia": "O presidente do Federal Reserve indicou que aumentos nas taxas de juros podem ser necessários devido à inflação alta nos Estados Unidos. Em outro desenvolvimento, o Brasil está novamente dependendo de importações de diesel dos Estados Unidos, o que pode levar a preços mais altos, já que o país é o maior fornecedor mundial desse combustível. Além disso, a Agência Fars noticiou uma explosão perto da ilha iraniana de Larak, enquanto o governo brasileiro se prepara para tratar três projetos-chave no Senado, que obtiveram a media sanción na Câmara dos Deputados. O aumento do preço do diesel representa um desafio logístico significativo, especialmente para o transporte de longa distância, onde o combustível pode compor até 40% do custo do frete.", "tecnologia": "A tecnologia continua moldando a sociedade em diversos aspectos, conforme mostram diversos artigos recentes. Um destaque é a pesquisa da Universidade de Queensland, que revelou que copos de papel descartáveis podem liberar partículas de plástico quando aquecidos, levantando questões sobre a sustentabilidade desses produtos. Em outro desenvolvimento, 90% dos empreendedores chilenos já estão utilizando inteligência artificial, com 40% economizando mais de 4 horas por semana, segundo uma pesquisa da ChileConverge. A indústria de jogos também está em destaque, com jogos como GTA VI e Spider-Man 2 em promoção na Amazon. Além disso, o Google Maps nos Estados Unidos alterou o nome do Lago Ontário para 'Lago América', seguindo uma ordem de Donald Trump, enquanto o Google Maps global mantém o nome tradicional. O lançamento do telescópio espacial Nancy Grace Roman, após enfrentar problemas de financiamento, promete avanços significativos na pesquisa de matéria escura e energia escura.", "ciencia": "A NASA lançou o Telescópio Espacial Nancy Grace Roman, avaliado em 4,3 bilhões de dólares, para explorar o universo em busca de informações sobre a energia e a matéria escura, ampliando o campo de visão do Hubble 100 vezes. Este lançamento, realizado no último domingo, é considerado um marco na exploração espacial, permitindo a investigação de exoplanetas, supernovas e fenômenos relacionados à matéria e à energia escura. Em outro avanço na pesquisa científica, a IBM e pesquisadores da Universidade de Chicago realizaram uma computação quântica que superou os métodos clássicos de liderança, utilizando 70 qubits lógicos corrigidos de erros e concluindo a tarefa em aproximadamente 15 minutos. Este resultado inédito forneceu evidências estatísticas de que o resultado foi confiável, indicando um passo significativo em direção a uma computação quântica mais eficiente. Além disso, cientistas descobriram marcas de um mamífero gigante, conhecido como 'rato-cão', que vivia há 130 milhões de anos na Formação Botucatu, no Brasil, indicando que os mamíferos eram maiores do que se supunha durante a era dos dinossauros.", "cultura": "João Moreira Salles ministra uma 'masterclass' em um festival de documentários que se estende até o próximo domingo, oferecendo aos participantes uma oportunidade única de aprendizado com o realizador. A novela turca 'Roupa Suja', ambientada em um condomínio de luxo em Istambul, é um dos destaques na programação televisiva, explorando temas de mistério e diferenças de classe. A cantora Olivia Rodrigo arrecadou US$ 20 milhões com a primeira edição do festival Daisy Chain Fields, dobrando o valor inicial de US$ 10 milhões graças a um compromisso de doação de Melinda French Gates, destacando-se como um evento comunitário e de apoio a mulheres. Além disso, a novela turca 'Roupa Suja' é um dos destaques na TV, enquanto a obra de Dolly Parton foi sepultada perto do seu marido falecido, encerrando sua vida artística. O festival de música Creamfields no Reino Unido, apesar das condições climáticas adversas, reuniu uma multidão diversificada, demonstrando a paixão pela cultura festivaleira inglesa.", "sociedade": "O Nepal intensifica esforços para resgatar vítimas das enchentes, com mais de 2 mil nomes de desaparecidos registrados. Em Santa Catarina, temporais causaram emergências e feridos, enquanto no Rio Grande do Sul, ocorreram feridos. No Rio de Janeiro, um tiroteio na Zona Oeste resultou em quatro mortos e o sequestro de 14 ônibus. Na Venezuela, comunidades locais assumem a gestão de suas vidas em experiências de autogestão territorial. No Brasil, a transparência dos indicadores de desempenho dos hospitais privados é ampliada para aumentar a confiança dos pacientes. Além disso, uma parlamentar sul-coreana, nomeada ministra da igualdade de gênero, defende a renda básica. Empresas como a Enel dobram seus investimentos socioambientais no Brasil.", "meio_ambiente": "O Nepal enfrenta uma crise sem precedentes devido ao colapso de gelo na Cordilheira dos Himalaias, com o número de mortos chegando perto de 800, conforme informado pelas autoridades. Paralelamente, fortes chuvas na região sul do Brasil e as enchentes no Sul do país aumentaram o risco de alagamentos e deslizamentos de terra, especialmente na Serra Gaúcha, Planalto Norte e Missões. Além disso, grileiros estão invadindo áreas de preservação no Distrito Federal, ameaçando importantes nascentes de água. O aquecimento global alterou a relação entre o Oceano Pacífico e o Índico, afetando um padrão climático usado para prever condições meteorológicas. No Brasil, a escassez de água e as mudanças climáticas estão motivando comunidades indígenas a restaurar sistemas hídricos antigos, que foram construídos há centenas de anos, para enfrentar a seca.", "direitos_humanos": "Em setembro, o Supremo Tribunal Federal (STF) julgará questões relacionadas a licença para mães adotivas, recusa de transfusão sanguínea, planos de saúde para idosos, gratuidade na Justiça do Trabalho e recusa de tratamento médico. Em outro desenvolvimento, Israel ameaçou expulsar palestinos por voar kites em Gaza, levando a denúncias da Amnesty International. O governo do Paquistão suspendeu oito funcionários após um incêndio em uma unidade materna resultar na morte de 14 bebês. Em El Obeid e nas duas acampamentos próximos, as condições humanitárias se agravaram devido ao conflito entre as Forças Armadas Sudanêsas e a Milícia Rapid Support Forces (RSF), com mais de 15.000 famílias chegando desde julho. Além disso, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses na Cisjordânia em dezesseis meses após outubro de 2023. Em um evento isolado, uma mulher negra levantou o punho em protesto contra neonazistas em Estocolmo, Suécia, em 2016, com o incidente sendo lembrado dez anos depois em um contexto de mudanças sociais."}, "resumo_do_dia": {"politica_nacional": [{"id": 134203, "titulo": "Respeita a minha dor, diz Raquel Lyra sobre cartaz que cita marido", "url": "https://www.poder360.com.br/poder-eleicoes/respeita-a-minha-dor-diz-raquel-lyra-sobre-cartaz-que-cita-marido/", "fonte_id": "poder360", "data_pub": "2026-08-30T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Raquel Lyra afirmou que deve ser respeitada em relação à sua dor após imagens circularem nas redes sociais acusando-a de matar seu companheiro para vencer as eleições de 2022. João Campos, que é seu vice-governador, saiu em sua defesa.", "titulo_pt": "Raquel Lyra pede respeito à sua dor sobre cartaz que cita marido", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 134194, "titulo": "PF apura existência de gabinete de ódio ligado à governadora de Pernambuco", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/pf-apura-existencia-de-gabinete-de-odio-ligado-a-governadora-de-pernambuco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-30T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga a existência de um 'gabinete do ódio' associado à governadora de Pernambuco, Raquel Lyra (PSD), que está concorrendo à reeleição.", "titulo_pt": "PF investiga existência de gabinete do ódio ligado à governadora de Pernambuco", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 134234, "titulo": "Hackers invadem sites do GDF e exibem artigo com crítica a Lula", "url": "https://www.metropoles.com/distrito-federal/na-mira/hackers-invadem-sites-do-gdf-e-exibem-artigo-com-critica-a-lula", "fonte_id": "metropoles", "data_pub": "2026-08-30T20:46:00Z", "idioma Brasil", "classe": "B"}, {"id": 134195, "titulo": "Suplente de Marina promove encontros com centrais para mobilizar apoio à ex-ministra", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/suplente-de-marina-promove-encontros-com-centrais-para-mobilizar-apoio-a-ex-ministra.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-30T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antonio Neto, suplente na chapa de Marina Silva (Rede) e sindicalista do PDT, está realizando dez encontros regionais com dirigentes sindicais e do movimento popular para mobilizar apoio à ex-ministra do Meio Ambiente.", "titulo_pt": "Suplente de Marina promove encontros com centrais para mobilizar apoio à ex-ministra", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 134244, "titulo": "MPF dá parecer para proibir imagem de Jair Bolsonaro em material de campanha em São Paulo", "url": "https://www.brasildefato.com.br/2026/08/30/mpf-da-parecer-para-proibir-imagem-de-jair-bolsonaro-em-material-de-campanha-em-sao-paulo/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-30T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria Regional Eleitoral em São Paulo (PRE-SP) emitiu um parecer favorável à candidata Duda Hidalgo (PT), que havia representado contra a utilização da imagem de Jair Bolsonaro em materiais de campanha de Lucas Bove (PL). O Ministério Público Eleitoral concluiu que a propaganda de Bove viola as regras eleitorais.", "titulo_pt": "MPF aprova proibição de uso de imagem de Bolsonaro em material de campanha de bove em São Paulo", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 134267, "titulo": "O efeito Trump: eleições adicionam novos riscos às ações que o governo possui", "url": "https://www.infomoney.com.br/mercados/o-efeito-trump-eleicoes-adicionam-novos-riscos-as-acoes-que-o-governo-possui/", "fonte_id": "infomoney", "data_pub": "2026-08-30T19:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições de meio de mandato e ações judiciais contra o governo podem aumentar os riscos para as ações das estatais. O 'Trump put' das estatais pode estar prestes a terminar.", "titulo_pt": "O efeito Trump: eleições elevam riscos para ações das estatais", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 134245, "titulo": "Flávio recebe ministro de El Salvador em SP e defende política marcada por violações de direitos humanos", "url": "https://www.brasildefato.com.br/2026/08/30/flavio-recebe-ministro-de-el-salvador-em-sp-e-defende-politica-marcada-por-violacoes-de-direitos-humanos/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-30T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência da República, se reuniu com o ministro salvadorenho Gustavo Villatoro, sobre o modelo de segurança pública do país. O encontro ocorreu em São Paulo e foi marcado pelo interesse de Flávio Bolsonaro no sistema de segurança pública de El Salvador.", "titulo_pt": "Flávio bolsonaro recebe ministro de El Salvador em SP e discute política de segurança", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 134205, "titulo": "Flávio divulga vídeo de IA com Lulinha em jatinho e petistas presos", "url": "https://www.poder360.com.br/poder-eleicoes-2026/flavio-divulga-video-de-ia-com-lulinha-em-jatinho-e-petistas-presos/", "fonte_id": "poder360", "data_pub": "2026-08-30T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo produzido com inteligência artificial mostra Flávio Bolsonaro ao lado de Lulinha (apelido de Lúcia Vânia, filha de Lula) em um jatinho, enquanto uma música é tocada. A mensagem do vídeo afirma que agora o Brasil 'faz F de Flávio'.", "titulo_pt": "Flávio divulga vídeo de IA com Lulinha em jatinho e petistas presos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 134215, "titulo": "Petista se irrita com ato de ACM Neto e diz que mulher não pode ser usada como estratégia eleitoral", "url": "https://veja.abril.com.br/politica/petista-se-irrita-com-ato-de-acm-neto-e-diz-que-mulher-nao-pode-ser-usada-como-estrategia-eleitoral/", "fonte_id": "veja", "data_pub": "2026-08-30T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ivoneide Caetano criticou a exposição de corpos femininos em campanhas eleitorais, considerando que isso precisa ser repudiado e representa uma visão ultrapassada sobre as mulheres.", "titulo_pt": "Petista critica uso de mulheres em campanhas eleitorais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134288, "titulo": "Zema defende ampliação do Seguro Agrícola em agenda com agricultores no RS", "url": "https://www.cnnbrasil.com.br/eleicoes/zema-defende-ampliacao-do-seguro-agricola-em-agenda-com-agricultores-no-rs/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato à Presidência Zema defendeu a ampliação do Seguro Agrícola durante uma agenda com agricultores no Rio Grande do Sul. Ele afirmou que produtores afetados pelas chuvas no estado não receberam cobertura do governo.", "titulo_pt": "Zema defende ampliação do Seguro Agrícola em agenda com agricultores no RS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134216, "titulo": "Em aceno ao PIB, Lula oferece jantar a empresários e banqueiros no Alvorada", "url": "https://veja.abril.com.br/politica/em-aceno-ao-pib-lula-oferece-jantar-a-empresarios-e-banqueiros-no-alvorada/", "fonte_id": "veja", "data_pub": "2026-08-30T19:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula ofereceu um jantar para empresários e banqueiros no Palácio Alvorada. Além dele, participarão Edinho Silva e os ministros Dario Durigan (Fazenda) e Esther Dweck (Gestão).", "titulo_pt": " nunciou que promete retaliar o ataque.", "titulo_pt": "EUA atacam ilha iraniana e marcam 1ª ofensiva em mais de um mês", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134469, "titulo": "US must get troops out of Gulf, former counterterrorism chief says", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/us-must-get-troops-out-gulf-former-counterterrorism-chief-says", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-diretor do Centro Nacional Antiterrorismo dos EUA, Joseph Kent, aconselhou Washington a retirar imediatamente suas tropas do Golfo após o ataque a uma ilha do Irã. Kent alertou que o envolvimento militar pode acelerar a escalada da tensão.", "titulo_pt": "EUA devem retirar tropas do golfo, ex-chefe antiterrorismo diz", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 134397, "titulo": "Irán acusa a EE.UU. de atacar isla de Larak y promete represalias: reporta muertos y heridos", "url": "https://www.latercera.com/mundo/noticia/iran-acusa-a-eeuu-de-atacar-isla-de-larak-y-promete-represalias-reporta-muertos-y-heridos/", "fonte_id": "la_tercera", "data_pub": "2026-08-30T21:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Irã acusa Estados Unidos de atacar a ilha de Larak e promete represalias, relatando mortos e feridos. Um funcionário americano afirmou que o alvo foram dois lançadores da Guarda Revolucionária iraniana que se preparavam para deslocar minas navais para o Estreito de Ormuz.", "titulo_pt": "Irã acusa EUA de atacar ilha de Larak e promete represalias", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 134440, "titulo": "Hikers feared missing after flash flooding hits Grand Canyon", "url": "https://www.bbc.co.uk/news/articles/clylkjyez1do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-30T21:32:00Z", "idioma": "en", "provavel_duplicata_de": ge", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete palestinos foram feridos em al-Mughayyir, um vilarejo ocupado no Vale do Jordão, próximo a Ramallah, com a maioria dos feridos sendo atingidos por balas reais. Os residentes relataram que as forças israelenses que realizaram uma operação no vilarejo após o ataque dos colonos israelenses se retiraram para a entrada do vilarejo, que está atualmente bloqueada e cercada.", "titulo_pt": "Sete feridos em al-mughayyir enquanto forças israelenses cercam o vilarejo", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 134439, "titulo": "US strikes Iranian launchers on Larak Island in first known attack in weeks", "url": "https://www.bbc.co.uk/news/articles/cx2z72x5z1po?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-30T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a Irã, um ataque dos Estados Unidos a lançadores em Larak Island causou mortes civis. Este é o primeiro ataque conhecido dos Estados Unidos contra a Irã desde julho.", "titulo_pt": "Ataque dos EUA a lançadores iranianos em Larak Island é o primeiro desde julho", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 134480, "titulo": "Ukraine’s ex-defence minister touts ‘new history’ in war against Russia with planned tech fund", "url": "https://www.ft.com/content/c9d10aeb-163e-46a3-b7ca-376ce6be9f8e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-30T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mykhailo Fedorov, ex-ministro ucraniano da Defesa, busca capital ocidental para criar e gerenciar empresas de desenvolvimento de armas, que ele acredita serem essenciais para resistir à Rússia.", "titulo_pt": "Ex-ministro de defesa da Ucrânia promove 'nova história' na guerra contra a Rússia com fundo tecnológico planejado", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 134346, "titulo": "Nepal Turns to Mass Burials, as Thousands Remain Missing from Floods", "url": "https://www.nytimes.com/2026/08/30/world/asia/nepal-floods-mass-burials-missing.html", "fonte_id": "nyt_world", "data_pub": "2026-08-30T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas ainda estão desaparecidas após as inundações em Nepal, e a procura entre os mortos revelou apenas uma pequena parte dessas pessoas. O número de mortos pode continuar aumentando nos próximos dias.", "titulo_pt": "Nepal adota enterros em massa, com milhares ainda desaparecidos das inundações", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 134454, "titulo": "Israeli strike kills 3-year-old child in Gaza", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/30/israeli-strike-kills-3-year-old-child-in-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque letal israelense em Deir el-Balah resultou na morte de dois palestinos, incluindo um menino de 3 anos.", "titulo_pt": "Ataque israelense mata criança de 3 anos em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 134080, "titulo": "Ministry relaxes investment subsidy regulations", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/31/2003863419", "fonte_id": "taipei_times", "data_pub": "2026-08-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério relaxou as regulamentações do subsídio de investimento. Essa mudança visa facilitar o processo de obtenção de subsídios para investimentos.", "titulo_pt": "Ministério relaxa regulamentações de subsídio de investimento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 134096, "titulo": "Fed chair signals rate hikes might be pt": "Sinal caindo? Veja seleção de roteadores Wi-Fi em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 134498, "titulo": "'Cut-to-fuse' strategy: A new route for molecular skeletal editing", "url": "https://phys.org/news/2026-08-fuse-strategy-route-molecular-skeletal.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reestruturação de uma molécula sem precisar reconstruí-la do zero é um objetivo cada vez mais importante na química orgânica moderna. A edição esquelética é uma abordagem que auxilia os químicos a explorar novas estruturas químicas e simplificar a síntese de moléculas com potenciais aplicações farmacêuticas.", "titulo_pt": "Estratégia 'cut-to-fuse': um novo caminho para a edição esquelética molecular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134283, "titulo": "‘Rato-cão’ gigante de 130 milhões de anos vivia no Brasil na Formação Botucatu, descobrem cientistas", "url": "https://www.cnnbrasil.com.br/ciencia/rato-cao-gigante-de-130-milhoes-de-anos-vivia-no-brasil-na-formacao-botucatu-descobrem-cientistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram marcas de um mamífero gigante, conhecido como 'rato-cão', que vivia há 130 milhões de anos na Formação Botucatu, Brasil. Essas descobertas indicam que os mamíferos eram maiores do que se supunha durante a era dos dinossauros.", "titulo_pt": "Gigante 'rato-cão' de 130 milhões de anos era maior do que se pensava, revelam cientistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134499, "titulo": "Tides can be mapped much more locally using a new method based on satellite images", "url": "https://phys.org/news/2026-08-tides-locally-method-based-satellite.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova metodologia permite mapear as marés de forma mais localizada, utilizando imagens de satélite. A altura da maré em baías pode variar até um metro entre locais a poucos quilômetros de distância.", "titulo_pt": "Marés podem ser mapeadas de forma mais localizada usando nova metodologia com imagens de satélite", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134504, "titulo": "Trump calls in to NASA press conference to celebrate launch of Roman Space Telescope, a mission he tried to cancel", "url": "https://www.space.com/space-exploration/trump-calls-in-to-nasa-press-conference-to-celebrate-launch-of-roman-space-telescope-a-mission-he-tried-to-cancel", "fonte_id": "space_com", "data_pub": "2026-08-30T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump interrompeu uma conferência de imprensa da NASA hoje (30 de agosto) para parabenizar a equipe do Telescópio Espacial Nancy Grace Roman por um lançamento bem-sucedido. Este foi um projeto que Trump havia tentado cancelar no passado.", "titulo_pt": "Trump interrompe conferência da NASA para comemorar lançamento do telescópio Roman, projeto que tentou cancelar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 134505, "titulo": "'What a glorious dawn launch': Why the Roman Space Telescope's picture-perfect liftoff beyond Earth is such a big deal", "url": "https://www.space.com/astronomy/what-a-glorious-dawn-launch-why-the-roman-space-telescopes-picture-perfect-liftoff-beyond-earth-is-such-a-big-deal", "fonte_id": "space_com", "data_pub": "2026-08-30T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A decolagem perfeita da Telescópio Espacial Romano além da atmosfera terrestre gerou grande interesse. A frase 'We're just about to set foot off into the unknown' sugere que a missão marca o início de uma exploração desconhecida.", "titulo_pt": "Que alvorecer glorioso: por que a decolagem perfeita do telescópio espacial romano é um grande evento", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 134497, "titulo": "STAT+: FDA approves Protagonist and Takeda’s drug for rare blood cancer", "url": "https://www.statnews.com/2026/08/30/fda-approves-mimrylo-takeda-protagonist-treatment-for-polycythemia-vera/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-30T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou o medicamento Mimrylo, desenvolvido pela Takeda e Protagonist, para o tratamento da policitemia vera, uma doença rara do sangue.", "titulo_pt": "FDA aprova medicamento para doença rara do sangue", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 134500, "titulo": "As super El Nino strengthens, study suggests that climate change is intensifying El Ninos", "url": "https://phys.org/news/2026-08-super-el-nino-climate-ninos.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo sugere que El Niños, fenômenos climáticos naturais que aumentam as temperaturas globais de tempos em tempos, estão se intensificando devido ao aquecimento global causado pelo homem.", "titulo_pt": "Estudo sugere que El niños estão se intensificando devido ao aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 133990, "titulo": "NASA launches $4.3bn Roman Telescope to uncover universe’s hidden secrets", "url": "https://www.aljazeera.com/news/2026/8/30/nasa-launches-4-3bn-roman-telescope-to-uncover-universes-hidden-secrets?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou o telescópio Roman, avaliado em $4,3 bilhões, usando um foguete Falcon Heavy da SpaceX para explorar o universo em busca de informações sobre a energia e a matéria escuras.", "titulo_pt": "NASA lança plicata_de": null, "texto_pt": "O novo telescópio da NASA foi lançado no domingo (30) com o objetivo de explorar o espaço e ajudar os astrônomos a investigar mistérios relacionados à energia escura. O equipamento terá um campo de visão 100 vezes maior que o Hubble.", "titulo_pt": "Novo telescópio da Nasa terá campo de visão 100 vezes maior que o Hubble; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134120, "titulo": "Tropical Storm Karina strengthens into a hurricane in the Pacific, could be a major storm this week", "url": "https://phys.org/news/2026-08-tropical-storm-karina-hurricane-pacific.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tropical Storm Karina se fortaleceu em uma furacão no Oceano Pacífico e pode se tornar uma tempestade de grande magnitude nesta semana, conforme previsto pelos meteorologistas. O centro do ciclone estava a uma distância significativa do continente e não representava ameaça para a terra.", "titulo_pt": "Tropical Storm Karina se fortalece em furacão no pacífico e pode se tornar uma grande tempestade esta semana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134121, "titulo": "NASA's newest Roman space telescope launches on a quest to explore the hidden universe", "url": "https://phys.org/news/2026-08-nasa-roman-space-telescope-quest.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova telescopeira do NASA, Roman, foi lançada no último domingo com o objetivo de buscar planetas fora do sistema solar, explorar a energia escura e mapear o cosmos de maneira inédita.", "titulo_pt": "Nasa lança sua nova telescopeira Roman em busca de planetas e mistérios do universo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134122, "titulo": "New method tests magnet-powered braking for safer, more reusable spacecraft reentry", "url": "https://phys.org/news/2026-08-method-magnet-powered-safer-reusable.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T15:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Metropolitana de Tóquio desenvolveram um novo sistema para testar o aerobreaking magneto-hidrodinâmico de naves espaciais ao reentrar na atmosfera. O sistema utiliza um forte campo magnético gerado por um electromagneto para simular a reentrada de uma pequena cápsula espacial.", "titulo_pt": "Novo método testa frenagem magnética para reentrada segura e mais reutilizável de naves espaciais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134132, "titulo": "1.4-million-year-old footprints reveal a surprisingly large human relative", "url": "https://www.sciencedaily.com/releases/2026/08/260829035221.htm", "fonte_id": "science_daily", "data_pub": "2026-08-30T15:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Achados de 1,4 milhão de anos em Kenia indicam que oito Paranthropus boisei podem ter viajado juntos, com alguns atingindo tamanhos corporais surpreendentemente grandes, humanóides. Os rastros oferecem uma rara visão de seu comportamento social e sugerem que essas espécies extintas de humanos podem ter vivido em grupos mais complexos do que se pensava anteriormente.", "titulo_pt": "Rastros de 1,4 milhão de anos revelam um grupo de humanos ancestrais surpreendentemente grandes", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 134131, "titulo": "This strange “spacetime crystal” can suddenly become a black hole", "url": "https://www.sciencedaily.com/releases/2026/08/260829035225.htm", "fonte_id": "science_daily", "data_pub": "2026-08-30T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos matematicamente descreveram um 'crystal de espaço-tempo' estranho que pode se dissolver ou colapsar em um microscópico buraco negro após uma pequena alteração na energia. Este avanço m/presented/news/hong-kong/education/topics/innovating-advance-humanity/article/3365144/social-transformation-sands?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma margem sudeste do Deserto de Tengger, onde dunas podem chegar a 30 metros de altura e avançarem significativamente a cada ano, um esforço de reflorestamento privado está tentando algo além da plantação de árvores. Fundador de Malan Lake em Alxa, Inner Mongolia, o Sr. YUEN Shu Wah está testando se a restauração do deserto pode ser bem-sucedida redesignando não apenas os paisagens, mas também os meios de subsistência e a governança.", "titulo_pt": "Transformação social nas areias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134054, "titulo": "FROM PATIENTS TO CITIZENS: RETHINKING SCHIZOPHRENIA CARE IN HONG KONG", "url": "https://www.scmp.com/presented/news/hong-kong/education/topics/innovating-advance-humanity/article/3365123/patients-citizens-rethinking-schizophrenia-care-hong-kong?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Hong Kong, cerca de 40.000 pessoas vivem com esquizofrenia. O sistema local está focado em estabilizar os sintomas, mas após a sua controle, surge a questão do que as pessoas retornam para suas vidas.", "titulo_pt": "De pacientes a cidadãos: refletir sobre o cuidado da esquizofreniática em HONG KONG", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 134214, "titulo": "Onda de calor dispara termômetros em São Paulo nesta segunda-feira, 31, e Sul tem sinal de alerta para chuvas", "url": "https://veja.abril.com.br/agenda-verde/onda-de-calor-dispara-termometros-em-sao-paulo-nesta-segunda-feira-31-e-sul-tem-sinal-de-alerta-para-chuvas/", "fonte_id": "veja", "data_pub": "2026-08-30T20 Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas de inundações foram enviados por telefone aos residentes durante a manhã de domingo, enquanto trabalhadores de resgate tentavam evacuar uma rota principal que conecta Katmandu a uma área severamente afetada pelas inundações de quarta-feira.", "titulo_pt": "Nepal avisa sobre possíveis inundações adicionais enquanto comunidades lidam com destruição e aumento do número de mortos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 133084, "titulo": "Grileiros avançam sobre berço de nascentes em área de preservação do DF", "url": "https://www.metropoles.com/distrito-federal/grileiros-avancam-sobre-berco-de-nascentes-em-area-de-preservacao-do-df", "fonte_id": "metropoles", "data_pub": "2026-08-30T05:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região próxima ao Privê Lago Norte II e vizinha da Serrinha do Paranoá tem importante papel hídrico e é alvo de invasões há anos.", "titulo_pt": "Grileiros avançam sobre berço de nascentes em área de preservação do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 134399, "titulo": "Tres imputados vinculados a explotación sexual de una menor de edad en Talca quedan en prisión preventiva", "url": "https://www.latercera.com/nacional/noticia/tres-imputados-vinculados-al-comercio-sexual-de-una-menor-de-edad-en-talca-quedan-en-prision-preventiva/", "fonte_id": "la_tercera", "data_pub": "2026-08-30T21:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram vinculadas à exploração sexual de uma menor em Talca e permanecem em prisão preventiva. A vítima foi resgatada no dia 26 de agosto, durante as detenções e buscas.", "titulo_pt": "Três acusados de exploração sexual de menor em Talca permanecem em prisão preventiva", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 134022, "titulo": "Red Cross transfers freed Palestinian detainees to Gaza's Nasser Hospital", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/red-cross-transfers-freed-palestinian-detainees-gazas-nasser-hospital", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Internacional da Cruz Vermelha (ICRC) transferiu 13 detidos palestinos libertados da fronteira de Kerem Shalom para o Hospital Nasser em Gaza, ajudando também na reunião deles com suas famílias. O ICRC afirmou que tem sido negado acesso a detidos em instalações de detenção israelenses desde outubro de 2023 e pediu às autoridades israelenses que divulguem as localizações e permitam visitas.", "titulo_pt": "Icrc transfere detidos palestinos libertados para Hospital de Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133999, "titulo": "Rohingya crisis: Aid falls and hope fades", "url": "https://www.aljazeera.com/video/talk-to-al-jazeera/2026/8/30/rohingya-crisis-aid-falls-and-hope-fades?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O representante da UNHCR em Bangladesh, Ivo Freisen, alerta que a diminuição da assistência está diminuindo as esperanças dos refugiados rohingya.", "titulo_pt": "Crise rohingya: ajuda diminui e esperança se esvai", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134064, "titulo": "Backlash grows after Hong Kong authorities seize second ‘fighting dog’ in week", "url": "https://www.scmp.com/news/hong-kong/society/article/3365764/backlash-grows-after-hong-kong-authorities-seize-second-fighting-dog-week?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Hong Kong enfrentam crescente rejeição após apreender um 'cão de luta' devido a uma denúncia de vizinho e detê-lo para avaliação comportamental. Esta é a segunda apreensão de cão com linhagem de pit bull na semana, ocorrendo no contexto de maior preocupação pública sobre a gestão canina, devido a uma série de ataques recentes, incluindo um em que uma mulher foi mordida e posteriormente encontrada morta.", "titulo_pt": "Rejeição cresce após autoridades de Hong Kong apreenderem segundo 'cão de luta' em uma semana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133484, "titulo": "Pakistan suspends 8 officials after maternity ward fire kills 14 infants", "url": "https://www.scmp.com/news/asia/south-asia/article/3365749/pakistan-suspends-8-officials-after-maternity-ward-fire-kills-14-infants?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Paquistão suspendeu oito funcionários após um incêndio em uma unidade materna de um hospital na capital do país resultar na morte de 14 bebês. Um relatório preliminar indicou que o fogo consumiu a unidade em aproximadamente dois minutos após as 6h30 de quarta-feira, com apenas um dos 15 bebês sob cuidado salvo por uma enfermeira.", "titulo_pt": "Paquistão suspende 8 funcionários após incêndio em unidade materna matar 14 bebês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133807, "titulo": "Granjas de bots y la extrema derecha", "url": "https://www.ciperchile.cl/2026/08/30/granjas-de-bots-y-la-extrema-derecha/?utm_source=rss&utm_medium=rss&utm_campaign=granjas-de-bots-y-la-extrema-derecha", "fonte_id": "ciper_chile", "data_pub": "2026-08-30T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto aborda o tema das granjas de bots e a extrema direita. Não há detalhes adicionais sobre o conteúdo do artigo.", "titulo_pt": "Granjas de bots e a extrema direita", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 133454, "titulo": "Killing of Palestinian children and teens by Israel surges in West Bank", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/west-bank-palestinian-children-teens-israel/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezesseis meses após outubro de 2023, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses na Cisjordânia.", "titulo_pt": "Evolução no número de crianças e adolescentes palestinos mortos por forças israelenses na cisjordânia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 134035, "titulo": "Some migrants ready to pack bags fearing far-right win in east German state", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/politics/east-germany-migrants-far-right-afd/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partido anti-imigrante, islâmofóbico e pró-Rússia, AfD está prestes a vencer na estado de Saxe-Anhalt, com a possibilidade de conquistar sua primeira maioria governamental.", "titulo_pt": "Alguns imigrantes prontos para embalar suas malas diante de vitória da extrema-direita no estado alemão de saxe-anhalt", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 133105, "titulo": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "url": "https://www.cnnbrasil.com.br/politica/stf-julga-licenca-para-maes-adotivas-e-recusa-de-transfusao-em-setembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em setembro, o Supremo Tribunal Federal (STF) julgará questões relacionadas a licença para mães adotivas, recusa de transfusão sanguínea, planos de saúde de idosos, gratuidade na Justiça do Trabalho e recusa de tratamento médico.", "titulo_pt": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133277, "titulo": "A lone Black woman’s defiance of Swedish neo-Nazis, 10 years on", "url": "https://www.theguardian.com/world/2026/aug/30/sweden-neo-nazi-resistance-2016-tess-asplund-far-right", "fonte_id": "guardian_world", "data_pub": "2026-08-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2016, Tess Asplund, uma mulher negra sozinha, levantou o punho em protesto contra uma parada de neonazistas em Estocolmo. Dez anos depois, ela vê a foto como um sinal dos mudanças na sociedade sueca, especialmente com a ascensão do extremismo de direita nas eleições.", "titulo_pt": "A defesa sozinha de uma mulher negra contra neonazistas, 10 anos depois", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133269, "titulo": "Humanitarian crisis worsening in refuge for civilians fleeing Sudan’s civil war", "url": "https://www.theguardian.com/world/2026/aug/30/humanitarian-crisis-worsening-refuge-civilians-sudan-el-obeid", "fonte_id": "guardian_world", "data_pub": "2026-08-30T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As condições humanitárias na cidade de El Obeid e nas duas acampamentos próximos estão se agravando, com mais pessoas chegando todos os dias devido ao conflito entre as Forças Armadas Sudanêsas e a Milícia Rapid Support Forces (RSF). Segundo a ONU, mais de 15.000 famílias chegaram desde julho, somando-se a mais de 200.000 que chegaram no primeiro semestre do ano, de acordo com os dados do governo.", "titulo_pt": "Situação humanitária se agrava em refúgio para civis que fogem da guerra no sudão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133417, "titulo": "Amnesty urges action after Katz threatens expulsions over Gaza kites", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/amnesty-urges-action-after-katz-likens-gaza-kites-drones", "fonte_id": "middle_east_eye", "data_pub": "2026-08- s em silwad", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133403, "titulo": "Online anti-Muslim backlash collides with different reality in South Africa", "url": "https://www.aljazeera.com/news/2026/8/30/online-anti-muslim-backlash-collides-with-different-reality-in-south-africa?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T00:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A retórica anti-muçulmana online está se intensificando, mas a realidade no chão revela uma história mais complexa.", "titulo_pt": "Contradição entre retórica anti-muçulmana online e realidade no chão na áfrica do sul", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 134073, "fonte_id": "taipei_times", "titulo": "Beware of China’s long-arm acts: MAC", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/31/2003863405", "data_pub": "2026-08-31T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Atenção às ações de longo alcance da China: MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 134074, "fonte_id": "taipei_times", "titulo": "US testing Harpoon missiles Taiwan purchased", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/31/2003863406", "data_pub": "2026-08-31T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "EUA testam mísseis Harpoon adquiridos por Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 134078, "fonte_id": "taipei_times", "titulo": "Military updates arsenal with automated systems", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/31/2003863417", "data_pub": "2026-08-31T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Atualizações no arsenal com sistemas automatizados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 134080, "fonte_id": "taipei_times", "titulo": "Ministry
