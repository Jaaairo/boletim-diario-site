obem-319-em-setembro-ante-setembro-de-2025/", "fonte_id": "infomoney", "data_pub": "2026-10-06T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para os Estados Unidos aumentaram 31,9% em setembro de 2025 em comparação com o mesmo mês do ano anterior. No entanto, a balança comercial para os EUA apresentou um déficit de US$ 4,33 bilhões.", "titulo_pt": "Exportações brasileiras para os EUA crescem 31,9% em setembro ante setembro de 2025", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 199477, "titulo": "FIDCs: nova regra ajuda gestores, melhorando informação", "url": "https://braziljournal.com/fidcs-nova-regra-ajuda-gestores-melhorando-informacao/", "fonte_id": "brazil_journal", "data_pub": "2026-10-06T19:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de 1º de novembro, os gestores de FIDCs poderão acessar o Sistema de Informações de Crédito (SCR) do Banco Central, que registra todas as operações de crédito do País. Esta medida visa ampliar o acesso a informações relevantes para os gestores de FIDCs.", "titulo_pt": "Nova regra para fidcs amplia acesso a informações", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 199265, "titulo": "Dívida de empresas de IA dispara e pressiona taxas de juros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/divida-de-empresas-de-ia-dispara-e-pressiona-taxas-de-juros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas líderes em inteligência artificial estão contratando empréstimos no valor de centenas de bilhões de dólares, o que está contribuindo para a elevação das taxas de juros e causando nervosismo entre os investidores.", "titulo_pt": "Dívida das empresas de IA explode e pressiona taxas de juros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199330, "titulo": "Balança comercial tem superávit de US$ 7,74 bilhões em setembro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/balanca-comercial-tem-superavit-de-us-774-bilhoes-em-setembro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-06T19:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A balança comercial brasileira registrou um superávit de US$ 7,74 bilhões em setembro, resultado da exportação de petróleo, combustíveis, soja e cobre. As exportações aumentaram 12,9% no mês, conforme dados do MDIC.", "titulo_pt": "Balança comercial tem superávit de US$ 7,74 bilhões em setembro", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 199750, "titulo": "Goldman Sachs and Man Group exposed in EY data breach", "url": "https://www.ft.com/content/2ad1ff25-f08e-4e78-83c9-90e7ea3844ee?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-06T19:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ernst & Young (EY) sofreu uma violação de dados que expôs informações de clientes de duas empresas de investimento, Goldman Sachs e Man Group. Essa revelação aumenta o número de vítimas de um incidente de hacking ocorrido no início do ano.", "titulo_pt": "Goldman Sachs e Man Group afetados em vazamento de dados da EY", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 199266, "titulo": "América Latina reduz ritmo de crescimento para 2,2% em 2026, diz Banco Mundial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/america-latina-reduz-ritmo-de-crescimento-para-22-em-2026-diz-banco-mundial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T19:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A América Latina e o Caribe reduzirão ligeiramente seu ritmo de crescimento para 2,2% em 2026, de acordo com as previsões do Banco Mundial. Este valor é uma diminuição em relação aos 2,4% observados no ano anterior.", "titulo_pt": "América Latina reduzirá ritmo de crescimento para 2,2% em 2026, diz Banco Mundial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199267, "titulo": "Justiça penhora receitas de fundador da Ricardo Eletro, hoje coach de empresários", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/justica-penhora-receitas-de-fundador-da-ricardo-eletro-hoje-coach-de-empresarios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T19:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trabalho de Brasília ordenou a penhora de 20% das receitas de um evento que Ricardo Nunes, fundador da Ricardo Eletro, vai realizar no Distrito Federal. O evento visa ensinar técnicas de vendas a empresários.", "titulo_pt": "Justiça penhora receitas de evento do fundador da Ricardo Eletro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199268, "titulo": "FMI alerta que alta persistente dos preços dura mais do que o previsto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/fmi-alerta-que-alta-persistente-dos-precos-dura-mais-do-que-o-previsto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T18:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O FMI alertou que a alta dos preços de produtos básicos, como alimentos e energia, está sendo mais persistente do que se previa, devido às guerras no Irã e na Ucrânia.", "titulo_pt": "FMI alerta que alta dos preços persiste mais do que previsto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199269, "titulo": "Governo prevê saldo menor para balança comercial após queda do preço do petróleo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/governo-reduz-a-us844-bi-projecao-de-superavit-comercial-em-2026-apesar-de-dado-forte-em-setembro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T18:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Desenvolvimento, Indústria, Comércio e Serviços reduziu a projeção do superávit da balança comercial brasileira para 2026 para US$ 84,4 bilhões, contra a previsão anterior de US$ 90 bilhões.", "titulo_pt": "Governo prevê saldo menor para balança comercial em 2026 devido à queda do preço do petróleo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 198984, "titulo": "Interview: More healthcare providers to adopt AI: Acer Medical", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/07/2003865509", "fonte_id": "taipei_times", "data_pub": "2026-10-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais provedores de saúde adotarão inteligência artificial, segundo Acer Medical. A empresa está expandindo o uso de tecnologias de inteligência artificial em sua operação.", "titulo_pt": "Mais provedores de saúde adotarão AI: acer Medical", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 199334, "titulo": "Uso de IA é a principal ameaça à reputação de uma marca, segundo levantamento", "url": "https://veja.abril.com.br/tecnologia/uso-de-ia-e-a-principal-ameaca-a-reputacao-de-uma-marca-segundo-levantamento/", "fonte_id": "veja", "data_pub": "2026-10-06T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que o uso de inteligência artificial é a principal ameaça à reputação das empresas pela quarta vez consecutiva. O estudo aponta a IA como o maior risco para a imagem corporativa.", "titulo_pt": "Uso de IA é a principal ameaça à reputação de uma marca, segundo levantamento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 199775, "titulo": "Apple and LG team up on new smart home gear, starting with a lock, doorbell, and thermostat", "url": "https://www.theverge.com/news/1006238/apple-lg-homekit-rumor-fcc", "fonte_id": "the_verge", "data_pub": "2026-10-06T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está colaborando com a LG para lançar uma nova linha de dispositivos inteligentes para o lar, incluindo um videotelhado, termostato, câmera interna e outros produtos. Os dispositivos terão a marca LG, mas se integrarão a um suposto hub de inteligência residencial da Apple, que deve ser lançado em um evento em 13 de outubro.", "titulo_pt": "Apple e LG unem-se em novos dispositivos inteligentes para o lar, com videotelhado, termostato e câmera", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 199448, "titulo": "Como investir com inteligência artificial de forma inteligente e segura", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/como-investir-com-inteligencia-artificial-de-forma-inteligente-e-segura/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ferramentas de inteligência artificial auxiliam na organização de informações, análise de investimentos, simulação de cenários e até a automatização de estratégias.", "titulo_pt": "Como investir com inteligência artificial de forma inteligente e segura", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 199770, "titulo": "Silicon Valley’s AI wunderkind launches Underdog, the most private Instinct/Muse competitor yet", "url": "https://techcrunch.com/2026/10/06/silicon-valleys-ai-wunderkind-launches-underdog-the-most-private-instinct-muse-competitor-yet/", "fonte_id": "techcrunch", "data_pub": "2026-10-06T20:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sigil Wen, apoiado por uma elite de Silicon Valley, desenvolveu um assistente de inteligência artificial localizado no dispositivo que promete ser gratuito, totalmente privado e capaz de realizar tarefas cotidianas.", "titulo_pt": "Gênio de silicon Valley lanza Underdog, novo concorrente mais privado de Instinct/Muse", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 199777, "titulo": "Tesla’s Model 3 and Model Y can be a backup battery for your house", "url": "https://www.theverge.com/transportation/1006193/tesla-model-3-model-y-powershare-home-backup", "fonte_id": "the_verge", "data_pub": "2026-10-06T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tesla está expandindo a função Powershare Home Backup para os modelos Model 3 e Model Y, permitindo que proprietários destes veículos utilizem suas baterias como fonte de energia em caso de falha de energia, desde que tenham também um Powerwall 3. Anteriormente, essa funcionalidade estava disponível apenas no Cybertruck e exigia o Powerwall 3.", "titulo_pt": "Modelo 3 e Y da tesla podem ser baterias de emergência para a sua casa", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 199771, "titulo": "How AI decision models could change content moderation", "url": "https://techcrunch.com/2026/10/06/how-ai-decision-models-could-change-content-moderation/", "fonte_id": "techcrunch", "data_pub": "2026-10-06T20:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Musubi lançou, em segunda-feira, um modelo de decisão leve chamado PolicyLM-1.7B, projetado para moderação em tempo real.", "titulo_pt": "Como modelos de decisão de IA podem transformar a moderação de conteúdo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 199260, "titulo": "Mistral lança modelo de IA para competir com rivais dos EUA e China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/mistral-lanca-modelo-de-ia-para-competir-com-rivais-dos-eua-e-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup francesa Mistral lançou um novo modelo de inteligência artificial com o objetivo de competir com gigantes mundiais americanos e chineses, como o ChatGPT e o Claude.", "titulo_pt": "Mistral lança modelo de IA para competir com rivais dos EUA e China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199778, "titulo": "Google’s power-hungry data centers crave nuclear energy", "url": "https://www.theverge.com/science/1006082/google-nuclear-energy-power-purchase-agreement-constellation", "fonte_id": "the_verge", "data_pub": "2026-10-06T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google firmou um acordo de 20 anos com a Constellation para atualizar seis instalações de usinas nucleares nos Estados Unidos, com o objetivo de gerar mais eletricidade para seus centros de dados consumidores de energia. O acordo visa garantir a receita da Constellation.", "titulo_pt": "Google busca energia nuclear para seus centros de dados", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 199772, "titulo": "AI computing startup Lambda to raise $4B ahead of planned IPO", "url": "https://techcrunch.com/2026/10/06/ai-computing-startup-lambda-to-raise-4b-ahead-of-planned-ipo/", "fonte_id": "techcrunch", "data_pub": "2026-10-06T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Lambda, que recebeu investimento da Nvidia, está levantando até US$ 4 bilhões em uma avaliação pré--money de US$ 14,5 bilhões, em preparação para uma oferta inicial de ações planejada para 2027, liderada por Coatue e Blackstone.", "titulo_pt": "Lambda, apoiada pela nvidia, pretende levantar us$ 4 bilhões antes da IPO em 2027", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 199773, "titulo": "The next hurdle for AI agents: getting websites to let them in", "url": "https://techcrunch.com/2026/10/06/the-next-hurdle-for-ai-agents-getting-websites-to-let-them-in/", "fonte_id": "techcrunch", "data_pub": "2026-10-06T19:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Personal assistentes de inteligência artificial prometem realizar compras, reservas de voos e outros serviços. No entanto, bloqueios deliberados e defesas contra bots estão dificultando o acesso, deixando os consumidores em situações complicadas. Um novo padrão está sendo proposto para ajudar a resolver esse problema.", "titulo_pt": "O próximo obstáculo para assistentes de IA: fazer com que os sites permitam seu acesso", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 199733, "titulo": "The new players in space", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/6/the-new-players-in-space?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T19:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título original 'The new players in space' se refere a empresas e países emergentes que estão se envolvendo na indústria espacial, competindo com as tradicionais agências espaciais.", "titulo_pt": "Novos jogadores no espaço", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 199791, "titulo": "‘Artificial’ Roasts AI’s Creators—and Sends a Dark Warning About Its Dangers", "url": "https://www.wired.com/story/artificial-roasts-ais-creators-and-sends-a-dark-warning-about-its-dangers/", "fonte_id": "wired", "data_pub": "2026-10-06T18:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme descreve com desprezo os CEOs e outros envolvidos na criação de inteligência artificial, como Sam Altman, CEO da OpenAI, e sugere que eles são imprudentes em relação aos perigos associados.", "titulo_pt": "Criticadas as criadoras de IA e alerta sobre seus perigos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 199562, "titulo": "América Latina e Caribe respondem por só 1,2% do investimento global em IA, diz chanceler do Uruguai", "url": "https://www.jota.info/coberturas-especiais/jota-global/america-latina-e-caribe-respondem-por-so-12-do-investimento-global-em-ia-diz-chanceler-do-uruguai", "fonte_id": "jota", "data_pub": "2026-10-06T18:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chanceler do Uruguai, Mario Lubetkin, defendeu uma estratégia regional unificada para inteligência artificial e destacou a matriz elétrica 100% renovável do país. América Latina e o Caribe representam apenas 1,2% do investimento global em IA.", "titulo_pt": "Uruguai defende estratégia regional unificada para IA e destaca matriz elétrica 100% renovável", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 199774, "titulo": "Hark releases an AI personal assistant with a focus on privacy", "url": "https://techcrunch.com/2026/10/06/hark-releases-an-ai-personal-assistant-with-a-focus-on-privacy/", "fonte_id": "techcrunch", "data_pub": "2026-10-06T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hark lançou um assistente pessoal baseado em IA com foco na privacidade. Este assistente é descrito como um sistema operacional do futuro que concorre com concorrentes como Muse, Dots e Instinct.", "titulo_pt": "Hark libera assistente pessoal de IA com foco na privacidade", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 199796, "titulo": "The Auk Mini Indoor Garden Is on Clearance for $199—Its Lowest Price Ever", "url": "https://www.wired.com/story/auk-mini-indoor-garden-sale-clearance-october-2026/", "fonte_id": "wired", "data_pub": "2026-10-06T18:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mini jardim indoor Auk está em liquidação por US$ 199, preço mais baixo da história, oferecendo tudo o que é necessário para cultivar ervas em ambientes internos.", "titulo_pt": "Mini jardim Indoor Auk em liquidação por r$ 199 - preço mais baixo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 199552, "titulo": "Un estudio científico identifica las ciudades sudamericanas con mayor riesgo ante tsunamis", "url": "https://www.lanacion.com.ar/el-mundo/un-estudio-cientifico-identifica-las-ciudades-sudamericanas-con-mayor-riesgo-ante-tsunamis-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T21:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Programa Riesgo Sísmico da Universidade de Chile identificaram as cidades sul-americanas mais vulneráveis a tsunamis. Os especialistas alertam que as medidas de segurança atuais são insuficientes para lidar com eventos de grande magnitude.", "titulo_pt": "Estudo científico identifica as cidades sul-americanas mais vulneráveis a tsunamis", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 199254, "titulo": "Nobel põe fim à angústia de físico belga a cada outubro", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/nobel-poe-fim-a-angustia-de-fisico-belga-nos-meses-de-outubro.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-06T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O físico belga Francis Halzen, de 82 anos, ganhou o Prêmio Nobel de Física em 2026, sozinho, por suas contribuições na detecção de neutrinos de alta energia de origem astrofísica. Ele havia esperado pela premiação anualmente em outubro durante muitos anos.", "titulo_pt": "Nobel acaba com espera anual de físico belga", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 199819, "titulo": "Nuri rocket set for 5th launch to place 15 satellites into orbit", "url": "https://en.yna.co.kr/view/AEN20261006008500320", "fonte_id": "yonhap_news", "data_pub": "2026-10-06T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rochaote Nuri, desenvolvida no país, está programada para sua quinta lançamento, com o objetivo de colocar 15 satélites em órbita. O lançamento está previsto para Goheung, na Coreia do Sul, em 7 de outubro.", "titulo_pt": "Lançamento da rochaote nuri programado para a quinta missão com 15 satélites", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 199255, "titulo": "Escolha do Nobel é mais uma vitória da astronomia multimensageira", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/escolha-do-nobel-e-mais-uma-vitoria-da-astronomia-multimensageira.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-06T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nobel foi concedido pela detecção de neutrinos de alta energia pelo observatório IceCube, destacando uma revolução na astronomia através da exploração do Universo invisível, composto por entidades difíceis de detectar de forma direta.", "titulo_pt": "Escolha do Nobel é mais uma vitória da astronomia multimensageira", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 199845, "titulo": "NASA to Cover Northrop Grumman CRS-24 Spacecraft Departure", "url": "https://www.nasa.gov/news-release/nasa-to-cover-northrop-grumman-crs-24-spacecraft-departure/", "fonte_id": "nasa_news", "data_pub": "2026-10-06T18:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O foguete Cygnus XL da Northrop Grumman está programado para se desligar da Estação Espacial Internacional no dia 9 de outubro após entregar mais de 11.000 libras de suprimentos, experimentos científicos e outros cargos como parte da missão Commercial Resupply Services-24 (CRS-24). A NASA transmitirá ao vivo o desligamento e a partida a partir das 12:30.", "titulo_pt": "NASA vai transmitir saída do foguete cygnus xl após missão de suprimento", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 199846, "titulo": "October 2026 Satellite Puzzler", "url": "https://science.nasa.gov/earth/earth-observatory/october-2026-satellite-puzzler/", "fonte_id": "nasa_news", "data_pub": "2026-10-06T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desafio é identificar a localização da imagem do satélite e explicar por que ela é interessante.", "titulo_pt": "Desafio de outubro de 2026: imagem de satélite Puzzler", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 199847, "titulo": "Lunar Grounding Challenge", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/center-of-excellence-for-collaborative-innovation-coeci/lunar-grounding-challenge/", "fonte_id": "nasa_news", "data_pub": "2026-10-06T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao percorrer o Polo Sul lunar, um astronauta pode carregar eletricamente devido ao tribocarga ao caminhar pela superfície lunar e ao plasma ambiente. Este problema se agrava nas sombras lunares e nas Zonas Permanentemente Sombrias (ZPS), onde o traje espacial pode acumular uma potencial negativa significativa.", "titulo_pt": "Desafio de terreno lunar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 199256, "titulo": "Nobel de Física volta a ser entregue a só 1 cientista após três décadas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/nobel-de-fisica-volta-a-ser-entregue-a-so-1-cientista-apos-tres-decadas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-06T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nobel de Física foi novamente concedido a um único cientista após um intervalo de 34 anos. A cerimônia de premiação aconteceu na manhã desta terça-feira (6).", "titulo_pt": "Nobel de Física volta a ser entregue a um único cientista após três décadas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 199848, "titulo": "NASA Glenn Invites Phase 1 Proposals for Aerospace Power Systems Laboratory", "url": "https://www.nasa.gov/news-release/nasa-glenn-invites-phase-1-proposals-for-aerospace-power-systems-laboratory/", "fonte_id": "nasa_news", "data_pub": "2026-10-06T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Centro de Pesquisas Glenn da NASA em Cleveland está buscando propostas para o projeto e construção do Laboratório de Sistemas de Poder Aeroespacial. O objetivo principal é fornecer uma instalação de laboratório para o teste e desenvolvimento de sistemas de energia, incluindo trabalhos de site, infraestrutura e sistemas associados.", "titulo_pt": "NASA Glenn convida para propostas de fase 1 para o laboratório de sistemas de poder aeroespacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 199082, "titulo": "A 2-in-1 approach captures toxic metals and recovers rare earth elements from wastewater", "url": "https://phys.org/news/2026-10-approach-captures-toxic-metals-recovers.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo de recuperação de metais tóxicos e elementos raros da água residual pode ser efetuado de forma simultânea. Objetos eletrônicos queimados, como lentes de câmera, fones de ouvido ou telefones antigos, contêm elementos raros valiosos que podem ser recuperados antes de serem descartados.", "titulo_pt": "Abordagem 2-em-1 captura metais tóxicos e recupera elementos raros de água residual", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199083, "titulo": "'Let me explain': Corporate disclosures can take a circuitous route", "url": "https://phys.org/news/2026-10-corporate-disclosures-circuitous-route.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas podem divulgar informações de maneiras indiretas, mesmo que o caminho mais direto seja mais eficiente. Às vezes, essas abordagens mais longas podem trazer vantagens específicas.", "titulo_pt": "Deixe-me explicar: as divulgações corporativas podem seguir um caminho mais longo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199084, "titulo": "Webb captures commotion from nebula's stellar jets", "url": "https://phys.org/news/2026-10-webb-captures-commotion-nebula-stellar.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb da NASA/ESA/CSA revelou estrelas ocultas por nuvens de poeira em uma natalício estelar chamado NGC 7129, a 3.300 luzes-ano da Terra. A captura de luz infravermelha pelo telescópio permitiu visualizar regiões densas que normalmente escurecem a visão de outras formas de luz.", "titulo_pt": "Webb registra agitação de jatos estelares em natalício de estrelas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199085, "titulo": "A gamma-ray burst's engine stayed active for nearly a month, breaking the previous record", "url": "https://phys.org/news/2026-10-gamma-ray-stayed-month-previous.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram a atividade do motor central mais longa já registrada em um raio-gama. O raio-gama durou cerca de 27 dias em seu próprio referencial de descanso, o que é aproximadamente 20 dias mais longo do que o recorde anterior.", "titulo_pt": "O motor de um raio-gama brilhou por quase um mês, quebrando o recorde anterior", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199086, "titulo": "Endangered Lantau toads show genetic and call differences that could signal an emerging species", "url": "https://phys.org/news/2026-10-endangered-lantau-toads-genetic-differences.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sapo-cornudo de curta perna (Boulenophrys brachykolos), listado como em perigo de extinção na Lista Vermelha da União Internacional para a Conservação da Natureza (IUCN), é a única espécie de rã pequena conhecida em Hong Kong pertencente ao gênero Boulenophrys da família Megophryidae.", "titulo_pt": "Sapos ameaçados de Lantau mostram diferenças genéticas e de chamado que podem indicar a emergência de uma nova espécie", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 199087, "titulo": "News you can use: Holiday travel does not have to break the bank", "url": "https://phys.org/news/2026-10-news-holiday-bank.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O período festivo é uma ocasião para se reunir e celebrar, mas se essa reunião envolver viagens aéreas, os preços dos bilhetes podem se tornar uma barreira significativa para a alegria natalina.", "titulo_pt": "Notícias úteis: viagens de férias não precisam quebrar o banco", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 198327, "titulo": "O que são os neutrinos, partículas cuja detecção rendeu o Nobel de Física a Francis Halzen", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/o-que-sao-os-neutrinos-particulas-cuja-deteccao-rendeu-o-nobel-ao-fisico-francis-halzen.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-06T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os neutrinos, partículas minúsculas mas carregadas de energia, vêm do espaço e fornecem dados importantes sobre o universo. O físico francês Francis Halzen, professor da Universidade de Wisconsin-Madison, foi premiado com o Nobel de Física por seus trabalhos na detecção dessas partículas.", "titulo_pt": "O que são os neutrinos, partículas cuja detecção rendeu o Nobel de Física a Francis Halzen", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 199331, "titulo": "Morre Eva Marie Saint, vencedora do Oscar e estrela de Hitchcock, aos 102 anos", "url": "https://veja.abril.com.br/cultura/morre-eva-marie-saint-vencedora-do-oscar-e-estrela-de-hitchcock-aos-102-anos/", "fonte_id": "veja", "data_pub": "2026-10-06T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eva Marie Saint, vencedora do Oscar e atriz conhecida por seus papéis em filmes de Alfred Hitchcock, faleceu aos 102 anos. Ela atuou até 2014 em produções como 'Sindicato de Ladrões' e 'Intriga Internacional'.", "titulo_pt": "Eva Marie Saint, vencedora do Oscar e estrela de Hitchcock, morre aos 102 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 199860, "titulo": "The Zaha Hadid Foundation Is Reopening the Late Architect’s Former HQ as a Public Arts Space", "url": "https://www.artnews.com/art-news/news/zaha-hadid-foundation-reopening-headquarters-exhibition-1234801315/", "fonte_id": "artnews", "data_pub": "2026-10-06T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O edifício anteriormente usado como sede pela arquiteta Zaha Hadid será reaberto ao público como um espaço de arte. A reabertura incluirá uma exposição intitulada 'Zaha Hadid: Arquitetura de Performance'.", "titulo_pt": "Fundação Zaha Hadid vai reabrir antiga sede como espaço de arte pública", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 199539, "titulo": "“El rey del tomate”: se recibió de abogado, trabajó como modelo y productor de eventos, pero encontró su lugar en una quinta de La Plata", "url": "https://www.lanacion.com.ar/que-sale/el-rey-del-tomate-se-recibio-de-abogado-trabajo-como-modelo-y-productor-de-eventos-pero-encontro-su-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O rei do tomate começou com 50 plantas de um tomate vasco que lhe recordava a infância e, posteriormente, expandiu sua produção para 8000 quilos semanais. Este empreendedor abastece restaurantes de lux dos livros proibidos", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 199862, "titulo": "‘Jodi,’ Sotheby’s Newly-Minted Nanotyrannus, Hits the Auction Block With $9 M. Estimate", "url": "https://www.artnews.com/art-news/news/jodi-sothebys-dinosaur-skeleton-nanotyrannus-auction-1234801271/", "fonte_id": "artnews", "data_pub": "2026-10-06T20:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A obra 'Jodi', classificada como Nanotyrannus, está sendo leiloada pela Sotheby’s com uma estimativa de US$ 9 milhões. É um dos três exemplares conhecidos deste tipo.", "titulo_pt": "'Jodi', novo Nanotyrannus da Sotheby’s, chega ao leilão com avaliação de us$ 9 milhões", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 199867, "titulo": "Detroit Design District Launches Whitney ISP–Style Program", "url": "https://www.artforum.com/news/detroit-design-district-launches-whitney-isp-style-program-1234760918/", "fonte_id": "artforum", "data_pub": "2026-10-06T20:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Distrito de Design de Detroit lançou um novo programa de estudo independente para artistas, escritores e curadores. Inspirado no renomado Programa de Estudo Independente da Whitney, o programa do DDD visa formar profissionais de destaque no campo do design.", "titulo_pt": "Distrito de Design de detroit lança novo programa de estudo independente", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 199248, "titulo": "'Pequenos Profetas' e 'Morte de Robin Hood': o que ver na TV e no streaming na quarta", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/pequenos-profetas-e-morte-de-robin-hood-o-que-ver-na-tv-e-no-streaming-na-quarta.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-06T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na comédia britânica 'Pequenos Profetas', um homem solitário busca a aj "data_pub": "2026-10-06T19:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'Pensar do Negro' é uma glosária de possibilidades, onde artistas, poetas e intelectuais exploram palavras de suas escolhas, oferecendo novas definições de frases relacionadas à negritude, como 'mundo', 'água' e 'cuidado'.", "titulo_pt": "Pensar do negro: uma glosária de possibilidades", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 199856, "titulo": "On Taking Care of Each Other", "url": "https://hyperallergic.com/on-taking-care-of-each-other/", "fonte_id": "hyperallergic", "data_pub": "2026-10-06T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram evitados greves em quatro museus de Nova York, ocorreu uma perda devastadora para Francis Lee Rogers, a cidade aumentou os subsídios para artistas e The Met apresentou uma impressionante exposição sobre Krasner-Pollock.", "titulo_pt": "Sobre cuidar uns dos outros", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 199865, "titulo": "Andrew Garfield Massively Helps Neon’s ‘Artificial’ Gamble Pay Off on the Awards Front", "url": "https://www.indiewire.com/awards/predictions/andrew-garfield-neon-artificial-oscar-chances-1235220470/", "fonte_id": "indiewire", "data_pub": "2026-10-06T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Garfield, um nome duas vezes indicado para o Oscar, passa por uma transformação em sua carreira de ator, indo de um martelo corporativo em 'The Social Network' para um vilão corporativo em 'Artificial', de Luca Guadagnino. Este percurso pode fortalecer a campanha de premiações para o filme.", "titulo_pt": "Andrew Garfield fortalece a campanha de prêmios de 'Artificial'", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 199857, "titulo": "A Hyperallergic Halloween", "url": "https://hyperallergic.com/hyperallergic-halloween-october-2026/", "fonte_id": "hyperallergic", "data_pub": "2026-10-06T19:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No dia 28 de outubro, haverá um evento em Brooklyn, Nova York, com coquetéis assustadores, pratos deliciosos demoníacos, um concurso de fantasia temático de arte e outras atividades.", "titulo_pt": "Hyperallergic Halloween", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 199250, "titulo": "Marcas reagem à IA na Semana de Moda de Paris com roupas imperfeitas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/marcas-reagem-a-ia-na-semana-de-moda-de-paris-com-roupas-imperfeitas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-06T19:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As marcas de moda reagiram à inteligência artificial exibindo roupas imperfeitas na Semana de Moda de Paris. Este movimento, que busca retratar a vulnerabilidade humana, foi uma tendência forte durante a temporada de desfiles mais importante do mundo.", "titulo_pt": "Marcas reagem à IA na Semana de Moda de Paris com roupas imperfeitas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 199388, "titulo": "Igreja Lagoinha e pastor são condenados por sermão sobre beijar a filha", "url": "https://www.metropoles.com/minas-gerais/igreja-lagoinha-e-pastor-sao-condenados-por-sermao-sobre-beijar-a-filha", "fonte_id": "metropoles", "data_pub": "2026-10-06T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A igreja Lagoinha e o pastor foram condenados a pagar uma multa e a realizar um novo sermão equivalente ao antigo. O sermão original abordava o tema de beijar a filha.", "titulo_pt": "Igreja Lagoinha e pastor são condenados por sermão sobre beijar a filha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 199392, "titulo": "Alunos da rede pública do DF apresentam produções no Cine Brasília", "url": "https://www.metropoles.com/distrito-federal/alunos-da-rede-publica-do-df-apresentam-producoes-no-cine-brasilia", "fonte_id": "metropoles", "data_pub": "2026-10-06T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alunos da rede pública do Distrito Federal apresentaram suas produções no evento Cine Brasília. O NaMoral de 2026, organizado em conjunto pelo MPDFT, ocorrerá nesta quarta-feira (7/10) das 9h às 12h.", "titulo_pt": "Alunos da rede pública do DF participam no Cine Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 199398, "titulo": "Homem é preso após agredir a companheira em rodoviária no interior de SP", "url": "https://www.metropoles.com/sao-paulo/homem-e-preso-apos-agredir-a-companheira-em-rodoviaria-no-interior-de-sp", "fonte_id": "metropoles", "data_pub": "2026-10-06T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi preso após agredir fisicamente e ameaçar a companheira em uma rodoviária no interior de São Paulo. O incidente foi registrado por câmeras de segurança.", "titulo_pt": "Homem é preso após agredir a companheira em rodoviária no interior de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 199399, "titulo": "\"Partiu vítima de uma violência\", diz Boulos sobre morte de tio atropelado", "url": "https://www.metropoles.com/sao-paulo/partiu-vitima-de-uma-violencia-diz-boulos-sobre-morte-de-tio-atropelado", "fonte_id": "metropoles", "data_pub": "2026-10-06T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Boulos, tio do ministro do governo Lula, faleceu após ser atropelado na segunda-feira (5/10). O termo 'Partiu vítima de uma violência' foi usado por Boulos para descrever a morte do tio.", "titulo_pt": "Partiu vítima de uma violência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 199859, "titulo": "Inter-American Mental Health Week calls for intersectoral action to improve mental health in the Americas", "url": "https://www.paho.org/en/news/6-10-2026-inter-american-mental-health-week-calls-intersectoral-action-improve-mental-health", "fonte_id": "paho", "data_pub": "2026-10-06T19:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Semana Interamericana de Saúde Mental apela para ações intersetoriais para melhorar a saúde mental nas Américas. O evento destaca a necessidade de colaboração entre diferentes setores para avançar na área.", "titulo_pt": "Semana interamericana de saúde Mental cobra ações intersetoriais para aprimorar a saúde Mental nas américas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 198562, "titulo": "Paro en la línea A de subte: a partir de qué hora comienza la medida de fuerza de hoy, martes 6 de octubre", "url": "https://www.lanacion.com.ar/sociedad/paro-en-la-linea-a-de-subte-a-partir-de-que-hora-comienza-la-medida-de-fuerza-de-hoy-martes-6-de-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T17:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O paro na linha A do metrô começará às 19h. A posição das entidades envolvidas foi anunciada.", "titulo_pt": "Paro na linha A do metrô: A partir de que hora começa A medida de força de hoje, terça-feira 6 de outubro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 198570, "titulo": "Incendios, disturbios y jóvenes mutilados en una violenta jornada de protestas estudiantiles que sacude al país", "url": "https://www.lanacion.com.ar/el-mundo/francia-enfrenta-la-mayor-jornada-de-protesta-y-crece-la-tension-por-la-represion-policial-tras-la-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Entre 256.000 e 450.000 pessoas participaram de protestos estudiantis violentos, levando a incêndios, disturbios e graves ferimentos, incluindo jovens mutilados. Houve milhares de detenções e a atuação da polícia gerou controvérsia.", "titulo_pt": "Incêndios, distúrbios e jovens mutilados em violentos protestos estudiantis que sacodem o país", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 198487, "titulo": "Idosa perde casa em terremoto e constrói outra de 10 metros quadrados com garrafas plásticas", "url": "https://www.cnnbrasil.com.br/curiosidades/idosa-perde-casa-em-terremoto-e-constroi-outra-de-10-metros-quadrados-com-garrafas-plasticas/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "María Ponce, uma idosa de El Salvador, construiu uma casa de 10 metros quadrados usando garrafas plásticas recolhidas. O uso de garrafas PET na construção é objeto de pesquisas.", "titulo_pt": "Idosa constrói casa de 10 metros quadrados com garrafas plásticas após terremoto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 199135, "titulo": "Americas advance on healthy aging, but gaps remain as 2030 approaches", "url": "https://www.paho.org/en/news/6-10-2026-americas-advance-healthy-aging-gaps-remain-2030-approaches", "fonte_id": "paho", "data_pub": "2026-10-06T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A América avançou em relação ao envelhecimento saudável, mas ainda existem gaps antes de 2030. O relatório destaca que, à medida que se aproxima o ano de 2030, persistem desigualdades no processo de envelhecimento saudável na região.", "titulo_pt": "América avança em envelhecimento saudável, mas gaps persistem até 2030", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 198435, "titulo": "Casal discute e homem esfaqueia namorada, foge mas acaba preso pela polícia", "url": "https://www.metropoles.com/distrito-federal/na-mira/casal-discute-e-homem-esfaqueia-namorada-foge-mas-acaba-preso-pela-policia", "fonte_id": "metropoles", "data_pub": "2026-10-06T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 27 anos foi esfaqueada no pescoço e nas costas pelo seu namorado de 22 anos, que fugiu após o ataque, mas foi preso pela polícia em flagrante.", "titulo_pt": "Casal discute e homem esfaqueia namorada, foge mas acaba preso pela polícia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 198501, "titulo": "Protestos na França escalam após adolescente perder a mão em confrontos", "url": "https://www.cnnbrasil.com.br/internacional/protestos-na-franca-escalam-apos-adolescente-perder-a-mao-em-confrontos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Protestos na França continuam após um adolescente de 14 anos ficar gravemente ferido durante confrontos. Organizações de direitos humanos criticam o uso desproporcional da força policial.", "titulo_pt": "Protestos na França escalam após adolescente de 14 anos ficar gravemente ferido", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 198798, "titulo": "Hundreds of thousands demonstrate across France for better education", "url": "https://www.lemonde.fr/en/france/article/2026/10/06/hundreds-of-thousands-demonstrate-across-france-for-better-education_6758289_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T16:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas demonstraram em todo o país francês em prol de uma educação melhor. Os organizadores estimaram que 450 mil pessoas tenham participado, enquanto o ministério do Interior relatou um número de 256 mil.", "titulo_pt": "Milhares demonstram em França por melhor educação", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198665, "titulo": "‘This is state violence’: Paris students rage at politicians and heavy-handed policing", "url": "https://www.theguardian.com/world/2026/oct/06/french-student-protests-barricades-paris-police", "fonte_id": "guardian_world", "data_pub": "2026-10-06T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos inéditos em uma suburbio de baixa renda de Paris estão se tornando violentos, com investigações sendo realizadas sobre abusos policiais. Pupilos da escola Lycée Sophie-Germain construíram uma barricada com caixas de lixo e carrinhos de compras, expondo demandas por maior financiamento e igualdade nas escolas francesas.", "titulo_pt": "Isso é violência estatal: estudantes de paris se revoltam contra políticos e policiamento rigoroso", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198455, "titulo": "Milhares de estudantes tomam as ruas em defesa da educação na França", "url": "https://www.brasildefato.com.br/2026/10/06/milhares-de-estudantes-tomam-as-ruas-em-defesa-da-educacao-na-franca/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-06T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (6), cerca de 90 mil estudantes secundaristas e universitários participam de protestos em diferentes regiões da França. Este é o terceiro dia de manifestações nacionais consecutivas, após duas grandes mobilizações em 29 de setembro e 1º de outubro.", "titulo_pt": "Milhares de estudantes tomam as ruas em defesa da educação na França", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 198607, "titulo": "Experto internacional destaca el “botón de pánico” como herramienta para prevenir el juego problemático", "url": "https://www.latercera.com/branded/noticia/experto-internacional-destaca-el-boton-de-panico-como-herramienta-para-prevenir-el-juego-problematico/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T13:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um especialista neerlandês destaca o uso de mecanismos como o 'botão de pânico' como ferramenta para prevenir o jogo problemático, em meio ao debate sobre a falta de regulamentação das plataformas de apostas digitais. Esses mecanismos buscam fortalecer o Jogo Responsável em cassinos.", "titulo_pt": "Especialista destaca 'botão de pânico' como ferramenta para prevenir o jogo problemático", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 199003, "titulo": "French school unrest: students, teachers march on biggest day of protests", "url": "https://www.scmp.com/news/world/europe/article/3369936/french-school-unrest-students-teachers-march-biggest-day-protests?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T11:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos em escolas francesas foram realizados por estudantes, professores e pais em várias cidades, incluindo Marselha e Nantes, em um dos dias mais significativos de manifestações contra salas de aula sobrecarregadas e deterioradas. A polícia usou gás lacrimogêneo para dispersar manifestantes que bloquearam escolas de nível médio.", "titulo_pt": "Descontentamento na França: estudantes, professores e pais marcham em dia de protestos mais amplos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 198553, "titulo": "Sembraron 30.000 pejerreyes en una laguna bonaerense que busca recuperar la pesca y el turismo", "url": "https://www.clarin.com/informacion-general/sembraron-30000-pejerreyes-laguna-bonaerense-busca-recuperar-pesca-turismo_0_qZeRFsmDaX.html", "fonte_id": "clarin", "data_pub": "2026-10-06T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um projeto implantou 30.000 pejerreyes em uma lagoa bonaerense com o objetivo de fortalecer a população de peixes e recuperar o ecossistema, visando também promover o turismo local.", "titulo_pt": "Foram plantados 30.000 pejerreyes em uma lagoa bonaerense para fortalecer a pesca e promover o turismo", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 198804, "titulo": "Finland orders halt to work on Google data centers over environmental concerns", "url": "https://www.lemonde.fr/en/international/article/2026/10/06/finland-orders-halt-to-work-on-google-data-centers-over-environmental-concerns_6758325_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades finlandesas ordenaram que a empresa representante do gigante americano Google na Finlândia pare com a construção de centrais de dados até que possa comprovar que está em conformidade com as leis ambientais. Além disso, as autoridades estão investigando se as árvores e o solo foram removidos antes que a empresa realizasse um estudo de impacto ambiental.", "titulo_pt": "Finlândia ordena paralisação da construção de centrais de dados do Google devido a preocupações ambientais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198611, "titulo": "Agrupaciones indígenas y municipios piden revocar permiso ambiental de millonario proyecto de transmisión eléctrica", "url": "https://www.latercera.com/pulso/noticia/agrupaciones-indigenas-y-municipios-piden-revocar-permiso-ambiental-de-millonario-proyecto-de-transmision-electrica/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T14:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de transmissão elétrica de US$ 324 milhões da Mataquito Transmisora de Energía enfrenta cinco reclamações no Tribunal Ambiental por supostas ilegalidades na aprovação. Simultaneamente, a empresa defende o avanço das obras e apresentou uma nova consulta de pertinência para ajustar mais de cem estruturas.", "titulo_pt": "Grupos indígenas e municípios pedem revogação de licença ambiental de projeto de transmissão elétrica milionário", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 198661, "titulo": "Australia faces summer of extreme weather, Anthony Albanese warns at pre-Cop", "url": "https://www.theguardian.com/australia-news/2026/oct/06/agreement-to-transition-away-from-fossil-fuels-not-open-for-renegotiation-pacific-leader-tells-pre-cop", "fonte_id": "guardian_world", "data_pub": "2026-10-06T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Anthony Albanese advertiu que a Austrália enfrentará um verão perigoso, com possíveis inundações, ciclones e calor extremo, devido ao 'super El Niño' no Pacífico. Ele destacou que isso demonstra a urgência da ação climática, especialmente para os países insulares do Pacífico, como Tuvalu, que já estão sentindo os efeitos do aquecimento global.", "titulo_pt": "Austrália enfrentará verão perigoso devido ao 'super el niño', avisa Albanese", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198701, "titulo": "America’s tallest, most spectacular trees are getting…heat stroke?", "url": "https://www.vox.com/climate/504991/redwood-tree-california-heat-photosynthesis", "fonte_id": "vox", "data_pub": "2026-10-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A floresta de sequoias costeiras é composta por árvores que podem viver por milhares de anos. Suas copas desenvolvem ecossistemas elevados, criando algo semelhante a um segundo solo florestal a centenas de metros acima do solo.", "titulo_pt": "As árvores mais altas e espetaculares dos estados unidos estão... Tendo calor?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 197705, "titulo": "Para amainar a crise de abstinência, as próximas eleições em outros países", "url": "https://veja.abril.com.br/coluna/mundialista/para-amainar-a-crise-de-abstinencia-as-proximas-eleicoes-em-outros-paises/", "fonte_id": "veja", "data_pub": "2026-10-06T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel, Estados Unidos e Espanha terão eleições até o fim do ano, com debates entre direita e esquerda. Estas eleições terão grande influência no cenário político desses países.", "titulo_pt": "Para amenizar a crise de abstinência, eleições em israel, EUA e Espanha até o fim do ano", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 197571, "titulo": "Quênia confirma primeiro caso de ebola vindo do Congo; paciente morreu", "url": "https://www.cnnbrasil.com.br/internacional/quenia-confirma-primeiro-caso-de-ebola-vindo-do-congo-paciente-morreu/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Quênia confirmou o primeiro caso de ebola vindo da República Democrática do Congo, onde o paciente havia residido. Ele chegou a Nairóbi no sábado e 28 pessoas tiveram contato com ele.", "titulo_pt": "Quênia confirma primeiro caso de ebola vindo do Congo; paciente morreu", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197516, "titulo": "Falta de energia afetará endereços em Santa Maria e Fercal nesta 3ª (6/10)", "url": "https://www.metropoles.com/distrito-federal/falta-de-energia-afetara-enderecos-em-santa-maria-e-fercal-nesta-3a-6-10", "fonte_id": "metropoles", "data_pub": "2026-10-06T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (6/10), haverá interrupções temporárias de energia em Santa Maria e Fercal para serviços de melhoria e modernização da rede elétrica e poda de árvores.", "titulo_pt": "Falta de energia afetará endereços em Santa Maria e Fercal nesta terça-feira (6/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197522, "titulo": "Clima: temporais atingem Sul, Sudeste e Centro-Oeste nesta 3ª", "url": "https://www.metropoles.com/brasil/clima-temporais-atingem-sul-sudeste-e-centro-oeste-nesta-3a", "fonte_id": "metropoles", "data_pub": "2026-10-06T08:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais atingem o Sul, Sudeste e Centro-Oeste nesta terça-feira. Conforme o dia avança, as chuvas tendem a abrandar em boa parte do Sul, com precipitações mais persistentes no Paraná.", "titulo_pt": "Temporais atingem Sul, Sudeste e Centro-Oeste nesta terça-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197441, "titulo": "Natura diz que mudança climática na amazônia põe em risco 2,6% da receita líquida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/natura-diz-que-mudanca-climatica-na-amazonia-poe-em-risco-26-da-receita-liquida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Natura estima que a mudança climática na Amazônia possa comprometer R$ 584,2 milhões em vendas, representando 2,6% da receita líquida da empresa em 2025.", "titulo_pt": "Natura avisa que mudança climática na amazônia pode ameaçar 2,6% da receita líquida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 199758, "titulo": "US seeks US$100 million bail each for Chinese-born couple in surrogacy child abuse case", "url": "https://www.scmp.com/news/us/article/3369963/us-seeks-us100-million-bail-each-chinese-born-couple-surrogacy-child-abuse-case?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Los Angeles County promotores de justiça estão pedindo fiança de 100 milhões de dólares para cada um de um casal chinês nascido que foi acusado de conspirar para abusar de crianças jovens nascidas por meio de fertilização de substituição e criadas em sua mansão na Califórnia. Guojun Xuan, de 66 anos, e Silvia Zhang, de 39 anos, supostamente dirigiram babás a punirem fisicamente as crianças, assistiram aos maus-tratos por meio de um sistema de vigilância extenso e ensinaram as crianças a negarem o abuso antes da chegada da polícia.", "titulo_pt": "EUA pedem fiança de 100 milhões cada para casal chinês acusado de abuso em caso de surrogacia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 199499, "titulo": "Mulher condenada à morte nos EUA está consciente após tentativa de execução fracassada, dizem advogados", "url": "https://www.bbc.com/portuguese/articles/cked39wwg4glo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, uma mulher de 50 anos, permanece consciente e recebendo cuidados médicos no hospital após uma tentativa de execução fracassada, conforme informado pelos seus advogados.", "titulo_pt": "Mulher condenada à morte nos EUA está consciente após tentativa de execução fracassada, dizem advogados", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 199581, "titulo": "“Contra todo pronóstico”: Christa Pike recupera la conciencia y habla tras sobrevivir a dos inyecciones letales en EE.UU.", "url": "https://www.latercera.com/mundo/noticia/contra-todo-pronostico-christa-pike-recupera-la-conciencia-y-habla-tras-sobrevivir-a-dos-inyecciones-letales-en-eeuu/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T21:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, condenada à morte, permanece sob cuidados médicos seis dias após o procedimento em Tennessee. Seus advogados afirmam que ela sofreu danos graves nos braços e que o prognóstico permanece incerto.", "titulo_pt": "Contra todo pronóstico: christa Pike recupera a consciência e fala após sobreviver a duas injeções letais nos EUA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 199443, "titulo": "Número de candidatos eleitos LGBTQIA+ quase dobra em 2026, diz levantamento", "url": "https://www.cnnbrasil.com.br/eleicoes/numero-de-candidatos-eleitos-lgbtqia-quase-dobra-em-2026-diz-levantamento/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento do Instituto Plena Cidadânia revela "the_atlantic", "data_pub": "2026-10-06T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de um suposto acidente de laboratório na Sibéria, Moscou está voltando para seus métodos soviéticos antigos. A frase sugere que a Rússia está adotando uma abordagem evasiva sobre a morte devido a um possível acidente de laboratório no norte do país.", "titulo_pt": "Rússia precisa dizer a verdade sobre uma morte por praga", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 198702, "titulo": "Los nombres cambian, Brasil permanece", "url": "https://www.ciperchile.cl/2026/10/06/los-nombres-cambian-brasil-permanece/?utm_source=rss&utm_medium=rss&utm_campaign=los-nombres-cambian-brasil-permanece", "fonte_id": "ciper_chile", "data_pub": "2026-10-06T16:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título do artigo original em espanhol é 'Los nombres cambian, Brasil permanece'. O texto trata da continuidade do Brasil, apesar de mudanças nos nomes envolvidos.", "titulo_pt": "Os nomes mudam, Brasil permanece", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 197816, "titulo": "Kenya confirms first Ebola case and says patient has died", "url": "https://www.theguardian.com/world/2026/oct/06/kenya-first-ebola-case-death-drc", "fonte_id": "guardian_world", "data_pub": "2026-10-06T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kenya confirmou seu primeiro caso de Ebola, envolvendo um cidadão keniata que havia estado na República Democrática do Congo. O paciente faleceu e 28 contatos foram identificados, incluindo familiares e profissionais de saúde.", "titulo_pt": "Kenya confirma primeiro caso de Ebola e relata óbito", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 197605, "titulo": "Como a guerra aumentou a violência sexual e os casamentos forçados de meninas e mulheres em Gaza", "url": "https://www.bbc.com/portuguese/articles/c8ly4yd5xkkpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T08:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convivência com desconhecidos e a falta de privacidade nos abrigos em Gaza têm sido acompanhadas por relatos de assédio e abuso sexual. Muitas famílias têm optado pelo casamento forçado de suas filhas como forma de proteção e preservação da reputação familiar.", "titulo_pt": "Como a guerra aumentou a violência sexual e os casamentos forçados de meninas e mulheres em Gaza", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 197927, "titulo": "Discovery of 11 bodies in Johannesburg exposes scale of violence against women", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/10/06/discovery-of-11-bodies-in-johannesburg-exposes-scale-of-violence-against-women_6758291_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde julho, corpos de mulheres encontrados nus ou semi-nus, e brutalmente espancados, foram descobertos nos arredores da capital sul-africana. A realidade cruel da violência diária contra as mulheres no país se tornou inegável.", "titulo_pt": "Descoberta de 11 corpos em joanesburgo expõe escala da violência contra mulheres", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198214, "titulo": "More than 1,900 children orphaned or separated from their families by Ebola in eastern DR Congo – UNICEF", "url": "https://www.unicef.org/press-releases/more-1900-children-orphaned-or-separated-their-families-ebola-eastern-dr-congo", "fonte_id": "unicef", "data_pub": "2026-10-06T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.900 crianças foram deixadas órfãs ou separadas de suas famílias devido à Ebola nas regiões de Ituri e North Kivu. O UNICEF está pedindo fundos urgentes para proteger as crianças que ficaram sem cuidados.", "titulo_pt": "Mais de 1.900 crianças órfãs ou separadas de suas famílias por Ebola em oriental da república democrática do Congo - UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 198215, "titulo": "\"Ebola takes the people children depend on and unravels their lives” – UNICEF", "url": "https://www.unicef.org/press-releases/ebola-takes-people-children-depend-and-unravels-their-lives-unicef", "fonte_id": "unicef", "data_pub": "2026-10-06T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comunicação-chefe da UNICEF na República Democrática do Congo, Halimatou Amadou, falou sobre como a Ebola remove as pessoas que as crianças dependem, desestruturando suas vidas. Essa foi a conclusão de uma conferência de imprensa realizada hoje no Palácio das Nações em Genebra.", "titulo_pt": "Ebola remove as pessoas que as crianças dependem e desestrutura suas vidas – UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 198122, "titulo": "S. Korea has 52 death row inmates, average age of 58.7", "url": "https://en.yna.co.kr/view/AEN20261006006100315", "fonte_id": "yonhap_news", "data_pub": "2026-10-06T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea possui 52 condenados à morte com umidade média de 58,7 anos. As execuções foram suspensas no país há aproximadamente 30 anos.", "titulo_pt": "Coreia do sul tem 52 condenados à morte, com idade média de 58,7 anos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 197817, "titulo": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "url": "https://www.theguardian.com/global-development/2026/oct/06/ethiopia-tigray-conflict-tplf-rebels-forcibly-recruit-boys-war-crimes", "fonte_id": "guardian_world", "data_pub": "2026-10-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que grupos rebeldes na região de Tigray estão forçando a recruta de meninos com 15 anos o const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];

    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}

              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>

         }).join("")}
       </div>`
    : "";

    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const d = D.destaque;

  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}
