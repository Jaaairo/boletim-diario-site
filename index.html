url": "https://www.koreaherald.com/article/10857821", "fonte_id": "korea_herald", "data_pub": "2026-08-31T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ha Jung-woo, vice-chair do Conselho Presidencial da Estratégia Nacional de Inteligência Artificial da Coreia, afirmou que o governo irá se concentrar mais em resultados tangíveis do que em estratégias ao desenvolver sua política de IA. Ele destacou a necessidade de transformar as ambições nacionais em resultados concretos para que a Coreia se torne um líder na corrida global de IA.", "titulo_pt": "Chefe de IA da Coreia destaca resultados no lugar de estratégias", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 134847, "titulo": "AI giants lean into health care to stall public backlash", "url": "https://www.axios.com/2026/08/31/ai-health-care-cures-disease-anthropic-open-ai", "fonte_id": "axios", "data_pub": "2026-08-31T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grandes empresas de inteligência artificial estão se voltando para a saúde para mitigar a reação negativa pública. Embora o uso de AI em curas possa melhorar a percepção, ainda existem riscos de segurança e a discussão sobre a alocação de recursos pode surgir nos próximos dois ou três anos.", "titulo_pt": "Gigantes da IA se voltam para a saúde para mitigar reação negativa pública", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 135047, "titulo": "Gudeng sees double-digit advanced packaging growth from 2027", "url": "https://www.digitimes.com/news/a20260831PD233/packaging-growth-2027-hpc-development.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por inteligência artificial e computação de alto desempenho está impulsionando o desenvolvimento de processos semicondutores, levando a uma nova fase de expansão de capacidade para nós e para tecnologias de embalagem avançada. O presidente da Gudeng, Bill Chiu, prevê que a receita da empresa em embalagens avançadas terá crescimento de dois dígitos a partir de 2027.", "titulo_pt": "Gudeng projeta crescimento de dois dígitos para embalagens avançadas a partir de 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135048, "titulo": "U-Best races to launch PFAS-free coatings by 1Q27", "url": "https://www.digitimes.com/news/a20260831PD216/u-best-launch-development-eu-foldable.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "U-Best Innovative Technology, uma unidade do Sun Yad Group, está acelerando o desenvolvimento de revestimentos sem flúor para capturar a demanda de substituição gerada pelas regulamentações da União Europeia e Estados Unidos que proíbem o uso de substâncias perfluoradas (PFAS) e outras 'químicas eternas'. A empresa almeja aplicações de alto nível em telefones dobráveis, semicondutores e displays, com lançamentos previstos no primeiro trimestre de 2027.", "titulo_pt": "U-best se apressa em lançar revestimentos livres de pfas no 1º trimestre de 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135049, "titulo": "Marvell sees 2027 acceleration in scale-up optics", "url": "https://www.digitimes.com/news/a20260831PD230/marvell-2027-optics-cpo-copper.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Marvell anunciou em sua chamada de resultados do segundo trimestre fiscal de 2027 que os clientes estão planejando ativamente a adoção de soluções ópticas de escala no mesmo ano, com a demanda para óptica perto do pacote (NPO) sendo revisada para cima. A companhia afirma que o cabo de cobre está se tornando cada vez mais limitado em distância e capacidade de banda, especialmente com sistemas de computação cada vez maiores, o que está empurrando os clientes para uma maior adoção de transmissão óptica em seus projetos.", "titulo_pt": "Marvell projeta aceleração em 2027 para soluções ópticas de escala", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135050, "titulo": "Nvidia demand nearly doubles as supply meets only 70%", "url": "https://www.digitimes.com/news/a20260831PD218/nvidia-gpu-data-center-demand-revenue-2027.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A receita da Nvidia para o segundo trimestre do ano fiscal 2027 aumentou 106% em comparação com o mesmo período do ano anterior, alcançando US$96,22 bilhões, com uma forte expansão de 117% na receita do data center para US$89 bilhões. A empresa projeta uma receita de US$108 bilhões para o terceiro trimestre do ano fiscal 2027 e um crescimento de aproximadamente 70% na receita para o ano fiscal 2028, indicando que a capacidade de suprimento atual atende apenas cerca de 70% da demanda dos clientes.", "titulo_pt": "Receita da nvidia quase duplica, mas oferta atende apenas 70% da demanda", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135051, "titulo": "TSMC tackles the AI I/O wall with two COUPE bandwidth paths and deeper heterogeneous integration", "url": "https://www.digitimes.com/news/a20260831PD225/tsmc-bandwidth-silicon-photonics-siph.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC está aprimorando sua rota de fotônica em silício (SiPh) para abordar a crescente discrepância entre o crescimento do processamento de IA e o movimento de dados entre chips. A empresa apresentou dois caminhos para aumentar a largura de banda em sua próxima plataforma COUPE e destacou um papel mais amplo para a integração heterogênea em futuros sistemas ópticos co-integrados.", "titulo_pt": "TSMC enfrenta a barreira de AI I/O com dois caminhos de largura de banda para COUPE e integração heterogênea mais profunda", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135052, "titulo": "AI Macs, Part 1: OpenAI reportedly buys tens of thousands of Macs for reinforcement learning", "url": "https://www.digitimes.com/news/a20260831VL213/apple-openai-mac-mini-nvidia-infrastructure.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple está tornando-se uma presença inesperada em infraestruturas de inteligência artificial (IA), com o Mac mini e Mac Studio sendo adquiridos em grande escala pela OpenAI para aprendizado por reforço. Além disso, a Anthropic está alugando Mac minis através da AWS para uso similar.", "titulo_pt": "Mac's para IA: openai compra cifras de unidades de Macs para aprendizado por reforço", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135054, "titulo": "SK Hynix explores Japanese expansion to meet global AI chip demand", "url": "https://www.digitimes.com/news/a20260831VL219/sk-hynix-japan-expansion-chips-manufacturing-demand.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SK Hynix está explorando opções de produção e investimento no Japão para atender à alta demanda global por chips de memória motivada pela inteligência artificial.", "titulo_pt": "SK Hynix avalia expansão no Japão para atender à demanda global de chips de inteligência artificial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135138, "titulo": "SK Hynix weighs Japan memory fab partnership to supply AI boom", "url": "https://www.japantimes.co.jp/business/2026/08/31/companies/sk-hynix-joint-venture-feasibility/", "fonte_id": "japan_times", "data_pub": "2026-08-31T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fornecedora sul-coreana de memórias dinâmicas e de flash está avaliando diferentes locais para uma fábrica joint venture que possa fornecer para o boom da inteligência artificial.", "titulo_pt": "SK Hynix avalia parceria em fábrica no Japão para suprir boom de AI", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 135055, "titulo": "TSMC sees SiPh going mainstream in 2027", "url": "https://www.digitimes.com/news/a20260831PD217/siph-2027-photonics-tsmc-market-share.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2027, a tecnologia Silicon Photonics (SiPh) deve se tornar mainstream, com uma participação de mercado superior a 50%, de acordo com K.C. Hsu, vice-presidente de tecnologia de embalagem avançada da TSMC, durante a Silicon Photonics Global Summit antes do SEMICON Taiwan 2026 em 31 de agosto. Isso se deve ao crescimento explosivo da demanda por transmissores ópticos impulsionado pelo aumento da escala de inteligência artificial (AI).", "titulo_pt": "SiPh se tornará mainstream em 2027, diz TSMC", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135141, "titulo": "CIA-backed investor helped top German drones firm break into U.S.", "url": "https://www.japantimes.co.jp/business/2026/08/31/companies/cia-investor-german-drones-us/", "fonte_id": "japan_times", "data_pub": "2026-08-31T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vice-presidente de uma empresa de drones alemã afirmou que um investidor ligado à CIA, chamado In-Q-Tel, ajudou a empresa a abrir portas em Washington e a ganhar contratos com a CIA e o FBI.", "titulo_pt": "Investidor ligado à cia auxiliou empresa alemã de drones a entrar nos estados unidos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 135145, "titulo": "China sees opportunity in America’s recent AI security scares", "url": "https://www.japantimes.co.jp/business/2026/08/31/tech/china-america-ai-security/", "fonte_id": "japan_times", "data_pub": "2026-08-31T08:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas adotam uma abordagem aberta para os parâmetros matemáticos que determinam como um sistema de IA opera, enquanto as empresas americanas tomam uma abordagem oposta.", "titulo_pt": "China identifica oportunidades nas recentes preocupações de segurança da IA dos EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 135056, "titulo": "Agentrys, agentic chip design startup backed by MediaTek, raises US$24.5M in funding", "url": "https://www.digitimes.com/news/a20260831VL218/design-mediatek-funding-startup-eda.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de design de chip Agentrys anunciou a obtenção de US$24,5 milhões em financiamento, com MediaTek entre os investidores. Esta é uma das muitas startups emergentes que usam ferramentas agêntes para o design de semicondutores, um processo que ainda requer muito tempo e trabalho manual.", "titulo_pt": "Agentrys, startup de design de chip apoiada pela MediaTek, arrecada US$24,5 milhões", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 135057, "titulo": "ASE: CPO scale-out demands deeper supply-chain coordination for mass production", "url": "https://www.digitimes.com/news/a20260831PD223/2026-taiwan-cpo-ase-siph.html", "fonte_id": "digitimes", "data_pub": "2026-08-31T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O SEMICON Taiwan 2026 iniciou seu programa pré-exposição com o Summit Global de Fotônica de Silício.", "titulo_pt": "ASE: escala de CPO exige maior coordenação da cadeia de suprimentos para produção em massa", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 134628, "titulo": "Os caminhos tortuosos para a regulamentação da IA nos EUA", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/os-caminhos-tortuosos-para-a-regulamentacao-da-ia-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T07:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Washington enfrenta dificuldades para chegar a um consenso sobre a regulamentação da inteligência artificial enquanto os modelos de IA continuam a evoluir e apresentam comportamentos imprevistos.", "titulo_pt": "Os caminhos tortuosos para a regulamentação da IA nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 134550, "titulo": "IA tenta rastrear os fatores que levam ao sucesso ou ao fracasso na ciência", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/ia-tenta-rastrear-os-fatores-que-levam-ao-sucesso-ou-ao-fracasso-na-ciencia.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas realizavam experimentos em um laboratório em Cambridge, Massachusetts, utilizando equipamentos comuns como capelas de exaustão e incubadoras. Os procedimentos seguidos eram similares aos utilizados em laboratórios de biologia em todo o mundo.", "titulo_pt": "IA tenta identificar os fatores que levam ao sucesso ou ao fracasso na ciência", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 135078, "titulo": "Not tiger, not wolf: Australian thylacine skull reveals a far different hunting style", "url": "https://phys.org/news/2026-08-tiger-wolf-australian-thylacine-skull.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa conduzida pela Flinders University descobriu que o thylacine, um predador nativo australiano conhecido como 'tigre da Tasmanha', era significativamente diferente dos lobos e cães selvagens a que era comparado antes de ser caçado à extinção.", "titulo_pt": "Não tigre, não lobo: crânio australiano de thylacine revela um estilo de caça muito diferente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135075, "titulo": "STAT+: After a rough stretch, mRNA gets a boost — at least for now", "url": "https://www.statnews.com/2026/08/31/mrna-cancer-vaccine-intersects-politics-medicine/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-31T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com o sucesso clínico de uma vacina mRNA personalizada para melanoma, especialistas esperam um futuro mais estável para a tecnologia em outras áreas.", "titulo_pt": "Depois de um momento difícil, mrna recebe um impulso — pelo menos por agora", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 135076, "titulo": "STAT+: Cadre of radiopharmaceuticals experts pushes the bounds in cancer therapy", "url": "https://www.statnews.com/2026/08/31/radiopharmaceuticals-dosing-pushing-bounds-cancer-treatment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-31T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores acreditam que os radiofármacos têm grande potencial como tratamentos para o câncer. No entanto, eles perguntam se esses medicamentos estão sendo utilizados de forma suficientemente agressiva.", "titulo_pt": "Corpo de especialistas em radiofármacos impulsiona fronteiras no tratamento do câncer", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 135079, "titulo": "Grand Canyon flash flood leaves one dead, around 15 missing", "url": "https://phys.org/news/2026-08-grand-canyon-dead.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um flash flood no Grand Canyon deixou pelo menos uma pessoa morta e cerca de 15 desaparecidos. O incidente ocorreu em um dos principais destinos turísticos dos Estados Unidos, conforme informou a Agência de Parques Nacionais em um comunicado no domingo.", "titulo_pt": "Flash flood no grand Canyon deixa uma morta e 15 desaparecidos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135023, "titulo": "Korea’s global seed vault takes on climate crisis", "url": "https://www.koreaherald.com/article/10857770", "fonte_id": "korea_herald", "data_pub": "2026-08-31T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Como o clima se altera, a Coreia do Sul busca um papel maior na preservação de sementes que podem ajudar culturas e ecossistemas a sobreviverem a um mundo mais quente e menos previsível. O Instituto de Arboreta e Jardins da Coreia, ou KoAGI, opera o Baekdudaegan Global Seed Vault e está aumentando sua cooperação com organizações internacionais, institutos de pesquisa e governos.", "titulo_pt": "Coreia do sul assume papel maior na vala de sementes globais para enfrentar a crise climática", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 135094, "titulo": "Should we all be taking low doses of lithium to prevent Alzheimer’s?", "url": "https://www.newscientist.com/article/2586894-should-we-all-be-taking-low-doses-of-lithium-to-prevent-alzheimers/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-31T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos em animais indicam que o lithium orótico pode ajudar a prevenir a demência, e uma pesquisa humana está prestes a começar para verificar se os resultados se repetem. O colunista Alice Klein examina os benefícios e os riscos associados ao uso de lithium.", "titulo_pt": "Deveríamos todos tomar baixas doses de lítio para prevenir a Alzheimer?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 135080, "titulo": "Karina rapidly becomes a major hurricane in the Pacific far from land, forecasters say", "url": "https://phys.org/news/2026-08-karina-rapidly-major-hurricane-pacific.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Karina formou-se no Pacífico no domingo e intensificou-se rapidamente em uma tempestade perigosa em poucas horas, impulsionada por águas quentes em águas offshore.", "titulo_pt": "Karina se torna rapidamente um furacão de categoria maior no pacífico, longe das terras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135084, "titulo": "Roman lifts off on a mission to survey the infrared sky", "url": "https://www.esa.int/ESA_Multimedia/Images/2026/08/Roman_lifts_off_on_a_mission_to_survey_the_infrared_sky", "fonte_id": "esa_space", "data_pub": "2026-08-31T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Nancy Grace Roman, da NASA, foi lançado às 07:26 EDT no dia 30 de agosto de 2026, a partir do Centro Espacial Kennedy, na Flórida, EUA, a bordo de um foguete Falcon Heavy da SpaceX. O telescópio iniciou sua missão de mapear o céu no espectro visível e infravermelho para estudar a natureza da energia e da matéria escuras, bem como a diversidade de exoplanetas em nossa galáxia.", "titulo_pt": "Roman decola em missão para mapear o céu infravermelho", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 135083, "titulo": "APOD: 2026 August 31 – Launch of the Roman Space Telescope", "url": "https://science.nasa.gov/image-article/apod-2026-august-31-launch-of-the-roman-space-telescope/", "fonte_id": "nasa_news", "data_pub": "2026-08-31T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 31 de agosto de 2026 apresenta o lançamento da telescopeira espacial Roman. A imagem destaca um momento crucial na missão espacial.", "titulo_pt": "Imagem do dia: lançamento da telescopeira espacial Roman em 31 de agosto de 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 135095, "titulo": "Watch Rocket Lab launch Japanese radar satellite to orbit early on Sept. 1", "url": "https://www.space.com/space-exploration/launches-spacecraft/watch-rocket-lab-launch-japanese-radar-satellite-to-orbit-early-aug-31", "fonte_id": "space_com", "data_pub": "2026-08-31T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rocket Lab lançará um satélite de observação terrestre radar japonês à órbita na manhã de terça-feira (1º de setembro), e será possível assistir ao lançamento ao vivo.", "titulo_pt": "Acompanhe lançamento da Rocket Lab com satélite radar japonês na manhã de 1º de setembro", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 135081, "titulo": "The SKA project: A model for dialogue between historical astronomical archives, local memory and modern science", "url": "https://phys.org/news/2026-08-ska-dialogue-historical-astronomical-archives.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto SKA serve como um modelo para a diálogo entre arquivos astronômicos históricos, memória local e ciência moderna. A observação do céu pelos humanos tem sido feita há milhares de anos, inicialmente com fins práticos, como a medição do tempo e o acompanhamento das estações, e evoluindo para a compreensão científica atual, incluindo cosmologia e astrofísica.", "titulo_pt": "O projeto SKA: um modelo para o diálogo entre arquivos astronômicos históricos, memória local e ciência moderna", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135082, "titulo": "Using data to help wheat growers adapt to unpredictable weather", "url": "https://phys.org/news/2026-08-wheat-growers-unpredictable-weather.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plantação de trigo segue padrões sazonais previsíveis há gerações. No entanto, este ano, o clima inusitadamente quente em março e abril acelerou o crescimento do trigo, levando-o a um estágio de crescimento vulnerável quando temperaturas gerais muito baixas ocorreram.", "titulo_pt": "Usando dados para auxiliar os cultivadores de trigo a se adaptarem ao clima imprevisível", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135072, "titulo": "The leap second is dead. Long live the leap hour?", "url": "https://www.nature.com/articles/d41586-026-02669-0", "fonte_id": "nature_news", "data_pub": "2026-08-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A prática do segundo de salto foi abolida devido ao medo de um possível 'segundo de salto negativo'. Isso está acelerando os planos para eliminar essa prática.", "titulo_pt": "O segundo de salto morreu. Viva a hora de salto?", "veiculo": "Nature News", "pais": "Reino Unido", "classe": "A"}, {"id": 134498, "titulo": "'Cut-to-fuse' strategy: A new route for molecular skeletal editing", "url": "https://phys.org/news/2026-08-fuse-strategy-route-molecular-skeletal.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reestruturação de uma molécula sem precisar reconstruí-la do zero é um objetivo cada vez mais importante na química orgânica moderna. A edição esquelética é uma abordagem que auxilia os químicos a explorar novas estruturas químicas e simplificar a síntese de moléculas com potenciais aplicações farmacêuticas.", "titulo_pt": "Estratégia 'cut-to-fuse': um novo caminho para a edição esquelética molecular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134283, "titulo": "‘Rato-cão’ gigante de 130 milhões de anos vivia no Brasil na Formação Botucatu, descobrem cientistas", "url": "https://www.cnnbrasil.com.br/ciencia/rato-cao-gigante-de-130-milhoes-de-anos-vivia-no-brasil-na-formacao-botucatu-descobrem-cientistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram marcas de um mamífero gigante, conhecido como 'rato-cão', que vivia há 130 milhões de anos na Formação Botucatu, Brasil. Essas descobertas indicam que os mamíferos eram maiores do que se supunha durante a era dos dinossauros.", "titulo_pt": "Gigante 'rato-cão' de 130 milhões de anos era maior do que se pensava, revelam cientistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 134565, "titulo": "Precisa suplementar iodo na gravidez? Quando fazer exame de TSH? O que diz nova recomendação brasileira", "url": "https://veja.abril.com.br/saude/precisa-suplementar-iodo-na-gravidez-quando-fazer-exame-de-tsh-o-que-diz-nova-recomendacao-brasileira/", "fonte_id": "veja", "data_pub": "2026-08-31T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sociedade Brasileira de Endocrinologia e Metabolismo (SBEM) e a Federação Brasileira de Ginecologia e Obstetrícia (Febrasgo) lançaram uma recomendação adaptada para o Brasil sobre a suplementação de iodo durante a gravidez e o exame de TSH. Essa recomendação se baseia em evidências coletadas pela Associação Americana da Tireoide.", "titulo_pt": "Precisa suplementar iodo na gravidez? Quando fazer exame de TSH? Nova recomendação brasileira", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134995, "titulo": "China film studio lets tourists act in short dramas for US$30 to fight low attendance", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3365745/china-film-studio-lets-tourists-act-short-dramas-us30-fight-low-attendance?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hengdian World Studios, maior estúdio de cinema e TV do mundo, está permitindo que os turistas filmem suas próprias dramatizações por cerca de 200 yuan (US$30) por pessoa como uma resposta à recessão causada pela inteligência artificial. Anteriormente, os turistas visitavam o local para admirar os cenários de suas séries favoritas e explorar a atração turística nacional de 5A, que abrange mais de 100 sub-studios em 30 km quadrados e retrata 5.000 anos de história.", "titulo_pt": "Estúdio chinês de cinema permite que turistas filmem dramatizações por 30 dólares para combater baixa procura", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 135093, "titulo": "Seeing Krasner and Pollock Together", "url": "https://hyperallergic.com/seeing-krasner-and-pollock-together/", "fonte_id": "hyperallergic", "data_pub": "2026-08-31T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A artista Lia Strasser discute erros em sua percepção sobre o casal abstracionista Krasner e Pollock, menciona homenagens ao artista japonês Yayoi Kusama e relata outro roubo em museu.", "titulo_pt": "Vendo Krasner e Pollock juntos", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 135113, "titulo": "On the Fact and Fiction of Kurt Vonnegut’s Dresden", "url": "https://lithub.com/on-the-fact-and-fiction-of-kurt-vonneguts-dresden/", "fonte_id": "lithub", "data_pub": "2026-08-31T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto descreve como Kurt Vonnegut relata a chegada do trem em Dresden por volta das cinco da tarde. Segundo ele, o horizonte da cidade foi apresentado aos americanos como um dos mais belos que tinham visto, com uma paisagem complexa e voluptuosa.", "titulo_pt": "Sobre o fato e a ficção em Dresden de Kurt Vonnegut", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 135114, "titulo": "Marlon James on (Finally) Writing a Novel That Draws From His Life", "url": "https://lithub.com/marlon-james-on-finally-writing-a-novel-that-draws-from-his-life/", "fonte_id": "lithub", "data_pub": "2026-08-31T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O narrador do romance 'The Disappearers', de Marlon James, afirma ter cometido erros significativos como gay. O livro aborda protagonistas gays em Jamaica nos anos 80 e 90, que fazem declarações semelhantes.", "titulo_pt": "Marlon James sobre (finalmente) escrever um romance que se baseia em sua vida", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 135115, "titulo": "Fun, Feminine and Fundamental: In Defense of Frivolity", "url": "https://lithub.com/fun-feminine-and-fundamental-in-defense-of-frivolity/", "fonte_id": "lithub", "data_pub": "2026-08-31T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora chegou aos quarenta anos e percebeu o início dos sinais do envelhecimento na sua pele, comparando-se a uma composição cubista. Ela declarou que o ano seria o 'Ano da Pele Perfeita'.", "titulo_pt": "Divertido, feminino e Fundamental: em defesa do frivolidade", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 135116, "titulo": "What Does Beatlemania Have to Teach Us About Pop Culture Today?", "url": "https://lithub.com/what-does-beatlemania-have-to-teach-us-about-pop-culture-today/", "fonte_id": "lithub", "data_pub": "2026-08-31T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samira Ahmed, apresentadora da BBC e da Channel 4, e o best-seller autor de Little, Brown, discutem sobre o impacto da Beatlemania na cultura pop atual em um episódio recentemente lançado na série BFI Film Classics da Bloomsbury.", "titulo_pt": "O que a Beatlemania pode nos ensinar sobre a cultura Pop hoje?", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 135117, "titulo": "Meet Pierre “Peter” Ortiz, Undercover Spy, Marine and Resistance Fighter", "url": "https://lithub.com/meet-pierre-peter-ortiz-undercover-spy-marine-and-resistance-fighter/", "fonte_id": "lithub", "data_pub": "2026-08-31T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor ouviu uma vez a voz do seu avô, durante um episódio de 1949 do programa de rádio This Is Your Life da NBC, quando o alry-and-25-more-books-out-in-paperback-this-september/", "fonte_id": "lithub", "data_pub": "2026-08-31T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, várias publicações em formato de capa mole serão lançadas, incluindo estreias, segundas edições, traduções e novos trabalhos de autores consagrados. O artigo lista vinte e cinco títulos interessantes para considerar.", "titulo_pt": "Adam Johnson, Muriel Spark, rivalidade bardíca… e 25 livros em capa mole lançados em setembro", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 135024, "titulo": "After gimbap festival success, Gimcheon is getting a Gimbap Street", "url": "https://www.koreaherald.com/article/10857763", "fonte_id": "korea_herald", "data_pub": "2026-08-31T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gimcheon, uma cidade na província de North Gyeongsang, está transformando uma campanha de turismo, inicialmente baseada em um mal-entendido sobre o nome da cidade, em uma atração permanente. A cidade está criando uma rua dedicada ao gimbap, chamada Gimbap Street, que abrigará não apenas restaurantes de gimbap, mas também barracas de snacks e lojas de produtos relacionados.", "titulo_pt": "Depois do sucesso da festa de Gimbap, Gimcheon está planejando uma rua do Gimbap", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 135090, "titulo": "84 Museum Exhibitions and Biennials to See This Fall", "url": "https://www.artnews.com/list/art-news/news/fall-art-preview-1234792473/", "fonte_id": "artnews", "data_pub": "2026-08-31T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este outono, há 84 exposições de museus e bienais para se visitar, incluindo uma retrospectiva de Roy Lichtenstein e a Tapestra de Bayeux.", "titulo_pt": "84 Exposições de museus e bienais para visitar neste outono", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 13461 ciária de Brasília", "url": "https://veja.abril.com.br/brasil/lider-de-faccao-cartel-do-sul-e-encontro-morto-em-cela-em-penitenciaria-de-brasilia/", "fonte_id": "veja", "data_pub": "2026-08-30T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O líder da facção criminosa Cartel do Sul foi encontrado sem vida em sua cela na penitenciária de Brasília durante a primeira rotina da manhã.", "titulo_pt": "Líder da facção Cartel do Sul é encontrado morto em cela da penitenciária de Brasília", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134402, "titulo": "Senapred actualiza balance por tornado en Yungay: 63 afectados y una vivienda destruida", "url": "https://www.latercera.com/nacional/noticia/senapred-actualiza-balance-por-tornado-en-yungay-63-afectados-y-una-vivienda-destruida/", "fonte_id": "la_tercera", "data_pub": "2026-08-30T21:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred (Secretaría Nacional de Mitigación del Riesgo de Desastres) atualizou o balanço do tornado em Yungay, registrando 63 pessoas afetadas, 12 damnificadas, sete casas danificadas gravemente e não habitáveis e 17 casas sob avaliação. A entidade continua fornecendo assistência às famílias afetadas, enquanto as alertas meteorológicas relacionadas ao fenômeno foram canceladas.", "titulo_pt": "Senapred atualiza balanço do tornado em Yungay: 63 afetados e uma residência destruída", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 134231, "titulo": "Moradora do DF tem parada cardíaca em endoscopia e aguarda leito de UTI", "url": "https://www.metropoles.com/distrito-federal/na-mira/moradora-do-df-tem-parada-cardiaca-durante-endoscopia-e-vai-parar-na-uti", "fonte_id": "metropoles", "data_pub": "2026-08-30T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma moradora do Distrito Federal teve uma parada cardíaca durante uma endoscopia e foi levada ao Hospital Regional de Planaltina, onde precisou ser intub do pela Polícia Civil do Rio de Janeiro após ser espancado. O estudante nega acusações e afirma não ser nazista.", "titulo_pt": "Estudante espancado na UFRJ nega ser nazista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133715, "titulo": "Aluna e orientadora morrem e Unicamp cria procedimento inédito para defesa póstuma de tese", "url": "https://www.cnnbrasil.com.br/ciencia/aluna-e-orientadora-morrem-e-unicamp-cria-procedimento-inedito-para-defesa-postuma-de-tese/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A morte de uma aluna e sua orientadora levou à criação de um procedimento inédito pela Unicamp para a defesa póstuma da tese. A universidade desenvolveu regras para que o trabalho fosse reconhecido e publicado.", "titulo_pt": "Aluna e orientadora falecem e Unicamp cria procedimento inédito para defesa póstuma de tese", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133662, "titulo": "Malévola Alves é presa após se envolver em confusão e briga em SP", "url": "https://www.metropoles.com/colunas/fabia-oliveira/malevola-alves-e-presa-apos-se-envolver-em-confusao-e-briga-em-sp", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A influenciadora Malévola Alves foi detida em São Paulo após uma briga em uma festa e posteriormente liberada após pagar fiança.", "titulo_pt": "Malévola Alves é presa após briga em festa em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 134890, "titulo": "Flash flood hits Grand Canyon’s Phantom Ranch, more than 20 people missing", "url": "http://www.euronews.com/video/2026/08/31/flash-flood-hits-grand-canyons-phantom-ranch-more-than-20-people-missing", "fonte_id": "euronews", "data_pub": "2026-08-31T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma cheia repentina atingiu a Fenda do Grande Cañão perto da Ranch de Fantasma, lançando detritos no Rio Colorado, destruindo pontes de madeira e deixando mais de 20 pessoas desaparecidas ou não localizadas.", "titulo_pt": "Cheia repentina atinge fenda do grande cañão, mais de 20 pessoas desaparecidas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134622, "titulo": "China alerta que lago formado após deslizamento pode subir com chuva", "url": "https://www.cnnbrasil.com.br/internacional/china-alerta-que-lago-formado-apos-deslizamento-pode-subir-com-chuva/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T08:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China alertou que o nível do lago formado após o deslizamento pode aumentar com a chuva. A temperatura pode cair para até 8°C, com uma grande diferença entre o dia e a noite, e o clima pode ficar úmido e frio.", "titulo_pt": "China avisa que nível do lago pode subir com chuva após deslizamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134872, "titulo": "Yosemite, Big Bend, Utah: Trump unleashes wave of attacks on US national parks", "url": "https://www.lemonde.fr/en/environment/article/2026/08/31/yosemite-big-bend-utah-trump-unleashes-wave-of-attacks-on-us-national-parks_6757005_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos está considerando transferir uma pequena parte do Parque Nacional Yosemite para um desenvolvedor privado. Este plano de expandir a área protegida tem gerado forte reação pública.", "titulo_pt": "Yosemite, Big Bend, Utah: trump lança onda de ataques aos parques nacionais dos EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 135007, "titulo": "Malaysia’s air quality turns hazardous as Indonesian wildfires burn", "url": "https://www.scmp.com/week-asia/health-environment/article/3365818/malaysias-air-quality-turns-hazardous-indonesian-wildfires-burn?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar na região de Sarawak, na Malásia, atingiu níveis perigosos devido às chamas de incêndios florestais na Indonésia. A cidade de Serian registrou um índice de poluição do ar (API) de 476, enquanto Kuching, Samarahan e Sri Aman registraram leituras acima de 300 no início da manhã.", "titulo_pt": "Qualidade do ar na malásia piora com incêndios florestais na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134892, "titulo": "Nepal flood death toll passes 900 as search for survivors continues", "url": "http://www.euronews.com/video/2026/08/31/nepal-flood-death-toll-passes-900-as-search-for-survivors-continues", "fonte_id": "euronews", "data_pub": "2026-08-31T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatadores em Nepal e Tibet continuaram buscando sobreviventes no domingo após cheias flash ao longo da fronteira que mataram centenas e deixaram milhares desaparecidos, com ajuda aérea sendo enviada para distritos isolados.", "titulo_pt": "Número de mortos por cheias no nepal e tibet alcança mais de 900", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134894, "titulo": "'They wrote little letters': How kids in Portugal are making money off their neighbours' plastic waste", "url": "http://www.euronews.com/2026/08/31/i-dont-mind-begging-volta-offers-an-opportunity-to-many", "fonte_id": "euronews", "data_pub": "2026-08-31T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa de depósito de garrafas foi implementado pela primeira vez na Europa do Sul, ajudando o meio ambiente e financiando viagens incluídas nas listas de desejos de crianças portuguesas.", "titulo_pt": "Eles escreveram pequenas letras: como crianças em Portugal estão ganhando dinheiro com o lixo plástico dos vizinhos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134950, "titulo": "Global coral reef coverage risks irreversible decline, new report warns", "url": "https://www.aljazeera.com/news/2026/8/31/global-coral-reef-coverage-risks-irreversible-decline-new-report-warns?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cobertura global de corais está em risco de um declínio irreversível, conforme alerta um relatório recente. Os corais representam apenas 1% da cobertura marinha, mas abrigam cerca de 25% da vida marinha.", "titulo_pt": "Cobertura global de corais em risco de declínio irreversível, alerta relatório", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134897, "titulo": "Authorities in Nepal carry out temporary burials of unidentified flood victims causing public outrage", "url": "http://www.euronews.com/2026/08/31/authorities-in-nepal-carry-out-temporary-burials-of-unidentified-flood-victims-causing-pub", "fonte_id": "euronews", "data_pub": "2026-08-31T04:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades no Nepal realizaram sepultamentos temporários de centenas de vítimas fatais das inundações, causando indignação pública, que acusa as autoridades de não seguir os ritos hindus de sepultamento e de mal administrar a situação.", "titulo_pt": "Autoridades na Nepal realizam sepultamentos temporários de vítimas de inundações, causando indignação", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134873, "titulo": "'No regulation exists:' Suez Canal becomes gateway for invasive species in the Mediterranean", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/31/no-regulation-exists-suez-canal-becomes-gateway-for-invasive-species-in-the-mediterranean_6757001_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T03:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suez Canal, um canal histórico, se tornou um caminho para espécies invasoras no Mediterrâneo. A proliferação dessas espécies, nomeadas 'Lessepsian', está aumentando devido a sobrepeixe, poluição, construção costeira e mudanças climáticas.", "titulo_pt": "Nenhuma regulamentação existe:", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 134214, "titulo": "Onda de calor dispara termômetros em São Paulo nesta segunda-feira, 31, e Sul tem sinal de alerta para chuvas", "url": "https://veja.abril.com.br/agenda-verde/onda-de-calor-dispara-termometros-em-sao-paulo-nesta-segunda-feira-31-e-sul-tem-sinal-de-alerta-para-chuvas/", "fonte_id": "veja", "data_pub": "2026-08-30T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A temperatura aumentou significativamente em São Paulo nesta segunda-feira, 31, e o Sul do país tem sinal de alerta para chuvas. O Climatempo prevê tempo firme na capital paulista durante todo o dia.", "titulo_pt": "Onda de calor atinge São Paulo e Sul recebe alerta para chuvas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134298, "titulo": "Aquecimento global: Clima muda e Pacífico e Índico deixam de agir em sintonia", "url": "https://olhardigital.com.br/2026/08/30/ciencia-e-espaco/aquecimento-global-clima-muda-e-pacifico-e-indico-deixam-de-agir-em-sintonia/", "fonte_id": "olhar_digital", "data_pub": "2026-08-30T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aquecimento global alterou a relação entre o Oceano Pacífico e o Índico, afetando um padrão climático usado para compreender e prever as condições meteorológicas.", "titulo_pt": "Aquecimento global: relação entre Pacífico e Índico muda", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 134246, "titulo": "Novo ciclone extratropical aumenta risco de alagamentos e deslizamentos no Sul", "url": "https://exame.com/brasil/novo-ciclone-extratropical-aumenta-risco-de-alagamentos-e-deslizamentos-no-sul/", "fonte_id": "exame", "data_pub": "2026-08-30T18:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo ciclone extratropical está aumentando o risco de alagamentos e deslizamentos de terra nas regiões do Sul do Brasil, especialmente na Serra Gaúcha, Planalto Norte e Missões.", "titulo_pt": "Novo ciclone extratropical aumenta risco de alagamentos e deslizamentos no Sul", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 133716, "titulo": "Nepal enterra quase 200 corpos em floresta por lotação de necrotérios", "url": "https://www.cnnbrasil.com.br/internacional/nepal-enterra-quase-200-corpos-em-floresta-por-lotacao-de-necroterios/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate recuperaram 272 corpos não identificados provenientes do Tibete, na China, após as enchentes devastadoras na região do Himalaia. O Nepal enterrou quase 200 corpos em uma floresta devido à lotação dos necrotérios.", "titulo_pt": "Nepal enterra quase 200 corpos em floresta por lotação de necrotérios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133718, "titulo": "“Me sinto perdida”, diz mulher no Nepal ao perder 17 familiares em enchente", "url": "https://www.cnnbrasil.com.br/internacional/me-sinto-perdida-diz-mulher-no-nepal-ao-perder-17-familiares-em-enchente/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher no Nepal relatou sentir-se perdida após perder 17 familiares em enchentes. O número de mortos em inundações no Nepal e na China ultrapassou 800 pessoas, de acordo com a atualização policial.", "titulo_pt": "‘Me sinto perdida’, diz mulher após perder 17 familiares em enchente no Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133993, "titulo": "Death toll nears 800 after Himalayan glacier collapse", "url": "https://www.aljazeera.com/news/2026/8/30/death-toll-nears-800-after-himalayan-glacier-collapse?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos chega perto de 800 após o colapso de um gelo na Himaláia. Equipes especializadas de busca e resgate se juntaram às operações de recuperação em Nepal e China.", "titulo_pt": "Óbitos próximos de 800 após colapso de gelo na himaláia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134101, "titulo": "Heavy rains batter southern region, flooding roads, trapping hikers", "url": "https://en.yna.co.kr/view/AEN20260830004300315", "fonte_id": "yonhap_news", "data_pub": "2026-08-30T13:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fortes chuvas atingiram a região sul, inundando estradas e isolando caminhantes.", "titulo_pt": "Fortes chuvas castigam região sul, inunda estradas e isolam caminhantes", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 134891, "titulo": "UN racial discrimination committee presents legal case for broad slavery reparations", "url": "http://www.euronews.com/2026/08/31/un-racial-discrimination-committee-presents-legal-case-for-broad-slavery-reparations", "fonte_id": "euronews", "data_pub": "2026-08-31T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documento aprovado recentemente, mas publicado recentemente, está previsto para fornecer um novo instrumento legal que apoia as reivindicações de indenizações relacionadas à discriminação racial. Este documento, que foi aprovado pela Comissão da ONU contra a Discriminação Racial, visa fortalecer os argumentos para reparações abrangentes por escravidão.", "titulo_pt": "Comissão da ONU contra a discriminação racial apresenta caso legal para reparações amplos por escravidão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134754, "titulo": "Australians missing in Nepal targeted by ‘heartbreaking’ and ‘abhorrent’ racist slurs", "url": "https://www.theguardian.com/australia-news/2026/aug/31/australians-missing-in-nepal-targeted-by-heartbreaking-and-abhorrent-racist-slurs", "fonte_id": "guardian_world", "data_pub": "2026-08-31T06:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australianos desaparecidos na Nepal-Tibet são alvo de comentários racistas nas redes sociais, levando a pedidos de maior responsabilidade das plataformas para remover esse tipo de discurso abjetivo. O número de australianos desaparecidos após inundações causadas por um colapso de geleira no Himalaia subiu para 43.", "titulo_pt": "Australianos desaparecidos na nepal-tibet alvo de insultos racistas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 134824, "titulo": "The Measles-Stricken Mother Who Lost Her Newborn Son", "url": "https://www.theatlantic.com/health/2026/08/pennsylvania-measles-infant-death-family/688469/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-30T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família no centro do controvérsio sobre sarampo em Pensilvânia relata sua história. A mãe infectada com sarampo perdeu seu filho recém-nascido.", "titulo_pt": "A mãe infectada com sarampo que perdeu seu filho recém-nascido", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 134399, "titulo": "Tres imputados vinculados a explotación sexual de una menor de edad en Talca quedan en prisión preventiva", "url": "https://www.latercera.com/nacional/noticia/tres-imputados-vinculados-al-comercio-sexual-de-una-menor-de-edad-en-talca-quedan-en-prision-preventiva/", "fonte_id": "la_tercera", "data_pub": "2026-08-30T21:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram vinculadas à exploração sexual de uma menor em Talca e permanecem em prisão preventiva. A vítima foi resgatada no dia 26 de agosto, durante as detenções e buscas.", "titulo_pt": "Três acusados de exploração sexual de menor em Talca permanecem em prisão preventiva", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 134022, "titulo": "Red Cross transfers freed Palestinian detainees to Gaza's Nasser Hospital", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/red-cross-transfers-freed-palestinian-detainees-gazas-nasser-hospital", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Internacional da Cruz Vermelha (ICRC) transferiu 13 detidos palestinos libertados da fronteira de Kerem Shalom para o Hospital Nasser em Gaza, ajudando também na reunião deles com suas famílias. O ICRC afirmou que tem sido negado acesso a detidos em instalações de detenção israelenses desde outubro de 2023 e pediu às autoridades israelenses que divulguem as localizações e permitam visitas.", "titulo_pt": "Icrc transfere detidos palestinos libertados para Hospital de Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133999, "titulo": "Rohingya crisis: Aid falls and hope fades", "url": "https://www.aljazeera.com/video/talk-to-al-jazeera/2026/8/30/rohingya-crisis-aid-falls-and-hope-fades?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O representante da UNHCR em Bangladesh, Ivo Freisen, alerta que a diminuição da assistência está diminuindo as esperanças dos refugiados rohingya.", "titulo_pt": "Crise rohingya: ajuda diminui e esperança se esvai", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134064, "titulo": "Backlash grows after Hong Kong authorities seize second ‘fighting dog’ in week", "url": "https://www.scmp.com/news/hong-kong/society/article/3365764/backlash-grows-after-hong-kong-authorities-seize-second-fighting-dog-week?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Hong Kong enfrentam crescente rejeição após apreender um 'cão de luta' devido a uma denúncia de vizinho e detê-lo para avaliação comportamental. Esta é a segunda apreensão de cão com linhagem de pit bull na semana, ocorrendo no contexto de maior preocupação pública sobre a gestão canina, devido a uma série de ataques recentes, incluindo um em que uma mulher foi mordida e posteriormente encontrada morta.", "titulo_pt": "Rejeição cresce após autoridades de Hong Kong apreenderem segundo 'cão de luta' em uma semana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133484, "titulo": "Pakistan suspends 8 officials after maternity ward fire kills 14 infants", "url": "https://www.scmp.com/news/asia/south-asia/article/3365749/pakistan-suspends-8-officials-after-maternity-ward-fire-kills-14-infants?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Paquistão suspendeu oito funcionários após um incêndio em uma unidade materna de um hospital na capital do país resultar na morte de 14 bebês. Um relatório preliminar indicou que o fogo consumiu a unidade em aproximadamente dois minutos após as 6h30 de quarta-feira, com apenas um dos 15 bebês sob cuidado salvo por uma enfermeira.", "titulo_pt": "Paquistão suspende 8 funcionários após incêndio em unidade materna matar 14 bebês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133807, "titulo": "Granjas de bots y la extrema derecha", "url": "https://www.ciperchile.cl/2026/08/30/granjas-de-bots-y-la-extrema-derecha/?utm_source=rss&utm_medium=rss&utm_campaign=granjas-de-bots-y-la-extrema-derecha", "fonte_id": "ciper_chile", "data_pub": "2026-08-30T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto aborda o tema das granjas de bots e a extrema direita. Não há detalhes adicionais sobre o conteúdo do artigo.", "titulo_pt": "Granjas de bots e a extrema direita", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 133454, "titulo": "Killing of Palestinian children and teens by Israel surges in West Bank", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/west-bank-palestinian-children-teens-israel/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezesseis meses após outubro de 2023, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses na Cisjordânia.", "titulo_pt": "Evolução no número de crianças e adolescentes palestinos mortos por forças israelenses na cisjordânia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 134035, "titulo": "Some migrants ready to pack bags fearing far-right win in east German state", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/politics/east-germany-migrants-far-right-afd/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partido anti-imigrante, islâmofóbico e pró-Rússia, AfD está prestes a vencer na estado de Saxe-Anhalt, com a possibilidade de conquistar sua primeira maioria governamental.", "titulo_pt": "Alguns imigrantes prontos para embalar suas malas diante de vitória da extrema-direita no estado alemão de saxe-anhalt", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 133105, "titulo": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "url": "https://www.cnnbrasil.com.br/politica/stf-julga-licenca-para-maes-adotivas-e-recusa-de-transfusao-em-setembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em setembro, o Supremo Tribunal Federal (STF) julgará questões relacionadas a licença para mães adotivas, recusa de transfusão sanguínea, planos de saúde de idosos, gratuidade na Justiça do Trabalho e recusa de tratamento médico.", "titulo_pt": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133277, "titulo": "A lone Black woman’s defiance of Swedish neo-Nazis, 10 years on", "url": "https://www.theguardian.com/world/2026/aug/30/sweden-neo-nazi-resistance-2016-tess-asplund-far-right", "fonte_id": "guardian_world", "data_pub": "2026-08-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2016, Tess Asplund, uma mulher negra sozinha, levantou o punho em protesto contra uma parada de neonazistas em Estocolmo. Dez anos depois, ela vê a foto como um sinal dos mudanças na sociedade sueca, especialmente com a ascensão do extremismo de direita nas eleições.", "titulo_pt": "A defesa sozinha de uma mulher negra contra neonazistas, 10 anos depois", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133269, "titulo": "Humanitarian crisis worsening in refuge for civilians fleeing Sudan’s civil war", "url": "https://www.theguardian.com/world/2026/aug/30/humanitarian-crisis-worsening-refuge-civilians-sudan-el-obeid", "fonte_id": "guardian_world", "data_pub": "2026-08-30T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As condições humanitárias na cidade de El Obeid e nas duas acampamentos próximos estão se agravando, com mais pessoas chegando todos os dias devido ao conflito entre as Forças Armadas Sudanêsas e a Milícia Rapid Support Forces (RSF). Segundo a ONU, mais de 15.000 famílias chegaram desde julho, somando-se a mais de 200.000 que chegaram no primeiro semestre do ano, de acordo com os dados do governo.", "titulo_pt": "Situação humanitária se agrava em refúgio para civis que fogem da guerra no sudão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133417, "titulo": "Amnesty urges action after Katz threatens expulsions over Gaza kites", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/amnesty-urges-action-after-katz-likens-gaza-kites-drones", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T05:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International pediu ação após Israel ameaçar expulsar palestinos por voar kites em Gaza. O ministro de Defesa israelense, Israel Katz, instruiu o exército a expulsar palestinos de áreas onde crianças estão voando kites e liberando balões.", "titulo_pt": "Amnistia pede ação após ameaças de expulsões por causa de kites em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133422, "titulo": "Amnesty calls for Dr Abu Safiya's release as he completes 600 days in Israeli detention", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/amnesty-calls-dr-abu-safiyas-release-he-completes-600-days-israeli", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T02:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International está pedindo a liberdade do pediatra palestino Hussam Abu Safiya, que foi detido israelense há 600 dias sem acusação ou julgamento. Ele é diretor do Hospital Kamal Adwan em Gaza e se tornou internacionalmente conhecido durante o genocídio israelense devido ao seu trabalho em auxiliar vítimas.", "titulo_pt": "Amnistia pede liberdade de Dr. Abu Safiya após 600 dias em detenção israelense", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 134565, "fonte_id": "veja", "titulo": "Precisa suplementar iodo na gravidez? Quando fazer exame de TSH? O que diz nova recomendação brasileira", "url": "https://veja.abril.com.br/saude/precisa-suplementar-iodo-na-gravidez-quando-fazer-exame-de-tsh-o-que-diz-nova-recomendacao-brasileira/", " const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
