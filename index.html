, "pais": "Taiwan", "classe": "B"}, {"id": 283169, "titulo": "Data center policy review reveals 'chaotic' patchwork of rules across all 50 states", "url": "https://phys.org/news/2026-11-center-policy-reveals-chaotic-patchwork.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A revisão da política de centrais de dados revelou uma coleção desorganizada de regras em todos os 50 estados americanos. O boom da inteligência artificial levanta debates sobre a localização dessas centrais de dados, seu tamanho e como garantir que as comunidades beneficiem-se delas.", "titulo_pt": "Revisão da política de centrais de dados revela 'cenário caótico' de regras em 50 estados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283170, "titulo": "Satellite observations show how rain breaks up Earth's natural sunshades", "url": "https://phys.org/news/2026-11-satellite-earth-natural-sunshades.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O satélite EarthCARE da Agência Espacial Europeia está fornecendo novas informações sobre o papel das nuvens no controle do clima da Terra. As últimas descobertas indicam que a chuva é um dos principais fatores que contribuem para a fragmentação de extensas nuvens brancas que ajudam a refrescar o planeta.", "titulo_pt": "Observações de satélite mostram como a chuva quebra as barreiras naturais de sol da terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283171, "titulo": "Some people claim to speak many languages. But what does it really mean to be a polyglot?", "url": "https://phys.org/news/2026-11-people-languages-polyglot.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente metade da população mundial fala mais de uma língua. A fluência em duas ou três línguas é bastante diferente da afirmada fluência em cinco, dez ou mais línguas.", "titulo_pt": "Algumas pessoas afirmam falar muitas línguas, mas o que significa ser um poliglota?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 282779, "titulo": "Fiocruz, MS e Oxford se unem para criar vacina brasileira contra o câncer", "url": "https://www.metropoles.com/saude/fiocruz-ms-e-oxford-se-unem-para-criar-vacina-brasileira-contra-o-cancer", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiocruz, em parceria com o MS e a Oxford, está desenvolvendo uma vacina contra o câncer. A expectativa é iniciar os estudos clínicos no início de 2027.", "titulo_pt": "Fiocruz, MS e Oxford unem-se para criar vacina contra o câncer brasileira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282916, "titulo": "Las imágenes satelitales de la NASA que muestran cómo El Niño transformó al desierto de Atacama", "url": "https://www.lanacion.com.ar/el-mundo/las-imagenes-satelitales-publicadas-por-la-nasa-que-muestran-el-antes-y-el-despues-de-el-nino-en-el-nid23112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-23T21:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A NASA registrou imagens satelitais de uma florada histórica no norte do Chile, onde o fenômeno El Niño transformou o deserto árido de Atacama em um paisagem colorida.", "titulo_pt": "Imagens da NASA mostram como El Niño transformou o deserto de Atacama em um manto de cores", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 283168, "titulo": "STAT+: Limb-girdle muscular dystrophy gets its first FDA-approved drug, from BridgeBio", "url": "https://www.statnews.com/2026/11/23/fda-approves-bridgebio-lgmd-drug-welgemda/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-23T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro medicamento para uma forma de distrofia muscular gângliosa foi aprovado pela FDA. A empresa BridgeBio tem potencial para ganhar bilhões de dólares anuais com a venda desse medicamento.", "titulo_pt": "Distrofia muscular gângliosa recebe seu primeiro medicamento aprovado pela fda, de BridgeBio", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 283226, "titulo": "Join our free Space.com membership giveaway for a chance to win this Dwarflab mini smart telescope worth $419!", "url": "https://www.space.com/stargazing/skywatching-kit/join-our-free-space-com-membership-giveaway-for-a-chance-to-win-this-dwarflab-mini-smart-telescope-worth-usd419", "fonte_id": "space_com", "data_pub": "2026-11-23T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe da comunidade do Space.com lançou uma nova promoção exclusiva para os membros Space+. Os interessados podem se inscrever gratuitamente para a chance de ganhar uma telescopiógrafo Dwarflab Mini, avaliada em $419.", "titulo_pt": "Participe da nossa promoção gratuita do Space.Com e tenha chance de ganhar um telescopiógrafo Dwarflab mini worth $419!", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 283172, "titulo": "Reparations can work when claims are grounded in solid evidence", "url": "https://phys.org/news/2026-11-reparations-grounded-solid-evidence.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No encontro da Commonwealth em Antígua em novembro de 2026, o Rei Carlos da Grã-Bretanha expressou pesar pelo papel da Grã-Bretanha no comércio de escravos.", "titulo_pt": "Reparações podem funcionar quando as reivindicações estão fundamentadas em evidências sólidas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283173, "titulo": "Stellar pulses reveal hidden binary in JWST calibration star sample", "url": "https://phys.org/news/2026-11-stellar-pulses-reveal-hidden-binary.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estrelas usadas para calibrar o Telescópio Espacial James Webb (JWST) precisam ter espectros bem caracterizados para que suas fluxas possam ser medidas com precisão. HD 158485, uma estrela do tipo A no programa de calibração do JWST, foi descoberta ser um sistema binário, com ambas as estrelas pulsando.", "titulo_pt": "Pulsos estelares revelam sistema binário oculto na amostra de calibração do JWST", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283174, "titulo": "Which pollen is found in honey? Automated analysis closely matches conventional testing", "url": "https://phys.org/news/2026-11-pollen-honey-automated-analysis-conventional.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um método de análise automática de polen baseado em inteligência artificial foi desenvolvido por uma equipe de pesquisa do Centro Helmholtz para Pesquisas Ambientais (UFZ) e do Centro Alemão de Biodiversidade Integrativa (iDiv) em Leipzig, em colaboração com outros parceiros. Este método visa substituir a análise de polen tradicional, que é demorada e requer especialistas.", "titulo_pt": "Qual polênse está no mel? Método automático de análise se aproxima do teste convencional", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283195, "titulo": "NASA Awards Contract for NOAA’s Near Earth Orbit Network Program", "url": "https://www.nasa.gov/news-release/nasa-awards-contract-for-noaas-near-earth-orbit-network-program/", "fonte_id": "nasa_news", "data_pub": "2026-11-23T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA, em nome da NOAA, concedeu uma contratação para a Northrop Grumum Systems Corporation para desenvolver instrumentos Sounder for Microwave-Based Applications (SMBA) para os satélites da rede Near Earth Orbit (NEON) da NOAA. O valor total do contrato é de $290,6 milhões.", "titulo_pt": "NASA contrata northrop grumman para programa de rede de orbits de terra próximas da NOAA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 283194, "titulo": "Math’s holy grail, the Riemann hypothesis, appears solved with AI’s help", "url": "https://www.sciencenews.org/article/riemann-hypothesis-solved-math-ai", "fonte_id": "science_news", "data_pub": "2026-11-23T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suposto provimento resolveu um enigma matemático de 167 anos relacionado aos números primos, com a colaboração de um matemático humano e inteligência artificial.", "titulo_pt": "Hipótese de Riemann, enigma matemático de 167 anos, parece ter sido resolvido com ajuda de IA", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 283175, "titulo": "Discovery of curse ritual in trash dump surprises Egyptologist: 'It must have been widespread in ancient Egypt'", "url": "https://phys.org/news/2026-11-discovery-curse-ritual-trash-dump.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram 40 fragmentos de papiro carbonizados em um templo na antiga cidade de Tebas, que estão revolucionando a compreensão dos rituais de maldições da antiga Egito. Os fragmentos indicam que o ritual era provavelmente muito mais comum do que se acreditava anteriormente.", "titulo_pt": "Descoberta de ritual de maldições no lixo surpreende egípcio: 'ele deve ter sido muito comum na antiga egito'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 283176, "titulo": "A fungus that can survive in Chernobyl could help create materials that trap and break down nerve agents and pesticides", "url": "https://phys.org/news/2026-11-fungus-survive-chernobyl-materials-nerve.html", "fonte_id": "phys_org", "data_pub": "2026-11-23T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma área da Zona Excluída de Chernobyl, onde os níveis de radiação permanecem altos há 40 anos, fungos pretos se proliferam nas paredes do antigo reator nuclear ucraniano. Esses fungos não são afetados pela radiação e, na verdade, crescem em direção a ela.", "titulo_pt": "Um fungo que sobrevive em Chernobyl pode auxiliar na criação de materiais que capturam e descompostam agrotóxicos e agentes nervosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 282933, "titulo": "Anvisa aprova novo medicamento contra o câncer de mama", "url": "https://www.jota.info/saude/anvisa-aprova-novo-medicamento-contra-o-cancer-de-mama", "fonte_id": "jota", "data_pub": "2026-11-23T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa aprovou o medicamento Hertuzo (pertuzumabe) para o tratamento do câncer de mama em diferentes estágios da doença, sempre em combinação com outros remédios.", "titulo_pt": "Anvisa aprova novo medicamento contra o câncer de mama", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 282677, "titulo": "RedeTV! acaba com programa de João Kleber por baixa audiência e demite 50% da equipe", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/redetv-acaba-com-programa-de-joao-kleber-por-baixa-audiencia-e-demite-50-da-equipe.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-23T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A RedeTV! cancelou o programa 'Para Aqui', comandado por João Kleber, devido à baixa audiência e demitiu 50% da equipe. A atração, exibida desde março de 2025, não irá ao ar neste fim de semana.", "titulo_pt": "Redetv! Cancela programa de João Kleber e demite metade da equipe", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 283209, "titulo": "AI Film ‘Gods Don’t Give Gifts’ Deemed Ineligible by Academy for Best Animated Feature Oscar", estações ocorreram enquanto o governo belga lutava para concordar com seu orçamento para 2027.", "titulo_pt": "Bélgica: trabalhadores marcham contra cortes orçamentários enquanto custos de vida aumentam", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 282897, "titulo": "Transporte público y salud mental: el costo emocional de cruzar Santiago a diario", "url": "https://www.latercera.com/paula/noticia/transporte-publico-y-salud-mental-el-costo-emocional-de-cruzar-santiago-a-diario/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Carmen leva mais de 90 minutos todos os dias para ir de Quinta Normal a Vitacura no transporte público de Santiago. Este tempo prolongado e a dificuldade de encontrar transporte são parte da pesquisa realizada pela Faculdade de Psicologia da Universidade de Chile sobre o impacto dos viagens no bem-estar dos usuários de transporte público.", "titulo_pt": "Transporte público e saúde mental: o custo emocional de cruzar Santiago diariamente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 282935, "titulo": "Gabinete do sexo: Presidente do TJPR abre PAD contra juiz acusado de transformar fórum em motel", "url": "https://www.jota.info/justica/gabinete-do-sexo-presidente-do-tjpr-abre-pad-contra-juiz-acusado-de-transformar-forum-em-motel", "fonte_id": "jota", "data_pub": "2026-11-23T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal de Justiça do Paraná (TJPR) abriu um processo administrativo disciplinar (PAD) contra o juiz Julio Cezar Vicentini, acusado de transformar um fórum em um local para encontros íntimos. Segundo o PAD, foram ouvidos gemidos e encontradas peças íntimas no gabinete do juiz.", "titulo_pt": "Presidente do TJPR abre PAD contra juiz acusado de transformar fórum em motel", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281554, "titulo": "Maioridade penal: Câmara vai ouvir mãe de adolescente morta por assassino de 14 anos", "url": "https://veja.abril.com.br/brasil/maioridade-penal-camara-vai-ouvir-mae-de-adolescente-morta-por-assassino-de-14-anos/", "fonte_id": "veja", "data_pub": "2026-11-23T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados vai ouvir a mãe de Melissa Campos, uma adolescente de 14 anos que foi morta por um colega de classe com golpes de faca dentro da sala de aula em uma cidade do interior de Minas Gerais em 2025.", "titulo_pt": "Câmara ouvirá mãe de adolescente morta por assassino de 14 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281745, "titulo": "Violencia contra las mujeres: solo el 7% de las sobrevivientes denuncia ante la policía y la justicia sigue fallando", "url": "https://www.clarin.com/sociedad/violencia-mujeres-solo-7-sobrevivientes-denuncia-policia-justicia-sigue-fallando_0_4r9WC2uwty.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da ONU Mujeres indica que apenas 7% das sobreviventes de violência contra mulheres denunciam à polícia. Em Argentina, metade das mulheres adultas sofreu violência em relacionamentos de parceiros. Os dados sobre femicídios mostram que a maioria das vítimas não havia feito denúncias anteriores.", "titulo_pt": "Violência contra mulheres: apenas 7% das sobreviventes denunciam e a justiça continua falhando", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281577, "titulo": "Quase metade (45,8%) dos domicílios de SP possuem cães e gatos, diz estudo", "url": "https://www.metropoles.com/sao-paulo/quase-metade-458-dos-domicilios-de-sp-possuem-caes-e-gatos-diz-estudo", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revela que quase metade (45,8%) dos domicílios em São Paulo possuem cães ou gatos. A capital paulista tem aproximadamente 13 gatos para cada 100 humanos, enquanto há cerca de 19 cães para cada 100 habitantes.", "titulo_pt": "Quase metade dos domicílios de SP possuem cães e gatos, diz estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281586, "titulo": "Posto é condenado em MG após chefe citar \"masturbação mental\" a funcionária", "url": "https://www.metropoles.com/minas-gerais/posto-e-condenado-em-mg-apos-chefe-citar-masturbacao-mental-a-funcionaria", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um posto de combustíveis foi condenado a pagar R$ 10 mil de indenização a uma funcionária após o chefe ter citado 'masturbação mental' durante uma discussão. A empresa tentou reduzir o valor, mas foi mantido em R$ 10 mil.", "titulo_pt": "Posto é condenado em MG após chefe citar 'masturbação mental' a funcionária", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281808, "titulo": "Las brechas entre mujeres y hombres no se cierran solas", "url": "https://www.latercera.com/opinion/noticia/las-brechas-entre-mujeres-y-hombres-no-se-cierran-solas/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diferença de gênero entre homens e mulheres não se fecha sozinha. Este artigo discute a persistência das disparidades entre os sexos.", "titulo_pt": "As brechas entre homens e mulheres não se fecham sozinhas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 281663, "titulo": "Motorista é preso após acidente que deixou criança em estado grave no PR", "url": "https://www.cnnbrasil.com.br/nacional/sul/pr/motorista-e-preso-apos-acidente-que-deixou-crianca-em-estado-grave-no-pr/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um motorista foi preso após um acidente na BR-116 em Fazenda Rio Grande, Paraná, onde sua caminhonete atingiu a traseira de outro carro. O teste do bafômetro indicou que o motorista havia ingerido álcool, com concentração de 0,48 mg de álcool por litro de ar.", "titulo_pt": "Motorista é preso após acidente que deixou criança em estado grave no PR", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281840, "titulo": "Fundação de Bezos aporta US$ 25 milhões em fundo indígena do Brasil", "url": "https://www.jota.info/tributos-e-empresas/mercado/fundacao-de-bezos-aporta-us-25-milhoes-em-fundo-indigena-do-brasil", "fonte_id": "jota", "data_pub": "2026-11-23T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fundo Bezos, gerido pelo Funbio, atingiu 65% de sua meta de US$ 100 milhões e ainda precisa de US$ 15 milhões para poder começar a investir. O mecanismo Vítuke, administrado pelo Funbio, está próximo de alcançar a quantia necessária para iniciar suas operações.", "titulo_pt": "Fundo Bezos aporta US$ 25 milhões em fundo indígena do Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281841, "titulo": "Falta de medicamento no SUS impõe desafios à qualidade de vida de crianças com PFIC, doença ultrarrara do fígado", "url": "https://www.jota.info/coberturas-especiais/falta-de-medicamento-no-sus-impoe-desafios-a-qualidade-de-vida-de-criancas-com-pfic-doenca-ultrarrara-do-figado", "fonte_id": "jota", "data_pub": "2026-11-23T14:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de medicamento no Sistema Único de Saúde (SUS) impõe desafios à qualidade de vida de crianças com a doença rara colestase intra-hepática familiar progressiva (PFIC), que pode levar à necessidade de transplante ainda na infância.", "titulo_pt": "Falta de medicamento no SUS impõe desafios à qualidade de vida de crianças com PFIC, doença ultrarrara do fígado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281881, "titulo": "Domestic violence perpetrators are misusing smart car features to abuse, researchers warn", "url": "https://www.theguardian.com/society/2026/nov/23/smart-car-tracking-control-features-domestic-violence-warning-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-23T13:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores alertam que perseguidores de violência doméstica estão abusando das funcionalidades de rastreamento e monitoramento e do acesso digital ao carro para facilitar o abuso. Em 2022, um caso nos Estados Unidos mostrou que uma ex-esposa descobriu que seu ex-marido estava usando uma aplicação associada ao carro dela para rastrear sua localização, e a fabricante de carros supostamente recusou-se a encerrar o acesso digital da ex-esposa ao veículo.", "titulo_pt": "Perpetradores de violência doméstica estão abusando de funcionalidades de carros conectados para abusar, alertam pesquisadores", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 282286, "titulo": "Taiwan to continue fossil fuel phase-out: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/24/2003868289", "fonte_id": "taipei_times", "data_pub": "2026-11-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro taiwanês anunciou que o país continuará com o processo de redução do uso de combustíveis fósseis. A transição energética será mantida, conforme planejado.", "titulo_pt": "Taiwan continuará a descontinuar o uso de combustíveis fósseis, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 282902, "titulo": "Cumbre mundial sobre el clima fracasa al no lograr los países ponerse de acuerdo sobre cómo abandonar los combustibles fósiles", "url": "https://www.latercera.com/mundo/noticia/cumbre-mundial-sobre-el-clima-fracasa-al-no-lograr-los-paises-ponerse-de-acuerdo-sobre-como-abandonar-los-combustibles-fosiles/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T20:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A cúpula global sobre o clima não conseguiu chegar a um acordo sobre como os países devem abandonar os combustíveis fósiles. Houve divisão entre o grupo árabe e a coalizão liderada pela União Europeia durante o encontro.", "titulo_pt": "Cúpula global sobre o clima falha em alcançar acordo sobre abandono dos combustíveis fósiles", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 282816, "titulo": "Chuvas elevam capacidade dos mananciais de São Paulo para 67%", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/chuvas-elevam-capacidade-dos-mananciais-de-sao-paulo-para-67/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas recentes aumentaram a capacidade dos mananciais de São Paulo para 67% em comparação com 57,9% em outubro.", "titulo_pt": "Chuvas elevam capacidade dos mananciais de São Paulo para 67%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 282907, "titulo": "Tras limpiar el Mapocho: el proyecto que prepara Aguas Andinas para reutilizar el agua", "url": "https://www.latercera.com/sustentabilidad/noticia/tras-limpiar-el-mapocho-el-proyecto-que-prepara-aguas-andinas-para-reutilizar-el-agua/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T20:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Aguas Andinas inaugurou uma exposição itinerante sobre a história e a recuperação do rio Mapocho que passa por Santiago. O principal desafio atual da empresa é lidar com a escassez hídrica.", "titulo_pt": "Depois de limpar o Mapocho: projeto da Aguas Andinas para reutilizar água", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 282854, "titulo": "Ainda é possível evitar a catástrofe climática?", "url": "https://www.dw.com/pt-br/ainda-é-possível-evitar-a-catástrofe-climática/a-80021541?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-23T18:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os sinais de alerta climático incluem recordes de calor, inundações devastadoras e incêndios florestais. É ainda possível controlar o aumento das temperaturas.", "titulo_pt": "Ainda é possível evitar a catástrofe climática?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 281648, "titulo": "Temporais provocam perdas de até 95% nas lavouras de soja em Tupanciretã", "url": "https://www.cnnbrasil.com.br/agro/temporais-provocam-perdas-de-ate-95-nas-lavouras-de-soja-em-tupancireta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Levantamento preliminar indica que cerca de 440 famílias foram atingidas e 35 mil hectares sofreram impactos após chuvas, granizo e vendaval no Rio Grande do Sul. As perdas nas lavouras de soja podem chegar a 95%.", "titulo_pt": "Temporais causam perdas de até 95% nas lavouras de soja em Tupanciretã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281752, "titulo": "El volcán Kilauea de Hawái entra en erupción con fuentes de lava de 200 metros de altura", "url": "https://www.clarin.com/estados-unidos/el-volcan-kilauea-de-hawai-entra-en-erupcion-con-fuentes-de-lava-de-200-metros-de-altura_0_d0xkMkFswT.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O vulcão Kilauea, na Ilha Grande de Hawái, entrou em erupção, lançando lava a 200 metros de altura e humo a 5.000 metros acima do nível do mar. A atividade está concentrada no cráter Halema'uma'u, no Parque Nacional de Volcanes, atraindo turistas e cientistas.", "titulo_pt": "Kilauea, no havaí, entra em erupção com fontes de lava de 200 metros", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281879, "titulo": "Cop31 collapses: why did climate talks fall apart? - The Latest", "url": "https://www.theguardian.com/news/audio/2026/nov/23/cop31-collapses-why-did-climate-talks-fall-apart-the-latest", "fonte_id": "guardian_world", "data_pub": "2026-11-23T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31, uma conferência climática, não chegou a um acordo-chave após 17 anos. As negociações, co-presididas por Turquia e Austrália, falharam devido a um impasse sobre combustíveis fósseis e apoio a países afetados pela crise climática.", "titulo_pt": "Cop31 se desintegra: por que as negociações climáticas falharam?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282765, "titulo": "COP31 fracassa em acordo, mas avança na proteção dos oceanos: entenda o que mudou", "url": "https://exame.com/esg/cop31-fracassa-em-acordo-mas-avanca-na-protecao-dos-oceanos-entenda-o-que-mudou/", "fonte_id": "exame", "data_pub": "2026-11-23T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 não chegou a um acordo geral, mas avançou na proteção dos oceanos, com novos investimentos e medidas para a proteção de recifes de coral. O Brasil liderou uma força-tarefa para este tema.", "titulo_pt": "COP31 não chega a acordo, mas avança na proteção dos oceanos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 282162, "titulo": "Why did COP31 climate talks collapse without a deal?", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/23/why-did-cop31-climate-talks-collapse-without-a-deal?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COP31, o mais longo encontro das Nações Unidas sobre clima na história, terminou sem um acordo final em Turquia, marcando o primeiro fracasso de 17 anos em alcançar um acordo.", "titulo_pt": "Por que as negociações climáticas COP31 colapsaram sem um acordo?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 282519, "titulo": "COP31: Key outcomes agreed at the UN climate talks in Antalya", "url": "https://www.carbonbrief.org/cop31-key-outcomes-agreed-at-the-un-climate-talks-in-antalya", "fonte_id": "carbon_brief", "data_pub": "2026-11-23T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas da COP31 em Antalya, Turquia, não chegaram a um acordo sobre um 'pacto' que carecia de referências claras a…", "titulo_pt": "COP31: principais resultados das negociações climáticas da ONU em Antalya", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 282106, "titulo": "At least 24 people killed in Indonesia factory fire, police say", "url": "https://www.euronews.com/2026/11/23/at-least-24-people-killed-in-indonesia-factory-fire-police-say", "fonte_id": "euronews", "data_pub": "2026-11-23T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 24 pessoas morreram em um incêndio em uma fábrica de doces em Banten, Indonésia. Dezenas de funcionários ainda estão desaparecidos.", "titulo_pt": "Pelo menos 24 mortos em incêndio em fábrica de doces na indonésia, diz polícia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 281880, "titulo": "Plant-based lunches could cut Australia’s emissions by 15m tonnes, new research shows", "url": "https://www.theguardian.com/environment/2026/nov/23/plant-based-lunches-could-cut-australia-emissions-by-15m-tonnes-new-research-shows", "fonte_id": "guardian_world", "data_pub": "2026-11-23T13:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pela Bryant Research e pelo ProVeg indica que um mudanço nas refeições do meio-dia para opções vegetarianas no país poderia reduzir as emissões de gases de efeito estufa em 15,4 milhões de toneladas por ano, equivalente às emissões de todos os voos domésticos aterrados. Além disso, isso poderia economizar cerca de R$ 611 por família anualmente.", "titulo_pt": "Almoços vegetarianos poderiam reduzir emissões de 15 milhões de toneladas em Australia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282139, "titulo": "‘Worst COP ever’: Climate talks collapse after draft deal fails to include fossil fuels", "url": "https://www.cnbc.com/2026/11/23/cop31-climate-summit-fossil-fuels.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-23T13:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Governos e ativistas rejeitaram o 'acordo de cobertura' proposto no COP31, a cúpula das Nações Unidas sobre o clima, que não incluía combustíveis fósseis. Os participantes consideraram que o encontro foi o 'pior COP de todos os tempos' devido à falha na inclusão de combustíveis fósfolos no acordo.", "titulo_pt": "Pior COP de todos os tempos: negociações climáticas colapsam após rejeição do acordo proposto", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 282093, "titulo": "'The faillure of COP31 will have a very positive signal: It means that the world is taking the risks seriously'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/23/the-faillure-of-cop31-will-have-a-very-positive-signal-it-means-that-the-world-is-taking-the-risks-seriously_6787322_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-23T11:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O último summit das Nações Unidas sobre clima terminou sem um acordo final, e o mundo está prestes a ultrapassar o limite de aquecimento global de 1,5°C. O cientista sueco Johan Rockström destaca que a prioridade máxima é reduzir as emissões globais em 6% anualmente.", "titulo_pt": "O fracasso de COP31 enviará um sinal muito positivo: significa que o mundo está levando a sério os riscos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 282243, "titulo": "Cost burden keeps Fukushima’s hydrogen dream from taking off", "url": "https://www.japantimes.co.jp/news/2026/11/23/japan/society/fukushima-hydrogen-station-struggle/", "fonte_id": "japan_times", "data_pub": "2026-11-23T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa privada enfrenta dificuldades para manter sua estação de hidrogênio em funcionamento, ilustrando os desafios para a adoção de hidrogênio como fonte de energia alternativa no futuro.", "titulo_pt": "Custo elevado mantém sonho de hidrogênio de Fukushima em cheque", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 282882, "titulo": "Arrestos de ICE en Seattle y Los Ángeles reavivan críticas por uso de la fuerza excesiva", "url": "https://www.clarin.com/estados-unidos/arrestos-de-ice-en-seattle-y-los-angeles-reavivan-criticas-por-uso-de-la-fuerza-excesiva_0_4rmaESFPEQ.html", "fonte_id": "clarin", "data_pub": "2026-11-23T21:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Operações de imigração em Seattle e Los Angeles geraram críticas por uso excessivo de força, incluindo o arresto de um pai e uma filha mexicana no aeroporto. Ativistas e políticos criticam as táticas da ICE, enquanto aerolíneas e autoridades locais pedem explicações sobre os procedimentos.", "titulo_pt": "Arrestos da ICE em Seattle e Los angeles reavivam críticas sobre uso excessivo de força", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 283133, "titulo": "Why Hong Kong must ensure journalistic access to the Land Registry", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3375290/why-hong-kong-must-ensure-journalistic-access-land-registry", "fonte_id": "scmp", "data_pub": "2026-11-23T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado imobiliário de Hong Kong é uma das bases da cidade, com transações deste ano ultrapassando HK$600 bilhões (US$76,49 bilhões). O governo planeja fortalecer as buscas no Registro de Imóveis, o que pode dificultar o acesso de jornalistas e investigadores à informação pública sobre imóveis.", "titulo_pt": "Por que Hong Kong deve assegurar o acesso jornalístico ao registro de imóveis", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283095, "titulo": "Iran flogs singer Parastoo Ahmadi for performing without headscarf", "url": "https://www.aljazeera.com/news/2026/11/23/iran-flogs-singer-parastoo-ahmadi-for-performing-without-headscarf?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cantora iraniana Parastoo Ahmadi foi flagelada como punição por não usar um véu no palco. Além disso, ela e quatro membros da equipe de produção enfrentam proibições de dois anos para viagens e atividades artísticas.", "titulo_pt": "Irã flagela cantora Parastoo Ahmadi por se apresentar sem véu", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 283087, "titulo": "Iran carries out flogging of singer who performed without hijab", "url": "https://www.euronews.com/2026/11/23/iran-carries-out-flogging-of-singer-who-performed-without-hijab", "fonte_id": "euronews", "data_pub": "2026-11-23T18:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cantora Ahmadi e quatro membros de sua equipe de concertos receberam chicotadas em Qom na segunda-feira, de acordo com seu advogado, por causa de uma apresentação em dezembro de 2024, transmitida ao vivo sem público e sem cumprir a exigência do véu. Nove membros da equipe receberam 74 chicotadas cada, além de uma proibição de viagem por dois anos e uma proibição de atividades artísticas por dois anos.", "titulo_pt": "Irã executa chicotadas em cantora que se apresentou sem véu", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 282658, "titulo": "Como uma renomada bióloga foi presa na Rússia por causa de US$ 30", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/como-uma-renomada-biologa-foi-presa-na-russia-por-causa-de-us-30.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-23T18:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma renomada bióloga foi presa na Rússia após uma quantia de US$ 30. O pai da bióloga, Boris Rosenfeld, está em lágrimas, lembrando a última vez que viu sua filha antes dela viajar para Moscou, onde tudo começou.", "titulo_pt": "Como uma renomada bióloga foi presa na Rússia por causa de US$ 30", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 281750, "titulo": "El régimen iraní ejecutó la condena de 74 latigazos a la cantante que no usó el velo durante un concierto online", "url": "https://www.clarin.com/mundo/regimen-irani-ejecuto-condena-74-latigazos-cantante-uso-velo-concierto-online_0_BPRoBlliUB.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Parastoo Ahmadi, uma cantora iraniana, recebeu uma condenação de 74 chicotadas por não usar o véu durante um concerto online. Ela também foi proibida de sair do país e de exercer atividades artísticas. Quatro outros músicos receberam castigos semelhantes.", "titulo_pt": "Regime iraniano aplicou sentença de 74 chicotadas à cantora que não usou véu em show online", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281887, "titulo": "Leaked data shows more than 1,000 Russian military suicides during Ukraine war", "url": "https://www.theguardian.com/world/2026/nov/23/leaked-data-shows-more-than-1000-russian-military-suicides-during-ukraine-war", "fonte_id": "guardian_world", "data_pub": "2026-11-23T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados vazados de mais de 11 milhões de certidões de morte mostram que mais de 1.000 militares russos se suicidaram durante a guerra na Ucrânia. Um soldado chamado Alexei Bolgov, de 29 anos, se suicidou cinco semanas após dizer a sua esposa que a situação era horrível.", "titulo_pt": "Dados vazados mostram mais de 1.000 suicídios de militares russos durante a guerra na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 281888, "titulo": "Russia’s war dead: the hidden toll of the Ukraine conflict", "url": "https://www.theguardian.com/world/2026/nov/23/russia-war-dead-hidden-toll-ukraine-conflict", "fonte_id": "guardian_world", "data_pub": "2026-11-23T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório exclusivo fornece a visão mais detalhada até agora sobre as perdas russas no conflito ucraniano, que chegam a quase 500.000 soldados desde 2022. Mais de 1.000 militares russos se suicidaram durante a guerra na Ucrânia. Alexander Korepanov, um soldado de 52 anos, foi morto em Uspenovka, perto da cidade ucraniana de Pokrovsk, em 11 de maio de 2025, após 20 meses de conflito, junto com mais de 5.000 outros.", "titulo_pt": "Perdas russas na Ucrânia: análise detalhada mostra quase 500.000 mortos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282306, "titulo": "University of Hong Kong puts on hold China human rights course as law dean steps down", "url": "https://www.scmp.com/news/hong-kong/society/article/3375510/university-hong-kong-suspends-china-human-rights-course-law-dean-steps-down", "fonte_id": "scmp", "data_pub": "2026-11-23T13:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade de Hong Kong (HKU) vai adiar um curso sobre direitos humanos na China para alunos de mestrado e de direito em 2026-2027, após o coordenador Fu Hualing anunciar a sua saída como decano da escola de direito. Fu decidiu cancelar o curso para o semestre, mas planeja retomá-lo posteriormente.", "titulo_pt": "Universidade de Hong Kong adia curso de direitos humanos na China após decano se retirar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 282307, "titulo": "Second Hong Kong man arrested for animal cruelty in the hanging of a stray dog", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3375509/second-hong-kong-man-arrested-animal-cruelty-hanging-stray-dog", "fonte_id": "scmp", "data_pub": "2026-11-23T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong prendeu um segundo homem, de 67 anos, por suposto maus-tratos a animais após um cachorro de rua ser encontrado pendurado em uma árvore em Tai Po. O homem foi detido um dia após a prisão de outro suspeito de 54 anos por suposto crime semelhante.", "titulo_pt": "Segundo homem de Hong Kong preso por maus-tratos a animais em caso de cachorro pendurado em árvore", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 282274, "fonte_id": "taipei_times", "titulo": "Huang reinstated as Nvidia CEO", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/24/2003868271", "data_pub": "2026-11-24T00:00:00Z", "topico": "tecnologia", "idioma": "en", "titulo_pt": "Huang readmitido como CEO da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 282276, "fonte_id": "taipei_times", "titulo": "Ukraine sinks Russian corvette in Libyan port", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/24/2003868273", "data_pub": "2026-11-24T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Ucrânia afunda corveta russa em porto líbio", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 282286, "fonte_id": "taipei_times", "titulo": "Taiwan to continue fossil fuel phase-out: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/24/2003868289", "data_pub": "2026-11-24T00:00:00Z", "topico": "meio_ambiente", "idioma": "en", "titulo_pt": "Taiwan continuará a descontinuar o uso de combustíveis fósseis, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 282288, "fonte_id": "taipei_times", "titul function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()

  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

  const list = Object.values(flags);

    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`

}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
