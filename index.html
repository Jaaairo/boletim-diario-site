/werner-herzog-bucking-fastard-kate-rooney-mara", "fonte_id": "guardian_culture", "data_pub": "2026-09-05T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Werner Herzog, diretor alemão de cinema, fala sobre sua relação com fãs e suas redes sociais, enquanto evita o termo 'neurodivergência'. Acredita que personagens de seus filmes, como Aguirre, Fitzcarraldo e Timothy Treadwell, não servem como modelos para o movimento neurodiverso moderno.", "titulo_pt": "Herzog sobre fãs, redes sociais e termos neurodivergentes", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 147288, "titulo": "João Victor Gonçalves, ator de 'Quem Ama Cuida', é hostilizado na rua", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/joao-victor-goncalves-ator-de-quem-ama-cuida-e-hostilizado-na-rua.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-05T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ator João Victor Gonçalves, conhecido por interpretar o personagem Mau Mau na novela 'Quem Ama Cuida', foi hostilizado na madrugada de sábado, na entrada do Rock in Rio.", "titulo_pt": "Ator de 'Quem Ama Cuida' é hostilizado na rock in rio", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 147637, "titulo": "Why Wendell Berry Didn’t Worry About the Future", "url": "https://www.theatlantic.com/culture/2026/09/wendell-berry-obit-legacy/688530/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-05T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wendell Berry não se preocupava com o futuro, focando em ações que fossem boas no presente. Sua vida como escritor e agricultor estava guiada por essa ideia simples e clara.", "titulo_pt": "Por que Wendell Berry não se preocupava com o futuro", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 147365, "titulo": "Homem arremessa pedras na sogra e é preso por violência doméstica", "url": "https://www.metropoles.com/distrito-federal/na-mira/homem-arremessa-pedras-na-sogra-e-e-preso-por-violencia-domestica", "fonte_id": "metropoles", "data_pub": "2026-09-05T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi preso por violência doméstica após arremessar pedras na sogra em Formosa, Goiás. O suspeito já responde criminalmente por homicídio e estava em liberdade com tornozeleira eletrônica.", "titulo_pt": "Homem é preso por arremessar pedras na sogra em goiás", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147367, "titulo": "João Victor Gonçalves desabafa após ataque homofóbico: \"É muito dolorido\"", "url": "https://www.metropoles.com/colunas/fabia-oliveira/joao-victor-goncalves-desabafa-apos-ataque-homofobico-e-muito-dolorido", "fonte_id": "metropoles", "data_pub": "2026-09-05T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ator João Victor Gonçalves gravou um vídeo para o Instagram após sofrer um ataque homofóbico, lamentando a situação vivida.", "titulo_pt": "João Victor Gonçalves desabafa após ataque homofóbico", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147630, "titulo": "Psicosis posparto: madres que pierden el juicio", "url": "https://www.latercera.com/paula/noticia/psicosis-posparto-madres-que-pierden-el-juicio/", "fonte_id": "la_tercera", "data_pub": "2026-09-05T12:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A psicose pós-parto é uma condição rara que pode afetar as mães recentemente grávidas, causando delírios ou alucinações. Lindsay Clancy, uma mulher americana que matou seus três filhos e tentou se suicidar, é um caso recente que trouxe a doença à luz novamente.", "titulo_pt": "Psicose pós-parto: mães que perdem a sanidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 147658, "titulo": "Nepal tunnel rescue of Chinese citizen and local woman revives hope 10 days after flood", "url": "https://www.lemonde.fr/en/international/article/2026/09/05/nepal-tunnel-rescue-of-chinese-citizen-revives-hopes-10-days-after-flood_6757191_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-05T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No sábado, resgatadores salvaram um cidadão chinês vivo de um túnel coberto por detritos e uma mulher local de sua casa parcialmente submersa. As equipes de resposta a emergências continuam a procurar pessoas desaparecidas 10 dias após a cheia.", "titulo_pt": "Resgate de chinês e mulher local em túnel revivem esperança 10 dias após inundações", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 146783, "titulo": "Depois do parto, quem cuida da mãe? Kalil e especialistas debatem puerpério", "url": "https://www.cnnbrasil.com.br/saude/depois-do-parto-quem-cuida-da-mae-kalil-e-especialistas-debatem-puerperio/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas alertam sobre complicações no pós-parto, como infecções e pressão alta, e destacam que a idealização da maternidade pode dificultar o autocuidado das mães.", "titulo_pt": "Depois do parto, quem cuida da mãe?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146879, "titulo": "Adiós al sueño americano en Illinois: cómo la escasez de viviendas ha subido el precio de compra de casas", "url": "https://www.lanacion.com.ar/estados-unidos/illinois/adios-al-sueno-americano-en-illinois-como-la-escasez-de-viviendas-ha-subido-el-precio-de-compra-de-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T08:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A escassez de imóveis aumentou o preço da compra de casas em Illinois, com o valor médio das casas chegando a US$338.000. O inventário de casas disponíveis para venda r a aplicação da lei de forma mais eficiente.", "titulo_pt": "Ambientalistas e setor de infraestrutura cobram agilidade na análise da lei do licenciamento pelo STF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147655, "titulo": "Nepal demands greater climate justice amid staggering flood costs", "url": "https://www.lemonde.fr/en/economy/article/2026/09/05/nepal-demands-greater-climate-justice-amid-staggering-flood-costs_6757198_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-05T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Nepal sofreu grandes danos financeiros devido a uma avalanche de lama, detritos e gelo em 26 de agosto, com estimativas de dano entre 4 e 5 bilhões de dólares. O desastre afetou setores-chave do país, como o turismo e a energia hidrelétrica.", "titulo_pt": "Nepal pede por maior justiça climática diante dos custos astronômicos das cheias", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 147429, "titulo": "Tufão Saudel provoca deslizamento na China; 1 morre e 11 desaparecem", "url": "https://www.infomoney.com.br/mundo/tufao-saudel-deslizamento-china-morto-desaparecidos/", "fonte_id": "infomoney", "data_pub": "2026-09-05T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chuvas torrenciais na província de Jiangxi, na China, causaram deslizamentos de terra. Um pessoa morreu e 11 desapareceram.", "titulo_pt": "Tufão Saudel causa deslizamento de terra na China; 1 morto e 11 desaparecidos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 147631, "titulo": "De cara a la temporada de incendios forestales: Conaf Ñuble anuncia fortalecimiento de sus equipos de prevención y mitigación", "url": "https://www.latercera.com/nacional/noticia/de-cara-a-la-temporada-de-incendios-forestales-conaf-nuble-anuncia-fortalecimiento-de-sus-equipos-de-prevencion-y-mitigacion/", "fonte_id": "la_tercera", "data_pub": "2026-09-05T15:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Conaf Ñuble anunciou o fortalecimento de seus equipamentos de prevenção e mitigação de incêndios florestais. A planificação técnica leva em consideração os antecedentes de incêndios na região, incluindo a catástrofe de janeiro de 2026.", "titulo_pt": "Diante da temporada de incêndios florestais: conaf Ñuble fortalece equipes de prevenção e mitigação", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 147686, "titulo": "Two people pulled alive by Nepal's search and rescue team 10 days after devastating flash floods", "url": "http://www.euronews.com/2026/09/05/two-people-pulled-alive-by-nepals-search-and-rescue-team-10-days-after-devastating-flash-f", "fonte_id": "euronews", "data_pub": "2026-09-05T12:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove dias após as inundações devastarem Nepal, uma mulher e um homem foram resgatados vivos em operações de busca e resgate separadas. Mais de 5.000 pessoas ainda estão desaparecidas e pelo menos 1.300 morreram.", "titulo_pt": "Dois sobreviventes resgatados 10 dias após devastadoras inundações no Nepal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 147081, "titulo": "Orangutan mother and infant rescued from wildfire-hit forest in Indonesia", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/5/orangutan-mother-and-infant-rescued-from-wildfire-hit-forest-in-indonesia?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-05T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe orangotango e seu recém-nascido foram resgatados de uma pequena área de floresta ameaçada por incêndios florestais na Indonésia.", "titulo_pt": "Mãe orangotango e seu bebê resgatados de floresta afetada por incêndios na indonésia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 146881, "titulo": "Avanza un frente de aire antártico que llegará con fuertes heladas, sensación térmica muy baja, inestabilidad y lluvias: las zonas afectadas", "url": "https://www.lanacion.com.ar/sociedad/avanza-un-frente-de-aire-antartico-que-llegara-con-fuertes-heladas-sensacion-termica-muy-baja-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um frente de ar antártico avança para o país, trazendo fortes geladas, sensação térmica baixa, instabilidade e chuvas. O ar frio causará uma significativa diminuição da temperatura durante o primeiro fim de semana de setembro, com rajadas intensas e registros de até -13°C.", "titulo_pt": "Avança um frente de ar antártico com fortes geladas e sensação térmica baixa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 147566, "titulo": "“Un humedal que nadie usa”: el Gran Concepción y la ilusión del terreno vacío", "url": "https://www.ciperchile.cl/2026/09/05/un-humedal-que-nadie-usa-el-gran-concepcion-y-la-ilusion-del-terreno-vacio/?utm_source=rss&utm_medium=rss&utm_campaign=un-humedal-que-nadie-usa-el-gran-concepcion-y-la-ilusion-del-terreno-vacio", "fonte_id": "ciper_chile", "data_pub": "2026-09-05T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute um humedal chamado Gran Concepción e a ilusão de que o terreno está vazio. Não há uso efetivo do espaço.", "titulo_pt": "Um humedal que ninguém usa: Gran Concepción e a ilusão do terreno vazio", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 146768, "titulo": "Deslizamento após tufão deixa um morto e 11 desaparecidos na China", "url": "https://www.metropoles.com/mundo/deslizamento-apos-tufao-deixa-um-morto-e-11-desaparecidos-na-china", "fonte_id": "metropoles", "data_pub": "2026-09-05T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deslizamento de terra ocorreu após um tufão na China, deixando uma pessoa morta e 11 desaparecidos. Equipes de bombeiros e resgate estão tr function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
