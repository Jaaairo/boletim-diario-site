34230, "titulo": "Seoul stocks down over 5 pct late Fri. morning on tech losses amid AI concerns", "url": "https://en.yna.co.kr/view/AEN20261030005600320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T02:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram mais de 5% no final da manhã de sexta-feira, devido a perdas no setor tecnológico e preocupações relacionadas à inteligência artificial.", "titulo_pt": "Ações sul-coreanas caem mais de 5% no final da manhã de sexta-feira devido a perdas tecnológicas e preocupações com a IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234030, "titulo": "Nvidia chief seen as target of Chinese spy plot", "url": "https://www.japantimes.co.jp/news/2026/10/30/world/nvidia-chief-spy-plot-target/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um executivo de uma empresa de centros de dados que desenvolveu uma relação próxima com o CEO da Nvidia, Jensen Huang, foi descoberto como um agente de inteligência chinês.", "titulo_pt": "Executivo da nvidia identificado como alvo de esquema de espionagem chinesa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234232, "titulo": "Hyundai Motor Group to establish two SPCs for AI data center project", "url": "https://en.yna.co.kr/view/AEN20261030005200320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T02:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyundai Motor Group planeja estabelecer duas Sociedades de Participação Comum (SPCs) para um projeto de centro de dados de inteligência artificial.", "titulo_pt": "Hyundai Motor Group planeja estabelecer duas SPCs para projeto de centro de dados de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234035, "titulo": "Binance freezes more than $2.5 billion in assets amid suspected hack", "url": "https://www.japantimes.co.jp/business/2026/10/30/markets/binance-suspected-hack/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Binance congelou mais de 2,5 bilhões de ativos em meio a suspeitas de hack. O incidente pode ser um contrapeso potencial para os fiéis das criptomoedas, que estavam aproveitando uma recuperação de preços de dois meses.", "titulo_pt": "Binance congela mais de 2,5 bilhões de ativos em suspeita de hack", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234236, "titulo": "Excessive cutting of support columns blamed for deadly Ulsan power plant collapse", "url": "https://en.yna.co.kr/view/AEN20261030004800320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T01:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colapso letal de uma torre de boiler em uma usina de energia em Ulsan foi atribuído a uma corte excessiva de pilares de apoio. A informação foi divulgada em Seul, 30 de outubro, pela Yonhap.", "titulo_pt": "Corte excessivo de pilares de apoio responsabilizado pelo colapso letal da usina de energia em Ulsan", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234039, "titulo": "SpaceX’s largest, $3 billion-a-month ‘Customer B’ is Anthropic", "url": "https://www.japantimes.co.jp/business/2026/10/30/companies/spacex-customer-anthropic/", "fonte_id": "japan_times", "data_pub": "2026-10-30T01:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX informou que cerca de 34,5% de sua receita no último trimestre veio de um único cliente, identificado apenas como 'Cliente B'. Este cliente é estimado em cerca de $3 bilhões por mês.", "titulo_pt": "Spacex: maior cliente 'B' gera $3 bilhões por mês", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233831, "titulo": "Binance probes possible $5.7 billion crypto hack, possibly the biggest in history", "url": "https://www.axios.com/2026/10/29/binance-cyberattack-crypto-heist", "fonte_id": "axios", "data_pub": "2026-10-30T00:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Binance está investigando um possível roubo de criptomoedas que, se confirmado, seria o maior da história, com estimativas de até $5,7 bilhões em fundos saídos de carteiras na tarde de quinta-feira. A exchange suspeita que tenha ocorrido um ataque cibernético após uma onda de altos riscos de segurança em outubro, conhecida como 'Black October'.", "titulo_pt": "Binance investiga possível roubo de criptomoedas de até 5,7 bilhões, maior da história", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 233990, "titulo": "Intel shares fall 22% as weak sales outlook dents turnaround", "url": "https://www.ft.com/content/d7540e89-08db-43d3-92e0-3c15dd3a60cb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-29T23:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Intel caíram 22% devido a uma previsão de vendas de chips para PCs abaixo do esperado e a margens decrescentes.", "titulo_pt": "Ações da intel caem 22% com previsão de vendas de chips para pcs fracas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 233991, "titulo": "Amazon shares slide on lower Christmas sales forecast", "url": "https://www.ft.com/content/8affd8dd-b783-48c8-86e2-ac4a647fa0f3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-29T22:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon registrou uma queda nas ações devido a uma previsão menor de vendas durante o Natal, apesar de um desempenho forte em sua unidade de nuvem.", "titulo_pt": "Ações da amazon caem com previsão menor de vendas no natal", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 233216, "titulo": "Roblox tem 196 sites falsos ativos em sete dias, diz NordVPN", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/roblox-tem-196-sites-falsos-ativos-em-sete-dias-diz-nordvpn.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-29T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NordVPN identificou 196 sites falsos do Roblox ativos em sete dias, com cerca de 105 mil visitas acumuladas. O hub de jogos popular entre crianças foi alvo dessa atividade fraudulenta.", "titulo_pt": "NordVPN detecta 196 sites falsos do roblox em sete dias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 233993, "titulo": "What killed Weil Gotshal?", "url": "https://www.ft.com/content/98dfc71b-19eb-4194-8c6a-bb6d9b463074?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-29T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Parceiros ficaram surpresos ao perceber que uma prestigiada firma com 95 anos de história e 1.200 advogados, que era lucrativa, poderia ser derrubada por uma série de saídas de profissionais.", "titulo_pt": "O que matou Weil Gotshal?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 234261, "titulo": "Polymarket Halted International Trading After Hackers Drained Accounts", "url": "https://www.wired.com/story/polymarket-flagship-platform-hack-traders-lose-money/", "fonte_id": "wired", "data_pub": "2026-10-29T19:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Polymarket suspendeu o comércio internacional após um terceiro partido fornecedor ser comprometido por hackers. As operações foram retomadas e a empresa informou que os traders afetados serão compensados.", "titulo_pt": "Polymarket suspendeu comércio internacional após Hackers comprometerem contas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 233194, "titulo": "Apocalipse? Por que OpenAI deixou mundo da matemática em choque", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/apocalipse-por-que-openai-deixou-mundo-da-matematica-em-choque.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-30T01:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No início de outubro, a OpenAI divulgou centenas de resultados matemáticos que, segundo a empresa, poderiam ampliar as fronteiras do conhecimento humano. Essa publicação surpreendeu a comunidade matemática e gerou grande interesse.", "titulo_pt": "Apocalipse? Por que a OpenAI deixou a matemática em choque", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 234349, "titulo": "Map Showing Potential Origins of Martian Meteorite Teghaza 001", "url": "https://science.nasa.gov/photojournal/map-showing-potential-origins-of-martian-meteorite-teghaza-001/", "fonte_id": "nasa_news", "data_pub": "2026-10-30T00:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mapa global de Marte indica 13 locais que correspondem à mineralogia e química do meteorito martiano Teghaza 001, um dos mais antigos meteoritos martianos encontrados na Terra. Embora os cientistas nunca possam ter certeza de onde o meteorito originou-se, o Teghaza 001 apresenta pistas que o ligam a regiões de altitudes no hemisfério sul de Marte.", "titulo_pt": "Mapa mostra possíveis origens do meteorito martiano Teghaza 001", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 234350, "titulo": "Slice of Martian Meteorite Teghaza 001", "url": "https://science.nasa.gov/photojournal/slice-of-martian-meteorite-teghaza-001/", "fonte_id": "nasa_news", "data_pub": "2026-10-29T23:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta fatia do meteorito martiano Teghaza 001, um dos mais antigos já encontrados na Terra, foi utilizada para determinar a idade do rochedo. Imagens de luz refletida como essa servem como mapa para os cientistas, auxiliando na localização de minerais de interesse para análise por diferentes instrumentos.", "titulo_pt": "Fatia do meteorito martiânico Teghaza 001", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 234351, "titulo": "Halloween Aboard the International Space Station", "url": "https://www.nasa.gov/centers-and-facilities/johnson/halloween-aboard-the-international-space-station/", "fonte_id": "nasa_news", "data_pub": "2026-10-29T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A bordo da Estação Espacial Internacional, os tripulantes não recebem visitas de bruxas ou travessuras, mas ainda gostam de entrar no espírito de Halloween. Eles se vestem com roupas criativas, às vezes assustadoras, feitas de materiais disponíveis a bordo.", "titulo_pt": "Halloween a bordo da estação espacial internacional", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 233195, "titulo": "O cérebro do fugitivo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/10/o-cerebro-do-fugitivo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-29T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto descreve como um aspirante observa e internaliza os comportamentos do pai, que foram recompensados com um cargo alto mas resultaram em prisão. Apesar disso, o pai continua sendo louvado por seus seguidores.", "titulo_pt": "O cérebro do aspirante", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 234293, "titulo": "STAT+: Federal judge rejects new Medicaid ‘frailty’ definition for work requirements", "url": "https://www.statnews.com/2026/10/29/medicaid-work-requirements-judge-blocks-new-limits-medical-frailty/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-29T18:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz decidiu que os reguladores federais ultrapassaram seus poderes ao limitar as exceções às exigências de trabalho no Medicaid para pessoas com problemas de saúde.", "titulo_pt": "Juiz rejeita nova definição de 'frailty' para exigências de trabalho no Medicaid", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 234352, "titulo": "NASA-funded Study Details One of Oldest Mars Meteorites Ever Found", "url": "https://www.nasa.gov/solar-system/planets/mars/nasa-funded-study-details-one-of-oldest-mars-meteorites-ever-found/", "fonte_id": "nasa_news", "data_pub": "2026-10-29T18:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo financiado pela NASA detalhou uma das meteorítas mais antigas do Planeta Vermelho já encontradas, que foi recuperada no Deserto do Saara em 2022 e data de mais de 4,1 bilhões de anos.", "titulo_pt": "Estudo da nasa descreve uma das meteorítas martianas mais antigas do saara", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 234330, "titulo": "Oldest known Mars rock is a ‘Rosetta stone’ for the Red Planet’s watery past", "url": "https://www.scientificamerican.com/article/oldest-known-mars-rock-is-a-rosetta-stone-for-the-red-planets-watery-past/", "fonte_id": "scientific_american", "data_pub": "2026-10-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O meteorito Teghaza 001, que originou-se na Marte, revela aspectos antigos da história hidráulica do planeta vermelho. Este meteorito foi projetado no deserto do Saara após um impacto de grande escala na superfície de Marte ocorrido há muito tempo.", "titulo_pt": "Meteorito mais antigo conhecido de marte é uma ‘pedra de roseta’ para o passado aquático do planeta vermelho", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 234343, "titulo": "Seabirds get jet lag, too — and it can throw them a bit off course", "url": "https://www.sciencenews.org/article/seabird-jet-lag-navigation-off-course", "fonte_id": "science_news", "data_pub": "2026-10-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Acompanhamento por GPS mostra que voos rápidos de leste para oeste causam um desalinhamento entre o relógio interno dos pássaros marinhas e a posição do sol, afetando sua noção de direção.", "titulo_pt": "Pássaros marinheiros também têm fuso horário — e isso pode desviar sua direção", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 234353, "titulo": "NASA Names Troy Asher Armstrong Flight Research Center Director", "url": "https://www.nasa.gov/news-release/nasa-names-troy-asher-armstrong-flight-research-center-director/", "fonte_id": "nasa_news", "data_pub": "2026-10-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O administrador da NASA, Jared Isaacman, nomeou Troy Asher como diretor do Centro de Pesquisa Aeronáutica Armstrong, em Edwards, Califórnia. Asher, um piloto de teste e engenheiro aeroespacial com décadas de experiência em pesquisa e operações aeronáuticas, tem atuado como diretor interino desde março.", "titulo_pt": "NASA nomeia diretor para o centro de pesquisa aeronáutica Armstrong", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 234354, "titulo": "NIH–NASA QuSAFE Challenge", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/center-of-excellence-for-collaborative-innovation-coeci/nih-nasa-qusafe-challenge/", "fonte_id": "nasa_news", "data_pub": "2026-10-29T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desafio QuSAFE, uma colaboração entre o NIH e a NASA, visa avançar na utilização de sensores quânticos para predizer toxicidade e segurança de medicamentos através de modelos pré-clínicos in vitro, como organóides e sistemas microfísiofísicos (MPS), com o objetivo de melhorar a segurança dos medicamentos enquanto reduz o uso de animais.", "titulo_pt": "Desafio QuSAFE: colaboração entre NIH e NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 233196, "titulo": "Os animais que você pode vencer em uma corrida e os que são invencíveis", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/os-animais-que-voce-pode-vencer-em-uma-corrida-e-os-que-sao-invenciveis.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-29T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há alguns anos, o autor estava acampando nos Estados Unidos quando um urso-negro passou por perto. O texto original discute sobre animais que podem ser vencidos em corridas e aqueles que são invencíveis, mas não fornece detalhes específicos sobre esses animais nesse trecho.", "titulo_pt": "Animais que você pode vencer em uma corrida e os que são invencíveis", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 234294, "titulo": "STAT+: New federal rule will require prescription drug middlemen to share secret payments data", "url": "https://www.statnews.com/2026/10/29/prescription-drug-price-reform-pbm-disclosure-rules-face-challenge/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-29T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma regra do governo Trump exigirá que gerentes de benefícios farmacêuticos divulguem detalhes sobre as taxas e compensações atualmente mantidas em segredo.", "titulo_pt": "Nova regra federal exigirá que gerentes de benefícios farmacêuticos compartilhem dados secretos sobre pagamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 234344, "titulo": "Some of the world’s biggest bats are getting smaller", "url": "https://www.sciencenews.org/article/bats-get-smaller-madagascan-flying-fox", "fonte_id": "science_news", "data_pub": "2026-10-29T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Madagascan flying foxes estão diminuindo em tamanho em comparação com há 150 anos. Acredita-se que isso possa ser devido a caça seletiva ou outras influências humanas.", "titulo_pt": "Alguns dos maiores morcegos do mundo estão ficando menores", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 234295, "titulo": "STAT+: The EPIC investigation, and a Teladoc surprise", "url": "https://www.statnews.com/2026/10/29/epic-investigation-teladoc-surprise-ai-payment-model-health-tech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-29T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conteúdo desta edição do STAT Health Tech aborda uma investigação EPIC e uma surpresa da Teladoc, além de discutir como financiar a inteligência artificial.", "titulo_pt": "Investigação EPIC e surpresa da Teladoc, além de discussões sobre financiamento de IA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 234355, "titulo": "Envía tu nombre a Titán a bordo de la misión Dragonfly de la NASA", "url": "https://www.nasa.gov/news-release/envia-tu-nombre-a-titan-a-bordo-de-la-mision-dragonfly-de-la-nasa/", "fonte_id": "nasa_news", "data_pub": "2026-10-29T15:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está convidando o público a enviar seus nomes a bordo da missão Dragonfly, que vai à lua Titã de Saturno. O objetivo é levar os nomes dos participantes para a superfície orgânica de Titã.", "titulo_pt": "Envie seu nome a bordo da missão Dragonfly para titã", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 233247, "titulo": "Teatro Anchieta, no Sesc Consolação, se reafirma como destaque de SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/teatro-anchieta-no-sesc-consolacao-se-reafirma-como-destaque-de-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Teatro Anchieta, localizado no Sesc Consolação em São Paulo, é considerado um importante centro cultural. Foi nele que Antunes Filho criou o CPT, uma escola de teatro que se tornou um marco de inovação cênica.", "titulo_pt": "Teatro Anchieta, no Sesc Consolação, reafirma seu papel como destaque cultural de SP", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233248, "titulo": "Focado em música de câmara, Cultura Artística preza pela acústica em detalhes", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/focado-em-musica-de-camara-cultura-artistica-preza-pela-acustica-em-detalhes.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Cultura Artística foi projetado para apresentações de música não amplificada, com ênfase na acústica. O edifício de 1950, projetado pelo arquiteto Rino Levi, foi premiado na categoria de acústica.", "titulo_pt": "Cultura Artística valoriza acústica em seu projeto de música de câmara", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233249, "titulo": "Teatros do Sesc voltam a dominar lista dos melhores palcos em cada região de São Paulo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/teatros-do-sesc-voltam-a-dominar-lista-dos-melhores-palcos-em-cada-regiao-de-sao-paulo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os teatros do Sesc em diferentes regiões de São Paulo continuam a ser reconhecidos como os melhores palcos, apesar da concentração de estabelecimentos na região central e oeste. Outros bairros também possuem salas capazes de atrair espectadores com programações diversificadas e de qualidade.", "titulo_pt": "Teatros do Sesc mantêm liderança em lista dos melhores palcos em cada região de São Paulo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233252, "titulo": "Com montagem que torna plateia parte do cenário, Ágora é o melhor teatro de até cem lugares em SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/com-montagem-que-torna-plateia-parte-do-cenario-agora-e-o-melhor-teatro-de-ate-cem-lugares-em-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ágora Teatro é considerado o melhor teatro com até cem lugares em São Paulo. A montagem da peça envolve a plateia, fazendo-a parte do cenário.", "titulo_pt": "Ágora é o melhor teatro de até cem lugares em SP, com plateia integrada ao cenário", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233253, "titulo": "Teatro mais confortável de SP tem poltronas aconchegantes e visão privilegiada do palco", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/teatro-mais-confortavel-de-sp-tem-poltronas-aconchegantes-e-visao-privilegiada-do-palco.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No final do ano passado, o Teatro Alfa, em Santo Amaro, reabriu após três anos de reforma como BTG Pactual Hall. A reinauguração ofereceu poltronas aconchegantes e uma visão privilegiada do palco.", "titulo_pt": "Teatro mais confortável de SP tem poltronas aconchegantes e visão privilegiada do palco", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233254, "titulo": "Melhor café de teatro de SP, Capô promove o blend de memória, cozinha e espetáculos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/melhor-cafe-de-teatro-de-sp-capo-promove-o-blend-de-memoria-cozinha-e-espetaculos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Café Capô, localizado no subsolo do Instituto Capobianco no Centro Histórico de São Paulo, foi escolhido como o melhor café de teatro de São Paulo pelo júri da Folha. Além de ser um espaço de espera antes dos espetáculos, o Capô oferece atrações próprias gratuitas, como shows intimistas e exposições.", "titulo_pt": "Melhor café de teatro de SP, Capô promove blend de memória, cozinha e espetáculos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233255, "titulo": "Melhor teatro experimental, Oficina faz visitas guiadas e abre acervo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/melhor-teatro-experimental-oficina-faz-visitas-guiadas-e-abre-acervo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto de 1961, o grupo Oficina alugou um teatro na rua Jaceguai, no Bexiga, encontrando um espaço vazio sem equipamentos. O local foi transformado várias vezes, chegando em 1993 ao projeto arquitetônico de Lina Bo Bardi e Edson Elito.", "titulo_pt": "Melhor teatro experimental, Oficina faz visitas guiadas e abre acervo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233256, "titulo": "Pista de dança volta ao pop mais elegante, com letras intimistas e sons eruditos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/pista-de-danca-volta-ao-pop-mais-elegante-com-letras-intimistas-e-sons-eruditos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Madonna lançou o álbum 'Confessions II', com a canção 'Danceteria', que retorna à sonoridade dançante após um período de introspecção melancólica na música pop. O single invoca a imagem de uma pista de dança lotada.", "titulo_pt": "Pista de dança retorna no pop elegante, com letras intimistas e sons eruditos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233257, "titulo": "Sympla, melhor plataforma de ingressos, se destaca pela variedade de eventos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/sympla-melhor-plataforma-de-ingressos-se-destaca-pela-variedade-de-eventos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde 2024, a Sympla foi eleita pela terceira vez consecutiva como a melhor plataforma para a compra de ingressos. A Folha de São Paulo realiza anualmente essa avaliação, que já incluiu a categoria de melhores salas de teatro da cidade.", "titulo_pt": "Sympla, melhor plataforma de ingressos, se destaca pela variedade de eventos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233258, "titulo": "Reformado, Teatro UOL mantém melhor programação de humor", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/reformado-teatro-uol-mantem-melhor-programacao-de-humor.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Menos de um ano após sua reforma, o Teatro UOL continua agradando o público com sua programação de humor. A casa recebeu melhorias na plateia e estruturas de acessibilidade.", "titulo_pt": "Reformado, Teatro UOL mantém melhor programação de humor", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233259, "titulo": "Com a melhor localização, Teatro do Sesi fica em icônico prédio da Paulista", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/com-a-melhor-localizacao-teatro-do-sesi-fica-em-iconico-predio-da-paulista.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Teatro do Sesi-SP está localizado no icônico Edifício Luís Eulálio de Bueno Vidigal Filho, no bairro da Paulista, em São Paulo. O prédio, conhecido por sua fachada piramidal, abriga também o Centro Cultural Fiesp.", "titulo_pt": "Teatro do sesi-sp em edifício icônico da Paulista", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233260, "titulo": "Patrimônio de São Paulo, Municipal é o principal teatro lírico da cidade", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/patrimonio-de-sao-paulo-municipal-e-o-principal-teatro-lirico-da-cidade.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Municipal, teatro lírico de São Paulo, foi novamente eleito o melhor teatro lírico da cidade. Ele é responsável pela maior parte das óperas encenadas na cidade.", "titulo_pt": "Patrimônio de São Paulo, Municipal é o principal teatro lírico da cidade", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233261, "titulo": "Conheça o júri d'O Melhor de São Paulo Teatro 2026", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/conheca-o-juri-do-melhor-de-sao-paulo-teatro-2026.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O júri formado por jornalistas, críticos e pesquisadores de teatro escolheu os melhores espaços de teatro da capital paulista para o especial O Melhor de São Paulo - Teatro 2026.", "titulo_pt": "Conheça o júri do o Melhor de São Paulo Teatro 2026", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233262, "titulo": "Teatro Porto tem o melhor palco e é capaz de abrigar estrutura em dois níveis", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/teatro-porto-tem-o-melhor-palco-e-e-capaz-de-abrigar-estrutura-em-dois-niveis.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Teatro Porto foi inaugurado em 6 de maio de 2015 com o concerto 'Atentos Sinais', de Ney Matogrosso, e a montagem de 'Nine'. A sala principal do teatro já recebeu mais de 700 mil espectadores e mais de 300 produções.", "titulo_pt": "Teatro Porto tem o melhor palco e é capaz de abrigar estrutura em dois níveis", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233263, "titulo": "Melhor opção em shoppings, Teatro Bradesco tem grande estrutura e agenda eclética", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/melhor-opcao-em-shoppings-teatro-bradesco-tem-grande-estrutura-e-agenda-ecletica.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Teatro Bradesco, localizado no Bourbon Shopping, é considerado o melhor teatro de shopping de São Paulo devido à sua estrutura de grande porte e programação variada. Com 7.000 m² de área construída e 1.400 assentos, o teatro oferece uma experiência teatral completa.", "titulo_pt": "Melhor Teatro de shopping de são paulo, Teatro Bradesco destaca-se pela estrutura e programação", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 233264, "titulo": "Teatro Vivo e Anchieta, do Sesc Consolação, têm as melhores curadorias de SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/teatro/2026/10/teatro-vivo-e-anchieta-do-sesc-consolacao-tem-as-melhores-curadorias-de-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois teatros empataram na categoria de melhor programação do 'O Melhor de São Paulo': o Teatro Vivo, que atrai público para montagens com grandes elencos na região sul de São Paulo, e o Teatro Anchieta, do Sesc Consolação, que oferece um repertório fora do óbvio em um espaço prestigiado da capital.", "titulo_pt": "Teatro Vivo e Anchieta, do Sesc Consolação, têm as melhores curadorias de SP", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 233627, "titulo": "El sistema de salud argentino está muriendo. ¿Quiénes son los responsables? ¿Y las reformas estructurales?", "url": "https://www.lanacion.com.ar/opinion/el-sistema-de-salud-argentino-esta-muriendo-quienes-son-los-responsables-y-las-reformas-nid30102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema de saúde argentino está em crise, com milhões de cidadãos precisando de respostas urgentes. Enquanto a política se concentra em ganhar eleições, a situação dos serviços de saúde continua a deteriorar-se.", "titulo_pt": "O sistema de saúde argentino está morrendo. Quem são os responsáveis? E as reformas estruturais?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233629, "titulo": "La desesperación de un productor que perdió casi todas sus ovejas por un ataque de perros", "url": "https://www.lanacion.com.ar/economia/campo/llore-grite-y-me-frustre-los-perros-atacaron-su-campo-y-perdio-casi-todas-sus-ovejas-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Marcelo Fraymuth registrou 22 ovelhas mortas em ataques de cães em San José, Misiones. Productores da região relatam que o problema se repete e pedem soluções.", "titulo_pt": "A desesperança de um produtor que perdeu quase todas suas ovelhas por ataques de cães", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233631, "titulo": "Peronismo: los mismos de siempre", "url": "https://www.lanacion.com.ar/editoriales/peronismo-los-mismos-de-siempre-nid30102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dirigentes do Partido Justicialista (PJ) confirmaram sua intenção de unidade, mas continuam resistindo a abandonar hábitos antigos da política e apresentam apenas um passado negativo como perspectiva.", "titulo_pt": "Peronismo: os mesmos de sempre", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233461, "titulo": "Ex-funcionário de creche é acusado de cometer mais de 200 abusos em Sydney", "url": "https://www.metropoles.com/mundo/ex-funcionario-de-creche-e-acusado-de-cometer-mais-de-200-abusos-em-sydney", "fonte_id": "metropoles", "data_pub": "2026-10-30T02:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-funcionário de creche em Sydney é acusado de mais de 200 abusos cometidos entre 2014 e 2017.", "titulo_pt": "Ex-funcionário de creche é acusado de cometer mais de 200 abusos em Sydney", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233641, "titulo": "Con cambios de último momento, el Senado debate la reforma a la ley de salud mental", "url": "https://www.lanacion.com.ar/politica/con-cambios-de-ultimo-momento-el-senado-debate-la-reforma-a-la-ley-de-salud-mental-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T02:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto da reforma à lei de saúde mental sofreu alterações aceitas pelo governo para poder ser aprovado; a proibição de criação de manicomios e a internação como medida excepcional foram mantidas.", "titulo_pt": "Com mudanças de última hora, Senado debate reforma na lei de saúde mental", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233402, "titulo": "Brincadeiras desafiadoras preparam crianças para situações de estresse", "url": "https://www.cnnbrasil.com.br/saude/brincadeiras-desafiadoras-preparam-criancas-para-situacoes-de-estresse/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T01:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a exposição a desafios durante a infância fortalece o físico e o emocional das crianças, preparando-as para lidar com situações estressantes na vida adulta.", "titulo_pt": "Brincadeiras desafiadoras preparam crianças para situações de estresse", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 233469, "titulo": "Influencer “Barbeiro Mirim”, de 14 anos, é morto a tiros ao lado de amigo", "url": "https://www.metropoles.com/brasil/influencer-barbeiro-mirim-de-14-anos-e-morto-a-tiros-ao-lado-de-amigo", "fonte_id": "metropoles", "data_pub": "2026-10-30T01:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um influenciador conhecido como 'barbeiro mirim', de 14 anos, foi morto a tiros ao lado de um amigo. A Polícia Civil está investigando o caso.", "titulo_pt": "Influenciador 'Barbeiro Mirim', de 14 anos, é morto a tiros ao lado de amigo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233471, "titulo": "Três torcedores do Santos são condenados a 21 anos por morte de palmeirense", "url": "https://www.metropoles.com/sao-paulo/tres-torcedores-do-santos-sao-condenados-a-21-anos-por-morte-de-palmeirense", "fonte_id": "metropoles", "data_pub": "2026-10-30T01:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três torcedores do Santos Futebol Clube foram condenados a 21 anos de prisão pela morte de um torcedor do Palmeiras. Outros dois torcedores santistas já haviam sido condenados em 2025. A defesa lamenta a decisão e afirma que o processo está cheio de nulidades.", "titulo_pt": "Três torcedores do Santos são condenados a 21 anos por morte de palmeirense", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233531, "titulo": "'Não há palavras pra descrever a dor': a mobilização de um vilarejo para ajudar vítimas de acidente de trem na Espanha", "url": "https://www.bbc.com/portuguese/articles/cmdxwpr40zjzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-30T00:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um acidente de trem na Espanha resultou em pelo menos 74 mortos e dezenas de feridos. Moradores de Urda, um pequeno vilarejo com cerca de 2.500 habitantes, se mobilizaram para auxiliar as vítimas.", "titulo_pt": "Não há palavras para descrever a dor: mobilização de um vilarejo para ajudar vítimas de acidente de trem na Espanha", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 233477, "titulo": "FPF proíbe ida de torcida organizada do Corinthians a estádios até 2027", "url": "https://www.metropoles.com/sao-paulo/fpf-proibe-ida-de-torcida-organizada-do-corinthians-a-estadios-ate-2027", "fonte_id": "metropoles", "data_pub": "2026-10-30T00:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação Paulista de Futebol (FPF) proibiu a Torcida Jovem Camisa 12 do Corinthians de entrar em estádios até o fim de 2026. A medida foi acatada em resposta a um pedido do Ministério Público de São Paulo (MPSP).", "titulo_pt": "FPF proíbe ida de torcida organizada do Corinthians a estádios até 2027", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233744, "titulo": "Desempleo sube a 9,8%; camioneros de San Antonio inician el primer paro del gobierno de Kast, y Corte confirma prisión preventiva para alcalde de Río Bueno por cohecho y lavado de activos", "url": "https://www.ciperchile.cl/2026/10/29/desempleo-sube-a-98-camioneros-de-san-antonio-inician-el-primer-paro-del-gobierno-de-kast-y-corte-confirma-prision-preventiva-para-alcalde-de-rio-bueno-por-cohecho-y-lavado-de-activos/?utm_source=rss&utm_medium=rss&utm_campaign=desempleo-sube-a-98-camioneros-de-san-antonio-inician-el-primer-paro-del-gobierno-de-kast-y-corte-confirma-prision-preventiva-para-alcalde-de-rio-bueno-por-cohecho-y-lavado-de-activos", "fonte_id": "ciper_chile", "data_pub": "2026-10-29T23:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O desemprego aumentou para 9,8%. Camioneros de San Antonio iniciaram o primeiro paro sob o governo de Kast, e a Corte confirmou a prisão preventiva do prefeito de Río Bueno por acusações de corrupção e lavagem de dinheiro.", "titulo_pt": "Desemprego sobe para 9,8%; camioneros de San Antonio iniciam primeiro paro do governo Kast, e Corte confirma prisão preventiva do prefeito de Río Bueno", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 233493, "titulo": "Alexandre Padilha deve permanecer no Ministério da Saúde", "url": "https://www.jota.info/saude/alexandre-padilha-deve-permanecer-no-ministerio-da-saude", "fonte_id": "jota", "data_pub": "2026-10-29T22:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre Padilha deve permanecer no Ministério da Saúde. Petista atendeu ao pedido do presidente de não concorrer a uma vaga na Câmara dos Deputados para participar da campanha.", "titulo_pt": "Padilha deve permanecer no Ministério da Saúde", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 233342, "titulo": "Com mapa digital de crimes, interior de SP registra queda nos homicídios e latrocínios até setembro", "url": "https://veja.abril.com.br/brasil/com-mapa-digital-de-crimes-interior-de-sp-registra-queda-nos-homicidios-e-latrocinios-ate-setembro/", "fonte_id": "veja", "data_pub": "2026-10-29T22:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados mostram uma diminuição nos índices de homicídios e latrocínios no interior de São Paulo até setembro b": "2026-10-29T09:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um cidadão chileno foi morto após ser baleado na comuna de Estação Central. A vítima foi levada a um hospital, mas não sobreviveu devido às gravidade das feridas.", "titulo_pt": "Homem morre após ser baleado em estação Central", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 233628, "titulo": "Informe oficial: ya se evacuaron 147.500 vacunos y búfalos de las zonas inundadas del Litoral", "url": "https://www.lanacion.com.ar/economia/campo/informe-oficial-ya-se-evacuaron-147500-bovinos-y-bufalos-de-las-zonas-inundadas-del-litoral-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço Nacional de Sanidade e Qualidade Agroalimentar (Senasa) informa que 147.500 animais de rebanho já foram evacuados das áreas afetadas pela inundação no Litoral. A quantidade de animais transferidos desde agosto aumentou 102% em comparação com o mesmo período de 2025.", "titulo_pt": "Relatório oficial: 147.500 animais foram evacuados das áreas inundadas no Litoral", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 234026, "titulo": "Indonesia rain set to ease toxic haze in Singapore and Malaysia", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-haze-rain/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A neblina tóxica causada pelas chamas da pior temporada de incêndios na história da Indonésia tem coberto cidades locais e se espalhado para países vizinhos durante semanas. A chuva prevista deve aliviar essa situação.", "titulo_pt": "Chuva deve amenizar neblina tóxica causada por incêndios na indonésia em singapura e malásia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233708, "titulo": "El Niño-driven drought in Papua New Guinea a ‘national crisis’ as rivers dry up and local farms fail", "url": "https://www.theguardian.com/world/2026/oct/30/png-el-nino-drought-papua-new-guinea", "fonte_id": "guardian_world", "data_pub": "2026-10-30T01:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um histórico fenômeno El Niño está causando uma severa escassez de alimentos, água e energia elétrica, afetando até 8 milhões de pessoas em Papua Nova Guiné. O país está enfrentando uma crise nacional devido à seca extrema, com encerramentos de clínicas de saúde e interrupções no ensino.", "titulo_pt": "Seca provocada pelo el niño em Papua nova Guiné se torna uma ‘crise nacional’", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233408, "titulo": "Equipe bate recorde ao capturar mais de 300 peixes-leão em Noronha", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/pe/equipe-bate-recorde-ao-capturar-mais-de-300-peixes-leao-em-noronha/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T01:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma equipe capturou mais de 300 peixes-leão em Fernando de Noronha durante uma operação para conter a espécie invasora que ameaça o ecossistema local.", "titulo_pt": "Equipe bate recorde ao capturar mais de 300 peixes-leão em Noronha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234360, "titulo": "Experts: What China wants from the COP31 climate talks", "url": "https://www.carbonbrief.org/experts-what-china-wants-from-the-cop31-climate-talks", "fonte_id": "carbon_brief", "data_pub": "2026-10-29T14:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31, uma conferência climática que está prestes a ocorrer na Turquia, está recebendo atenção especial da China, que está sendo observada para saber quais são suas prioridades nessa discussão climática.", "titulo_pt": "Expertos: o que a China deseja alcançar nas negociações climáticas da COP31", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 233968, "titulo": "Spain: cranes clear twisted train wreckage as rescuers work through the night", "url": "https://www.euronews.com/video/2026/10/29/spain-cranes-clear-twisted-train-wreckage-as-rescuers-work-through-the-night", "fonte_id": "euronews", "data_pub": "2026-10-29T10:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate trabalharam durante a noite no local de um acidente ferroviário perto de Toledo, onde 68 pessoas morreram. Grues continuaram removendo os destroços enquanto autoridades estabeleceram um necrotério temporário para identificar as vítimas.", "titulo_pt": "Espanha: gruas removem destroços de trens enquanto equipes de resgate trabalham à noite", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 232615, "titulo": "Clima: temporais atingem Centro-Oeste e Sudeste nesta quinta (29/10)", "url": "https://www.metropoles.com/brasil/clima-temporais-atingem-centro-oeste-e-sudeste-nesta-quinta-29-10", "fonte_id": "metropoles", "data_pub": "2026-10-29T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais atingem o Centro-Oeste e o Sudeste, com pancadas fortes e trovoadas previstas para Goiás, Mato Grosso, São Paulo e Minas Gerais. No interior do Nordeste, as temperaturas podem chegar a 39ºC.", "titulo_pt": "Clima: temporais atingem Centro-Oeste e Sudeste nesta quinta (29/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232761, "titulo": "Guías para un clima que ya cambió", "url": "https://www.latercera.com/opinion/noticia/guias-para-un-clima-que-ya-cambio/", "fonte_id": "la_tercera", "data_pub": "2026-10-29T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute orientações para lidar com um clima que já se transformou. Aborda medidas e estratégias adaptativas já que as condições climáticas mudaram.", "titulo_pt": "Guias para um clima que já mudou", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 233135, "titulo": "Analysis: China’s clean-tech exports in 2026 to avoid as much CO2 as Brazil emits in a year", "url": "https://www.carbonbrief.org/analysis-chinas-clean-tech-exports-in-2026-to-avoid-as-much-co2-as-brazil-emits-in-a-year", "fonte_id": "carbon_brief", "data_pub": "2026-10-29T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de tecnologias limpas da China em 2026, como painéis solares, baterias e veículos elétricos, estão programadas para evitar a emissão de CO2 equivalente às emissões anuais do Brasil.", "titulo_pt": "Análise: exportações de tecnologias limpas da china em 2026 evitarão emissões de CO2 equivalentes às do Brasil em um ano", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 232639, "titulo": "Mudanças climáticas devem ser declaradas emergência global de saúde, diz relatório", "url": "https://exame.com/esg/mudancas-climaticas-devem-ser-declaradas-emergencia-global-de-saude-diz-relatorio/", "fonte_id": "exame", "data_pub": "2026-10-29T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório anual da Lancet Countdown afirma que as mudanças climáticas devem ser declaradas emergência global de saúde. A publicação estima que o calor extremo foi responsável por quase 3 milhões de mortes no mundo entre 2016 e 2023.", "titulo_pt": "Mudanças climáticas devem ser declaradas emergência global de saúde, diz relatório", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 231502, "titulo": "Brasil perdeu 45% da vegetação e ‘fragmentou’ florestas nos últimos 38 anos", "url": "https://www.cnnbrasil.com.br/nacional/brasil/brasil-perdeu-45-da-vegetacao-e-fragmentou-florestas-nos-ultimos-38-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T01:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo realizado pelo MapBiomas indica que o Brasil perdeu 45% de sua vegetação e fragmentou florestas nos últimos 38 anos, com redução no tamanho médio das áreas conservadas e avanço do desmembramento do território por lavouras e urbanização. O relatório foi divulgado durante a COP17 da Biodiversidade.", "titulo_pt": "Brasil perdeu 45% da vegetação e 'fragmentou' florestas nos últimos 38 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231595, "titulo": "Los Ángeles pone fin a la producción de petroleo después de más de una década de lucha", "url": "https://www.clarin.com/estados-unidos/los-angeles-pone-fin-a-la-produccion-de-petroleo-despues-de-mas-de-una-decada-de-lucha_0_EiGuHw3rAI.html", "fonte_id": "clarin", "data_pub": "2026-10-29T01:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O conselho municipal de Los Angeles votou unânimemente para proibir a extração de petróleo, afetando mais de 1.800 poços ativos e inativos. A medida visa proteger a saúde pública e alcançar a neutralidade de carbono para 2035, após anos de pressão comunitária.", "titulo_pt": "Los angeles encerra produção de petróleo após década de luta", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 232142, "titulo": "Advocates call for protecting grassland for owls in Shalun science park project", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/29/2003866820", "fonte_id": "taipei_times", "data_pub": "2026-10-29T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados estão pedindo a proteção de pastos para abrigar búfalos-pé-de-galinha no projeto de parque científico Shalun. O objetivo é garantir um habitat adequado para essas aves.", "titulo_pt": "Advogados pleiteiam proteção de pastos para búfalos-pé-de-galinha no projeto do parque científico Shalun", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 234123, "titulo": "Anti-transnational repression law debated amid alleged forced apology", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/30/2003866868", "fonte_id": "taipei_times", "data_pub": "2026-10-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei antirrepresão transnacional está sendo debatida, e há relatos de supostas forçadas a se desculpar.", "titulo_pt": "Lei antirrepresão transnacional debatida em meio a relatos de forçadas a se desculpar", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 234069, "titulo": "Anti-Muslim provocation could deter community from US midterm elections, advocacy group says", "url": "https://www.middleeasteye.net/news/anti-muslim-provocation-could-deter-community-us-midterm-elections-advocacy-group", "fonte_id": "middle_east_eye", "data_pub": "2026-10-29T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Muslim Public Affairs Council expressa preocupação com a escalada de provocações antimusulmanas, que poderiam dissuadir a comunidade muçulmana de votar nas eleições médias dos Estados Unidos. A organização também menciona as afirmações infundadas de Trump e seus aliados sobre possíveis fraudes nas estações de votação.", "titulo_pt": "Provações antimusulmanas podem dissuadir comunidade muçulmana nas eleições médias americanas, diz grupo de advocacy", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 233454, "titulo": "Jafar Panahi, indicado ao Oscar, é condenado a cinco anos de prisão no Irã", "url": "https://exame.com/pop/jafar-panahi-indicado-ao-oscar-e-condenado-a-cinco-anos-de-prisao-no-ira/", "fonte_id": "exame", "data_pub": "2026-10-29T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cineasta iraniano Jafar Panahi foi condenado a cinco anos de prisão e proibido de viajar e usar redes sociais por dois anos. Sua defesa afirma que ele não foi informado sobre as audiências do processo.", "titulo_pt": "Jafar Panahi, indicado ao Oscar, é condenado a cinco anos de prisão no Irã", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 234347, "titulo": "'A trip to the market should never cost a child their life'", "url": "https://www.unicef.org/press-releases/trip-market-should-never-cost-child-their-life", "fonte_id": "unicef", "data_pub": "2026-10-29T13:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Etleva Kadilli, diretora regional do UNICEF para a África Oriental e Austral, fez uma declaração sobre a segurança dos crianças durante as compras no mercado. Ela enfatizou que as viagens ao mercado não devem custar a vida de uma criança.", "titulo_pt": "Viagem ao mercado não deve custar a vida de uma criança", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 232931, "titulo": "North Koreans being recruited into forced labour in Russia, report says", "url": "https://www.aljazeera.com/economy/2026/10/29/north-koreans-being-recruited-into-forced-labour-in-russia-report-says?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-29T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Global Rights Compliance afirma que uma rede de broqueiros russos está recrutando trabalhadores norte-coreanos usando vistos de estudante. Os norte-coreanos seriam empregados em trabalho forçado na Rússia.", "titulo_pt": "Norte-coreanos estariam sendo recrutados para trabalho forçado na Rússia, relata", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 232626, "titulo": "Ativista canadense que resgatava animais morre em bombardeio na Ucrânia", "url": "https://www.metropoles.com/mundo/ativista-canadense-que-resgatava-animais-morre-em-bombardeio-na-ucrania", "fonte_id": "metropoles", "data_pub": "2026-10-29T08:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jesse Adams, um ativista canadense que trabalhava voluntariamente resgatando animais nas zonas de conflito na Ucrânia, morreu em um bombardeio.", "titulo_pt": "Ativista canadense que resgatava animais morre em bombardeio na Ucrânia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232973, "titulo": "Politician ordered to pay ¥1.1 million for outing author as transgender", "url": "https://www.japantimes.co.jp/news/2026/10/29/japan/crime-legal/transgender-outing-rulinig/", "fonte_id": "japan_times", "data_pub": "2026-10-29T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Tóquio determinou que o político deve pagar 1,1 milhão de ienes por revelar sem consentimento o gênero atribuído ao nascimento da autora, considerando que isso foi uma invasão ilegal da privacidade.", "titulo_pt": "Político ordenado a pagar 1,1 milhão de ienes por revelar gênero da autora sem consentimento", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233071, "titulo": "(LEAD) Seoul mulling co-sponsoring U.N. resolution on N. Korean human rights", "url": "https://en.yna.co.kr/view/AEN20261029007251315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Unificação está em conversas com entidades relevantes sobre a possibilidade de cosancionar uma resolução da ONU sobre os direitos humanos na Coreia do Norte.", "titulo_pt": "Seul considera cosancionar resolução da ONU sobre direitos humanos na Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232814, "titulo": "Cambodian police and soldiers helped guard abusive scam compounds, Amnesty alleges", "url": "https://www.theguardian.com/world/2026/oct/29/cambodian-police-scam-compounds-amnesty-international", "fonte_id": "guardian_world", "data_pub": "2026-10-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo um relatório da Amnesty Internacional, sobreviventes relataram que policiais e soldados servidores trabalharam como guardas em compêndios de estelionato onde milhares eram forçados a trabalhar na indústria de fraudes online. Os guardas teriam usado choques elétricos e espancamentos para manter as pessoas presas.", "titulo_pt": "Polícias e militares ajudaram a proteger compêndios de estelionato abusivos, acusa Amnesty", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233059, "titulo": "Hong Kong teen jailed for 8 years for acid attack on Singaporean tourist", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3372525/hong-kong-teen-jailed-8-years-acid-attack-singaporean-tourist", "fonte_id": "scmp", "data_pub": "2026-10-29T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente com ligações a trios foi condenado a 8 anos de prisão por atacar uma turista de Singapura com líquido corrosivo em Hong Kong, em junho de 2025. A vítima, uma mulher de 36 anos, sofreu queimaduras de segundo grau e o ataque teve um impacto permanente em sua vida.", "titulo_pt": "Jovem de hong Kong condenado a 8 anos por ataque ácido a turista de singapura", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 232893, "titulo": "Ten years after the Calais 'jungle' was dismantled, migrants still wait in makeshift camps hoping to reach Britain", "url": "https://www.lemonde.fr/en/france/article/2026/10/29/ten-years-after-the-calais-jungle-was-dismantled-migrants-still-wait-in-makeshift-camps-in-hopes-of-reaching-britain_6766564_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-29T02:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o desmantelamento, em 2016, da 'jungle' de Calais, que era então a maior área de acampamentos precários da Europa, pequenos acampamentos improvisados surgiram ao longo da costa norte da França, onde as organizações de ajuda relatam condições de vida insalubres. Migrantes continuam a esperar nestes acampamentos, esperando chegar ao Reino Unido.", "titulo_pt": "Dez anos após a 'jungle' de Calais ser desmantelada, migrantes ainda aguardam em acampamentos improvisados na costa francesa, esperando chegar ao reino unido", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 232201, "titulo": "Rights commission calls for leniency for ex-Coupang workers indicted in 'blacklist' case", "url": "https://en.yna.co.kr/view/AEN20261029003300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Anticorrupção e de Direitos Civis pediu clemência para os ex-funcionários da Coupang acusados no caso da 'lista negra'.", "titulo_pt": "Comissão de direitos civis pede clemência para ex-funcionários da coupang acusados no caso da 'lista negra'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231768, "titulo": "Albania imposes $6,000 fine for demonstrators present at a protest that turns violent", "url": "https://www.theguardian.com/world/2026/oct/29/albania-protest-attendance-fine-law", "fonte_id": "guardian_world", "data_pub": "2026-10-29T00:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Albânia introduziu multas de mais de $6.000 para demonstrantes que participam de protestos violentos, mesmo que não cometam atos violentos pessoais. A medida visa reprimir as manifestações que exigem o renúncia do primeiro-ministro, após meses de protestos anti-governo na capital Tirana que recentemente se deterioraram em confrontos entre forças de segurança e manifestantes.", "titulo_pt": "Albânia impõe multa de mais de $6.000 para demonstrantes em protestos violentos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 234218, "fonte_id": "yonhap_news", "titulo": "(LEAD) Seoul to continue taking necessary measures based on 'clear principles' over DMZ blast: Wi", "url": "https://en.yna.co.kr/view/AEN20261030005151315", "data_pub": "2026-1 function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));

}

  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
