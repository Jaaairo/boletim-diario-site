<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "10/10/2026 07:27", "stats": {"noticias_novas": 613, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O resultado do primeiro turno das eleições brasileiras alterou a disputa pelo Supremo Tribunal Federal (STF), com Flávio Bolsonaro e Lula sendo cotados para nomeações. A campanha de Flávio prometeu alívio nas dívidas dos estados, enquanto a de Lula tem gerado mobilização online. Na Câmara dos Deputados, a permanência de Hugo Motta e Davi Alcolumbre na presidência está em discussão, com o PL pretendendo assumir o comando de pelo menos uma das Casas. O projeto de PEC que visa extinguir a jornada de seis dias de trabalho por um de descanso foi agendado para votação inicial na próxima quarta-feira. Além disso, a deputada Ana Elisa, eleita com 21 anos, enfrenta ataques racistas nas redes sociais, enquanto o presidente José Sarney foi internado após dores abdominais.", "mundo": "Navanethem 'Navi' Pillay, ex-chefe da ONU para os direitos humanos e juíza do Tribunal Internacional de Justiça, recebeu o Nobel da Paz em Oslo, Noruega. A decisão do comitê do prêmio gerou críticas do presidente dos Estados Unidos, Donald Trump, que criticou a não concessão do Nobel para 2026 e expressou insatisfação com o comitê norueguês. No Oriente Médio, o Iêmen realizou ataques contra a infraestrutura de petróleo da Arábia Saudita, aumentando o risco de um conflito mais amplo na região. Em um town square de Pryluky, na Ucrânia, centenas de pessoas se reuniram para homenagear as vítimas de um ataque russo, incluindo crianças, que resultou em pelo menos oito mortes. Além disso, a China e a União Europeia chegaram a um acordo para reduzir as exportações de carros híbridos chineses para a Europa nos próximos quatro anos, enquanto o presidente ucraniano Volodymyr Zelenskyy criticou o anúncio de Donald Trump de um acordo para comprar diesel russo.\n\nA geopolítica global enfrenta diversos desafios e movimentações importantes. Em primeiro lugar, os Estados Unidos e a Rússia assinaram um acordo para a exportação de diesel, gerando controvérsias na Europa, especialmente na Ucrânia, que reagiu com um ataque a uma instalação de combustível russa. O acordo visa reduzir os preços do diesel, mas também alimenta tensões na região. Em seguida, a coalisão liderada pelos sauditas intensificou suas operações no Iêmen, destruindo 136 alvos militares hutitas. O conflito no país continua, com a ONU alertando para uma escalada da guerra. Além disso, um terremoto de magnitude 7,6 atingiu o Panamá, ferindo 27 pessoas e afetando a região. Em outro desenvolvimento, a Arábia Saudita confirmou que estará exportando diesel para os Estados Unidos a partir de outubro, em um movimento que pode afetar as relações comerciais e geopolíticas na região do Golfo. Estes eventos refletem a complexidade e a dinâmica da geopolítica global atual.", "economia": "O Ibovespa atingiu um novo recorde de 209 mil pontos na sexta-feira, subindo mais de 8% na semana após o primeiro turno das eleições. O dólar permaneceu abaixo dos R$ 5. O mercado financeiro continua influenciado pelo cenário político e pela inflação, que aumentou 0,82% em setembro. Outro destaque foi a aprovação da listagem de ações da Raízen Energia na B3, como parte da recuperação extrajudicial do grupo, com o objetivo de separar os negócios de açúcar, etanol e bioenergia dos combustíveis. A BRF Pet iniciou exportações de alimentos úmidos para os Estados Unidos, representando mais de 40% do faturamento global do setor. Além disso, a Whirlpool manteve a aplicação do IRPJ e CSLL sobre a Whirlpool, excluindo os lucros das controladas na Argentina da base de cálculo dos tributos, conforme decisão do Carf.", "tecnologia": "A China apresentou um protótipo de robô inteligente projetado para auxiliar na seleção de variedades de trigo. Isso faz parte de sua estratégia para avançar na tecnologia agrícola e fortalecer a segurança alimentar. Paralelamente, a Phison Electronics registrou um recorde de receita consolidada de setembro em NT$30,639 bilhões (US$959 milhões), com aplicações relacionadas a inteligência artificial representando mais de 50% das receitas. A demanda explosiva para computação de inteligência artificial está impulsionando mudanças na arquitetura de hardware. A SpaceX está avançando com o lançamento de um serviço de operadora móvel da Starlink nos Estados Unidos, o que resultou em uma queda de cerca de US$ 62 bilhões no valor de mercado combinado das maiores operadoras de telecomunicações do país. Além disso, a Anthropic decidiu cortar temporariamente o acesso à internet viva para todas as suas avaliações internas, enquanto a OpenAI espera gerar uma receita anualizada de US$70 bilhões.", "ciencia": "Um estudo controverso que irá suspender a vacina contra hepatite B para alguns recém-nascidos africanos foi aprovado para prosseguir, com Robert F Kennedy Jr, um oponente histórico da vacina, sendo um dos principais promotores. O evento mais recente envolvendo a NASA é a busca por propostas da indústria americana para o desenvolvimento de novas estações espaciais comerciais em órbita baixa, com o objetivo de fortalecer a liderança americana nesse setor. Além disso, pesquisadores descobriram que as asas do berço-européu, um pássaro, permitem que o pássaro reduza sua velocidade e faça manobras rápidas durante a caça de insetos, revelando um novo entendimento sobre a evolução e adaptação desses pássaros. Uma nova técnica de fluorescência de dois fotôneos mais rápida foi desenvolvida para observar a metabolização de células em tempo real, permitindo um screening mais rápido de novos tratamentos terapêuticos. Por fim, uma nuvem de gelo gigante em Marte surge e desaparece diariamente, com a Nuvem Alongada de Arsia Mons (AMEC) tendo quase o dobro do tamanho do Reino Unido, sugerindo atividades geológicas ativas na superfície marciana.", "cultura": "Aos 50 anos de 'O Beijo da Mulher Aranha', de Manuel Puig, o livro continua sendo um ícone cultural no Brasil e no mundo, com grande impacto na literatura e na sociedade. Segundo um artigo do 'La Nación', o livro aborda temas sociais e culturais complexos, como o orgulho e a vergonha. A exposição 'Remember Me', no 'Bourse de Commerce' em Paris, apresenta 700 obras do colecionador François Pinault, com destaque para o trabalho de Irving Penn. No entanto, a exposição é criticada por ser uma seleção limitada e didática. A 40 anos de sua publicação, o livro autobiográfico 'Quatro Anos nas Orcadas do Sul', de José Manuel Moneta, foi reeditado, relembrando a história do pioneirismo argentino na Antártida.", "sociedade": "Os protestos estudantis na França continuam a agitar a sociedade, com a terceira semana marcada por violência policial, que resultou em feridos e denúncias de abuso. Além disso, a plataforma Parcoursup, responsável pelo acesso às instituições de ensino superior, é alvo de críticas dos estudantes. Em outro ponto do mundo, a Dinamarca permitirá que professores usem força física para manter a ordem nas escolas. Na Bolívia, o governo censurou a rádio comunitária Kausachun Coca, enquanto a perda de mão de uma adolescente durante protestos em uma escola de ensino médio no norte da França levanta preocupações sobre a segurança durante manifestações. Ainda no Brasil, o INSS começou a pagar auxílio para vítimas de violência doméstica, e a saúde mental enfrenta desafios com a incerteza dos planos de saúde limitando investimentos em atendimento psiquiátrico.", "meio_ambiente": "São Paulo alcançou um marco histórico ao entregar 250 novos ônibus elétricos, elevando a frota para 2.000 veículos e consolidando a cidade como líder em eletromobilidade no Brasil. Em contraste, o furacão Isaias atingiu a Flórida, trazendo ventos fortes e chuva intensa, com a advertência de uma onda costeira perigosa. Em outro desenvolvimento, um terremoto de magnitude 7,6 atingiu o Panamá, levando à suspensão de aulas, operações aeroportuárias e linhas de metrô, com relatos de danos a edifícios e interrupção de energia em seis províncias. No Brasil, um estudo da Fiocruz detectou cocaína em cinco rios do Rio de Janeiro, com a contaminação superando níveis encontrados em outros cinco países, resultando em mortes, deformações e alterações cardiovasculares e neurológicas em organismos aquáticos.", "direitos_humanos": "A Arábia Saudita e o governo reconhecido internacionalmente de Yemen pediram à ONU que tomasse medidas contra os hutitas, acusando-os de ataques a civis e recrutamento de soldados menores de idade. Em outro desenvolvimento, Navi Pillay, jurista sul-africana e ex-comissária das Nações Unidas para os Direitos Humanos, foi declarada vencedora do Prêmio Nobel de Paz de 2026, destacando-se por sua atuação em defesa do direito internacional e na responsabilização por crimes contra a humanidade. Pillay, que já atuou em tribunais internacionais e participou de julgamentos históricos, recebeu o prêmio aos 85 anos, tornando-se a 21ª mulher a ganhar o Nobel da Paz. Além disso, um garoto palestiniano foi visto fugindo após judeus settleres atacarem seu pai e roubarem seu carro em Ramallah, ilustrando a violência enfrentada pelos palestinos na Cisjordânia Ocidental."}, "resumo_do_dia": {"politica_nacional": [{"id": 206882, "titulo": "Cotado por Flávio para STF era 'distribuidor' de livros de Ustra entre bolsonaristas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/cotado-por-flavio-para-stf-era-distribuidor-de-livros-de-ustra-entre-bolsonaristas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do TCU Jorge Oliveira, um dos nomes cotados para ser indicado como ministro do STF em um eventual governo de Flávio Bolsonaro, ajudou a difundir as ideias do coronel Ustra entre os apoiadores de Jair Bolsonaro.", "titulo_pt": "Nome indicado para STF era 'distribuidor' de ideias de Ustra entre bolsonaristas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206883, "titulo": "Filho de Lira, eleito antes da idade em lei, fez campanha no rastro da projeção do pai", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/filho-de-lira-eleito-antes-da-idade-em-lei-fez-campanha-no-rastro-da-projecao-do-pai.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Álvaro Lins Pereira de Lira, de 20 anos, será o deputado mais jovem da história do Brasil, filho do deputado federal e senador eleito Arthur Lira. Ele foi eleito antes da idade mínima permitida pela lei, mas uma lei sancionada no ano passado pelo presidente Lula permitiu sua candidatura.", "titulo_pt": "Filho de Lira, eleito antes da idade em lei, fez campanha no rastro da projeção do pai", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206884, "titulo": "Senador eleito mais jovem da história é antigo aliado do bolsonarismo e defendeu voto impresso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/senador-eleito-mais-jovem-da-historia-e-antigo-aliado-do-bolsonarismo-e-defendeu-voto-impresso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Filipe Barros, de 35 anos, foi eleito senador pelo Paraná e será o mais jovem senador da história do Brasil, ao menos desde o início do século 20. Ele é um antigo aliado do bolsonarismo e defendeu o voto impresso.", "titulo_pt": "Senador eleito mais jovem é antigo aliado do bolsonarismo e defendeu voto impresso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206885, "titulo": "Quem é Lucas Polese, eleito deputado federal do PL com votação recorde no Espírito Santo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/quem-e-lucas-polese-eleito-deputado-federal-do-pl-com-votacao-recorde-no-espirito-santo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lucas Polese, deputado federal eleito pelo partido PL no Espírito Santo, teve sua entrada na política em 2016 através de um perfil no Instagram do que ele chamou de Instituto Liberal do Espírito Santo, o IIes.", "titulo_pt": "Quem é Lucas Polese, deputado federal eleito com votação recorde no Espírito Santo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206886, "titulo": "Aos 21, maranhense apoiada por Sarney e prefeito investigado é deputada estadual mais jovem do país", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/aos-21-maranhense-apoiada-por-sarney-e-prefeito-investigado-e-deputada-estadual-mais-jovem-do-pais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Natália do Júnior Garimpeiro, de 21 anos, foi eleita deputada estadual mais jovem do país com o apoio do ex-presidente José Sarney. O prefeito investigado também apoiou sua candidatura.", "titulo_pt": "Aos 21, deputada eleita com apoio de Sarney e prefeito investigado é a mais jovem do país", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206909, "titulo": "Flávio Bolsonaro promete novo alívio em dívidas de estados após pedido de governador eleito de MG", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/flavio-bolsonaro-promete-novo-alivio-em-dividas-de-estados-apos-pedido-de-governador-eleito-de-mg.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência, prometeu, se eleito, um novo alívio nas dívidas dos estados após um pedido do governador eleito de Minas Gerais, Cleitinho Azevedo. O senador Flávio Bolsonaro é do partido PL.", "titulo_pt": "Flávio Bolsonaro promete novo alívio em dívidas de estados após pedido de governador eleito de MG", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206887, "titulo": "Grupo de token pró-Flávio briga após prejuízos, cobra compradores e tira política de site até eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/grupo-de-token-pro-flavio-briga-apos-prejuizos-cobra-compradores-e-tira-politica-de-site-ate-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Responsáveis e compradores da criptomoeda B22, que promoveu Flávio Bolsonaro (PL), estão trocando cobranças e discutindo prejuízos em um grupo de WhatsApp desde o lançamento do ativo na terça-feira (6). O site do projeto retirou a política de compra e venda até a eleição.", "titulo_pt": "Grupo de token pró-flávio briga após prejuízos e cobra compradores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206888, "titulo": "Ex _de": null, "texto_pt": "O Tribunal Regional Federal da 3ª Região suspendeu uma liminar que permitia o site da casa de apostas Stake permanecer no ar até o dia 25, data do segundo turno das eleições presidenciais. A decisão foi tomada nesta sexta-feira (9).", "titulo_pt": "Justiça Federal suspende decisão que permitia site de apostas permanecer no ar até o segundo turno das eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206890, "titulo": "Resultado da eleição redefine fila de cotados ao STF com Flávio Bolsonaro ou Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/resultado-da-eleicao-redefine-fila-de-cotados-ao-stf-com-flavio-bolsonaro-ou-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O resultado do primeiro turno da eleição redefine a fila de cotados para nomeações ao STF, com Flávio Bolsonaro ou Lula sendo possíveis candidatos. A composição do STF pode ser remodelada pelo próximo presidente, que terá pelo menos quatro nomeações para a corte.", "titulo_pt": "Resultado da eleição redefine fila de cotados ao STF com Flávio Bolsonaro ou Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206891, "titulo": "Perfis pró-Flávio no Brasil e no exterior expuseram eleitores de Lula e incentivaram denúncias", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/perfis-pro-flavio-no-brasil-e-no-exterior-expuseram-eleitores-de-lula-e-incentivaram-denuncias.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Perfis de apoiadores de Flávio Bolsonaro no Brasil e no exterior mobilizaram usuários nas redes sociais para identificar, expor e incentivar denúncias contra eleitores do presidente Lula que vivem em outros países. Essas ações ocorreram durante e após o primeiro turno das eleições brasileiras, realizado em 4 de outubro.", "titulo_pt": "Perfis pró-flávio mobilizaram usuários para denunciar eleitores de Lula no exterior", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206892, "titulo": "Mobilização online pró-Lula liga alerta na campanha de Flávio Bolsonaro, que contra-ataca", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mobilizacao-online-pro-lula-liga-alerta-na-campanha-de-flavio-bolsonaro-que-contra-ataca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de reeleição de Lula tem gerado mobilização online, o que despertou a atenção da campanha de Flávio Bolsonaro, que está reagindo com contraofensivas no WhatsApp.", "titulo_pt": "Mobilização online pró-lula alerta campanha de Flávio Bolsonaro, que contra-ataca", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206893, "titulo": "Favoritismo de Flávio Bolsonaro põe em xeque reeleição de Motta e Alcolumbre, e centrão se movimenta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/favoritismo-de-flavio-bolsonaro-poe-em-xeque-reeleicao-de-motta-e-alcolumbre-e-centrao-se-movimenta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O favoritismo de Flávio Bolsonaro na corrida presidencial ameaça a permanência de Hugo Motta e Davi Alcolumbre na presidência da Câmara dos Deputados e do Senado a partir de fevereiro. O PL pretende assumir o comando de pelo menos uma das Casas, e alas do centrão competem para ficar com a outra.", "titulo_pt": "Favoritismo de Flávio Bolsonaro ameaça permanência de Motta e Alcolumbre e centrão se movimenta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206894, "titulo": "Segundo turno tem guerra judicial com ordens de ministros contra Lula e ação do PT contra Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/segundo-turno-tem-guerra-judicial-com-ordens-de-ministros-contra-lula-e-acao-do-pt-contra-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há uma disputa jurídica no Tribunal Superior Eleitoral entre as campanhas de Lula e do PT contra Flávio, durante a primeira semana do segundo turno da eleição presidencial.", "titulo_pt": "Segundo turno tem guerra judicial com ordens de ministros contra Lula e ação do PT contra Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206962, "titulo": "Nova pesquisa Datafolha mostra a disputa Flávio x Lula no segundo turno", "url": "https://veja.abril.com.br/politica/nova-pesquisa-datafolha-mostra-a-disputa-flavio-x-lula-no-segundo-turno/", "fonte_id": "veja", "data_pub": "2026-10-10T01:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha vai analisar a preferência dos votos entre Flávio e Lula no segundo turno, além de avaliar o governo Lula e identificar as principais preocupações dos brasileiros.", "titulo_pt": "Nova pesquisa Datafolha revela disputa entre Flávio e Lula no segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 207270, "titulo": "Indian police detain 'cockroach' leaders ahead of protest against election commission", "url": "https://www.lemonde.fr/en/international/article/2026/10/10/indian-police-detain-cockroach-leaders-ahead-of-protest-against-election-commission_6758451_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abhijeet Dipke, fundador do Cockroach Janta Party, e dois outros líderes foram detidos antes de desembarcar em um voo, em preparação a uma manifestação sobre supostas irregularidades durante a revisão nacional do cadastro eleitoral.", "titulo_pt": "Polícia indianense detém 'líderes de escorpião' antes de protesto sobre revisão eleitoral", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207267, "titulo": "Trump and Putin sign diesel deal, angering Ukraine and its allies", "url": "https://www.lemonde.fr/en/international/article/2026/10/10/trump-and-putin-sign-diesel-deal-angering-ukraine-and-its-allies_6758450_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que a Rússia concordou em fornecer quase 5 milhões de toneladas de diesel para os Estados Unidos e mercados globais em um prazo curto. O acordo gerou indignação na Europa.", "titulo_pt": "Trump e Putin assinam acordo de diesel, irritando Ucrânia e aliados", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207278, "titulo": "Taiwan to boost military spending to 'deter war' with China", "url": "https://www.dw.com/en/taiwan-to-boost-military-spending-to-deter-war-with-china/a-79625346?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-10T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente de Taiwan, Lai Ching-te, anunciou que o país está aumentando os gastos militares para 'deter uma guerra' com a China. Este anúncio foi feito após o presidente dos Estados Unidos, Donald Trump, ter solicitado que Taiwan pague por sua própria proteção.", "titulo_pt": "Taiwan vai aumentar gastos militares para 'deter guerra' com China", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 207383, "titulo": "Hong Kong police smash alleged Thai prostitution ring, seize HK$13 million cash", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3370438/hong-kong-police-smash-alleged-thai-prostitution-ring-seize-hk13-million-cash?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong desmantelou uma suposta quadrilha local envolvida no comércio de sexo com mulheres tailandesas, apreendendo HK$13 milhões em dinheiro e congelando HK$5 milhões suspeitos de serem provenientes de ilícitos. Cinco homens locais e dois estrangeiros, com idades entre 44 e 54 anos, foram detidos acusados de operar um esquema de prostituição na área de Tsim Sha Tsui.", "titulo_pt": "Polícia de hong Kong desmantela suposto esquema de prostituição com tailandesas, apreendendo 13 milhões de hkd", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 207314, "titulo": "Journalist Hamurabi Huesca Manzano killed in Mexico’s Oaxaca", "url": "https://www.aljazeera.com/news/2026/10/10/journalist-killed-in-mexico-ninth-this-year-ngo?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-10T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos conflitantes surgiram sobre as circunstâncias da morte do jornalista Hamurabi Huesca Manzano em Oaxaca, México, levando organizações de advocacy a exigirem justiça.", "titulo_pt": "Jornalista Hamurabi Huesca Manzano morto em Oaxaca, México", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 207286, "titulo": "India's 'cockroach' movement: \"This is unprecedented\"", "url": "https://www.france24.com/en/video/20261010-india-s-cockroach-movement-this-is-unprecedented", "fonte_id": "france24", "data_pub": "2026-10-10T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia indiana deteve Abhijeet Dipke, líder do movimento satírico Cockroach Janta Party (CJP), antes de uma grande manifestação contra a Comissão Eleitoral. Segundo a fonte, essa é uma ação inédita.", "titulo_pt": "Movimento 'lagarta' da Índia: 'esta é inédita'", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 207349, "titulo": "Police arrest leader of India’s ‘Cockroach’ movement before mass protest", "url": "https://www.ft.com/content/407fa757-cc77-49c0-871a-5140dd3a9a80?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-10T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abhijeet Dipke, líder do movimento indiano 'Cockroach', foi detido pelas autoridades antes de uma grande manifestação em Nova Deli. Ele foi conduzido fora de um voo durante a repressão às demonstrações na cidade.", "titulo_pt": "Líder do movimento 'Cockroach' de India é detido antes de grande protesto em nova deli", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 207287, "titulo": "India detains 'cockroach' leaders ahead of election protest", "url": "https://www.france24.com/en/video/20261010-india-detains-cockroach-leaders-ahead-of-election-protest", "fonte_id": "france24", "data_pub": "2026-10-10T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia indiana deteve o líder do movimento satírico 'lagarta' online antes de uma grande manifestação contra a Comissão Eleitoral, que gerou medidas de segurança mais rigorosas.", "titulo_pt": "Índia detém 'líderes de lagarta' antes de protesto eleitoral", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 207288, "titulo": "France: Scientists conduct microgravity experiments on parabolic flights", "url": "https://www.france24.com/en/video/20261010-france-scientists-conduct-microgravity-experiments-on-parabolic-flights", "fonte_id": "france24", "data_pub": "2026-10-10T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta semana, em Bordeaux, a CNES (Agência Espacial Francesa) realizou uma campanha de pesquisa em microgravidade com cientistas de todo o mundo. Eles realizaram experimentos em gravidade zero durante voos parabólicos a bordo de um Airbus adaptado, sem precisar enviar seus equipamentos para o espaço.", "titulo_pt": "França: cientistas realizam experimentos de microgravidade em voos parabólicos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 207289, "titulo": "Trump hails Russia deal to release diesel as midterms loom", "url": "https://www.france24.com/en/video/20261010-trump-hails-russia-deal-to-release-diesel-as-midterms-loom", "fonte_id": "france24", "data_pub": "2026-10-10T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que conseguiu um acordo com a Rússia para liberar grandes quantidades de diesel. Essa medida visa aliviar sanções à Moscou e reduzir custos energéticos antes das eleições legislativas internas americanas.", "titulo_pt": "Trump comemora acordo com Rússia para liberar diesel antes das eleições", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 207166, "titulo": "A Week Later, Russia Hasn’t Said What Pathogen Killed Plague Researcher", "url": "https://www.nytimes.com/2026/10/10/world/europe/russia-plague.html", "fonte_id": "nyt_world", "data_pub": "2026-10-10T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que, com a tecnologia de testagem moderna, as autoridades russas deveriam ter determinado o agente patogênico que causou a morte do pesquisador da peste há uma semana.", "titulo_pt": "Uma semana depois, Rússia não esclareceu qual patógeno causou a morte do pesquisador de peste", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 206903, "titulo": "Quem é o prefeito de esquerda que protestou com os estudantes na França", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/quem-e-o-prefeito-de-esquerda-que-protestou-com-os-estudantes-na-franca.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bally Bagayoko, prefeito de esquerda da maior cidade ao norte de Paris, interveio durante os protestos estudantis, se colocando entre a polícia e os manifestantes. Essas imagens o apresentaram como uma figura destacada na França.", "titulo_pt": "Quem é o prefeito de esquerda que interveio nos protestos estudantis na França", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 207141, "titulo": "Voto de castigo y paliza electoral en Brasil", "url": "https://www.latercera.com/opinion/noticia/voto-de-castigo-y-paliza-electoral-en-brasil/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O voto de castigo e a paliza eleitoral são temas discutidos no Brasil, referindo-se a fenômenos eleitorais negativos como punição aos governantes atuais e a agressões durante campanhas.", "titulo_pt": "Voto de castigo e violência eleitoral no Brasil", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207237, "titulo": "The Met puts a modern artist front and center (and there's some Jackson Pollock, too)", "url": "https://www.npr.org/2026/10/10/nx-s1-5920376/lee-krasner-jackson-pollock-met", "fonte_id": "npr_news", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Met exibe uma exposição importante que coloca as obras de dois artistas importantes do século XX lado a lado: o casal Lee Krasner e Jackson Pollock.", "titulo_pt": "A Met destaca artistas do século xx em exposição conjunta (e há também Jackson Pollock)", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 207238, "titulo": "After losing ground with Latino voters, Democrats are turning to influencers for help", "url": "https://www.npr.org/2026/10/10/nx-s1-5991897/democrats-latino-voters-influencers-bold-pac", "fonte_id": "npr_news", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas buscam recuperar votos dos latinos, que se desiludiram com ambos os partidos. Eles esperam que criadores de conteúdo latinos ajudem a fechar essa brecha.", "titulo_pt": "Depois de perder terreno com eleitores latinos, democratas recorrem a influenciadores", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 207239, "titulo": "A year of ceasefire in Gaza through the lens of NPR's reporter", "url": "https://www.npr.org/sections/the-picture-show/2026/10/10/nx-s1-5991619/gaza-ceasefire-israel-life", "fonte_id": "npr_news", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há um ano, Hamas libertou os últimos reféns israelenses e o presidente Trump prometeu pôr fim à guerra, mas os palestinos afirmam que os últimos 12 meses foram apenas uma tregua em nome apenas.", "titulo_pt": "Um ano de tregua no Gaza através da lente do repórter da NPR", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 207113, "titulo": "Athina Kanioura: “América Latina será el motor de crecimiento de PepsiCo”", "url": "https://www.lanacion.com.ar/economia/negocios/athina-kanioura-america-latina-sera-el-motor-de-crecimiento-de-pepsico-nid10102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-10T09:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Athina Kanioura, CEO da PepsiCo para América Latina, visitou a Argentina e anunciou investimentos no valor de centenas de milhões de dólares. O plano visa duplicar o crescimento da empresa no país, abordando novos consumidores e o impacto da IA.", "titulo_pt": "Athina Kanioura: 'américa Latina será o motor de crescimento da PepsiCo'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 207222, "titulo": "Carf mantém IRPJ/CSLL por exclusão de resultados de controladas da base de cálculo", "url": "https://www.jota.info/tributos/carf-mantem-irpj-csll-por-exclusao-de-resultados-de-controladas-da-base-de-calculo", "fonte_id": "jota", "data_pub": "2026-10-10T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Recursos Fiscais (Carf) manteve a aplicação do IRPJ e CSLL sobre a Whirlpool, que excluiu os lucros de suas controladas na Argentina da base de cálculo dos tributos.", "titulo_pt": "Carf mantém IRPJ e CSLL após exclusão de resultados de controladas na base de cálculo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 206908, "titulo": "Endividamento e novos hábitos esfriam venda de brinquedos no Dia das Crianças", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/endividamento-e-novos-habitos-esfriam-venda-de-brinquedos-no-dia-das-criancas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço dos brinquedos, roupas e calçados infantis diminuiu no último ano, mas essa redução não será suficiente para aquecer as vendas no Dia das Crianças, celebrado na segunda-feira (12).", "titulo_pt": "Endividamento e novos hábitos esfriam venda de brinquedos no Dia das Crianças", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 207385, "titulo": "Chinese nickel investors brace for headwinds as Indonesia weighs smelter freeze", "url": "https://www.scmp.com/economy/global-economy/article/3370344/chinese-nickel-investors-brace-headwinds-indonesia-weighs-smelter-freeze?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores chineses podem enfrentar significativas perturbações se a Indonésia impuser uma moratória sobre novas usinas de níquel para controlar a sobreprodução global e proteger as indústrias locais em seu vasto setor mineral. A decisão está sendo considerada devido à sobrecapacidade global que reduziu os preços dos commodities.", "titulo_pt": "Investidores chineses se preparam para desafios se indonésia proibir novas usinas de níquel", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 207223, "titulo": "Agenda de risco das empresas deixou perímetro financeiro e exige visão ampla", "url": "https://www.jota.info/opiniao-e-analise/artigos/agenda-de-risco-das-empresas-deixou-perimetro-financeiro-e-exige-visao-ampla", "fonte_id": "jota", "data_pub": "2026-10-10T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As agendas das empresas incluem reforma tributária, risco cibernético e dependência de terceiros, exigindo uma visão ampla dos conselhos. Perímetros financeiros tradicionais não abrangem mais esses riscos emergentes.", "titulo_pt": "Agenda de risco das empresas exige visão ampla", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 207224, "titulo": "ANPD como agência reguladora marca amadurecimento da proteção de dados", "url": "https://www.jota.info/opiniao-e-analise/artigos/anpd-como-agencia-reguladora-marca-amadurecimento-da-protecao-de-dados", "fonte_id": "jota", "data_pub": "2026-10-10T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ANPD passa a atuar como agência reguladora, ampliando sua capacidade de fiscalização e consolidando uma política pública permanente de proteção de dados.", "titulo_pt": "ANPD como agência reguladora marca amadurecimento da proteção de dados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 207035, "titulo": "Mercado olha juro longo, estrangeiro e compromisso fiscal para seguir voo", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/mercado-olha-juro-longo-estrangeiro-e-compromisso-fiscal-para-seguir-voo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após o primeiro turno das eleições, o Ibovespa subiu mais de 8% na semana, at
