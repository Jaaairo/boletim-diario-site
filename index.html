<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 01/10/2026 15:30 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "01/10/2026 15:30", "stats": {"noticias_novas": 1014, "resumos_gerados": 255}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A campanha eleitoral para as presidenciais de 2026 tem gerado controvérsias e tensões. Carlos Viana e Superman trocam acusações durante a campanha na direita mineira, com Viana acusando Superman de não defender pautas bolsonaristas, e Superman retrucando que Viana é mentiroso e arrogante. O empresário Leonardo Avalanche desistiu de concorrer à Presidência por motivos técnicos, jurídicos e pessoais. A Polícia Federal abriu 1.224 inquéritos para investigar crimes eleitorais, resultando na apreensão de mais de R$ 33 milhões em bens. O PT manteve seu ato com Lula na Avenida Paulista, apesar de a prefeitura ter criado confusões. A propaganda final de Lula na TV destaca supostas orgias envolvendo Flávio Bolsonaro, beneficiando o senador na disputa. A Abert pediu ao STF que suspenda a proibição das apostas online pelo governo Lula, argumentando que a medida tem motivação eleitoral. A teologia do domínio está ganhando força no Brasil, devido à proximidade das eleições e à aliança da igreja evangélica com o poder político.", "mundo": "O mundo enfrenta diversos desafios e eventos importantes. Primeiramente, as eleições brasileiras em outubro de 2026 se aproximam, com uma disputa acirrada entre Flávio Bolsonaro e Luiz Inácio Lula da Silva, conforme as últimas pesquisas de intenção de voto. Em seguida, a Coreia do Sul conquistou medalhas de ouro nas Assembleias Asiáticas, incluindo no tiro rápido em equipe masculina e no taekwondo poomsae. Além disso, os Estados Unidos, sob a liderança de Donald Trump, se envolvem em várias questões internacionais, como o financiamento de grupos contrários ao Supremo Tribunal Federal brasileiro e a possível liberação de reservas de diesel estratégicas com aliados europeus. Por fim, o presidente ucraniano Volodymyr Zelensky concordou com os termos para cobrir o orçamento de Kiev em 2026, sem oferecer fundos adicionais para a Ucrânia, enquanto o Japão estabeleceu acordos de evacuação com diversos países, incluindo a Alemanha.\n\nA geopolítica global continua marcada por tensões e conflitos, com destaque para a situação na Faixa de Gaza, onde Israel realizou múltiplos ataques, incluindo um ataque a uma escola em Gaza e a principal ponte, levando a uma crescente devastação na região. O número de mortos aumentou, com mais de 100 palestinos enterrados em um funeral coletivo. Além disso, a Rússia destruiu milhões de livros em uma fábrica de impressão na Ucrânia, em um ataque que faz parte de uma série de ataques contra infraestruturas de impressão na Ucrânia. Em outro conflito, a Arábia Saudita acusa os hutitas de terem atacado uma estação de energia em Medina, o que foi negado pela Síria. Na região, o Egito condenou incursões israelenses no Monte do Templo, local sagrado conhecido como Al-Aqsa, em Jerusalém. No cenário internacional, a China realizou seus nonos e décimos lançamentos em setembro, colocando os satélites Guowang e Yaogan-40 em órbita, enquanto o Irã convocou o embaixador britânico em Teerã em relação a acusações falsas sobre um suposto esquema de sabotagem contra uma base aérea britânica.", "economia": "Os juros dos títulos do Reino Unido atingiram o nível mais alto em 25 anos, com taxas de 6%, refletindo a disparada do petróleo e preocupações inflacionárias, pressionando as contas públicas britânicas. Em contraste, a indústria na zona do euro acelerou seu crescimento em setembro, impulsionada por uma demanda resiliente, enquanto o petróleo subiu quase 3% devido a restrições de exportações da China. No Brasil, a atividade industrial se contraiu em setembro, com o PMI mostrando o nível mais baixo em quase três anos e meio, devido à forte diminuição da demanda. Além disso, o dólar avançou 1,20% às 12h51, cotado a R$ 5,235, influenciado por movimentos globais e altas nos rendimentos dos Treasuries. A TotalEnergies anunciou um investimento de US$ 10 bilhões na Argentina para expandir suas operações, enquanto a Accenture registrou uma forte performance de suas ações, subindo 22% em resposta a uma sólida execução de serviços de consultoria. O Banco Central do Brasil eliminou o limite máximo de R$ 500 por transação para o Pix por aproximação a partir desta quinta-feira. Por fim, a indústria na zona do euro acelerou seu crescimento em setembro, atingindo o ritmo mais forte em mais de quatro anos, graças à demanda resiliente que impulsionou novos pedidos e produção a níveis máximos em vários anos, sem que o conflito no Oriente Médio tenha afetado significativamente a situação.", "tecnologia": "A inteligência artificial (IA) está ganhando destaque em diversos setores, com destaque para a China, que está investindo bilhões de dólares para acelerar a inovação de soluções com impacto, em linha com sua estratégia econômica baseada em IA. Em outro desenvolvimento importante, a OpenAI acusa a Moonshot AI, responsável pelo Kimi, de ter participado, ao menos parcialmente, de um ataque de destilação contra o ChatGPT. Além disso, a Microsoft anunciou a saída de Ryan Roslansky, que liderava o Office e Teams, após cerca de 18 anos na empresa, causando uma reorganização de liderança interna. No Brasil, o Shinhan Bank informou que informações pessoais de aproximadamente 25.000 clientes foram expostas devido a um suposto ataque cibernético assistido por IA, destacando a importância de medidas de segurança robustas.", "ciencia": "A NASA e a SpaceX lançaram a missão Crew-13 para a Estação Espacial Internacional, demonstrando a capacidade dos Estados Unidos em voos espaciais com tripulação e a força de suas parcerias comerciais. O projeto Suncatcher da Google está testando a viabilidade de data centers espaciais, enviando quatro processadores de inteligência artificial para a órbita em um foguete da SpaceX. A China está desenvolvendo medicamentos projetados localmente, representando aproximadamente metade da fila de novos produtos globais, o que está causando nervosismo nos Estados Unidos. Além disso, os Prêmios Nobel serão anunciados na próxima segunda-feira, com a primeira premiação sendo o prêmio em Medicina. Estudos científicos abordam diversos temas, incluindo a decifragem dos chamados baixos das trompas de elefantes, a identificação de fatores para infecções recorrentes de vaginose bacteriana, e a alteração do cheiro do petrichor devido ao clima.", "cultura": "O Festival do Rio destaca a nova geração de filmes LGBTQ+ em sua programação, com títulos vencedores de prêmios internacionais sendo exibidos na abertura e encerramento do evento. Em outra notícia cultural, Stevie Wonder celebra o aniversário de 50 anos do álbum 'Songs in the Key of Life' com um novo EP e uma turnê que começará em outubro. Thiaguinho apresenta sua turnê 'Bem Black' em São Paulo, com a participação de diversos artistas. O Festival do Rio também inicia nesta quinta-feira com 359 títulos entre longas, curtas e séries, além do RioMarket, que reúne produtores e investidores para discussões sobre negócios e inovação na indústria audiovisual.", "sociedade": "Um forte paro foi convocado pelos docentes na Província de Buenos Aires após uma professora ser agredida em Trenque Lauquen, levando a uma adesão próxima a 100%. A situação reflete a crescente violência contra professores, com uma pesquisa realizada pela LA NACION em escolas do conurbano baiano mostrando aulas vazias e uma forte adesão à paralisação. Em São Paulo, um bombeiro foi solto após ser preso por matar um estudante de medicina durante uma briga em um local residencial, com a decisão judicial tomada em uma audiência de custódia. No Brasil, novas regras para doação de sangue entraram em vigor, estabelecendo novos prazos para tatuagens, piercings, endoscopia e uso de anabolizantes, afetando os requisitos para a doação de sangue. Além disso, o presidente Lula assinou um parecer que facilita o acesso ao benefício do INSS para vítimas de violência doméstica, permitindo que trabalhadoras afastadas por decisão judicial possam receber o benefício durante o período de proteção sem a necessidade de nova perícia médica.", "meio_ambiente": "O clima continua sendo um assunto de grande preocupação global, com evidências claras de sua deterioração em diversos locais. Em primeiro lugar, o estado da Nova Gales do Sul, na Austrália, aprovou o maior projeto de mineração de carvão da história do estado, o que levou a críticas do ex-ministro e membro do Conselho de Mudanças Climáticas, Matt Kean, que alertou que o problema do clima não é alheio a ninguém. Em segundo lugar, o verão mais quente da história registrou um aumento significativo no número de mortes por calor em países ocidentais da Europa, superando 34.600. Além disso, o mês de outubro no Brasil trouxe temporais no Sudeste e calor intenso de até 40°C no Nordeste. Na Suíça, os glaciares sofreram uma rápida derivação de gelo, com o Glacier Rhône perdendo 5,5% de seu volume, refletindo as ondas de calor e o inverno seco. Estudos indicam que a perda de geleiras na Suíça é de 20% em apenas cinco anos, devido ao efeito de calor das emissões de poluentes de combustíveis fósiles. Estes eventos reforçam a urgência de ações imediatas para combater as mudanças climáticas.", "direitos_humanos": "A Suprema Corte dos Estados Unidos permitiu a execução iminente de Christa Pike, uma mulher condenada há mais de 30 anos à morte no Tennessee, após longas disputas judiciais. Pike, a única mulher na prisão da morte do estado, sobreviveu a duas tentativas de execução por injeção letal, o que levantou dúvidas sobre os procedimentos penitenciários. Em outro caso, a família de Renee Good, uma mulher morta por um oficial de imigração em Minneapolis, acionou a administração Trump em uma ação judicial, acusando os oficiais de imprudência e violações de direitos civis. A situação de Christa Pike e Renee Good reflete os desafios e controvérsias envolvidos no sistema penal e de imigração dos EUA. Além disso, a Corte Suprema sul-coreana anulou a decisão de um escritório de imigração que negou uma revisão completa de um pedido de asilo de um homem africano perseguido por sua orientação sexual, em um caso que destaca a luta por direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 189105, "titulo": "Carlos Viana e Superman trocam ataques em guerra pelo voto da direita em MG", "url": "https://www.metropoles.com/minas-gerais/carlos-viana-e-superman-trocam-ataques-em-guerra-pelo-voto-da-direita-em-mg", "fonte_id": "metropoles", "data_pub": "2026-10-01T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Viana e Superman trocam acusações durante a campanha eleitoral na direita mineira, com Viana acusando Superman de não defender pautas bolsonaristas e Superman retrucando que Viana é mentiroso e arrogante.", "titulo_pt": "Carlos Viana e Superman trocam ataques em guerra pelo voto da direita em minas gerais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 189027, "titulo": "Empresários ligados ao grupo Rockbridge ajudaram Flávio Bolsonaro com relatórios e consultoria, dizem aliados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/empresarios-lig PT ao governo de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 189314, "titulo": "Moraes multa advogado do 8 de janeiro por uso de prompt injection", "url": "https://www.jota.info/stf/do-supremo/moraes-multa-advogado-do-8-de-janeiro-por-uso-de-prompt-injection", "fonte_id": "jota", "data_pub": "2026-10-01T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz Moraes multou um advogado do caso 8 de janeiro por uso de prompt injection. Este mecanismo é usado para inserir comandos ocultos com o intuito de influenciar decisões ou burlar inteligência artificial.", "titulo_pt": "Moraes multa advogado do 8 de janeiro por uso de prompt injection", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 189002, "titulo": "TVs dizem que ação de Lula contra bets tem motivação eleitoral e pedem que STF suspenda proibição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/tvs-dizem-que-acao-de-lula-contra-bets-tem-motivacao-eleitoral-e-pedem-que-stf-suspenda-proibicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Abert pediu ao STF que suspenda a proibição das apostas online pelo governo Lula. A associação argumenta que a medida tem motivação eleitoral e caráter expropriatório.", "titulo_pt": "Associação pede ao STF para suspender proibição de apostas online com motivação eleitoral", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 189029, "titulo": "Leonardo Avalanche desiste de candidatura à Presidência", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/leonardo-avalanche-desiste-de-candidatura-a-presidencia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Leonardo Avalanche, presidente nacional do PRTB, anunciou que desistiu de concorrer à Presidência da República por motivos técnicos, jurídicos e pessoais. Em nota publicada no Instagram, a decisão foi comunicada nesta quinta-feira (1º).", "titulo_pt": "Leonardo Avalanche desiste de candidatura à Presidência", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 189315, "titulo": "Quem são todos os candidatos a governador do Amazonas (AM) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-governador-do-amazonas-am-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-01T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há sete candidatos disputando o cargo de governador do Amazonas nas eleições de 2026. Os candidatos estão concorrendo pelo cargo de governador do estado do Amazonas no pleito deste ano.", "titulo_pt": "Quem são todos os candidatos a governador do Amazonas (AM) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 189316, "titulo": "STF AO VIVO – Aplicação do Estatuto do Idoso em planos de saúde – 1/10/26", "url": "https://www.jota.info/stf/do-supremo/stf-ao-vivo-aplicacao-do-estatuto-do-idoso-em-planos-de-saude-1-10-26", "fonte_id": "jota", "data_pub": "2026-10-01T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal (STF) estão julgando casos relacionados à aplicação do Estatuto do Idoso em planos de saúde, focando em situações onde os planos foram contratados antes da vigência da norma.", "titulo_pt": "STF AO VIVO – Aplicação do Estatuto do Idoso em planos de saúde – 26/10/2023", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 189004, "titulo": "STF nega recurso da Surf Telecom e mantém decisão favorável à indiana Plintron", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/stf-nega-recurso-da-surf-telecom-e-mantem-decisao-favoravel-a-indiana-plintron.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, negou o recurso da Surf Telecom e manteve a decisão favorável à empresa indiana Plintron Mobility, que havia sido condenada a pagar US$ 4,5 milhões.", "titulo_pt": "STF nega recurso da Surf Telecom e mantém vitória da Plintron mobility", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 189005, "titulo": "EMS pede imposto 108% mais alto para canetas emagrecedoras concorrentes que vêm do exterior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/ems-pede-imposto-108-mais-alto-para-canetas-emagrecedoras-concorrentes-que-vem-do-exterior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A EMS, maior farmacêutica do Brasil, está tentando aumentar a alíquota de importação de canetas emagrecedoras importadas em 108%. Essa medida visa beneficiar os produtos da empresa no mercado interno.", "titulo_pt": "EMS pede imposto 218% mais alto para canetas emagrecedoras concorrentes importadas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 189255, "titulo": "Debate da Globo sem Lula: o que pode ajudar ou prejudicar Flávio Bolsonaro?", "url": "https://www.bbc.com/portuguese/articles/c6lyr7002jx4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-01T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Espera-se que Flávio Bolsonaro seja o principal beneficiado pela ausência de Lula no debate, mas também será mais exposto aos ataques dos demais candidatos.", "titulo_pt": "Debate da Globo sem Lula: Flávio Bolsonaro pode ser o principal beneficiado, mas ficará mais exposto", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 189317, "titulo": "Dino considera resolvido, por ora, caso da padroeira e reitera que STF dá a palavra final", "url": "https://www.jota.info/eleicoes/eleicoes-2026/dino-considera-resolvido-por-ora-caso-da-padroeira-e-reitera-que-stf-da-a-palavra-final", "fonte_id": "jota", "data_pub": "2026-10-01T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dino afirma que o caso da padroeira está resolvido, pelo menos por enquanto, e reitera que a palavra final sobre o assunto pertence ao STF. O TSE teria acolhido suas determinações, segundo ele, e a Justiça eleitoral não possui um nível hierárquico equivalente ao do Supremo Tribunal Federal.", "titulo_pt": "Dino considera caso da padroeira resolvido, por ora, e reitera que STF dá a palavra final", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 189364, "titulo": "UK-Iranian Man Arrested in Connection to RAF Fairford Air Base Incident", "url": "https://www.nytimes.com/2026/10/01/world/europe/uk-iran-terrorism-raf-fairford.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cidadão britânico-iraniano de 27 anos foi detido pela polícia britânica na quinta-feira. Oficiais britânicos acreditam que a Irã esteve envolvida no planejamento do incidente envolvendo a Base Aérea Royal Air Force de Fairford.", "titulo_pt": "Britânico-irânio de 27 anos detido em conexão ao incidente na Base aérea RAF Fairford", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 189588, "titulo": "Latvians head to the polls with Russia on their minds", "url": "https://www.dw.com/en/latvians-head-to-the-polls-with-russia-on-their-minds/a-79477614?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-01T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os eleitores letões irão votar para escolher um novo parlamento em 3 de outubro, com a Rússia sendo um tema central das campanhas. Os medos de segurança dominam o debate, mas há também uma discussão sobre os custos econômicos de se distanciar da Rússia.", "titulo_pt": "Letões irão às urnas com a Rússia no horizonte", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 189679, "titulo": "Merz ai minimi storici, solo il 10% è soddisfatto del cancelliere", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/01/merz-ai-minimi-storici-solo-il-10-e-soddisfatto-del-cancelliere_cba8c216-a361-42df-9043-85e41a095c4e.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-01T17:56:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O cancelliere (chanceler) teve um mês complicado de setembro devido às batatas eleitorais. Apenas 10% dos minimi storici (pequenos historiadores) estão satisfeitos com seu desempenho.", "titulo_pt": "Merz não agrada aos pequenos historiadores, apenas 10% estão satisfeitos com o chanceler", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 189379, "titulo": "U.S. Bond Yields Hit Highest Level Since 2002", "url": "https://www.nytimes.com/2026/10/01/business/bond-yields-10-year-treasury.html", "fonte_id": "nyt_world", "data_pub": "2026-10-01T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das obrigações dos Estados Unidos atingiram o nível mais alto desde 2002, pressionando os consumidores e empresas emprestadoras e pesando cada vez mais em certas partes do mercado de ações. Essa situação não deve se dissipar em breve.", "titulo_pt": "Rendimentos de títulos dos EUA chegam ao maior nível desde 2002", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 189213, "titulo": "Trump diz acompanhar “muito de perto” a eleição brasileira: “País muito importante”", "url": "https://www.infomoney.com.br/mundo/trump-diz-acompanhar-muito-de-perto-a-eleicao-brasileira-pais-muito-importante/", "fonte_id": "infomoney", "data_pub": "2026-10-01T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou estar acompanhando de perto as eleições brasileiras e destacou a importância do país. Ele considerou o Brasil como um ótimo país e suas pessoas como fantásticas.", "titulo_pt": "Trump acompanha de perto as eleições brasileiras: 'país muito importante'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 189028, "titulo": "Trump diz que acompanha as eleições do Brasil 'de perto' e que pleito é 'muito importante'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/trump-diz-que-acompanha-as-eleicoes-do-brasil-de-perto-e-que-pleito-e-muito-importante.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que acompanha de perto as eleições brasileiras e que o pleito é muito importante. Ele foi questionado por uma repórter na Casa Branca sobre o assunto.", "titulo_pt": "Trump diz acompanhar as eleições brasileiras de perto e considera pleito importante", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 189155, "titulo": "EUA financiaram R$ 5 milhões em projeto que contesta atuação do STF no Brasil, diz jornal", "url": "https://www.brasildefato.com.br/2026/10/01/eua-financiaram-r-5-milhoes-em-projeto-que-contesta-atuacao-do-stf-no-brasil-diz-jornal-2/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-01T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos, sob a presidência de Donald Trump, destinou US$ 1 milhão (equivalente a R$ 5,2 milhões) a um projeto que visa financiar organizações que contestem a atuação do Supremo Tribunal Federal no Brasil. Este projeto, chamado de 'Combatendo o lawfare e a censura no Brasil', foi revelado pelo jornal britânico The Guardian.", "titulo_pt": "EUA financiaram R$ 5,2 milhões em projeto que contesta atuação do STF no Brasil, diz jornal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 189279, "titulo": "Elecciones Brasil 2026, EN VIVO: Lula vs. Bolsonaro Jr. y las últimas noticias hoy", "url": "https://www.lanacion.com.ar/el-mundo/elecciones-brasil-2026-en-vivo-lula-vs-bolsonaro-jr-y-las-ultimas-noticias-hoy-nid01102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T17:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os últimos pesquisas de intenção de voto indicam uma disputa acirrada entre Flávio Bolsonaro e Luiz Inácio 'Lula' da Silva. As eleições ocorrerão no dia 4 de outubro.", "titulo_pt": "Eleições Brasil 2026, ao VIVO: lula vs. Bolsonaro Jr. E as últimas notícias hoje", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 189622, "titulo": "Despite praise and White House visits, Trump avoids endorsing Netanyahu", "url": "https://www.aljazeera.com/news/2026/10/1/despite-praise-and-white-house-visits-trump-avoids-endorsing-netanyahu?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma entrevista ao Time, Trump evita endossar diretamente Netanyahu, mas defende-o em relação a supostas advertências em outubro.", "titulo_pt": "Embora com elogios e visitas à casa branca, Trump evita endossar Netanyahu", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 189678, "titulo": "British-Iranian man arrested under terror laws over RAF Fairford incident", "url": "https://www.ft.com/content/a85c5d06-5f8d-4163-8cd6-e42df9f137cb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um britânico iraniano foi detido sob leis de terrorismo em relação ao incidente envolvendo o RAF Fairford. Andy Burnham afirmou que há fortes ind idade de liberar estoques de diesel de emergência com aliados europeus após ameaças de Donald Trump de cortar as importações americanas do combustível. As discussões incluíram chamadas com representantes da Comissão Europeia e países como Alemanha, França, Itália e Irlanda.", "titulo_pt": "Reino unido em conversas com aliados europeus sobre liberação de estoques de diesel de emergência", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 189649, "titulo": "Saudi-led coalition claims Houthis targeted power station in Medina", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/saudi-led-coalition-claims-houthis-targeted-power-station-medina", "fonte_id": "middle_east_eye", "data_pub": "2026-10-01T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A coalisão liderada por Arábia Saudita afirmou que os hutitas atacaram uma estação de energia em Medina com um drone, danificando um transformador, mas não interrompendo o sistema elétrico geral. Medina é uma das cidades sagradas do Islã.", "titulo_pt": "Coalisão saudita afirma que hutitas atacaram estação de energia em Medina", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 189628, "titulo": "Chinese hackers impersonated AI experts to target US policy minds", "url": "https://www.aljazeera.com/economy/2026/10/1/chinese-hackers-impersonated-ai-experts-to-target-us-policy-minds?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hackers associados ao grupo TA419 se passaram por especialistas em inteligência artificial para enganar figuras importantes na política dos EUA. Eles imitaram uma ex-oficial do White House especializada em AI.", "titulo_pt": "Hackers chineses se passaram por especialistas em IA para alvos americanos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 189030, "titulo": "Governo Trump quer enviar US$ 1 milhão para financiar grupos contrários ao STF, diz jornal britânico", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/governo-trump-quer-enviar-us-1-milhao-para-financiar-grupos-contrarios-ao-stf-diz-jornal-britanico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T16:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump planeja destinar US$ 1 milhão a grupos contrários ao STF sob a acusação de que a Corte extrapola as atribuições judiciais e impõe censura no Brasil. Segundo a reportagem do The Guardian, o objetivo seria financiar organizações que se opõem à Corte Supremo Federal brasileira.", "titulo_pt": "Governo Trump planeja enviar US$ 1 milhão para grupos contrários ao STF, diz jornal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 189215, "titulo": "Reino Unido atinge juros de 6% em títulos e revive temor da crise do euro", "url": "https://www.infomoney.com.br/mercados/reino-unido-atinge-juros-de-6-em-titulos-e-revive-temor-da-crise-do-euro/", "fonte_id": "infomoney", "data_pub": "2026-10-01T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os juros dos títulos do Reino Unido atingiram 6%, o maior nível desde 1998, devido à disparada do petróleo e aos temores de uma nova onda inflacionária. Este aumento pressiona as contas públicas e o governo britânico.", "titulo_pt": "Reino Unido atinge juros de 6% em títulos e reaviva temor de nova crise do euro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 189003, "titulo": "TotalEnergies anuncia investimento de US$ 10 bi na Argentina", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/totalenergies-anuncia-investimento-de-us-10-bi-na-argentina.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T17:15:00Z", "idioma": "pt", "provavel "the_verge", "data_pub": "2026-10-01T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ryan Roslansky, que recentemente era o chefe de Office e de Teams na Microsoft, está deixando a empresa após cerca de 18 anos no LinkedIn e na Microsoft. Sua saída está causando uma reorganização de liderança interna na Microsoft.", "titulo_pt": "Chefe de Office e Teams da microsoft está deixando a empresa", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 189761, "titulo": "Hong Kong invests billions to accelerate innovation of impactful solutions as an AI-powered future comes into focus", "url": "https://www.scmp.com/presented/news/hong-kong/topics/impactful-aiss-approved-projects/article/3369190/hong-kong-invests-billions-accelerate-innovation-impactful-solutions-ai-powered-future-comes-focus?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-01T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hong Kong está investindo bilhões de dólares para acelerar a inovação de soluções com impacto, em consonância com a estratégia econômica baseada em inteligência artificial. Sob o programa AI+, apoiado pelo Plano Quinquenal de Desenvolvimento Econômico e Social da SAR (2026-2030), a cidade está intensificando a integração da IA em diversos setores, incluindo serviços públicos, pesquisa científica, saúde, finanças e outros.", "titulo_pt": "Hong Kong investe bilhões para acelerar inovação de soluções com impacto com a chegada da era da inteligência artificial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 189783, "titulo": "Inside Microsoft’s big Copilot rethink", "url": "https://www.theverge.com/tech/1003365/microsoft-copilot-os-for-work-notepad", "fonte_id": "the_verge", "data_pub": "2026-10-01T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Satya Nadella, CEO da Microsoft, realizou uma reunião privada com líderes de clientes corporativos chave para apresentar artidário, contendo apenas algumas boas ideias.", "titulo_pt": "Pete Hegseth, homem de ideias", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 189015, "titulo": "Como a Meta usa data centers de IA para reduzir bilhões em impostos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/como-a-meta-usa-data-centers-de-ia-para-reduzir-bilhoes-em-impostos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T14:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mark Zuckerberg afirmou que os investimentos da Meta em inteligência artificial estão acelerando todas as principais áreas do negócio da empresa. Ele destaca que esses investimentos geram confiança tanto no trabalho interno quanto na indústria em geral.", "titulo_pt": "Como a Meta usa inteligência artificial para acelerar seu negócio e gerar confiança", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 189785, "titulo": "OpenAI’s new agent is a shot at Meta — but can it compete with free?", "url": "https://www.theverge.com/ai-artificial-intelligence/1003399/meta-openai-ai-agents-muse-dots-battle", "fonte_id": "the_verge", "data_pub": "2026-10-01T14:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na conferência DevDay da OpenAI, a empresa apresentou o agente Dots, um sistema de inteligência artificial baseado no GPT-6 Astra, em uma tentativa de concorrer com o sucesso inicial do agente Muse da Meta.", "titulo_pt": "Novo agente da openai compete com a Meta, mas como é a comparação?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 189583, "titulo": "Walmart is using light-up digital shelf labels to help shoppers and employees find items", "url": "https://www.cnbc.com/2026/10/01/walmart-digital-shelf-label-tools.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-01T13:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Walmart está implementando rótulos de prateleira iluminados conectados à sua aplicativo para auxiliar os clientes a localizarem melhor os itens que procuram. Além disso, esse recurso também ajuda os funcionários.", "titulo_pt": "Walmart usa rótulos de prateleira iluminados para auxiliar clientes e funcionários", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 189210, "titulo": "Agentes de IA já consomem 5 vezes mais tokens que humanos, aponta OpenRouter", "url": "https://exame.com/inteligencia-artificial/agentes-de-ia-ja-consomem-5-vezes-mais-tokens-que-humanos-aponta-openrouter/", "fonte_id": "exame", "data_pub": "2026-10-01T13:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes de inteligência artificial já consomem cinco vezes mais tokens que humanos, segundo dados da OpenRouter. Apesar do maior volume de consultas, o aumento não resulta em um crescimento proporcional nos custos.", "titulo_pt": "Agentes de IA já consomem 5 vezes mais tokens que humanos, aponta OpenRouter", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 189892, "titulo": "Amazon Kindle, Paperwhite, and Colorsoft 2026: Specs, Price, Release Date", "url": "https://www.wired.com/story/amazon-kindle-paperwhite-colorsoft-2026-refresh/", "fonte_id": "wired", "data_pub": "2026-10-01T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em comemoração ao 20º aniversário do Kindle, a Amazon está renovando sua linha de leitores digitais com novas cores, acabamento em alumínio e um novo design de moldura mais fino e leve.", "titulo_pt": "Kindle, Paperwhite e Colorsoft 2026: novidades em design e cor", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 189021, "titulo": "Agentes de IA tentam invadir sites de governos dos Estados Unidos e Canadá", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/agentes-de-ia-tentam-invadir-sites-de-governos-dos-estados-unidos-e-canada.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T12:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes de inteligência artificial da OpenAI tentaram invadir órgãos do governo dos Estados Unidos, sites de empresas e de organizações sem fins lucrativos. Um site do governo do Canadá também foi alvo de ataque, mas não há comprovação de que a tentativa tenha sido feita por agentes da OpenAI.", "titulo_pt": "Agentes de IA tentam invadir sites de governos dos EUA e Canadá", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 189853, "titulo": "Top journal’s special issue on women’s health casts spotlight on menopause and pain", "url": "https://www.statnews.com/2026/10/01/womens-health-issues-academic-journal-science-special-edition/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um número especial de uma prestigiada revista científica sobre saúde feminina destaca questões abertas e examina as últimas descobertas sobre dor crônica e menopausa.", "titulo_pt": "Número especial de revista destaca questões sobre menopausa e dor", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 189120, "titulo": "Cientistas conectam 3 minicérebros e registram resposta a estímulos", "url": "https://www.metropoles.com/saude/cientistas-conectam-3-minicerebros-e-registram-resposta-a-estimulos", "fonte_id": "metropoles", "data_pub": "2026-10-01T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas conectaram três minicérebros humanos e registraram a capacidade dessas redes de diferenciar sinais após estímulos repetidos. O experimento demonstrou que as redes formadas por essas estruturas podem responder de forma distinta a estímulos repetidos.", "titulo_pt": "Cientistas conectam 3 minicérebros humanos e registram resposta a estímulos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 189854, "titulo": "Mistrust in science and a juicy gene-editing lawsuit", "url": "https://www.statnews.com/2026/10/01/readout-loud-podcast-trust-in-science-gene-editing-lawsuit/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos americanos perderam confiança na ciência. Um novo processo judicial relacionado a edição genética está sendo discutido no episódio desta semana do podcast 'The Readout LOUD'.", "titulo_pt": "Perda de confiança na ciência e novo processo judicial sobre edição genética", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 189855, "titulo": "As CDC redesigns annual health survey, it removes questions about disabilities", "url": "https://www.statnews.com/2026/10/01/cdc-health-survey-redesign-removes-questions-about-disabilities/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As alterações propostas no questionário de saúde federal dos Estados Unidos podem subestimar o número de americanos com deficiências, according to advocates. A CDC está reformulando seu questionário anual de saúde, removendo perguntas sobre deficiências.", "titulo_pt": "CDC reformula questionário anual de saúde e remove perguntas sobre deficiências", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 189889, "titulo": "NASA’s SpaceX Crew-13 Launches to International Space Station", "url": "https://www.nasa.gov/news-release/nasas-spacex-crew-13-launches-to-international-space-station/", "fonte_id": "nasa_news", "data_pub": "2026-10-01T15:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tripulante da missão Crew-13 da NASA e SpaceX decolou às 11:10 da manhã de quinta-feira, do Complexo de Lançamento 40 no Cabo Canaveral, Flórida, em direção à Estação Espacial Internacional para uma expedição científica. A missão demonstra a capacidade inigualável dos Estados Unidos em voos espaciais com tripulação e a força de suas parcerias comerciais.", "titulo_pt": "Nasa’s SpaceX Crew-13 Launches to International Space Station (missão Crew-13 da nasa e SpaceX decolou para a estação espacial internacional)", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 189880, "titulo": "Google tests its plan for AI data centers in space with Project Suncatcher", "url": "https://www.scientificamerican.com/article/google-tests-plan-for-ai-data-centers-in-space-project-suncatcher/", "fonte_id": "scientific_american", "data_pub": "2026-10-01T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto Suncatcher da Google está enviando quatro processadores de inteligência artificial para a órbita em um foguete SpaceX para testar a viabilidade de data centers espaciais. Os testes visam verificar se os componentes de um data center podem sobreviver no espaço.", "titulo_pt": "Google testa seu plano de data centers espaciais com o projeto Suncatcher", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 189873, "titulo": "Here’s how brain-eating amoebas may infect people", "url": "https://www.sciencenews.org/article/brain-eating-amoebas-naegleria-fowleri", "fonte_id": "science_news", "data_pub": "2026-10-01T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As habilidades de exploração e o comportamento de arranhão das amebas Naegleria podem explicar como as espécies que infectam o cérebro viajam para dentro dos cérebros humanos.", "titulo_pt": "Como as amebas que comem cérebro podem infectar as pessoas", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 189856, "titulo": "STAT+: A journey to witness China’s biotech boom up close", "url": "https://www.statnews.com/2026/10/01/biotech-news-journey-to-witness-chinas-biotech-boom-up-close/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T15:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China desenvolveu medicamentos projetados localmente que representam aproximadamente metade da fila de novos produtos globais. Um repórter da STAT, Jason Mast, viajou para Shanghai para observar de perto essa concorrência que está causando nervosismo nos Estados Unidos.", "titulo_pt": "Viagem para testemunhar a explosão da biotecnologia chinesa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 189885, "titulo": "World Space Week 2026 Celebrates the “Rocket Revolution”", "url": "https://spacenews.com/world-space-week-2026-celebrates-the-rocket-revolution/", "fonte_id": "spacenews", "data_pub": "2026-10-01T15:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A World Space Week em 2026 celebra a 'Revolução dos Foguetes', com eventos iniciando em 4 de outubro em 100 países. Os eventos marcam como a inovação nos lançamentos tem estimulado a economia espacial em crescimento e permitido novas aplicações.", "titulo_pt": "World Space Week 2026 comemora a 'revolução dos foguetes'", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 189000, "titulo": "Matemática não é apenas um jogo para deixarmos a IA resolver e a história mostra por quê", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/matematica-nao-e-apenas-um-jogo-para-deixarmos-a-ia-resolver-e-a-historia-mostra-por-que.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-01T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neste ano, modelos de inteligência artificial têm resolvido problemas abertos em matemática de forma eficiente. A história destaca a importância da matemática não ser apenas deixada para a IA resolver.", "titulo_pt": "Matemática não é apenas um jogo para deixarmos a IA resolver e a história mostra por quê", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 189437, "titulo": "Underlying causes of recurrent bacterial vaginosis identified by Australian scientists", "url": "https://www.theguardian.com/australia-news/2026/oct/02/underlying-causes-of-recurrent-bacterial-vaginosis-identified-by-australian-scientists", "fonte_id": "guardian_world", "data_pub": "2026-10-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australianos identificaram dois fatores que contribuem para as infecções recorrentes de vaginose bacteriana, uma condição sexual comum que afeta cerca de uma em quatro mulheres globalmente. A condição, frequentemente chamada de vaginose bacteriana, é caracterizada por uma desequilíbrio de bactérias naturais no útero, com uma redução das bactérias benéficas e um crescimento excessivo de outras bactérias mistas.", "titulo_pt": "Causas subjacentes da vaginose bacteriana recorrente identificadas por cientistas australianos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 189881, "titulo": "Scientists are decoding elephant rumble calls, including ‘greetings’ and ‘coos’", "url": "https://www.scientificamerican.com/article/scientists-are-decoding-elephant-rumble-calls-including-greetings-and-coos/", "fonte_id": "scientific_american", "data_pub": "2026-10-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estão decifrando os chamados baixos das elefantes, incluindo 'cumprimentos' e 'coos'. Eles estão investigando por que as elefantes fazem esses sons e o que eles podem significar.", "titulo_pt": "Cientistas estão decifrando os gemidos das elefantes, incluindo ‘cumprimentos’ e ‘coos’", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 189886, "titulo": "Rethinking risk with electronics for space", "url": "https://spacenews.com/rethinking-risk-with-electronics-for-space/", "fonte_id": "spacenews", "data_pub": "2026-10-01T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike G inta-feira (1°/10) e acabou atingindo ambos os suspeitos com tiros.", "titulo_pt": "Policial civil interviu em tentativa de roubo e atingiu suspeitos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 189145, "titulo": "Justiça manda soltar bombeiro preso por matar estudante após briga em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/justica-manda-soltar-bombeiro-preso-por-matar-estudante-apos-briga-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bombeiro de 23 anos foi solto após ser preso por matar um estudante de medicina durante uma briga em São Paulo. A decisão judicial foi tomada em uma audiência de custódia.", "titulo_pt": "Justiça libera bombeiro preso por matar estudante em briga em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 189357, "titulo": "Sigue lo que fue desarrollo de la marcha convocada por la Confech", "url": "https://www.latercera.com/nacional/noticia/en-vivo-marcha-estudiantes-confech-incidentes/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Estudantes, junto com sindicatos de trabalhadores, estão marchando pela Alameda sob a bandeira “Nenhum real a menos para a educação”. A marcha foi convocada pela Confech.", "titulo_pt": "Segue o desenvolvimento da marcha convocada pela Confech", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189349, "titulo": "Fiscal judicial que llevó el sumario de Yáber: “Nadie está dispuesto a asumir el costo de denunciar esta práctica corrupta”", "url": "https://www.latercera.com/nacional/noticia/fiscal-judicial-que-llevo-el-sumario-de-yaber-nadie-esta-dispuesto-a-asumir-el-costo-de-denunciar-esta-practica-corrupta/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A juíza Carla Troncoso, de San Miguel, testificou sobre a prática corrupta de contratar familiares de magistrados em notarías e conservadorias. Segundo ela, essa situação é tolerada por todos envolvidos no sistema.", "titulo_pt": "Juíza revela prática corrupta de contratação de familiares de magistrados em notarías", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189355, "titulo": "Presupuesto Mineduc 2027: sin nuevos Liceos Bicentenario, recorte a universidades y prioridad en jardines infantiles", "url": "https://www.latercera.com/nacional/noticia/presupuesto-mineduc-2027-sin-nuevos-liceos-bicentenario-recorte-a-universidades-y-prioridad-en-jardines-infantiles/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei para o orçamento de 2027 da Educação não inclui novos Liceus Bicentenários, cancela um programa que fornecia computadores através da Junaeb e condiciona as avaliações nacionais e internacionais à disponibilidade orçamentária.", "titulo_pt": "Orçamento Mineduc 2027: sem novos liceus bicentenários, cancelamento de programa de computadores e prioridade para jardins infantis", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189875, "titulo": "Countries in the Americas can accelerate disease elimination through leadership, investment and partnerships", "url": "https://www.paho.org/en/news/1-10-2026-countries-americas-can-accelerate-disease-elimination-through-leadership-investment", "fonte_id": "paho", "data_pub": "2026-10-01T15:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países da América podem acelerar a eliminação de doenças através de liderança, investimento e parcerias.", "titulo_pt": "Países da américa podem acelerar a eliminação de doenças através de liderança, investimento e parcerias", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 189350, "titulo": "David Bravo dijo que crisis de empleo es “autoinflingida” y apunta a las 40 Horas, salario mínimo y reforma de pensiones", "url": "https://www.latercera.com/pulso/noticia/david-bravo-dijo-que-crisis-de-empleo-es-una-herida-autoinflingida-y-apunta-a-las-40-horas-salario-minimo-y-reforma-de-pensiones/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T15:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O economista UC, David Bravo, afirmou que a crise de emprego é 'autoinfligida' e aponta para as medidas de 40 horas semanais, salário mínimo e reforma das pensiones. Ele considera que as medidas adotadas pelo governo Gabriel Boric não são negativas por si mesmas, mas foram implementadas em um momento de 'emergência laboral'.", "titulo_pt": "David Bravo diz que crise de emprego é 'autoinfligida' e aponta para medidas de 40 Horas, salário mínimo e reforma de pensiones", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189356, "titulo": "Registran los primeros incidentes en marcha convocada por la Confech", "url": "https://www.latercera.com/nacional/noticia/registran-los-primeros-incidentes-en-marcha-convocada-por-la-confech/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T14:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Houve incidentes durante uma manifestação convocada pela Confech, que resultaram no fechamento da estação de metrô Universidad Católica em Santiago.", "titulo_pt": "Registram-se os primeiros incidentes na marcha convocada pela Confech", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189191, "titulo": "Novas regras para doação de sangue entram em vigor no Brasil; veja o que muda", "url": "https://exame.com/brasil/novas-regras-para-doacao-de-sangue-veja-o-que-muda-a-partir-de-hoje/", "fonte_id": "exame", "data_pub": "2026-10-01T14:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As novas regras para doação de sangue no Brasil estabelecem novos prazos para tatuagens, piercings, endoscopia e uso de anabolizantes. Essas mudanças entram em vigor e afetam os requisitos para a doação de sangue.", "titulo_pt": "Novas regras para doação de sangue entram em vigor no Brasil; veja o que muda", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 189200, "titulo": "Lula assina parecer que facilita benefício do INSS para vítima de violência doméstica", "url": "https://exame.com/brasil/lula-assina-parecer-que-facilita-beneficio-do-inss-para-vitima-de-violencia-domestica/", "fonte_id": "exame", "data_pub": "2026-10-01T13:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula assinou um parecer que facilita o acesso ao benefício do INSS para vítimas de violência doméstica. Trabalhadoras afastadas por decisão judicial podem receber o benefício durante o período de proteção sem a necessidade de nova perícia.", "titulo_pt": "Lula assina parecer que simplifica acesso ao benefício do INSS para vítimas de violência doméstica", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 189439, "titulo": "Matt Kean warns climate crisis ‘isn’t someone else’s problem’ as largest coal project in NSW history greenlit", "url": "https://www.theguardian.com/australia-news/2026/oct/02/hunter-valley-operations-coal-mine-extension-nsw", "fonte_id": "guardian_world", "data_pub": "2026-10-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matt Kean, chair do Conselho de Mudanças Climáticas, criticou a aprovação do maior projeto de mineração de carvão da história do estado da Nova Gales do Sul, argumentando que o clima não é problema alheio. Ele questionou por que a Comissão Independente de Avaliação de Planejamento não levou em conta os danos econômicos relacionados ao clima no estado.", "titulo_pt": "Matt Kean alerta: crise climática ‘não é problema alheio’ enquanto maior projeto de carvão da história da nova gales do sul é aprovado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 189690, "titulo": "Heat deaths in Western Europe top 34,600 during hottest summer on record", "url": "https://www.japantimes.co.jp/environment/2026/10/01/climate-change/heat-deaths-western-europe/", "fonte_id": "japan_times", "data_pub": "2026-10-01T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortes por calor em países ocidentais da Europa superou 34.600 durante o verão mais quente da história registrada.", "titulo_pt": "Mortes por calor superam 34.600 na Europa ocidental durante verão mais quente", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188368, "titulo": "Clima: outubro começa com temporais no Sudeste e calor de 40ºC no Nordeste", "url": "https://www.metropoles.com/brasil/clima-outubro-comeca-com-temporais-no-sudeste-e-calor-de-40oc-no-nordeste", "fonte_id": "metropoles", "data_pub": "2026-10-01T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de outubro, o Sudeste enfrenta temporais, enquanto o Nordeste experimenta temperaturas elevadas chegando a 40°C. No Sul, a frente fria continua trazendo chuvas intensas no Paraná e no leste de Santa Catarina.", "titulo_pt": "Clima: outubro começa com temporais no Sudeste e calor de 40°c no Nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188706, "titulo": "Swiss glaciers lose 5.5% of ice in second-largest melt on record", "url": "https://www.euronews.com/video/2026/10/01/swiss-glaciers-lose-55-of-ice-in-second-largest-melt-on-record", "fonte_id": "euronews", "data_pub": "2026-10-01T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas suíços relatam uma perda rápida de gelo no Glacier Rhône, devido a ondas de calor e um inverno seco, resultando na segunda maior derivação de gelo na história da Suíça.", "titulo_pt": "Suíça registra perda de 5,5% de gelo no glacier rhône, maior derretimento em duas décadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 188755, "titulo": "‘Catastrophic year’ as Swiss glaciers lose 5% of ice after heatwaves", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/1/catastrophic-year-as-swiss-glaciers-lose-5-of-ice-after-heatwaves?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas alertam que os gelos suíços perderam uma quantidade 'enorme' de gelo este ano. Isso ocorreu devido a ondas de calor.", "titulo_pt": "Ano catastrófico", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 188580, "titulo": "‘Explosion of melt rates’: 20% of Swiss glaciers lost in five years", "url": "https://www.theguardian.com/environment/2026/oct/01/switzerland-glacier-loss-fossil-fuel-pollution-europe", "fonte_id": "guardian_world", "data_pub": "2026-10-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suíça perdeu aproximadamente 20% de sua geleira em apenas cinco anos devido ao efeito de calor das emissões de poluentes de combustíveis fósseis. Em 2026, as geleiras suíças diminuíram 5,5% nos primeiros oito meses, após um verão de ondas de calor extremas que seguiram um inverno com pouca neve.", "titulo_pt": "Explodo de taxas de derretimento: Suíça perde 20% de suas geleiras em cinco anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 188107, "titulo": "People over AI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/01/2003865165", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância das pessoas em relação à inteligência artificial, enfatizando que os seres humanos devem ter prioridade sobre o desenvolvimento avançado de tecnologias de IA. O título 'People over AI' foi traduzido para 'Pessoas acima da IA' em português brasileiro.", "titulo_pt": "Pessoas acima da IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 189554, "titulo": "Renee Good's family sues US government over her killing in Minneapolis", "url": "https://www.lemonde.fr/en/international/article/2026/10/01/renee-good-s-family-sues-us-government-over-her-killing-in-minneapolis_6758148_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Renee Good, uma mulher de 37 anos, foi morta por um oficial de imigração durante uma operação federal em Minneapolis em janeiro.", "titulo_pt": "Família de renee Good processa governo dos EUA por seu assassinato em Minneapolis", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 189111, "titulo": "Tennessee suspende execuções após mulher sobreviver pena de morte", "url": "https://www.metropoles.com/mundo/tennessee-suspende-execucoes-apos-mulher-sobreviver-pena-de-morte", "fonte_id": "metropoles", "data_pub": "2026-10-01T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, uma mulher de 50 anos, sobreviveu à aplicação de duas injeções letais na execução capital em Tennessee. O estado de saúde atual dela não foi divulgado.", "titulo_pt": "Tennessee suspende execuções após mulher sobreviver à pena de morte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 189621, "titulo": "Renee Good’s family sues Trump administration over fatal ICE shooting", "url": "https://www.aljazeera.com/news/2026/10/1/renee-goods-family-sues-trump-administration-over-fatal-ice-shooting?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T17:28:00Z", "idioma": "en", "provavel_duplicata_de": 189593, "texto_pt": "A família de Renee Good acionou a administração Trump em uma ação judicial, acusando oficiais do governo de imprudência e violações de direitos civis relacionadas ao tiroteio fatal que levou à morte de Renee em Minneapolis.", "titulo_pt": "Família de renee Good processa administração Trump por tiroteio fatal envolvendo ICE em minneapolis", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 189288, "titulo": "Confirmado por la Corte Suprema: qué puede cambiar para un migrante con orden de deportación en EE.UU.", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/confirmado-por-la-corte-suprema-que-puede-cambiar-para-un-migrante-con-orden-de-deportacion-en-eeuu-nid01102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T17:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema confirmou uma decisão que pode alterar o processo de deportação para imigrantes com ordens de expulsão nos Estados Unidos. O impacto do julgamento e os grupos afetados ainda estão sendo definidos.", "titulo_pt": "Confirmado pela Corte Suprema: como a decisão sobre deportações rápidas pode mudar o destino de imigrantes com ordens de expulsão nos EUA", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 189359, "titulo": "Christa Pike sobrevive a dos inyecciones letales: Las interrogantes que desata la fallida ejecución de condenada en Tennessee", "url": "https://www.latercera.com/mundo/noticia/christa-pike-sobrevive-a-dos-inyecciones-letales-las-interrogantes-que-desata-la-fallida-ejecucion-de-condenada-en-tennessee/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 50 anos, condenada à morte por um assassinato cometido aos 18 anos, sobreviveu a duas injeções letais aplicadas em Tennessee. Após o procedimento, seu coração ainda estava batendo e ela foi levada ao hospital.", "titulo_pt": "Christa Pike sobrevive a duas injeções letais: perguntas levantadas pela falha na execução de condenada em Tennessee", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189633, "titulo": "Moroccan intelligence uses surveillance to ‘silence’ journalists: Amnesty", "url": "https:
