iculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 164458, "titulo": "Japão ultrapassa pela primeira vez 100 mil pessoas com 100 anos ou mais: o que há por trás dessa longevidade", "url": "https://www.bbc.com/portuguese/articles/c8p30716yw9wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-15T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão ultrapassou pela primeira vez a marca de 100 mil pessoas com 100 anos ou mais. Dos centenários, 88% são mulheres, refletindo uma tendência de contínuo envelhecimento e diminuição da população do país.", "titulo_pt": "Japão atinge marca de 100 mil pessoas com 100 anos ou mais: 88% são mulheres", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 164293, "titulo": "Pela primeira vez, Japão tem mais de 100.000 pessoas com mais de 100 anos", "url": "https://veja.abril.com.br/mundo/pela-primeira-vez-japao-tem-mais-de-100-000-pessoas-com-mais-de-100-anos/", "fonte_id": "veja", "data_pub": "2026-09-15T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão tem agora mais de 100.000 pessoas com mais de 100 anos, o que resulta em escassez de trabalhadores, aumentos nos custos da Previdência Social e uma diminuição na base tributária.", "titulo_pt": "Pela primeira vez, Japão tem mais de 100.000 pessoas com mais de 100 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 163293, "titulo": "Alagado há 4 dias, Jd. Pantanal se mobiliza para distribuir água e comida", "url": "https://www.metropoles.com/sao-paulo/alagado-jd-pantanal-agua-e-comida", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região do Jardim Pantanal, localizada na várzea do Rio Tietê, está alagada há quatro dias, desde que choveu intensamente em São Paulo a partir do sábado, 12 de setembro. A comunidade está se mobilizando para distribuir água e alimentos.", "titulo_pt": "Alagado há 4 dias, Jd. Pantanal se mobiliza para distribuir água e comida", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 164346, "titulo": "Escolhendo faculdade? Esse dado pode pesar mais que o teste vocacional", "url": "https://exame.com/carreira/escolhendo-faculdade-esse-dado-pode-pesar-mais-que-o-teste-vocacional/", "fonte_id": "exame", "data_pub": "2026-09-15T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados do Inep e do mercado de trabalho são importantes para entender os fatores que influenciam a escolha do curso além da vocação. O título traduzido é: Escolhendo faculdade? Dados do Inep e do mercado de trabalho podem pesar mais que o teste vocacional.", "titulo_pt": "Escolhendo faculdade? Dados do inep e do mercado de trabalho podem pesar mais que o teste vocacional", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 163377, "titulo": "Grupo é denunciado por crimes violentos em destinos turísticos da Bahia", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ba/grupo-e-denunciado-por-crimes-violentos-em-destinos-turisticos-da-bahia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público investiga a atuação de tráfico e lavagem de dinheiro com estruturas bem definidas em Porto Seguro e região. Um grupo foi denunciado por crimes violentos em destinos turísticos da Bahia.", "titulo_pt": "Grupo é denunciado por crimes violentos em destinos turísticos da Bahia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163379, "titulo": "PMs acusados de matar sargento em quartel são julgados hoje (15) em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/pms-acusados-de-matar-sargento-em-quartel-sao-julgados-hoje-15-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os policiais militares envolvidos na morte do sargento em um quartel em 2023, após uma discussão por escala de serviço, serão julgados hoje em São Paulo. O capitão e o cabo são acusados de homicídio qualificado e fraude processual.", "titulo_pt": "Pms acusados de matar sargento em quartel são julgados hoje em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163183, "titulo": "Saúde no Brasil desperdiça até R$ 360 bilhões por ano, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/saude-no-brasil-desperdica-ate-r-360-bilhoes-por-ano-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de saúde brasileiro desperdiça entre R$ 240 bilhões e R$ 360 bilhões por ano, de acordo com um estudo elaborado pela Fesaúde e pelo SindHosp.", "titulo_pt": "Saúde no Brasil desperdiça até R$ 360 bilhões por ano, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163191, "titulo": "Caixa e bancários retomam negociações nesta quarta (16), mas greve segue sem prazo para terminar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/caixa-e-bancarios-retomam-negociacoes-nesta-quarta-16-mas-greve-segue-sem-prazo-para-terminar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal e os bancários retomaram as negociações nesta quarta-feira (16) com o objetivo de encerrar a greve nacional, que começou no dia 10. A paralisação continua sem prazo definido para terminar.", "titulo_pt": "Caixa e bancários retomam negociações, mas greve segue sem prazo para terminar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163495, "titulo": "Indexa Broadcast: 70% dos brasileiros confiam na PF; 42% confiam no STF", "url": "https://www.jota.info/justica/indexa-broadcast-70-dos-brasileiros-confiam-na-pf-42-confiam-no-stf", "fonte_id": "jota", "data_pub": "2026-09-15T14:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "70% dos brasileiros confiam na Polícia Federal, enquanto 42% confiam no Supremo Tribunal Federal. A confiança na Polícia Federal é majoritária tanto entre apoiadores de Lula quanto entre apoiadores de Bolsonaro.", "titulo_pt": "70% Dos brasileiros confiam na PF; 42% confiam no STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 163877, "titulo": "South Africa on alert after seventh woman’s body found near capital", "url": "https://www.scmp.com/news/world/africa/article/3367629/south-africa-alert-after-7th-womans-body-found-near-capital?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T13:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corpo de uma mulher foi encontrado na mesma área, a leste de Joanesburgo, onde foram descobertos corpos de outras vítimas nos últimos dois meses. A polícia saudou o público para que fossem mais cautelosas, sem confirmar se os casos são obra de um único assassino.", "titulo_pt": "África do sul em alerta após corpo da sétima mulher ser encontrado perto da capital", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 163899, "titulo": "Nearly 9 in 10 middle-aged Seoul residents are caring for parent, child or both", "url": "https://www.koreaherald.com/article/10874681", "fonte_id": "korea_herald", "data_pub": "2026-09-15T11:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado pela cidade de Seul, Coreia do Sul, mostrou que 88,1% dos residentes na meia-idade cuidam de um parente ou de um filho, enquanto 49,9% cuidam de ambos simultaneamente. O índice de qualidade de vida dos adultos maduros em Seul foi desenvolvido pela prefeitura de Seul e pela Seoul50Plus Foundation.", "titulo_pt": "Quase 9 em 10 adultos maduros em seul cuidam de parente ou filho, e metade cuida de ambos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 164336, "titulo": "De avanços a contradições: o que os países do BRICS ensinam diante da crise climática", "url": "https://exame.com/esg/de-avancos-a-contradicoes-o-que-os-paises-do-brics-ensinam-diante-da-crise-climatica/", "fonte_id": "exame", "data_pub": "2026-09-15T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O bloco BRICS enfrenta um El Niño intenso, levando a soluções que podem orientar políticas de adaptação e proteção de ecossistemas no Brasil.", "titulo_pt": "Avanços e contradições: o que os países do BRICS ensinam diante da crise climática", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 163378, "titulo": "Japão bate recorde e tem mais de 100 mil centenários pela primeira vez", "url": "https://www.cnnbrasil.com.br/internacional/japao-bate-recorde-e-tem-mais-de-100-mil-centenarios-pela-primeira-vez/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão estabeleceu um novo recorde ao ter mais de 100 mil centenários pela primeira vez, com a maioria sendo mulheres. O ministro destacou os números positivos dessa tendência.", "titulo_pt": "Japão bate recorde com mais de 100 mil centenários pela primeira vez", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163613, "titulo": "Indonesian wildfires threaten leading orangutan research site in Borneo", "url": "https://www.theguardian.com/environment/2026/sep/15/indonesia-wildfires-threaten-leading-orangutan-research-site-borneo-cabang-panti", "fonte_id": "guardian_world", "data_pub": "2026-09-15T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na Indonésia ameaçam um importante centro de pesquisa de orangotangos da Borneu, forçando os animais a fugirem das florestas. O fogo está a menos de 200 metros de uma estação de pesquisa, que é parte de um estudo de longo prazo sobre macacos selvagens.", "titulo_pt": "Incêndios ameaçam importante centro de pesquisa de orangotangos da borneu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 163817, "titulo": "El Nino reaches super status: Where will it bring rain, drought and heat?", "url": "https://www.aljazeera.com/news/2026/9/15/el-nino-reaches-super-status-where-will-it-bring-rain-drought-and-heat?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-15T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meteorologistas afirmam que o padrão de aquecimento do Oceano Pacífico pode ser o mais forte da história. Isso significa que as regiões afetadas podem experimentar intensas mudanças climáticas, incluindo chuvas abundantes e secas severas, além de calor extremo.", "titulo_pt": "El niño atinge status superlativo: onde trará chuva, seca e calor?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162424, "titulo": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "url": "https://www.metropoles.com/brasil/clima-brasil-tem-dia-de-contrastes-com-geada-no-sul-e-calor-no-norte", "fonte_id": "metropoles", "data_pub": "2026-09-15T08:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil experimentou um dia com contrastes climáticos, com geada no Sul e calor no Norte. Uma área de baixa pressão e um fluxo de umidade favoreceram instabilidades em partes do Sul e do Sudeste.", "titulo_pt": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162817, "titulo": "After summer of unprecedented heatwaves and drought, climate activists rally support ahead of French elections", "url": "https://www.lemonde.fr/en/environment/article/2026/09/15/after-summer-of-unprecedented-heatwaves-and-drought-climate-activists-rally-support-ahead-of-french-elections_6757544_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações não-governamentais e sindicatos chamaram para uma manifestação na quinta-feira próximo ao Ministério da Economia, pedindo ação urgente climática. Manifestações em 269 cidades francesas estão programadas para 26 de setembro, com temas incluindo clima, vida, paz e justiça social.", "titulo_pt": "Após verão de ondas de calor e secas inéditas, ativistas climáticos buscam apoio nas eleições francesas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 162444, "titulo": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "url": "https://www.cnnbrasil.com.br/agro/chuvas-atrasam-moagem-de/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas interferiram no processo de moagem de cana-de-açúcar nas usinas, levando a um aumento de mais de 20% nos preços do etanol. O aumento também foi influenciado pela elevação dos preços do açúcar internacional.", "titulo_pt": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162960, "titulo": "Wildfires Burn Thousands of Hectares, Exposing Albania’s Systemic Weaknesses", "url": "https://balkaninsight.com/2026/09/15/wildfires-burn-thousands-of-hectares-exposing-albanias-systemic-weaknesses/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-15T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, incêndios florestais destruíram milhares de hectares na Albânia, revelando a incapacidade do estado de lidar com a situação de forma eficaz e coordenada. Os especialistas apontam que os riscos estão aumentando devido ao aquecimento global.", "titulo_pt": "Incêndios florestais des const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
