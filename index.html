<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

com a Rússia para pôr fim à guerra na Ucrânia, apesar das tensões persistentes. Em outro desenvolvimento, o Reino Unido e a União Europeia planejam iniciar conversações formais sobre a possibilidade de enviar solicitantes de asilo rejeitados para hubs em terceiros países. Além disso, a China aprovou a venda de chips de inteligência artificial para empresas chinesas, enquanto a empresa Anthropic se tornou a mais valiosa no mercado de ações de IA. No entanto, a Coreia do Norte continua fora das discussões, com Donald Trump não se encontrando com Kim Jong-un durante sua visita à China.\n\nA geopolítica global está em destaque, com destaque para a reunião trilateral entre o presidente dos Estados Unidos, Xi Jinping e Vladimir Putin em Shenzhen, China. Durante o encontro, os líderes discutiram questões internacionais, mas não houve avanços significativos em relação à guerra na Ucrânia. A Rússia se opõe a qualquer envio de tropas da Europa à Ucrânia, enquanto a França defende a adesão da Ucrânia à Otan. Em relação ao Irã, o conflito persiste, com o diretor executivo da Agência Internacional de Energia alertando sobre os efeitos duradouros na segurança energética global. A China continua a observar as eleições taiwanesas, enquanto Israel encerrou uma operação terrestre em Gaza, resultando na fuga de milhares de palestinos. A presença das tropas salvadenses em Haiti também continua, com questionamentos sobre a segurança dos civis. Além disso, a guerra contra o Irã custou aos EUA mais de 48 bilhões de dólares, e o Irã negou acusações de desenvolvimento de armas biológicas ou químicas.", "economia": "A Anthropic realizou uma oferta inicial de ações (IPO) histórica na Wall Street, levantando US$ 81 bilhões e aumentando seu valor de mercado para mais de 1 trilhão de dólares, um recorde. O evento teve repercussões globais, com protestos em Nova York sobre os riscos financeiros associados à empresa de IA. No Brasil, o dólar atingiu seu valor mais alto do ano, chegando a R$ 6,15, refletindo a volatilidade do mercado. No setor financeiro, o Banco Central do Brasil (BC) foi criticado por intervir no mercado de câmbio, com o ex-chefe do departamento de mercado do BC, Sérgio Goldenstein, acreditando que o BC cometeu um erro ao intervir no mercado de câmbio na quinta-feira. O BC atribuiu a alta recente do dólar à 'inércia' do presidente Lula em definir os rumos de sua quarta gestão. Além disso, a Amazon anunciou que vai desativar as ofertas de bebidas alcoólicas sem imagens de rótulos a partir de 11 de janeiro, enquanto o iFood informou um vazamento de dados de clientes, entregadores e restaurantes parceiros em 14 de novembro.", "tecnologia": "A TSMC, líder mundial na fabricação de chips, está endurecendo as restrições sobre chips de inteligência artificial para a China em resposta às novas regulamentações dos EUA. A empresa também adquiriu uma participação de 0,03% na Anthropic por US$500 milhões, refletindo a crescente importância dessa empresa de IA. A diretora-gerente do FMI, Kristalina Georgieva, alertou para correções futuras no mercado de inteligência artificial. Após uma grande estreia na bolsa, as ações da Anthropic saltaram 17%, embora não tenham atingido seu preço de abertura. As falhas recentes em sistemas digitais, como plataformas bancárias e ferramentas produtivas, são atribuídas a falhas nos modelos de IA, impactando negativamente a percepção dos líderes tecnológicos. Além disso, o governo Lula planeja priorizar a regulamentação da IA e a criação de cotas para produções brasileiras nos serviços de streaming em sua agenda legislativa no final de 2026.", "ciencia": "Um estudo recente, publicado na revista Angewandte Chemie International Edition, descreveu como uma molécula reorganiza seus elétrons quando excitada pela luz. Isso esclarece uma questão antiga e abre novas possibilidades para o estudo da química em movimento, incluindo reações envolvendo catalisadores e moléculas biológicas. Paralelamente, a NASA está coletando perspectivas públicas sobre como a vida atual e o mundo poderiam mudar até 2075, abrangendo quatro temas e buscando ideias conceituais sobre futuros sistemas de aviação ou aeroespaciais. Além disso, a descoberta de um novo material metal-orgânico que combina a condutividade metálica com potencial para eletrônica sensível à luz é crucial para a eletrônica moderna, pois busca materiais que possam mover cargas elétricas eficientemente sem perder energia. Essas pesquisas e discussões abrangem áreas como química, astrofísica e tecnologia, destacando avanços significativos na compreensão e aplicação de conceitos científicos.", "cultura": "O evento mais importante dos artigos foi a arrematação de uma obra de Van Gogh por mais de um bilhão de reais em leilão, após uma disputa judicial envolvendo herdeiros judeus que reivindicaram a pintura durante o período da perseguição nazista. Este evento destaca a importância do patrimônio cultural e do debate sobre a propriedade de obras de arte. O Festival Nicho, em sua oitava edição, também merece destaque. O festival exibe filmes de autoria negra gratuitamente em São Paulo, celebrando o centenário do geógrafo Milton Santos e homenageando a atriz Isabél Zuaa. O Festival MixBrasil de Cultura da Diversidade premiou os longas-metragens 'A Margem do Rio' e 'Tião Personal Dancer' com o Coelho de Ouro, reconhecendo produções que abordam questões de diversidade. Além disso, o Brasil participa de diversos eventos culturais e festivais, como a Mostra de Cinema de Gostoso, que promove sessões de cinema ao ar livre na praia de Maceió, e a celebração do Dia da Consciência Negra com a inauguração de um busto de Dandara em Padre Miguel, no Rio de Janeiro.", "sociedade": "Um empresário foi declarado réu e teve prisão preventiva decretada após ser acusado de matar sua namorada, uma advogada, e o filho dela, de 6 anos, no Distrito Federal. O caso gerou indignação nas redes sociais, especialmente após a identificação da vítima como uma advogada. Em São Paulo, a tatuadora Bianca Karolayne Garbo foi encontrada morta em uma praça após um relacionamento abusivo, levando à prisão de Marcelo Cunha Massari por feminicídio. O Dia da Consciência Negra foi marcado por feriados e restrições em diversos serviços públicos, como no Distrito Federal e em São Paulo, onde o Poupatempo e as unidades do Detran não terão atendimento presencial. Além disso, um estudo com 2.219 pessoas que buscaram ajuda médica revelou que 93% dos apostadores que bloquearam seu CPF continuaram a fazer apostas em sites ilegais, apontando que a autoexclusão não impede a continuidade das apostas ilegais.", "meio_ambiente": "No penúltimo dia da COP31, os debates focaram em investimentos, justiça climática e soluções práticas, com as negociações entrando na reta final e a conferência terminando oficialmente na sexta-feira. Em outro desenvolvimento, a Suprema Corte decidiu que cidades e condados podem processar grandes empresas de petróleo por danos climáticos. A Indonésia prometeu parar o desmatamento para produção de alimentos e reutilizar terras degradadas, ganhando elogios do ator Leonardo DiCaprio, embora especialistas argumentem que o plano é vago. O ator Morgan Freeman transformou uma propriedade de 50 hectares em um santuário para a proteção das abelhas, enquanto a região de Prachinburi, na Tailândia, enfrenta preocupações sobre a poluição por resíduos devido às inundações recentes. Além disso, o decreto de Minas Gerais reconhece a compartilhada responsabilidade no licenciamento ambiental, servindo como modelo para outros estados. No entanto, o tema do clima também foi abordado em outros contextos, como a introdução de um muflon em Tenerife que se tornou uma ameaça ao ecossistema local, e a discussão sobre combustíveis fósseis e a necessidade de sua substituição para combater o aquecimento global.", "direitos_humanos": "O Tribunal Internacional de Justiça declarou Myanmar responsável por genocídio contra o povo rohingya, em uma decisão histórica que reabriu feridas na comunidade internacional. O julgamento, assistido ao vivo nas vastas tendas de refugiados em Bangladesh, confirmou o assassinato de milhares de civis rohingya, o estupro generalizado de mulheres e violência extrema contra crianças. A Corte Internacional de Justiça também condenou Myanmar por genocídio contra o povo rohingya, reafirmando a gravidade das violações dos direitos humanos cometidas pelo governo do país. Além disso, a Save the Children alertou que pelo menos 300 crianças morreram em Gaza esperando a permissão israelense para receber tratamento médico vital, enquanto um relatório da organização indicou que 589 milhões de crianças vivem em áreas de conflito, um recorde mundial."}, "resumo_do_dia": {"politica_nacional": [{"id": 275743, "titulo": "Moraes libera julgamento da Lei da Dosimetria para 4 de dezembro", "url": "https://www.jota.info/stf/do-supremo/moraes-libera-julgamento-da-lei-da-dosimetria-para-4-de-dezembro", "fonte_id": "jota", "data_pub": "2026-11-19T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento da Lei da Dosimetria foi marcado para 4 de dezembro. O futuro desta lei está relacionado com os planos políticos de Alcolumbre e Motta para a reeleição como presidente do Senado e da Câmara, respectivamente.", "titulo_pt": "Moraes libera julgamento da Lei da Dosimetria para 4 de dezembro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 275744, "titulo": "STF tem maioria para derrubar dispensa de honorários advocatícios em acordos tributários", "url": "https://www.jota.info/tributos/stf-tem-maioria-para-derrubar-dispensa-de-honorarios-advocaticios-em-acordos-tributarios", "fonte_id": "jota", "data_pub": "2026-11-19T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento no STF foi temporariamente suspenso para aguardar a chegada de ministros ausentes. A ação que propôs a derrubada da dispensa de honorários advocatícios em acordos tributários foi apresentada pela OAB.", "titulo_pt": "STF aguarda ministros para julgar ação que busca derrubar dispensa de honorários advocatícios em acordos tributários", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 275526, "titulo": "Moraes marca para 4 de dezembro julgamento sobre dosimetria que pode beneficiar Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/moraes-marca-julgamento-sobre-dosimetria-que-pode-beneficiar-bolsonaro-para-4-de-dezembro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, marcou para 4 de dezembro o julgamento de ações relacionadas à Lei da Dosimetria, que pode beneficiar condenados pelo golpe e pelo 8 de Janeiro.", "titulo_pt": "Moraes fixa data para julgamento sobre lei da dosimetria que pode beneficiar Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 275508, "titulo": "Moraes libera ações sobre Lei da Dosimetria para julgamento no STF; caso será analisado em dezembro", "url": "https://g1.globo.com/politica/noticia/2026/11/19/moraes-libera-acoes-sobre-lei-da-dosimetria-para-julgamento-no-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do Supremo Tribunal Federal (STF), permitiu que ações questionando a Lei da Dosimetria sejam julgadas no STF. O caso será analisado virtualmente entre os dias 4 e 15 de dezembro.", "titulo_pt": "Moraes libera ações sobre Lei da Dosimetria para julgamento no STF; caso será analisado em dezembro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 275745, "titulo": "Fachin envia relatórios da PF para os ministros citados em investigação do Master", "url": "https://www.jota.info/stf/do-supremo/fachin-envia-relatorios-da-pf-para-os-ministros-citados-em-investigacao-do-master", "fonte_id": "jota", "data_pub": "2026-11-19T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal estão recebendo relatórios da Polícia Federal que os mencionam diretamente, sem incluir informações sobre os colegas. Fachin, um dos juízes envolvidos na investigação, enviou esses relatórios.", "titulo_pt": "Fachin envia relatórios da PF para ministros citados em investigação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 275527, "titulo": "Presidente do PSOL diz que partido está unido contra pressão do mercado sobre Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/presidente-do-psol-diz-que-partido-esta-unido-contra-pressao-do-mercado-sobre-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente nacional do PSOL, Paula Coradi, afirma que o partido está unido para resistir à pressão econômica do mercado sobre o governo de Lula. O PSOL se posiciona contra as pressões vindas do mercado financeiro em relação ao próximo governo de Luiz Inácio Lula da Silva.", "titulo_pt": "Presidente do PSOL afirma que partido está unido contra pressão do mercado sobre Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 275528, "titulo": "Presidente do TRF-1 derruba liminar e libera pregão do Senado com gasto de R$ 2,66 milhões em iPhones", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/presidente-do-trf-1-derruba-liminar-e-libera-pregao-do-senado-com-gasto-de-r-266-milhoes-em-iphones.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente do TRF-1, Maria do Carmo Cardoso, suspendeu uma liminar que barrava um pregão do Senado para contratar serviços de telefonia móvel, incluindo iPhones 18 Pro, por um custo estimado de R$ 6 milhões ao longo de quatro anos.", "titulo_pt": "Presidente do TRF-1 anula liminar e libera pregão do Senado com iphones", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 275520, "titulo": "Apesar de ansiedade do mercado, Lula 4 não assume em ambiente de terra arrasada, diz André Esteves", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/apesar-de-ansiedade-do-mercado-lula-4-nao-assume-em-ambiente-de-terra-arrasada-diz-andre-esteves.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Esteves, presidente do conselho de administração do BTG Pactual, afirmou que o quarto mandato de Lula não começa com um cenário de desastre econômico e que o principal problema é o ajuste fiscal. Apesar da ansiedade do mercado, o cenário é menos ruim do que em outros períodos de transição de governo.", "titulo_pt": "Apesar da ansiedade, Lula 4 não começa com cenário de desastre, diz Esteves", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 275529, "titulo": "Lula diz que criará ministério voltado à população idosa e cita apoio na eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/lula-diz-que-criara-ministerio-voltado-a-populacao-idosa-e-cita-apoio-na-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T19:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula anunciou a criação de um ministério voltado para a população idosa. Ele agradeceu o apoio dos eleitores mais velhos durante sua campanha de reeleição.", "titulo_pt": "Lula anuncia ministério para idosos e agradece apoio dos mais velhos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 275552, "titulo": "Veja como será o cálculo da hora extra com a escala de trabalho 5x2", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/veja-como-sera-o-calculo-da-hora-extra-com-escala-de-trabalho-5x2", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-19T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Trabalho e Emprego, Luiz Marinho, explicou que a nova escala de trabalho 5x2 vai aumentar o custo das horas extras, mesmo sem alterar os salários fixos, devido à gradual redução da jornada semanal e à garantia de dois dias de descanso remunerado.", "titulo_pt": "Veja como será o cálculo da hora extra com a escala de trabalho 5x2", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 275509, "titulo": "Mercado de câmbio trava após fala de Lula sobre escolha de ministros e BC intervém com leilão de dólar", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/11/19/mercado-de-cambio-trava-apos-fala-de-lula-sobre-escolha-de-ministros-e-bc-intervem-com-leilao-de-dolar.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T19:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de câmbio foi interrompido após declarações do presidente Lula sobre a escolha de ministros, especialmente o novo ministro da Fazenda. O Banco Central vendeu US$ 1 bilhão em um leilão para estabilizar a situação.", "titulo_pt": "Mercado de câmbio trava após declarações de Lula sobre ministros e BC intervém", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 275750, "titulo": "Bolsonaro recorre de decisão de Moraes que vetou visita de Rogério Marinho", "url": "https://www.jota.info/stf/do-supremo/bolsonaro-recorre-de-decisao-de-moraes-que-vetou-visita-de-rogerio-marinho", "fonte_id": "jota", "data_pub": "2026-11-19T19:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa do ex-presidente Jair Bolsonaro recorreu de uma decisão do ministro do STF 275510, "titulo": "Defesa diz que Bolsonaro não vota na eleição do Senado e recorre para que ex-presidente receba visita de Marinho", "url": "https://g1.globo.com/politica/noticia/2026/11/19/defesa-diz-que-bolsonaro-nao-tem-voto-na-eleicao-do-senado-e-recorre-para-que-ex-presidente-receba-marinho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T18:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Jair Bolsonaro recorreu contra a decisão que não permitiu a visita do senador Rogério Marinho ao ex-presidente, que cumpre pena em regime domiciliar. Alega que a suspensão dos direitos políticos não deve impedir interlocução privada sobre assuntos de política.", "titulo_pt": "Defesa de Bolsonaro recorre para permitir visita de Marinho", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 275609, "titulo": "Após cobrança de Motta e Alcolumbre, Moraes libera Lei da Dosimetria para julgamento no STF", "url": "https://exame.com/brasil/apos-cobranca-de-motta-e-alcolumbre-moraes-libera-lei-da-dosimetria-para-julgamento-no-stf/", "fonte_id": "exame", "data_pub": "2026-11-19T18:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei da Dosimetria será julgada no plenário virtual do STF entre 4 e 15 de dezembro. O ministro Alexandre Moraes autorizou o julgamento após sugestões dos senadores Simone Motta e Alessandro Alcolumbre.", "titulo_pt": "Lei da Dosimetria será julgada no STF entre 4 e 15 de dezembro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 275289, "titulo": "China eyes Taiwan elections as test: US", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/20/2003868061", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está observando atentamente as eleições taiwanesas como uma oportunidade para testar a reação da comunidade internacional e avaliar sil", "classe": "A"}, {"id": 275905, "titulo": "Anthropic becomes most valuable AI firm as shares soar in stock market debut", "url": "https://www.bbc.co.uk/news/articles/c3x29ggenz12o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-19T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic se tornou a empresa de IA mais valiosa após sua estreia no mercado de ações, criando um teste para o setor inteiro. É a primeira empresa puramente de IA a ser listada publicamente.", "titulo_pt": "Anthropic se torna a empresa de IA mais valiosa em estreia no mercado de ações", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 275878, "titulo": "Leader of Democratic AG group to step down after Texas triumph", "url": "https://www.politico.com/news/2026/11/19/after-texas-triumph-daga-chief-steps-aside-01176340", "fonte_id": "politico", "data_pub": "2026-11-19T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sean Rankin, que liderava o grupo Democrático de Advogados (DAGA) por uma década, deixará o cargo após a vitória no Texas, onde ajudou os democratas a conquistar cinco cargos de procurador-geral ocupados por republicanos.", "titulo_pt": "Líder do grupo democrático de advogados (daga) vai se retirar após vitória no Texas", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 275694, "titulo": "Vídeo: Trump é gravado de olhos fechados em discurso de Xi Jinping na Apec", "url": "https://www.cnnbrasil.com.br/internacional/video-trump-e-gravado-de-olhos-fechados-em-discurso-de-xi-jinping-na-apec/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos esteve em Shenzhen, na China, para a cúpula do Fórum de Cooperação Econômica Ásia-Pacífico e para reuniões com o líder chinês e o presidente russo. Trump foi gravado de olhos fechados durante o discurso do líder chinês Xi Jinping.", "titulo_pt": "Vídeo: trump dorme durante discurso de Xi Jinping na Apec", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 275907, "titulo": "Fiona the hippo dies after swallowing a hat at Cincinnati Zoo", "url": "https://www.bbc.co.uk/news/articles/cwz0k3172xzko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-19T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fiona, uma hipopótamo, morreu alguns dias após engolir um chapéu, de acordo com uma declaração do Zoológico de Cincinnati. Ela lutou até não poder mais.", "titulo_pt": "Fiona, a hipopótamo, morre após engolir um chapéu no zoológico de Cincinnati", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 275698, "titulo": "Putin convida europeus a Moscou para que “esclareçam” posição sobre Ucrânia", "url": "https://www.cnnbrasil.com.br/internacional/putin-convida-europeus-a-moscou-para-que-esclarecam-posicao-sobre-ucrania/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente russo, Putin, convidou representantes europeus a se reunirem em Moscou para esclarecer sua posição sobre a Ucrânia. Putin afirmou que os Estados Unidos têm pressionado a Rússia de forma insistente para que o país aceite a participação da Europa nas negociações de paz.", "titulo_pt": "Putin convida europeus a Moscou para esclarecer posição sobre Ucrânia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 275906, "titulo": "Europe ready for talks with Russia on ending war in Ukraine, leaders say", "url": "https://www.bbc.co.uk/news/articles/ckzd9nln5e6go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-19T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes dos aliados da Ucrânia dão a entender que estão preparados para negociar com a Rússia para pôr fim à guerra na Ucrânia. Eles apresentam uma posição negociadora unificada durante um encontro em Berlim.", "titulo_pt": "Europa pronta para conversar com Rússia sobre fim da guerra na Ucrânia, dizem líderes", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 275813, "titulo": "Myanmar Genocide Ruling Sets Up Court Fight Over Israel and Gaza", "url": "https://www.nytimes.com/2026/11/19/world/asia/icj-myanmar-gaza.html", "fonte_id": "nyt_world", "data_pub": "2026-11-19T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A decisão do Tribunal Internacional de Justiça trata de questões relacionadas ao caso contra Israel acusado de genocídio no Gaza. Israel rejeitou a acusação.", "titulo_pt": "Julgamento de genocídio no myanmar cria conflito na corte sobre Israel e Gaza", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 275753, "titulo": "Em “founder mode”, Marciano volta ao comando do Agibank", "url": "https://braziljournal.com/em-founder-mode-marciano-volta-ao-comando-do-agibank", "fonte_id": "brazil_journal", "data_pub": "2026-11-19T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marciano Testa, fundador do Agibank, está retornando ao comando da companhia, assumindo o cargo de CEO do Agibank no Brasil. O objetivo é aumentar a agilidade nas decisões e reavivar a cultura de inovação dentro do banco especializado em crédito consignado.", "titulo_pt": "Marciano testa retorna ao comando do Agibank em modo 'founder'", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 275512, "titulo": "Distração e a arte de resolver problemas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/distracao-e-a-arte-de-resolver-problemas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diante de um desafio aparentemente insuperável, é preciso encontra sistemas de reservas de voos, plataformas bancárias e ferramentas produtivas não são apenas coincidências, de acordo com especialistas em segurança cibernética.", "titulo_pt": "Estas falhas tecnológicas estão dando sinais de Y2K e agentes de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 276043, "titulo": "Uber tests rides for kids as young as 10, with extra pay for drivers", "url": "https://techcrunch.com/2026/11/19/uber-tests-rides-for-kids-as-young-as-10-with-extra-pay-for-drivers/", "fonte_id": "techcrunch", "data_pub": "2026-11-19T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uber está testando um novo programa em três cidades dos Estados Unidos que permite que crianças a partir dos 10 anos façam viagens, com recompensa extra para os motoristas. A iniciativa visa explorar a possibilidade de incluir menores de idade como passageiros em suas operações.", "titulo_pt": "Uber testa viagens com crianças a partir dos 10 anos em três cidades dos EUA, com bônus para motoristas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 276025, "titulo": "MAHA PAC spent more on steak, luxury club than candidates, report shows", "url": "https://arstechnica.com/health/2026/11/maha-pac-spent-more-on-steak-luxury-club-than-candidates-report-shows/", "fonte_id": "ars_technica", "data_pub": "2026-11-19T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório mostrou que a MAHA PAC gastou mais em steakhouse e clube de luxo do que em candidatos. Um especialista considerou o gasto 'bastante incomum' para uma PAC.", "titulo_pt": "MAHA gasta mais com steakhouse e clube de luxo do que com candidatos, relatório aponta", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 275700, "titulo": "EUA liberam exportação de quase 900 mil chips de IA para a China", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/eua-liberam-exportacao-de-quase-900-mil-chips-de-ia-para-a-china/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê de Relações Exteriores da Câmara dos Representantes dos EUA aprovou a exportação de quase 900 mil chips de IA para empresas chinesas, incluindo Alibaba, Tencent, Baidu e BYD.", "titulo_pt": "EUA autorizam exportação de quase 900 mil chips de IA para a China", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 275704, "titulo": "IA impulsiona crescimento, mas exige cautela monetária, diz membro do FMI", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/ia-impulsiona-crescimento-mas-exige-cautela-monetaria-diz-membro-do-fmi/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kristalina Georgieva, membro do FMI, afirma que a inteligência artificial está compensando parte dos efeitos negativos do choque de oferta de energia. Ela destaca a importância de uma cautela monetária diante do crescimento impulsionado pela IA.", "titulo_pt": "IA impulsiona crescimento, mas exige cautela monetária, diz membro do FMI", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 275809, "titulo": "La IA está siendo gobernada de una manera “medieval”, denuncia la ONU", "url": "https://www.lanacion.com.ar/tecnologia/la-ia-esta-siendo-gobernada-de-una-manera-medieval-denuncia-la-onu-nid19112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T21:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) denunciou que a inteligência artificial está sendo governada de uma maneira 'medieval', com o poder concentrado em poucos executivos do setor.", "titulo_pt": "IA está sendo governada de forma 'medieval', denuncia a ONU", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 276005, "titulo": "Anthropic shares jump 17% after record Wall Street listing", "url": "https://www.ft.com/content/2b203097-7c61-464f-810f-962912a133dd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Anthropic, liderada por Dario Amodei, arrecadou $81 bilhões em uma oferta pública inicial ampliada de Wall Street, estabelecendo um novo recorde de listagem na bolsa.", "titulo_pt": "Ações da anthropic saltam 17% após listagem recordista em Wall Street", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 276048, "titulo": "The Jensen Huang Blast Radius Has Hit His Favorite Restaurants", "url": "https://www.wired.com/story/jensen-huangs-favorite-restaurants-are-caught-up-in-his-scandals-too/", "fonte_id": "wired", "data_pub": "2026-11-19T20:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns vendedores de comida em Taiwan estão se distanciando do ex-CEO da Nvidia, Jensen Huang, enquanto outros o apoiam. Um proprietário de loja afirma que não é justo distanciar-se dele apenas por causa de sua declaração, pois ele não matou ninguém ou incendiou algo.", "titulo_pt": "O raio de impacto de Jensen Huang chegou aos seus restaurantes favoritos em taiwan", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 275584, "titulo": "Melatonina: por que suplemento sublingual é proibido pela Anvisa", "url": "https://veja.abril.com.br/saude/melatonina-por-que-suplemento-sublingual-e-proibido-pela-anvisa/", "fonte_id": "veja", "data_pub": "2026-11-19T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O suplemento de melatonina, indicado para tratar insônia, foi liberado no Brasil em 2021. As regras para suplementos alimentares foram atualizadas, mas o suplemento sublingual ainda está proibido pela Anvisa.", "titulo_pt": "Melatonina: suplemento sublingual é proibido pela Anvisa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276070, "titulo": "Gene variant gives male malaria mosquitoes a mating edge in the heat", "url": "https://phys.org/news/2026-11-gene-variant-male-malaria-mosquitoes.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mosquitos machos com uma variante genética têm uma vantagem na reprodução em condições quentes. Entender como os mosquitos se adaptam ao clima é crucial para melhorar a prevenção e controle da malária.", "titulo_pt": "Variante genética dá vantagem de reprodução a mosquitos machos da malária em climas quentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276071, "titulo": "Cichlid sibling rivalry: Young fish fight more in some species than others", "url": "https://phys.org/news/2026-11-cichlid-sibling-rivalry-young-fish.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em algumas espécies de cíclidos, irmãos podem entrar em conflitos sérios, inclusive chegando a fratricídio, apesar de competirem por recursos limitados. Essa dinâmica é diferente da de humanos, onde irmãos geralmente são companheiros de infância constantes.", "titulo_pt": "Conflitos entre irmãos: peixes cíclidos combatem mais em algumas espécies do que em outras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276072, "titulo": "Rethinking the 'girls are worse with money' myth", "url": "https://phys.org/news/2026-11-rethinking-girls-worse-money-myth.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa liderada pelo Dr. Stephen Agnew, da Departamento de Economia e Finanças da Te Whare Wānanga o Waitaha | University of Canterbury, está desafiando a suposição comum de que as meninas são menos alfabetizadas financeiramente que os meninos durante a adolescência.", "titulo_pt": "Reavaliando o mito de que as garotas são piores com dinheiro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276073, "titulo": "Remote jobs diminish hiring bias against mothers", "url": "https://phys.org/news/2026-11-remote-jobs-diminish-hiring-bias.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas indicam que a transferência de vagas de trabalho presencial para remota pode reduzir o 'castigo maternidade', que é um viés no local de trabalho que assume que as mães são menos comprometidas com suas carreiras, resultando em menos oportunidades, salários menores e promoções mais lentas.", "titulo_pt": "Trabalhos remotos podem diminuir viés contra mães no mercado de trabalho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276074, "titulo": "Optical DNA mapping assembles yeast genomes at chromosome scale", "url": "https://phys.org/news/2026-11-optical-dna-yeast-genomes-chromosome.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Chalmers University of Technology estendem um método de mapeamento óptico do DNA, anteriormente demonstrado para genomas bacterianos, para genomas eucarióticos mais complexos, utilizando duas espécies de levadura para gerar mapas ópticos que cobrem todo o cromossomo, incluindo regiões repetitivas grandes que são particularmente difíceis de reconstruir.", "titulo_pt": "Mapeamento óptico do DNA reúne genomas de levaduras em escala de cromossomo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276075, "titulo": "Improving hydrogen production from water can support abundant global crops", "url": "https://phys.org/news/2026-11-hydrogen-production-abundant-global-crops.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de hidrogênio a partir da água pode suportar cultivos abrangentes em todo o mundo. O processo de eletrolise da água, que divide a água em hidrogênio e oxigênio, é amplamente utilizado para produzir hidrogênio industrialmente, incluindo na fabricação de amônia para fertilizantes agrícolas, que são essenciais para a produção global de alimentos.", "titulo_pt": "Aprimoramento da produção de hidrogênio a partir da água pode apoiar cultivos abrangentes em todo o mundo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276076, "titulo": "X-rays reveal fleeting intermediate step as iron-containing molecule responds to light", "url": "https://phys.org/news/2026-11-rays-reveal-fleeting-intermediate-iron.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisa mapeou como uma molécula reorganiza seus elétrons quando excitada pela luz. Os resultados, publicados na Angewandte Chemie International Edition, esclarecem uma questão antiga e abrem novas possibilidades para o estudo de química em movimento, como quebras e formação de ligações—passos fundamentais em reações envolvendo catalisadores e moléculas biológicas.", "titulo_pt": "Raios-x revelam passo intermediário rápido em resposta de molécula contendo ferro a luz", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276077, "titulo": "New research explains how far people will go for a day at the park", "url": "https://phys.org/news/2026-11-people-day.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A proximidade de um parque influencia a frequência das visitas, com distâncias que variam consideravelmente entre diferentes regiões metropolitanas. Em geral, a frequência de visitas diminui significativamente a medida que o parque fica mais distante de casa.", "titulo_pt": "Nova pesquisa explica como a distância afeta as visitas aos parques", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276079, "titulo": "Cell skeleton networks stiffen like wool when compressed, experiments reveal", "url": "https://phys.org/news/2026-11-cell-skeleton-networks-stiffen-wool.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas da CNRS, Université Paris Cité e Université Paris-Saclay descobriram que partes da esqueleto celular se comportam como lã quando as células se movem e se pressionam contra obstáculos, gerando forças. Este estudo foi publicado na revista Nature.", "titulo_pt": "O esqueleto celular se fortifica como lã quando comprimido, mostram experimentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276095, "titulo": "Challenge: Public Input on Life and the World in 2075", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/center-of-excellence-for-collaborative-innovation-coeci/challenge-public-input-on-life-and-the-world-in-2075/", "fonte_id": "nasa_news", "data_pub": "2026-11-19T19:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está coletando perspectivas públicas sobre como a vida atual e o mundo poderiam mudar até 2075. O desafio abrange quatro temas e busca ideias conceituais sobre futuros sistemas de aviação ou aeroespaciais.", "titulo_pt": "Desafio: entrada pública sobre vida e o mundo em 2075", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 276097, "titulo": "Voyager 1 is a light-day away. What now?", "url": "https://www.scientificamerican.com/article/voyager-1-is-a-light-day-away-what-now/", "fonte_id": "scientific_american", "data_pub": "2026-11-19T19:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizou uma reunião na quinta-feira para discutir o passado, presente e futuro da missão Voyager 1. O Voyager 1 está a uma luz-dia de distância.", "titulo_pt": "Voyager 1 está a uma luz-dia de distância. O que agora?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 276094, "titulo": "A brain region known for listening helps us speak", "url": "https://www.sciencenews.org/article/brain-region-listening-speak-wernickie", "fonte_id": "science_news", "data_pub": "2026-11-19T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O registro da área Wernicke, conhecida pela audição, pode auxiliar na compreensão do processo de fala e na criação de implantes cerebrais que restauram a capacidade de falar.", "titulo_pt": "Área do cérebro associada à audição ajuda na fala", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 276098, "titulo": "We’ve been wrong about how language is produced in the brain for 150 years", "url": "https://www.scientificamerican.com/article/weve-been-wrong-about-how-language-is-produced-in-the-brain-for-150-years/", "fonte_id": "scientific_american", "data_pub": "2026-11-19T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente revolucionou a compreensão tradicional sobre como o cérebro produz linguagem. Ao longo de 150 anos, a percepção sobre esse processo era considerada estável, mas agora foi desafiada.", "titulo_pt": "Nosso entendimento sobre a produção de linguagem no cérebro foi revolucionado após 150 anos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 276099, "titulo": "‘A watershed moment’: Researchers unveil first-of-its-kind blood test for CTE", "url": "https://www.scientificamerican.com/article/a-watershed-moment-researchers-unveil-first-of-its-kind-blood-test-for-cte/", "fonte_id": "scientific_american", "data_pub": "2026-11-19T18:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Se validado em estudos maiores, o teste poderia auxiliar os médicos no diagnóstico da doença neurodegenerativa antes da morte.", "titulo_pt": "Um momento crucial na bacia hidrográfica: pesquisadores revelam primeiro teste sanguíneo para CTE", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 276100, "titulo": "Chinese AI models reveal clues pointing to restricted Blackwell chips", "url": "https://www.scientificamerican.com/article/chinese-ai-models-reveal-clues-pointing-to-restricted-blackwell-chips/", "fonte_id": "scientific_american", "data_pub": "2026-11-19T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pistas para a origem dos modelos de inteligência artificial chineses estão escondidas nos números aleatórios que servem como ponto de partida para esses modelos.", "titulo_pt": "Modelos de IA chineses revelam pistas sobre suas origens", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 275304, "titulo": "Taipei certifies Japanese-era artifacts from schools", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868080", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Taipei certificou artefatos do período japonês que estavam sendo guardados em escolas. Este processo visa preservar e documentar a herança histórica desses itens.", "titulo_pt": "Taipei certifica artefatos do período japonês de escolas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 276111, "titulo": "Frieze Abu Dhabi Debuts to Brisk Sales and Confident Dealers", "url": "https://www.artnews.com/art-news/market/frieze-abu-dhabi-rebrands-high-quality-art-large-sums-1234806923/", "fonte_id": "artnews", "data_pub": "2026-11-19T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A feira de arte de Abu Dhabi teve uma forte participação, com colecionadores privados e instituições gastando generosamente, resultando em expositores esgotados e transações que chegaram a sete dígitos.", "titulo_pt": "Frieze Abu Dhabi inicia com vendas briskas e expositores confiantes", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 276112, "titulo": "Ahmed Morsi, Whose Poetic Paintings Long for Egyptian Homeland, Dies at 96", "url": "https://www.artnews.com/art-news/news/ahmed-morsi-painter-poet-dead-1234806958/", "fonte_id": "artnews", "data_pub": "2026-11-19T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ahmed Morsi, um pintor egípcio cujas obras poéticas expressam saudade do país natal, faleceu naturalmente em Cairo aos 96 anos.", "titulo_pt": "Ahmed Morsi, cujos pinturas poéticas sonham com o lar egípcio, morre aos 96 anos", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 276152, "titulo": "Aaron Pierre on ‘Lanterns,’ the DC Shake-Up, and Landing a Role in Ryan Gosling’s ‘Star Wars’ Movie", "url": "https://www.indiewire.com/features/podcast/aaron-pierre-lanterns-dc-shakeup-starfighter-1235229615/", "fonte_id": "indiewire", "data_pub": "2026-11-19T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aaron Pierre participa desta semana do podcast 'Screen Talk' da IndieWire. Os co-apresentadores discutem sobre David Fincher e Quentin Tarantino no filme 'The Further Mis-Adventures of Cliff Booth'.", "titulo_pt": "Aaron Pierre no 'screen talk', sobre debates entre fincher e tarantino", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 275589, "titulo": "Após disputa judicial, obra de Van Gogh é arrematada por mais de um bilhão de reais", "url": "https://veja.abril.com.br/cultura/apos-disputa-judicial-obra-de-van-gogh-e-arrematada-por-mais-de-um-bilhao-de-reais/", "fonte_id": "veja", "data_pub": "2026-11-19T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma obra de Van Gogh foi arrematada por mais de um bilhão de reais em leilão. Antes do leilão, herdeiros judeus reivindicaram a pintura, afirmando que a família havia sido obrigada a vendê-la durante o período da perseguição nazista.", "titulo_pt": "Após disputa judicial, obra de Van Gogh é arrematada por mais de um bilhão de reais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 275540, "titulo": "Mural de Kobra em Interlagos, por R$ 2 mi, gera debate sobre prioridades da Prefeitura de SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/mural-de-kobra-em-interlagos-por-r-2-mi-gera-debate-sobre-prioridades-da-prefeitura-de-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mural do artista Eduardo Kobra no autódromo de Interlagos, que custou R$ 2 milhões, gerou críticas no setor cultural de São Paulo. A discussão foca nas prioridades da Prefeitura de São Paulo em relação ao setor cultural.", "titulo_pt": "Mural de Kobra em Interlagos, por R$ 2 mi, gera debate sobre prioridades da Prefeitura de SP", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 275542, "titulo": "Salvador reverencia Mãe Menininha em filme sobre história do Gantois", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/djamila-ribeiro/2026/11/salvador-reverencia-mae-menininha-em-filme-sobre-historia-do-gantois.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, a autora visitou o Ilê Iyá Omi Axé Iyamassê, o Gantois, em Salvador, durante um turismo organizado por Adriana Lacerda. A visita ocorreu em um momento simbólico de luto pela passagem de Mãe Carmen de Oxoguiã, filha de Mãe Menininha e matriarca do terreiro nas últimas duas décadas.", "titulo_pt": "Salvador reverencia Mãe Menininha em visita ao Gantois", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 275810, "titulo": "La reflexión de Joseph Pilates sobre los hábitos que perjudican la salud física", "url": "https://www.lanacion.com.ar/sociedad/la-reflexion-de-joseph-pilates-sobre-los-habitos-que-perjudican-la-salud-fisica-nid19112026/", "fonte_i ulo": "Intelectual baiano Edison Carneiro será próximo homenageado da Flipelô", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/intelectual-baiano-edison-carneiro-sera-proximo-homenageado-da-flipelo", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-19T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Edison Carneiro, um importante intelectual baiano, será o próximo homenageado da Festa Literária Internacional do Pelourinho (Flipelô) em 2027. Carneiro, que viveu de 1912 a 1972, dedicou sua vida ao estudo das religiões de matrizes africanas, da capoeira, do samba e outras manifestações culturais populares.", "titulo_pt": "Intelectual baiano Edison Carneiro será próximo homenageado da Flipelô", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 275544, "titulo": "'Nosso Segredo' e animação 'Tipo Irmãs': o que ver na TV e no streaming nesta sexta", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/nosso-segredo-e-animacao-tipo-irmas-o-que-ver-na-tv-e-no-streaming-nesta-sexta.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Dia da Consciência Negra, o canal estreia 'Nosso Segredo', vencedor do Kikito de melhor filme no Festival de Gramado, no Rio Grande do Sul.", "titulo_pt": "Nosso Segredo e animação 'Tipo Irmãs': o que ver na TV e no streaming nesta sexta", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 275545, "titulo": "Como Chiquinha Gonzaga teve a própria negritude apagada ao longo da história", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/como-chiquinha-gonzaga-teve-a-propria-negritude-apagada-por-biografos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-19T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "text
