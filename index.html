tes com influenza no Japão aumentou para 11,35 por clínica na semana encerrada em 4 de outubro. Residentes estão correndo para se vacinar contra a gripe.", "titulo_pt": "Núcleo de pacientes com influenza cresce, e japoneses se correm para se vacinar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 204572, "titulo": "Cantora Marília Mendonça ganha exposição sensorial no MIS", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-10/cantora-marilia-mendonca-ganha-exposicao-sensorial-no-mis", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-10-09T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cantora Marília Mendonça receberá uma exposição sensorial no Museu da Imagem e do Som (MIS) em São Paulo, que começa nesta sexta-feira (9) e permanece até 29 de novembro. A mostra 'Marília Mendonça – Sentimento Louco' celebra a carreira e a memória da artista, que faleceu em 2021.", "titulo_pt": "Cantora Marília Mendonça ganha exposição sensorial no MIS", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 205245, "titulo": "AK Blakemore: ‘The Goldfinch by Donna Tartt was extremely silly and bad’", "url": "https://www.theguardian.com/books/2026/oct/09/ak-blakemore-the-goldfinch-by-donna-tartt-was-extremely-silly-and-bad", "fonte_id": "guardian_culture", "data_pub": "2026-10-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora fala sobre sua memória de leitura infantil com 'Hairy Maclary' de Lynley Dodd, seu livro favorito da infância e sua perda de fé em Ernest Hemingway. Ela também menciona que 'O Pintor de Galerias' de Donna Tartt a impressionou negativamente.", "titulo_pt": "AK Blakemore: ‘o pintor de galerias de Donna Tartt foi extremamente tolo e ruim’", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 205062, "titulo": "Yayoi Kusama Museum new exhibit unveils a ‘ladder to heaven’", "url": "https://www.japantimes.co.jp/culture/2026/10/09/art/yayoi-kusama-tokyo-exhibition-museum/", "fonte_id": "japan_times", "data_pub": "2026-10-09T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição 'Escada para o Céu' foi inaugurada no Museu Yayoi Kusama em 8 de outubro, sendo a primeira após a morte da artista.", "titulo_pt": "Nova exposição no museu yayoi Kusama apresenta 'escada para o céu'", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 205246, "titulo": "‘Is death necessary?’: why Peter Greenaway’s assisted dying drama is stuck in post-production hell", "url": "https://www.theguardian.com/film/2026/oct/09/is-death-necessary-why-peter-greenaways-assisted-dying-drama-is-stuck-in-post-production-hell", "fonte_id": "guardian_culture", "data_pub": "2026-10-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três anos após o início da filmagem de 'Lucca Mortis', estrelado por Dustin Hoffman, o diretor Peter Greenaway ainda está em disputa com os produtores sobre qual versão lançar. O filme, que deveria marcar um glorioso encerramento para o diretor e o ator, enfrenta problemas significativos durante a pós-produção.", "titulo_pt": "‘É necessário a morte?’: por que o drama sobre eutanásia de Peter Greenaway está preso na ‘hell’ de pós-produção", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 204942, "titulo": "Anthony Vaccarello leaves Saint Laurent after glittering decade", "url": "https://www.lemonde.fr/en/m-le-mag/article/2026/10/09/anthony-vaccarello-leaves-saint-laurent-after-glittering-decade_6758412_117.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T07:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthony Vaccarello deixou a casa Saint Laurent, após uma década brilhante. A empresa-mãe Kering, conglomerado francês, anunciou que anunciará breve a nova liderança criativa da marca.", "titulo_pt": "Anthony Vaccarello deixa Saint Laurent após década brilhante", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 204527, "titulo": "Fernanda Montenegro, perto dos 97, reflete sobre a vida e a morte em documentário", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/fernanda-montenegro-perto-dos-97-reflete-sobre-a-vida-e-a-morte-em-documentario.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernanda Montenegro, com 96 anos, reflete sobre a vida e a morte em um documentário dirigido por Pedro Waddington. No início do filme, ela mesma fala sobre estar perto do fim.", "titulo_pt": "Fernanda Montenegro, com 96 anos, reflete sobre vida e morte em documentário", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 204528, "titulo": "Com Rafa Brites e Felipe Andreoli, Canta Comigo é renovado pela Record para 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/com-rafa-brites-e-felipe-andreoli-canta-comigo-e-renovado-pela-record-para-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Record renovou o programa Canta Comigo para 2027, com a continuidade da apresentação do casal Rafa Brites e Felipe Andreoli.", "titulo_pt": "Canta Comigo é renovado pela Record para 2027 com Rafa Brites e Felipe Andreoli", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 205070, "titulo": "Tokyo’s palace runners say respect vital as Chiyoda considers new safety measures", "url": "https://www.japantimes.co.jp/news/2026/10/09/japan/society/imperial-palace-runners-safety-measures/", "fonte_id": "japan_times", "data_pub": "2026-10-09T06:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os corredores do Palácio Imperial de Tóquio acreditam que a reação negativa de pedestres nas redes sociais é devido a alguns corredores rudes. A decisão do bairro Chiyoda de considerar novas medidas de segurança não foi mencionada diretamente, mas é contextualizada pela discussão sobre o comportamento dos corredores.", "titulo_pt": "Corredores do palácio imperial de tóquio acreditam que reação negativa é devido a alguns corredores rudes", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 204842, "titulo": "Adidas accuses Australian label White Fox of ‘trading off its reputation’ with use of four-stripe branding", "url": "https://www.theguardian.com/business/2026/oct/09/adidas-white-fox-fashion-australia-trading-branding-sydney-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-09T06:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca global de vestuário Adidas está processando uma loja de varejo online australiana chamada White Fox no tribunal federal, acusando-a de infringir sua marca distintiva com um design de quatro faixas que a empresa afirma é deceptivamente semelhante ao seu design clássico de três faixas.", "titulo_pt": "Adidas acusa marca australiana White Fox de 'explorar sua reputação' com uso de design de quatro faixas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205071, "titulo": "Iranian stuntwomen breaking gender norms with daring feats", "url": "https://www.japantimes.co.jp/news/2026/10/09/world/society/iranian-stuntwomen/", "fonte_id": "japan_times", "data_pub": "2026-10-09T05:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nasrin Teymouri, treinadora e atriz de ação, lidera a única equipe de mulheres de atrizes de ação da Irã. As mulheres estão cada vez mais estabelecendo sua presença no campo de atrizes de ação.", "titulo_pt": "Ativistas iranianas de ação quebrando normas de gênero com ousadas performances", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 205073, "titulo": "Department store in Berlin to offer high-end Japanese rice on trial basis", "url": "https://www.japantimes.co.jp/business/2026/10/09/companies/germany-kadewe-japan-rice/", "fonte_id": "japan_times", "data_pub": "2026-10-09T05:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um supermercado em Berlim vai oferecer uma amostra de arroz de alta qualidade japonês. O objetivo do teste é aumentar a conscientização sobre o arroz japonês de qualidade, já que restaurantes japoneses na Alemanha frequentemente usam variedades não-japonesas.", "titulo_pt": "Supermercado em berlim oferecerá arroz de alta qualidade japonês em teste", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 204529, "titulo": "Quem tem tempo para votar?", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/djamila-ribeiro/2026/10/quem-tem-tempo-para-votar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-09T04:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Encerrado o primeiro turno das eleições nacionais, os analistas se concentraram nas razões para o não comparecimento de mais de 33 milhões de eleitores. O foco está na participação baixa da população eleitoral.", "titulo_pt": "Quem tem tempo para votar?", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 205243, "titulo": "‘Old-timey fascism was kept secret. Now you don’t have to hide it’: Martin McDonagh, John Malkovich and Sam Rockwell on Wild Horse Nine", "url": "https://www.theguardian.com/film/2026/oct/09/martin-mcdonagh-john-malkovich-sam-rockwell-interview-wild-horse-nine", "fonte_id": "guardian_culture", "data_pub": "2026-10-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Martin McDonagh dirigiu um filme recente com John Malkovich e Sam Rockwell interpretando agentes da CIA em 1973 em Easter Island. Durante as filmagens, Rockwell elogiou Malkovich, descrevendo-o como charmoso, perigoso e um dos melhores atores do mundo.", "titulo_pt": "Antigo fascismo era mantido em segredo. Agora você não precisa esconder: martin McDonagh, John Malkovich e Sam Rockwell sobre Wild Horse Nine", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 205247, "titulo": "‘Me and the lads would not survive a day in here’: inside TV’s utterly stunning, Bafta-winning prison drama", "url": "https://www.theguardian.com/tv-and-radio/2026/oct/09/time-series-three-jimmy-mcgovern-young-offender-institutions-bbc-one", "fonte_id": "guardian_culture", "data_pub": "2026-10-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A terceira temporada da série 'Time', de Jimmy McGovern, estrelada por David Tennant, pode ser a melhor de todas. A série segue a história em uma unidade de juventude (YOI) e retrata realidades difíceis enfrentadas por jovens infratores.", "titulo_pt": "'Eu e os rapazes não sobreviveríamos um dia aqui': dentro da impressionante e vencedora série de TV sobre prisões", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 204943, "titulo": "Paris officials seek to reduce the area under heritage protection in the capital", "url": "https://www.lemonde.fr/en/economy/article/2026/10/09/paris-officials-seek-to-reduce-the-area-under-heritage-protection-in-the-capital_6758408_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T02:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Paris, de esquerda, planeja revisar o alcance do que é considerado um 'Sítio de Patrimônio Notável', considerando-o atualmente como excessivamente amplo. Atualmente, ele inclui os primeiros sete arrondissements da capital, bem como partes de quatro outros.", "titulo_pt": "Autoridades parisienses buscam reduzir área protegida como patrimônio", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 204530, "titulo": "Nova versão de 'A Leste do Éden' é delicada e subversiva", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/lucianacoelho/2026/10/nova-versao-de-a-leste-do-eden-e-delicada-e-subversiva.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-09T02:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zoe Kazan foi desafiada a escrever a versão em minissérie de 'A Leste do Éden', uma saga familiar que abrange décadas cruciais da história norte-americana. Ela sabia que precisava superar duas sombras ao fazer essa adaptação.", "titulo_pt": "Nova versão de 'A Leste do Éden' é delicada e subversiva", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 205162, "titulo": "A New Mexico Community Was a Place to Build a Life. Then a Hypersonic Missile Factory Showed Up", "url": "https://www.wired.com/story/a-new-mexico-community-was-a-place-to-build-a-life-then-a-hypersonic-missile-factory-showed-up/", "fonte_id": "wired", "data_pub": "2026-10-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Castelion, uma empresa de tecnologia de defesa avançada, está construindo uma instalação em Rio Rancho Estates que documentos mostram poder representar um grave perigo de incêndio e exposição a químicos para as comunidades vizinhas.", "titulo_pt": "Um novo México era um lugar para construir uma vida. Então uma fábrica de mísseis hipersônicos chegou", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 205106, "titulo": "Polish police arrest teens over ‘Bloody Friday’ school attack threats", "url": "https://www.scmp.com/news/world/europe/article/3370335/polish-police-arrest-teens-over-bloody-friday-school-attack-threats?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polonês: policiais prendem jovens por ameaças relacionadas a ataques escolares. Autoridades buscam acalmar temores causados por rumores online de uma suposta 'Bloody Friday', após dois episódios de facada em dias consecutivos. As investigações policiais não encontraram evidências de um suposto desafio online.", "titulo_pt": "Polícia polonesa prende jovens por ameaças de ataques escolares", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 204614, "titulo": "Chile declara calamidade pública após deslizamento de terra em Santiago", "url": "https://www.metropoles.com/mundo/chile-declara-calamidade-publica-apos-deslizamento-de-terra-em-santiago", "fonte_id": "metropoles", "data_pub": "2026-10-09T08:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Chile declarou calamidade pública em resposta a um deslizamento de terra que afetou dezenas de casas na região de Santiago após fortes chuvas.", "titulo_pt": "Chile declara calamidade pública após deslizamento de terra em Santiago", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204615, "titulo": "Amor bandido: saiba funções do casal que chefiava o \"Império da Hilux\"", "url": "https://www.metropoles.com/distrito-federal/na-mira/amor-bandido-saiba-funcoes-do-casal-que-chefiava-o-imperio-da-hilux", "fonte_id": "metropoles", "data_pub": "2026-10-09T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O casal, liderado por Anderson Rodrigues, estava envolvido no furto de veículos. Anderson era responsável por abrir e furtar os carros, enquanto sua parceira recebia os valores provenientes dos delitos.", "titulo_pt": "Amor bandido: saiba funções do casal que chefiava o 'Império da Hilux'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 205119, "titulo": "Spirit of Hong Kong Awards: youth-led charity supports young cancer patients", "url": "https://www.scmp.com/news/hong-kong/society/article/3370231/spirit-hong-kong-awards-youth-led-charity-supports-young-cancer-patients?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Timothy Chan Chi-fung, de 19 anos, fundou a Youth Cancer Hong Kong após ser diagnosticado com um tumor testicular e enfrentar um sistema hospitalar inadequado. Sua iniciativa o fez ser finalista na categoria comunitária dos Spirit of Hong Kong Awards.", "titulo_pt": "Prêmio spirit of Hong Kong: caridade liderada por jovens apoia pacientes jovens com câncer", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 205125, "titulo": "Over 160,000 Hongkongers register for ‘joint clearance’ ahead of Huanggang Port opening", "url": "https://www.scmp.com/news/hong-kong/society/article/3370264/hong-kong-shenzhen-confirm-huanggang-port-open-monday?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T03:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 160 mil residentes de Hong Kong já se registraram para usar o canal de 'joint clearance' antes do reabastecimento do porto de Huanggang, que abrirá na próxima segunda-feira. Para garantir um funcionamento suave, a Secretaria de Segurança de Hong Kong ativou seu Centro de Monitoramento e Suporte Emergencial e estabeleceu um centro de comando conjunto com as autoridades de Shenzhen.", "titulo_pt": "Mais de 160 mil residentes de hong kong se registram para canal de 'joint clearance' antes do reabastecimento do porto de Huanggang", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 205185, "titulo": "Over 200 food safety violations occurred at state-certified eateries: report", "url": "https://www.koreaherald.com/article/10897726", "fonte_id": "korea_herald", "data_pub": "2026-10-09T01:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório mostrou que 223 estabelecimentos certificados pelo governo por suas boas práticas de higiene sanitária violaram a Lei de Higiene Alimentar no ano anterior. O número de infrações tem aumentado ano a ano, tendo diminuído para 58 em 2023, mas subindo novamente para 138 em 2024.", "titulo_pt": "Mais de 200 infrações de segurança alimentar ocorreram em estabelecimentos certificados pelo governo: relatório", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 204828, "titulo": "Tras aluvión en Las Condes se decreta alerta roja en 10 comunas de la RM; victimización cae casi dos puntos según Paz Ciudadana, y Contraloría detecta a 37 médicos que recetaron fentanilo irregularmente", "url": "https://www.ciperchile.cl/2026/10/08/radar-08-10-2026/?utm_source=rss&utm_medium=rss&utm_campaign=radar-08-10-2026", "fonte_id": "ciper_chile", "data_pub": "2026-10-08T23:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A região metropolitana de Santiago deu início a uma alerta vermelho em 10 comunas após uma aluvão em Las Condes. Além disso, a victimização caiu quase dois pontos percentuais de acordo com a Paz Ciudadana, e a Contraloria identificou 37 médicos que recetaram fentanilo de forma irregular.", "titulo_pt": "Depois de aluvão em Las Condes, região metropolitana de santiago decreta alerta vermelho em 10 comunas; victimização cai e médicos são flagrados com prescrição irregular de fentanilo", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 203954, "titulo": "Conselho de Medicina concede carteira póstuma a estudante morto por PMs", "url": "https://www.metropoles.com/sao-paulo/conselho-de-medicina-concede-carteira-postuma-a-estudante-morto-por-pms", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudante de medicina Marco Aurélio Cardenas Acosta foi morto por um policial militar em novembro de 2024. O Conselho de Medicina concedeu uma carteira póstuma a ele.", "titulo_pt": "Conselho de Medicina concede carteira póstuma a estudante morto por PMs", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203936, "titulo": "A exigência da Liga das Escolas de Samba que pode mexer com os direitos do consumidores no RJ", "url": "https://veja.abril.com.br/brasil/a-exigencia-da-liga-das-escolas-de-samba-que-pode-mexer-com-os-direitos-do-consumidores-no-rj/", "fonte_id": "veja", "data_pub": "2026-10-08T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Defesa do Consumidor da Assembleia Legislativa do Rio de Janeiro (Alerj) vai enviar um ofício à direção da Liesa e Ticketmaster solicitando uma alternativa. Isso pode afetar os direitos dos consumidores no estado.", "titulo_pt": "Requerimento da comissão de defesa do consumidor da alerj pode impactar direitos dos consumidores no rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 204121, "titulo": "Grabois cruzó a Pettovello por las denuncias contra estudiantes: “Fanática de los desacatamientos judiciales”", "url": "https://www.lanacion.com.ar/politica/grabois-cruzo-a-pettovello-por-las-denuncias-contra-estudiantes-que-protestaron-en-el-palacio-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dirigente social cuestionou a atitude de denunciar uma manifestação pacífica de estudantes que se cansaram de problemas nas universidades. Pettovello, supostamente, foi criticado por querer acusar judicialmente os jovens.", "titulo_pt": "Grabois criticou Pettovello por querer denunciar estudantes pacíficos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 204001, "titulo": "Homem usa metralhadora para destruir caminhão após briga de trânsito no PA", "url": "https://www.cnnbrasil.com.br/nacional/norte/pa/homem-usa-metralhadora-para-destruir-caminhao-apos-briga-de-transito-no-pa/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi filmado destruindo os faróis de um caminhão com uma metralhadora e ameaçando o motorista em um pedágio no Pará. A Polícia Civil está investigando o caso.", "titulo_pt": "Suspeito destrói caminhão com metralhadora após briga de trânsito no PA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203967, "titulo": "Homem é condenado a 345 anos por estupro de familiares em Minas", "url": "https://www.metropoles.com/minas-gerais/homem-e-condenado-a-345-anos-por-estupro-de-familiares-em-minas", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi condenado a 345 anos de prisão por estuprar familiares em Minas Gerais. A esposa dele, que era também a mãe e madrasta das vítimas, foi condenada a 90 anos por omissão e por não ter impedido os abusos ocorridos em sua casa.", "titulo_pt": "Homem é condenado a 345 anos por estupro de familiares em Minas; esposa condenada a 90 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203944, "titulo": "Filha de Neymar é alvo de ataques nas redes e mãe fala em Justiça", "url": "https://veja.abril.com.br/cultura/filha-de-neymar-e-alvo-de-ataques-nas-redes-e-mae-fala-em-justica/", "fonte_id": "veja", "data_pub": "2026-10-08T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A filha de 2 anos de Neymar, Helena, está sendo alvo de ataques nas redes sociais. A mãe da criança afirmou que buscará justiça.", "titulo_pt": "Filha de Neymar é alvo de ataques nas redes e mãe fala em Justiça", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 204015, "titulo": "Estudante morto por PM recebe carteira profissional de médico póstuma em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/estudante-morto-por-pm-recebe-carteira-profissional-de-medico-postuma-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marco Aurélio Cardenas Acosta, um estudante, foi baleado por um policial militar em um hotel na Vila Mariana em 20 de novembro de 2024. Após sua morte, foi concedida uma carteira profissional de médico póstuma em São Paulo.", "titulo_pt": "Estudante morto por PM recebe carteira profissional de médico póstuma em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203975, "titulo": "Morte de idosa despejada aos 87 anos vira símbolo de luta por moradia na Espanha; direita rejeita medidas para conter crise habitacional", "url": "https://www.brasildefato.com.br/2026/10/08/morte-de-idosa-despejada-aos-87-anos-vira-simbolo-de-luta-por-moradia-na-espanha-direita-rejeita-medidas-para-conter-crise-habitacional/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-08T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A morte de María del Carmen Abascal, uma idosa de 87 anos despejada, se tornou um símbolo de luta por moradia na Espanha. Ela havia sido removida de seu apartamento em Madri em 23 de setembro. A morte dela intensificou mobilizações contra a crise habitacional no país, rejeitadas pela direita política.", "titulo_pt": "Morte de idosa despejada aos 87 anos vira símbolo de luta por moradia na Espanha; direita rejeita medidas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 204606, "titulo": "Clima: calor predomina no Sudeste e Sul tem risco de temporais nesta 6ª", "url": "https://www.metropoles.com/brasil/clima-calor-predomina-no-sudeste-e-sul-tem-risco-de-temporais-nesta-6a", "fonte_id": "metropoles", "data_pub": "2026-10-09T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A previsão indica temperaturas elevadas em grande parte do Brasil, com risco de chuva forte, rajadas de vento e possibilidade de granizo no Sul.", "titulo_pt": "Clima: calor predomina no Sudeste e risco de temporais no Sul nesta sexta-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 205063, "titulo": "Walking through flames: Orangutan rescued in Indonesia fires", "url": "https://www.japantimes.co.jp/environment/2026/10/09/wildlife/indonesia-fire-orangutan-rescue/", "fonte_id": "japan_times", "data_pub": "2026-10-09T07:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Múltiplas orangotangos foram resgatados de incêndios florestais que estão queimando áreas de Sumatra e Borneo nos últimos meses.", "titulo_pt": "Perfurando o fogo: orangotangos resgatados nas chamas da indonésia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 204980, "titulo": "Chile: Santiago flooding turns streets to rivers as Kast declares state of catastrophe", "url": "https://www.euronews.com/video/2026/10/09/chile-santiago-flooding-turns-streets-to-rivers-as-kast-declares-state-of-catastrophe", "fonte_id": "euronews", "data_pub": "2026-10-09T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças de chuva torrencial causaram alagamentos severos em Santiago, Chile, deixando casas, clínicas e prédios da universidade submersos.", "titulo_pt": "Chile: santiago em alagamentos extensos após Kast decretar estado de catástrofe", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205238, "titulo": "Factcheck: UK Conservatives double the ‘cost of net-zero’ after spreadsheet blunder", "url": "https://www.carbonbrief.org/factcheck-uk-conservatives-double-the-cost-of-net-zero-after-spreadsheet-blunder", "fonte_id": "carbon_brief", "data_pub": "2026-10-09T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um panfleto publicado pelo partido de oposição Conservador do Reino Unido inclui um 'custo do neto-zero' que parece ter sido duplicado devido a um erro de planilha.", "titulo_pt": "Verificação de fatos: conservadores do reino unido dobram o 'custo do neto-zero' após erro de planilha", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 205087, "titulo": "Stench from Bosnia’s Ramici Landfill Indicates Mounting Waste Challenges", "url": "https://balkaninsight.com/2026/10/09/stench-from-bosnias-ramici-landfill-indicates-mounting-waste-challenges/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-09T05:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aterro sanitário de Ramici, próximo à cidade norte-bósnica de Banja Luka, está cheio e cheiroso, representando um perigo iminente, segundo relatos locais.", "titulo_pt": "Cheiro do aterro de Ramici na bósnia indica desafios ambientais acumulados", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 204987, "titulo": "Six injured as heavy rains batter Chile's capital, sweeping away cars and flooding homes", "url": "https://www.euronews.com/2026/10/09/six-injured-as-heavy-rains-batter-chiles-capital-sweeping-away-cars-and-flooding-homes", "fonte_id": "euronews", "data_pub": "2026-10-09T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis pessoas ficaram feridas devido a fortes chuvas na capital do Chile, que também causaram alagamentos e levaram carros embora. Autoridades colocaram outras 10 regiões chilenas em alerta elevado devido a riscos de deslizamentos de terra e emergências relacionadas com as chuvas.", "titulo_pt": "Seis feridos em fortes chuvas na capital do Chile, com riscos de deslizamentos de terra", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 204990, "titulo": "Deadly floods sweep Albania and Montenegro as rivers burst banks", "url": "https://www.euronews.com/video/2026/10/09/deadly-floods-sweep-albania-and-montenegro-as-rivers-burst-banks", "fonte_id": "euronews", "data_pub": "2026-10-08T22:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Áreas residenciais, estradas e campos foram inundados em Albania e Montenegro devido às fortes chuvas e neve. Os dois países ainda enfrentavam inundações severas na quinta-feira, 8 de janeiro.", "titulo_pt": "Inundações devastam albânia e Montenegro após dias de chuva torrencial e neve", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 204107, "titulo": "Leonardo DiCaprio compró una isla en Belice para salvar su ecosistema y restauró 104 hectáreas de vegetación nativa", "url": "https://www.lanacion.com.ar/espectaculos/leonardo-dicaprio-compro-una-isla-en-belice-para-salvar-su-ecosistema-y-restauro-104-hectareas-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ator americano Leonardo DiCaprio adquiriu uma ilha em Belice por 1,75 milhões de dólares com o objetivo de recuperar sua biodiversidade e desenvolver um complexo turístico sustentável. Ele restaurou 104 hectares de vegetação nativa na ilha Blackadore Caye.", "titulo_pt": "Leonardo DiCaprio compra ilha em Belice para preservar ecológico e desenvolver turismo sustentável", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 204120, "titulo": "Una fuerte correntada arrastró autos y micros tras el desborde de un canal en Chile", "url": "https://www.lanacion.com.ar/el-mundo/una-fuerte-correntada-arrastro-autos-y-micros-tras-el-desborde-de-un-canal-en-chile-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T21:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um forte correntezão arrastou carros e microônibus após o desbordamento de um canal em Las Condes, na Região Metropolitana de Santiago, Chile. O fenômeno foi registrado em vídeo pelos moradores locais.", "titulo_pt": "Correntezão arrasta veículos após desbordamento de canal em las condes, Chile", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203832, "titulo": "Desafio do clima entra no radar europeu, e isso afeta o Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/10/desafio-do-clima-entra-no-radar-europeu-e-isso-afeta-o-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A safra de verão na União Europeia não atingiu as expectativas devido ao calor intenso, seca e perda de umidade do solo, resultando em uma produção menor. Esses eventos climáticos são considerados parte de novos riscos que devem ser estudados com mais atenção, afetando não apenas a Europa, mas também o Brasil.", "titulo_pt": "Desafio do clima entra no radar europeu e afeta o Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 204103, "titulo": "Aluvión en Santiago de Chile: las calles se convirtieron en ríos y el barro arrastró autos y colectivos", "url": "https://www.clarin.com/mundo/aluvion-santiago-chile-calles-convirtieron-rios-barro-arrastro-autos-colectivos_0_OLmtNNtS7s.html", "fonte_id": "clarin", "data_pub": "2026-10-08T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Houve uma aluvão em Santiago, Chile, devido a fortes chuvas que desbordaram uma quebrada. O Corpo de Bomberos de Santiago decretou acuartelamento geral de suas equipes.", "titulo_pt": "Aluvão em Santiago de Chile: ruas se transformaram em rios e barro arrastou veículos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 203096, "titulo": "Miden 13 cm y pesan casi un kilo: Gendarmería recuperó seis huevos de ñandú que iban escondidos de forma ilegal debajo del asiento de un auto en la Patagonia", "url": "https://www.lanacion.com.ar/sociedad/miden-13-cm-y-pesan-casi-un-kilo-gendarmeria-recupero-seis-huevos-de-nandu-que-iban-escondidos-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram recuperados seis ovos de ñandú, medindo 13 centímetros e pesando quase um quilograma cada, escondidos ilegalmente debaixo do assento de um carro na Patagonia. O responsável foi investigado de acordo com a lei de fauna, pois o ñandú é uma ave ameaçada.", "titulo_pt": "Medem 13 cm e pesam quase um kilo: gendarmeria recupera seis ovos de ñandú escondidos ilegalmente embaixo do assento de um carro na Patagonia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202985, "titulo": "“Oceano mais quente que já medimos”: Agência da ONU alerta para um dos El Niño mais fortes da história", "url": "https://www.cnnbrasil.com.br/ciencia/oceano-mais-quente-que-ja-medimos-agencia-da-onu-alerta-para-um-dos-el-nino-mais-fortes-da-historia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência da ONU registrou o pico do El Niño em dezembro de 2026, com temperaturas marítimas recordes. Os efeitos intensificados deste fenômeno devem persistir até fevereiro de 2027.", "titulo_pt": "Oceano mais quente que já medimos: agência da ONU alerta para o El Niño mais forte da história", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203230, "titulo": "Seychelles giant tortoise numbers hit record 180,000 in conservation triumph", "url": "https://www.theguardian.com/environment/2026/oct/08/researchers-find-180000-giant-tortoises-living-on-island-in-seychelles", "fonte_id": "guardian_world", "data_pub": "2026-10-08T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população de tartarugas gigantes de Aldabra, na ilha de Aldabra, Seychelles, atingiu um recorde de 180.000 animais, resultado de um programa de recuperação que durou décadas. Essa espécie, uma vez em perigo de extinção, está prosperando em um atol do Oceano Índico.", "titulo_pt": "Números de tartarugas gigantes de aldabra atingem recorde de 180.000 no triunfo da conservação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 202926, "titulo": "Vinícola Aurora conquista selo Carbon Free e levará novidade a 220 produtos", "url": "https://veja.abril.com.br/economia/vinicola-aurora-conquista-selo-carbon-free-e-levara-novidade-a-220-produtos/", "fonte_id": "veja", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vinícola Aurora, maior cooperativa vinícola do Brasil, conquistou o selo Carbon Free e planeja incorporar essa certificação ambiental aos rótulos de seus produtos. A empresa gerou faturamento de R$ 874,8 milhões em 2025.", "titulo_pt": "Vinícola Aurora conquista selo Carbon Free e levará novidade a 220 produtos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 202999, "titulo": "MP denuncia ex-secretária de Meio Ambiente por desmatamento irregular no RN", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/rn/mp-denuncia-ex-secretaria-de-meio-ambiente-por-desmatamento-irregular-no-rn/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-secretária de Meio Ambiente foi denunciada pelo Ministério Público por desmatamento irregular em uma área protegida de Mata Atlântica no Rio Grande do Norte. A área devastada era equivalente a 30 campos de futebol e foi usada para a construção de um loteamento e um centro comercial.", "titulo_pt": "MP denuncia ex-secretária de Meio Ambiente por desmatamento irregular no RN", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 204714, "titulo": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "url": "https://exame.com/mundo/quem-sao-as-21-mulheres-que-ja-ganharam-o-premio-nobel-da-paz/", "fonte_id": "exame", "data_pub": "2026-10-09T06:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay se tornou a 21ª mulher a ganhar o Prêmio Nobel da Paz. A lista de mulheres vencedoras começa em 1905, com a austríaca Bertha von Suttner.", "titulo_pt": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204839, "titulo": "Egyptian journalists plan weekend protest over detention of six colleagues", "url": "https://www.theguardian.com/global-development/2026/oct/09/egypt-six-journalists-matsadaash-protest-over-detentions", "fonte_id": "guardian_world", "data_pub": "2026-10-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jornalistas do Egito planejam uma nova protesto no fim de semana em Cairo após seis de seus colegas serem acusados de terrorismo e terem sido presos por supostamente trabalhar para o Irmão Muçulmano. Os funcionários do Matsadaash afirmam ter sofrido tortura e confissões forçadas durante a detenção.", "titulo_pt": "Jornalistas egípcios planejam protesto no fim de semana por detenção de seis colegas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205029, "titulo": "Christa Pike case underscores prevalence of botched executions in US", "url": "https://www.aljazeera.com/news/2026/10/9/christa-pike-case-underscores-prevalence-of-botched-executions-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que métodos como a injeção letal prometem uma forma mais humana de execução, mas são frequentemente comprometidos por erros. O caso de Christa Pike ilustra a prevalência de execuções mal-sucedidas nos Estados Unidos.", "titulo_pt": "Caso christa Pike evidencia a prevalência de execuções mal-sucedidas nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205184, "titulo": "Indian man alleges abuse by Korean immigration officers during deportation", "url": "https://www.koreaherald.com/article/10897732", "fonte_id": "korea_herald", "data_pub": "2026-10-09T02:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cidadão indiano acusa agentes de imigração de terem cometido abuso físico nele durante sua deportação, incluindo o uso de fita adesiva para cobrir a boca e sufocá-lo, conforme revelado por um parlamentar. O caso foi apresentado à Comissão Nacional de Direitos Humanos da Coreia.", "titulo_pt": "Indianos acusam agentes de imigração de abuso durante deportação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 203589, "titulo": "Laws inadequate to fight transnational repression: MAC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/09/2003865663", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comando de Operações de Inteligência (MAC) afirmou que as leis atuais são insuficientes para combater a repressão transnacional. A instituição destacou a necessidade de reformas legais mais robustas.", "titulo_pt": "Leis insuficientes para combater repressão transnacional, afirma MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 204347, "titulo": "Hong Kong rejects US downgrade to lowest tier in human trafficking report", "url": "https://www.scmp.com/news/china/diplomacy/article/3370244/hong-kong-rejects-us-downgrade-lowest-tier-human-trafficking-report?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório anual do Tráfico de Pessoas do Departamento de Estado dos Estados Unidos classificou Hong Kong como o nível mais baixo, Tier 3, rebaixando-o da lista de observação Tier 2 Watch List. A cidade rejeitou essa avaliação, considerando-a 'completamente infundada'.", "titulo_pt": "Hong Kong rejeita rebaixamento dos estados unidos no relatório anual sobre tráfico de pessoas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 203957, "titulo": "\"Meter fogo nos isolados\": militar ex-Funai é condenado a pagar R$ 100 mil", "url": "https://www.metropoles.com/brasil/meter-fogo-nos-isolados-militar-ex-funai-e-condenado-a-pagar-r-100-mil", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-militar da Funai foi condenado a pagar R$ 100 mil. Áudios mostraram que ele incentivava a violência contra os indígenas em território protegido pela Constituição Federal.", "titulo_pt": "Meter fogo nos isolados: militar ex-funai é condenado a pagar R$ 100 mil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204100, "titulo": "La Corte Suprema y una decisión clave sobre la figura del femicidio", "url": "https://www.clarin.com/opinion/corte-suprema-decision-clave-figura-femicidio_0_yDKRgm8ah3.html", "fonte_id": "clarin", "data_pub": "2026-10-08T21:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema deve decidir se é necessária uma relação de parceiro ou histórico de violência para qualificar um assassinato como femicídio. O caso de Julieta González reaviva o debate sobre como julgar crimes motivados por gênero.", "titulo_pt": "A Corte Suprema e uma decisão crucial sobre a figura do femicídio", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 204880, "titulo": "A Raid on a Gay Bar Risks Taiwan’s LGBTQ-Friendly Reputation", "url": "https://thediplomat.com/2026/10/a-raid-on-a-gay-bar-risks-taiwans-lgbtq-friendly-reputation/", "fonte_id": "the_diplomat", "data_pub": "2026-10-08T19:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado afirma que as autoridades ultrapassaram os limites legais, e ativistas alertam para possíveis discriminações antes do maior evento de orgulho LGBTQ+ da Ásia.", "titulo_pt": "Um raio em um Bar Gay pode ameaçar a boa Reputation de Taiwan para a comunidade lgbtq+", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 202949, "titulo": "Valdemar se refere a gays como \"essa gente\" e deputado reage: \"LGBTfobia\"", "url": "https://www.metropoles.com/colunas/grande-angular/valdemar-se-refere-a-gays-como-essa-gente-e-deputado-reage-lgbtfobia", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Fábio Felix (PSol) reagiu a uma declaração do presidente nacional do Partido Liberal (PL), Valdemar Costa Neto, em que este se referiu aos gays como \"essa gente\". A reação do parlamentar foi classificada como uma resposta à LGBTfobia.", "titulo_pt": "Deputado reage a valdemar costa neto, que se referiu a gays como 'essa gente'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203102, "titulo": "Suspensión confirmada: un juez falla a favor de inmigrantes que recibían multas de hasta US$1,8 millones", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/suspension-confirmada-un-juez-falla-a-favor-de-inmigrantes-que-recibian-multas-de-hasta-us18-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um juiz confirmou a suspensão do mecanismo de multas a imigrantes que podiam ser cobrados até US$1,8 milhão. O juiz decidiu a favor dos imigrantes, suspendendo temporariamente o sistema de sanciones.", "titulo_pt": "Suspensão confirmada: juiz decide a favor de imigrantes com multas de até US$1,8 milhões", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203103, "titulo": "Juicio por la muerte de Maradona: fue la “internación más deficiente y temeraria de todos los tiempos”, sostuvo la acusación oficial", "url": "https://www.lanacion.com.ar/seguridad/juicio-por-la-muerte-de-maradona-fue-la-internacion-mas-deficiente-y-temeraria-de-todos-los-tiempos-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os fiscais generais adjuntos de San Isidro, Patricio Ferrari e Cosme Iribarren, apresentaram seus argumentos perante o tribunal no processo relacionado à morte de Maradona. Eles afirmaram que a internação médica foi a 'mais deficiente e temerária de todos os tempos'.", "titulo_pt": "Julgamento da morte de Maradona: internação foi 'a mais deficiente e temerária de todos os tempos', afirma acusação oficial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202896, "titulo": "EUA apresenta nova acusação contra Maduro e sua esposa por tortura", "url": "https://www.cartacapital.com.br/cartaexpressa/eua-apresentam-nova-acusacao-contra-maduro-e-sua-esposa-por-tortura/", "fonte_id": "cartacapital", "data_pub": "2026-10-08T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os EUA apresentaram novas acusações contra Maduro e sua esposa por tortura. Além disso, Maduro e Flores foram acusados de narcotráfico e tráfico de armas após serem capturados em uma operação militar em Caracas no dia 3 de janeiro.", "titulo_pt": "EUA apresenta nova acusação contra Maduro e sua esposa por tortura", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 203342, "titulo": "Nicolás Maduro and his wife hit with fresh torture charge", "url": "https://www.axios.com/2026/10/08/maduro-torture-charges-court-case", "fonte_id": "axios", "data_pub": "2026-10-08T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nicolás Maduro e sua esposa foram acusados de organizar tortura de pessoas detidas pelo regime venezuelano. Essas novas acusações foram anuncias em um novo mandado de prisão, acrescentando a acusações anteriores de narcoterrorismo.", "titulo_pt": "Maduro e sua esposa são acusados de novas acusações de tortura", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 203562, "titulo": "Is the Philippines using new anti-spying laws to silence critics?", "url": "https://www.scmp.com/week-asia/politics/article/3370221/philippines-using-new-anti-spying-laws-silence-critics?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto de lei filipino que expande a lei de espionagem do país para incluir atividades de tempo de paz está levantando preocupações entre jornalistas e especialistas em direito, que alertam que suas disposições amplas podem silenciar a livre expressão e limitar a fiscalização pública de questões nacionais. O projeto foi aprovado pela Câmara dos Representantes em 17 de setembro.", "titulo_pt": "Filipinas está usando novas leis antiespionagem para silenciar críticos?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 202225, "titulo": "Chicas desnudadas con IA: otro caso reaviva el debate sobre la violencia digital y los límites legales para castigarla", "url": "https://www.lanacion.com.ar/sociedad/chicas-desnudadas-con-ia-otro-caso-reaviva-el-debate-sobre-la-violencia-digital-y-los-limites-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "13% dos jovens conhecem casos de violência digital envolvendo a utilização de inteligência artificial para desnudamento em seu ambiente escolar. Eles pedem ao Congresso a tipificação específica deste delito para melhor combate.", "titulo_pt": "Meninas desnudadas com IA: caso reaviva debate sobre violência digital e limites legais", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 205204, "fonte_id": "phys_org", "titulo": "Walking through flames: Orangutans rescued in Indonesia fires", "url": "https://phys.org/news/2026-10-flames-orangutans-indonesia.html", "data_pub": "2026-10-09T10:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "Perfumando-se nas chamas: orangutães resgatados durante as queimadas na indonésia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205232, "fonte_id": "tech_eu", "titulo": "Nvidia defends open source AI alliance, saying hun          ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
