", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/10/usa-incriminano-tre-agenti-iraniani-per-lattacco-fallito-a-base-aerea_b1c8b119-554a-4f24-bfe7-576eb529c144.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-10T21:07:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Justiça americano acusa três agentes iranianos de terem planejado um ataque fallido a uma base aérea nos Estados Unidos, com Mohammad Dawood Al-Saadi supostamente coordenando o plano desde a prisão em Nova York.", "titulo_pt": "EUA acusam três agentes iranianos por tentativa de ataque a base aérea", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 255736, "titulo": "Nvidia hires major New York law firm to investigate Jensen Huang affair", "url": "https://www.bbc.co.uk/news/articles/ck1wvwwl3x0go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-10T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia contratou uma importante firma de advocacia de Nova York para investigar o affair de Jensen Huang com uma mulher suspeita de ser espía chinesa.", "titulo_pt": "Nvidia contrata importante firma de advocacia de nova York para investigar affair de Jensen Huang", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 255600, "titulo": "Thomas Markle se corta la pulsera electrónica de vigilancia y la jueza decide meterlo en prisión sin fianza", "url": "https://elpais.com/us/entretenimiento/2026-11-10/thomas-markle-se-corta-la-pulsera-electronica-de-vigilancia-y-el-fiscal-exige-que-ingrese-en-prision.html", "fonte_id": "elpais_america", "data_pub": "2026-11-10T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Thomas Markle, pai da duquesa de Sussex, foi arrestado em Florida acusado de posse de pornografia infantil. A justiça decidiu revogar sua liberdade condicional sem fiança.", "titulo_pt": "Thomas Markle tem prisão preventiva decretada após se cortar a pulseira eletrônica", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 255633, "titulo": "No Good Choices on Iran", "url": "https://www.nytimes.com/2026/11/10/world/iran-trump-war-hegseth-impeach.html", "fonte_id": "nyt_world", "data_pub": "2026-11-10T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os principais auxiliares de Trump estão em conflito sobre uma estratégia para encerrar a guerra, enquanto o governo considera escalada, ataques mais limitados e diplomacia.", "titulo_pt": "Sem boas opções em relação ao Irã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 255814, "titulo": "L'ex Br Leonardo Bertulazzi scappa dai domiciliari a Buenos Aires", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/10/lex-br-leonardo-bertulazzi-scappa-dai-domiciliari-a-buenos-aires_5268ff63-0eb4-449b-b796-a7b72f9736e9.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-10T21:04:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A polícia argentina iniciou uma busca pelo ex-BR Leonardo Bertulazzi, que fugiu dos domiciliários em Buenos Aires.", "titulo_pt": "Ex-br Leonardo Bertulazzi entra em fuga em Buenos Aires", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 255811, "titulo": "Republicans choose Jim Jordan as House minority leader", "url": "https://www.ft.com/content/438a36a5-a711-4fe1-b3d8-83020197a0ed?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O republicano Jim Jordan foi escolhido como líder minoritário da Câmara dos Representantes. Isso indica uma postura intransigente, apesar do desempenho ruim da sua própria partido nas eleições médias americanas.", "titulo_pt": "Republicanos escolhem Jim Jordan como líder minoritário da câmara", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [{"titulo": "Soldado sênior dos EUA detido no reino unido suspeito de espionar para a Rússia", "sumario": "Um oficial militar sênior dos Estados Unidos foi detido no Reino Unido sob suspeita de espionagem para a Rússia. Um homem de 41 anos, não identificado, foi preso no Reino Unido sob suspeita de espionar pela Rússia. Um suspeito de 41 anos, que era responsável por informações sensíveis, foi preso no Reino Unido sob suspeita de espionagem em favor da Rússia.", "artigos": [{"id": 255809, "titulo": "Senior US soldier arrested in UK on suspicion of spying for Russia", "url": "https://www.ft.com/content/94aa4846-58c6-4c17-b25a-095f122b4809?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T21:38:00Z", "idioma": "en", "provavel_duplicata_de": 255768, "texto_pt": "Um oficial militar sênior dos Estados Unidos foi detido no Reino Unido sob suspeita de espionagem para a Rússia. A investigação da Polícia de Combate ao Terrorismo Britânica envolve o FBI e o exército americano.", "titulo_pt": "Soldado sênior dos EUA detido no reino unido suspeito de espionar para a Rússia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 255631, "titulo": "US Soldier Is Arrested in UK on Suspicion of Spying for Russia", "url": "https://www.nytimes.com/2026/11/10/world/europe/uk-us-army-arrest-espionage-russia.html", "fonte_id": "nyt_world", "data_pub": "2026-11-10T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 41 anos, não identificado, foi preso no Reino Unido sob suspeita de espionar pela Rússia. Ele está em custódia aguardando eventuais acusações após uma investigação conjunta entre a F.B.I. e a inteligência militar dos Estados Unidos.", "titulo_pt": "Soldado dos EUA é preso no reino unido suspeito de espionar para a Rússia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 255922, "titulo": "U.S. Army officer arrested in U.K. on suspicion of trying to steal secrets for Russia", "url": "https://www.washingtonpost.com/world/2026/11/10/us-army-officer-arrested-uk-suspicion-trying-steal-secrets-russia/", "fonte_id": "washington_post_world", "data_pub": "2026-11-10T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suspeito de 41 anos, que era responsável por informações sensíveis, foi preso no Reino Unido sob suspeita de espionagem em favor da Rússia.", "titulo_pt": "Tenente-coronel dos EUA preso no reino unido suspeito de tentar roubar segredos para a Rússia", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}]}], "economia": [{"id": 255406, "titulo": "Ibovespa cai 0,52% com inflação dos EUA e ata do Copom no radar", "url": "https://www.metropoles.com/brasil/ibovespa-cai-052-com-inflacao-dos-eua-e-ata-do-copom-no-radar", "fonte_id": "metropoles", "data_pub": "2026-11-10T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa teve uma queda de 0,52% devido à inflação nos Estados Unidos e à ata do Copom. O dólar comercial subiu 1,48% e encerrou o pregão cotado a R$ 5,58, o maior fechamento desde 2026.", "titulo_pt": "Ibovespa cai 0,52% e dólar avança 1,48%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 255505, "titulo": "Bolsas de NY caem com inflação forte nos EUA e Nvidia amplia queda da véspera", "url": "https://www.infomoney.com.br/mercados/bolsas-de-ny-caem-com-inflacao-nos-eua-reforcando-apostas-de-alta-de-juro-pelo-fed/", "fonte_id": "infomoney", "data_pub": "2026-11-10T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Nova York caíram, com o Dow Jones recuando 0,30%, o S&P 500 caindo 0,38% e o Nasdaq diminuindo 0,74%. A queda foi influenciada pela alta da inflação nos Estados Unidos e por uma continuidade da queda da ação da Nvidia.", "titulo_pt": "Bolsas de nova york caem com inflação alta e Nvidia mantém queda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 255506, "titulo": "Ibovespa ensaia 3ª alta, mas cai com receio sobre inflação e alta de juros nos EUA", "url": "https://www.infomoney.com.br/mercados/ibovespa-reduz-folego-com-inflacao-dos-eua-e-cai-apos-superar-173-mil-pontos/", "fonte_id": "infomoney", "data_pub": "2026-11-10T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa tentou registrar a terceira alta consecutiva, mas encerrou o dia em baixa devido às preocupações com a inflação e a possibilidade de aumento dos juros nos Estados Unidos. A temporada de resultados corporativos no Brasil e a ata do Copom também foram fatores de atenção para os investidores.", "titulo_pt": "Ibovespa tenta terceira alta, mas cai com temores sobre inflação e juros nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 255308, "titulo": "Parlamentares da Venezuela aprovam abertura do setor elétrico ao investimento privado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/parlamentares-da-venezuela-aprovam-abertura-do-setor-eletrico-ao-investimento-privado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares venezuelanos aprovaram uma reforma da lei nacional de eletricidade, permitindo a entrada de investimentos privados no setor após cerca de duas décadas de controle estatal.", "titulo_pt": "Parlamentares da Venezuela aprovam abertura do setor elétrico ao investimento privado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255621, "titulo": "STJ: aditivo a plano de recuperação judicial com menos de 15 dias anula assembleia de credores", "url": "https://www.jota.info/justica/stj-aditivo-a-plano-de-recuperacao-judicial-com-menos-de-15-dias-anula-assembleia-de-credores", "fonte_id": "jota", "data_pub": "2026-11-10T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um aditivo apresentado com menos de 15 dias de antecedência antes de uma assembleia de credores foi considerado inválido, anulando o procedimento. O complemento foi apresentado 30 minutos antes da reunião e trazia mudanças significativas.", "titulo_pt": "STJ: aditivo a plano de recuperação judicial com menos de 15 dias anula assembleia de credores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 255508, "titulo": "Ibovespa termina em queda, com inflação nos EUA e Copom; dólar dispara mais de 1%", "url": "https://www.infomoney.com.br/mercados/ibovespa-hoje-bolsa-de-valores-ao-vivo-10112026/", "fonte_id": "infomoney", "data_pub": "2026-11-10T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa encerrou em baixa devido à inflação nos EUA e à decisão do Copom, enquanto o dólar subiu mais de 1%. Os índices americanos terminaram negativos devido a uma inflação do consumidor superior às expectativas.", "titulo_pt": "Ibovespa termina em baixa, influenciado pela inflação nos EUA e decisão do Copom; dólar sobe mais de 1%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 255310, "titulo": "Após ataque hacker, agentes portuários usaram celulares para manter o Porto de Santos funcionando", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/apos-ataque-hacker-agentes-portuarios-usaram-celulares-para-manter-o-porto-de-santos-funcionando.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Porto de Santos teve quase suas operações interrompidas devido a uma queda de energia causada por um ataque hacker, mas conseguiu manter as atividades graças a um programa federal que permitiu que os agentes portuários utilizassem celulares.", "titulo_pt": "Porto de Santos quase parou de funcionar devido a ataque hacker, mas celulares salvaram operações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255312, "titulo": "Cacau Show diz que fim da escala 6x1 deve ter impacto menor que alta do cacau", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/cacau-show-diz-que-fim-da-escala-6x1-deve-ter-impacto-menor-que-alta-do-cacau.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cacau Show acredita que o fim da escala 6x1 terá um impacto financeiro menor do que a alta do preço do cacau registrado no início do ano. A empresa enfrentou um aumento significativo no custo da matéria-prima no início deste ano, próximo à Páscoa.", "titulo_pt": "Cacau Show afirma que fim da escala 6x1 terá impacto menor que alta do cacau", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255313, "titulo": "Com aquisição de Flora e Canal Rural, JBS quer reforçar ligação com varejo e produtores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/com-aquisicao-de-flora-e-canal-rural-jbs-quer-reforcar-ligacao-com-varejo-e-produtores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A JBS anunciou a aquisição da Flora e do Canal Rural, empresas da holding J&F, com o objetivo de fortalecer a relação com o varejo e produtores de animais. A empresa pretende reforçar essa ligação com os investidores.", "titulo_pt": "JBS adquire Flora e Canal Rural para fortalecer vínculo com varejo e produtores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255315, "titulo": "Itaú investe R$ 1,2 bilhão e vira sócio da Klabin em empreendimento florestal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/itau-investe-r-12-bilhao-e-vira-socio-da-klabin-em-mais-um-empreendimento-florestal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T19:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itaú investiu R$ 1,2 bilhão para se tornar sócio da Klabin na Bougainville Reflorestadora, uma SPE controlada pela companhia de papel e celulose.", "titulo_pt": "Itaú investe R$ 1,2 bilhão e vira sócio da Klabin em empreendimento florestal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255316, "titulo": "Dívida pública em reais não garante juros menores para o Brasil, diz Galípolo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/divida-publica-em-reais-nao-garante-juros-menores-para-o-brasil-diz-galipolo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Banco Central, Gabriel Galípolo, afirmou que a emissão da dívida pública em reais não elimina os riscos para os financiadores do governo nem garante juros menores.", "titulo_pt": "Dívida pública em reais não garante juros menores para o Brasil, diz Galípolo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255317, "titulo": "Programa de turismo da prefeitura de SP gera potencial de R$ 260 milhões em investimentos estrageiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/programa-de-turismo-da-prefeitura-de-sp-gera-potencial-de-r-260-milhoes-em-investimentos-estrageiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Discover SP, criado pela gestão do prefeito Ricardo Nunes para promover São Paulo no turismo global, gerou um potencial de R$ 260 milhões em investimentos estrangeiros para empresas da cidade.", "titulo_pt": "Programa de turismo de SP gera potencial de R$ 260 milhões em investimentos estrangeiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255319, "titulo": "WEG e FPT fazem parceria para motor elétrico com gerador a bordo de caminhão e ônibus", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/weg-e-fpt-fazem-parceria-para-motor-eletrico-com-gerador-a-bordo-de-caminhao-e-onibus.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T19:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A FPT, do grupo Iveco, e a WEG formaram uma parceria para desenvolver um motor elétrico para ônibus e caminhões alimentado por um gerador a bordo, que será impulsionado por etanol ou gás.", "titulo_pt": "FPT e WEG unem-se para motor elétrico com gerador a bordo em ônibus e caminhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255625, "titulo": "Envelhecimento, clima e IA ampliarão desafios do Estado sob aperto fiscal, projeta estudo", "url": "https://www.jota.info/executivo/envelhecimento-clima-e-ia-ampliarao-desafios-do-estado-sob-aperto-fiscal-projeta-estudo", "fonte_id": "jota", "data_pub": "2026-11-10T19:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo projeta que o envelhecimento da população, mudanças climáticas e avanços na inteligência artificial aumentarão os desafios para o Estado nos próximos anos, devido a restrições orçamentárias. O relatório do MGI e do PNUD analisa 400 indicadores de mudança em demografia, saúde, meio ambiente, tecnologia, trabalho e orçamento para a próxima década.", "titulo_pt": "Envelhecimento, clima e IA ampliarão desafios do Estado sob aperto fiscal, projeta estudo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 255321, "titulo": "Justiça manda União pagar seguro-desemprego a 22 trabalhadores resgatados pelo Ministério Público", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/justica-manda-uniao-pagar-seguro-desemprego-a-22-trabalhadores-resgatados-pelo-ministerio-publico.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trabalho determinou que a União pague seguro-desemprego a 22 trabalhadores rurais resgatados de condições análogas à escravidão em uma fazenda de Batatais. Serão pagas três parcelas de um salário mínimo de seguro-desemprego especial.", "titulo_pt": "Justiça determina que União pague seguro-desemprego a trabalhadores resgatados de condições análogas à escravidão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255325, "titulo": "Gestora do Nubank lança dois fundos de ações globais para se aproximar do investidor institucional", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/gestora-do-nubank-lanca-dois-fundos-de-acoes-globais-para-se-aproximar-do-investidor-institucional.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T18:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nu Asset Management, gestora do Nubank, lançou dois fundos de ações globais negociados em bolsa nesta terça-feira (10). Os fundos, VTBR11 e VTUS11, foram desenvolvidos em parceria com o fundo de pensão Real Grandeza, administrador de um patrimônio líquido de R$ 18,8 bilhões.", "titulo_pt": "Gestora do Nubank lança dois fundos de ações globais para se aproximar do investidor institucional", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 255823, "titulo": "PLA cybersecurity scientist Guo Shize removed from Chinese Academy of Sciences website", "url": "https://www.scmp.com/news/china/science/article/3373975/pla-cybersecurity-scientist-guo-shize-removed-chinese-academy-sciences-website", "fonte_id": "scmp", "data_pub": "2026-11-10T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Guo Shize, um cientista de segurança cibernética de 57 anos do Exército Popular da China, foi removido do site da Academia Chinesa de Ciências. Não se sabe quando sua página foi removida, mas a mudança foi notada pela mídia chinesa em um dia específico.", "titulo_pt": "Cientista de segurança cibernética do exército chinês, Guo Shize, removido do site da academia chinesa de ciências", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 255382, "titulo": "MEC estabelece regras para uso de inteligência artificial nas escolas", "url": "https://veja.abril.com.br/educacao/mec-estabelece-regras-para-uso-de-inteligencia-artificial-nas-escolas/", "fonte_id": "veja", "data_pub": "2026-11-10T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MEC estabeleceu regras para o uso de inteligência artificial em escolas, incluindo restrições sobre a correção automatizada de redações, o reconhecimento de emoções e o acesso sem supervisão.", "titulo_pt": "MEC define regras para uso de inteligência artificial nas escolas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 255845, "titulo": "Oura is acquiring medical AI chatbot startup Counsel Health", "url": "https://www.theverge.com/gadgets/1031284/oura-counsel-health-acquisition", "fonte_id": "the_verge", "data_pub": "2026-11-10T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Oura anunciou a aquisição da Counsel Health, uma startup de chatbots de inteligência artificial para cuidados primários de saúde, por 625 milhões de dólares. Antes da aquisição, o chatbot da Counsel Health já estava integrado na aplicação da Oura.", "titulo_pt": "Oura adquire startup de chatbot de inteligência artificial para cuidados primários de saúde", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 255398, "titulo": "Ataque hacker afeta sistemas da Autoridade Portuária de Santos", "url": "https://veja.abril.com.br/economia/ataque-hacker-afeta-sistemas-da-autoridade-portuaria-de-santos/", "fonte_id": "veja", "data_pub": "2026-11-10T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os sistemas da Autoridade Portuária de Santos foram afetados por um ataque hacker, com a internet e telefonia sendo restauradas após três dias, mas o site institucional e plataformas internas ainda permanecem indisponíveis.", "titulo_pt": "Ataque hacker afeta sistemas da Autoridade Portuária de Santos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 255810, "titulo": "US regulator postpones Wall Street push to trade AI computing futures", "url": "https://www.ft.com/content/269b0245-44c4-4e34-94df-202bef642539?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T19:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Commodity Futures Trading Commission adiou o esforço de Wall Street para negociar contratos futuros baseados no processamento de inteligência artificial devido às preocupações sobre manipulação de preços. As bolsas estão correndo para criar uma nova classe de ativos nesse campo.", "titulo_pt": "Regulador dos EUA adia esforço de Wall Street para negociar contratos futuros de processamento de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 255847, "titulo": "The PlayStation Plus PC app is shutting down next month", "url": "https://www.theverge.com/games/1031144/sony-playstation-plus-windows-pc-app-shutting-down", "fonte_id": "the_verge", "data_pub": "2026-11-10T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sony anunciará a encerramento da aplicação PlayStation Plus para PC em 10 de dezembro. O aplicativo permitia a transmissão de jogos para PC para assinantes Premium, mas poucos usuários a utilizavam.", "titulo_pt": "A aplicação PlayStation Plus para PC será encerrada em 10 de dezembro", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 255808, "titulo": "Nvidia hires former US prosecutor at Wachtell to lead Jensen Huang probe", "url": "https://www.ft.com/content/8d59bf02-960e-4eb1-b5dc-55397e31cea5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T19:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia contratou um ex-procurador federal para investigar o affair do CEO com uma suposta espiã chinesa. O investigador será o ex-cabo chefe do escritório de procuradores do distrito sul de Nova York.", "titulo_pt": "Nvidia contrata ex-procurador federal para investigar affair do ceo com suposta espiã chinesa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 255849, "titulo": "The US is winning the AI race. Jensen Huang could have blown it", "url": "https://www.theverge.com/ai-artificial-intelligence/1031063/jensen-huang-ai-race-us-china-spy", "fonte_id": "the_verge", "data_pub": "2026-11-10T19:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, é um alvo típico de espionagem devido à sua posição de liderança na tecnologia de inteligência artificial. A empresa dele é uma das mais valiosas do mundo e Huang mantém relações próximas com líderes políticos e empresariais.", "titulo_pt": "O EUA estão ganhando a corrida de IA. Jensen Huang poderia ter comprometido.", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 255885, "titulo": "Speech Processing Pioneer Bishnu Saroop Atal Dies at 93", "url": "https://spectrum.ieee.org/speech-processing-pioneer-in-memoriam", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-10T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bishnu Saroop Atal, um pioneiro em processamento de sinais e acústica, faleceu aos 93 anos em 19 de agosto. Sua pesquisa pioneira em técnicas de codificação de voz formou a base para a transmissão eficiente e de alta qualidade de voz por redes celulares.", "titulo_pt": "Pioneiro em processamento de sinais e acústica, Bishnu Saroop Atal, falece aos 93", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 255483, "titulo": "Brasil é o país mais atacado da América Latina e ainda não tem lei de cibersegurança", "url": "https://exame.com/brasil/brasil-e-o-pais-mais-atacado-da-america-latina-e-ainda-nao-tem-lei-de-ciberseguranca/", "fonte_id": "exame", "data_pub": "2026-11-10T18:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil é o país mais atacado da América Latina em termos de cibersegurança e não possui uma lei específica e unificada sobre o assunto. Isso resulta em altos índices de roubo de dados e sequestro de sistemas, tornando empresas e o governo alvos fáceis de ataques cibernéticos.", "titulo_pt": "Brasil é o país mais atacado da América Latina e ainda não tem lei de cibersegurança", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 255853, "titulo": "ChatGPT is getting verified AI ‘Business Agents’", "url": "https://www.theverge.com/ai-artificial-intelligence/1030552/openai-chatgpt-business-agents-hub", "fonte_id": "the_verge", "data_pub": "2026-11-10T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ChatGPT permitirá que os usuários conversem com agentes de negócios verificados que representam marcas para auxiliar em tarefas como comparação de preços. A funcionalidade, disponível inicialmente para empresas elegíveis de comércio eletrônico e serviços online nos Estados Unidos, está sendo lançada como parte de uma suite de recursos focados em negócios no beta.", "titulo_pt": "Chatgpt terá agentes de negócios verificados para auxiliar na comparação de preços", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 255486, "titulo": "Dell Technologies mostra como transformar projetos de IA em resultados concretos", "url": "https://exame.com/tecnologia/dell-technologies-forum-brasil-2026-inteligencia-artificial/", "fonte_id": "exame", "data_pub": "2026-11-10T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dell Technologies realizou um evento em São Paulo onde reuniu milhares de executivos, clientes e especialistas para discutir como aplicar a inteligência artificial em escala.", "titulo_pt": "Dell Technologies demonstra como transformar projetos de IA em resultados concretos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 254948, "titulo": "After fridge hacks, home appliances could be next, EU cyber chief warns", "url": "https://www.scmp.com/news/world/europe/article/3373993/after-fridge-hacks-home-appliances-could-be-next-eu-cyber-chief-warns", "fonte_id": "scmp", "data_pub": "2026-11-10T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da segurança cibernética da União Europeia alertou que, após ataques recentes em refrigeradores de supermercados em pelo menos 12 países europeus, outros eletrodomésticos domésticos podem ser alvos futuros. Ele enfatizou a necessidade de maior investimento para combater as ameaças cibernéticas crescentes.", "titulo_pt": "Após ataques em refrigeradores, eletrodomésticos domésticos podem ser alvos, avisa chefe da segurança cibernética da ue", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 255061, "titulo": "Google Fi is bringing back multiple cell network support for better coverage", "url": "https://www.theverge.com/tech/1030979/google-fi-automatic-network-switching-pixel", "fonte_id": "the_verge", "data_pub": "2026-11-10T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google Fi está lançando uma nova 'super rede' que pode automaticamente alternar entre dois diferentes redes 5G dependendo da melhor conectividade. A funcionalidade está sendo lançada hoje para telefones Pixel 9 e mais novos com Fi ativo em eSIM e sem quaisquer SIMs não-Fi ativados.", "titulo_pt": "Google Fi volta a suportar múltiplas redes móveis para melhor cobertura", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 255492, "titulo": "Binance emite aviso de segurança para usuários de iPhone", "url": "https://exame.com/future-of-money/binance-emite-aviso-de-seguranca-para-usuarios-de-iphone/", "fonte_id": "exame", "data_pub": "2026-11-10T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance emitiu um aviso de segurança aos usuários de iPhone, alertando sobre uma vulnerabilidade que pode comprometer carteiras de criptomoedas e aplicativos financeiros. A corretora aconselha os usuários a adotarem medidas de segurança adicionais.", "titulo_pt": "Binance emite aviso de segurança para usuários de iphone", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 254238, "titulo": "Porto de Santos adota plano de contingência após possível ataque hacker", "url": "https://www.cnnbrasil.com.br/infra/porto-de-santos-investiga-instabilidades-em-sistema-e-descarta-paralisacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Porto de Santos implementou um plano de contingência após uma possível ação de hackers. A movimentação de cargas e navios não foi afetada, mas há possibilidade de lentidão em processos administrativos.", "titulo_pt": "Porto de Santos adota plano de contingência após possível ataque hacker", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 255902, "titulo": "On this day in space! Nov. 10, 2013: Europe's GOCE satellite, the 'Ferrari of space,' fell out of orbit after mapping Earth's gravity field", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-10-2026", "fonte_id": "space_com", "data_pub": "2026-11-10T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 10 de novembro de 2013, o satélite GOCE da Europa caiu da órbita após quatro anos mapeando o campo gravitacional da Terra. O GOCE era conhecido como o 'Ferrari do espaço' devido à sua aerodinâmica única.", "titulo_pt": "10 De novembro de 2013: satélite GOCE da Europa caiu após mapear campo gravitacional da terra", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 255858, "titulo": "When a Walmart closes, what happens to nearby stores?", "url": "https://phys.org/news/2026-11-walmart-nearby.html", "fonte_id": "phys_org", "data_pub": "2026-11-10T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fechamento de um Walmart geralmente é recebido com tristeza pelos clientes, enquanto lojas concorrentes tendem a se beneficiar dessa situação.", "titulo_pt": "O que acontece com as lojas vizinhas quando um Walmart fecha?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 255859, "titulo": "Scientists discover new way to control magnetic waves for future quantum technologies", "url": "https://phys.org/news/2026-11-scientists-magnetic-future-quantum-technologies.html", "fonte_id": "phys_org", "data_pub": "2026-11-10T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Laboratório Nacional de Ames, dos Estados Unidos, descobriram uma maneira de controlar a polarização giratória de magnôns, ondas magnéticas pequenas que podem transportar informações através de materiais. Ao alterar o estado magnético do material com um campo magnético externo, eles puderam mudar o comportamento dos magnôns, um achado com potenciais aplicações em tecnologias de informação quântica e computação quântica.", "titulo_pt": "Cientistas descobrem nova maneira de controlar ondas magnéticas para tecnologias quânticas futuras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 255860, "titulo": "Classical–quantum light interactions could make complex quantum behavior easier to simulate", "url": "https://phys.org/news/2026-11-classicalquantum-interactions-complex-quantum-behavior.html", "fonte_id": "phys_org", "data_pub": "2026-11-10T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma colaboração internacional demonstrou que dinâmicas não lineares clássicas podem levar a estados de fotones individuais e duplos a atingirem um estado térmico, o que abre novas possibilidades para a simulação de sistemas quânticos multifísicos dentro de arquiteturas ópticas acessíveis.", "titulo_pt": "Dinâmica não linear clássica pode facilitar a simulação de comportamentos quânticos complexos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 255861, "titulo": "AI use is now universal in higher education. Why are universities failing to adapt?", "url": "https://phys.org/news/2026-11-ai-universal-higher-universities.html", "fonte_id": "phys_org", "data_pub": "2026-11-10T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de inteligência artificial entre estudantes universitários é agora quase universal em muitos países. No entanto, apenas um quinto de universidades em uma pesquisa da UNESCO em 90 países tinham uma política formal de IA no ano anterior.", "titulo_pt": "Uso de IA na educação superior é universal, mas as universidades ainda não se adaptaram", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 255558, "titulo": "Primer aporte nacional: durante 12 años evaluaron un riego usado en Israel y Estados Unidos y descubrieron importantes resultados", "url": "https://www.lanacion.com.ar/economia/campo/primer-aporte-nacional-durante-12-anos-evaluaron-un-riego-usado-en-israel-y-estados-unidos-y-nid10112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-10T21:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O INTA Manfredi realizou uma avaliação de 12 anos das propriedades químicas do solo em módulos experimentais utilizando riego por goteo enterrado. Os resultados são importantes e ainda não foram detalhados.", "titulo_pt": "Primeiro aporte nacional: durante 12 anos avaliaram um riego usado em Israel e Estados Unidos e descobriram importantes resultados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 255884, "titulo": "PAHO calls for stronger menopause care to promote healthy aging in the Americas", "url": "https://www.paho.org/en/news/10-11-2026-paho-calls-stronger-menopause-care-promote-healthy-aging-americas", "fonte_id": "paho", "data_pub": "2026-11-10T20:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO está pedindo por cuidados mais robustos durante a menopausa para promover o envelhecimento saudável nas Américas. O objetivo é melhorar a saúde e o bem-estar das mulheres na fase pós-menopausa.", "titulo_pt": "PAHO solicita maior atenção à menopausa para promover o envelhecimento saudável nas américas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 255882, "titulo": "STAT+: Wyden, Sanders hand-in-hand on ‘Medicare for All’ initiative", "url": "https://www.statnews.com/2026/11/10/dc-diagnosis-wyden-sanders-aligned-on-medicare-for-all/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-10T20:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Senadores Bernie Sanders e Jeff Wyden apresentaram uma iniciativa conjunta em torno do 'Medicare for All'. Sanders propôs reduzir a idade de elegibilidade para o Medicare em 10 anos.", "titulo_pt": "Sanders e wyden unidos em iniciativa 'Medicare for All'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 255886, "titulo": "NASA Invites Media, Public to Join Voyager 1 One-Light Day Activities", "url": "https://www.nasa.gov/news-release/nasa-invites-media-public-to-join-voyager-1-one-light-day-activities/", "fonte_id": "nasa_news", "data_pub": "2026-11-10T19:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1, lançado há quase 50 anos em 1977, completará uma jornada de um dia-luz da Terra em 18 de novembro de 2023, a uma distância superior a 16 bilhões de milhas. Este objeto humano mais distante teria levado 24 horas para receber qualquer luz da Terra.", "titulo_pt": "NASA convida mídia e público para atividades do dia de um-dia-luz do Voyager 1", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 255888, "titulo": "Was Isaac Newton’s contribution to calculus stolen?", "url": "https://www.scientificamerican.com/article/was-isaac-newtons-contribution-to-calculus-stolen/", "fonte_id": "scientific_american", "data_pub": "2026-11-10T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Isaac Newton acusou Gottfried Wilhelm Leibniz de ter roubado a ideia de infinitesimais. O artigo explora a verdadeira história por trás dessa controvérsia.", "titulo_pt": "A contribuição de Newton para o cálculo foi roubada?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 255480, "titulo": "Estrutura inédita ao redor de estrela morta pode revelar futuro do Sistema Solar", "url": "https://exame.com/ciencia/estrutura-inedita-ao-redor-de-estrela-morta-pode-revelar-futuro-do-sistema-solar/", "fonte_id": "exame", "data_pub": "2026-11-10T18:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma anã branca a 1.600 anos-luz da Terra é rodeada por dois anéis de detritos que podem ter sido formados por corpos planetários sobreviventes. Essa estrutura inédita pode oferecer insights sobre o futuro do Sistema Solar.", "titulo_pt": "Nova estrutura ao redor de estrela morta pode revelar futuro do Sistema Solar", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 255887, "titulo": "NASA to Welcome Expedition 74 Astronauts Home at Space Center Houston", "url": "https://www.nasa.gov/news-release/nasa-to-welcome-expedition-74-astronauts-home-at-space-center-houston/", "fonte_id": "nasa_news", "data_pub": "2026-11-10T18:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizará um evento público para dar boas-vindas à tripulação da Expedição 74 após o retorno de uma missão de longa duração à Estação Espacial Internacional. Os astronautas Jessica provavel_duplicata_de": null, "texto_pt": "A cidade de Denver, nos Estados Unidos, está expandindo a capacidade de armazenamento de água da represa Gross para abastecer 150.000 novos domicílios. O projeto, que enfrentou atrasos devido a recursos em tribunais, continua em frente.", "titulo_pt": "Secas de 2002 quase deixam Denver sem água: cidade terá represa três vezes maior com ampliação histórica", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 254357, "titulo": "Preso pela PM morre após ser alvo de spray de pimenta em MG", "url": "https://www.metropoles.com/minas-gerais/preso-pela-pm-morre-apos-ser-alvo-de-spray-de-pimenta-em-mg", "fonte_id": "metropoles", "data_pub": "2026-11-10T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi preso pela Polícia Militar e morreu após ser exposto a spray de pimenta dentro de uma viatura em Minas Gerais. Vídeos mostram um policial acionando o produto químico dentro do veículo. A família questiona as circunstâncias da morte, e a PM afirma que o homem teria passado mal.", "titulo_pt": "Preso pela PM morre após ser exposto a spray de pimenta em MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 255062, "titulo": "Anthropic has its own AI-powered office suite now", "url": "https://www.theverge.com/ai-artificial-intelligence/1030709/anthropic-has-its-own-ai-powered-office-suite-now", "fonte_id": "the_verge", "data_pub": "2026-11-10T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic lançou uma suite de escritório baseada em IA. A empresa, conhecida por ferramentas para corporações e codificação, está expandindo sua presença no mercado.", "titulo_pt": "Anthropic lança suite de escritório baseada em IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 254270, "titulo": "Pacientes com síndrome de Alagille passam por 6 especialistas, em média, até o diagnóstico", "url": "https://www.jota.info/coberturas-especiais/pacientes-c 254123, "titulo": "Cigarro ilegal também é uma questão de segurança pública", "url": "https://veja.abril.com.br/coluna/por-tras-dos-numeros/cigarro-ilegal-tambem-e-uma-questao-de-seguranca-publica/", "fonte_id": "veja", "data_pub": "2026-11-10T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comércio ilegal de cigarros constitui um desafio significativo para a segurança pública, considerando as penalidades envolvidas, como prisão, fiança e apreensão da carga.", "titulo_pt": "Cigarro ilegal também é uma questão de segurança pública", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 254233, "titulo": "Justiça de SP nega pedido de ONGs para proibir venda de animais na internet", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/justica-de-sp-nega-pedido-de-ongs-para-proibir-venda-de-animais-na-internet/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça de São Paulo negou um pedido de ONGs que buscavam proibir a venda de animais em plataformas online, como Mercado Livre e OLX. As organizações argumentaram que o comércio online promove maus tratos e precificação da vida, mas a decisão foi tomada sob o argumento de que não existe uma lei nacional que proíba o comércio online de pets.", "titulo_pt": "Justiça de SP nega pedido de ONGs para proibir venda de animais na internet", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 255430, "titulo": "Acordo inédito entre organizações do Brasil e dos EUA quer combater impactos do clima e da IA", "url": "https://www.cnnbrasil.com.br/ciencia/acordo-inedito-entre-organizacoes-do-brasil-e-dos-eua-quer-combater-impactos-do-clima-e-da-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Organizações do Brasil e dos Estados Unidos firmaram um acordo inédito para criar soluções que combaterão os impactos do clima e da inteligência artificial nos dois países. A parceria visa abordar desafios sociais e urbanos enfrentados pelos dois países.", "titulo_pt": "Acordo inédito entre organizações do Brasil e dos EUA quer combater impactos do clima e da IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255522, "titulo": "Guerra no Irã ajuda a reduzir emissões de carbono, mas há um problema", "url": "https://olhardigital.com.br/2026/11/10/ciencia-e-espaco/guerra-no-ira-ajuda-a-reduzir-emissoes-de-carbono-mas-ha-um-problema/", "fonte_id": "olhar_digital", "data_pub": "2026-11-10T19:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento do Global Carbon Project estima que a guerra no Irã tenha contribuído para uma redução nas emissões de carbono. No entanto, há um problema associado a essa diminuição.", "titulo_pt": "Guerra no Irã ajuda a reduzir emissões de carbono, mas há um problema", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 254372, "titulo": "Parque Tantauco inaugura nueva Casa Museo Sebastián Piñera Echenique", "url": "https://www.latercera.com/nacional/noticia/parque-tantauco-inaugura-nueva-casa-museo-sebastian-pinera-echenique/", "fonte_id": "la_tercera", "data_pub": "2026-11-10T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O novo espaço, localizado no setor norte do Parque Tantauco, oferece tecnologia, museografia interativa e experiências educativas para toda a família, destacando o patrimônio cultural e natural de Chiloé. O local já está aberto ao público.", "titulo_pt": "Parque Tantauco inaugura nova Casa museu Sebastián Piñera Echenique", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 254326, "titulo": "Una amenaza latente: el trágico desenlace de un yaguareté reavivó la preocupación por la reintroducción de la especie", "url": "https://www.lanacion.com.ar/sociedad/una-amenaza-latente-un-yaguarete-que-era-monitoreado-murio-atropellado-y-reavivo-la-preocupacion-por-nid10112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-10T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um jaguatirica de dois anos e meio, que havia começado a se deslocar para fora de uma ilha onde nasceu, morreu atropelado em uma área protegida; esse incidente reavivou preocupações sobre a reintrodução da espécie.", "titulo_pt": "Uma ameaça latente: o trágico fim de um jaguatirica reavivou a preocupação com a reintrodução da espécie", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 255488, "titulo": "O que saiu do papel desde Belém? COP31 anuncia investimentos e faz balanço da ação climática", "url": "https://exame.com/esg/o-que-saiu-do-papel-desde-belem-cop31-anuncia-investimentos-e-faz-balanco-da-acao-climatica/", "fonte_id": "exame", "data_pub": "2026-11-10T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ano após a COP30, 84% dos planos da Agenda de Ação registraram avanços. Nesta terça-feira, 10, empresas destinaram US$ 156 bilhões anuais em redes elétricas, renováveis e armazenamento.", "titulo_pt": "O que saiu do papel desde Belém? COP31 anuncia investimentos e faz balanço da ação climática", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 254225, "titulo": "Associação do setor de energia nuclear defende operação de Angra 3", "url": "https://www.cnnbrasil.com.br/infra/associacao-defende-angra-3-e-alerta-para-perda-bilionaria-com-paralisacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A associação do setor de energia nuclear defende a operação de Angra 3. O Brasil estaria perdendo bilhões com a paralisação das obras da usina.", "titulo_pt": "Associação do setor nuclear defende operação de Angra 3", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255164, "titulo": "Analysis: Which countries have sent the most delegates to COP31?", "url": "https://www.carbonbrief.org/analysis-which-countries-have-sent-the-most-delegates-to-cop31", "fonte_id": "carbon_brief", "data_pub": "2026-11-10T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 92.000 pessoas se registraram para participar da COP31 de clima em Antalya, Turquia, o que potencialmente torna-a a maior até o momento. O artigo analisa quais países enviaram mais delegados para a COP31.", "titulo_pt": "Análise: quais países enviaram mais delegados para a COP31?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 254230, "titulo": "Fumaça fecha escolas, ginásios e suspende UTI aérea em Parintins", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/fumaca-fecha-escolas-ginasios-e-suspende-uti-aerea-em-parintins/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As escolas e ginásios municipais de Parintins estão fechados, e a UTI aérea foi suspensa devido a uma fumaça. O hospital da cidade registrou aumento no número de pacientes com sintomas respiratórios, levando a rede municipal a adotar ensino remoto de forma temporária.", "titulo_pt": "Fumaça fecha escolas, ginásios e suspende UTI aérea em Parintins", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 254231, "titulo": "Pesquisadores identificam resíduos de anti-inflamatório e remédio para coração em amostras de um dos principais rios do RS", "url": "https://www.cnnbrasil.com.br/ciencia/pesquisadores-identificam-residuos-de-anti-inflamatorio-e-remedio-para-coracao-em-amostras-de-um-dos-principais-rios-do-rs/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores detectaram resíduos de anti-inflamatórios e medicamentos para coração em amostras de um rio importante do Rio Grande do Sul. O estudo indica que há uma falta de efetividade no tratamento da água e sugere a necessidade de investimentos em saneamento.", "titulo_pt": "Pesquisadores identificam resíduos de medicamentos em rio gaúcho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 254314, "titulo": "Alemanha vai investir 15 milhões de euros na proteção e preservação de terras indígenas no Brasil", "url": "https://www.dw.com/pt-br/alemanha-vai-investir-15-milhões-de-euros-na-proteção-e-preservação-de-terras-indígenas-no-brasil/a-79910794?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha anunciou um investimento de 15 milhões de euros na proteção e preservação de terras indígenas no Brasil. O repasse foi oficializado durante a COP31 em Antália, Turquia, e será gerido por entidades indígenas para decidir a aplicação dos recursos.", "titulo_pt": "Alemanha investirá 15 milhões de euros na proteção e preservação de terras indígenas no Brasil", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 254319, "titulo": "O que aconteceu em 30 anos de conferências do clima", "url": "https://www.dw.com/pt-br/o-que-aconteceu-em-30-anos-de-conferências-do-clima/a-74675224?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T12:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A linha do tempo apresenta os principais avanços desde a primeira Conferência das Partes (COP), realizada em Berlim em 1995. Ao longo desses 30 anos, foram realizadas várias conferências internacionais sobre mudanças climáticas com o objetivo de discutir e implementar ações para mitigar o efeito estufa.", "titulo_pt": "O que aconteceu em 30 anos de conferências do clima", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 254868, "titulo": "Japan to use COP31 to showcase environmental technologies", "url": "https://www.japantimes.co.jp/news/2026/11/10/japan/politics/cop31-japan-technologies/", "fonte_id": "japan_times", "data_pub": "2026-11-10T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão vai usar a COP31 para apresentar tecnologias ambientais. Um dos objetivos do evento é aumentar a electrificação mundial para 35% até 2035.", "titulo_pt": "Japão utilizará COP31 para exibir tecnologias ambientais", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 254884, "titulo": "‘Pit of hell’: Turkish mother and daughter lead fight against coal mine", "url": "https://www.japantimes.co.jp/environment/2026/11/10/turkish-fight-against-coal-mine/", "fonte_id": "japan_times", "data_pub": "2026-11-10T05:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Isik e sua filha têm protestado contra projetos minerais que estão destruindo gradualmente a província de Mugla na Turquia há cerca de uma década.", "titulo_pt": "Bunda de inferno: mãe e filha turcas lideram luta contra mina", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 254886, "titulo": "Fossil fuel emissions fall due to Iran war and renewables, research shows", "url": "https://www.japantimes.co.jp/environment/2026/11/10/energy/fossil-fuel-emissions-fall/", "fonte_id": "japan_times", "data_pub": "2026-11-10T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de combustíveis fósseis devem registrar uma queda anual esperada, a primeira desde 2020, quando a pandemia de COVID-19 paralisou a economia global, o comércio e o transporte.", "titulo_pt": "Emissões de combustíveis fósseis caem devido à guerra no Irã e à expansão de energias renováveis, pesquisa mostra", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 254650, "titulo": "Fossil fuel-related CO₂ emissions show slight global drop, an encouraging but insufficient sign", "url": "https://www.lemonde.fr/en/environment/article/2026/11/10/fossil-fuel-related-co-emissions-show-slight-global-drop-an-encouraging-but-insufficient-sign_6776431_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-10T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de CO₂ relacionadas a combustíveis fósseis devem cair em 0,4% este ano, segundo o Projeto Global de Carbono, impulsionadas pelo crescimento da energia renovável e pela crise ongoing na região do Oriente Médio.", "titulo_pt": "Emissões relacionadas a combustíveis fósseis mostram leve queda global, sinal encorajador, mas insuficiente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 255165, "titulo": "Analysis: Fossil-fuel CO2 emissions set to dip in 2026 as Iran conflict hits oil use", "url": "https://www.carbonbrief.org/analysis-fossil-fuel-co2-emissions-set-to-dip-in-2026-as-iran-conflict-hits-oil-use", "fonte_id": "carbon_brief", "data_pub": "2026-11-10T01:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono (CO2) provenientes de combustíveis fósseis e cimento devem diminuir em torno de 0.4% em 2026, totalizando cerca de 38,2 bilhões de toneladas. Esta redução está associada ao impacto do conflito iraniano na utilização de petróleo.", "titulo_pt": "Análise: emissões de CO2 de combustíveis fósseis devem diminuir em 2026 devido ao conflito iraniano", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 255726, "titulo": "«Aquí tienes la parte considerativa y resolutiva»: la huella de la Inteligencia Artificial en sentencias del Poder Judicial", "url": "https://www.ciperchile.cl/2026/11/10/aqui-tienes-la-parte-considerativa-y-resolutiva-la-huella-de-la-inteligencia-artificial-en-sentencias-del-poder-judicial/?utm_source=rss&utm_medium=rss&utm_campaign=aqui-tienes-la-parte-considerativa-y-resolutiva-la-huella-de-la-inteligencia-artificial-en-sentencias-del-poder-judicial", "fonte_id": "ciper_chile", "data_pub": "2026-11-10T19:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo explora a presença da Inteligência Artificial em sentenças judiciais. A Inteligência Artificial está deixando sua marca em decisões judiciais.", "titulo_pt": "Aqui está a parte considerativa e resolutiva: a marca da inteligência Artificial em sentenças do Poder Judicial", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 255830, "titulo": "UK court overturns Trinidad and Tobago law criminalising gay sex", "url": "https://www.scmp.com/news/world/americas/article/3373994/uk-court-overturns-trinidad-and-tobago-law-criminalising-gay-sex", "fonte_id": "scmp", "data_pub": "2026-11-10T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Londres anulou uma lei na Trinidade e Tobago que criminalizava relações sexuais consentidas entre homens do mesmo sexo. Jason Jones, um homem gay, desafiou a Lei de Delitos Sexuais do país, alegando que ela violava seus direitos fundamentais.", "titulo_pt": "Tribunal britânico anula lei criminalizando sexo gay na trinidade e Tobago", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 255856, "titulo": "HRW urges U.N. to address N. Korean human rights situation alongside security issues", "url": "https://en.yna.co.kr/view/AEN20261111000300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-10T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Human Rights Watch pediu ao Conselho de Segurança das Nações Unidas que aborde a situação dos direitos humanos na Coreia do Norte junto com questões de segurança.", "titulo_pt": "HRW solicita ao conselho de segurança da ONU abordar situação de direitos humanos na Coreia do norte junto com questões de segurança", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 254304, "titulo": "Jueza ordena liberar a estudiante de UC Berkeley detenida por el ICE en aeropuerto de San Francisco", "url": "https://www.clarin.com/estados-unidos/jueza-ordena-liberar-a-estudiante-de-uc-berkeley-detenida-por-el-ice-en-aeropuerto-de-san-francisco_0_zIiNTARJRy.html", "fonte_id": "clarin", "data_pub": "2026-11-10T17:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma juiza federal ordenou a liberação de uma estudante da UC Berkeley que foi detida pelo ICE no aeroporto de San Francisco, citando uma violação ao direito processual. A jovem colombiana poderá continuar seu processo de asilo em liberdade.", "titulo_pt": "Juiza ordena libertar estudante da UC Berkeley detida pelo ICE no aeroporto de San Francisco", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 254483, "titulo": "Entre 2021 y 2024: denuncias que exMejor Niñez envió a fiscalía por riesgo de explotación sexual de NNA aumentaron un 166%", "url": "https://www.ciperchile.cl/2026/11/10/entre-2021-y-2024-denuncias-que-exmejor-ninez-envio-a-fiscalia-por-riesgo-de-explotacion-sexual-de-nna-aumentaron-un-166/?utm_source=rss&utm_medium=rss&utm_campaign=entre-2021-y-2024-denuncias-que-exmejor-ninez-envio-a-fiscalia-por-riesgo-de-explotacion-sexual-de-nna-aumentaron-un-166", "fonte_id": "ciper_chile", "data_pub": "2026-11-10T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O número de denúncias sobre risco de exploração sexual de menores de não nacionalidade enviadas pela exMejor Niñez à fiscalia aumentou 166% entre 2021 e 2024.", "titulo_pt": "Entre 2021 e 2024: denuncias sobre risco de exploração sexual de NNA enviadas à fiscalia aumentaram 166%", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 254949, "titulo": "US again fails to show at UN for its human rights review", "url": "https://www.scmp.com/news/world/united-states-canada/article/3373992/us-again-fails-show-un-its-human-rights-review", "fonte_id": "scmp", "data_pub": "2026-11-10T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A entidade da ONU responsável pelos direitos humanos adiou a revisão regular do registro de direitos humanos dos EUA para janeiro, esperando convencer o governo Trump a participar. Os 47 membros do Conselho de Direitos Humanos votaram pela adiamento, citando a 'não cooperação contínua' do país.", "titulo_pt": "EUA deixa de participar da revisão de direitos humanos da ONU e data é adiada", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 255690, "titulo": "The Afghan Women Who Wrote Their Own Rights", "url": "https://thediplomat.com/2026/11/the-afghan-women-who-wrote-their-own-rights/", "fonte_id": "the_diplomat", "data_pub": "2026-11-10T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 26 anos, mulheres afegãs se reuniram em Dushanbe para declarar seus direitos, que posteriormente foram novamente retirados pelo regime do Taleban.", "titulo_pt": "As mulheres afegãs que redigiram sua própria carta de direitos", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 254317, "titulo": "Prisões VIP na Indonésia expõem crise e corrupção em presídios no Sudeste Asiático", "url": "https://www.dw.com/pt-br/prisões-vip-na-indonésia-expõem-crise-e-corrupção-em-presídios-no-sudeste-asiático/a-79867515?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T12:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Prisões VIP na Indonésia revelam tratamento preferencial para condenados ricos, enquanto sistemas prisionais enfrentam superlotação no Sudeste Asiático.", "titulo_pt": "Prisões VIP na Indonésia expõem crise e corrupção em presídios no Sudeste Asiático", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 255166, "titulo": "Drones and drought in Sudan: a combined assault on children like nothing seen before", "url": "https://www.unicef.org/press-releases/drones-and-drought-sudan-combined-assault-children-nothing-seen", "fonte_id": "unicef", "data_pub": "2026-11-10T09:37:00Z", "idioma": "en", "provavel_duplicata_de": nul
