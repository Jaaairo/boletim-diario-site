<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "11/11/2026 19:17", "stats": {"noticias_novas": 610, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Senado aprovou a Medida Provisória que permite a renegociação de dívidas rurais, enviando-a para a sanção do presidente Lula. Além disso, foi anunciado um projeto de ajuste fiscal que pode impactar entre R$ 50 e R$ 60 bilhões no próximo ano, com a possibilidade de ser votado na mesma tarde. O ministro Gilmar Mendes suspendeu ações sobre a tabela do SUS e paralisou os pagamentos de precatórios em todo o país. No entanto, o diretor-geral da Polícia Federal, Andrei Rodrigues, enfrenta um desgaste significativo devido à crise com delegados do Banco Master, levando a considerações sobre seu futuro na PF.", "mundo": "Em Barcelona, uma greve geral após 14 anos levou a confrontos com a polícia, marcando um dia de protestos contra a crise de moradia, poucas semanas antes das eleições antecipadas. Na Rússia e na Ucrânia, as negociações de paz em Abu Dhabi não avançaram significativamente, com divergências sobre territórios invadidos persistindo. O embaixador russo nos Estados Unidos, Alexander Darchiev, faleceu devido a uma 'doença crônica', afetando as relações entre Moscou e Washington. Na Argentina, o Papa Francisco (não Leão XIV, que não existe) realizou uma missa em Luján com a presença de mais de 3 milhões de pessoas, marcando sua despedida de uma visita de quatro dias ao país.\n\nAs relações geopolíticas entre os principais atores internacionais continuam tensas. Na Ásia, a nomeação do fundador da Acer como embaixador do APEC (Área de Comércio do Pacífico) reflete o papel crescente de Taiwan na economia regional, apesar dos esforços chineses para isolar o país. Em contraste, a Alemanha decidiu parar de usar drones chineses por questões de segurança, demonstrando a crescente preocupação com a dependência tecnológica. No Oriente Médio, o Irã ameaçou atacar bases dos EUA na Europa em retaliação a possíveis novos bombardeios, aumentando as preocupações com uma escalada da guerra. As negociações trilaterais entre Rússia, Ucrânia e EUA em Abu Dhabi, realizadas em 11 de novembro, terminaram sem avanços concretos, refletindo a complexidade das relações entre as partes envolvidas no conflito. Além disso, a morte repentina do embaixador russo nos EUA, Alexandre Darchiev, e as ameaças de retaliação do Irã, refletem os desafios diplomáticos e de segurança enfrentados atualmente.", "economia": "A Minerva registrou um prejuízo de R$ 717 milhões no terceiro trimestre de 2026, pressionando seu balanço com uma alavancagem de 3,2 vezes. O Senado Federal aprovou a Medida Provisória para renegociação de dívidas rurais, enquanto o Banco do Brasil e o banco alemão KfW anunciaram um financiamento de 100 milhões de euros para apoiar a bioeconomia na Amazônia. O governo federal prepara um pacote de medidas de ajuste fiscal com potencial de economizar entre R$ 50 bilhões e R$ 60 bilhões em 2027. A Petrobras considera adiar a apuração de sua política de preços dos combustíveis devido à guerra no Irã, enquanto a produção de veículos no Brasil em outubro de 2025 atingiu 254,5 mil unidades, um aumento de 2,7% em comparação com o mesmo mês do ano anterior. O mercado de consumo de pessoas com mais de 60 anos, conhecido como economia prateada, tem um volume de R$ 1,8 trilhão no Brasil e está influenciando setores como saúde, turismo e bens de consumo.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia, com diversos desenvolvimentos e desafios sendo debatidos. A Taiwan usou pela primeira vez a IA para analisar legislação, marcando um avanço significativo no uso de tecnologia avançada no processo legislativo. No entanto, a IA também está sendo explorada em ataques cibernéticos, alguns dos quais têm origem na região administrativa especial de Hong Kong. Em outro desenvolvimento, a NVIDIA enfrenta pressões políticas e de investidores após o CEO, Jensen Huang, ser acusado de espionagem chinesa. O governo americano autorizou, pela terceira vez este ano, uma investigação mais rigorosa contra a empresa. Além disso, o programa de estágio em IA do Grupo Ultra oferece oportunidades para jovens profissionais em cinco empresas diferentes, destacando a crescente importância do campo. A OpenAI, por sua vez, atingiu um valor de vendas recorde de cerca de 10 bilhões de dólares no último trimestre, refletindo o crescimento do mercado de IA.", "ciencia": "Uma nova simulação científica oferece uma visão detalhada dos primeiros 2 bilhões de anos do universo, revelando insights sobre a formação do cosmos. Paralelamente, pesquisas em diferentes áreas da ciência estão trazendo novos conhecimentos sobre a Terra e o espaço. Um relatório global sobre incêndios florestais na Espanha e Portugal em 2025 indica que as condições climáticas extremas eram três vezes mais prováveis devido ao aquecimento global. Em outro estudo, pesquisadores descobriram uma estrutura organelar desconhecida em um molusco marinho, revelando novas perspectivas sobre simbiose química e adaptabilidade a ambientes quase sem oxigênio. Esses avanços científicos abrangem desde a compreensão do universo primitivo até a investigação de microorganismos que podem ajudar a preservar corais sob o efeito do aquecimento global, passando por novos métodos para diagnosticar doenças e a importância de doadores leais para organizações sem fins lucrativos. No período tardio da Idade Média, houve um significativo deslocamento nas valorizações sociais, com a humildade se tornando uma virtude altamente estimada. Este movimento estava estreitamente ligado às práticas religiosas e à vida dos monges, que demonstravam sua humildade através do auto-flagelação. Um estudo sobre a temporada de incêndios florestais na Península Ibérica em 2025 indicou que as condições climáticas extremas eram três vezes mais prováveis devido ao aquecimento global. Em outro estudo relacionado ao clima, os pesquisadores identificaram e rastrearam sistemas meteorológicos que contribuem mais para a precipitação tropical do que os ciclones tropicais, fornecendo novas perspectivas sobre como os padrões de precipitação podem mudar com o aquecimento global. Outros avanços científicos incluem a descoberta de uma nova estrutura simbólica em moluscos marinhos, a identificação de cloreto de hidrogênio em Marte como possível indicador de vida microbiana e o negociado com sucesso de acordos de acesso regionais para testes de HPV na América Latina e no Caribe. Esses desenvolvimentos sublinham a natureza diversificada e interconectada da pesquisa científica em diferentes campos, desde a astrofísica até a saúde pública.", "cultura": "O Papa Francisco encerrou sua viagem pela Argentina com uma missa na Basílica de Luján, onde estiveram presentes cerca de 2 milhões de fiéis. Após a missa, ele viajou para o Peru, que será o último destino de sua viagem pela América. Em São Paulo, o Festival MixBrasil de Cultura da Diversidade, com o tema 'Todos os Futuros Possíveis', reuniu mais de 130 filmes, além de peças de teatro, literatura, mostras de jogos digitais e performances, abrangendo públicos LGBTQIA+ e atrações internacionais. A novela 'Lá Na Minha Terra', da Globo, gerou reações negativas nas redes sociais devido à representação estereotipada do Nordeste, resultando em queda de audiência em capitais nordestinas. A cantora Shakira realizará um show no Brasil em 2027 para apresentar a turnê 'Las Mujeres Ya No Lloran', enquanto o Festival del Huaso de Olmué 2027 divulgou sua programação com artistas musicais e humoristas. Além disso, Johnny Depp retorna aos estúdios de Hollywood para protagonizar o filme 'Ebenezer e os Fantasmas do Natal', recebendo um cachê reduzido.", "sociedade": "A Espanha enfrenta sua primeira greve geral em 14 anos, com protestos que exigem moradia acessível, controle dos aluguéis e melhores salários. A paralisação, impulsionada por organizações de defesa da moradia, ocorre 18 dias antes das eleições e pressiona tanto o governo quanto a oposição. Em outro desenvolvimento, a Organização das Nações Unidas alerta que mais de um milhão de pessoas no Líbano enfrentam uma escassez aguda de alimentos. Na América Latina, a visita do Papa Francisco à Argentina destacou o potencial do voluntariado, um movimento silencioso com poder transformador, embora não se tenha consolidado como um hábito permanente. Em um caso de saúde, o cacique Raoni, de 94 anos, está internado em Mato Grosso devido a oscilações na pressão arterial e infecção pulmonar, com seu quadro considerado estável.", "meio_ambiente": "A COP31, realizada em Antália, Turquia, está em pleno andamento com a participação de delegados de aproximadamente 200 países, incluindo o presidente Lula, que discursou na abertura e no segmento de alto nível. No entanto, a ausência de líderes de sete das maiores economias desenvolvidas, com exceção do Reino Unido, é um contraponto à presença de uma das maiores delegações do Brasil. Em termos de clima, o Brasil enfrenta uma série de eventos extremos, com 59% do país sob seca e 49,5% dos municípios enfrentando alagamentos. A União Europeia avança lentamente em suas metas de redução de emissões no setor de transporte, enquanto o Brasil melhorou seu ranking de proteção climática devido à redução do desmatamento na Amazônia e ao aumento da utilização de energias renováveis, apesar de persistirem obstáculos. Além disso, o Japão e oito outros países receberam um prêmio por líderes que não compareceram às negociações climáticas, destacando a urgência de ações mais concretas para enfrentar a crise climática.", "direitos_humanos": "O Tribunal Supremo da Ilha de Trinidad e Tobago anulou uma lei colonial que proibia relações sexuais entre adultos do mesmo sexo, consentidas, em uma decisão que representa uma vitória significativa para os direitos da comunidade LGBTQ+ na região do Caribe. Esta medida, que reflete o legado colonial, foi confirmada pela última instância de apelação local, localizada em Londres. Por outro lado, em Polônia, representantes de vítimas do nazismo apelam à sociedade civil alemã para doações, diante da recusa de Berlim em pagar reparações. No Brasil, a família do cacique Raoni pede a suspensão do documentário na COP31, alegando falta de autorização para a estreia e não terem sido consultados ou informados sobre o filme. Além disso, o secretário de Estado britânico para Assuntos Exteriores, David Lammy, alerta líderes mundiais na COP31 que a crise climática representa uma ameaça à segurança nacional de todos os países, com cenários de destruição aparentemente de ficção científica se tornando realidade e choques econômicos causados por combustíveis fósseis se tornando a regra."}, "resumo_do_dia": {"politica_nacional": [{"id": 257941, "titulo": "Gilmar suspende ações sobre tabela SUS e trava precatórios em todo o país", "url": "https://www.metropoles.com/colunas/manoela-alcantara/gilmar-suspende-acoes-sobre-tabela-sus-e-trava-precatorios-em-todo-o-pais", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes suspendeu as ações sobre a tabela do SUS e paralisou os pagamentos de precatórios relacionados à revisão dos valores em todo o país. A decisão afeta todos os processos em todas as fases.", "titulo_pt": "Gilmar suspende ações sobre tabela SUS e trava precatórios em todo o país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257829, "titulo": "Projetos de servidores públicos disputam sete prêmios de R$ 12 mil", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/projetos-de-servidores-publicos-disputam-sete-premios-de-r-12-mil", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-11T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um total de 14 projetos de servidores públicos estão concorrendo a sete prêmios de R$ 12 mil no Prêmio Espírito Público. As iniciativas foram selecionadas entre 867 inscritos e serão avaliadas por especialistas e votação popular, com os vencedores sendo anunciados em 9 de dezembro.", "titulo_pt": "Projetos de servidores públicos disputam sete prêmios de R$ 12 mil", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 257830, "titulo": "Senado aprova MP que renegocia dívidas rurais e retira mudanças em regras propostas pela Câmara sobre cigarros eletrônicos", "url": "https://g1.globo.com/politica/noticia/2026/11/11/senado-aprova-mp-que-renegocia-dividas-rurais-e-retira-mudancas-em-regras-propostas-pela-camara-sobre-cigarros-eletronicos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-11T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou a Medida Provisória que renegocia dívidas rurais. O texto foi aprovado de forma simbólica e as alterações propostas pela Câmara sobre cigarros eletrônicos foram retiradas.", "titulo_pt": "Senado aprova MP que renegocia dívidas rurais e retira mudanças em regras para cigarros eletrônicos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 257815, "titulo": "Prêmio MOL oferece R$ 6.000 para reportagens sobre cultura de doação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/11/premio-mol-oferece-r-6000-para-reportagens-sobre-cultura-de-doacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O 5º Prêmio MOL de Jornalismo para a Solidariedade está com inscrições abertas até 28 de dezembro e oferece prêmios de R$ 2.000 a R$ 6.000 para reportagens sobre cultura de doação, solidariedade e transformação social.", "titulo_pt": "Prêmio MOL oferece R$ 6.000 para reportagens sobre cultura de doação", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 257947, "titulo": "Senado aprova MP que permite renegociação de dívidas rurais", "url": "https://www.metropoles.com/brasil/senado-aprova-mp-que-permite-renegociacao-de-dividas-rurais", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou uma Medida Provisória que permite a renegociação de dívidas rurais. O texto seguirá para a sanção do presidente Lula.", "titulo_pt": "Senado aprova MP que permite renegociação de dívidas rurais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257987, "titulo": "Tarcísio prioriza perfil técnico nos primeiros anúncios para secretarias", "url": "https://www.cnnbrasil.com.br/politica/tarcisio-prioriza-perfil-tecnico-nos-primeiros-anuncios-para-secretarias/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio foi nomeado para secretarias priorizando perfis técnicos. O novo secretário de Ciência e Tecnologia liderou a Capes durante uma crise de bolsas de pesquisa no governo Bolsonaro.", "titulo_pt": "Tarcísio prioriza perfis técnicos nos primeiros anúncios para secretarias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 257799, "titulo": "Deputado do PT diz a ministro que ajuste fiscal não pode ser aprovado 'goela abaixo'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/deputado-do-pt-diz-a-ministro-que-ajuste-fiscal-nao-pode-ser-goela-abaixo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Lindbergh Farias (PT-RJ) afirmou ao ministro Bruno Moretti, do Planejamento, que o ajuste fiscal proposto pelo governo Lula pode enfrentar resistência na base de sustentação do PT no Congresso se aprovado de forma unilateral.", "titulo_pt": "Deputado do PT diz que ajuste fiscal não pode ser aprovado 'goela abaixo'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257831, "titulo": "TCU pede à Câmara aumento de penduricalhos para servidores de confiança; entenda o que muda", "url": "https://g1.globo.com/politica/noticia/2026/11/11/tcu-pede-a-camara-aumento-de-penduricalhos-para-servidores-de-confianca-entenda-o-que-diz-o-texto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-11T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU enviou à Câmara uma proposta para reajustar os penduricalhos pagos a servidores de confiança, com um impacto estimado de R$ 27,7 milhões por ano. A medida visa aumentar as gratificações adicionais para esses servidores.", "titulo_pt": "TCU sugere aumento de penduricalhos para servidores de confiança; entenda o que muda", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 257800, "titulo": "Senado aprova projeto que impede bloqueio de R$ 465 mi de fundo de telecomunicações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/senado-aprova-projeto-que-impede-bloqueio-temporario-de-r-465-mi-de-fundo-de-telecomunicacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plenário do Senado aprovou um projeto que impede o bloqueio temporário de despesas do Fust (Fundo de Universalização dos Serviços de Telecomunicações). Foram 68 votos a favor e nenhum contra.", "titulo_pt": "Senado aprova projeto que impede bloqueio de R$ 465 mi do fust", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257816, "titulo": "Parlamentares querem isentar 'imposto do pecado' para refrigerante zero, picape, lancha e vinho de consagração", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/parlamentares-querem-isentar-imposto-do-pecado-para-refrigerante-zero-picape-lancha-e-vinho-de-consagracao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputados e senadores apresentaram 179 emendas para isentar o 'Imposto do Pecado' sobre produtos como refrigerante zero açúcar, picapes, lanchas e vinhos de consagração. Os produtos abrangem desde bebidas até veículos utilizados por igrejas.", "titulo_pt": "Parlamentares querem isentar 'imposto do pecado' para diversos produtos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 257881, "titulo": "O plano de Alcolumbre para votar PLP do ajuste fiscal a toque de caixa no Congresso", "url": "https://veja.abril.com.br/politica/o-plano-de-alcolumbre-para-votar-plp-do-ajuste-fiscal-a-toque-de-caixa-no-congresso/", "fonte_id": "veja", "data_pub": "2026-11-11T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alcolumbre desenvolveu uma estratégia para garantir o voto do PLP do ajuste fiscal no Congresso sem enfrentar uma forte mobilização que pudesse dificultar a aprovação.", "titulo_pt": "Plano de Alcolumbre para votar PLP do ajuste fiscal no Congresso sem mobilização", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 257803, "titulo": "Economistas questionam alcance de pacote fiscal de cortes extras no Orçamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/economistas-questionam-alcance-de-pacote-fiscal-de-cortes-extras-no-orcamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva anunciou medidas de ajuste orçamentário que podem impactar em R$ 50 bilhões a R$ 60 bilhões no próximo ano. O projeto de lei complementar será protocolado e pode ser votado na mesma tarde.", "titulo_pt": "Economistas questionam eficácia de medidas de ajuste orçamentário anunciadas pelo governo lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257817, "titulo": "Valdemar reprova críticas de Mello Araújo, de seu partido, a Nunes e diz que prefeito é sério", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/valdemar-reprova-criticas-de-mello-araujo-de-seu-partido-a-nunes-e-diz-que-prefeito-e-serio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Valdemar Costa Neto, presidente nacional do PL, rejeitou as críticas feitas pelo vice-prefeito de São Paulo, Ricardo Mello Araújo, contra a gestão de Ricardo Nunes. Valdemar considera que Nunes é um político sério.", "titulo_pt": "Valdemar desaprova críticas de Mello Araújo a Nunes, afirma que prefeito é sério", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 258042, "titulo": "Gilmar Mendes interrompe julgamento com maioria formada para derrubar lei que restringe cota racial", "url": "https://www.jota.info/stf/do-supremo/gilmar-mendes-interrompe-julgamento-com-maioria-formada-para-derrubar-lei-que-restringe-cota-racial", "fonte_id": "jota", "data_pub": "2026-11-11T20:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lei que amplia as condições para um referendo constitucional gerou tensões políticas na República Democrática do Congo. Além disso, o Ebola foi declarado oficialmente erradicado em Kenya. Na COP31, defensores ambientais alertam contra a incineração de resíduos, argumentando que isso poderia encaminhar as cidades africanas para infraestrutura cara e poluente.", "titulo_pt": "Nova lei para referendo constitucional causa tensões políticas na rdc", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 258112, "titulo": "Representantes demócratas elegidos en las ‘midterms’ demandan una reforma migratoria en el Capitolio", "url": "https://elpais.com/us/2026-11-11/representantes-democratas-elegidos-en-las-midterms-demandan-una-reforma-migratoria-en-el-capitolio.html", "fonte_id": "elpais_america", "data_pub": "2026-11-11T21:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Representantes democratas eleitos nas eleições intermediárias pressionam por uma reforma migratória no Congresso, junto com congressistas atuais e empresários. Eles esperam que essa vitória permita alcançar acordos com o governo de Trump para conter a ofensiva contra os migrantes.", "titulo_pt": "Representantes democratas eleitos nas ‘midterms’ exigem reforma migratória no Capitolio", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 258229, "titulo": "General strike over housing brings out hundreds of thousands in Spain", "url": "https://www.france24.com/en/general-strike-over-housing-brings-out-hundreds-of-thousands-in-spain", "fonte_id": "france24", "data_pub": "2026-11-11T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhões de trabalhadores em espanhol paralisaram negócios e transportes públicos em uma greve geral, a primeira em 14 anos, protestando contra aluguel e preços imobiliários elevados e o aumento do custo de vida. A instabilidade ocorre poucas semanas antes das eleições anticipadas convocadas pelo primeiro-minist mbassador-darchiev-dead.html", "fonte_id": "nyt_world", "data_pub": "2026-11-11T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alexander Darchiev, embaixador russo nos Estados Unidos, faleceu aos 66 anos, conforme anunciado pelo ministério russo dos assuntos externos. Ele ocupou o cargo em 2025, período em que as relações entre o Kremlin e a Casa Branca melhoraram.", "titulo_pt": "Alexandr Darchiev, embaixador da Rússia nos EUA, morre aos 66 anos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 258230, "titulo": "Rare Marilyn Monroe photos from her final shoot to be auctioned", "url": "https://www.france24.com/en/rare-marilyn-monroe-photos-from-her-final-shoot-to-be-auctioned", "fonte_id": "france24", "data_pub": "2026-11-11T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens raras de Marilyn Monroe da última sessão fotográfica dela serão leiloadas em Paris em dezembro. A coleção inclui o famoso conjunto de fotografias 'The Last Sitting of Marilyn Monroe', tiradas por Bert Stern em 1962.", "titulo_pt": "Fotos raras de Marilyn Monroe da última sessão fotográfica serão leiloadas", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 258248, "titulo": "Hoax bomb threats target schools across Italy, UK and Ireland", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/11/hoax-bomb-threats-target-schools-across-italy-uk-and-ireland?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de escolas na Itália, Reino Unido e Irlanda receberam e-mails falsos ameaçando bombas.", "titulo_pt": "Falsas ameaças de bombas atingem escolas em Itália, reino unido e irlanda", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 258272, "titulo": "Democrats pledge to expose ‘absolute avalanche of corruption’ under Trump", "url": "https://www.ft.com/content/3d3fcb94-143d-446c-8b09-b1f830ca97e9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-11T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O congressista Jamie Raskin promete iniciar uma investigação abrangente sobre o presidente Trump e seus aliados. Ele alerta, no entanto, para que o partido evite uma distração pelo processo de impeachment.", "titulo_pt": "Democratas prometem investigar 'avalanche de corrupção' de Trump", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 258231, "titulo": "France turns back Israeli settler representative upon arrival in Paris", "url": "https://www.france24.com/en/france/20261111-france-turns-back-israeli-settler-representative-upon-arrival-in-paris", "fonte_id": "france24", "data_pub": "2026-11-11T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo francês impediu a entrada de Yossi Dagan, chefe do Samaria Regional Council, após seu aterriso em um aeroporto parisiense. Dagan, que estava envolvido com as colônias israelenses ilegais na Cisjordânia ocupada, foi banido do território francês.", "titulo_pt": "França impede entrada de representante de colonos israelenses em Paris", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 257978, "titulo": "Minerva registra prejuízo de R$ 717 milhões no 3º trimestre de 2026", "url": "https://www.cnnbrasil.com.br/agro/minerva-registra-prejuizo-de-r-717-milhoes-no-3o-trimestre-de-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Minerva registrou um prejuízo de R$ 717 milhões no terceiro trimestre de 2026. O EBITDA totalizou R$ 1,2 bilhão, mas o resultado financeiro negativo pressionou o balanço da companhia, que encerrou o trimestre com uma alavancagem de 3,2 vezes.", "titulo_pt": "Minerva registra prejuízo de R$ 717 milhões no 3º trimestre de 2026", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 257797, "titulo": "Senado aprova renegociação de dívidas rurais após concessões para atender agro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/senado-aprova-renegociacao-de-dividas-rurais-apos-concessoes-para-adender-agro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal aprovou a Medida Provisória (MP) de renegociação de dívidas de produtores rurais sem votação nominal, após o texto perderia a validade. A aprovação foi simbólica na sessão realizada na quarta-feira (11).", "titulo_pt": "Senado aprova renegociação de dívidas rurais após perda de validade da mp", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 258274, "titulo": "ExxonMobil launched legal challenge to EU carbon capture rules", "url": "https://www.ft.com/content/377d2ae5-112f-411f-bfc1-5e498948cb7b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-11T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de petróleo americana ExxonMobil ingressou com um desafio legal contra as regras de captura de carbono da União Europeia, utilizando um tratado de investimento e buscando a suspensão das exigências temporais.", "titulo_pt": "Exxonmobil lança desafio legal às regras de captura de carbono da ue", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 257798, "titulo": "Empresa de cigarro critica emendas para baixar Imposto Seletivo aplicado ao setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/empresa-de-cigarro-critica-emendas-para-baixar-imposto-seletivo-aplicado-ao-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A JTI (Japan Tobacco International) defende a manutenção da alíquota do Imposto Seletivo no valor de R$ 3,50 por maço, apesar de lobby de grandes indústrias de cigarro. Duas emendas propõem reduzir a taxa para R$ 2,25 e outra diminuir toda a tributação em 50%.", "titulo_pt": "Empresa de cigarro defende alíquota fixa no Imposto Seletivo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257857, "titulo": "BB e banco alemão farão aporte de 100 milhões de euros em bioeconomia", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/bb-e-banco-alemao-farao-aporte-de-100-milhoes-de-euros-em-bioeconomia", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-11T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco do Brasil (BB) e o banco de desenvolvimento alemão KfW anunciaram uma operação de financiamento de 100 milhões de euros para apoiar cadeias produtivas sustentáveis da bioeconomia, com foco na Amazônia. Os recursos serão utilizados para refinanciar operações de crédito do BB direcionadas a pequenos produtores, agricultores familiares, comunidades tradicionais, povos indígenas, cooperativas e micro, pequenas e médias empresas.", "titulo_pt": "BB e banco alemão farão aporte de 100 milhões de euros em bioeconomia", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 258038, "titulo": "Eletronuclear quer nova frente além de Angra 3", "url": "https://www.jota.info/energia/eletronuclear-quer-nova-frente-alem-de-angra-3", "fonte_id": "jota", "data_pub": "2026-11-11T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Eletronuclear busca expandir sua agenda além do projeto de Angra 3, focando agora na remuneração da energia excedente produzida pelas usinas Angra 1 e 2.", "titulo_pt": "Eletronuclear busca nova frente além de Angra 3", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 258039, "titulo": "STJ decide que vale-transporte pago em dinheiro integra base de cálculo do FGTS", "url": "https://www.jota.info/trabalho/stj-decide-que-vale-transporte-pago-em-dinheiro-integra-base-de-calculo-do-fgts", "fonte_id": "jota", "data_pub": "2026-11-11T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STJ decidiu que o vale-transporte pago em dinheiro integra a base de cálculo do FGTS. Segundo a 1ª Seção, apenas o valor concedido por meio do sistema de transporte público está fora da incidência.", "titulo_pt": "STJ decide que vale-transporte em dinheiro conta para cálculo do FGTS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 258040, "titulo": "A urgência que a economia impõe à regulação dos mercados digitais", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-urgencia-que-a-economia-impoe-a-regulacao-dos-mercados-digitais", "fonte_id": "jota", "data_pub": "2026-11-11T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A urgência da regulação dos mercados digitais é necessária para evitar aprofundar dependências e reduzir oportunidades de inovação.", "titulo_pt": "A urgência da regulação dos mercados digitais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 258041, "titulo": "PL de mercados digitais pode avançar sem responder quanto custa e quem paga a conta da regulação", "url": "https://www.jota.info/coberturas-especiais/pl-de-mercados-digitais-pode-avancar-sem-responder-quanto-custa-e-quem-paga-a-conta-da-regulacao", "fonte_id": "jota", "data_pub": "2026-11-11T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei sobre mercados digitais pode ser aprovado sem esclarecer os custos ou a fonte de financiamento da regulação. O site Camara-e.net destaca a falta de estudos sobre os impactos econômicos da proposta e alerta para o aumento potencial de custos ao longo da cadeia.", "titulo_pt": "PL de mercados digitais pode avançar sem detalhar custos e fonte de financiamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 257858, "titulo": "Governo anuncia medidas de ajuste para economia de até R$ 60 bilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/governo-anuncia-medidas-de-ajuste-para-economia-de-ate-r-60-bilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-11T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal prepara um pacote de medidas de ajuste fiscal com potencial de economizar entre R$ 50 bilhões e R$ 60 bilhões em 2027. A proposta foi apresentada pelo ministro do Planejamento e Orçamento, Bruno Moretti, durante uma audiência pública na Comissão Mista de Orçamento (CMO), no Congresso Nacional.", "titulo_pt": "Governo anuncia medidas de ajuste para economizar até R$ 60 bilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 257804, "titulo": "Aliados do setor de tecnologia defendem Jensen Huang e o consideram essencial na corrida pela IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/aliados-do-setor-de-tecnologia-defendem-jensen-huang-e-o-consideram-essencial-na-corrida-pela-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Poucas horas após Jensen Huang admitir ter sido infiel à sua mulher, investidores influentes do Vale do Silício defenderam o executivo, considerando-o essencial para a corrida pela IA.", "titulo_pt": "Aliados do setor de tecnologia defendem Jensen Huang e consideram-o essencial na corrida pela IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257805, "titulo": "Deloitte amplia operação no Brasil e nomeia dois novos sócios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/deloitte-amplia-operacao-no-brasil-e-nomeia-dois-novos-socios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Deloitte está expandindo suas operações no Brasil em áreas estratégicas e nomeou dois novos sócios na Monitor Deloitte, um segmento global de estratégia da empresa.", "titulo_pt": "Deloitte expande operações no Brasil e nomeia dois novos sócios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257806, "titulo": "Ações de tecnologia dos EUA sobem com retomada de aposta em inteligência artificial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/acoes-de-tecnologia-dos-eua-sobem-com-retomada-de-aposta-em-inteligencia-artificial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações de empresas de tecnologia dos Estados Unidos subiram nesta quarta-feira, impulsionadas por resultados acima das expectativas da CoreWeave e por especulações sobre uma avaliação mais alta para o IPO da Anthropic.", "titulo_pt": "Ações de tecnologia dos EUA avançam com resultados positivos e especulações sobre ipo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257807, "titulo": "Galípolo defende que Banco Central não antecipe decisão sobre juros em meio a incertezas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/galipolo-defende-que-banco-central-nao-antecipe-trajetoria-de-juros-em-meio-a-incertezas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T19:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Banco Central, Gabriel Galípolo, afirmou que a instituição não antecipará a trajetória dos juros em meio às incertezas e que as decisões serão tomadas reunião a reunião.", "titulo_pt": "Galípolo defende que Banco Central não antecipe decisão sobre juros em meio a incertezas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257808, "titulo": "Petrobras avalia ajustes pontuais na política de preços dos combustíveis por guerra", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/petrobras-avalia-ajustes-pontuais-na-politica-de-precos-dos-combustiveis-por-guerra.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras considera adiar a apuração de sua política de preços da gasolina para além de dezembro de 2026 devido à elevação do preço do petróleo causada pela guerra no Irã.", "titulo_pt": "Petrobras pode adiar política de preços da gasolina por guerra no Irã", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257810, "titulo": "Operação contra Ricardo Magro e parentes apreende jatinhos, relógios e carros de luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/operacao-contra-ricardo-magro-e-parentes-apreende-jatinhos-relogios-e-carros-de-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T19:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação do Ministério Público do Rio de Janeiro, realizada nesta quarta-feira (11), resultou na apreensão de duas aeronaves, dez veículos de luxo e 50 relógios envolvendo o empresário Ricardo Magro, seus parentes e outros suspeitos.", "titulo_pt": "Operação contra Ricardo Magro e parentes apreende jatinhos, relógios e carros de luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 257496, "titulo": "Legislature uses AI to read legislation for the first time", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/12/2003867603", "fonte_id": "taipei_times", "data_pub": "2026-11-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A legislatura utilizou IA pela primeira vez para analisar leis. Este foi o primeiro uso de inteligência artificial na leitura de legislação pelo parlamento.", "titulo_pt": "Legislatura utiliza IA pela primeira vez para ler legislação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 257503, "titulo": "AI used in cyberattacks, some originating in HK", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/12/2003867610", "fonte_id": "taipei_times", "data_pub": "2026-11-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de inteligência artificial está sendo empregado em ataques cibernéticos, alguns dos quais têm origem na região administrativa especial de Hong Kong.", "titulo_pt": "IA utilizada em ataques cibernéticos, alguns deles provenientes de hong kong", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 258091, "titulo": "“Prohibir la IA es absurdo”: académicos alertan problemas para evaluar trabajos de sus alumnos", "url": "https://www.latercera.com/educacion/noticia/prohibir-la-ia-es-absurdo-academicos-alertan-problemas-para-evaluar-trabajos-de-sus-alumnos/", "fonte_id": "la_tercera", "data_pub": "2026-11-11T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em menos de dois anos, a educação universitária mudou drasticamente, com professores se adaptando a um novo cenário cheio de incertezas. Hoje, os ensaios são considerados impossíveis.", "titulo_pt": "Proibir a IA é absurdo: acadêmicos alertam sobre desafios na avaliação dos alunos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258225, "titulo": "Scoop: Lutnick stalled curbing Nvidia chip sales to China — again — after Oval Office showdown", "url": "https://www.axios.com/2026/11/11/trump-lutnick-nvidia-china-chip-export-controls", "fonte_id": "axios", "data_pub": "2026-11-11T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump autorizou, pela terceira vez este ano, uma investigação mais rigorosa contra empresas suspeitas de desviar chips de inteligência artificial da Nvidia para a China. No entanto, o Comércio dos EUA, sob a liderança de Howard Lutnick, tem obstaculizado essas medidas. Este impasse ilustra um possível fracasso nas tentativas de manter tecnologia americana fora das mãos da China, levantando dúvidas sobre a inação do governo Trump em relação à empresa centralmente envolvida em supostos esquemas de espionagem e desvio de chips.", "titulo_pt": "Lutnick impede investigação de venda de chips Nvidia para a China pela terceira vez este ano", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 258297, "titulo": "T-Mobile illegally imposed 50GB cap on low-income home Internet plan, NY says", "url": "https://arstechnica.com/tech-policy/2026/11/t-mobile-illegally-imposed-50-gb-cap-on-low-income-home-internet-plan-ny-says/", "fonte_id": "ars_technica", "data_pub": "2026-11-11T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei exige uma velocidade mínima de 25 Mbps para o Internet doméstica. No entanto, a T-Mobile reduziu a velocidade para 600 Kbps após o limite de 50GB ser atingido no plano de Internet para famílias de baixa renda.", "titulo_pt": "T-mobile imposta ilegalmente cotação de 50GB no plano de Internet doméstica para baixa renda, diz NY", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 258298, "titulo": "Anduril says its first satellite can see adversaries maneuver in orbital night", "url": "https://arstechnica.com/space/2026/11/anduril-demos-night-vision-sensor-for-tracking-satellites-in-darkness/", "fonte_id": "ars_technica", "data_pub": "2026-11-11T20:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anduril afirma que seu primeiro satélite tem uma ampla faixa dinâmica, permitindo que ele visualize adversários mesmo em condições de total escuridão.", "titulo_pt": "Anduril diz que seu primeiro satélite pode ver adversários em noite orbital total", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 258303, "titulo": "Why the data center you dread might never even be built", "url": "https://techcrunch.com/video/why-the-data-center-you-dread-might-never-even-be-built/", "fonte_id": "techcrunch", "data_pub": "2026-11-11T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O boom de centrais de dados está encontrando obstáculos reais, como oposição local e atrasos na obtenção de permissões, além de uma corrida pelo acesso à energia elétrica. Muitos dos projetos anunciados podem nunca serem construídos, mesmo antes de enfrentar essas dificuldades.", "titulo_pt": "Por que a central de dados que você teme pode nunca ser construída", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 258304, "titulo": "Meta is losing its longtime head of infrastructure", "url": "https://techcrunch.com/2026/11/11/meta-is-losing-its-longtime-head-of-infrastructure/", "fonte_id": "techcrunch", "data_pub": "2026-11-11T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Santosh Janardhan, que originalmente ingressou na empresa em 2009, está deixando seu cargo de chefe de infraestrutura.", "titulo_pt": "Meta perde seu chefe de infraestrutura após longa permanência", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 258305, "titulo": "Olaf Sakkers is betting he can beat the emerging-manager squeeze", "url": "https://techcrunch.com/2026/11/11/olaf-sakkers-is-betting-he-can-beat-the-emerging-manager-squeeze/", "fonte_id": "techcrunch", "data_pub": "2026-11-11T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Olaf Sakkers tem dedicado os últimos cinco anos a demonstrar que ser um gestor emergente de venture capital não é impossível, mesmo em tempos desafiadores. Entrar nesse mercado sempre foi difícil, especialmente para gestores iniciantes.", "titulo_pt": "Olaf Sakkers aposta em superar a dificuldade de gestores emergentes de venture capital", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 258309, "titulo": "I Saw the Future of Robotics in a Virtual Duck That Chases My Cat", "url": "https://www.wired.com/story/i-trained-a-microduck-to-be-my-cats-butler/", "fonte_id": "wired", "data_pub": "2026-11-11T19:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um modelo de inteligência artificial da OpenAI auxiliou na programação do Microduck para andar em waddle e servi-lo como um pequeno ajudante de gato.", "titulo_pt": "Vi o futuro dos robôs em um pato Virtual que persegue o meu gato", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 258306, "titulo": "CoreWeave turns to customer prepayments, shorter contracts to fund AI growth", "url": "https://techcrunch.com/2026/11/11/coreweave-turns-to-customer-prepayments-shorter-contracts-to-fund-ai-growth/", "fonte_id": "techcrunch", "data_pub": "2026-11-11T19:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CoreWeave está cada vez mais solicitando que os clientes paguem à vista, emprestando contra contratos específicos, e até mesmo considerando contratos de curto prazo que podem resultar em preços mais altos, de acordo com os resultados do terceiro trimestre da empresa.", "titulo_pt": "Coreweave apela para pré-pagamentos de clientes e contratos mais curtos para financiar crescimento da IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 258307, "titulo": "With $720M round, Britain’s Fractile gets a leg up in the race for AI chips", "url": "https://techcrunch.com/2026/11/11/with-720m-round-britains-fractile-gets-a-leg-up-in-the-race-for-ai-chips/", "fonte_id": "techcrunch", "data_pub": "2026-11-11T19:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fractile, uma empresa britânica, recebeu uma rodada de financiamento no valor de $720 milhões, tornando-a uma das empresas mais bem financiadas na corrida pelos processadores de inteligência artificial (AI chips).", "titulo_pt": "Com rodada de $720 milhões, Fractile se destaca na corrida pelos chips de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 258308, "titulo": "Congress to call Jensen Huang in to answer for alleged Chinese spy affair", "url": "https://techcrunch.com/2026/11/11/congress-to-call-jensen-huang-in-to-answer-for-alleged-chinese-spy-affair/", "fonte_id": "techcrunch", "data_pub": "2026-11-11T19:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, foi convocado pelos republicanos do Congresso para uma reunião fechada para esclarecer acusações sobre sua relação com suposto espia chinês.", "titulo_pt": "Congresso convoca ceo da nvidia para esclarecer acusações de relação com suposto espia chinês", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 258299, "titulo": "NASA's secret weapon in the lunar space race may be ... procurement reform?", "url": "https://arstechnica.com/space/2026/11/nasa-takes-an-all-hands-on-deck-approach-in-its-return-to-the-moon/", "fonte_id": "ars_technica", "data_pub": "2026-11-11T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está avançando rapidamente com suas compras para a missão lunar, com um ritmo e natureza de contratações sem precedentes.", "titulo_pt": "A arma secreta da nasa na corrida lunar pode ser... Reforma de contratações?", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 258300, "titulo": "Taiwan’s chipmaking giant TSMC to invest $1B in Anthropic, OpenAI", "url": "https://arstechnica.com/ai/2026/11/taiwans-chipmaking-giant-tsmc-to-invest-1b-in-anthropic-openai/", "fonte_id": "ars_technica", "data_pub": "2026-11-11T18:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante da fabricação de chips TSMC investirá 1 bilhão de dólares em empresas de inteligência artificial, incluindo a Anthropic e a OpenAI. Este é o último exemplo de financiamento circular no boom da IA.", "titulo_pt": "Taiwan’s chipmaking giant TSMC to invest $1B in Anthropic, OpenAI", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 257897, "titulo": "Grupo Ultra lança programa de estágio em IA com bolsa de R$ 3,2 mil e vagas em cinco empresas", "url": "https://exame.com/carreira/grupo-ultra-lanca-programa-de-estagio-em-ia-com-bolsa-de-r-32-mil-e-vagas-em-cinco-empresas/", "fonte_id": "exame", "data_pub": "2026-11-11T18:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Ultra lançou um programa de estágio em Inteligência Artificial com bolsa de R$ 3,2 mil e vagas em cinco empresas. Um dos diferenciais do programa é o modelo de job rotation, que permitirá aos participantes circular pelas diferentes empresas do grupo durante o estágio.", "titulo_pt": "Grupo Ultra lança programa de estágio em IA com bolsa de R$ 3,2 mil e vagas em cinco empresas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 257974, "titulo": "Uma nova e gigantesca simulação oferece um vislumbre dos primeiros 2 bilhões de anos do Universo", "url": "https://www.cnnbrasil.com.br/ciencia/uma-nova-e-gigantesca-simulacao-oferece-um-vislumbre-dos-primeiros-2-bilhoes-de-anos-do-universo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma equipe internacional de pesquisadores desenvolveu um dos modelos mais detalhados já criados do Universo primitivo, oferecendo uma visão dos primeiros 2 bilhões de anos do cosmos.", "titulo_pt": "Nova simulação gigantesca oferece vislumbre dos primeiros 2 bilhões de anos do Universo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 257871, "titulo": "Academia Brasileira de Ciências apresenta documento para orientar atuação do Brasil na COP31", "url": "https://veja.abril.com.br/ciencia/academia-brasileira-de-ciencias-apresenta-documento-para-orientar-atuacao-do-brasil-na-cop31/", "fonte_id": "veja", "data_pub": "2026-11-11T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Academia Brasileira de Ciências apresentou um documento com orientações para a participação do Brasil na COP31. O documento sugere que outros biomas brasileiros além da Amazônia também devem ser considerados nas discussões.", "titulo_pt": "Academia Brasileira de Ciências apresenta documento para orientar atuação do Brasil na COP31", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 258313, "titulo": "Record-breaking 2025 Iberian fire season was three times larger due to climate change", "url": "https://phys.org/news/2026-11-iberian-season-larger-due-climate.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório global mais recente sobre incêndios florestais, co-liderado pela Universidade de East Anglia, indica que as condições climáticas extremamente propícias a incêndios verificadas em Espanha e Portugal em 2025 eram três vezes mais prováveis devido ao aquecimento global causado pelo homem, e a área queimada foi três vezes maior.", "titulo_pt": "Verão de incêndios na península ibérica de 2025 foi três vezes maior devido ao aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258314, "titulo": "Living with humility took on social weight in the late Middle Ages, historian argues", "url": "https://phys.org/news/2026-11-humility-social-weight-late-middle.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No final da Idade Média, a humildade tornou-se uma virtude socialmente valorizada. Era considerada uma das virtudes fundamentais da vida cristã, associada a monastérios onde monges flagelavam-se para mostrar sua humildade diante de Deus e a criação.", "titulo_pt": "A humildade adquiriu peso social no final da idade média, argumenta historiador", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258337, "titulo": "All of Us study finds thousands of new genetic variants affecting drug responses", "url": "https://www.statnews.com/2026/11/11/all-of-us-study-finds-gene-variants-drug-responses/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo que analisou quase 100 mil americanos de diversa origem identificou milhares de novas variações genéticas que afetam as respostes a medicamentos prescritos.", "titulo_pt": "Estudo all of Us descobre milhares de novas variações genéticas afetando respostas a medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 258315, "titulo": "More important than tropical cyclones: Scientists finally track the hidden weather systems behind most tropical rainfall", "url": "https://phys.org/news/2026-11-important-tropical-cyclones-scientists-track.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores australianos identificaram e rastrearam os sistemas meteorológicos que contribuem mais para a precipitação tropical do que os ciclones tropicais. Este estudo, publicado na revista Weather and Climate Dynamics, apresenta uma nova abordagem para investigar como a chuva tropical pode mudar à medida que o planeta se aquece.", "titulo_pt": "Mais importantes que os ciclones tropicais: cientistas identificam sistemas meteorológicos ocultos responsáveis pela maioria da precipitação tropical", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258316, "titulo": "How pipes became status symbols in 18th-century Sweden", "url": "https://phys.org/news/2026-11-pipes-status-18th-century-sweden.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No século 18, uma pipa de tabaco de barro podia revelar mais do que se imagina. Seu comprimento, qualidade e estado, bem como a maneira como era usada, podiam indicar o status social da pessoa. Um novo tese de doutorado da arqueóloga Robert Bergman Carter da Universidade de Lund mostra como as pipas na época serviam como marcadores claros de status social.", "titulo_pt": "Como as pipas se tornaram símbolos de status no século 18 na suécia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258317, "titulo": "Why holding on to loyal donors is not the right advice for every nonprofit", "url": "https://phys.org/news/2026-11-loyal-donors-advice-nonprofit.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostra que a valorização de doadores leais não é aconselhável para todas as organizações sem fins lucrativos, pois o valor do doador depende da estrutura da organização. Para muitas organizações, conquistar novos doadores é mais importante do que manter os leais.", "titulo_pt": "Por que manter doadores leais não é o conselho correto para todas as ongs", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258318, "titulo": "Why similar changes in cloud cover can have different climate effects", "url": "https://phys.org/news/2026-11-similar-cloud-climate-effects.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As nuvens baixas marinhas nas oceânicas subtropicais orientais influenciam significativamente a temperatura da Terra refletindo a luz solar de volta ao espaço. Entender como essas nuvens mudarão à medida que o planeta aquece é uma das maiores incertezas na previsão da severidade do aquecimento futuro.", "titulo_pt": "Por que mudanças semelhantes nas coberturas de nuvens podem ter efeitos climáticos diferentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258319, "titulo": "Deep-sea mollusk houses bacteria in tiny 'dragon balls,' revealing a new symbiotic structure", "url": "https://phys.org/news/2026-11-deep-sea-mollusk-houses-bacteria.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Ciência e Tecnologia da Hong Kong descobriram uma estrutura organelar desconhecida em um molusco marinho que vive em seepagens frias do Mar da China do Sul. Essa nova estrutura especializada é dedicada à manutenção de uma simbiose bacteriana, fornecendo novas perspectivas sobre como organismos marinhos profundos se adaptam a ambientes quase sem oxigênio e abrindo novas direções para a pesquisa sobre simbiose química, evolução organelar e ecossistemas marinhos profundos.", "titulo_pt": "Molusco marinho de águas profundas abriga bactérias em 'pequenas esferas dragão', revelando uma nova estrutura simbiótica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258019, "titulo": "Sonda detecta em Marte gás associado a atividade vulcânica e analisa se terreno pode ser propício para vida microbiana", "url": "https://www.dw.com/pt-br/sonda-detecta-em-marte-gás-associado-a-atividade-vulcânica-e-analisa-se-terreno-pode-ser-propício-para-vida-microbiana/a-79923368?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sonda detectou cloreto de hidrogênio em fissuras do Monte Alba, indicando atividade vulcânica no planeta. A descoberta levanta a possibilidade de sistemas hidrotermais que poderiam suportar a existência de vida microbiana.", "titulo_pt": "Sonda encontra gás associado a atividade vulcânica em Marte e analisa possibilidade de vida microbiana", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257648, "titulo": "PAHO secures first-ever region-wide access agreements for HPV testing across Latin America and the Caribbean, with support from Unitaid", "url": "https://www.paho.org/en/news/11-11-2026-paho-secures-first-ever-region-wide-access-agreements-hpv-testing-across-latin", "fonte_id": "paho", "data_pub": "2026-11-11T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO (Organização Pan-Americana da Saúde) conseguiu acordos de acesso regionais para testes de HPV pela primeira vez em toda a América Latina e Caribe, com apoio da Unitaid. Esses acordos visam melhorar o acesso a testes de HPV na região.", "titulo_pt": "PAHO conquista primeiros acordos regionais de acesso a testes de HPV em toda a américa latina e caribe, com apoio da Unitaid", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 258338, "titulo": "STAT+: Most-favored nations policy makes drugmakers rethink launches abroad", "url": "https://www.statnews.com/2026/11/11/biotech-news-mfn-makes-drugmakers-rethink-launches-abroad/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de medicamentos parecem estar buscando maneiras de proteger suas vendas nos Estados Unidos contra a política 'mais favorecidos nas nações' do governo Trump, possivelmente reavaliando lançamentos em outros países.", "titulo_pt": "Política de países mais favorecidos faz empresas de medicamentos reavaliarem lançamentos nos estados unidos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 258339, "titulo": "Stone Age children left fingerprints on ancient art projects", "url": "https://www.sciencenews.org/article/stone-age-children-made-art-clay-sculpt", "fonte_id": "science_news", "data_pub": "2026-11-11T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Folhas de argila antigas preservadas mostram impressões digitais de crianças Natufianas, sugerindo que os adultos ensinaram os filhos a modelar argila.", "titulo_pt": "Crianças da era do pedra deixaram impressões digitais em arte antiga", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 258340, "titulo": "Newfound invisible object in space could be a rare supermassive neutron star", "url": "https://www.scientificamerican.com/article/newfound-invisible-object-in-space-could-be-a-rare-supermassive-neutron-star/", "fonte_id": "scientific_american", "data_pub": "2026-11-11T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram algo estranho em um sistema estelar distante, ou melhor, o que é estranho é o que eles não viram. Resolver este mistério poderia revelar novas áreas da astrofísica.", "titulo_pt": "Novo objeto invisível no espaço pode ser uma rara supermassa de neutrônicos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 257893, "titulo": "Manuscritos de 1.000 anos revelam DNA de vírus que ainda ameaça ovelhas", "url": "https://exame.com/ciencia/manuscritos-de-1-000-anos-revelam-dna-de-virus-que-ainda-ameaca-ovelhas/", "fonte_id": "exame", "data_pub": "2026-11-11T18:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Manuscritos de 1.000 anos contêm DNA de um vírus que afeta as ovelhas, ajudando a reconstruir a evolução desse vírus ao longo de milhares de anos. Pergaminhos feitos com peles de animais preservaram vestígios genéticos do vírus.", "titulo_pt": "Manuscritos de 1.000 anos revelam DNA de vírus que ainda ameaça as ovelhas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 258355, "titulo": "Art Bros About to Get More Insufferable as Artnet Partners With Kalshi", "url": "https://hyperallergic.com/art-bros-about-to-get-more-insufferable-as-artnet-partners-with-kalshi/", "fonte_id": "hyperallergic", "data_pub": "2026-11-11T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Artnet, agora sob nova propriedade privada, vai 'curadorizar' apostas de mercado de arte para a plataforma controversa Kalshi. A parceria pode levar a apostas cada vez mais insuportá
