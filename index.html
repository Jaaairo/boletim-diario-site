<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

<script>
const D = {"gerado_em": "12/11/2026 07:29", "stats": {"noticias_novas": 784, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O União Brasil não planeja fornecer apoio integral a Lula, o que pode dificultar a participação do partido em um ministério durante o governo do presidente eleito. O cenário político enfrenta desafios como a crise institucional, especialmente no caso do Banco Master, onde houve troca de delegados, o que pode afetar a investigação de corrupção. O governo Lula busca soluções, como a proposta de ajuste fiscal que prevê cortes de gastos tributários e a implementação de medidas para ganhar tempo com o plano Moretti. A violência política, principalmente de gênero e raça, tem aumentado, intimidando mulheres eleitas para o cargo de 2026, conforme relatado pela newsletter Todas. Além disso, o STJ decidiu que ações relacionadas a saúde, educação e assistência social permitem transferências de recursos mesmo em situações de pendências fiscais.", "mundo": "Scott Colom, um democrata e candidato negro, venceu a eleição histórica para o Senado no Mississippi, uma vitória significativa para o Partido Democrata em um estado tradicionalmente republicano. Isso marca o primeiro senador negro eleito pelo Mississippi em 140 anos. Este resultado se soma à vitória do democrata Mary Peltola na eleição do Senado no Alasca, mantendo a esperança de que o Partido Democrata possa garantir a maioria no Senado. Paralelamente, na Espanha, ocorreu a primeira greve geral nacional em 14 anos, no dia anterior às eleições antecipadas, evidenciando o descontentamento da população com a crise imobiliária e a diminuição do poder de compra. Na Alemanha, a polícia realizou operações contra a gangue de motociclistas Gremium MC, enquanto na China, relatos sugerem que relações íntimas podem estar sendo usadas para operações de espionagem. Na Indonésia, o vice-presidente renunciou devido a um escândalo envolvendo o diploma, e na Venezuela, o governo está avaliando a privatização de empresas expropriadas durante o governo do chavismo.\n\nAs tensões geopolíticas continuam dominando a cena internacional. Em primeiro lugar, a Coreia do Norte ameaçou possíveis ações em resposta a uma suposta concentração naval liderada pelos Estados Unidos, refletindo a crescente tensão na região do Pacífico. Em segundo, a Coreia do Sul planeja uma visita do Ministro das Relações Exteriores, Cho Hyun, à China para discutir a Coreia do Norte e as relações bilaterais, indicando a importância da cooperação regional. Além disso, a China reiterou sua posição sobre a reunificação pacífica da Taiwan com a China, com Xi Jinping chamando para a solução pacífica desta questão histórica. Em outro desenvolvimento, Israel atingiu um hospital em Gaza, deixando seis mortos, enquanto o Irã ameaçou retaliar de forma ampliada em resposta a possíveis ataques israelenses. Estes eventos refletem a complexidade e a volatilidade das relações internacionais atualmente.", "economia": "O Reino Unido registrou um crescimento do PIB de 0,7% no terceiro trimestre, impulsionado principalmente pelo setor de serviços. No entanto, o Banco do Brasil enfrenta dificuldades com a inadimplência de produtores rurais, o que resultou em uma queda de 66,5% no lucro líquido do terceiro trimestre, totalizando R$ 1,3 bilhão. O Brasil também registrou uma das piores avaliações do mundo na tributação de bebidas alcoólicas, com um score de 0,33 na escala de zero a cinco. A Petrobras pode ter que devolver R$ 3,6 bilhões a compradores de gasodutos vendidos durante o governo Bolsonaro, devido a uma cláusula não divulgada no contrato. O Banco do Brasil anunciou um corte de dividendos para preservar o capital, após uma nova queda no lucro. A Minerva registrou um prejuízo de R$ 717 milhões no terceiro trimestre, pressionado por um resultado financeiro negativo. A União Europeia e o Reino Unido planejam adiar a aplicação de uma taxa de 10% sobre veículos elétricos. A Intel China planeja usar energia renovável para criar tokens de IA com pods de computação, enquanto a Nomura considera a venda de sua unidade de criptomoedas. O iene está perto de atingir o nível chave de ¥160 ante o dólar, após dados de inflação dos Estados Unidos, aumentando o risco de intervenção monetária. O Banco do Brasil também enfrenta problemas com empréstimos ao agronegócio, com perdas que contribuíram para a redução de 66,5% no lucro líquido. A JTI (Japan Tobacco International) critica emendas que propõem reduzir o Imposto Seletivo aplicado ao setor de cigarros. A KOGAS, empresa de gás estatal da Coreia do Sul, registrou lucros líquidos no terceiro trimestre que triplicaram em comparação com o ano anterior, devido a ganhos em investimentos e redução de custos. A reforma tributária e as concessões de saneamento visam reequilibrar o cenário econômico-financeiro, além de abordar as tarifas, enquanto a dependência de serviços digitais externos ameaça a soberania nacional do Brasil.", "tecnologia": "A incerteza sobre o futuro do CEO da Nvidia, Jensen Huang, após relatos de dois casos de infidelidade extraconjugal, é o principal tema desta edição de tecnologia. O conselho da empresa está avaliando suas opções, o que levanta preocupações sobre a continuidade do desenvolvimento da Inteligência Artificial (IA) na empresa. A Nvidia está colaborando com uma empresa externa para identificar novos candidatos a CEO, destacando a falta de um plano de sucessão para Huang. Além disso, a empresa enfrenta pressões adicionais devido a suspeitas de traição à nação relacionadas a uma mulher chinesa, o que levanta questões sobre a iniciativa chinesa em Silicon Valley. Em outro desenvolvimento, a Naver firmou um contrato de serviços de computação de IA no valor de US$1,5 bilhão com uma empresa norte-americana, estabelecendo seu primeiro grande cliente para o negócio de AI Factory. O mercado chinês de dramas curtos gerados por IA também está expandindo rapidamente, criando novas oportunidades de receita para empresas como a Seedance e Volcengine, afiliadas à ByteDance. Além disso, a Aleees, fabricante de cátodos de fósforo de ferro-lítio (LFP), assinou um memorando de entendimento com um parceiro norte-americano para produzir cátodos de LFP, em resposta à crescente demanda por baterias de energia e armazenamento de energia.", "ciencia": "Um majestoso navio de passageiros do século XX, o SS United States, transportou líderes reais, estrelas do cinema e até mesmo a 'Mona Lisa' para os Estados Unidos. Ele foi deliberadamente afundado perto da Flórida para se transformar na maior ilha artificial do mundo, criando um recife de corais. Em um avanço na pesquisa sobre Alzheimer, um medicamento experimental foi descoberto com potencial para reparar o dano neuronal e reduzir a inflamação cerebral associada à doença. Além disso, a Força Espacial dos Estados Unidos realizou sua segunda missão classificada em seis dias, enquanto a NASA anunciou a alinhamento lunar, vênusino e estrela Spica para 12 de novembro de 2026. Estudos sobre microplásticos em mamíferos selvagens e a evolução da tuberculose bovina em diferentes regiões do País de Gales também merecem destaque na pesquisa científica recente.", "cultura": "O Papa Francisco iniciou a última etapa de sua viagem pela América do Sul em Lima, no Peru, sendo recebido pela presidente Dina Boluarte. Na quinta-feira, ele participará de uma celebração na Catedral de Lima e uma vigília com jovens. No Brasil, a atriz Analu Pimenta venceu na categoria de melhor atriz em musicais com sua interpretação de Tina Turner no Prêmio Bibi Ferreira, fazendo a plateia vibrar no Teatro Renault. Em Hong Kong, um grupo de artes cênicas pediu ao governo que dê mais peso a critérios qualitativos na determinação dos critérios de financiamento das organizações locais, alegando que tendências sociais mudaram contribuíram para a diminuição do público. A Globo reeditou e alterou o tratamento de imagem da novela 'Lá na Minha Terra' para tentar atenuar críticas sobre a representação do Nordeste, sem mudar a trama inicial, mas ajustando-a após pesquisas.", "sociedade": "A Espanha teve uma greve geral de 24 horas, convocada por sindicatos e movimentos populares, em protesto contra a especulação imobiliária, salários baixos e a precarização dos serviços públicos. A paralisação, que aconteceu 18 dias antes das eleições, uniu trabalhadores de diferentes setores e pressionou tanto o governo quanto a oposição. Em outro destaque, o Distrito Federal oferece 958 vagas de emprego com salários até R$ 5 mil, permitindo que candidatos se insiram através do aplicativo Carteira de Trabalho Digital ou nas agências do trabalhador. Além disso, o Japão contribuirá com 294 milhões de ienes para fortalecer a coordenação entre os times médicos de emergência na Gaza, destinando os fundos ao sistema de saúde local.", "meio_ambiente": "A COP31, realizada em Antalya, na Turquia, continua debatendo sobre cidades resilientes, investimentos em infraestrutura urbana e descarbonização industrial, conforme relatos de jornais brasileiros e internacionais. O Brasil subiu seis posições no ranking de proteção climática e apresentou controles ambientais para manter suas exportações para a Europa. Durante a conferência, o ministro João Paulo Capobianco afirmou que não há contradição entre o petróleo e a transição energética. Em outro ponto do mundo, um surto de doença de Chagas foi causado por vinho de patauá contaminado em um município do Pará, resultando em uma morte. O Brasil apresenta a segunda maior delegação na conferência, enquanto outros líderes importantes, como os do G7, não compareceram. A União Europeia ainda está longe de atingir a meta de reduzir as emissões no setor de transporte em 90% até 2050, e o aquecimento global já consumiu quase toda a margem de segurança climática estabelecida pelo Acordo de Paris.", "direitos_humanos": "O Tribunal Supremo da Ilha de Trinidad e Tobago anulou uma lei de 1986 que proibia relações sexuais entre adultos do mesmo sexo consentidas, descriminalizando o sexo gay na nação caribenha. Esta decisão, que reflete o legado colonial, foi uma vitória significativa para a comunidade LGBTQ+ na região. Em outro desenvolvimento, um tribunal determinou que as fontes confidenciais são o 'órgão vital' da liberdade de imprensa, rejeitando a tentativa do governo dos Estados Unidos de monitorar as conversas de jornalistas não-suspeitos em LinkedIn. Além disso, a Comissão de Direitos Humanos pediu ao presidente da Nigéria que interceda sobre supostas violações cometidas contra os Mahamid, um grupo árabe na Nigéria. Estes eventos refletem o progresso gradual em direitos humanos em diversos países, mas também indicam persistências de desafios significativos em áreas como perseguição religiosa, perseguição política e violações de direitos de minorias."}, "resumo_do_dia": {"politica_nacional": [{"id": 258430, "titulo": "União Brasil negocia ministérios, mas descarta dar apoio integral a Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/uniao-brasil-negocia-ministerios-mas-descarta-dar-apoio-integral-a-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O União Brasil não está disposto a fornecer apoio integral a Lula em seu governo a partir do ano que vem. Isso pode dificultar a participação do partido em um ministério durante o quarto mandato de Lula.", "titulo_pt": "União Brasil negocia ministérios, mas descarta apoio integral a Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 258561, "titulo": "Reforma tributária: governo e setor privado disputam calendário; entenda", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/reforma-tributaria-governo-e-setor-privado-disputam-calendario-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T07:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresários expressam preocupações sobre obstáculos e falta de preparo para a adoção do novo sistema tributário. O Receita Federal defende a implementação, mas o secretário sugere um adiamento temporário no recolhimento da CBS.", "titulo_pt": "Reforma tributária: governo e setor privado discutem calendário; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 258563, "titulo": "Lula precisa de força para resolver crise entre Poderes, diz especialista", "url": "https://www.cnnbrasil.com.br/politica/lula-precisa-de-forca-para-resolver-crise-entre-poderes-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista em ciência política avaliou a disputa pelo controle da Polícia Federal e o cenário de crise institucional no Brasil. O presidente Lula enfrenta desafios para resolver essas questões.", "titulo_pt": "Lula precisa de força para resolver crise entre Poderes, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 258431, "titulo": "Derrotas do bolsonarismo e do trumpismo não enterram a direita radical, diz cientista político holandês", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*http "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula mencionou investimentos na economia digital, na economia verde e na economia criativa após a vitória nas eleições, seguido pela defesa do desenvolvimento de uma IA brasileira. Essas declarações foram feitas durante um discurso sobre assuntos para o novo mandato.", "titulo_pt": "Cultura tem insatisfações, críticas e fritura no Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 258434, "titulo": "Violência política de gênero e raça cresce e intimida eleitas em 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/violencia-politica-de-genero-e-raca-cresce-e-intimida-eleitas-em-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A violência política de gênero e raça tem aumentado e tem intimidado mulheres eleitas para o cargo de 2026. Este é um resumo da newsletter Todas, que aborda o tema.", "titulo_pt": "Violência política de gênero e raça cresce e intimida eleitas em 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 258646, "titulo": "PL 2.925 e o minoritário: o enforcement privado que falta", "url": "https://www.jota.info/opiniao-e-analise/artigos/pl-2-925-e-o-minoritario-o-enforcement-privado-que-falta", "fonte_id": "jota", "data_pub": "2026-11-12T05:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O investidor lesado no mercado brasileiro depende quase exclusivamente da sanção administrativa, que puni o infrator mas não oferece reparação. O texto destaca a falta de um mecanismo de enforcement privado no sistema.", "titulo_pt": "PL 2.925 e o minoritário: o enforcement privado que falta", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 258574, "titulo": "Proposta de ajuste fiscal amplia corte de gastos tributários para 20%", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/proposta-de-ajuste-fiscal-amplia-corte-de-gastos-tributarios-para-20/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T04:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de ajuste fiscal prevê um corte adicional de gastos tributários para 2022. Se aprovada, essa redução se somará aos efeitos de uma lei já aprovada pelo Congresso Nacional em 2025.", "titulo_pt": "Proposta de ajuste fiscal amplia corte de gastos tributários para 2022", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 258435, "titulo": "Bolsonaristas e aliados de Lula criticam gasto com Iphones pelo Senado e põem Alcolumbre sob pressão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/bolsonaristas-e-aliados-de-lula-criticam-gasto-com-iphones-pelo-senado-e-poem-alcolumbre-sob-pressao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T03:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Governistas e bolsonaristas criticaram a licitação do Senado para fornecimento de iPhones e outros celulares a parlamentares e servidores. A ação levanta questionamentos sobre o gasto com tecnologia no Congresso.", "titulo_pt": "Governo e bolsonaristas criticam gasto com Iphones no Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 258436, "titulo": "Justiça Eleitoral agradece órgão da Prefeitura de SP por garantir ônibus nas eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/justica-eleitoral-agradece-orgao-da-prefeitura-de-sp-por-garantir-onibus-nas-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRE-SP enviou um ofício de agradecimento à SPTrans por sua parceria na garantia do sucesso das eleições de 2026. A SPTrans recebeu o comunicado nesta , "data_pub": "2026-11-12T00:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei orçamentário prevê ajustes fiscais de até R$ 54 bilhões em 2027, incluindo a ampliação do contingenciamento, a redução de benefícios tributários e a limitação de compensações fiscais. A votação está marcada para a próxima quinta-feira (12/11).", "titulo_pt": "Pacote fiscal do governo prevê ajuste de até R$ 54 bi em 2027; veja ponto a ponto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 258395, "titulo": "Precariedade do sistema prisional entra no debate da maioridade penal", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/precariedade-do-sistema-prisional-entra-no-debate-da-maioridade-penal", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-11T23:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas comissões parlamentares da Câmara dos Deputados realizaram audiências públicas simultâneas para discutir a Proposta de Emenda à Constituição (PEC) 32/2015, que trata da redução da maioridade penal. As sessões receberam diversos participantes, incluindo juristas, advogados e representantes do governo federal e do Ministério Público.", "titulo_pt": "Precariedade do sistema prisional entra no debate sobre a maioridade penal", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 258649, "titulo": "STJ define atividades que permitem transferências mesmo com pendências fiscais", "url": "https://www.jota.info/justica/stj-define-atividades-que-permitem-transferencias-mesmo-com-pendencias-fiscais", "fonte_id": "jota", "data_pub": "2026-11-11T23:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ações relacionadas a saúde, educação e assistência social permitem transferências de recursos mesmo em situações de pendências fiscais. Essa decisão foi tomada pelo STJ (Superior Tribunal de Justiça).", "titulo_pt": "STJ define que ações de saúde, educação e assistência podem permitir transferências mesmo com pendências fiscais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 258841, "titulo": "Germany news: Police raid chapters of Gremium MC biker gang", "url": "https://www.dw.com/en/germany-news-police-raid-chapters-of-gremium-mc-biker-gang/live-79926275?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-12T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia na Alemanha Ocidental realizou operações cedo pela manhã contra uma gangue de motociclistas. O estado de Baden-Württemberg está proibindo três das suas filiais. Paralelamente, sindicatos estão planejando mais greves.", "titulo_pt": "Polícia alemã realiza operações contra gangue de motociclistas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 258960, "titulo": "La Bce pungola la Francia, 'spread alti hanno contribuito al calo dell'euro'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/12/la-bce-pungola-la-francia-spread-alti-hanno-contribuito-al-calo-delleuro_7f641870-465d-4703-8de9-4330b4b73a4b.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-12T09:54:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A BCE (Banco Central Europeu) pressiona a França sobre as altas taxas de juros, que contribuíram para a queda do euro. Um alerta foi emitido pelo Eurotower sobre as incertezas políticas.", "titulo_pt": "Bce pressiona França sobre altas taxas e incertezas políticas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 258748, "titulo": "They Left Iran, but Now the Regime Is Seizing Their Assets to Silence Them", "url": "https://www.nytimes.com/2026/11/12/world/middleeast/iran-confiscations-assets-dissidents.html", "fonte_id": "nyt_world", "data_pub": "2026-11-12T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades iranianas estão perseguindo dissidentes a spy claims to push tech 'blockade'", "url": "https://www.france24.com/en/asia-pacific/20261112-china-accuses-us-fabricating-nvidia-spy-claims-to-push-tech-blockade", "fonte_id": "france24", "data_pub": "2026-11-12T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China acusou os Estados Unidos de criar narrativas sobre espionagem para justificar uma suposta bloqueio tecnológico. Segundo a China, relatos sugerem que uma suposta amante do CEO da Nvidia teve acesso a informações de inteligência chinesas.", "titulo_pt": "China acusa EUA de 'fabricar' acusações de espionagem para justificar bloqueio tecnológico", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 258961, "titulo": "Inps, in 9 mesi assegno unico universale a 9,7 milioni figli e 6,2 milioni famiglie", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/12/inps-in-9-mesi-assegno-unico-universale-a-97-milioni-figli-e-62-milioni-famiglie_02e64950-87a2-4775-99ee-d7b24c452b34.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-12T09:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O INPS (Instituto Nazionale di Previdenza Sociale) pagará um benefício único universal a 9,7 milhões de filhos e 6,2 milhões de famílias em nove meses, com gastos estimados em 15 bilhões de euros, com valores máximos de 227 euros para a classe Isee mínima.", "titulo_pt": "Inps, em nove meses, assegura benefício único universal a 9,7 milhões de filhos e 6,2 milhões de famílias", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 258750, "titulo": "In China’s Spy Operations, Romance Can Be a Long Game", "url": "https://www.nytimes.com/2026/11/12/world/asia/china-spy-espionage-romance.html", "fonte_id": "nyt_world", "data_pub": "2026-11-12T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O affair de Jensen Huang com uma mulher, identificada por autoridades dos EUA como espiã chinesa, chamou a atenção para o papel que as relações ín
