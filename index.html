<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "13/08/2026 07:20", "stats": {"noticias_novas": 771, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula participou de um ato de lançamento da campanha no ABC, onde ouviu jingles, slogans e relatos de beneficiários dos programas sociais. Em outro evento político, Alexandre Kalil, candidato ao governo de Minas Gerais pelo PDT, foi submetido a uma sabatina promovida pela Folha/UOL. O Congresso Nacional aprovou um alívio nos impostos sobre combustíveis, enquanto a Câmara dos Deputados discutia a 'taxa das blusinhas', adiando sua análise. No âmbito judicial, o STF validou a Moratória da Soja e encerrou processos relacionados, estabelecendo prazos tributários. A área queimada no Brasil caiu 33% em meio ao risco de El Niño forte, segundo o Ministério do Meio Ambiente. O Banco de Brasília (BRB) aguarda uma reunião no STF para resolver problemas apontados pelos bancos. Além disso, a Enel recebeu apoios em reuniões com a Aneel sobre anulação de contrato na Grande São Paulo.", "mundo": "O número de civis mortos na Ucrânia em julho atingiu o nível mais alto desde maio de 2022, conforme informou a ONU. Em outro desenvolvimento, o embaixador dos Estados Unidos em Israel, David Friedman, condenou uma operação de sitiamento por judeus colonos contra palestinos na vila de Qusra, no Vale Ocidental, descrevendo-a como um 'atrocidade de terror'. Na África do Sul, as irmãs Chawinga marcaram os gols que levaram Malawi à final do Women's Africa Cup of Nations ao derrotarem o Algeria por 3-1. A Coreia do Sul sediará uma reunião ministerial econômica com países africanos no mês de setembro, enquanto a Índia enfrenta pressões políticas devido a um acordo assinado entre o Paquistão, a Arábia Saudita e a Turquia. Além disso, a Casa Branca anunciou que sua secretária de imprensa Karoline Leavitt deixará seu cargo no final deste mês.\n\nA geopolítica global enfrenta diversos desafios e tensões. A Ucrânia atacou terminais de grãos russos, levantando preocupações sobre a interrupção do abastecimento global de alimentos. Moscou advertiu que isso poderia afetar o mercado mundial de alimentos. Paralelamente, o presidente russo, Vladimir Putin, visitou as ilhas Kuril disputadas com o Japão, gerando protestos do governo japonês e intensificando a tensão regional. Em outro front, o Pentágono alerta sobre a deterioração das instalações militares americanas no Pacífico, enquanto os Estados Unidos planejam minar recursos submarinos em águas profundas para desafiar a China. A Coreia do Norte disparou um míssil horas antes de manobras militares conjuntas entre EUA e Coreia do Sul, aumentando as tensões regionais. Além disso, o Japão protestou contra a visita de Putin às ilhas Kuril, enquanto Israel e Líbano se envolveram em conflitos que violaram o direito internacional.", "economia": "O Brasil e o Japão enfrentam desafios econômicos significativos. O Banco Central do Brasil multou o Banco Genial em R$ 21,6 milhões por falhas nas operações de câmbio e inabilitou executivos envolvidos. A Braskem está considerando pedir recuperação extrajudicial para equacionar suas dívidas. No Japão, o iene se aproxima de ¥160 ao dólar, com investidores cautelosos impedindo uma intervenção coordenada. Em outro desenvolvimento, o presidente Lula assinou um decreto abrindo o mercado livre de energia para pequenos consumidores, parte de uma série de medidas relacionadas à transição energética. Entre as empresas, a Hon Hai superou as estimativas de lucro, enquanto a American Airlines reorganiza sua alta liderança, pressionada para reduzir a distância em relação às rivais. A adoção da inteligência artificial no Brasil pode gerar R$ 986,7 bilhões até 2030, segundo um estudo inédito do Reglab.", "tecnologia": "A Europa está entrando numa nova era de hardware com a Proposta de Lei do Acelerador Industrial Europeu (IAA), que visa garantir que a produção seja realizada dentro da União. Em 2026, o mercado chinês de chips de inteligência artificial de alta gama pode chegar a cerca de 90% de participação nacional, com soluções locais dominando quase 90% das vendas. A Coreia do Sul concluiu recentemente o desenvolvimento de sua primeira constelação de satélites pequenos e o serviço de concierge baseado em inteligência artificial da Yanolja está sendo expandido para todo o mundo após testes bem-sucedidos na Índia. Além disso, a indústria de notebooks taiwanesa manteve-se estável no segundo trimestre de 2026, enquanto empresas como Pegatron e Qisda intensificaram seus esforços em servidores de inteligência artificial e infraestrutura de IA.", "ciencia": "Um eclipse solar total será visível no dia 12 de agosto de 2026, quando a Lua passará entre a Terra e o Sol. Em San Millán de los Caballeros, Espanha, a sombra lunar cobriu completamente o disco do Sol, transformando momentaneamente o dia em noite. O fenômeno foi observado também na Groenlândia, Islândia, norte da Rússia e no Oceano Atlântico, além de Espanha. Em 2026, uma análise de raios-X em um osso fóssil sugere que o ancestral dos mamíferos nascia vivos há cerca de 236 milhões de anos, mais antigo do que se pensava anteriormente. Além disso, a NASA está atualizando seu simulador de movimento vertical para atender às necessidades modernas das missões espaciais, incluindo simulações de pilotar táxis aéreos avançados ou pousar na Lua sem sair do chão. A Virgin Galactic adiou o início dos voos comerciais de seu novo avião suborbital para janeiro de 2027, enquanto a Space Force expandiu um contrato por US$28 milhões para incluir veículos espaciais Victus Salo 2 e 3 além da aquisição anterior destinada a demonstrações de manobra orbital.", "cultura": "A nomeação de Elvira Dyangani Ose como diretora artística do Zeitz MOCAA, em Cape Town, South Africa, marca uma nova era para o museu. Com a saída da falecida Koyo Kouoh, Ose trará novas perspectivas à instituição. Paralelamente, Rosalía continua sua dedicação ao mundo da arte sem mencionar seus lançamentos recentes. Em outro contexto cultural, Ewan McGregor estreia 'O Fim da Avenida Oak', um filme que marca uma nova fase na carreira do ator versátil. Além disso, a discussão sobre música gerada por inteligência artificial ganha força, com músicos se opondo à presença de faixas criadas por AI nas paradas musicais. No entanto, o evento mais notável é a volta da TV Globinho em uma edição especial no dia 10 de outubro, marcando um retorno após 11 anos e celebrando o Dia das Crianças na Globo.", "sociedade": "Em Cali, durante um colapso escolar, a psicóloga Kelly Díaz prestou os primeiros socorros e encontrou uma menina de 10 anos morta nos seus braços. O incidente causou grande comoção na cidade colombiana e reforçou as preocupações sobre a segurança nas instituições educacionais locais. Em meio a esta tragédia, o Brasil enfrenta um retorno do sarampo após décadas de erradicação, com São Paulo realizando uma campanha de vacinação em massa para combater a doença. A certificação internacional contra o sarampo foi perdida dez anos depois da reintrodução do vírus e queda na cobertura vacinal, levando autoridades locais a intensificarem esforços para reverter essa situação.", "meio_ambiente": "As condições climáticas extremas e as mudanças ambientais têm impactado significativamente diversos países. Na França, a seca severa afeta o abastecimento de água e agrava tensões sociais. No Reino Unido, a seca e o calor intenso ameaçam os agricultores, enquanto na Califórnia, os números atípicos de raia-dourada resultam em recordes de ferimentos nas praias. No Brasil, as chuvas extraordinárias previstas para agosto devem beneficiar regiões produtivas, mas a seca persistente no Sudeste causou 23 mortes por febre maculosa entre 24 casos confirmados. A crise climática global é refletida na redução da capacidade produtiva nuclear francesa e na necessidade de adaptação urbana em face das mudanças climáticas rápidas na China.", "direitos_humanos": "A Organização Mundial da Saúde (OMS) alerta que a atual epidemia de Ebola na República Democrática do Congo está prestes a se tornar a mais letal da história, caso continue no mesmo ritmo. O diretor-gerente da OMS afirma que o surto pode ultrapassar o episódio da África Ocidental entre 2014 e 2016 em termos de mortalidade. Em outro desenvolvimento importante, vinte e seis países, incluindo França, Reino Unido e Canadá, condenaram as execuções realizadas pelo governo iraniano, que estão sendo usadas para silenciar os protestos. Essas nações, juntamente com o chefe da diplomacia da União Europeia, emitiram uma declaração conjunta contra a utilização da pena capital pelos autoridades iranianas. Além disso, o Líbano encerrou suas execuções capitais em 2026, conforme informa a Amnesty International, com três quartos do mundo abolindo a pena de morte na lei ou na prática. Por fim, a investigação da ONU relata que o exército birmanês tem aumentado o uso de paragliders motorizados, girocópteros e drones para ataques de baixa altitude utilizando explosivos não guiados contra civis em Myanmar."}, "resumo_do_dia": {"politica_nacional": [{"id": 101018, "titulo": "Jingle, slogan e relatos de beneficiários de programas sociais: como será o ato de Lula no ABC", "url": "https://www.metropoles.com/colunas/milena-teixeira/jingle-slogan-e-relatos-de-beneficiarios-de-programas-sociais-como-sera-o-ato-de-lula-no-abc", "fonte_id": "metropoles", "data_pub": "2026-08-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento de lançamento da campanha de Lula terá jingles, slogans e relatos de beneficiários dos programas sociais implementados nos governos petistas.", "titulo_pt": "Jingle, slogan e relatos de beneficiários de programas sociais: como será o ato de Lula no ABC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 101157, "titulo": "Sigilo da fonte não pode depender da conveniência do STF", "url": "https://www.jota.info/opiniao-e-analise/artigos/sigilo-da-fonte-nao-pode-depender-da-conveniencia-do-stf", "fonte_id": "jota", "data_pub": "2026-08-13T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso envolvendo uma fonte de jornalista e um ministro do Supremo Tribunal Federal (STF) ilustra os riscos à proteção constitucional do sigilo da fonte.", "titulo_pt": "Sigilo da fonte não pode depender da conveniência do STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 101067, "titulo": "Lula grava hoje vídeos de apoio a candidatos estaduais em QG da campanha", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-grava-hoje-videos-de-apoio-a-candidatos-estaduais-em-qg-da-campanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-13T07:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula está gravando vídeos de apoio a candidatos estaduais na sede da campanha. As gravações se concentrarão principalmente nos candidatos apoiados pelo petista no Nordeste.", "titulo_pt": "Lula grava hoje vídeos de apoio a candidatos estaduais em QG da campanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 100959, "titulo": "Alexandre Kalil, candidato ao Governo de Minas Gerais, participa de sabatina da Folha/UOL nesta quinta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/alexandre-kalil-candidato-ao-governo-de-minas-gerais-participa-de-sabatina-da-folhauol-nesta-quinta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre Kalil, candidato a governador de Minas Gerais pelo PDT, participará nesta quinta-feira (13) de uma sabatina promovida pela Folha e UOL. A série já recebeu Anthony Garotinho, Sergio Moro e Requião Filho.", "titulo_pt": "Alexandre Kalil participa de sabatina da Folha/UOL", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 101120, "titulo": "A Jeep está sofrendo (muito) com as chinesas. A Stellantis acha que já chega", "url": "https://braziljournal.com/a-jeep-esta-sofrendo-muito-com-as-chinesas-a-stellantis-acha-que-ja-chega/", "fonte_id": "brazil_journal", "data_pub": "2026-08-13T04:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação da Jeep no mercado de SUVs caiu drasticamente, passando de cerca de 20% para aproximadamente 10% desde 2022. Isso ocorreu após a entrada das marcas chinesas no mercado brasileiro.", "titulo_pt": "Jeep sofre (muito) com as chinesas. Stellantis acha que já chega", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 100960, "titulo": "Haddad registra candidatura ao governo de SP e declara R$ 861 mil ao TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/haddad-registra-candidatura-ao-governo-de-sp-e-declara-r-861-mil-ao-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T04:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Fernando Haddad (PT) registrou sua candidatura ao governo de São Paulo e declarou um patrimônio de R$ 861,2 mil à Justiça Eleitoral.", "titulo_pt": "Haddad registra candidatura ao governo de SP e declara R$ 861 mil ao TSE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100961, "titulo": "Plano de Flávio Bolsonaro para educação replica o pai em alfabetização e quer pagar aluno para dar reforço", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/plano-de-flavio-bolsonaro-para-educacao-replica-o-pai-em-alfabetizacao-e-quer-pagar-aluno-para-dar-reforco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T03:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano de governo de Flávio Bolsonaro para educação propõe o método fônico de alfabetização, como feito pelo governo do pai. O plano também inclui um programa chamado Programa Acolher, que prevê a remuneração de estudantes com bom desempenho para dar reforço aos colegas.", "titulo_pt": "Plano de Flávio Bolsonaro para educação repete método fônico e prevê pagamento de alunos para reforço", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100962, "titulo": "Quilombola de Pernambuco vota em quem conhece: Lula e prefeito de centro-direita", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quilombola-de-pernambuco-vota-em-quem-conhece-lula-e-prefeito-de-centro-direita.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Salgueiro, uma cidade do sertão de Pernambuco, as eleições quilombolas votam localmente. A Jurema, uma comunidade rural sem núcleo urbano, está situada nas estradas de terra da caatinga.", "titulo_pt": "Quilombolas de Pernambuco votam em quem conhecem: lula e prefeito de centro-direita", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100963, "titulo": "Kassio é criticado no TSE por supostos acenos a Flávio Bolsonaro; ministro nega", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/kassio-e-criticado-no-tse-por-supostos-acenos-a-flavio-bolsonaro-ministro-nega.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, Kassio Nunes Marques, enfrenta críticas por supostos acenos a teses da defesa de Flávio Bolsonaro na pré-campanha. Para evitar desgastes, o ministro estaria tomando ajustes na gestão.", "titulo_pt": "Kassio é criticado no TSE por supostos acenos a Flávio Bolsonaro; ministro nega", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100964, "titulo": "Não monitorei Dino, e decisão de Moraes prejudica toda a imprensa, diz jornalista alvo no Maranhão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/nao-monitorei-dino-e-decisao-de-moraes-prejudica-toda-a-imprensa-diz-jornalista-alvo-no-maranhao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jornalista Luís Pablo, alvo de um inquérito do ministro Alexandre de Moraes sobre a divulgação de informações relacionadas ao ex-governador maranhense Flávio Dino, nega ter cometido irregularidades e afirma que não monitorou o ministro ou seus familiares.", "titulo_pt": "Jornalista alvo no Maranhão diz não ter monitorado Dino e a decisão prejudica toda a imprensa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100965, "titulo": "Candidato ao governo do RN usa foto com chapéu em registro eleitoral, assim como Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/candidato-ao-governo-do-rn-usa-foto-com-chapeu-em-registro-eleitoral-assim-como-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um candidato ao governo do Rio Grande do Norte se registrou na Justiç people-worldwide-see-partial-eclipse", "fonte_id": "france24", "data_pub": "2026-08-13T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar total visível na Europa há quase 30 anos percorreu o continente na noite de ontem. Embora milhões de turistas se aglomeraram em Espanha para ver a totalidade, aproximadamente um em cada oito pessoas ao redor do mundo puderam observar um eclipse parcial.", "titulo_pt": "Eclipse solar 2026: um em cada oito pessoas no mundo vê eclipses parciais", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 101364, "titulo": "Why women in the Maghreb are having fewer children", "url": "https://www.france24.com/en/video/20260813-why-women-in-the-maghreb-are-having-fewer-children", "fonte_id": "france24", "data_pub": "2026-08-13T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A região do Maghreb tem assistido a uma queda drástica nas taxas de natalidade recentemente. Agora, a maioria das mulheres tem menos de três filhos, em comparação com os 7-8 filhos por mulher que era comum nos anos 1970.", "titulo_pt": "Por que as mulheres do Maghreb estão tendo menos filhos?", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 101365, "titulo": "🔴 Live: Ukraine's civilian deaths in July hit highest level since May 2022, UN says", "url": "https://www.france24.com/en/europe/20260813-live-russian-attack-sets-ablaze-ukraine-s-izmail-port-infrastructure", "fonte_id": "france24", "data_pub": "2026-08-13T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a ONU, o número de civis mortos na Ucrânia em julho atingiu o nível mais alto desde maio de 2022. Não há informações adicionais sobre os detalhes específicos dessas mortes ou as regiões afetadas.", "titulo_pt": "Transmissão ao vivo: número de civis mortos na Ucrânia em julho chega ao nível mais alto desde maio de 2022, diz ONU", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 101366, "titulo": "Reform UK's Farage faces off against Count Binface in election", "url": "https://www.france24.com/en/video/20260813-reform-uk-s-farage-faces-off-against-count-binface-in-election", "fonte_id": "france24", "data_pub": "2026-08-13T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Votantes expressaram seus votos em uma eleição local inglesa na qual Nigel Farage, líder da Reform UK, enfrentou seu principal adversário, um comediante vestido como um lixeiro. O evento testou a oposição às políticas populistas de Farage.", "titulo_pt": "Farage, líder do reform UK, se encontra com seu maior desafiador, um comediante vestido como uma lata de lixo, em eleição local", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 101075, "titulo": "Ucrânia ataca terminais de grãos russos e acende alerta para mercados de alimentos", "url": "https://www.infomoney.com.br/mundo/ucrania-ataca-terminais-de-graos-russos-e-acende-alerta-para-mercados-de-alimentos/", "fonte_id": "infomoney", "data_pub": "2026-08-13T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ucrânia atacou terminais de grãos russos, levantando preocupações sobre a interrupção do abastecimento global de alimentos. Moscou advertiu que isso poderia afetar o mercado mundial de alimentos.", "titulo_pt": "Ucrânia ataca terminais de grãos russos e acende alerta para mercados de alimentos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 101411, "titulo": "Japan protests as Russia’s Putin visits disputed Kuril Islands", "url": "https://www.aljazeera.com/news/2026/8/13/japan-protests-as-russias-putin-visits-disputed-kuril-islands?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo japonês protestou contra a visita do presidente russo, Putin, às ilhas Kuril, que foram ocupadas pela União Soviética em 1945. O primeiro-ministro japonês considera essa ação 'inaceitável'.", "titulo_pt": "Japão se opõe à visita de Putin às ilhas disputadas do Kuril", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 101474, "titulo": "Turkey Targets Major Religious Group With Organised Crime Charges", "url": "https://balkaninsight.com/2026/08/13/turkey-targets-major-religious-group-with-organised-crime-charges/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-13T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades turcas detiveram o líder e membros de uma das maiores comunidades religiosas do país, conhecida como os Suleymancilar, durante uma investigação sobre supostos crimes organizados e lavagem de dinheiro.", "titulo_pt": "Turquia detém líder e membros de grupamento religioso com acusações de Crime organizado", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 101250, "titulo": "How China Remembers Zhu Rongji, the Premier Who Spoke His Mind", "url": "https://www.nytimes.com/2026/08/13/world/asia/china-premier-zhu-rongji-reaction.html", "fonte_id": "nyt_world", "data_pub": "2026-08-13T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Homenagens ao ex-primeiro-ministro lembraram seu estilo animado e seus esforços para integrar a China no comércio global, em contraste com a rigidez da era Xi.", "titulo_pt": "Como a China lembra Zhu Rongji, o Premier que falava sem medo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 101388, "titulo": "Germany news: Far-right leader backs left-wing populist", "url": "https://www.dw.com/en/germany-news-far-right-leader-backs-left-wing-populist/live-78347793?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-13T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder do partido extremamente direita AfD na Thuringia, Björn Höcke, ofereceu seu apoio à populista Sahra Wagenknecht para ser a próxima primeira-ministra do estado. Além disso, o número de mortes relacionadas ao calor neste ano atingiu cerca de 12.500.", "titulo_pt": "Notícias da Alemanha: líder do extremamente direito apóia populista", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 101248, "titulo": "‘An English Summer Is Not the Same Anymore’", "url": "https://www.nytimes.com/2026/08/13/world/europe/britain-heat-records.html", "fonte_id": "nyt_world", "data_pub": "2026-08-13T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com as previsões indicando temperaturas muito altas, este verão está destinado a ser um dos mais quentes até agora.", "titulo_pt": "Um verão inglês não é mais o mesmo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 101350, "titulo": "With Russia's strikes in Ukraine and hybrid war in Europe, Kyiv's allies face heightened uncertainty", "url": "https://www.lemonde.fr/en/international/article/2026/08/13/with-russia-s-strikes-in-ukraine-and-hybrid-war-in-europe-kyiv-s-allies-face-heightened-uncertainty_6756460_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rússia intensificou os ataques a profundidade na Ucrânia e continua sua guerra híbrida contra a Europa, enquanto o apoio dos Estados Unidos está diminuindo. Washington alerta para uma possível invasão russa como teste das defesas ocidentais.", "titulo_pt": "Com os ataques da Rússia na Ucrânia e sua guerra híbrida na Europa, as aliadas de kiev enfrentam maior incerteza", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 101367, "titulo": "Search for Colombia earthquake survivors enters critical window", "url": "https://www.france24.com/en/video/20260813-search-for-colombia-earthquake-survivors-enters-critical-window", "fonte_id": "france24", "data_pub": "2026-08-13T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações de ajuda regional começaram a chegar à Colômbia nesta quarta-feira, enquanto as buscas por sobreviventes nos escombros da forte tempestade se intensificavam. O terremoto derrubou edifícios, distorceu estradas e atingiu carros.", "titulo_pt": "Busca por sobreviventes do terremoto na colômbia entra em janela crítica", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 101464, "titulo": "Minimo nell'Ue per la produzione di elettricità col carbone, sorpassata da solare", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/13/minimo-nellue-per-la-produzione-di-elettricita-col-carbone-sorpassata-da-solare_e1a28a9a-4a57-4b80-b5ab-17445092473a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-13T09:21:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A produção de eletricidade a partir do carvão na União Europeia atingiu um mínimo de 9,2% no total da produção elétrica em 2019. Em 1990, essa proporção era cerca de um terço.", "titulo_pt": "Mínimo na ue para a produção de eletricidade com carvão, superado pela energia solar", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 101368, "titulo": "Chawinga sisters shine as Malawi reach Women's Africa Cup of Nations final", "url": "https://www.france24.com/en/sport/20260813-chawinga-sisters-shine-malawi-reach-maiden-women-africa-cup-of-nations-final-cameroon", "fonte_id": "france24", "data_pub": "2026-08-13T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As irmãs Chawinga, Tabitha e Temwa, marcaram os gols que levaram Malawi à final do Women's Africa Cup of Nations ao vencerem Algeria por 3-1. Agora, Malawi enfrentará Cameroon na final, que derrotou a anfitriã Marrocos por penalidades.", "titulo_pt": "Irmãs chawinga fazem Malawi avançar para a final do Women's Africa Cup of Nations", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 101478, "titulo": "Nearly half in Japan support plan to cut tax on food, survey shows", "url": "https://www.japantimes.co.jp/news/2026/08/13/japan/politics/japan-survey-consumption-tax-cut/", "fonte_id": "japan_times", "data_pub": "2026-08-13T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada recentemente mostrou que 49,1% dos respondentes apoiam o plano de reduzir impostos sobre alimentos, enquanto 31,6% se opõem.", "titulo_pt": "Quase metade da população japonesa apoia plano para cortar imposto sobre alimentos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 101572, "titulo": "Asiana Airlines' net loss widens in Q2 on rising fuel costs", "url": "https://en.yna.co.kr/view/AEN20260813011000320", "fonte_id": "yonhap_news", "data_pub": "2026-08-13T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Asiana Airlines registrou um prejuízo líquido maior no segundo trimestre devido a aumentos nos custos do combustível.", "titulo_pt": "Prejuízo líquido da asiana Airlines se amplia no segundo trimestre devido a elevação dos custos do combustível", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 101076, "titulo": "Inflação ao produtor nos EUA, varejo no Brasil e mais destaques desta quinta-feira", "url": "https://www.infomoney.com.br/mercados/inflacao-produtor-eua-varejo-brasil-13082026/", "fonte_id": "infomoney", "data_pub": "2026-08-13T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram incluídos dados sobre a inflação ao produtor nos Estados Unidos e no varejo no Brasil, entre outros pontos importantes para os mercados nesta quinta-feira (13).", "titulo_pt": "Inflação ao produtor nos EUA, varejo no Brasil e outros destaques desta quinta-feira", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 101159, "titulo": "Pix e a nova disputa pela infraestrutura da economia digital", "url": "https://www.jota.info/opiniao-e-analise/artigos/pix-e-a-nova-disputa-pela-infraestrutura-da-economia-digital", "fonte_id": "jota", "data_pub": "2026-08-13T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Críticas dos EUA destacam uma competição que agora envolve não apenas empresas, mas também as bases tecnológicas e infraestruturais que sustentam o setor digital.", "titulo_pt": "Pix e a nova disputa pela infraestrutura da economia digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 101160, "titulo": "A centralidade do direito para a economia", "url": "https://www.jota.info/opiniao-e-analise/colunas/constituicao-empresa-e-mercado/a-centralidade-do-direito-para-a-economia", "fonte_id": "jota", "data_pub": "2026-08-13T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto reflete sobre o livro 'Pilhagem. Quando o Estado de Direito é Ilegal', escrito por Ugo Mattei e Laura Nader.", "titulo_pt": "Centralidade do direito para a economia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 101484, "titulo": "Yen closes in on ¥160 to the dollar as bears remain bold", "url": "https://www.japantimes.co.jp/business/2026/08/13/markets/yen-intervention-threat/", "fonte_id": "japan_times", "data_pub": "2026-08-13T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene está perto de atingir ¥160 para o dólar, com investidores cautelosos impedindo uma intervenção coordenada. Isso mantém a moeda japonesa em um nível próximo a esse valor sem quebrar essa barreira.", "titulo_pt": "Iene se aproxima de ¥160 por dólar com intervenção coordenada adiada", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 101162, "titulo": "A RAP das transmissoras de energia e o Tema 1.415 do STJ", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-rap-das-transmissoras-de-energia-e-o-tema-1-415-do-stj", "fonte_id": "jota", "data_pub": "2026-08-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) vai decidir se a RAP (Receita Adicional de Permuta) deve ser tributada integralmente ou separadamente entre construção e operação das transmissoras de energia.", "titulo_pt": "A RAP das transmissoras de energia e o Tema 1.415 do STJ", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 100943, "titulo": "Tarifas de Trump fazem empresas canadenses considerar mudança para os EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/tarifas-de-trump-fazem-empresas-canadenses-considerar-mudanca-para-os-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas canadenses estão reconsiderando a produção de cabos revestidos de aço, motivadas pelo medo das tarifas impostas por Trump. A Northern Cables opera continuamente para atender a esse novo cenário de incerteza.", "titulo_pt": "Tarifas de Trump fazem empresas canadenses considerar mudança para os EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 100945, "titulo": "Reforma tributária e os desafios dos saldos credores do ICMS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/08/reforma-tributaria-e-os-desafios-dos-saldos-credores-do-icms.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Reforma Tributária do Consumo, prevista pela Emenda Constitucional nº 132/2023, visa simplificar o sistema tributário brasileiro e gradualmente substituir ICMS, ISS, PIS/PASEP, COFINS e parte do IPI por novos tributos. A reforma também aborda a questão de como preservar os saldos credores de ICMS acumulados ao longo dos anos.", "titulo_pt": "Reforma tributária e os desafios dos saldos credores do ICMS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 101568, "titulo": "Seoul shares sharply up for 4th day on chip rally", "url": "https://www.koreaherald.com/article/10840508", "fonte_id": "korea_herald", "data_pub": "2026-08-13T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados acionários sul-coreanos encerraram o quarto dia consecutivo de alta, impulsionados pela compra de grandes fabricantes de chips. O índice KOSPI subiu 3,21% para fechar em 6.790,01 pontos.", "titulo_pt": "Seul registra forte alta por quarto dia seguido com rally dos chips", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 101027, "titulo": "Genética de ‘peso’: leilão de gado cresce 125% no Brasil e mira novo recorde em 2026", "url": "https://exame.com/negocios/genetica-de-peso-leilao-de-gado-cresce-125-no-brasil-e-mira-novo-recorde-em-2026/", "fonte_id": "exame", "data_pub": "2026-08-13T06:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O leilão de gado genético da JBJ Agropecuária teve um aumento de 125% no Brasil e está planejando um novo recorde em 2026. A empresa faturou R$ 6 bilhões em 2025 com o principal negócio sendo a agropecuária.", "titulo_pt": "Leilão de gado genético da jbj agropecuária cresce 125% no Brasil e mira novo recorde em 2026", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 101030, "titulo": "IA pode adicionar quase R$ 1 trilhão ao PIB brasileiro até 2030, diz estudo inédito", "url": "https://exame.com/inteligencia-artificial/ia-pode-adicionar-quase-r-1-trilhao-ao-pib-brasileiro-ate-2030-diz-estudo-inedito/", "fonte_id": "exame", "data_pub": "2026-08-13T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo inédito indica que a adoção da inteligência artificial no Brasil pode gerar aproximadamente R$ 986,7 bilhões em valor presente até 2030. O Reglab aponta esse potencial econômico.", "titulo_pt": "IA pode adicionar quase R$ 1 trilhão ao PIB brasileiro até 2030, diz estudo inédito", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 101032, "titulo": "Café em alerta: terremoto afeta rota de 60% das exportações da Colômbia", "url": "https://exame.com/agro/terremoto-na-colombia-interditou-importante-rota-de-exportacao-de-cafe/", "fonte_id": "exame", "data_pub": "2026-08-13T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto interrompeu operações em principais portos colombianos, afetando a exportação de café, que representa 60% das exportações do país.", "titulo_pt": "Café em alerta: terremoto interrompe exportações da Colômbia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 101494, "titulo": "Pork, chicken prices in Japan hit record highs in August", "url": "https://www.japantimes.co.jp/business/2026/08/13/economy/japan-pork-chicken-prices-high/", "fonte_id": "japan_times", "data_pub": "2026-08-13T05:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do porco e da frango no Japão atingiram níveis históricos mais altos em agosto, devido principalmente ao enfraquecimento do iene, que aumentou a demanda por produtos locais.", "titulo_pt": "Preços do porco e frango no Japão atingem máximos históricos em agosto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 101037, "titulo": "Varejo, inflação, emprego e leilão de Treasuries nos EUA: o que move os mercados", "url": "https://exame.com/invest/mercados/varejo-inflacao-emprego-e-leilao-de-treasuries-nos-eua-o-que-move-os-mercados/", "fonte_id": "exame", "data_pub": "2026-08-13T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quinta-feira, 13 de outubro, a temporada de resultados das empresas está impactando o mercado com os balanços do Nubank, Cyrela e Azul entre outras companhias. Além disso, fatores como varejo, inflação e um leilão de Tesouros dos EUA também estão influenciando as bolsas.", "titulo_pt": "Varejo, inflação, emprego e resultados das empresas nos EUA: o que move os mercados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 101455, "titulo": "The battle for control of India’s $280bn Tata Group", "url": "https://www.ft.com/content/525d9d60-f902-4b89-ad34-ba96d03be97e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-13T04:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sucessor de N Chandrasekaran enfrentará um período instável na conglomerada Tata Group, que possui Air India e Jaguar Land Rover, com um valor de mercado de 280 bilhões de dólares.", "titulo_pt": "Batalha pelo controle da conglomerada Tata Group de us$ 280 bilhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 101647, "titulo": "Germany's top-funded tech companies in H1 2026", "url": "https://tech.eu/2026/08/13/germanys-top-funded-tech-companies-in-h1-2026/", "fonte_id": "tech_eu", "data_pub": "2026-08-13T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha foi o segundo maior mercado de financiamento tecnológico na Europa no primeiro semestre de 2026, com empresas arrecadando 6,3 bilhões de euros em 267 negócios. O investimento se concentrou em várias áreas.", "titulo_pt": "As principais empresas de tecnologia mais bem financiadas da Alemanha no primeiro semestre de 2026", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 101542, "titulo": "CBP Workers Allegedly Used Government Databases to Spy on Exes, Crushes, and Colleagues", "url": "https://www.wired.com/story/cbp-workers-allegedly-used-government-databases-to-spy-on-exes-crushes-and-colleagues/", "fonte_id": "wired", "data_pub": "2026-08-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos obtidos pela WIRED indicam que trabalhadores da CBP supostamente usaram ferramentas internas para verificar informações sobre interesses românticos pessoais e rastrear os telefones celulares de colegas de trabalho.", "titulo_pt": "Funcionários da CBP supostamente usavam bases de dados do governo para espiar ex-namoradas, namoradas e colaboradores", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 101505, "titulo": "Indonesia eyes mass production of home-grown EVs by 2028", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3363918/indonesia-eyes-mass-production-home-grown-evs-2028?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-13T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Indonésia, Prabowo Subianto, declarou que o país planeja iniciar a produção em massa de veículos elétricos locais até 2028. O governo está construindo uma fábrica no subdistrito de Subang, na província de Java Ocidental, com capacidade para produzir até 50 mil veículos por ano.", "titulo_pt": "Indonésia almeja produção em massa de veículos elétricos locais até 2028", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 101528, "titulo": "How kids feel about AI, in their own words", "url": "https://www.technologyreview.com/2026/08/13/1141410/how-kids-feel-about-ai-own-words/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe se dirige a crianças para conversar sobre inteligência artificial, esperando ouvir que algumas delas usam essa tecnologia para tirar vantagem, como as gerações Millennials e X fizeram com os guias de estudo ou calculadoras programáveis. Outros compartilhariam maneiras inspiradoras de utilização da IA.", "titulo_pt": "Como crianças se sentem sobre a IA, em suas próprias palavras", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 101543, "titulo": "There’s a Fatty Liver Epidemic. AI Could Help Get Ahead of It", "url": "https://www.wired.com/story/fatty-liver-disease-ai-detection-cancer/", "fonte_id": "wired", "data_pub": "2026-08-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de um bilhão de pessoas ao redor do mundo têm fígados com gordura excessiva, o que pode levar a diversos problemas de saúde. Os pesquisadores acreditam que ferramentas de inteligência artificial podem detectar essa condição e ajudar a preveni-la precocemente, potencialmente salvando vidas.", "titulo_pt": "Há uma epidemia de fígados gordurosos. IA poderia auxiliar na prevenção", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 101546, "titulo": "Kyungpook National University rolls out AI degree with Samsung job track", "url": "https://www.koreaherald.com/article/10840731", "fonte_id": "korea_herald", "data_pub": "2026-08-13T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade Nacional de Kyungpook irá lançar um novo programa de graduação e pós-graduação combinados chamado Engenharia AI Móvel em parceria com a Samsung Electronics, focado no treinamento de especialistas em engenharia móvel e tecnologias de inteligência artificial avançada. O programa admitirá 20 alunos a partir do ano letivo de 2027.", "titulo_pt": "Universidade nacional de kyungpook lança graduação em AI móvel com trilha de emprego da Samsung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 101550, "titulo": "North Africa-based operator of Korean content piracy sites arrested", "url": "https://www.koreaherald.com/article/10840715", "fonte_id": "korea_herald", "data_pub": "2026-08-13T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três sites oferecendo conteúdo coreano pirata, como webtoons e novelas online, foram encerrados e seu operador, um nacional do Norte da África, foi preso. Mais de 83.000 itens de conteúdo pirateado foram distribuídos, com cerca de 57% proveniente da Coreia do Sul.", "titulo_pt": "Operador de sites norte-africanos que ofereciam conteúdo coreano pirata é preso", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 101648, "titulo": "Europe is entering a new hardware age: ‘Made in EU’ starts long before the factory floor", "url": "https://tech.eu/2026/08/13/europe-is-entering-a-new-hardware-age-made-in-eu-starts-long-before-the-factory-floor/", "fonte_id": "tech_eu", "data_pub": "2026-08-13T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa está entrando numa nova era de hardware, com o objetivo de fabricar mais tecnologias e produtos industriais consumidos na região. A Proposta de Lei do Acelerador Industrial Europeu (IAA), apresentada pela Comissão Europeia em março, visa garantir que a produção seja realizada dentro da União.", "titulo_pt": "Europa entra numa nova era de hardware: 'feito na Europa' começa antes mesmo da fábrica", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 101591, "titulo": "China AI chip market nears 90% domestic share in 2026—Huawei on course to eclipse Nvidia", "url": "https://www.digitimes.com/news/a20260812VL213/market-2026-ai-chip-nvidia-huawei.html", "fonte_id": "digitimes", "data_pub": "2026-08-13T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo relatório, o mercado chinês de chips de inteligência artificial de alta gama pode estar próximo de 90% de participação nacional em 2026. As soluções locais devem dominar quase 90% das vendas, deixando Nvidia, AMD e outros fornecedores internacionais com cerca de 10% do mercado.", "titulo_pt": "Mercado chinês de chips de IA de alta gama pode chegar a 90% de participação nacional em 2026—Huawei almeja superar a Nvidia", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 101592, "titulo": "Taiwan's carbon fee era begins, science parks roll out measures", "url": "https://www.digitimes.com/news/a20260813PD232/taiwan-2026-eu-government.html", "fonte_id": "digitimes", "data_pub": "2026-08-13T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan começou a cobrar empresas por emissões de carbono a partir de 2026, como parte da sua caminhada para atingir um saldo líquido zero até 2050. Até junho, 461 fábricas reguladas e 240 empresas pagaram uma taxa total de NT$4,97 bilhões (US$154 milhões), com a indústria de semicondutores sendo a maior contribuinte, representando 45% dos pagamentos.", "titulo_pt": "Taxa por emissões de carbono começa em taiwan e parques científicos implementam medidas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 101649, "titulo": "Millow raises €2M to expand mycelium protein across Nordic foodservice", "url": "https://tech.eu/2026/08/13/millow-raises-eur2m-to-expand-mycelium-protein-across-nordic-foodservice/", "fonte_id": "tech_eu", "data_pub": "2026-08-13T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de tecnologia alimentar sueca Millow levantou €2 milhões para expandir sua capacidade de produção e fortalecer suas operações comerciais, com o objetivo de atender ao mercado de foodservice da região nórdica.", "titulo_pt": "Millow levanta €2 milhões para expansão de proteína mycelial no mercado de foodservice nórdico", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 101084, "titulo": "Conheça o ChatTJB, o “chatbot de IA” sem IA — só um humano e 10 mil voluntários", "url": "https://www.infomoney.com.br/business/global/conheca-o-chattjb-o-chatbot-de-ia-sem-ia-so-um-humano-e-10-mil-voluntarios/", "fonte_id": "infomoney", "data_pub": "2026-08-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tucker Bryant lançou ChatTJB como uma sátira à dependência de inteligência artificial (IA). O chatbot é operado por um humano e 10 mil voluntários que respondem às perguntas.", "titulo_pt": "Conheça o ChatTJB, o 'chatbot de IA' sem IA — só um humano e 10 mil voluntários", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 101650, "titulo": "Metal Morph raises £700K to recover industrial resources from wastewater", "url": "https://tech.eu/2026/08/13/metal-morph-raises-ps700k-to-recover-industrial-resources-from-wastewater/", "fonte_id": "tech_eu", "data_pub": "2026-08-13T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup britânica Metal Morph levantou £700,000 em financiamento pré-semente para avançar com sua tecnologia de recuperação de recursos industriais de água e processos de tratamento de esgoto.", "titulo_pt": "Metal Morph arrecada £700.000 para recuperar recursos industriais de águas residuais", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 101577, "titulo": "Nexon's Q2 net income up over 70 pct, boosted by flagship MapleStory", "url": "https://en.yna.co.kr/view/AEN20260813010500320", "fonte_id": "yonhap_news", "data_pub": "2026-08-13T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nexon, empresa sul-coreana de jogos online líder no mercado, registrou um lucro líquido no segundo trimestre que aumentou mais do que 70%. O aumento foi impulsionado principalmente pelo jogo MapleStory.", "titulo_pt": "Lucro da nexon no segundo trimestre cresce mais de 70%, impulsionado por MapleStory", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 101593, "titulo": "Taiwan's packaging and integration ecosystem positions it as the backbone of CPO scaling, Ayar Labs says", "url": "https://www.digitimes.com/news/a20260813PD228/cpo-optics-taiwan-packaging-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-08-13T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A technical feasibility of co-packaged optics (CPO) has been repeatedly demonstrated at major industry conferences. No summit de 2026 da OCP APAC, o CEO da Ayar Labs, Mark Wade, mudou a atenção do funcionamento técnico do CPO para sua escalabilidade comercial.", "titulo_pt": "Ecosistema de embalagem e integração da taiwan é considerado osso seco para a escala do CPO, diz Ayar Labs", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 101594, "titulo":  "url": "https://www.lemonde.fr/en/environment/article/2026/08/13/as-drought-grips-france-tensions-over-drinking-water-mount-we-are-in-uncharted-territory_6756456_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de água enfrentam escassez de reservas superficiais e subterrâneas, com 40 mil pessoas já afetadas por cortes no abastecimento. A ministra do Meio Ambiente, Monique Barbut, pediu restrições mais rígidas no uso da água.", "titulo_pt": "A seca atinge França e aumentam as tensões sobre o fornecimento de água: 'estamos em território inexplorado'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 101422, "titulo": "As temperatures soar, ‘exceptionally serious’ drought imperils UK farmers", "url": "https://www.aljazeera.com/news/2026/8/13/uk-drought-imperils-farmers?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agricultores estão tentando adaptar-se ao clima extremo e afirmam que, mesmo com o melhor planejamento, sua indústria enfrenta seu teste mais difícil. Uma seca excepcionalmente séria está ameaçando os agricultores do Reino Unido devido às altas temperaturas.", "titulo_pt": "Seca extremamente séria ameaça agricultura britânica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 101378, "titulo": "Soaring stingray numbers off California beaches drive record injuries", "url": "http://www.euronews.com/video/2026/08/13/soaring-stingray-numbers-off-california-beaches-drive-record-injuries", "fonte_id": "euronews", "data_pub": "2026-08-13T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número atípico de raia-dourada foi observado nas praias da Califórnia, com os animais se aproximando mais das costas devido às águas marinhas aquecidas e à presença esperada do El Niño forte.", "titulo_pt": "Números recorde de raia-dourada em praias da califórnia causam ferimentos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 101387, "titulo": "Oil spill from tanker believed to be Russian reaches Oman's coastline, Muscat authorities say", "url": "http://www.euronews.com/2026/08/13/oil-spill-from-tanker-believed-to-be-russian-reaches-omans-coastline-muscat-authorities-sa", "fonte_id": "euronews", "data_pub": "2026-08-13T04:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vazamento de óleo de um navio-tanque, supostamente russo, atingiu as praias de Ras Madrakah na costa principal do Omã, a cerca de 200 quilômetros ao norte da Ilha Qabiliyah. De acordo com o Autoridade Ambiental do Omã, as praias também foram contaminadas.", "titulo_pt": "Vazamento de óleo russo atinge costa do omã", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 100392, "titulo": "São Paulo tem 23 mortes por febre maculosa entre 24 casos confirmados", "url": "https://www.metropoles.com/sao-paulo/sao-paulo-tem-23-mortes-por-febre-maculosa-entre-24-casos-confirmados", "fonte_id": "metropoles", "data_pub": "2026-08-12T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "São Paulo registrou 23 mortes por febre maculosa entre os 24 casos confirmados em 2026. Os casos estão distribuídos em diferentes regiões, com maior incidência no interior do estado.", "titulo_pt": "São Paulo tem 23 mortes por febre maculosa entre 24 casos confirmados", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 100453, "titulo": "SAF: entenda o que é o combustível sustentável que pode reduzir emissões na aviação", "url": "https://exame.com/brasil/saf-entenda-o-que-e-o-combustivel-sustentavel-que-pode-reduzir-emissoes-na-aviacao/", "fonte_id": "exame", "data_pub": "2026-08-12T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva assinou um decreto estabelecendo as regras para o SAF (combustível sustentável de aviação) como parte de uma série de medidas para o setor de energia. Este combustível tem potencial para reduzir as emissões na aviação.", "titulo_pt": "SAF: entenda o combustível sustentável que pode diminuir as emissões na aviação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 100458, "titulo": "Na EcoRodovias, resposta ao El Niño começa muito antes da chuva e onda de calor", "url": "https://exame.com/esg/na-ecorodovias-resposta-ao-el-nino-comeca-muito-antes-da-chuva-e-onda-de-calor/", "fonte_id": "exame", "data_pub": "2026-08-12T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A EcoRodovias implementa uma estratégia para lidar com eventos climáticos extremos, buscando prever e mitigar deslizamentos de terra, enchentes e outros impactos das mudanças climáticas nas rodovias. A resposta da empresa ao El Niño começa antes do evento ocorrer.", "titulo_pt": "Na EcoRodovias, resposta ao El Niño começa muito antes da chuva e onda de calor", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 100093, "titulo": "Analysis: Weaker EV targets could cost UK consumers £3bn a year by 2030", "url": "https://www.carbonbrief.org/analysis-weaker-ev-targets-could-cost-uk-consumers-3bn-a-year-by-2030", "fonte_id": "carbon_brief", "data_pub": "2026-08-12T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um futuro consultório do governo britânico que possa enfraquecer os objetivos para veículos elétricos (VEs) poderia custar aos consumidores até 3 bilhões de libras ao ano até 2030.", "titulo_pt": "Análise: objetivos mais fracos para ve podem custar £3 bi por ano aos consumidores britânicos em 2030", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 99529, "titulo": "One-fifth of France's nuclear capacity offline due to extreme weather and jellyfish", "url": "https://www.lemonde.fr/en/energies/article/2026/08/12/one-fifth-of-france-s-nuclear-capacity-offline-due-to-extreme-weather-and-jellyfish_6756421_98.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-12T12:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezessete reatores nucleares de uma frota total de cinquenta e sete foram afetados por condições climáticas extremas e a presença excessiva de jararacas marinhas, resultando em uma redução superior a 20% na capacidade produtiva de energia nuclear, um déficit recorde.", "titulo_pt": "Um quinto da capacidade nuclear francesa paralisada devido a condições climáticas extremas e a presença excessiva de jararacas marinhas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 99523, "titulo": "More than half of Europe's population to be hit by another heatwave", "url": "https://www.lemonde.fr/en/environment/article/2026/08/12/more-than-half-of-europe-s-population-to-be-hit-by-another-heatwave_6756417_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-12T10:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas acima de 30°C estão previstas para afetar grande parte da Europa Ocidental e do Sul, incluindo regiões de França, Itália e Espanha onde as temperaturas podem ultrapassar os 35°C.", "titulo_pt": "Mais da metade da população europeia pode ser atingida por outra onda de calor", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 100201, "titulo": "Landscapes for Adaptation Evidence from China", "url": "https://www.archdaily.com/1183172/landscapes-for-adaptation-evidence-from-china", "fonte_id": "archdaily", "data_pub": "2026-08-12T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crise climática é agora evidente e não mais uma possibilidade futura. É necessário adaptar as cidades para sobrevivência diante dos impactos do clima em rápida mudança, reconfigurando os sistemas urbanos com abordagens resilientes que substituam as soluções engenhosas obsoletas.", "titulo_pt": "Landscape de adaptação: evidências da China", "veiculo": "ArchDaily", "pais": "Chile", "classe": "B"}, {"id": 100730, "titulo": "Europe scrambles for eclipse glasses as solar power output set to dip", "url": "http://www.euronews.com/video/2026/08/12/europe-scrambles-for-eclipse-glasses-as-solar-power-output-set-to-dip", "fonte_id": "euronews", "data_pub": "2026-08-12T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lojas e ópticas europeias estão com escassez de lentes certificadas para eclipse, com filas se formando em Paris, Londres e Bruxelas devido à alta demanda. Aproximadamente na próxima terça-feira, haverá um eclipse solar total.", "titulo_pt": "Europa corre atrás de óculos de eclipse enquanto saída de energia solar prevista para diminuir", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 101506, "titulo": "Hong Kong woman acquitted of protest-related charges after return from Australia", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3363917/hong-kong-woman-acquitted-protest-related-charges-after-return-australia?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-13T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de Hong Kong, que retornou da Austrália, foi absolvida de duas acusações relacionadas às manifestações anti-governo de 2019 após um juiz considerar insuficiente a evidência apresentada pelos promotores. O tribunal determinou que não havia provas suficientes para comprovar que ela tinha dois ponteiros laser e três garrafas de spray-pintura com intenção ilegal em 8 de setembro de 2019.", "titulo_pt": "Mulher de hong Kong é absolvida após retorno da austrália, sem relação com protestos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 101287, "titulo": "Former Catholic bishop accused of hosting alcohol-fuelled parties to sexually abuse Aboriginal men found guilty", "url": "https://www.theguardian.com/austr function renderSecao(topico) {

function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}
