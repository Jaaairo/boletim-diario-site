<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>

<div class="modal-overlay" id="modal-flag">

</div>

<script>
const D = {"gerado_em": "06/09/2026 15:24", "stats": {"noticias_novas": 605, "resumos_gerados": 211}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O resumo das notícias do Brasil destaca a controvérsia nas eleições presidenciais, com Flávio Bolsonaro liderando com 48,5% das intenções de voto no segundo turno, contra 43,1% de Lula. A campanha de Lula enfrenta desafios, com 35% dos eleitores rejeitando seu voto. Além disso, Flávio Bolsonaro pede à ministra Cármen Lúcia para investigar Moraes, alegando que um voto contra seria prejudicial para sua história. A crise no Supremo Tribunal Federal (STF) continua, com Flávio Dino criticando a mistura de interesses eleitorais com problemas reais no debate atual. A campanha de Arruda promete melhorias na saúde e segurança em regiões do Distrito Federal. O governo planeja converter o subsídio à gasolina em uma desoneração fiscal, enquanto a inadimplência afeta os grandes bancos, com o Banco do Brasil sendo particularmente afetado. A ex-ministra Michelle Bolsonaro defende André Mendonça em meio a uma crise no STF.", "mundo": "O partido de extrema direita alemão Alternative für Deutschland (AfD) obteve uma vitória significativa nas eleições no estado de Saxônia-Anhalt, com mais de 44% dos votos, conforme pesquisas de boca de urna. Este resultado representa um desafio significativo para os partidos estabelecidos e pode levar a AfD ao poder pela primeira vez desde a Segunda Guerra Mundial. O partido italiano Movimento Cinco Estrelas (M5S) também teve um bom desempenho, com a Saxônia-Anhalt atingindo um recorde de 80% de comparecimento nas urnas. Em contraste, a aprovação do presidente dos Estados Unidos, Donald Trump, caiu para 33%, o menor nível já registrado em uma pesquisa do Financial Times, devido a desilusões com a economia e o custo de vida. Além disso, o Irã ameaçou responder de forma mais rápida e dolorosa aos ataques americanos, enquanto o presidente sul-coreano Lee Jae Myung se reúne com o presidente francês Emmanuel Macron em Paris.\n\nOs Estados Unidos mantêm uma intensa atividade diplomática em diversos cenários geopolíticos. Envios dos EUA tiveram reuniões substanciais com o presidente ucraniano Volodymyr Zelenskyy durante sua primeira visita a Kiev, enquanto Steve Witkoff e Jared Kushner se encontraram com o presidente russo Vladimir Putin em Moscou. Essas negociações refletem o esforço americano para alavancar um acordo entre as partes em conflito na Ucrânia. Paralelamente, o Irã ameaçou intensificar as respostas aos ataques dos EUA, após bombardeios americanos no Estreito de Ormuz. O Irã prometeu uma reação rápida e dolorosa, com a Guarda Revolucionária Iraniana anunciando um ataque contra dois navios de guerra dos Estados Unidos. Em outra frente, o conflito israelense-palestino continua com ataques aéreos israelenses no Líbano, resultando em quatro mortes, apesar do cessar-fogo. As tensões entre Israel e o Qatar também aumentaram, com Netanyahu acusando Doha de ser um estado hostil e o Qatar retaliando acusações contra o Irã.", "economia": "O presidente Lula enfatizou que o voto no próximo pleito eleitoral será crucial para determinar se o Brasil continuará sendo uma potência ou se tenderá a se subordinar a outros países, especialmente nos contextos de tarifas impostas pelos Estados Unidos e de disputas comerciais entre os dois países. Outro destaque é que a Apple foi excluída de recomendações de ações globais, coincidindo com a saída de Tim Cook da liderança da empresa. Essa decisão está relacionada a uma rotação dentro da estratégia de inteligência artificial. Além disso, a China está incentivando as empresas a cumprir mais rigorosamente as normas locais enquanto se expandem para o exterior, visando evitar uma possível guerra de preços entre montadoras. Por fim, o Carf rejeitou a cobrança bilionária de Imposto de Renda e Contribuição Social sobre Lucros e Lucros Participações (CSLL) contra a Petrobras, rejeitando a metodologia utilizada pelo fisco para calcular a cobrança.", "tecnologia": "Um evento importante é destacado nos artigos: a empresa alemã Isar Aerospace realizou com sucesso o primeiro lançamento comercial de um foguete orbital desde o solo europeu, marcando um avanço significativo na indústria espacial europeia. Este feito, alcançado em apenas alguns anos, contrasta com a lenta evolução da indústria espacial europeia, que levou décadas para atingir essa marca. De acordo com o Financial Times, a Isar Aerospace se tornou a primeira empresa europeia a lançar um foguete orbital comercialmente operacional, um marco que pode acelerar o desenvolvimento de lançamentos de satélites europeus. Além disso, a Taiwan está considerando o silício fotônico como o próximo grande salto tecnológico, buscando se posicionar como líder nessa área. O Taipei Times destaca que o país está explorando essa tecnologia com o objetivo de se destacar no campo da ciência e tecnologia. Paralelamente, a inteligência artificial continua a influenciar diversos setores, com o UBS exigindo que candidatos a cargos juniores demonstrem conhecimento em IA, refletindo a transformação que a tecnologia está causando nos processos de recrutamento em bancos de investimento europeus.", "ciencia": "Um estudo publicado na revista JGR Solid Earth usou aprendizado de máquina para analisar ondas sísmicas e identificou seis estruturas incomuns na interface entre o núcleo e a crosta funda da Terra, uma descoberta significativa na geofísica. Além disso, a NASA expandiu sua rede Deep Space Network com uma nova antena gigante no deserto da Califórnia, aumentando a capacidade de comunicação à distância da rede, crucial para missões espaciais como as de Artemis. Outra pesquisa importante desenvolveu uma nova estratégia para enfraquecer o glioblastoma, uma das doenças cerebrais mais letais, ao bloquear a proteína SET, o que pode potencialmente abrir caminho para novos tratamentos eficazes.", "cultura": "O evento mais importante dos artigos foi a vitória de Bad Bunny nos Creative Arts Emmys, tornando-o o primeiro latino a ganhar todos os sete prêmios em que foi indicado. Sara Curruchich, uma cantora maia de Guatemala, transformou sua experiência de discriminação em música, levando a língua kaqchikel a palcos internacionais. A Rádio MEC transmitirá um programa especial sobre Carlos Gomes nos próximos domingos, destacando sua trajetória e obras. Ian McDiarmid deu uma performance autêntica de Lear no teatro Crucible de Sheffield. A obra total de Palito Ortega também foi destacada, enquanto George Lucas transformou sua coleção de arte em um museu em Los Angeles. O arquiteto Hudson Architects transformou um nightclub abandonado em uma biblioteca pública em Norfolk, Inglaterra, e o ALE Estudio criou o Espacio Aguacate em Madrid, adaptando um espaço tradicionalmente trabalhador para a cultura contemporânea.", "sociedade": "O número de lares com apenas uma pessoa aumentou para 40,5% em todo o país, conforme dados do Taipei Times. Paralelamente, a sociedade taiwanesa no Canadá está buscando a inclusão da Taiwan nas Nações Unidas, com o objetivo de aumentar a visibilidade e o reconhecimento internacional da região. Em São Paulo, uma adolescente de 15 anos foi arrastada por um motorista de aplicativo após tentar recuperar R$ 100 que o condutor havia roubado dela. Um incêndio atingiu mais de 25 moradias em uma comunidade da zona Norte de São Paulo, mas não houve vítimas. Em Nova York, a segunda onda da política wokeness se concentra em questões de classe, com o prefeito Eric Adams prometendo coletivismo, mas ainda não tendo melhorado a situação econômica dos menos favorecidos na cidade. Além disso, em Quillón, no Chile, um adulto de 77 anos morreu após um ataque de cães, levando o Ministério Público a investigar a situação social do proprietário da residência e os animais envolvidos.", "meio_ambiente": "Um vulcão chamado 'filhote do Krakatoa' entrou em erupção na Indonésia, afetando voos em várias rotas, incluindo para Singapura, Doha, Sydney e Kuala Lumpur, deixando 150 mil passageiros retidos, conforme relatos da BBC Brasil e do Japan Times. Em meio a essa situação, o Ibama recomendou a análise de riscos do El Niño em processos de licenciamento ambiental de usinas hidrelétricas, portos e linhas de transmissão, conforme informado pela Folha Mercado. Além disso, o setor ambiental enfrenta outros desafios, como a erosão costeira em Atafona, no Brasil, que está destruindo casas e servindo como um laboratório para adaptação climática, e a seca no Rio Silugonggo, na Indonésia, que está causando a morte de milhões de peixes, conforme informado pela Al Jazeera. A pesquisa realizada pela CNN Brasil indica que quase 80% das pequenas e médias empresas do Rio Grande do Sul não se sentem preparadas para enfrentar eventos climáticos relacionados ao El Niño.", "direitos_humanos": "Organizações cívicas solicitaram à UNESCO que incluísse os documentos relacionados às 'mulheres de conforto' em sua lista de bens da memória humana, buscando reconhecimento e proteção desses arquivos históricos. Em outro caso, seguidores da médium Maira Rocha atacaram e ameaçaram pessoas que criticaram a líder espiritual, formando um exército digital que se manifesta com violência online. Finalmente, legisladores e um conselheiro governamental de Hong Kong estão pedindo a criação de uma lei contra assédio, após um homem ser absolvido de acusações de seguir uma garota adolescente para sua sala de aula de ensino médio, evidenciando a necessidade de regulamentação para prevenir esse tipo de crime."}, "resumo_do_dia": {"politica_nacional": [{"id": 149000, "titulo": "Justiça Federal suspende licenças da mina da Sigma Lithium em Minas Gerais", "url": "https://www.cnnbrasil.com.br/infra/justica-federal-suspende-licencas-da-mina-da-sigma-lithium-em-minas-gerais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal suspendeu as licenças da mina da Sigma Lithium em Minas Gerais após uma ação civil movida pela Federação das Comunidades Quilombolas do Estado de Minas Gerais, que argumentou que o projeto da mineradora se encontra na área de influência direta da Comunidade Quilombola de Baú.", "titulo_pt": "Justiça Federal suspende licenças da mina da Sigma Lithium em Minas Gerais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148926, "titulo": "Ex de Vorcaro posta vídeo dançando: “Não dou a mínima”", "url": "https://www.poder360.com.br/poder-gente/ex-de-vorcaro-posta-video-dancando-nao-dou-a-minima/", "fonte_id": "poder360", "data_pub": "2026-09-06T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Martha Graeff, ex-mulher de Marcelo Vorcaro, postou um vídeo dançando em 28 de agosto. Vorcaro, fundador do Master, está preso desde março de 2026.", "titulo_pt": "Ex de Vorcaro posta vídeo dançando: 'não dou a mínima'", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148905, "titulo": "Clima de apreensão toma conta da campanha de Lula", "url": "https://veja.abril.com.br/politica/clima-de-apreensao-toma-conta-da-campanha-de-lula/", "fonte_id": "veja", "data_pub": "2026-09-06T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O clima de apreensão domina a campanha de Lula. O presidente não conseguiu ganhar a popularidade esperada durante o ano eleitoral.", "titulo_pt": "Clima de apreensão toma conta da campanha de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 149004, "titulo": "Flávio cobra voto de Cármen Lúcia a favor de investigação contra Moraes", "url": "https://www.cnnbrasil.com.br/politica/flavio-cobra-voto-de-carmen-lucia-a-favor-de-investigacao-contra-moraes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro pressionou Cármen Lúcia a votar a favor da investigação contra Alexandre Moraes. O candidato disse que um voto contra seria muito prejudicial para sua história.", "titulo_pt": "Flávio cobra voto de Cármen Lúcia a favor de investigação contra Moraes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149005, "titulo": "Governo deve converter subsídio à gasolina em desoneração", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/governo-deve-converter-subsidio-a-gasolina-em-desoneracao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo planeja converter o subsídio à gasolina em uma desoneração fiscal. O valor do alívio tributário ainda não foi definido, mas é provável que se mantenha no mesmo nível atual do subsídio.", "titulo_pt": "Governo deve converter subsídio à gasolina em desoneração fiscal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148838, "titulo": "Dino questiona promessa de fim de inquérito das fake news, sem citar Fachin", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/sem-citar-fachin-dino-questiona-promessa-de-fim-de-inquerito-das-fake-news.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-06T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois dias após o presidente do STF, Edson Fachin, defender a necessidade de encerramento do inquérito das fake news, o ministro Flávio Dino questionou neste domingo a possibilidade de um julgador prometer o fim desse tipo de investigação.", "titulo_pt": "Dino questiona possibilidade de promessa de fim do inquérito das fake news, sem citar Fachin", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 149023, "titulo": "Zema satiriza relação Moraes-Vorcaro em novo vídeo e intensifica críticas ao STF", "url": "https://www.infomoney.com.br/politica/zema-satiriza-relacao-moraes-vorcaro-em-novo-video-e-intensifica-criticas-ao-stf/", "fonte_id": "infomoney", "data_pub": "2026-09-06T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zema satiriza a relação entre Moraes e Vorcaro em um novo vídeo e aumenta as críticas ao STF. A expressão 'intocáveis' é utilizada por ele para criticar ministros do Supremo Tribunal Federal.", "titulo_pt": "Zema satiriza relação Moraes-Vorcaro e intensifica críticas ao STF", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 148845, "titulo": "Crise STF: 'problemas reais e graves estão sendo misturados com intereses eleitorais', diz Flávio Dino em postagem", "url": "https://g1.globo.com/politica/noticia/2026/09/06/crise-stf-problemas-reais-e-graves-estao-sendo-misturados-com-intereses-eleitorais-diz-flavio-dino-em-postagem.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-06T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Dino, ministro do Supremo Tribunal Federal, usou as redes sociais para se manifestar sobre a crise na Suprema Corte, citando a frase de Ésquilo sobre a verdade nas guerras. Ele afirmou que problemas reais e graves estão sendo misturados com interesses eleitorais no debate atual.", "titulo_pt": "Problemas reais e graves estão sendo misturados com interesses eleitorais, diz Flávio Dino sobre crise no STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 148950, "titulo": "Senado banca segurança de Flávio em campanha, mas mantém gastos em sigilo", "url": "https://www.metropoles.com/brasil/senado-banca-seguranca-de-flavio-em-campanha-mas-mantem-gastos-em-sigilo", "fonte_id": "metropoles", "data_pub": "2026-09-06T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os gastos com segurança de Flávio Bolsonaro aumentaram em 2026, totalizando R$ 7,4 milhões, com a alta atribuída à campanha bolsonarista. Os detalhes dos gastos permanecem em sigilo.", "titulo_pt": "Senado destina recursos à segurança de Flávio em campanha, mas mantém gastos em sigilo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148951, "titulo": "MG: candidata do PT recebe ameaças racistas de morte e estupro", "url": "https://www.metropoles.com/minas-gerais/mg-candidata-negra-do-pt-recebe-ameacas-racistas-de-morte-e-estupro", "fonte_id": "metropoles", "data_pub": "2026-09-06T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A candidata do PT, Ana Elisa, registrou um Boletim de Ocorrência após receber e-mails com conteúdo de ódio racial, ameaças de estupro e ameaças à sua família. A campanha denuncia esse incidente como um crime eleitoral.", "titulo_pt": "MG: candidata do PT registra ameaças racistas e de estupro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148953, "titulo": "Em carreata, Arruda promete construir feira definitiva do Itapoã e Paranoá", "url": "https://www.metropoles.com/distrito-federal/em-carreata-arruda-promete-construir-feira-definitiva-do-itapoa-e-paranoa", "fonte_id": "metropoles", "data_pub": "2026-09-06T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante uma carreata nas regiões do Itapoã e Paranoá no Distrito Federal, em 6 de setembro, o candidato Arruda prometeu construir uma feira definitiva para essas áreas. Além disso, ele discutiu melhorias na área da Saúde.", "titulo_pt": "Em carreata, Arruda promete feira definitiva para Itapoã e Paranoá e fala sobre saúde", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148839, "titulo": "Entidades que representam carreiras da AGU saem em defesa do órgão e criticam tentativa de suspeição de Messias", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/entidades-que-representam-carreiras-da-agu-saem-em-defesa-do-orgao-e-criticam-tentativa-de-suspeicao-de-messias.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades que representam as carreiras da Advocacia-Geral da União emitiram uma nota pública em defesa do órgão, comandado por Jorge Messias, em meio a acusações sobre a atuação da AGU. Essas entidades também expressaram preocupação com as acusações e a relação conturbada da AGU com a Polícia Federal.", "titulo_pt": "Entidades de carreiras da AGU defendem o órgão e criticam acusações sobre Messias", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 148908, "titulo": "As perguntas sobre Flávio Bolsonaro que aumentaram a desconfiança de Mendonça com a PF", "url": "https://veja.abril.com.br/politica/as-perguntas-sobre-flavio-bolsonaro-que-aumentaram-a-desconfianca-de-mendonca-com-a-pf/", "fonte_id": "veja", "data_pub": "2026-09-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes da Polícia Federal teriam solicitado informações sobre o candidato do PL à Presidência, Flávio Bolsonaro, aprofundando assim suspeitas sobre uma possível interferência da PF em favor de Lula.", "titulo_pt": "Perguntas sobre Flávio Bolsonaro aumentaram desconfiança de Mendonça com a PF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 148927, "titulo": "Pressão da inadimplência sobre BB sobe; banco é o mais afetado", "url": "https://www.poder360.com.br/poder-economia/pressao-da-inadimplencia-sobre-bb-sobe-banco-e-o-mais-afetado/", "fonte_id": "poder360", "data_pub": "2026-09-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pressão da inadimplência sobre o Banco do Brasil aumentou, afetando sua carteira de crédito. Fatores como juros elevados, margens reduzidas e dívidas do setor agrícola, combinados com incertezas políticas decorrentes das eleições, contribuem para essa situação.", "titulo_pt": "Pressão da inadimplência sobre o BB aumenta; banco é o mais afetado", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148928, "titulo": "Cresce impacto da inadimplência em grandes bancos", "url": "https://www.poder360.com.br/poder-economia/cresce-impacto-da-inadimplencia-em-grandes-bancos/", "fonte_id": "poder360", "data_pub": "2026-09-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos primeiros seis meses de 2026, os bancos Itaú, Santander, Bradesco e Banco do Brasil aumentaram os valores provisionados para inadimplência, refletindo um aumento nos atrasos acima de 90 dias.", "titulo_pt": "Aumento do impacto da inadimplência em grandes bancos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148929, "titulo": "Bolsonaro pede a Moraes autorização para receber visita do irmão", "url": "https://www.poder360.com.br/poder-justica/bolsonaro-pede-a-moraes-autorizacao-para-receber-visita-do-irmao/", "fonte_id": "poder360", "data_pub": "2026-09-06T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Jair Bolsonaro solicitou ao ministro do STF (Supremo Tribunal Federal) João Otávio de Noronha Moraes autorização para receber a visita do irmão, Renato Bolsonaro, que é pré-candidato a deputado federal por São Paulo.", "titulo_pt": "Bolsonaro pede autorização a Moraes para receber irmão que é pré-candidato", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 149325, "titulo": "Military budgets more arms production", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/07/2003863801", "fonte_id": "taipei_times", "data_pub": "2026-09-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto discute a relação entre os orçamentos militares e a produção de armas.", "titulo_pt": "Orçamentos militares e produção de armas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 149329, "titulo": "US envoys hold talks with Zelenskiy on first Kyiv visit", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/07/2003863805", "fonte_id": "taipei_times", "data_pub": "2026-09-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enviados dos Estados Unidos tiveram reuniões com Zelenskiy durante sua primeira visita a Kiev. Os detalhes específicos das conversas não foram fornecidos.", "titulo_pt": "Enviados dos EUA realizam reuniões com Zelenskiy em primeira visita a kiev", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 149154, "titulo": "Live Updates: Germany’s Far Right Has Big Lead in Key Election, Exit Polls Show", "url": "https://www.nytimes.com/live/2026/09/06/world/germany-election", "fonte_id": "nyt_world", "data_pub": "2026-09-06T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alternative para Alemanha (AfD) foi projetada para terminar em primeiro lugar nas eleições no estado oriental de Saxônia-Anhalt, mas não estava claro se ela obteria uma maioria, o que levaria uma partido de extrema-direita ao poder pela primeira vez desde a Segunda Guerra Mundial.", "titulo_pt": "Atualizações em vivo: o partido de extrema-direita alemão leva nas eleições chave, segundo pesquisas de saída", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 149294, "titulo": "Witkoff, 'Russia e Ucraina dovranno fare dei compromessi'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/06/witkoff-russia-e-ucraina-dovranno-fare-dei-compromessi_6ddd9ffb-6877-4424-a2e0-ebb3b5d1d664.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-06T17:56:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Witkoff sugere que a Rússia e a Ucrânia precisam fazer acordos. Acredita que as condições para isso já estão presentes.", "titulo_pt": "Witkoff: Rússia e Ucrânia precisam fazer compromissos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 148999, "titulo": "Deportações, alunos PCDs separados: como a AfD quer governar na Alemanha", "url": "https://www.cnnbrasil.com.br/internacional/deportacoes-alunos-pcds-separados-como-a-afd-quer-governar-na-alemanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido de extrema direita AfD conquistou o primeiro lugar nas eleições estaduais da Saxônia-Anhalt, no domingo (6). As propostas do partido foram detalhadas no manifesto intitulado 'Visão 2026'.", "titulo_pt": "Deportações, alunos PCDs separados: como a AfD quer governar na Alemanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148925, "titulo": "Irã promete reação “rápida e dolorosa” a novos ataques dos EUA", "url": "https://www.poder360.com.br/poder-internacional/ira-promete-reacao-rapida-e-dolorosa-a-novos-ataques-dos-eua/", "fonte_id": "poder360", "data_pub": "2026-09-06T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã prometeu uma reação rápida e dolorosa a novos ataques dos Estados Unidos. Teerã afirmou ter atingido uma embarcação americana no Estreito de Ormuz, mas Washington negou o ataque.", "titulo_pt": "Irã promete reação rápida e dolorosa a novos ataques dos EUA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 149253, "titulo": "SEC sues ISS as Trump administration ramps up scrutiny of proxy advisers", "url": "https://www.cnbc.com/2026/09/06/sec-iss-proxy-adviser-subpoena.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-06T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SEC processou a ISS para cumprir um sub judice no momento em que o governo Trump aumenta a fiscalização de conselheiros de proxy influentes.", "titulo_pt": "SEC processa ISS com aumento da fiscalização do governo Trump em conselheiros de proxy", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 149295, "titulo": "In Sassonia-Anhalt affluenza record dell'80%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/06/in-sassonia-anhalt-affluenza-record-dell80_5eaf84ec-b0c3-4541-a056-8d1ece4b8346.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-06T17:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O nível de afluência em Sassonia-Anhalt atingiu 80%, um recorde. Não havia sido tão alto anteriormente.", "titulo_pt": "Recorde de afluência atinge 80% em Sassonia-Anhalt", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 149296, "titulo": "Tajani, 'i risultati in Sassonia pessima notizia, ora contromisure'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/06/tajani-i-risultati-in-sassonia-pessima-notizia-ora-contromisure_4d842d5a-01d7-4af9-8067-09fc3bdad643.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-06T17:47:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O resultado nas eleições em Sassonia foi considerado uma notícia ruim. A resposta adequada (contromisure) está sendo planejada. A frase 'Deriva populista e fanática' foi usada para descrever a situação.", "titulo_pt": "Tajani, 'os resultados em sassão são péssimas notícia, agora contromidas'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 149292, "titulo": "Trump envoys hold talks with Zelenskyy in Kyiv after meeting Putin in Moscow", "url": "https://www.ft.com/content/1e2d9db0-cb2c-4c79-942b-f0aff960e4c5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-06T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steve Witkoff e Jared Kushner estiveram em Kyiv para conversar com Zelenskyy sobre propostas para encerrar a guerra. Antes, eles já haviam se encontrado com Putin em Moscou.", "titulo_pt": "Enviados de trump têm conversas com Zelenskyy em Kyiv após reunião com Putin em moscou", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 149297, "titulo": "Da domani sera sciopero di 24 ore del personale Fs", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/06/da-domani-sera-sciopero-di-24-ore-del-personale-fs_3c9ab25b-a73b-4702-86b1-77286b400447.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-06T17:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Haverá um greve de 24 horas envolvendo o pessoal de transportes regionais, exceto para os serviços essenciais. Os serviços essenciais no transporte regional serão garantidos.", "titulo_pt": "Amanhã haverá greve de 24 horas do pessoal de transportes regionais", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 149220, "titulo": "German far-right set for big win in eastern state - projections", "url": "https://www.bbc.co.uk/news/articles/cy4zejgz3z9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-06T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido de extrema-direita AfD está projetado para obter mais de 44% dos votos, bem à frente do centro-direito CDU, que obteve 18,4% na eleição no estado oriental da Alemanha.", "titulo_pt": "Partido de extrema-direita alemão previsto para grande vitória no estado oriental - projeções", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 149298, "titulo": "Spd, 'risultato in Sassonia Anhalt è un segnale per Berlino'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/06/spd-risultato-in-sassonia-anhalt-e-un-segnale-per-berlino_a90c092d-a8dd-49c3-b037-98a30c9d8ccc.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-06T17:39:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A declaração 'E state certi che lo faremo' foi feita em relação ao resultado em Sassonia Anhalt. Isso é visto como um sinal para Berlim.", "titulo_pt": "Spd, resultado em sassonia-anhalt é um sinal para berlim", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 149117, "titulo": "Una jueza dicta prisión preventiva para los dos presuntos asesinos del músico de Camilo Séptimo y su familia", "url": "https://elpais.com/mexico/2026-09-06/una-jueza-dicta-prision-preventiva-para-los-dos-presuntos-asesinos-del-musico-de-camilo-septimo-y-su-familia.html", "fonte_id": "elpais_america", "data_pub": "2026-09-06T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A juíza decretou prisão preventiva para os dois presuntos assassinos do músico de Camilo Séptimo e sua família. A defesa dos acusados alega irregularidades nas suas detenções, aguardando a reanucação da audiência que decidirá se há elementos suficientes para levá-los ao julgamento.", "titulo_pt": "Juíza decreta prisão preventiva para presuntos assassinos do músico de Camilo Séptimo e sua família", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 149007, "titulo": "Irã diz que lidará com questões econômicas e ameaça novos ataques", "url": "https://www.cnnbrasil.com.br/internacional/ira-diz-que-lidara-com-questoes-economicas-e-ameaca-novos-ataques/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após uma pausa nas ações militares durante grande parte de agosto, o Irã retomou os ataques de retaliação, atingindo três petroleiros norte-americanos no sábado. As declarações sugerem que o Irã está disposto a lidar com questões econômicas e pode intensificar ataques.", "titulo_pt": "Irã retoma ataques de retaliação e ameaça novos golpes econômicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148869, "titulo": "Aprovação de Trump cai para 33%, menor nível já registrado em pesquisa do Financial Times", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/aprovacao-de-trump-cai-para-33-menor-nivel-ja-registrado-em-pesquisa-do-financial-times.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-06T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aprovação de Donald Trump caiu para 33%, atingindo o menor nível registrado em uma pesquisa do Financial Times. Os eleitores se desiludiram com a maneira como ele gerencia a economia e o custo de vida.", "titulo_pt": "Aprovação de Trump cai para 33%, menor nível já registrado em pesquisa do Financial Times", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 149021, "titulo": "Caiado volta a prometer redução da taxa de juros pela metade", "url": "https://www.infomoney.com.br/politica/caiado-volta-a-prometer-reducao-da-taxa-de-juros-pela-metade/", "fonte_id": "infomoney", "data_pub": "2026-09-06T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Goiás, Ronaldo Caiado, reiterou sua promessa de reduzir a taxa de juros a 7% após assumir o cargo. Ele fez essa declaração durante uma entrevista.", "titulo_pt": "Caiado volta a prometer redução da taxa de juros a 7%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149022, "titulo": "‘Voto definirá se teremos um Brasil que se apequena para outros países’, diz Lula", "url": "https://www.infomoney.com.br/politica/voto-definira-se-teremos-um-brasil-que-se-apequena-para-outros-paises-diz-lula/", "fonte_id": "infomoney", "data_pub": "2026-09-06T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que o voto no próximo pleito eleitoral será crucial para determinar se o Brasil continuará sendo uma potência ou se tenderá a se subordinar a outros países, em particular nos contextos de tarifas impostas pelos Estados Unidos e de disputas comerciais entre os dois países.", "titulo_pt": "Voto definirá se Brasil se apequenará para outros países, diz Lula", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149025, "titulo": "Ônibus com estudantes cai em barranco e deixa ao menos 25 mortos em Cabo Verde", "url": "https://www.infomoney.com.br/mundo/onibus-com-estudantes-cai-em-barranco-e-deixa-ao-menos-25-mortos-em-cabo-verde/", "fonte_id": "infomoney", "data_pub": "2026-09-06T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ônibus transportando estudantes caiu em um barranco em Cabo Verde, deixando pelo menos 25 mortos. O veículo transportava 32 pessoas e retornava para São Filipe após uma atividade anual realizada antes do início das aulas.", "titulo_pt": "Ônibus com estudantes cai em barranco e deixa ao menos 25 mortos em Cabo Verde", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149223, "titulo": "Trump's energy boss wavers on gasoline price path", "url": "https://www.axios.com/2026/09/06/chris-wright-gas-prices-labor-day", "fonte_id": "axios", "data_pub": "2026-09-06T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Energia Chris Wright cautelosamente previu uma alívio nos preços do combustível, mas evitou fazer projeções precisas. Durante entrevistas em programas políticos de domingo, ele também mencionou que o consumo de gasolina nos Estados Unidos está típico.", "titulo_pt": "Chefe de energia de trump vacila sobre caminho para alívio nos preços do gasolina", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 149026, "titulo": "O varejo espera a Selic cair — mas o ponto de partida mudou", "url": "https://www.infomoney.com.br/mercados/divida-varejo-selic-empresas-2026/", "fonte_id": "infomoney", "data_pub": "2026-09-06T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo enviado ao InfoMoney reve co-podemos-demostrarlo-cientificamente-solo-humanos-podemos-pensar-pensamos_0_3qc4Sj6TMF.html", "fonte_id": "clarin", "data_pub": "2026-09-06T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O neurocientista Ignacio Morgado afirma que, com base em evidências científicas, apenas os humanos têm consciência de que pensam. Um gato que se mira no espelho não reconhece a si mesmo, enquanto os humanos possuem essa capacidade, tornando-nos a espécie mais singular do planeta.", "titulo_pt": "Ignacio Morgado, neurocientífico: 'até onde podemos demonstrar cientificamente, apenas os humanos podem pensar que pensam'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 149388, "titulo": "Six unusual structures identified at Earth's core-mantle boundary with the help of deep learning", "url": "https://phys.org/news/2026-09-unusual-earth-core-mantle-boundary.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista JGR Solid Earth utilizou aprendizado de máquina para analisar ondas sísmicas e identificar seis estruturas incomuns na interface entre o núcleo e a crosta funda da Terra. Essas estruturas, que eram anteriormente visíveis apenas como manchas dispersas, agora aparecem como seis faixas contínuas de irregularidades.", "titulo_pt": "Seis estruturas incomuns identificadas na interface núcleo-crusta com a ajuda do aprendizado de máquina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148958, "titulo": "Estudo sugere relação do xilitol com aumento de doenças cardiovasculares", "url": "https://www.metropoles.com/colunas/claudia-meireles/estudo-sugere-relacao-do-xilitol-com-aumento-de-doencas-cardiovasculares", "fonte_id": "metropoles", "data_pub": "2026-09-06T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo, apresentado na Alemanha, sugere uma relação entre os níveis de xilitol no sangue e o aumento das chances de desenvolver doenças cardiovasculares graves.", "titulo_pt": "Estudo sugere relação do xilitol com aumento de doenças cardiovasculares", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149404, "titulo": "On this day in space! Sept. 6, 1947: The US Navy launches 1st V-2 rocket at sea in ballistic missile test", "url": "https://www.space.com/space-exploration/on-this-day-in-space-september-6-2026", "fonte_id": "space_com", "data_pub": "2026-09-06T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 6 de setembro de 1947, a Marinha dos Estados Unidos lançou, pela primeira vez, um foguete V-2 a partir de uma embarcação de aviação. Este teste marítimo foi importante para a evolução das tecnologias balísticas.", "titulo_pt": "6 De setembro de 1947: marinha dos EUA realiza primeiro lançamento de foguete V-2 a partir de navio", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 149405, "titulo": "SpaceX Falcon 9 rocket launches 27 Starlink satellites, lands on ship at sea (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-starlink/group-15-24-launch-ocisly", "fonte_id": "space_com", "data_pub": "2026-09-06T15:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou mais uma lote de satélites Starlink do espaço da costa central da Califórnia. O foguete Falcon 9 colocou 27 satélites em órbita e pousou em uma embarcação no mar.", "titulo_pt": "Spacex lança 27 satélites Starlink e pousa foguete no mar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 149389, "titulo": "The extinct American 'cheetah' was not a cheetah after all", "url": "https://phys.org/news/2026-09-extinct-american-cheetah.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Miracinonyx trumani, anteriormente conhecido como 'girafa-veloz' americano, era mais relacionado a pumas do que a cebus. Alguns grupos dessa espécie que viviam próximos ao Ártico se alimentavam quase exclusivamente de peixes, desafiando a suposição antiga de que esses animais caçavam presas rápidas como pronghorns.", "titulo_pt": "O 'girafa-veloz' americano não era realmente um guepardo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149406, "titulo": "Feel the Force with these 10 out-of-this-world Lego Star Wars starships", "url": "https://www.space.com/entertainment/space-toys-lego/feel-the-force-with-these-ten-out-of-this-world-lego-star-wars-starships", "fonte_id": "space_com", "data_pub": "2026-09-06T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo lista dez naves icônicas do universo Star Wars disponíveis em Lego Star Wars. Independente de ser um Jedi ou um Sith, os fãs da série podem querer adquirir essas naves.", "titulo_pt": "Sinta a força com essas 10 naves estelares Lego Star Wars", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 149390, "titulo": "Extreme pressure turns blue pigment into record-long single-atom copper chains", "url": "https://phys.org/news/2026-09-extreme-pressure-blue-pigment-atom.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas criaram uma das cadeias de cobre com átomos únicos mais longas até o momento, alcançando recordes que poderiam servir como fios moleculares. Essas cadeias de cobre podem permitir que os fios eletrônicos sejam miniaturizados além das dimensões convencionais, devido à diminuição constante do tamanho dos componentes tecnológicos baseados em silício.", "titulo_pt": "Pressão extrema transforma pigmento azul em cadeias de átomos únicos de cobre recordistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149391, "titulo": "How algorithms are making our environments bland", "url": "https://phys.org/news/2026-09-algorithms-environments-bland.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cor de ano para 2026 da Pantone é branco, chamado de Dançarina de Nuvem, que é descrito como 'branco elevado'. Esta escolha reflete uma tendência crescente de redução do uso de cores em nosso mundo visual.", "titulo_pt": "Como os algoritmos estão tornando nossos ambientes monossilábicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149392, "titulo": "'Quiet' pulsar suddenly reveals three glitches in 15 years of observations", "url": "https://phys.org/news/2026-09-quiet-pulsar-suddenly-reveals-glitches.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram três glissadas em um pulsar chamado PSR J1637−4642, usando dados de mais de 15 anos coletados pelo telescópio radioelétrico Parkes. Este pulsar, um jovem núcleo de estrela, não apresentava glissadas desde sua descoberta.", "titulo_pt": "Pulsar 'silencioso' revela três glissadas em 15 anos de observações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148979, "titulo": "Cerveja 'zero' é mesmo sem álcool? Entenda o que dizem os rótulos", "url": "https://exame.com/ciencia/cerveja-zero-e-mesmo-sem-alcool-entenda-o-que-dizem-os-rotulos/", "fonte_id": "exame", "data_pub": "2026-09-06T12:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Processos de produção podem deixar vestígios de álcool em cervejas 'zero'. Marcas e consumidores discutem como essa informação deve ser apresentada nos rótulos.", "titulo_pt": "Cerveja 'zero' é mesmo sem álcool? Entenda o que dizem os rótulos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 148833, "titulo": "Assim nasce um cometa de curto período", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/09/assim-nasce-um-cometa-de-curto-periodo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-06T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram pela primeira vez o início do processo de transformação de um cometa de curto período, notando o objeto 450P/Loneos. Este evento capturou o momento em que o cometa ainda estava em sua região distante, antes de começar a descer para o setor ensolarado.", "titulo_pt": "Assim nasce um cometa de curto período", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 149397, "titulo": "What archaeology reveals about the rise of all-powerful rulers", "url": "https://www.scientificamerican.com/article/what-archaeology-reveals-about-the-rise-of-all-powerful-rulers/", "fonte_id": "scientific_american", "data_pub": "2026-09-06T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autocracia não era inevitável nas civilizações antigas. No entanto, quando houve riquezas disponíveis para serem monopolizadas, surgiram líderes poderosos e desigualdades.", "titulo_pt": "O que a arqueologia revela sobre o surgimento de governantes omnipotentes", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 149398, "titulo": "These smart bricks know what object they make up", "url": "https://www.scientificamerican.com/article/these-smart-bricks-know-what-object-they-make-up/", "fonte_id": "scientific_american", "data_pub": "2026-09-06T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Blocos inteligentes podem identificar se estão formando uma embarcação, cadeira ou guitarra.", "titulo_pt": "Estes blocos inteligentes reconhecem os objetos que formam", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 149407, "titulo": "NASA expands Deep Space Network with giant new dish in California desert", "url": "https://www.space.com/astronomy/nasa-expands-deep-space-network-with-giant-new-dish-in-california-desert", "fonte_id": "space_com", "data_pub": "2026-09-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA expandiu sua rede Deep Space Network com uma nova antena gigante no deserto da Califórnia, aumentando a capacidade da rede de comunicações de longo alcance cada vez mais estressada devido às demandas das missões Artemis e outras.", "titulo_pt": "NASA amplia rede Deep Space Network com nova antena gigante no deserto da califórnia", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 148285, "titulo": "Expedição na mata atlântica busca microrganismos para construir banco de moléculas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/expedicao-na-mata-atlantica-busca-microrganismos-para-construir-banco-de-moleculas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma expedição científica na mata atlântica buscou microrganismos em diferentes substratos com o objetivo de identificar moléculas potencialmente úteis para a agricultura e a indústria de cosméticos.", "titulo_pt": "Expedição na mata atlântica procura microrganismos para banco de moléculas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 149427, "titulo": "14 People Hospitalized During The Chainsmokers Concert in San Jose", "url": "https://consequence.net/2026/09/14-people-hospitalized-during-the-chainsmokers-concert-in-san-jose/", "fonte_id": "consequence_sound", "data_pub": "2026-09-06T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o show dos The Chainsmokers em São José, 14 pessoas foram hospitalizadas. A polícia relatou que alguns espectadores foram tratados por suspeita de intoxicação alcoólica e problemas relacionados a drogas, mas não foi estabelecido uma única causa.", "titulo_pt": "14 Pessoas hospitalizadas durante o show dos The Chainsmokers em são josé", "veiculo": "Consequence const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>

    </div>
    ${renderPodcast()}
    ${renderDestaque()}
