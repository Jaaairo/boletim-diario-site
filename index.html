ge recorde, e atraso de famílias chega a 7,8%, diz BC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/inadimplencia-no-brasil-sobe-a-64-e-atinge-maior-nivel-da-serie-historica-mostra-bc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T14:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inadimplência no crédito livre atingiu 6,4% em julho, o maior nível desde a série histórica do Banco Central, iniciada em março de 2011. Atrasados de pessoas físicas somaram 7,8%.", "titulo_pt": "Inadimplência no crédito livre atinge recorde, e atraso de famílias chega a 7,8%, diz BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130032, "titulo": "Braskem diz que Justiça aprovou processamento da recuperação extrajudicial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/braskem-diz-que-justica-aprovou-processamento-da-recuperacao-extrajudicial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T14:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem informou que a Justiça aprovou o processamento da recuperação extrajudicial da companhia e de certas controladas, visando reestruturar dívidas de US$ 10,9 bilhões.", "titulo_pt": "Braskem anuncia aprovação da Justiça para recuperação extrajudicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 130767, "titulo": "Mice, a Caved-In Ceiling, and Cloudy Water: The GSA’s New Office Is Falling Apart", "url": "https://www.wired.com/story/mice-a-caved-in-ceiling-and-cloudy-water-the-gsas-new-office-is-falling-apart/", "fonte_id": "wired", "data_pub": "2026-08-28T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um funcionário do GSA questiona se é necessário verificar a tectura antes de usar o banheiro e se a água pode ser confiavelmente consumida. O novo escritório do GSA está apresentando problemas.", "titulo_pt": "Ratones, tectura vazada e água turva: o novo escritório do GSA está caído em pedaços", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 130760, "titulo": "How Sweden built one of Europe’s hottest startup ecosystems", "url": "https://techcrunch.com/2026/08/28/how-sweden-built-one-of-europes-hottest-startup-ecosystems/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sophia Bendz, general partner da Cherry Ventures, participou do Equity para analisar o atual estado do ecossistema de tecnologia da Suécia.", "titulo_pt": "Como a suécia construiu um dos ecossistemas de startups mais quentes da Europa", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 130777, "titulo": "DLSS 5 leaked and modders are putting Nvidia’s AI effects on everything", "url": "https://www.theverge.com/games/986197/nvidia-dlss-5-leak-ai", "fonte_id": "the_verge", "data_pub": "2026-08-28T16:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Modders estão testando uma versão não-oficial do DLSS 5 da Nvidia em jogos como Skyrim, Cyberpunk 2077 e GTA V após a descoberta de código para a tecnologia de escalonamento de alta definição baseada em IA em uma pré-versão do NBA 2K27. O RenoDX, um canal do Discord para modders, encontrou uma maneira de extrair o DLSS 'Neural'.", "titulo_pt": "Versão não-oficial do DLSS 5 do Nvidia é testada em vários jogos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 130556, "titulo": "China is secretly fueling America's data center rage", "url": "https://www.axios.com/2026/08/28/china-ai-data-center-backlash-bots", "fonte_id": "axios", "data_pub": "2026-08-28T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A X, empresa propriedade do Twitter, identificou 200 contas suspeitas de um suposto bot farm chinês que tentaram influenciar americanos a se oporem a centrais de dados de IA nas redes sociais. Essa ação parece ser parte de uma operação de propaganda chinesa visando retardar o avanço tecnológico dos Estados Unidos.", "titulo_pt": "China estaria secretamente influenciando americanos contra centrais de dados de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 130557, "titulo": "The case for the U.S. dollar's digital edge", "url": "https://www.axios.com/2026/08/28/us-dollar-stablecoins-usdc", "fonte_id": "axios", "data_pub": "2026-08-28T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas tecnologias financeiras estão tornando o envio de dinheiro mais rápido e econômico internacionalmente. No entanto, pesquisas apresentadas no encontro de Jackson Hole sugerem que essas inovações podem fortalecer ainda mais o domínio do dólar na finança global.", "titulo_pt": "O caso para a vantagem digital do dólar", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 130761, "titulo": "More Americans oppose police license plate cameras than support them: survey", "url": "https://techcrunch.com/2026/08/28/more-americans-oppose-police-license-plate-cameras-than-support-them-survey/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais americanos se opõem às câmeras de placa de veículo policiais do que apoiam esse sistema, de acordo com uma pesquisa. O descontentamento cresce em meio a relatos de abusos policiais com câmeras de vigilância.", "titulo_pt": "Mais americanos se opõem às câmeras de placa de veículo policiais do que apoiam esse sistema, pesquisa mostra", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 130781, "titulo": "Meta makes AI glasses slightly less creepy with limit on nonconsensual recording", "url": "https://arstechnica.com/tech-policy/2026/08/meta-tweaks-ai-glasses-to-block-some-creepy-recordings-but-privacy-risks-remain/", "fonte_id": "ars_technica", "data_pub": "2026-08-28T15:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta resolveu um problema nos seus óculos inteligentes ao impedir que eles registrem quando os usuários cobrem a luz de segurança. Isso diminui a sensação de intrusão não-consensual.", "titulo_pt": "Meta corrige óculos inteligentes para parar de registrar quando os usuários cobrem a luz de segurança", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 130762, "titulo": "Friend-focused photo-sharing app Retro snags $21M", "url": "https://techcrunch.com/2026/08/28/friend-focused-photo-sharing-app-retro-snags-21m/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aplicativo de compartilhamento de fotos focado em amigos, Retro, levantou mais de 21 milhões de dólares em financiamento de série A. O aplicativo foi desenvolvido por ex-funcionários do Instagram.", "titulo_pt": "Aplicativo focado em amigos, Retro, arrecada mais de 21 milhões", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 130354, "titulo": "The AI Backlash Gets Professional", "url": "https://www.theatlantic.com/technology/2026/08/irreplaceable-climate-activists-ai-backlash/688404/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-28T15:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova organização está utilizando o guia de campanha do movimento climático para alvo de empresas de tecnologia e do governo.", "titulo_pt": "A reação contra a IA adota o guia do movimento climático", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 130768, "titulo": "AI Has Human Doctors Asking: What’s Left for Us?", "url": "https://www.wired.com/story/ai-has-human-doctors-asking-whats-left-for-us/", "fonte_id": "wired", "data_pub": "2026-08-28T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um recente artigo sugere que a IA frequentemente se safa melhor em diagnósticos médicos do que médicos humanos. Este fato não foi bem recebido por profissionais médicos.", "titulo_pt": "IA está superando médicos humanos: profissionais estão preocupados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 130195, "titulo": "Por que a Nvidia vai continuar 'imprimindo dinheiro' para sustentar a IA", "url": "https://exame.com/tecnologia/por-que-a-nvidia-vai-continuar-imprimindo-dinheiro-para-sustentar-a-ia/", "fonte_id": "exame", "data_pub": "2026-08-28T14:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia continua investindo pesadamente em infraestrutura de inteligência artificial para atender seus clientes, após reduzir sua participação na OpenAI. Esses investimentos mantêm uma rede bilionária que suporta a infraestrutura necessária para a IA.", "titulo_pt": "Por que a Nvidia vai continuar 'imprimindo dinheiro' para sustentar a IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 130196, "titulo": "Dario Amodei diz que Anthropic, do Claude, 'não tem interesse em destruir ninguém'", "url": "https://exame.com/inteligencia-artificial/dario-amodei-diz-que-anthropic-do-claude-nao-tem-interesse-em-destruir-ninguem/", "fonte_id": "exame", "data_pub": "2026-08-28T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO Dario Amodei tentou acalmar as preocupações da Wall Street sobre a 'Saaspocalypse', um episódio em que o anúncio da empresa Anthropic causou uma queda de US$ 1 trilhão no setor de software em uma semana.", "titulo_pt": "Dario Amodei afirma que Anthropic 'não tem interesse em destruir ninguém'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 130729, "titulo": "BYD posts US$1.2 billion profit in second quarter on surging global demand", "url": "https://www.scmp.com/business/china-evs/article/3365652/byd-posts-us12-billion-profit-second-quarter-surging-global-demand?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T14:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante chinesa de veículos elétricos BYD registrou lucro líquido de 8,2 bilhões de yuanes (US$ 1,2 bilhão) no segundo trimestre, um aumento de 30% em comparação com o mesmo período do ano anterior. A empresa, que é também a maior fabricante mundial de veículos elétricos, saiu de uma sequência de cinco trimestres consecutivos de prejuízos devido a uma demanda global robusta e a introdução de modelos de alta gama.", "titulo_pt": "BYD registra lucro líquido de US$ 1,2 bilhão no segundo trimestre com aumento de vendas globais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 130404, "titulo": "Principled Caution: Navigating AI in Asian Newsrooms", "url": "https://thediplomat.com/2026/08/principled-caution-navigating-ai-in-asian-newsrooms/", "fonte_id": "the_diplomat", "data_pub": "2026-08-28T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em muitos países asiáticos, permitir que um erro gerado por IA seja publicado poderia resultar em danos à reputação, bem como em perseguição legal e política.", "titulo_pt": "Cautela princípios: navegando a IA em redações asiáticas", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 130036, "titulo": "Anthropic testa sistema que permite IA atuar em experimentos científicos e criação de remédios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/anthropic-testa-sistema-que-permite-ia-atuar-em-experimentos-cientificos-e-criacao-de-remedios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T13:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic está lançando um sistema que permite a seu software controlar dispositivos científicos e de engenharia para realizar experimentos, representando sua primeira ferramenta projetada para operar no mundo físico.", "titulo_pt": "Anthropic testa sistema que permite IA atuar em experimentos científicos e criação de remédios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130733, "titulo": "Unmanned electric aircraft makes maiden flight in Hong Kong", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3365647/unmanned-electric-aircraft-makes-maiden-flight-hong-kong?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T13:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião não tripulado elétrico de decolagem e pouso vertical (eVTOL) realizou seu voo inaugural em Hong Kong, em parceria com a empresa chinesa EHang, a operadora local de transporte Kwoon Chung Bus Holdings e o hub tecnológico Cyberport. O voo ocorreu em Pok Fu Lam, marcando um passo na promoção de uma economia de baixa altitude pela cidade, com o governo planejando concluir a elaboração de legislação relevante até 2027.", "titulo_pt": "Avião não tripulado elétrico realiza voo inaugural em Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 130785, "titulo": "Scientists capture first molecular-level images of water reorganization during a reaction crucial for life", "url": "https://phys.org/news/2026-08-scientists-capture-molecular-images-reaction.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas capturaram pela primeira vez imagens molecular-level da reorganização da água durante uma reação crucial para a vida. Esses processos, que envolvem a movimentação coordenada de partículas negativamente e positivamente carregadas, são fundamentais para a fotossíntese, a catelise e a conversão biológica de energia, mas são difíceis de observar.", "titulo_pt": "Cientistas capturam primeiras imagens molecular-level de reorganização da água em reação crucial para a vida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130786, "titulo": "Does the Nepal glacier collapse signal a new climate risk?", "url": "https://phys.org/news/2026-08-nepal-glacier-collapse-climate.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colapso de uma seção de geleira nos Himalayas do Nepal, que causou inundações devastadoras, pode indicar um novo tipo de risco em um mundo aquecido pelo aquecimento global, conforme informaram os cientistas à AFP.", "titulo_pt": "Colapso da geleira no Nepal pode sinalizar novo risco climático?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130836, "titulo": "Free-falling atoms in space put a new twist on Galileo’s gravity test", "url": "https://www.sciencenews.org/article/atoms-gravity-space-galileo-einstein", "fonte_id": "science_news", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Átomos de rubidio na Estação Espacial Tiangong da China caíram com a mesma aceleração, confirmando um princípio fundamental da teoria geral da relatividade de Einstein.", "titulo_pt": "Átomos livres em queda na estação espacial tiangong testam a gravidade de galileu", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 130854, "titulo": "'Silo' season 3: Common and Alexandria Riley talk shocking truths and writers tearing their on-screen marriage apart (interview)", "url": "https://www.space.com/entertainment/space-movies-shows/silo-season-3-common-and-alexandria-riley-talk-shocking-truths-and-writers-tearing-their-on-screen-marriage-apart-interview", "fonte_id": "space_com", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As atrizes Common e Alexandria Riley falaram sobre a jornada das personagens em 'Silo' temporada 3 e sobre os escritores estressados com a separação dramática de seus personagens na tela.", "titulo_pt": "Silo temporada 3: common e Alexandria Riley falam sobre a jornada das personagens e sobre os escritores estressados com a separação dramática", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 130810, "titulo": "Opinion: The unintended consequences of the Lindsay Clancy case", "url": "https://www.statnews.com/2026/08/28/lindsay-clancy-postpartum-psychosis-reproductive-psychiatrists-liability/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os psiquiatras reprodutivos e forenses expressam preocupação de que o caso Lindsay Clancy possa levar os psiquiatras a se tornarem mais relutantes em tratar mulheres com doenças mentais.", "titulo_pt": "Opinião: as consequências imprevistas do caso Lindsay Clancy", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 130243, "titulo": "Vulnerabilidade pode virar alvo em câncer de mama agressivo, mostra estudo", "url": "https://www.metropoles.com/saude/vulnerabilidade-pode-virar-alvo-em-cancer-de-mama-agressivo-mostra-estudo", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou uma dependência energética no tumor do câncer de mama agressivo, o que pode ser explorado como alvo terapêutico para casos específicos. Essa descoberta pode oferecer novas possibilidades de tratamento para esta forma do câncer.", "titulo_pt": "Vulnerabilidade energética pode se tornar alvo no câncer de mama agressivo, indica estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130787, "titulo": "Honey bees can serve as sentinels for environmental health", "url": "https://phys.org/news/2026-08-honey-bees-sentinels-environmental-health.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos usando uma abordagem 'One Health' têm identificado abelhas-douradas (Apis mellifera) como sentinelas do bem-estar ambiental. Elas são expostas a contaminantes através da coleta de néctar, pólen e água, o que pode indicar pressões ambientais sobre a biodiversidade e a funcionalidade dos ecossistemas.", "titulo_pt": "As abelhas-douradas podem servir como sentinelas da saúde ambiental", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130788, "titulo": "Breathable smart sensor developed for real-time hazardous gas detection on masks", "url": "https://phys.org/news/2026-08-breathable-smart-sensor-real-hazardous.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa liderado por Sungwon Lee, um professor da Departamento de Física e Química na DGIST, desenvolveu uma estrutura nano-on-nano hierárquica ao diretamente crescer nanoválvulas de grafeno (GNWs) em nanofibras poliméricas, melhorando o desempenho de sensores de gás vestíveis. A tecnologia pode ser aplicada a sensores vestíveis futuros para monitorar em tempo real as condições respiratórias de indivíduos ou gás perigosos em ambientes industriais.", "titulo_pt": "Sensor inteligente respirável desenvolvido para detecção em tempo real de gás perigoso em máscaras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130831, "titulo": "President Honors NASA’s Artemis II Crew with Highest US Space Award", "url": "https://www.nasa.gov/news-release/president-honors-nasas-artemis-ii-crew-with-highest-us-space-award/", "fonte_id": "nasa_news", "data_pub": "2026-08-28T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald J. Trump concedeu a medalha do Congresso honorária espacial aos astronautas Reid Wiseman, Victor Glover, Christina Koch e Jeremy Hansen, do Canadá, durante uma cerimônia no Centro Espacial Johnson em Houston. Os astronautas foram honrados por seu serviço durante a missão Artemis II.", "titulo_pt": "Presidente homenageia tripulantes da Artemis II com mais alto prêmio espacial dos EUA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 130257, "titulo": "Mulher recupera a visão após passar por transplante de olho inédito", "url": "https://www.metropoles.com/saude/mulher-recupera-a-visao-apos-passar-por-transplante-de-olho-inedito", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher italiana recuperou a visão em um de seus olhos após médicos realizarem um transplante inédito, transplantando partes de um olho para o outro. Antes, ela havia perdido a visão em um olho por causa de um acidente de carro.", "titulo_pt": "Mulher recupera a visão após transplante de olho inédito", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130833, "titulo": "Grants", "url": "https://www.nasa.gov/centers-and-facilities/grants-2/", "fonte_id": "nasa_news", "data_pub": "2026-08-28T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Sistema de Gerenciamento de Pagamentos (PMS) está enfrentando problemas que afetam a geração do Relatório Financeiro Federal (FFR). Recipientes de subsídios da NASA afetados não serão considerados não conformes. A NASA está trabalhando para resolver o problema e atualizações serão publicadas aqui.", "titulo_pt": "Subsídios", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 130055, "titulo": "Vida do matemático Alan Turing ganha contornos mais ricos em conto", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/vida-do-matematico-alan-turing-ganha-contornos-mais-ricos-em-conto.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-28T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alan Turing é conhecido por sua contribuição na decifragem do código Enigma nazista durante a Segunda Guerra Mundial e por ser considerado o pai da computação moderna. Sua vida também foi retratada no filme 'O Jogo da Imitação', com Benedict Cumberbatch no papel principal.", "titulo_pt": "Vida de Alan Turing ganha novos contornos em conto", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 130837, "titulo": "Your skin chemistry may affect which mosquitoes most want to bite you", "url": "https://www.sciencenews.org/article/skin-chemistry-which-mosquitoes-bite", "fonte_id": "science_news", "data_pub": "2026-08-28T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostraram que três espécies de mosquito preferiam diferentes pessoas com base no odor e bactérias da pele. Os resultados podem auxiliar no desenvolvimento de repelentes baseados em microrganismos.", "titulo_pt": "A química da sua pele pode influenciar que mosquitos preferem picar você", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 130192, "titulo": "'Zumbido' cósmico pode guardar pistas sobre os primeiros buracos negros", "url": "https://exame.com/ciencia/zumbido-cosmico-pode-guardar-pistas-sobre-os-primeiros-buracos-negros/", "fonte_id": "exame", "data_pub": "2026-08-28T14:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que ondas gravitacionais detectadas por redes de pulsares podem conter informações sobre os primeiros bilhões de anos do Universo, possivelmente revelando detalhes sobre os primeiros buracos negros.", "titulo_pt": "Zumbido cósmico pode guardar pistas sobre os primeiros buracos negros", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 130826, "titulo": "See last night’s ‘blood moon’ eclipse from around the world", "url": "https://www.scientificamerican.com/article/see-last-nights-blood-moon-eclipse-from-around-the-world/", "fonte_id": "scientific_american", "data_pub": "2026-08-28T14:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Observadores em América do Norte, Europa e África puderam ver uma eclipses lunar quase total, onde a lua adquiriu um tom vermelho-escuro para os espectadores.", "titulo_pt": "Veja a última noite de 'lua vermelha' durante o eclipse", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 130730, "titulo": "The ‘Asian water tower’ is starting to wobble, computer simulations show", "url": "https://www.scmp.com/news/china/science/article/3365514/asian-water-tower-starting-wobble-computer-simulations-show?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo publicado em Nature Communications indica que o 'teto d'água asiático' está se tornando mais imprevisível e instável, medida pela entropia do Plateau Tibetano. O relatório foi divulgado dias antes de uma enxurrada catastrófica causar destruição na fronteira entre Nepal e China.", "titulo_pt": "O 'teto d'água asiático' está se tornando mais imprevisível, estudo mostra", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 130924, "titulo": "‘Dark Matter’ Season 2 Tests the Limits of Apple TV’s Sci-Fi Obsession", "url": "https://www.indiewire.com/criticism/shows/dark-matter-season-2-review-apple-tv-sci-fi-obsession-1235212989/", "fonte_id": "indiewire", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série de ficção científica 'Dark Matter' retorna após dois anos, apresentando um episódio complexo que ilustra os riscos do estratégia de blockbuster de alto conceito da Apple TV. A segunda temporada testa os limites dessa abordagem.", "titulo_pt": "Dark Matter", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 130848, "titulo": "What I Got Wrong About Krasner and Pollock", "url": "https://hyperallergic.com/what-i-got-wrong-about-krasner-and-pollock/", "fonte_id": "hyperallergic", "data_pub": "2026-08-28T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor percebeu que seu ent const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
