seis", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 218404, "titulo": "Judi Dench, vencedora do Oscar, diz que deixou de atuar devido a perda de visão", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/judi-dench-vencedora-do-oscar-diz-que-deixou-de-atuar-devido-a-perda-de-visao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz britânica Judi Dench, de 91 anos, anunciou que deixou de atuar devido à perda de visão devido à degeneração macular. Ela não consegue mais atuar no palco ou em filmes.", "titulo_pt": "Judi Dench, vencedora do Oscar, deixa de atuar devido à perda de visão", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 218890, "titulo": "El otro efecto manada", "url": "https://www.latercera.com/opinion/noticia/el-otro-efecto-manada/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T15:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto aborda um efeito secundário ou consequência não-intencionada da decisão judicial conhecida como 'Efeito Manada'. Não há detalhes específicos sobre o conteúdo do trecho fornecido.", "titulo_pt": "O outro efeito manada", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 218406, "titulo": "No Esquina do Souza, arroz com feijão cai bem com pastéis e coxinhas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/restaurantes/2026/10/no-esquina-do-souza-arroz-com-feijao-cai-bem-com-pasteis-e-coxinhas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O restaurante Esquina do Souza, localizado na R. Carneiro da Silva, 185, na Vila Leopoldina, região oeste de São Paulo, recebeu 4 estrelas da crítica, indicando que é muito bom. O estabelecimento oferece arroz com feijão, pastéis e coxinhas como opções de cardápio.", "titulo_pt": "No Esquina do Souza, arroz com feijão combina bem com pastéis e coxinhas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 219392, "titulo": "Ali G: Who Iz I? review – Sacha Baron Cohen’s high-stakes satire punches up and down with spectacular bad taste", "url": "https://www.theguardian.com/film/2026/oct/22/ali-g-who-iz-i-review-sacha-baron-cohens-high-stakes-satire-punches-up-and-down-with-spectacular-bad-taste", "fonte_id": "guardian_culture", "data_pub": "2026-10-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sacha Baron Cohen retorna com Ali G após 20 anos, enfrentando críticas por sua irrelevância e buscando aprovação de uma nova geração. O comediante criou um novo personagem para se antecipar e zombar da acusação de racismo.", "titulo_pt": "Ali G: quem sou eu? – a satira de alta aposto de Sacha Baron Cohen batalha por relevância e aprovação", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 219393, "titulo": "Heartbreak, hope and human imperfection: Leonard Cohen’s greatest songs – ranked!", "url": "https://www.theguardian.com/music/2026/oct/22/leonard-cohen-best-songs-ranked", "fonte_id": "guardian_culture", "data_pub": "2026-10-22T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lista classifica as melhores músicas do cantor-canção-canadense Leonard Cohen, que trouxe sabedoria espiritual ao amor e à tristeza. O álbum 'I’m Your Man' de 1988, apesar de sua produção com sintetizadores, é apreciado na faixa de abertura, que combina bem a arranjo Pet Shop Boys e a voz ronca de Cohen.", "titulo_pt": "Tristeza, esperança e imperfeição humana: as melhores músicas de leonard Cohen – classificadas!", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 219396, "titulo": "Amy Winehouse: Back to Black 20 review – trying an all-star Amy tribute show is a losing game", "url": "https://www.theguardian.com/music/2026/oct/22/amy-winehouse-back-to-black-20-review-bbc-roundhouse-london", "fonte_id": "guardian_culture", "data_pub": "2026-10-22T14:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amy Winehouse lançou seu álbum 'Back to Black' há 20 anos e faleceu há 15 anos. Um show de tributo com artistas regravando as músicas não consegue superar a memória de Winehouse, que era conhecida por sua playfulness, bite, anarchic charisma e taste.", "titulo_pt": "Amy Winehouse: retrospectiva 20 - tentativa de show de estrelas em homenagem a Amy é uma jogada perdida", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 218407, "titulo": "O duelo dramático entre Ana Beatriz Nogueira e Andréia Horta em 'Boa Noite, Mãe'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/mise-en-scene/2026/10/o-duelo-dramatico-entre-ana-beatriz-nogueira-e-andreia-horta-em-boa-noite-mae.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O drama 'Boa Noite, Mãe' apresenta um confronto direto entre Jessie e sua mãe, sem concessões emocionais, sob a direção de Leonardo Netto. A atriz Ana Beatriz Nogueira interpreta Jessie, que anuncia para sua mãe que não retornará, enquanto Andréia Horta interpreta a mãe. A peça é conduzida como uma contagem regressiva contínua, sem alívios dramáticos ou reviravoltas.", "titulo_pt": "O duelo dramático entre Ana Beatriz Nogueira e Andréia Horta em 'Boa Noite, Mãe'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 219395, "titulo": "Zach Braff: ‘You can be talented and good-looking, but acting success is still like winning the lottery’", "url": "https://www.theguardian.com/film/2026/oct/22/zach-braff-reader-interview", "fonte_id": "guardian_culture", "data_pub": "2026-10-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zach Braff, ator de Scrubs e Garden State, respondeu perguntas sobre trabalhar com celebridades como Morgan Freeman, Michael Caine e Harrison Ford, mantendo a compostura ao direcioná-los. Ele enfatizou a importância de um diretor conhecer bem a cena, ter um plano para sua execução e, no caso do comédia, saber como torná-la engraçada.", "titulo_pt": "Zach Braff: 'você pode ser talentoso e bonito, mas o sucesso na atuação ainda é como ganhar na loteria'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 219398, "titulo": "‘Jane Austen is for everyone’: novelist Diana Reid on adapting Sense and Sensibility – and surprising Brits with her accent", "url": "https://www.theguardian.com/books/2026/oct/23/jane-austen-is-for-everyone-novelist-diana-reid-sense-and-sensibility-adaptation", "fonte_id": "guardian_culture", "data_pub": "2026-10-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diana Reid, autora australiana, escreveu um roteiro para a adaptação de 'Sense and Sensibility', usando poucas linhas do original de Jane Austen e criando a maior parte da diálogo. Ela imitou a voz distintiva de Austen estudando sua prosa.", "titulo_pt": "Jane Austen é para todos: a autora australiana Diana Reid sobre adaptar 'Sense and Sensibility'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 218641, "titulo": "Participação feminina nos conselhos de empresas do IBrX100 cresce 28% em cinco anos", "url": "https://veja.abril.com.br/economia/participacao-feminina-nos-conselhos-de-empresas-do-ibrx100-cresce-28-em-cinco-anos/", "fonte_id": "veja", "data_pub": "2026-10-22T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação feminina nos conselhos de empresas do IBrX100 aumentou 28% em cinco anos. No entanto, 11 companhias ainda não contam com mulheres em seus colegiados.", "titulo_pt": "Participação feminina nos conselhos de empresas do IBrX100 cresce 28% em cinco anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 218623, "titulo": "Criança de 5 anos é atacada por escorpião no Zoológico de Brasília", "url": "https://www.metropoles.com/distrito-federal/crianca-de-5-anos-e-atacada-por-escorpiao-no-zoologico-de-brasilia", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma criança de 5 anos foi atacada por um escorpião durante uma visita ao zoológico de Brasília, enquanto participava de um passeio escolar. A criança notou o animal dentro do seu sapato e foi picada.", "titulo_pt": "Criança de 5 anos é atacada por escorpião no Zoológico de Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 218624, "titulo": "Casal suspeito de matar Beatriz Vitória ia fazer tatuagem exaltando morte", "url": "https://www.metropoles.com/minas-gerais/casal-suspeito-de-matar-beatriz-vitoria-ia-fazer-tatuagem-exaltando-morte", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigações revelaram que o casal suspeito de matar Beatriz Vitória planejava fazer uma tatuagem conjunta exaltando a morte. A polícia suspeita que o crime tenha sido motivado por ciúmes.", "titulo_pt": "Casal suspeito de matar Beatriz Vitória planejava tatuagem exaltando morte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 218633, "titulo": "Irmãos são condenados por tentar matar vendedor de chocolates no DF", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/irmaos-sao-condenados-por-tentar-matar-vendedor-de-chocolates-no-df", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os irmãos Jeferson Carmo e Salatiel Rodrigues foram condenados a 11 e 9 anos de prisão, respectivamente, por tentativa de homicídio contra um vendedor de chocolates em Brasília.", "titulo_pt": "Irmãos condenados por tentativa de matar vendedor de chocolates no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 218885, "titulo": "Rebaja de penas a condenados por delitos sexuales contra menores complica a La Moneda e inquieta a los partidos oficialistas", "url": "https://www.latercera.com/politica/noticia/rebaja-de-penas-a-condenados-por-delitos-sexuales-contra-menores-complica-a-la-moneda-e-inquieta-a-los-partidos-oficialistas/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T16:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A decisão de reduzir penas para condenados por delitos sexuais contra menores causou questionamentos sobre o critério aplicado e pressionou o Executivo a se defender. A justificativa do Palácio não conseguiu conter as críticas, nem mesmo dentro do próprio partido, e há iniciativas no Congresso para impedir que esse benefício seja concedido novamente.", "titulo_pt": "Decisão de reduzir penas para condenados por delitos sexuais contra menores complica palácio e inquieta partidos oficialistas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 218654, "titulo": "Professora fingiu estar morta para sobreviver a massacre em escola nos EUA", "url": "https://veja.abril.com.br/mundo/professora-fingiu-estar-morta-para-sobreviver-a-massacre-em-escola-nos-eua/", "fonte_id": "veja", "data_pub": "2026-10-22T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma professora fingiu estar morta durante um massacre a tiros em uma escola no Oregon, EUA, que resultou em uma professora e três crianças de 5, 8 e 11 anos mortas. O agressor era um ex-aluno de 16 anos que foi morto após o crime.", "titulo_pt": "Professora fingiu estar morta durante massacre em escola dos EUA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 219007, "titulo": "'Protesting is no longer a right, but a risk we have to take': French protestors weigh whether to return to the streets", "url": "https://www.lemonde.fr/en/politics/article/2026/10/22/protesting-is-no-longer-a-right-but-a-risk-we-have-to-take-french-protestors-weigh-whether-to-return-to-the-streets_6761614_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos em todo o país em 17 de outubro deixaram os participantes surpresos com o saque de lojas, o dano a edifícios públicos e a utilização extensa de gás lacrimogênio contra manifestações pacíficas. Alguns decidirão marchar novamente neste sábado, enquanto outros não o farão.", "titulo_pt": "Protestar já não é um direito, mas um risco que temos que correr: franceses ponderam se voltarão às ruas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 218581, "titulo": "Após foco de doença, governo decreta emergência sanitária em 4 cidades de Santa Catarina", "url": "https://exame.com/agro/apos-foco-de-doenca-governo-decreta-emergencia-sanitaria-em-4-cidades-de-santa-catarina/", "fonte_id": "exame", "data_pub": "2026-10-22T14:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Santa Catarina decretou emergência sanitária em quatro cidades após a detecção da doença de Newcastle em granjas de perus. As compras de aves do estado foram suspensas pela China, Arábia Saudita e México.", "titulo_pt": "Governo de sc decreta emergência sanitária em 4 cidades devido à doença de newcastle", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 218850, "titulo": "Why So Many Men Aren’t Working", "url": "https://www.theatlantic.com/ideas/2026/10/job-market-unemployment-men-screentime/689109/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-22T13:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem vagas de emprego disponíveis, mas há dificuldades em encontrar homens dispostos e capazes de ocupá-las.", "titulo_pt": "Por que tantos homens não estão trabalhando", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 218750, "titulo": "Por que precisamos de mais mulheres na política", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/por-que-precisamos-de-mais-mulheres-na-politica", "fonte_id": "jota", "data_pub": "2026-10-22T13:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação de mais mulheres na política é necessária para aprimorar políticas públicas, garantindo diversidade e lideranças capazes de transformar a escuta em decisões eficazes.", "titulo_pt": "Por que precisamos de mais mulheres na política", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 219343, "titulo": "Gavi and UNICEF secure lower malaria vaccine price, saving US$50 million for childhood immunization programmes", "url": "https://www.unicef.org/press-releases/gavi-and-unicef-secure-lower-malaria-vaccine-price-saving-us50-million-childhood", "fonte_id": "unicef", "data_pub": "2026-10-22T12:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Gavi e o UNICEF conseguiram negociar um preço mais baixo para a vacina contra a malária, economizando US$50 milhões para programas de imunização infantil.", "titulo_pt": "Gavi e UNICEF garantem redução no preço da vacina contra malária, economizando US$50 milhões para programas de imunização infantil", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 218690, "titulo": "Recursos de cotas de gênero e raça acabaram em campanhas de homens e brancos", "url": "https://www.dw.com/pt-br/recursos-de-cotas-de-gênero-e-raça-acabaram-em-campanhas-de-homens-e-brancos/a-79724478?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-22T12:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mulheres e negros transferiram R$ 9,4 milhões dos fundos partidário e eleitoral para campanhas fora da cota de gênero e raça. A prática é permitida em alguns casos, mas levanta questionamentos.", "titulo_pt": "Recursos de cotas de gênero e raça foram usados em campanhas de homens e brancos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 218852, "titulo": "A Forgotten Fix for American Racial Strife", "url": "https://www.theatlantic.com/books/2026/10/harold-cruse-biography-racism-integration/689110/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-22T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Harold Cruse tinha uma compreensão premonitória sobre por que os movimentos sociais tropeçam e como eles poderiam encontrar mais sucesso.", "titulo_pt": "Uma solução esquecida para o conflito Racial americano", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 219154, "titulo": "Analysis: UK Muslims face highest rate of hate crimes but police figures undercount them", "url": "https://www.middleeasteye.net/news/analysis-uk-muslims-face-highest-rate-hate-crimes-police-figures-under-count-them", "fonte_id": "middle_east_eye", "data_pub": "2026-10-22T10:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os muçulmanos no Reino Unido são os grupos mais afetados por crimes de ódio, tanto de natureza religiosa quanto racial. No entanto, as estatísticas policiais subestimam o número desses crimes.", "titulo_pt": "Análise: muçulmanos no reino unido enfrentam maior taxa de crimes de ódio, mas as estatísticas policiais subestimam", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 218939, "titulo": "Young Americans are losing faith in the future — and Trump", "url": "https://www.axios.com/2026/10/22/young-adults-poll-midterm-motivator-opposing-trump", "fonte_id": "axios", "data_pub": "2026-10-22T10:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Harvard Youth Poll, realizada no outono de 2026, revela que 65% dos adultos americanos abaixo dos 30 anos que pretendem votar nas eleições legislativas de próximo mês estão motivados a se opor ao presidente Trump e às suas políticas. Além disso, 77% dos respondentes desaprovam o manejo econômico do presidente, incluindo cerca da metade dos jovens republicanos, e apenas 9% acreditam que os Estados Unidos estão no caminho certo, o menor percentual na história da pesquisa.", "titulo_pt": "Jovens americanos perdem confiança no futuro e se opõem a Trump", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 217851, "titulo": "Chile envejece: ¿y quién se hará cargo?", "url": "https://www.latercera.com/opinion/noticia/chile-envejece-y-quien-se-hara-cargo/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile está envelhecendo rapidamente, com uma população mais velha e uma diminuição da força de trabalho. Isso pode criar desafios significativos para o sistema de pensões e a economia do país, já que há menos trabalhadores para financiar os benefícios para os aposentados.", "titulo_pt": "Chile envelhece: e quem se fará cargo?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 219188, "titulo": "Lai outlines climate resilience plans", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/23/2003866472", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai apresentou planos para aumentar a resiliência climática. O anúncio incluiu medidas para enfrentar os efeitos das mudanças climáticas.", "titulo_pt": "Lai detalha planos de resiliência climática", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 218874, "titulo": "Santuario Padre Hurtado busca reutilizar 70 mil litros de agua y aumentar su biodiversidad", "url": "https://www.latercera.com/sustentabilidad/noticia/santuario-padre-hurtado-busca-reutilizar-70-mil-litros-de-agua-y-aumentar-su-biodiversidad/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T14:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Santuario Padre Hurtado, em colaboração com a Fundación Circular, transformou a piscina existente em um estanque verde, incorporando sistemas de reutilização de água e espécies que promovem a biodiversidade.", "titulo_pt": "Santuário Padre Hurtado busca reutilizar 70 mil litros de água e aumentar sua biodiversidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 219013, "titulo": "96% of coral reefs 'critically endangered,' at risk of collapse in 50 years", "url": "https://www.lemonde.fr/en/environment/article/2026/10/22/96-of-coral-reefs-critically-endangered-at-risk-of-collapse-in-50-years_6761515_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Internacional para a Conservação da Natureza declarou que 96% dos recifes de corais estão em situação criticamente endêmica e podem colapsar em 50 anos devido ao aquecimento global.", "titulo_pt": "96% Dos recifes de corais 'criticamente ameaçados,' em risco de colapso em 50 anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 218597, "titulo": "Brasil reduz emissões em 6%, mas não cumpre meta climática de 2025", "url": "https://exame.com/esg/brasil-reduz-emissoes-em-6-mas-nao-cumpre-meta-climatica-de-2025/", "fonte_id": "exame", "data_pub": "2026-10-22T13:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil reduziu suas emissões em 6%, mas não atingiu a meta estabelecida para 2025. O levantamento do Observatório do Clima indica que o país lançou 2,06 bilhões de toneladas de CO₂ equivalente na atmosfera. A redução foi principalmente no uso da terra, enquanto a energia e os resíduos apresentaram aumento.", "titulo_pt": "Brasil reduz emissões, mas não cumpre meta climática de 2025", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 219172, "titulo": "Nearly all coral reefs risk collapse in 50 years: IUCN", "url": "https://www.japantimes.co.jp/environment/2026/10/22/climate-change/coral-reefs-collapse-50-years/", "fonte_id": "japan_times", "data_pub": "2026-10-22T12:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O IUCN, a autoridade mundial sobre vida selvagem em perigo, realizou sua primeira avaliação global e classificou 96% dos sistemas de corais como 'criticamente ameaçados'.", "titulo_pt": "Quase todos os recifes de corais correm risco de colapso em 50 anos, segundo IUCN", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 218863, "titulo": "Almost every shallow-water coral reef on the planet faces ecosystem collapse by 2075, UN advisors say", "url": "https://www.theguardian.com/australia-news/2026/oct/22/shallow-water-coral-reef-ecosystem-collapse-by-2075-un-advisors-say", "fonte_id": "guardian_world", "data_pub": "2026-10-22T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório das consultoras do United Nations sobre o aquecimento global indica que quase todas as ilhas de corais de águas rasas no planeta correm o risco de colapso ecológico antes de 2075. Cerca de 24% dessas ilhas de corais já estão em situação crítica em mais de 80 países.", "titulo_pt": "Pratically todas as ilhas de corais de águas rasas no planeta enfrentam risco de colapso ecológico até 2075, dizem conselheiros da ONU", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 219350, "titulo": "Experts: How are climate scientists using artificial intelligence?", "url": "https://www.carbonbrief.org/experts-how-are-climate-scientists-using-artificial-intelligence", "fonte_id": "carbon_brief", "data_pub": "2026-10-22T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial (IA) está se desenvolvendo rapidamente e está sendo cada vez mais utilizada pelos cientistas climáticos para melhor compreender o clima. Especialistas estão explorando como a IA é aplicada nesta área.", "titulo_pt": "Cientistas: como os climatologistas estão usando inteligência artificial?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 219049, "titulo": "Australia: Bystanders dive into floodwaters to save trapped driver", "url": "https://www.euronews.com/video/2026/10/22/australia-bystanders-dive-into-floodwaters-to-save-trapped-driver", "fonte_id": "euronews", "data_pub": "2026-10-22T10:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois homens mergulharam nas águas turbulentas da cheia em Queensland, Austrália, para resgatar um motorista preso em um veículo todo-terreno que estava afundando. A resgate dramática terminou com um abraço emocional.", "titulo_pt": "Austrália: testemunhas mergulham nas águas da cheia para salvar motorista preso", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 218940, "titulo": "Big Tech’s thirst for water is sparking a global resistance", "url": "https://restofworld.org/2026/ai-datacenters-water-resistance-global/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-10-22T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A construção de um grande centro de dados da Google em Visakhapatnam, na Índia, está enfrentando resistência local devido às preocupações sobre o impacto ambiental e na vida das pessoas. A empresa afirma que seu sistema de arrefecimento de gigawatts não utilizará água da região.", "titulo_pt": "A sede da big Tech por água está despertando uma resistência global", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 217742, "titulo": "Santa Catarina vistoria 1,6 mil granjas após foco de Newcastle", "url": "https://www.cnnbrasil.com.br/agro/santa-catarina-vistoria-16-mil-granjas-apos-foco-de-newcastle/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Santa Catarina está realizando vistorias em 1,6 mil granjas após a confirmação de uma doença em uma granja de perus no oeste do estado. A emergência sanitária de 60 dias foi decretada em quatro municípios do estado.", "titulo_pt": "Santa Catarina vistoria 1,6 mil granjas após foco de Newcastle", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 217841, "titulo": "Del consumo energético a los materiales: qué define hoy a un edificio verdaderamente sustentable", "url": "https://www.clarin.com/arq/construccion/consumo-energetico-materiales-define-hoy-edificio-verdaderamente-sustentable_0_3RvXmNcp90.html", "fonte_id": "clarin", "data_pub": "2026-10-22T09:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O consumo energético é um indicador importante, mas não o único a ser considerado na avaliação da sustentabilidade de um edifício. Especialistas enfatizam que a sustentabilidade de um edifício envolve mais do que apenas o uso de energia.", "titulo_pt": "Do consumo energético aos materiais: o que define hoje um edifício verdadeiramente sustentável", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 217822, "titulo": "Liberan una pitón de casi 5 metros y 67 kilos, mientras Florida revela estrategia con drones para rastrear serpientes", "url": "https://www.lanacion.com.ar/estados-unidos/florida/liberan-una-piton-de-casi-5-metros-y-67-kilos-mientras-florida-revela-estrategia-con-drones-para-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T08:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A USGS libertou uma pitão de quase 5 metros e 67 kg, enquanto a Florida testa drones para monitorar serpentes invasoras em seus humedais.", "titulo_pt": "Usgs libera pitão gigante e Florida testa drones para rastrear serpentes invasoras", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 217827, "titulo": "Un cardiólogo advierte sobre los microplásticos: por qué no conviene meter plástico en el microondas", "url": "https://www.lanacion.com.ar/sociedad/un-cardiologo-advierte-sobre-los-microplasticos-por-que-no-conviene-meter-plastico-en-el-microondas-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jorge Tartaglione, um cardiólogo, alertou sobre o uso de microplásticos ao aquecer alimentos em microondas. Ele explicou quais são os recipientes mais apropriados para esse procedimento e discutiu os produtos marcados como adequados para microondas.", "titulo_pt": "Cardiólogo avisa sobre microplásticos ao aquecer alimentos em microondas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 218196, "titulo": "Indonesians turn to eco-art as haze sparks anger and diplomatic tension", "url": "https://www.scmp.com/week-asia/health-environment/article/3371773/indonesians-turn-eco-art-haze-sparks-anger-and-diplomatic-tension", "fonte_id": "scmp", "data_pub": "2026-10-22T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonesian artistas estão utilizando a arte ecológica para chamar a atenção para as queimadas na Sumatra e Kalimantan, que estão causando estragos na floresta tropical e no patrimônio cultural do país. Uma coletiva local, Jaga Api, lançou um projeto intitulado 'Dança da Destruição Cultural' para conscientizar sobre os impactos ambientais e humanos.", "titulo_pt": "Indonésios recorrem ao artesanato ecológico devido às queimadas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 217622, "titulo": "Efeitos do El Niño derrubam mais de 290 torres de energia no Brasil desde julho", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/efeitos-do-el-nino-derrubam-mais-de-290-torres-de-energia-no-brasil-desde-julho.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 290 torres de transmissão de energia foram derrubadas no Brasil desde o fim de julho devido a eventos climáticos extremos associados ao fenômeno El Niño, de acordo com o ONS.", "titulo_pt": "Efeitos do El Niño derrubam mais de 290 torres de energia no Brasil desde julho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217832, "titulo": "Inti Bonomo, experto en Ciencias Ambientales, sobre por qué la nubosidad ayuda a comprender los efectos del Súper Niño: “Tenemos una gran capa de nubes y esto influye sobre la temperatura”", "url": "https://www.lanacion.com.ar/sociedad/inti-bonomo-experto-en-ciencias-ambientales-sobre-por-que-la-nubosidad-ayuda-a-comprender-los-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, especialista em Ciências Ambientais, explica que a persistente nubosidade está influenciando as temperaturas mais baixas de outubro. Ele prevê que esses efeitos se estenderão para os primeiros meses de 2027.", "titulo_pt": "Inti Bonomo, especialista em ciências ambientais, sobre por que a nubosidade ajuda a entender os efeitos do Súper Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 219081, "titulo": "Jerusalem Daily: Israeli soldier abusing cat goes viral", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/22/jerusalem-daily-israeli-soldier-abusing-cat-goes-viral?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-22T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vídeo mostrando um soldado israelense lançando um gato sobre uma grade se tornou viral na internet.", "titulo_pt": "Vídeo de soldado israelense jogando gato viraliza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 219441, "titulo": "IAMDDB on Israel Sharing AI Video Using Her Image Without Consent: ‘I Stand for Humanity’", "url": "https://www.rollingstone.com/music/music-news/israel-sharing-ai-video-iamddb-image-without-consent-1235645765/", "fonte_id": "rolling_stone_music", "data_pub": "2026-10-22T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cantora IAMDDB afirma não apoiar genocídio, assassinato de pessoas inocentes ou o sofrimento de mulheres, crianças e famílias. Ela expressou sua posição em relação ao uso indevido de sua imagem por Israel.", "titulo_pt": "IAMDDB sobre Israel usar vídeo com sua imagem sem consentimento: ‘eu me posiciono pela humanidade’", "veiculo": "Rolling Stone - Música", "pais": "EUA", "classe": "C"}, {"id": 218685, "titulo": "Sancionado por Trump, TPI leva o maior prêmio de direitos humanos da UE", "url": "https://www.dw.com/pt-br/sancionado-por-trump-tpi-leva-o-maior-prêmio-de-direitos-humanos-da-ue/a-79735011?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-22T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Penal Internacional, corte da ONU que julga crimes contra o direito internacional, recebeu o prêmio Sakharov do Parlamento Europeu por seu trabalho em prol da justiça e da democracia.", "titulo_pt": "TPI leva o maior prêmio de direitos humanos da UE", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 219342, "titulo": "Statement by UNICEF Regional Director for the Middle East and North Africa, Edouard Beigbeder, on the ongoing killings of children across the Gaza Strip", "url": "https://www.unicef.org/press-releases/statement-unicef-regional-director-middle-east-and-north-africa-edouard-beigbeder-7", "fonte_id": "unicef", "data_pub": "2026-10-22T14:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diretor regional do UNICEF para o Oriente Médio e Norte da África, Edouard Beigbeder, emitiu uma declaração sobre os assassinatos contínuos de crianças na Faixa de Gaza. O diretor destaca a preocupação do UNICEF com a situação dos menores nessas regiões.", "titulo_pt": "Declaração do diretor Regional do UNICEF para o oriente médio e norte da áfrica sobre os assassinatos de crianças na faixa de Gaza", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 218745, "titulo": "MPT instaura inquérito para investigar empresária que constrangeu funcionárias por fim da escala 6×1", "url": "https://www.jota.info/trabalho/mpt-instaura-inquerito-para-investigar-empresaria-que-constrangeu-funcionarias-por-fim-da-escala-6x1", "fonte_id": "jota", "data_pub": "2026-10-22T14:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa instaurou um inquérito para investigar uma empresária que constrangeu funcionárias por fim da escala 6×1. A empregadora ameaçou reduzir o salário das funcionárias caso a escala 5x2 fosse implementada.", "titulo_pt": "MPT instaura inquérito para investigar empresária que constrangeu funcionárias por fim da escala 6×1", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 218861, "titulo": "Sexualised, violent threats: female Victorian MPs fear for their safety as they fight more than just next month’s election", "url": "https://www.theguardian.com/australia-news/2026/oct/23/victorian-mps-women-high-alert-safety-state-election-helen-haines-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Constituintes têm sido hostis a políticos, incluindo premiês, mas a suposta agressão a Helen Haines gerou preocupação entre as MPs, especialmente entre as mulheres. Georgie Purcell, uma deputada do estado, compartilhou um apoio público a Haines após a suposta agressão.", "titulo_pt": "Agressão: deputadas victorianas se preocupam com segurança após suposto ataque a colega", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 218931, "titulo": "Catástrofe en el Fondo E: siguiendo a la manada hacia el precipicio", "url": "https://www.ciperchile.cl/2026/10/22/catastrofe-en-el-fondo-e-siguiendo-a-la-manada-hacia-el-precipicio/?utm_source=rss&utm_medium=rss&utm_campaign=catastrofe-en-el-fondo-e-siguiendo-a-la-manada-hacia-el-precipicio", "fonte_id": "ciper_chile", "data_pub": "2026-10-22T11:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título original em espanhol se refere a uma situação crítica envolvendo o Fundo E, sugerindo que múltiplas entidades estão seguindo uma direção que pode levar a uma catástrofe. O texto original foi publicado no site CIPER Chile.", "titulo_pt": "Catástrofe no fundo E: seguindo a multidão para o precipício", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 219011, "titulo": "EU awards International Criminal Court top human rights prize", "url": "https://www.lemonde.fr/en/international/article/2026/10/22/eu-awards-international-criminal-court-top-human-rights-prize_6761484_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T10:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Sakharov da União Europeia foi concedido ao Tribunal Penal Internacional por seus esforços em promover direitos humanos, apesar das sanções dos Estados Unidos contra o tribunal e seus juízes.", "titulo_pt": "Ue concede prêmio sakharov ao tribunal penal internacional", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 219225, "titulo": "Hong Kong student gets 10 years for sexually assaulting 4 underage girls", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3371798/hong-kong-student-gets-10-years-sexually-assaulting-4-underage-girls", "fonte_id": "scmp", "data_pub": "2026-10-22T10:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante universitário de Hong Kong foi condenado a 10 anos de prisão por estuprar pelo menos quatro meninas menores de idade. O juiz Andrew Chan Hing-wai o descreveu como um 'indivíduo muito doente' que mostrou nenhuma remorsa ou empatia para com as vítimas.", "titulo_pt": "Estudante de hong Kong é condenado a 10 anos por estuprar quatro meninas menores", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 218694, "titulo": "Meta enfrenta ação coletiva na Austrália por danos causados a menores", "url": "https://www.dw.com/pt-br/meta-enfrenta-ação-coletiva-na-austrália-por-danos-causados-a-menores/a-79729544?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-22T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ações coletivas foram apresentadas na Austrália contra o Meta (anteriormente Facebook), acusando as plataformas Facebook e Instagram de causar dependência e exposição a conteúdo prejudicial a menores. A ação visa buscar indenização para os jovens usuários.", "titulo_pt": "Meta enfrenta ação coletiva na Austrália por danos causados a menores", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 218115, "titulo": "US universities are failing to protect victims of sexual assault", "url": "https://www.aljazeera.com/opinions/2026/10/22/us-universities-are-failing-to-protect-victims-of-sexual-assault?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-22T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O caso Cornell ilustra como a burocracia universitária desincentiva denúncias e protege as instituições.", "titulo_pt": "Estudantes de universidades nos EUA estão sendo inadequadamente protegidos em casos de assédio sexual", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 218927, "titulo": "Censorship in Pakistan Goes From ‘Pleasant’ to ‘Unpleasant’", "url": "https://thediplomat.com/2026/10/censorship-in-pakistan-goes-from-pleasant-to-unpleasant/", "fonte_id": "the_diplomat", "data_pub": "2026-10-22T06:14:00Z", "idioma": "en", "provavel_dup let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const d = D.destaque;

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>

      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
