<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "23/10/2026 15:21", "stats": {"noticias_novas": 983, "resumos_gerados": 255}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Tribunal Superior Eleitoral (TSE) impôs restrições a canais de comunicação durante o segundo turno das eleições, afetando principalmente o 'Exército do Lula' e outros grupos. O ministro Floriano de Azevedo Marques negou uma liminar que poderia resultar na indisponibilização do canal de WhatsApp 'Exército do Lula', atendendo a uma solicitação da campanha do PT. Em outro caso, o TSE negou uma ordem para retirar canais do WhatsApp, criticando 'ilusões' feitas por Janones. Paralelamente, pesquisas mostram Lula com 50,5% dos votos válidos, contra 49,5% de Flávio Bolsonaro, com a diferença diminuindo de 2,4 pontos percentuais para 1 ponto percentual em apenas uma semana. O próximo governo terá de definir rumos em comércio, energia e tecnologia, com decisões cruciais nos próximos quatro anos para criar um ambiente confiável para investimentos de longo prazo no país.", "mundo": "Os Premios Princesa de Asturias em 2026 foram celebrados com a princesa Leonor destacando a esperança diante do caos de desencanto, desigualdade e extremismo enfrentados pela juventude. O primeiro-ministro de Israel, Benjamin Netanyahu, ameaçou uma ofensiva agressiva após um ataque que resultou em dois soldados mortos e três feridos no Território Ocidental. A Casa Branca anunciou que a primeira-dama dos Estados Unidos, Melania Trump, conseguiu um cessar-fogo local entre Rússia e Ucrânia para permitir a entrada de ajuda humanitária. Diante das crescentes tensões, o presidente dos Estados Unidos, Donald Trump, sugeriu que pode se candidatar a um terceiro mandato em 2028, apesar do limite constitucional. A tensão também aumentou no Território Ocidental, com cinco israelenses feridos e dois palestinos mortos em um ataque. Além disso, o Parlamento da Grécia aprovou uma lei proibindo o uso de redes sociais por menores de 15 anos, enquanto o chanceler da Alemanha, Friedrich Merz, visitará a Coreia do Sul na próxima semana para uma cúpula com o presidente sul-coreano Lee Jae Myung.\n\nA geopolítica global enfrenta diversos desafios e tensões em diferentes partes do mundo. Na Ásia, a China está intensificando suas operações militares, utilizando barcos de milícias para aumentar a preparação para a guerra, enquanto o exército planeja reestruturar suas operações para enfatizar tecnologia e poder de fogo. Em contraste, a Rússia e a Ucrânia chegaram a um acordo de cessar-fogo temporário na cidade de Oleshky, permitindo a entrega de ajuda humanitária e a evacuação de civis, visando aliviar a crise humanitária na região. Além disso, o Irã tem buscado contornar as sanções dos EUA através da dependência de ferrovias chinesas, enquanto Israel e a Ucrânia intensificam suas operações militares, com ataques a instalações de tecnologia da informação do Irã e ações de guerra energética na Ucrânia. A geopolítica também se reflete nas relações internacionais, com o secretário de Estado dos EUA realizando uma visita inesperada à Índia, focando em negócios e infraestrutura em vez de encontros políticos tradicionais.", "economia": "A economia global enfrenta diversos desafios, com destaque para as dificuldades enfrentadas pelo mercado de luxo, como relatado pela Gucci, que registrou impactos negativos no terceiro trimestre. O Congresso dos Estados Unidos discute mudanças nas políticas e negócios das gigantes tecnológicas, enquanto a The Economist critica a falta de vontade política para reformas no Brasil. O governo brasileiro deve manter os subsídios aos combustíveis, conforme anunciado pelo ministro Durigan, em face do aumento do preço do petróleo. A Copersucar firmou um acordo para fornecer etanol a navios no porto de Santos, refletindo a busca por soluções de descarbonização no setor marítimo. A Embraer atingiu um recorde de US$ 35,7 bilhões em pedidos no terceiro trimestre, enquanto a Samarco bateu recorde de produção de minério de ferro no mesmo período. A prévia da inflação oficial do Brasil caiu pela metade em outubro, encerrando o mês em 0,32%. A MMG ofereceu concessões à UE para aliviar preocupações sobre sua oferta de aquisição de negócios de níquel da Anglo American no Brasil.", "tecnologia": "A American Express está reduzindo 5% de sua força de trabalho para se preparar para a chegada da inteligência artificial, incurrindo um encargo de reestruturação de US$ 336 milhões no terceiro trimestre. Em outras notícias, a Intel obteve uma isenção após preocupações de que uma proibição americana sobre robôs fabricados no exterior poderia afetar suas fábricas de semicondutores. Ainda sobre inteligência artificial, a Google está implementando uma iniciativa nos Estados Unidos em parceria com a empresa Voltus, incentivando o uso mais eficiente de energia elétrica para alimentar seus data centers de inteligência artificial. A medida se baseia no modelo de 'usina elétrica virtual'. Em um evento recente, a Administração Nacional de Segurança Rodoviária dos EUA propôs mudanças para um novo padrão de segurança veicular, especificamente para que os robocarros usem luzes cianes para indicar que não há motorista à frente. Além disso, a Valve Corporation revelou acidentalmente o nome codinome 'HLX' relacionado ao Half-Life durante uma conferência, levantando preocupações sobre a segurança da informação da empresa.", "ciencia": "A NASA está colaborando com o Departamento de Energia da Virgínia para promover a segurança energética a longo prazo no estado, fornecendo dados solares, meteorológicos e de risco climático futuro para modelagem e planejamento de sistemas energéticos. Em um avanço significativo para o câncer, os resultados das vacinas da Moderna e Merck representam um resultado clínico importante para pacientes com melanoma que passaram por cirurgia, segundo especialistas em melanoma. Um tratamento contra a esclerose múltipla desenvolvido pela Novartis reduziu pela terça parte as taxas de recidivas em comparação com um tratamento padrão, conforme mostraram os ensaios clínicos. Além disso, a água-viva Turritopsis dohrnii, conhecida por sua resistência à morte, pode inspirar novos tratamentos para doenças relacionadas ao envelhecimento. Estudos também abordam a longevidade humana, a exposição a fogões a gás e sua influência nos sintomas da asma, e a importância do cérebro na gestão da incerteza e na resiliência nesse processo.", "cultura": "O evento mais importante dos artigos é a morte do renomado autor japonês Ryu Murakami, aos 74 anos. Murakami, conhecido como o 'menino terrível' da literatura contemporânea japonesa, explorou temas como sexo, drogas, alienação e violência no Japão pós-guerra em mais de 40 obras subversivas, incluindo 'Audition', que se tornou um filme de terror independente importante. Além disso, o filme 'Tudo Pode Ser Visto', dirigido por Nathan Fielder e Lance Oppenheim, encerrará a 50ª edição da Mostra Internacional de Cinema de São Paulo, enquanto o diretor americano James Gray esteve na capital paulista para exibir 'Tigre de Papel', que está concorrendo ao Oscar de 2027. Também foi destacado o lançamento do novo romance de Bernardo Carvalho, 'Xilocosmos', que explora a memória e a identidade, e a venda do quadro 'Íris' de Claude Monet, que foi vendido por 50 milhões de euros, se tornando a obra de arte mais cara já vendida na França.", "sociedade": "Um oficial da Polícia Militar está sendo investigado por supostos casos de abuso. Paralelamente, o Ministério Público do Trabalho (MPT) em Itabaiana, Sergipe, investiga uma empresa que teria obrigado funcionários a usar adereços políticos, ameaçando cortar o salário de quem não fizesse propaganda para seu candidato. Em outro caso, uma idosa de 78 anos foi presa após desafiar e impedir a passagem de um robô entregador em defesa dos empregos humanos. A Anvisa endureceu as regras para o uso de polilaminina após registrar nove mortes relacionadas ao medicamento. Kethiny Evinlyn, de 24 anos, faleceu após uma cirurgia maxilar, com a família denunciando um possível erro médico. Um adolescente foi flagrado com ferimentos no braço e barriga, suspeito de planejar possíveis ataques a policiais militares e agentes de ensino. Representantes de cidades da América Latina se reuniram na China para discutir energia limpa, agricultura e cooperação local, enquanto um deputado solicitou proteção para a parlamentar Roberta Luchsinger, que está sendo ameaçada por comentários sobre Lula. A mensalidade para casas de repouso varia dependendo do local e das facilidades oferecidas, com famílias podendo dividir a despesa de diferentes maneiras. O excesso de proteína pode sobrecarregar o organismo e comprometer a saúde, incluindo a pele, segundo especialistas. A diretriz criou uma nova categoria para risco cardiovascular, mas o SUS mantém seu protocolo de 2019 sem alterações. O Japão pediu mais apoio para reduzir os riscos de autolesão entre jovens. Um constante de Hong Kong faleceu aos 52 anos, 21 anos após ser deixado paralítico em um ataque durante o serviço.", "meio_ambiente": "No verão de 2026, a Europa enfrentou um verão extremamente quente que resultou em mais de 50 mil mortes, conforme uma análise. Paralelamente, eventos climáticos extremos, como o temporal Austen na França e no Reino Unido, causaram danos significativos, incluindo árvores arrancadas e estradas bloqueadas. No Brasil, houve uma redução de 6% nas emissões de gases de efeito estufa em 2025, principalmente devido ao controle do desmatamento na Amazônia e no Cerrado. Em contraste, a Coreia do Sul descobriu que os palitos de papel podem ter um impacto ambiental maior do que os de plástico, reavivando a discussão sobre a eficácia das alternativas ecológicas. Além disso, um vazamento de petróleo nos Emirados Árabes fechou praias e agravou a situação ambiental, enquanto o fogo no Amazonas persiste em 30 municípios, levando a uma investigação policial.", "direitos_humanos": "Um suspeito de islamofobia matou uma pessoa e feriu gravemente outras cinco, incluindo uma menina de 12 anos, em um ataque na França, conforme relatado pela Al Jazeera. A governadora de Nova York, Kathy Hochul, questiona o ICE sobre a detenção de um funcionário do SUNY que possui uma autorização de trabalho válida até 2029 e tem uma solicitação de asilo pendente. Em Madba, no Vale do Cisjordânia, os moradores relatam que os bloqueios israelenses interrompem o acesso a hospitais, escolas e oliveiras. No Chile, o governo anterior se opôs em tribunais a redução de condenações de agressores sexuais de crianças, argumentando contra a diminuição das penas. No Amazonas, lideranças indígenas temem avanços que possam levar ao retorno do garimpo ilegal e enfraquecimento das políticas de proteção territorial. Em Albania, mais de 200 menores foram detidos ou acusados durante protestos, com relatos de violência policial e violações das medidas de proteção destinadas a crianças. Senadores chilenos estão trabalhando em reformas para evitar que a redução de penas para abusadores de menores beneficie esses criminosos, conforme anunciou o ministro de Justiça, Fernando Rabat."}, "resumo_do_dia": {"politica_nacional": [{"id": 220898, "titulo": "Ministro do TSE barra nova suspensão do canal ‘Exército do Lula’", "url": "https://g1.globo.com/politica/noticia/2026/10/23/ministro-do-tse-barra-nova-suspensao-do-canal-exercito-do-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-23T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Floriano de Azevedo Marques, do Tribunal Superior Eleitoral, concedeu uma liminar que impede a Presidência do TSE de determinar, via administrativa, uma nova suspensão ou restrição ao canal de WhatsApp 'Exército do Lula'. A decisão afeta ordens já dadas ou futuras que, se tomadas, não poderão resultar na indisponibilização ou restrição do canal.", "titulo_pt": "Ministro do TSE impede nova suspensão do canal 'Exército do Lula'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 221230, "titulo": "O que acontece se Lula e Flávio Bolsonaro empatarem no segundo turno das eleições 2026?", "url": "https://www.jota.info/eleicoes/eleicoes-2026/o-que-acontece-se-lula-e-flavio-bolsonaro-empatarem-no-segundo-turno-das-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-23T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Constituição Federal estabelece uma regra para desempatar no segundo turno das eleições, caso Lula e Flávio Bolsonaro apresentem o mesmo número de votos. A regra define como será feito o desempate nesse cenário específico.", "titulo_pt": "O que acontece se Lula e Flávio Bolsonaro empatarem no segundo turno das eleições 2026?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 220923, "titulo": "Ministro do TSE atende a campanha do PT e barra suspensão de canal 'Exército do Lula' às vésperas da eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ministro-do-tse-atende-a-campanha-do-pt-e-barra-suspensao-de-canal-exercito-do-lula-na-vespera-da-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-23T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Floriano de Azevedo Marques, do TSE, negou a suspensão do canal 'Exército do Lula', no WhatsApp, às vésperas da eleição. Esta decisão foi vista como um atendimento à campanha do presidente Luiz Inácio Lula da Silva (PT).", "titulo_pt": "Ministro do TSE nega suspensão de canal 'Exército do Lula' no último momento", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 221025, "titulo": "Cleitinho confirma presença no ato de Flávio Bolsonaro em BH neste sábado", "url": "https://www.metropoles.com/minas-gerais/cleitinho-confirma-presenca-em-ato-de-flavio-bolsonaro-em-bh-neste-sabado", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cleitinho confirmou sua presença no ato público de Flávio Bolsonaro em Belo Horizonte neste sábado. Este será o primeiro evento juntos desde o início da campanha eleitoral.", "titulo_pt": "Cleitinho confirma presença no ato de Flávio Bolsonaro em BH neste sábado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221026, "titulo": "Trump volta a mencionar reeleição e diz querer 3º mandato como presidente", "url": "https://www.metropoles.com/mundo/trump-volta-a-mencionar-reeleicao-e-diz-querer-3o-mandato-como-presidente", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Donald Trump mencionou a possibilidade de se reeleger e de buscar um terceiro mandato como presidente dos Estados Unidos. A Constituição norte-americana limita a presidência a dois mandatos, consecutivos ou não.", "titulo_pt": "Trump toca em reeleição e terceiro mandato presidencial", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221028, "titulo": "Secretário é afastado após defender prisão de eleitores do PT no MA", "url": "https://www.metropoles.com/brasil/secretario-e-afastado-apos-defender-prisao-de-eleitores-do-pt-no-ma", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um secretário foi afastado após a circulação de áudios atribuídos a ele, no qual ele defende a prisão de apoiadores do PT no Maranhão.", "titulo_pt": "Secretário é afastado após defender prisão de eleitores do PT no MA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221231, "titulo": "Sem rito definido, Senado discutirá alíquotas de referência da CBS no pós-eleições", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/sem-rito-definido-senado-discutira-aliquotas-de-referencia-da-cbs-no-pos-eleicoes", "fonte_id": "jota", "data_pub": "2026-10-23T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado discutirá as alíquotas de referência da CBS após as eleições, sem definição da comissão responsável. O Tribunal de Contas da União (TCU) precisa enviar os cálculos até o fim de outubro, mas o regimento da Casa não estabelece qual comissão analisará a resolução.", "titulo_pt": "Senado discutirá alíquotas de referência da CBS após as eleições, sem definição da comissão", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 221163, "titulo": "O número que pode definir vitória de Lula ou de Flávio Bolsonaro no 2º turno", "url": "https://www.bbc.com/portuguese/articles/c8wy9k5640xdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-23T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um cientista político destaca que a abstenção e os votos brancos e nulos têm margem limitada de influência. Serão observados o Nordeste, o Sudeste e a conversão de eleitores adversários como fatores importantes para definir o resultado do segundo turno das eleições.", "titulo_pt": "O número que pode definir vitória de Lula ou de Flávio Bolsonaro no 2º turno", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 221232, "titulo": "Sem citar ‘Exército do Lula’, TSE diz que não determinou derrubada de canal de WhatsApp", "url": "https://www.jota.info/eleicoes/eleicoes-2026/sem-citar-exercito-do-lula-tse-diz-que-nao-determinou-derrubada-de-canal-de-whatsapp", "fonte_id": "jota", "data_pub": "2026-10-23T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Tribunal Superior Eleitoral (TSE) se reuniram com plataformas de comunicação e solicitaram reforço de pessoal e tratamento isonômico no segundo turno das eleições. O TSE não determinou a derrubada de nenhum canal de WhatsApp.", "titulo_pt": "Sem determinar derrubada de canal de WhatsApp, TSE pediu reforço de pessoal e tratamento isonômico", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 220889, "titulo": "Barra do Corda afasta secretário por ameaça a eleitores do PT", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/barra-do-corda-afasta-secretario-por-ameaca-eleitores-do-pt", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-23T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Barra do Corda, Rigo Alberto Teles de Sousa, determinou o afastamento do secretário municipal de Segurança Pública, Antonio James Mota da Silva, por declarações que sugerem prisão e perseguição de eleitores e apoiadores do PT. Essa decisão foi tomada até o fim das eleições, conforme portaria publicada.", "titulo_pt": "Barra do Corda destitui secretário por ameaças a eleitores do PT", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 220953, "titulo": "Justiça proíbe Guaraná Poty de fazer propaganda política a funcionários", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/justica-proibe-guarana-poty-de-fazer-propaganda-politica-a-funcionarios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trabalho de São José do Rio Preto proibiu a Bebidas Poty de praticar assédio eleitoral contra seus funcionários e de usar canais corporativos para divulgar propaganda político-eleitoral ou orientar o voto dos trabalhadores.", "titulo_pt": "Justiça proíbe Guaraná Poty de fazer propaganda política a funcionários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 221037, "titulo": "Justiça manda X apagar publicação de Erika Hilton sobre vice de Flávio", "url": "https://www.metropoles.com/colunas/igor-gadelha/justica-manda-x-retirar-publicacao-de-erika-hilton-sobre-vice-de-flavio", "fonte_id": "metropoles", "data_pub": "2026-10-23T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça de Alagoas ordenou que X remova uma publicação de Erika Hilton que faz acusações sem provas contra Alfredo Gaspar, vice de Flávio Bolsonaro.", "titulo_pt": "Justiça de alagoas determina que X retire publicação de Erika Hilton sobre acusações contra alfredo gaspar", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220899, "titulo": "Gilmar cita imunidade e rejeita queixa de vice de Flávio contra parlamentares que mencionaram acusação de estupro", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/23/gilmar-cita-imunidade-parlamentar-e-rejeita-queixa-de-vice-de-flavio-contra-congressistas-que-mencionaram-acusacao-de-estupro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-23T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do Supremo Tribunal Federal, rejeitou uma queixa-crime contra o deputado Lindbergh Farias e a senadora Soraya Thronicke apresentada pelo candidato a vice-presidente Alfredo Gaspar. A decisão citou a imunidade parlamentar e a falta de justa causa para a investigação.", "titulo_pt": "Gilmar rejeita queixa-crime de vice de Flávio contra parlamentares", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 220943, "titulo": "Amigo de Flávio Bolsonaro tenta direito de resposta no JN antes das eleições, mas Justiça nega", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/amigo-de-flavio-bolsonaro-tenta-direito-de-resposta-no-jn-antes-das-eleicoes-mas-justica-nega.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-23T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Willer Tomaz, advogado amigo de Flávio Bolsonaro, processou a Globo pedindo direito de resposta e indenização por danos morais no Jornal Nacional.", "titulo_pt": "Advogado amigo de Flávio Bolsonaro tenta direito de resposta no JN antes das eleições, mas Justiça nega", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 221039, "titulo": "TSE nega ordem para retirar canais do WhatsApp e critica “ilações”", "url": "https://www.metropoles.com/colunas/manoela-alcantara/tse-nega-ordem-para-retirar-canais-do-whatsapp-e-critica-ilacoes", "fonte_id": "metropoles", "data_pub": "2026-10-23T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) negou uma ordem para retirar canais do WhatsApp e criticou as ‘ilações’ feitas por Janones. Janones afirmou que o ‘Exército do Lula’ sairia do ar nesta sexta-feira, próximo a um debate presidencial.", "titulo_pt": "TSE nega ordem para retirar canais do WhatsApp e critica ‘ilações’", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220900, "titulo": "TSE nega ter mandado tirar canais políticos no WhatsApp do ar e pede isonomia nas plataformas", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/23/tse-nega-ter-determinado-retirar-canais-de-whatsapp-do-ar-e-pede-isonomia-nas-plataformas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-23T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) negou ter determinado a retirada de canais políticos do WhatsApp. O tribunal solicitou isonomia nas plataformas digitais para as campanhas do segundo turno das eleições.", "titulo_pt": "TSE nega ter mandado tirar canais políticos do WhatsApp e pede isonomia nas plataformas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 221645, "titulo": "Military to restructure on tech, firepower: source", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/24/2003866522", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército planeja reestruturar suas operações para enfatizar tecnologia e poder de fogo. Segundo a fonte, essas mudanças visam melhorar a capacidade tecnológica e de combate do exército.", "titulo_pt": "Exército vai reestruturar-se com foco em tecnologia e poder de fogo: fonte", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 221649, "titulo": "China using militia boats to ramp up war readiness", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/24/2003866530", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está usando barcos de milícias para aumentar as disposições para a guerra. Essa ação envolve a mobilização de recursos não-tradicionais para a preparação militar.", "titulo_pt": "China usando barcos de milícias para intensificar preparação para guerra", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 221650, "titulo": "Beijing targeting family of ‘separatists’: US report", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/24/2003866531", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório dos Estados Unidos afirma que Beijing está alvo da família de indivíduos considerados separatistas.", "titulo_pt": "Beijing alvo da família de 'separatistas', diz rela so-il-2027_f9c14860-166a-46b7-9776-4013b3eeb939.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-23T17:50:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Franceschini, Orlando e Speranza lançaram comitês para a alternativa em 2027. O documento de Montepulciano menciona a iniciativa de avançar um caminho de envolvimento e mobilização territorial.", "titulo_pt": "Franceschini-orlando-speranza lançam comitês para a alternativa em 2027", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 221591, "titulo": "Mantovano, vigilare su normative Ue, a rischio elusione le restrizioni su cannabis", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/23/mantovano-vigilare-su-normative-ue-a-rischio-elusione-le-restrizioni-su-cannabis_f9696018-2a62-44b3-a8f4-d349323ed5aa.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-23T17:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Existe preocupação com algumas iniciativas que podem permitir o uso ilegal de medidas regulatórias sobre o cannabis, colocando em risco o cumprimento das restrições estabelecidas pela União Europeia. O objetivo é evitar que filiais industriais sejam utilizadas para fins ilícitos.", "titulo_pt": "Mantova, vigiar as normativas da Ue, em risco a evasão das restrições sobre cannabis", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 221107, "titulo": "Israel inicia demolições em cidade da Cisjordânia após morte de soldados", "url": "https://www.cnnbrasil.com.br/internacional/israel-inicia-demolicoes-em-cidade-da-cisjordania-apos-morte-de-soldados/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois militares israelenses morreram e três ficaram feridos em um ataque a tiros na cidade de Hebron, Cisjordânia. Em retaliação, Israel iniciou demolições em Hebron, quatro dias antes das eleições legislativas israelenses.", "titulo_pt": "Israel inicia demolições em hebron após mortes de soldados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221342, "titulo": "US and Israel are warned against launching fresh strikes on Iran", "url": "https://www.theguardian.com/world/2026/oct/23/european-middle-eastern-ministers-summit-iran-us-israel", "fonte_id": "guardian_world", "data_pub": "2026-10-23T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros de vários países europeus e do Oriente Médio pediram aos EUA e Israel para não realizar novos ataques contra a Irã, afirmando que isso poderia exacerbar a crise e aumentar os preços do petróleo. Isso representa um desafio às intenções dos EUA e Israel de relançar operações militares contra o país enquanto as negociações sobre o programa nuclear iraniano estão em standstill.", "titulo_pt": "EUA e Israel são advertidos contra novas operações militares contra a Irã", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 221582, "titulo": "Netanyahu threatens ‘aggressive’ offensive after West Bank shooting", "url": "https://www.ft.com/content/e03e092b-c465-478a-b01e-bf21406981cd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-23T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois soldados israelenses foram mortos e três ficaram feridos em um ataque armado por palestinos, o que aumentou a tensão antes das eleições israelenses na próxima semana. O primeiro-ministro Benjamin Netanyahu ameaçou uma 'ofensiva agressiva' em resposta ao incidente.", "titulo_pt": "Netanyahu ameaça 'ofensiva agressiva' após ataque no vale do jordão", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 221555, "titulo": "Brazil’s right has already changed the balance of power", "url": "https://www.aljazeera.com/opinions/2026/10/23/brazils-right-has-already-changed-the-balance-of-power?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-23T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido do Bolsonaro fortaleceu sua posição no Congresso, representando uma significativa ameaça a uma eventual presidência de Lula.", "titulo_pt": "Direita brasileira já alterou o equilíbrio de poder", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 221071, "titulo": "Rússia e Ucrânia chegam a acordo de cessar-fogo temporário na cidade de Oleshky", "url": "https://www.brasildefato.com.br/2026/10/23/russia-e-ucrania-chegam-a-acordo-de-cessar-fogo-temporario-na-cidade-de-oleshky/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-23T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rússia e a Ucrânia chegaram a um acordo de cessar-fogo temporário na cidade de Oleshky, na região de Kherson, a partir de 29 de outubro, para permitir a entrega de ajuda humanitária e a evacuação de civis. O acordo visa aliviar a crise humanitária na cidade, onde moradores enfrentam dificuldades.", "titulo_pt": "Rússia e Ucrânia chegam a acordo de cessar-fogo temporário em Oleshky", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 221343, "titulo": "Opposition deepfake video sparks outrage in Spain ahead of election", "url": "https://www.theguardian.com/world/2026/oct/23/opposition-deepfake-video-spain-election", "fonte_id": "guardian_world", "data_pub": "2026-10-23T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vídeo de deepfake mostrando figuras ligadas ao partido socialista de Pedro Sánchez admitindo cometimentos de erros gerou indignação na Espanha, perto das eleições gerais. A campanha política do principal partido de oposição, o PP, utilizou a tecnologia para manipular imagens de pessoas associadas ao governo.", "titulo_pt": "Vídeo de deepfake da oposição causa indignação na Espanha antes das eleições", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 221448, "titulo": "DOJ sues to block Alaska election results if GOP incumbent loses", "url": "https://www.axios.com/2026/10/23/trump-administration-sues-alaska-dan-sullivan", "fonte_id": "axios", "data_pub": "2026-10-23T16:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump processou o estado de Alasca para impedir a certificação dos resultados das eleições se o senador republicano Dan Sullivan perder. A disputa envolve votação por classificação de segunda opção, o que pode causar confusão entre os eleitores com nomes semelhantes entre candidatos.", "titulo_pt": "Governo trump processa alasca para bloquear resultados das eleições se dan sullivan perder", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 221628, "titulo": "Melania Trump secures localized Russia-Ukraine ceasefire for humanitarian aid: White House", "url": "https://en.yna.co.kr/view/AEN20261024000300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-23T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira-dama dos Estados Unidos, Melania Trump, conseguiu garantir um cessar-fogo localizado entre Rússia e Ucrânia para permitir a entrada de ajuda humanitária. Essa informação foi divulgada pela Casa Branca.", "titulo_pt": "Melania Trump garante cessar-fogo local para ajuda humanitária entre Rússia e Ucrânia: casa branca", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 221629, "titulo": "U.S. Treasury Department proposes expanding tech investment restrictions to N. Korea", "url": "https://en.yna.co.kr/view/AEN20261024000200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-23T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento do Tesouro dos Estados Unidos propôs expandir as restrições de investimento em tecnologia para incluir a Coreia do Norte.", "titulo_pt": "Departamento do tesouro dos EUA propõe expandir restrições de investimento em tecnologia para a Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 221106, "titulo": "Dona da Gucci vê vendas impactadas por mercado de luxo fraco no 3º tri", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/dona-da-gucci-ve-vendas-impactadas-por-mercado-de-luxo-fraco-no-3o-tri/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas da Gucci, uma das principais marcas do Grupo Kering, foram afetadas pelo fraco desempenho do mercado de luxo no terceiro trimestre. O grupo está buscando reestruturar suas principais marcas para enfrentar este momento desafiador no mercado global de itens de alto valor.", "titulo_pt": "Dono da Gucci vê vendas impactadas por mercado de luxo fraco no 3º tri", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 220952, "titulo": "Reação judicial contra big techs força mudanças em produtos e negócios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/10/reacao-judicial-contra-big-techs-forca-mudancas-em-produtos-e-negocios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As grandes empresas de tecnologia expandiram-se rapidamente durante décadas, enquanto o Congresso dos Estados Unidos tentava acompanhar as consequências das operações dessas empresas. As ações judiciais contra essas empresas estão forçando mudanças em seus produtos e negócios.", "titulo_pt": "Reação judicial contra gigantes da tecnologia impulsiona mudanças nos produtos e negócios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 221373, "titulo": "The Armageddon Economy", "url": "https://www.theatlantic.com/podcasts/2026/10/zealousness-new-tech-right/689124/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-23T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes tecnológicos têm planos de escape. No entanto, a mesma atenção não é dedicada a todos os outros.", "titulo_pt": "A economia do apocalipse", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 221097, "titulo": "Governo deve manter subsídios a combustíveis com alta do petróleo, diz Durigan", "url": "https://www.infomoney.com.br/politica/governo-deve-manter-subsidios-a-combustiveis-com-alta-do-petroleo-diz-durigan/", "fonte_id": "infomoney", "data_pub": "2026-10-23T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Durigan antecipou que, se reeleito, o governo manterá os subsídios aos combustíveis para compensar o aumento dos preços devido ao petróleo.", "titulo_pt": "Governo deve manter subsídios a combustíveis com alta do petróleo, diz Durigan", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 220954, "titulo": "Nem Lula, nem Flávio Bolsonaro 'têm estômago' para reforma que Brasil precisa, diz Economist", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/nem-lula-nem-flavio-bolsonaro-tem-estomago-para-reforma-que-brasil-precisa-diz-economist.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A revista britânica The Economist afirmou que a economia do Brasil precisa de uma reforma séria, mas que nem o presidente Luiz Inácio Lula da Silva, nem o senador Flávio Bolsonaro têm disposição para implementá-la.", "titulo_pt": "Nem Lula, nem Flávio Bolsonaro têm 'estômago' para reforma que Brasil precisa, diz Economist", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220955, "titulo": "Casas Bahia anuncia Camille Faria para liderar negociações de recuperação judicial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/casas-bahia-anuncia-camille-faria-para-liderar-negociacoes-de-recuperacao-judicial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casas Bahia nomeou Camille Faria para liderar as negociações relacionadas à recuperação judicial da empresa. Ela trabalhará em conjunto com os executivos internos e a consultoria Alvarez & Marsal.", "titulo_pt": "Casas Bahia nomeia Camille Faria para liderar negociações de recuperação judicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220956, "titulo": "Copersucar faz acordo para fornecer etanol a navios no porto de Santos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/copersucar-faz-acordo-para-fornecer-etanol-a-navios-no-porto-de-santos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Copersucar, maior comercializadora global de etanol e açúcar, firmou um acordo para fornecer etanol para abastecimento de navios no porto de Santos, o maior da América do Sul. Este acordo ocorre em um momento em que o setor marítimo busca formas de descarbonização.", "titulo_pt": "Copersucar acerta fornecimento de etanol para navios no porto de Santos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 221234, "titulo": "PEC da Tarifa Zero chega ao Congresso sem acordo e pode depender de nova fonte de financiamento", "url": "https://www.jota.info/legislativo/pec-da-tarifa-zero-chega-ao-congresso-sem-acordo-e-pode-depender-de-nova-fonte-de-financiamento", "fonte_id": "jota", "data_pub": "2026-10-23T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Proposta de Emenda à Constituição (PEC) da Tarifa Zero chegou ao Congresso sem um acordo entre as partes. Lideranças consideram que o corte significativo de emendas impositivas é um obstáculo para a aprovação do projeto.", "titulo_pt": "PEC da Tarifa Zero chega ao Congresso sem acordo e pode depender de nova fonte de financiamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 220958, "titulo": "Empresas do Reino Unido têm em outubro melhor mês desde fevereiro, aponta PMI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467523", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas do Reino Unido registraram seu melhor mês em termos de atividade desde fevereiro, conforme indicado por uma pesquisa divulgada nesta sexta-feira. O aumento dos novos pedidos e a recuperação da demanda relacionada à inteligência artificial contribuíram para esse resultado positivo.", "titulo_pt": "Empresas do Reino Unido registram melhor mês desde fevereiro, aponta pesquisa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220959, "titulo": "Para abrir espaço para data centers, Google pagará para reduzir consumo de energia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/para-abrir-espaco-para-data-centers-google-pagara-para-reduzir-consumo-de-energia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de tecnologia enfrentam dificuldades para encontrar energia elétrica suficiente para os novos data centers necessários para a inteligência artificial. Como alternativa, elas têm explorado opções como reativar usinas nucleares antigas e instalar motores a gás fora da rede elétrica.", "titulo_pt": "Para abrir espaço para data centers, empresas de tecnologia buscam alternativas de energia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220962, "titulo": "MMG diz que ofereceu concessões à UE por aval a acordo com Anglo American no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/mmg-diz-que-ofereceu-concessoes-a-ue-por-aval-a-acordo-com-anglo-american-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A MMG, empresa de mineração listada na bolsa de Hong Kong, apresentou à Comissão Europeia uma proposta para aliviar preocupações sobre sua oferta de aquisição dos negócios de níquel da Anglo American no Brasil.", "titulo_pt": "MMG oferece proposta à UE para acalmar temores sobre aquisição da Anglo American no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220963, "titulo": "Samarco eleva produção em 4% no 3º trimestre e bate recorde desde retomada", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/samarco-eleva-producao-em-4-no-3o-trimestre-e-bate-recorde-desde-retomada.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Samarco, joint venture da Vale e da BHP, produziu 4,3 milhões de toneladas de pelotas e finos de minério de ferro no terceiro trimestre, uma elevação de 4% em comparação com o mesmo período de 2025 e de 10% em relação ao segundo trimestre de 2026.", "titulo_pt": "Samarco aumenta produção em 4% no 3º trimestre e atinge recorde desde retomada", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220976, "titulo": "Receita abre consulta a lote residual do Imposto de Renda", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/receita-abre-consulta-lote-residual-do-imposto-de-renda", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-23T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal abriu a consulta ao lote residual de restituição do Imposto de Renda Pessoa Física (IRPF) em 23 de outubro, contemplando 184.442 contribuintes com R$ 531,6 milhões. O pagamento está previsto para 30 de outubro.", "titulo_pt": "Receita federal abre consulta ao lote residual do Imposto de Renda", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 220964, "titulo": "Heineken recomenda diminuir quantidade de cerveja para se adaptar à 'geração Ozempic'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/heineken-recomenda-diminuir-quantidade-de-cerveja-para-se-adaptar-a-geracao-ozempic.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T14:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Heineken recomendou que estabelecimentos do Reino Unido ajustem suas práticas para atender a uma tendência crescente de uso de medicamentos para perda de peso, sob risco de perder clientes e receita. Isso representa uma reconhecida ameaça às vendas de cerveja por parte de grandes fabricantes de bebidas alcoólicas.", "titulo_pt": "Heineken sugere ajustes para se adaptar à 'geração Ozempic'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220965, "titulo": "BYD quer dobrar capacidade de fábrica no Brasil para 600 mil carros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/byd-quer-dobrar-capacidade-de-fabrica-no-brasil-para-600-mil-carros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T14:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fabricante chinesa BYD está buscando dobrar a capacidade de produção de sua fábrica no Brasil para 600 mil veículos ao mesmo tempo em que finaliza as obras e testes em seus galpões de estamparia, soldagem e pintura.", "titulo_pt": "BYD pretende dobrar capacidade de produção na fábrica brasileira para 600 mil carros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220966, "titulo": "Mercado de canetas emagrecedoras pode chegar a US$ 22 bi em 2035", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/mercado-de-canetas-emagrecedoras-pode-chegar-a-us-22-bi-em-2035.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T13:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado combinado de canetas emagrecedoras para perda de peso na China, Índia e Brasil pode crescer para US$ 22 bilhões até 2035, de acordo com estimativas do J.P. Morgan. O crescimento está impulsionado pela maior acessibilidade financeira e pelo aumento do acesso, atingindo populações ainda pouco exploradas.", "titulo_pt": "Mercado de canetas emagrecedoras pode chegar a US$ 22 bi em 2035", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 221658, "titulo": "NTU opens chip facilities to university researchers", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/24/2003866539", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NTU abriu suas instalações de chips para pesquisadores universitários. O objetivo é proporcionar acesso a recursos tecnológicos avançados para pesquisas em microeletrônica.", "titulo_pt": "NTU abre instalações de chips para pesquisadores universitários", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 221688, "titulo": "Elon Musk’s dangerous grip on outer space", "url": "https://www.theverge.com/science/1017443/spacex-starlink-ukraine-elon-musk-monopoly", "fonte_id": "the_verge", "data_pub": "2026-10-23T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A versão do Starlink utilizada pela força aérea ucraniana, chamada Starshield, teve seu acesso limitado para evitar problemas com interceptores que não funcionavam adequadamente a altas velocidades, facilitando os ataques russos à infraestrutura energética ucraniana.", "titulo_pt": "Domínio perigoso de Musk no espaço exterior", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 221673, "titulo": "Crows can evaluate visual info twice as fast as mammals", "url": "https://arstechnica.com/science/2026/10/crows-can-evaluate-visual-info-twice-as-fast-as-mammals/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pombos podem avaliar informações visuais duas vezes mais rápido que mamíferos. Seu sistema nervoso compacto parece auxiliar na execução de tarefas rapidamente.", "titulo_pt": "Pombos podem avaliar informações visuais duas vezes mais rápido que mamíferos", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 221499, "titulo": "American Express is cutting 5% of its workforce to 'prepare for AI'", "url": "https://www.cnbc.com/2026/10/23/american-express-job-cuts.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-23T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A American Express está cortando 5% de sua força de trabalho para se preparar para a chegada da inteligência artificial. A empresa está incurring um encargo de reestruturação de US$ 336 milhões no terceiro trimestre.", "titulo_pt": "American Express corta 5% do seu quadro para se preparar para a inteligência artificial", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 221674, "titulo": "Intel gets waiver after worries fuzzy US ban on foreign-made robots may hit fabs", "url": "https://arstechnica.com/ai/2026/10/intel-gets-waiver-after-worries-fuzzy-us-ban-on-foreign-made-robots-may-hit-fabs/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Intel obteve uma isenção após preocupações de que uma proibição americana sobre robôs fabricados no exterior poderia afetar as fábricas de semicondutores. A empresa afirma que robôs fabricados no exterior são essenciais para a produção de chips nos EUA.", "titulo_pt": "Intel obtém isenção após preocupações de que banimento americano sobre robôs fabricados no exterior pode afetar fábricas de chips", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 221004, "titulo": "Google vai pagar quem usar menos energia elétrica para alimentar data centers de IA", "url": "https://veja.abril.com.br/tecnologia/google-vai-pagar-quem-usar-menos-energia-eletrica-para-alimentar-data-centers-de-ia/", "fonte_id": "veja", "data_pub": "2026-10-23T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Google está implementando uma iniciativa nos Estados Unidos em parceria com a empresa Voltus, incentivando o uso mais eficiente de energia elétrica para alimentar seus data centers de inteligência artificial. O programa se baseia no modelo de 'usina elétrica virtual'.", "titulo_pt": "Google vai pagar quem usar menos energia elétrica para alimentar data centers de IA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221675, "titulo": "RFK Jr.’s vaccine injury clinic could damage NIH hospital, board warns", "url": "https://arstechnica.com/health/2026/10/rfk-jr-s-vaccine-injury-clinic-could-damage-nih-hospital-board-warns/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselho de um hospital afirma que uma clínica de danos a vacinas do filho de RFK Jr. pode prejudicar o hospital. O presidente do conselho, Jack Leslie, salientou que a confiança é difícil de construir e fácil de perder.", "titulo_pt": "Clínica de danos a vacinas do filho de RFK Jr. Pode prejudicar hospital, avisa conselho", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 221496, "titulo": "AI's 'Black October': Critical PHP flaws set off global security scramble", "url": "https://www.cnbc.com/2026/10/23/php-vulnerabilities-ai-cybersecurity.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-23T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Governos e empresas ao redor do mundo estão se esforçando para conter os efeitos após a divulgação de falhas críticas no PHP. Essas vulnerabilidades podem levar a um escrutínio de segurança global.", "titulo_pt": "Ai's 'outubro negro': falhas críticas no PHP causam corrida pela segurança global", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 221690, "titulo": "Now Google says it might use your Gmail and Google Photos data to target ads", "url": "https://www.theverge.com/tech/1017600/google-personal-intelligence-privacy-policy-ads-update", "fonte_id": "the_verge", "data_pub": "2026-10-23T16:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google atualizou sua política de privacidade, permitindo que a empresa possa usar os dados do Gmail e Google Fotos para alvos publicitários se você estiver utilizando recursos de inteligência artificial personalizados. Anteriormente, a empresa prometia não usar esses dados para publicidade personalizada.", "titulo_pt": "Agora, Google pode usar seus dados do Gmail e Google fotos para publicidade alvo", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 221676, "titulo": "Knicks sent employees fake offer of championship rings in phishing test: Report", "url": "https://arstechnica.com/tech-policy/2026/10/knicks-sent-employees-fake-offer-of-championship-rings-in-phishing-test-report/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa dos Knicks realizou um teste de phishing enviando ofertas falsas de anéis de campeonato aos funcionários. Este tipo de teste corporativo é comum, mas este foi particularmente cruel.", "titulo_pt": "Knicks env ude/medicamento-inedito-para-doenca-que-causa-falta-de-ar-e-cansaco-chega-ao-pais-apos-uma-decada-sem-inovacoes/", "fonte_id": "veja", "data_pub": "2026-10-23T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um medicamento inédito para tratamento de fibrose pulmonar, uma doença que causa falta de ar e cansaço, foi aprovado para uso no país após uma década sem novas inovações. O medicamento será indicado para pessoas com esta condição e sua disponibilidade e preço ainda não foram detalhados.", "titulo_pt": "Novo medicamento para fibrose pulmonar chega após décadas sem inovações", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221003, "titulo": "Natura testa ingrediente de andiroba para combater envelhecimento da pele", "url": "https://veja.abril.com.br/economia/natura-testa-ingrediente-de-andiroba-para-combater-envelhecimento-da-pele/", "fonte_id": "veja", "data_pub": "2026-10-23T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Natura está testando um ingrediente feito a partir da andiroba que combate o envelhecimento da pele, mas ainda não há previsão para o lançamento de um produto.", "titulo_pt": "Natura testa ingrediente de andiroba para combater envelhecimento da pele", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221751, "titulo": "STAT+: Novartis multiple sclerosis treatment cuts rates of relapse in pivotal trials", "url": "https://www.statnews.com/2026/10/23/novartis-remibrutinib-multiple-sclerosis-trial-results/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tratamento contra a esclerose múltipla desenvolvido pela Novartis reduziu pela terça parte as taxas de recidivas em comparação com um tratamento padrão.", "titulo_pt": "Novartis apresenta tratamento para esclerose múltipla que reduz terça parte das recidivas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 221752, "titulo": "Opinion: It took me 13 years to be diagnosed with MS. Christina Applegate’s misdiagnosis doesn’t surprise me", "url": "https://www.statnews.com/2026/10/23/christina-applegate-ms-misdiagnosis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lindsay Karp, que também demorou 13 anos para ser diagnosticada com múltipla esclerose, expressou em uma opinião que sentiu a decepção de Christina Applegate como se fosse sua própria experiência. Karp escreveu que a demora no diagnóstico de Applegate não surpreendeu-a, tendo passado por algo semelhante.", "titulo_pt": "Opinião: levou-me 13 anos para ser diagnosticada com múltipla esclerose. A demora no diagnóstico de christina Applegate não surpreendeu-me", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 221753, "titulo": "Remembering STAT’s Helen Branswell", "url": "https://www.statnews.com/2026/10/23/readout-loud-podcast-remembering-helen-branswell-infectious-disease/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T15:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neste episódio do podcast 'The Readout LOUD', a equipe da STAT se reúne para homenagear a jornalista Helen Branswell, que faleceu recentemente, conversando com colegas, familiares e líderes em saúde pública sobre sua carreira.", "titulo_pt": "Lembrando a colega Helen Branswell", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 221760, "titulo": "Eating too much sugar on antibiotics could squash helpful gut bacteria", "url": "https://www.sciencenews.org/article/sugar-antibiotics-squash-gut-bacteria", "fonte_id": "science_news", "data_pub": "2026-10-23T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Consumir muito açúcar durante o uso de antibióticos pode prejudicar a diversidade das bactérias do microbioma intestinal em pessoas com câncer de sangue.", "titulo_pt": "Consumo excessivo de açúcar durante o uso de antibióticos pode prejudicar a diversidade do microbioma intestinal", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 221754, "titulo": "STAT+: Tango builds on Revolution Medicines’ pancreatic cancer success", "url": "https://www.statnews.com/2026/10/23/tango-pancreatic-cancer-star-moderna-readout-newsletter/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante a conferência ESMO, os dados promissores da combinação de tratamento para câncer pancreático do Tango foram apresentados. Além disso, foram divulgados dados detalhados sobre o vacina anticâncer da Moderna e da Merck.", "titulo_pt": "Tango expande seu sucesso no câncer pancreático na conferência esmo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220897, "titulo": "A água-viva que desafia a morte pode inspirar tratamentos para doenças ligadas ao envelhecimento", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/a-agua-viva-que-desafia-a-morte-pode-inspirar-tratamentos-para-doencas-ligadas-ao-envelhecimento.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-23T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A água-viva Turritopsis dohrnii é extremamente resistente à morte. Ela pode se transformar em seu estágio inicial após a maturidade, o que a torna quase imortal. Este fato pode inspirar novos tratamentos para doenças relacionadas ao envelhecimento.", "titulo_pt": "A água-viva quase imortal que pode inspirar tratamentos para doenças do envelhecimento", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 221610, "titulo": "Rocket debris hitting US homeland is ‘embarrassing’ for China, says astronomer", "url": "https://www.scmp.com/news/china/science/article/3371947/rocket-debris-hitting-us-homeland-embarrassing-china-says-astronomer", "fonte_id": "scmp", "data_pub": "2026-10-23T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fragmento de meteoro encontrado em um campo de milho nos Estados Unidos pode ter causado constrangimento para a China, de acordo com um astrônomo britânico que acompanha lançamentos de foguetes há mais de 30 anos. O objeto, com cerca de 3,35 metros de diâmetro, foi descoberto por um agricultor no centro-oeste do Minnesota em 14 de outubro.", "titulo_pt": "Fragmento de foguete caindo nos EUA é ‘constrangedor’ para China, diz astrônomo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 221042, "titulo": "Até quantos anos o ser humano pode viver? O que dizem os estudos", "url": "https://exame.com/ciencia/ate-quantos-anos-o-ser-humano-pode-viver-o-que-dizem-os-estudos/", "fonte_id": "exame", "data_pub": "2026-10-23T14:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os estudos sobre a longevidade humana variam em seus números, mas não definem um limite exato. O foco está na compreensão dos fatores que influenciam a expectativa de vida saudável.", "titulo_pt": "Até quantos anos o ser humano pode viver? O que dizem os estudos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221755, "titulo": "Anxiety builds over Medicaid work requirements", "url": "https://www.statnews.com/2026/10/23/medicaid-work-requirements-anxiety-morning-rounds-health-news/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz em Boston ouviu uma desafio contra exigências de trabalho para o Medicaid, enquanto diretores de Medicaid de estados se reuniram em Maryland para discutir a implementação dessas mudanças significativas.", "titulo_pt": "Ansiedade cresce em relação às exigências de trabalho para o Medicaid", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 221756, "titul
