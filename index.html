<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "19/08/2026 19:16", "stats": {"noticias_novas": 592, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O PSDB/Cidadania em Pernambuco pediu ao TRE-PE para retirar o apoio à governadora Raquel Lyra, que terá menos tempo de televisão na campanha. Os principais candidatos à presidência, incluindo Lula, Flávio Bolsonaro, Augusto Cury e Ronaldo Caiado, estão aumentando as gravações para seus programas de rádio e televisão, com Lula recebendo o maior tempo, de 5 minutos e 32 segundos. O número de candidatos LGBT+ para as eleições de 2026 bateu um recorde, com 514 nomes confirmados, representando um crescimento de 57% em relação a 2022. O presidente Lula defendeu a conclusão do submarino nuclear da Marinha, afirmando que o Brasil não pode ficar 'de cabeça baixa a vida inteira', e apresentará um plano de governo em São Paulo na próxima semana. O governo federal está reavaliando a exigência de CNPJ e emissão de nota fiscal a partir de janeiro de 2027 para milhões de nanoempreendedores, com três ministérios defendendo a revisão das regras. O Plenário do TCU derrubou uma medida cautelar que havia paralisado um contrato de área logística no porto de Santos, beneficiando um consórcio que inclui o sogro do ministro Bruno Dantas. O governador Ronaldo Caiado evitou se posicionar sobre a Proposta de Emenda à Constituição que sugere acabar com a escala 6x1, classificando-a como 'medida eleitoreira'.", "mundo": "Os principais eventos internacionais desta edição incluem a morte de cinco americanos e um oficial ecuatoriano em um acidente de helicóptero na Etiópia, o que dificultou as operações de busca e recuperação. Na Austrália, a ministra dos Assuntos Exteriores, Penny Wong, expressou indignação após a decisão do Exército de Defesa de Israel (IDF) de não investigar a morte de uma trabalhadora humanitária australiana em Gaza. O presidente dos Estados Unidos, Donald Trump, declarou que planeja se encontrar com o líder da Coreia do Norte, Kim Jong-un, este ano, buscando uma alternativa ao impasse com o Irã. Além disso, o débito federal dos EUA atingiu um recorde de 40 trilhões de dólares, com déficits crescentes levando a uma demanda por juros mais altos dos investidores. Na República Centro-Africana, um colapso em uma mina de ouro resultou na morte de mais de cem pessoas, refletindo a gravidade dos acidentes no setor de mineração informal no país.\n\nAs tensões geopolíticas estão em alta em diversos cenários. Israel e seus vizinhos continuam em conflitos, com a Turquia e Estados Unidos envolvidos. A proximidade da eleição israelense deixa o presidente americano, Donald Trump, com influência sobre Benjamin Netanyahu, o primeiro-ministro israelense. Além disso, a Coreia do Norte continua a provocar preocupações, com o presidente americano, Donald Trump, afirmando que o país possui 57 armas nucleares. Em outro front, a China continua a competir globalmente, com seu fogueto Zhuque-3 rivalizando com empresas como a SpaceX. A situação no Oriente Médio também é tenso, com ataques israelenses em Gaza e debates sobre a intervenção do Ocidente, como as sanções francesas contra o ministro israelense Itamar Ben Gvir. A China também é alvo de grupos taiwaneses no exterior, conforme informado pela OCAC. A Ucrânia pressiona por novas eleições, enquanto os EUA mantêm corredores militares para a retirada de petróleo do Golfo Pérsico. A situação na Síria e Gaza continua volátil, com ataques israelenses e ações de Hamas. O Irã enfrenta pressões diplomáticas e internas, com seu parlamento expressando preocupações sobre 'infiltrações estrangeiras'.", "economia": "A dívida pública dos Estados Unidos atingiu um novo recorde histórico de 40 trilhões de dólares, refletindo um crescimento acelerado da dívida e um aumento dos custos dos juros, conforme informado por diversas fontes, incluindo o Infomoney, o Le Monde e o SCMP. Este aumento do endividamento do governo americano, que dobrou em uma década, levanta preocupações sobre um 'loop de destruição', pois o custo dos juros pode dificultar a estabilização das finanças públicas. Em um desenvolvimento econômico positivo, o Ibovespa rompeu um ciclo de 11 quedas e encerrou com uma alta de quase 1%, influenciado por operações de recompra de títulos pelo Tesouro dos EUA, que enfraqueceram o dólar e estimularam a alta de ações, ouro e Bitcoin em mercados globais.", "tecnologia": "A exposição tecnológica em Taipei destacou avanços futuristas, como braços robóticos da Techman e projetos de robôs humanoides da AiMOGA para controlar o trânsito caótico. Empresas estão investindo em inteligência artificial, com a Stripe adquirindo a OpenRouter e a Rillet levantando 100 milhões de dólares em uma rodada de série C, avaliada em 1 bilhão de dólares. A China testou foguetes reutilizáveis e a OpenAI interrompeu testes com a IA Astra após incidentes de segurança. O interesse em robôs domésticos está em alta, bem como a competição entre empresas de IA para uso empresarial e assistência acadêmica. A FCC reconsidera metas de velocidade de internet.", "ciencia": "Um estudo recente sugere que cinco microorganismos comuns da Terra poderiam sobreviver no polo sul lunar, representando um risco significativo para futuras missões humanas da NASA. Além disso, a Moderna, em parceria com a Merck, desenvolveu uma vacina mRNA experimental que reduziu o risco de recorrência e progressão do melanoma em pacientes de alto risco, levando as ações da empresa a dispararem 158%. A NASA e a startup Katalyst Space cancelaram os planos de reerguer a órbita da observatória gamma-ray Swift devido a problemas de controle de atitude do spacecraft. Por fim, uma nova vacina contra o câncer de pele, desenvolvida usando ARNm, reduziu o risco de recorrência e propagação do câncer de pele em um ensaio clínico grande, com os laboratórios anunciando os resultados provisionais.", "cultura": "O nome de menina inspirado na mitologia grega está se tornando cada vez mais popular entre os pais argentinos, devido à sua suavidade sonora e ao significado ligado à luz. Em outra notícia, a atriz Sandra Hüller pode receber duas indicações para os Oscars de Melhor Atriz e Melhor Atriz Coadjuvante em 2027, já que ela é a única candidata a ambas as categorias. Na área cultural, o Speed Art Museum em Kentucky devolveu 24 objetos de arte indígena aos povos Cheyenne e Arapaho, incluindo bolsas bordadas e uma cuna infantil, em uma ação de repatriação. Outro evento importante foi a assinatura da banda Twisted Teens com a gravadora Sub Pop, além de duas novas apresentações nos Estados Unidos e uma turnê na Austrália.", "sociedade": "A França aprovou uma lei que permite a eutanásia, após anos de debates, permitindo que pacientes com doenças terminais solicitem a assistência médica para morrer de maneira digna. Paralelamente, a França enfrenta pressões orçamentárias, obrigando a geração Z a gerir seu dinheiro com mais cuidado devido ao aumento do custo de vida. No Brasil, a Promotoria de Justiça acusa a diretora do Hospital Angelina Caron de homicídio culposo em seis mortes em uma unidade de terapia intensiva pediátrica. Em São Paulo, a Polícia Militar prendeu um homem após identificar um risco de agressão à sua ex-companheira e ao filho dela. No Brasil, também ocorreram a morte de dois trabalhadores após um equipamento de pintura cair de sete andares durante uma obra em Portugal, e a prisão de um ex-padrasto suspeito de matar uma adolescente de 14 anos em Americana, interior de São Paulo. Adicionalmente, um estudo com alunas nos Estados Unidos mostrou que um programa que inclui técnicas de respiração e habilidades emocionais aumentou a sensação de pertencimento entre elas, enquanto o governo do Rio de Janeiro promete recuperar áreas controladas pelo crime e construir novos presídios.", "meio_ambiente": "A expansão da energia limpa nos Estados Unidos continua, contrariando os esforços do governo de Donald Trump para frear a transição energética, conforme informa o [folha_mercado]. Em contraste, a [la_nacion_ar] prevê precipitações significativamente acima do normal na região agrícola do núcleo, com a 'super' El Niño afetando a Argentina e a África. Apesar de reconhecer riscos climáticos, a pesquisa do [exame] revela que a indústria da mineração ainda não se adaptou efetivamente. Globalmente, a [carbon_brief] destaca a inovação britânica de armazenamento de energia a longo prazo, crucial para a produção energética. A [bbc_brasil] relata danos ambientais em um ecossistema único na Argentina devido a atividades humanas. Por fim, a [yonhap_news] anuncia que Seul planeja cobrir todos os passeios com sombra até 2028 para combater as ondas de calor, enquanto a [euronews] informa sobre um grande incêndio em um centro de reciclagem em Londres. Estes eventos refletem os desafios e avanços no campo do meio ambiente em diferentes partes do mundo.", "direitos_humanos": "O Supremo Tribunal Federal (STF) decidiu, por unanimidade, expandir o alcance da Lei Maria da Penha, incluindo vítimas de violência de gênero em espaços públicos, profissionais e eleitorais. Além disso, um projeto aprovado na Comissão de Direitos Humanos exige que algumas empresas reservem 20% das vagas para mulheres, incluindo transexuais e travestis. Em contraste, no Afeganistão, a educação médica para mulheres foi interrompida, prejudicando o acesso à saúde e à saúde mental delas. Em Israel, investigações criminais foram abertas em casos envolvendo a morte de uma menina palestiniana de cinco anos e de médicos palestinos. No Irã, pelo menos 900 pessoas foram executadas desde janeiro, incluindo membros de minorias étnicas. Estes eventos refletem a diversidade dos desafios enfrentados em diferentes partes do mundo em relação a direitos humanos, desde questões de gênero e emprego até violações graves de direitos humanos em conflitos e regimes autoritários."}, "resumo_do_dia": {"politica_nacional": [{"id": 112898, "titulo": "PSDB/Cidadania pede ao TRE-PE retirada de apoio a Raquel Lyra, que terá menos tempo de TV", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/psdbcidadania-pede-ao-tre-pe-retirada-de-apoio-a-raquel-lyra-que-tera-menos-tempo-de-tv.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação PSDB/Cidadania solicitou à Justiça Eleitoral a retirada do apoio à governadora de Pernambuco, Raquel Lyra, da coligação que a candidata à reeleição. O partido declarou sem efeito o apoio que havia dado à governadora em uma convenção estadual realizada anteriormente.", "titulo_pt": "PSDB/Cidadania pede retirada de apoio a Raquel Lyra no TRE-PE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 112906, "titulo": "Candidatos a presidente intensificam gravações a nove dias do início da propaganda em rádio e televisão", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/19/candidatos-presidente-gravacoes-campanha-tv.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-19T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os principais candidatos à presidência, incluindo Lula, Flávio Bolsonaro, Augusto Cury e Ronaldo Caiado, estão intensificando as gravações para seus programas de rádio e televisão, com as gravações previstas para iniciar no próximo dia 15. Quatro candidatos terão tempo de televisão, com Lula recebendo o maior tempo de 5 minutos e 32 segundos.", "titulo_pt": "Candidatos a presidente intensificam gravações a nove dias do início da propaganda em rádio e televisão", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 112972, "titulo": "Javier Milei compara Lula e líderes de esquerda a \"trem-fantasma\"", "url": "https://www.metropoles.com/mundo/javier-milei-compara-lula-e-lideres-de-esquerda-a-trem-fantasma", "fonte_id": "metropoles", "data_pub": "2026-08-19T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Javier Milei comparou Lula e líderes de esquerda a 'trem-fantasma' em publicação nas redes sociais que reuniu dezenas de políticos de esquerda da América Latina e da Europa.", "titulo_pt": "Javier Milei compara Lula e líderes de esquerda a 'trem-fantasma'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 112976, "titulo": "Marina e Davi Davino ameaçam domínio de Lira e Renan em Alagoas", "url": "https://www.metropoles.com/colunas/andreza-matais/marina-e-davi-davino-ameacam-dominio-de-lira-e-renan-em-alagoas", "fonte_id": "metropoles", "data_pub": "2026-08-19T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A disputa pelas duas vagas ao Senado em Alagoas oferece oportunidades para Marina JHC e Davi Davino, potencialmente colocando em risco os mandatos de Lira e Renan Calheiros.", "titulo_pt": "Marina e Davi Davino ameaçam domínio de Lira e Renan em Alagoas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 112907, "titulo": "Caiado evita declarar posição sobre fim da escala 6x1, mas diz que PEC no Congresso é 'medida eleitoreira'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/19/caiado-evita-declarar-posicao-sobre-fim-da-escala-6x1-mas-diz-que-pec-no-congresso-e-m "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 112981, "titulo": "Durigan pretende mediar negociação do Rio com BNDES e Banco do Brasil", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/durigan-pretende-mediar-negociacao-do-rio-com-bndes-e-banco-do-brasil", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-19T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que vai mediar as negociações do governo do Rio de Janeiro com o BNDES e o Banco do Brasil para avaliar uma possível reestruturação das dívidas do estado. Durigan indicou que, se possível, as instituições financeiras ajudarão no processo.", "titulo_pt": "Durigan pretende mediar negociação do Rio com BNDES e Banco do Brasil", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 113129, "titulo": "Quem são os candidatos ao governo de Rondônia (RO) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-governo-de-rondonia-ro-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-19T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Seis candidatos estão disputando o cargo de governador de Rondônia nas eleições de 2026. O Palácio Rio Madeira, sede do governo do estado, será o centro dessa disputa.", "titulo_pt": "Quem são os candidatos ao governo de Rondônia nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 112885, "titulo": "Ministérios defendem revisão de exigência de CNPJ para nanoempreendedores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/ministerios-defendem-revisao-de-exigencia-de-cnpj-para-nanoempreendedores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal está reavaliando a exigência "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 112901, "titulo": "Sigilo contra sigilo, juiz contra blogueiro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/conrado-hubner-mendes/2026/08/sigilo-contra-sigilo-juiz-contra-blogueiro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal (STF) usaram um argumento clichê ao justificar a apreensão de celular de um jornalista, reafirmando que direitos fundamentais não são absolutos e não podem ser usados como escudo para a prática de crimes. O discurso judicial tem se dedicado a frases de efeito e sacadas irônicas em vez de doutrina jurídica robusta.", "titulo_pt": "Sigilo contra sigilo, juiz contra jornalista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 113131, "titulo": "STJ responsabiliza clínica e anestesista por erro médico, mas isenta hospital", "url": "https://www.jota.info/saude/stj-responsabiliza-clinica-e-anestesista-por-erro-medico-mas-isenta-hospital", "fonte_id": "jota", "data_pub": "2026-08-19T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STJ (Superior Tribunal de Justiça) atribuiu responsabilidade à clínica e ao anestesista pelo erro médico, mas isentou o hospital da responsabilidade. O colegiado analisou o vínculo do anestesista com a clínica e a consequente extensão da responsabilidade da empresa sobre o erro.", "titulo_pt": "STJ responsabiliza clínica e anestesista por erro médico, mas isenta hospital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 112584, "titulo": "China targeting overseas Taiwanese groups: OCAC", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/20/2003862794", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicat so Frankcom e considera chamar embaixador", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 113332, "titulo": "Media, Harry e la moglie Meghan torneranno questo mese a vivere in Gb", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/19/media-harry-e-la-moglie-meghan-torneranno-questo-mese-a-vivere-in-gb_b00b586b-9dd9-4dca-a65e-836ddff178ff.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-19T21:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Harry e Meghan voltarão a residir no Reino Unido neste mês, vivendo com seus filhos em uma propriedade fora de Londres que não pertence à família real.", "titulo_pt": "Harry e Meghan retornarão este mês para viver no reino unido", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 113173, "titulo": "Chinese Start-Up Lands Reusable Rocket for the First Time", "url": "https://www.nytimes.com/2026/08/19/world/asia/china-rocket-first-stage-recovery-land.html", "fonte_id": "nyt_world", "data_pub": "2026-08-19T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa privada chinesa LandSpace realizou com sucesso um foguete reutilizável, um marco que pode colocar a China mais perto de desafiar o domínio da SpaceX em voos espaciais de baixo custo.", "titulo_pt": "Start-Up chinesa consegue foguete reutilizável pela primeira vez", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 112967, "titulo": "Putin manda reconstruir armazéns comerciais atingidos pela Ucrânia", "url": "https://www.metropoles.com/mundo/putin-armazens-atingidos-drones-ucranianos", "fonte_id": "metropoles", "data_pub": "2026-08-19T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vladimir Putin ordenou a reconstrução de armazéns comerciais atingidos por ataques da Ucrânia, afetando a economia russa. Putin instruiu a participação estatal na reconstrução dos centros logísticos danificados.", "titulo_pt": "Putin ordena rec rtante contra a Meta.", "titulo_pt": "Ex-funcionário Arturo Béjar lidera depoimento no processo contra a Meta", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 113294, "titulo": "ICC slams US sanctions on court as 'flagrant attack'", "url": "https://www.dw.com/en/icc-slams-us-sanctions-on-court-as-flagrant-attack/a-78437476?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-19T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos intensificou suas pressões sobre o Tribunal Penal Internacional, acusando-o de ser 'politicizado'. A União Europeia, França, Alemanha, Espanha e Japão defenderam o tribunal.", "titulo_pt": "ICC é criticado por EUA como 'ataque flagrante'", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 113203, "titulo": "Penny Wong condemns ‘insulting’ decision to clear IDF over Gaza strikes that killed Australian aid worker Zomi Frankcom", "url": "https://www.theguardian.com/australia-news/2026/aug/20/australia-idf-reaction-gaza-strike-zomi-frankcom-penny-wong-statement-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-19T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra dos Assuntos Exteriores da Austrália, Penny Wong, expressou indignação e planeja repreender o embaixador israelense após a decisão do Exército de Defesa de Israel (IDF) de não iniciar uma investigação criminal sobre os ataques aéreos em Gaza que resultaram na morte da trabalhadora humanitária australiana Zomi Frankcom em 2024.", "titulo_pt": "Penny Wong condena 'insultante' decisão de israelenses não processarem ataques que mataram trabalhadora humanitária australiana", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 113236, "titulo": "UAE Joins Global Efforts to Isolate Iran", "url": "https://foreignpolicy.com/2026/08/19/uae-iran-trade-financial-embargo-missile-strikes-war/", "fonte_id": "foreign_policy", "data_pub": "2026-08-19T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abu Dhabi espera que uma embargo comercial force Teerã a se render.", "titulo_pt": "UAE adere a esforços globais para isolar Irã", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 113251, "titulo": "‘Woefully underprepared’: Graham critics seize on her foreign policy misstep", "url": "https://www.politico.com/news/2026/08/19/darline-graham-taiwan-flub-south-carolina-senate-01042395", "fonte_id": "politico", "data_pub": "2026-08-19T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A candidata presidencial Graham enfrentou críticas por sua desempenho fraco em debates sobre política externa. Trump está trabalhando para impulsionar sua candidatura, mas seu desempenho na debates demonstrou que ela ainda está pouco preparada.", "titulo_pt": "‘Muito mal preparada’: críticos apontam falha na política externa", "veiculo": "Politico", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 113063, "titulo": "EUA cruzam marca histórica de US$ 40 trilhões em dívida pública", "url": "https://www.infomoney.com.br/economia/eua-cruzam-marca-historica-de-us-40-trilhoes-em-divida-publica/", "fonte_id": "infomoney", "data_pub": "2026-08-19T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dívida pública dos Estados Unidos atingiu um novo recorde histórico de 40 trilhões de dólares, refletindo um crescimento acelerado da dívida e um aumento dos custos dos juros.", "titulo_pt": "EUA atingem marca histórica de US$ 40 trilhões em dívida pública", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 112941, "titulo": "Dívida dos EUA supera US$ 40 tri pela primeira vez, e custo dos juros aumenta pressão sobre Trump", "url": "https://veja.abril.com.br/economia/divida-dos-eua-supera-us-40-trilhoes-pela-primeira-vez-e-custo-dos-juros-aumenta-pressao-sobre-trump/", "fonte_id": "veja", "data_pub": "2026-08-19T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dívida dos EUA ultrapassou US$ 40 trilhões pela primeira vez, impulsionada por um déficit de US$ 1,8 trilhão em dez meses. Os juros elevados dificultam a promessa do governo de colocar as contas públicas em ordem.", "titulo_pt": "Dívida dos EUA supera US$ 40 trilhões pela primeira vez, e juros elevados dificultam controle orçamentário", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 113288, "titulo": "US national debt surpasses $40 trillion for first time", "url": "https://www.lemonde.fr/en/international/article/2026/08/19/us-national-debt-surpasses-40-trillion-for-first-time_6756686_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-19T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O débito nacional dos Estados Unidos ultrapassou pela primeira vez os 40 trilhões de dólares, refletindo o aumento dos custos da dívida governamental diante das crescentes demandas de gastos e pagamentos de juros.", "titulo_pt": "Débito nacional dos EUA atinge primeiro a marca de 40 trilhões de dólares", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 113065, "titulo": "Por que o Ibovespa subiu com recompra de títulos pelo Tesouro dos EUA?", "url": "https://www.infomoney.com.br/mercados/ibovespa-abertura-fechamento-19082026/", "fonte_id": "infomoney", "data_pub": "2026-08-19T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa atingiu seu máximo do dia, subindo até os 170 mil pontos, com uma elevação de 2,41%. A recompra de títulos pelo Tesouro dos EUA foi o principal motivo para essa alta.", "titulo_pt": "Por que o Ibovespa subiu com recompra de títulos pelo Tesouro dos EUA?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 113330, "titulo": "Hudson River posts $11.4bn trading windfall as it seizes on market tumult", "url": "https://www.ft.com/content/6a9f79b8-d47c-4cd2-b4ed-1ac77bd75576?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-19T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de Wall Street registrou um lucro de negociação de $11,4 bilhões no rio Hudson, aproveitando as flutuações nos ações de IA e a volatilidade causada pelo conflito com a Irã.", "titulo_pt": "Hudson River registra lucro de negociação de $11,4 bilhões aproveitando turbulência no mercado de ai", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 113067, "titulo": "Dólar hoje cai a R$ 5,17 após Tesouro dos EUA ampliar recompra de títulos", "url": "https://www.infomoney.com.br/mercados/dolar-hoje-abertura-fechamento-comercial-turismo-19082026/", "fonte_id": "infomoney", "data_pub": "2026-08-19T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar caiu para R$ 5,17 após o Tesouro dos Estados Unidos expandir as compras de títulos. Traders estavam buscando sinais sobre a direção futura das taxas de juros após uma queda geral nos títulos globais na terça-feira.", "titulo_pt": "Dólar cai a R$ 5,17 após Tesouro dos EUA ampliar compras de títulos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 112882, "titulo": "Justiça condena ex-CFO do Itaú a pagar R$ 2,83 milhões ao banco", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/justica-condena-ex-cfo-do-itau-a-pagar-r-283-milhoes-ao-banco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-diretor financeiro do Itaú Unibanco, Alexandro Broedel, foi condenado a pagar R$ 2,83 milhões ao banco por um caso de conflito de interesses relacionado à contratação de pareceres contábeis.", "titulo_pt": "Justiça condena ex-diretor financeiro do Itaú a pagar R$ 2,83 milhões ao banco", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 112883, "titulo": "Tribunal mantém bloqueio de créditos de gestora de fundos em disputa com a Oi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/tribunal-mantem-bloqueio-de-creditos-de-gestora-de-fundos-em-disputa-com-a-oi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em decisão de 19 de junho de 2026, a 1ª Câmara de Direito Privado do Tribunal de Justiça do Rio de Janeiro manteve o bloqueio de créditos e garantias da gestora norte-americana Pimco em relação à Oi.", "titulo_pt": "Tribunal mantém bloqueio de créditos de gestora de fundos em disputa com a Oi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 113054, "titulo": "Inter&Co atinge recordes de lucro, carteira de crédito e clientes no 2º Tri", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/interco-atinge-recordes-de-lucro-carteira-de-credito-e-clientes-no-2o-tri/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Inter&Co atingiu recordes de lucro, carteira de crédito e número de clientes no segundo trimestre. Em 2026, a instituição implementou o Rules of 50, lançou novos produtos e investiu em estratégias para melhorar a experiência do cliente.", "titulo_pt": "Inter&Co bate recordes de lucro, carteira de crédito e clientes no 2º Tri", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 113292, "titulo": "U.S. government debt passes $40 trillion, more than doubling in a decade", "url": "https://www.cnbc.com/2026/08/19/us-government-debt-passes-40-trillion-mark-for-the-first-time.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O débito do governo dos Estados Unidos ultrapassou os 40 trilhões de dólares, dobrando mais do que o dobro em uma década.", "titulo_pt": "Débito do governo dos estados unidos passa dos 40 trilhões, mais do que dobrando em uma década", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 113341, "titulo": "US debt hits US$40 trillion high, raising ‘doom loop’ risk", "url": "https://www.scmp.com/news/world/united-states-canada/article/3364613/us-debt-hits-us40-trillion-high-raising-doom-loop-risk?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-19T20:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O débito público dos Estados Unidos atingiu pela primeira vez os 40 trilhões de dólares, aumentando cerca de um terço em menos de cinco anos, sem sinais de uma mudança nas políticas de déficit financeiro. O relatório do Tesouro dos EUA mostrou que o débito total foi de 40,05 trilhões de dólares no final do dia de negócios de terça-feira. A marca de 30 trilhões de dólares foi ultrapassada apenas em janeiro de 2022.", "titulo_pt": "Dívida pública dos EUA atinge recorde de 40 trilhões, aumentando a 'loop do apocalipse'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 113061, "titulo": "Criptomoedas superam ações e CDBs entre investidores brasileiros", "url": "https://www.cnnbrasil.com.br/economia/investimentos/criptomoedas-superam-acoes-e-cdbs-entre-investidores-brasileiros/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As criptomoedas têm superado as ações e os CDBs na preferência dos investidores brasileiros. A facilidade de acesso e a expectativa de valorização são os principais fatores que explicam essa adesão aos ativos digitais.", "titulo_pt": "Criptomoedas superam ações e CDBs entre investidores brasileiros", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 113068, "titulo": "Ata do FOMC: Apoio para alta de juros dos EUA foi maior que os três votos dissidentes", "url": "https://www.infomoney.com.br/economia/ata-fomc-juros-eua-impacto-brasil/", "fonte_id": "infomoney", "data_pub": "2026-08-19T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ata do FOMC revela que o apoio à elevação dos juros nos Estados Unidos foi maior do que os três votos contrários. A decisão envolveu diversos participantes sem voto na reunião, já que a atribuição rotativa de votos alternava entre eles.", "titulo_pt": "Ata do FOMC: apoio para alta de juros dos EUA foi maior que os três votos dissidentes", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 113069, "titulo": "Taxas dos DIs fecham em queda após Tesouro dos EUA aumentar operações de recompra", "url": "https://www.infomoney.com.br/mercados/taxas-dos-dis-fecham-em-queda-apos-tesouro-dos-eua-aumentar-operacoes-de-recompra/", "fonte_id": "infomoney", "data_pub": "2026-08-19T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As taxas dos DI fecharam em queda após o Tesouro dos EUA anunciar a duplicação do volume das recompras de títulos com vencimentos entre 10 a 30 anos para pelo menos US$4 bilhões por operação.", "titulo_pt": "Taxas dos di fecham em queda após Tesouro dos EUA aumentar operações de recompra", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 113327, "titulo": "US government debt hits $40tn as borrowing rises at historic rate", "url": "https://www.ft.com/content/673f8c35-1433-479f-803f-0597cbe7ef74?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-19T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O endividamento do governo dos Estados Unidos atingiu marca de 40 trilhões de dólares, com um aumento histórico da dívida. Apesar da promessa de Donald Trump de estabilizar as finanças públicas americanas, os gastos públicos aumentaram significativamente.", "titulo_pt": "Endividamento do governo dos EUA atinge marca de 40 trilhões de dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 113130, "titulo": "STJ limita pagamento de honorários em processos de recuperação judicial", "url": "https://www.jota.info/justica/stj-limita-pagamento-de-honorarios-em-processos-de-recuperacao-judicial", "fonte_id": "jota", "data_pub": "2026-08-19T20:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A discussão sobre a redação da tese adiou a definição do pagamento de honorários em processos de recuperação judicial para a próxima sessão.", "titulo_pt": "STJ adia decisão sobre pagamento de honorários em recuperação judicial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 112605, "titulo": "Techman showcases robot arms", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/20/2003862776", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Techman exibiu seus braços robóticos. A empresa demonstrou tecnologias de braços robóticos durante o evento.", "titulo_pt": "Techman mostra braços robóticos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 112606, "titulo": "Tech expo comes to Taipei, showing us the future", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/20/2003862777", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma exposição tecnológica aconteceu em Taipei, exibindo tecnologias futuristas e avançadas. O evento ilustra possíveis avanços tecnológicos para o futuro.", "titulo_pt": "Expoição tecnológica chega a Taipei, mostrando o futuro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 113354, "titulo": "Cognition CEO denies report that SpaceX tried to acquire the startup", "url": "https://techcrunch.com/2026/08/19/cognition-ceo-denies-report-that-spacex-tried-to-acquire-the-startup/", "fonte_id": "techcrunch", "data_pub": "2026-08-19T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CEO da Cognition negou relatos de que a SpaceX tenha tentado adquirir a startup. A SpaceX já adquiriu a Cursor e está competindo com empresas como OpenAI e Anthropic no desenvolvimento de inteligência artificial para uso empresarial.", "titulo_pt": "CEO da cognition nega que a SpaceX tenha tentado adquirir a startup", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 113355, "titulo": "Travis Kalanick kicks off another round of VC bashing: ‘1% are helpful’", "url": "https://techcrunch.com/2026/08/19/travis-kalanick-kicks-off-another-round-of-vc-bashing-1-are-helpful/", "fonte_id": "techcrunch", "data_pub": "2026-08-19T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Travis Kalanick, fundador do Uber, após levantar $1,7 bilhão para sua nova empresa de robótica chamada Atoms, reflete sobre o papel que os investidores anjo (VC) desempenharam em sua carreira. Ele afirma que apenas 1% dos investidores anjo foram realmente úteis para ele.", "titulo_pt": "Travis Kalanick critica novamente investidores anjo: '1% são úteis'", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 113338, "titulo": "Golden Dome may not fully protect US from Chinese and Russian threats, experts say", "url": "https://www.scmp.com/news/us/article/3364615/golden-dome-may-not-fully-protect-us-chinese-and-russian-threats-experts-say?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-19T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sistema de defesa antimíssil proposto pelos Estados Unidos, conhecido como 'Golden Dome', pode não garantir uma proteção completa para o país, segundo especialistas. Além disso, essa expansão das defesas antimíssil pode acelerar a corrida armamentista global envolvendo China, Rússia e Coreia do Norte.", "titulo_pt": "Cúpula de ouro não garantirá proteção total dos EUA frente aos riscos chineses e russos, dizem especialistas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 113037, "titulo": "Stripe compra OpenRouter, plataforma de IA para desenvolvedores", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/stripe-compra-openrouter-plataforma-de-ia-para-desenvolvedores/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Stripe adquiriu a OpenRouter, uma plataforma de inteligência artificial para desenvolvedores que permite enviar consultas a diversos modelos de IA por meio de uma única interface.", "titulo_pt": "Stripe compra OpenRouter, plataforma de IA para desenvolvedores", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 113047, "titulo": "China tentará controlar o trânsito caótico com robôs humanoides", "url": "https://www.cnnbrasil.com.br/ciencia/china-tentara-controlar-o-transito-caotico-com-robos-humanoides/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup de robótica AiMOGA apresentou um projeto de robôs humanoides na Conferência Mundial de Robótica em Pequim, China, com o objetivo de tentar controlar o trânsito caótico.", "titulo_pt": "China tentará controlar o trânsito caótico com robôs humanoides", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 113278, "titulo": "The data center fight is hitting a fever pitch. Here's how they actually work", "url": "https://www.axios.com/2026/08/19/ai-power-data-center-electricity-construction", "fonte_id": "axios", "data_pub": "2026-08-19T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A oposição pública aos centros de dados nos Estados Unidos está aumentando, com celebridades, políticos e protestantes pressionando para frear seu crescimento. Essa resistência pode representar um perigo existencial para o crescimento da inteligência artificial, já que os centros de dados são essenciais para o uso diário da internet.", "titulo_pt": "O debate sobre centros de dados está esquenta. Entenda como eles funcionam", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 113347, "titulo": "Framework responds to complaints that BIOS update bricks Ryzen 7040 laptops", "url": "https://arstechnica.com/gadgets/2026/08/framework-responds-to-complaints-that-bios-update-bricked-ryzen-7040-laptops/", "fonte_id": "ars_technica", "data_pub": "2026-08-19T20:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Framework está substituindo algumas placas-mãe AMD fora da garantia que apresentaram problemas após atualizações de BIOS. Isso ocorre após reclamações de que atualizações de BIOS estavam deixando laptops Ryzen 7040 inutilizáveis.", "titulo_pt": "Framework substitui placas-mãe amd fora da garantia após problemas com atualizações de BIOS", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 113356, "titulo": "Rillet raises $100M Series C at $1B valuation — 2 years after emerging from stealth", "url": "https://techcrunch.com/2026/08/19/rillet-raises-100m-series-c-at-1b-valuation-2-years-after-emerging-from-stealth/", "fonte_id": "techcrunch", "data_pub": "2026-08-19T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Rillet, focada em inteligência artificial, se tornou uma unicórnio após levantar 100 milhões de dólares em uma rodada de série C, avaliada em 1 bilhão de dólares, liderada pela Iconiq. A empresa dobrou sua receita anualizada recorrente nos últimos três meses.", "titulo_pt": "Rillet levanta 100 milhões em série C e se torna unicórnio após dois anos em modo de incógnita", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 113293, "titulo": "Stripe to buy OpenRouter as fintech expands deeper into AI", "url": "https://www.cnbc.com/2026/08/19/stripe-openrouter-fintech-ai-model-marketplace-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T20:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_ externa da Terra, criando atrito orbital devido a mudanças na densidade atmosférica.", "titulo_pt": "Desafio orbital Clarity: prêmio NASA TechLeap", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 113392, "titulo": "STAT+: New CDC director tells staff she is prepared to speak ‘truth to power’", "url": "https://www.statnews.com/2026/08/19/cdc-director-erica-schwartz-staff-meeting-truth-to-power/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T19:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova diretora do CDC informou aos funcionários que está 'muito confortável e confiante' em 'dizer a verdade ao poder'.", "titulo_pt": "Nova diretora do CDC diz aos funcionários que está preparada para 'dizer a verdade ao poder'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 113420, "titulo": "Katalyst Space and NASA abandon plans for Swift reboost", "url": "https://spacenews.com/katalyst-space-and-nasa-abandon-plans-for-swift-reboost/", "fonte_id": "spacenews", "data_pub": "2026-08-19T19:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Katalyst Space e NASA cancelaram os planos de usar o spacecraft Link da empresa para reerguer a órbita da observatória gamma-ray Swift da agência. O cancelamento foi atribuído a problemas de controle de atitude do spacecraft.", "titulo_pt": "Katalyst Space e NASA abandonam planos para reerguer a órbita do Swift", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 113071, "titulo": "Moderna anuncia vacina contra o câncer de pele e ação dispara 150%", "url": "https://braziljournal.com/moderna-anuncia-vacina-contra-o-cancer-de-pele-e-acao-dispara-150/", "fonte_id": "brazil_journal", "data_pub": "2026-08-19T19:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Moderna, em parceria com a Merck, desenvolveu uma vacina mRNA experimental que reduziu o risco de recorrência e progressão do melanoma em pacientes de alto risco. As ações da Moderna dispararam 158% após o anúncio.", "titulo_pt": "Moderna anuncia vacina contra o câncer de pele e ação dispara 150%", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 112880, "titulo": "Nasa e startup desistem de tentar rebocar telescópio no espaço", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/nasa-e-startup-desistem-de-tentar-rebocar-telescopio-no-espaco.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-19T19:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão da Nasa e da startup Katalyst para salvar o Observatório Neil Gehrels Swift, também conhecido como Swift, falhou. A agência e a empresa anunciaram o fracasso nesta quarta-feira (19).", "titulo_pt": "Nasa e startup desistem de salvar telescópio no espaço", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 113422, "titulo": "NASA Updates Next Steps for Commercial Swift Boost Mission", "url": "https://www.nasa.gov/news-release/nasa-updates-next-steps-for-commercial-swift-boost-mission/", "fonte_id": "nasa_news", "data_pub": "2026-08-19T18:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Devido a um problema de controle de atitude na nave comercial, a NASA e a Katalyst Space anunciaram que o spacecraft LINK não realizará a captura ou a elevação da órbita de um satélite agência para estender sua missão científica. No entanto, o LINK ainda tentará realizar operações de encontro e operações em proximidade com o observatório Neil Gehrels Swift da NASA.", "titulo_pt": "NASA atualiza próximos passos para missão comercial de aceleração rápida", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 113419, "titulo": "Some microbes could survive on the moon—that’s a big problem for NASA", "url": "https://www.scientificamerican.com/article/some-microbes-could-survive-on-the-moon-thats-a-big-problem-for-nasa/", "fonte_id": "scientific_american", "data_pub": "2026-08-19T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo indica que cinco microorganismos comuns da Terra poderiam sobreviver no polo sul lunar, representando um risco de contaminação para futuras missões humanas. Isso é uma preocupação significativa para a NASA.", "titulo_pt": "Algumas microrganismos poderiam sobreviver na lua — e isso é um problema para a NASA", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 112412, "titulo": "Moderna, Merck cancer vaccine shows promise in late-stage trial; Moderna stock soars 150%", "url": "https://www.cnbc.com/2026/08/19/moderna-merck-cancer-vaccine-shows-initial-late-stage-melanoma-data.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um regime combinado de vacina anticâncer da Moderna e do medicamento Keytruda mostrou promessa em um estudo em fase avançada, estendendo significativamente o tempo que os pacientes viveram sem que o melanoma retornasse. A ação da ação da Moderna subiu 150%.", "titulo_pt": "Vacina anticâncer da Moderna e Merck mostram promessa em estudo avançado; ação da Moderna sobe 150%", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 112695, "titulo": "Trust in science: A new STAT initiative", "url": "https://www.statnews.com/2026/08/19/trust-in-science-a-new-stat-initiative/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A STAT iniciou sua missão há mais de uma década com o compromisso de fornecer 'jornalismo confiável e rigoroso'. No entanto, não se imaginava que a confiança se tornaria um tema tão central.", "titulo_pt": "Confiança na ciência: uma nova iniciativa da STAT", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 112696, "titulo": "STAT+: Experts scrutinize Huidagene’s disclosures after patient death", "url": "https://www.statnews.com/2026/08/19/biotech-news-experts-scrutinize-huidagene-disclosures-after-patient-death/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos estão examinando as declarações da Huidagene após a morte de um paciente. Também são discutidas as possíveis indicações da vacina mRNA contra câncer de Merck e Moderna para liderar a FDA, além de outras notícias da biotecnologia.", "titulo_pt": "Expertos analisam declarações da Huidagene após morte de paciente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 112697, "titulo": "STAT+: Regeneron drug for disease that causes dangerous bone growth earns FDA approval", "url": "https://www.statnews.com/2026/08/19/regeneron-fop-garetosmab-fda-approval-pasatru/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Regeneron obteve aprovação para um medicamento que trata uma doença ultra-rara que causa o crescimento ósseo em locais onde não deveria ocorrer.", "titulo_pt": "Medicamento da regeneron aprovado para doença que causa crescimento ósseo em locais errados obtem aprovação da FDA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 112706, "titulo": "Static electricity is a mystery, and scientists are all charged up", "url": "https://www.sciencenews.org/article/static-electricity-is-a-mystery", "fonte_id": "science_news", "data_pub": "2026-08-19T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas ainda não compreendem completamente as origens da eletricidade estática. Um grupo de pesquisadores incomuns está determinado a mudar essa situação.", "titulo_pt": "Eletricidade estática é um mistério, e cientistas estão carregados de entusiasmo para resolver o problema", "veiculo": "Science News", "pais": "EUA", "cl as no Paraná", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 112597, "titulo": "Health agency posts sperm and egg donation rules", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/20/2003862813", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de saúde publicou as regras para doação de esperma e ovos. O documento estabelece os parâmetros oficiais para esse processo.", "titulo_pt": "Agência de saúde publica regras para doação de esperma e ovos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 112598, "titulo": "Ministry details efforts on asphalt-related pollution", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/20/2003862814", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério detalhou os esforços relacionados à poluição de asfalto. O texto não fornece mais detalhes sobre as ações específicas realizadas.", "titulo_pt": "Ministério detalha esforços sobre poluição de asfalto", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 112881, "titulo": "Energia limpa avança nos EUA apesar de esforços de Trump para frear transição energética", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/energia-limpa-avanca-nos-eua-apesar-de-esforcos-de-trump-para-frear-transicao-energetica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A expansão inesperada da energia limpa nos Estados Unidos continua, mesmo com esforços do governo de Donald Trump para frear a transição energética. O aumento da demanda por eletricidade está impulsionando investimentos em novas capacidades de energia solar e eólica.", "titulo_pt": "Energia limpa avança nos EUA apes sastres climáticos. Embora reconheçam o risco, as empresas ainda não se adaptaram efetivamente.", "titulo_pt": "Mineração reconhece risco climático, mas comunidades não estão preparadas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 112122, "titulo": "A indignação com os danos ambientais causados ​​por um homem com seu caminhão em ecossistema único na Argentina", "url": "https://www.bbc.com/portuguese/articles/cq56nw6105go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-19T12:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Pampa del Leoncito é uma ampla planície branca que corresponde ao leito de um antigo lago que secou há milhares de anos. Este ecossistema único na Argentina tem sido alvo de preocupações ambientais devido a danos causados por um homem com seu caminhão.", "titulo_pt": "A indignação com os danos ambientais causados por um homem com seu caminhão em um ecossistema único na Argentina", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 112762, "titulo": "Q&A: What is ‘long-duration energy storage’ – and why does the UK need it?", "url": "https://www.carbonbrief.org/qa-what-is-long-duration-energy-storage-and-why-does-the-uk-need-it", "fonte_id": "carbon_brief", "data_pub": "2026-08-19T11:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido está inovando no uso de 'super baterias' que armazenam energia por períodos prolongados, afinando a produção de energia gerada. Este tipo de armazenamento de energia a longo prazo é crucial para o Reino Unido devido às suas necessidades energéticas específicas.", "titulo_pt": "Perguntas e respostas: o que é 'armazenamento de energia A longo prazo' – e por que o reino unido precisa disso?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 111270, "titulo": "Los animales “mutantes” de Chernobyl: ranas decoloradas, arañas perdidas y albinismo incrementado", "url": "https://www.lanacion.com.ar/el-mundo/los-animales-mutantes-de-chernobyl-ranas-decoloradas-aranas-perdidas-y-albinismo-incrementado-nid18082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-19T09:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A 40 anos da tragédia nuclear em Chernobyl, Ucrânia, ainda são observadas populações de animais resistentes à radição, incluindo rãs decoloradas, aranhas com comportamento alterado e aumento do albinismo.", "titulo_pt": "Os animais ‘mutantes’ de Chernobyl: rãs decoloradas, aranhas perdidas e albinismo incrementado", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 111113, "titulo": "Clima: Sul tem frente fria e calorão supera 30ºC no Sudeste nesta 4ª", "url": "https://www.metropoles.com/brasil/clima-sul-tem-frente-fria-e-calorao-supera-30oc-no-sudeste-nesta-4a", "fonte_id": "metropoles", "data_pub": "2026-08-19T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova frente fria avança pelo Sul do Brasil, trazendo instabilidades e o risco de temporais. No Sudeste, as temperaturas superam os 30°C.", "titulo_pt": "Clima: frente fria chega ao sul e calor atinge Sudeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 111527, "titulo": "Mud baths and red water: inside Bulgaria's Lake Atanasovsko", "url": "http://www.euronews.com/video/2026/08/19/mud-baths-and-red-water-inside-bulgarias-lake-atanasovsko", "fonte_id": "euronews", "data_pub": "2026-08-19T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Turistas espalham argila e nadam em água vermelha no Lago Atanasovsko, enquanto um museu de sal em Pomorie preserva o herança do processo de fabricação de sal da Bulgária, que está em declínio.", "titulo_pt": "Banhos de lama e água vermelha: dentro do lago Atanasovsko da bulgária", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 112553, "titulo": "Japanese nuclear power plant death threatens to delay res Brasil", "classe": "B"}, {"id": 112946, "titulo": "Transexuais e travestis poderão ganhar cota de vagas em certas empresas; veja quais", "url": "https://veja.abril.com.br/economia/transexuais-e-travestis-poderao-ganhar-cota-de-vagas-em-certas-empresas-veja-quais/", "fonte_id": "veja", "data_pub": "2026-08-19T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto aprovado na Comissão de Direitos Humanos exige que algumas empresas reservem 20% das vagas para mulheres, incluindo transexuais e travestis.", "titulo_pt": "Transexuais e travestis poderão ter cota de vagas em certas empresas; veja as regras", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 113128, "titulo": "STF: Lei Maria da Penha se estende a vítimas de violência fora do ambiente doméstico", "url": "https://www.jota.info/stf/do-supremo/stf-lei-maria-da-penha-se-estende-a-vitimas-de-violencia-fora-do-ambiente-domestico", "fonte_id": "jota", "data_pub": "2026-08-19T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei Maria da Penha foi estendida para incluir vítimas de violência de gênero em espaços públicos, profissionais e eleitorais. Isso significa que medidas protetivas agora são válidas para mulheres nesses contextos.", "titulo_pt": "STF: lei Maria da Penha abrange vítimas de violência de gênero em espaços públicos, profissionais e eleitorais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 113284, "titulo": "'When we tell them pregnancies require regular medical checkups, they scoff': Afghan women's health is put at risk by the Taliban", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/19/i-worked-day-and-night-to-become-a-doctor-i-was-so-close-afghan-women-s-health-is-put-at-risk-by-the-taliban_6756683_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-19T18:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A educação médica para mulheres em Afghanistan foi interrompida, o que dificul eino Unido", "classe": "A"}, {"id": 112425, "titulo": "Israel opens criminal probes into killings of Hind Rajab and Palestinian medics", "url": "http://www.euronews.com/2026/08/19/israel-opens-criminal-probes-into-killings-of-hind-rajab-and-palestinian-medics", "fonte_id": "euronews", "data_pub": "2026-08-19T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel está abrindo investigações criminais no caso da morte de Hind Rajab e de médicos palestinos. As investigações não estão sendo abertas para três outros incidentes envolvendo trabalhadores humanitários da World Central Kitchen e do Médicos Sem Fronteiras.", "titulo_pt": "Israel abre investigações criminais nos casos de mortes de Hind Rajab e de médicos palestinos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 112461, "titulo": "Palestinian refugee and two relatives drown off English coast", "url": "https://www.aljazeera.com/news/2026/8/19/three-people-from-palestinian-british-family-drown-off-uks-sussex-coast?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-19T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma refugiada palestina e duas de suas parentes afogaram-se na costa inglesa. Uma menina foi levada ao hospital em estado crítico, conforme declarou o primeiro-ministro Burnham.", "titulo_pt": "Refugiada palestina e duas parentes afogam-se na costa inglesa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 113418, "titulo": "UNICEF statement on the injury of 42 children in an explosion at a school in Afghanistan", "url": "https://www.unicef.org/press-releases/unicef-statement-injury-42-children-explosion-school-afghanistan", "fonte_id": "unicef", "data_pub": "2026-08-19T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O UNICEF emitiu um comunicado sobre a lesão de 42 crianças em uma explosão que ocorreu em uma escola no Afeganistão. Não há detalhes adicionais sobre o incidente function ttsBarHtml(audioKey) {

  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';

}

function _updateBtn(url, ativo) {

  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));

  a.click();

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';

  const su = esc(url).replace(/"/g, '&quot;');

  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

}

(function () {

    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;

    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;

      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
