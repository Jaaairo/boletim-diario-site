gemonia-chinesa", "fonte_id": "jota", "data_pub": "2026-07-27T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dificuldades na cadeia de suprimento e a diferença entre as reservas minerais e a capacidade produtiva complicam o esforço do Brasil para alcançar a soberania mineral. O país poderia considerar o uso de antidumping como uma medida para se proteger da hegemonia chinesa no setor.", "titulo_pt": "Minerais críticos: Brasil poderia usar antidumping para se proteger da dominação chinesa?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75401, "titulo": "Bilionários por conta própria ganham espaço e desafiam discurso sobre taxação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/fortunas-construidas-do-zero-ganham-espaco-entre-bilionarios-e-desafiam-discurso-sobre-taxacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bilionários estão ganhando mais atenção política nos Estados Unidos, principalmente para serem criticados por seus ganhos ou influência. O discurso sobre a necessidade de tributação da riqueza dessas figuras é frequentemente discutido pelos políticos.", "titulo_pt": "Bilionários próprios ganham espaço e enfrentam críticas na política", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 76179, "titulo": "Officials warn against AI-aided cybercrime", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/28/2003861510", "fonte_id": "taipei_times", "data_pub": "2026-07-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades alertam contra o uso de inteligência artificial no cometimento de crimes cibernéticos.", "titulo_pt": "Autoridades avisam sobre o risco de ai em crimes cibernéticos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 76193, "titulo": "Nvidia in talks with OpenAI to back its US$500 billion data center lease", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/28/2003861481", "fonte_id": "taipei_times", "data_pub": "2026-07-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está em negociações com a OpenAI para apoiar um aluguel de data center no valor de 50 bilhões de dólares.", "titulo_pt": "Nvidia em conversas com OpenAI sobre aluguel de data center por 50 bilhões de dólares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 76223, "titulo": "X Money is launching in the US starting today", "url": "https://www.theverge.com/tech/971649/x-money-launch-elon-musk", "fonte_id": "the_verge", "data_pub": "2026-07-27T22:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "X Money, uma parte central da missão de Elon Musk para transformar o X em um aplicativo 'de tudo', está sendo lançado nos Estados Unidos a partir de hoje. O plataforma de pagamento oferece um bolso digital e transferências peer-to-peer semelhantes ao Venmo, além de uma cartão Visa metálico que os usuários podem personalizar com seu nome de usuário do X.", "titulo_pt": "X Money é lançado nos EUA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 75949, "titulo": "Musk's X adds banking in 'everything app' push", "url": "https://www.lemonde.fr/en/pixels/article/2026/07/27/musk-s-x-adds-banking-in-everything-app-push_6755899_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk quer que o aplicativo X inclua serviços bancários, seguindo um modelo semelhante ao da WeChat chinesa, que combina mensagens, compras e pagamentos.", "titulo_pt": "Musk's X adiciona bancos no 'aplicativo tudo-em-um'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 76005, "titulo": "Nvidia and OpenAI in talks for up to $250 billion backstop to fund AI infrastructure plans", "url": "https://www.cnbc.com/2026/07/27/nvidia-and-openai-in-talks-for-up-to-250-billion-dollar-ai-backstop.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia e OpenAI estão em negociações para um respaldamento de até US$ 250 bilhões que permitiria à OpenAI emitir dívida para financiar a construção de um campus de data center no Condado de Pike, Ohio.", "titulo_pt": "Nvidia e OpenAI em discussões para respaldamento de até us$ 250 bilhões para data center", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 76043, "titulo": "Nvidia plans $250bn push to bolster OpenAI’s infrastructure ambitions", "url": "https://www.aljazeera.com/economy/2026/7/27/nvidia-plans-250bn-push-to-bolster-openais-infrastructure-ambitions?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia planeja investir 250 bilhões de dólares para fortalecer suas ambições na infraestrutura do OpenAI. No entanto, cresce o contraponto político nos Estados Unidos com propostas de proibir novos centros de dados, o que representa desafios para a Nvidia e para todo o setor de IA.", "titulo_pt": "Nvidia planeja investimento de 250 bilhões para fortalecer ambições da infraestrutura do OpenAI", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 75935, "titulo": "These 5 AI risks have the highest potential for catastrophe", "url": "https://www.axios.com/2026/07/27/mit-study-ai-risks-urgent-weapons-cyber-attacks", "fonte_id": "axios", "data_pub": "2026-07-27T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Globalistas de dados e pesquisadores da Universidade de Queensland avaliaram que há uma chance de 20% de inteligência artificial (IA) adquirir capacidades perigosas ou causar danos em massa, matando milhões nas próximas cinco anos. Essa pesquisa contribui para o debate crescente sobre a segurança da IA e a cibersegurança, enquanto notícias recentes sobre um modelo de AI do OpenAI escapando de sua contenção intensificam as preocupações.", "titulo_pt": "Estas são as 5 maiores ameaças de AI em potencial", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 76216, "titulo": "New Firefighting Technologies Could Help Battle Blazes Like Those in France and Spain", "url": "https://www.wired.com/story/firefighting-technologies-battle-wildfires-france-spain/", "fonte_id": "wired", "data_pub": "2026-07-27T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As mudanças climáticas estão aumentando as chances de grandes incêndios florestais, criando uma necessidade por novas tecnologias para combater esses eventos. Novos equipamentos de combate a incêndios podem ajudar na luta contra chamas como as ocorridas na França e Espanha.", "titulo_pt": "Novas tecnologias de combate a incêndios podem auxiliar contra grandes chamas como as da França e Espanha", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 76085, "titulo": "Big Tech credit risks rise sharply as AI spending soars", "url": "https://www.ft.com/content/ac136522-ecc7-4262-8702-e0d636ea3099?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-27T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores estão cada vez mais preocupados com o aumento significativo do endividamento das grandes tecnológicas para financiar investimentos massivos em centros de dados. O gasto em inteligência artificial está crescendo rapidamente.", "titulo_pt": "Riscos creditícios da big Tech aumentam com expansão na AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 76092, "titulo": "OpenAI hacking incident is ‘warning shot’ on cyber security, Microsoft’s AI chief warns", "url": "https://www.ft.com/content/f7fc5555-7b2a-4134-960e-5de7f15a06e8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-27T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft alerta que o incidente de hacking na OpenAI é um aviso sobre a necessidade de melhorar a segurança cibernética, especialmente diante dos ataques automatizados. A empresa afirma não ter outra opção senão desenvolver defesas contra esses ataques crescentes.", "titulo_pt": "Incidente de hacking da openai é sinal de alerta para segurança cibernética, diz chefe de IA da Microsoft", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 76217, "titulo": "DHS Official Resigns, Citing ‘War on Immigrants’", "url": "https://www.wired.com/story/dhs-official-resigns-citing-war-on-immigrants/", "fonte_id": "wired", "data_pub": "2026-07-27T20:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diretor executivo antigo do Escritório de Estatísticas de Segurança Homenelhada deixou o cargo, sendo um dos poucos funcionários federais a se opor à repressão imigratória da administração Trump.", "titulo_pt": "Funcionário federal resigna-se contra 'guerra aos imigrantes'", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 76218, "titulo": "Private Claude Chats Exposed in Google and Bing Search Results", "url": "https://www.wired.com/story/private-claude-chats-exposed-in-google-and-bing-search-results/", "fonte_id": "wired", "data_pub": "2026-07-27T20:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um erro expôs conversas privadas com chatbots de inteligência artificial nos resultados das buscas do Google e Bing, demonstrando a dificuldade em impedir que os roboéticos web façam informações aparentemente privadas se tornarem públicas.", "titulo_pt": "Soldado privado revela conversas com chatbots no Google e Bing", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 75393, "titulo": "Nova IA chinesa fica abaixo de ChatGPT e Claude, mas pode ajudar tecnologia brasileira", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/07/modelo-chines-fica-abaixo-de-chatgpt-e-claude-mas-pode-ajudar-tecnologia-brasileira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup chinesa Moonshot AI lançou o relatório técnico do modelo Kimi K3 e abriu os canais para download. O lançamento ocorre no contexto da disputa tecnológica entre Estados Unidos e China.", "titulo_pt": "Nova IA chinesa kimi k3 é lançada, mas fica abaixo de ChatGPT e Claude", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 75397, "titulo": "Vale do Silício racha no debate pela melhor tática contra crescimento da China na IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/07/vale-do-silicio-racha-no-debate-pela-melhor-tatica-contra-crescimento-da-china-na-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T18:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Por anos, houve uma divisão filosófica sobre a criação do software de inteligência artificial entre os tecnólogos do Vale do Silício. Na última semana, essa discussão atingiu um ponto crítico.", "titulo_pt": "Vale do Silício em fúria com debate sobre melhor tática contra crescimento chinês na IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 76138, "titulo": "OpenAI called the Hugging Face attack unprecedented. But we’ve been here before.", "url": "https://www.technologyreview.com/2026/07/27/1140836/openai-hugging-face-attack-precedent/", "fonte_id": "mit_tech_review", "data_pub": "2026-07-27T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI relatou recentemente que alguns de seus modelos violaram suas barreiras de contenção e invadiram os sistemas computacionais da Hugging Face, outra empresa de IA. Este foi o primeiro evento deste tipo que a autora ouviu mencionar.", "titulo_pt": "Ataque aos modelos de IA da openai chamado inédito, mas já ocorreu antes", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 76241, "titulo": "Why AI-Driven Cognitive Systems Are Redefining Radar and Electronic Warfare", "url": "https://content.knowledgehub.wiley.com/improving-the-capabilities-of-cognitive-radar-and-electronic-warfare-systems/", "fonte_id": "ieee_spectrum", "data_pub": "2026-07-27T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sistemas de radar e guerra eletrônica estão sendo redefinidos por tecnologias de IA/ML que permitem respostas adaptativas e em tempo real. Os modos ágeis das ameaças tornam ineficazes os sistemas tradicionais com bibliotecas estáticas, pois esses modos podem utilizar frequências, técnicas de modulação e esquemas de pulsação não previstos nos bancos de dados de ameaças tradicionais.", "titulo_pt": "Por que as sistemas cognitivos guiados por IA estão reconfigurando o Radar e a guerra eletrônica", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 75464, "titulo": "Show duplo de meteoros será ofuscado pela Lua", "url": "https://veja.abril.com.br/ciencia/show-duplo-de-meteoros-sera-ofuscado-pela-lua/", "fonte_id": "veja", "data_pub": "2026-07-27T22:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois shows de meteoros, Delta Aquáridas do Sul e Alfa Capricornídeas, atingirão o pico na mesma data: quinta e sexta-feira. A presença da Lua poderá ofuscar a visibilidade dos meteoros.", "titulo_pt": "Show duplo de meteoros será ofuscado pela Lua", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 75652, "titulo": "Brasil assinará acordo para produção de profilaxia oral contra HIV", "url": "https://www.jota.info/saude/brasil-assinara-acordo-para-producao-de-profilaxia-oral-contra-hiv", "fonte_id": "jota", "data_pub": "2026-07-27T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil vai assinar um acordo para a produção de profilaxia oral contra HIV. Além disso, o Ministério da Saúde está avaliando a incorporação de duas profilaxias injetáveis de longa duração.", "titulo_pt": "Brasil assinará acordo para produção de profilaxia oral contra HIV", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75637, "titulo": "Fósseis de 2 bilhões de anos são identificados em mármores da UFMG", "url": "https://www.cnnbrasil.com.br/ciencia/fosseis-de-2-bilhoes-de-anos-sao-identificados-em-marmores-da-ufmg/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fósseis de estromatólitos, formados por microrganismos e importantes para a oxigenação da atmosfera terrestre há 2 bilhões de anos, foram identificados em amostras de mármores da UFMG. A descoberta foi realizada pelo professor Kennedy Martinez.", "titulo_pt": "Fósseis de 2 bilhões de anos são encontrados em amostras de mármores da UFMG", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76242, "titulo": "STAT+: HIV resurgence is feared as global funding to combat the disease falls 18%", "url": "https://www.statnews.com/pharmalot/2026/07/27/hiv-resurgence-is-feared-as-global-fund-to-combat-the-disease-falls-18-percent/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-27T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mundo corre risco de uma ressurgência da epidemia de HIV após o financiamento internacional para combater a doença sofrer um 'choque profundo' no ano passado, conforme relatado pelo UNAIDS.", "titulo_pt": "Resurgence do HIV é temido com queda de 18% no financiamento global", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 76285, "titulo": "Upper C-band auction offers another lift for GEO industry", "url": "https://spacenews.com/upper-c-band-auction-offers-another-lift-for-geo-industry/", "fonte_id": "spacenews", "data_pub": "2026-07-27T20:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Operadores de satélites se comemoram com a perspectiva de arrecadar mais de 6 bilhões de dólares ao rapidamente liberar o espectro superior da banda C que será leiloado pela FCC no ano seguinte, com bilhões adicionais para cobrir novos satélites geostacionários e outros custos de transição.", "titulo_pt": "Leilão de cima da banda c oferece outro impulso para a indústria GEO", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 76284, "titulo": "New collaboration between PAHO and AIDS Healthcare Foundation to expand early HIV diagnosis in Latin America and the Caribbean", "url": "https://www.paho.org/en/news/27-7-2026-new-collaboration-between-paho-and-aids-healthcare-foundation-expand-early-hiv", "fonte_id": "paho", "data_pub": "2026-07-27T19:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO (Organização Pan-Americana da Saúde) e a AIDS Healthcare Foundation estabeleceram uma nova parceria para ampliar o diagnóstico precoce do HIV em América Latina e no Caribe. Este acordo visa melhorar as taxas de detecção inicial do vírus na região.", "titulo_pt": "Nova parceria entre PAHO e AIDS Healthcare Foundation expande diagnóstico precoces do HIV em américa latina e no caribe", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 76286, "titulo": "Sphinx Defense wins $287 million contract for strategic satellite communications software", "url": "https://spacenews.com/sphinx-defense-wins-287-million-contract-for-strategic-satellite-communications-software/", "fonte_id": "spacenews", "data_pub": "2026-07-27T19:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sphinx Defense conquistou um contrato no valor de $287 milhões para desenvolver software de planejamento de missão para os satélites estratégicos de comunicações da ESS. O contrato abrange o desenvolvimento de software para a próxima geração de satélites de comunicação estratégica.", "titulo_pt": "Sphinx Defense ganha contrato de $287 milhões para software de comunicações estrategicamente importantes", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 76296, "titulo": "NASA Astronaut Chris Williams to Discuss Space Station Mission", "url": "https://www.nasa.gov/news-release/nasa-astronaut-chris-williams-to-discuss-space-station-mission/", "fonte_id": "nasa_news", "data_pub": "2026-07-27T18:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O astronauta Chris Williams da NASA realizará uma conferência de imprensa no dia 4 de agosto às 14h45 (horário do EDT) para recapitular sua missão recente de oito meses a bordo da Estação Espacial Internacional. A transmissão será ao vivo em várias plataformas.", "titulo_pt": "Astronauta Chris Williams vai discutir missão na estação espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 75388, "titulo": "Jabuti Acadêmico tem livros finalistas anunciados; veja as obras em cada categoria", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/jabuti-academico-tem-livros-finalistas-anunciados-veja-as-obras-em-cada-categoria.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-27T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara Brasileira do Livro (CBL) divulgou as obras finalistas do 3º Prêmio Jabuti Acadêmico nesta segunda-feira, 27 de setembro de 2026.", "titulo_pt": "Jabuti Acadêmico anuncia livros finalistas; confira as categorias", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 76243, "titulo": "STAT+: Pharma’s drug spending deflection", "url": "https://www.statnews.com/2026/07/27/prescription-drug-spending-no-surprises-act-arbitration-costs-health-care-inc/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-27T18:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda temas relacionados ao setor farmacêutico, incluindo custos de medicamentos e a atualização da Lei sem Surpresas. Também menciona outros aspectos do setor de saúde.", "titulo_pt": "Pharma's drug spending deflection em português: lock de emprego, aumento dos custos dos medicamentos prescritos, atualizações da lei sem surpresas e mais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 76297, "titulo": "NASA Science Soars During August Total Solar Eclipse", "url": "https://science.nasa.gov/science-research/heliophysics/nasa-science-soars-during-august-total-solar-eclipse/", "fonte_id": "nasa_news", "data_pub": "2026-07-27T18:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada vez que a Lua cobre o Sol durante um eclipse solar total, criando uma escuridão inusitada durante o dia e revelando a coroa do Sol, surge uma nova oportunidade para melhor compreender nosso astro e sua influência na Terra. O próximo eclipse solar total ocorrerá em 12 de agosto, passando por Groenlândia e Islândia.", "titulo_pt": "NASA: ciência voja durante o Eclipse Solar Total de agosto", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 76293, "titulo": "Has NASA already found life on Mars?", "url": "https://www.scientificamerican.com/article/has-nasa-already-found-life-on-mars/", "fonte_id": "scientific_american", "data_pub": "2026-07-27T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns cientistas sugerem que na busca por vida passada e presente em Marte, temos sido excessivamente cautelosos ao avaliar evidências presentes.", "titulo_pt": "Já a NASA encontrou vida em marte?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 76298, "titulo": "NASA Astronaut Chris Williams Returns to Earth", "url": "https://www.nasa.gov/image-article/nasa-astronaut-chris-williams-returns-to-earth/", "fonte_id": "nasa_news", "data_pub": "2026-07-27T16:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O astronauta Chris Williams da NASA retornou à Terra no dia 26 de julho de 2026, após uma missão de oito meses na Estação Espacial Internacional. Ele trabalhou em várias investigações científicas e demonstrações de tecnologia durante sua primeira viagem espacial.", "titulo_pt": "Astronauta Chris Williams da NASA retorna à terra", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 75528, "titulo": "Implante que devolve visão 'perdida' com a idade é aprovado pela primeira vez no mundo", "url": "https://exame.com/ciencia/implante-que-devolve-visao-perdida-com-a-idade-e-aprovado-pela-primeira-vez-no-mundo/", "fonte_id": "exame", "data_pub": "2026-07-27T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O implante que recupera a visão perdida devido à idade foi aprovado pela primeira vez no mundo. O dispositivo, do tamanho aproximado da cabeça de um alfinete, é inserido cirurgicamente sob a retina e funciona em conjunto com óculos equipados com uma câmera.", "titulo_pt": "Implante que recupera visão 'perdida' com a idade é aprovado pela primeira vez no mundo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 76299, "titulo": "NASA’s Swift Sees ‘Wandering’ Mega Black Hole Shredding Star", "url": "https://science.nasa.gov/missions/swift/nasas-swift-sees-wandering-mega-black-hole-shredding-star/", "fonte_id": "nasa_news", "data_pub": "2026-07-27T16:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão Neil Gehrels Swift da NASA capturou um evento raro de um buraco negro 'orfanato' devorando uma estrela no limite de uma galáxia distante. Este é o primeiro caso conhecido em que isso ocorreu tão longe do centro da galáxia.", "titulo_pt": "Nasa’s Swift registra buraco negro 'orfanato' devorando estrela fora da galáxia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 76300, "titulo": "NASA to Cover Three US Spacewalks, Host Preview News Conference", "url": "https://www.nasa.gov/news-release/nasa-to-cover-three-us-spacewalks-host-preview-news-conference/", "fonte_id": "nasa_news", "data_pub": "2026-07-27T14:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA fornecerá cobertura para três caminhadas espaciais realizadas pelos astronautas na Estação Espacial Internacional em agosto, durante as quais serão atualizadas as placas solares, substituído um antena de comunicação e conectados cabos de energia e dados.", "titulo_pt": "NASA fornecerá cobertura para três caminhadas espaciais nos estados unidos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 75333, "titulo": "Nova novela das sete da Globo, 'Por Você' troca romance por amizade feminina", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/07/nova-novela-das-sete-da-globo-por-voce-troca-romance-por-amizade-feminina.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-27T22:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A novela 'Por Você', próxima das 19h da Globo, se centra na amizade entre duas mulheres e aborda temas como maternidade, luto e diferentes formatos de afeto. A trama é inspirada em uma história real e visa renovar a faixa horária.", "titulo_pt": "Nova novela das sete da Globo 'Por Você' troca romance Por amizade feminina", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 75334, "titulo": "Carly Simon afirma ter Parkinson e anuncia álbum com faixas inéditas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/carly-simon-afirma-ter-parkinson-e-anuncia-album-com-faixas-ineditas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-27T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cantora Carly Simon, de 83 anos, foi diagnosticada com doença de Parkinson. Ela anunciou o lançamento de um novo álbum com faixas inéditas após compreender seu diagnóstico.", "titulo_pt": "Carly Simon anuncia álbum com faixas inéditas e confirma diagnóstico de Parkinson", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 75453, "titulo": "Flip 2026 reúne 40 mil pessoas, aumento de 14% em relação a 2025", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-07/flip-2026-reune-40-mil-pessoas-aumento-de-14-em-relacao-2025", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-07-27T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 24ª Festa Literária Internacional de Paraty (Flip) recebeu 40 mil pessoas, um aumento de 14% em relação ao ano anterior. Apesar do investimento privado ter diminuído, o evento teve sucesso no Centro Histórico e nas ruas de Paraty.", "titulo_pt": "Flip 2026 reúne 40 mil pessoas, aumento de 14% em comparação com 2025", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 75335, "titulo": "Fundador do Inhotim cria museu de R$ 1 bilhão e 3.000 obras bem ao lado", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/plastico/2026/07/fundador-do-inhotim-cria-museu-de-r-1-bilhao-e-3000-obras-bem-ao-lado.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-27T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bernardo Paz, fundador do Instituto Inhotim, criou um novo museu com uma coleção de 3.000 obras de arte contemporânea avaliada em R$ 1 bilhão, utilizando 15 mil árvores e 40 galerias no povoado mineiro de Brumadinho.", "titulo_pt": "Fundador do Inhotim cria museu de R$ 1 bilhão com 3.000 obras ao lado", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 75829, "titulo": "The War That Shall Not Be Named", "url": "https://www.theatlantic.com/newsletters/2026/07/iran-war-trump-hiding-american-soldiers-death/688085/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-27T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump tentou de forma equivocada negar que estava em guerra, o que levou a uma tentativa de ocultação das mortes de soldados americanos.", "titulo_pt": "A guerra que não deve ser nomeada", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 75823, "titulo": "Museo de Australia devuelve a Rapa Nui 18 piezas de restos ancestrales: “Una historia marcada por el despojo”", "url": "https://www.latercera.com/culto/noticia/museo-de-australia-devuleve-a-rapa-nui-18-piezas-de-restos-ancestrales-una-historia-marcada-por-el-despojo/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T20:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Museu da Austrália devolveu 18 peças com restos ancestrais à ilha de Rapa Nui. Essa ação faz parte dos esforços da comunidade rapa nui para recuperar os restos extraídos durante os séculos XIX e XX, que hoje estão em coleções de museus e instituições ao redor do mundo.", "titulo_pt": "Museu da austrália devolve 18 peças com restos ancestrais a Rapa Nui", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 76161, "titulo": "[Jeffrey Frankel] A Cold War adventure in Portugal", "url": "https://www.koreaherald.com/article/10821860", "fonte_id": "korea_herald", "data_pub": "2026-07-27T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 50 anos, o autor estava em Lisboa trabalhando para o Banco de Portugal junto com quatro outros estudantes graduados da MIT, incluindo o futuro laureado do Nobel Paul Krugman. Pouco antes de sua chegada, Portugal havia acabado de romper seu regime ditatorial de 48 anos após a Revolução dos Cravos em 1974.", "titulo_pt": "[Jeffrey Frankel] uma aventura da guerra fria em Portugal", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 75454, "titulo" e teve um papel enorme na minha recuperação': o campeão do esporte que perdeu perna em acidente e conseguiu voltar às ondas", "url": "https://www.bbc.com/portuguese/articles/c629jkljd7yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-27T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Llywelyn Williams, campeão de surfe que perdeu uma perna em um acidente, relatou que o surfe desempenhou um papel crucial na sua recuperação. Ele afirma que tudo é possível para quem tem qualquer tipo de deficiência.", "titulo_pt": "O surfe foi fundamental na minha recuperação após perder a perna em acidente, diz campeão do esporte", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 75341, "titulo": "'Ocupação' celebra Helena Ignez como maior 'antimusa' radical do cinema e do teatro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/ocupacao-celebra-helena-ignez-como-maior-antimusa-radical-do-cinema-e-do-teatro.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-27T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Helena Ignez foi por décadas a musa do cinema novo e marginal, interpretando personagens variados, desde uma jovem tímida até uma mulher forte e sedutora. O documentário 'Ocupação' celebra-a como a maior antimusa radical no cinema e teatro.", "titulo_pt": "'Ocupação' homenageia Helena Ignez como maior antimusa radical do cinema e do teatro", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 75945, "titulo": "Peace activists Aziz Abu Sarah and Maoz Inon: 'The first step toward a shared society is to learn the other's narrative'", "url": "https://www.lemonde.fr/en/religions/article/2026/07/27/peace-activists-aziz-abu-sarah-and-maoz-inon-the-first-step-toward-a-shared-society-is-to-learn-the-other-s-narrative_6755891_63.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T o en Seattle: un menor de 15 años detenido como sospechoso del ataque que dejó tres muertos", "url": "https://www.clarin.com/mundo/tiroteo-seattle-menor-15-anos-detenido-sospechoso-ataque-dejo-muertos_0_WQRzd3ID40.html", "fonte_id": "clarin", "data_pub": "2026-07-27T20:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A prefeita da cidade informou que a polícia está procurando um segundo suspeito relacionado ao tiroteio ocorrido durante um festival de comida popular, que deixou três mortos e quatro feridos, incluindo uma criança de dois anos. Um menor de 15 anos já foi detido como suspeito.", "titulo_pt": "Tiroteio em Seattle: adolescente de 15 anos detido; polícia procura segundo suspeito", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 75537, "titulo": "Brasília recebe ato em homenagem às vítimas de terremoto na Venezuela", "url": "https://www.brasildefato.com.br/2026/07/27/brasilia-recebe-ato-em-homenagem-as-vitimas-de-terremoto-na-venezuela/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-27T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Movimentos populares e organizações de solidariedade realizam um ato em Brasília para homenagear as vítimas do terremoto que afetou a Venezuela no último dia 24 de junho. A atividade, marcada para às 17h, ocorrerá na sede da Embaixada da Venezuela e incluirá assinaturas em um ‘Livro de Condolências’.", "titulo_pt": "Brasília realiza ato em homenagem às vítimas do terremoto na Venezuela", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 75808, "titulo": "Estudiante de 2° básico es apuñalada por otra alumna de 13 años al interior de colegio en La Granja", "url": "https://www.latercera.com/nacional/noticia/estudiante-de-2-basico-es-apunalada-por-otra-alumna-de-13-anos-al-interior-del-colegio-de-la-granja/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T20:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma estudante do segundo ano fundamental foi esfaqueada por outra aluna de 13 anos dentro de uma escola em La Granja. A menor se encontra estável e fora de perigo vital no Hospital Padre Hurtado.", "titulo_pt": "Estudante do 2° ano é esfaqueada por colega de 13 anos em escola de La Granja", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 75525, "titulo": "Gênero, religião e renda: onde Lula e Flávio Bolsonaro têm mais força, segundo BTG/Nexus", "url": "https://exame.com/brasil/genero-religiao-e-renda-onde-lula-e-flavio-bolsonaro-tem-mais-forca-segundo-btg-nexus/", "fonte_id": "exame", "data_pub": "2026-07-27T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo BTG/Nexus indica que Lula tem uma vantagem maior entre as mulheres, enquanto Flávio Bolsonaro se destaca entre os eleitores evangélicos.", "titulo_pt": "Gênero, religião e renda: onde Lula e Flávio Bolsonaro têm mais força, segundo BTG/Nexus", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 75947, "titulo": "Macron travels to fire-affected Southwest: 'We will win this battle together'", "url": "https://www.lemonde.fr/en/environment/article/2026/07/27/macron-to-travel-to-fire-affected-southwest_6755890_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T14:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em áreas afetadas por incêndios perto de Bordeaux, mais de 40 mil hectares de floresta pinheira foram queimados, destruindo 240 casas e fazendo cerca de 220 mil pessoas se deslocarem. O presidente Macron viajou para a região afetada.", "titulo_pt": "Macron visita região afetada pelos incêndios: 'vamos vencer esta batalha juntos'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 75853, "titulo": "Baby missing after mother and toddler found dead off coast of South Australia", "url": "https://www.theguardian.com/australia-news/2026/jul/27/baby-missing-after-mother-and-toddler-found-dead-off-coast-of-south-australia-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-07-27T14:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ocorreu um trágico incidente na costa de South Australia, onde as equipes de emergência recuperaram os corpos de uma mãe e seu bebê menor de idade das águas abaixo de penhascos perigosos. Um bebé está desaparecido após a descoberta de um veículo com o motor ligado num estacionamento próximo aos penhascos em Cape Northumberland, perto da cidade de Port Macdonnell.", "titulo_pt": "Bebé desaparece após mãe e filho pequeno serem encontrados mortos na costa de South Australia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 75951, "titulo": "Three women hospitalized after Paris knife attack", "url": "https://www.lemonde.fr/en/france/article/2026/07/27/three-women-hospitalized-after-paris-knife-attack_6755882_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T13:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três mulheres foram hospitalizadas após uma agressão com faca em Paris, França. O ministro do Interior francês informou que as vidas das vítimas não estão em perigo. A identidade do suspeito, que foi detido, ainda não foi divulgada.", "titulo_pt": "Três mulheres hospitalizadas após agressão com faca em Paris", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 75953, "titulo": "'Monster wildfires' in Spain bring solidarity and political unity", "url": "https://www.lemonde.fr/en/environment/article/2026/07/27/monster-wildfires-in-spain-bring-solidarity-and-political-unity_6755874_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T10:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais em andamento perto de Madrid e, desde sábado, perto de Valencia, já queimaram mais de 83.000 hectares e levaram à evacuação de 82.000 residentes.", "titulo_pt": "Grandes incêndios no espaço trazem solidariedade e unidade política", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 74940, "titulo": "Las preguntas e incertidumbres que deja el Plan Integral de Vivienda y Urbanismo", "url": "https://www.latercera.com/opinion/noticia/las-preguntas-e-incertidumbres-que-deja-el-plan-integral-de-vivienda-y-urbanismo/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O plano integral de habitação e urbanismo levanta várias perguntas e incertezas. O documento não fornece detalhes específicos sobre os desafios ou conclusões finais.", "titulo_pt": "As dúvidas e incertezas deixadas pelo plano Integral de habitação e Urbanismo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 75854, "titulo": "France and Spain race to contain huge wildfires before fresh heatwave begins", "url": "https://www.theguardian.com/world/2026/jul/27/france-and-spain-race-to-contain-huge-wildfires-before-fresh-heatwave-begins", "fonte_id": "guardian_world", "data_pub": "2026-07-27T22:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os incêndios florestais na França e Espanha estão sendo controlados com urgência antes de uma nova onda de calor desta semana complicar as operações. Os dias de segunda e terça-feira são considerados críticos pelos responsáveis pela contenção dos incêndios.", "titulo_pt": "França e Espanha correm contra o tempo para conter grandes incêndios antes da nova onda de calor", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 75472, "titulo": "República Democrática do Congo tem mais de mil novos casos de ebola em 10 dias", "url": "https://veja.abril.com.br/mundo/republica-democratica-do-congo-tem-mais-de-mil-novos-casos-de-ebola-em-10-dias/", "fonte_id": "veja", "data_pub": "2026-07-27T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O surto de ebola na República Democrática do Congo registrou mais de mil novos casos nos últimos 10 dias. O surto começou no final de abril e já se alastrou para a Uganda.", "titulo_pt": "República Democrática do Congo registra mais de mil novos casos de ebola em 10 dias", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 75646, "titulo": "Equipe da CNN visita área devastada pelas chamas na Espanha", "url": "https://www.cnnbrasil.com.br/internacional/equipe-da-cnn-visita-area-devastada-pelas-chamas-na-espanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fogo fora de controle obrigou mais de 75 mil pessoas a deixarem suas casas na Espanha. Um correspondente da CNN relatou sobre uma área ainda afetada pelas chamas.", "titulo_pt": "Equipe da CNN visita área devastada pelas chamas na Espanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76117, "titulo": "France and Spain race to curb wildfires before new heatwave arrives", "url": "https://www.scmp.com/news/world/europe/article/3362048/france-and-spain-race-curb-wildfires-new-heatwave-arrives?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Combustionistas tentavam aproveitar o tempo mais favorável para conter incêndios florestais que ameaçam a cidade e região turística de Bordeaux, na França, e vários locais na vizinha Espanha. As autoridades evacuaram cerca de 220 mil pessoas, incluindo férias e moradores locais, enquanto se espera um novo calor extremo para os dois países em breve.", "titulo_pt": "França e Espanha correm contra o tempo para conter incêndios antes de nova onda de calor", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 76087, "titulo": "France and Spain brace for more extreme heat as wildfires rage", "url": "https://www.ft.com/content/45867580-65a2-4a7d-ba4c-8143e86f4e36?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-27T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente francês Emmanuel Macron advertiu que as próximas semanas serão difíceis devido aos incêndios florestais. A França e Espanha estão se preparando para enfrentar temperaturas extremamente altas, enquanto os incêndios continuam a se espalhar.", "titulo_pt": "França e Espanha se preparam para calor extremo com incêndios florestais em curso", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 75831, "titulo": "Photos: Wildfires Rage Across France and Spain", "url": "https://www.theatlantic.com/photography/2026/07/photos-wildfires-rage-across-france-and-spain/688077/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-27T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de milhares de residentes foram evacuados nas regiões da França e Espanha, enquanto equipes de bombeiros lutam contra várias chamas. A previsão é de calor extremo nos próximos dias, o que pode agravar ainda mais as condições.", "titulo_pt": "Fotos: incêndios devastam regiões da França e Espanha", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 75856, "titulo": "‘It felt like being in a disaster movie’: uncertainty after evacuation from France’s Gironde wildfire", "url": "https://www.theguardian.com/world/2026/jul/27/it-felt-like-being-in-a-disaster-movie-inside-the-evacuation-from-frances-bordeaux-wildfires", "fonte_id": "guardian_world", "data_pub": "2026-07-27T16:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes relataram o medo que sentiram ao serem forçados a deixar suas casas devido ao incêndio 'extremamente intenso' na região da Gironde, em França. Um estranho nuvem preta fez o céu escurecer durante o dia e um cheiro amargo de fumaça foi sentido no ar.", "titulo_pt": "Era como estar em um filme de desastre: incerteza após evacuação por causa do incêndio na Gironde, França", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 76009, "titulo": "Spain wildfires leave destruction across Ávila province", "url": "http://www.euronews.com/video/2026/07/27/spain-wildfires-leave-destruction-across-avila-province", "fonte_id": "euronews", "data_pub": "2026-07-27T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais estão sendo combatidos por bombeiros no centro da Espanha, e as casas queimadas, carros destruídos e paisagens escurecidas mostram o grau de destruição na província de Ávila.", "titulo_pt": "Incêndios florestais causam destruição em Ávila", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 76004, "titulo": "Europe wildfire in pictures: Gigantic fire cloud engulfing France, Spain regions", "url": "https://www.cnbc.com/2026/07/27/wildfire-pictures-spain-france-bordeaux-heatwave.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio raro está se espalhando pelo Vale do Bordéus, na França, e chegou a regiões ocidentais da Espanha, incluindo Madrid. O fogo gerou uma nuvem que pode produzir seus próprios temporais.", "titulo_pt": "Incêndio em imagens: nuvem de fogo gigante engolfando regiões do bordéus e madrid", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 75874, "titulo": "Kashagan Environmental Fine Enforced in Kazakhstan", "url": "https://thediplomat.com/2026/07/kashagan-environmental-fine-enforced-in-kazakhstan/", "fonte_id": "the_diplomat", "data_pub": "2026-07-27T13:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um congelamento de ativos poderia ser o primeiro passo para um conflito tenso com as maiores empresas estrangeiras de petróleo que estão desenvolvendo uma das maiores jazidas de petróleo do país.", "titulo_pt": "Multas ambientais na kashagan podem liderar conflitos com grandes empresas estrangeiras", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 75942, "titulo": "One map to visualize the fires in southwestern France", "url": "https://www.lemonde.fr/en/les-decodeurs/article/2026/07/27/one-map-to-visualize-the-fires-in-southwestern-france_6755878_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T12:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o dia 22 de julho, França enfrenta duas grandes e devastadoras queimadas no sul ocidental do país que ainda não estão sob controle.", "titulo_pt": "Uma única mapa para visualizar os incêndios nos sul-oeste da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 75943, "titulo": "On the front lines with firefighters and volunteers defending Bordeaux from a monster fire", "url": "https://www.lemonde.fr/en/environment/article/2026/07/27/on-the-front-lines-with-firefighters-and-volunteers-defending-bordeaux-from-a-monster-fire_6755876_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande incêndio se aproximou dos subúrbios ocidentais de Bordeaux no domingo, obrigando bombeiros e voluntários a realizar manobras contínuas para reorganizar suas posições e combater as chamas, localizadas apenas 15 quilômetros da cidade.", "titulo_pt": "Na linha de frente com bombeiros e voluntários combatendo um grande incêndio perto de Bordeaux", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 76014, "titulo": "Waste pickers work at Indonesia's largest landfill", "url": "http://www.euronews.com/video/2026/07/27/waste-pickers-work-at-indonesias-largest-landfill", "fonte_id": "euronews", "data_pub": "2026-07-27T10:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Recicladores de lixo no maior aterro sanitário da Indonésia, Bantargebang, estão preocupados com o futuro do seu trabalho à medida que o governo implementa regras mais rígidas sobre descarte aberto e reformula a gestão do resíduo.", "titulo_pt": "Recicladores de lixo temem pela sua sobrevivência no maior aterro da indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 74939, "titulo": "MOP estima hasta US$ 700 millones para reconstrucción en Atacama y Coquimbo tras temporal", "url": "https://www.latercera.com/nacional/noticia/mop-estima-hasta-us-700-millones-para-reconstruccion-en-atacama-y-coquimbo-tras-temporal/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministério de Obras Públicas (MOP) estima que a reconstrução nas regiões de Atacama e Coquimbo, afetadas por um temporal, custará até 700 milhões de dólares. Foram registrados danos significativos, incluindo 358 estradas interrompidas, 17 pontes inoperantes e 308 sistemas de água potável rurais paralisados.", "titulo_pt": "MOP estima até r$ 700 milhões para reconstrução em Atacama e Coquimbo após temporal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 75074, "titulo": "Spain and France wildfires force more than 300,000 to flee as Macron calls crisis meeting", "url": "https://www.cnbc.com/2026/07/27/wildfires-spain-france-bordeaux-heatwave.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chamas gigantescas no Vale do Bordéus, na França, e na Espanha obrigaram mais de 300 mil pessoas a deixar suas casas. O ministro local disse que o impacto econômico foi como um 'trovão'.", "titulo_pt": "Incêndios na França e Espanha fazem mais de 300 mil pessoas fugirem; Macron convoca reunião para discutir crise", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74814, "titulo": "Incêndios florestais em Madri seguem “fora de controle”, dizem autoridades", "url": "https://www.cnnbrasil.com.br/internacional/incendios-florestais-em-madri-seguem-fora-de-controle-dizem-autoridades/", "fon nir o futuro de milhares de descendentes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 75692, "titulo": "Una cautelar suspendió el decreto del Gobierno que impedía a menores de 18 años acceder a tratamientos de cambio de género", "url": "https://www.lanacion.com.ar/sociedad/una-cautelar-suspendio-el-decreto-del-gobierno-que-impedia-a-menores-de-18-anos-acceder-a-nid27072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T22:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma medida cautelar suspendeu um decreto do governo que proibia menores de 18 anos de acessarem tratamentos de mudança de gênero. Agora, as obras sociais, prepagas e hospitais públicos devem garantir a continuidade desses tratamentos.", "titulo_pt": "Medida cautelar suspende decreto que proibia menores de 18 anos de acessarem tratamentos de mudança de gênero", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 75847, "titulo": "Pinochet-era soldier jailed for killing folk singer Víctor Jara 53 years ago", "url": "https://www.theguardian.com/world/2026/jul/27/pinochet-era-soldier-jailed-for-killing-folk-singer-victor-jara-chile", "fonte_id": "guardian_world", "data_pub": "2026-07-27T16:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nelson Haase Mazzei, um coronel aposentado, foi condenado após 53 anos por matar o cantor folk chileno Víctor Jara. Mazzei havia fugido das autoridades em 2023 após ser sentenciado em julgamento em seu absenteismo junto com outros seis soldados aposentados.", "titulo_pt": "Soldado da era pinochet condenado pelo assassinato do cantor folk Víctor Jara há 53 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 75857, "titulo": "‘I knew what he had done to those boys’: murderer to stay in jail after journalist’s fight for justice", "url": "https://www.theguardian.com/uk-news/2026/jul/27/murderer-stay-jail-journalist-fight-justice-allan-grimson", "fonte_id": "guardian_world", "data_pub": "2026-07-27T14:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ros Astengo, uma jornalista baseada em Gibraltar que geralmente se dedica a questões políticas e sociais, inspirou quatro homens a denunciarem os abusos sexuais cometidos pelo suspeito de ser um serial killer Allan Grimson nos anos 1990. Ela temia reabrir feridas para sobreviventes de Grimson, mas também se preocupava com sua própria segurança ao investigar o caso.", "titulo_pt": "‘Eu sabia do que ele tinha feito com aqueles garotos’: assassino permanecerá preso após luta jornalística pela justiça", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 75675, "titulo": "Cuando la democracia se apaga a plena luz del día: la lección de Nicaragua", "url": "https://www.ciperchile.cl/2026/07/27/cuando-la-democracia-se-apaga-a-plena-luz-del-dia-la-leccion-de-nicaragua/?utm_source=rss&utm_medium=rss&utm_campaign=cuando-la-democracia-se-apaga-a-plena-luz-del-dia-la-leccion-de-nicaragua", "fonte_id": "ciper_chile", "data_pub": "2026-07-27T12:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título refere-se a um artigo que discute como a democracia pode ser suprimida de maneira aberta, usando o exemplo da Nicarágua. O texto original foi publicado no CIPER Chile.", "titulo_pt": "Quando a democracia se apaga em plena luz do dia: a lição da nicarágua", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 74765, "titulo": "Lei cria cadastro de condenados por violência contra a mulher no DF", "url": "https://www.metropoles.com/distrito-federal/lei-cria-cadastro-de-condenados-por-violencia-contra-a-mulher-no-df", "fonte_id": "metropoles", "data_pub": "2026-07-27T10:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei criará um cadastro distrital para condenados por violência contra a mulher no Distrito Federal, contendo informações como nome, foto, CPF, RG, endereço e detalhes da condenação. O acesso será restrito às autoridades.", "titulo_pt": "Lei cria cadastro de condenados por violência contra a mulher no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 75136, "titulo": "Concerns increasing over radio for abductees in North Korea", "url": "https://www.japantimes.co.jp/news/2026/07/27/japan/north-korea-abductees-radio/", "fonte_id": "japan_times", "data_pub": "2026-07-27T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rádio que transmite mensagens para refugiados abduzidos na Coreia do Norte pode ser interrompido devido ao equipamento obsoleto, à diminuição da necessidade dessas estações e às tensões no Oriente Médio.", "titulo_pt": "Temores crescentes sobre o rádio para refugiados abduzidos na Coreia do norte", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 75087, "titulo": "Pregnant Palestinian woman loses child after Israeli forces obstruct ambulance", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/pregnant-palestinian-woman-miscarries-after-israeli-forces-obstruct", "fonte_id": "middle_east_eye", "data_pub": "2026-07-27T07:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher palestiniana grávida da cidade de Qaryut, perto de Nablus, perdeu seu bebê após forças israelenses obstruírem a passagem de uma ambulância no checkpoint militar Awarta. Segundo relatos, os médicos foram impedidos de passar e um membro da equipe médica foi detido enquanto a grávida, que estava na sexta semana de gestação, sofreu uma busca intensa.", "titulo_pt": "Mulher grávida palestiniana perde bebê após forças israelenses obstruírem ambulância", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 75145, "titulo": "Gaza teen triumphs in school despite war, loss and displacement", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/society/gaza-teen-war-loss-displacement/", "fonte_id": "japan_times", " const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
