ta_de": null, "texto_pt": "As ações de tecnologia caem em bolsas de valores de Europa e Ásia, mesmo após a estreia bem-sucedida da empresa criadora do Claude AI. O IPO da Anthropic não conseguiu reaquecer o interesse no mercado de inteligência artificial.", "titulo_pt": "Ações de tecnologia declinam com IPO da Anthropic insuficiente para revigorar mercado de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 276782, "titulo": "S. Korea declines to review Tesla's FSD exemption request", "url": "https://en.yna.co.kr/view/AEN20261120007100320", "fonte_id": "yonhap_news", "data_pub": "2026-11-20T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministração de transporte da Coreia do Sul declarou que não vai revisar a solicitação de exceção do Tesla para o FSD (Autopilot Full Self-Driving).", "titulo_pt": "Coreia do sul nega revisão de solicitação de exceção do Tesla para FSD", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 276188, "titulo": "Google ameaça seu próprio negócio de buscas com investida em IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/google-ameaca-seu-proprio-negocio-de-buscas-com-investida-em-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marshall Evans, um profissional de marketing que trabalha com pequenos negócios há mais de uma década, ajuda empresas de reparos residenciais, estúdios de ginástica e outras firmas familiares a comprar anúncios na busca do Google. A empresa enfrenta uma ameaça de investimento em inteligência artificial que pode impactar seu próprio negócio de buscas.", "titulo_pt": "Google ameaça seu próprio negócio de buscas com investida em IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276191, "titulo": "Alguns dos maiores investidores do golfo Pérsico apostaram bilhões de dólares na Anthropic", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/alguns-dos-maiores-investidores-do-golfo-persico-apostaram-bilhoes-de-dolares-na-anthropic.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alguns dos maiores investidores do Golfo Pérsico investiram bilhões de dólares na Anthropic, um laboratório americano de inteligência artificial de ponta. Os países árabes do Golfo estão atentos à estreia da Anthropic no mercado.", "titulo_pt": "Alguns dos maiores investidores do golfo Pérsico apostaram bilhões na Anthropic", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 276907, "titulo": "Dark Eden author Chris Beckett on how sci-fi needs ‘surface plausibility’", "url": "https://www.newscientist.com/article/2599932-dark-eden-author-chris-beckett-on-how-sci-fi-needs-surface-plausibility/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-20T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chris Beckett, autor do livro Dark Eden, que foi o livro escolhido para o Book Club do New Scientist em novembro, conversa com Alison Flood sobre como escreveu seu romance vencedor do Arthur C Clarke Award.", "titulo_pt": "O autor dark Eden, Chris Beckett, sobre a necessidade de 'plausibilidade superficial' na ficção científica", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 276853, "titulo": "Patients have little say in how brain implant trials are done. Ian Burkhart wants to change that", "url": "https://www.statnews.com/2026/11/20/ian-burkhart-how-brain-implant-trials-can-serve-patients-better/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ian Burkhart, fundador de uma coalizão de participantes em ensaios de implantes cerebrais, afirma que os desenvolvedores de dispositivos deveriam dar mais poder às pessoas participantes na pesquisa.", "titulo_pt": "Paciente quer mais controle nos ensaios de implantes cerebrais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 276855, "titulo": "Opinion: More doctors should prescribe exercise after a concussion", "url": "https://www.statnews.com/2026/11/20/concussion-exercise-dark-room-leddy-robert-perske-cardiology/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor relata que praticamente todos que cuidaram dele estavam tentando mantê-lo seguro. No entanto, ele sentiu que precisava se esforçar mais.", "titulo_pt": "Opinião: mais médicos deveriam prescrever exercícios após um traumatismo craniano", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 276856, "titulo": "Opinion: More surgeons in Africa isn’t enough when only 10% are women", "url": "https://www.statnews.com/2026/11/20/women-surgeon-shortage-global-cosecsa-lancet-commission-mukagaju-africa-making-of-a-surgeon/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sistemas criados para expandir a cirurgia global não são obrigados a monitorar o número de cirurgiões mulheres.", "titulo_pt": "Opinião: mais cirurgiões em áfrica não basta se apenas 10% são mulheres", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 276415, "titulo": "Científicos descubren una nueva forma de cáncer de próstata hereditario: esto dice su investigación", "url": "https://www.latercera.com/tendencias/noticia/cientificos-descubren-una-nueva-forma-de-cancer-de-prostata-hereditario-esto-dice-su-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram uma nova forma de câncer de próstata hereditário. Os achados permitem o desenvolvimento de programas de testes genéticos que podem auxiliar na identificação de famílias em risco e na detecção precoce da doença.", "titulo_pt": "Cientistas descobrem nova forma de câncer de próstata hereditário: isso diz sobre a pesquisa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 276416, "titulo": "Usar un purificador de aire podría favorecer unos niveles saludables de azúcar en sangre, sugiere un nuevo estudio", "url": "https://www.latercera.com/tendencias/noticia/usar-un-purificador-de-aire-podria-favorecer-unos-niveles-saludables-de-azucar-en-sangre-sugiere-un-nuevo-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo sugere que o uso de um purificador de ar no quarto durante um mês pode beneficiar as pessoas com prediabetes, proporcionando uma maior estabilidade nos níveis diários de açúcar no sangue e uma redução nos picos de açúcar após o café da manhã.", "titulo_pt": "Uso de purificador de ar pode favorecer níveis saudáveis de açúcar no sangue em pessoas com prediabetes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 276159, "titulo": "Cientistas conseguem cultivar batatas em solo que imita o da Lua", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/cientistas-conseguem-cultivar-batatas-em-solo-que-imita-o-da-lua.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas cultivaram batatas em um solo que imita o lunar, um experimento apoiado pela Nasa e descrito em um artigo publicado na revista npj Microgravity. O resultado indica uma possível fonte de alimento para humanos em bases futuras na Lua.", "titulo_pt": "Cientistas cultivam batatas em solo lunar simulado", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 276908, "titulo": "The secret maths problems hidden throughout Japan", "url": "https://www.newscientist.com/article/2599802-the-secret-maths-problems-hidden-throughout-japan/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-20T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há centenas de anos, matemáticos japoneses gravaram suas equações matemáticas em tabuleiros de madeira pintados, que foram expostos em todo o país. Esse artigo explora a história desse prática chamada sangaku e os esforços para preservá-las digitalmente.", "titulo_pt": "Os segredos da matemática ocultos em tabuleiros de madeira pelo Japão", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 276865, "titulo": "UN climate talks enter crunch time with no deal in sight", "url": "https://phys.org/news/2026-11-climate-crunch-sight.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas da COP31 da ONU entram na fase final nesta sexta-feira, com os países em divisão sobre um projeto de acordo que não menciona os combustíveis fósseis, o que pode levar as negociações a um prazo estendido.", "titulo_pt": "Negociações climáticas da ONU entram na fase final sem acordo sobre combustíveis fósseis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276866, "titulo": "Fiona the hippo dies after failed effort to remove swallowed hat", "url": "https://phys.org/news/2026-11-fiona-hippo-dies-effort-swallowed.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A hipopótamo famosa Fiona faleceu após várias tentativas infrutíferas dos veterinários de remover um chapéu de lã que ela engoliu acidentalmente, conforme anunciado pelo Zoológico de Cincinnati.", "titulo_pt": "Fiona, a hipopótamo, morre após falha na remoção do chapéu engolido", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276867, "titulo": "Nature's multilayered defenses against crop pests and viruses revealed", "url": "https://phys.org/news/2026-11-nature-multilayered-defenses-crop-pests.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Nottingham, em colaboração com a Syngenta e a Universidade de Keele, descobriram como uma híbrida de cevada comercial utiliza três defesas naturais complementares para se proteger contra acelidos e os vírus danosos que eles espalham. Esses achados podem auxiliar os criadores de plantas a desenvolver culturas com proteção natural mais forte contra pragas e doenças.", "titulo_pt": "Defesas multifacetadas da natureza contra pragas e vírus em culturas de cevada reveladas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 276909, "titulo": "The BepiColombo spacecraft is finally entering orbit around Mercury", "url": "https://www.newscientist.com/article/2599799-the-bepicolombo-spacecraft-is-finally-entering-orbit-around-mercury/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-20T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de uma viagem de oito anos em direção ao sol, o foguete BepiColombo finalmente pode iniciar sua missão de desvendar os muitos mistérios do planeta Mercúrio, o menor da nossa sistema solar.", "titulo_pt": "O foguete BepiColombo finalmente entra em órbita ao redor do mercúrio", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 276857, "titulo": "STAT+: UnitedHealth sues to reverse downgraded Medicare Advantage quality scores", "url": "https://www.statnews.com/2026/11/20/unitedhealth-cms-medicare-advantage-lawsuit-star-rating/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UnitedHealth Group ingressou na lista de seguradoras que têm processado o governo federal por baixar as avaliações do Medicare Advantage, com valores bilionários em jogo.", "titulo_pt": "Unitedhealth processa governo por baixada nas avaliações do Medicare Advantage", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 276717, "titulo": "Measles is officially back — to America’s shame", "url": "https://www.japantimes.co.jp/commentary/2026/11/20/world/americas-measles-officially-back/", "fonte_id": "japan_times", "data_pub": "2026-11-20T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos registrou 7.700 casos de sarampo e 13 mortes causadas pelo vírus desde o início do ano passado, com a doença se espalhando continuamente por um ano.", "titulo_pt": "Sarampo está oficialmente de volta — vergonha dos estados unidos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 276894, "titulo": "APOD: 2026 November 20 – V-G-R", "url": "https://science.nasa.gov/image-article/apod-2026-november-20-v-g-r/", "fonte_id": "nasa_news", "data_pub": "2026-11-20T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da Astronomy Picture of the Day (APOD) para o dia 20 de novembro de 2026 apresenta a configuração V-G-R. Esta configuração ocorrerá em 17 de novembro de 2026.", "titulo_pt": "APOD: 2026 novembro 20 – V-G-R", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 276895, "titulo": "The Stormy Southwest Pacific", "url": "https://science.nasa.gov/earth/earth-observatory/the-stormy-southwest-pacific/", "fonte_id": "nasa_news", "data_pub": "2026-11-20T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ciclone tropical Xavier iniciou a temporada de tempestades no sul-oeste do Pacífico com grande intensidade.", "titulo_pt": "O ciclone tropical xavier inicia a temporada de tempestades", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 276277, "titulo": "Dia da Consciência Negra: veja 8 educadores negros que mudaram o ensino", "url": "https://www.cnnbrasil.com.br/educacao/dia-da-consciencia-negra-veja-8-educadores-negros-que-mudaram-o-ensino/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Educadores negros têm contribuído com reflexões e pesquisas sobre o combate ao racismo e sexismo na educação ao longo das últimas décadas. Este artigo destaca 8 educadores negros que têm feito essa importante contribuição.", "titulo_pt": "Dia da Consciência Negra: veja 8 educadores negros que mudaram o ensino", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276470, "titulo": "Marián Farías Gómez: del recuerdo de su hermano Chango y los Huanca Hua al día que conoció a Monserrat Caballé", "url": "https://www.lanacion.com.ar/espectaculos/musica/marian-farias-gomez-del-recuerdo-de-su-hermano-chango-y-los-huanca-hua-al-dia-que-conocio-a-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Marián Farías Gómez, contadora de histórias com 82 anos, retorna aos clássicos com um novo álbum após ter começado sua carreira com Los Huanca Hua aos 18 anos; ela deseja encerrar sua carreira com esse projeto.", "titulo_pt": "Marián Farías Gómez: da lembrança do irmão Chango e los Huanca Hua ao dia que conheceu Monserrat Caballé", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 276236, "titulo": "Iza mergulha no reggae – e celebra a ligação do ritmo jamaicano com o Brasil", "url": "https://veja.abril.com.br/cultura/iza-mergulha-no-reggae-e-celebra-a-ligacao-do-ritmo-jamaicano-com-o-brasil/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A artista Iza explorou o gênero reggae em suas performances. O ritmo reggae já inspirou diversos artistas brasileiros, desde os tropicalistas até os locutores de rádios em São Luís, no Maranhão.", "titulo_pt": "Iza mergulha no reggae – e celebra a ligação do ritmo jamaicano com o Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276903, "titulo": "British Library to outsource security and ‘repurpose’ reading rooms as business spaces", "url": "https://www.theguardian.com/books/2026/nov/20/british-library-outsource-security-reading-rooms-business-spaces", "fonte_id": "guardian_culture", "data_pub": "2026-11-20T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O British Library planeja transferir a segurança para uma empresa privada e transformar três de seus salas de leitura públicas em espaços de aluguel para negócios, causando indignação. Os guardas foram informados que suas posições serão assumidas por um contrato privado a partir de 1º de dezembro.", "titulo_pt": "British Library vai outsourcingizar segurança e 'reutilizar' salas de leitura como espaços empresariais", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 276793, "titulo": "Korea’s culture minister wants to make dancing at gigs legal", "url": "https://www.koreaherald.com/article/10944395", "fonte_id": "korea_herald", "data_pub": "2026-11-20T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Cultura da Coreia do Sul, Chae Hwi-young, anunciou que o governo revisará a Lei para Promoção da Indústria Musical para incluir a dança em clubes de shows vivos. A intenção é legalizar a dança em estabelecimentos como clubes, que atualmente podem ser fechados por permitir danças durante concertos.", "titulo_pt": "Ministro da cultura da Coreia do sul quer legalizar dança em shows ao vivo", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 276711, "titulo": "From ukiyo-e to ‘Godzilla,’ where do Japanese monsters stand in the Asian imagination?", "url": "https://www.japantimes.co.jp/culture/2026/11/20/art/japanese-monsters-asian-art-exhibition-hong-kong/", "fonte_id": "japan_times", "data_pub": "2026-11-20T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição 'Myths and Monsters: The Art of Fantasy in Asia' apresenta cerca de 430 obras, abrangendo dois séculos de narrativas asiáticas, com destaque para o Japão.", "titulo_pt": "De ukiyo-e a 'Godzilla', onde ficam os monstros japoneses na imaginação asiática?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 276742, "titulo": "Oman’s rising commercial ties with China revive the Zheng He spirit", "url": "https://www.scmp.com/opinion/world-opinion/article/3374839/omans-rising-commercial-ties-china-revive-zheng-he-spirit", "fonte_id": "scmp", "data_pub": "2026-11-20T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um monumento em forma de vela foi erguido em Salalah, Oman, em 2023, em homenagem ao explorador chinês Zheng He, que viajou ao país no século XV. As relações comerciais entre China e Oman continuam a evoluir, com discussões recentes em Beijing focando em tecnologias avançadas.", "titulo_pt": "A ascensão das relações comerciais entre omã e China revive o espírito de Zheng He", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 276796, "titulo": "Singapore Writers Festival looks beneath the surface", "url": "https://www.koreaherald.com/article/10944368", "fonte_id": "korea_herald", "data_pub": "2026-11-20T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Festival de Escritores de Singapura, organizado pelo Arts House Group, abordou temas como serial killers, inteligência artificial, ansiedade climática e identidade cultural, todos reunidos sob o tema 'O que est ", "classe": "B"}, {"id": 276309, "titulo": "Titular da SAP do Ceará já defendeu prática de quebrar dedos de presos", "url": "https://www.metropoles.com/colunas/alfredo-henrique/titular-da-sap-do-ceara-ja-defendeu-pratica-de-quebrar-dedos-de-presos", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário da Secretaria de Administração Penitenciária (SAP) do Ceará foi filmado usando spray de pimenta contra presos sem resistência aparente. Em 2017, ele já havia defendido a prática de quebrar os dedos dos presos.", "titulo_pt": "Titular da SAP do Ceará filmado usando spray de pimenta e já defendeu quebrar dedos de presos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276504, "titulo": "Vape users hospitalised after losing consciousness, prompting public health warning in New South Wales", "url": "https://www.theguardian.com/australia-news/2026/nov/20/vape-users-hospitalised-after-losing-consciousness-prompting-public-health-warning-in-new-south-wales", "fonte_id": "guardian_world", "data_pub": "2026-11-20T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três usuários de e-cigarettes que perderam a consciência e foram hospitalizados em Nova South Wales testaram positivo para etomidato, um sedativo forte e rápido-atingente usado como anestésico geral no exterior, mas não registrado para uso médico na Austrália. A saúde pública do estado emitiu um alerta público sobre líquidos de e-cigarette contendo etomidato.", "titulo_pt": "Usuários de e-cigarros hospitalizados após perda de consciência motivam alerta sanitário em nova South Wales", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 276289, "titulo": "Consciência Negra: Congresso tem ao menos 57 propostas de inclusão", "url": "https://www.cnnbrasil.com.br/politica/consciencia-negra-congresso-tem-ao-menos-57-propostas-de-inclusao/", "fonte_id": "cnn_brasil", "data_pub": orreram na região do norte dos rios do estado.", "titulo_pt": "Bebe nascido com anomalias cardíacas 'não teve chance' após nascimento não-médico gratuito, ouviu-se em inquérito de NSW", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 276298, "titulo": "Mulheres negras são 65% das vítimas de feminicídio no país, diz relatório", "url": "https://www.cnnbrasil.com.br/nacional/brasil/mulheres-negras-sao-65-das-vitimas-de-feminicidio-no-pais-diz-relatorio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório indica que 65% das vítimas de feminicídio no Brasil são mulheres negras. O Dia Nacional da Consciência Negra foi usado para destacar a importância do combate à misoginia em conjunto com a luta contra a discriminação racial.", "titulo_pt": "Mulheres negras são 65% das vítimas de feminicídio no país, diz relatório", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276299, "titulo": "Pai lança livro em homenagem a estudante de medicina morto em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/pai-lanca-livro-em-homenagem-a-estudante-de-medicina-morto-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T06:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Julio Navarro escreveu um livro em memória do filho falecido durante uma abordagem policial em 2024.", "titulo_pt": "Pai lança livro em homenagem a estudante de medicina morto em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276300, "titulo": "Chance de uma pessoa negra ser assassinada é 2,7 vezes maior, diz relatório", "url": "https://www.cnnbrasil.com.br/nacional/brasil/chance-de-uma-pessoa-negra-ser-assassinada-e-27-vezes-maior-diz-relatorio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T06:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que a chance de uma pessoa negra ser assassinada é 2,7 vezes maior do que a de outras etnias. O aumento de episódios de discriminação e injúria racial acompanha o crescimento do temor da violência na comunidade negra.", "titulo_pt": "Chance de uma pessoa negra ser assassinada é 2,7 vezes maior, diz relatório", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276670, "titulo": "‘We don’t want our future decided by the military’: Young Germans protest", "url": "https://www.aljazeera.com/news/2026/11/20/we-dont-want-our-future-decided-by-the-military-young-germans-protest?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jovens alemães estão se manifestando contra a conscrição militar antes de um grande evento nacional marcado para este fim de semana. Eles explicam as razões para sua resistência.", "titulo_pt": "Nós não queremos que nosso futuro seja decidido pela militarização: jovens alemães se opõem à conscrição", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 276784, "titulo": "Tents forcibly removed from site of ballot shortage protest after 169 days", "url": "https://en.yna.co.kr/view/AEN20261120005500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-20T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades sul-coreanas começaram a remover forçosamente tendas e outros materiais de um local onde manifestantes protestavam por uma escassez de votação após 169 dias.", "titulo_pt": "Tendas removidas após 169 dias de protesto por escassez de urnas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 276421, "titulo": "Senado despacha Presupuesto 2027: aprueban partidas de Educación y Mujer, pero rechazan fondos de Agricultura", "url": "https://www.latercera.com/nacional/noticia/despachan-del-senado-presupuesto-2027-aprueban-partidas-de-educacion-y-mujer-pero-rechazan-fondos-de-agricultura/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T05:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou o orçamento de 2027, mantendo recursos para educação e programas voltados para mulheres. No entanto, houve recortes em investimentos para agricultura, o que gerou críticas da oposição e de um senador oficialista.", "titulo_pt": "Senado aprova orçamento 2027: mantém recursos para educação e mulheres, mas corta Agricultura", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 276629, "titulo": "Video shows isolated Awá Indigenous people make contact with government team in Brazil", "url": "https://www.euronews.com/2026/11/20/video-shows-isolated-awa-indigenous-people-make-contact-with-government-team-in-brazil", "fonte_id": "euronews", "data_pub": "2026-11-20T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 20 membros do grupo indígena isolado Awá no Amazonas se aproximaram de uma unidade do governo, pedindo yamãs antes de retornarem à floresta. O encontro raro levanta preocupações sobre a saúde e a possível falta de alimentos dos indígenas.", "titulo_pt": "Vídeo mostra membros isolados do povo Awá entrando em contato com equipe do governo no amazonas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276229, "titulo": "Alerta viral: o que explica o aumento recente dos casos de covid-19 no Brasil", "url": "https://veja.abril.com.br/saude/alerta-viral-o-que-explica-o-aumento-recente-dos-casos-de-covid-19-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vírus da COVID-19 continua sendo um risco para os brasileiros, mesmo após um período de baixa incidência. É importante manter os cuidados e continuar a vacinação.", "titulo_pt": "Alerta viral: o que explica o aumento recente dos casos de covid-19 no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276631, "titulo": "Japan: The dark secret behind an island paradise full of rabbits", "url": "https://www.euronews.com/video/2026/11/20/japan-the-dark-secret-behind-an-island-paradise-full-of-rabbits", "fonte_id": "euronews", "data_pub": "2026-11-20T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de coelhos se movem livremente na Ilha Okunoshima, no Japão, encantando visitantes de todo o mundo. No entanto, a triste história de produção secreta de armas químicas escondida por trás do cenário encantador é um segredo sombrio.", "titulo_pt": "Japão: o segredo escuro por trás de uma ilha paradisíaca cheia de coelhos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276282, "titulo": "Chuvas pressionam produtores de mandioca e margens da indústria no Paraná", "url": "https://www.cnnbrasil.com.br/agro/chuvas-pressionam-produtores-de-mandioca-e-margens-da-industria-no-parana/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas limitaram a oferta de mandioca, elevando os preços da raiz. No entanto, os custos no campo aumentaram e a valorização dos derivados não acompanhou essa tendência, reduzindo a rentabilidade da cadeia produtiva.", "titulo_pt": "Chuvas pressionam produtores de mandioca e rentabilidade da indústria no Paraná", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276636, "titulo": "US sells first deep-sea mining leases off American Samoa, days after court ruled against process", "url": "https://www.euronews.com/2026/11/20/us-sells-first-deep-sea-mining-leases-off-american-samoa-days-after-court-ruled-against-pr", "fonte_id": "euronews", "data_pub": "2026-11-20T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump realizou leilões de mineração marinha em águas próximas a American Samoa, mesmo após um juiz federal determinar que as autoridades violaram a lei de proteção à vida selvagem. Grupos ambientalistas prometeram anular os contratos.", "titulo_pt": "EUA realiza primeiro leilão de mineração marinha em águas americanas, após decisão judicial", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276728, "titulo": "Climate talks ditch call to quit fossil fuels as deal nears", "url": "https://www.japantimes.co.jp/environment/2026/11/20/climate-change/cop-fossil-fuel-language/", "fonte_id": "japan_times", "data_pub": "2026-11-20T03:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas na COP31 em Antalya, Turquia, chegaram a um compromisso em questões polêmicas, aumentando as chances de um acordo amplo, embora diluído. O acordo final pode não incluir uma chamada para abandonar os combustíveis fósseis.", "titulo_pt": "Negociações climáticas na cop31 abandonam chamado para abandonar combustíveis fósseis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 275297, "titulo": "Advocates ask candidates for clear climate policies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868073", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados pedem aos candidatos políticos que apresentem políticas claras sobre o clima. O objetivo é garantir que os candidatos estejam preparados para lidar com questões ambientais de forma transparente e eficaz.", "titulo_pt": "Advogados pedem políticos clareza sobre políticas climáticas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275740, "titulo": "Combustíveis fósseis: o que são e por que importam", "url": "https://www.dw.com/pt-br/combustíveis-fósseis-o-que-são-e-por-que-importam/a-79994658?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-19T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os combustíveis fósseis, como carvão, petróleo e gás natural, desempenharam um papel crucial na Revolução Industrial e no desenvolvimento moderno, mas cientistas argumentam que sua substituição é necessária para combater o aquecimento global.", "titulo_pt": "Combustíveis fósseis: o que são e por que importam", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 275943, "titulo": "How vaccine fears fuelled a major measles comeback in the US", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/19/how-vaccine-fears-fuelled-a-major-measles-comeback-in-the-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T20:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cobertura vacinal está diminuindo nos Estados Unidos, permitindo que a doença da rubéola ressurgisse. As preocupações com vacinas estão contribuindo para essa recuperação da rubéola no país.", "titulo_pt": "Medo de vacinas alimenta forte retorno da rubéola nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 274900, "titulo": "Dejaron un carnero suelto en una isla y 40 años después se volvió una amenaza para el ecosistema", "url": "https://www.lanacion.com.ar/lifestyle/dejaron-un-carnero-suelto-en-una-isla-y-40-anos-despues-se-volvio-una-amenaza-para-el-ecosistema-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T17:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um muflon foi introduzido em Tenerife com fins de caça, mas 40 anos depois, o animal se tornou uma ameaça ao ecossistema local, colocando em risco a sobrevivência de espécies vegetais endêmicas únicas.", "titulo_pt": "Deixaram um muflon solto em uma ilha e 40 anos depois ele se tornou uma ameaça ao ecossistema", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274587, "titulo": "Copel vê nova era para hidrelétricas com avanço da energia solar e eólica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/copel-ve-nova-era-para-hidreletricas-com-avanco-da-energia-solar-e-eolica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço da geração solar e eólica no Brasil criou novas oportunidades para o setor de hidrelétricas, conforme destacado no Copel Day, encontro de executivos da Copel com investidores e analistas em Nova York.", "titulo_pt": "Nova era para hidrelétricas com avanço de energia solar e eólica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 275023, "titulo": "Making Oil Companies Pay for Climate Damages", "url": "https://www.theatlantic.com/podcasts/2026/11/suing-our-way-out-of-climate-change/689500/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-19T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte decidiu se cidades e condados podem processar as grandes empresas de petróleo por danos climáticos.", "titulo_pt": "Suprema corte decidirá se cidades e condados podem processar as grandes empresas de petróleo por danos climáticos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 275240, "titulo": "COP31 negotiators publish revised deal text with no mention of fossil fuels", "url": "https://www.japantimes.co.jp/environment/2026/11/19/climate-change/cop-fossil-fuel-language/", "fonte_id": "japan_times", "data_pub": "2026-11-19T12:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira versão do acordo incluía duas referências a combustíveis fósseis e à limitação de seu uso, um tema que divide as nações nas negociações anuais. Os negociadores da COP31 publicaram uma nova proposta sem menção a combustíveis fósseis.", "titulo_pt": "Negociadores da COP31 publicam novo texto de acordo sem mencionar combustíveis fósseis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 275272, "titulo": "Indonesia’s forest protection plan praised by Leonardo DiCaprio. Will it work?", "url": "https://www.scmp.com/week-asia/health-environment/article/3375097/indonesias-forest-protection-plan-praised-leonardo-dicaprio-will-it-work", "fonte_id": "scmp", "data_pub": "2026-11-19T11:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia prometeu parar a desmatamento para produção de alimentos e reutilizar terras degradadas, ganhando elogios do ator Leonardo DiCaprio, que considerou a medida histórica. No entanto, especialistas em meio ambiente argumentam que o plano é vago e pode até enfraquecer os ecossistemas vulneráveis.", "titulo_pt": "Plano de proteção florestal da indonésia ganha elogios de Leonardo DiCaprio, mas especialistas têm dúvidas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274978, "titulo": "Race to replant five South African baobabs after export blocked", "url": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "fonte_id": "guardian_world", "data_pub": "2026-11-19T11:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco baobá de centenas de anos foram arrancados sem os permissoes necessárias e tentaram ser exportados para a Geórgia. Agora, ambientalistas sul-africanos estão empenhados em replantar as árvores e fornecer apoio para seu recuperação.", "titulo_pt": "Corrida para replantar cinco baobás sul-africanos após exportação bloqueada", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 274049, "titulo": "Morgan Freeman compró un campo de 50 hectáreas y lo transformó en un santuario gigante para salvar a las abejas", "url": "https://www.lanacion.com.ar/espectaculos/morgan-freeman-compro-un-campo-de-50-hectareas-y-lo-transformo-en-un-santuario-gigante-para-salvar-a-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2014, o ator Morgan Freeman adquiriu uma propriedade de 50 hectares e a transformou em um santuário para a proteção das abelhas. Ele iniciou esta iniciativa após desenvolver o interesse pela apicultura como novo hobby.", "titulo_pt": "Morgan Freeman compra propriedade de 50 hectares e transforma em santuário para salvar as abelhas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 276738, "titulo": "Malaysia plans to resettle 10,000 Rohingya in Turkey", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375243/malaysia-plans-resettle-10000-rohingya-turkey", "fonte_id": "scmp", "data_pub": "2026-11-20T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Malásia planeja relocalizar 10.000 refugiados rohingya para a Turquia como parte de esforços para resolver um desafio de refugiados com longa duração envolvendo solicitantes de asilo de países como a Myammar. A proposta foi anunciada pelo vice-primeiro-ministro Ahmad Zahid Hamidi.", "titulo_pt": "Malásia planeja relocalizar 10.000 Rohingya na Turquia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 276301, "titulo": "Mianmar cometeu genocídio contra a minoria rohingya, decide corte da ONU", "url": "https://www.metropoles.com/mundo/mianmar-cometeu-genocidio-contra-a-minoria-rohingya-decide-corte-da-onu", "fonte_id": "metropoles", "data_pub": "2026-11-20T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corte principal da ONU decidiu que o Mianmar cometeu genocídio contra a minoria rohingya. Esta é a primeira decisão do órgão judicial mais importante da ONU que atribui responsabilidade por genocídio a um país.", "titulo_pt": "Mianmar cometeu genocídio contra a minoria rohingya, decide corte da ONU", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276362, "titulo": "A batalha na Justiça para apagar homenagem a expoente do racismo científico no Brasil", "url": "https://www.bbc.com/portuguese/articles/cm4gn08l5ldeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação popular está sendo julgada na segunda instância em dezembro com o objetivo de mudar o nome do Hospital Nina Rodrigues, em São Luís, como forma de reparação histórica. O hospital leva o nome de Nina Rodrigues, considerada um expoente do racismo científico no Brasil.", "titulo_pt": "Batalha na Justiça para mudar nome do hospital nina rodrigues, em são luís", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 276281, "titulo": "Mulheres são 61% das vítimas de racismo online denunciado ao Disque 100", "url": "https://www.cnnbrasil.com.br/nacional/brasil/mulheres-sao-61-das-vitimas-de-racismo-online-denunciado-ao-disque-100/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do Aláfia Lab analisou 1.739 denúncias de racismo online de 2011 a 2025, constatando que 61% das vítimas eram mulheres. O perfil mais frequente era de mulheres pretas com idades entre 25 e 30 anos, e houve falta de informações sobre os agressores em muitos dos registros.", "titulo_pt": "Mulheres são 61% das vítimas de racismo online denunciado ao Disque 100", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276307, "titulo": "Execução nos EUA dura uma hora e condenado relata dor durante o processo", "url": "https://www.metropoles.com/mundo/execucao-nos-eua-dura-uma-hora-e-condenado-relata-dor-durante-o-processo", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A execução nos Estados Unidos durou uma hora, e o condenado relatou ter sentido dor durante o processo. Antes disso, ocorreu uma tentativa falhada de executar Christa Pike no Tennessee, que sobreviveu a duas doses de pentobarbital.", "titulo_pt": "Execução nos EUA dura uma hora e condenado relata dor durante o processo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276312, "titulo": "Estado mais negro do país é o que mais registra ações de racismo na Justiça", "url": "https://www.metropoles.com/brasil/estado-mais-negro-do-pais-e-o-que-mais-registra-acoes-de-racismo-na-justica", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado da Bahia possui mais de 2,9 mil processos pendentes relacionados a ações de racismo, representando aproximadamente 17% do total de ações ajuizadas no país.", "titulo_pt": "O estado mais negro do país é o que mais registra ações de racismo na Justiça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276906, "titulo": "Child casualties in Ukraine reach highest level in almost four years – UNICEF", "url": "https://www.unicef.org/press-releases/child-casualties-ukraine-reach-highest-level-almost-four-years-unicef", "fonte_id": "unicef", "data_pub": "2026-11-20T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As mortes de crianças em Ucrânia atingiram o nível mais alto em quase quatro anos, de acordo com o UNICEF. Ataques verificados a infraestrutura energética aumentaram significativamente desde o início da guerra de escala completa.", "titulo_pt": "Vítimas infantis na Ucrânia atingem nível mais alto em quase quatro anos – UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 276679, "titulo": "Lula visits ailing Chief Raoni as Brazil recognises Indigenous land", "url": "https://www.aljazeera.com/news/2026/11/20/lula-visits-ailing-chief-raoni-as-brazil-recognises-indigenous-land?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T03:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lula visita Raoni, que está doente, em Mato Grosso, enquanto reconhece terra classe": "A"}, {"id": 275994, "titulo": "At least 300 children died in Gaza waiting for Israel's permission to get medical leave", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/least-300-children-died-gaza-waiting-israeli-medical-leave-permission", "fonte_id": "middle_east_eye", "data_pub": "2026-11-19T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 300 crianças morreram em Gaza esperando a permissão israelense para receber tratamento médico vital. Aproximadamente 5.400 crianças ainda aguardam a autorização israelense para viajar para fora do enclave.", "titulo_pt": "Pelo menos 300 crianças morreram em Gaza aguardando permissão para tratamento médico", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 275949, "titulo": "Photos: Genocide ruling spotlights human toll of 2017 Rohingya crisis", "url": "https://www.aljazeera.com/gallery/2026/11/19/photos-genocide-ruling-spotlights-2017-rohingya-crisis-human-toll?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T19:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2017, cerca de um milhão de rohingyas fugiram para Bangladesh, formando um dos maiores acampamentos de refugiados do mundo perto de Cox's Bazar.", "titulo_pt": "Imagens: sentença de genocídio destaca o custo humano da crise Rohingya de 2017", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 275951, "titulo": "Save the Children: Gaza’s children face ‘unmatched dangers’", "url": "https://www.aljazeera.com/news/2026/11/19/save-the-children-gazas-children-face-unmatched-dangers?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T19:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Save the Children relata que um terço das violações contra crianças em todo o mundo ocorreram na território palestiniano ocupado.", "titulo_pt": "Save the Children: crianças em gaza enfrentam 'perigos sem const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
