 "provavel_duplicata_de": null, "texto_pt": "Em dezembro, o estado da Califórnia inaugurará o maior puente para animais do mundo, que cruza uma autopista de dez pistas perto das Montanhas de Santa Mônica. A estrutura é coberta com terra e vegetação típica da região.", "titulo_pt": "Califórnia inaugurará em dezembro o puente para animais mais grande do mundo: cruza uma autopista de dez pistas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 239035, "titulo": "En Florida, un adolescente de 14 años construyó jardines submarinos verticales de ostras para limpiar 950.000 litros de agua por día", "url": "https://www.clarin.com/estados-unidos/florida-adolescente-14-anos-construyo-jardines-submarinos-verticales-ostras-limpiar-950000-litros-agua-dia_0_bHdiJZRSGB.html", "fonte_id": "clarin", "data_pub": "2026-11-01T17:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Isaac Nelson, um adolescente de 14 anos, construiu jardins submarinos verticais de ostras na Flórida para limpar água. O projeto resulta na purificação de 950.000 litros de água por dia. Ele é protagonista de um documentário sobre mudanças no water e foi finalista do Premio Sylvia Earle de Conservação Oceânica 2026.", "titulo_pt": "Em flórida, adolescente de 14 anos construiu jardins submarinos verticais de ostras para limpar água", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 239234, "titulo": "Biodiversity COP17: Leading negotiator Steven Guilbeault believes harmful subsidies will be 'main battleground in the coming years'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/01/biodiversity-cop17-leading-negotiator-steven-guilbeault-believes-harmful-subsidies-will-be-main-battleground-in-the-coming-years_6768841_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-01T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O negociador-chefe anterior do Canadá para biodiversidade, Steven Guilbeault, expressou uma avaliação positiva sobre a conferência sobre biodiversidade que terminou em 31 de outubro na Armênia. Ele acredita que as subsídios prejudiciais serão o principal campo de batalha nos anos vindouros.", "titulo_pt": "COP17 de biodiversidade: Steven Guilbeault acredita que os subsídios prejudiciais serão o principal campo de batalha nos anos vindouros", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 238964, "titulo": "Vídeo: barcaça com mil toneladas de minério afunda em rio no Pantanal de MS", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/ms/video-barcaca-com-mil-toneladas-de-minerio-afunda-em-rio-no-pantanal-de-ms/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Marinha está investigando o acidente que ocorreu no sábado (31) no rio Paraguai, onde uma barcaça com mil toneladas de minério afundou. O Ibama relatou um vazamento do material na água e está apurando as possíveis consequências ambientais.", "titulo_pt": "Vídeo: barcaça com mil toneladas de minério afunda em rio no Pantanal de MS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239157, "titulo": "Northern Territory water plan condemned as ‘blatant and shameless’ attack on nature", "url": "https://www.theguardian.com/australia-news/2026/nov/02/northern-territory-water-plan-condemned-as-blatant-and-shameless-attack-on-nature", "fonte_id": "guardian_world", "data_pub": "2026-11-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Território do Norte está planejando eliminar uma exigência legal que determina a reserva de água para a natureza, o que é visto por grupos ambientais como uma 'ataque escancarado e sem vergonha' ao meio ambiente. Isso seria a última medida de uma série de ataques ambientais por parte do governo do Partido Liberal do País.", "titulo_pt": "Plano de água do território do norte é acusado de 'ataque escancarado e sem vergonha' ao meio ambiente", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 238354, "titulo": "Desastres climáticos podem cair no Enem e vestibulares? Veja dicas", "url": "https://www.cnnbrasil.com.br/educacao/desastres-climaticos-podem-cair-no-enem-e-vestibulares-veja-dicas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Questões relacionadas a desastres climáticos podem ser abordadas em diversos assuntos do Enem e vestibulares devido à sua relevância atual. O tema ambiental tem sido frequentemente incorporado em provas devido às suas implicações para grandes populações.", "titulo_pt": "Desastres climáticos podem surgir no Enem e vestibulares? Confira dicas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238717, "titulo": "Hate paper straws? Asia’s new alternatives are another eco trap", "url": "https://www.scmp.com/week-asia/health-environment/article/3372751/hate-paper-straws-asias-new-alternatives-are-another-eco-trap", "fonte_id": "scmp", "data_pub": "2026-11-01T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para a flight attendant Chloe Tan Zi Ling, de 35 anos, os palitos de papel são impráticos porque se desidratam antes de terminar a bebida. Ela prefere alternativas metálicas reutilizáveis, mas acha que deixam um sabor desagradável. Essa frustração reflete um debate mais amplo sobre a transição asiática para palitos de papel e alternativas, com um estudo sul-coreano recente indicando que os palitos de plástico convencionais se saem melhor que os de papel e outras opções.", "titulo_pt": "Detestando palitos de papel? Alternativas asiáticas podem ser outro engodo ecológico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 238480, "titulo": "Presidente de Bolivia decreta emergencia nacional por el fenómeno climático de El Niño", "url": "https://www.latercera.com/mundo/noticia/presidente-de-bolivia-decreta-emergencia-nacional-por-el-fenomeno-climatico-de-el-nino/", "fonte_id": "la_tercera", "data_pub": "2026-11-01T02:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente da Bolívia decretou emergência nacional em face do fenômeno climático El Niño, que está afetando o território do país. O mandatário afirmou que mobilizará recursos financeiros e humanos para lidar com as consequências desse evento climatológico.", "titulo_pt": "Presidente da bolívia declara emergência nacional por fenômeno climático El Niño", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 237824, "titulo": "Amendments to combat illegal land use pass legislature", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866960", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A legislatura aprovou emendas para combater o uso ilegal de terrenos.", "titulo_pt": "Emendas para combater uso ilegal de terrenos são aprovadas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 240294, "titulo": "‘Life on Hold’: Poland’s Immigrants Face Years Waiting for Residence Permits", "url": "https://balkaninsight.com/2026/11/02/life-on-hold-polands-immigrants-face-years-waiting-for-residence-permits/rd/", "fonte_id": "balkan_insight", "data_pub": "2026-11-02T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polônia tem se tornado um país de imigração mais rápido do que suas autoridades conseguem adaptar-se. Estrangeiros que vivem e trabalham no país enfrentam longos períodos de espera por permissoes de residência sob uma regra de emergência de 2022 que ainda está em vigor, sem muitas opções para contestar esses atrasos.", "titulo_pt": "Vida em pausa: polônia imigrante enfrenta anos de espera por permissoes de residência", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 240317, "titulo": "Retrial to begin next week for Uzbek national convicted of murder, robbery 16 yrs ago", "url": "https://www.koreaherald.com/article/10922926", "fonte_id": "korea_herald", "data_pub": "2026-11-02T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um réu uzbeco, Akmal Bozorov, de 37 anos, terá seu julgamento retrial iniciado na próxima semana. O julgamento, que começará às 11h do dia 12 de novembro no Fórum Distrital de Changwon, será para uma sentença de prisão perpétua, de 16 anos atrás, por matar e roubar um motorista de táxi em 2009.", "titulo_pt": "Re julgamento para ucraniano condenado a prisão perpétua por assassinato e roubo de motorista de táxi ocorrerá na próxima semana", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 239077, "titulo": "Comité de Prevención de la Tortura advierte que el hacinamiento en las cárceles representa un riesgo inminente", "url": "https://www.latercera.com/nacional/noticia/comite-de-prevencion-de-la-tortura-advierte-que-el-hacinamiento-en-las-carceles-representa-un-riesgo-inminente/", "fonte_id": "la_tercera", "data_pub": "2026-11-01T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O aumento da população carcerária tem levado a várias consequências, incluindo a falta de atendimento à saúde mental nos presídios. Entre 2020 e 2025, a taxa de suicídios foi de 51,2 por cada 100.000 detentos anualmente.", "titulo_pt": "Comitê de prevenção à Tortura avisa que o hacinamento nas prisões representa um risco iminente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 238871, "titulo": "ICE publica vídeo em que debocha de migrantes presos nos EUA", "url": "https://www.poder360.com.br/poder-internacional/ice-publica-video-em-que-debocha-de-migrantes-presos-nos-eua/", "fonte_id": "poder360", "data_pub": "2026-11-01T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo publicado pelo ICE (Immigra function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

  _fUrl = btn.dataset.url;

}

    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
