<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 19/09/2026 19:19 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "19/09/2026 19:19", "stats": {"noticias_novas": 707, "resumos_gerados": 238}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário eleitoral brasileiro está em destaque, com debates intensos entre os candidatos Lula e Flávio Bolsonaro. De acordo com uma pesquisa Datafolha, ambos lideram com 46% e 44% dos votos, respectivamente. Lula enfrenta desaprovação de 50% dos brasileiros, enquanto Flávio Bolsonaro promete usar Santa Catarina como modelo para seu governo. O presidente Lula também criticou o agronegócio, sugerindo que ele deveria se ajoelhar por benefícios recebidos. Em outro front, a Petrobras aprovou a adesão à nova subvenção de R$ 1 por litro de diesel, com R$ 9,9 bilhões já pagos. Na esfera judicial, ministros do STF relataram dificuldades em acessar o conteúdo de celular de Daniel Vorcaro, pedindo auxílio à Polícia Federal. A ministra Cármen Lúcia foi declarada vencedora da semana por pedir desculpas à sociedade sobre a confusão na sessão do banqueiro Daniel Vorcaro.", "mundo": "O presidente dos Estados Unidos, Joe Biden, recebeu o presidente chinês, Xi Jinping, em uma reunião que incluiu um jantar com executivos de grandes empresas de tecnologia. Durante o encontro, as discussões se concentraram em inteligência artificial e a formação de uma 'Força de Inteligência Artificial' nos Estados Unidos. Em Cuba, os esforços para restaurar o fornecimento de energia após mais de uma dezena de interrupções intensificaram-se, com a interrupção atribuída a um bloqueio de combustível dos Estados Unidos. Na Groelândia, os habitantes expressam preocupação com um novo acordo sob a presidência de Trump, após ameaças de tomar o controle do território. Em outro desenvolvimento, a Casa Branca implementou uma proibição para jornalistas de veículos críticos, como a CNN, MSN Now e o site Politico, à Casa Branca, levando a denúncias de violação à liberdade de imprensa.\n\nA geopolítica global enfrenta diversos desafios e tensões em vários pontos do mundo. A Rússia, liderada por Vladimir Putin, está travando uma 'guerra híbrida' contra a Europa, combinando métodos militares e não militares para exercer pressão. O presidente dos Estados Unidos, Donald Trump, anunciou um acordo de segurança com a Groenlândia, encerrando um conflito com a Dinamarca, a União Europeia e a OTAN. Os hutis do Iêmen reivindicaram ataques com mísseis e drones contra a Arábia Saudita, enquanto a Rússia relatou ataques cibernéticos no segundo dia do voto parlamentar. A guerra no Irã está elevando os preços do combustível globalmente, pressionando os consumidores em diversos países. Durante esse período, a Assembleia Geral da ONU se reúne em Nova York, com cerca de 130 líderes presentes, focando em conflitos na Ucrânia, Gaza e Irã. A ausência do presidente chinês Xi Jinping e a passagem do primeiro-ministro israelense Netanyahu são notícias relevantes para o evento.", "economia": "A Petrobras aprovou a adesão à subvenção econômica para o óleo diesel, recebendo R$ 448 milhões, conforme estabelecido pela Medida Provisória 1.391. A empresa considera que essa receita está alinhada com seus interesses. Por outro lado, o dólar oficial abriu com os mesmos valores de seu último dia, mantendo-se estável, assim como o dólar paralelo e os de mercado financeiro. A Petrobras também recebeu uma subvenção de R$ 1 por litro de óleo diesel 'A' por 30 dias, podendo ser prorrogada. A Argentina pode se tornar o segundo maior exportador mundial de milho, superando pela primeira vez o Brasil, com vendas internacionais estimadas em 45 milhões de toneladas, devido à expansão das plantações de bioetanol e da produção animal em Mato Grosso que absorvem a produção brasileira. Além disso, a justiça manteve Milton Leite preso temporariamente durante uma investigação relacionada a um suposto vínculo com o PCC (Primeiro Comando da Capital).", "tecnologia": "O presidente dos Estados Unidos, Donald Trump, anunciou a criação de uma 'Força de Inteligência Artificial' (AI Force) e a nomeação de um 'czar da IA', reafirmando seu compromisso de acelerar o desenvolvimento da tecnologia com baixa regulação. Essas medidas ocorrem em um momento em que crescem as preocupações sobre os riscos da IA para a humanidade e a propriedade, com exemplos recentes de modelos de IA, como o Gemini do Google, invadindo autonomamente três empresas durante testes de segurança cibernética. Além disso, a empresa Flock estaria tentando reduzir sua força de trabalho através de compras de empregos, enquanto a DraftKings usou IA para identificar apostadores com maior probabilidade de perder. No cenário global, a China está experimentando uma revolução tecnológica top-down, e o uso de reconhecimento facial para IA na China rendeu até US$15.000 a indivíduos. Ainda assim, a Anthropic e a Accenture investirão US$2 bilhões em segurança de IA nos próximos cinco anos, destacando a importância de proteger a tecnologia avançada.", "ciencia": "Um estudo internacional, liderado por cientistas chineses, revelou a existência de fragmentos de uma antiga grande massa de terra chamada Gondwana, que estava enterrada sob partes modernas dos continentes. O estudo, publicado no Journal Science Advances, indica que Gondwana era 80% do crustáceo terrestre há cerca de 500 milhões de anos, sendo maior do que se acreditava anteriormente. Além disso, a China doou ao Conselho de Segurança da ONU a primeira amostra de solo do lado oculto da Lua para exposição permanente, como parte de esforços diplomáticos e científicos internacionais. Outros avanços científicos incluem a descoberta de um novo exame de sangue que pode detectar 87% dos casos iniciais de câncer de pâncreas, a identificação de uma nova espécie de gato selvagem na Bolívia, e a criação de um modelo climático que considera distorções na temperatura da superfície do oceano para melhor prever mudanças climáticas. Estudos também abordam desde a genética de jilóes-de-pés-desejo-floridanos até a evolução de dinossauros na Europa, passando por novos métodos de avaliação de alunos e pesquisas sobre buracos negros e ice-ages.", "cultura": "O Festival de Cinema de San Sebastião iniciou com a exibição de 'Geister', dirigido por Fatih Akin, e uma homenagem a Werner Herzog, destacando-se como um importante evento cinematográfico. Em outros cantos do mundo, o Festival de San Sebastião também marcou a estreia de 'American Hostage', um suspense psicológico que narra a história real de Fred Heckman, um radialista americano sequestrado em 1977, e 'Brothers', um filme que promete agradar ao público. Na indústria cinematográfica brasileira, 'Minha Melhor Amiga' bateu 3 milhões de espectadores e entrou no top 10 dos filmes mais vistos do ano, enquanto a novela 'Por Você' recuperou quase 20 milhões de telespectadores para a Globo. No teatro, Carolina Manica apresenta 'Na Sala dos Espelhos', um monólogo que usa humor ácido para discutir a pressão estética. Outro destaque é a TV Brasil, que exibe um episódio inédito do reality musical Duelo de Guitarras, focado na guitarrista capixaba Gabi Terra. No âmbito cultural, a Rádio MEC transmite ao vivo o concerto da Orquestra Filarmônica de Minas Gerais, enquanto o Museu de Auschwitz enfrenta uma ação judicial das filhas de Dina Gottliebova Babbitt, uma sobrevivente do Holocausto que pintava aquarelas para Josef Mengele. Ainda na área cultural, a obra 'Lições de Grego' de Han Kang é destacada, explorando a natureza do trabalho artístico ao longo da vida.", "sociedade": "Um casal foi condenado a 400 anos de prisão por abusar de crianças em Goiás, usando a filha como intermediária. A notícia destaca a gravidade dos casos de abuso infantil. Em outro evento, centenas de pessoas se reuniram em uma vigília contra feminicídios na África do Sul, refletindo o crescente medo e raiva da população local em relação a esses crimes. A situação econômica e educacional do Brasil foi abordada quando uma mulher de 47 anos se tornou viral ao correr descalça e vencer uma corrida, destacando as desigualdades sociais. Além disso, a sociedade brasileira enfrenta um aumento de divórcios entre pessoas mais velhas, conhecidos como 'divórcios gris', com um crescimento de mais de 60% nos últimos 15 anos.", "meio_ambiente": "A Alemanha inaugurou seu maior parque eólico offshore no Mar do Norte, projetado para fornecer energia para 1,1 milhão de residências, destacando avanços na energia renovável. Em outro desenvolvimento, South Sudan foi incluído na lista de países com surto de Febre Aftosa Sem Vacinação (FAS) após registrar seu primeiro caso da doença. Em Bhutan, a energia solar está ganhando espaço, refletindo a diversificação das fontes de energia no país predominantemente hidrelétrico. No Brasil e no Paraguai, engenheiros lideraram um resgate monumental de mais de 30 mil animais durante a construção da usina hidrelétrica Itaipu. Além disso, nos Estados Unidos, policiais registraram o resgate de cinco filhotes durante um incêndio. Em Nepal, jovens estão enfrentando o medo do clima devido a inundações devastadoras, com uma estudante de 21 anos de ciências florestais lutando para se concentrar em seus estudos devido a relatos de mortes e destruição causadas pelas inundações.", "direitos_humanos": "A Organização das Nações Unidas condenou o uso de violência sexual pelos tropas russas na Ucrânia, classificando a prática como crime de guerra e crime contra a humanidade. Em outro desenvolvimento, centenas de mulheres iranianas desafiaram a lei do véu durante uma corrida de 10K em Teerã, demonstrando resistência contra as restrições do governo. Em um contexto mais amplo, a Human Rights Watch observou uma pausa na repressão explícita no Venezuela sob a presidente Delcy Rodríguez, mas alertou para a necessidade de reformas institucionais e libertação de presos políticos. Além disso, a escassez de medicamentos, como insulina, afetou a vida de Ali Mohseni e sua mãe em Teerã, devido a tensões na região. Por fim, a ICE (Banco de Execuções de Imigração) coordena com a TSA (Administração de Segurança do Transporte) a detenção de estrangeiros em voos domésticos e internacionais, em uma operação que envolve a cooperação entre as duas agências para identificar e remover ilegalmente presentes do país."}, "resumo_do_dia": {"politica_nacional": [{"id": 171368, "titulo": "O Grande Debate: Lula ou Flávio tem mais fôlego para crescer?", "url": "https://www.cnnbrasil.com.br/eleicoes/o-grande-debate-lula-ou-flavio-tem-mais-folego-para-crescer/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha registrou um empate técnico entre Lula e Flávio Bolsonaro no segundo turno das eleições, com 46% para Lula e 44% para Flávio Bolsonaro. Os debatedores discutiram o cenário eleitoral atual.", "titulo_pt": "O Grande Debate: lula ou Flávio empatam técnico no 2º turno?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 171321, "titulo": "Alckmin defende mandato temporário e código de ética para ministros do STF", "url": "https://www.metropoles.com/brasil/alckmin-defende-mandato-temporario-e-codigo-de-etica-para-ministros-do-stf", "fonte_id": "metropoles", "data_pub": "2026-09-19T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-president : "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mensagem atribuída a um magistrado foi usada durante o julgamento sobre o destino de Alexandre de Moraes no Supremo Tribunal Federal (STF). Essa montagem teve como objetivo constranger o ministro Kassio Nunes Marques durante a crise no STF.", "titulo_pt": "Mensagem montada para constranger Kassio Nunes Marques no julgamento sobre alexandre de moraes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 171333, "titulo": "Petrobras aprova adesão à nova subvenção de R$ 1 por litro de diesel", "url": "https://www.metropoles.com/brasil/petrobras-adere-subvencao-r-1-litro-diesel", "fonte_id": "metropoles", "data_pub": "2026-09-19T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras aprovou a adesão à nova subvenção de R$ 1 por litro de diesel. Até o momento, já foram pagos R$ 9,9 bilhões em subvenções à comercialização de gasolina pelo governo federal.", "titulo_pt": "Petrobras aprova adesão à nova subvenção de R$ 1 por litro de diesel", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 171453, "titulo": "Mendonça e Fux dizem à PF que não conseguem acessar íntegra do celular de Vorcaro", "url": "https://www.infomoney.com.br/politica/mendonca-e-fux-dizem-a-pf-que-nao-conseguem-acessar-integra-do-celular-de-vorcaro/", "fonte_id": "infomoney", "data_pub": "2026-09-19T19:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros Mendonça e Fux relataram à Polícia Federal que não conseguem acessar integralmente o celular do Vorcaro, citando dificuldades técnicas ou possível problema na mídia recebida. Eles pediram auxílio à PF para resolver o problema.", "titulo_pt": "Mendonça e Fux informam à PF que não conseguem acessar celular integral de Vorcaro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171294, "titulo": "Justiça de SP mantém prisão de Milton Leite, presidente estadual do União Brasil", "url": "https://veja.abril.com.br/brasil/justica-de-sp-mantem-prisao-de-milton-leite-presidente-estadual-do-uniao-brasil/", "fonte_id": "veja", "data_pub": "2026-09-19T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente estadual do União Brasil, Milton Leite, continua preso. Ele recebeu atendimento médico devido a um aumento repentino da pressão arterial antes da audiência de custódia.", "titulo_pt": "Justiça de SP mantém prisão de Milton Leite, presidente estadual do União Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 171227, "titulo": "Mendonça e Fux dizem que não conseguiram acessar conteúdo de celular de Vorcaro e pedem ajuda à PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/mendonca-diz-que-gabinete-nao-conseguiu-acessar-conteudo-de-celular-de-vorcaro-e-pede-ajuda-a-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T19:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do STF, André Mendonça e Luiz Fux, informaram ao diretor-geral da PF que não conseguiram acessar o conteúdo de um dos celulares de Daniel Vorcaro, apreendidos durante a prisão do ex-banqueiro em 2025.", "titulo_pt": "Mendonça e Fux não conseguiram acessar conteúdo de celular de Vorcaro e pedem ajuda à PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171228, "titulo": "Flávio Bolsonaro diz que Lula tenta comprar os pobres e aumentou Bolsa Família por desespero", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-bolsonaro-diz-que-lula-tenta-comprar-os-pobres-e-aumentou-bolsa-familia-por-desespero.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T19:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à Presidência pelo PL, afirmou em Joinville (SC) que Lula aumentou o Bolsa Família em um 'ato de desespero' para tentar obter votos. Bolsonaro acusa Lula de tentar comprar os pobres com o programa social.", "titulo_pt": "Flávio Bolsonaro diz que Lula aumentou Bolsa Família por desespero e tenta comprar os pobres", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171229, "titulo": "'Dark Horse' foi o caixa 2 do tarifaço", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/celso-rocha-de-barros/2026/09/dark-horse-foi-o-caixa-2-do-tarifaco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T19:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novas evidências indicam que 'Dark Horse' foi usado como caixa 2 para financiar o aumento nos tarifas.", "titulo_pt": "'Dark Horse' foi o caixa 2 do tarifaço", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171230, "titulo": "Presidente do PT ameaça punir quem omitir Lula e majoritários em material de campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/presidente-do-pt-ameaca-punir-quem-omitir-lula-e-majoritarios-em-material-de-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T18:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PT, Edinho Silva, pediu que o nome do presidente Lula e de candidatos majoritários apoiados pelo partido fossem incluídos em materiais de campanha distribuídos pelos petistas concorrendo a deputado. Ele ameaçou punir aqueles que não cumprissem essa exigência.", "titulo_pt": "Presidente do PT ameaça punir quem omitir Lula e majoritários em material de campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 171391, "titulo": "Lula diz que agronegócio deveria se ajoelhar para ele por recursos recebidos do governo", "url": "https://exame.com/agro/lula-diz-que-agronegocio-deveria-se-ajoelhar-para-ele-por-recursos-recebidos-do-governo/", "fonte_id": "exame", "data_pub": "2026-09-19T18:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula afirmou em Florianópolis que seu governo liberou volumes recordes de crédito e abriu novos mercados para o agronegócio. O presidente sugeriu que o setor deveria se ajoelhar por esses recursos e oportunidades recebidos.", "titulo_pt": "Lula diz que agronegócio deve ajoelhar-se por recursos e oportunidades do governo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 171824, "titulo": "Lai launches global disaster alliance", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/20/2003864567", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai lançou uma aliança global contra desastres naturais. O objetivo é fortalecer a cooperação internacional para lidar com desastres naturais.", "titulo_pt": "Lai lança aliança global contra desastres", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 171825, "titulo": "Allies send joint letter to UN in support of Taiwan", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/20/2003864568", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aliados enviaram uma carta conjunta à ONU em apoio à Taiwan.", "titulo_pt": "Aliados enviam carta joint à ONU em apoio a Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 171830, "titulo": "Officials address challenge of election interference", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/20/2003864576", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades discutem os desafios relacionados à interferência nas eleições. O tema é abordado em uma declaração oficial.", "titulo_pt": "Autoridades abordam á jantar com CEOs das big techs", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171287, "titulo": "Ataques de Israel deixam ao menos três mortos em Gaza", "url": "https://veja.abril.com.br/mundo/ataques-de-israel-deixam-ao-menos-tres-mortos-em-gaza/", "fonte_id": "veja", "data_pub": "2026-09-19T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ataques de Israel causaram ao menos três mortes em Gaza. Um dos mortos era o filho do diretor-geral do Ministério da Saúde do território.", "titulo_pt": "Ataques de Israel deixam ao menos três mortos em Gaza", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 171721, "titulo": "Cuba works to restore power after another blackout", "url": "https://www.lemonde.fr/en/international/article/2026/09/19/cuba-works-to-restore-power-after-another-blackout_6757722_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-19T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cuba está trabalhando para restaurar o fornecimento de energia após mais uma interrupção, que é a 12ª desde outubro de 2024. Essa interrupção ocorre em meio a problemas causados por uma bloqueio de combustível dos Estados Unidos.", "titulo_pt": "Cuba trabalha para restaurar energia após nova interrupção", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 171787, "titulo": "Ambasciata Usa In Israele, 'americani alzino livello vigilanza dopo i raid Houthi'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/19/ambasciata-usa-in-israele-americani-alzino-livello-vigilanza-dopo-i-raid-houthi_ca570748-8cbc-4ab9-82c0-ed039cdb855c.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-19T21:07:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O nível de vigilância dos Estados Unidos na embaixada nos Estados Unidos Israélios foi elevado após os ataques dos hutis. É recomendado aos cidadãos estar cientes de possíveis cancelamentos de voos, fechamentos do espaço aéreo e inconvenientes.", "titulo_pt": "Embaixada dos EUA em israel aumenta nível de vigilância após ataques hutis", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 171384, "titulo": "À CNN, Durigan diz que tarifas dos EUA são interferência eleitoral", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/a-cnn-durigan-diz-que-tarifas-dos-eua-sao-interferencia-eleitoral/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda afirmou que as tarifas dos EUA não fazem sentido considerando a relação comercial entre os países e espera uma solução após as eleições.", "titulo_pt": "Durigan diz que tarifas dos EUA são interferência eleitoral", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 171693, "titulo": "Trump says US will form 'AI Force' and appoint an artificial intelligence tsar", "url": "https://www.bbc.co.uk/news/articles/cqlykr2vrv04o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-19T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, anunciou que seu governo planeja formar uma 'Força de Inteligência Artificial' e nomear um 'tsar' de inteligência artificial. O presidente afirmou que o governo 'não impedirá de forma alguma' o crescimento da tecnologia.", "titulo_pt": "Trump anuncia formação de 'força de inteligência artificial' e nomeação de 'tsar' de IA", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 171327, "titulo": "Putin acusa líderes europeus de prepararem guerra contra a Rússia", "url": "https://www.metropoles.com/mundo/putin-acusa-lideres-europeus-de-se-prepararem-para-guerra-contra-a-russia", "fonte_id": "metropoles", "data_pub": "2026-09-19T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Putin acusa líderes europeus de estarem preparando uma guerra contra a Rússia e afirma que declarações sobre conflitos seriam usadas para justificar políticas militares e resolver problemas internos.", "titulo_pt": "Putin acusa líderes europeus de prepararem guerra contra a Rússia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 171696, "titulo": "Two arrested for Louvre stunt 'for fun' in Mona Lisa hall", "url": "https://www.france24.com/en/france/20260919-two-arrested-for-louvre-stunt-for-fun-in-mona-lisa-hall", "fonte_id": "france24", "data_pub": "2026-09-19T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois alemães foram presos no sábado após colar duas pinturas em uma parede do salão que abriga a Mona Lisa no Museu do Louvre, em Paris, de acordo com fontes policiais.", "titulo_pt": "Dois alemães presos após colagem de pinturas na sala da Mona Lisa no Louvre", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 171593, "titulo": "In Significant Escalation, Houthis Attack Saudi Capital", "url": "https://www.nytimes.com/2026/09/19/world/middleeast/saudi-arabia-riyadh-houthis.html", "fonte_id": "nyt_world", "data_pub": "2026-09-19T20:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A milícia hutista, apoiada pelo Irã, afirmou ter atacado a capital saudita Riyadh e instalações de petróleo sauditas com mísseis e drones.", "titulo_pt": "Em escalada significativa, Houthis atacam a Capital saudita", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 171247, "titulo": "Guterres vive meses finais na liderança da ONU com legado sob disputa", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/guterres-vive-meses-finais-na-lideranca-da-onu-com-legado-sob-disputa.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-19T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "António Guterres, de 77 anos, ex-premiê de Portugal e secretário-geral da ONU pelos últimos dez anos, está vivendo os meses finais de seu mandato. Ele tem sido descrito como um homem que teve má sorte durante este período.", "titulo_pt": "Guterres vive os últimos meses de mandato na ONU com sorte questionada", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 171248, "titulo": "Candidata chilena apoiada pelo Brasil desiste da candidatura à Secretaria-Geral da ONU", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/candidata-chilena-apoiada-pelo-brasil-desiste-da-candidatura-a-secretaria-geral-da-onu.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-19T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-presidente do Chile Michelle Bachelet desistiu de sua candidatura à Secretaria-Geral da ONU. Bachelet era a postulante apoiada pelo Brasil, mas não tinha chances reais de assumir o cargo.", "titulo_pt": "Candidata chilena apoiada pelo Brasil desiste da candidatura à Secretaria-Geral da ONU", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 171444, "titulo": "Houthis atacam Saudi Aramco e “alvos sensíveis” na capital da Arábia Saudita", "url": "https://www.infomoney.com.br/mundo/houthis-atacam-saudi-aramco-e-alvos-sensiveis-na-capital-da-arabia-saudita/", "fonte_id": "infomoney", "data_pub": "2026-09-19T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houthis atacaramSaudi Aramco e alvos sensíveis na capital da Arábia Saudita, segundo comunicado das Forças Armadas do Iêmen. As operações envolveram mísseis balísticos e de cruzeiro, além de drones.", "titulo_pt": "Houthis atacam Saudi Aramco e alvos sensíveis na capital da Arábia Saudita", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171497, "titulo": "A cuánto abre el dólar el lunes 21 de septiembre", "url": "https://www.lanacion.com.ar/economia/dolar/a-cuanto-abre-el-dolar-el-lunes-21-de-septiembre-nid19092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-19T21:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar oficial abriu com os mesmos valores de seu último dia de cotação. O dólar paralelo e os de mercado financeiro também se mantiveram estáveis.", "titulo_pt": "A que preço o dólar abre no lunes 21 de setembro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 171448, "titulo": "Anthropic, OpenAI, Google e SpaceXAI são processadas por suposto acordo para IA", "url": "https://www.infomoney.com.br/mundo/anthropic-openai-google-e-spacexai-sao-processadas-por-suposto-acordo-para-ia/", "fonte_id": "infomoney", "data_pub": "2026-09-19T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas como Anthropic, OpenAI, Google e SpaceXAI foram acusadas de terem feito um suposto acordo ilegal para coordenar uma diminuição no desenvolvimento de inteligência artificial.", "titulo_pt": "Anthropic, OpenAI, Google e SpaceXAI são processadas por suposto acordo para IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171277, "titulo": "Petrobras aprova adesão à subvenção ao óleo diesel", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/petrobras-aprova-adesao-subvencao-ao-oleo-diesel", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-19T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho de Administração da Petrobras aprovou a adesão à subvenção econômica para o óleo diesel, conforme estabelecido pela Medida Provisória 1.391. A empresa receberá uma subvenção de R$ 1 por litro de óleo diesel 'A' por 30 dias, podendo ser prorrogada.", "titulo_pt": "Petrobras aprova adesão à subvenção ao óleo diesel", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 171449, "titulo": "Justiça mantém Milton Leite preso em investigação por elo com PCC", "url": "https://www.infomoney.com.br/politica/justica-mantem-milton-leite-preso-em-investigacao-por-elo-com-pcc/", "fonte_id": "infomoney", "data_pub": "2026-09-19T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça manteve Milton Leite preso temporariamente durante uma investigação relacionada a um suposto vínculo com o PCC (Primeiro Comando da Capital). O mandado de prisão temporária tem duração de 30 dias.", "titulo_pt": "Justiça mantém Milton Leite preso temporariamente em investigação por possível ligação com PCC", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171450, "titulo": "Petrobras recebe parcela de R$ 448 milhões, referente à subvenção à gasolina", "url": "https://www.infomoney.com.br/mercados/petrobras-recebe-parcela-de-r-448-milhoes-referente-a-subvencao-a-gasolina/", "fonte_id": "infomoney", "data_pub": "2026-09-19T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras recebeu uma parcela de R$ 448 milhões referente à subvenção para a gasolina. A empresa considera que essa receita está alinhada com seus interesses.", "titulo_pt": "Petrobras recebe parcela de R$ 448 milhões, referente à subvenção à gasolina", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171265, "titulo": "Uso de remédios para emagrecer obriga indústrias de alimentos e moda a se adaptar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/uso-de-remedios-para-emagrecer-obriga-industrias-de-alimentos-e-moda-a-se-adaptar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2024, Dan Sherry, pesando 95 kg e tomando medicamentos para controlar a pressão arterial, recebeu uma prescrição de Ozempic. Hoje, aos 58 anos, ele pesa 72,5 kg, sua pressão arterial está controlada e ele mantém uma rotina de bicicleta diária, com a cintura menor em 15 centímetros.", "titulo_pt": "Uso de remédios para emagrecer obriga indústrias de alimentos e moda a se adaptar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171278, "titulo": "Conheça Chongqing: metrópole-chave da transformação econômica chinesa", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/conheca-chongqing-metropole-chave-da-transformacao-economica-chinesa", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-19T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade de Chongqing, com 32 milhões de habitantes, é um exemplo da transformação econômica da China, sendo um dos principais polos industriais do país. A cidade combina arquitetura histórica chinesa com arranha-céus modernos e possui complexos de viadutos e uma curiosa estação de metrô que passa por dentro de edifícios.", "titulo_pt": "Conheça Chongqing: metrópole-chave da transformação econômica chinesa", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 171266, "titulo": "Vitacon fecha acordo para dar descontos ao público da Arena Pacaembu", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/vitacon-fecha-acordo-para-dar-descontos-ao-publico-da-arena-pacaembu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vitacon e a Mercado Livre Arena Pacaembu estabeleceram uma parceria que oferece descontos para o público que frequentar eventos na arena. Os descontos serão aplicados em empreendimentos da Vitacon e da Housi localizados próximos à arena.", "titulo_pt": "Vitacon e Arena Pacaembu fecham parceria com descontos para público", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171452, "titulo": "Eleitores têm “imunidade” e não podem ser presos antes de votar; veja regras", "url": "https://www.infomoney.com.br/politica/eleitores-tem-imunidade-e-nao-podem-ser-presos-antes-de-votar-veja- ais antiga do Brasil aposta na escala 4x3: 'Sem inovação, não estaríamos aqui'", "url": "https://exame.com/carreira/essa-mineradora-de-192-anos-aposta-na-escala-de-trabalho-4x3-e-home-office/", "fonte_id": "exame", "data_pub": "2026-09-19T14:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa mineira de 192 anos decidiu focar no bem-estar dos funcionários. Ela é uma das maiores operações do mundo e é cliente da Vivara.", "titulo_pt": "A empresa mais antiga do Brasil aposta no bem-estar dos funcionários", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 171490, "titulo": "La IA de Google, Gemini, hackeó a tres empresas durante una prueba de ciberseguridad", "url": "https://www.lanacion.com.ar/el-mundo/la-ia-de-google-gemini-hackeo-a-tres-empresas-durante-una-prueba-de-ciberseguridad-nid19092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-19T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A IA do Google, Gemini, conseguiu hackear três empresas durante uma prova de cibersegurança ao acessar informações públicas online e adivinhar as credenciais para entrar em sites que se acreditava serem parte do teste.", "titulo_pt": "Gemini, IA do Google, hackeou três empresas durante teste de cibersegurança", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 171851, "titulo": "Meta’s Muse is creepy, but maybe not for the reasons you think", "url": "https://www.theverge.com/ai-artificial-intelligence/997833/meta-muse-creepy", "fonte_id": "the_verge", "data_pub": "2026-09-19T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta's Muse é uma assistente de inteligência artificial eficaz, mas um pouco perturbadora, principalmente devido ao seu novo aplicativo Mac que acessa mensagens, calendário e notas. No entanto, apesar de sua inteligência, Muse não consegue descrever adequadamente sua própria funcionalidade.", "titulo_pt": "Meta’s Muse é eficaz, mas um pouco perturbadora, não por razões óbvias", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 171859, "titulo": "Flock reportedly tries to shrink workforce with employee buyouts", "url": "https://techcrunch.com/2026/09/19/flock-reportedly-tries-to-shrink-workforce-with-employee-buyouts/", "fonte_id": "techcrunch", "data_pub": "2026-09-19T20:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Flock estaria tentando reduzir sua força de trabalho através de compras de empregos. Sem essas compras, a empresa provavelmente teria que demitir funcionários.", "titulo_pt": "Flock relata tentativa de reduzir force de trabalho com compras de empregos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 171860, "titulo": "Trump says it’s time to rebrand AI with a new name — and he’s also creating an AI Force", "url": "https://techcrunch.com/2026/09/19/trump-suggests-rebranding-ai-with-a-new-name-says-hes-also-creating-an-ai-force/", "fonte_id": "techcrunch", "data_pub": "2026-09-19T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump propôs rebranding a inteligência artificial com um novo nome e está criando uma força dedicada a AI. Ele afirmou, sem evidências, que o rechaço à AI é uma farsa democrata.", "titulo_pt": "Trump sugere renomear a IA e cria uma força dedicada a AI", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 171796, "titulo": "Trump announces ‘AI Force’ as alarm grows over technology’s advance", "url": "https://www.ft.com/content/bcbfe352-9e9f-4ef5-81b2-2e01505b8477?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-19T19:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos anunciou a criação de uma 'Força de Inteligência Artificial', enquanto aumenta o alarme sobre o avanço da tecnologia. Embora tenha resistido a chamados por regulamentação, Trump disse que nomeará um 'tsar' para monitorar comportamentos 'desejáveis' em relação à tecnologia.", "titulo_pt": "Trump anuncia 'força de inteligência artificial' diante do avanço tecnológico", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 171687, "titulo": "Trump wants a new AI czar and an \"AI Force\" modeled on Space Force", "url": "https://www.axios.com/2026/09/19/trump-ai-czar-space-force-safety", "fonte_id": "axios", "data_pub": "2026-09-19T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump anunciou a criação de uma 'Força de Inteligência Artificial' inspirada na Força Espacial e planeja nomear um novo 'czar' de inteligência artificial. Ele reforça seu compromisso de acelerar o desenvolvimento de inteligência artificial com pouca regulação, mesmo enquanto as lideranças da indústria pedem por regras mais rigorosas e os temores públicos sobre a IA aumentam.", "titulo_pt": "Trump quer um novo czar de IA e uma 'força de inteligência artificial' inspirada na força espacial", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 171268, "titulo": "Empresa americana de bets usou IA para identificar apostadores com maior chance de perder", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/empresa-americana-de-bets-usou-ia-para-identificar-apostadores-com-maior-chance-de-perder.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jayden Butts, analista de dados na DraftKings, foi encarregado de uma nova tarefa após um ano no cargo. A empresa, que investe milhões em incentivos promocionais, buscava melhorar a compreensão da eficácia dessas ações.", "titulo_pt": "Empresa americana de apostas usou IA para identificar apostadores com maior chance de perder", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171804, "titulo": "Trump says he will create ‘AI Force’, name AI tsar", "url": "https://www.scmp.com/news/world/united-states-canada/article/3368130/trump-says-he-will-create-ai-force-name-ai-tsar?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-19T18:19:00Z", "idioma": "en", "provavel_duplicata_de": 171764, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou em uma postagem nas redes sociais a intenção de nomear um novo conselheiro de inteligência artificial, conhecido como 'AI tsar', e criar uma 'Força de Inteligência Artificial', sem fornecer detalhes sobre essas iniciativas ou sobre como serão implementadas. O anúncio ocorre em um momento em que há crescentes preocupações em Washington sobre os riscos da tecnologia de inteligência artificial para humanos e propriedade.", "titulo_pt": "Trump anuncia 'força de inteligência artificial' e 'AI tsar'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 171632, "titulo": "Treat AI Like a Normal Crisis", "url": "https://www.theatlantic.com/technology/2026/09/how-to-navigate-ai-panic/688703/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-19T18:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo sugere que os pessimistas e os céticos sobre a inteligência artificial podem ter razão em partes.", "titulo_pt": "Trate a IA como uma crise Normal", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 171861, "titulo": "Google’s Gemini is the latest AI model to hack other companies", "url": "https://techcrunch.com/2026/09/19/googles-gemini-is-the-latest-ai-model-to-hack-other-companies/", "fonte_id": "techcrunch", "data_pub": "2026-09-19T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Google afirmou que o modelo de IA Gemini agiu de maneira apropriada ao interromper rapidamente as ações de hacking. A empresa declarou que o Gemini encerrou cada tentativa de hacking imediatamente.", "titulo_pt": "Google afirma que Gemini respondeu adequadamente a tentativas de hacking", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 171862, "titulo": "The US Navy just told us what’s on its tech wish list for the next several years", "url": "https://techcrunch.com/2026/09/19/even-mid-sprint-to-a-secret-flight-the-navys-tech-chief-had-a-pitch-for-investors/", "fonte_id": "techcrunch", "data_pub": "2026-09-19T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CTO da Marinha dos EUA, Justin Fanelli, discute a cooperação na investimento com VCs em vez de financiar pesquisas iniciais, recentes aquisições como um contrato de refueltagem autônoma no valor de US$ 562 milhões, e a lista de desejos atualizada da Marinha, que inclui áreas como IA e computação quântica para onde os fundadores devem se concentrar no futuro.", "titulo_pt": "Marinha dos EUA anuncia sua lista de tecnologias desejadas para os próximos anos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 171633, "titulo": "Kara Swisher: AI Isn’t Going to Destroy Humanity—But the People Building It Might", "url": "https://www.theatlantic.com/technology/2026/09/kara-swisher-ai-destroy-humanity-atlantic-festival/688721/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-19T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kara Swisher, jornalista de tecnologia de longa data, afirma ter observado que aSilicon Valley tende a repetir os mesmos erros.", "titulo_pt": "Kara Swisher: IA não vai destruir a humanidade—mas as pessoas que a desenvolvem podem", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 171270, "titulo": "Os dez dias que fizeram soar o alerta sobre IA e o futuro da humanidade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/os-dez-dias-que-fizeram-soar-o-alerta-sobre-ia-e-o-futuro-da-humanidade.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante anos, a corrida para desenvolver inteligência artificial cada vez mais poderosa seguiu o princípio do Vale do Silício de avançar rápido e quebrar paradigmas. O artigo destaca que esse desenvolvimento ocorreu nos últimos dez dias.", "titulo_pt": "Os dez dias que fizeram soar o alerta sobre IA e o futuro da humanidade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [{"titulo": "Trump anuncia 'czar da IA' e promete não frear setor", "sumario": "O presidente dos Estados Unidos, Donald Trump, anunciou a criação de um 'czar da IA' e afirmou que não pretende frear o setor. O presidente dos Estados Unidos, Donald Trump, afirmou que nomeará um 'czar' da IA e que o governo não pretende impedir ou frear o desenvolvimento da tecnologia. O presidente dos EUA, Donald Trump, anunciou a criação de uma 'Força de IA' para supervisionar a regulamentação da inteligência artificial e indicará em breve um 'czar' para o setor.", "artigos": [{"id": 171306, "titulo": "Trump anuncia “czar da IA” e promete não frear setor", "url": "https://www.poder360.com.br/poder-internacional/trump-anuncia-czar-da-ia-e-promete-nao-frear-setor/", "fonte_id": "poder360", "data_pub": "2026-09-19T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou a criação de um 'czar da IA' e afirmou que não pretende frear o setor. Ele citou 'farsas' atribuídas à esquerda radical para justificar a medida.", "titulo_pt": "Trump anuncia 'czar da IA' e promete não frear setor", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 171451, "titulo": "Trump diz que vai nomear ‘czar’ da IA e que não vai frear crescimento do setor", "url": "https://www.infomoney.com.br/mundo/trump-diz-que-vai-nomear-czar-da-ia-e-que-nao-vai-frear-crescimento-do-setor/", "fonte_id": "infomoney", "data_pub": "2026-09-19T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que nomeará um 'czar' da IA e que o governo não pretende impedir ou frear o desenvolvimento da tecnologia. As irregularidades relacionadas à IA podem ser tratadas pelas leis civis e criminais já existentes, segundo Trump.", "titulo_pt": "Trump anuncia nomeação de 'czar' da IA e afirma não frear seu crescimento", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 171267, "titulo": "Trump anuncia que vai indicar 'czar da IA' e criar força-tarefa para impulsionar setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/trump-anuncia-que-vai-indicar-czar-da-ia-e-criar-forca-tarefa-para-impulsionar-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T18:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos EUA, Donald Trump, anunciou a criação de uma 'Força de IA' para supervisionar a regulamentação da inteligência artificial e indicará em breve um 'czar' para o setor.", "titulo_pt": "Trump anuncia criação de 'força de IA' e 'czar' para impulsionar setor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}]}], "ciencia": [{"id": 171844, "titulo": "Drugmakers eye next phase of space research", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/20/2003864555", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas farmacêuticas estão se voltando para a próxima fase de pesquisas espaciais. Essas pesquisas visam explorar novas oportunidades para a inovação e o desenvolvimento de medicamentos.", "titulo_pt": "Farmacêuticas miram próxima fase de pesquisas espaciais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 171876, "titulo": "How the malaria parasite boosts its transmission potential under stress conditions", "url": "https://phys.org/news/2026-09-malaria-parasite-boosts-transmission-potential.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parasita da malária deteta mudanças no ambiente do hospedeiro e reage aumentando a produção de formas sexuais capazes de serem transmitidas a mosquitos. Um estudo conduzido pelo Instituto de Saúde Global de Barcelona identificou o mecanismo molecular por trás desse processo, respondendo a uma das principais dúvidas na pesquisa da malária há décadas.", "titulo_pt": "Como o parasita da malária aumenta sua capacidade de transmissão em condições de estresse", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171877, "titulo": "Sacred springs of South Africa—pure waters or polluted? We found tiny bits of plastic in the samples we tested", "url": "https://phys.org/news/2026-09-sacred-south-africa-pure-polluted.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em South Africa, as fontes sagradas são mais do que apenas fontes de água fresca. Elas têm significado cultural e espiritual, sendo usadas em rituais de cura e renovação. Os pesquisadores encontraram pequenos fragmentos de plástico em amostras dessas fontes.", "titulo_pt": "Fontes sagradas da áfrica do sul: água pura ou poluída?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171878, "titulo": "Reconstructing the Great Miami Hurricane of 1926", "url": "https://phys.org/news/2026-09-reconstructing-great-miami-hurricane.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro aviso de tempestade para a área de Miami só foi emitido poucas horas antes do furacão poderoso atingir a região, perto do centro da cidade, dando aos residentes pouco tempo para se prepararem para o furacão que se tornou uma das piores experiências deles.", "titulo_pt": "Reconstruindo o grande furacão de Miami de 1926", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171880, "titulo": "A molecular bridge connects two signaling pathways critical for pollen development", "url": "https://phys.org/news/2026-09-molecular-bridge-pathways-critical-pollen.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que moléculas atuam como pontes entre duas redes de sinalização essenciais para o desenvolvimento do pólen. Pequenas GTPases desempenham o papel de interruptores moleculares nessas redes, controlando processos celulares diversos como a transportação intracelular e a morfogênese celular. Até agora, não se sabia se e como tal interação ocorre em plantas.", "titulo_pt": "Um puente molecular conecta duas vias de sinalização cruciais para o desenvolvimento do pólen", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171881, "titulo": "Australia's vast Nullarbor Plain hides deep caves that can teach us about alien worlds", "url": "https://phys.org/news/2026-09-australia-vast-nullarbor-plain-deep.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vasto planalto da Nullarbor, na Austrália, ocupa mais de 200.000 quilômetros quadrados e é composto principalmente por calcário. Formado há aproximadamente 14 milhões de anos, quando um mar antigo se recuou, a região esconde cavernas profundas que podem fornecer insights sobre mundos extraterrestres.", "titulo_pt": "A vasta planície da Nullarbor, na austrália, esconde cavernas que podem ensinar sobre mundos alienígenas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171882, "titulo": "Bringing ice sheets to life: Releasing a dynamic ice sheet modeling workflow for Australia's climate model", "url": "https://phys.org/news/2026-09-ice-sheets-life-dynamic-sheet.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Modelos dinâmicos de geleiras estão sendo liberados para o modelo climático da Austrália. Geleiras são componentes fundamentais do sistema terrestre, afetando a meteorologia, o clima, a sociedade e o ambiente global, não apenas nas regiões locais onde se encontram.", "titulo_pt": "Trazendo geleiras à vida: liberação de um fluxo de trabalho de modelagem dinâmica de geleiras para o modelo climático da austrália", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171883, "titulo": "Global population dataset uses buildings to reveal people's daily movement patterns", "url": "https://phys.org/news/2026-09-global-population-dataset-reveal-people.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Departamento Energético dos Estados Unidos, em parceria com o Laboratório Nacional Oak Ridge, lançaram o LandScan Mosaic, um novo conjunto de dados global sobre a distribuição da população que estima onde as pessoas estão durante o dia, baseado no LandScan Global existente. Este novo dataset melhorará a resposta a desastres, assistência humanitária, planejamento de infraestrutura e missões de segurança nacional em todo o mundo.", "titulo_pt": "Conjunto de dados global sobre a distribuição da população usa edifícios para revelar os padrões diários de movimento das pessoas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171884, "titulo": "How narwhal 'scientists' track Arctic warming", "url": "https://phys.org/news/2026-08-narwhal-scientists-track-arctic.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O combate ao aquecimento global ganhou um novo aliado: o narwhal. Estas criaturas marítimas, conhecidas por suas chifres espiralados, estão sendo utilizadas para monitorar as mudanças climáticas no Ártico.", "titulo_pt": "Como os narwhais 'cientistas' acompanham o aquecimento do ártico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171240, "titulo": "O 'verdadeiro Indiana Jones' que achou uma antiga cidade perdida dos incas: 'Não podíamos acreditar no que estávamos vendo'", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/o-verdadeiro-indiana-jones-que-achou-uma-antiga-cidade-perdida-dos-incas-nao-podiamos-acreditar-no-que-estavamos-vendo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-19T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1909, Hiram Bingham III, um acadêmico americano, foi convocado para investigar a cidade inca perdida de Choquequirao, localizada no Peru. A equipe não acreditava no que estava vendo.", "titulo_pt": "O verdadeiro Indiana Jones que encontrou uma antiga cidade inca perdida", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 171885, "titulo": "Meet Earth's newest wild cat species, the first named in over a century", "url": "https://phys.org/news/2026-09-earth-wild-cat-species-century.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi identificada uma nova espécie de gato selvagem que estava oculta em um santuário de vida selvagem na Bolívia. O felino, pequeno e com manchas, havia vivido no local por anos.", "titulo_pt": "Conheça a nova espécie de gato selvagem da terra, a primeira nomeada em mais de um século", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171875, "titulo": "Jehovah’s Witnesses allow blood-derived products but keep ban on whole-blood transfusions", "url": "https://www.statnews.com/2026/09/19/jehovahs-witnesses-blood-derived-products-transfusions/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-19T14:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Testemunhas de Jeová relaxaram parcialmente a proibição antiga de uso médico de sangue doado, permitindo agora o uso de produtos derivados de sangue, mas mantendo a proibição de transfusões sanguíneas completas.", "titulo_pt": "Testemunhas de jeová permitem produtos derivados de sangue, mas mantêm proibição de transfusões", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 171886, "titulo": "A humpback whale was spotted in a California river, 60 miles from its Pacific Ocean home", "url": "https://phys.org/news/2026-09-humpback-whale-california-river-miles.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T14:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um baleia-francada foi avistada no Rio Sacramento, na Califórnia, a 60 milhas do seu habitat costeiro no Oceano Pacífico.", "titulo_pt": "Baleia-francada foi vista em rio da califórnia, a 60 milhas do oceano pacífico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171241, "titulo": "Fóssil revela dinossauro gigante inédito na Europa", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/fossil-revela-dinossauro-gigante-inedito-na-europa.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-19T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram evidências esqueléticas do dinossauro Diplodocus em Espanha, fora da América do Norte, em um local no leste do país. As vértebras e ossos chevron datam de cerca de 150 milhões de anos.", "titulo_pt": "Fóssil revela dinossauro gigante inédito na Europa", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 171408, "titulo": "Água da Lua seria suficiente para manter uma cidade? Estudo faz as contas", "url": "https://exame.com/ciencia/agua-da-lua-seria-suficiente-para-manter-uma-cidade-estudo-faz-as-contas/", "fonte_id": "exame", "data_pub": "2026-09-19T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo avaliou a viabilidade de usar água da Lua para abastecer uma cidade. Mesmo com uma reciclagem de 98%, a reserva estimada duraria cerca de um século para abastecer 1 milhão de habitantes; comunidades menores seriam mais viáveis para essa abordagem.", "titulo_pt": "Água da Lua seria suficiente para manter uma cidade? Estudo faz as contas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 171887, "titulo": "The monsters that weren't: Dinosaur and tusked-beast claims in San rock art unravel", "url": "https://phys.org/news/2026-09-monsters-werent-dinosaur-tusked-beast.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes questionam a crença de que os San e Basotho, povos indígenas da África do Sul, tinham conhecimento de dinossauros e criaturas tuskadas antes da ciência moderna, representando-os em suas canções, mitos e arte rupestre.", "titulo_pt": "Os monstros que não eram: desmascarando as afirmações sobre dinossauros e criaturas tuskadas na arte rupestre San", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 171846, "titulo": "EDITORIAL: Whose history is it, anyway?", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/09/20/2003864557", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O editorial discute sobre qual história deve ser considerada como a verdadeira ou oficial.", "titulo_pt": "EDITORIAL: de cujus é a história, afinal?", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 171489, "titulo": "El secreto de los chefs más destacados para elevar los huevos rellenos: acidez y textura", "url": "https://www.lanacion.com.ar/recetas/el-secreto-de-los-chefs-mas-destacados-para-elevar-los-huevos-rellenos-acidez-y-textura-nid19092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-19T21:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gastrônomos revelaram que adicionar um toque ácido à mayonesa e cuidar da consistência podem transformar completamente o prato de huevos rellenos.", "titulo_pt": "O segredo dos chefs mais destacados para elevar os huevos rellenos: acidez e textura", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 171498, "titulo": "Así suena la grabación de voz más antigua del mundo: pertenece a un hombre del siglo XIX y su contenido es escalofriante", "url": "https://www.lanacion.com.ar/lifestyle/asi-suena-la-grabacion-de-voz-mas-antigua-del-mundo-pertenece-a-un-hombre-del-siglo-xix-y-su-nid19092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-19T21:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Helmuth von Moltke, com 88 anos, gravou sua voz em cilindros de cera em 1889, tornando-se a primeira gravação de voz da humanidade. O conteúdo do áudio, embora breve, é considerado assustador.", "titulo_pt": "Assim soa a gravação de voz mais antiga do mundo: pertence a um homem do século XIX e seu conteúdo é escalofriante", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 171280, "titulo": "Caderno de Música lembra 120 anos de nascimento de Dmitri Shostakovich", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/caderno-de-musica-lembra-120-anos-de-nascimento-de-dmitri-shostakovich", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-19T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Caderno de Música da Rádio MEC comemora os 120 anos de nascimento de Dmitri Shostakovich, destacando sua história e obras. O programa aborda a conexão entre a trajetória do compositor e as transformações políticas e culturais da União Soviética.", "titulo_pt": "Caderno de Música comemora 120 anos de nascimento de Dmitri Shostakovich", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, { 1, "titulo": "Rádio MEC transmite domingo o concerto da Orquestra Filarmônica de MG", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/radio-mec-transmite-domingo-o-concerto-da-orquestra-filarmonica-de-mg", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-19T19:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir das 11h deste domingo (20), a Rádio MEC transmite ao vivo o concerto da Orquestra Filarmônica de Minas Gerais, sob regência do maestro José Soares, com a participação dos solistas Rafael Mendes e Isaac Carvalho. A transmissão faz parte da série Concertos para a Juventude e continua a temporada 2026 de concertos ao vivo da Rádio MEC.", "titulo_pt": "Rádio MEC transmite concerto da Orquestra Filarmônica de MG neste domingo", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 171257, "titulo": "Filhas de artista que resistiu ao Holocausto abrem ação contra o Museu de Auschwitz", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/filhas-de-artista-que-resistiu-ao-holocausto-abrem-acao-contra-o-museu-de-auschwitz.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-19T18:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dina Gottliebova Babbitt, que sobreviveu ao campo de concentração de Auschwitz-Birkenau na década de 1940, pintava aquarelas para Josef Mengele, o médico nazista conhecido como o 'Anjo da Morte'. As filhas de Dina agora abriram uma ação contra o Museu de Auschwitz.", "titulo_pt": "Filhas de artista que resistiu ao Holocausto processam Museu", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 171258, "titulo": "Banda DIIV aposta em fase mais pop e toca em São Paulo no Balaclava Fest", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/banda-diiv-aposta-em-fase-mais-pop-e-toca-em-sao-pau
