const D = {"gerado_em": "30/10/2026 07:19", "stats": {"noticias_novas": 635, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil reelegeu Lula (PT) com 51,79% dos votos válidos no segundo turno contra 48,21% de Flávio Bolsonaro (PL). Durante a campanha, Lula participou ativamente, enquanto Bolsonaro foi mais contido. Após a vitória, Lula iniciou seu segundo mandato sem compromissos públicos, mantendo reuniões privadas e um período de descanso. Um dos maiores desafios do novo governo será a aprovação de reformas no Congresso, conforme indicado pela Moody’s. Além disso, a justiça determinou que a Meta retire publicações que incentivem demissões por causa do voto nas eleições. O senador Davi Alcolumbre, presidente do Senado, intensificou as articulações para conseguir um terceiro mandato, o que gerou desconfiança tanto na oposição quanto no governo. A direita rejeitou a proposta de trocar apoio a Alcolumbre por um indulto a Jair Bolsonaro, preferindo reduções de penas. O governo Lula enfrenta um impasse sobre as medidas de ajuste fiscal, com o presidente demonstrando resistência em propor medidas mais robustas, que poderiam ser consideradas estelionato eleitoral.", "mundo": "O presidente dos Estados Unidos, Donald Trump, fez uma visita inesperada à Casa Branca, distribuindo doces e tirando fotos com crianças em trajes de Halloween. Em Espanha, a investigação sobre o acidente ferroviário em Toledo continua, enquanto as evacuações em Oleshky, ocupadas pelo Exército Russo, são realizadas como parte de um cessar-fogo localmente brokerado pelos Estados Unidos. A encerramento da revista independente Novaya Gazeta na Rússia, atribuído à pressão das autoridades, é outro destaque. O Departamento de Estado sul-coreano indicou que o país e os Estados Unidos podem fazer progressos significativos em tecnologias de reatores modulares pequenos (SMRs). A eleição marcada para o próximo mês em Espanha está redefinindo as linhas de batalha, com Pedro Sánchez agora obrigado a defender o registro de segurança do governo. O presidente reeleito Luiz Inácio Lula da Silva (PT) enfrentará compromissos internacionais importantes antes de encerrar seu terceiro mandato em 2026, incluindo a transição da presidência da COP, conferência das Nações Unidas sobre Mudanças Climáticas, para a Turquia. O presidente israelense Isaac Herzog, sem maioria no Knesset, pode buscar formar um governo unificado, como seu pai fez há 42 anos. A União Europeia e 11 dos seus países, incluindo França, Alemanha e Itália, declararam que liberarão 42,6 milhões de barris de petróleo de seus estoques estratégicos até o final de janeiro de 2027, com 20,5 milhões de barris sendo diesel. O bloco de Netanyahu terminou as eleições israelenses sem maioria no Parlamento de Israel, com 53 das 120 cadeiras, enquanto a oposição obteve 48 assentos.\n\nA Arábia Saudita relatou a interceptação de um drone hutíe que pretendia atingir a cidade sagrada de Meca. O grupo hutíe negou a alegação. Em outro evento, Israel invadiu o túmulo de José em Nablus e realizou operações em vilas vizinhas, entrando e revistando várias casas. Além disso, a China realizou operações de decolagem e pouso do drone GJ-21 em seu primeiro navio de assalto Tipo 076, conforme informado pela mídia estatal. O Irã afirmou que quatro navios-pipa foram detonados por minas no Estreito de Ormuz, enquanto Teerã negou uma declaração dos Estados Unidos sobre a limpeza de rotas marítimas cruciais. Outro ponto importante é que a China acusou Manila de obstruir sua participação na reunião de ministros de defesa da ASEAN em Cebu, ao mesmo tempo que o acúmulo militar chinês criou uma 'pressão' na Ásia do Sul, conforme comentado pelo chefe da defesa australiana.", "economia": "O Banco do Japão manteve a taxa básica de juros em 1,25%, mesmo após revisar suas projeções de inflação para 2027. Em contraste, a economia da França registrou uma contratação de 0,1% no terceiro trimestre, refletindo preocupações sobre a dívida e déficit orçamentário do país. A Receita Federal pagou R$ 531,6 milhões em restituições extras do Imposto de Renda 2026 para 184,4 mil contribuintes. A BYD inaugurou uma fábrica em Camaçari, Bahia, com investimentos de mais de R$ 11 bilhões, e planeja exportações para o Mercosul. Além disso, a JSL vale menos que dois anos de caixa após a eleição, refletindo a rejeição do investidor ao resultado das urnas, enquanto a Bolsa teve a pior semana pós-eleição em 37 anos. A TotalEnergies registrou um lucro recorde no terceiro trimestre, com as refinarias operando em capacidade máxima. Por fim, o Banco Central Europeu manteve as taxas de juros inalteradas, apesar da inflação crescente na zona do euro, com Christine Lagarde anunciando sua saída nove meses antes do fim do mandato.", "tecnologia": "As ações sul-coreanas caíram mais de 3% na sexta-feira, com a venda de ações de semicondutores contribuindo para a queda, devido a preocupações persistentes sobre a sustentabilidade das investidas em inteligência artificial. O índice KOSPI fechou em 5.730,74 pontos. A Samsung Eletrônicos adquiriu toda a participação da Samsung Display na empresa de painéis chinesa TCL CSOT por cerca de 1,27 trilhões de wones (US$ 950 milhões), fortalecendo as relações de suprimento de painéis LCD para sua linha de televisores. A Samsung Display focará suas atividades em painéis OLED de alta gama. Além disso, a Cathay Pacific Airways, companhia aérea de bandeira de Hong Kong, informou que dados pessoais e detalhes de voos de 53.000 reservas foram comprometidos após hackers acessarem o sistema do fornecedor de tecnologia Amadeus IT Group. O acesso não autorizado ocorreu entre agosto de 2023 e setembro de 2026. A neocloud, apoiada pela Nvidia, está investindo em um campus de centro de dados no estado americano da West Virginia, que enfrenta problemas de construção, oposição local e riscos financeiros. Um artigo afirma que a presença de armas nucleares dos Estados Unidos no Japão não contribuiria para tornar o país mais seguro. Um estudo descobriu que mais de 50% dos respondentes conseguiram reduzir suas horas de trabalho em pelo menos uma hora por semana graças à inteligência artificial gerativa.", "ciencia": "Pesquisadores da Universidade de Tóquio desenvolveram uma técnica de microscopia de alta velocidade que captura imagens 3D de células vivas quase 400 vezes mais rápido, permitindo a criação de 'vídeos' dos processos dinâmicos internos nas células. Além disso, cientistas confirmaram que a pele de frutas e vegetais contém mais fibras do que as partes comestíveis desses alimentos, incluindo a casca de kiwi e as sementes de abóbora. Um novo estudo da NASA indica que 252 milhões de hectares em 149 países estão sendo restaurados, gerando mais de 1 milhão de empregos verdes, o que representa o maior esforço de restauração global documentado até o momento. A ONU relata que, apesar dos avanços, é necessário acelerar as restaurações para atingir os objetivos estabelecidos.", "cultura": "O Festival Internacional de Artes de Baku, no Azerbaijão, apresenta a criação cine-musical 'Oh to Believe in Another World' de William Kentridge, que combina títeres, dança e humor para explorar temas como humanidade, dor e idealismo, acompanhado pela Sinfonia nº 10 de Shostakovich. A M+, museu de Hong Kong, formou uma aliança tripla com o MoMA de Nova York e o Centre Pompidou de Paris para redefinir a coleção, exposições e compartilhamento de cultura visual globalmente. Em São Paulo, o Teatro Anchieta, localizado no Sesc Consolação, é um importante centro cultural e um marco de inovação cênica. O Teatro Porto, inaugurado em 2015, destaca-se por seu palco que pode abrigar estruturas em dois níveis, já recebendo mais de 700 mil espectadores. Além disso, a Sympla, plataforma de ingressos, foi eleita pela terceira vez consecutiva como a melhor do mercado em São Paulo.", "sociedade": "Um adolescente de 16 anos morreu após ser baleado em Pudahuel, no Chile, conforme informou a Fiscalía ECOH. O incidente ocorreu em um contexto de crescentes preocupações sobre a segurança nas comunidades locais. Em outro evento, um acidente envolvendo trens na Espanha deixou pelo menos 69 mortos, com moradores de Urda se mobilizando para auxiliar as vítimas. No Brasil, uma brasileira foi ferida em um acidente com trens de alta velocidade, confirmado pelo Itamaraty. O desemprego no Chile aumentou para 9,8%, enquanto camionistas de San Antonio iniciaram o primeiro paro sob o governo de Kast. Em uma investigação realizada após um ano do massacre no Rio de Janeiro, a Human Rights Watch revelou que a polícia tentou ocultar imagens de câmeras corporais. A organização apontou que a lei antifacção trouxe avanços, mas também gerou problemas. Além disso, o desafio enfrentado por imigrantes coreanos com a recente advertência do presidente Lee Jae Myung sobre os benefícios excessivos para famílias multicultural foi destacado, com argumentos de que o debate pode obscurecer os desafios continuos enfrentados por essas famílias.", "meio_ambiente": "O Brasil enfrenta um novo surto da doença de Newcastle em aves na região de Santa Catarina, aumentando as preocupações com a produção avícola no país. No exterior, a Indonésia registra 3.500 mortes devido à poluição de fumaça causada por incêndios florestais, enquanto a região de Hawizeh, no Iraque, sofre com a degradação do meio ambiente devido à seca e à expansão da extração de óleo. No contexto global, as mudanças climáticas são declaradas como uma emergência de saúde pública, com quase 3 milhões de mortes atribuídas ao calor extremo entre 2016 e 2023, conforme relatório da Lancet Countdown. No Brasil, o MapBiomas revela que a vegetação foi reduzida em 45% nos últimos 38 anos, com a fragmentação de florestas, enquanto a cidade de Los Angeles proíbe a extração de petróleo em um passo significativo para a neutralidade de carbono.", "direitos_humanos": "A China está debatendo uma lei antirrepresão transnacional, com relatos de supostas forçadas a se desculpar. No Irã, o cineasta Jafar Panahi foi condenado a cinco anos de prisão e proibido de viajar e usar redes sociais por dois anos. Em Gaza, palestinos acusam forças de ocupação israelenses e comerciantes de causar uma 'fome engenhosamente criada', afirmando que a política visa fazer com que os habitantes se confrontem entre si. No Sudão, um departamento de investigação identificou 25 comandantes presentes em cinco locais durante períodos relatados de violência sexual. Um estudo do Serviço Geológico dos Estados Unidos sugere que o número de mortes no terremoto na Venezuela pode ser maior do que o governo venezuelano declara. Além disso, um relatório da Amnesty Internacional afirma que policiais e soldados servidores trabalharam como guardas em esquemas de estelionato em Camboja, enquanto um adolescente com ligações a trios foi condenado a oito anos de prisão por atacar uma turista de Singapura com líquido corrosivo em Hong Kong em 2022."}, "resumo_do_dia": {"politica_nacional": [{"id": 234656, "titulo": "Petista 'liberal'? Como governador Rafael Fonteles entrou no radar de Lula para comandar a economia do Brasil", "url": "https://www.bbc.com/portuguese/articles/cx1l37yrndmro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-30T09:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rafael Fonteles, reeleito governador do Piauí com alta aprovação, implementou um governo que incluiu parcerias público-privadas e uma gestão fiscal responsável.", "titulo_pt": "Petista 'liberal'? Como governador Rafael Fonteles entrou no radar de Lula para comandar a economia do Brasil", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 234855, "titulo": "Regulamentar o lobby é qualificar a decisão pública", "url": "https://www.jota.info/opiniao-e-analise/artigos/regulamentar-o-lobby-e-qualificar-a-decisao-publica", "fonte_id": "jota", "data_pub": "2026-10-30T09:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação do lobby deve estabelecer parâmetros éticos e procedimentos objetivos, além de oferecer segurança jurídica. O título traduzido é: 'Regulamentar o lobby é qualificar a decisão pública'.", "titulo_pt": "Regulamentar o lobby é qualificar a decisão pública", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 234553, "titulo": "A eleição que Lula entendeu", "url": "https://veja.abril.com.br/coluna/murillo-de-aragao/a-eleicao-que-lula-entendeu/", "fonte_id": "veja", "data_pub": "2026-10-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente participou ativamente da campanha eleitoral, enquanto Flávio Bolsonaro teve um comportamento mais contido.", "titulo_pt": "A eleição que Lula entendeu", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 234524, "titulo": "Podcast entrevista André Singer e discute rumos do lulismo no governo Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/podcasts/2026/10/podcast-entrevista-andre-singer-e-discute-rumos-do-lulismo-no-governo-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na semana após a vitória no segundo turno, o foco do noticiário se deslocou para a fuga e a carta golpista de Flávio Bolsonaro, que isolou o candidato derrotado mesmo entre aqueles que o haviam apoiado.", "titulo_pt": "Podcast discute rumos do lulismo no governo Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 234569, "titulo": "Maior desafio de Lula 4 será aprovar reformas no Congresso, diz Moody’s", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/maior-desafio-de-lula-4-sera-aprovar-reformas-no-congresso-diz-moodys/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T07:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O maior desafio para o governo de Lula será aprovar reformas no Congresso, segundo a Moody’s. Juros elevados também pressionam as contas do país.", "titulo_pt": "Maior desafio de Lula será aprovar reformas no Congresso, diz Moody’s", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234642, "titulo": "Promessas de Alcolumbre geram desconfiança na oposição e no governo", "url": "https://www.metropoles.com/brasil/promessas-de-alcolumbre-geram-desconfianca-na-oposicao-e-no-governo", "fonte_id": "metropoles", "data_pub": "2026-10-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Alcolumbre, intensifica as articulações para conseguir um terceiro mandato. Essa ação gera desconfiança tanto na oposição quanto no governo.", "titulo_pt": "Promessas de terceiro mandato de Alcolumbre geram desconfiança", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 234516, "titulo": "Justiça manda Meta remover conteúdos de assédio eleitoral contra trabalhadores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/justica-manda-meta-remover-conteudos-de-assedio-eleitoral-contra-trabalhadores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trabalho determinou que a Meta remova publicações que incentivem empresários a vigiar, expor e demitir funcionários por causa do voto nas eleições presidenciais, em até 24 horas.", "titulo_pt": "Justiça determina que Meta remova conteúdos de assédio eleitoral contra trabalhadores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234525, "titulo": "Sabatinas de Kassio e Mendonça expõem complacência do Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/10/sabatinas-de-kassio-e-mendonca-expoem-complacencia-do-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As sabatinas de Kassio Brás e André Mendonça, candidatos ao Supremo Tribunal Federal, destacaram a complacência do Senado no processo de avaliação. André Mendonça, apoiado pelo ex-presidente Jair Bolsonaro, é o candidato evangélico favorito para uma vaga no STF.", "titulo_pt": "Sabatinas de Kassio e Mendonça revelam complacência do Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 234582, "titulo": "Lula reúne aliados e mapeia novo governo em primeira semana pós-eleições", "url": "https://www.cnnbrasil.com.br/politica/lula-reune-aliados-e-mapeia-novo-governo-em-primeira-semana-pos-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente realizou um único compromisso público, seu aniversário de 81 anos, e manteve reuniões privadas e um período de descanso após o fim da campanha eleitoral.", "titulo_pt": "Lula reúne aliados e planeja novo governo na primeira semana após as eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234527, "titulo": "A posição do Brasil no mundo com a reeleição de Lula - O Assunto #1836", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/10/30/a-posicao-do-brasil-no-mundo-com-a-reeleicao-de-lula-o-assunto-1836.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os olhos do mundo estavam voltados para o Brasil após a reeleição de Lula. A vitória de Lula colocou o país em uma direção contrária à do governo americano e de seus vizinhos latino-americanos, mas aproximou-o de parceiros globais como China e União Europeia.", "titulo_pt": "A posição do Brasil no mundo com a reeleição de Lula - O Assunto #1836", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233272, "titulo": "Senadores de partidos de esquerda traçam estratégias para fazer frente à bancada recorde do PL", "url": "https://g1.globo.com/politica/noticia/2026/10/30/senado-esquerda-bancada-recorde-do-pl.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores de partidos de esquerda estão planejando estratégias para contrabalançar a influência da bancada recorde do PL no Senado, que será composta principalmente por parlamentares de direito, assumindo em 2027. Essa bancada vai ocupar mais de um terço da Casa, o que representa um desafio significativo para a articulação política do governo Lula.", "titulo_pt": "Senadores de esquerda traçam estratégias para enfrentar bancada recorde do PL no senado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233273, "titulo": "Carta de Flávio Bolsonaro e fuga do Brasil geram críticas até entre aliados e movimentam direita para 2030", "url": "https://g1.globo.com/politica/noticia/2026/10/30/repercussao-carta-de-flavio-bolsonaro-e-fuga-do-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador pelo PL-RJ, saiu do Brasil após a derrota na eleição presidencial e publicou uma carta onde se autoproclamou presidente eleito, gerando críticas entre aliados e movimentando a direita para as eleições de 2030.", "titulo_pt": "Carta de Flávio Bolsonaro e fuga do Brasil geram críticas entre aliados e movimentam direita para 2030", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233274, "titulo": "Entre veteranos e novos nomes, Nordeste marca presença no entorno de Lula; veja aliados", "url": "https://g1.globo.com/politica/noticia/2026/10/30/entre-veteranos-e-novos-nomes-nordeste-marca-presenca-no-entorno-de-lula-veja-aliados.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula contou com a presença de nove lideranças nordestinas de diferentes gerações durante seu discurso de vitória, incluindo aliados históricos, novos nomes da campanha e representantes da nova geração da esquerda. O governador reeleito do Piauí, Rafael Fonteles, foi um dos principais destaques.", "titulo_pt": "Entre veteranos e novos nomes, Nordeste marca presença no entorno de Lula; veja aliados", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233466, "titulo": "Justiça manda Meta tirar do ar postagens de assédio eleitoral em até 24h", "url": "https://www.metropoles.com/distrito-federal/justica-manda-meta-tirar-do-ar-postagens-de-assedio-eleitoral-em-ate-24h", "fonte_id": "metropoles", "data_pub": "2026-10-30T02:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça determinou que a Meta, proprietária do Facebook, remova postagens que incentivam demissões por causa do voto nas plataformas em até 24 horas. A decisão atendeu a uma ação civil movida pelo MPT.", "titulo_pt": "Justiça manda Meta remover postagens de assédio eleitoral em até 24h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233198, "titulo": "Alíquota da reforma tributária mostra de forma crua uma carga que o Brasil não conseguia ver", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/aliquota-da-reforma-tributaria-mostra-de-forma-crua-uma-carga-que-o-brasil-nao-conseguia-ver.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após as eleições presidenciais, ficou conhecida a alíquota de 11,3% da CBS (Contribuição sobre Bens e Serviços), sugerida pelo TCU. Essa alíquota revela a carga tributária proposta para a reforma tributária.", "titulo_pt": "Alíquota da reforma tributária mostra de forma crua a carga tributária do Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 233199, "titulo": "Após boicotes, apoiadores de Lula divulgam listas para prestigiar restaurantes associados à esquerda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/apos-boicotes-apoiadores-de-lula-divulgam-listas-para-prestigiar-restaurantes-associados-a-esquerda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após apoiadores de Flávio Bolsonaro divulgar listas de estabelecimentos supostamente ligados à esquerda para incentivar boicotes, usuários das redes sociais passaram a compartilhar nomes de bares, restaurantes e cafés para estimular o movimento contrário, em apoio aos negócios associados à esquerda.", "titulo_pt": "Após boicotes, apoiadores de Lula divulgam listas para prestigiar restaurantes associados à esquerda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 234876, "titulo": "US: Trump hands out sweets as Air Force One soars overhead", "url": "https://www.euronews.com/video/2026/10/30/us-trump-hands-out-sweets-as-air-force-one-soars-overhead", "fonte_id": "euronews", "data_pub": "2026-10-30T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald e Melania Trump receberam crianças em trajes de Halloween na Casa Branca. O casal distribuiu doces, posou para fotos e observou o voo do Air Force One no céu.", "titulo_pt": "Trump distribui doces enquanto Air Force One voa acima da casa branca", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234890, "titulo": "Saudi Arabia reports interception of Houthi drone targeting Mecca", "url": "https://www.aljazeera.com/news/2026/10/30/saudi-arabia-reports-interception-of-houthi-drone-targeting-mecca?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita relatou a interceptação de um dron do grupo Houthis que pretendia atingir a cidade sagrada de Meca. O grupo Houthis nega ter alvejado a região.", "titulo_pt": "Arábia saudita relata interceptação de dron hutí no direito de meca", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234941, "titulo": "Israeli forces storm Joseph’s Tomb, raid homes in Nablus villages", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-storm-josephs-tomb-raid-homes-nablus-villages", "fonte_id": "middle_east_eye", "data_pub": "2026-10-30T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses invadiram o túmulo de José em Nablus e realizaram operações em vilas vizinhas, entrando e revistando várias casas, de acordo com a agência de notícias palestiniana Wafa.", "titulo_pt": "Forças israelenses invadem túmulo de josé e realizam operações em vilas de Nablus", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 234756, "titulo": "Spain continues to investigate causes of deadly Toledo train crash – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/30/spain-investigates-toledo-crash-pedro-sanchez-france-italy-protests-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-30T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A investigação completa do acidente ferroviário letal em Toledo, Espanha, deve levar semanas para ser concluída. Além disso, evacuações estão sendo realizadas em Oleshky, ocupada pelo Exército Russo, como parte de um cessar-fogo localmente brokerado pelos Estados Unidos, com o objetivo de fornecer assistência humanitária aos residentes da cidade. 527 pessoas estão retornando para territórios controlados pela Ucrânia.", "titulo_pt": "Espanha continua a investigar causa do trágico acidente ferroviário em Toledo – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 234953, "titulo": "Mourning Day Declared in Bosnia’s Brcko Following Deadly EUFOR Helicopter Crash", "url": "https://balkaninsight.com/2026/10/30/mourning-day-declared-in-bosnias-brcko-following-deadly-eufor-helicopter-crash/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-30T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi declarado um dia de luto em Brcko, no nordeste da Bósnia, após um acidente de helicóptero que resultou na morte de quatro membros da missão de paz italiana.", "titulo_pt": "Dia de luto Declared em Brcko, bósnia, após acidente com helicóptero de missão de paz italiana", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 234983, "titulo": "Saudi Arabia says Houthis-launched drone destroyed near Mecca, group denies", "url": "https://www.scmp.com/news/world/middle-east/article/3372733/saudi-arabia-says-houthis-launched-drone-destroyed-near-mecca-group-denies", "fonte_id": "scmp", "data_pub": "2026-10-30T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita afirmou que interceptou e destruiu um drone lançado por rebeldes hutíes, apoiados pelo Irã, perto da cidade sagrada de Meca. O grupo hutíe negou ter realizado qualquer operação contra a cidade.", "titulo_pt": "Arábia saudita diz que interceptou drone hutíe perto de meca, grupo nega", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 234892, "titulo": "Russian oil refinery struck as Ukraine renews drone attacks", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/30/russian-oil-refinery-struck-as-ukraine-renews-drone-attacks?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades russas afirmam ter interceptado mais de mil drones ucranianos em várias regiões durante a noite. Uma refinaria de petróleo russa foi atingida em um novo ataque aéreo por drones da Ucrânia.", "titulo_pt": "Refinaria russa atingida em novos ataques aéreos de drones da Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234757, "titulo": "Russian newspaper Novaya Gazeta to close, citing pressure from ‘special services’", "url": "https://www.theguardian.com/world/2026/oct/30/novaya-gazeta-russia-independent-newspaper-to-close", "fonte_id": "guardian_world", "data_pub": "2026-10-30T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A revista independente russa Novaya Gazeta anunciou seu encerramento, atribuindo a medida à pressão das autoridades, que recentemente buscou a residência do seu editor-chefe e deteve um de seus jornalistas anteriormente. O editor-chefe, Sergei Sokolov, afirmou que as autoridades especiais russas foram responsáveis pelo fechamento da publicação.", "titulo_pt": "Novaya Gazeta, jornal independente russo, anuncia encerramento devido à pressão das autoridades", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 234985, "titulo": "China carries out GJ-21 drone take-off, landing from first Type 076 warship: state media", "url": "https://www.scmp.com/news/china/military/article/3372726/china-carries-out-gj-21-drone-take-landing-first-type-076-warship-state-media", "fonte_id": "scmp", "data_pub": "2026-10-30T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China realizou operações de decolagem e pouso do drone GJ-21 de seu primeiro navio de assalto Tipo 076, conforme informado pela mídia estatal. Em outubro, o navio Sichuan realizou testes de mar consecutivos.", "titulo_pt": "China realiza decolagem e pouso de drone GJ-21 no primeiro navio tipo 076: mídia estatal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 235073, "titulo": "The Iran War’s Impact on Oil Is Hitting Key Senate Races Hard", "url": "https://www.wired.com/story/iran-war-impact-on-oil-hits-key-senate-races/", "fonte_id": "wired", "data_pub": "2026-10-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas estão utilizando o alto preço do diesel, do óleo de aquecimento e do fertilizante para ligar os republicanos à guerra incómoda e custosa do presidente Donald Trump na Irã.", "titulo_pt": "A guerra na Irã e o impacto no petróleo estão afetando as eleições senadoriais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 235076, "titulo": "(Yonhap Interview) S. Korea, U.S. can make 'great' progress in SMRs: State Department official", "url": "https://en.yna.co.kr/view/AEN20261030010900320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Estado sul-coreano indicou que o país e os Estados Unidos podem fazer progressos significativos em tecnologias de reatores modulares pequenos (SMRs).", "titulo_pt": "Coreia do sul e EUA podem avançar significativamente em SMRs, diz oficial do departamento de estado", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234893, "titulo": "Oil flows are up as Iran war turmoil eases. Why do prices keep rising?", "url": "https://www.aljazeera.com/economy/2026/10/30/oil-flows-are-up-as-iran-war-turmoil-eases-why-do-prices-keep-rising?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo Brent subiram mais de 60% em comparação com os níveis pré-guerra, apesar do aumento na oferta. Os preços do petróleo continuam a subir mesmo com a recuperação da produção de petróleo no Irã.", "titulo_pt": "Preços do petróleo sobem mais de 60% mesmo com aumento na oferta; por que os preços continuam a subir?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234990, "titulo": "Trump’s days of running US-China relations on personal ties are numbered", "url": "https://www.scmp.com/opinion/world-opinion/article/3372343/trumps-days-running-us-china-relations-personal-ties-are-numbered", "fonte_id": "scmp", "data_pub": "2026-10-30T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump e Xi parecem ter decidido que a relação entre os Estados Unidos e China deve ser principalmente conduzida por suas relações pessoais, em vez de através de instituições oficiais. Este é um aspecto característico dos anos de Trump, durante os quais ele centralizou a autoridade sobre a política externa em si mesmo, em vez de delegá-la a outros membros do governo.", "titulo_pt": "Os dias de trump gerenciando as relações entre EUA e china por laços pessoais estão chegando ao fim", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 234639, "titulo": "Hackers da Coreia do Norte podem estar por trás de roubo de criptomoedas", "url": "https://www.metropoles.com/mundo/hackers-da-coreia-do-norte-podem-esta-por-tras-de-roubo-de-criptomoedas", "fonte_id": "metropoles", "data_pub": "2026-10-30T08:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gigante das criptomoedas Binance foi vítima de um ataque hacker que resultou em um roubo de US$ 6,3 bilhões, considerado o maior roubo na história do setor.", "titulo_pt": "Hackers da Coreia do Norte podem estar por trás do maior roubo de criptomoedas da binance", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 234784, "titulo": "North Korea’s Enemies Within", "url": "https://www.foreignaffairs.com/north-korea/north-koreas-enemies-within", "fonte_id": "foreign_affairs", "data_pub": "2026-10-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto questiona a lealdade dos elites ao líder norte-coreano Kim Jong Un.", "titulo_pt": "Os inimigos internos de kim jong un", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 234785, "titulo": "Can the Nordic Model Save NATO?", "url": "https://www.foreignaffairs.com/northern-europe/can-nordic-model-save-nato", "fonte_id": "foreign_affairs", "data_pub": "2026-10-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute uma nova abordagem para dissuadir a Rússia. O modelo nórdico pode ser explorado como uma alternativa para a NATO.", "titulo_pt": "O modelo nórdico pode salvar a NATO?", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 234636, "titulo": "CNC Tech Day 2026 prepara empresários do comércio para a nova economia", "url": "https://www.metropoles.com/conteudo-especial/tech-day-2026", "fonte_id": "metropoles", "data_pub": "2026-10-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento CNC Tech Day 2026 reuniu especialistas e executivos de grandes empresas tecnológicas para discutir as transformações nos negócios. O evento, promovido pelo Sistema CNC-Sesc-Senac, prepara empresários do comércio para a nova economia.", "titulo_pt": "CNC Tech Day 2026 prepara empresários do comércio para a nova economia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 234535, "titulo": "Banco do Japão mantém taxa básica de juros em 1,25%", "url": "https://www.poder360.com.br/poder-economia/banco-do-japao-mantem-taxa-basica-de-juros-em-125/", "fonte_id": "poder360", "data_pub": "2026-10-30T08:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão manteve a taxa básica de juros em 1,25%. A instituição elevou suas projeções de inflação para 2027 e reiterou sua disposição de continuar elevando os custos de empréstimo.", "titulo_pt": "Banco do Japão mantém taxa básica de juros em 1,25%", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 235019, "titulo": "China's memory module bellwethers post record profits as 3Q26 momentum fades", "url": "https://www.digitimes.com/news/a20261030VL212/memory-module-profit-revenue-sina-inventory.html", "fonte_id": "digitimes", "data_pub": "2026-10-30T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas chinesas listadas de módulos de memória, que fornecem uma visão antecipada da recuperação global da memória, registraram lucros que aumentaram mais de 300 vezes nos primeiros nove meses de 2026. No entanto, vários dos maiores players registraram significativas quedas no lucro no terceiro trimestre, indicando que o lucro extra proveniente de estoques de baixo custo se encaixando em preços de contrato em alta está diminuindo.", "titulo_pt": "Fabricantes chineses de módulos de memória relatam lucros recorde, mas sinais de desaceleração aparecem", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 234852, "titulo": "French economy shrinks 0.1 percent in third quarter", "url": "https://www.lemonde.fr/en/france/article/2026/10/30/french-economy-shrinks-0-1-percent-in-third-quarter_6767257_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-30T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia da França contraiu 0.1% no terceiro trimestre. Os temores sobre a alta dívida e déficit orçamentário do país têm levado a uma elevação nos rendimentos dos títulos soberanos franceses nos últimos meses.", "titulo_pt": "Economia francesa encolhe 0.1% no terceiro trimestre", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 235079, "titulo": "S. Korean won strengthens against U.S. dollar", "url": "https://en.yna.co.kr/view/AEN20261030011400320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano fortaleceu em relação ao dólar americano. Este movimento ocorreu em Seul, em 30 de outubro.", "titulo_pt": "Won sul-coreano fortalece contra o dólar americano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234517, "titulo": "O que muda para o consumidor com a recuperação extrajudicial da Ri Happy", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/o-que-muda-para-o-consumidor-com-a-recuperacao-extrajudicial-da-ri-happy.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça de São Paulo permitiu a recuperação extrajudicial da Ri Happy, uma rede de lojas de brinquedos que busca renegociar R$ 827,4 milhões em dívidas. A empresa recebeu proteção contra cobranças de credores por 180 dias.", "titulo_pt": "O que muda para o consumidor com a recuperação extrajudicial da Ri Happy", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234518, "titulo": "Receita paga R$ 531,6 milhões em lote extra de restituição do Imposto de Renda; veja quem recebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/receita-paga-r-5316-milhoes-em-lote-extra-de-restituicao-do-imposto-de-renda-veja-quem-recebe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal efetuou o pagamento de R$ 531,6 milhões em restituições extras do Imposto de Renda 2026 para 184,4 mil contribuintes. Os valores foram depositados nas contas informadas pelos contribuintes ou por meio do Pix, se essa foi a opção escolhida.", "titulo_pt": "Receita paga R$ 531,6 milhões em lote extra de restituição do Imposto de Renda; veja quem recebe", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234519, "titulo": "Dois temores podem definir o sucesso do IPO bilionário da Anthropic", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/dois-temores-podem-definir-o-sucesso-do-ipo-bilionario-da-anthropic.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sucesso do IPO futuro da Anthropic dependerá de qual dos dois medos prevalecer: o medo de ficar de fora ou o medo de cometer um erro.", "titulo_pt": "Dois medos podem definir o sucesso do IPO bilionário da Anthropic", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234520, "titulo": "TST nega indenização a faxineira que teve faltas descontadas por atestados sem CID", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/tst-nega-indenizacao-a-faxineira-que-teve-faltas-descontadas-por-atestados-sem-cid.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Quinta Turma do TST rejeitou o pedido de indenização por danos morais de uma faxineira que teve dias de trabalho descontados por apresentar atestados médicos sem o código da doença. A decisão considera que a exigência prevista na convenção coletiva não viola a intimidade da trabalhadora nem a LGPD.", "titulo_pt": "TST nega indenização a faxineira por faltas descontadas com atestados sem CID", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234521, "titulo": "Alíquota acima do previsto dificulta adaptação das empresas à reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/aliquota-acima-do-previsto-dificulta-adaptacao-das-empresas-a-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alíquota de referência da CBS foi ajustada para 11,3%, acima do esperado, exigindo que as empresas refaçam as contas. Este aumento deve pressionar o caixa das varejistas a partir de 2027.", "titulo_pt": "Alíquota cbs acima do esperado dificulta adaptação das empresas à reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234522, "titulo": "Investida de big techs em data centers consome caixa e assusta mercado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/investida-de-big-techs-em-data-centers-consome-caixa-e-assusta-mercado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro das maiores empresas de tecnologia registraram um novo recorde de gastos no último trimestre, aumentando suas investidas em data centers para o desenvolvimento de inteligência artificial. No entanto, a maioria delas está gastando mais em data centers do que arrecada com suas operações.", "titulo_pt": "Investida de gigantes tecnológicos em data centers consome caixa e assusta mercado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234523, "titulo": "BYD nacionaliza produção de carros no Brasil e se prepara para exportações no Mercosul", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/byd-nacionaliza-producao-de-carros-no-brasil-e-se-prepara-para-exportacoes-no-mercosul.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BYD inaugurou sua fábrica em Camaçari, Bahia, em julho de 2025, com investimentos superando R$ 11 bilhões. A empresa confirmou a chegada de 17 fornecedores no complexo e está preparando a produção de carros para exportações no Mercosul.", "titulo_pt": "BYD nacionaliza produção de carros no Brasil e se prepara para exportações no Mercosul", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 234964, "titulo": "Prices of nearly 1,500 food and beverage items to rise in November", "url": "https://www.japantimes.co.jp/business/2026/10/30/companies/food-price-hikes-november/", "fonte_id": "japan_times", "data_pub": "2026-10-30T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Kewpie planeja aumentar o preço da sua maionese, enquanto a Asahi Soft Drinks pretende aumentar o preço da sua bebida alcoólica Mitsuya Cider. Esses aumentos serão implementados em novembro.", "titulo_pt": "Preços de quase 1.500 itens de alimentos e bebidas aumentarão em novembro", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234611, "titulo": "BNDES dobra teto de financiamento para infraestrutura ferroviária", "url": "https://exame.com/brasil/infraestrutura/bndes-dobra-teto-de-financiamento-para-infraestrutura-ferroviaria/", "fonte_id": "exame", "data_pub": "2026-10-30T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES aumentou o limite de financiamento para projetos de infraestrutura ferroviária. O banco deve concluir o ciclo iniciado em 2023 com mais de R$ 300 bilhões em aprovações de financiamento para infraestrutura.", "titulo_pt": "BNDES duplica limite de financiamento para infraestrutura ferroviária", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 234966, "titulo": "Blackstone said to plan $1.9 billion central Tokyo office sale", "url": "https://www.japantimes.co.jp/business/2026/10/30/companies/blackstone-tokyo-office-sale/", "fonte_id": "japan_times", "data_pub": "2026-10-30T05:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gestora de ativos alternative baseada em Nova York está negociando a venda de um imóvel comercial central em Tóquio por aproximadamente 1,9 bilhões de dólares.", "titulo_pt": "Blackstone planeja vender imóvel comercial em tóquio por 1,9 bilhões de dólares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234858, "titulo": "Neutralidade da tributação no destino: ilusão ou futura realidade", "url": "https://www.jota.info/opiniao-e-analise/artigos/neutralidade-da-tributacao-no-destino-ilusao-ou-futura-realidade", "fonte_id": "jota", "data_pub": "2026-10-30T05:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A neutralidade tributária não é garantida apenas pela estrutura legal estabelecida. O texto sugere que fatores adicionais podem influenciar essa neutralidade.", "titulo_pt": "Neutralidade da tributação no destino: ilusão ou futura realidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 235046, "titulo": "Samsung takes over display unit’s China stake to bolster LCD ties", "url": "https://www.koreaherald.com/article/10921019", "fonte_id": "korea_herald", "data_pub": "2026-10-30T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Eletrônicos adquiriu toda a participação da Samsung Display na empresa de painéis chinesa TCL CSOT por cerca de 1,27 trilhões de wones (US$ 950 milhões), fortalecendo as relações de suprimento de painéis LCD para sua linha de televisores. A Samsung Display focará suas atividades em painéis OLED de alta gama.", "titulo_pt": "Samsung adquire stake da samsung display na tcl csot para fortalecer suprimentos de LCD", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 234597, "titulo": "OPINIÃO. O que o marco legal da AI vai mudar para as empresas", "url": "https://braziljournal.com/opiniao-o-que-o-marco-legal-da-ai-vai-mudar-para-as-empresas", "fonte_id": "brazil_journal", "data_pub": "2026-10-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde agosto, a Europa exigiu que os desenvolvedores de inteligência artificial cumpram diversas obrigações, especialmente para os fornecedores de modelos de finalidade geral, como os desenvolvidos pela Open AI e Anthropic. Esses modelos são usados como infraestrutura para soluções em diversos setores, incluindo jurídico, financeiro e industrial.", "titulo_pt": "O que o marco legal da AI vai mudar para as empresas", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 235071, "titulo": "Gift Ideas for Friends (2026): Wellness Tech, Kitchen Essentials", "url": "https://www.wired.com/story/gifts-for-friends/", "fonte_id": "wired", "data_pub": "2026-10-30T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo lista gadgets, utensílios de cozinha e itens de conforto que foram testados pela WIRED e que o autor consideraria comprar para seus amigos próximos.", "titulo_pt": "Ideias de presentes para amigos (2026): tecnologia da wellness e utensílios de cozinha", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 235072, "titulo": "The Best Leaf Blower We’ve Tested Is Ready for Halloween", "url": "https://www.wired.com/story/ego-blower-sale-tp-cannon-october-2026/", "fonte_id": "wired", "data_pub": "2026-10-30T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um modelo de aspirador de folhas da marca Ego está com desconto, e um especialista na empresa demonstra como criar um projetil de papel-toalha usando o aparelho.", "titulo_pt": "O melhor aspirador de folhas testado está com desconto e demonstração de como fazer um projétil de papel-toalha", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 235030, "titulo": "Eating disorders are on the rise. GLP-1s could make things worse.", "url": "https://www.technologyreview.com/2026/10/30/1147838/eating-disorders-rise-glp-1s-weight-loss-drugs/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os medicamentos GLP-1 para perda de peso são um dos maiores avanços tecnológicos na biotecnologia dos últimos dez anos, mas para alguns psicólogos clínicos, representam um perigo potencial, pois podem agir como gatilhos para distúrbios alimentares. Um relatório recente indica que a incidência global de anorexia nervosa e bulimia nervosa aumentou em 71% entre 1990 e 2023.", "titulo_pt": "Eating disorders are on the rise. GLP-1s could make things worse.", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 234823, "titulo": "The humans burning out on AI's cyber frontlines", "url": "https://www.axios.com/2026/10/30/cybersecurity-ai-burnout-human-workers", "fonte_id": "axios", "data_pub": "2026-10-30T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas trabalhando nas linhas de frente das ameaças cibernéticas, impulsionadas por inteligência artificial, estão sobrecarregadas com ataques, vulnerabilidades e alertas falsos. Eles lutam para lidar com grandes volumes de dados de ameaças para identificar quais empresas foram atingidas e quais ataques representam uma ameaça real para as empresas.", "titulo_pt": "Os humanos esgotados nas linhas de frente das batalhas cibernéticas de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 234989, "titulo": "Cathay Pacific says data from 53,000 bookings compromised in Amadeus cyberattack", "url": "https://www.scmp.com/news/hong-kong/transport/article/3372722/cathay-pacific-says-data-53000-bookings-compromised-amadeus-cyberattack", "fonte_id": "scmp", "data_pub": "2026-10-30T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Cathay Pacific Airways, companhia aérea de bandeira de Hong Kong, informou que dados pessoais e detalhes de voos de 53.000 reservas foram comprometidos após hackers acessarem o sistema do fornecedor de tecnologia Amadeus IT Group. O acesso não autorizado ocorreu entre agosto de 2023 e setembro de 2026.", "titulo_pt": "Cathay Pacific revela que dados de 53 mil reservas foram comprometidos em ataque ao Amadeus", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 234887, "titulo": "Global tech rout deepens as US earnings stoke AI spending fears", "url": "https://www.ft.com/content/3ba953ae-84bb-4de4-959e-baec3e908fb3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-30T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de valores de Wall Street estão previstas para sofrer fortes perdas no início da sessão de sexta-feira devido aos resultados insatisfatórios da Amazon. O desempenho da empresa alimentou preocupações sobre o aumento do gasto em inteligência artificial pelas empresas tecnológicas.", "titulo_pt": "Perdas severas na bolsa de wall street após resultados da amazon decepcionarem", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 234872, "titulo": "Indian AI infrastructure firm reportedly seeks to raise $3 billion of debt to buy Nvidia's next-generation chips", "url": "https://www.cnbc.com/2026/10/30/nvidia-india-ai-chips-computing.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-30T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AM Intelligence, uma empresa de infraestrutura de inteligência artificial na Índia, planeja levantar US$ 3 bilhões em dívida para comprar chips de próxima geração da Nvidia. A empresa pretende instalar 400 MW de capacidade computacional usando os processadores de gráficos Rubin da Nvidia em dois anos.", "titulo_pt": "Empresa de infraestrutura de IA na Índia busca levantar us$ 3 bilhões em dívida para adquirir chips de próxima geração da Nvidia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 235078, "titulo": "Call of Duty publisher apologizes for using real footage of Itaewon crowd crush", "url": "https://en.yna.co.kr/view/AEN20261030011500320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A desenvolvedora do jogo Call of Duty se retratou por usar imagens reais do acidente de multidão em Itaewon na jogatina. O incidente ocorreu em Seul, Coreia do Sul, em outubro de 2022.", "titulo_pt": "Desenvolvedor de call of Duty se retrata por usar imagens reais do acidente de multidão em Itaewon", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 235080, "titulo": "Samsung Electro-Mechanics wins 879.3 bln-won AI server capacitor supply deal", "url": "https://en.yna.co.kr/view/AEN20261030011300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T07:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electro-Mechanics anunciou que venceu um contrato para fornecer capacitores para servidores de inteligência artificial no valor de 879,3 bilhões de wones. O anúncio foi feito em Seul no dia 30 de outubro.", "titulo_pt": "Samsung Electro-Mechanics vence contrato de 879,3 bilhões de wones para fornecimento de capacitores para servidores de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 235081, "titulo": "SK Group retains SK hynix chief, reshuffles energy unit leadership", "url": "https://en.yna.co.kr/view/AEN20261030011900320", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Group, um conglomerado sul-coreano com diversos negócios, manteve o chefe da SK hynix e reorganizou a liderança de sua unidade de energia.", "titulo_pt": "SK Group mantém chefes da SK hynix e reorganiza liderança da unidade de energia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 235065, "titulo": "Seoul shares dip over 3% on tech sell-off amid AI concerns", "url": "https://www.koreaherald.com/article/10920828", "fonte_id": "korea_herald", "data_pub": "2026-10-30T07:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram mais de 3% na sexta-feira, com a venda de ações de semicondutores contribuindo para a queda, devido a preocupações persistentes sobre a sustentabilidade das investidas em inteligência artificial. O índice KOSPI fechou em 5.730,74 pontos.", "titulo_pt": "Seul perde mais de 3% com vendas em semicondutores devido a preocupações com a IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 234902, "titulo": "AI’s real bottleneck is electricity. Who will pay for it?", "url": "https://www.aljazeera.com/opinions/2026/10/30/ais-real-bottleneck-is-electricity-who-will-pay-for-it?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grandes empresas de tecnologia estão negociando acordos com usinas nucleares, levantando questões urgentes sobre quem pagará pela crescente demanda energética dos sistemas de inteligência artificial.", "titulo_pt": "O verdadeiro gargalo da IA é a eletricidade. Quem pagará pela isso?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234993, "titulo": "France network outage puts Nokia under scrutiny as EU pushes to phase out Huawei, ZTE gear", "url": "https://www.scmp.com/economy/global-economy/article/3372699/france-network-outage-puts-nokia-under-scrutiny-eu-pushes-phase-out-huawei-zte-gear", "fonte_id": "scmp", "data_pub": "2026-10-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desligamento na rede móvel na França levantou dúvidas sobre a fiabilidade dos produtos da Nokia, no momento em que a União Europeia busca reduzir o uso de equipamentos das empresas chinesas Huawei e ZTE devido a preocupações de segurança.", "titulo_pt": "Desligamento na França coloca Nokia sob suspeita enquanto ue busca reduzir uso de equipamentos chineses", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 234619, "titulo": "Por que a IA pode ser a maior ameaça ao negócio que fez do Google um gigante", "url": "https://exame.com/invest/mercados/por-que-a-ia-pode-ser-a-maior-ameaca-ao-negocio-que-fez-do-google-um-gigante/", "fonte_id": "exame", "data_pub": "2026-10-30T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O balanço negativo afetou significativamente o valor de mercado da Alphabet, que perdeu US$ 500 bilhões em uma única sessão de negociação.", "titulo_pt": "Por que a IA pode ser a maior ameaça ao negócio que fez do Google um gigante", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 235092, "titulo": "High-speed microscopy captures 3D images of living cells nearly 400 times faster", "url": "https://phys.org/news/2026-10-high-microscopy-captures-3d-images.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Tóquio desenvolveram uma técnica de microscopia de alta velocidade que captura imagens 3D de células vivas quase 400 vezes mais rapidamente, permitindo a criação de 'vídeos' dos processos dinâmicos que ocorrem internamente nas células.", "titulo_pt": "Microscopia de alta velocidade captura imagens 3D de células vivas quase 400 vezes mais rápido", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 235093, "titulo": "Crowding can speed up enzyme reactions—until protein droplets become too packed", "url": "https://phys.org/news/2026-10-crowding-enzyme-reactions-protein-droplets.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As reações enzimáticas podem se acelerar devido ao congestionamento, mas isso só ocorre até um certo ponto. Quando as proteínas e outros moléculas se agrupam em compartimentos sem membrana, criando microambientes concentrados, as reações podem sofrer interferências se ficarem muito densas.", "titulo_pt": "Congestionamento pode acelerar reações enzimáticas—mas só até certo ponto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 235117, "titulo": "Scientists confirm fruit and vegetable skin really is good for you", "url": "https://www.newscientist.com/article/2596529-scientists-have-discovered-a-completely-free-way-to-eat-more-fibre/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-30T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas confirmaram que a pele de frutas e vegetais contém mais fibras do que as partes comestíveis desses alimentos. Isso inclui a casca de kiwi e as sementes de abóbora.", "titulo_pt": "Cientistas confirmam que a pele de frutas e vegetais é boa para você", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 235094, "titulo": "Fire pollution killed 3,560 people in Indonesia in September: Report", "url": "https://phys.org/news/2026-10-pollution-people-indonesia-september.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T09:30:00Z", "idioma": "en", "provavel_duplicata_de": 234963, "texto_pt": "Uma nova pesquisa indicou que 3.560 mortes em Indonésia em setembro foram causadas pela poluição de fumaça emitida por incêndios florestais ao longo de meses.", "titulo_pt": "Poluição de fumaça de incêndios florestais matou 3.560 pessoas na indonésia em setembro, relatório mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 235118, "titulo": "In Dark Eden, I imagined how life might exist on a sunless planet", "url": "https://www.newscientist.com/article/2596453-in-dark-eden-i-imagined-how-life-might-exist-on-a-sunless-planet/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-30T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dark Eden é um livro do mês para a Club do Livro do New Scientist em novembro. O livro se passa em um planeta errante fora da Via Láctea, e o autor Chris Beckett explica como ele desenvolveu a ciência por trás desse mundo sem luz solar.", "titulo_pt": "Em Dark Eden, imaginei como a vida poderia existir em um planeta sem sol", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 235119, "titulo": "Read an extract from Dark Eden by Chris Beckett", "url": "https://www.newscientist.com/article/2596432-read-an-extract-from-dark-eden-by-chris-beckett/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-30T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O trecho apresenta uma prévia do livro 'Dark Eden', de Chris Beckett, selecionado pelo Club de Livros da New Scientist para o mês de novembro. Nele, os leitores conhecem alguns dos habitantes de um planeta escuro que orbita fora da Via Láctea, descendentes de dois astronautas que ficaram presos lá há mais de um século.", "titulo_pt": "Extrato de 'Dark Eden' de Chris Beckett", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 234508, "titulo": "Astrônomos descobrem possível planeta-anão, a 7,1 bilhões de quilômetros do Sol", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/astronomos-descobrem-possivel-planeta-anao-a-71-bilhoes-de-quilometros-do-sol.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram um possível planeta-anão a 7,1 bilhões de quilômetros do Sol. Em 2006, a União Astronômica Internacional redefiniu o termo 'planeta-anão' para descrever corpos arredondados que não dominam gravitacionalmente outros objetos em suas órbitas, removendo Plutão da categoria de planeta.", "titulo_pt": "Astrônomos descobrem possível planeta-anão a 7,1 bilhões de quilômetros do Sol", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 235120, "titulo": "‘Reverse physics’ could help bridge the classical and quantum worlds", "url": "https://www.newscientist.com/article/2596640-reverse-physics-could-help-bridge-the-classical-and-quantum-worlds/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um esforço está sendo feito para reconstruir as leis da física a partir da matemática, em vez de seguir o processo tradicional que começa com observações e depois desenvolve a matemática. Este método, conhecido como 'física reversa', busca conectar o mundo clássico com o quântico.", "titulo_pt": "Física reversa poderia ajudar a conectar o clássico com o quântico", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 235087, "titulo": "Opinion: What a mother’s 1834 letter about measles tells us about MAHA", "url": "https://www.statnews.com/2026/10/30/maha-measles-letter-1834-pseudoscience-women/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma carta de 1834 sobre uma epidemia de sarampo ilumina as dinâmicas da movimentação antivacina moderna, escreve um historiador médico.", "titulo_pt": "Opinião: uma carta materna de 1834 sobre sarampo ilumina as atuais movimentações antivacina", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 235088, "titulo": "STAT+: FDA, CMS scramble to avoid regulatory logjam as more states look to test AI in clinical settings", "url": "https://www.statnews.com/2026/10/30/fda-cms-health-ai-regulation-state-sandboxes-run-into-federal-rules/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários estão tomando medidas para evitar conflitos entre estados e o governo federal sobre a regulamentação da IA. Há mais estados interessados em testar a IA em ambientes clínicos.", "titulo_pt": "FDA e CMS se movem para evitar conflito entre estados e governo federal sobre regulação de IA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 235089, "titulo": "The health care issues STAT reporters are watching in the midterms", "url": "https://www.statnews.com/2026/10/30/health-care-policy-midterm-elections-status-report-alex-hogan/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os repórteres da STAT analisam como as eleições de meia legislatura poderiam moldar a política federal de saúde e ciência. Também há uma entrevista com El-Sayed.", "titulo_pt": "Os problemas de saúde que os repórteres da STAT estão monitorando nas eleições de meia legislatura", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 235090, "titulo": "Opinion: How Congress can fix expert advisory committees", "url": "https://www.statnews.com/2026/10/30/scientific-expert-advisory-committees-fda-hhs-congress/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os autores afirmam que a destruição das consultas científicas é inaceitável.", "titulo_pt": "Opinião: como o congresso pode corrigir comitês de conselheiros especializados", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 235091, "titulo": "STAT+: How a simple UTI turns into a $1,756 bill", "url": "https://www.statnews.com/2026/10/30/hybrid-er-urgent-care-clinics-hidden-billing-complaints-intuitive-health/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pacientes visitaram uma unidade de cuidados urgentes com problemas aparentemente simples, como tosse, congestão e gripe, e ficaram surpresos ao receber contas de cuidados de emergência que totalizaram milhares de dólares.", "titulo_pt": "Como uma simples infecção urinária se transforma em uma fatura de $1.756", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 234509, "titulo": "Meteorito de Marte encontrado no Saara tem 4,1 bilhões de anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/meteorito-de-marte-encontrado-no-saara-tem-41-bilhoes-de-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um meteorito encontrado no Saara, no Mali, em 2022, formou-se há pelo menos 4,1 bilhões de anos na crosta de Marte. Este é provavelmente o meteorito marciano mais antigo dos 435 já registrados.", "titulo_pt": "Meteorito de Marte encontrado no Saara tem 4,1 bilhões de anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 235121, "titulo": "The 12 strangest science stories we can’t stop thinking about", "url": "https://www.newscientist.com/article/2591690-the-12-strangest-science-stories-we-cant-stop-thinking-about/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A revista New Scientist relatou diversas descobertas e invenções estranhas, como a esfregação inconsciente de dedos e ratos dirigindo carros, desde seu início há 70 anos.", "titulo_pt": "As 12 histórias científicas mais estranhas que não paramos de pensar", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 234996, "titulo": "How China uses gut microbes to treat a range of diseases", "url": "https://www.scmp.com/plus/news/china/science/article/3372678/how-china-uses-gut-microbes-treat-range-diseases", "fonte_id": "scmp", "data_pub": "2026-10-30T06:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A medicina moderna tem descoberto nos últimos décimos de século a ligação entre um intestino saudável e um corpo e mente saudáveis, algo que os praticantes da medicina tradicional chinesa (TCM) compreendem há muitos séculos. Em todo o mundo, médicos e cientistas formados na medicina ocidental têm aprendido a importância de manter um equilíbrio entre as bactérias 'boas' e 'ruins' no microbioma intestinal.", "titulo_pt": "Como a China usa microorganismos intestinais para tratar uma variedade de doenças", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 234981, "titulo": "What’s the true worth behind Chinese phrase ‘carrying 10,000 strings of cash around the waist’", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3372732/whats-true-worth-behind-chinese-phrase-carrying-10000-strings-cash-around-waist", "fonte_id": "scmp", "data_pub": "2026-10-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expressão chinesa 'yao chan wan guan', que significa 'carregar dez mil cordões de moedas na cintura', é usada para descrever riqueza. Um guan era uma unidade tradicional chinesa de conta equivalente a uma corda com mil moedas individuais, geralmente de bronze, que surgiu junto com a moeda redonda com buraco quadrado, introduzida durante a dinastia Qin (221-206 AC).", "titulo_pt": "O que realmente significa a expressão chinesa 'carregar dez mil cordões de moedas na cintura'?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 235111, "titulo": "Oh to Believe in Another World review – William Kentridge’s amazing animated ballet of black comic pain", "url": "https://www.theguardian.com/film/2026/oct/30/oh-to-believe-in-another-world-review-william-kentridges-amazing-animated-ballet-of-black-comic-pain", "fonte_id": "guardian_culture", "data_pub": "2026-10-30T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oh to Believe in Another World é uma criação cine-musical de William Kentridge, um artista e cineasta sul-africano de 71 anos, que combina puppetry, dança e humor para explorar temas como humanidade, dor e idealismo, acompanhada da Sinfonia nº 10 de Shostakovich. Este trabalho, uma animação de colagem de um hora com coreografia de ação real, está sendo exibido no Festival Internacional de Artes de Baku, Azerbaijão, e é considerado uma das animações mais impressionantes que o autor já criou.", "titulo_pt": "Oh para acreditar em outro mundo - a mágica do ballet animado de William Kentridge", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 234510, "titulo": "Amazon corre atrás de projetos para produzir novelas no streaming a partir de 2028", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/amazon-corre-atras-de-projetos-para-produzir-novelas-no-streaming-a-partir-de-2028.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon busca projetos de melodrama para produzir suas primeiras novelas em streaming, pretendendo seguir um modelo semelhante ao da Netflix no Brasil, com formatos de menor duração. Os planos devem ser implementados a partir de 2028.", "titulo_pt": "Amazon busca projetos para produzir primeiras novelas no streaming a partir de 2028", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 235113, "titulo": "‘It’s been a whirlwind’: the Essex lawyer who quit her job and became voice of Netflix’s hit show Spike", "url": "https://www.theguardian.com/tv-and-radio/2026/oct/30/essex-woman-voice-netflix-spike-emily-mcgonagle", "fonte_id": "guardian_culture", "data_pub": "2026-10-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emily McGonagle, uma advogada de 42 anos de Essex, teve a ideia de se mudar para uma carreira como dubladora enquanto assistia aos desenhos animados com seus filhos. Ela estava de licença maternidade e pensou na possibilidade de fazer essa mudança após ver personagens de desenhos animados como Peppa Pig e Paw Patrol.", "titulo_pt": "‘Foi uma experiência vertiginosa’: a advogada de Essex que deixou o trabalho e se tornou a dubladora de um sucesso global da Netflix", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 235114, "titulo": "Radie Peat: No Human Tongue Can Tell review – Lankum singer’s solo debut is the year’s best folk album", "url": "https://www.theguardian.com/music/2026/oct/30/radie-peat-no-human-tongue-can-tell-review", "fonte_id": "guardian_culture", "data_pub": "2026-10-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Radie Peat, cantora da Lankum, lança seu debut solo, um álbum de folk que reúne canções tradicionais de mulheres, interpretadas com uma abordagem simples e impactante. O álbum inclui a adição de teclados como Mellotron e Wurlitzer, mantendo uma atmosfera minimalista e poderosa.", "titulo_pt": "Radie Peat: sem lingua humana pode contar review – o debut solo da cantora da Lankum é o melhor álbum de folk do ano", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 234878, "titulo": "Mexico: world's tallest Catrina unveiled for Día de Muertos in Mexico City", "url": "https://www.euronews.com/video/2026/10/30/mexico-worlds-tallest-catrina-unveiled-for-dia-de-muertos-in-mexico-city", "fonte_id": "euronews", "data_pub": "2026-10-30T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma figura de Catrina de 33,4 metros de altu
