dware/precos-da-memoria-ddr4-comecam-a-cair-e-aliviam-crise-de-ram-para-2027/", "fonte_id": "canaltech", "data_pub": "2026-11-27T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços da memória DDR4 estão começando a diminuir, levando a uma revisão das projeções de aumento de preços para 2027. Apesar de a queda não ser imediata, ela indica uma leve melhora na crise de abastecimento.", "titulo_pt": "Preços da memória DDR4 começam a cair e aliviam crise de RAM para 2027", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 292045, "titulo": "The Mosquito Bowl na Netflix: veja 8 estreias para assistir no fim de semana", "url": "https://canaltech.com.br/entretenimento/the-mosquito-bowl-na-netflix-veja-8-estreias-para-assistir-no-fim-de-semana/", "fonte_id": "canaltech", "data_pub": "2026-11-27T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Netflix lançou The Mosquito Bowl, um filme de guerra dirigido por Peter Berg, no último fim de semana de novembro. O filme, que conta com Nicholas Galitzine e Bill Skarsgård no elenco, foi uma das principais estreias da plataforma durante esse período.", "titulo_pt": "The Mosquito Bowl na Netflix: veja 8 estreias para assistir no fim de semana", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 292086, "titulo": "RADAR LT: Expertos analizan el impacto de la IA en el futuro de la humanidad", "url": "https://www.latercera.com/videos/noticia/radar-lt-expertos-analizan-el-impacto-de-la-ia-en-el-futuro-de-la-humanidad-2/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T20:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Expertos nacionais e internacionales debatiram sobre as oportunidades e desafíos da IA em Exponencial UDD, abordando temas como economia, educação, saúde e cibersegurança. O acadêmico Raúl Camposano da Universidade de Stanford participou do evento.", "titulo_pt": "RADAR LT: especialistas analisam o impacto da IA no futuro da humanidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292064, "titulo": "Como empresas de IA da China contornam sanções para obter chips dos EUA", "url": "https://www.dw.com/pt-br/como-empresas-de-ia-da-china-contornam-sanções-para-obter-chips-dos-eua/a-80073419?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de inteligência artificial na China enfrentam dificuldades para obter chips de alto nível devido a restrições impostas pelos Estados Unidos. No entanto, Pequim recorre a data centers no Sudeste Asiático, o que Washington também tenta impedir.", "titulo_pt": "Como empresas de IA da China contornam sanções para obter chips dos EUA", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 292046, "titulo": "Onda de Xbox Series X e S travados após jogar GTA 6 preocupa assistências", "url": "https://canaltech.com.br/games/onda-de-xbox-series-x-e-s-travados-apos-jogar-gta-6-preocupa-assistencias/", "fonte_id": "canaltech", "data_pub": "2026-11-27T20:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um aumento de Xbox Series X e S trancados após o lançamento de GTA 6 foi relatado em assistências na Polônia. Consoles PlayStation 5 também enfrentam problemas semelhantes, como desligamentos repentinos e superaquecimento ao jogar o título da Rockstar.", "titulo_pt": "Onda de Xbox Series X e S trancados após jogar GTA 6 preocupa assistências", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 292091, "titulo": "RADAR LT: Teletón y UNAB desarrollan entrenador con IA para impulsar la inclusión laboral", "url": "https://www.latercera.com/videos/noticia/radar-lt-teleton-y-unab-desarrollan-entrenador-con-ia-para-impulsar-la-inclusion-laboral/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T19:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ferramenta ELVIR permite simular entrevistas de trabalho e oferecer feedback personalizado para pessoas com deficiência, visando fortalecer suas habilidades e confiança. Após concluir a fase piloto, o projeto busca ampliar sua escala para facilitar o acesso ao mercado de trabalho.", "titulo_pt": "Teletón e UNAB desenvolvem entrenador com IA para impulsionar a inclusão laboral", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292274, "titulo": "You might lose your Oura health data if you’re still using an old Android phone", "url": "https://www.theverge.com/gadgets/1044314/oura-ring-health-data-android-11", "fonte_id": "the_verge", "data_pub": "2026-11-27T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Oura vai cessar o suporte para o Android 11 em 8 de dezembro de 2026, e os usuários que não atualizarem para uma versão do Android 12 ou superior podem perder acesso a parte de seus dados de saúde. Atualmente, a página de suporte informa que o suporte ao Android 11 será encerrado nesta data.", "titulo_pt": "Você pode perder seus dados de saúde do Oura se ainda usar um antigo smartphone Android", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 292068, "titulo": "Como a IA passou de erros simples a façanhas que abalam matemáticos", "url": "https://www.dw.com/pt-br/como-a-ia-passou-de-erros-simples-a-façanhas-que-abalam-matemáticos/a-80080628?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antes, a inteligência artificial enfrentava dificuldades com cálculos básicos, mas agora ela pode resolver problemas matemáticos complexos. Este avanço extraordinário levanta preocupações sobre as capacidades atuais da IA em matemática.", "titulo_pt": "Como a IA passou de erros simples a façanhas que abalam matemáticos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 292261, "titulo": "Trump’s Nvidia intervention has a cost for US stocks", "url": "https://www.ft.com/content/3318a827-bf20-4826-947d-9327381c3c10?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T18:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intervenção política do Trump em relação à Nvidia já está afetando os títulos de ações nos Estados Unidos. O envolvimento político já desvalorizou o dólar e os títulos do Tesouro americano, e agora está impactando também os mercados de ações.", "titulo_pt": "Intervenção de trump em Nvidia tem custo para ações norte-americanas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 292262, "titulo": "AI and the decryption nightmare", "url": "https://www.ft.com/content/4114d053-de5e-46a5-8b46-758726abdcb7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T18:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos avanços em inteligência artificial exigem atualizações mais rápidas nas medidas de segurança, mas não devem causar pânico.", "titulo_pt": "IA e pesadelo na descriptografia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [{"titulo": "Openai processa Apple por supostas violações de segredos comerciais", "sumario": "OpenAI está processando Apple por supostas violações de segredos comerciais, enquanto a corrida para desenvolver produtos de IA se intensifica entre as duas empresas tecnológicas. A OpenAI respondeu à ação judicial da Apple, acusando a empresa de ter roubado segredos comerciais. A empresa responsável pelo ChatGPT acusa a Apple de roubar segredos comerciais e de coagir e ameaçar fornecedores que trabalham com ambas as empresas, conforme a luta legal se intensifica.", "artigos": [{"id": 292244, "titulo": "OpenAI countersues Apple over trade secrets as AI race heats up", "url": "https://www.aljazeera.com/economy/2026/11/27/openai-countersues-apple-over-trade-secrets-as-ai-race-heats-up?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI está processando Apple por supostas violações de segredos comerciais, enquanto a corrida para desenvolver produtos de IA se intensifica entre as duas empresas tecnológicas. As tensões entre as companhias aumentaram com a aceleração da competição no desenvolvimento de tecnologias de inteligência artificial.", "titulo_pt": "Openai processa Apple por supostas violações de segredos comerciais", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 292034, "titulo": "OpenAI contra-ataca e acusa Apple de roubar segredos comerciais", "url": "https://olhardigital.com.br/2026/11/27/pro/openai-contra-ataca-e-acusa-apple-de-roubar-segredos-comerciais/", "fonte_id": "olhar_digital", "data_pub": "2026-11-27T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI respondeu à ação judicial da Apple, acusando a empresa de ter roubado segredos comerciais. A acusação é uma contraofensiva após a Apple processar a OpenAI e dois ex-funcionários.", "titulo_pt": "Openai contra-ataca e acusa Apple de roubar segredos comerciais", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 292264, "titulo": "OpenAI countersues Apple for stealing trade secrets", "url": "https://www.ft.com/content/af599e07-d44c-4068-ab84-6ee3c85551d4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa responsável pelo ChatGPT acusa a Apple de roubar segredos comerciais e de coagir e ameaçar fornecedores que trabalham com ambas as empresas, conforme a luta legal se intensifica.", "titulo_pt": "Openai processa Apple por suposto roubo de segredos comerciais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}]}], "ciencia": [{"id": 292294, "titulo": "Why a warmer atmosphere doesn't guarantee more water in rivers", "url": "https://phys.org/news/2026-11-warmer-atmosphere-doesnt-rivers.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Áustria experimentou uma seca excepcional em 2026, com precipitação cerca de um terço menor do que a média anual. Isso resultou em baixos níveis de água nos rios e nas águas subterrâneas. A relação entre a disponibilidade de água e o aquecimento global é questionada, pois um ar mais quente pode conter mais vapor d'água, mas isso não necessariamente significa mais precipitação.", "titulo_pt": "Por que um ar mais quente não garante mais água nos rios", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292295, "titulo": "Can storybook characters teach children about perseverance?", "url": "https://phys.org/news/2026-11-storybook-characters-children-perseverance.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos livros de histórias contêm mensagens sobre não desistir diante de desafios, o que não é surpreendente considerando que a perseverança é um fator importante para o aprendizado e o sucesso a longo prazo.", "titulo_pt": "Personagens de histórias podem ensinar crianças sobre perseverança?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292296, "titulo": "AI could be used to write your child's report. Is this a problem?", "url": "https://phys.org/news/2026-11-ai-child-problem.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para muitas famílias, está no momento do ano em que os relatórios escolares chegam às caixas de entrada dos pais. A possibilidade de que o AI seja usado para escrever esses relatórios está sendo questionada.", "titulo_pt": "AI poderia escrever o relatório escolar do seu filho. Isso é um problema?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292297, "titulo": "Denisovan remains and an unknown archaic human lineage discovered in southern China", "url": "https://phys.org/news/2026-11-denisovan-unknown-archaic-human-lineage.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores, incluindo o primeiro autor Song Xing, do Centro Nacional de Investigação sobre a Evolução Humana (CENIEH), publicou um estudo no jornal Nature que analisou quatro dentes fósseis recuperados em duas cavernas na China do Sul. Os pesquisadores identificaram duas linhagens humanas possíveis datando do Pleistoceno Médio e Tardio: uma com afinidades com os Denisovanos e outra linhagem mais primitiva cuja identidade evolutiva permanece incerta.", "titulo_pt": "Restos denisovanos e uma linhagem antiga humana despertam interesse na China", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292298, "titulo": "The world is experiencing a string of abnormally hot days—and records are being shattered", "url": "https://phys.org/news/2026-11-world-experiencing-abnormally-hot-days.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mundo está vivendo uma sequência de dias excepcionalmente quentes e recordes estão sendo quebrados. Os sinais de mudança climática causada pelo homem, como a elevação dos níveis de dióxido de carbono na atmosfera, o aquecimento dos oceanos e a diminuição do gelo marinho nas polos, são observados em dados climáticos.", "titulo_pt": "O mundo está experimentando uma sequência de dias muito quentes e recordes estão sendo quebrados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292299, "titulo": "Strawberries, cucumbers and lemon basil show promise for future moon and Mars menus", "url": "https://phys.org/news/2026-11-strawberries-cucumbers-lemon-basil-future.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está estudando cultivos de frutas e vegetais como morangos, pepinos e manjericão limão que podem fornecer alimentos frescos, nutrição e variedade para astronautas em missões futuras à Lua e Marte. Este estudo é importante para os menus em missões espaciais de longo prazo, como se prepara para a celebração do Dia do Agradecimento nos Estados Unidos.", "titulo_pt": "Morangos, pepinos e manjericão limão mostram potencial para menus futuros da lua e marte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292300, "titulo": "Is AI‑assisted thinking devaluing business degrees?", "url": "https://phys.org/news/2026-11-aiassisted-devaluing-business-degrees.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A melhoria dos modelos de inteligência artificial está tornando o acesso a alta qualidade de conhecimento mais fácil. Como resultado, os graus precisam certificar habilidades mais duradouras do que a capacidade de recuperar informações ou produzir respostas plausíveis.", "titulo_pt": "A inteligência artificial está desvalorizando os graus acadêmicos?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292301, "titulo": "Melting Barents Sea ice gives Eastern Europe's farmers a spring boost", "url": "https://phys.org/news/2026-11-barents-sea-ice-eastern-europe.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diminuição do gelo marinho no Mar de Barents, uma parte do Oceano Ártico ao norte da Noruega e da Rússia, tem se intensificado devido ao aquecimento do Ártico. Essa perda de gelo pode alterar padrões climáticos em toda a Europa, mas seu impacto na produção agrícola ainda não é bem compreendido.", "titulo_pt": "Derretimento do mar de Barents dá um impulso ao agricultura da Europa oriental no outono", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291903, "titulo": "Expedição na Amazônia encontra dezenas de espécies que podem ser inéditas para a ciência", "url": "https://veja.abril.com.br/ciencia/expedicao-na-amazonia-encontra-dezenas-de-especies-que-podem-ser-ineditas-para-a-ciencia/", "fonte_id": "veja", "data_pub": "2026-11-27T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma expedição chamada Tulu-Tuloi levou 16 pesquisadores à Serra do Aracá por 19 dias, onde foram encontradas dezenas de espécies que podem ser inéditas para a ciência.", "titulo_pt": "Expedição na Amazônia encontra dezenas de espécies que podem ser inéditas para a ciência", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 292322, "titulo": "Love Star Wars, Andy Weir or Ryan Gosling? These Lego Star Wars and Project Hail Mary sets are my favorites", "url": "https://www.space.com/entertainment/space-toys-lego/love-star-wars-andy-weir-or-ryan-gosling-these-lego-star-wars-and-project-hail-mary-sets-are-my-favorites", "fonte_id": "space_com", "data_pub": "2026-11-27T20:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem opções variadas para fãs de Star Wars, Ryan Gosling ou ambos, com descontos significativos em conjuntos de Lego Star Wars e Project Hail Mary durante o Black Friday.", "titulo_pt": "Amante de Star Wars, Ryan Gosling ou os dois? Esses conjuntos Lego Star Wars e Project Hail Mary são meus favoritos", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 292302, "titulo": "Once logging stops, recovery of Vietnam's tropical forests isn't guaranteed", "url": "https://phys.org/news/2026-11-recovery-vietnam-tropical-forests-isnt.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma floresta tropical do centro da Vietnam, a pesquisa envolve caminhadas difíceis por rios cheios de rochas escorregadias. Os pesquisadores medem árvores há uma década, sem a ajuda de trilhas claras.", "titulo_pt": "A recuperação das florestas tropicais do vietnã não está garantida após a parada da madeireira", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292303, "titulo": "Hera reveals stadium-sized asteroid crater from spacecraft impact", "url": "https://phys.org/news/2026-11-hera-reveals-stadium-sized-asteroid.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão Hera da Agência Espacial Europeia chegou ao local do primeiro experimento de defesa planetária e encontrou um asteroide menor, chamado Dimorphos, com uma cratera do tamanho de um estádio em uma de suas faces e girando de forma caótica. Além disso, foram descobertas centenas de rochas maiores que não eram conhecidas anteriormente ao redor do par binário de asteroides.", "titulo_pt": "Hera revela cratera do tamanho de um estádio no asteroide dimorphos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292268, "titulo": "WHO sounds alarm as measles fight falters: ‘it is back’", "url": "https://www.scmp.com/news/world/article/3376102/who-sounds-alarm-measles-fight-falters-it-back", "fonte_id": "scmp", "data_pub": "2026-11-27T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde alertou sobre o retorno do measles devido à estagnação das campanhas de eliminação, influenciada por informações falsas e desinformação. A perda do status de eliminação do measles pelos Estados Unidos, devido a baixos níveis de imunização, reflete essa tendência global.", "titulo_pt": "OMS emite alerta sobre measles: 'ele está de volta'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 292220, "titulo": "Uganda launches trial of mRNA Ebola vaccine", "url": "https://www.lemonde.fr/en/international/article/2026/11/27/uganda-launches-trial-of-mrna-ebola-vaccine_6790159_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-27T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades ugandenses iniciaram os ensaios clínicos de uma vacina mRNA desenvolvida pela Moderna com o objetivo de encontrar um tratamento para a cepa Bundibugyo do Ebola, que está causando uma epidemia na República Democrática do Congo. Os testes também começarão na região epicêntrica da epidemia na próxima semana.", "titulo_pt": "Uganda inicia ensaios clínicos de vacina mrna contra Ebola", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 292305, "titulo": "When bad weather hits a fragile financial system", "url": "https://phys.org/news/2026-11-bad-weather-fragile-financial.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um evento climático extremo pode reduzir o valor do colateral, enfraquecer as instituições financeiras, aumentar os custos do crédito e fazer com que as empresas adiem investimentos. O dano pode se espalhar além da área afetada pelo evento.", "titulo_pt": "Quando o mau tempo atinge um sistema financeiro frágil", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292306, "titulo": "Antarctic sea ice extent hits new low", "url": "https://phys.org/news/2026-11-antarctic-sea-ice-extent.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As observações por satélite indicam que a cobertura de geleada marinha na Antártica atingiu novos níveis diários baixos em outubro de 2026, superando até mesmo o baixo nível observado em outubro de 2023, ano em que as condições ruins da geleada marinha levaram ao óbito de milhares de chanchinhos-reis na Antártica.", "titulo_pt": "Extensão da geleada marinha antártica atinge novo mínimo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 291653, "titulo": "Taipei exhibition marks Penglai rice centennial", "url": "https://www  "provavel_duplicata_de": null, "texto_pt": "A DW analisa como governos e organizações globais monitoram a pobreza e suas diferentes metodologias. O presidente dos Estados Unidos, Donald Trump, afirma que a pobreza nos EUA está em um nível baixo recorde, mas isso tem sido questionado.", "titulo_pt": "O que significa ser pobre e como a pobreza é medida?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 291913, "titulo": "Expectativa de vida para mulheres no Brasil ultrapassa 80 anos pela primeira vez, segundo IBGE", "url": "https://veja.abril.com.br/comportamento/expectativa-de-vida-para-mulheres-no-brasil-ultrapassa-80-anos-pela-primeira-vez-segundo-ibge/", "fonte_id": "veja", "data_pub": "2026-11-27T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os dados do Instituto Brasileiro de Geografia e Estatística indicam que a expectativa de vida para mulheres no Brasil atingiu pela primeira vez os 80 anos, conforme as Tábuas Completas de Mortalidade no Brasil.", "titulo_pt": "Expectativa de vida para mulheres no Brasil ultrapassa 80 anos pela primeira vez, de acordo com IBGE", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291917, "titulo": "Saiba quais os estados com mais tentativas de invasão a residências", "url": "https://veja.abril.com.br/brasil/saiba-quais-os-estados-com-mais-tentativas-de-invasao-a-residencia/", "fonte_id": "veja", "data_pub": "2026-11-27T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os estados de São Paulo e Rio de Janeiro concentram 70% dos registros de tentativas de invasão a residências. Pernambuco e Distrito Federal registraram os maiores aumentos percentuais nesse tipo de ocorrência.", "titulo_pt": "Saiba quais os estados com mais tentativas de invasão a residências", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 292186, "titulo": "Police suspect criminals robbed fans at Manchester gig disrupted by ‘unknown substance’", "url": "https://www.theguardian.com/uk-news/2026/nov/27/police-believe-criminals-carried-out-robberies-during-don-toliver-manchester-gig-unknown-substance", "fonte_id": "guardian_world", "data_pub": "2026-11-27T18:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia está investigando uma suposta ação de criminosos organizados que ocorreu durante o show de Don Toliver em Manchester, onde um", "titulo_pt": null, "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 291077, "titulo": "Participante Léo Santos relembra episódio de racismo após participação no ‘MasterChef’", "url": "https://veja.abril.com.br/cultura/participante-leo-santos-relembra-episodio-de-racismo-apos-participacao-no-masterchef/", "fonte_id": "veja", "data_pub": "2026-11-27T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Léo Santos, participante do 'MasterChef' na quarta edição em 2017, relembrou episódios de racismo que sofreu durante sua participação no programa.", "titulo_pt": "Léo Santos relembra episódio de racismo após passagem no 'MasterChef'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291132, "titulo": "Mutirão no Arapoanga oferece vacinação e castração gratuita neste sábado", "url": "https://www.metropoles.com/distrito-federal/mutirao-no-arapoanga-oferece-vacinacao-e-castracao-gratuita-neste-sabado", "fonte_id": "metropoles", "data_pub": "2026-11-27T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mutirão de vacinação e castração gratuita de animais ocorre neste sábado na Unidade Básica de Saúde 5 e na Escola Classe 7. As cirurgias dos animais serão realizadas na primeira semana de dezembro.", "titulo_pt": "Mutirão no Arapoanga oferece vacinação e castração gratuita neste sábado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 291333, "titulo": "Sandra López Mora, portavoz del Sindicato de Inquilinas de Madrid: “El desalojo de Maricarmen fue un punto de inflexión”", "url": "https://www.latercera.com/mundo/noticia/sandra-lopez-mora-portavoz-del-sindicato-de-inquilinas-de-madrid-hay-que-descartar-la-hipotesis-de-que-hay-que-construir-mas/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sindicato de inquilinos de Madrid dobrou seu número de filiados após meses difíceis relacionados à habitação. Durante uma campanha eleitoral marcada por altos valores de aluguel, o despejo de Maricarmen se tornou um ponto de inflexão para o sindicato.", "titulo_pt": "Sandra López Mora, porta-voz do Sindicato de inquilinos de Madrid: 'o despejo de Maricarmen foi um ponto de inflexão'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 290969, "titulo": "Jogadora brasileira presa na Rússia mandou carta a Lula: 'Muitas coisas cruéis juntas'; leia a íntegra", "url": "https://g1.globo.com/mundo/noticia/2026/11/27/brasileira-presa-na-russia-leia-na-integra-a-carta-de-leticia-villar-ao-presidente-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-27T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A jogadora brasileira de futebol de areia Letícia Villar, conhecida como Lelê Villar, está presa na Rússia há 1 ano e 4 meses e enviou uma carta ao presidente Luiz Inácio Lula da Silva pedindo ajuda do governo brasileiro. O documento foi escrito em 5 de novembro e entregue ao presidente pelo advogado Marco Aurélio de Carvalho.", "titulo_pt": "Jogadora brasileira presa na Rússia envia carta a Lula pedindo ajuda", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 291399, "titulo": "‘Crisis in empathy’: prison guard was watching TV while Aboriginal man was dying in custody, NSW coroner finds", "url": "https://www.theguardian.com/australia-news/2026/nov/27/crisis-in-empathy-death-in-custody-of-aboriginal-man-tj-denniss-was-preventable-says-nsw-coroner-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-27T11:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corregedora do NSW encontrou que a morte de um homem indígena em custódia em 2023 foi prevenível e considerada uma das mortes mais graves que ela já investigou. A corregedora recomendou que os funcionários devem ser proibidos de usar telas e telefones durante o turno e que a treinamento para respostas a autolesões deve ser revisto.", "titulo_pt": "Crise na empatia: guarda prisional estava assistindo TV enquanto homem indígena morria em custódia, descobre corregedora do NSW", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 290387, "titulo": "Servidor é demitido e indiciado por perseguir e importunar colegas", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/servidor-e-demitido-e-indiciado-por-perseguir-e-importunar-colegas", "fonte_id": "metropoles", "data_pub": "2026-11-27T09:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um servidor foi demitido e indiciado por perseguir e importunar colegas de trabalho. De acordo com a PCES, o motorista abordava insistentemente funcionárias do Pronto Atendimento de Marilândia (ES).", "titulo_pt": "Servidor é demitido e indiciado por perseguir e importunar colegas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 292022, "titulo": "AMM chama de \"inaceitável\" corte de recursos para piso da enfermagem", "url": "https://www.metropoles.com/minas-gerais/amm-chama-de-inaceitavel-corte-de-recursos-para-piso-da-enfermagem", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Associação dos Municípios de Minas Gerais (AMM) criticou o corte de 30% no repasse federal para o piso salarial da enfermagem, considerando a medida inaceitável. A entidade alerta para os riscos financeiros para as 853 cidades mineiras.", "titulo_pt": "AMM chama de 'inaceitável' corte de recursos para piso da enfermagem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292317, "titulo": "‘Sinking’ African megacities will expose seven million people to flooding by 2050", "url": "https://www.carbonbrief.org/sinking-african-megacities-will-expose-seven-million-people-to-flooding-by-2050", "fonte_id": "carbon_brief", "data_pub": "2026-11-27T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A elevação do nível do mar e o subsolo de cidades africanas costeiras podem expor mais de sete milhões de pessoas a inundações até 2050.", "titulo_pt": "Cidades africanas costeiras afundando exporão sete milhões de pessoas a inundações até 2050", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 291537, "titulo": "Uzbek teacher turns school recycling problem into an award-winning green education project", "url": "https://www.euronews.com/2026/11/27/uzbek-teacher-turns-school-recycling-problem-into-an-award-winning-green-education-project", "fonte_id": "euronews", "data_pub": "2026-11-27T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor uzbeque desenvolveu um projeto de educação ambiental que envolveu 25.000 pessoas em 25 escolas. O projeto venceu uma competição internacional com 369 inscrições de 94 países.", "titulo_pt": "Professor uzbeque transforma problema de reciclagem escolar em projeto vencedor de educação ambiental", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 290998, "titulo": "Emissões de data centers dos EUA já equivalem às de países inteiros, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/emissoes-de-data-centers-dos-eua-ja-equivalem-as-de-paises-inteiros-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa indica que os maiores data centers dos Estados Unidos geram aproximadamente 25,7 milhões de toneladas métricas de dióxido de carbono por ano, equivalente às emissões de países como a Bolívia ou a Dinamarca.", "titulo_pt": "Emissões de data centers dos EUA já equivalem às de países inteiros, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291173, "titulo": "Vídeo: incêndio de grandes proporções atinge indústria química na Grande SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/video-incendio-de-grandes-proporcoes-atinge-industria-quimica-na-grande-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio de grandes proporções atinge uma indústria química na Grande São Paulo, com pelo menos seis viaturas e 18 bombeiros envolvidos no combate às chamas. As chamas começaram em tambores contendo álcool e acetona.", "titulo_pt": "Vídeo: incêndio de grandes proporções atinge indústria química na Grande SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 291609, "titulo": "Gaza's children caught in the grip of a meningitis outbreak", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/gazas-children-caught-grip-meningitis-outbreak", "fonte_id": "middle_east_eye", "data_pub": "2026-11-27T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bebê de dois meses chamado Mostafa Hallawin está internado há 10 dias no Hospital Al-Rantisi em Gaza, com meningite. Sua mãe relata que ele apresentou uma erupção cutânea e febre alta, com temperatura chegando a 39°C, e que seu estado não melhorou devido a escassez de recursos médicos.", "titulo_pt": "Crianças de gaza caídas na gripe meningocócica", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 291297, "titulo": "Florestas da Alemanha encolhem, mas um tipo de árvore vem resistindo", "url": "https://www.dw.com/pt-br/florestas-da-alemanha-encolhem-mas-um-tipo-de-árvore-vem-resistindo/a-80060110?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imagens de satélite indicam que as florestas de coníferas e áreas particulares da Alemanha estão encolhendo, mas um tipo específico de árvore está superando as expectativas em termos de resistência.", "titulo_pt": "Florestas da Alemanha encolhem, mas uma espécie de árvore se sai melhor do que se imaginava", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 291117, "titulo": "AquaRio inaugura laboratório para reprodução de corais ameaçados", "url": "https://exame.com/bussola/aquario-inaugura-laboratorio-para-reproducao-de-corais-ameacados/", "fonte_id": "exame", "data_pub": "2026-11-27T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O AquaRio inaugurou um laboratório com capacidade para produzir 15 mil mudas de corais a cada seis meses, visando preservar a diversidade genética de espécies ameaçadas.", "titulo_pt": "Aquario inaugura laboratório para reprodução de corais ameaçados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 291119, "titulo": "A conta do clima: seca severa atinge 95% de Roraima e isola comunidades ribeirinhas", "url": "https://exame.com/esg/a-conta-do-clima-seca-severa-atinge-95-de-roraima-e-isola-comunidades-ribeirinhas/", "fonte_id": "exame", "data_pub": "2026-11-27T12:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seca severa afeta 95% do estado de Roraima e está isolando comunidades ribeirinhas. Este é o terceiro evento associado ao El Niño e ao aquecimento do Atlântico Norte em 11 anos, destacando a vulnerabilidade da Amazônia às mudanças climáticas.", "titulo_pt": "A conta do clima: seca severa atinge 95% de Roraima e isola comunidades ribeirinhas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 291298, "titulo": "O efeito surpresa do El Niño no Pantanal", "url": "https://www.dw.com/pt-br/o-efeito-surpresa-do-el-niño-no-pantanal/a-80072689?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T10:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos últimos meses, o Pantanal registrou chuvas intensas devido ao avanço do El Niño. No entanto, o cenário ainda é preocupante devido aos anos extremos de seca e fogo na região.", "titulo_pt": "Efeito surpresa do El Niño no Pantanal", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 290714, "titulo": "Deadly floods leave parts of Ecuador under water", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/27/deadly-floods-leave-parts-of-ecuador-under-water?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inundações letais submergiram casas, negócios e estradas em várias partes do Equador.", "titulo_pt": "Inundações letais deixam partes do equador submersas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 292014, "titulo": "Quênia: líder de seita do jejum até a morte é condenado por 123 homicídios", "url": "https://www.metropoles.com/mundo/quenia-lider-de-seita-do-jejum-ate-a-morte-e-condenado-por-123-homicidios", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O líder de uma seita que promovia jejuns extremos até a morte foi condenado por 123 homicídios. A justiça considerou que Paul Mackenzie organizou esses jejuns, resultando na morte de seguidores. O líder já cumpre pena de 200 anos de prisão.", "titulo_pt": "Quênia: líder de seita do jejum até a morte é condenado por 123 homicídios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292204, "titulo": "Lanzamiento Festival +CIPER UDP", "url": "https://www.ciperchile.cl/2026/11/27/lanzamiento-festival-ciper-udp/?utm_source=rss&utm_medium=rss& eed/2026/11/27/aje-onl-nf_syria-mulls-citizenship-children-foreign-fighters-271126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã pode considerar modificar sua lei de nacionalidade para conceder cidadania a crianças de mães sírias e lutas estrangeiras.", "titulo_pt": "Síria debate direitos de cidadania para filhos de mulheres sírias e lutas estrangeiras", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 291334, "titulo": "Fiscalía va contra Jairo Vera por violación grupal en Cauquenes y pide 15 años de cárcel", "url": "https://www.latercera.com/nacional/noticia/fiscalia-va-contra-jairo-vera-por-violacion-grupal-en-cauquenes-y-pide-15-anos-de-carcel/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A fiscalia apresentou acusações contra Jairo Vera por um caso de estupro coletivo ocorrido em Cauquenes em 1 de novembro de 2022, pedindo 15 anos de prisão. Steven Ortega também enfrenta acusações no caso. O julgamento oral está programado para o final de janeiro.", "titulo_pt": "Fiscalia move ação contra Jairo Vera por estupro coletivo em Cauquenes e pede 15 anos de prisão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 291335, "titulo": "María José Cumplido: “La salud de un adolescente no puede ser moneda de cambio para evitar una acusación constitucional”", "url": "https://www.latercera.com/nacional/noticia/maria-jose-cumplido-la-salud-de-un-adolescente-no-puede-ser-moneda-de-cambio-para-evitar-una-acusacion-constitucional/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diretora executiva da Fundação Iguais alerta que ceder às pressões para proibir as terapias de hormonização poderia criar um precedente 'perigoso', permitindo que governos decidam sobre o acesso a tratamentos médicos com base em suas crenças, em vez de evidências científicas.", "titulo_pt": "María José Cumplido: 'saúde de adolescente não pode ser usado como barganha para evitar acusação constitucional'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 291331, "titulo": "Excomandante en jefe del Ejército Óscar Izurieta es condenado a cinco años y un día de cárcel efectiva por lavado de activos", "url": "https://www.latercera.com/nacional/noticia/excomandante-en-jefe-del-ejercito-oscar-izurieta-es-condenado-a-cinco-anos-y-un-dia-de-carcel-efectiva-por-lavado-de-activos/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T16:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Oscar Izurieta, ex-comandante-em-chefe do Exército, foi condenado a cinco anos e um dia de prisão efectiva por lavagem de dinheiro. O tribunal confirmou que ele usou fundos ilícitos para financiar uma investida imobiliária e posteriormente executou operações para ocultar a origem desses fundos.", "titulo_pt": "Ex-comandante do exército oscar Izurieta é condenado a cinco anos e um dia de prisão efectiva por lavagem de ativos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 291616, "titulo": "Evictions and erasure: How Palestinian life in East Jerusalem is being extinguished", "url": "https://www.middleeasteye.net/big-story/evictions-and-erasure-how-palestinian-life-east-jerusalem-being-extinguished", "fonte_id": "middle_east_eye", "data_pub": "2026-11-27T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos em Jerusalém Oriental estão sofrendo com expulsões, fechamento de livrarias, demolição de casas e ações violentas de colonos israelenses. A ocupação israelense resulta em um ambiente hostil para a comunidade palestina.", "titulo_pt": "Evasões e erasamento: como a vida palestina em jerusalém oriental está sendo extinta", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 291590, "titulo": "Sentence     ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";

};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {

function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
