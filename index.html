<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "13/11/2026 07:25", "stats": {"noticias_novas": 870, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Senado aprovou o texto-base do pacote fiscal proposto pelo governo Lula, com um impacto estimado de até R$ 56 bilhões. A proposta inclui medidas como aumento do contingenciamento, redução de benefícios tributários e limitação de compensações fiscais. O projeto, que prevê economias entre R$ 50 bilhões e R$ 60 bilhões em 2027, foi aprovado por 45 votos a 31 após quase quatro horas de votação. O relator Eduardo Braga aceitou 20 emendas que limitam os cortes de despesas do Executivo, protegem recursos de outros Poderes e ampliam as exceções aos benefícios fiscais. Paralelamente, o STF rejeitou recursos que buscavam ampliar o alcance de um acordo entre bancos e poupadores para indenizar perdas causadas pelos planos econômicos Bresser, Verão e Collor 1 e 2, mantendo o status quo do acordo existente.", "mundo": "Um problema de serviço que afetou serviços da Microsoft, como Outlook, Teams e Copiloto, continuou na segunda-feira, causando interrupções para usuários em todo o mundo. Este incidente, devido à sua escala e duração, é considerado um dos maiores desligamentos já registrados pela empresa. Em outros desenvolvimentos, o presidente sul-coreano Lee Jae Myung reafirmou sua promessa de reformar o mercado de capitais para abordar a subavaliação das ações. Além disso, o Papa Francisco se reuniu com seis sobreviventes de abuso sexual por membros do clero no Peru, enquanto o governo peruano adiou a ampliação do território dos mashco piro, um dos povos indígenas em isolamento voluntário mais numerosos.\n\nIsrael continua a intensificar sua presença militar em Gaza e no oeste da Cisjordânia, com relatos de mortes e operações em áreas residenciais. Por outro lado, a China realiza manobras militares no Pacífico, sendo criticada por Taiwan e gerando preocupação ocidental. Na Europa, a coalizão eslovaca perdeu a maioria parlamentar, enquanto a Ucrânia registra perdas significativas em seu conflito com a Rússia. Na Ásia, a Coreia do Sul pede à Coreia do Norte que reconheça integralmente seu passado colonial, e a possibilidade de um encontro tripartite entre Trump, Xi e Putin durante a APEC em Shenzhen, China, já desperta preocupações. Na região do Golfo, o Irã acusa a Marinha dos EUA de um ataque a um radar em Bahrain, reforçando a tensão no Estreito de Ormuz. O conflito no Iêmen continua, com sanções renovadas pelo Conselho de Segurança da ONU, enquanto a Coreia do Norte realiza um memorial separado para reconhecer a história do antigo campo de trabalho de Sado.", "economia": "O dólar atingiu seu nível mais alto em 17 meses, fechando a R$ 5,65, refletindo a insatisfação com o pacote fiscal do governo e o fortalecimento do dólar global. A alta do dólar afetou negativamente as ações sul-coreanas, que caíram quase 1% na sexta-feira, após preocupações com a Nvidia. A economia de Hong Kong também se destacou, com uma previsão de crescimento de 4,8% para 2026, impulsionada por exportações relacionadas à inteligência artificial. No Brasil, o Banco do Brasil e a Braskem registraram prejuízos significativos, enquanto a Natura reverteu um prejuízo com um lucro de R$ 49 milhões no terceiro trimestre. A Caixa Seguridade enfrentou um ataque cibernético que resultou no vazamento de dados de 7,6 milhões de clientes. O varejo brasileiro e o PPI americano continuam sendo focos de atenção dos investidores, enquanto a inflação na Argentina permanece alta, atingindo 33% em 12 meses.", "tecnologia": "O mercado de tecnologia enfrenta diversos desafios e oportunidades, como evidenciado pelos principais eventos recentes. O boom da inteligência artificial (IA) continua, com a liderança contínua de Jensen Huang, fundador da Nvidia. Huang segue em suas funções à frente da empresa, em meio a um cenário que levanta dúvidas sobre o futuro da indústria de IA. A Nvidia, que é crucial para o desenvolvimento de modelos de IA nos Estados Unidos, enfrenta pressões políticas e regulatórias, com a possibilidade de restrições mais rigorosas sobre exportações de chips avançados para a China. Em meio a essas turbulências, a Microsoft continua a lidar com instabilidades em seus serviços globais, afetando o trabalho no setor financeiro de Hong Kong, enquanto a Google finalmente passa a cumprir as exigências de segurança para exportar dados de mapas detalhados da Coreia do Sul. As empresas de segurança cibernética no Japão estão experimentando um aumento significativo na demanda devido ao aumento no número de ataques cibernéticos, enquanto a SMIC, empresa chinesa de fabricação de semicondutores, espera que o aumento constante de centrais de dados mantenha a potência de computação da IA em falta nos próximos dois anos.", "ciencia": "A SpaceX está prestes a realizar o 15º voo integrado do Starship, tentando pela primeira vez recuperar tanto o estágio inferior quanto o superior do fogueto, guiando-os de volta à plataforma de lançamento no Texas, em um teste histórico. De acordo com a SpaceX, a frase 'Não se preocupe' será marcada no foguete, sugerindo que a empresa está confiante na missão. Paralelamente, cientistas japoneses criaram células híbridas de plantas e animais que produzem proteínas úteis de ambos os reinos e podem ser cultivadas usando fotossíntese, oferecendo novas possibilidades para a produção de medicamentos e carne. Além disso, a NASA anunciou que, após décadas de declínio, as manguezais estão se recuperando globalmente, o que representa um avanço significativo para a biodiversidade e a saúde do planeta.", "cultura": "A cultura global está em evidência com diversos projetos e eventos importantes. Em Turim, uma importante retrospectiva de Marisa Merz, a única mulher do movimento Arte Povera, está em exibição, destacando a obra de uma artista pioneira. Em Londres, o V&A East Storehouse recebeu uma nova orientação inspirada em aplicativos populares, visando atrair uma nova geração de visitantes. Na Netflix, o documentário 'O Tempo Não Apaga', sobre Suzane von Richthofen, teve seu lançamento ajustado após críticas, enquanto o Festival Gourmet da Folha em São Paulo oferece uma variedade de pratos a preços acessíveis. O ator Roberto Cordovani apresenta uma peça sobre Salvador Dalí, explorando a dualidade do artista, e Hayley Williams realiza sua primeira apresentação solo no Brasil, cantando com Seu Jorge em São Paulo. A exposição 'Yankii' fashion em Londres destaca a cultura de moda yankii, enquanto a NHK anuncia os artistas para o espetáculo anual de Réveillon 'Kohaku'. O documentário 'Russell Brand: Open Secret', sobre o ator britânico condenado por crimes sexuais, será lançado na Netflix, e a estação de rádio comunitária Apaçik Radyo, em Istambul, intensifica seus esforços para amplificar as vozes dos ativistas ambientais durante a COP31 em Antalya.", "sociedade": "Um levantamento do Ministério da Justiça mostrou que a violência doméstica relacionada ao vício em apostas aumentou 75% em um ano. A família do jovem ganesiano Javits Frimpong, morto, reiterou suas demandas por justiça após a prisão de um suspeito pela polícia. Além disso, a UN lançou uma plataforma de financiamento para desastres para a COP31 com o objetivo de garantir acesso a mais de 3 bilhões de dólares em financiamento de risco, visando proteger 75 milhões de pessoas das quedas climáticas até 2030. Em relação à saúde, 112 milhões de adultos vivem com diabetes nas Américas, mesmo com lacunas persistentes no diagnóstico e tratamento. Por fim, a justiça negou um recurso que pediu indenização à Bombril por comparação indevida entre o cabelo crespo e a esponja de aço Krespinha, rejeitando a analogia entre o cabelo crespo e a esponja de aço Krespinha.", "meio_ambiente": "A COP31 em Belém, no Brasil, continua debatendo sobre cidades resilientes e investimentos em infraestrutura urbana, descarbonização industrial e redução de emissões de metano, após a Cúpula dos Líderes que reuniu chefes de Estado. Greta Thunberg criticou os governos por sua falta de ação em prevenir o colapso ambiental durante sua primeira aparição na conferência. O governo do Pará decretou uma emergência ambiental e climática de 120 dias devido à influência do El Niño, suspendendo autorizações e concessões para o uso do fogo no estado. O fenômeno El Niño também modifica a circulação atmosférica no Brasil, causando chuvas intensas e tempestades severas, enquanto a Amazônia enfrenta incêndios que afetam a saúde e o bolso do Brasil inteiro. Um estudo científico indica que o aquecimento global já consumiu quase toda a margem de segurança climática estabelecida pelo Acordo de Paris, alertando sobre a rapidez do processo.", "direitos_humanos": "No Vaticano, o Papa Francisco fez declarações contra o machismo e pediu que a Igreja enfrentasse abusos, destacando a importância de proteger mulheres e informantes de abusos de poder. Em Gaza, Israel realizou ataques a hospitais e veículos, resultando em pelo menos 10 mortes de palestinos, incluindo cirurgiões e pacientes. A FAO, o WFP, a UNICEF e a OMS pediram ação urgente para combater a fome aguda que afetará mais de 30 milhões de pessoas no Congo, incluindo 4,2 milhões em níveis de emergência. Além disso, o escritório da organização LGBTQ+ mais antiga da Turquia, Lambda Istanbul, foi fechado pelas autoridades, que alegaram ser um 'clube social não autorizado', isolando pessoas LGBTQ+ e privando-as de um espaço para organizar-se."}, "resumo_do_dia": {"politica_nacional": [{"id": 260945, "titulo": "Fim da escala 6x1: STF vota regras flexibilizadas por Dino nesta sexta", "url": "https://www.metropoles.com/brasil/fim-da-escala-6x1-stf-comeca-a-votar-regras-definidas-por-dino-nesta-sexta", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Dino manteve o cronograma estabelecido pelo Congresso para o fim da escala 6x1, mas introduziu regras mais flexíveis para a implementação. A decisão foi tomada em uma votação no STF nesta sexta-feira.", "titulo_pt": "Fim da escala 6x1: STF vota regras flexibilizadas por Dino nesta sexta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 260962, "titulo": "À CNN, presidente do STJ fala de impeachment e supersalários; veja íntegra", "url": "https://www.cnnbrasil.com.br/politica/a-cnn-presidente-do-stj-fala-de-impeachment-e-supersalarios-veja-integra/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Superior Tribunal de Justiça (STJ), Luis Felipe Salomão, discutiu a necessidade de reforma no Judiciário e avaliou que o Brasil vive um caso particular de judicialização.", "titulo_pt": "Presidente do STJ fala sobre reforma no judiciário e judicialização", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260964, "titulo": "Presidente do STJ à CNN: impeachment de ministros do STF aprofundaria crise", "url": "https://www.cnnbrasil.com.br/politica/presidente-do-stj-a-cnn-impeachment-de-ministros-do-stf-aprofundaria-crise/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luís Felipe Salomão, presidente do STJ, criticou a ideia de impeachment de ministros do STF, afirmando que esta não é uma solução para os problemas do tribunal. Salomão também se opôs à 'fulanização' do debate sobre o assunto.", "titulo_pt": "Presidente do STJ critica impeachment de ministros do STF e fulanização do debate", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260970, "titulo": "Projeto de ajuste fiscal pode bancar compensação do seguro rural em 2027", "url": "https://www.cnnbrasil.com.br/agro/projeto-de-ajuste-fiscal-pode-bancar-compensacao-do-seguro-rural-em-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo está negociando com o Congresso uma solução para financiar a nova obrigação do marco legal do seguro rural, que tem um custo de R$ 769,2 milhões sujeitos a restrições de execução em 2026.", "titulo_pt": "Projeto de ajuste fiscal pode bancar compensação do seguro rural em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260957, "titulo": "Flávio diz que votou contra ajuste para Lula cumprir promessas de campanha", "url": "https://www.metropoles.com/mundo/flavio-diz-que-votou-contra-ajuste-para-lula-cumprir-promessas-de-campanha", "fonte_id": "metropoles", "data_pub": "2026-11-13T07:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio citou que votou contra o ajuste proposto pelo governo Lula para que o presidente pudesse cumprir suas promessas de campanha. Ele afirmou que o ajuste resultará em cortes na saúde e educação.", "titulo_pt": "Flávio diz que votou contra ajuste para Lula cumprir promessas de campanha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 260958, "titulo": "Entenda a crise na PF após afastamento de delegados do Caso Master", "url": "https://www.metropoles.com/brasil/entenda-a-crise-na-pf-apos-afastamento-de-delegados-do-caso-master", "fonte_id": "metropoles", "data_pub": "2026-11-13T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados da Polícia Federal foram afastados após a divulgação de relatórios envolvendo ministros do Supremo Tribunal Federal. Este afastamento gerou críticas internas na corporação.", "titulo_pt": "Entenda a crise na PF após afastamento de delegados do Caso Master", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 260812, "titulo": "Cleitinho acumula acenos ao PT em busca de ponte com governo Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/cleitinho-acumula-acenos-ao-pt-em-busca-de-ponte-com-governo-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador eleito de Minas Gerais, Cleitinho Azevedo (Republicanos), intensificou acenos ao PT com o objetivo de se aproximar do governo Lula. Esse movimento visa melhorar as condições para a renegociação da dívida do estado com a União.", "titulo_pt": "Cleitinho intensifica acenos ao PT em busca de aproximação com governo Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260813, "titulo": "MDB e PSDB retomam conversas para federação e fixam prazo até o fim de novembro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/mdb-e-psdb-retomam-conversas-para-federacao-e-fixam-prazo-ate-o-fim-de-novembro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MDB e o PSDB retomaram as discussões para a formação de uma federação entre as legendas, com o objetivo de criar uma nova força política de centro no cenário partidário. O prazo estabelecido para concluir as negociações é até o fim de novembro.", "titulo_pt": "MDB e PSDB retomam conversas para federação e fixam prazo até o fim de novembro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260814, "titulo": "Centrão exige mais ministérios no governo Lula 4 em troca de cobrança por mais fidelidade no Congresso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/centrao-exige-mais-ministerios-no-governo-lula-4-em-troca-de-cobranca-por-mais-fidelidade-no-congresso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os partidos PP e Republicanos buscam ministérios mais importantes para aderir ao governo Lula (PT) e garantir a fidelidade de suas bancadas no Congresso.", "titulo_pt": "Centrão pede ministérios em troca de fidelidade no Congresso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260836, "titulo": "Incerteza de Margareth Menezes no governo cria cabo de guerra pelo MinC", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/incerteza-de-margareth-menezes-no-governo-cria-cabo-de-guerra-pelo-minc.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A incerteza sobre o futuro de Margareth Menezes na gestão do Ministério da Cultura levanta dúvidas sobre a continuidade ou mudança no comando do departamento. O ex-presidente Lula sinalizou apoio a uma nova gestão, mas ainda não se sabe se isso será implementado.", "titulo_pt": "Incerteza de Margareth Menezes no governo cria disputa pelo MinC", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 260849, "titulo": "Gilmar Mendes sinaliza que reconhecerá Justiça do Trabalho como competente para julgar ações de pejotização", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/gilmar-mendes-sinaliza-que-reconhecera-justica-do-trabalho-como-competente-para-julgar-acoes-de-pejotizacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do STF, indicou que manterá a Justiça do Trabalho para julgar ações de pejotização. Ele é relator do tema 1.389, que trata de fraudes em contratos de PJ.", "titulo_pt": "Gilmar Mendes mantém Justiça do Trabalho para julgar ações de pejotização", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260979, "titulo": "Senado deixa para concluir votação do ajuste fiscal na próxima semana", "url": "https://www.cnnbrasil.com.br/politica/senado-deixa-para-concluir-votacao-do-ajuste-fiscal-na-proxima-semana/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T06:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado deixou para concluir a votação do ajuste fiscal na sessão da próxima terça-feira (17).", "titulo_pt": "Senado retoma votação do ajuste fiscal na próxima terça-feira", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260816, "titulo": "Vice de Nunes admite disputar 2028, critica prefeito e Tarcísio e buscará Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/vice-de-nunes-admite-disputar-2028-critica-prefeito-e-tarcisio-e-buscara-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-prefeito de São Paulo, coronel Mello Araújo, criticou o prefeito Ricardo Nunes e o governador Tarcísio de Freitas, e declarou que pretende concorrer à prefeitura em 2028.", "titulo_pt": "Vice de Nunes confirma intenção de disputar 2028, critica prefeito e governador", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260817, "titulo": "Esquerda é legítima e direita é como uísque falsificado, diz líder rural bolsonarista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/esquerda-e-legitima-e-direita-e-como-uisque-falsificado-diz-lider-rural-bolsonarista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Antonio Nabhan Garcia, líder rural bolsonarista, afirmou que a esquerda brasileira é mais legítima do que a direita, com a qual se identifica. Garcia é ex-presidente da UDR e apoiador de Jair Bolsonaro.", "titulo_pt": "Esquerda é legítima e direita é como uísque falsificado, afirma líder rural bolsonarista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 261119, "titulo": "Senado aprova texto-base do pacote fiscal com impacto previsto de até R$ 56 bi", "url": "https://www.jota.info/legislativo/senado-aprova-texto-base-do-pacote-fiscal-com-impacto-previsto-de-ate-r-56-bi", "fonte_id": "jota", "data_pub": "2026-11-13T01:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou o texto-base do pacote fiscal, que prevê impactos financeiros de até R$ 56 bilhões. O projeto inclui medidas como aumento do contingenciamento, redução de benefícios tributários e limitação de compensações fiscais.", "titulo_pt": "Senado aprova texto-base do pacote fiscal com impacto estimado de até R$ 56 bi", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 260818, "titulo": "Defesa de Vorcaro contesta Fachin e quer que Gilmar decida sobre relatoria do caso Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/defesa-de-vorcaro-contesta-fachin-e-quer-que-gilmar-decida-sobre-relatoria-do-caso-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T00:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Daniel Vorcaro contestou a relatoria do caso do Banco Master pelo presidente do STF, Edson Fachin, e pediu que Gilmar Mendes assuma o caso. O pedido foi feito em 11 de dezembro de 2026.", "titulo_pt": "Defesa de Vorcaro questiona Fachin e pede que Gilmar decida sobre relatoria do caso Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 261267, "titulo": "What we know about the global Microsoft outage", "url": "https://www.bbc.co.uk/news/articles/cwvg238zrnm5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-13T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft informou que a interrupção não foi causada por uma incidente de segurança cibernética. As tentativas de resolver os problemas até agora não foram muito bem-sucedidas.", "titulo_pt": "O que sabemos sobre a interrupção global da Microsoft", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 261294, "titulo": "'One of the biggest outages ever': Disruption to Microsoft services enters second day", "url": "https://www.france24.com/en/video/20261113-one-of-the-biggest-outages-ever-disruption-to-microsoft-services-enters-second-day", "fonte_id": "france24", "data_pub": "2026-11-13T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um problema de serviço que afetou serviços da Microsoft, como Outlook, Teams e Copilot, continuou na segunda-feira, causando interrupções para usuários em todo o mundo. O incidente, devido à sua escala e duração, é considerado um dos maiores outages já registrados pela empresa.", "titulo_pt": "Um dos maiores desligamentos de serviços já registrados: interrupção de serviços da Microsoft entra em sua segunda-feira", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 261145, "titulo": "The U.S.-Israel Relationship Is Broken. Here’s How Eisenkot Could Fix It.", "url": "https://www.nytimes.com/2026/11/13/world/middleeast/the-us-israel-relationship-is-broken-heres-how-eisenkot-could-fix-it.html", "fonte_id": "nyt_world", "data_pub": "2026-11-13T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ex-embaixadores, legisladores e analistas israelenses e americanos concordam sobre passos que Gadi Eisenkot poderia tomar se se tornar primeiro-ministro, mas consideram esses passos arriscados.", "titulo_pt": "Relação eua-israel está quebrada. Eis como Eisenkot poderia consertá-la", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 261478, "titulo": "Eight Key Defendants in Istanbul Municipality Mass Trial Freed From Custody", "url": "https://balkaninsight.com/2026/11/13/eight-key-defendants-in-istanbul-municipality-mass-trial-freed-from-custody/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-13T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oito defensores importantes do processo contra o município de Istambul foram libertados sob fiança, incluindo o advogado do prefeito oposicionista detido, e chamaram pela libertação de dezenas de outros ainda presos.", "titulo_pt": "Oito principais acusados no julgamento do município de istambul são libertados temporariamente", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 261409, "titulo": "Microsoft, 'non a conoscenza di attività malevola' su interruzione Outlook", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/microsoft-non-a-conoscenza-di-attivita-malevola-su-interruzione-outlook_a6dc4a99-3b7c-4903-a0bb-124b9561ebfe.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T09:32:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Microsoft afirma não ter conhecimento de atividades maliciosas relacionadas à interrupção do Outlook. A empresa está lidando com a situação com urgência.", "titulo_pt": "Microsoft, 'sem conhecimento de atividades maliciosas' sobre interrupção do Outlook", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 261123, "titulo": "El Congreso inicia el escrutinio por el caso del espionaje en Nvidia y el escándalo de las infidelidades de Jensen Huang", "url": "https://elpais.com/economia/2026-11-13/el-congreso-inicia-el-escrutinio-por-el-caso-del-espionaje-en-nvidia-y-el-escandalo-de-las-infidelidades-de-jensen-huang.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Congresso dos Estados Unidos está iniciando o processo de escrutínio relacionado ao caso de espionagem envolvendo a Nvidia e o escândalo de infidelidades do CEO da empresa, Jensen Huang. Legisladores democratas solicitaram explicações sobre a proximidade do ex-CEO da Nvidia com Donald Trump.", "titulo_pt": "Congresso inicia escrutínio no caso do espionamento na Nvidia e escândalo de infidelidades de Jensen Huang", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 261126, "titulo": "Una víctima de la dictadura argentina recibida por León XVI: “Queremos que nos ayude a hacer que las monjas hablen”", "url": "https://elpais.com/argentina/2026-11-13/una-victima-de-la-dictadura-argentina-recibida-por-leon-xvi-queremos-que-nos-ayude-a-hacer-que-las-monjas-hablen.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Alba Camargo, uma vítima da ditadura argentina, foi sequestrada aos 13 anos por um grupo de tarefas e ficou detida em uma prisão administrada por religiosas. Ela pediu ajuda ao Rei Leão XVI para que as freiras falesem sobre o que aconteceu com ela.", "titulo_pt": "Vítima da ditadura argentina recebe ajuda do rei leão XVI para que freiras falem sobre sequestro", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 261127, "titulo": "La caravana migrante que cruza México y agita la amenaza de aranceles de Trump: “Nuestro terror es que la presidenta nos regrese”", "url": "https://elpais.com/mexico/2026-11-13/la-caravana-migrante-que-cruza-mexico-nuestro-terror-es-que-la-presidenta-diga-no-me-conviene-que-suban-los-aranceles-y-nos-regrese.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Acerca de 1.500 pessoas estão caminhando do sul do México para os Estados Unidos, levando Trump a ameaçar duplicar as tarifas comerciais com a cidade de México. A presidente do México, Sheinbaum, está preocupada com a possibilidade de ser responsabilizada por essa caravana migrante.", "titulo_pt": "Caravana migrante que atravessa México e ameaça de tarifas de Trump: 'nosso medo é que a presidente nos devolva'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 261133, "titulo": "“Trabajamos como esclavos en este país y no nos dan seguridad”: rabia y duelo tras el derrumbe mortal en Brooklyn", "url": "https://elpais.com/us/2026-11-13/trabajamos-como-esclavos-en-este-pais-y-no-nos-dan-seguridad-rabia-y-duelo-tras-el-derrumbe-mortal-en-brooklyn.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores de origem imigrante morreram no acidente, mas não há detalhes adicionais sobre eles. A comunidade expressa raiva e luto após o colapso fatal em Brooklyn.", "titulo_pt": "Trabalhamos como escravos nesse país e não nos dão segurança: raiva e luto após colapso mortal em Brooklyn", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 261135, "titulo": "De los espías del DAS a los de la DNI: Colombia recicla sus escándalos de inteligencia", "url": "https://elpais.com/america-colombia/2026-11-13/de-los-espias-del-das-a-los-de-la-dni-colombia-recicla-sus-escandalos-de-inteligencia.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Direção Nacional de Inteligência revela supostos planos do governo Petro de vigiar ex-presidentes e interferir nas eleições. O documento é reservado e não foi divulgado publicamente.", "titulo_pt": "De espiões do DAS aos da DNI: colômbia recicla seus escândalos de inteligência", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 261140, "titulo": "El Estado peruano bloquea la protección de los mashco piro, uno de los pueblos indígenas en aislamiento voluntario más grandes", "url": "https://elpais.com/america-futura/2026-11-13/el-estado-peruano-bloquea-la-proteccion-de-los-mascho-piro-uno-de-los-pueblos-indigenas-en-aislamiento-voluntario-mas-grandes.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo peruano adiou a ampliação do território dos mashco piro, um dos povos indígenas em isolamento voluntário mais numerosos. A decisão foi tomada após a divulgação de um novo estudo para verificar a presença dos membros do povo em áreas com concessões florestais, e acontece dias antes da visita do Papa à Amazônia peruana.", "titulo_pt": "Peru adia proteção aos mashco piro, um dos povos indígenas em isolamento voluntário mais grandes", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 261345, "titulo": "Israeli forces kill Palestinian in Gaza, raid homes in occupied West Bank", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-kill-palestinian-gaza-raid-homes-occupied-west-bank", "fonte_id": "middle_east_eye", "data_pub": "2026-11-13T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um palestinianos foi morto por tiros israelenses no bairro de Tuffah, a leste de Gaza City. Forças israelenses realizaram operações em várias áreas residenciais em Nablus e nas cidades vizinhas de Beit Furik e Beit Dajan.", "titulo_pt": "Forças israelenses matam palestiniano em Gaza e realizam operações em terras ocupadas do vale do jordão", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 261499, "titulo": "Seoul keeps fuel price caps unchanged amid Mideast tensions", "url": "https://en.yna.co.kr/view/AEN20261113004400320", "fonte_id": "yonhap_news", "data_pub": "2026-11-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano manteve as cotações de combustíveis sem alterações diante das tensões no Oriente Médio. A decisão foi tomada em 13 de novembro.", "titulo_pt": "Seul mantém preços dos combustíveis inalterados diante das tensões no oriente médio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 261286, "titulo": "French presidential election: Conservative Retailleau unveils hardline program to curb immigration", "url": "https://www.lemonde.fr/en/politics/article/2026/11/13/french-presidential-election-conservative-retailleau-unveils-hardline-program-to-curb-immigration_6779632_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-13T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bruno Retailleau, do partido Les Républicains, lançou um programa político visando restringir a imigração para 'recuperar o controle' da situação. Retailleau está em posição desfavorável nas pesquisas de intenção de voto.", "titulo_pt": "Eleição presidencial francesa: Retailleau apresenta programa rígido para reduzir imigração", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 261365, "titulo": "Nvidia’s Huang, Lutnick summoned to testify to US Senate", "url": "https://www.aljazeera.com/news/2026/11/13/nvidias-huang-lutnick-summoned-to-testify-to-us-senate?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-CEO da Nvidia, Jen-Hsun Huang, e o secretário do Comércio, Gina Raimondo, foram convocados a prestar depoimento ao Comitê de Bancos do Senado dos EUA. Ambos podem enfrentar ações legais se não comparecerem.", "titulo_pt": "Ex-ceo da nvidia e secretária do comércio convocadas a depor ao senado", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 261423, "titulo": "China stages unannounced Pacific drills in ‘silent intimidation’ push: Taiwan officials", "url": "https://www.japantimes.co.jp/news/2026/11/13/asia-pacific/politics/china-silent-intimidation/", "fonte_id": "japan_times", "data_pub": "2026-11-13T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pequim tem intensificado sua pressão militar nas últimas cinco anos, gerando condenação da Taiwan e aumentando a preocupação na Oeste.", "titulo_pt": "China realiza exercícios militares no pacífico sem aviso prévio como 'intimidação silenciosa', afirma taiwan", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 261307, "titulo": "‘We will sue them’: Canada threatens Stellantis as Trump trade war reshapes Jeep production plans", "url": "https://www.cnbc.com/2026/11/13/canada-stellantis-auto-trump-tariffs-jeep.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-13T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A disputa surge após a Stellantis cancelar a produção planejada do Jeep Compass em Brampton e transferir a futura produção para Illinois devido às tarifas de automóveis nos Estados Unidos. A Canadá ameaça processar a empresa.", "titulo_pt": "Canadá ameaça processar Stellantis: disputa por produção do Jeep compass", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 261114, "titulo": "Carf mantém IRPF em ganho de capital com incentivos fiscais na venda de ações", "url": "https://www.jota.info/tributos/carf-mantem-irpf-em-ganho-de-capital-com-incentivos-fiscais-na-venda-de-acoes", "fonte_id": "jota", "data_pub": "2026-11-13T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A discussão central tratou da possibilidade de incentivos fiscais integrarem o custo de aquisição das participações. O Carf manteve a aplicação do IRPF sobre ganhos de capital na venda de ações.", "titulo_pt": "Carf mantém IRPF em ganhos de capital com incentivos fiscais na venda de ações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 260889, "titulo": "Inflação na Espanha permanece estável em 4,9% em outubro", "url": "https://www.poder360.com.br/poder-economia/inflacao-na-espanha-permanece-estavel-em-49-em-outubro/", "fonte_id": "poder360", "data_pub": "2026-11-13T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação na Espanha permaneceu estável em 4,9% em outubro. Os custos de habitação aumentaram 7,6% em termos anuais, devido ao aumento dos preços do gás.", "titulo_pt": "Inflação na Espanha permanece estável em 4,9% em outubro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 260948, "titulo": "Com salários de até R$ 2,8 mil, DF encerra semana com 805 vagas de emprego", "url": "https://www.metropoles.com/distrito-federal/com-salarios-de-ate-r-28-mil-df-encerra-semana-com-805-vagas-de-emprego", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade do Distrito Federal encerrou a semana com 805 vagas de emprego disponíveis, oferecendo salários até R$ 2,8 mil. As oportunidades abrangem diversos níveis de escolaridade e não exigem experiência profissional.", "titulo_pt": "DF encerra semana com 805 vagas de emprego com salários até R$ 2,8 mil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261115, "titulo": "Empregado hipersuficiente: a opção de negociar e não demitir", "url": "https://www.jota.info/opiniao-e-analise/artigos/empregado-hipersuficiente-a-opcao-de-negociar-e-nao-demitir", "fonte_id": "jota", "data_pub": "2026-11-13T09:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante privatizações, fusões e aquisições, a negociação individual pode ser uma alternativa para preservar empregos. Este método pode oferecer uma opção para empresas uase 1% na sexta-feira, anulando os ganhos anteriores, devido a preocupações com a Nvidia.", "titulo_pt": "Seul perde quase 1% em quedas após preocupações com a Nvidia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 261504, "titulo": "S. Korean won weakens against U.S. dollar as oil prices surge", "url": "https://en.yna.co.kr/view/AEN20261113006800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-13T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano cedeu em relação ao dólar americano devido ao aumento das cotações do petróleo.", "titulo_pt": "Won sul-coreano enfraquece frente ao dólar americano com alta dos preços do petróleo", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 260852, "titulo": "Fiesp e Senai-SP lançam curso online grátis sobre reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/fiesp-e-senai-sp-lancam-curso-online-gratis-sobre-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiesp e o Senai-SP estão oferecendo um curso online gratuito sobre a reforma tributária. O curso visa preparar os participantes para as mudanças tributárias previstas.", "titulo_pt": "Fiesp e Senai-SP lançam curso online gratuito sobre reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261116, "titulo": "O CMN vai corrigir a mira nos créditos judiciais?", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-cmn-vai-corrigir-a-mira-nos-creditos-judiciais", "fonte_id": "jota", "data_pub": "2026-11-13T05:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê Mixto de Negócios (CMN) pode reduzir a transparência do mercado ao afastar os FIDCs, o que pode ampliar os riscos que o próprio CMN pretende
