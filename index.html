Ivete Sangalo faz aceno por mulheres negras no STF em evento da OAB; vídeo", "url": "https://www.metropoles.com/colunas/milena-teixeira/ivete-sangalo-faz-aceno-por-mulheres-negras-no-stf-em-evento-da-oab-video", "fonte_id": "metropoles", "data_pub": "2026-11-24T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ivete Sangalo comentou sobre a representatividade de mulheres negras no Supremo Tribunal Federal (STF) durante um show em Salvador, Bahia. O evento ocorreu no contexto da discussão sobre a vaga deixada por Barroso.", "titulo_pt": "Ivete Sangalo defende representatividade de mulheres negras no STF em show na bahia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 284205, "titulo": "Vazamento de gás pode ter causado a morte de PMs achados em viatura no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/vazamento-de-gas-pode-ter-causado-a-morte-de-pms-achados-em-viatura-no-rj", "fonte_id": "metropoles", "data_pub": "2026-11-24T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "PMs Rômulo Medeiros Vinagre e Patrick Trindade Silva foram encontrados mortos dentro de uma viatura na BR-101, em Itaúna, em São Gonçalo (RJ). A morte pode ter sido causada por um vazamento de gás.", "titulo_pt": "Vazamento de gás pode ter causado a morte de PMs achados em viatura no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 284211, "titulo": "PB: polícia prende ladrões que furtavam armas de clubes de tiro para facção", "url": "https://www.metropoles.com/brasil/pb-policia-prende-ladroes-que-furtavam-armas-de-clubes-de-tiro-para-faccao", "fonte_id": "metropoles", "data_pub": "2026-11-24T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia prendeu criminosos que roubavam armas de clubes de tiro para uma facção criminosa. Os ladrões ostentavam as armas roubadas nas redes sociais.", "titulo_pt": "PB: polícia prende ladrões que furtavam armas de clubes de tiro para facção", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 284292, "titulo": "“Cantor” do PCC é preso em operação por lavar dinheiro do tráfico", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/cantor-do-pcc-e-preso-em-operacao-por-lavar-dinheiro-do-trafico/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Elvis Riola de Andrade, conhecido como 'Cantor', e sua esposa foram presos em uma operação que apura um esquema de lavagem de dinheiro associado à facção criminosa PCC. A mulher foi capturada enquanto viajava para Bolívia.", "titulo_pt": "Cantor do PCC e esposa são presos em operação por lavagem de dinheiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 284338, "titulo": "Cinco mulheres foram mortas a cada hora por parceiros ou familiares em 2025, diz ONU", "url": "https://www.dw.com/pt-br/cinco-mulheres-foram-mortas-a-cada-hora-por-parceiros-ou-familiares-em-2025-diz-onu/a-80036346?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-24T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2025, a ONU relatou que cinco mulheres eram mortas a cada hora por parceiros ou familiares. Os casos de violência doméstica e familiar representaram 60% dos feminicídios registrados no ano anterior.", "titulo_pt": "Cinco mulheres eram mortas a cada hora por parceiros ou familiares em 2025, aponta ONU", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 284932, "titulo": "Suriname joins the Alliance for Primary Health Care in the Americas", "url": "https://www.paho.org/en/news/24-11-2026-suriname-joins-alliance-primary-health-care-americas", "fonte_id": "paho", "data_pub": "2026-11-24T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Suriname se juntou à Aliança para a Saúde Primária nas Américas. O país agora faz parte desta iniciativa que visa melhorar o acesso e a qualidade dos serviços de saúde primária.", "titulo_pt": "Suriname adere à aliança para a saúde primária nas américas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 284119, "titulo": "Ninguém morre se fechar comércio aos domingos, diz ministro sobre fim da escala 6x1", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/ninguem-morre-se-fechar-comercio-aos-domingos-diz-ministro-sobre-fim-da-escala-6x1.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T11:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Trabalho, Luiz Marinho, negou que o fim da escala 6x1 vá causar prejuízos ao comércio, afirmando que não há necessidade de manter lojas abertas 24 horas por dia e que ninguém morre se as lojas estiverem fechadas aos domingos.", "titulo_pt": "Ninguém morre se fechar comércio aos domingos, diz ministro sobre fim da escala 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284553, "titulo": "Lowering the Medicare eligibility age is harder than it sounds", "url": "https://www.axios.com/2026/11/24/democrats-medicare-eligibility-affordability-challenges", "fonte_id": "axios", "data_pub": "2026-11-24T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A redução da idade de elegibilidade para Medicare pode parecer uma alternativa realista para os democratas em relação à implementação do Medicare para todos, mas seria extremamente difícil de ser realizada. Mesmo medidas incrementais para melhorar a acessibilidade e a eficiência teriam custos elevados e provavelmente enfrentariam forte oposição do setor privado de saúde.", "titulo_pt": "Baixar a idade de elegibilidade para Medicare é mais difícil do que parece", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 284971, "titulo": "CB Live: Carbon Brief journalists discuss key COP31 outcomes", "url": "https://www.carbonbrief.org/cb-live-carbon-brief-journalists-discuss-key-cop31-outcomes", "fonte_id": "carbon_brief", "data_pub": "2026-11-24T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois do encerramento da COP31 em Antalya, Turquia, jornalistas do Carbon Brief responderam a uma série de perguntas em um CB Live. O post trata das principais saídas da COP31 discutidas pelos jornalistas.", "titulo_pt": "CB Live: jornalistas do carbon Brief discutem resultados-chave da COP31", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 284350, "titulo": "Importante logro en un tambo cordobés: redujeron 31 por ciento la emisión de metano", "url": "https://www.clarin.com/rural/importante-logro-tambo-cordobes-redujeron-31-ciento-emision-metano_0_kJackwTsos.html", "fonte_id": "clarin", "data_pub": "2026-11-24T16:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em um estabelecimento leiteiro na província de Córdoba, houve uma redução de 31% na emissão de metano sem afetar a produção de leite. A melhoria foi alcançada através do uso de um suplemento natural feito com compostos bioativos vegetais, como polifenóis e sapônicas.", "titulo_pt": "Importante avanço em um estabalecimento leiteiro cordobés: reduziram 31% a emissão de metano", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 284422, "titulo": "LATAM y Siemens concretan su primer acuerdo en Sudamérica para reducir las emisiones de sus viajes de negocios mediante atributos ambientales asociados a SAF", "url": "https://www.latercera.com/sustentabilidad/noticia/latam-y-siemens-concretan-su-primer-acuerdo-en-sudamerica-para-reducir-las-emisiones-de-sus-viajes-de-negocios-mediante-atributos-ambientales-asociados-a-saf/", "fonte_id": "la_tercera", "data_pub": "2026-11-24T16:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A LATAM e a Siemens firmaram seu primeiro acordo em Sudamérica para reduzir as emissões de gases do efeito estufa dos voos de negócios de seus funcionários através do uso de atributos ambientais associados ao SAF (Combustível de Aviação Sustentável).", "titulo_pt": "LATAM e Siemens concretizam primeiro acordo em Sudamérica para reduzir emissões de voos de negócios através de atributos ambientais de SAF", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 284972, "titulo": "COP31: Key outcomes for food, forests, oceans and nature at the UN climate talks in Antalya", "url": "https://www.carbonbrief.org/cop31-key-outcomes-for-food-forests-oceans-and-nature-at-the-un-climate-talks-in-antalya", "fonte_id": "carbon_brief", "data_pub": "2026-11-24T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas COP31 em Antalya, Turquia, não chegaram a um acordo sobre um 'pacto' que, apesar de não fazer referência clara, abordava questões relacionadas a alimentos, florestas, oceanos e natureza.", "titulo_pt": "COP31: principais resultados para alimentos, florestas, oceanos e natureza nas negociações climáticas da ONU em Antalya", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 284229, "titulo": "Gestão Sustentável: depois de tantas COPs, confesso que não sei mais o que fazer", "url": "https://exame.com/bussola/gestao-sustentavel-depois-da-cop31-confesso-que-nao-sei-mais-o-que-fazer/", "fonte_id": "exame", "data_pub": "2026-11-24T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 falhou, demonstrando os limites da cooperação internacional e questionando a capacidade de lidar com uma crise que requer decisões coletivas.", "titulo_pt": "Gestão Sustentável: depois de tantas COPs, confesso que não sei mais o que fazer", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283762, "titulo": "Indonesia: Search continues for workers trapped after deadly factory fire", "url": "https://www.euronews.com/video/2026/11/24/indonesia-search-continues-for-workers-trapped-after-deadly-factory-fire", "fonte_id": "euronews", "data_pub": "2026-11-24T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos em decorrência de um incêndio devastador em uma fábrica de doces, a oeste de Jacarta, aumentou para 26. Operações de resgate continuam em busca de trabalhadores presos sob os escombros.", "titulo_pt": "Indonésia: busca continua por trabalhadores após incêndio fatal em fábrica", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283359, "titulo": "Áreas de Samambaia, Santa Maria, Sobradinho 2 e Paranoá ficarão sem energia", "url": "https://www.metropoles.com/distrito-federal/areas-de-samambaia-santa-maria-sobradinho-2-e-paranoa-ficarao-sem-energia", "fonte_id": "metropoles", "data_pub": "2026-11-24T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Serão realizadas interrupções de energia entre 10h e 16h em áreas como Samambaia, Santa Maria, Sobradinho 2 e Paranoá, no Distrito Federal, para modernização da rede elétrica e poda de árvores.", "titulo_pt": "Áreas de Samambaia, Santa Maria, Sobradinho 2 e Paranoá ficarão sem energia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 283508, "titulo": "Fenómeno El Niño: 4 mil personas siguen sin poder volver a sus casas en Corrientes y Chaco y qué esperan para las próximas semanas", "url": "https://www.clarin.com/sociedad/fenomeno-nino-4-mil-personas-siguen-poder-volver-casas-corrientes-chaco-esperan-proximas-semanas_0_nx1rXtgOVS.html", "fonte_id": "clarin", "data_pub": "2026-11-24T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A recuperação do nível do rio Paraná é lenta devido à saturação do solo e ao alto índice de humidade. Especialistas esperam um leve aumento nos próximos dias, mas os níveis permanecerão inferiores aos de outubro.", "titulo_pt": "Phenômeno El Niño: 4 mil pessoas ainda não podem retornar às suas casas em Corrientes e Chaco e o que se espera nas próximas semanas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 283862, "titulo": "Cop31 illustrated what’s wrong with climate finance", "url": "https://www.scmp.com/opinion/world-opinion/article/3375456/cop31-illustrated-whats-wrong-climate-finance", "fonte_id": "scmp", "data_pub": "2026-11-24T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro australiano do Clima, Chris Bowen, falou na Conferência das Nações Unidas sobre Mudanças Climáticas em Antalya, Turquia, sobre o desafio da multilateralismo em face de múltiplos crises, incluindo mudança climática, segurança energética, conflitos e demandas de energia da inteligência artificial. Ele afirmou que a cooperação internacional ainda é viável.", "titulo_pt": "Cop31 ilustrou os problemas da finança climática", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283865, "titulo": "‘People are going to die’: Thailand’s toxic rivers, ‘zombie’ fish sow dread", "url": "https://www.scmp.com/week-asia/health-environment/article/3375587/people-are-going-die-thailands-toxic-rivers-zombie-fish-sow-dread", "fonte_id": "scmp", "data_pub": "2026-11-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Thais não podem mais realizar a tradição de lançar lanternas de vela nas rios durante o festival Loy Krathong em algumas regiões, devido à poluição da água. O rio Sai, em Chiang Rai, está contaminado, impedindo a realização dos rituais.", "titulo_pt": "Pessoas vão morrer: rios tóxicos e 'peixes zumbis' causam medo na tailândia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283588, "titulo": "Campaigners urge Albanese government to reject ‘climate bomb’ coalmine expansion after Cop31", "url": "https://www.theguardian.com/australia-news/2026/nov/24/campaigners-urge-albanese-government-to-reject-climate-bomb-coalmine-expansion-after-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-24T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Campanhas ambientais estão pedindo ao governo Albanese que rejeite a expansão de uma mina de carvão na região de Hunter Valley, Nova Gales do Sul, que permitiria a extração adicional de 430 milhões de toneladas de carvão. Isso ocorre após uma declaração de 'linha no chão' sobre combustíveis fósseis feita por dezenas de países durante a COP31 em Turquia.", "titulo_pt": "Campanhas ambientais pedem ao governo Albanese que rejeite expansão de mina de carvão após Cop31", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 283767, "titulo": "Ecuador: Severe flooding hits Galápagos Islands amid El Niño concerns", "url": "https://www.euronews.com/video/2026/11/24/ecuador-severe-flooding-hits-galapagos-islands-amid-el-nino-concerns", "fonte_id": "euronews", "data_pub": "2026-11-24T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inundações causadas por fortes chuvas atingiram partes das Ilhas Galápagos, no Equador, forçando moradores a deixar suas casas. Equipes de resgate estão evacuando pessoas por barco enquanto as comunidades tentam salvar seus pertences.", "titulo_pt": "Ecuador: inundações severas afetam ilhas Galápagos em meio às preocupações com El Niño", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283536, "titulo": "O paradoxo da preservação", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-paradoxo-da-preservacao", "fonte_id": "jota", "data_pub": "2026-11-24T05:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute o paradoxo da preservação de grãos sob alienação fiduciária e o risco de colapso na recuperação judicial do produtor rural.", "titulo_pt": "O paradoxo da preservação de grãos e o risco de colapso na recuperação judicial do produtor rural", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 283852, "titulo": "Sumatrans fear ‘nobody cares’ one year after floods", "url": "https://www.japantimes.co.jp/news/2026/11/24/asia-pacific/sumatrans-year-floods/", "fonte_id": "japan_times", "data_pub": "2026-11-24T03:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de residentes da ilha de Sumatra, na Indonésia, estavam praticamente à própria conta após as inundações, mesmo enquanto se preparavam para a próxima temporada de chuvas.", "titulo_pt": "Sumatranos temem 'não há ninguém que se importe' um ano após inundações", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 282286, "titulo": "Taiwan to continue fossil fuel phase-out: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/24/2003868289", "fonte_id": "taipei_times", "data_pub": "2026-11-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro taiwanês anunciou que o país continuará com o processo de redução do uso de combustíveis fósseis. A transição energética será mantida, conforme planejado.", "titulo_pt": "Taiwan continuará a descontinuar o uso de combustíveis fósseis, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 284779, "titulo": "Malaysia to send back another 6,803 Burmese refugees", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/25/2003868341", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo malásio planeja devolver 6.803 refugiados birmaneses. A decisão foi anunciada recentemente e envolve refugiados que estão no país de forma irregular.", "titulo_pt": "Malásia enviará de volta 6.803 refugiados birmaneses", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 285525, "titulo": "Should freedom of movement be a right or a privilege?", "url": "https://www.aljazeera.com/video/doha-debates/2026/11/24/should-freedom-of-movement-be-a-right-or-a-privilege?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-24T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pergunta se a liberdade de movimento é um direito ou um privilégio é discutida. O texto explora possíveis implicações dessa discussão.", "titulo_pt": "Liberdade de movimento: direito ou privilégio?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 284741, "titulo": "Amnesty calls on UK to stop Israeli organisation promoting West Bank settlements", "url": "https://www.middleeasteye.net/news/amnesty-calls-uk-stop-israeli-non-profit-promoting-west-bank-settlements", "fonte_id": "middle_east_eye", "data_pub": "2026-11-24T16:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International UK está pedindo ao governo britânico para impedir a Shivat Zion, uma organização israelense não lucrativa que promove a imigração judaica para Israel, de estimular cidadãos britânicos. A organização está atualmente em turnê pelo Reino Unido e seu site incentiva a migração para assentamentos ilegais no Território Ocidental.", "titulo_pt": "Amnesty pede ao reino unido para impedir organização israelense que promove assentamentos no território ocidental", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 284719, "titulo": "Five women killed every hour globally by partner, relative last year: UN", "url": "https://www.aljazeera.com/news/2026/11/24/five-women-killed-every-hour-globally-by-partner-relative-in-2025-un?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-24T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a ONU Mulheres, cinco mulheres são assassinadas a cada hora por parceiros ou parentes em todo o mundo. A casa continua sendo o local mais perigoso para mulheres e meninas, um padrão que praticamente não mudou ao longo dos anos.", "titulo_pt": "Cinco mulheres mortas a cada hora por parceiro ou parente no mundo, diz ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 284357, "titulo": "Morre Fábio Konder Comparato, referência em Direitos Humanos e Direito Comercial", "url": "https://www.jota.info/justica/morre-fabio-konder-comparato-referencia-em-direitos-humanos-e-direito-comercial", "fonte_id": "jota", "data_pub": "2026-11-24T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fábio Konder Comparato, professor emérito da USP e jurista, faleceu. Ele foi um referência em Direitos Humanos e Direito Comercial, formulando a tese da função social da empresa e sendo pioneiro no ensino de direitos humanos.", "titulo_pt": "Morre Fábio Konder Comparato, referência em Direitos Humanos e Direito Comercial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 284248, "titulo": "‘Resistir não é crime’, afirma Mônica Seixas após deportação por Israel", "url": "https://www.brasildefato.com.br/2026/11/24/resistir-nao-e-crime-afirma-monica-seixas-apos-deportacao-por-israel/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-24T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada estadual Mônica Seixas, do Psol-SP, retornou ao Brasil após ser deportada por Israel no Aeroporto Internacional Ben Gurion, em Tel Aviv. Ela viajava para observar direitos humanos durante a colheita de uvas.", "titulo_pt": "Resistir não é crime", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 284342, "titulo": "Dados vazados apontam mais de mais de mil suicídios na tropa russa durante guerra na Ucrânia", "url": "https://www.dw.com/pt-br/dados-vazados-apontam-mais-de-mais-de-mil-suicídios-na-tropa-russa-durante-guerra-na-ucrânia/a-80032440?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-24T12:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento do jornal britânico The Guardian, baseado em registros oficiais vazados, indica que mais de mil suicídios ocorreram na tropa russa durante a guerra na Ucrânia. O número real pode ser ainda maior.", "titulo_pt": "Dados vazados indicam mais de mil suicídios na tropa russa durante guerra na Ucrânia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 284552, "titulo": "Scoop: ACLU eyes Supreme Court flips in 11 states", "url": "https://www.axios.com/2026/11/24/aclu-state-supreme-court-south-democrats-religion", "fonte_id": "axios", "data_pub": "2026-11-24T10:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A American Civil Liberties Union está ampliando sua luta pelas eleições do Supremo Tribunal de Estado para áreas vermelhas após as eleições de meios-termos deixarem Texas com apenas uma vaga judicial para uma maioria democrata. Esses tribunais estaduais têm se tornado cada vez mais importantes na arbitragem de direitos constitucionais, enquanto o Supremo Tribunal dos EUA concede maior autonomia aos estados para definir suas próprias políticas.", "titulo_pt": "ACLU amplia batalha eleitoral no supremo estadual em 11 estados vermelhos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 284952, "titulo": "\"Families are under enormous pressure because of Ebola, and women and girls are bearing much of the cost\" – UNICEF", "url": "https://www.unicef.org/press-releases/families-are-under-enormous-pressure-because-ebola-and-women-and-girls-are-bearing", "fonte_id": "unicef", "data_pub": "2026-11-24T10:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias estão sob pressão significativa devido à Ebola, e as mulheres e garotas estão suportando grande parte desse impacto. Essa afirmação foi feita pelo Dr. Douglas Noble, responsável global de emergências de saúde pública e gerente global da incidente do Ebola na UNICEF, durante uma coletiva de imprensa no Palácio das Nações em Genebra.", "titulo_pt": "Famílias estão sob pressão significativa devido à Ebola, e mulheres e garotas estão pagando um alto preço", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 283546, "titulo": "Qué se sabe del caso de la estudiante de El Paso que pasó un mes bajo custodia del ICE", "url": "https://www.lanacion.com.ar/estados-unidos/texas/que-se-sabe-del-caso-de-la-estudiante-de-el-paso-que-paso-un-mes-bajo-custodia-del-ice-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T09:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma estudante venezuelana de El Paso e sua família foram libertados após quase um mês sob custódia do ICE. As informações disponíveis não indicam claramente a posição de cada parte envolvida no caso.", "titulo_pt": "O que se sabe sobre o caso da estudante de El Paso que ficou um mês sob custódia do ICE", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 283496, "titulo": "A cantora iraniana que levou 74 chicotadas por se apresentar sem véu no YouTube", "url": "https://www.bbc.com/portuguese/articles/cwlylr46j3n8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-24T09:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cantora iraniana Parastoo Ahmadi, junto com três músicos e um produtor, recebeu 74 chicotadas na cidade de Qom por se apresentar sem véu no YouTube.", "titulo_pt": "A cantora iraniana que levou 74 chicotadas por se apresentar sem véu no YouTube", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 283831, "titulo": "Why this genocide ruling matters way beyond Myanmar", "url": "https://www.japantimes.co.jp/commentary/2026/11/24/world/myanmar-genocide-ruling-matters/", "fonte_id": "japan_times", "data_pub": "2026-11-24T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A decisão do TPII fornecerá apoio às iniciativas visando prevenir violações em andamento e assegurar indenizações para as vítimas.", "titulo_pt": "Por que esta sentença sobre genocídio importa para além da birma", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 284057, "titulo": "Kylie Cheung on the Fake Victimhood of Abusers, From Johnny Depp to Israel", "url": "https://lithub.com/kylie-cheung-on-the-fake-victimhood-of-abusers-from-johnny-depp-to-israel/", "fonte_id": "lithub", "data_pub": "2026-11-24T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em primavera de 2022, Kylie Cheung estava reportando para o Jezebel sobre casos de assédio sexual e violência doméstica. Ao mesmo tempo, um processo de difamação envolvendo celebridades estava sendo transmitido ao vivo nas redes sociais.", "titulo_pt": "Kylie Cheung sobre a falsa vítima-ideia de abusadores, de Johnny Depp a Israel", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 283827, "titulo": "After ‘Propaganda’ Ban, Bulgarian LGBT Pupils Report Greater Insecurity", "url": "https://balkaninsight.com/2026/11/24/after-propaganda-ban-bulgarian-lgbt-pupils-report-greater-insecurity/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-24T06:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois anos após a implementação de uma proibição ambígua sobre a 'propaganda' LGBTQ+ nas escolas búlgaras, uma pesquisa indica que a situação dos estudantes LGBTQ+ piorou e existe grande incerteza sobre o que realmente está proibido.", "titulo_pt": "Depois da proibição de 'Propaganda', estudantes lgbtq+ em bulgária relatam maior insegurança", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 283625, "titulo": "Damares Alves pede autorização ao STF para visitar Daniel Vorcaro na prisão", "url": "https://veja.abril.com.br/politica/damares-alves-pede-autorizacao-ao-stf-para-visitar-daniel-vorcaro-na-prisao/", "fonte_id": "veja", "data_pub": "2026-11-24T01:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora Damares Alves solicitou ao STF (Supremo Tribunal Federal) permissão para visitar Daniel Vorcaro na prisão. Ela busca esclarecer o escândalo do Banco Master e identifi const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
