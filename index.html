nnbrasil.com.br/nacional/sudeste/rj/taxistas-do-rj-trocam-socos-e-agressoes-no-galeao-apos-troca-de-ponto/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T01:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Motoristas de cooperativa e de táxi do Rio de Janeiro tiveram uma disputa physical no Aeroporto Internacional do Galeão após uma mudança solicitada pelo aeroporto à prefeitura para melhorar o trânsito. A confusão levou a agressões físicas entre os dois grupos de motoristas.", "titulo_pt": "Taxistas do RJ trocam socos e agressões no Galeão após mudança de ponto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 187585, "titulo": "Registro nacional de médicos: hay más activos de los que se creía por arriba de los 65 años y menos por debajo de esa edad", "url": "https://www.lanacion.com.ar/sociedad/registro-nacional-de-medicos-hay-mas-activos-de-los-que-se-creia-por-arriba-de-los-65-anos-y-menos-nid30092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T01:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério de Saúde da Nação informou que há mais médicos ativos acima dos 65 anos do que se pensava, e menos médicos ativos abaixo dessa idade. Essa conclusão resultou da melhoria no controle de matrículas e do cruzamento de dados com outras organizações.", "titulo_pt": "Registro nacional de médicos: há mais ativos acima dos 65 anos e menos abaixo dessa idade", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 187428, "titulo": "Bombeiro é preso após matar estudante de medicina durante briga de trânsito", "url": "https://www.metropoles.com/sao-paulo/bombeiro-estudante-briga-transito", "fonte_id": "metropoles", "data_pub": "2026-10-01T00:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bombeiro foi preso após matar um estudante de medicina durante uma briga de trânsito em Taubaté, interior de São Paulo. Bruno Hashimura San Juliano, o estudante, morreu após ser baleado pelo bombeiro Marcos Paulo Fujarra de Oliveira.", "titulo_pt": "Bombeiro é preso após matar estudante de medicina em briga de trânsito", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188086, "titulo": "Agriculture ministry mulling parental leave for farmers", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/01/2003865180", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra da Agricultura está considerando a implementação de licença parental para agricultores. Atualmente, não há informações detalhadas sobre o escopo ou as possíveis mudanças na legislação.", "titulo_pt": "Agricultura ministério pensa em licença parental para agricultores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 188099, "titulo": "Doctor encourages people to stay active as they age", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/01/2003865199", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O médico incentiva as pessoas a permanecerem ativas à medida que envelhecem. Ele recomenda atividades físicas e outras formas de manter a atividade para a melhoria da qualidade de vida na idade avançada.", "titulo_pt": "Médico incentiva atividade para idosos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 187434, "titulo": "O que não pode faltar na alimentação de mulheres com 60 anos ou mais", "url": "https://www.metropoles.com/vida-e-estilo/o-que-nao-pode-faltar-na-alimentacao-de-mulheres-com-60-anos-ou-mais", "fonte_id": "metropoles", "data_pub": "2026-09-30T23:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alimentação de mulheres acima de 60 anos deve incluir proteína, cálcio, vitamina B12 e água, que são componentes importantes para a saúde nessa fase da vida. O corpo feminino passa por mudanças que exigem ajustes na dieta.", "titulo_pt": "O que não pode faltar na alimentação de mulheres com 60 anos ou mais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 187659, "titulo": "Las tres vacunas que el Minsal busca sumar al sistema público", "url": "https://www.latercera.com/nacional/noticia/las-tres-vacunas-que-el-minsal-busca-sumar-al-sistema-publico/", "fonte_id": "la_tercera", "data_pub": "2026-09-30T23:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde tem um programa de Vacinação Especial (VE) para pessoas com condições médicas específicas. O governo busca incluir novas vacinas no sistema público para proteger contra o vírus respiratório sincicial em adultos, herpes zóster e neumococo.", "titulo_pt": "As três vacinas que o ministério da saúde busca incluir no sistema público", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 187386, "titulo": "Dupla é denunciada por vender bebida com metanol que causou cegueira em vítima", "url": "https://veja.abril.com.br/brasil/dupla-e-denunciada-por-vender-bebida-com-metanol-que-causou-cegueira-em-vitima/", "fonte_id": "veja", "data_pub": "2026-09-30T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois indivíduos foram denunciados por vender bebida adulterada com metanol, resultando em cegueira em uma vítima. O proprietário de um estabelecimento comprava produtos de fornecedores sem verificar a documentação fiscal sobre a origem.", "titulo_pt": "Dois são denunciados por vender bebida com metanol que causou cegueira", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 188026, "titulo": "How Hong Kong’s foreign carer scheme aims to get ahead of ageing city", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3369140/how-hong-kongs-foreign-carer-scheme-aims-get-ahead-ageing-city?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Hong Kong planeja introduzir cuidadores estrangeiros qualificados para auxiliar na assistência aos idosos. Essa iniciativa visa antecipar-se ao desafio demográfico da cidade envelhecida.", "titulo_pt": "Como o esquema de cuidadores estrangeiros de Hong Kong visa se antecipar à cidade envelhecida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 188207, "titulo": "New food safety strategy aims to reduce the burden of foodborne diseases affecting 43 million people in the Americas", "url": "https://www.paho.org/en/news/30-9-2026-new-food-safety-strategy-aims-reduce-burden-foodborne-diseases-affecting-43-million", "fonte_id": "paho", "data_pub": "2026-09-30T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo plano de segurança alimentar foi lançado com o objetivo de reduzir a carga de doenças transmitidas por alimentos que afetam 43 milhões de pessoas nas Américas. Este plano foi anunciado em 30 de setembro de 2026.", "titulo_pt": "Novo plano de segurança alimentar visa reduzir a carga de doenças transmitidas por alimentos afetando 43 milhões de pessoas nas américas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 188208, "titulo": "PAHO and MSD for Mothers sign agreement to reduce preventable maternal deaths in Guatemala and the Dominican Republic", "url": "https://www.paho.org/en/news/30-9-2026-paho-and-msd-mothers-sign-agreement-reduce-preventable-maternal-deaths-guatemala-and", "fonte_id": "paho", "data_pub": "2026-09-30T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO e MSD for Mothers assinaram um acordo para reduzir as mortes maternas evitáveis na Guatemala e na República Dominicana. O objetivo é melhorar a saúde materna em dois países da América Latina.", "titulo_pt": "PAHO e MSD for Mothers assinam acordo para reduzir mortes maternas evitáveis na Guatemala e república dominicana", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 188209, "titulo": "Venezuelan physician receives PAHO award for advancing Indigenous and intercultural health", "url": "https://www.paho.org/en/news/30-9-2026-venezuelan-physician-receives-paho-award-advancing-indigenous-and-intercultural", "fonte_id": "paho", "data_pub": "2026-09-30T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um médico venezuelano recebeu um prêmio da OPAS por avançar na saúde indígena e intercultural.", "titulo_pt": "Médico venezuelano recebe prêmio da opas por avanços na saúde indígena e intercultural", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 185703, "titulo": "Corpo de jovem de 21 anos é encontrado carbonizado perto de creche no DF", "url": "https://www.metropoles.com/distrito-federal/corpo-de-jovem-de-21-anos-e-encontrado-carbonizado-perto-de-creche-no-df", "fonte_id": "metropoles", "data_pub": "2026-09-30T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O corpo de uma jovem de 21 anos foi encontrado carbonizado por volta das 16h na Vila Roriz, no Distrito Federal, após o acionamento do 9° Batalhão da Polícia Militar na terça-feira (29/9).", "titulo_pt": "Corpo carbonizado de jovem de 21 anos encontrado perto de creche no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 185823, "titulo": "Boicote de clubes determinou adiamento de reunião com governo sobre MP do fim das bets", "url": "https://veja.abril.com.br/politica/boicote-de-clubes-determinou-adiamento-de-reuniao-com-governo-sobre-mp-do-fim-das-bets/", "fonte_id": "veja", "data_pub": "2026-09-30T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reunião entre clubes e o governo sobre a medida provisória do fim das apostas esportivas foi adiada devido a um boicote dos clubes. A presença de Lula era desejada, mas sua campanha decidiu que isso não seria benéfico para o presidente.", "titulo_pt": "Boicote dos clubes adiou reunião sobre MP do fim das bets", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 185950, "titulo": "Maioria nas urnas, minoria no poder: mulheres avançam no Senado e travam nos estados", "url": "https://www.jota.info/opiniao-e-analise/colunas/lorena-barberia/maioria-nas-urnas-minoria-no-poder-mulheres-avancam-no-senado-e-travam-nos-estados", "fonte_id": "jota", "data_pub": "2026-09-30T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As mulheres conquistaram uma maioria nas urnas, formando a maior bancada feminina no Senado, mas continuam sendo minoria nos governos estaduais. Com 53% do eleitorado, as candidatas podem alcançar um novo recorde na Câmara alta, mas ainda são raras nas disputas pelo poder executivo estadual.", "titulo_pt": "Maioria nas urnas, minoria no poder: mulheres avançam no Senado e travam nos estados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 185706, "titulo": "Justiça converte em preventiva prisão de homem que atacou jovem no metrô", "url": "https://www.metropoles.com/distrito-federal/justica-converte-em-preventiva-prisao-de-homem-que-atacou-jovem-no-metro", "fonte_id": "metropoles", "data_pub": "2026-09-30T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz determinou a prisão preventiva de Marcos Augusto, acusado de atacar uma jovem no metrô. Ele será levado para uma unidade básica de saúde para avaliação médica.", "titulo_pt": "Justiça determina prisão preventiva de homem que atacou jovem no metrô", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 188107, "titulo": "People over AI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/01/2003865165", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância das pessoas em relação à inteligência artificial, enfatizando que os seres humanos devem ter prioridade sobre o desenvolvimento avançado de tecnologias de IA. O título 'People over AI' foi traduzido para 'Pessoas acima da IA' em português brasileiro.", "titulo_pt": "Pessoas acima da IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 187853, "titulo": "Tracking methane leaks to slow global warming: European regulation project weakened by France's reversal", "url": "https://www.lemonde.fr/en/environment/article/2026/09/30/tracking-methane-leaks-to-slow-global-warming-european-regulation-project-weakened-by-france-s-reversal_6758122_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emmanuel Macron propôs reduzir as emissões de metano do setor de combustíveis fósseis, mas acabou por pedir a postergação da implementação da legislação europeia sobre o tema, justificando com a crise energética.", "titulo_pt": "Rastreamento de vazamentos de metano para frear o aquecimento global: projeto de regulamentação europeu enfraquecido pela reversão da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 185987, "titulo": "Recuperación hídrica no es suficiente para dar término a la megasequía iniciada en 2010", "url": "https://www.latercera.com/pulso/noticia/recuperacion-hidrica-no-es-suficiente-para-dar-termino-a-la-megasequia-iniciada-en-2010/", "fonte_id": "la_tercera", "data_pub": "2026-09-30T15:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O biministro de Obras Públicas e de Transportes e Telecomunicaciones, Louis de Grange, afirmou que há garantia de disponibilidade para irrigação e abastecimento de água potável para a população até março de 2027. A recuperação hídrica não é considerada suficiente para pôr fim à megasequía iniciada em 2010.", "titulo_pt": "Recuperação hídrica não resolve megasequía iniciada em 2010", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 185779, "titulo": "Calor armazenado nos oceanos bate recorde em 2025; relatório aponta aquecimento acelerado, alta do nível do mar e perda de gelo polar", "url": "https://www.cnnbrasil.com.br/ciencia/calor-armazenado-nos-oceanos-bate-recorde-em-2025-relatorio-aponta-aquecimento-acelerado-alta-do-nivel-do-mar-e-perda-de-gelo-polar/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-30T14:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que o calor armazenado nos oceanos atingiu um recorde em 2025, com evidências de aquecimento acelerado, aumento do nível do mar e diminuição do gelo polar. O estudo abrange uma década de monitoramento e destaca mudanças na temperatura do Mediterrâneo, nos padrões do fitoplâncton e na extensão do gelo marinho no Ártico e na Antártida.", "titulo_pt": "Calor armazenado nos oceanos bate recorde em 2025; relatório aponta aquecimento acelerado, alta do nível do mar e perda de gelo polar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 185991, "titulo": "Tribunal ambiental confirma multa de más de $4 mil millones contra Albemarle por sobreexplotar el Salar de Atacama", "url": "https://www.latercera.com/pulso/noticia/tribunal-ambiental-confirma-multa-de-mas-de-4-mil-millones-contra-albemarle-por-sobreexplotar-el-salar-de-atacama/", "fonte_id": "la_tercera", "data_pub": "2026-09-30T14:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Ambiental confirmou a multa de mais de 4 bilhões de pesos chilenos para a empresa americana Albemarle, que foi acusada de sobreexplotar o Salar de Atacama. A companhia não conseguiu anular a penalização impuesta pela Superintendência de Meio Ambiente em outubro do ano anterior.", "titulo_pt": "Tribunal ambiental confirma multa de mais de 4 bilhões contra Albemarle por sobreexplotar o Salar de Atacama", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 185833, "titulo": "População de jumentos cai 94% no Brasil, e cientistas se mobilizam contra abate", "url": "https://veja.abril.com.br/agenda-verde/populacao-de-jumentos-cai-94-no-brasil-e-cientistas-fazem-mobilizacao-contra-abate/", "fonte_id": "veja", "data_pub": "2026-09-30T14:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A população de jumentos no Brasil diminuiu 94%, e cientistas estão se mobilizando para denunciar os impactos do comércio de peles e defender medidas de proteção.", "titulo_pt": "População de jumentos cai 94% no Brasil, e cientistas se mobilizam contra abate", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 185838, "titulo": "As previsões preocupantes de órgãos brasileiros para o Super El Niño", "url": "https://veja.abril.com.br/economia/as-previsoes-preocupantes-de-orgaos-brasileiros-para-o-super-el-nino/", "fonte_id": "veja", "data_pub": "2026-09-30T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O INMET considera plausível um episódio de El Niño extremo, com riscos para a produção de soja, milho, café e trigo. O MME admite a possibilidade de reforçar medidas de proteção.", "titulo_pt": "Previsões preocupantes de órgãos brasileiros para o Super El Niño", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 185839, "titulo": "Mudança climática pressiona preços de alimentos e ameaça inflação no Brasil", "url": "https://veja.abril.com.br/agenda-verde/mudanca-climatica-pressiona-precos-de-alimentos-e-ameaca-inflacao-no-brasil/", "fonte_id": "veja", "data_pub": "2026-09-30T14:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mudança climática está pressionando os preços dos alimentos e ameaçando a inflação no Brasil, com ondas de calor, secas e chuvas extremas reduzindo as safras. O Banco Central estima que o impacto do El Niño possa afetar a inflação até 2027.", "titulo_pt": "Mudança climática pressiona preços de alimentos e ameaça inflação no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 186977, "titulo": "Analysis: Wind and solar save UK from gas imports worth £5.9bn during Hormuz crisis", "url": "https://www.carbonbrief.org/analysis-wind-and-solar-save-uk-from-gas-imports-worth-5-9bn-during-hormuz-crisis", "fonte_id": "carbon_brief", "data_pub": "2026-09-30T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido evitou a necessidade de importações de gás com um valor de £5,9 bilhões desde o início da crise do Hormuz, graças à energia proveniente do vento e do sol.", "titulo_pt": "Análise: energia eólica e solar evitam importações de gás valendo £5,9 bilhões durante crise do Hormuz", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 185556, "titulo": "Brasil tem quase 10% mais gado do que gente em 2025", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/brasil-tem-quase-10-mais-gado-do-que-gente-em-2025.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-30T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil contava com 234,3 milhões de bovinos em 31 de dezembro de 2025, segundo a Pesquisa da Pecuária Municipal do IBGE. O efetivo de gado diminuiu 1,7% em comparação com o mesmo período de 2024.", "titulo_pt": "Brasil tem quase 10% a mais de gado do que de pessoas em 2025", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 186629, "titulo": "Kuala Lumpur is world’s most polluted city due to haze, Singapore third, index shows", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3369363/kuala-lumpur-worlds-most-polluted-city-due-haze-singapore-third-index-shows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T12:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kuala Lumpur foi classificada como a cidade mais poluída do mundo devido a uma névoa de fuligem, enquanto Singapura ficou em terceiro lugar, de acordo com um índice. A poluição foi causada por incêndios florestais na Indonésia.", "titulo_pt": "Kuala Lumpur é a cidade mais poluída do mundo devido a fuligem, diz índice; singapura em terceiro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 186391, "titulo": "Thousands of firefighters march in Paris demanding more resources", "url": "https://www.euronews.com/video/2026/09/30/thousands-of-firefighters-march-in-paris-demanding-more-resources", "fonte_id": "euronews", "data_pub": "2026-09-30T11:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 8.000 bombeiros franceses marcharam por Paris exigindo mais recursos e financiamento, criticando a falta de ação do governo conforme relatado pelas entidades sindicais.", "titulo_pt": "Milhares de bombeiros marcham em Paris exigindo mais recursos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 186393, "titulo": "Flooding and destruction as Hurricane Polo hits Mexico", "url": "https://www.euronews.com/video/2026/09/30/flooding-and-destruction-as-hurricane-polo-hits-mexico", "fonte_id": "euronews", "data_pub": "2026-09-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Polo causou inundações e danos em partes do México, conforme mostram imagens aéreas de ruas inundadas e imagens no solo de telhados danificados, galhos caídos e moradores removendo detritos.", "titulo_pt": "Inundações e destruição após o furacão Polo atingir o México", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 186395, "titulo": "Rehabilitated green sea turtle Jurassic returns to Atlantic", "url": "https://www.euronews.com/video/2026/09/30/rehabilitated-green-sea-turtle-jurassic-returns-to-atlantic", "fonte_id": "euronews", "data_pub": "2026-09-30T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um macho de tartaruga marinheira verde, apelidada de Jurassic e com cerca de 215 libras, foi libertada no Oceano Atlântico após um período de reabilitação na Flórida, equipada com um rastreador satelital para monitorar suas movimentações.", "titulo_pt": "Jurassic, a tartaruga verde madura retorna ao oceano atlântico", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 186597, "titulo": "Polar oceans transformed as warming melts ice habitats, research shows", "url": "https://www.japantimes.co.jp/environment/2026/09/30/climate-change/polar-oceans-warming-ice-habitats/", "fonte_id": "japan_times", "data_pub": "2026-09-30T06:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostra que as camadas polares estão sendo transformadas à medida que o aquecimento global derrete os habitats de geleada, com o gelo do Ártico diminuindo em cerca de 50.000 km² por década desde 1979.", "titulo_pt": "Oceanos polares transformados à medida que o aquecimento derrete os habitats de geleada", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 186177, "titulo": "Why Have Indonesia’s Fires Gotten So Bad?", "url": "https://foreignpolicy.com/2026/09/30/indonesia-forest-fires-worst-ever-plantations-el-nino/", "fonte_id": "foreign_policy", "data_pub": "2026-09-30T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As queimadas na Indonésia podem ser as piores de toda a história do país.", "titulo_pt": "Por que as queimadas na indonésia pioraram tanto?", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 187646, "titulo": "Corte Suprema de EE.UU. anula la suspensión de la ejecución de mujer que estuvo 31 años en corredor de la muerte", "url": "https://www.latercera.com/mundo/noticia/corte-suprema-de-eeuu-anula-la-suspension-de-la-ejecucion-de-mujer-que-estuvo-31-anos-en-corredor-de-la-muerte/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T01:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema dos Estados Unidos anulou a suspensão da execução de Christa Pike, que estava há 31 anos no corredor da morte após ser condenada a morte em 1996 por assassinar uma colega de escola.", "titulo_pt": "Corte Suprema dos EUA anula suspensão da execução de mulher no corredor da morte", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 187846, "titulo": "US Supreme Court clears way for Tennessee woman's imminent execution", "url": "https://www.lemonde.fr/en/international/article/2026/10/01/us-supreme-court-clears-way-for-tennessee-woman-s-imminent-execution_6758127_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T01:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos permitiu a execução iminente de Christa Pike, uma mulher condenada ao assassinato há mais de 30 anos e a única mulher na prisão da morte do Tennessee. Após horas de disputas judiciais, o caminho para a aplicação da pena capital foi aberto.", "titulo_pt": "Suprema corte dos EUA autoriza execução iminente de mulher condenada ao assassinato no Tennessee", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 188100, "titulo": "Justice not done", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/01/2003865201", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda um tema relacionado à justiça não ser feita. Não há detalhes adicionais sobre o conteúdo do trecho fornecido.", "titulo_pt": "Justiça não feita", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 188020, "titulo": "Woman told Cornell police 2 years ago she was 100% sure she was raped, transcript shows", "url": "https://www.scmp.com/news/world/united-states-canada/article/3369397/woman-told-cornell-police-2-years-ago-she-was-100-sure-she-was-raped-transcript-shows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T23:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher que apresentou uma ação judicial afirmando ter sido sexualmente agredida por sete homens em uma casa de fraternidade da Universidade Cornell relatou à polícia, semanas após o incidente, que estava '100% certa' de que havia sido estuprada. O relato de uma transcrição da entrevista com os investigadores, que não foi divulgada publicamente, levanta novas dúvidas sobre a decisão do promotor local de não processar ninguém na época.", "titulo_pt": "Mulher diz à polícia que estava 100% certa de ter sido estuprada em fraternidade da Cornell, dois anos após incidente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 187849, "titulo": "After Marseille's Old Port roundup is recognized as a crime against humanity, victims express relief: 'This is the end of collective indifference'", "url": "https://www.lemonde.fr/en/france/article/2026/10/01/after-marseille-s-old-port-roundup-is-recognized-as-a-crime-against-humanity-victims-express-relief-this-is-the-end-of-collective-indifference_6758123_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-30T22:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França reconheceu oficialmente como crime contra a humanidade a operação conjunta nazista e do regime colaboracionista Vichy que afetou 20 mil moradores do Velho Port de Marselha em janeiro de 1943, após uma investigação de sete anos iniciada por campanha de vítimas.", "titulo_pt": "Reconhecimento oficial de crime contra a humanidade na operação do velho Port de marselha", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 187632, "titulo": "STF amplia alcance do direito de servidor optar por previdência complementar ou regime antigo", "url": "https://www.jota.info/stf/do-supremo/stf-amplia-alcance-do-direito-de-servidor-optar-por-previdencia-complementar-ou-regime-antigo", "fonte_id": "jota", "data_pub": "2026-09-30T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) estendeu o direito dos servidores públicos escolher entre o regime previdenciário complementar ou o antigo. O período de trabalho em outro ente federativo será considerado na determinação do sistema previdenciário a ser adotado.", "titulo_pt": "STF amplia direito de servidor escolher entre previdência complementar ou regime antigo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 187981, "titulo": "French court sentences 13 men over deadliest small-boat crossing to UK", "url": "https://www.aljazeera.com/news/2026/9/30/french-court-sentences-13-men-over-deadliest-small-boat-crossing-to-uk?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-30T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal francês condenou 13 homens por tráfico humano após a morte de 31 migrantes em uma travessia de barco pequeno para o Reino Unido em 2021. Seis dos condenados foram acusados de homicídio involuntário.", "titulo_pt": "French court sentences 13 men over deadliest small-boat crossing to UK", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 187790, "titulo": "944 children abused by Catholic clergy, Mass. AG says — but no new charges", "url": "https://www.axios.com/2026/09/30/massachusetts-catholic-clergy-sex-abuse-report", "fonte_id": "axios", "data_pub": "2026-09-30T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral da Massachusetts divulgou um relatório que documenta mais de 270 padres católicos acusados de abusar sexualmente de 944 crianças em três dioceses. No entanto, a investigação não resultará em novas acusações criminais.", "titulo_pt": "944 Crianças abusadas por clérigos católicos, mas sem novas acusações", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 187713, "titulo": "Sweden must apologise for harm done to Sami people, says state-backed report", "url": "https://www.theguardian.com/world/2026/sep/30/sweden-sami-harm-apology-report", "fonte_id": "guardian_world", "data_pub": "2026-09-30T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório de uma comissão independente, patrocinada pelo governo sueco, recomendou que o país se desculpe pelo dano causado aos povos sami e inicia um processo nacional de compensação e reconciliação. O relatório também pediu uma desculpa imediata aos sami mais velhos que foram obrigados a frequentar escolas segregadas, conhecidas como escolas de nomades, onde sofreram violações.", "titulo_pt": "Suecia deve se desculpar pelos danos causados aos povos Sami, diz relatório oficial", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 186328, "titulo": "US Court stays Christa Pike execution", "url": "https://www.lemonde.fr/en/international/article/2026/09/30/christa-pike-set-to-become-first-woman-executed-in-tennessee-in-two-centuries_6758111_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-30T14:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1995, a americana Christa Pike foi condenada à morte por torturar e assassinar sua colega Colleen Slemmer em Knoxville aos 18 anos. Após 30 anos no patígio, ela estava programada para ser executada por injeção letal naquele dia.", "titulo_pt": "Corte dos EUA suspende execução de Christa Pike", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 186119, "titulo": "South African leader urges men to speak up on gender-based violence after series of killings", "url": "https://www.theguardian.com/world/2026/sep/30/south-africa-gender-based-violence-women-killings", "fonte_id": "guardian_world", "data_pub": "2026-09-30T14:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da África do Sul, Cyril Ramaphosa, pediu que os homens assumam mais responsabilidade pela violência contra mulheres e anunciou medidas para combater o problema. Ele reconheceu que não foram feitas o suficiente para proteger as mulheres e anunciou a revisão de casos não resolvidos e o desenvolvimento de um plano de financiamento para reduzir o backlog forense.", "titulo_pt": "Líder sul-africano pede que homens falem mais sobre violência contra mulheres após série de assassinatos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 186628, "titulo": "Hong Kong’s Pansy Ho wins permanent injunction against woman who harassed her", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3369365/hong-kongs-pansy-ho-wins-permanent-injunction-against-woman-who-harassed-her?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T12:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pansy Ho, filha do falecido magnata do casino de Macau Stanley Ho, venceu uma ação judicial que impede permanentemente uma mulher de contatar-a, após esta ter sido hostil e ter enviado e-mails e cartas falsas com acusações falsas. A mulher também foi condenada a pagar a Ho 1,8 milhão de dólares hongkongeses em compensação pelos danos causados.", "titulo_pt": "Pansy Ho vence ação judicial contra mulher que a intimidou", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 186121, "titulo": "Top Trump figures push to direct human rights funding to rightwing causes", "url": "https://www.theguardian.com/us-news/2026/sep/30/trump-state-department-human-rights-fund", "fonte_id": "guardian_world", "data_pub": "2026-09-30T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump está tentando direcionar mais de $175 milhões do fundo de direitos humanos do Departamento de Estado para projetos que incluem um fundo anti-comunista de $40 milhões, apoio a grupos que defendem os direitos dos afrikaners brancos na África do Sul, campanhas contra o Supremo Tribunal Federal do Brasil e programas que recompensam aliados ideológicos na Europa que defendem as 'normas civilizacionais ocidentais'.", "titulo_pt": "Figuras de Trump buscam direcionar fundos de direitos humanos para causas de direita", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 186642, "titulo": "In-law’s anger over HK$72 million flat sale drove murder of Abby Choi, court hears", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3369340/laws-anger-over-hk72-million-flat-sale-drove-murder-abby-choi-court-hears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abby Choi Tin-fung, uma socialite de Hong Kong, foi morta por seu sogro e seus dois filhos após ela insistir na venda de um apartamento avaliado em HK$72 milhões (US$9,2 milhões) onde eles residiam. O sogro ficou extremamente zangado com a decisão de Abby de vender a propriedade.", "titulo_pt": "Sogro e filhos de Abby Choi encomendaram o assassinato após ela querer vender apartamento de HK$72 milhões", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 186674, "titulo": "Malaysia begins repatriation of Burmese nationals", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/30/2003865117", "fonte_id": "taipei_times", "data_pub": "2026-09-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Malásia iniciou o processo de repatriação de cidadãos birmaneses. O governo malásio está tomando medidas para retornar os refugiados birmaneses a seu país de origem.", "titulo_pt": "Malásia inicia repatriação de cidadãos birmaneses", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 188163, "fonte_id": "yonhap_news", "titulo": "Seoul shares narrow losses late Thurs. morning amid inflation woes", "url": "https://en.yna.co.kr/view/AEN20261001005000320", "data_pub": "2026-10-01T02:28:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "Seul registra perdas mais moderadas no final da manhã de quinta-feira, diante das preocupações com a inflação", "veiculo": "Y function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');

    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';

      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
