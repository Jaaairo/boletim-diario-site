</div>

<script>
const D = {"gerado_em": "24/11/2026 19:18", "stats": {"noticias_novas": 608, "resumos_gerados": 228}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva sancionou a lei do ajuste fiscal, que pode economizar até R$ 56 bilhões em 2027, logo após a aprovação no Congresso. Além disso, Lula divulgou uma 'Carta ao Povo Brasileiro' com as prioridades para seu quarto mandato. O Supremo Tribunal Federal (STF) confirmou que réus ainda estão obrigados a ressarcir os cofres públicos, mesmo após a declaração de inconstitucionalidade da improbidade culposa. O ex-presidente Jair Bolsonaro apresentou melhoras em seu quadro de obstrução intestinal, mas ainda não há previsão para a alta. O STF também decidiu que o fim da improbidade culposa não impede a obrigação de ressarcir os cofres públicos, mantendo os efeitos das condenações definitivas mesmo após a declaração de inconstitucionalidade.", "mundo": "A Arábia Saudita enfrentou outro ataque a um prédio importante em menos de uma semana, com o edifício mais alto de Riad sofrendo um ataque pela segunda vez. A coalizão que combate os houthis do Iêmen assumiu a responsabilidade. Por outro lado, a Huawei foi condenada por roubo de segredos comerciais em um julgamento em Nova York, mas foi absolta de acusações mais graves. O retorno de Jensen Huang à presidência da Nvidia levantou novas discussões sobre a influência do governo Trump na empresa. A Organização das Nações Unidas aprovou uma proposta brasileira para oferecer serviços turísticos adaptados às necessidades de muçulmanos. Além disso, a Arábia Saudita enfrenta um sequestro em um supermercado em Cartagena, uma cidade turística da Colômbia, enquanto a economia argentina entra em recessão, desafiando as promessas de crescimento feitas pelo economista Javier Milei.\n\nOs eventos geopolíticos recentes abrangem uma ampla gama de questões, desde conflitos regionais e ataques cibernéticos até sanções e acusações de desenvolvimento de armas. O Irã é acusado de desenvolver armas químicas, o que levou Israel a prometer impedir esses esforços. Paralelamente, a Rússia realizou manobras militares próximas ao espaço aéreo da Coreia do Sul, levando as autoridades sul-coreanas a emitirem avisos de alerta de artilharia. No contexto do conflito na Ucrânia, as autoridades locais recomendaram que as famílias na região de Donetsk se retirem, intensificando as preocupações sobre a segurança na área. As tensões entre os Estados Unidos e a China também estão em evidência, com a Alibaba e a Megaspeed sendo incluídas em uma lista negra dos EUA em conexão com um escândalo envolvendo a Nvidia. Além disso, os ataques cibernéticos que afetaram o sistema de análise de informações da CIA e outras agências de inteligência dos EUA continuam a causar preocupações, com autoridades suspeitando que outros órgãos também tenham sido comprometidos.", "economia": "A Argentina entrou em recessão técnica, com a economia tendo contraído em setembro, marcando o segundo trimestre consecutivo de queda. O país enfrenta instabilidade financeira, com o risco-país superando os 1.100 pontos. Em contraste, a confiança do consumidor nos Estados Unidos atingiu seu nível mais alto em quase dois anos, impulsionada pelo otimismo em relação ao mercado de trabalho e à economia após as eleições de meio de mandato. A China prorrogou a suspensão de controles sobre exportações de minerais críticos para os EUA, buscando evitar uma escalada na frágil trégua comercial. No Brasil, a Petrobras aprovou um plano de investimentos de US$ 122 bilhões entre 2027 e 2031, com US$ 113 bilhões destinados a projetos em implantação. O Banco Central está desenvolvendo medidas que podem afetar intermediários em arranjos de pagamento, como marketplaces que atuam como subcredenciadores. Além disso, a arrecadação federal atingiu um novo recorde em outubro, com crescimento de 7,3% e R$ 293,975 bilhões arrecadados, refletindo a tributação de investimentos, o mercado de trabalho e pagamentos extraordinários.", "tecnologia": "O retorno de Jensen Huang à Nvidia gerou alívio na indústria de inteligência artificial, mas persistem incertezas sobre o futuro da empresa. Huang se desculpou com sua equipe durante uma reunião geral e revelou que está em terapia. A Nvidia foi incluída na Lista de Entidades pelo Departamento do Comércio dos Estados Unidos após Huang assumir o cargo de CEO com o apoio da Administração Trump. A Huawei foi condenada em 10 de 12 acusações em um caso criminal nos Estados Unidos, após uma batalha legal de sete anos, e enfrenta acusações de espionagem corporativa e evasão de sanções. O uso de inteligência artificial em assistentes de voz dobrou no Brasil em cinco anos, mas a maioria dos usuários se limita a tarefas básicas. A Tidal começará a banir músicas geradas por inteligência artificial a partir de dezembro, enquanto a Meta e o TikTok contestam mudanças na lei de direitos autorais da Indonésia que exigiriam que as plataformas pagassem empresas de comunicação por exibir conteúdo jornalístico e estabeleceriam regras para o uso de inteligência artificial.", "ciencia": "A NASA anunciou que o conteúdo da NASA+ será exibido no cinema The Greenbelt em Greenbelt, Maryland, expandindo assim a presença da agência em plataformas de visualização e aproximando o espaço ainda mais das casas dos espectadores. A agência concluiu uma revisão importante para o Space Reactor-1 (SR-1) Freedom, definindo elementos-chave da espaçonave, que está programada para lançamento em 2028 e que será a primeira a demonstrar propulsão elétrica nuclear espacial. A missão CRS-25 da Northrop Grumman para a Estação Espacial Internacional levará aproximadamente 11.000 libras de suprimentos e experimentos científicos. A NASA divulgou detalhes da poeira quente que compõe o resíduo da supernova Cassiopeia A (Cas A) em uma imagem de alta resolução no infravermelho médio, revelada em 23 de novembro de 2026. Além disso, a China lançou uma nova missão tripulada à sua estação espacial, com o astronauta estrangeiro paquistanês Muhammad Zeeshan Ali participando pela primeira vez. Este evento marcará um avanço na cooperação espacial entre China e Paquistão.", "cultura": "Thelma Golden, diretora do Studio Museum in Harlem, anunciou que deixará o cargo após 20 anos, celebrando o 20º aniversário de sua nomeação. Este anúncio foi feito um ano após a reabertura do museu em sua nova edificação, após sete anos de encerramento. Em outra notícia importante, o EVA International anunciou o tema para sua edição de 50 anos em 2027, com o diretor Matt Packer deixando o cargo no verão seguinte. O Museu Histórico Militar de Dresde concordou em devolver um arquivo contestado de uma família de Testemunhas de Jeová, que sofreu perseguição durante a Segunda Guerra Mundial, a Annemarie Kusserow, uma das 11 crianças dessa família. Além disso, a Bienal de Bukhara revelou o tema 'The Long Welcome' e anunciou os primeiros artistas para sua exposição, programada para acontecer de 3 de setembro a 21 de novembro.", "sociedade": "Um médico brasileiro se tornou um herói após resgatar um idoso durante inundações, usando uma prancha de surfe, na Asa Norte do Distrito Federal. Em São Paulo, a Polícia Militar apreendeu 34 mil objetos cortantes, incluindo facas e tesouras, durante uma operação no centro da cidade. Na cidade de Nova York, o prefeito Eric Adams informou que mais de três milhões de imigrantes consideram a cidade seu lar, e a linha municipal de assistência legal está expandindo seus serviços, incluindo conselheiros multilíngues e atendimento aos fins de semana. No Brasil, a expectativa de vida caiu pela primeira vez desde 1950, de acordo com o chefe da Organização Mundial da Saúde, em meio a uma grave crise econômica. Além disso, o especialista Robert Muggah afirmou que o presidente Lula enfrentará um cenário de segurança pública mais complexo devido ao problema persistente do crime organizado nas prisões.", "meio_ambiente": "Após a COP31 em Belém, Brasil, jornalistas do Carbon Brief debateram os principais resultados do evento, que abordou alimentos, florestas, oceanos e natureza, mas não chegou a um acordo sobre um 'pacto' que, embora não mencionasse diretamente, abordava essas áreas. Em Córdoba, uma redução de 31% na emissão de metano foi alcançada em uma propriedade leiteira, através do uso de um suplemento natural feito com compostos bioativos vegetais, sem afetar a produção de leite. A LATAM e a Siemens assinaram seu primeiro acordo na América do Sul para reduzir as emissões de gases de efeito estufa dos voos de negócios de seus funcionários, utilizando atributos ambientais associados ao SAF (Combustível de Aviação Sustentável).", "direitos_humanos": "O governo malásio anunciou que planeja devolver 6.803 refugiados birmaneses, o que reforça debates sobre os direitos humanos, questionando se a liberdade de movimento é um direito ou um privilégio. Em outro desenvolvimento, a Amnesty International UK pediu ao governo britânico para impedir uma organização israelense de estimular a imigração para assentamentos ilegais na Cisjordânia, destacando a questão dos direitos humanos em conflitos territoriais. A ONU Mulheres alertou sobre o aumento alarmante de assassinatos de mulheres por parceiros ou parentes, com cinco vítimas a cada hora globalmente, reforçando a urgência de proteger as mulheres e meninas em casa. Estes eventos abrangem desde questões de refugiados e imigração até a violência doméstica e a promoção de direitos humanos em conflitos, destacando a complexidade e a importância do tema."}, "resumo_do_dia": {"politica_nacional": [{"id": 285139, "titulo": "Nunes Marques vai analisar pedido de Vorcaro para afastar Fachin do caso Master", "url": "https://veja.abril.com.br/politica/nunes-marques-vai-analisar-pedido-de-vorcaro-para-afastar-fachin-do-caso-master/", "fonte_id": "veja", "data_pub": "2026-11-24T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa do ex-banqueiro Vorcaro questiona a competência do presidente do STF, Fachin, para conduzir os procedimentos da investigação. Nunes Marques será responsável por analisar este pedido de afastamento.", "titulo_pt": "Nunes Marques vai analisar pedido de Vorcaro para afastar Fachin do caso Master", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285111, "titulo": "Tucano encontra Alckmin e defende que ele tenha papel central na economia no Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/tucano-encontra-alckmin-e-defende-que-ele-tenha-papel-central-na-economia-no-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um dos principais dirigentes do PSDB, Marconi Perillo, encontrou-se com o vice-presidente Geraldo Alckmin e sugeriu que ele desempenhe um papel central na estabilização da economia brasileira.", "titulo_pt": "Tucano reúne-se com Alckmin e defende papel econômico para ele", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285166, "titulo": "Fux e Kassio travam há 80 dias debate sobre delegados em gabinetes do STF", "url": "https://www.metropoles.com/colunas/andreza-matais/fux-e-kassio-travam-ha-80-dias-debate-sobre-delegados-em-gabinetes-do-stf", "fonte_id": "metropoles", "data_pub": "2026-11-24T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes propôs uma medida há 79 dias que ainda não foi analisada pelo STF. Os ministros Luiz Fux e Kassio Nunes não deram andamento à proposta, apesar do apelo do presidente do STF para que votassem.", "titulo_pt": "Fux e Kassio travam há 80 dias debate sobre delegados em gabinetes do STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285079, "titulo": "Frentes parlamentares recebem estudos que revisam cálculo da CBS para menos de 10%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/frentes-parlamentares-recebem-estudos-que-revisam-calculo-da-cbs-para-menos-de-10.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos entregues a frentes parlamentares do Congresso Nacional sugerem que a alíquota da CBS poderia ser reduzida para menos de 10% com ajustes no cálculo feito pelo TCU. O TCU estabeleceu um valor de 11,3% para 2027, que pode ser revisado pelo Senado.", "titulo_pt": "Estudos sugerem redução da alíquota da CBS para menos de 10%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285173, "titulo": "GDF pede reunião com MPF e governos do RJ e AP para tratar sobre o Master", "url": "https://www.metropoles.com/distrito-federal/gdf-pede-reuniao-com-mpf-e-governos-do-rj-e-ap-para-tratar-sobre-o-master", "fonte_id": "metropoles", "data_pub": "2026-11-24T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Governo do Distrito Federal (GDF) solicitou uma reunião com o Ministério Público Federal (MPF) e os governos do Rio de Janeiro e Amapá para discutir a destinação dos valores recuperados durante as investigações. Os governos pretendem apresentar diretamente ao MPF sua posição sobre o assunto.", "titulo_pt": "GDF solicita reunião para tratar sobre destinação de valores recuperados", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285175, "titulo": "Flamengo: Justiça condena dois engenheiros pelo incêndio no Ninho do Urubu", "url": "https://www.metropoles.com/brasil/flamengo-justica-condena-dois-engenheiros-pelo-incendio-no-ninho-do-urubu", "fonte_id": "metropoles", "data_pub": "2026-11-24T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça condenou dois engenheiros no processo do incêndio no Ninho do Urubu, que resultou na morte de 10 adolescentes. A decisão atendeu parcialmente ao MPRJ, que recorreu contra a absolvição dos sete réus.", "titulo_pt": "Flamengo: justiça condena dois engenheiros pelo incêndio no Ninho do Urubu", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285082, "titulo": "Elon Musk pede anulação de sentença por fraude na compra do Twitter", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/elon-musk-pede-anulacao-de-sentenca-por-fraude-na-compra-do-twitter.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Elon Musk pediu a um tribunal federal de apelação dos Estados Unidos que anule uma decisão do júri que concluiu que ele fraudou acionistas do Twitter ao ameaçar desistir da aquisição da rede social quatro anos atrás.", "titulo_pt": "Elon Musk pede anulação de sentença por fraude na compra do Twitter", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285083, "titulo": "Alcolumbre diz que Senado pode votar novo ajuste fiscal neste ano se houver apoio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/alcolumbre-diz-que-senado-pode-votar-novo-ajuste-fiscal-neste-ano-se-houver-apoio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, indicou que há possibilidade de votar uma segunda proposta de ajuste fiscal neste ano, desde que haja apoio dos líderes partidários. Alcolumbre afirmou que, se todos estiverem dispostos a trabalhar pelo país, independentemente do conteúdo do texto, o projeto pode ser votado.", "titulo_pt": "Alcolumbre sugere votação de novo ajuste fiscal no Senado este ano com apoio dos líderes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285379, "titulo": "Fim da improbidade culposa não impede obrigação de ressarcir cofres públicos, diz STF", "url": "https://www.jota.info/stf/do-supremo/fim-da-improbidade-culposa-nao-impede-obrigacao-de-ressarcir-cofres-publicos-diz-stf", "fonte_id": "jota", "data_pub": "2026-11-24T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) confirmou que, mesmo após o fim da improbidade culposa como modalidade jurídica, os réus ainda estão obrigados a ressarcir os cofres públicos. A Corte também manteve os efeitos das condenações definitivas que foram baseadas nessa modalidade, mesmo após ela ter sido declarada inconstitucional.", "titulo_pt": "Fim da improbidade culposa não impede obrigação de ressarcir cofres públicos, decide STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 285112, "titulo": "PT divulga nova 'Carta ao Povo Brasileiro' com prioridades para o Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/pt-divulga-nova-carta-ao-povo-brasileiro-com-prioridades-para-o-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) lançará um documento avaliando a vitória de Luiz Inácio Lula da Silva e estabelecendo prioridades para seu quarto mandato. O documento será divulgado na terça-feira (24).", "titulo_pt": "PT divulga nova 'Carta ao Povo Brasileiro' com prioridades para o Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285247, "titulo": "Banco Central autoriza Binance a operar no mercado de câmbio no Brasil", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/banco-central-autoriza-binance-a-operar-no-mercado-de-cambio-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central do Brasil autorizou a Binance a operar no mercado de câmbio de ativos virtuais no país. A autorização exige que as empresas tenham liberação específica para operar no Brasil.", "titulo_pt": "Banco Central autoriza Binance a operar no mercado de câmbio de ativos virtuais no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 285109, "titulo": "Lula sanciona ajuste fiscal aprovado no Congresso", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-sanciona-ajuste-fiscal-aprovado-no-congresso", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-24T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou a lei que estabelece ajuste fiscal nas contas públicas para 2027. O texto permite ao Executivo limitar despesas para alcançar metas de superávit primário.", "titulo_pt": "Lula sanciona ajuste fiscal aprovado no Congresso", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 285113, "titulo": "PL das big techs é adiado novamente e fica para próxima semana", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/pl-das-big-techs-e-adiado-novamente-e-fica-para-proxima-semana.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T19:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei dos Mercados Digitais, também conhecido como PL das big techs, foi adiado novamente e será votado na próxima terça-feira (1º). O adiamento foi solicitado pelo presidente da Câmara, Hugo Motta.", "titulo_pt": "PL das big techs é adiado novamente e fica para próxima terça-feira", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285116, "titulo": "Moraes rejeita pedido da defesa de Zambelli para descontar de pena da ex-deputada tempo que ela ficou presa na Itália", "url": "https://g1.globo.com/politica/noticia/2026/11/24/moraes-rejeita-pedido-da-defesa-de-zambelli-para-descontar-de-pena-da-ex-deputada-tempo-que-ela-ficou-presa-na-italia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, negou um pedido da defesa de Carla Zambelli para descontar da pena pela invasão aos sistemas do CNJ o tempo em que ela esteve presa na Itália e no Brasil. A decisão foi tomada porque Zambelli está foragida e qualquer desconto só será analisado quando ela iniciar o cumprimento da pena.", "titulo_pt": "Moraes rejeita pedido de Zambelli para descontar pena pelo tempo presa na Itália", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 285114, "titulo": "Roberto Freire quer federação do Cidadania com PSDB e MDB", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/roberto-freire-quer-federacao-do-cidadania-com-psdb-e-mdb.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T19:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Roberto Freire, fundador do Cidadania, busca viabilizar a federação entre MDB e PSDB, com o seu partido também participando.", "titulo_pt": "Roberto Freire quer federação do Cidadania com PSDB e MDB", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285092, "titulo": "Empresa pede para retirar dragagem de canal do porto de Santos de pauta no TCU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/decisao-sobre-dragagem-de-canal-do-porto-de-santos-no-tcu-pode-ser-adiada-novamente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T19:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Etesco Construções e Comércios solicitou ao TCU que retire o julgamento sobre a dragagem do canal do porto de Santos da pauta desta quarta-feira, 25. A empresa busca reexaminar o contrato de dragagem, cuja licitação foi vencida pela Jan de Nul do Brasil Dragagem em setembro do ano passado.", "titulo_pt": "Empresa solicita retirada do julgamento de dragagem do porto de Santos da pauta do TCU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 284775, "titulo": "Realistic sims, tech enhance army drills: Lai", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/25/2003868337", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O treino militar foi aprimorado com a utilização de simulações realistas e tecnologia. Este foi o discurso de Lai.", "titulo_pt": "Simulações realistas e tecnologia melhoram treinamento militar: lai", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 284777, "titulo": "Australia, Solomons aim to sign deal to block China", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/25/2003868339", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália e as Ilhas Salomão buscam assinar um acordo para bloquear a influência chinesa.", "titulo_pt": "Austrália e ilhas salomão buscam assinar acordo para bloquear influência chinesa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 284797, "titulo": "US blacklists Alibaba subsidiary and Megaspeed linked to Nvidia scandal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/25/2003868323", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alibaba subsidiary e a Megaspeed foram incluídas em uma lista negra dos Estados Unidos em conexão com um escândalo envolvendo a Nvidia.", "titulo_pt": "EUA incluem subsidiária da Alibaba e Megaspeed na lista negra relacionada ao escândalo da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 285073, "titulo": "Prédio mais alto da capital da Arábia Saudita é atacado pela 2ª vez em menos de uma semana", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/predio-mais-alto-da-capital-da-arabia-saudita-e-atacado-pela-2a-vez-em-menos-de-uma-semana.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-24T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O edifício mais alto de Riad, capital da Arábia Saudita, foi atingido pela segunda vez em menos de uma semana. A coalizão que combate os houthis do Iêmen afirmou que o ataque foi realizado pelos rebeldes.", "titulo_pt": "Prédio mais alto de riad é atacado pela 2ª vez em menos de uma semana", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 285478, "titulo": "Huawei found guilty of stealing trade secrets but acquitted of racketeering", "url": "https://www.bbc.co.uk/news/articles/cmy49ngydqzpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-24T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Huawei foi condenada por roubo de segredos comerciais, mas absolveu de organização criminosa após um julgamento de meses em Nova York.", "titulo_pt": "Huawei condenada por roubo de segredos comerciais, mas absolve de organização criminosa", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 285165, "titulo": "Ataque cibernético atinge CIA e agência de inteligência dos EUA, diz NYT", "url": "https://www.metropoles.com/mundo/ataque-cibernetico-atinge-cia-e-agencia-de-inteligencia-dos-eua-diz-nyt", "fonte_id": "metropoles", "data_pub": "2026-11-24T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque cibernético afetou o sistema de análise de informações públicas da CIA e de outras agências de inteligência dos Estados Unidos. Autoridades suspeitam que dados de outros órgãos também tenham sido expostos.", "titulo_pt": "Ataque cibernético atinge CIA e agência de inteligência dos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285481, "titulo": "US jury finds Chinese tech giant Huawei guilty of conspiring to steal trade secrets", "url": "https://www.lemonde.fr/en/economy/article/2026/11/24/us-jury-finds-chinese-tech-giant-huawei-guilty-of-conspiring-to-steal-trade-secrets_6787710_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-24T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um júri condenou a Huawei por conspiração para roubar segredos industriais, mas absolveu a empresa de uma acusação mais grave de atividades ilícitas organizadas. A decisão foi tomada após uma julgamento que durou 11 semanas, durante o qual a Huawei negou ter cometido irregularidades.", "titulo_pt": "Júri condena Huawei por roubo de segredos industriais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 285483, "titulo": "Jensen Huang's Nvidia comeback sends AI videos into overdrive", "url": "https://www.france24.com/en/tv-shows/truth-or-fake/20261124-jensen-huang-s-nvidia-comeback-sends-ai-videos-into-overdrive", "fonte_id": "france24", "data_pub": "2026-11-24T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, que recentemente deixou o cargo de CEO da Nvidia, retornou à empresa e gerou uma nova onda de vídeos gerados por inteligência artificial. Enquanto memes anteriores se divertiram com sua saída, agora muitos celebram seu retorno, refletindo uma mudança na percepção pública sobre o CEO da empresa.", "titulo_pt": "Retorno de Huang à Nvidia impulsiona novos vídeos de inteligência artificial", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 285238, "titulo": "Petróleo fecha em alta após relatos de ataques em Ormuz e na Arábia Saudita", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/petroleo-fecha-em-alta-com-aumento-dos-riscos-a-navegacao-em-ormuz-e-tensoes-na-arabia-saudita/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petróleo encerrou a sessão com aumento de mais de 2%, com os preços do WTI e do Brent subindo US$ 1,88 e US$ 2,03 por barril, respectivamente. Essa alta foi motivada por relatos de ataques em Ormuz e na Arábia Saudita.", "titulo_pt": "Petróleo fecha em alta após relatos de ataques em Ormuz e na Arábia Saudita", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 285545, "titulo": "We Do It Together suona la campanella a Wall Street nel segno delle donne", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/24/we-do-it-together-suona-la-campanella-a-wall-street-nel-segno-delle-donne_d2a50767-aff0-40b5-a2aa-275f405a6d31.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-24T21:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A frase de Tilesi indica a necessidade de mudanças para abrir uma nova era favorável às mulheres. O título sugere que um evento simbólico ocorreu em Wall Street relacionado ao movimento feminino.", "titulo_pt": "We Do It Together toca a campainha em Wall Street na era feminina", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 285121, "titulo": "ONU aprova proposta do Brasil de turismo amigável para muçulmanos", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-11/onu-aprova-proposta-do-brasil-de-turismo-amigavel-para-muculmanos", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-11-24T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU Turismo aprovou uma proposta brasileira que visa oferecer serviços turísticos adaptados às necessidades culturais e religiosas de viajantes muçulmanos. A iniciativa foi aprovada por aclamação durante uma sessão em Abu Dhabi e contou com o apoio de países como Indonésia, Irã e Nigéria.", "titulo_pt": "ONU aprova proposta brasileira de turismo amigável para muçulmanos", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 285484, "titulo": "Did Nvidia knowingly send chips to China 'cutout'? Was there ‘pay-to-play’ involving Trump, Lutnick?", "url": "https://www.france24.com/en/tv-shows/spotlight/20261124-did-nvidia-knowingly-send-chips-to-china-cutout-was-there-pay-to-play-involving-trump-lutnick", "fonte_id": "france24", "data_pub": "2026-11-24T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Weissmann, ex-procurador federal e professor de direito da NYU School of Law, analisa as acusações de que o governo Trump tratou a Nvidia de forma favorável, possivelmente em troca de benefícios pessoais, questionando as implicações para a segurança nacional e a imunidade presidencial.", "titulo_pt": "Nvidia: por que o governo Trump a tratou favoravelmente?", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 285146, "titulo": "Israel acusa Irã de desenvolver armas químicas e promete impedir", "url": "https://veja.abril.com.br/mundo/israel-acusa-ira-de-desenvolver-armas-quimicas-e-promete-impedir/", "fonte_id": "veja", "data_pub": "2026-11-24T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Defesa de Israel, Israel Katz, acusa o Irã de estar em processo de desenvolver armas químicas. Teerã nega as acusações.", "titulo_pt": "Israel acusa Irã de desenvolver armas químicas e promete impedir", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285510, "titulo": "Russian jets spark air raid alert in South Korea", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/24/aje-onl-nf_russian-jets-spark-air-raid-alert-in-south-korea-241126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-24T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes da Coreia do Sul foram aconselhados a buscar abrigo devido à aproximação de jatos militares russos em seu espaço aéreo na terça-feira.", "titulo_pt": "Jatos militares russos provocam alerta de ataque aéreo na Coreia do sul", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 285485, "titulo": "Senegal reinstated as AFCON 2025 winners", "url": "https://www.france24.com/en/senegal-reinstated-as-afcon-2025-winners", "fonte_id": "france24", "data_pub": "2026-11-24T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Senegal foi reconduzido como vencedor do Campeonato Africano das Nações de 2025 após o tribunal máximo do esporte confirmar seu recurso contra a perda do título.", "titulo_pt": "Senegal readmitido como vencedor do AFCON 2025", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 285395, "titulo": "‘Saturday Night Live’ Is Coming to France", "url": "https://www.nytimes.com/2026/11/24/arts/television/snl-france.html", "fonte_id": "nyt_world", "data_pub": "2026-11-24T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A versão francesa do 'Saturday Night Live', um instituto da comédia de sketches americanas, estreará no próximo mês no canal premium Canal+. Simultaneamente, uma versão britânica do programa está se destacando.", "titulo_pt": "Saturday Night Live chega à França", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 285076, "titulo": "Venezuela divulga plano econômico e estima dívida em US$ 237,5 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/venezuela-divulga-plano-economico-e-estima-divida-em-us-2375-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo da Venezuela divulgou seu plano macroeconômico, apresentando pela primeira vez em anos um panorama da economia e de sua dívida, estimada em US$ 237,5 bilhões. A medida pode servir de base para uma das maiores reestruturações de dívida já realizadas no mundo.", "titulo_pt": "Venezuela divulga plano econômico e estima dívida em US$ 237,5 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285077, "titulo": "Em crise, BRB leiloa 62 imóveis com lances a partir de R$ 19,9 mil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/em-crise-brb-leiloa-62-imoveis-com-lances-a-partir-de-r-199-mil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco de Brasília (BRB) realizou um leilão extrajudicial de 62 imóveis, com lances iniciais variando de R$ 19,9 mil a R$ 4,39 milhões, marcado para o dia 30 de novembro.", "titulo_pt": "BRB leiloa 62 imóveis com lances a partir de R$ 19,9 mil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285078, "titulo": "Petrobras buscará outras empresas de etanol de milho após compra de fatia na Neomille, diz agência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/petrobras-buscara-outras-empresas-de-etanol-de-milho-apos-compra-de-fatia-na-neomille-diz-agencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras planeja adquirir participações em outras usinas de etanol de milho além da Neomille. A empresa busca expandir sua atuação em renováveis e explorar matérias-primas para produzir combustíveis sustentáveis, como o SAF.", "titulo_pt": "Petrobras buscará outras empresas de etanol de milho após compra de fatia na Neomille", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285550, "titulo": "Brazil’s ‘Lithium Valley’ makes its play for BYD as three states fight over new EV plant", "url": "https://www.scmp.com/news/china/diplomacy/article/3375674/brazils-lithium-valley-makes-its-play-byd-three-states-fight-over-new-ev-plant", "fonte_id": "scmp", "data_pub": "2026-11-24T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fabricante chinesa de veículos elétricos BYD planeja assinar um memorando de entendimento com o estado de Minas Gerais, no Brasil, em janeiro, enquanto São Paulo e Rio de Janeiro também buscam atrair a empresa para construir uma fábrica de ônibus, caminhões e vans elétricos. O vice-presidente da BYD no Brasil, Alexandre Baldy, confirmou que a assinatura será realizada após a posse do governador eleito de Minas Gerais, Cleitinho Azevedo, em 6 de janeiro.", "titulo_pt": "Bacia sul do Brasil disputa fábrica de veículos elétricos da BYD", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285229, "titulo": "Argentina entra em recessão com contração da economia em setembro", "url": "https://www.infomoney.com.br/economia/argentina-entra-em-recessao-com-contracao-da-economia-em-setembro/", "fonte_id": "infomoney", "data_pub": "2026-11-24T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Argentina entrou em recessão técnica com a contração da economia em setembro, marcando o segundo trimestre consecutivo de contração. A confirmação oficial seria em dezembro, com a divulgação do indicador do PIB do terceiro trimestre.", "titulo_pt": "Argentina entra em recessão com contração da economia em setembro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 285498, "titulo": "Dell earnings beat on AI strength, company authorizes $25 billion buyback", "url": "https://www.cnbc.com/2026/11/24/dell-earnings-report-q3-2027.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-24T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas totais da Dell aumentaram mais do que o dobro no terceiro trimestre em comparação com o mesmo período do ano anterior, impulsionadas pela demanda por servidores baseados em IA. A empresa autorizou um retorno de capital no valor de US$ 25 bilhões.", "titulo_pt": "Earnings da dell superam expectativas com força da IA e autorização para compra de ações no valor de us$ 25 bilhões", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 285080, "titulo": "TCU questiona receitas estimadas pelo governo no último ajuste no Orçamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/tcu-questiona-receitas-estimadas-pelo-governo-no-ultimo-ajuste-no-orcamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A área técnica do TCU questiona as receitas estimadas pelo governo no último ajuste do Orçamento. O alerta foi elaborado antes da apresentação do relatório de ajustes, que ocorre nesta terça-feira (24).", "titulo_pt": "TCU questiona receitas estimadas pelo governo no último ajuste do Orçamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285081, "titulo": "Ações da Braskem desabam 14% após acordo com credores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/acoes-da-braskem-desabam-mais-de-13-apos-acordo-com-credores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Braskem caíram 14,08%, cotadas a R$ 2,50, após a empresa anunciar um acordo preliminar com credores sobre a reestruturação de dívidas de aproximadamente US$ 11 bilhões. Na véspera, o papel havia fechado em alta de quase 12%.", "titulo_pt": "Ações da Braskem caem 14% após acordo com credores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285084, "titulo": "Você deveria mudar sua carteira para pagar menos imposto?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/voce-deveria-mudar-sua-carteira-para-pagar-menos-imposto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um investimento isento de Imposto de Renda pode parecer mais vantajoso do que outro tributado, mas não está claro se isso deve levar a mudanças na composição da carteira entre classes de ativos. O artigo sugere que a leitura completa pode fornecer mais detalhes sobre essa questão.", "titulo_pt": "Você deveria mudar sua carteira para pagar menos imposto?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285579, "titulo": "Insurance firms' net dips almost 8 pct through Sept. on fall in investment returns", "url": "https://en.yna.co.kr/view/AEN20261124006200320", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As seguradoras sul-coreanas registraram uma diminuição de quase 8% nos lucros líquidos até setembro, devido à redução nos retornos de investimentos.", "titulo_pt": "Lucros líquidos das seguradoras sul-coreanas caem quase 8% até setembro, devido a baixos retornos de investimentos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 285580, "titulo": "Biz sentiment drops for the first time in 5 months", "url": "https://en.yna.co.kr/view/AEN20261124008200320", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A confiança dos negócios na Coreia do Sul diminuiu pela primeira vez em cinco meses. A informação foi divulgada em 25 de novembro pela Yonhap.", "titulo_pt": "Sentimento empresarial da Coreia do sul cai pela primeira vez em cinco meses", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 285085, "titulo": "China prorroga suspensão de controles sobre exportações de minerais críticos aos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/china-prorroga-suspensao-de-controles-sobre-exportacoes-de-minerais-criticos-aos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China prorrogará a suspensão de restrições à exportação de alguns minerais críticos para os Estados Unidos. Esta medida visa evitar uma escalada na frágil trégua comercial entre os países, após a reunião recente entre Xi Jinping e Donald Trump.", "titulo_pt": "China prorroga suspensão de controles sobre exportações de minerais críticos aos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285086, "titulo": "Sankhya consegue aprovar R$ 93,6 mi junto ao BNDES para ampliar aplicações de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/sankhya-consegue-aprovar-r-936-mi-junto-ao-bndes-para-ampliar-aplicacoes-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sankhya, uma empresa mineira de tecnologia, obteve aprovação de R$ 93,6 milhões do BNDES para desenvolver aplicações de inteligência artificial em sistemas de gestão corporativa. O financiamento será usado para expandir as aplicações de IA oferecidas pela companhia.", "titulo_pt": "Sankhya consegue aprovar R$ 93,6 mi do BNDES para expandir aplicações de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285087, "titulo": "Jensen Huang diz que ainda não acredita em plano de sucessão na Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/jensen-huang-diz-que-ainda-nao-acredita-em-plano-de-sucessao-na-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang defendeu a ausência de um plano de sucessão na Nvidia e o controle centralizado sobre dezenas de executivos, contrariando a pressão por mudanças na cultura da empresa. Huang defendeu a estrutura atual, apesar da pressão por alterações.", "titulo_pt": "Jensen Huang defende estrutura atual na Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285089, "titulo": "Lucro da Xiaomi cai 57% com desaceleração do mercado automotivo chinês", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/lucro-da-xiaomi-cai-57-com-desaceleracao-do-mercado-automotivo-chines.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T19:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Xiaomi, fabricante chinesa de veículos elétricos e smartphones, registrou uma queda de 57% no lucro líquido do terceiro trimestre, influenciada pela desaceleração no mercado automotivo chinês e aumento nos custos dos componentes.", "titulo_pt": "Lucro da Xiaomi cai 57% com desaceleração do mercado automotivo chinês", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285090, "titulo": "Confiança do consumidor nos Estados Unidos atinge nível mais alto em quase dois anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/25/6568-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post468068", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T19:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A confiança do consumidor nos Estados Unidos atingiu seu nível mais alto em quase dois anos em novembro, devido ao otimismo em relação ao mercado de trabalho e à economia após as eleições de meio de mandato deste mês.", "titulo_pt": "Confiança do consumidor nos EUA atinge nível mais alto em quase dois anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 284798, "titulo": "Huang’s Nvidia return sparks relief for battered AI trade, but questions remain", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/25/2003868324", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O retorno de Huang à Nvidia gerou alívio na indústria de inteligência artificial, mas muitas perguntas permanecem. A reinserção de Huang na empresa levou a uma melhora no ânimo dos investidores e participantes do setor, mas ainda há incertezas sobre o futuro da empresa e seu impacto na indústria de AI.", "titulo_pt": "Retorno de huang à Nvidia desperta alívio na trade de AI, mas questionamentos persistem", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 285628, "titulo": "In all-hands meeting, Jensen Huang thanks White House and says he’s in therapy", "url": "https://techcrunch.com/2026/11/24/in-all-hands-meeting-jensen-huang-thanks-white-house-and-says-hes-in-therapy/", "fonte_id": "techcrunch", "data_pub": "2026-11-24T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundador da Nvidia, Jensen Huang, se desculpou com sua equipe durante uma reunião geral e expressou gratidão por uma nova chance de liderar a empresa. Além disso, Huang revelou estar em terapia.", "titulo_pt": "Na reunião geral, Jensen Huang se desculpa com a equipe e diz estar em terapia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 285582, "titulo": "GTA VI PC recompilation project shut down by Take-Two", "url": "https://www.theverge.com/news/1041690/grand-theft-auto-6-pc-recompilation-project-leonida-takedown-take-two", "fonte_id": "the_verge", "data_pub": "2026-11-24T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto de recompilação de Grand Theft Auto VI para PC, liderado por um adolescente chamado NotRexed, foi encerrado pela Take-Two após um aviso de DMCA. O projeto Leonida, que visava traduzir uma versão vazada do jogo para o PC, foi removido.", "titulo_pt": "Projeto de recompilação de GTA VI para PC encerrado pela Take-Two", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 285629, "titulo": "Even the best AI agents struggle with everyday life", "url": "https://techcrunch.com/2026/11/24/even-the-best-ai-agents-struggle-with-everyday-life/", "fonte_id": "techcrunch", "data_pub": "2026-11-24T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo critério revelou que, mesmo os melhores assistentes de inteligência artificial, enfrentam dificuldades para realizar tarefas do dia a dia de forma confiável e segura, o que pode levar a novos problemas.", "titulo_pt": "Mesmo os melhores assistentes de IA lutam com a vida cotidiana", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 285631, "titulo": "Maple raises $5.3M to build AI products that protect your data, even from itself", "url": "https://techcrunch.com/2026/11/24/maple-raises-5-3m-to-build-ai-products-that-protect-your-data-even-from-itself/", "fonte_id": "techcrunch", "data_pub": "2026-11-24T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Maple levantou $5,3 milhões para desenvolver produtos de inteligência artificial que protegem os dados dos usuários, inclusive da própria empresa.", "titulo_pt": "Maple arrecada $5,3 milhões para criar produtos de IA que protegem os dados dos usuários, mesmo da própria empresa", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 285507, "titulo": "Huawei convicted in US trial that exposed corporate espionage and sanctions evasion", "url": "https://www.ft.com/content/6c64b8b8-531c-4eea-8fd0-90c4c4967ab9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-24T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Huawei foi condenada em uma trial nos Estados Unidos que expôs espionagem corporativa e evasão de sanções. O veredito representa uma vitória para os procuradores federais após uma batalha legal de oito anos com a empresa chinesa de telecomunicações.", "titulo_pt": "Huawei condenada em julgamento dos EUA que expôs espionagem corporativa e evasão de sanções", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 285632, "titulo": "Dozens of oil and shipping tankers hacked in recent weeks, per report", "url": "https://techcrunch.com/2026/11/24/dozens-of-oil-and-shipping-tankers-hacked-in-recent-weeks-per-report/", "fonte_id": "techcrunch", "data_pub": "2026-11-24T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de navios-pipa e transportes de químicos foram alvo de ciberataques recentes, de acordo com relatório. Irã é o principal suspeito desses ataques cibernéticos.", "titulo_pt": "Dezenas de navios-pipa e transportes de químicos hackeados em semanas recentes, relata", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 285497, "titulo": "How Meta is using Instagram to get an ad boost from its Muse personal AI agent", "url": "https://www.cnbc.com/2026/11/24/meta-instagram-muse-ad-revenue.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-24T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta não exibe anúncios em seu assistente pessoal Muse, mas o ferramenta já está aumentando o negócio publicitário da empresa, conforme informou um executivo sênior à CNBC.", "titulo_pt": "Como a Meta está usando o Instagram para obter um impulso nos anúncios através do seu assistente pessoal AI Muse", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 285552, "titulo": "Huawei guilty on 10 of 12 counts after months-long battle in US courtroom", "url": "https://www.scmp.com/news/us/article/3375673/huawei-guilty-10-12-counts-after-2-month-battle-us-courtroom", "fonte_id": "scmp", "data_pub": "2026-11-24T20:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Huawei Technologies e três de suas subsidiárias foram condenadas em 10 de 12 acusações em um caso criminal nos Estados Unidos que durou quase sete anos. O julgamento, realizado em Brooklyn, resultou em condenações por fraudes bancária e por linhas telefônicas, conspiração para roubar segredos comerciais e evasão de sanções, mas a empresa foi absolvida de conspiração para obstruir a justiça e de conspiração sob a Lei de Organizações Criminosas Influenciadas por Corrupção.", "titulo_pt": "Huawei culpada em 10 de 12 acusações após longo julgamento nos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285591, "titulo": "What's going on with the Riemann hypothesis?", "url": "https://arstechnica.com/ai/2026/11/whats-going-on-with-the-riemann-hypothesis/", "fonte_id": "ars_technica", "data_pub": "2026-11-24T20:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo proof assistido por IA parece ser sólido, mas não está claro o que ele nos diz sobre a hipótese de Riemann.", "titulo_pt": "O que está acontecendo com a hipótese de Riemann?", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 285583, "titulo": "TikTok was down", "url": "https://www.theverge.com/tech/1041618/tiktok-down-outage", "fonte_id": "the_verge", "data_pub": "2026-11-24T20:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TikTok enfrentou problemas técnicos na terça-feira, com vídeos, resultados de buscas e outras funcionalidades não carregando corretamente. Usuários relataram dificuldades em visualizar vídeos no feed 'Para Você' em iPhones e em buscar conteúdo no aplicativo tanto em iOS quanto em Android, bem como no site.", "titulo_pt": "Tiktok teve problemas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 285505, "titulo": "Huang says he still does not believe in CEO succession planning at Nvidia", "url": "https://www.ft.com/content/cd1831d0-c3f1-4705-b8e2-badfb5e39764?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-24T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia se reuniu com os funcionários durante a primeira reunião corporativa após retornar à empresa. Huang expressou que ainda não acredita na planejamento de sucessão do CEO na empresa.", "titulo_pt": "Huang diz ainda não acreditar em planejamento de sucessão do CEO na Nvidia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 285592, "titulo": "Back-to-back measles deaths is our new reality; US tally now at 14", "url": "https://arstechnica.com/health/2026/11/measles-death-toll-rises-to-14-as-national-case-tally-nears-6000/", "fonte_id": "ars_technica", "data_pub": "2026-11-24T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wisconsin relatou o terceiro óbito por sarampo hoje, enquanto Pennsylvania registrou o seu nono caso ontem. O total de mortes por sarampo nos Estados Unidos chegou a 14.", "titulo_pt": "Dois óbitos por sarampo consecutivos nos EUA elevam o total para 14", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 285600, "titulo": "11 Things Jensen Huang Actually Said at His First All-Hands Back at Nvidia", "url": "https://www.wired.com/story/11-things-jensen-huang-actually-said-at-his-first-all-hands-back-at-nvidia/", "fonte_id": "wired", "data_pub": "2026-11-24T19:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO recém-reinstalado da Nvidia, discutiu suas sessões de terapia diária, sua reputação como um 'tech bro', seu desdém por planejamento sucessório e sua relação com o presidente Trump durante sua primeira reunião geral da empresa.", "titulo_pt": "11 Coisas que Jensen Huang realmente disse na sua primeira reunião geral como ceo da Nvidia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 285602, "titulo": "Mitsubishi Electric Research Lab CEO on How He Reached the C-Suite", "url": "https://spectrum.ieee.org/mitsubishi-electric-research-lab-ceo", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-24T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthony Vetro levou cerca de 30 anos para ascender à presidência e CEO da Mitsubishi Electric Research Laboratories, em Cambridge, Massachusetts. Ele ingressou na empresa em 1996, logo após concluir a faculdade, e desde então tem se dedicado à pesquisa em processamento de sinais multimídia, com foco em compressão de vídeo.", "titulo_pt": "CEO da mitsubishi Electric Research Lab sobre como ele chegou ao C-Suite", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 285588, "titulo": "David Fincher is being dragged for suspected use of AI in his latest film", "url": "https://www.theverge.com/entertainment/1041417/david-fincher-netflix-cliff-booth-ai-interpositive", "fonte_id": "the_verge", "data_pub": "2026-11-24T18:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há dúvidas sobre o uso de inteligência artificial gerativa em 'Once Upon a Time in Hollywood - A Continuação', dirigida por David Fincher, após exibições prematuras do filme que apresentam visuais incoerentes e estranhos. Os fãs estão questionando se a tecnologia foi utilizada na produção.", "titulo_pt": "David Fincher é questionado sobre possível uso de IA em seu novo filme", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 285603, "titulo": "Mindfulness training may bring out the worst in some employees", "url": "https://phys.org/news/2026-11-mindfulness-worst-employees.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que treinamento em mindfulness no ambiente de trabalho pode aumentar a irritação de alguns funcionários e torná-los mais propensos a tratar colegas de trabalho com desrespeito, desafiando a crença popular de que o mindfulness sempre traz benefícios.", "titulo_pt": "Treinamento em mindfulness no trabalho pode intensificar irritação em alguns funcionários", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285665, "titulo": "On this day in space! Nov. 24, 1947: The US Navy launches the 1st Aerobee sounding rocket, but it didn't reach space", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-24-2026", "fonte_id": "space_com", "data_pub": "2026-11-24T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 24 de novembro de 1947, a Marinha dos Estados Unidos lançou o primeiro foguete Aerobee, mas este não atingiu a atmosfera espacial. Este evento marcou um passo importante na pesquisa espacial, mesmo que o objetivo não tenha sido alcançado.", "titulo_pt": "24 De novembro de 1947: a marinha dos EUA lança o primeiro foguete Aerobee, mas ele não atingiu o espaço", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 285604, "titulo": "Researchers reveal inner-core structural evolution of Typhoon Bavi using multisensor satellite observations", "url": "https://phys.org/news/2026-11-reveal-core-evolution-typhoon-bavi.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores utilizaram observações de múltiplos satélites para revelar as transformações estruturais internas do Furacão Bavi, incluindo a substituição do olho do furacão e o expansionamento do campo de ventos. Estas mudanças complexas e rápidas no núcleo do furacão afetam significativamente a intensidade e os riscos costeiros, mas sua captura contínua desde a superfície oceânica até as altas camadas de nuvem permanece um desafio de observação importante.", "titulo_pt": "Pesquisadores revelam evolução estrutural do núcleo interno do furacão Bavi usando observações de múltiplos satélites", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285605, "titulo": "DNA at nuclear edges forms protective UV shield in developing roundworm embryos", "url": "https://phys.org/news/2026-11-dna-nuclear-edges-uv-shield.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dentro do núcleo celular, o DNA está organizado em bairros, alguns dos quais estão apertados e basicamente inativos. Este heterocromatina costuma associar-se à lamina nuclear, uma malha que reveste o interior do envelope nuclear. Este arranjo ajuda a organizar o genoma e regular a atividade genética, mas ainda não se sabe como e quando isso se forma durante o desenvolvimento embrionário.", "titulo_pt": "DNA nas bordas nucleares forma escudo protetor contra a radiação UV em embrionários de vermes redondos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285606, "titulo": "Why disaster risks are systemic and co-evolutionary", "url": "https://phys.org/news/2026-11-disaster-evolutionary.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desastres geralmente não ocorrem isoladamente. Novas pesquisas enfatizam a necessidade de reavaliar como avaliamos riscos de desastres, reconhecendo a interconexão entre perigos naturais, pessoas e locais expostos, e sua vulnerabilidade ao longo do tempo.", "titulo_pt": "Por que os riscos de desastres são sistemáticos e co-evolutivos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285607, "titulo": "The two ways rings are carved around a newborn star", "url": "https://phys.org/news/2026-11-ways-newborn-star.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrofísicos observam anéis de áreas claras e escuras em estrelas jovens, que se assemelham a raios-vinil. A formação de planetas em sistemas solares ainda não tem uma resposta clara, apesar de ser uma questão simples de se formular.", "titulo_pt": "Os dois modos como anéis são carvoados em torno de uma estrela recém-nascida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285635, "titulo": "NASA+ Content Coming to Big Screen at Greenbelt, Maryland Cinema", "url": "https://www.nasa.gov/nasa/nasa-content-coming-to-big-screen-at-greenbelt-maryland-cinema/", "fonte_id": "nasa_news", "data_pub": "2026-11-24T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA anunciou que o conteúdo da NASA+ será exibido no cinema The Greenbelt em Greenbelt, Maryland, expandindo assim a presença da agência em plataformas de visualização e aproximando o espaço ainda mais das casas dos espectadores. A lei que fundou a NASA em 1958 estabelece que a agência deve compartilhar sua história de exploração espacial com o público mais amplo possível.", "titulo_pt": "Conteúdo da NASA+ vai ao Cinema em Greenbelt, Maryland", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 285608, "titulo": "A common language for pistachio growth: Researchers develop a crop-monitoring scale", "url": "https://phys.org/news/2026-11-common-language-pistachio-growth-crop.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade de Córdoba desenvolveu o pistachio BBCH scale, um escala que padroniza a monitoração fenológico da cultura, permitindo que pesquisadores e agricultores identifiquem rapidamente o estágio de crescimento da planta.", "titulo_pt": "Língua comum para o crescimento de pistache: pesquisadores desenvolvem escala para monitoramento da cultura", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285609, "titulo": "Flexible simulations model how dark matter collisions may leave their fingerprints on the universe", "url": "https://phys.org/news/2026-11-flexible-simulations-dark-collisions-fingerprints.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simulações flexíveis ajudam a modelar como colisões de matéria escura podem deixar marcas no universo. A matéria escura não pode ser vista ou medida diretamente, mas é considerada responsável por aproximadamente 85% da matéria no universo, incluindo a matéria que compõe tudo na Terra, desde vermes e montanhas até água do mar e lavadoras.", "titulo_pt": "Simulações flexíveis mostram como colisões de matéria escura podem deixar rastros no universo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285242, "titulo": "Astrônomos identificam um quasar recordista no universo primitivo; ele é um dos objetos que mais liberam energia e luz", "url": "https://www.cnnbrasil.com.br/ciencia/astronomos-identificam-um-quasar-recordista-no-universo-primitivo-ele-e-um-dos-objetos-que-mais-liberam-energia-e-luz/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos identificaram um quasar no universo primitivo com um buraco negro de grande massa, formado 630 milhões de anos após o Big Bang. Este quasar é um dos objetos que mais liberam energia e luz.", "titulo_pt": "Astrônomos identificam um quasar recordista no universo primitivo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 285636, "titulo": "Teams Lock in Mission Architecture for NASA’s SR-1 Freedom", "url": "https://www.nasa.gov/general/nasa-locks-in-sr1-freedom-mission-architecture/", "fonte_id": "nasa_news", "data_pub": "2026-11-24T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA concluiu uma revisão importante para o Space Reactor-1 (SR-1) Freedom e definiu elementos-chave da espaçonave, que está programada para lançamento em 2028 e demonstrará propulsão elétrica nuclear espacial pela primeira vez. Especialistas da agência espacial, do Departamento de Energia dos EUA e da indústria se reuniram no Glenn Research Center para avançar no projeto.", "titulo_pt": "Equipes definem estrutura da missão para o SR-1 liberdade da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 285610, "titulo": "Evolution keeps returning to simple leaves", "url": "https://phys.org/news/2026-11-evolution-simple.html", "fonte_id": "phys_org", "data_pub": "2026-11-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado por pesquisadores da Universidade de Oxford explicou por que a maioria das plantas possui folhas de forma simples. O estudo, publicado em 24 de novembro, descreveu como a evolução tem repetidamente produzido folhas complexas, apenas para a evolução voltar a produzir formas mais simples.", "titulo_pt": "A evolução retorna às folhas simples", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 285666, "titulo": "'Blade Runner 2099' executive producers talk architectural easter eggs and franchise continuity for Prime Video's new sci-fi series (interview)", "url": "https://www.space.com/entertainment/blade-runner-2099-executive-producers-talk-architectural-easter-eggs-and-franchise-continuity-for-prime-videos-new-sci-fi-series-interview", "fonte_id": "space_com", "data_pub": "2026-11-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos produtoros da série 'Blade Runner 2099', exibida no Prime Video, discutiram os elementos arquitetônicos ocultos e a continuidade da franquia. Eles mencionaram que, em 2026, o mundo está se aproximando mais rapidamente do universo de 'Blade Runner'.", "titulo_pt": "Produtoras de 'blade Runner 2099' falam sobre elementos arquitetônicos e continuidade da franquia", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 285072, "titulo": "Superlua pode ser observada nesta terça-feira (24); veja fotos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/superlua-pode-ser-observada-nesta-terca-feira-24.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-24T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (24), uma superlua pode ser observada. Este fenômeno ocorre quando a Lua está na fase cheia e a pelo menos 90% do seu perigeu.", "titulo_pt": "Superlua pode ser observada nesta terça-feira; veja fotos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 285581, "titulo": "N. Korea's Yongbyon nuclear complex expansion may be aimed at boosting weapons-grade uranium production: ISIS", "url": "https://en.yna.co.kr/view/AEN20261125000300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T20:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão mais recente do complexo nuclear de Yongbyon na Coreia do Norte pode estar destinada a aumentar a produção de urânio para armas, de acordo com a ISIS. A informação foi divulgada em Washington no dia 24 de novembro.", "titulo_pt": "Expansão do complexo nuclear de Yongbyon da Coreia do norte pode aumentar produção de urânio para armas, diz ISIS", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 285627, "titulo": "STAT+: RFK Jr. spills his calendar into public, but leaves much to the imagination", "url": "https://www.statnews.com/2026/11/24/rfk-jr-calendar-hhs-records-rollout/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um calendário parcialmente censurado mostrando as atividades do secretário de Saúde Robert F. Kennedy Jr. foi divulgado na terça-feira.", "titulo_pt": "RFK Jr. Divulga calendário parcialmente censurado com suas atividades", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 285673, "titulo": "Movie Theaters in 2026: Filmmakers and Exhibitors on What’s Good, What’s Bad, and What’s Changing", "url": "https://www.indiewire.com/features/interviews/movie-theaters-2026-good-bad-changing-1235230816/", "fonte_id": "indiewire", "data_pub": "2026-11-24T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entrevistas com Kevin Smith, Alamo Drafthouse, Laemmle Theatres e outros sobre o ano passado e os grandes planos para o futuro, incluindo o novo complexo Cinerama Dome em Hollywood.", "titulo_pt": "Cinemas em 2026: filmes e exibidores avaliam o passado e planejam o futuro", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 285097, "titulo": "'Quem Ama Cuida': Ademir descobre que é pai de Brigitte", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/11/quem-ama-cuida-ademir-descobre-que-e-pai-de-brigitte.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-24T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ademir descobrirá que é o pai biológico de Brigitte, informação que será revelada por Pedro. A revelação envolve Pilar, que teria escondido a verdade por anos e esteve envolvida em um atentado contra o namorado de Adriana.", "titulo_pt": "Quem Ama Cuida: ademir descobre que é pai de Brigitte", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 285645, "titulo": "Thelma Golden To Step Down From Role as Director of Studio Museum in Harlem", "url": "https://www.artnews.com/art-news/artists/thelma-golden-to-step-down-director-studio-museum-in-harlem-1234807621/", "fonte_id": "artnews", "data_pub": "2026-11-24T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Thelma Golden anunciou que deixará de exercer o cargo de diretora do Studio Museum in Harlem. Este anúncio marca o 20º aniversário de sua nomeação para o cargo, em 2006, e ocorre apenas um ano após a reabertura do museu em sua nova edificação, após sete anos de encerramento.", "titulo_pt": "Thelma Golden deverá deixar cargo de diretora do Studio Museum in Harlem", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 285551, "titulo": "As China and Italy try to boost birth rates, their histories offer lessons", "url": "https://www.scmp.com/opinion/china-opinion/article/3374924/china-and-italy-try-boost-birth-rates-their-histories-offer-lessons", "fonte_id": "scmp", "data_pub": "2026-11-24T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde tempos antigos, governos têm tentado estimular o nascimento de filhos enquanto protegem as crianças já nascidas. A comparação entre Roma e China ilustra como ambas as civilizações enfrentaram o desafio de incentivar as famílias a terem mais filhos e auxiliá-los no crescimento, como na época de César, quando a quantidade de filhos era usada como critério para a distribuição de terras públicas aos cidadãos romanos.", "titulo_pt": "Comparação entre roma e China oferece lições sobre políticas de natalidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285674, "titulo": "Mike Plante, Sundance Film Festival Shorts Programmer, Dies at 56", "url": "https://www.indiewire.com/news/obituary/mike-plante-sundance-shorts-programmer-dead-at-56-1235230914/", "fonte_id": "indiewire", "data_pub": "2026-11-24T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Plante, um programador de curtas-metragens no Sundance Film Festival com 25 anos de experiência, faleceu aos 56 anos. Além de sua carreira no festival, Plante era também um diretor de cinema.", "titulo_pt": "Mike Plante, programador de curtas-metragens do Sundance Film Festival, faleceu aos 56 anos", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 285144, "titulo": "David Fincher elogia James Gunn e chama DNA da DC de “disfuncional por natureza”", "url": "https://veja.abril.com.br/cultura/david-fincher-elogia-james-gunn-e-chama-dna-da-dc-de-disfuncional-por-natureza/", "fonte_id": "veja", "data_pub": "2026-11-24T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Fincher elogiou James Gunn e afirmou que não teria coragem para liderar o universo cinematográfico da DC Comics, considerando-o 'disfuncional por natureza'.", "titulo_pt": "David Fincher elogia James Gunn e chama DNA da DC de ‘disfuncional por natureza’", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285646, "titulo": "Military History Museum in Dresden Agrees to Return Contested Nazi-Era Family Archive to Jehovah’s Witnesses", "url": "https://www.artnews.com/art-news/news/jehovahs-witnesses-military-history-museum-dresden-family-archive-nazi-era-1234807616/", "fonte_id": "artnews", "data_pub": "2026-11-24T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Museu Histórico Militar de Dresde concordou em devolver um arquivo contestado de uma família de Testemunhas de Jeová que sofreu perseguição durante a Segunda Guerra Mundial. Annemarie Kusserow era uma das 11 crianças dessa família.", "titulo_pt": "Museu histórico militar de dresde acorda em devolver arquivo contestado de família de testemunhas de jeová", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 285647, "titulo": "Bukhara Biennial Unveils ‘The Long Welcome’ Theme and Names First Artists", "url": "https://www.artnews.com/art-news/news/bukhara-biennial-theme-
