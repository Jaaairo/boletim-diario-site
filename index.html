<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "24/10/2026 07:22", "stats": {"noticias_novas": 707, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Flávio Bolsonaro visitou Belo Horizonte e Rio de Janeiro antes da eleição, enquanto Lula fechou sua campanha no Rio de Janeiro e São Paulo. O debate entre Lula e Flávio Bolsonaro na TV Globo foi tenso, com Flávio usando a expressão 'nove dedos' para atacar Lula, que reagiu chamando o senador de 'miliciano'. Lula reagiu após ser chamado de 'nove dedos', exigindo uma retratação. O debate abordou temas como dívidas dos brasileiros, salário mínimo e sistema de saúde (SUS), além de trocas de acusações. A Quaest divulgou uma pesquisa que ouviu 3.702 pessoas, apontando Lula como favorito. Os temas de saúde, ensino de matemática, crise climática e população em situação de rua receberam pouco destaque nas propostas dos candidatos. A Bolsa brasileira registrou uma elevação de 15,3% desde a confirmação das candidaturas de Lula e Flávio Bolsonaro, enquanto o dólar caiu cerca de 2% no mesmo período, mas os investidores mostram cautela à medida que se aproximam do segundo turno das eleições presidenciais.", "mundo": "A França está se preparando para novos protestos, com a mobilização de cerca de 70.000 policiais e seguranças, após os disturbios nacionais no fim de semana passado. O movimento, que começou com algumas escolas de ensino médio, expandiu-se para incluir sindicatos de trabalhadores e outros ativistas. Na Ucrânia, a conexão com os sistemas de comunicação Starlink e Starshield foi recuperada após interrupções recentes que geraram tensões com os Estados Unidos. Em Minas Gerais, Rio de Janeiro e São Paulo, Lula e Flávio Bolsonaro realizaram os últimos atos de campanha antes do segundo turno das eleições, que ocorrerá no próximo domingo. Na Argentina, Cristina Kirchner enfrenta um novo julgamento por suposto lavagem de dinheiro relacionada à corrupção, enquanto no Peru, o governo de Fujimori enfrenta desafios com o episódio excepcional de El Niño, que desafiou as medidas de emergência implementadas.\n\nO líder norte-coreano Kim Jong-un realizou uma viagem internacional significativa, atravessando o novo Bridge do Rio Yalu para a China, sua primeira viagem conhecida em mais de um ano. Este evento político importante ocorreu em Dandong, China, e foi confirmado por fontes governamentais. Em Israel, as forças militares iniciaram uma operação significativa no Território Ocidental após soldados serem mortos por assaltantes armados, com a segurança sendo um tema crucial nas eleições israelenses. A situação humanitária em Taiz, no Yemen, é crítica, com hospitais enfrentando a possibilidade de colapso devido ao cerco dos hutis. O presidente ucraniano Volodymyr Zelensky apela à China para usar sua influência sobre a Rússia para ajudar a pôr fim à guerra na Ucrânia, enquanto Israel e os países da região pressionam por uma solução de dois estados para a questão palestina.", "economia": "O Ibovespa teve uma alta de 6,9% e o dólar registrou uma queda de 4,4% durante o período entre o primeiro e o segundo turno das eleições, refletindo as expectativas dos investidores sobre os resultados. O dólar encerrou a semana abaixo de R$ 5, com uma recuperação de 1,58%, influenciado pela alta do petróleo e pelas expectativas das eleições. A confiança da indústria no Brasil subiu em outubro, mas ainda indica um pessimismo geral. Internamente, a Moody's manteve a nota de risco do Chile, projetando um crescimento real do PIB de 2,7% em 2027 e 3,3% em 2028. Além disso, o Banco Central do Brasil anunciou medidas para proteger os consumidores contra abusos nas ofertas de crédito, visando evitar o superendividamento.", "tecnologia": "A tecnologia enfrenta diversos desafios e avanços neste momento. A Just Eat se retratou após imagens de comida geradas por inteligência artificial (IA) se tornarem virais, exagerando os itens do menu. O governo dos EUA considera a atual geração de líderes de IA uma preocupação política, pedindo que os fundadores se concentrem apenas no desenvolvimento seguro de seus produtos, evitando debates sobre sentiência digital e catástrofes globais. A OpenAI retomou o treinamento de IA com segurança reforçada e sem acesso à internet, citando 'risques significativos'. O governo japonês planeja simular ataques cibernéticos em resposta a falhas críticas na linguagem de programação PHP. A SpaceX está expandindo sua presença em conectividade direta com dispositivos através do constelante de satélites Starlink, buscando uma posição significativa em infraestrutura móvel terrestre além da cobertura orbital. A Bosch planeja estabelecer a Bosch Mobility como uma subsidiária integralmente controlada e legalmente independente em 2027, separando a divisão que gera aproximadamente 60% das receitas do grupo. A AIDC inaugurou um sistema microgerador de 9MW/54MWh de armazenamento de energia no seu local de Shuinan em Taichung, Taiwan, descrito pela empresa como o maior sistema de armazenamento de energia industrial localizado no país.", "ciencia": "A NASA está avançando rapidamente com seus planos de construir uma base na lua e levar astronautas de volta à superfície lunar em até dois anos, conforme relatado em [exame]. Paralelamente, a missão MMX do Japão deve chegar à região de Marte em 2027 e retornar à Terra em 2031 com amostras do satélite de Marte Fobos, buscando informações sobre a origem dos satélites do planeta vermelho, conforme informado em [exame]. Em outro desenvolvimento científico, a OMS começou a testar uma vacina contra a ebola no Congo, onde ocorre o pior surto da doença na história do país, conforme relatado em [metropoles]. Estudos recentes também abordam a evolução rápida de espécies e a importância do habitat na distribuição de espécies na Finlândia, além de pesquisas sobre a remoção de PFAS da água e a detecção de fotões através de fluxos magnéticos gerados em supercondutores, conforme detalhados em [phys_org].", "cultura": "O evento mais importante dos artigos é a aprovação da novela das nove por Rosane Svartman, prevista para estrear na Globo em meados de 2028. Este anúncio marca um novo capítulo na carreira da escritora, que já conquistou o horário nobre com suas produções. O sumário também destaca a publicação de 'Estrela Distante', de Roberto Bolaño, que completa 30 anos desde sua publicação, e a discussão sobre a obra de Flaubert e a inteligência artificial, que questiona a pressa na criação literária. Além disso, a novela 'Invasão Zumbi', de Yeon Sang-ho, é analisada como um exemplo do gênero atual, enquanto o single 'Swim', do BTS, atinge a marca de 1 bilhão de streams no Spotify, marcando um novo recorde para o grupo sul-coreano. Ainda, a novidade da nova versão do site Dezeen e a discussão sobre o 'menú del día' na Espanha, que continua sendo uma parte importante da rotina alimentar apesar do declínio de sua popularidade, completam o panorama cultural apresentado.", "sociedade": "O debate sobre a crise de falta de oxigênio em Manaus voltou a ser um tema de discussão durante o último debate presidencial entre Luiz Inácio Lula da Silva e Jair Bolsonaro. No outro destaque, o Enem 2026 contou com mais de cinco milhões de inscritos, sendo que 64% são mulheres, reforçando a importância do exame no sistema educacional. Em Cuba, medidas sociais foram anunciadas para grupos vulneráveis, incluindo ferramentas de trabalho e auxílio financeiro, em meio à crise econômica e crescente desigualdade. No Brasil, as autoridades enfrentam desafios, como a ameaça de um adolescente planejando ataques a escolas na zona leste, além da crescente disputa entre jovens casais sobre a guarda de animais de estimação.", "meio_ambiente": "O Canadá enfrenta mudanças climáticas significativas, com a produção de soja no país, próxima ao Ártico, aumentando devido ao aquecimento global. Embora isso traga benefícios econômicos, reflete a ampliação do impacto do aquecimento atmosférico na agricultura mundial. Paralelamente, o El Niño continua causando eventos climáticos extremos, como as intensas chuvas na região de Vaca Muerta, no Neuquén, levando a relocações e danos estruturais. O Super Niño, previsto para atingir seu pico em dezembro, continua a gerar preocupações sobre as condições climáticas futuras. Além disso, a COP17 em Yerevan se concentra na mineração e proteção ambiental, enquanto o Japão reforça sua infraestrutura energética para enfrentar futuras emergências climáticas. Esses eventos ilustram o impacto crescente do clima extremo na segurança alimentar, na saúde humana e na economia global, reforçando a necessidade de ações imediatas e sustentáveis para mitigar os efeitos das mudanças climáticas.", "direitos_humanos": "O Tribunal Interamericano de Direitos Humanos pode ampliar a proteção legal da democracia, conforme um parecer solicitado pela Guatemala, o que pode afetar o Poder Judiciário brasileiro. Em outro desenvolvimento, a população de El Fasher, na região de Darfur, diminuiu para apenas 7% do número registrado no ano anterior, de acordo com a Amnesty International, devido a mortes, torturas e desaparecimentos cometidos pelas Forças de Suporte Rápidas, apoiadas pelos Emirados Árabes Unidos. Na Argentina, a Equipe Argentina de Antropologia Forense identificou os restos mortais de oito desaparecidos durante a ditadura militar, permitindo a recuperação de fragmentos ósseos de vítimas não identificadas."}, "resumo_do_dia": {"politica_nacional": [{"id": 222609, "titulo": "Flávio visita BH e Rio antes da eleição; Lula encerra atos no Rio e em SP", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-visita-bh-e-rio-antes-da-eleicao-lula-encerra-atos-no-rio-e-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T08:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro visita Belo Horizonte e Rio de Janeiro antes da eleição. Lula encerra seus atos públicos no Rio de Janeiro e São Paulo.", "titulo_pt": "Flávio visita BH e Rio antes da eleição; Lula encerra atos no Rio e em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222582, "titulo": "Janones dorme no chão após quase cinco horas de live em apoio a Lula", "url": "https://www.metropoles.com/brasil/janones-dorme-no-chao-apos-quase-cinco-horas-de-live-em-apoio-a-lula", "fonte_id": "metropoles", "data_pub": "2026-10-24T08:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma live de aproximadamente 24 horas em apoio a Lula está em andamento e ainda conta com cerca de 300 mil espectadores durante a madrugada. O apresentador Adnet está comandando a transmissão.", "titulo_pt": "Janones dorme no chão em live de apoio a Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222610, "titulo": "Analistas: Flávio chega à urna com direita unida e Lula, sem ampliar frente", "url": "https://www.cnnbrasil.com.br/eleicoes/analistas-flavio-chega-a-urna-com-direita-unida-e-lula-sem-ampliar-frente/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro está chegando às urnas com o apoio da direita unida, enquanto Lula não conseguiu ampliar sua frente eleitoral com apoios heterogêneos como ocorreu em 2022.", "titulo_pt": "Analistas: flávio chega à urna com direita unida e Lula, sem ampliar frente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222807, "titulo": "As reformas constitucionais em um sistema decisório travado", "url": "https://www.jota.info/opiniao-e-analise/artigos/as-reformas-constitucionais-em-um-sistema-decisorio-travado", "fonte_id": "jota", "data_pub": "2026-10-24T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Excesso de normas e um Congresso fortalecido impedem o ajuste fiscal e as reformas necessárias para o país.", "titulo_pt": "Reformas constitucionais em um sistema decisório travado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 222438, "titulo": "Eleição 2026: maiores doadores de Flávio Bolsonaro e Lula são do agro; veja propostas e desafios para o setor", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/flavio-lula-agronegocio.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T08:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A prestação de contas das campanhas presidenciais no TSE indica que os maiores doadores individuais de Lula e Flávio Bolsonaro são do setor agronegócio. A legislação eleitoral proíbe doações de empresas, permitindo apenas contribuições de pessoas físicas dentro dos limites legais.", "titulo_pt": "Eleição 2026: maiores doadores de Lula e Flávio Bolsonaro são do agro; veja propostas e desafios para o setor", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 222439, "titulo": "MAPA: No 2º turno, Lula e Flávio Bolsonaro priorizam maiores colégios eleitorais e visitam mais de uma cidade por dia", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/mapa-no-2o-turno-lula-e-flavio-bolsonaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T08:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva (PT) e Flávio Bolsonaro (PL) estão priorizando os maiores colégios eleitorais no "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 222586, "titulo": "Flávio Bolsonaro perde o debate e a dignidade, se é que já teve alguma", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/flavio-bolsonaro-perde-o-debate-e-a-dignidade-se-e-que-ja-teve-alguma", "fonte_id": "metropoles", "data_pub": "2026-10-24T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro apresentou-se mal no debate e perdeu a dignidade, segundo a reportagem. O candidato enfrenta críticas por gafes na televisão e por esquecer passeios de lancha.", "titulo_pt": "Flávio Bolsonaro perde o debate e a dignidade, se é que já teve alguma", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222594, "titulo": "DF não teve alteração em locais de votação. Veja como consultar sua seção", "url": "https://www.metropoles.com/distrito-federal/df-nao-teve-alteracao-em-locais-de-votacao-veja-como-consultar-sua-secao", "fonte_id": "metropoles", "data_pub": "2026-10-24T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores do Distrito Federal votarão nos mesmos locais onde votaram no primeiro turno. É possível consultar a seção eleitoral pela internet ou pelo e-Título.", "titulo_pt": "DF manterá locais de votação iguais ao primeiro turno. Consulta disponível online", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222595, "titulo": "Quaest divulga última pesquisa presidencial neste sábado (24/10)", "url": "https://www.metropoles.com/brasil/quaest-divulga-ultima-pesquisa-presidencial-neste-sabado-24-10", "fonte_id": "metropoles", "data_pub": "2026-10-24T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Quaest divulgou uma pesquisa presidencial que ouviu 3.702 entrevistados com 16 anos ou mais. A margem de erro da pesquisa é de 2 pontos percentuais.", "titulo_pt": "Quaest divulga última pesquisa presidencial neste sábado (24/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222619, "titulo": "Relembre as principais decisões do TSE sobre as campanhas de Flávio e Lula", "url": "https://www.cnnbrasil.com.br/eleicoes/relembre-as-principais-decisoes-do-tse-sobre-as-campanhas-de-flavio-e-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T07:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) foi chamado a julgar diversos casos relacionados às campanhas de Flávio e Lula, incluindo uma multa rejeitada por uso de vídeo com inteligência artificial e uma ordem para a Meta tratar candidatos de forma igual.", "titulo_pt": "Relembre as principais decisões do TSE sobre as campanhas de Flávio e Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222440, "titulo": "Lula busca virada no 2º turno contra Flávio Bolsonaro e tenta reverter tendência de alternância de poder nas Américas", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/lula-busca-virada-no-2o-turno-contra-flavio-bolsonaro-e-tenta-reverter-tendencia-de-alternancia-de-poder-nas-americas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva está buscando uma virada contra Flávio Bolsonaro no segundo turno das eleições deste ano. A tentativa é reverter a tendência de alternância de poder no continente americano, que se tornou mais comum após a derrota de Jair Bolsonaro em 2022.", "titulo_pt": "Lula busca virada no 2º turno contra Flávio Bolsonaro e tenta reverter tendência de alternância de poder nas Américas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 222441, "titulo": "SUS, ensino de matemática, crise climática e população em situação de rua: veja temas que ficaram à margem das campanhas", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/sus-ensino-de-matematica-crise-climatica-e-populacao-em-situacao-de-rua-veja-temas-que-ficaram-a-margem-das-campanhas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante a campanha presidencial de 2026, os temas de saúde (SUS), ensino de matemática, crise climática e população em situação de rua receberam pouco destaque nas propostas de Flávio Bolsonaro (PL) e Luiz Inácio Lula da Silva (PT). No entanto, esses assuntos foram discutidos no debate presidencial realizado pela TV Globo.", "titulo_pt": "SUS, ensino de matemática, crise climática e população em situação de rua: veja temas que ficaram à margem das campanhas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 222442, "titulo": "Roblox, fandoms e bloquinho: como a geração Z entrou na disputa entre Flávio e Lula", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/roblox-fandoms-e-bloquinho-como-a-geracao-z-entrou-na-disputa-entre-flavio-e-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A disputa presidencial entre Luiz Inácio Lula da Silva e Flávio Bolsonaro envolveu jovens da geração Z, que criaram novas formas de engajamento, como mobilizações em universidades e carreatas no Roblox. Essas iniciativas foram adotadas por apoiadores de ambos os candidatos.", "titulo_pt": "Roblox, fandoms e bloquinhos: como a geração Z entrou na disputa entre Lula e Flávio", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 222443, "titulo": "Presidente do TSE fará pronunciamento em rede nacional na véspera do 2º turno e orientará eleitor a conferir local de votação", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/presidente-do-tse-fara-pronunciamento-em-rede-nacional-na-vespera-do-2o-turno-e-orientara-eleitor-a-conferir-local-de-votacao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal Superior Eleitoral, Kassio Nunes Marques, fará um pronunciamento em rede nacional no sábado (24) para orientar os eleitores a verificar o local de votação. A verificação pode ser realizada através do aplicativo e-Título ou pelo menu Autoatendimento Eleitoral no portal do TSE.", "titulo_pt": "Presidente do TSE fará pronunciamento sobre verificação do local de votação no sábado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 222851, "titulo": "Live Updates: France Deploys Vast Security Force in Effort to Prevent More Riots", "url": "https://www.nytimes.com/live/2026/10/24/world/france-protests-riots", "fonte_id": "nyt_world", "data_pub": "2026-10-24T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França mobilizou cerca de 70.000 policiais e agentes de segurança em preparação para grandes protestos, com o objetivo de evitar incêndios e roubos que ocorreram no país no fim de semana anterior.", "titulo_pt": "Atualizações em tempo real: França desloca força de segurança vasta para prevenir maiores Riots", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 223074, "titulo": "(4th LD) N. Korea's Kim arrives in China's Dandong via newly opened bridge", "url": "https://en.yna.co.kr/view/AEN20261024001955320", "fonte_id": "yonhap_news", "data_pub": "2026-10-24T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder norte-coreano Kim Jong-un chegou à China pela cidade de Dandong, via um novo puente aberto recentemente. Este foi o primeiro relatório sobre a chegada dele.", "titulo_pt": "Kim jong-un chega à China via novo puente", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 222944, "titulo": "Ukraine says Starlink and Starshield connection 'stable' again", "url": "https://www.france24.com/en/europe/20261024-ukraine-says-starlink-and-starshield-connection-stable-again", "fonte_id": "france24", "data_pub": "2026-10-24T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia recuperou uma conexão 'estável' com os sistemas de comunicações Starlink e Starshield, conforme informou o ministro de Defesa de Kiev. Recentemente, interrupções na conexão geraram tensões com Washington sobre o sistema de rede crucial para as operações do exército ucraniano, que foi desenvolvido pela SpaceX.", "titulo_pt": "Ucrânia diz que conexão com Starlink e Starshield está 'estável' novamente", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 222860, "titulo": "How a Small Student Protest Spread Across France", "url": "https://www.nytimes.com/2026/10/24/world/europe/france-protests-timeline.html", "fonte_id": "nyt_world", "data_pub": "2026-10-24T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O movimento que começou com algumas escolas de ensino médio expandiu-se para incluir sindicatos de trabalhadores e outros ativistas.", "titulo_pt": "Como uma pequena protesto estudantil espalhou-se pela França", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 222927, "titulo": "Woman, 65, becomes second patient to die of Ebola in Kenya", "url": "https://www.bbc.co.uk/news/articles/c6x2355448eyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-24T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 65 anos, parente próxima da primeira vítima, morreu da ebola na Quênia, sendo a segunda pessoa a falecer da doença no país.", "titulo_pt": "Mulher de 65 anos se torna segunda vítima fatal de Ebola em quênia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 222928, "titulo": "Seven missing after multi-storey building collapses in Kenya's capital", "url": "https://www.bbc.co.uk/news/articles/c317kxyknwp2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-24T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete pessoas estão desaparecidas após o colapso de um prédio multi-pavimento em Nairobi, a capital do Quênia. As equipes de resgate estão empenhadas em localizar pessoas presas sob as ruínas, que ainda estavam em construção no momento do acidente.", "titulo_pt": "Sete desaparecidos após colapso de prédio em nairobi, quênia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 223011, "titulo": "Eurostat, disuguaglianza redditi in Italia ai minimi da 2014 ma resta oltre media Ue", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/24/eurostat-disuguaglianza-redditi-in-italia-ai-minimi-da-2014-ma-resta-oltre-media-ue_d213c88a-0ad3-4491-8bae-051b01e8e139.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-24T09:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A desigualdade de renda na Itália atingiu o nível mais baixo desde 2014, ficando abaixo da média da União Europeia. Para os menores de 18 anos, a desigualdade de renda foi ainda menor, com um índice de 29,3%, abaixo da média da UE de 28,6%.", "titulo_pt": "Desigualdade de renda na Itália atinge nível mínimo desde 2014, mas permanece acima da média da união europeia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 222891, "titulo": "Kim Jong-un crosses over newly opened bridge into China", "url": "https://www.theguardian.com/world/2026/oct/24/kim-jong-un-crosses-newly-opened-bridge-into-china", "fonte_id": "guardian_world", "data_pub": "2026-10-24T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Jong-un viajou de trem através do novo Bridge do Rio Yalu para a China, marcando sua primeira viagem internacional conhecida em mais de um ano. Ele chegou à cidade fronteiriça chinesa de Dandong após percorrer o Bridge do Rio Yalu de Pyongyang para Sinuiju.", "titulo_pt": "Kim Jong-un viaja para a China através do novo bridge do rio yalu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 222921, "titulo": "France prepares for day of protest a week after nationwide riots", "url": "https://www.bbc.co.uk/news/articles/cj62yv5k0w4yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-24T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas devem participar de uma jornada de protesto na França, uma semana após os disturbios nacionais. Mais de 70 mil policiais serão mobilizados para garantir a segurança.", "titulo_pt": "França prepara-se para dia de protesto após semana de distúrbios", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 222784, "titulo": "Los memes, la inteligencia artificial y los ‘jingles’ triunfan en la intensa campaña electoral que Brasil libra en redes sociales", "url": "https://elpais.com/america/2026-10-24/los-memes-la-inteligencia-artificial-y-los-jingles-triunfan-en-la-intensa-campana-electoral-que-brasil-libra-en-redes-sociales.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os seguidores de Lula e Flávio Bolsonaro usam memes, inteligência artificial e jingles em uma intensa campanha eleitoral nas redes sociais. A disputa digital é marcada por esses recursos visuais e sonoros para ganhar visibilidade.", "titulo_pt": "Memes, inteligência artificial e jingles dominam a intensa campanha eleitoral nas redes sociais do Brasil", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 222785, "titulo": "EL PAÍS se vuelca en Brasil en unas elecciones determinantes para América Latina", "url": "https://elpais.com/america/2026-10-24/el-pais-se-vuelca-en-brasil-en-unas-elecciones-determinantes-para-america-latina.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O jornal El País intensifica sua cobertura em todo o continente americano para relatar a segunda volta das eleições entre Lula e Flávio Bolsonaro. A cobertura abrange de Rio de Janeiro a Washington.", "titulo_pt": "EL PAÍS amplia cobertura no Brasil para relatar segunda volta entre lula e flávio bolsonaro", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 222786, "titulo": "Vila Militar, el barrio de Río de Janeiro donde la trama golpista no existió", "url": "https://elpais.com/america/2026-10-24/vila-militar-el-barrio-de-rio-de-janeiro-donde-la-trama-golpista-no-existio.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os quartéis que elegeram Jair Bolsonaro estão silenciosos há quatro anos, mas os bairros próximos votaram mais em seu filho. Uma vitória do ultradireitista reconfiguraria esse espaço.", "titulo_pt": "Vila Militar, o bairro de rio de Janeiro onde a trama golpista não existiu", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 222789, "titulo": "Una madre maltratadora contra su hija candidata: la bajeza de un anuncio electoral pone patas arriba las ‘midterms’", "url": "https://elpais.com/us/2026-10-24/una-madre-maltratadora-contra-su-hija-candidata-la-bajeza-de-un-anuncio-electoral-pone-patas-arriba-las-midterms.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um vídeo de campanha republicano em Ohio mostra uma suposta mãe abusiva competindo contra uma candidata demócrata, provocando escândalo nas eleições intermediárias nos Estados Unidos.", "titulo_pt": "Madre abusiva contra candidata: propaganda eleitoral baixa os níveis nas eleições intermediárias", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 222790, "titulo": "Tatuajes nazis, abusos, incesto y un ‘Oh, cállate’: la batalla por el decisivo Estado de Maine baja al fango", "url": "https://elpais.com/us/2026-10-24/tatuajes-nazis-abusos-incesto-y-un-oh-callate-la-batalla-por-el-decisivo-estado-de-maine-baja-al-fango.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Troy Jackson, um candidato menos carismático, substituiu uma estrela emergente da esquerda que foi acusado por várias mulheres. A vencedora dessa campanha, cheia de exabruptos, pode ser a veterana Susan Collins... ou Donald Trump.", "titulo_pt": "Tatuagens nazistas, abusos, incesto e ‘Oh, cállate’: a batalha pelo decisivo Estado de Maine desce ao fango", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 222791, "titulo": "Robert Reich: “Teníamos que pasar por esta pesadilla para preservar la democracia de Estados Unidos”", "url": "https://elpais.com/us/2026-10-24/robert-reich-teniamos-que-pasar-por-esta-pesadilla-para-preservar-la-democracia-de-estados-unidos.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Robert Reich vê nas eleições de meios mandatos a chance para os democratas começarem a recompensar a classe trabalhadora. Reich, ex-secretário de Trabalho durante o governo de Bill Clinton, acredita que essa é uma oportunidade para os democratas honrarem seu compromisso com os trabalhadores.", "titulo_pt": "Robert Reich: ‘tínhamos que passar por esta pesadilla para preservar a democracia dos Estados Unidos’", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 222794, "titulo": "Cristina Kirchner afronta un nuevo juicio en Argentina por presunto lavado de dinero de la corrupción", "url": "https://elpais.com/argentina/2026-10-24/cristina-kirchner-afronta-un-nuevo-juicio-en-argentina-por-presunto-lavado-de-dinero-de-la-corrupcion.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cristina Kirchner enfrenta um novo julgamento na Argentina ": "Membros do MP criticam falhas da CVM e atribuem fraudes em fundos à falta de fiscalização", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/membros-do-mp-criticam-falhas-da-cvm-e-atribuem-fraudes-em-fundos-a-falta-de-fiscalizacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Integrantes do Ministério Público criticam as falhas de fiscalização da CVM como a principal causa das fraudes em fundos de investimento no Brasil. Eles atribuem essas fraudes à falta de rigor na fiscalização, mais do que a existência de regras inadequadas no mercado.", "titulo_pt": "Integrantes do MP criticam falhas de fiscalização da CVM e atribuem fraudes em fundos à falta de rigor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222808, "titulo": "Na eleição, o risco para a economia não é o ambientalismo", "url": "https://www.jota.info/opiniao-e-analise/artigos/na-eleicao-o-risco-para-a-economia-nao-e-o-ambientalismo", "fonte_id": "jota", "data_pub": "2026-10-24T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Regulamentos que mudam constantemente a cada governo geram litígios e não oferecem segurança jurídica para as empresas.", "titulo_pt": "Na eleição, o risco para a economia não é o ambientalismo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 222809, "titulo": "A proibição da Resolve Juizado pelo TRF2", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-proibicao-da-resolve-juizado-pelo-trf2", "fonte_id": "jota", "data_pub": "2026-10-24T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso envolve a capacidade postulatória nos Juizados Especiais e os limites da reserva profissional da advocacia, sendo julgado pelo TRF2.", "titulo_pt": "Proibição da postulação nos juizados especiais e os limites da advocacia", "veiculo": "JOTA", "p onquista trabalhista desde a Constituição de 1988; entenda os motivos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222496, "titulo": "Temendo demissões provocadas pela IA, parlamentares dos EUA buscam formas de ajudar trabalhadores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/temendo-demissoes-provocadas-pela-ia-parlamentares-dos-eua-buscam-formas-de-ajudar-trabalhadores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares dos EUA estão buscando formas de ajudar trabalhadores diante do medo de demissões causadas pela inteligência artificial. A rápida evolução da IA tem levantado preocupações sobre a substituição de empregos humanos.", "titulo_pt": "Parlamentares dos EUA buscam auxiliar trabalhadores temerosos de demissões pela IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222498, "titulo": "Alta do petróleo pressiona governo a manter subsídio ao diesel", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/alta-do-petroleo-pressiona-governo-a-manter-subsidio-ao-diesel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alta recente do preço do petróleo, em virtude dos combates na Arábia Saudita, pressiona o governo a manter o subsídio de R$ 2,12 por litro ao diesel, que vence na segunda-feira (26).", "titulo_pt": "Aumento do petróleo pressiona governo a manter subsídio ao diesel", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 223082, "titulo": "Investor deposits at brokerages plunge on stock market volatility", "url": "https://en.yna.co.kr/view/AEN20261024001800320", "fonte_id": "yonhap_news", "data_pub": "2026-10-24T04:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depositos de investidores em corretoras sul-coreanas diminuíram devido à volatilidade do mercado de ações. Os investidores reduziram suas posições em corretoras devido à instabilidade do mercado.", "titulo_pt": "Depósitos de investidores em corretoras caem devido à volatilidade do mercado de ações", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 222501, "titulo": "Meta adia mudança de termos comerciais após críticas de entidades de mídia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/meta-adia-mudanca-de-termos-comerciais-apos-criticas-de-entidades-de-midia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T02:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta adiou a mudança nos termos comerciais para o dia 20 de novembro, após críticas de entidades que representam jornais e outros veículos de mídia sobre o rastreamento e a coleta de conteúdo de sites de notícias.", "titulo_pt": "Meta adia mudança nos termos comerciais após críticas de entidades de mídia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222503, "titulo": "Fundo de investimentos consegue barrar oferta pública de ações da Oncoclínicas na Justiça", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/fundo-de-investimentos-consegue-barrar-oferta-publica-de-acoes-da-oncoclinicas-na-justica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T02:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundo Josephina 3, gerenciado pela Centaurus, conseguiu impedir uma decisão da CVM que obrigava a realização de uma OPA da Oncoclínicas em 60 dias. O prazo para a OPA, que terminaria neste sábado (24), foi prorrogado graças à ação judicial.", "titulo_pt": "Fundo de investimentos impede oferta pública de ações da Oncoclínicas na Justiça", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222505, "titulo": "Às vésperas do 2º turno, 60% esperam melhora na economia do país, aponta Datafolha", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/as-vesperas-do-2o-turno-60-esperam-melhora-na-economia-do-pais-aponta-datafolha.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha realizada às vésperas do segundo turno das eleições aponta que 60% dos brasileiros esperam uma melhora na economia do país, enquanto 19% esperam que a situação permaneça estável e 12% acreditam que piorará. A margem de erro é de dois pontos percentuais.", "titulo_pt": "Às vésperas do segundo turno, 60% esperam melhora na economia do país, segundo Datafolha", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222508, "titulo": "Split payment da reforma tributária deve ter baixo impacto no caixa, dizem economistas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/split-payment-da-reforma-tributaria-deve-ter-baixo-impacto-no-caixa-dizem-economistas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas afirmam que o split payment, previsto na reforma tributária, terá pouco impacto no caixa das empresas brasileiras e pode contribuir para a redução da alíquota dos novos impostos.", "titulo_pt": "Split payment da reforma tributária deve ter baixo impacto no caixa, dizem economistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 223083, "titulo": "Wage talks between POSCO, unionized workers break down", "url": "https://en.yna.co.kr/view/AEN20261024001200320", "fonte_id": "yonhap_news", "data_pub": "2026-10-24T01:46:00Z", "idiom -pereza-se-satisfacen-con-la-inteligencia-artificial/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pascal Chabot, filósofo belga, destaca que os perigos contemporâneos estão relacionados à perda do sentido comum e à crescente imersão em realidades muito pessoais, em sua participação no Puerto de Ideas Valparaíso. Ele critica o narcisismo e a preguiça como fatores que se satisfazem com a inteligência artificial.", "titulo_pt": "Pascal Chabot, filósofo: ‘o narcisismo e a preguiça se satisfazem com a inteligência artificial’", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223105, "titulo": "Inside the Supermassive Debate Over the James Webb Telescope’s ‘Little Red Dots’", "url": "https://www.wired.com/story/inside-the-supermassive-debate-over-the-james-webb-telescopes-little-red-dots/", "fonte_id": "wired", "data_pub": "2026-10-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A telescope James Webb observa pequenos pontos vermelhos em toda parte. Os astrônomos não conseguem concordar sobre o que são esses pontos, mas alguns acreditam que eles possam ser estrelas gigantes com buracos negros no interior.", "titulo_pt": "Dentro da supermassiva Debate sobre os ‘pequenos pontos vermelhos’ do telescópio James Webb", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 222670, "titulo": "O erro que impede empresas de extrair valor real da inteligência artificial", "url": "https://www.infomoney.com.br/business/global/o-erro-que-impede-empresas-de-extrair-valor-real-da-inteligencia-artificial/", "fonte_id": "infomoney", "data_pub": "2026-10-24T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da INSEAD e Harvard indica que os lucros significativos surgem quando a inteligência artificial transforma fluxos de trabalho inteiramente, e não apenas tarefas isoladas. O erro que impede as empresas de extrair o valor real da IA é não aplicá-la de forma abrangente.", "titulo_pt": "O erro que impede empresas de extrair o verdadeiro valor da inteligência artificial", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 222499, "titulo": "Startup levanta US$ 200 mi para criar cães 'geneticamente aprimorados' para uso militar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/startup-levanta-us-200-mi-para-criar-caes-geneticamente-aprimorados-para-uso-militar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma startup sediada no Texas captou US$ 200 milhões de investidores, incluindo a Sequoia Capital e a Ark Invest, para criar cães 'geneticamente aprimorados' para uso militar.", "titulo_pt": "Startup levanta US$ 200 mi para criar cães 'geneticamente aprimorados' para uso militar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 223027, "titulo": "U.S. has for years asked Musk to alter Starlink service in Ukraine and Middle East, sources say", "url": "https://www.japantimes.co.jp/news/2026/10/24/world/starlink-access-alterations/", "fonte_id": "japan_times", "data_pub": "2026-10-24T06:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos, durante os mandatos de Biden e Trump, solicitou várias vezes à SpaceX que alterasse o serviço Starlink em diversos países, incluindo Ucrânia e Oriente Médio.", "titulo_pt": "EUA pediam há anos que Musk alterasse serviço Starlink na Ucrânia e oriente médio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 222649, "titulo": "39% das PMEs que usam IA dizem que ela ajuda a suprir falta de habilidades", "url": "https://exame.com/inteligencia-artificial/139-das-pmes-que-usam-ia-dizem-que-ela-ajuda-a-suprir-falta-de-habilidades/", "fonte_id": "exame", "data_pub": "2026-10-24T06:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento da OCDE indica que 39% das pequenas e médias empresas que utilizam inteligência artificial afirmam que ela auxilia na supressão da falta de habilidades. No entanto, a tecnologia não elimina a necessidade de profissionais qualificados.", "titulo_pt": "39% Das PMEs que usam IA dizem que ela ajuda a suprir falta de habilidades", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 222654, "titulo": "IA aumentou em 26% as tarefas concluídas por desenvolvedores, diz estudo", "url": "https://exame.com/inteligencia-artificial/ia-aumentou-em-26-as-tarefas-concluidas-por-desenvolvedores-diz-estudo/", "fonte_id": "exame", "data_pub": "2026-10-24T05:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que a inteligência artificial aumentou em 26% as tarefas concluídas por desenvolvedores. Experimentos em três empresas mostraram ganhos de produtividade com o uso de assistentes de programação.", "titulo_pt": "IA aumentou em 26% as tarefas concluídas por desenvolvedores, diz estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 222953, "titulo": "What a day in customer service looks like — as AI changes everything", "url": "https://www.cnbc.com/2026/10/24/ai-customer-service-jobs-work.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-24T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O trabalho de atendimento ao cliente pode ser extremamente difícil. A pergunta é se a inteligência artificial vai tornar o trabalho mais fácil ou apenas adicionar mais complicações.", "titulo_pt": "O que um dia de atendimento ao cliente parece ser — com a AI mudando tudo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 223033, "titulo": "Sagawa Express says 53 million sets of personal info possibly compromised", "url": "https://www.japantimes.co.jp/business/2026/10/24/sagawa-express-unauthorized-access/", "fonte_id": "japan_times", "data_pub": "2026-10-24T04:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de transportes Sagawa Express anunciou em 30 de setembro que 53 milhões de conjuntos de informações pessoais podem ter sido comprometidos devido a um acesso não autorizado em seu serviço de rastreamento de entregas.", "titulo_pt": "Sagawa Express afirma que 53 milhões de conjuntos de informações pessoais podem ter sido comprometidos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 222974, "titulo": "Pegasus spyware founder urges governments to trust his tech and ditch US AI", "url": "https://www.ft.com/content/f9592534-1a3d-409d-9a57-f05919440032?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shalev Hulio, ex-diretor da NSO Group, busca se redefinir como um defensor da inteligência artificial soberana e da segurança nacional.", "titulo_pt": "Fundador do pegasus sequestra governo para sua tecnologia e desafia a dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 223066, "titulo": "Crypto platform on alert lists opens Hong Kong office, prompting calls for scrutiny", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3371978/crypto-platform-alert-lists-opens-hong-kong-office-prompting-calls-scrutiny", "fonte_id": "scmp", "data_pub": "2026-10-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma plataforma de troca de criptomoedas que está na lista de alerta de reguladores de Hong Kong e Canadá abriu uma filial na cidade, levando especialistas a pedirem uma maior fiscalização da forma como essas empresas se promovem sem prejudicar o ambiente de negócios aberto. Incluir uma empresa na lista de alerta dos reguladores não significa necessariamente que ela tenha cometido ilegalidades, mas os especialistas recomendaram que as autoridades aumentem o acompanhamento das estratégias de marketing dessas empresas.", "titulo_pt": "Plataforma de criptomoedas na lista de alerta abre escritório em Hong Kong, gerando pedidos de vigilância", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 222506, "titulo": "'O Outro Lado das Redes' ressalta dependência de vazamentos para conhecer big techs", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/10/o-outro-lado-das-redes-ressalta-dependencia-de-vazamentos-para-conhecer-big-techs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'O Outro Lado das Redes' destaca a importância dos vazamentos para a revelação das práticas das grandes tecnológicas. O filme apresenta um jornalista e sua fonte, Frances Haugen, substituindo Mark Zuckerberg como protagonista em relação ao Facebook.", "titulo_pt": "O Outro Lado das Redes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 223114, "titulo": "Nvidia rejects near-term memory glut fears, leaves CXMT cooperation open", "url": "https://www.digitimes.com/news/a20261023PD243/nvidia-cxmt-demand-technology-market.html", "fonte_id": "digitimes", "data_pub": "2026-10-24T01:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, afirmou que a empresa não espera que a oferta de memória ultrapasse a demanda nos próximos anos e que continua disposta a colaborar com a ChangXin Memory Technologies (CXMT) da China. Essas declarações foram feitas durante a conferência GTC Berlin e vieram em meio a preocupações crescentes sobre uma eventual sobrasupply de memória devido a novos desenvolvimentos chineses e a baixas na avaliação do mercado para fabricantes de memória.", "titulo_pt": "Nvidia nega temores de excesso de suprimento de memória e mantém portas abertas para parceria com CXMT", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 223115, "titulo": "SpaceX's 80,000-site push turns Starlink from satellite overlay into full mobile challenger", "url": "https://www.digitimes.com/news/a20261023VL221/spacex-starlink-mobile-infrastructure.html", "fonte_id": "digitimes", "data_pub": "2026-10-24T01:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX está expandindo sua presença em conectividade direta com dispositivos através do constelante de satélites Starlink. A empresa agora busca uma posição significativa em infraestrutura móvel terrestre além da cobertura orbital.", "titulo_pt": "Empurra spacex com 80.000 pontos para tornar Starlink uma ameaça completa para a infraestrutura móvel terrestre", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 223048, "titulo": "China study suggests animal sacrifice may have been part of ancient Sanxingdui rituals", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3372019/china-study-suggests-animal-sacrifice-may-have-been-part-ancient-sanxingdui-rituals", "fonte_id": "scmp", "data_pub": "2026-10-24T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado no Journal of Archaeological Science sugere que a prática de sacrifício animal pode ter sido parte das cerimônias antiga do povo Sanxingdui. Isso foi concluído com base em evidências que indicam a existência de um local de sacrifício.", "titulo_pt": "Estudo chinês sugere que sacrifício animal fazia parte das cerimônias antiga do Sanxingdui", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 223106, "titulo": "Typhoon Champi knocks out power to thousands in Taiwan", "url": "https://phys.org/news/2026-10-typhoon-champi-power-thousands-taiwan.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Typhoon Champi deixou milhares de lares sem energia em Taiwan após fortes ventos danificarem a ilha. A tempestade se dirige para a China e Japão, com equipes de emergência trabalhando para restaurar o fornecimento de energia.", "titulo_pt": "Typhoon Champi interrompe energia para milhares em Taiwan", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222599, "titulo": "Parece uma banana gigante, mas seu fruto é intragável: a “planta milagrosa” que passa anos debaixo da terra e pode salvar milhões da fome", "url": "https://www.cnnbrasil.com.br/curiosidades/parece-uma-banana-gigante-mas-seu-fruto-e-intragavel-a-planta-milagrosa-que-passa-anos-debaixo-da-terra-e-pode-salvar-milhoes-da-fome/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A planta conhecida como 'planta milagrosa' é uma fonte importante de alimento para mais de 20 milhões de pessoas na África Oriental, mas é considerada menos importante em comparação com o trigo, o milho e o arroz.", "titulo_pt": "Parece uma banana gigante, mas seu fruto é intragável: a ‘planta milagrosa’ que passa anos debaixo da terra e pode salvar milhões da fome", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 223107, "titulo": "NASA adopting Apollo's urgency to build a moon base and land astronauts within 2 years", "url": "https://phys.org/news/2026-10-nasa-apollo-urgency-moon-base.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está avançando rapidamente com seus planos de construir uma base na lua e levar astronautas de volta à superfície lunar em até dois anos.", "titulo_pt": "NASA adotando a urgência de Apollo para construir uma base na lua e levar astronautas de volta à superfície em até dois anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222580, "titulo": "OMS anuncia testes clínicos da vacina contra o ebola no Congo", "url": "https://www.metropoles.com/mundo/oms-anuncia-testes-clinicos-da-vacina-contra-o-ebola-no-congo", "fonte_id": "metropoles", "data_pub": "2026-10-24T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) anunciou testes clínicos para uma vacina contra a ebola no Congo, onde ocorre o pior surto da doença na história do país. A OMS expressou esperança com a ciência em face desta situação.", "titulo_pt": "OMS anuncia testes clínicos de vacina contra ebola no Congo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222524, "titulo": "Aves brasileiras fazem tanto barulho quanto britadeira ou motosserra", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/aves-brasileiras-fazem-tanto-barulho-quanto-britadeira-ou-motosserra.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-24T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma área da serra do Mar, a araponga, uma ave pequena, emite um canto tão alto quanto o barulho de uma britadeira ou de uma motosserra. Este som ensurdecedor serve para atrair fêmeas.", "titulo_pt": "Arapongas fazem tanto barulho quanto britadeira ou motosserra", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 222653, "titulo": "Estudo revela como comunidades sobreviveram a uma erupção no Japão há 7.300 anos", "url": "https://exame.com/ciencia/estudo-revela-como-comunidades-sobreviveram-a-uma-erupcao-no-japao-ha-7-300-anos/", "fonte_id": "exame", "data_pub": "2026-10-24T05:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo examinou como comunidades pré-históricas se adaptaram após uma erupção vulcânica no Japão há 7.300 anos, mostrando que as populações migraram, desenvolveram novas estratégias de sobrevivência e se ajustaram às novas condições.", "titulo_pt": "Estudo revela como populações pré-históricas se adaptaram após erupção vulcânica no Japão há 7.300 anos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 222656, "titulo": "O que o Japão quer descobrir ao trazer amostras de uma lua de Marte à Terra", "url": "https://exame.com/ciencia/o-que-o-japao-quer-descobrir-ao-trazer-amostras-de-uma-lua-de-marte-a-terra/", "fonte_id": "exame", "data_pub": "2026-10-24T04:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão MMX do Japão deve chegar à região de Marte em 2027 e retornar à Terra em 2031 com amostras do satélite de Marte Fobos, que podem fornecer informações sobre a origem dos satélites do planeta vermelho.", "titulo_pt": "O que o Japão quer descobrir ao trazer amostras de um satélite de Marte à Terra", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 223119, "titulo": "APOD: 2026 October 24 – Rosetta’s Selfie", "url": "https://science.nasa.gov/image-article/apod-2026-october-24-rosettas-selfie/", "fonte_id": "nasa_news", "data_pub": "2026-10-24T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 24 de outubro de 2026 mostra a sonda Rosetta tirando uma selfie. A imagem foi publicada com uma breve explicação escrita por um astrônomo profissional.", "titulo_pt": "Selfie da Rosetta", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 223108, "titulo": "Surveying the genetic battlefield to uncover the rules of rapid evolution", "url": "https://phys.org/news/2026-10-surveying-genetic-battlefield-uncover-rapid.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O laboratório do Dr. Harmit Malik e sua equipe no Centro Fred Hutchinson de Cancerologia se dedica à pesquisa sobre a evolução rápida, que envolve mudanças genéticas que ocorrem em espécies em apenas algumas gerações. Essas mudanças frequentemente são impulsionadas por conflitos genéticos, que são competições entre diferentes entidades buscando seu próprio sucesso ao custo de outra.", "titulo_pt": "Pesquisando o campo genético para descobrir as regras da evolução rápida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223109, "titulo": "Child-led citizen science helps Ecuadorian community tackle beach pollution and shape environmental decisions", "url": "https://phys.org/news/2026-10-child-citizen-science-ecuadorian-community.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A poluição marinha devido ao lixo humano atingiu níveis críticos, com os maços de cigarro sendo os poluentes mais persistentes e prejudiciais. Anualmente, cerca de 4,5 trilhões de maços de cigarro são descartados globalmente, tornando-os o tipo mais comum de lixo nas praias há três décadas.", "titulo_pt": "Ciência cidadã liderada por crianças ajuda a comunidade ecuatoriana a combater a poluição das praias e moldar decisões ambientais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223110, "titulo": "Habitat explains Finnish animal distributions better than climate, study finds", "url": "https://phys.org/news/2026-10-habitat-finnish-animal-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Universidade de Helsinque analisaram os fatores que determinam a distribuição de espécies em Finlandia, descobrindo que as variáveis relacionadas ao habitat explicam melhor a ocorrência e a abundância das espécies do que o clima. O entendimento disso é crucial para desenvolver soluções para a perda de biodiversidade.", "titulo_pt": "Habitat explica melhor as distribuições de animais na finlândia do que o clima, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223111, "titulo": "Power cuts and sleep: Students link load shedding to anxiety, disrupted rest and lower grades", "url": "https://phys.org/news/2026-10-power-students-link-anxiety-disrupted.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2023, a África do Sul enfrentou o ano mais crítico de corte programado de energia (cortes de energia planejados pela empresa de energia pública Eskom) na história do país. O fornecimento de energia foi interrompido em 335 dos 365 dias do ano, com várias interrupções diárias. Desde então, o país não experimentou cortes programados de energia há mais de um ano e meio.", "titulo_pt": "Cortes de energia e sono: estudantes ligam os apagões à ansiedade, interrupção do descanso e notas mais baixas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223131, "titulo": "SpaceX launches Starlink satellites from California as Falcon 9 cadence slows (photos)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-falcon-9-starlink-group-15-15-b1063-ocisly", "fonte_id": "space_com", "data_pub": "2026-10-23T23:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou 27 satélites Starlink para a órbita hoje (23 de outubro), em sua primeira missão de Starlink em 11 dias.", "titulo_pt": "Spacex lança satélites Starlink da califórnia enquanto a cadência do Falcon 9 diminui (imagens)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 223112, "titulo": "Glowing plants reveal immune responses around infection sites via two colors", "url": "https://phys.org/news/2026-10-reveal-immune-responses-infection-sites.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores do MRC Laboratory of Medical Sciences desenvolveram uma nova técnica que torna os relatores biológicos mais precisos, permitindo que os cientistas acompanhem a atividade genética em plantas vivas ao longo de dias, semanas e até meses. Este método pode auxiliar na compreensão das respostas das plantas a doenças, pragas e estresses ambientais.", "titulo_pt": "Plantas brilhantes revelam respostas imunológicas em locais de infecção por duas cores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223132, "titulo": "NASA lays out plan for Artemis 3 moon-lander test flight —but when will it launch?", "url": "https://www.space.com/space-exploration/artemis/nasa-lays-out-plan-for-artemis-3-moon-lander-test-flight-but-when-will-it-launch", "fonte_id": "space_com", "data_pub": "2026-10-23T22:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA detalhou o plano para o voo de teste do módulo lunar Artemis III, que está programado para decolar para a órbita terrestre no próximo ano. No entanto, ainda não foi anunciada uma data de lançamento definitiva.", "titulo_pt": "NASA apresenta plano para voo de teste do módulo lunar Artemis iii - mas quando será o lançamento?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 223127, "titulo": "This Is Class War", "url": "https://hyperallergic.com/this-is-class-war/", "fonte_id": "hyperallergic", "data_pub": "2026-10-24T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda recentes protestos estudantis na França, o problema da inteligência artificial na arte, uma entrevista com Rosana Paulino e um bate-papo com pintora sobre cerveja com Melissa Brown.", "titulo_pt": "Esta é guerra de classes", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 223128, "titulo": "Cloud House by Peter Morris brings \"fairytale flamboyance\" to London", "url": "https://www.dezeen.com/2026/10/24/cloud-house-peter-morris/", "fonte_id": "dezeen", "data_pub": "2026-10-24T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A casa Cloud projetada pelo arquiteto Peter Morris, localizada em Gospel Oak, Londres, apresenta paredes rosa marshmallow, arcos amplos e detalhes turquesa, inspirados em um passeio por Miami. A residência, que combina dois imóveis, exibe um es
