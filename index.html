, "titulo_pt": "Feriado de thanksgiving pode ser interrompido por inundações, ventos e chuvas", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "destaque": {"titulo_evento": "Retorno de Jensen Huang à Nvidia", "texto_pt": "O retorno de Jensen Huang como CEO da Nvidia é um evento multifacetado que impactou significativamente diversos setores, incluindo a economia, política e tecnologia. A ação da Nvidia subiu em torno de 1 trilhão de dólares após a reinserção de Huang, levando ações de empresas associadas a subirem também, como a SK hynix, negociada nos EUA, que ganhou 20% nas negociações da manhã. O mercado reagiu positivamente, com os índices da Nasdaq avançando após a decisão. No entanto, o caso levanta questões sobre a intervenção política nos negócios, com Trump sendo acusado de ter pressionado a empresa para readmitir Huang. A decisão também gerou críticas no Congresso dos EUA, especialmente entre os democratas, que buscam investigar os riscos de segurança nacional associados a Huang. Internamente, a Nvidia enfrenta a reação de funcionários, com alguns questionando a mudança de cultura proposta. O caso também se tornou um ponto de discussão na tecnologia, com líderes do setor comemorando o retorno de Huang, que foi demitido por supostas relações ímprobas e supostas ameaças a funcionários. A situação reflete a complexidade da interseção entre o mundo corporativo e a política, e as implicações para a segurança nacional e a governança corporativa.", "data_edicao": "2026-11-24", "artigos": [{"id": 283694, "titulo": "Trump faces backlash after saying he 'convinced' Nvidia to reinstate CEO Jensen Huang", "url": "https://www.bbc.co.uk/news/articles/cq5y1k8ez407o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-24T09:42:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Trump enfrentou críticas após afirmar que convenceu a Nvidia a readmitir o CEO Jensen Huang. Huang havia sido pressionado por Trump a reassumir seu cargo, o que ajudou a aumentar em 1 trilhão de dólares o valor da ação da empresa.", "titulo_pt": "Trump enfrenta contragolpe após dizer que convenceu a Nvidia a readmitir o CEO Jensen Huang", "texto_pt": "Trump enfrentou críticas após afirmar que convenceu a Nvidia a readmitir o CEO Jensen Huang. Huang havia sido pressionado por Trump a reassumir seu cargo, o que ajudou a aumentar em 1 trilhão de dólares o valor da ação da empresa.", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 283812, "titulo": "Tech stocks surge on Jensen Huang’s return", "url": "https://www.ft.com/content/c0cb932a-076e-4471-8009-91749fde5f47?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-24T09:00:00Z", "topico": "economia", "idioma": "en", "texto_resumo": "Ações tecnológicas se elevaram após a reabilitação de Jensen Huang, CEO da Nvidia. Mercados asiáticos seguiram os ganhos dos Estados Unidos.", "titulo_pt": "Ações tecnológicas surgem com retorno de Jensen Huang", "texto_pt": "Ações tecnológicas se elevaram após a reabilitação de Jensen Huang, CEO da Nvidia. Mercados asiáticos seguiram os ganhos dos Estados Unidos.", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 283745, "titulo": "Six key questions raised by Jensen Huang's return to Nvidia", "url": "https://www.cnbc.com/2026/11/24/nvidia-jensen-huang-politics-market.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-24T07:12:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "Jensen Huang retornou à Nvidia, levantando dúvidas sobre a reversão da diretoria, a envolvimento de Trump e o futuro da gigante da tecnologia.", "titulo_pt": "Seis perguntas-chave sobre o retorno de Jensen Huang à Nvidia", "texto_pt": "Jensen Huang retornou à Nvidia, levantando dúvidas sobre a reversão da diretoria, a envolvimento de Trump e o futuro da gigante da tecnologia.", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 283920, "titulo": "Inside Nvidia, Not Everyone Is Celebrating Jensen Huang’s Return", "url": "https://www.wired.com/story/inside-nvidia-not-everyone-is-celebrating-jensen-huangs-return/", "fonte_id": "wired", "data_pub": "2026-11-24T01:35:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "Algumas pessoas esperavam que a saída de Huang fosse uma oportunidade para mudar a cultura na empresa. Um funcionário disse que, se Huang retornar, ele nunca mais fará treinamentos de recursos humanos.", "titulo_pt": "Dentro da Nvidia, não todos celebrou o retorno de Jensen Huang", "texto_pt": "Algumas pessoas esperavam que a saída de Huang fosse uma oportunidade para mudar a cultura na empresa. Um funcionário disse que, se Huang retornar, ele nunca mais fará treinamentos de recursos humanos.", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282274, "titulo": "Huang reinstated as Nvidia CEO", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/24/2003868271", "fonte_id": "taipei_times", "data_pub": "2026-11-24T00:00:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "Huang foi readmitido como CEO da Nvidia. Não há informações adicionais sobre as razões ou detalhes específicos desta reinstalação.", "titulo_pt": "Huang readmitido como CEO da Nvidia", "texto_pt": "Huang foi readmitido como CEO da Nvidia. Não há informações adicionais sobre as razões ou detalhes específicos desta reinstalação.", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 283633, "titulo": "Why Trump saved Jensen Huang", "url": "https://www.vox.com/the-logoff-newsletter-trump/511773/trump-jensen-huang-nvidia-board-why", "fonte_id": "vox", "data_pub": "2026-11-23T22:00:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Donald Trump interveio pessoalmente para manter a indústria de inteligência artificial em funcionamento. Jensen Huang, o recentemente demitido CEO da Nvidia, retornou ao cargo.", "titulo_pt": "Por que Trump salvou Jensen Huang", "texto_pt": "Donald Trump interveio pessoalmente para manter a indústria de inteligência artificial em funcionamento. Jensen Huang, o recentemente demitido CEO da Nvidia, retornou ao cargo.", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 283162, "titulo": "(2nd LD) SK hynix's U.S.-traded shares surge 20 pct after Huang's reinstatement as Nvidia CEO", "url": "https://en.yna.co.kr/view/AEN20261124000252315", "fonte_id": "yonhap_news", "data_pub": "2026-11-23T21:19:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "As ações da SK hynix negociadas nos Estados Unidos subiram 20% após a reinstalação de Huang como CEO da Nvidia.", "titulo_pt": "Ações da SK hynix nos EUA ganham 20% após Huang ser readmitido como CEO da Nvidia", "texto_pt": "As ações da SK hynix negociadas nos Estados Unidos subiram 20% após a reinstalação de Huang como CEO da Nvidia.", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 282660, "titulo": "Trump teria articulado retorno de Jensen Huang ao comando da Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/trump-teria-articulado-retorno-de-jensen-huang-ao-comando-da-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T20:50:00Z", "topico": "tecnologia", "idioma": "pt", "texto_resumo": "Jensen Huang foi reconduzido ao cargo de presidente-executivo da Nvidia após uma série de articulações de Donald Trump, ao longo de vários dias, para garantir ao conselho de administração que Huang não era alvo de acusações criminais e não representava um risco à segurança nacional.", "titulo_pt": "Trump teria articulado retorno de Jensen Huang ao comando da Nvidia", "texto_pt": "Jensen Huang foi reconduzido ao cargo de presidente-executivo da Nvidia após uma série de articulações de Donald Trump, ao longo de vários dias, para garantir ao conselho de administração que Huang não era alvo de acusações criminais e não representava um risco à segurança nacional.", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 283015, "titulo": "Jensen Huang Is Back", "url": "https://foreignpolicy.com/2026/11/23/nvidia-reinstates-jensen-huang-ceo-trump-board/", "fonte_id": "foreign_policy", "data_pub": "2026-11-23T20:43:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "Jensen Huang voltou em uma situação que agitou os mercados e levantou preocupações de segurança nacional.", "titulo_pt": "Jensen Huang volta", "texto_pt": "Jensen Huang voltou em uma situação que agitou os mercados e levantou preocupações de segurança nacional.", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 282943, "titulo": "The Return of Jensen Huang", "url": "https://www.nytimes.com/2026/11/23/world/jensen-huang-return-nvidia-ukraine.html", "fonte_id": "nyt_world", "data_pub": "2026-11-23T20:39:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Jensen Huang, o CEO da Nvidia, retornou, o presidente Trump está comemorando e os mercados estão se recuperando.", "titulo_pt": "O retorno de Jensen Huang", "texto_pt": "Jensen Huang, o CEO da Nvidia, retornou, o presidente Trump está comemorando e os mercados estão se recuperando.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 283148, "titulo": "How Jensen Huang ended up as Nvidia CEO again", "url": "https://www.theverge.com/tech/1040428/nvidia-jensen-huang-ceo-return", "fonte_id": "the_verge", "data_pub": "2026-11-23T19:57:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "Jensen Huang, fundador da Nvidia há 30 anos, deixou a empresa em 12 de novembro após admitir ter sido 'infiel' a sua esposa. Sua era na Nvidia quase chegou ao fim.", "titulo_pt": "Como Jensen Huang se tornou novamente CEO da Nvidia", "texto_pt": "Jensen Huang, fundador da Nvidia há 30 anos, deixou a empresa em 12 de novembro após admitir ter sido 'infiel' a sua esposa. Sua era na Nvidia quase chegou ao fim.", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 283062, "titulo": "Jensen Huang's return to Nvidia sparks bipartisan backlash on Capitol Hill", "url": "https://www.axios.com/2026/11/23/jensen-huang-nvidia-congress-dc-reaction", "fonte_id": "axios", "data_pub": "2026-11-23T19:54:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "O retorno de Jensen Huang como CEO da Nvidia está gerando críticas e investigações de membros do Congresso dos EUA, de ambos os partidos, especialmente em relação a riscos de segurança nacional. A decisão de Trump de reabilitar Huang está causando problemas para os republicanos e fornecendo material para investigação aos democratas que assumirão o controle do poder legislativo em janeiro.", "titulo_pt": "Retorno de jensen Huang à Nvidia gera críticas no congresso", "texto_pt": "O retorno de Jensen Huang como CEO da Nvidia está gerando críticas e investigações de membros do Congresso dos EUA, de ambos os partidos, especialmente em relação a riscos de segurança nacional. A decisão de Trump de reabilitar Huang está causando problemas para os republicanos e fornecendo material para investigação aos democratas que assumirão o controle do poder legislativo em janeiro.", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 283126, "titulo": "The startling return of Jensen Huang", "url": "https://www.ft.com/content/d23fd311-ac96-4dfb-88ef-b1ccb2197f13?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-23T18:11:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "O intervir de Trump para reestabelecer o chefe da Nvidia estabelece um precedente perigoso.", "titulo_pt": "O surpreendente retorno de Jensen Huang", "texto_pt": "O intervir de Trump para reestabelecer o chefe da Nvidia estabelece um precedente perigoso.", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 282754, "titulo": "Como o Vale do Silício se mobilizou para devolver a Nvi const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
