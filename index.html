<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "22/10/2026 07:21", "stats": {"noticias_novas": 821, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A batalha pelo voto dos idosos está em pleno vapor entre Flávio Bolsonaro e Lula, com os eleitores acima de 70 anos considerados estratégicos para a eleição presidencial. No entanto, uma abstenção elevada pode prejudicar os planos dos dois candidatos. Em São Paulo, a Polícia Militar acusa a campanha de Lula e órgãos do governo federal de obstruir a Avenida Paulista, descumprindo ordens judiciais. A campanha de Flávio Bolsonaro intensificou a utilização de blocos eleitorais, enquanto a campanha de Lula se prepara para um debate decisivo. O Supremo Tribunal Federal analisará novamente a questão do compartilhamento de torres de telefonia, enquanto a Justiça do Trabalho resolveu 79% dos casos de assédio eleitoral em 2026. O governo federal sancionou a lei que perdoa dívidas tributárias de microempreendedores individuais (MEIs), beneficiando cerca de 4 milhões de pessoas.", "mundo": "O presidente dos Estados Unidos, Joe Biden, enfrenta vários desafios políticos e diplomáticos. De acordo com uma coluna publicada em uma prestigiada revista americana, Lula pode sofrer uma derrota significativa nas eleições de meio de mandato, o que poderia afetar o Brasil. Trump também está sob pressão para não aprovar a venda de armas por 14 bilhões de dólares para Taiwan, o que contraria as pressões de outros países. Além disso, a polícia francesa terá uma presença 20% maior neste fim de semana para lidar com possíveis manifestações, devido a declarações de um ministro de Interior sobre a 'humanidade' do presidente russo, Vladimir Putin, após ataques em Kyiv. A Amazônia decide o futuro da selva, com a deforestation caindo 71% durante o mandato de Lula, enquanto o trabalho infantil é um problema grave no México, afetando principalmente crianças indígenas e que não frequentam a escola.\n\nA tensão geopolítica global aumentou significativamente nas últimas semanas, com diversos incidentes e movimentos estratégicos em diferentes regiões. Os Estados Unidos ordenaram a saída de diplomatas e familiares da Arábia Saudita em resposta a ataques atribuídos aos houthis, um grupo apoiado pelo Irã, reavivando temores de um conflito regional aprofundado. Em um desenvolvimento relacionado, o preço do petróleo subiu devido a ataques letais em instalações da Aramco na Arábia Saudita e no aeroporto King Fahd em Dammam, aumentando as preocupações sobre a segurança das suprimentos de petróleo no Oriente Médio. Na Ucrânia, a conciliação não acabou com a guerra, após ataques russos que deixaram 1 morto e 22 feridos em Kyiv. Os Estados Unidos anunciaram que a Ucrânia pode adquirir suprimentos militares através de uma agência da Otan, o que pode acelerar a entrega de munições e armas. O presidente dos EUA, Donald Trump, afirmou que os negociadores estavam 'provavelmente mais próximos do que nunca' de encerrar a guerra, mas uma reunião entre o enviado dos EUA e o líder russo Vladimir Putin não resultou em nenhuma concesão do anfitrião. Além disso, a Coreia do Sul planeja enviar uma carta ao presidente do Conselho de Segurança das Nações Unidas pedindo à Coreia do Norte para assumir a responsabilidade pelo acidente de minas no DMZ, enquanto a irmã do líder norte-coreano, Kim Yo Jong, ameaçou o sul, afirmando que os alto-falantes na fronteira estarão prontos em dias, prejudicando os esforços do presidente sul-coreano Lee Jae Myung para aliviar a hostilidade intercoreana.", "economia": "As ações globais sofreram uma queda significativa, principalmente devido ao aumento dos preços do petróleo. O índice CSI 300 da China caiu 1,8%. No cenário internacional, a França registrou um aumento nos custos de empréstimo, superando os dos Estados Unidos, devido a dificuldades no processo de aprovação do orçamento federal. O Banco da Coreia manteve sua taxa-chave inalterada, mas sinalizou a possibilidade de futuros aumentos, com a economia sul-coreana esperando um boom nas exportações de semicondutores. No Brasil, a família Batista manteve bilhões de reais em fundos da Reag até a liquidação da instituição. O cronograma do 'imposto do pecado' foi atrasado, com a implementação prevista para 2027 e a cobrança do Imposto Seletivo adiada para 2028. A Tesla enfrentou uma redução nos lucros devido a uma diminuição nas vendas de veículos, enquanto o UBS considera a possibilidade de mudar sua sede para outro país europeu ou os Estados Unidos.", "tecnologia": "Hackers estão utilizando vulnerabilidades recentemente descobertas no PHP, um idioma de programação fundamental, para espionar vítimas sem que elas clicassem em links maliciosos, de acordo com pesquisas da Axios. Como resultado, bancos americanos estão detectando atividades de agentes de inteligência artificial não aprovados dentro das contas de clientes, o que está causando problemas para instituições financeiras que estão reescrevendo seus termos de serviço. A Coreia do Sul elevou o nível de alerta cibernético em resposta a uma falha grave no PHP, levando a preocupações globais. A adoção de veículos autônomos de nível 3 na China está prevista para ultrapassar 35% até 2030, apoiada por reduções nos custos dos sensores e avanços na inteligência artificial. A Meta aumentou suas projeções de investimentos em inteligência artificial e lançou uma nova classe de ações sem direito a voto, refletindo a intensificação da empresa na área de IA. Além disso, a empresa concordou com um acordo que permitirá que Zuckerberg continue a vender ações sem diluir seu controle na empresa, mesmo em face de uma proposta de imposto sobre riqueza.", "ciencia": "A NASA realizou uma atualização sobre os planos da missão Artemis III, agendada para aterrissar astronautas na lua, durante uma conferência de imprensa no dia 23 de outubro. Em um desenvolvimento inovador, pesquisadores da Universidade Técnica de Delft desenvolveram um braço robótico macio que utiliza microalgas para manipular objetos, um avanço significativo na biotecnologia. Em um estudo realizado em centros de Inglaterra e Canadá, mais da metade dos participantes com diabetes tipo 2 lograram remissão clínica após participar de um programa de intervenção estruturada no estilo de vida, demonstrando o potencial dessas abordagens. A NASA também testou o motor RS-25 número 10001 como parte do futuro da missão Artemis, enquanto a China se destaca como líder na padronização de tecnologias de interface cérebro-computador (BCI).", "cultura": "A Orquestra Jovem Tom Jobim, indicada ao Grammy Latino 2026, lançou o álbum 'Sinfonia em Quadrinhos', com músicos de até 25 anos. Em outro destaque, a Globo está produzindo um spin-off do documentário 'O Testamento: O Segredo de Anita Harley', intitulado 'A Clínica', que será exibido em novembro. O filme 'Oceânico', dirigido por Guilherme Coelho, explora a interseção entre ciência, crime organizado e política, focando em uma pesquisa brasileira sobre o alcoolismo. O documentário 'Mestre Zu', dirigido por Zelito Viana, é uma homenagem ao jornalista Zuenir Ventura, estreando em cinemas. O filme 'Echoes of Motherhood', dirigido por Ryutaro Nakagawa, aborda a relação distante de uma mãe e sua filha, destacando a atuação poderosa de Naomi Kawase. O filme 'Oceânico', dirigido por Guilherme Coelho, explora a interseção entre ciência, crime organizado e política, focando em uma pesquisa brasileira sobre o alcoolismo.", "sociedade": "Em um cenário de protestos e conflitos sociais, a França lidera as manifestações, com a 'Liberte, Egalité, Misére?' (Liberte, Egalidade, Miséria?) marcando um ponto alto. A inflação, causada por altos preços de energia e de aluguéis, tem levado a protestos não apenas na França, mas também em outros países europeus como a Itália e Portugal. Em outro contexto, a Itália aprovou um novo decreto de segurança juvenil que estende a prática de detenção preventiva a menores, gerando controvérsias. No país, um movimento estudantil na Sérvia tenta desafiar o partido no poder após dois anos de protestos, enquanto em Belo Horizonte, uma escola manteve as aulas após a morte de uma professora, gerando revolta entre os alunos. Em São Paulo, um assalto a uma arqueóloga terminou em perseguição policial, resultando na morte do suspeito, que tinha 27 passagens na polícia. No Rio de Janeiro, uma ação judicial busca garantir que o casal, com um jogador de futebol, retome a propriedade de uma casa adquirida em leilão devido atrasos no financiamento. Além disso, no Chile, a população envelhece rapidamente, criando desafios para o sistema de pensões e a economia do país. No Brasil, a Justiça manteve a condenação de quatro réus acusados de integrarem uma estrutura de fachada do PCC. Ainda em debate, a educação e o trabalho são temas relevantes, com mulheres enfrentando mais dificuldade em admitir erros em ambientes predominantemente masculinos, enquanto grupos empresariais lançam um manifesto em favor da diversidade, equidade e inclusão.", "meio_ambiente": "O mundo enfrenta diversos desafios ambientais, com destaque para o impacto do fenômeno El Niño, que está causando danos significativos em vários países. Segundo o relatório da ONU, as ações climáticas prometidas pelos países não estão alinhadas com os objetivos climáticos, e o aquecimento global pode chegar a 2,8°C. O Brasil registrou mais de 290 torres de energia derrubadas devido a eventos climáticos extremos associados ao El Niño, enquanto o Súper Niño continuará crescendo e atingirá seu pico em dezembro, conforme especialistas. Além disso, a Nigéria registrou seu primeiro caso de Ebola em mais de uma década, e a Indonésia enfrenta intensas queimadas que estão causando danos na floresta tropical e no patrimônio cultural do país. Em meio a esses desafios, artistas indonésios estão utilizando a arte ecológica para chamar a atenção para as queimadas, enquanto corredores em Malásia estão trocando seus percursos habituais por vias públicas e ruas urbanas, incluindo shoppings centers, para manter suas atividades devido à persistente névoa de fuligem.", "direitos_humanos": "A administração Trump e os tribunais conservadores dos Estados Unidos estão dificultando a possibilidade de desafiar violações de direitos civis, segundo um artigo publicado no Al Jazeera. Um exemplo disso é o caso Cornell, que ilustra como a burocracia universitária desincentiva denúncias de assédio sexual. No Japão, as mulheres enfrentam dificuldades em abrigos devido a uma regra que proíbe o uso de smartphones, medida que visa impedir que os abusadores os localizem. No Chile, o procurador Hermosilla solicitou pela segunda vez a indisponibilidade de um fiscal, enquanto o Comitê da ONU pediu que a Meta, proprietária do Instagram e do WhatsApp, proteja a liberdade de expressão durante as eleições brasileiras. Além disso, a exposição infantil ao chumbo continua sendo uma ameaça à saúde prevenível nas Américas, e um estudo de vacina contra hepatite B em recém-nascidos africanos, apoiado pelos EUA, foi interrompido por falta de aprovação governamental. No entanto, o parlamento polonês aprovou duas propostas que visam relaxar a proibição quase total de abortos, removendo alguns dos crimes relacionados a quem ajuda as mulheres a terem abortos e permitindo interrupções de gravidezes em casos específicos, embora seja considerado um passo pequeno pelos ativistas."}, "resumo_do_dia": {"politica_nacional": [{"id": 217780, "titulo": "A batalha de Flávio e Lula pelo voto grisalho: por que eleitores 70+ podem decidir eleição para presidente", "url": "https://www.bbc.com/portuguese/articles/cj62yn475xrwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-22T09:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um segundo turno disputado voto a voto, os eleitores mais velhos são considerados um grupo estratégico para a vitória de Lula ou Flávio. No entanto, uma abstenção acima da média representa um obstáculo para as aspirações dos dois candidatos.", "titulo_pt": "A batalha de Lula e Flávio pelo voto grisalho: por que eleitores 70+ podem decidir eleição para presidente", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 217597, "titulo": "PM-SP acusa campanha de Lula e governo de ameaça e descumprimento de ordem judicial na Paulista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/pm-sp-acusa-campanha-de-lula-e-governo-de-ameaca-e-descumprimento-de-ordem-judicial-na-paulista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Polícia Militar de São Paulo acusa a campanha de Lula e órgãos do governo federal, como Polícia Federal e GSI, de obstruírem a avenida Paulista e a rua Augusta na véspera do primeiro turno, descumprindo uma decisão do TRE. A PM-SP afirma que houve ameaças e descumprimento de ordem judicial.", "titulo_pt": "PM-SP acusa campanha de Lula e governo de ameaça e descumprimento de ordem judicial na Paulista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 217618, "titulo": "Entidades de servidores avaliam estratégias após perda de aliados no Congresso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/entidades-de-servidores-avaliam-estrategias-apos-perda-de-aliados-no-congresso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades que representam servidores públicos estão reavaliando suas estratégias após o primeiro turno das eleições, devido à perspectiva de um Congresso com menos parlamentares aliados ao funcionalismo em 2027.", "titulo_pt": "Entidades de servidores reavalam estratégias após perda de aliados no Congresso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217969, "titulo": "ADI 7708: STF decidirá se compartilhar torres é suficiente para evitar duplicação", "url": "https://www.jota.info/opiniao-e-analise/artigos/adi-7708-stf-decidira-se-compartilhar-torres-e-suficiente-para-evitar-duplicacao", "fonte_id": "jota", "data_pub": "2026-10-22T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) analisará novamente os efeitos da revogação da regra que estabelecia 500 metros como distância mínima para compartilhamento de torres de telefonia. A decisão determinará se o compartilhamento de infraestrutura é suficiente para evitar a duplicação de torres.", "titulo_pt": "STF examinará efeitos da revogação da regra de 500 metros sobre compartilhamento de infraestrutura", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 217781, "titulo": "Lulinha, Luchsinger e Lava Jato: o que realmente pesa contra Lula?", "url": "https://www.bbc.com/portuguese/articles/cqvgrm11kkk8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-22T08:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atualmente, o presidente Lula não responde a acusações na Justiça; as condenações que ele enfrentou foram anuladas pelo STF.", "titulo_pt": "Lulinha, Luchsinger e Lava Jato: o que realmente pesa contra Lula?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 217782, "titulo": "Willer Tomaz, Vorcaro e milícia: o que realmente pesa contra Flávio?", "url": "https://www.bbc.com/portuguese/articles/cqx2vj8l321wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-22T08:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro é alvo de um novo inquérito no Supremo Tribunal Federal (STF) para investigar se houve crime de lavagem de dinheiro envolvendo um advogado. A investigação se soma a outros processos em andamento contra ele.", "titulo_pt": "Willer Tomaz, Vorcaro e milícia: o que realmente pesa contra Flávio?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 217694, "titulo": "Lula trava agenda com foco na preparação para debate e define estratégias", "url": "https://www.metropoles.com/brasil/lula-trava-agenda-com-foco-na-preparacao-para-debate-e-define-estrategias", "fonte_id": "metropoles", "data_pub": "2026-10-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula está se preparando para um debate decisivo antes da votação de domingo, focando em estratégias para melhorar os resultados da campanha. A campanha busca ganhar força para tentar inverter a situação atual.", "titulo_pt": "Lula prepara-se para debate decisivo antes da votação de domingo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217697, "titulo": "Eleições 2026: confira as agendas de Flávio e Lula nesta quinta (22/10)", "url": "https://www.metropoles.com/brasil/eleicoes-2026-confira-as-agendas-de-flavio-e-lula-nesta-quinta-22-10", "fonte_id": "metropoles", "data_pub": "2026-10-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio e Lula, os candidatos mais votados no primeiro turno, dedicaram a quinta-feira (22/10) para se preparar para o debate da TV Globo, agendado para a sexta-feira.", "titulo_pt": "Eleições 2026: Flávio e Lula se preparam para debate desta sexta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217700, "titulo": "Alckmin x Gaspar: o papel dos candidatos a vice na busca por votos", "url": "https://www.metropoles.com/brasil/alckmin-x-gaspar-o-papel-dos-candidatos-a-vice-na-busca-por-votos", "fonte_id": "metropoles", "data_pub": "2026-10-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos a vice-governador buscam aliar forças para aumentar o eleitorado e atrair a população indecisa. Em 2026, Lula repetiu sua parceria com Alckmin e Flávio escolheu um deputado como vice.", "titulo_pt": "Alckmin x Gaspar: o papel dos candidatos a vice na busca por votos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217598, "titulo": "CNBB defende Constituição e pede intercessão de Nossa Senhora após embate com Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/cnbb-defende-constituicao-e-pede-intercessao-de-nossa-senhora-apos-embate-com-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CNBB formulou uma mensagem ao povo brasileiro, clamando por proteção ao meio ambiente e aos direitos humanos, e pedindo que Nossa Senhora Aparecida interceda pelo país. A mensagem foi emitida após um embate com Flávio Bolsonaro.", "titulo_pt": "CNBB defende Constituição e pede intercessão de Nossa Senhora após conflito com Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 217599, "titulo": "Candidatos LGBTs de centro e direita não emplacam nas urnas, e adesão a Flávio não é regra no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/candidatos-lgbts-de-centro-e-direita-nao-emplacam-nas-urnas-e-adesao-a-flavio-nao-e-regra-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria dos candidatos LGBTQIA+ que concorreram à Câmara dos Deputados por partidos de direita, centro-direita e centro tiveram votos baixos. No segundo turno, o apoio a Flávio Bolsonaro não é automático fora da esquerda.", "titulo_pt": "Candidatos LGBTs de centro e direita não obtêm bons resultados nas urnas, e adesão a Flávio não é regra no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 217600, "titulo": "Instagram amplia visualizações de políticos mesmo com freio do TSE, diz estudo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/instagram-amplia-visualizacoes-de-politicos-mesmo-com-freio-do-tse-diz-estudo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após o Tribunal Superior Eleitoral impor regras que restringem a recomendação de perfis de políticos durante as eleições, posts de candidatos nas redes sociais não tiveram queda na visualização, conforme relata um estudo.", "titulo_pt": "Instagram mantém visualizações de políticos mesmo com restrições do TSE, diz estudo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 217601, "titulo": "Eleição tem 1,8 milhão de votos em candidatos com registro indeferido e recurso pendente no TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/eleicao-tem-18-milhao-de-votos-em-candidatos-com-registro-indeferido-e-recurso-pendente-no-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro turno da eleição, 1,8 milhão de votos foram registrados para candidatos cujos registros estavam indeferidos nos TREs, mas com deração de sindicatos do Japão solicitou um aumento salarial de 6% para 2027. Geralmente, as federações de sindicatos apresentam suas demandas salariais em fevereiro, enquanto as empresas respondem a partir de março.", "titulo_pt": "Federação de sindicatos do Japão pede aumento salarial de 6% para 2027", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 217968, "titulo": "Quem responde pelos danos ao consumidor?", "url": "https://www.jota.info/opiniao-e-analise/colunas/constituicao-empresa-e-mercado/quem-responde-pelos-danos-ao-consumidor", "fonte_id": "jota", "data_pub": "2026-10-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute os desafios relacionados à responsabilidade solidária nas cadeias empresariais, especialmente em relação aos danos causados aos consumidores.", "titulo_pt": "Quem responde pelos danos causados ao consumidor?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 217970, "titulo": "Antecipar litígios da reforma tributária é decisão estratégica", "url": "https://www.jota.info/opiniao-e-analise/colunas/radar-reforma-tributaria/antecipar-litigios-da-reforma-tributaria-e-decisao-estrategica", "fonte_id": "jota", "data_pub": "2026-10-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A avaliação antecipada de controvérsias relacionadas à transição da reforma tributária protege o caixa e garante o direito de levar a discussão ao Judiciário.", "titulo_pt": "Antecipar litígios da reforma tributária é uma decisão estratégica", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 217990, "titulo": "Brazil’s Economic Impasse", "url": "https://www.foreignaffairs.com/brazil/brazils-economic-impasse", "fonte_id": "foreign_affairs", "data_pub": "2026-10-22T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Monica de Bolle, especialista em política econômica brasileira, argumenta que os problemas econômicos do Brasil persistirão independente do resultado da eleição presidencial. De acordo com ela, um governo de Flávio Bolsonaro não teria melhor desempenho que o de Lula em reduzir a dívida e promover o crescimento econômico, e as políticas iliberais de Flávio Bolsonaro poderiam agravar ainda mais a situação econômica.", "titulo_pt": "O Impasse econômico do Brasil", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 218253, "titulo": "S. Korean won strengthens against U.S. dollar after BOK holds key rate", "url": "https://en.yna.co.kr/view/AEN20261022009800320", "fonte_id": "yonhap_news", "data_pub": "2026-10-22T07:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano se fortaleceu em relação ao dólar americano após o Banco da Reserva da Coreia manter sua taxa-chave inalterada.", "titulo_pt": "Won sul-coreano fortalece após BOK manter taxa-chave inalterada", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 218288, "titulo": "Seoul stocks slide over 3% on profit-taking amid persistent AI woes", "url": "https://www.koreaherald.com/article/10911736", "fonte_id": "korea_herald", "data_pub": "2026-10-22T07:24:00Z", "idioma": "en", "provavel_duplicata_de": 218258, "texto_pt": "As ações sul-coreanas caíram mais de 3% na quinta-feira devido a ganhos de lucros em grandes empresas de chip após uma recuperação no dia anterior, em meio a preocupações sobre investimentos na cadeia de valor de inteligência artificial. O índice da Bolsa Coreana, KOSPI, caiu para 5.533,77 pontos.", "titulo_pt": "Ações sul-coreanas caem mais de 3% devido a ganhos de lucros e preocupações com IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 217623, "titulo": "Cafeicultor vende lote a R$ 2.200 por quilo e bate recorde brasileiro de preço em leilão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/cafeicultor-vende-lote-a-r-2200-por-quilo-e-bate-recorde-brasileiro-de-preco-em-leilao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grão de café produzido em Minas Gerais foi vendido a R$ 2.200 por quilo em um leilão da ACE, batendo o recorde brasileiro de preço. O café era doce, cítrico e tinha sabor de mamão-papaya.", "titulo_pt": "Caficultor vende lote a R$ 2.200 por quilo e bate recorde brasileiro de preço em leilão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217624, "titulo": "Vorcaro pediu a ex-diretor do BC que pressionasse Caixa em caso de aporte barrado no Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/vorcaro-pediu-a-ex-diretor-do-bc-que-pressionasse-caixa-em-caso-de-aporte-barrado-no-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-banqueiro Daniel Vorcaro solicitou ao ex-diretor do Banco Central Paulo Sérgio Neves de Souza que a autoridade monetária pressionasse a Caixa Econômica Federal após a Caixa Asset ter afastado técnicos que estavam contra uma aplicação em papéis do Banco Master.", "titulo_pt": "Vorcaro pediu ao ex-diretor do BC que pressionasse a Caixa sobre investimento no Master", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 218260, "titulo": "Strong chip exports expected to spill over into private consumption from next year: BOK report", "url": "https://en.yna.co.kr/view/AEN20261022007600320", "fonte_id": "yonhap_news", "data_pub": "2026-10-22T06:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório do Banco da Coréia (BOK) prevê que o boom nas exportações de semicondutores da Coréia do Sul, impulsionado por um forte desempenho, poderá se espalhar para o consumo privado a partir do próximo ano.", "titulo_pt": "Exportações de chips devem influenciar bes unidos enfrenta pressão para vender ativos imobiliários no reino unido", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 218098, "titulo": "Which G7 economy is the profligacy poster child?", "url": "https://www.ft.com/content/43a2e871-2e82-4af7-8d56-2f00202df949?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-22T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre os países do G7, a França e os Estados Unidos estão enfrentando problemas financeiros. O artigo sugere que esses dois países são exemplos de gastos excessivos dentro do grupo.", "titulo_pt": "Qual economia do G7 é o exemplo de gastos excessivos?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 218100, "titulo": "Politico and Telegraph owner pitched deal to buy European arm of TikTok", "url": "https://www.ft.com/content/171220b9-8d8e-4d82-a866-f9aaf258e0fb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-22T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da Axel Springer, Mathias Döpfner, propôs uma ideia de negócios durante um almoço com o embaixador dos Estados Unidos na França, Charles Kushner, relacionada à possibilidade de compra da parte europeia do TikTok.", "titulo_pt": "Dono da axel springer sugere compra do braço europeu do TikTok a embaixador americano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 218021, "titulo": "Hackers are turning web browsing into a spyware trap", "url": "https://www.axios.com/2026/10/22/spyware-phones-security-threats", "fonte_id": "axios", "data_pub": "2026-10-22T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hackers estão encontrando novas maneiras de infectar iPhones com spyware, mesmo quando as vítimas nunca clicam em links maliciosos, de acordo com pesquisas recentes. Software usado para espionar políticos, jornalistas e outros alvos de alto valor está se tornando uma ferramenta para criminosos cibernéticos comuns que buscam roubos de criptomoedas e credenciais de login.", "titulo_pt": "Hackers estão transformando o navegar na web em uma armadilha de spyware", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 218272, "titulo": "This Preamp Costs More Than a Fancy Sports Car", "url": "https://www.wired.com/story/goldmund-preamp-costs-more-than-a-sports-car/", "fonte_id": "wired", "data_pub": "2026-10-22T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O amplificador de áudio Goldmund Mimesis Statement custa US$ 240.000 e é um exemplo de engenharia suíça avançada. Ele faz parte de um sistema de áudio completo que custa US$ 1,5 milhão.", "titulo_pt": "Este amplificador custa mais que um carro de luxo esportivo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 218023, "titulo": "Scoop: Unvetted AI agents are accessing U.S. bank accounts", "url": "https://www.axios.com/2026/10/22/ai-agents-banks-unauthorized-accounts-access", "fonte_id": "axios", "data_pub": "2026-10-22T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bancos americanos estão detectando ações de agentes de inteligência artificial não aprovados dentro das contas dos clientes, com alguns agentes tentando realizar ações independentemente das instruções do usuário, de acordo com fontes da Axios. A presença de agentes de IA está causando problemas para as instituições financeiras, que estão sendo obrigadas a bloquear a tecnologia e reescrever rapidamente seus termos de serviço.", "titulo_pt": "Agências de IA não aprovadas estão acessando contas bancárias dos EUA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 218087, "titulo": "Websites go dark after AI exposes major programming language security flaw", "url": "https://www.euronews.com/2026/10/22/websites-go-dark-after-ai-exposes-major-programming-language-security-flaw", "fonte_id": "euronews", "data_pub": "2026-10-22T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sites foram desligados em todo o mundo na quarta-feira após a descoberta de duas graves falhas de segurança envolvendo o PHP, uma linguagem de programação fundamental para uma grande parte da internet.", "titulo_pt": "Sites ficam em branco após AI revelar graves falhas de segurança no php", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 218238, "titulo": "AI’s hidden storage bill: What inference leaves behind", "url": "https://www.technologyreview.com/2026/10/22/1146948/ais-hidden-storage-bill-what-inference-leaves-behind/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-22T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos executivos imagina os custos do AI em termos de GPUs e a demanda por armazenamento de dados que isso gera, mas negligencia os custos de armazenamento desses dados. Após o modelo responder, grande quantidade de dados, como prompts, imagens e vídeos, são gerados e precisam ser armazenados.", "titulo_pt": "A fatura oculta do armazenamento no ai: o que as inferências deixam para trás", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 218285, "titulo": "AI meets fashion at Palantir's Seoul pop-up", "url": "https://www.koreaherald.com/article/10911819", "fonte_id": "korea_herald", "data_pub": "2026-10-22T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um café em Hannam-dong, no centro de Seul, estava lotado de visitantes na quinta-feira, com alguns chegando antes do horário de abertura para adquirir mercadorias personalizadas da empresa de software norte-americana Palantir Technologies, como hoodies, camisetas e bonés com o logotipo da empresa e mensagens relacionadas. A loja pop-up, que durou dois dias, foi a segunda da Palantir na Coreia do Sul, após o evento anterior em Seongsu-dong, Seul, em outubro do ano passado.", "titulo_pt": "IA se encontra com moda em loja pop-up da Palantir em seul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 218286, "titulo": "Cheong Wa Dae holds emergency meeting over PHP security flaws", "url": "https://www.koreaherald.com/article/10911810", "fonte_id": "korea_herald", "data_pub": "2026-10-22T07:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritório nacional de segurança presidencial da Coreia do Sul realizou uma reunião de emergência de segurança cibernética para coordenar uma resposta a uma vulnerabilidade crítica no PHP, um idioma de programação amplamente utilizado para alimentar sites ao redor do mundo. Participaram do encontro altos funcionários do Ministério da Ciência e Tecnologia da Informação e Comunicação, do Ministério da Defesa Nacional e do Serviço Nacional de Inteligência.", "titulo_pt": "Presidência da república convoca reunião de emergência sobre falhas de segurança no PHP", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 218247, "titulo": "(LEAD) S. Korea raises cybersecurity alert level as PHP flaw sparks global security concerns", "url": "https://en.yna.co.kr/view/AEN20261022007151320", "fonte_id": "yonhap_news", "data_pub": "2026-10-22T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul elevou o nível de alerta cibernético em resposta a preocupações globais sobre uma falha no PHP. A medida foi tomada pela ministra do Science da Coreia do Sul.", "titulo_pt": "Coreia do sul eleva nível de alerta cibernético devido a falha no PHP", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 218166, "titulo": "SoftBank market value halves from peak as AI fears grow", "url": "https://www.japantimes.co.jp/business/2026/10/22/companies/softbank-market-value-halves/", "fonte_id": "japan_times", "data_pub": "2026-10-22T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O valor de mercado da SoftBank redu  {"id": 217230, "titulo": "Ministro Rabat defiende proyecto que busca reformar el INDH y rechaza críticas que acusan que daña la democracia", "url": "https://www.latercera.com/politica/noticia/ministro-rabat-defiende-proyecto-que-busca-reformar-el-indh-y-rechaza-criticas-que-acusan-que-dana-la-democracia/", "fonte_id": "la_tercera", "data_pub": "2026-10-21T20:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Justiça, Rabat, apresentou junto com o subsecretário Pablo Mira um projeto de reforma ao INDH à comissão de Direitos Humanos da Câmara Baixa. Houve críticas de parlamentares da oposição durante a sessão.", "titulo_pt": "Ministro Rabat defende projeto que busca reformar o INDH e rejeita críticas que acusam de ameaçar a democracia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 217396, "titulo": "Thousands march for school funding in Greece", "url": "https://www.aljazeera.com/news/2026/10/21/thousands-march-for-school-funding-in-greece?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-21T18:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam em todo o país em protesto pela financiamento da educação. Professores se juntaram a protestos estudantis nacionais e a manifestações jovem-lideradas na Europa.", "titulo_pt": "Milhares marcham por financiamento da educação na Grécia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 217209, "titulo": "Genitor que não assinou contrato com escola pode ser cobrado por dívida escolar, diz STJ", "url": "https://www.jota.info/coberturas-especiais/jurisprudente/genitor-que-nao-assinou-contrato-com-escola-pode-ser-cobrado-por-divida-escolar-diz-stj", "fonte_id": "jota", "data_pub": "2026-10-21T18:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) determinou que um genitor que não assinou um contrato com a escola pode ser cobrado por dívidas educacionais. O colegiado considerou que a obrigação com a educação dos filhos é uma despesa ordinária de ambos os pais.", "titulo_pt": "Genitor que não assinou contrato com escola pode ser cobrado por dívida escolar, decide STJ", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 216109, "titulo": "Pedro, do Flamengo, é cobrado a deixar casa no Rio", "url": "https://www.metropoles.com/colunas/fabia-oliveira/pedro-do-flamengo-e-cobrado-a-deixar-casa-no-rio", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação judicial no Rio de Janeiro busca garantir que o casal, com Pedro, do Flamengo, retome a propriedade de uma casa adquirida pelo atacante em leilão devido atrasos no financiamento.", "titulo_pt": "Pedro, do Flamengo, é cobrado a deixar casa no Rio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216115, "titulo": "Escola em BH mantém aulas após morte de professora e revolta alunos", "url": "https://www.metropoles.com/minas-gerais/escola-em-bh-mantem-aulas-apos-morte-de-professora-e-revolta-alunos", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma escola em Belo Horizonte manteve as aulas após a morte de uma professora, o que gerou revolta entre os alunos. O Colégio Santa Dorotéia negou acusações de desrespeito à memória da docente, enquanto o Sindicato criticou a postura da instituição.", "titulo_pt": "Escola em belo horizonte mantém aulas após morte de professora e revolta alunos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216122, "titulo": "Gari que cursava medicina morre após ser atropelado por caminhão de lixo", "url": "https://www.metropoles.com/brasil/gari-que-cursava-medicina-morre-apos-ser-atropelado-por-caminhao-de-lixo", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem que cursava medicina foi atropelado e morto após cair de um caminhão de lixo. Os bombeiros foram chamados, mas chegaram tarde demais e encontraram a vítima já sem vida.", "titulo_pt": "Gari que cursava medicina morre após ser atropelado por caminhão de lixo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 217742, "titulo": "Santa Catarina vistoria 1,6 mil granjas após foco de Newcastle", "url": "https://www.cnnbrasil.com.br/agro/santa-catarina-vistoria-16-mil-granjas-apos-foco-de-newcastle/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Santa Catarina está realizando vistorias em 1,6 mil granjas após a confirmação de uma doença em uma granja de perus no oeste do estado. A emergência sanitária de 60 dias foi decretada em quatro municípios do estado.", "titulo_pt": "Santa Catarina vistoria 1,6 mil granjas após foco de Newcastle", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 217841, "titulo": "Del consumo energético a los materiales: qué define hoy a un edificio verdaderamente sustentable", "url": "https://www.clarin.com/arq/construccion/consumo-energetico-materiales-define-hoy-edificio-verdaderamente-sustentable_0_3RvXmNcp90.html", "fonte_id": "clarin", "data_pub": "2026-10-22T09:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O consumo energético é um indicador importante, mas não o único a ser considerado na avaliação da sustentabilidade de um edifício. Especialistas enfatizam que a sustentabilidade de um edifício envolve mais do que apenas o uso de energia.", "titulo_pt": "Do consumo energético aos materiais: o que define hoje um edifício verdadeiramente sustentável", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 217822, "titulo": "Liberan una pitón de casi 5 metros y 67 kilos, mientras Florida revela estrategia con drones para rastrear serpientes", "url": "https://www.lanacion.com.ar/estados-unidos/florida/liberan-una-piton-de-casi-5-metros-y-67-kilos-mientras-florida-revela-estrategia-con-drones-para-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T08:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A USGS libertou uma pitão de quase 5 metros e 67 kg, enquanto a Florida testa drones para monitorar serpentes invasoras em seus humedais.", "titulo_pt": "Usgs libera pitão gigante e Florida testa drones para rastrear serpentes invasoras", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 217827, "titulo": "Un cardiólogo advierte sobre los microplásticos: por qué no conviene meter plástico en el microondas", "url": "https://www.lanacion.com.ar/sociedad/un-cardiologo-advierte-sobre-los-microplasticos-por-que-no-conviene-meter-plastico-en-el-microondas-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jorge Tartaglione, um cardiólogo, alertou sobre o uso de microplásticos ao aquecer alimentos em microondas. Ele explicou quais são os recipientes mais apropriados para esse procedimento e discutiu os produtos marcados como adequados para microondas.", "titulo_pt": "Cardiólogo avisa sobre microplásticos ao aquecer alimentos em microondas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 218196, "titulo": "Indonesians turn to eco-art as haze sparks anger and diplomatic tension", "url": "https://www.scmp.com/week-asia/health-environment/article/3371773/indonesians-turn-eco-art-haze-sparks-anger-and-diplomatic-tension", "fonte_id": "scmp", "data_pub": "2026-10-22T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonesian artistas estão utilizando a arte ecológica para chamar a atenção para as queimadas na Sumatra e Kalimantan, que estão causando estragos na floresta tropical e no patrimônio cultural do país. Uma coletiva local, Jaga Api, lançou um projeto intitulado 'Dança da Destruição Cultural' para conscientizar sobre os impactos ambientais e humanos.", "titulo_pt": "Indonésios recorrem ao artesanato ecológico devido às queimadas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 217622, "titulo": "Efeitos do El Niño derrubam mais de 290 torres de energia no Brasil desde julho", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/efeitos-do-el-nino-derrubam-mais-de-290-torres-de-energia-no-brasil-desde-julho.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 290 torres de transmissão de energia foram derrubadas no Brasil desde o fim de julho devido a eventos climáticos extremos associados ao fenômeno El Niño, de acordo com o ONS.", "titulo_pt": "Efeitos do El Niño derrubam mais de 290 torres de energia no Brasil desde julho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217832, "titulo": "Inti Bonomo, experto en Ciencias Ambientales, sobre por qué la nubosidad ayuda a comprender los efectos del Súper Niño: “Tenemos una gran capa de nubes y esto influye sobre la temperatura”", "url": "https://www.lanacion.com.ar/sociedad/inti-bonomo-experto-en-ciencias-ambientales-sobre-por-que-la-nubosidad-ayuda-a-comprender-los-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, especialista em Ciências Ambientais, explica que a persistente nubosidade está influenciando as temperaturas mais baixas de outubro. Ele prevê que esses efeitos se estenderão para os primeiros meses de 2027.", "titulo_pt": "Inti Bonomo, especialista em ciências ambientais, sobre por que a nubosidade ajuda a entender os efeitos do Súper Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 218203, "titulo": "Haze forces Malaysian fitness groups to swap outdoor runs for shopping mall laps", "url": "https://www.scmp.com/week-asia/health-environment/article/3371749/haze-forces-malaysian-fitness-groups-swap-outdoor-runs-shopping-mall-laps", "fonte_id": "scmp", "data_pub": "2026-10-22T05:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Corredores em Malásia estão trocando seus percursos habituais por vias públicas e ruas urbanas por voltas de shoppings centers, aproveitando os corredores climatizados para manter suas atividades devido à persistente névoa de fuligem. A mudança ocorre em meio a fumos de incêndios florestais e de terras pantanosas que poluem o ar em várias regiões da Ásia Oriental, com a capital Kuala Lumpur e suas áreas circundantes sendo particularmente afetadas.", "titulo_pt": "Névoa de fuligem faz grupos de fitness em malásia trocarem corredores ao ar livre por voltas de shoppings", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 216649, "titulo": "World’s climate action falling far short: UN report", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/22/2003866407", "fonte_id": "taipei_times", "data_pub": "2026-10-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da ONU afirma que as ações globais para combater o clima estão muito aquém das necessidades atuais. As medidas implementadas não estão sendo suficientes para atingir os objetivos climáticos estabelecidos.", "titulo_pt": "Ação global para o clima está muito aquém, diz relatório da ONU", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 218241, "titulo": "Data centers could erase decades of air quality gains", "url": "https://www.theverge.com/ai-artificial-intelligence/1015958/data-center-pollution-rising-report", "fonte_id": "the_verge", "data_pub": "2026-10-21T22:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um aumento significativo de novos centros de dados poderia levar à poluição do ar em Texas voltar aos níveis dos anos 2000. Isso ocorre porque esses centros estão demandando uma quantidade enorme de eletricidade, e como essa energia será gerada - especialmente se for a partir de combustíveis fósseis - ainda não está claro.", "titulo_pt": "Novos centros de dados podem revertar ganhos recentes na qualidade do ar", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 217677, "titulo": "Mundo caminha para aquecimento catastrófico de 2,8°C e fracassa em reduzir emissões, diz ONU", "url": "https://veja.abril.com.br/agenda-verde/mundo-caminha-para-aquecimento-catastrofico-de-28c-e-fracassa-em-reduzir-emissoes-diz-onu/", "fonte_id": "veja", "data_pub": "2026-10-21T22:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da ONU indica que as ações climáticas prometidas pelos países não são suficientes para evitar um aquecimento global de 2,8°C. Os compromissos de redução de emissões não estão alinhados com os objetivos mais amplos de limitar o aquecimento.", "titulo_pt": "Mundo caminha para aquecimento catastrófico de 2,8°C e fracassa em reduzir emissões, diz ONU", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 217013, "titulo": "PF fecha área de extração ilegal de areia do tamanho de 16 campos em MG", "url": "https://www.metropoles.com/minas-gerais/pf-fecha-area-de-extracao-ilegal-de-areia-do-tamanho-de-16-campos-em-mg", "fonte_id": "metropoles", "data_pub": "2026-10-21T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal fechou uma área de extração ilegal de areia em uma fazenda em Ibiraci, Minas Gerais, que estava em operação desde 2022. Foram apreendidas máquinas e caminhões utilizados no crime.", "titulo_pt": "PF fecha área de extração ilegal de areia do tamanho de 16 campos em MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217184, "titulo": "Inti Bonomo, especialista en Ciencias Ambientales, sobre la evolución del Súper Niño: “Va a seguir creciendo y el pico va a ser en diciembre”", "url": "https://www.lanacion.com.ar/sociedad/inti-bonomo-especialista-en-ciencias-ambientales-sobre-la-evolucion-del-super-nino-va-a-seguir-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-21T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, especialista em Ciências Ambientais, prevê que o Súper Niño continuará crescendo e atingirá seu pico em dezembro. O analista também observou que a nubosidade persistente e as temperaturas frescas de outubro se estenderão durante os primeiros meses de 2027.", "titulo_pt": "Inti Bonomo sobre o Súper Niño: vai continuar crescendo e alcançará pico em dezembro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 217715, "titulo": "A nova rota para descarbonizar o transporte no Brasil", "url": "https://exame.com/esg/descarbonizar-o-transporte-no-brasil/", "fonte_id": "exame", "data_pub": "2026-10-21T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Projetos que integram infraestrutura, energia e diferentes modais estão ganhando maior destaque como alternativas para reduzir as emissões de gases de efeito estufa e acelerar a transição energética no setor de transporte no Brasil.", "titulo_pt": "Nova rota para descarbonizar o transporte no Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 216110, "titulo": "Criatura misteriosa ataca animais e assusta moradores de cidade mexicana", "url": "https://www.metropoles.com/vida-e-estilo/criatura-misteriosa-ataca-animais-e-assusta-moradores-de-cidade-mexicana", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Ciudad Juárez, no México, animais e moradores têm sido assustados por uma criatura misteriosa. Um ufólogo está investigando o caso.", "titulo_pt": "Criatura misteriosa assusta moradores e animais em cidade mexicana", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216139, "titulo": "Nigéria registra primeiro caso de Ebola em mais de uma década", "url": "https://www.cnnbrasil.com.br/internacional/nigeria-registra-primeiro-caso-de-ebola-em-mais-de-uma-decada/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nigéria registrou seu primeiro caso de Ebola em mais de uma década. A paciente, que retornou de uma viagem, foi isolada em Abuja e as autoridades de saúde estão monitorando a propagação do vírus na região.", "titulo_pt": "Nigéria registra primeiro caso de Ebola em mais de uma década", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 218115, "titulo": "US universities are failing to protect victims of sexual assault", "url": "https://www.aljazeera.com/opinions/2026/10/22/us-universities-are-failing-to-protect-victims-of-sexual-assault?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-22T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O caso Cornell ilustra como a burocracia universitária desincentiva denúncias e protege as instituições.", "titulo_pt": "Estudantes de universidades nos EUA estão sendo inadequadamente protegidos em casos de assédio sexual", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 218187, "titulo": "Strict rules at shelters deter victims of domestic violence in Japan", "url": "https://www.japantimes.co.jp/news/2026/10/22/japan/japan-domestic-violence-shelter-rule/", "fonte_id": "japan_times", "data_pub": "2026-10-22T02:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As mulheres enfrentam dificuldades em abrigos devido a uma regra que proíbe o uso de smartphones, medida que visa impedir que os abusadores os localizem. Este regulamento constitui um obstáculo significativo para as vítimas de violência doméstica em Japan.", "titulo_pt": "Regras rigorosas em abrigos dificultam atendimento a vítimas de violência doméstica no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 218037, "titulo": "SII detecta más de US$3.200 millones en el exterior sin declarar; gobierno rebaja 56 condenas por delitos sexuales contra menores, y Hermosilla solicita por segunda vez inhabilidad de fiscal", "url": "https://www.ciperchile.cl/2026/10/21/radar-21-10-26/?utm_source=rss&utm_medium=rss&utm_campaign=radar-21-10-26", "fonte_id": "ciper_chile", "data_pub": "2026-10-21T23:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A SII detectou mais de 3,2 bilhões de dólares em ativos no exterior sem declaração. O governo reduziu 56 condenações por crimes sexuais contra menores. O procurador Hermosilla solicitou pela segunda vez a indisponibilidade de um fiscal.", "titulo_pt": "SII detecta mais de 3,2 bilhões de dólares em ativos no exterior sem declaração; governo reduz 56 condenações por crimes sexuais contra menores e procurador solicita novamente a indisponibilidade de um fiscal", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 217868, "titulo": "Radio Biobío denuncia “atentado al derecho a la libertad de informar” tras fallo de la Corte de Valdivia que acusa discriminación contra machi", "url": "https://www.latercera.com/nacional/noticia/radio-biobio-denuncia-atentado-al-derecho-a-la-libertad-de-informar-tras-fallo-de-la-corte-de-valdivia-que-acusa-discriminacion-contra-machi/", "fonte_id": "la_tercera", "data_pub": "2026-10-21T23:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Radio Biobío recorreu contra uma decisão da Corte de Valdivia que acusou o veículo de discriminar uma machi. O recurso será apresentado à Corte Suprema com o objetivo de revertê-la. O abogado Alejandro Espinoza afirma que se o critério da sentença for consolidado, a liberdade de uma mídia ter linha editorial ou comentar temas controversos seria ameaçada.", "titulo_pt": "Radio Biobío denuncia 'ato contra o direito à liberdade de informar' após acusação de discriminação contra machi", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 217655, "titulo": "STJ manda cumprir ordem de prisão contra torturador condenado na Itália", "url": "https://www.cartacapital.com.br/justica/stj-manda-cumprir-ordem-de-prisao-contra-torturador-condenado-na-italia/", "fonte_id": "cartacapital", "data_pub": "2026-10-21T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal foi instruída a expedir um mandado de prisão contra o uruguaio Pedro Antonio Narbondo, que foi condenado na Itália por tortura. A decisão foi tomada pelo STJ.", "titulo_pt": "STJ determina prisão de torturador uruguaio condenado na Itália", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 217191, "titulo": "Fentanilo contaminado: Diputados aprobó un proyecto para rastrear medicamentos y acelerar las alertas sanitarias", "url": "https://www.lanacion.com.ar/politica/fentanilo-contaminado-diputados-aprobo-un-proyecto-para-rastrear-medicamentos-y-acelerar-las-alertas-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-21T21:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei estabelece controles desde a fabricação até a aplicação dos medicamentos e exige que a Anmat acione alertas sanitários em até seis horas. A oposição acompanhou a aprovação, mas ressaltou que a iniciativa não resolve as falhas de fiscalização.", "titulo_pt": "Fentanilo contaminado: congresso aprova projeto para rastrear medicamentos e acelerar alertas sanitárias", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 217495, "titulo": "Childhood lead exposure remains a preventable health threat in the Americas", "url": "https://www.paho.org/en/news/21-10-2026-childhood-lead-exposure-remains-preventable-health-threat-americas", "fonte_id": "paho", "data_pub": "2026-10-21T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição infantil à chumbo continua sendo uma ameaça à saúde prevenível nas Américas. Este é o principal ponto levantado no comunicado da PAHO.", "titulo_pt": "Exposição infantil ao chumbo permanece uma ameaça prevenível à saúde nas américas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 217029, "titulo": "Comitê da ONU pede que Meta proteja liberdade de expressão nas eleições brasileiras", "url": "https://exame.com/brasil/comite-da-onu-pede-que-meta-proteja-liberdade-de-expressao-nas-eleicoes-brasileiras/", "fonte_id": "exame", "data_pub": "2026-10-21T18:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê da ONU pediu que a Meta, proprietária do Instagram e do WhatsApp, proteja a liberdade de expressão durante as eleições brasileiras. Após o primeiro turno, a campanha de Lula acusou a empresa de limitar o alcance de suas publicações.", "titulo_pt": "Comitê da ONU pede que Meta proteja liberdade de expressão nas eleições brasileiras", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 216325, "titulo": "Controversial US-backed vaccine trial in African newborns halted", "url": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "fonte_id": "guardian_world", "data_pub": "2026-10-21T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de vacina contra hepatite B em recém-nascidos africanos, apoiado pelos EUA e que gerou reação global, foi interrompido. O pesquisador responsável, Frederik Schaltz-Buchholzer, informou que não foi fornecida a aprovação governamental necessária.", "titulo_pt": "Estudo de vacina contra hepatite b em recém-nascidos africanos, apoiado pelos EUA, é interrompido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216332, "titulo": "Poland’s parliament votes to ease abortion ban but faces likely veto from president", "url": "https://www.theguardian.com/world/2026/oct/21/poland-parliament-votes-ease-abortion-ban-likely-veto-president", "fonte_id": "guardian_world", "data_pub": "2026-10-21T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamento polonês aprovou duas propostas que visam relaxar a proibição quase total de abortos, removendo alguns dos crimes relacionados a quem ajuda as mulheres a terem abortos e permitindo interrupções de gravidezes em casos específicos. No entanto, essas medidas são consideradas um passo pequeno pelos ativistas, que esperam protestos para pressionar o governo a reformar as leis do país.", "titulo_pt": "Parlamento polonês aprova medidas para relaxar banimento de abortos, mas presidente pode vetar", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216326, "titulo": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "url": "https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida", "fonte_id": "guardian_world", "data_pub": "2026-10-21T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Familiares de detentos gravemente doentes em duas prisões de imigração na Flórida relatam que autoridades planejam deportá-los para países desconhecidos na África, apesar das condições médicas agravadas. Voo programado para ocorrer a partir de quarta-feira, segundo relatos de familiares e uma organização de defesa dos trabalhadores.", "titulo_pt": "Detentos gravemente doentes enfrentam iminente deportação para países desconhecidos na áfrica, dizem familiares", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 215010, "titulo": "Polícia usou força \"justificada\" ao atirar em bebê, diz Justiça dos EUA", "url": "https://www.metropoles.com/mundo/policia-usou-forca-justificada-ao-atirar-em-bebe-diz-justica-dos-eua", "fonte_id":
