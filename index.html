o aumento do custo de vida e, especificamente na Alemanha, contra o serviço militar obrigatório.", "titulo_pt": "Geração Z volta a protestar em centenas de cidades da Europa", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 277978, "titulo": "Entenda por que a Geração Z realiza protestos em 25 países da Europa", "url": "https://www.cnnbrasil.com.br/internacional/entenda-por-que-a-geracao-z-realiza-protestos-em-25-paises-da-europa/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jovens em 25 países europeus realizam protestos contra a elevação do custo de vida, aumento dos preços nas instituições de ensino e subfinanciamento dos sistemas educativos.", "titulo_pt": "Entenda por que a Geração Z realiza protestos em 25 países da Europa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 278129, "titulo": "Tiraron gas pimienta en una escuela de Caballito durante un festejo de fin de curso: 35 estudiantes afectados", "url": "https://www.lanacion.com.ar/sociedad/tiraron-gas-pimienta-en-una-escuela-de-caballito-durante-un-festejo-de-fin-de-curso-35-estudiantes-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T20:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um incidente ocorreu na Escola Normal Superior N°4, localizada perto do Parque Rivadavia, durante um evento de encerramento do ano letivo, resultando em 35 estudantes sendo afetados por gas pimenta e sendo evacuados.", "titulo_pt": "Foram usados gases pimenta em uma escola de Caballito durante comemoração de fim de ano: 35 estudantes afetados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 277990, "titulo": "De impostos sobre salários a retrocessos na reforma agrária, medidas de Espriella provocam protestos na Colômbia", "url": "https://www.brasildefato.com.br/2026/11/20/de-impostos-sobre-salarios-a-retrocessos-na-reforma-agraria-medidas-de-espriella-provocam-protestos-na-colombia/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-20T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de colombianos protestaram contra as medidas econômicas, agrárias e de segurança implementadas pelo presidente Abelardo de la Espriella, que completou três meses no cargo. Os protestos foram convocados por centrais sindicais, movimentos populares e organizações de oposição, questionando o aumento de impostos sobre salários, entre outras medidas.", "titulo_pt": "Milhares de colombianos protestam contra medidas do presidente abelardo de la Espriella", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 278022, "titulo": "Diferença salarial na UE: Mulheres trabalharão \"de graça\" até o fim do ano", "url": "https://www.dw.com/pt-br/diferença-salarial-na-ue-mulheres-trabalharão-de-graça-até-o-fim-do-ano/a-80005998?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-20T18:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diferença média de remuneração entre homens e mulheres na União Europeia é de 11,1%. A Alemanha tem um índice ainda maior e é criticada por atrasar a implementação de regras de transparência salarial.", "titulo_pt": "Diferença salarial na UE: mulheres trabalharão 'de graça' até o fim do ano", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 277058, "titulo": "Suspeito de matar namorada a facadas no PR é preso em rodovia de São Paulo", "url": "https://www.metropoles.com/sao-paulo/suspeito-de-matar-namorada-a-facadas-no-pr-e-preso-em-rodovia-de-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-11-20T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi preso em uma rodovia em São Paulo após ser acusado de matar sua namorada a facadas em Paraná. Durante a abordagem policial, o suspeito tentou danificar intencionalmente um aparelho celular.", "titulo_pt": "Suspeito de matar namorada a facadas no PR é preso em rodovia de sp", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 277271, "titulo": "Chile registra 602 trasplantes en lo que va del año. la cifra más alta desde el 2000", "url": "https://www.latercera.com/nacional/noticia/chile-registra-602-trasplantes-en-lo-que-va-del-ano-la-cifra-mas-alta-desde-el-2000/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile registrou 602 trasplantes até o momento deste ano, o número mais alto desde 2000. Além disso, foram realizados 58 trasplantes de coração, também a maior quantidade desde 2019.", "titulo_pt": "Chile registra 602 trasplantes no ano, maior número desde 2000", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 277062, "titulo": "Vídeo: cadela em UTI recebe declaração emocionante de garota de 2 anos", "url": "https://www.metropoles.com/colunas/e-o-bicho/video-cadela-em-uti-recebe-declaracao-emocionante-de-garota-de-2-anos", "fonte_id": "metropoles", "data_pub": "2026-11-20T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma cadela hospitalizada após um envenenamento acidental recebeu uma 'serenata' de sua tutora de 2 anos. O vídeo registra esse momento emocionante.", "titulo_pt": "Vídeo: cadela hospitalizada recebe 'serenata' emocionante de garota de 2 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 278702, "titulo": "China commits to low-carbon electrification and help for others to improve", "url": "https://www.theguardian.com/environment/2026/nov/21/china-commits-low-carbon-electrification-help-others-improve", "fonte_id": "guardian_world", "data_pub": "2026-11-21T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China está incentivando a electrificação rápida de sua economia através de fontes de energia de baixo carbono e prometendo ajudar outros países a fazerem o mesmo. Isso foi dito por um membro sênior da delegação chinesa no Cop31, um evento da ONU sobre clima.", "titulo_pt": "China se compromete com eletrificação de baixo carbono e assistência a outros países", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 278603, "titulo": "La cumbre ambiental COP31 y las diferencias entre Brasil y Argentina", "url": "https://www.clarin.com/rural/cumbre-ambiental-cop31-diferencias-brasil-argentina_0_asZHbwqT4A.html", "fonte_id": "clarin", "data_pub": "2026-11-21T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lula destacou as ações já implementadas, como a adoção de uma gasolina com 30% de etanol a partir de agosto de 2025. A demora na atualização da legislação no Brasil resulta em prejuízos para a sociedade, afetando investimentos e a mitigação de problemas de saúde e meio ambiente.", "titulo_pt": "COP31 e as diferenças entre Brasil e Argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 278799, "titulo": "Fossil fuel row sees COP31 talks spill into overtime", "url": "https://www.euronews.com/2026/11/21/fossil-fuel-row-sees-cop31-talks-spill-into-overtime", "fonte_id": "euronews", "data_pub": "2026-11-21T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias nações, incluindo França e Panamá, enviaram uma carta na sexta-feira, reiterando a necessidade de um acordo que inclua uma transição clara e firme das energias fósseis.", "titulo_pt": "Disputa sobre combustíveis fósseis faz COP31 estender os debates", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 278511, "titulo": "El Niño em SP: até quando paulistas devem sentir os efeitos do fenômeno?", "url": "https://www.metropoles.com/sao-paulo/el-nino-em-sp-ate-quando-paulistas-devem-sentir-os-efeitos-do-fenomeno", "fonte_id": "metropoles", "data_pub": "2026-11-21T05:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas explicam os efeitos do El Niño em todo o estado de São Paulo e fornecem previsões para os próximos meses. O fenômeno está afetando diversas regiões do estado e as previsões indicam que os efeitos podem se manter por algum tempo.", "titulo_pt": "El Niño em SP: até quando os paulistas devem sentir os efeitos do fenômeno?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278771, "titulo": "California's coastal cities battered by rising sea levels and vanishing beaches", "url": "https://www.lemonde.fr/en/international/article/2026/11/21/california-s-coastal-cities-battered-by-rising-sea-levels-and-vanishing-beaches_6785837_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T03:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidades costeiras da Califórnia do Sul enfrentam danos devido a níveis de mar elevados e praias que desaparecem. Em um ano marcado por uma El Niño particularmente poderosa, residências danificadas, inundações, deslizamentos de terra e estradas fechadas são comuns.", "titulo_pt": "Cidades costeiras da califórnia do sul atingidas por níveis de mar elevados e praias que desaparecem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 278103, "titulo": "Temporal mata três, fere 60, destelha 5.000 casas e colapsa luz, telefonia e internet em cidade gaúcha", "url": "https://veja.abril.com.br/brasil/temporal-mata-tres-fere-60-destelha-5-000-casas-e-colapsa-luz-telefonia-e-internet-em-cidade-gaucha/", "fonte_id": "veja", "data_pub": "2026-11-20T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma tempestade causou danos significativos em Tupanciretã, Rio Grande do Sul, resultando em três mortes, 60 feridos, 5.000 casas destelhadas e interrupções nas redes de luz, telefonia e internet. Governos estadual e federal estão mobilizando apoio emergencial.", "titulo_pt": "Temporal causa destruição em tupanciretã, com três mortos, 60 feridos e 5.000 casas destelhadas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278357, "titulo": "El Niño created a skiers' paradise in Chile—now it's Sierra Nevada and southern Rockies' turn", "url": "https://phys.org/news/2026-11-el-nio-skiers-paradise-chile.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "El Niño está causando uma grande quantidade de neve nos Sierra Nevada da Califórnia e nas montanhas do sul dos Rockies, criando condições ideais para esquiadores. No entanto, essa precipitação intensa também pode trazer problemas.", "titulo_pt": "El Niño cria paraíso para esquiadores no Chile - agora é a vez dos Sierra Nevada e Rockies do sul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 277204, "titulo": "Fiona, hipopótamo que viralizou nas redes por nascimento prematuro, morre após engolir gorro de lã em zoológico", "url": "https://www.bbc.com/portuguese/articles/cjn502p90dzxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O hipopótamo Fiona, que virou famoso nas redes sociais por seu nascimento prematuro, morreu após engolir um gorro de lã. Durante as últimas dez dias, o animal passou por tentativas de expelir o objeto.", "titulo_pt": "Fiona, hipopótamo viral nas redes por nascimento prematuro, morre após engolir gorro de lã", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277249, "titulo": "Trabajadores escucharon chillidos en los túneles y cuando fueron a ver de dónde provenían se encontraron con cuatro focas atrapadas", "url": "https://www.lanacion.com.ar/lifestyle/trabajadores-escucharon-chillidos-en-los-tuneles-y-cuando-fueron-a-ver-de-donde-provenian-se-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores ouviram chiados em túneis e, ao investigar, encontraram quatro focas presas em cavernas escurecidas e perigosas. Um grupo que defende a fauna salvou os animais.", "titulo_pt": "Trabalhadores ouviram chiados em túneis e encontraram focas presas em cavernas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 277922, "titulo": "Sem acordo em Antália, COP31 passa do prazo e escancara o desafio de repensar a própria COP", "url": "https://exame.com/esg/sem-acordo-em-antalia-cop31-passa-do-prazo-e-expoe-o-desafio-de-repensar-a-propria-cop/", "fonte_id": "exame", "data_pub": "2026-11-20T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 não chegou a um acordo em Antália, ficando sem texto final e atrasada. Panamá ameaçou barrar o texto final, expôs uma regra que permite a alguns países impedirem a adoção de decisões.", "titulo_pt": "Sem acordo em Antália, COP31 passa do prazo e enfrenta desafio de repensar a própria COP", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277241, "titulo": "Nació una cría de tapir en el Ecoparque porteño: por qué es una buena noticia para una especie amenazada", "url": "https://www.clarin.com/informacion-general/nacio-cria-tapir-ecoparque-porteno-buena-noticia-especie-amenazada_0_XfAyR5owXv.html", "fonte_id": "clarin", "data_pub": "2026-11-20T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Yunga, uma criana de tapir, nasceu no Ecoparque porteño, representando um avanço importante para a conservação de uma espécie ameaçada pela caça furtiva e pela deforestação.", "titulo_pt": "Nasceu uma criana de tapir no Ecoparque porteño: por que é uma boa notícia para uma espécie ameaçada", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 277925, "titulo": "COP31: 'Rússia deve pagar por emissões e danos ambientais da guerra', diz vice-ministro da Ucrânia", "url": "https://exame.com/esg/cop31-russia-deve-pagar-por-emissoes-e-danos-ambientais-da-guerra-diz-vice-ministro-da-ucrania/", "fonte_id": "exame", "data_pub": "2026-11-20T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oleksandr Krasnolutskyi, vice-ministro da Ucrânia, afirmou em entrevista à EXAME durante a COP31 que o clima segue como prioridade do país e que a Rússia deve pagar por suas emissões e danos ambientais causados pela guerra. Ele também criticou as negociações de paz que não chegaram a um acordo.", "titulo_pt": "Ucrânia cobra reparações ambientais da Rússia durante COP31", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277083, "titulo": "Temporal de 114 km/h destelha 5 mil casas no RS; três mortes são investigadas", "url": "https://exame.com/brasil/temporal-de-114-km-h-destelha-5-mil-casas-no-rs-tres-mortes-sao-investigadas/", "fonte_id": "exame", "data_pub": "2026-11-20T13:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um temporal com velocidade de 114 km/h destelhou cerca de 5 mil casas no Rio Grande do Sul, deixando 60 feridos e interrompendo serviços essenciais. O governo gaúcho destinou R$ 2 milhões para a situação.", "titulo_pt": "Temporal de 114 km/h destelha 5 mil casas no RS; 60 feridos e r$ 2 milhões liberados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277128, "titulo": "Venezuela apresenta na COP31 modelo próprio de participação comunitária na proteção ambiental", "url": "https://www.brasildefato.com.br/2026/11/20/venezuela-apresenta-na-cop31-modelo-proprio-de-participacao-comunitaria-na-protecao-ambiental/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-20T13:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Venezuela apresenta um modelo próprio de participação comunitária na proteção ambiental e combate às mudanças climáticas, através de projetos locais e políticas de conservação do território. Essa iniciativa foi apresentada pelo ministro do Poder Popular para o Ecosocialismo, Nelson Rodríguez, durante a 31ª Conferência das Nações Unidas.", "titulo_pt": "Venezuela apresenta modelo de participação comunitária na proteção ambiental na COP31", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 276629, "titulo": "Video shows isolated Awá Indigenous people make contact with government team in Brazil", "url": "https://www.euronews.com/2026/11/20/video-shows-isolated-awa-indigenous-people-make-contact-with-government-team-in-brazil", "fonte_id": "euronews", "data_pub": "2026-11-20T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 20 membros do grupo indígena isolado Awá no Amazonas se aproximaram de uma unidade do governo, pedindo yamãs antes de retornarem à floresta. O encontro raro levanta preocupações sobre a saúde e a possível falta de alimentos dos indígenas.", "titulo_pt": "Vídeo mostra membros isolados do povo Awá entrando em contato com equipe do governo no amazonas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276587, "titulo": "Climate crisis is already reshaping global tourism, top destinations remain unprepared, study finds", "url": "https://www.lemonde.fr/en/economy/article/2026/11/20/climate-crisis-is-already-reshaping-global-tourism-top-destinations-remain-unprepared-study-finds_6785143_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-20T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório Destination Climate RiskScan analisa 2.600 regiões em 263 países e conclui que o risco associado às altas temperaturas está intensificando, exigindo adaptação do setor turístico e redução das emissões de gases de efeito estufa, que estão em aumento.", "titulo_pt": "Crise climática já está remodelando o turismo global, destinos principais não se prepararam, estudo aponta", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 278667, "titulo": "Avanza el ICE en Texas: un nuevo condado firmó un acuerdo de colaboración con la agencia migratoria", "url": "https://www.lanacion.com.ar/estados-unidos/texas/avanza-el-ice-en-texas-un-nuevo-condado-firmo-un-acuerdo-de-colaboracion-con-la-agencia-migratoria-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T09:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O condado de Travis, no Texas, assinou um acordo com o ICE, permitindo que um oficial carcelário execute ordens migratórias civis dentro da prisão. Mais um condado se juntou à colaboração com a agência de imigração.", "titulo_pt": "Avanço do ICE no Texas: novo condado firma acordo de colaboração com a agência migratória", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278496, "titulo": "O Brasil racista", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/o-brasil-racista", "fonte_id": "metropoles", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete discute o tema do racismo no Brasil. O título original 'O Brasil racista' sugere que o questionário aborda questões relacionadas à discriminação racial no país.", "titulo_pt": "O Brasil racista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278888, "titulo": "French Senate approves police shootings law dubbed ‘licence to kill’ by critics", "url": "https://www.scmp.com/news/world/europe/article/3375320/french-senate-approves-police-shootings-law-dubbed-licence-kill-critics", "fonte_id": "scmp", "data_pub": "2026-11-21T06:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado francês aprovou uma lei que presume que policiais que usam armas estão agindo legalmente, com votos de 205 a 110. A proposta, que foi criticada por parlamentares de esquerda, concede aos policiais um benefício de dúvida no caso de mortes por disparos, a menos que haja provas contrárias.", "titulo_pt": "Senado francês aprova lei que presume legalidade de disparos policiais, chamada de 'licença para matar' pelos críticos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278832, "titulo": "Three French police officers sentenced over racist assault on Black man", "url": "https://www.aljazeera.com/news/2026/11/21/three-french-police-officers-sentenced-over-racist-assault-on-black-man?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T03:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses foram condenados por um ataque racista contra o produtor musical Michel Zecler em 2020. O tribunal criminal de Paris considerou que o racismo foi um fator agravante no caso.", "titulo_pt": "Três policiais franceses condenados por ataque racista a produtor musical", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278774, "titulo": "La Suprema desmantela la “doctrina Rabat”", "url": "https://www.ciperchile.cl/2026/11/20/la-suprema-desmantela-la-doctrina-rabat/?utm_source=rss&utm_medium=rss&utm_campaign=la-suprema-desmantela-la-doctrina-rabat", "fonte_id": "ciper_chile", "data_pub": "2026-11-21T02:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte desmontou a 'doctrina Rabat'. O título original foi publicado inicialmente no CIPER Chile.", "titulo_pt": "A Suprema desmonta a 'doctrina Rabat'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 278767, "titulo": "Police beating of Black music producer: Court recognizes racist nature of violence, sentences officers to prison, raising hopes for new legal precedent", "url": "https://www.lemonde.fr/en/france/article/2026/11/21/police-beating-of-black-music-producer-court-recognizes-racist-nature-of-violence-sentences-officers-to-prison-raising-hopes-for-new-legal-precedent_6785803_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T01:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um produtor musical negro foi agredido pela polícia em 2020, fora de seu estúdio de música, e os policiais relataram posteriormente que ele os atacou. Entretanto, a gravação de segurança contradiz essa versão dos fatos.", "titulo_pt": "Agressão policial contra produtor musical negro: tribunal reconhece natureza racista da violência, sentenciando policiais a prisão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 278862, "titulo": "Myanmar genocide judgment may bolster Gaza case against Israel", "url": "https://www.japantimes.co.jp/news/2026/11/21/world/crime-legal/myanmar-ruling-bolster-gaza-case/", "fonte_id": "japan_times", "data_pub": "2026-11-21T01:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O julgamento que estabeleceu que intenção genocida pode coexistir com um objetivo militar pode fortalecer o caso de Gaza contra Israel. Especialistas em direito acreditam que esse julgamento estabelece um precedente importante.", "titulo_pt": "Julgamento sobre genocídio pode fortalecer caso de Gaza contra Israel", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 278709, "titulo": "French police officers found guilty of racist assault on black music producer", "url": "https://www.theguardian.com/world/2026/nov/20/french-police-officers-found-guilty-of-racist-assault-on-black-music-producer", "fonte_id": "guardian_world", "data_pub": "2026-11-20T22:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses foram condenados por violência intencional e racista após agredirem Michel Zecler, um produtor musical negro, em 2020. O incidente foi filmado nas câmeras de segurança do prédio onde Zecler morava e causou indignação na França sobre a brutalidade policial.", "titulo_pt": "Policiais franceses condenados por agressão racista a produtor musical negro", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 278094, "titulo": "Ativista britânico de extrema direita é preso por atacar bote de migrantes", "url": "https://veja.abril.com.br/mundo/ativista-britanico-de-extrema-direita-e-preso-por-atacar-bote-de-migrantes/", "fonte_id": "veja", "data_pub": "2026-11-20T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Thomas, um ativista britânico de extrema direita, foi condenado a 15 meses de prisão por perfurar uma embarcação inflável usada para transportar migrantes pelo Canal da Mancha com uma faca.", "titulo_pt": "Ativista britânico de extrema direita é condenado por atacar bote de migrantes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278274, "titulo": "Gaza’s displaced children celebrate World Children’s Day", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/gazas-displaced-children-celebrate-world-childrens-day?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças deslocadas se reuniram no acampamento de refugiados al-Nuseirat para celebrar o Dia das Crianças.", "titulo_pt": "Crianças deslocadas comemoram dia internacional da criança em acampamento de refugiados", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278275, "titulo": "Sudan’s war leaves disabled children missing out on education", "url": "https://www.aljazeera.com/news/2026/11/20/sudans-war-leaves-disabled-children-missing-out-on-education?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guerra obriga as escolas e centros de reabilitação a fecharem, deixando crianças com deficiências sem acesso à educação.", "titulo_pt": "Guerra deixa crianças com deficiências sem acesso à educação no sudão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278104, "titulo": "‘Não está funcionando’: Condenado gritou de dor durante execução que levou mais de uma hora nos EUA", "url": "https://veja.abril.com.br/mundo/nao-esta-funcionando-condenado-gritou-de-dor-durante-execucao-que-levou-mais-de-uma-hora-nos-eua/", "fonte_id": "veja", "data_pub": "2026-11-20T19:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um condenado gritou de dor durante uma execução que durou mais de uma hora nos Estados Unidos, levando a novos pedidos pela suspensão das execuções por injeção letal no país.", "titulo_pt": "‘Não está funcionando’: condenado gritou de dor durante execução que levou mais de uma hora nos EUA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278954, "titulo": "Remarks by UNICEF Executive Director, Catherine Russell at the roundtable conversation at Nasdaq Headquarters on World Children’s Day: Child-lens investing in capital markets", "url": "https://www.unicef.org/press-releases/remarks-unicef-executive-director-catherine-russell-roundtable-conversation-nasdaq", "fonte_id": "unicef", "data_pub": "2026-11-20T18:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora executiva do UNICEF, Catherine Russell, participou de uma conversa circular sobre World Children's Day na sede da Nasdaq, focando em investimentos através da perspectiva infantil nos mercados de capitais.", "titulo_pt": "Comentários da diretora executiva do UNICEF, Catherine Russell, na conversa circular sobre World children's Day na sede da Nasdaq sobre investimentos com foco na infância nos mercados de capitais", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 278202, "titulo": "A Moment of New Hope for the Rohingya Community", "url": "https://thediplomat.com/2026/11/a-moment-of-new-hope-for-the-rohingya-community/", "fonte_id": "the_diplomat", "data_pub": "2026-11-20T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Refugiados rohingya que passaram quase uma década em acampamentos lotados finalmente vêem justiça com a decisão do TC. Agora, eles esperam por ações significativas que permitam seu retorno à casa.", "titulo_pt": "Um momento de esperança nova para a comunidade Rohingya", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 277205, "titulo": "Homem gritou de dor em execução que durou uma hora no Texas, nos Estados Unidos", "url": "https://www.bbc.com/portuguese/articles/c84gn75r49eno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem gritou de dor durante uma execução que durou uma hora no Texas, EUA, semanas após uma mulher de 50 anos sobreviver a duas injeções letais no Tennessee. O uso de pentobarbital, proibido federalmente nos EUA, ainda é utilizado em alguns estados.", "titulo_pt": "Homem gritou de dor em execução que durou uma hora no Texas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277583, "titulo": "One third of attacks on children worldwide recorded in Palestine", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/one-third-of-attacks-on-children-worldwide-recorded-in-palestine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, um terço das violações registradas contra crianças em todo o mundo ocorreram em Palestina.", "titulo_pt": "Um terço dos ataques a crianças mundialmente registrados em 2025 ocorreram em palestina", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 278958, "fonte_id": "artnews", "titulo": "Maren Hassinger Won’t Be Weighed Down", "url": "https://www.artnews.com/art-in-america/aia-reviews/maren-hassinger-bampfa-retrospective-berkeley-1234806748/", "data_pub": "2026-11-21T10:00:00Z", "topico": "cultura", "idioma": "en", "titulo_pt": "Maren Hassinger não será pesação", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 278752, "fonte_id": "bbc_world", "titulo": "Fight over fossil fuels leaves COP31 climate talks in deadlock", "url": "https://www.bbc.co.uk/news/ const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
