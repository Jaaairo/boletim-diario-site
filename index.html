<script>
const D = {"gerado_em": "30/07/2026 20:41", "stats": {"noticias_novas": 218, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Ajustes na concessão de serviços públicos e investigações judiciais continuam a influenciar o cenário político e econômico do Brasil. O Tribunal de Justiça da Bahia negou um pedido para reajustar uma concessão em Salvador, envolvendo R$ 2,678 bilhões por 20 anos. Em outro caso judicial, o ministro André Mendonça autorizou a Polícia Federal a investigar Lulinha, filho do ex-presidente Luiz Inácio Lula da Silva, suspeito de tráfico de influência no Ministério da Saúde. A decisão foi tomada em resposta a um pedido da PF e seguiu críticas recebidas. O Partido dos Trabalhadores (PT) e o União Brasil negaram ao Supremo Tribunal Federal que os presidentes dos partidos tenham controle sobre as emendas, prazo para as respostas terminando em 19 de agosto. A campanha do petista planeja gravar vídeos dele apoiando candidatos após as convenções. Por outro lado, o governador Ronaldo Caiado, que busca a presidência, alterou sua estratégia de campanha para atrair votos do candidato Flávio Bolsonaro e pretende se enfrentar com Lula no segundo turno das eleições.", "mundo": "O presidente dos Estados Unidos, Joe Biden, anunciou que um acordo de desarmamento com o Hamas foi alcançado após negociações mediadas pelo Egito, Catar e Turquia. Este acordo visa pôr fim ao conflito entre Israel e Hamas na Faixa de Gaza. As negociações também incluem a retirada das forças israelenses do território. Em contraste, um incêndio no presídio de Sassari, na Itália, resultou em mortes e feridos. Além disso, o conflito entre Estados Unidos e Irã continua envolvendo mais países do Oriente Médio, com novas ondas de ataques americanos aumentando as preocupações sobre um possível conflito maior. Na Europa, condições climáticas extremas, como incêndios florestais e calor, afetaram várias viagens e levantaram preocupações sobre mudanças climáticas. No Marrocos, milhares de migrantes continuam a entrar na cidade espanhola de Ceuta, criando tensões políticas.\n\nOs Estados Unidos e o Irã continuam a aumentar as tensões militares, realizando lançamentos de mísseis. Este conflito prolongado tem levantado preocupações sobre uma escalada ainda maior entre as duas nações. Em outro desenvolvimento geopolítico significativo, Israel demoliu estruturas perto de um sítio histórico da UNESCO no Líbano, o que pode agravar tensões regionais e levar a mais confrontos. Além disso, a Arábia Saudita planeja uma ofensiva militar contra os hutis no Iêmen, com potenciais operações navais e terrestres. Israel também anunciou o uso de crocodilos-nilo como guardas prisionais para presos palestinos políticos. Estes eventos refletem a complexidade da situação geopolítica global atual, marcada por conflitos regionais intensificados e ações militares que podem levar ao aumento das tensões internacionais.", "economia": "O lucro líquido da Vale diminuiu 35% no segundo trimestre, para US$ 1,37 bilhão, devido a aumentos nos custos e perdas cambiais. Por outro lado, a Delta Electronics espera um aumento nas receitas. A arrecadação federal no primeiro semestre atingiu R$ 1,6 trilhão, com uma elevação de 370% na receita com petróleo. O Ibovespa registrou forte valorização após a divulgação de dados econômicos nos Estados Unidos, influenciado pela atratividade do capital estrangeiro para o mercado brasileiro. A justiça aprovou o plano de recuperação extrajudicial da Raízen, que visa reestruturar uma dívida de R$ 61,4 bilhões através da conversão de créditos em ações e desinvestimentos. O dólar caiu ao menor nível em quase dois meses, impulsionado pelo enfraquecimento do dólar norte-americano e pela entrada de capital estrangeiro. O BNDES aprovou um crédito de R$ 8 bilhões para companhias aéreas brasileiras, auxiliando-as no aumento dos combustíveis causados pela guerra no Oriente Médio.", "tecnologia": "A Apple anunciou que o crescimento do seu serviço foi afetado por uma diminuição nas atividades de jogos móveis e mudanças no modelo de negócios da App Store, mas a empresa atingiu a marca de 1,5 bilhão de assinaturas pagas. Tim Cook sugeriu que a Apple pode oferecer um nível superior para o iCloud Plus, permitindo maior uso de inteligência artificial (IA). A Amazon aumentou suas despesas com infraestrutura de IA para US$ 220 bilhões este ano e obteve aprovação federal dos Estados Unidos para lançar seu serviço comercial de táxis robôs sem volante em Las Vegas. A OpenAI reduziu os preços de seus modelos de inteligência artificial mais acessíveis para concorrer com versões chinesas, enquanto a Microsoft aumentou seu valor de mercado em US$ 450 bilhões em um único pregão, quase quatro vezes o valor da Petrobras. A indústria de IA está causando problemas na internet e empresas como LinkedIn introduziram novas maneiras de reduzir posts de baixa qualidade gerados por IA. Além disso, a Apple projeta crescimento mais lento devido ao investimento em inteligência artificial, enquanto a Amazon planeja aumentar seus gastos de capital para US$ 220 bilhões este ano, devido a maiores custos de memória. A Microsoft e a Google estão encontrando e corrigindo um número crescente de bugs no Chrome graças ao uso de IA.", "ciencia": "Um estudo recente publicado na revista Scientific Reports mostra que o risco de incêndios florestais no sul da Europa dobrou desde os anos 1980, devido a condições climáticas mais quentes e secas. Esse aumento é particularmente preocupante para países como Grécia, Itália, França e Espanha, que já enfrentam piores incêndios recentemente. Paralelamente, cientistas do Instituto Indiano de Ciência (IISc) desenvolveram um método inovador para controlar a magnetização de materiais eletricamente, o que pode levar ao desenvolvimento de dispositivos mais eficientes e compactos no futuro. Além disso, pesquisas em diversos campos da ciência, como a identificação do genoma do primeiro vírus de varíola que chegou às Américas, o desenvolvimento de um novo antiveneno para serpentes venenosas e o uso de luz refletida em troncos de árvores para detectar aerossóis químicos, mostram avanços significativos que podem ter impacto direto na saúde pública e no ambiente.", "cultura": "A morte do escritor japonês Keigo Higashino levou a um aumento nas vendas de seus livros na Taiwan, elevando-os para posições altas nas listas de best-sellers locais. Em outro destaque cultural, o filme 'Homem-Aranha: Um Novo Dia' estreou com grande sucesso no Brasil, arrecadando R$ 23,6 milhões em seu primeiro dia e se tornando a segunda maior estreia na história do país. A série 'Não Saia Com Brandon', da Netflix, enfrenta críticas por sua abordagem superficial de temas feministas. A artista americana Simone Forti faleceu aos 91 anos, deixando uma rica contribuição para o mundo das artes e performances. Em um desenvolvimento cultural na Argentina, o governo dissolveu o Coro Nacional de Niños, um importante organismo artístico fundado em 1967, através de um decreto publicado no Boletim Oficial. A série 'As Patricinhas de Beverly Hills' terá uma sequência na plataforma Paramount+, com Alicia Silverstone retornando como Cher Horowitz.", "sociedade": "O Rio de Janeiro registrou danos e perdas após um forte vendaval que atingiu a cidade. O Corpo de Bombeiros atendeu 264 ocorrências, enquanto a prefeitura relatou 25 quedas de árvores. Até o momento, cerca de 600 mil pessoas no estado ainda não têm energia elétrica, conforme informado pelo governo do Rio de Janeiro. Em São Paulo, os policiais militares Renato Torquatto e Robson Noguchi estão na fase final dos debates do júri popular após serem acusados da morte de um jovem durante uma operação policial em 2024. No Brasil, foram registrados mais de 10 mil casos de estupro no primeiro semestre de 2026, correspondendo a uma média de cerca de 57 ocorrências por dia. Em outro incidente, um morador de rua foi encontrado com queimaduras de segundo grau após acordar para encontrar seu corpo em chamas, levando à investigação policial.", "meio_ambiente": "A Europa enfrenta um verão extremo com incêndios florestais e secas sem precedentes. De acordo com relatos, as condições climáticas quentes, secas e ventosas estão 43% mais severas do que a média dos últimos 20 anos, resultando em uma maior intensidade de incêndios no Mediterrâneo. Em Castellón, Espanha, um drone capturou imagens de um fogo devastador, enquanto na Grécia, duas mortes foram registradas entre bombeiros lutando contra as chamas em Creta. Na França, a seca atinge o centro do país, com apenas três dos 35 riachos monitorados pelo Serviço Francês de Biodiversidade ainda fluindo, criando um cenário desolador. Em contraste, na Alemanha, quase 10 mil mortes foram relacionadas ao calor extremo, principalmente entre pessoas idosas. Além disso, o garimpo ilegal e a degradação dos sistemas aquáticos da Amazônia estão afetando os rios e lagos da região, causando danos sutis mas significativos ao ecossistema. No entanto, um relatório do Carbon Brief refuta a ideia de que este é o ano mais calmo em termos de incêndios florestais na Europa.", "direitos_humanos": "Nove imigrantes morreram ao tentarem cruzar a fronteira entre Marrocos e Espanha, conforme relatou a CNN Brasil. Este caso levanta preocupações sobre as condições perigosas enfrentadas pelos migrantes em suas jornadas. Em outro desenvolvimento, o governo do Chile anunciou que incluirá a reconstrução de Atacama no orçamento de 2027 após condenar Álvaro Jalaff a cinco anos de liberdade vigilada. Além disso, Pavel Durov, fundador do Telegram, foi incluído na lista de 'terroristas e extremistas' pela Rússia, conforme informou o Exame. Estes eventos refletem questões cruciais em direitos humanos, como segurança, justiça e liberdade."}, "resumo_do_dia": {"politica_nacional": [{"id": 83148, "titulo": "Justiça nega pedido e mantém suspensão de reajuste de concessão de R$ 2,67 bi em Salvador", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/justica-nega-pedido-e-mantem-suspensao-de-reajuste-de-concessao-de-r-267-bi-em-salvador.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T22:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Justiça da Bahia negou o pedido da Battre para retomar os pagamentos reajustados pela Prefeitura de Salvador referentes à concessão do Aterro Metropolitano Centro e da Estação de Transbordo de Salvador. O contrato envolve um valor de R$ 2,678 bilhões por 20 anos.", "titulo_pt": "Justiça nega pedido e mantém suspensão de reajuste de concessão de R$ 2,67 bi em Salvador", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 83184, "titulo": "Zema acusa Marcelo Aro de traição e de fazer “acordos pelas costas”", "url": "https://www.metropoles.com/minas-gerais/zema-acusa-marcelo-aro-de-traicao-e-de-fazer-acordos-pelas-costas", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marcelo Aro foi secretário de Governo e da Casa Civil no governo de Romeu Zema por aproximadamente três anos. Zema acusa Aro de traição e de fazer 'acordos pelas costas'.", "titulo_pt": "Zema acusa Aro de traição e de fazer ‘acordos pelas costas’", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83185, "titulo": "Deputado pede que MPSP investigue esposa de Ramuth, vice de Tarcísio", "url": "https://www.metropoles.com/sao-paulo/mpsp-investigue-esposa-ramuth", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Emídio de Souza (PT) solicitou à MPSP que investigue a esposa do vice-governador, Vanessa Ramuth, sobre sua evolução patrimonial e atividades empresariais.", "titulo_pt": "Deputado pede investigação da esposa do vice-governador", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83190, "titulo": "Justiça vê risco de novas fraudes e mantém donos da Naskar presos", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/justica-ve-risco-de-novas-fraudes-e-mantem-donos-da-naskar-presos", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça decidiu manter os donos da Naskar presos, considerando o risco de novas fraudes. A decisão também menciona que parte da estrutura empresarial investigada ainda está ativa.", "titulo_pt": "Justiça mantém donos da Naskar presos por risco de novas fraudes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83211, "titulo": "TCU envia ao Senado processos sobre atuação da CVM no caso Master", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/tcu-envia-ao-senado-processos-sobre-atuacao-da-cvm-no-caso-master/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Contas da União enviou processos relacionados à atuação da Comissão de Valores Mobiliários (CVM) no caso Master ao Senado. A comissão econômica do Senado planeja analisar os casos arquivados sobre o controle da CVM sobre as empresas Master e Ambipar.", "titulo_pt": "TCU envia ao Senado processos sobre atuação da CVM nos casos Master e ambipar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83192, "titulo": "Advogado de Lulinha critica novo inquérito: \"Pesca probatória\"", "url": "https://www.metropoles.com/colunas/igor-gadelha/advogado-de-lulinha-critica-novo-inquerito-pesca-probatoria", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Marco Aurélio de Carvalho criticou o novo inquérito sobre o caso INSS, afirmando que a investigação anterior não encontrou elementos contra Lulinha. Ele também se posicionou negativamente em relação ao novo procedimento.", "titulo_pt": "Advogado de Lulinha critica novo inquérito do caso inss", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83215, "titulo": "Campanha quer gravar vídeos de Lula em apoio a candidatos após convenções", "url": "https://www.cnnbrasil.com.br/eleicoes/campanha-quer-gravar-videos-de-lula-em-apoio-a-candidatos-apos-convencoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha do petista planeja gravar vídeos dele apoiando candidatos após as convenções. As gravações ocorrerão no QG de sua campanha localizado no Lago Sul, em Brasília, onde também serão produzidos seus programas de TV e rádio.", "titulo_pt": "Campanha quer gravar vídeos de Lula apoiando candidatos após convenções", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83218, "titulo": "PT e União Brasil negam ao STF controle de presidentes sobre emendas", "url": "https://www.cnnbrasil.com.br/politica/pt-e-uniao-brasil-negam-ao-stf-controle-de-presidentes-sobre-emendas/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) e o União Brasil negaram ao Supremo Tribunal Federal (STF) que os presidentes de seus partidos tenham controle sobre a destinação das emendas. O prazo para as legendas fornecerem respostas termina em 19 de agosto.", "titulo_pt": "PT e União Brasil negam controle dos presidentes sobre emendas ao STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 82610, "titulo": "Mendonça autoriza investigação contra Lulinha por suspeita de tráfico de influência", "url": "https://veja.abril.com.br/brasil/mendonca-autoriza-investigacao-contra-lulinha-por-suspeita-de-trafico-de-influencia/", "fonte_id": "veja", "data_pub": "2026-07-30T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF, André Mendonça, autorizou a investigação contra Lulinha por suspeita de tráfico de influência. A decisão foi tomada em resposta a um pedido da Polícia Federal, resultado de uma investigação anterior sobre o INSS.", "titulo_pt": "Mendonça autoriza investigação contra Lulinha por suspeita de tráfico de influência", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82552, "titulo": "Entenda a investigação da PF envolvendo Lulinha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/entenda-a-investigacao-da-pf-envolvendo-lulinha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF André Mendonça autorizou a abertura de um inquérito para investigar suspeitas envolvendo o empresário Fábio Luís Lula da Silva, conhecido como Lulinha. A investigação foi solicitada pela Polícia Federal.", "titulo_pt": "Entenda a investigação do stf envolvendo Lulinha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 82553, "titulo": "Augusto Cury diz que convidou Zema para ser seu vice", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/augusto-cury-diz-que-convidou-zema-para-ser-seu-vice.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O escritor Augusto Cury, pré-candidato à Presidência pelo Avante, telefonou para Romeu Zema do Novo convidando-o para ser seu vice.", "titulo_pt": "Augusto Cury diz ter convidado Zema para ser seu vice", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 82594, "titulo": "Inquérito contra Lulinha é resposta da PF às críticas da oposição e dentro do próprio STF", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/07/30/inquerito-contra-lulinha-e-resposta-da-pf-as-criticas-da-oposicao-e-dentro-do-proprio-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal abriu um inquérito para investigar suspeitas de tráfico de influência envolvendo Fábio Luiz Lula da Silva, conhecido como Lulinha. A medida foi tomada em resposta a críticas recebidas e autorizada pelo ministro André Mendonça do STF.", "titulo_pt": "Inquérito contra Lulinha é resposta à PF às críticas da oposição e dentro do próprio STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 82644, "titulo": "Cúpula do PP rachaça possibilidade de Tereza Cristina ser vice de Flávio", "url": "https://www.metropoles.com/colunas/igor-gadelha/cupula-do-pp-rachaca-possibilidade-de-tereza-cristina-ser-vice-de-flavio", "fonte_id": "metropoles", "data_pub": "2026-07-30T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A liderança do PP questiona a intenção de Tereza Cristina se aliar a Flávio como vice, reafirmando a postura neutra da legenda. A cúpula do partido não compreende o movimento e mantém sua decisão.", "titulo_pt": "Liderança do PP desentende aliança de Tereza Cristina com Flávio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 82612, "titulo": "Tereza Cristina, sobre ser vice de Flávio: ‘Nada está decidido’", "url": "https://veja.abril.com.br/politica/tereza-cristina-sobre-ser-vice-de-flavio-nada-esta-decidido/", "fonte_id": "veja", "data_pub": "2026-07-30T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tereza Cristina disse que aceitaria ser vice de Flávio Bolsonaro, mas ressaltou que nada está decidido. A decisão depende do aval da Federação União Progressista.", "titulo_pt": "Tereza Cristina sobre ser vice de Flávio: 'nada está decidido'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82645, "titulo": "Padre é suspenso por diocese após lançar candidatura a deputado federal", "url": "https://www.metropoles.com/sao-paulo/padre-e-suspenso-por-diocese-apos-lancar-candidatura-a-deputado-federal", "fonte_id": "metropoles", "data_pub": "2026-07-30T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um padre foi suspenso pela diocese após lançar sua candidatura a deputado federal. A diocese afirmou que a conduta do religioso está em desacordo com a legislação da Igreja Católica e o proibiu de realizar missas.", "titulo_pt": "Padre é suspenso por diocese após lançar candidatura a deputado federal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 82646, "titulo": "Mendonça, do STF, autoriza PF a abrir inquérito contra Lulinha", "url": "https://www.metropoles.com/colunas/manoela-alcantara/mendonca-do-stf-autoriza-pf-a-abrir-inquerito-contra-lulinha", "fonte_id": "metropoles", "data_pub": "2026-07-30T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) Alexandre de Moraes autorizou a Polícia Federal a abrir um inquérito contra Lulinha, filho do ex-presidente Luiz Inácio Lula da Silva. O empresário manteve contatos com o conhecido como Careca do INSS para avançar em um projeto relacionado à cannabis medicinal.", "titulo_pt": "Mendonça, do STF, autoriza PF a abrir inquérito contra Lulinha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 82317, "titulo": "US and Iran trade missile barrages as war drags on", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/31/2003861687", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e Irã trocaram lançamentos de mísseis, com a guerra prolongada se estendendo.", "titulo_pt": "EUA e Irã trocam lançamentos de mísseis enquanto guerra persiste", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 82330, "titulo": "Supreme Court rejects two appeals in TSMC leak case", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861704", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal rejeitou duas apelocações no caso de vazamento da TSMC.", "titulo_pt": "Supremo tribunal rejeita dois apelos no caso de vazamento da TSMC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 83150, "titulo": "Trump anuncia conclusão de acordo para desarmamento do Hamas em Gaza", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/trump-anuncia-conclusao-de-acordo-para-desarmamento-do-hamas-em-gaza.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-30T22:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que o 'Conselho da Paz', grupo criado para negociar um acordo de desarmamento do Hamas na Faixa de Gaza, chegou a um acordo. O acordo visa ao fim do conflito entre Israel e Hamas.", "titulo_pt": "Trump anuncia acordo para desarmamento do Hamas em Gaza", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 83223, "titulo": "Trump diz que Conselho da Paz chegou a acordo sobre desarmamento em Gaza", "url": "https://www.infomoney.com.br/mundo/trump-diz-que-conselho-da-paz-chegou-a-acordo-sobre-desarmamento-em-gaza/", "fonte_id": "infomoney", "data_pub": "2026-07-30T22:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que o Conselho da Paz atingiu um acordo sobre desarmamento em Gaza. O acordo faz parte de um plano com 20 pontos e inclui a remoção das Forças israelenses.", "titulo_pt": "Trump afirma que Conselho da Paz chegou a acordo sobre desarmamento em Gaza", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 83329, "titulo": "Trump, 'accordo storico su disarmo completo di Hamas, Israele uscirà da Gaza'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/trump-accordo-storico-su-disarmo-completo-di-hamas-israele-uscira-da-gaza_a6947e9e-1956-4dc3-bf89-b9e95c8ba5be.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T22:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Trump negociou um acordo histórico de desarmamento completo com Hamas, permitindo que Israel saia de Gaza. No entanto, isso ocorrerá apenas após o completamento do desarmamento.", "titulo_pt": "Trump, acordo histórico sobre desarmamento completo com Hamas; israel sairá de Gaza", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 83182, "titulo": "Trump diz que Hamas aceitou se desarmar na Faixa de Gaza", "url": "https://www.metropoles.com/mundo/trump-diz-que-hamas-aceitou-se-desarmar-na-faixa-de-gaza", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou que o Hamas aceitou um acordo para se desarmar completamente após a mediação de Egito, Catar e Turquia.", "titulo_pt": "Trump diz que Hamas aceitou se desarmar na Faixa de Gaza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83330, "titulo": "Incendio nel carcere di Sassari, detenuto muore carbonizzato", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/incendio-nel-carcere-di-sassari-detenuto-muore-carbonizzato_09e7f58e-3f02-47bd-a000-f10221e73ce0.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T22:47:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu no presídio de Sassari, na Itália. Um detento de 72 anos faleceu carbonizado e cinco agentes ficaram intoxicados.", "titulo_pt": "Incêndio em presídio de Sassari: detento morre carbonizado e cinco agentes ficam intoxicados", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 83321, "titulo": "Pakistan says US-Iran talks still alive despite fresh wave of US strikes", "url": "https://www.france24.com/en/middle-east/20260730-pakistan-says-us-iran-talks-still-alive-despite-fresh-wave-of-us-strikes", "fonte_id": "france24", "data_pub": "2026-07-30T22:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pakistan afirma que as negociações entre Estados Unidos e Irã continuam, apesar de novas ondas de ataques americanos. O aumento das hostilidades tem ampliado as preocupações com o risco de um conflito mais amplo na região, com o Egito sendo atingido pela primeira vez e estados do Golfo buscando proteger suas rotas marítimas cruciais.", "titulo_pt": "Paquistão afirma que negociações entre EUA e Irã continuam, mesmo com novos ataques", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 83158, "titulo": "Espanha aciona militares após migração de marroquinos; veja vídeo", "url": "https://www.poder360.com.br/poder-internacional/espanha-aciona-militares-apos-migracao-de-marroquinos-veja-video/", "fonte_id": "poder360", "data_pub": "2026-07-30T22:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entre 2.000 e 3.000 pessoas cruzaram a fronteira entre Marrocos e Ceuta, uma cidade autônoma da Espanha no norte da África. O governo regional de Ceuta acionou o estado de emergência.", "titulo_pt": "Espanha ativa militares após migração massiva de marroquinos; veja vídeo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 83322, "titulo": "Climate change made France, Spain wildfire conditions far more likely, scientists say", "url": "https://www.france24.com/en/europe/20260730-climate-change-made-france-spain-wildfire-conditions-far-more-likely-scientists-say", "fonte_id": "france24", "data_pub": "2026-07-30T22:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas alertam que condições mais quentes e secas estão tornando as estações de incêndios florestais severas cada vez mais frequentes na Europa. Pesquisadores afirmam que mudanças climáticas fizeram as condições para incêndios em França e Espanha muito mais prováveis.", "titulo_pt": "Cientistas dizem que mudanças climáticas tornaram as condições de incêndio florestal mais propícias na Europa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 83208, "titulo": "Trump diz que há acordo para desarmar Hamas e outros grupos de Gaza", "url": "https://www.cnnbrasil.com.br/internacional/trump-diz-que-ha-acordo-para-desarmar-hamas-e-outros-grupos-de-gaza/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que há um acordo para desarmar o Hamas e outros grupos de Gaza. A medida faz parte de um plano de 20 pontos que inclui a remoção das Forças israelenses do território.", "titulo_pt": "Trump afirma haver acordo para desarmar Hamas e outros grupos de Gaza", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83269, "titulo": "Iran War Is Entangling a Growing List of Mideast Nations", "url": "https://www.nytimes.com/2026/07/30/world/middleeast/us-iran-war-expansion.html", "fonte_id": "nyt_world", "data_pub": "2026-07-30T22:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guerra entre os Estados Unidos e Irã está envolvendo um número crescente de nações do Oriente Médio. Mais países estão sendo afetados e alguns estão se juntando aos conflitos.", "titulo_pt": "Guerra entre EUA e Irã envolve cada vez mais países do oriente médio", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 83327, "titulo": "Israel carries out demolitions near Unesco site in Lebanon", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-carries-out-demolitions-near-unesco-site-lebanon", "fonte_id": "middle_east_eye", "data_pub": "2026-07-30T22:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou demolições perto de um sítio da UNESCO na Libéria, destruindo várias características importantes supostamente relacionadas a uma rede subterrânea de túneis sob uma colina que abriga o castelo histórico Beaufort, localizado há 900 anos. O castelo medieval, conhecido em árabe como Qalaat al-Shaqif, é um ponto estratégico que domina partes significativas do sul da Libéria e norte de Israel.", "titulo_pt": "Israel realiza demolições perto de sítio da Unesco na libéria", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 83314, "titulo": "Misil ruso destruye fábrica de drones de una empresa estadounidense en Kiev", "url": "https://www.latercera.com/mundo/noticia/misil-ruso-destruye-fabrica-de-drones-de-una-empresa-estadounidense-en-kiev/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T22:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um míssil russo atingiu uma fábrica de drones pertencente a uma empresa americana em Kiev no dia 24 de julho. Este incidente marca o primeiro ataque conhecido contra uma empresa de propriedade dos Estados Unidos na Ucrânia.", "titulo_pt": "Míssil russo destrói fábrica de drones de empresa americana em Kiev", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 83270, "titulo": "Was Your Trip to Europe Affected by Heat or Wildfires? Tell Us About It.", "url": "https://www.nytimes.com/2026/07/30/travel/europe-heat-fire-reader-callout.html", "fonte_id": "nyt_world", "data_pub": "2026-07-30T22:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas que tiveram suas viagens para a Europa canceladas, reagendadas ou replanejadas devido a incêndios florestais ou calor extremo são convidadas a compartilhar suas experiências. O objetivo é coletar relatos sobre como esses eventos afetaram as viagens dos turistas.", "titulo_pt": "Você cancelou, reagendou ou replanejou uma viagem para Europa devido aos incêndios florestais ou ao calor intenso? Conte sobre isso.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 83331, "titulo": "Media, 'sale a 16 il numero dei migranti annegati a Ceuta in 24 ore'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/media-sale-a-16-il-numero-dei-migranti-annegati-a-ceuta-in-24-ore_4a62cdfc-6016-4125-ac1e-3a260a421763.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T22:08:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Foram recuperados 16 corpos de migrantes que afogaram nas unidades de controle de fronteira em Ceuta em 24 horas.", "titulo_pt": "Mídia relata: 16 são os migrantes que se afogaram em Ceuta em 24 horas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 82322, "titulo": "Inheritance law changes to stop tax dodging", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861696", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As leis de herança foram alteradas para prevenir a evasão fiscal. A mudança visa garantir que os herdeiros não possam usar estratégias fiscais inadequadas para reduzir seus impostos.", "titulo_pt": "Alterações nas leis de herança para combater a evasão fiscal", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 82334, "titulo": "ASE raises capital spending by 23.5%", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/31/2003861664", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ASE aumentou seus gastos com capital em 23,5%. A empresa investirá mais neste ano para expandir suas operações e modernizar sua infraestrutura.", "titulo_pt": "ASE eleva gastos com capital em 23,5%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 82338, "titulo": "Delta Electronics says revenue expected to increase", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/31/2003861668", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Delta Electronics espera que suas receitas aumentem.", "titulo_pt": "Delta Electronics prevê aumento nas receitas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 83255, "titulo": "Un negocio poco conocido: la Argentina es una potencia mundial en exportar carne de caballo", "url": "https://www.lanacion.com.ar/economia/campo/belgica-primer-comprador-la-argentina-exporto-un-10-mas-de-carne-de-caballo-y-mantiene-el-segundo-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T22:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Entre janeiro e junho de 2026, a Argentina exportou 7070 toneladas de carne de cavalo, com um aumento de valor de 42% para US$29,6 milhões.", "titulo_pt": "Um negócio pouco conhecido: a Argentina é uma potência mundial na exportação de carne de cavalo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 83180, "titulo": "Justiça aprova recuperação extrajudicial da Raízen. Veja o que muda", "url": "https://www.metropoles.com/sao-paulo/justica-aprova-recuperacao-extrajudicial-da-raizen-veja-o-que-muda", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça aprovou o plano de recuperação extrajudicial da Raízen, que visa reestruturar uma dívida de R$ 61,4 bilhões através da conversão de créditos em ações, emissão de novos títulos e desinvestimentos.", "titulo_pt": "Justiça aprova plano de recuperação extrajudicial da Raízen", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83200, "titulo": "Lucro líquido da Vale cai 35% no 2º trimestre, para US$ 1,37 bilhão", "url": "https://www.cnnbrasil.com.br/infra/lucro-liquido-da-vale-cai-35-no-2o-trimestre-para-us-137-bilhao/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lucro líquido da Vale diminuiu 35% no segundo trimestre, atingindo US$ 1,37 bilhão. A receita líquida aumentou 19% e o Ebitda ajustado cresceu 9%, com destaque para o desempenho dos metais básicos.", "titulo_pt": "Lucro líquido da Vale cai 35% no 2º trimestre, para US$ 1,37 bilhão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83149, "titulo": "Lucro da Vale cai 43% no segundo trimestre, para R$ 6,8 bi, com guerra e alta de combustíveis", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/lucro-da-vale-cai-43-no-segundo-trimestre-para-r-68-bi-e-cita-alta-nos-custos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T22:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vale registrou um lucro de R$ 6,8 bilhões no segundo trimestre, uma diminuição de 43% em comparação com o mesmo período do ano anterior. O resultado foi afetado por aumentos nos custos e perdas cambiais.", "titulo_pt": "Lucro da Vale cai 43% no segundo trimestre, para R$ 6,8 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 83151, "titulo": "CMN institui regime especial para fundos de inovação no Eco Invest", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/cmn-institui-regime-especial-para-fundos-de-inovacao-no-eco-invest", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-30T22:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Monetário Nacional instituiu um regime especial para fundos de inovação no programa Eco Invest Brasil, que visa mobilizar investimentos privados para projetos relacionados à transição ecológica. As mudanças nas regras visam adaptar a regulamentação aos novos instrumentos financeiros voltados ao financiamento da inovação.", "titulo_pt": "CMN institui regime especial para fundos de inovação no Eco Invest", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 83203, "titulo": "Brasil e Guiana têm alta de 20% nas vendas de petróleo à Europa, diz Argus", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/brasil-e-guiana-tem-alta-de-20-nas-vendas-de-petroleo-a-europa-diz-argus/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil e a Guiana aumentaram suas vendas de petróleo para a Europa em 20%, segundo informações do Argus. A menor demanda da China tem contribuído para essa maior disponibilidade de barris disponíveis para importações europeias.", "titulo_pt": "Brasil e Guiana registram alta de 20% nas vendas de petróleo à Europa, diz pesquisa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83206, "titulo": "Juros futuros caem em meio a bateria de dados no Brasil e nos EUA", "url": "https://www.cnnbrasil.com.br/economia/mercado/juros-futuros-caem-em-meio-a-bateria-de-dados-no-brasil-e-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa futura de juros para janeiro de 2028 caiu para 13,88%, com uma redução de 6 pontos-base. Este movimento ocorreu em meio a uma série de dados econômicos publicados no Brasil e nos Estados Unidos.", "titulo_pt": "Juros futuros diminuem diante de um conjunto de dados econômicos do Brasil e dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83189, "titulo": "MG financia 340 mil veículos e setor tem melhor semestre da história", "url": "https://www.metropoles.com/minas-gerais/mg-financia-340-mil-veiculos-e-setor-tem-melhor-semestre-da-historia", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado de Minas Gerais registrou 340 mil financiamentos de veículos entre janeiro e junho, uma alta de 11,9% em comparação com o mesmo período de 2025.", "titulo_pt": "MG financia 340 mil veículos e setor tem melhor semestre da história", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 83152, "titulo": "Dólar cai ao menor nível em quase dois meses, com alívio externo", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/dolar-cai-ao-menor-nivel-em-quase-dois-meses-com-alivio-externo", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-30T22:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou a sessão de 30 de novembro no menor nível em quase dois meses, impulsionado pelo enfraquecimento do dólar norte-americano e pela entrada de capital estrangeiro. A bolsa teve uma alta de cerca de 2%.", "titulo_pt": "Dólar cai para nível mínimo em quase dois meses com alívio externo", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 83213, "titulo": "Multiplan tem lucro de R$ 427,4 milhões no 2° semestre, salto de 61,7%", "url": "https://www.cnnbrasil.com.br/economia/negocios/multiplan-tem-lucro-de-r-4274-milhoes-no-2-semestre-salto-de-617/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Multiplan registrou lucro líquido de R$ 427,4 milhões no segundo semestre, um aumento de 61,7% em comparação com o mesmo período anterior. A empresa também gerou Ebitda de R$ 699,2 milhões, crescimento de 52%.", "titulo_pt": "Multiplan registra lucro de R$ 427,4 milhões no 2° semestre, aumento de 61,7%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83166, "titulo": "Receita com petróleo cresce 370% e arrecadação federal bate novo recorde no primeiro semestre", "url": "https://veja.abril.com.br/economia/receita-com-petroleo-cresce-370-e-arrecadacao-federal-bate-novo-recorde-no-primeiro-semestre/", "fonte_id": "veja", "data_pub": "2026-07-30T22:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação de impostos federais no primeiro semestre aumentou 6,6% em comparação com o mesmo período do ano anterior. O valor arrecadado foi de 1,6 trilhão de reais.", "titulo_pt": "Receita federal cresce 6,6% e atinge novo recorde no primeiro semestre", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 83221, "titulo": "Capital Insights: Próximo Copom deve deixar Selic em 14%, diz Abdelmalack", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/capital-insights-proximo-copom-deve-deixar-selic-em-14-diz-abdelmalack/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista-chefe da Serasa Experian espera que o próximo encontro do Copom, previsto para 5 de agosto, resulte em mais uma redução de 0,25 ponto percentual na taxa Selic.", "titulo_pt": "Próximo Copom deve manter Selic em 14%, prevê economista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 82833, "titulo": "Texas confirma el fin de semana sin impuestos de 2026: estas son las compras de menos de US$100 que califican", "url": "https://www.lanacion.com.ar/estados-unidos/texas/texas-confirma-el-fin-de-semana-sin-impuestos-de-2026-estas-son-las-compras-de-menos-de-us100-que-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T21:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Texas confirmou um fim de semana sem imposto em 2026, durante o qual as compras por menos de US$100 ficarão isentas. O evento inclui determinados itens que atendem a essa condição, mas exclui outros.", "titulo_pt": "Texas confirma fim de semana sem impostos de 2026: veja quais compras de menos de US$100 estão isentas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 83337, "titulo": "Investors love AI, as long as you’re a cloud host", "url": "https://techcrunch.com/2026/07/30/investors-love-ai-as-long-as-youre-a-cloud-host/", "fonte_id": "techcrunch", "data_pub": "2026-07-30T22:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores continuam a apoiar a Amazon, mesmo que ela não diminua suas despesas com centros de dados. A empresa não está reduzindo seus investimentos em infraestrutura, mas isso parece não afetar positivamente o interesse dos investidores na empresa.", "titulo_pt": "Investidores amam AI, desde que você seja um provedor de nuvem", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 83338, "titulo": "Apple says gaming slowdown and App Store changes hurt services growth", "url": "https://techcrunch.com/2026/07/30/apple-says-gaming-slowdown-and-app-store-changes-hurt-services-growth/", "fonte_id": "techcrunch", "data_pub": "2026-07-30T22:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple informou que um decréscimo nas atividades de jogos móveis e mudanças no modelo de negócios da App Store, como regras de pagamento judicialmente determinadas nos Estados Unidos, afetaram o crescimento do seu serviço. A empresa atingiu a marca de 1,5 bilhão de assinaturas pagas.", "titulo_pt": "Apple diz que decréscimo no gaming móvel e mudanças na App Store prejudicaram o crescimento dos serviços", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 83335, "titulo": "Tim Cook hints at iCloud Plus tier for AI power users", "url": "https://www.theverge.com/tech/973552/apple-ceo-tim-cook-icloud-plus-ai", "fonte_id": "the_verge", "data_pub": "2026-07-30T22:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Cook, CEO da Apple, sugeriu durante uma chamada de resultados que a empresa pode oferecer um nível de upgrade para o iCloud Plus, permitindo maior uso de inteligência artificial. Ele acredita que os usuários querem utilizar mais as funcionalidades de inteligência artificial e assistente virtual da Apple.", "titulo_pt": "Tim Cook indica possibilidade de tier premium do icloud Plus para usuários de AI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 83320, "titulo": "AI: Europe commits €5 billion to fund seven megafactories and catch up with the US and China", "url": "https://www.lemonde.fr/en/economy/article/2026/07/31/ai-europe-commits-5-billion-to-fund-seven-megafactories-and-catch-up-with-the-us-and-china_6756020_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T22:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia lançou um convite à proposta para financiar sete fábricas gigantes voltadas ao desenvolvimento de modelos de inteligência artificial, com um investimento de 5 bilhões de euros. Os desafios incluem incertezas orçamentárias, conformidade com padrões ambientais e dependência da tecnologia americana.", "titulo_pt": "Ue: comissão europeia destina 5 bilhões de euros para financiar sete fábricas gigantes de IA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 83324, "titulo": "Amazon’s Zoox secures US federal approval for steering-wheel-free robotaxis", "url": "https://www.aljazeera.com/economy/2026/7/30/amazons-zoox-secures-us-federal-approval-for-steering-wheel-free-robotaxis?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T22:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Amazon's Zoox obteve a aprovação federal dos Estados Unidos e planeja lançar seu serviço comercial de táxis robô sem volante na cidade de Las Vegas.", "titulo_pt": "Zoox conquista aprovação federal para operar táxis robôs sem volante nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 83267, "titulo": "Los nuevos modelos de autos que promete Ford tras la alianza que realizó con un gigante chino", "url": "https://www.lanacion.com.ar/autos/los-nuevos-modelos-de-autos-que-promete-ford-tras-la-alianza-que-realizo-con-un-gigante-chino-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T22:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ford está desenvolvendo novos modelos de veículos, incluindo um novo integrante da família Bronco e dois SUVs elétricos, em parceria com a Geely na fábrica de Valencia, Espanha.", "titulo_pt": "Novos modelos de carros que Ford promete após aliança com gigante chinês", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 83318, "titulo": "Tim Cook says Apple may charge for AI Siri", "url": "https://www.axios.com/2026/07/30/tim-cook-apple-may-charge-for-ai-siri", "fonte_id": "axios", "data_pub": "2026-07-30T22:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Cook, CEO da Apple, sugeriu durante uma chamada telefônica que usuários frequentes do assistente de voz revisto Siri podem ter que pagar por acesso. A empresa está ainda em desenvolvimento para implementar esta possibilidade, devido aos custos computacionais maiores associados ao novo assistente inteligente baseado em AI.", "titulo_pt": "Tim Cook diz que Apple pode cobrar pelo Siri revisto com IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 83038, "titulo": "Apple forecasts slower growth as AI build-out strains tech supply chains", "url": "https://www.ft.com/content/762a504e-fca8-49d0-9f2e-b2f142fd749a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple projeta crescimento mais lento devido ao investimento em inteligência artificial, enquanto suas concorrentes enfrentam dificuldades. As receitas de smartphones da Apple aumentaram mais do que um quinto no último período.", "titulo_pt": "Apple prevê crescimento mais lento devido ao investimento em AI e tensões nas cadeias de suprimentos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 82922, "titulo": "The AI Industry Keeps Breaking the Internet", "url": "https://www.theatlantic.com/technology/2026/07/ai-industry-keeps-breaking-internet/688124/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-30T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de inteligência artificial está causando problemas constantes na internet.", "titulo_pt": "Esta é a utopia?", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 83041, "titulo": "Amazon increases AI infrastructure spending to $220bn this year", "url": "https://www.ft.com/content/fddc42a9-4c57-4689-abde-75bbe79622e9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon aumentou suas despesas com infraestrutura de inteligência artificial para US$ 220 bilhões neste ano. Originalmente, a empresa havia previsto gastar US$ 200 bilhões em 2026.", "titulo_pt": "Amazon aumenta gastos com infraestrutura de IA para us$ 220 bi este ano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 82703, "titulo": "OpenAI baixa preços de modelos à medida que empresas analisam gastos com IA", "url": "https://www.cnnbrasil.com.br/inteligencia-artificial/openai-baixa-precos-de-modelos-a-medida-que-empresas-analisam-gastos-com-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI reduziu os preços de seus modelos de inteligência artificial mais acessíveis para concorrer com versões chinesas. A empresa alterou os valores para tornar suas soluções mais atraentes no mercado.", "titulo_pt": "Openai baixa preços de modelos para competir com chineses", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 82619, "titulo": "A acusação da xAI de Elon Musk contra a lei americana que bane aplicativos de ‘nudificação’", "url": "https://veja.abril.com.br/tecnologia/a-acusacao-da-xai-de-elon-musk-contra-a-lei-americana-que-bane-aplicativos-de-nudificacao/", "fonte_id": "veja", "data_pub": "2026-07-30T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa xAI, liderada por Elon Musk, enfrenta acusações relacionadas à ferramenta de IA Grok, que foi envolvida em disputas sobre a produção de deepfakes.", "titulo_pt": "Acusação da xai de Musk contra lei americana que proíbe aplicativos de 'nudificação'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82575, "titulo": "Vendas da divisão de nuvem da Amazon disparam, e empresa prevê mais gastos em IA este ano", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/amazon-tem-resultado-melhor-que-o-esperado-no-2o-tri-com-disparada-de-vendas-da-divisao-de-nuvem.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon planeja aumentar seus gastos de capital para US$ 220 bilhões este ano, devido a maiores custos de memória. A empresa também prevê investimentos adicionais em inteligência artificial.", "titulo_pt": "Vendas da divisão de nuvem da Amazon disparam e empresa prevê mais gastos em IA este ano", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 83065, "titulo": "Apple’s iPhone and Mac sales keep growing despite RAM shortages", "url": "https://www.theverge.com/tech/973430/apple-q3-2026-earnings", "fonte_id": "the_verge", "data_pub": "2026-07-30T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de iPhone e Mac da Apple aumentaram no terceiro trimestre, com crescimentos de 22% e 29%, respectivamente. Isso levou a uma receita total de $109,4 bilhões para a empresa, apesar de uma escassez global de RAM afetar fabricantes de dispositivos.", "titulo_pt": "Vendas de iphone e Mac da apple crescem em meio à escassez global de RAM", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 83071, "titulo": "CareCloud begins to notify hundreds of thousands after hackers stole medical records", "url": "https://techcrunch.com/2026/07/30/carecloud-begins-to-notify-hundreds-of-thousands-after-hackers-stole-medical-records/", "fonte_id": "techcrunch", "data_pub": "2026-07-30T20:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de tecnologia de saúde CareCloud notificou centenas de milhares de pessoas após hackers roubarem registros médicos. A empresa informou que um de seus armazenamentos protegidos de dados de saúde foi atacado.", "titulo_pt": "Carecloud começa a notificar cientes após hackers roubarem registros médicos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 83079, "titulo": "Everyone Is Freaking Out About OpenAI and Anthropic’s Race for Dominance", "url": "https://www.wired.com/story/everyone-is-freaking-out-about-openai-and-anthropics-race-for-dominance/", "fonte_id": "wired", "data_pub": "2026-07-30T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores temem que a IA esteja avançando muito rapidamente, enquanto Mark Zuckerberg expressou preocupações sobre quem terá controle dela. A reportagem também discute as iniciativas de Black Forest Labs em robótica.", "titulo_pt": "Todo mundo está se assustando com o conflito entre OpenAI e Anthropic pela dominância na IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 83353, "titulo": "Pacific Ocean pattern helps explain diverging wildfire trends in US and Australia", "url": "https://phys.org/news/2026-07-pacific-ocean-pattern-diverging-wildfire.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois dos maiores territórios propensos a incêndios do mundo têm seguido trajetórias de aumento de áreas queimadas muito diferentes apesar do aquecimento climático. A área florestal queimada aumentou significativamente no sudoeste dos Estados Unidos, enquanto o leste da Austrália não registrou um aumento semelhante.", "titulo_pt": "Padrão do oceano pacífico explica tendências divergentes de incêndios em EUA e austrália", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83354, "titulo": "Rural runoff funnels hurricane floodwater toward coastal cities, model finds", "url": "https://phys.org/news/2026-07-rural-runoff-funnels-hurricane-floodwater.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A modelagem indica que a água de cheias provocadas por furacões pode ser direcionada para cidades costeiras através da drenagem rural. As cidades costeiras estão aumentando o risco de eventos de inundações compostas, como a ocorrência simultânea de forte chuva e submersão marítima durante furacões.", "titulo_pt": "Descarga rural direciona água das cheias de furacões para as cidades costeiras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83355, "titulo": "Natural emulsion manages to stop fungus that threatens up to 80% of cocoa production", "url": "https://phys.org/news/2026-07-natural-emulsion-fungus-threatens-cocoa.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um formulário inovador baseado em compostos naturais pode se tornar uma alternativa sustentável para controlar a moniliasis, uma das doenças mais devastadoras que afetam o cacau na América Latina. Estudos mostram que emulsões combinando fengycin, um lipopeptídeo produzido por bactérias do gênero Bacillus, com óleos essenciais podem significativamente inibir o crescimento do fungo Moniliophthora roreri, responsável por perdas que podem ultrapassar 70-80% da colheita.", "titulo_pt": "Emulsão natural pode ser alternativa sustentável para controlar doença que ameaça até 80% da produção de cacau", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83261, "titulo": "¿Sos de los que rinden mejor de noche? Lo que advierte la ciencia sobre trasnochar", "url": "https://www.lanacion.com.ar/salud/sos-de-los-que-rinden-mejor-de-noche-lo-que-advierte-la-ciencia-sobre-trasnochar-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T22:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O horário de dormir pode afetar a saúde mental, aumentando o risco de desenvolver diferentes transtornos. Estudos científicos alertam sobre essa relação.", "titulo_pt": "Você é daqueles que dormem melhor à noite? O que a ciência diz sobre trasnochar", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 83165, "titulo": "Como um vírus escondido em múmias chilenas liga a varíola à colonização das Américas", "url": "https://veja.abril.com.br/ciencia/como-um-virus-escondido-em-mumias-chilenas-liga-a-variola-a-colonizacao-das-americas/", "fonte_id": "veja", "data_pub": "2026-07-30T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo identificou o genoma da primeira variante de varíola que chegou às Américas, e suas informações indicam que ela veio da Europa. O vírus foi encontrado em múmias chilenas.", "titulo_pt": "Como um vírus escondido em múmias chilenas liga a varíola à colonização das Américas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 83356, "titulo": "Female birds have shorter lifespans than male birds across 35 North American species, researchers find", "url": "https://phys.org/news/2026-07-female-birds-shorter-lifespans-male.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada por ornitólogos da UCLA descobriu que as fêmeas de 35 espécies de aves norte-americanas têm menores taxas de sobrevivência em comparação com os machos. Este é o primeiro estudo a examinar a sobrevivência das fêmeas de pássaros em um grande conjunto de dados, revelando que essa tendência é mais ampla do que se pensava anteriormente.", "titulo_pt": "Mulheres de aves têm menor longevidade que os machos em 35 espécies norte-americanas, descobrem pesquisadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83357, "titulo": "How an embryo draws the line between body and germline", "url": "https://phys.org/news/2026-07-embryo-line-body-germline.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada embrião de um organismo que reproduz sexualmente enfrenta uma decisão cedo e crucial: quais linhagens celulares formarão o corpo mortal, e quais se tornarão a linhagem germinativa, responsável por produzir ovos ou espermatozoides e transmitir informações genéticas para a próxima geração. Cometer este erro pode levar à sobrevivência do organismo, mas à infertilidade, comprometendo sua evolução.", "titulo_pt": "Como um embrião traça a linha entre corpo e linhagem germinativa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83358, "titulo": "Bacteria may identify a virus without recognizing its DNA", "url": "https://phys.org/news/2026-07-bacteria-virus-dna.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando um vírus invade uma célula, sua principal tarefa é replicar seu genoma rapidamente para criar novos vírus que infectem outras células. No entanto, a célula hospedeira busca destruir o vírus, preferencialmente antes que ele cause danos.", "titulo_pt": "Bactérias podem identificar um vírus sem reconhecer seu DNA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83266, "titulo": "Tienen 109, 104 y 103 años: las tres hermanas que tienen el secreto de la longevidad y que la ciencia quiere saber qué esconden", "url": "https://www.lanacion.com.ar/salud/tienen-109-104-y-103-anos-las-tres-hermanas-que-tienen-el-secreto-de-la-longevidad-y-que-la-ciencia-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T22:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Levita, Zoraide e Zulina de Deus detêm o recorde Guinness como as irmãs vivas mais longevas do planeta. A reportagem detalha suas histórias de vida.", "titulo_pt": "Têm 109, 104 e 103 anos: as três irmãs que têm o segredo da longevidade e a ciência quer saber o que escondem", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 83359, "titulo": "Scientists have found a new way molecules can cooperate at room temperature", "url": "https://phys.org/news/2026-07-scientists-molecules-cooperate-room-temperature.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que moléculas confinadas em nanoestruturas de ouro podem se comportar coletivamente, sincronizando suas interações a temperatura ambiente. Este achado desafia antigos pressupostos sobre como a coerência óptica forma e abre novas possibilidades para sensores sensíveis, fotônica molecular e tecnologias quânticas que operam a temperatura ambiente.", "titulo_pt": "Cientistas encontraram nova maneira de moléculas cooperarem a temperatura ambiente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83083, "titulo": "Turkey confronts growing wildfires on tourist coasts", "url": "https://phys.org/news/2026-07-turkey-wildfires-tourist-coasts.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de bombeiros turcos combatem incêndios florestais que se espalham perto das principais regiões turísticas da costa mediterrânea do país.", "titulo_pt": "Turquia enfrenta incêndios em áreas turísticas da costa mediterrânea", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83084, "titulo": "Uncovering the structure of the poxvirus 'portal complex'", "url": "https://phys.org/news/2026-07-uncovering-poxvirus-portal-complex.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Poxvírus têm uma longa história na doença humana e na medicina, incluindo a criação da primeira vacina contra varíola. Embora a varíola tenha sido erradicada, os cientistas ainda não compreendem completamente como esses vírus infectam e se replicam dentro das células humanas. As recentes explosões de mpox destacam a urgência de uma melhor compreensão da biologia dos poxvírus.", "titulo_pt": "Desvendando a estrutura do complexo 'portal' dos poxvírus", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82916, "titulo": "How a super El Niño affects the global climate", "url": "https://www.vox.com/videos/497257/how-super-el-nino-affects-global-climate", "fonte_id": "vox", "data_pub": "2026-07-30T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 11 de junho, a NOAA emitiu um aviso sobre El Niño após temperaturas no Oceano Pacífico Equatorial permanecerem acima da média por vários meses. Este evento pode ser extraordinário.", "titulo_pt": "Como um super El Niño afeta o clima global", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 83085, "titulo": "Likelihood of wildfires in Southern Europe has doubled since the 80s, study shows", "url": "https://phys.org/news/2026-07-likelihood-wildfires-southern-europe-80s.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo publicado na Scientific Reports indica que os dias de verão propícios para a ignição, intensidade e extensão das chamas rurais dobraram nas grandes partes da Península Ibérica, França, Itália e Grécia desde 1981. Embora o número de incêndios tenha diminuído na região desde os anos 1980, a pesquisa sugere que clima mais quente e seco está aumentando o risco de incêndio florestal no sul da Europa.", "titulo_pt": "Probabilidade de incêndios florestais no sul da Europa dobrou desde os anos 1980", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83086, "titulo": "Scientists solve mystery of how muscle cells grow and stay healthy", "url": "https://phys.org/news/2026-07-scientists-mystery-muscle-cells-stay.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ciêntistas desvendaram o mistério sobre como as células musculares se formam e mantêm sua função no nível molecular. Esses achados podem auxiliar na criação de tratamentos para doenças musculares, incluindo a cardiomiopatia dilatada, uma das principais causas de insuficiência cardíaca.", "titulo_pt": "Cientistas resolvem mistério sobre como as células musculares crescem e permanecem saudáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 83087, "titulo": "Southern Europe 'becoming more flammable' in hotter climate, experts say", "url": "https://phys.org/news/2026-07-southern-europe-flammable-hotter-climate.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo revelou que a Europa do Sul está se tornando mais propensa a incêndios, com o número de dias de verão favoráveis a condições extremas de fogo dobrar desde 1981.", "titulo_pt": "Europa do sul se torna mais propensa a incêndios em clima mais quente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 82332, "titulo": "Higashino’s death sends his novels soaring on Taiwan bestseller lists", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861706", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas dos livros de Higashino aumentaram significativamente nas listas de best-sellers da Taiwan após sua morte.", "titulo_pt": "Morte de higashino faz seus livros subirem nas listas de best-sellers na Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 83146, "titulo": "'Homem Aranha: Um Novo Dia' tem a segunda maior estreia na história do Brasil", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/homem-aranha-um-novo-dia-tem-a-segunda-maior-estreia-na-historia-do-brasil.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-30T22:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Homem-Aranha: Um Novo Dia' foi visto por 1 milhão de brasileiros e arrecadou R$ 23,6 milhões em seu primeiro dia. Este é o maior lançamento do ano no Brasil e a segunda maior estreia de todos os tempos, ficando atrás apenas de 'Vingadores: Ultimato'.", "titulo_pt": "Homem-aranha: um Novo Dia tem a segunda maior estreia na história do Brasil", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 83264, "titulo": "Oficial y confirmado: Hochul restringe las redes sociales para menores de 18 años y exige consentimiento de un tutor", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/oficial-y-confirmado-hochul-restringe-las-redes-sociales-para-menores-de-18-anos-y-exige-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T22:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Kathy Hochul implementou restrições nas redes sociais para meno e show doesn’t start to do justice to these women’s horrors", "url": "https://www.theguardian.com/tv-and-radio/2026/jul/30/dont-date-brandon-review-this-lazy-true-crime-show-doesnt-start-to-do-justice-to-these-womens-horrors", "fonte_id": "guardian_culture", "data_pub": "2026-07-30T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série 'Não Saia Com Brandon' carece de detalhes necessários para entender as dificuldades enfrentadas pelas mulheres. Ela parece voyeurista e mal direcionada, reforçando a percepção de que o movimento feminista pode estar por trás da produção repetitiva de documentários de verdadeiro crime focados em homens ruins.", "titulo_pt": "Avaliação: 'não saia com Brandon' não faz justiça às mulheres vítimas", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 83113, "titulo": "Simone Forti, Artist of Movement and Chance, Dies at 91", "url": "https://hyperallergic.com/simone-forti-artist-of-movement-and-chance-dies-at-91/", "fonte_id": "hyperallergic", "data_pub": "2026-07-30T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simone Forti, nascida na Itália e considerada uma coreógrafa e artista de performance, faleceu aos 91 anos. Sua criatividade abrangente combinava curiosidade sem limites com rigor formal em um espectro criativo que englobou Nova York, Los Angeles e Roma.", "titulo_pt": "Simone Forti, artista do movimento e da Chance, falece aos 91 anos", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 82585, "titulo": "DiaTV cancela programa após entrevista com deputado Kim Kataguiri", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/diatv-cancela-programa-apos-entrevista-com-deputado-kim-kataguiri.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-30T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A emissora DiaTV encerrou o programa Simplificando E
