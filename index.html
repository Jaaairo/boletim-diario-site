15T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diminuição da natalidade está resultando em uma menor matrícula em escolas privadas, levando a fusões entre instituições. Em Buenos Aires, foram notados dois casos recentes: a união entre o San Tarsicio e Misericordia e entre o Colegio Los Robles e a Escuela Argentina Modelo.", "titulo_pt": "Redução da natalidade e fusões em escolas privadas na argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 162421, "titulo": "Cuidado integrado e olhar da família contribuem para a inclusão de pessoas com TEA", "url": "https://www.metropoles.com/conteudo-especial/cuidado-integrado-tea", "fonte_id": "metropoles", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas recomendam que o tratamento para pessoas com Transtorno do Espectro Autista deve ser personalizado. O cuidado integrado e a perspectiva familiar são considerados importantes para a inclusão dessas pessoas.", "titulo_pt": "Cuidado personalizado e olhar familiar contribuem para a inclusão de pessoas com TEA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162685, "titulo": "Australia’s Indigenous population estimated at 2.2m before ‘demographic catastrophe’ of colonisation", "url": "https://www.theguardian.com/australia-news/2026/sep/15/australia-indigenous-population-before-colonisation-underestimated-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a população indígena australiana antes da colonização era significativamente maior, estimada em 2,2 milhões de pessoas, em vez das estimativas iniciais de 250 mil. Isso sugere que o impacto das doenças e dos massacres foi maior do que se pensava anteriormente.", "titulo_pt": "População indígena australiana antes da colonização era de 2,2 milhões, sugere nova pesquisa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 162938, "titulo": "As cases rise, Japan moves to step up measures against human trafficking", "url": "https://www.japantimes.co.jp/news/2026/09/15/japan/human-trafficking-report/", "fonte_id": "japan_times", "data_pub": "2026-09-15T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão está intensificando as medidas contra o tráfico de pessoas, incluindo exploração laboral e sexual, em meio ao aumento no número de vítimas identificadas.", "titulo_pt": "Aumento nas vítimas levanta ações contra tráfico de pessoas no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 162984, "titulo": "2 socially isolated brothers found dead in Hong Kong flat, no foul play suspected", "url": "https://www.scmp.com/news/hong-kong/society/article/3367552/2-socially-isolated-brothers-found-dead-hong-kong-flat-no-foul-play-suspected?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T06:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois irmãos de meia-idade foram encontrados mortos em seu apartamento em Hong Kong, de acordo com a polícia. Eles evitavam socialmente e eram mantidos financeiramente pelos pais. Não foram identificados indícios de circunstâncias suspeitas no momento.", "titulo_pt": "Dois irmãos socialmente isolados são encontrados mortos em apartamento em Hong Kong, sem suspeitas de crime", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 163034, "titulo": "Suicide-related public services struggle to keep pace with demand", "url": "https://www.koreaherald.com/article/10874238", "fonte_id": "korea_herald", "data_pub": "2026-09-15T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de reclamações para que suicídios sejam reconhecidos como mortes ocupacionais aumentou significativamente, mas o número de casos reconhecidos diminuiu. De 2019 a 2025, o número de famílias que apresentaram reclamações aumentou 33%, enquanto o número de casos reconhecidos caiu de 35 para 28.", "titulo_pt": "Serviços relacionados ao suicídio têm dificuldade para acompanhar a demanda", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 163119, "titulo": "Over 17,000 flood-affected children in Nepal need urgent mental health and psychosocial support", "url": "https://www.unicef.org/press-releases/over-17000-flood-affected-children-nepal-need-urgent-mental-health-and-psychosocial", "fonte_id": "unicef", "data_pub": "2026-09-15T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 17.000 crianças afetadas pela cheia no Nepal precisam de assistência psicológica e suporte psicossocial urgente. Os órgãos de assistência humanitária estão trabalhando para atender às necessidades dessas crianças.", "titulo_pt": "Maior de 17.000 crianças afetadas pela cheia no Nepal precisam de assistência psicológica urgente", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 162995, "titulo": "‘I just need an answer’: widow haunted by husband’s shooting seeks inquest", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3367499/i-just-need-answer-widow-haunted-husbands-shooting-seeks-inquest?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T02:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois anos após o marido armado e com histórico de doença mental ser morto por um policial de Hong Kong, a viúva Li ainda aguarda a realização de uma inquérito sobre a morte. Ela ligou para a polícia em 15 de setembro de 2024, pois seu marido, de 38 anos, havia atacado sua mãe idosa e ela própria em sua casa no bairro de North Point.", "titulo_pt": "‘Apenas preciso de uma resposta’: viúva aguarda inquérito sobre morte do marido", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 161442, "titulo": "Kuai Kuai workers protest land sale, demand compensation", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/15/2003864299", "fonte_id": "taipei_times", "data_pub": "2026-09-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da Kuai Kuai estiveram em protesto contra a venda de terrenos e exigiram compensação. O protesto reflete a preocupação dos trabalhadores com a possível perda de seus empregos e atraso nas melhorias planejadas para a área.", "titulo_pt": "Trabalhadores da Kuai Kuai protestam contra venda de terrenos e exigem compensação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 161449, "titulo": "Average wages climbing, but median wages low", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/15/2003864265", "fonte_id": "taipei_times", "data_pub": "2026-09-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os salários médios estão aumentando, mas os salários medíamos permanecem baixos. Isso indica uma possível desigualdade na distribuição de renda.", "titulo_pt": "Salários médios em alta, mas salários medíamos baixos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 161754, "titulo": "Brasileiro desconectado e exausto se afasta das urnas, aponta estudo", "url": "https://veja.abril.com.br/politica/brasileiro-desconectado-e-exausto-se-afasta-das-urnas-aponta-estudo/", "fonte_id": "veja", "data_pub": "2026-09-14T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado em parceria pelo Datafolha e a Avaaz identificou uma relação entre a desesperança, o isolamento social e a menor participação nas eleições.", "titulo_pt": "Brasileiro desiludido e isolado se afasta das urnas, aponta estudo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161918, "titulo": "Homem admite ter drogado e estuprado a esposa por 20 anos no Reino Unido", "url": "https://www.bbc.com/portuguese/articles/cq9869r0rjnjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_ -para-acolher-no-natal-criancas-na-fila-da-adocao", "fonte_id": "metropoles", "data_pub": "2026-09-14T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça mineira está buscando famílias para acolher crianças e adolescentes durante o Natal. A iniciativa visa aumentar o número de famílias cadastradas que podem receber os menores em situação de espera adotiva.", "titulo_pt": "TJMG busca famílias para acolher no Natal crianças na fila da adoção", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 162424, "titulo": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "url": "https://www.metropoles.com/brasil/clima-brasil-tem-dia-de-contrastes-com-geada-no-sul-e-calor-no-norte", "fonte_id": "metropoles", "data_pub": "2026-09-15T08:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil experimentou um dia com contrastes climáticos, com geada no Sul e calor no Norte. Uma área de baixa pressão e um fluxo de umidade favoreceram instabilidades em partes do Sul e do Sudeste.", "titulo_pt": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162817, "titulo": "After summer of unprecedented heatwaves and drought, climate activists rally support ahead of French elections", "url": "https://www.lemonde.fr/en/environment/article/2026/09/15/after-summer-of-unprecedented-heatwaves-and-drought-climate-activists-rally-support-ahead-of-french-elections_6757544_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações não-governamentais e sindicatos chamaram para uma manifestação na quinta-feira próximo ao Ministério da Economia, pedindo ação urgente climática. Manifestações em 269 cidades francesas estão programadas para 26 de setembro, com temas incluindo clima, vida, paz e justiça social.", "titulo_pt": "Após verão de ondas de calor e secas inéditas, ativistas climáticos buscam apoio nas eleições francesas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 162444, "titulo": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "url": "https://www.cnnbrasil.com.br/agro/chuvas-atrasam-moagem-de/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas interferiram no processo de moagem de cana-de-açúcar nas usinas, levando a um aumento de mais de 20% nos preços do etanol. O aumento também foi influenciado pela elevação dos preços do açúcar internacional.", "titulo_pt": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162960, "titulo": "Wildfires Burn Thousands of Hectares, Exposing Albania’s Systemic Weaknesses", "url": "https://balkaninsight.com/2026/09/15/wildfires-burn-thousands-of-hectares-exposing-albanias-systemic-weaknesses/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-15T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, incêndios florestais destruíram milhares de hectares na Albânia, revelando a incapacidade do estado de lidar com a situação de forma eficaz e coordenada. Os especialistas apontam que os riscos estão aumentando devido ao aquecimento global.", "titulo_pt": "Incêndios florestais destruem milhares de Hectares, expõem fraquezas sistêmicas da albânia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 162994, "titulo": "Air quality across Singapore reaches unhealthy levels from Indonesian wildfires", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3367527/air-quality-across-singapore-reaches-unhealthy-levels-indonesian-wildfires?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T03:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar em Singapura foi afetada por fumaça proveniente de incêndios florestais na Indonésia, levando a níveis de poluição considerados prejudiciais à saúde em todas as cinco regiões da cidade-estado. A situação é a mais grave desde setembro de 2019, conforme informado pelo Agência Nacional do Meio Ambiente.", "titulo_pt": "Qualidade do ar em singapura atinge níveis indesejáveis devido a incêndios na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 161959, "titulo": "“Todo destruido”: así quedó el edificio de 13 pisos que se incendió en pleno Recoleta", "url": "https://www.lanacion.com.ar/sociedad/todo-destruido-asi-quedo-el-edificio-de-13-pisos-que-se-incendio-en-pleno-recoleta-nid14092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-14T21:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Imagens após o controle das chamas mostram corredores cobertos de fuligem e um apartamento no quarto andar completamente destruído. Cinco pessoas precisaram de atendimento médico.", "titulo_pt": "Todo destruído: assim ficou o edifício de 13 andares que pegou fogo no bairro de Recoleta", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 162253, "titulo": "Trump repeals emissions regulations of fossil-fuel power plants", "url": "https://www.scientificamerican.com/article/trump-epa-to-repeal-emissions-regulations-of-fossil-fuel-power-plants/", "fonte_id": "scientific_american", "data_pub": "2026-09-14T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump revogou as restrições de emissões de usinas de energia fóssil do governo Biden, o que pode ter efeitos devastadores nas tentativas de combater o aquecimento global.", "titulo_pt": "Trump anula regulamentos de emissões de usinas de energia fóssil do governo biden", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 161850, "titulo": "Seu CEP é de risco? Plataforma gratuita mostra exposição de imóveis a eventos climáticos extremos", "url": "https://exame.com/esg/seu-cep-e-de-risco-plataforma-gratuita-mostra-exposicao-de-imoveis-a-eventos-climaticos-extremos/", "fonte_id": "exame", "data_pub": "2026-09-14T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma gratuita da Allianz está disponível no Brasil e evalua os riscos de alagamentos, vendavais e granizo baseados no CEP do imóvel. É o primeiro país da América Latina a ter acesso a essa ferramenta.", "titulo_pt": "Seu CEP está em risco? Plataforma gratuita mostra exposição a eventos climáticos extremos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 160893, "titulo": "Cidade de SP fica embaixo d'água após chuvas e cheia do Rio Ribeira", "url": "https://www.metropoles.com/sao-paulo/cidade-sp-embaixo-dagua-rio-ribeira", "fonte_id": "metropoles", "data_pub": "2026-09-14T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade de Eldorado, no interior de São Paulo, ficou submersa devido às fortes chuvas que causaram a cheia do Rio Ribeira de Iguape.", "titulo_pt": "Cidade de SP sob a água após chuvas e cheia do Rio Ribeira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 160090, "titulo": "Calor nos oceanos dura 100 dias, bate recorde e ameaça o clima", "url": "https://www.metropoles.com/brasil/calor-nos-oceanos-dura-100-dias-bate-recorde-e-ameaca-o-clima", "fonte_id": "metropoles", "data_pub": "2026-09-14T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os oceanos estão registrando temperaturas superiores às médias, batendo um novo recorde. Este fenômeno dura 100 dias e está sendo agravado pelo El Niño atual, conforme alerta o Greenpeace.", "titulo_pt": "Calor nos oceanos dura 100 dias, bate recorde e ameaça o clima", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 160564, "titulo": "Himalayan ‘glacier bankruptcy’ threatens water security for 2 billion in Asia", "url": "https://www.scmp.com/news/asia/south-asia/article/3367426/himalayan-glacier-bankruptcy-threatens-water-security-2-billion-asia?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo afirma que os glaciares dos Himalaias estão derretendo mais rapidamente do que há uma década, ameaçando a segurança hídrica da região até 2050. Isso ocorre após o colapso de um glaciar na fronteira entre Nepal e Tibet em agosto, causando deslizamentos de terra e inundações.", "titulo_pt": "Bancarrota glacial dos himalaias ameaça segurança hídrica para 2 bilhões de pessoas na ásia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 160672, "titulo": "Revealed: England’s June 2026 heatwave sparked record demand for ambulances", "url": "https://www.carbonbrief.org/revealed-englands-june-2026-heatwave-sparked-record-demand-for-ambulances", "fonte_id": "carbon_brief", "data_pub": "2026-09-14T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o verão de 2026, todas as serviços de ambulâncias em Inglaterra registraram dias entre os mais ocupados de sua história devido ao calor extremo registrado em junho.", "titulo_pt": "Revelado: calor extremo de junho de 2026 em inglaterra gerou demanda recorde por serviços de ambulância", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 160096, "titulo": "O calor extremo pode acabar com o último refúgio barato de Paris", "url": "https://exame.com/casual/o-calor-extremo-pode-acabar-com-o-ultimo-refugio-barato-de-paris/", "fonte_id": "exame", "data_pub": "2026-09-14T06:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cômodos de até 15 m² sob os telhados em Paris são a opção mais barata para moradia no centro da cidade, mas o aumento das ondas de calor pode colocar em risco essa escolha.", "titulo_pt": "O calor extremo pode colocar fim const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>

      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
