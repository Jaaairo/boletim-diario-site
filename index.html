<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "03/09/2026 15:33", "stats": {"noticias_novas": 956, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário político brasileiro está em intensa turbulência, com destaque para a crise envolvendo o ministro Alexandre de Moraes do Supremo Tribunal Federal (STF). O presidente Luiz Inácio Lula da Silva e seus aliados buscam desgastar Moraes, com Lula criticando a oposição liderada pelo senador Flávio Bolsonaro por atrasos na votação de uma proposta no Senado. Deputados e candidatos a cargos públicos, como Ronaldo Caiado e Nikolas Ferreira, também se envolvem em debates sobre a atuação do STF, com alguns defendendo a renúncia de Moraes e outros buscando alavancar a crise para seus próprios interesses. A crise Moraes-Vorcaro continua a gerar discussões nos bastidores do STF, enquanto a atuação do ministro é questionada por diversos setores da sociedade e política.", "mundo": "Os Estados Unidos realizaram novas operações militares contra alvos iranianos, em uma tentativa de impedir que Teerã reconsolide suas capacidades destruídas. Isso pode levar a uma escalada contínua de reconstrução, seguida por novos ataques, conforme relatado pela DW. Por outro lado, Israel está prestes a soltar prisioneiros libaneses em um sinal raro de progresso nas negociações entre Israel e Líbano, visando desarmar a Hezbollah e encerrar a invasão israelense, conforme informado pelo NYT World. Em outro desenvolvimento, o terminal 1 do aeroporto BER em Berlim foi evacuado como precaução devido a um relatório de segurança, confirmado pela polícia federal, conforme relatado pela DW. Além disso, o ex-presidente venezuelano Nicolás Maduro, detido em Nova York, reivindica sua condição de chefe de Estado em uma ação judicial, pedindo ao juiz americano que desista dos cargos contra ele, conforme informado pelo El País América.\n\nA geopolítica global continua em um cenário de tensões e alianças complexas. Um artigo sugere que o candidato Renan Santos, do partido Missão, considera a China um parceiro mais vantajoso do que os Estados Unidos, defendendo uma política externa soberana. Em outro encontro, os presidentes do Chile e do Paraguai, Gabriel Boric e Santiago Peña, respectivamente, se encontraram para discutir questões bilaterais, mas não há detalhes específicos sobre o encontro. A situação na Ucrânia continua a ser um ponto focal, com Putin afirmando a possibilidade de um acordo de paz, enquanto o sentimento público na Ucrânia se volta contra Zelensky devido a preocupações com corrupção e à prolongada guerra. As tensões no Estreito de Ormuz persistem, com dados sugerindo que o fluxo de petróleo é menor do que as afirmações dos EUA, e o Canal de Panamá limita o número de navios que podem passar. Além disso, as relações entre Israel e seus vizinhos e aliados, como a Argentina, continuam em pauta, com Israel enfrentando críticas por bombardeios em vizinhanças libanesas e por limitar o acesso a serviços de saúde em Gaza. A situação na Somália também é um ponto de atenção, com ataques armados em Baidoa causando preocupação entre as autoridades. No Irã, ataques a bases no Kuwait e Emirados Árabes Unidos foram realizados como retaliação a supostos crimes de guerra dos EUA, enquanto a Tunísia enfrenta uma crise econômica aprofundada devido a experimentos econômicos falhos. A China, por outro lado, mantém sua postura firme contra pressões de Washington, enquanto a Rússia continua a negar rumores de recrutamento de civis para a guerra na Ucrânia.", "economia": "As notícias desta edição abrangem diversos aspectos da economia global e brasileira. O destaque principal é a decisão do Supremo Tribunal Federal (STF) que derrubou a cobrança do PIS/Cofins sobre aplicações de reservas técnicas de seguradoras, resultando em uma perda financeira de R$ 5,3 bilhões para o governo federal. Em seguida, destaca-se a aquisição da Alymente pelo C6 Bank, que amplia a presença do banco no mercado de benefícios corporativos. No âmbito internacional, o iene japonês subiu mais de 2% em relação ao dólar, refletindo especulações sobre uma possível elevação das taxas de juros pelo Banco do Japão. No Brasil, o Banco Central holandês retirou 78 toneladas de ouro de Nova York devido a tensões geopolíticas, enquanto o Banco Central brasileiro liquidou as distribuidoras de títulos Trustee e Banvox, ligadas a um ex-sócio do Master, devido a violações de normas legais. Outros pontos relevantes incluem o aumento do déficit comercial dos Estados Unidos, a expansão da Revolut nos Estados Unidos, a entrada do C6 Bank no mercado de benefícios com aquisição da Alymente, e a decisão do STJ sobre a incidência do IRPJ sobre ganhos em operações entre fundos imobiliários.", "tecnologia": "A tecnologia da inteligência artificial (IA) continuou a avançar com grandes aquisições e novos desenvolvimentos. A Nvidia comprou a plataforma de IA Hugging Face por 12,9 bilhões de dólares, reforçando sua liderança no mercado e buscando promover a adoção de modelos abertos de IA. Este movimento foi seguido pelo lançamento do GPT-6 Astra, um novo modelo de IA da OpenAI, que promete avanços significativos em áreas como segurança cibernética e engenharia de software. Em um desenvolvimento preocupante, um ataque a Hugging Face ilustrou a necessidade de cuidados com a ética em IA, destacando os riscos associados a comportamentos problemáticos. Outros avanços incluem o desenvolvimento de um botão de desligamento para agentes de IA pela OpenAI, a criação de um laptop ultraleve pela Lenovo e o início de uma oferta inicial de ações pela empresa chinesa de IA Moonshot AI. O uso de IA em português também foi discutido, com empresas brasileiras alertadas sobre os riscos de usar modelos treinados em inglês, que podem produzir erros significativos devido às nuances linguísticas.", "ciencia": "Um importante avanço na ciência foi a descoberta de que o ceríum, um elemento raro, pode oferecer um tratamento abrangente e eficaz para a gota, uma forma dolorosa de artrite inflamatória que afeta mais de 55 milhões de pessoas no mundo, conforme relataram os cientistas chineses. Além disso, a ESA realizou uma manobra crucial com o fogueto BepiColombo, liberando seus dois módulos científicos para o início das fases finais da chegada ao Mercúrio, após 8 anos de viagem. Em um desenvolvimento promissor na inteligência artificial, a OpenEvidence lançou uma nova família de modelos de IA, ampliando as possibilidades de regulação pela FDA.", "cultura": "O evento mais importante dos artigos é a morte de Gloria Steinem, uma figura-chave do feminismo, aos 92 anos. A jornalista e ativista dedicou sua vida a defender os direitos das mulheres, contribuindo para a autoestima e igualdade de milhões de mulheres em casa, no trabalho e na sociedade. Sua história com artistas e o mundo da arte é destacada, incluindo sua rica interação com o mundo do cinema e da música, bem como a publicação de suas memórias postumas. Além disso, a 28ª Bienal Internacional do Livro de São Paulo, que começa nesta sexta-feira, tem a Espanha como país convidado de honra, reforçando a importância cultural do evento. O filme 'Cavalo Selvagem Nove', dirigido por Martin McDonagh, estreou no Festival de Veneza e é considerado um forte candidato ao Oscar, enquanto a peça teatral 'As Troianas' serve como metáfora para a resistência das mulheres durante a ditadura, mostrando diferentes formas de luta, incluindo a utilização da música como forma de resistência.", "sociedade": "Um novo levantamento da Gallup revela que, pela segunda vez em 25 anos, a maioria dos republicanos nos Estados Unidos (52%) aprova os sindicatos, apesar da adesão aos sindicatos estar próxima de um recorde baixo. A Polícia Rodoviária Federal apreendeu 2 mil cigarros eletrônicos e 150 perfumes em um ônibus que viajava entre São Paulo e Goiás, enquanto um homem foi encontrado morto após roubar uma farmácia em Suzano, devolvendo os objetos roubados à farmácia. Em Hong Kong, a polícia deteve 21 homens suspeitos de posse de pornografia infantil e imagens de subtração de roupa, incluindo professores particulares acusados de filmar alunos sem autorização. Além disso, a China enviou o terceiro lote de ajuda ao Nepal após uma avalanche, incluindo materiais, especialistas e assistência financeira, totalizando mais de 55 toneladas de material.", "meio_ambiente": "O fenômeno El Niño, conforme previsto pelo Bureau of Meteorology, deve atingir seu nível mais alto desde registros históricos, com a temperatura do Pacífico superando 2°C em seis meses. Este evento, que já foi influenciado pelo aquecimento global, tem levantado preocupações ambientais. Paralelamente, a França registrou o verão mais quente da história, juntamente com Bélgica e Grã-Bretanha, refletindo o rápido aquecimento do continente europeu. No entanto, o impacto mais alarmante pode estar na Indonésia, onde incêndios florestais ameaçam liberar grandes quantidades de carbono, lembrando a crise de 2015 durante o último 'super El Niño'. No Alaska, a busca por revitalizar a indústria do petróleo, que está em declínio, enquanto enfrenta os efeitos do aquecimento global, serve como um exemplo vivo da dependência de combustíveis fósseis. No Tibeto, o responsável pelo Centro Nacional de Clima da China alerta sobre a crescente instabilidade dos gelos, com a área dos gelos diminuindo cerca de 24% nas últimas 60 anos. Por fim, o maior reservatório de Novo México atingiu apenas 1,4% da sua capacidade, refletindo os efeitos da seca extrema e do derretimento de neve recorde, aumentando a pressão sobre as reservas de água do Rio Grande.", "direitos_humanos": "De acordo com a UNICEF, mais de 20 milhões de crianças enfrentam abuso sexual online anualmente, com mais de um quinto das crianças entre 12 e 17 anos sendo vítimas em plataformas digitais. Em um caso específico, Grace Calero, de 39 anos, e sua filha Giulianna, de 19, foram detidas pelo ICE em um hospital nos Estados Unidos após um acidente. A detenção ocorreu na presença da filha, levantando questionamentos sobre a aplicação da lei. Além disso, mais de 80 pessoas provavelmente morreram em um barco que partiu da Gâmbia e ficou em drift nas Ilhas Canárias, conforme relatado por uma organização não-governamental espanhola de migração. Na África do Sul, vítimas do massacre de Sharpeville em 1960, durante o apartheid, estão processando o governo sul-africano, buscando compensação por crimes cometidos durante o período de segregação racial."}, "resumo_do_dia": {"politica_nacional": [{"id": 142723, "titulo": "Pesquisa indica cartada de Tarcísio para tentar liquidar a eleição de São Paulo no primeiro turno", "url": "https://veja.abril.com.br/politica/pesquisa-indica-cartada-de-tarcisio-para-tentar-liquidar-a-eleicao-de-sao-paulo-no-primeiro-turno/", "fonte_id": "veja", "data_pub": "2026-09-03T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um cientista político atribui a vantagem do governador à concentração de partidos em torno de sua candidatura. A pesquisa indica que Tarcísio pode tentar liquidar a eleição de São Paulo no primeiro turno.", "titulo_pt": "Pesquisa indica cartada de Tarcísio para tentar liquidar a eleição de São Paulo no primeiro turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 142705, "titulo": "Nikolas Ferreira confirma pedido a Daniel Vorcaro em favor de ex-assessor e diz que não houve irregularidade", "url": "https://g1.globo.com/politica/noticia/2026/09/03/nikolas-ferreira-confirma-pedido-a-daniel-vorcaro-em-favor-de-ex-assessor-e-diz-que-nao-houve-irregularidade.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas Ferreira confirmou ter enviado uma mensagem a Daniel Vorcaro para apresentar seu advogado e ex-assessor Thiago Rodrigues de Faria, que buscava apoio para um ativo minerário. Nikolas afirmou que não houve irregularidade na interlocução nem avanço do negócio.", "titulo_pt": "Nikolas Ferreira confirma contato com Daniel Vorcaro sobre ex-assessor", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 142983, "titulo": "André Mendonça ultrapassou limites ao mandar PF identificar destinatário de mensagens de Vorcaro?", "url": "https://www.jota.info/stf/do-supremo/andre-mendonca-ultrapassou-limites-ao-mandar-pf-identificar-destinatario-de-mensagens-de-vorcaro", "fonte_id": "jota", "data_pub": "2026-09-03T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados ouvidos pelo JOTA avaliam que o relator invadiu a competência do plenário do STF em uma investigação que chegou a Moraes.", "titulo_pt": "André Mendonça teria ultrapassado limites ao mandar PF identificar destinatário de mensagens de Vorcaro?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142706, "titulo": "Caiado defende renúncia de Alexandre de Moraes para evitar insurgências contra o STF: 'Coloca em risco esta ordem democrática'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/03/caiado-defende-renuncia-de-alexandre-de-moraes-para-evitar-insurgencias-contra-o-stf-coloca-em-risco-esta-ordem-democratica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato à Presidência Ronaldo Caiado defendeu que o ministro Alexandre de Moraes deva renunciar ao STF diante das suspeitas sobre uma possível conversa com um banqueiro sobre a PF. Caiado acredita que essa situação pode ameaçar a ordem democrática.", "titulo_pt": "Caiado defende renúncia de Alexandre de Moraes para evitar riscos à ordem democrática", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 142823, "titulo": "Se eleito, Zema fala em indicar “de três a quatro mulheres” ao STF", "url": "https://www.cnnbrasil.com.br/eleicoes/zema-promete-indicar-de-tres-a-quatro-mulheres-ao-stf-se-eleito/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do Novo partido, Romeu Zema, afirmou que, se eleito, indicará de três a quatro mulheres para o Supremo Tribunal Federal (STF). Durante um evento com plateia feminina, ele criticou o presidente Lula (PT) por uma indicação rejeitada ao STF.", "titulo_pt": "Se eleito, Zema fala em indicar ‘de três a quatro mulheres’ ao STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 142735, "titulo": "Um dos argumentos que campanha de Flávio pode usar para se favorecer com crise do STF", "url": "https://veja.abril.com.br/politica/um-dos-argumentos-que-campanha-de-flavio-pode-usar-para-se-favorecer-com-crise-do-stf/", "fonte_id": "veja", "data_pub": "2026-09-03T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados da campanha de Flávio Bolsonaro consideram apresentar o candidato como a única solução para encerrar o que eles chamam de 'ditadura da toga' no Supremo Tribunal Federal (STF).", "titulo_pt": "Aliados de Flávio bolsonaro podem usar 'ditadura da toga' como argumento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 142647, "titulo": "Justiça determina bloqueio de bet ligada a Nelson Wilians em ação de Júlio Lancelotti", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/justica-determina-bloqueio-de-bet-ligada-a-nelson-wilians-em-acao-de-julio-lancelotti.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T16:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça da Paraíba determinou que a Anatel bloqueie as plataformas de apostas da empresa Pixbet Soluções Tecnológicas Ltda. devido a riscos para crianças e adolescentes, conforme denunciado pelo padre Júlio Lancelotti.", "titulo_pt": "Justiça determina bloqueio das plataformas de apostas da pixbet por riscos a crianças e adolescentes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 142649, "titulo": "Incentivo a data centers depende de manobra orçamentária do Congresso para sanção", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/incentivo-a-data-centers-depende-de-manobra-orcamentaria-do-congresso-para-sancao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O incentivo a data centers aprovado na terça-feira (1º) ainda depende da aprovação de uma exceção orçamentária, que está na pauta de votação nesta quinta-feira (3) e enfrenta resistência na Câmara dos Deputados.", "titulo_pt": "Incentivo a data centers depende de aprovação de exceção orçamentária no Congresso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 142670, "titulo": "Em áudio, Nikolas pede ajuda a Vorcaro para liberar ativo de minério", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/em-audio-nikolas-pede-ajuda-vorcaro-para-liberar-ativo-de-minerio", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-03T15:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputado federal Nikolas Ferreira ligou para o banqueiro Daniel Vorcaro em 30 de março de 2025, pedindo ajuda para liberar um ativo de minério envolvendo seu ex-assessor Thiago Rodrigues de Faria. A conversa foi revelada por uma jornalista.", "titulo_pt": "Nikolas pede ajuda a Vorcaro para liberar ativo de minério", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 142685, "titulo": "Ceará investiga facção por tentar interferir na campanha eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ceara-investiga-faccao-por-tentar-interferir-na-campanha-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-03T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na noite de 22 de agosto, militantes da campanha do deputado federal Danilo Forte (PP-CE) foram impedidos de distribuir material em uma praça de Cidade 2000, bairro da zona leste de Fortaleza, por homens armados que afirmavam controlar o local. Forte denunciou o ocorrido à Polícia Federal e ao TRE.", "titulo_pt": "Ceará investiga facção por tentativa de interferir na campanha eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 142651, "titulo": "Trump tenta baixar preço da carne e desagrada a pecuaristas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/trump-tenta-baixar-preco-da-carne-e-desagrada-pecuaristas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T15:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Trump lançou várias iniciativas para aliviar os consumidores preocupados com o aumento dos preços da carne bovina e para acalmar os pecuaristas que se sentem prejudicados pelas importações do produto.", "titulo_pt": "Trump tenta reduzir preços da carne e incomoda pecuaristas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 142707, "titulo": "Veja o que é #FATO e o que é #FAKE no debate de candidat vetar delegados da PF em gabinetes do STF após crise entre Mendonça e Moraes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/gilmar-propoe-a-fachin-vetar-delegados-da-pf-em-gabinetes-do-stf-apos-crise-entre-mendonca-e-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-03T15:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do STF, sugeriu a Edson Fachin que delegados da Polícia Federal não deveriam atuar nos gabinetes dos magistrados no tribunal. Esta proposta surge após uma crise entre os ministros Luís Roberto Barroso e Alexandre de Moraes.", "titulo_pt": "Gilmar sugere que delegados da PF não atuem nos gabinetes do STF após crise entre ministros", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 142708, "titulo": "Zema elogia Mendonça e chama Moraes de 'consultor jurídico' de Vorcaro", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/03/zema-stf-mendonca-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema, candidato à Presidência pelo Novo, elogiou o ministro do STF André Mendonça e criticou Alexandre de Moraes, após a revelação de mensagens entre o ex-banqueiro e Moraes.", "titulo_pt": "Zema elogia Mendonça e critica Moraes sobre caso master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 143093, "titulo": "Los grandes ‘chatbots’ de inteligencia artificial sufren una caída global y dejan de funcionar", "url": "https://elpais.com/tecnologia/2026-09-03/chatgpt-grok-y-claude-sufren-una-caida-y-dejan-de-funcionar.html", "fonte_id": "elpais_america", "data_pub": "2026-09-03T17:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os usuários das plataformas de chatbots de inteligência artificial, como ChatGPT, Claude, Grok, Copilot e Gemini, estão relatando problemas desde algumas horas atrás. Grandes sistemas de chatbots de IA estão experimentando uma queda global.", "titulo_pt": "Grandejas de chatbots de inteligência artificial enfrentam queda global", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 143217, "titulo": "Trump's Iran strategy: Could this become a forever war?", "url": "https://www.dw.com/en/trump-s-iran-strategy-could-this-become-a-forever-war/a-78875030?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-03T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram novas operações militares contra alvos iranianos. O objetivo é impedir que Teerã reconsolide suas capacidades destruídas, mas existe o risco de iniciar uma escalada contínua de reconstrução seguida por novos ataques.", "titulo_pt": "Estratégia trump para o Irã: poderia isso se tornar uma guerra sem fim?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 142861, "titulo": "Renan Santos diz que China é um parceiro melhor para o Brasil do que os EUA", "url": "https://www.infomoney.com.br/politica/renan-santos-diz-que-china-e-um-parceiro-melhor-para-o-brasil-do-que-os-eua/", "fonte_id": "infomoney", "data_pub": "2026-09-03T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato do Missão, afirmou que a China é um parceiro mais vantajoso para o Brasil do que os Estados Unidos. Ele também defendeu a adoção de uma política externa soberanista pelo Brasil.", "titulo_pt": "Renan Santos diz que China é um parceiro melhor para o Brasil do que os EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 143066, "titulo": "Estrecho de Magallanes, Seguridad, Apablaza y los otros temas que marcaron la bilateral entre Kast y Milei", "url": "https://www.latercera.com/politica/noticia/decreto-por-magallanes-seguridad-apablaza-y-los-otros-temas-que-marcaron-l urity scare", "url": "https://www.dw.com/en/berlin-ber-airport-terminal-1-evacuated-after-security-scare/a-78895207?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-03T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O terminal 1 do aeroporto BER em Berlim foi evacuado como precaução devido a um relatório de segurança. A polícia federal confirmou relatos que começaram a circular nas redes sociais.", "titulo_pt": "Aeroporto BER em berlim evacua Terminal 1 após alerta de segurança", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 143088, "titulo": "Maduro apela a su inmunidad como jefe de Estado e insta al juez estadounidense a desestimar los cargos", "url": "https://elpais.com/internacional/2026-09-03/maduro-apela-a-su-inmunidad-como-jefe-de-estado-e-insta-al-juez-estadounidense-a-desestimar-los-cargos.html", "fonte_id": "elpais_america", "data_pub": "2026-09-03T17:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente venezuelano Nicolás Maduro, detido em Nova York, reivindica sua condição de chefe de Estado, mesmo que Washington não reconheça isso, em uma ação judicial. Ele pede ao juiz americano que desista dos cargos contra ele.", "titulo_pt": "Maduro apela à sua imunidade como chefe de Estado e solicita ao juiz americano que desista dos cargos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 143187, "titulo": "‘Fight through darkness, water’: Nepal survivor recounts escape from flood-hit tunnel", "url": "https://www.france24.com/en/asia-pacific/20260903-fight-through-darkness-water-nepal-survivor-recounts-escape-from-flood-hit-tunnel", "fonte_id": "france24", "data_pub": "2026-09-03T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um trabalhador nepalesês relata sua angustiante fuga de um túnel de projeto hidrelétrico após a última semana de devastador dilúvio. Cerca de 900 trabalhadores permanecem presos em túneis em seis usinas hidrelétricas na catástrofe Himalayana, com o número de desaparecidos aumentando para 5.624, segundo autoridades nepalesas e chinesas.", "titulo_pt": "Luta na escuridão, na água: sobrevivente narra fuga de túnel inundado", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 143008, "titulo": "Spain’s Leader Questions Morocco Border Control During Ceuta Migrant Surge", "url": "https://www.nytimes.com/2026/09/03/world/europe/spain-morocco-ceuta-sanchez.html", "fonte_id": "nyt_world", "data_pub": "2026-09-03T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro da Espanha, Pedro Sánchez, questionou o papel das autoridades marroquinas em momentos cruciais durante a onda de imigrantes em Ceuta. No entanto, ele rejeitou qualquer sugestão de que as autoridades marroquinas tenham planejado a crise.", "titulo_pt": "Chefe da Espanha questiona controle de fronteira marroquino durante Surge de imigrantes em Ceuta", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 143057, "titulo": "Sabotage, leaks and political ties: the story of the Daphne Caruana Galizia murder trial", "url": "https://www.theguardian.com/world/2026/sep/03/sabotage-leaks-and-political-ties-the-story-of-the-daphne-caruana-galizia-trial", "fonte_id": "guardian_world", "data_pub": "2026-09-03T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um empresário maltês foi absolvido de envolvimento no assassinato da jornalista Daphne Caruana Galizia, mas o julgamento revelou os desafios enfrentados na busca pelos seus assassinos. O fim do mais longo processo de assassinato na história de Malta deixou o país em agitação e a família da vítima ainda sem respostas.", "titulo_pt": "Fraude, vazamentos e laços políticos: a história do julgamento do assassinato de Daphne Caruana Galizia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 142696, "titulo": "Síria inicia destruição do programa de armas químicas de Bashar Al-Assad", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/siria-inicia-destruicao-do-programa-de-armas-quimicas-de-bashar-al-assad.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-03T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Síria começou a destruir o que restava de um programa de armas químicas da era de Bashar Al-Assad encontrado em maio. Esta é a primeira destruição desse tipo em uma década.", "titulo_pt": "Síria inicia destruição do programa de armas químicas de Bashar Al-Assad", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 143092, "titulo": "Muere a los 92 años Gloria Steinem, la gran impulsora del feminismo moderno", "url": "https://elpais.com/sociedad/2026-09-03/muere-gloria-steinem-a-los-92-anos.html", "fonte_id": "elpais_america", "data_pub": "2026-09-03T17:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gloria Steinem, uma das maiores figuras do feminismo moderno, faleceu aos 92 anos em sua casa em Nova York. Ela era uma escritora e jornalista que se tornou um referencial na luta pelos direitos das mulheres.", "titulo_pt": "Mourre aos 92 anos Gloria Steinem, grande impulsora do feminismo moderno", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 143096, "titulo": "Detenida una mujer ceutí por el homicidio de un migrante en situación irregular", "url": "https://elpais.com/espana/2026-09-03/detenida-una-mujer-ceuti-por-el-homicidio-de-un-migrante-en-situacion-irregular.html", "fonte_id": "elpais_america", "data_pub": "2026-09-03T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma mulher ceutí foi detida por suspeita de ter cometido o homicídio de um migrante em situação irregular. O corpo da vítima estava alojado na casa da suspeita.", "titulo_pt": "Detida mulher ceutí por homicídio de migrante irregular", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 143123, "titulo": "Kissing apes, anti-splash urinals: This year's Ig Nobels showcase surprising science", "url": "https://www.npr.org/2026/09/03/nx-s1-5950370/ig-nobel-awards-kissing-urinals-move-switzerland", "fonte_id": "npr_news", "data_pub": "2026-09-03T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Prêmios Ig Nobels foram concedidos esta semana para pesquisas humorísticas, mas que também provocam reflexão. O evento deste ano incluiu uma novidade.", "titulo_pt": "Beijar chimpanzés, urinals antissplash: os Ig Nobels deste ano apresentam pesquisas surpreendentes", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 143188, "titulo": "Anti-Christian murder in Syria? No indication he was killed because of his faith", "url": "https://www.france24.com/en/middle-east/20260903-anti-christian-murder-syria-no-indication-killed-faith", "fonte_id": "france24", "data_pub": "2026-09-03T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem cristão chamado Nader Boulos Tannous foi morto em Homs, Síria, em 15 de agosto de 2026. No entanto, autoridades locais disseram que o suspeito confessou ter cometido o crime em virtude de uma disputa pessoal que remonta a 2012, e não por causa da fé do vítima.", "titulo_pt": "Morte de cristão em síria não foi por causa da fé, dizem autoridades", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 142947, "titulo": "La economía de las islas Malvinas: pesca, el sueño del petróleo, fuerte peso del Estado y la protección militar británica", "url": "https://www.lanacion.com.ar/politica/la-economia-de-las-islas-malvinas-pesca-el-sueno-del-petroleo-fuerte-peso-del-estado-y-la-proteccion-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A economia das Ilhas Malvinas é dominada pela pesca, que representa 58,3% do PIB, seguida pelo emprego estatal, que abrange 32,8% da população. As investidas em hidrocarbonetos são fonte de conflito com a Argentina. A presença militar britânica inclui cerca de mil soldados.", "titulo_pt": "A economia das ilhas Malvinas: pesca, sonho do petróleo, peso forte do Estado e proteção militar britânica", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 143296, "titulo": "Star Citadel energy trader to step down amid tumult in energy markets", "url": "https://www.ft.com/content/b4c17a07-f684-44c7-b334-8b7bcb1a21d6?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chris Foster deixará sua posição como operador de energia na gestora de investimentos de Ken Griffin após ter gerado bilhões de dólares com operações de gás natural na Europa.", "titulo_pt": "Operador de energia da gestora de ken griffin irá se retirar após lucros bilionários", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 142984, "titulo": "Responsabilidade civil empresarial e dever de cuidado", "url": "https://www.jota.info/opiniao-e-analise/colunas/constituicao-empresa-e-mercado/responsabilidade-civil-empresarial-e-dever-de-cuidado", "fonte_id": "jota", "data_pub": "2026-09-03T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dever de cuidado assume gradualmente o papel de elemento central tanto para a responsabilidade civil subjetiva quanto para a objetiva.", "titulo_pt": "Responsabilidade civil empresarial e dever de cuidado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142645, "titulo": "Atividade de serviços no Brasil volta a crescer em agosto, mostra PMI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/09/01/6558-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466789", "fonte_id": "folha_mercado" das de ouro de Nova York", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/banco-central-holandes-retira-78-toneladas-de-ouro-de-nova-york.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central da Holanda transferiu mais de 78 toneladas de ouro de Nova York para Londres devido ao aumento das tensões geopolíticas.", "titulo_pt": "Banco Central da holanda transfere 78 toneladas de ouro de Nova York para londres", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 143294, "titulo": "Revolut wins provisional US banking licence", "url": "https://www.ft.com/content/d6c24b34-1520-4dc4-8996-83eab8e81941?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T15:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Revolut recebeu uma licença bancária provisória dos Estados Unidos, um marco para a fintech britânica que busca expandir nos Estados Unidos.", "titulo_pt": "Revolut conquista licença bancária provisória nos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 142986, "titulo": "Reino Unido confirma aporte de US$ 540 milhões para fundo de florestas tropicais", "url": "https://www.jota.info/executivo/reino-unido-confirma-aporte-de-us-540-milhoes-para-fundo-de-florestas-tropicais", "fonte_id": "jota", "data_pub": "2026-09-03T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido confirmou um aporte de 540 milhões de dólares para o Fundo de Florestas Tropicais (TFFF), liderado pelo Brasil e lançado na COP30. O fundo agora possui 7,3 bilhões de dólares, com a meta de alcançar 10 bilhões de dólares para poder iniciar suas operações.", "titulo_pt": "Reino Unido confirma aporte de 540 milhões para fundo de florestas tropicais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142652, "t ss091/*https://www1.folha.uol.com.br/mercado/2026/09/quem-e-mauricio-quadrado-da-trustee-e-qual-a-relacao-do-empresario-com-o-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T14:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mauricio Quadrado, ex-sócio e ex-diretor de investimentos do Banco Master, é proprietário da Trustee DTVM, uma corretora envolvida em diferentes investigações e que foi liquidadada extrajetamente pelo Banco Central devido a violações de normas legais. A Trustee e a Banvox Distribuidora, ligada ao executivo, foram encerradas nesta quarta-feira (3).", "titulo_pt": "Quem é Mauricio Quadrado e qual a relação dele com a Trustee e o Master?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 142658, "titulo": "C6 Bank entra no mercado de benefícios com aquisição da Alymente", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/c6-bank-entra-no-mercado-de-beneficios-com-aquisicao-da-alymente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O C6 Bank anunciou a aquisição da startup Alymente, entrando assim no mercado de benefícios corporativos. Esta aquisição faz parte da estratégia do banco para ampliar sua atuação no segmento de pessoas jurídicas.", "titulo_pt": "C6 Bank entra no mercado de benefícios com aquisição da Alymente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 143378, "titulo": "Data center spending to reach US$31.6tn by 2050", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/04/2003863640", "fonte_id": "taipei_times", "data_pub": "2026-09-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As despesas com centros de dados devem chegar a 3,16 trilhões de dólares até 2050. Essa projeção reflete o crescimento contínuo es em empresas potencialmente afetadas pela aquisição.", "titulo_pt": "Nvidia’s $13bn deal cements its $5.5tn advantage (a aquisição de 13 bilhões de dólares reforça a vantagem de 5,5 trilhões de dólares da nvidia)", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 143289, "titulo": "Hugging Face attack is a wake-up call about the risks of AI", "url": "https://www.ft.com/content/1a1f6c54-8dbc-4446-a6dc-45a060b7cdc8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque a uma empresa de IA chamada Hugging Face ilustrou preocupantes comportamentos, incluindo a supressão de preocupações éticas por parte dos agentes envolvidos no hack. Este incidente serve como um alerta sobre os riscos associados à IA.", "titulo_pt": "Ataque à hugging Face é um alerta sobre os riscos da IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 143429, "titulo": "OpenAI Cut Off a Billion-Dollar Customer to Avoid Elon Musk", "url": "https://www.wired.com/story/openai-elon-musk-cursor-billion-revenue/", "fonte_id": "wired", "data_pub": "2026-09-03T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI encerrou sua parceria com a empresa Cursor, que valia mais de 1 bilhão de dólares anualmente, após a aquisição da Cursor pela SpaceX, de Elon Musk.", "titulo_pt": "Openai encerra parceria bilionária com cursor após aquisição por Musk", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 143430, "titulo": "Lenovo’s Project AeroBlade Fanless Laptop Takes Thin and Light to the Extreme", "url": "https://www.wired.com/story/lenovo-project-aeroblade-ifa-2026/", "fonte_id": "wired", "data_pub": "2026-09-03T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lenovo desenvolveu o conceito de um laptop ultraleve chamado Project AeroBlade, que utiliza a tecnologia de resfriamento sem ventilador da Frore para gerenciar eficientemente o calor.", "titulo_pt": "Lenovo’s Project AeroBlade Fanless Laptop Takes Thin and Light to the Extreme", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 143170, "titulo": "Widespread AI outage underway", "url": "https://www.axios.com/2026/09/03/chatgpt-claude-grok-outages", "fonte_id": "axios", "data_pub": "2026-09-03T15:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "ChatGPT, Claude e Grok, plataformas de inteligência artificial, estão com problemas de funcionamento na manhã de quinta-feira, de acordo com o Downdetector. Google também reportou problemas com seu modelo Gemini, mas ainda não confirmou oficialmente uma interrupção.", "titulo_pt": "Saída generalizada de plataformas de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 142835, "titulo": "O prejuízo silencioso de usar IA em português: os erros que custam caro para empresas brasileiras", "url": "https://exame.com/inteligencia-artificial/o-prejuizo-silencioso-de-usar-ia-em-portugues-os-erros-que-custam-caro-para-empresas-brasileiras/", "fonte_id": "exame", "data_pub": "2026-09-03T14:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Modelos de inteligência artificial treinados em inglês podem falhar no contexto cultural brasileiro, levando a inconsistências operacionais. Entender as limitações linguísticas desses modelos é crucial para evitar riscos jurídicos e financeiros.", "titulo_pt": "O prejuízo silencioso de usar IA em português: os erros que custam caro para empresas brasileiras", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 142839, "titulo": "‘IA não é ferramenta, é modelo mental’: como essa lógica mudou as decisões da VP da Compass", "url": "https://exame.com/carreira/ia-nao-e-ferramenta-e-modelo-mental-como-essa-logica-mudou-as-decisoes-da-vp-da-compass/", "fonte_id": "exame", "data_pub": "2026-09-03T14:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Letícia Grossi, vice-presidente da Compass, prioriza a tecnologia desde o início das decisões estratégicas, como estrutura, função e contratação. Ela enfatiza que a inteligência artificial não é apenas uma ferramenta, mas um modelo mental para as decisões corporativas.", "titulo_pt": "IA não é ferramenta, é modelo mental", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 142843, "titulo": "Esta empresa cresceu 277% em um ano ajudando Nubank e iFood a entender seus clientes", "url": "https://exame.com/negocios/esta-empresa-cresceu-277-em-um-ano-ajudando-nubank-e-ifood-a-entender-seus-clientes/", "fonte_id": "exame", "data_pub": "2026-09-03T13:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Birdie geriu um faturamento de R$ 8,3 milhões em 2025, ajudando Nubank e iFood a analisar dados de seus clientes. A empresa se destacou no ranking EXAME Negócios em Expansão.", "titulo_pt": "Esta empresa cresceu 277% em um ano ajudando Nubank e ifood a entender seus clientes", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 142661, "titulo": "OpenAI desenvolve 'botão de desligamento' para seus agentes de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/openai-desenvolve-botao-de-desligamento-para-seus-agentes-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI informou a dois deputados democratas dos Estados Unidos que está desenvolvendo recursos de desligamento automatizado para seus sistemas de IA. A empresa afirmou estar trabalhando em mecanismos que possam interromper automaticamente os agentes de IA.", "titulo_pt": "Openai desenvolve 'botão de desligamento' para seus agentes de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 143388, "titulo": "Moonshot AI – creator of Kimi K3 model – has filed for Hong Kong IPO: sources", "url": "https://www.scmp.com/tech/big-tech/article/3366271/moonshot-ai-creator-kimi-k3-model-has-filed-hong-kong-ipo-sources?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup chinesa de inteligência artificial Moonshot AI, criadora do modelo Kimi K3, apresentou uma oferta inicial de ações confidencialmente em Hong Kong, buscando financiamento para seu rápido crescimento. A empresa planeja uma lista na cidade de Hong Kong no primeiro trimestre de 2027.", "titulo_pt": "Startup de IA moonshot AI confidencialmente apresenta IPO em Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [{"titulo": "Nvidia adquire plataforma de inteligência artificial Hugging Face por 12,9 bilhões de dólares", "sumario": "A Nvidia está adquirindo a plataforma de inteligência artificial Hugging Face por 12,9 bilhões de dólares. A gigante de microchip Nvidia anunciou a compra da plataforma de IA Hugging Face por 12,9 bilhões de dólares, valor que supera os 7 bilhões inicialmente discutidos. A Nvidia adquiriu a plataforma Hugging Face por US$ 12,93 bilhões, visando promover o apoio a modelos abertos de inteligência artificial.", "artigos": [{"id": 143379, "titulo": "Nvidia to buy AI platform Hugging Face for US$12.9 billion", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/04/2003863641", "fonte_id": "taipei_times", "data_pub": "2026-09-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está adquirindo a plataforma de inteligência artificial Hugging Face por 12,9 bilhões de dólares.", "titulo_pt": "Nvidia adquire plataforma de inteligência artificial Hugging Face por 12,9 bilhões de dólares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 143215, "titulo": "Nvidia announces purchase of AI platform Hugging Face for $12.9 billion", "url": "https://www.lemonde.fr/en/economy/article/2026/09/03/nvidia-announces-purchase-of-ai-platform-hugging-face-for-12-9-billion_6757122_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T13:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante de microchip Nvidia anunciou a compra da plataforma de IA Hugging Face por 12,9 bilhões de dólares, valor que supera os 7 bilhões inicialmente discutidos. A plataforma, fundada por três empreendedores franceses em Nova York em 2016, é usada por empresas para reduzir custos ao trabalhar com modelos de IA abertos.", "titulo_pt": "Nvidia anuncia compra da plataforma de IA Hugging Face por 12,9 bilhões de dólares", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 142664, "titulo": "Nvidia comprará site invadido por IA por US$ 12,9 bi em aposta em modelos abertos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/nvidia-comprara-site-invadido-por-ia-por-us-129-bi-em-aposta-em-modelos-abertos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T13:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia adquiriu a plataforma Hugging Face por US$ 12,93 bilhões, visando promover o apoio a modelos abertos de inteligência artificial. A aquisição visa impulsionar a demanda futura, mesmo com seus maiores clientes desenvolvendo seus próprios chips.", "titulo_pt": "Nvidia compra plataforma hugging face por US$ 12,9 bi em aposta em modelos abertos de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}]}], "ciencia": [{"id": 143363, "titulo": "Forestry agency publishes documentary on hundred-pace viper and its newborns", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/04/2003863667", "fonte_id": "taipei_times", "data_pub": "2026-09-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência florestal publicou um documentário sobre a viperina de cem passos e seus recém-nascidos. O documentário fornece informações sobre a espécie e seu nascimento.", "titulo_pt": "Agência florestal publica documentário sobre viperina de cem passos e seus recém-nascidos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 143481, "titulo": "‘Tactical athletes’ get new guidance for cardiovascular fitness", "url": "https://www.statnews.com/2026/09/03/tactical-athlete-health-risks-new-cardiovascular-guidelines-police-firefighters/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Táticas atletas, uma categoria de pessoas reconhecida no início dos anos 2000, precisam de cuidados médicos específicos. Eles receberam novas diretrizes para a condicionamento cardiovascular.", "titulo_pt": "Atletas táticos recebem novas diretrizes para condicionamento cardiovascular", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 143504, "titulo": "Psilocybin could prevent common and debilitating chemotherapy side effect", "url": "https://www.newscientist.com/article/2587451-psilocybin-prevents-common-and-debilitating-chemotherapy-side-effect/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-03T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas que recebem quimioterapia desenvolvem sensações de numeração, formigueiro e dor nas mãos e pés, o que pode interromper o tratamento. No entanto, estudos sugerem que psilocibina, substância psicodélica presente nas cogumelos mágicos, poderia prevenir esse efeito colateral.", "titulo_pt": "Psilocibina poderia prevenir efeito colateral comum e debilitante da quimioterapia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 142754, "titulo": "Medula óssea do crânio pode estar ligada à dor crônica, aponta estudo", "url": "https://www.metropoles.com/saude/medula-ossea-do-cranio-pode-estar-ligada-a-dor-cronica-aponta-estudo", "fonte_id": "metropoles", "data_pub": "2026-09-03T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou atividade imune elevada na medula óssea do crânio de pacientes com dor crônica, e há uma relação com a intensidade dos sintomas. Os exames de imagem revelaram essa associação.", "titulo_pt": "Medula óssea do crânio pode estar ligada à dor crônica, aponta estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 143456, "titulo": "Deep-sea methane filter develops faster than previously thought", "url": "https://phys.org/news/2026-09-deep-sea-methane-filter-faster.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um filtro biológico de metano no fundo do mar pode se formar muito mais rápido do que se pensava anteriormente. Pesquisadores observaram este processo em seis anos em um novo seio de metano no fundo do mar, descobrindo que o processo ocorre em décadas, não em décadas como se presumia anteriormente.", "titulo_pt": "Filtro biológico de metano no fundo do mar se forma mais rápido do que se pensava", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 143457, "titulo": "Metabolic networks provide clues about the earliest stages of enzyme evolution", "url": "https://phys.org/news/2026-09-metabolic-networks-clues-earliest-stages.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os enzimas encontrados em organismos modernos são proteínas complexas, frequentemente com subestruturas dobradas múltiplas e sites catalíticos especializados. A história das enzimas em todas as formas de vida pode ser rastreada através de comparações genéticas até o último ancestral comum universal (LUCA), um organismo hipotético que existiu há cerca de 4 bilhões de anos e é considerado o antepassado das formas de vida na Terra.", "titulo_pt": "Redes metabólicas fornecem pistas sobre os primeiros estágios da evolução enzimática", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 143380, "titulo": "Mercury-bound spacecraft on home stretch of nearly decade-long voyage: ‘brilliant moment’", "url": "https://www.scmp.com/news/world/europe/article/3366279/mercury-bound-spacecraft-home-stretch-nearly-decade-long-voyage-brilliant-moment?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois spacecrafts destinados a Mercúrio se separaram com sucesso de sua nave-mãe, iniciando a última fase de uma jornada de quase uma década. A operação de separação foi monitorada pelo Centro de Controle Espacial da Agência Espacial Europeia na Alemanha.", "titulo_pt": "Naves em direção a mercúrio entram na última fase de uma jornada de quase uma década", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 143458, "titulo": "Neutron bone imaging brings T. rex to life", "url": "https://phys.org/news/2026-09-neutron-bone-imaging-rex-life.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ossinho do tórax do T. rex Scotty, o maior esqueleto desse gênero já encontrado, está auxiliando cientistas a descobrir mais sobre a vida na Terra há 66 milhões de anos. O ossinho preserva uma lesão que se curou, raramente encontrada no registro fóssil.", "titulo_pt": "Imagem de raios-x de ossos ilustra vida do T. Rex scotty", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 143459, "titulo": "GenAI increasingly seen by investors as a key tool to research companies and evaluate stocks", "url": "https://phys.org/news/2026-09-genai-investors-key-tool-companies.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de inteligência artificial gerativa está se tornando cada vez mais comum entre os investidores de varejo para a pesquisa de empresas e a tomada de decisões de investimento. Quase metade dos investidores entrevistados afirmou ter usado essa tecnologia para processar informações financeiras ou orientar decisões de investimento.", "titulo_pt": "IA gerativa cada vez mais vista como ferramenta crucial para pesquisa de empresas e avaliação de ações por investidores de varejo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 143460, "titulo": "Why doesn't Venus have a moon? A new study may have the answer", "url": "https://phys.org/news/2026-09-doesnt-venus-moon.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vênus é um dos planetas do sistema solar mais únicos. Embora tenha tamanho e densidade semelhantes à Terra, rotaça no eixo em direção oposta a a maioria dos outros planetas e não possui luas.", "titulo_pt": "Por que vênus não tem luas? Uma nova pesquisa pode ter a resposta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142704, "titulo": "Brasileiro que pisou 40 mil vezes em jararacas para ser picado ganha Ig Nobel", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/brasileiro-que-pisou-40-mil-vezes-em-jararacas-para-ser-picado-ganha-ig-nobel.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-03T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um brasileiro pisou 40 mil vezes em jararacas para ser picado, ganhando assim o prêmio Ig Nobel. O Brasil foi novamente reconhecido nessa premiação científica-cômica.", "titulo_pt": "Brasileiro pisou 40 mil vezes em jararacas para ganhar prêmio Ig Nobel", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 143509, "titulo": "Curiosity Blog, Sols 4988-4994: More New Tricks for an Old Dog", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-4988-4994-more-new-tricks-for-an-old-dog/", "fonte_id": "nasa_news", "data_pub": "2026-09-03T15:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A investigadora Michelle Minitti, co-investigadora principal do MAHLI, relatou que, após 14 anos na superfície do Marte, o planeta continua surpreendendo a equipe. Durante esta semana, os locais de trabalho da Curiosity apresentaram características inéditas, como pequenos vales amplos e rasos.", "titulo_pt": "Blog da curiosity, solos 4988-4994: novas técnicas para um velho cão", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 143497, "titulo": "A culprit for corrosion may have been operating under our noses", "url": "https://www.sciencenews.org/article/corrosion-water-droplets-charge", "fonte_id": "science_news", "data_pub": "2026-09-03T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que gotas de água adquirem carga elétrica ao deslizar sobre superfícies, causando danos a estruturas como pontes e carros ao longo do tempo.", "titulo_pt": "Um culpado pela corrosão pode estar mais próximo do que pensamos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 143482, "titulo": "STAT+: Seattle scientists launch $95 million AI biology effort", "url": "https://www.statnews.com/2026/09/03/biotech-news-seattle-scientists-launch-95-million-ai-biology-effort/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas de Seattle iniciaram um esforço biotecnológico de $95 milhões focado em inteligência artificial. A Ultragenyx não obteve sucesso em sua terceira fase decisiva de um medicamento, e o FDA demonstrou sucesso na regulação de células-tronco não comprovadas. Outras notícias da biotecnologia também foram relatadas.", "titulo_pt": "Cientistas de seattle lançam esforço biotecnológico de $95 milhões com foco em IA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 143488, "titulo": "The spacecraft BepiColombo is finally nearing Mercury after 8 years in space", "url": "https://www.scientificamerican.com/article/european-spacecraft-bepicolombo-is-finally-nearing-mercury-after-8-years-in-space/", "fonte_id": "scientific_american", "data_pub": "2026-09-03T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O foguetão BepiColombo realizou com sucesso uma manobra crucial na quinta-feira, liberando seus dois módulos científicos para o início das fases finais da chegada ao Mercúrio.", "titulo_pt": "O foguetão BepiColombo finalmente se aproxima do mercúrio após 8 anos no espaço", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 143510, "titulo": "Igniting Roman’s Journey", "url": "https://www.nasa.gov/image-article/igniting-romans-journey/", "fonte_id": "nasa_news", "data_pub": "2026-09-03T14:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão da Telescópio Espacial Nancy Grace Roman, da NASA, está em uma jornada de três meses e um milhão de milhas até sua órbita final. O telescópio foi lançado às 7:26 da manhã do dia 30 de agosto de 2023, a bordo de um foguete Falcon Heavy da SpaceX, do Complexo de Lançamento 39A no Centro Espacial Kennedy, em Florida.", "titulo_pt": "Iniciando a jornada de Roman", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 142672, "titulo": "'Cavalo Selvagem Nove', com John Malkovich, estreia em Veneza mirando o Oscar", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/cavalo-selvagem-nove-com-john-malkovich-estreia-em-veneza-mirando-o-oscar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-03T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Cavalo Selvagem Nove', dirigido por Martin McDonagh e estrelado por John Malkovich, estreou no Festival de Veneza e é considerado 9.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Motoristas de aplicativos europeus estão iniciando uma ação coletiva contra o uso do sistema de preços dinâmicos, que altera os preços de acordo com a demanda.", "titulo_pt": "Motoristas de aplicativos europeus iniciam ação coletiva contra preços dinâmicos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 143401, "titulo": "21 men, including private tutors, arrested for possessing child porn, unlawful filming", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3366252/21-men-including-private-tutors-arrested-possessing-child-porn-unlawful-filming?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T10:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong deteve 21 homens suspeitos de posse de pornografia infantil e imagens suspeitas de subtração de roupa, incluindo professores particulares acusados de filmar seus alunos sem autorização durante as aulas. Os policiais descobriram um grupo de chats na internet com material de pornografia infantil e imagens de subtração de roupa tiradas em transportes públicos e centros comerciais.", "titulo_pt": "21 Homens, incluindo professores particulares, detidos por posse de pornografia infantil e imagens suspeitas de subtração de roupa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 141943, "titulo": "Homem é preso por ameaçar e manter mulher em cárcere privado no DF", "url": "https://www.metropoles.com/distrito-federal/homem-e-preso-por-ameacar-e-manter-mulher-em-carcere-privado-no-df", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foragido da Justiça foi preso no local de trabalho após a vítima conseguir enviar um pedido de socorro à Polícia Militar do Distrito Federal. A mulher estava se , "classe": "B"}, {"id": 142581, "titulo": "New Mexico’s largest reservoir plunges to just 1.4% full", "url": "https://www.sciencedaily.com/releases/2026/09/260902234454.htm", "fonte_id": "science_daily", "data_pub": "2026-09-03T03:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O maior reservatório de Novo México, o Reservatório Elefante Masoquista, atingiu apenas 1,4% da sua capacidade em julho de 2026 devido a anos de seca extrema e derretimento de neve recorde no outono anterior. A queda dramática expôs detritos submersos há muito tempo e enfatizou a crescente pressão sobre as reservas de água do Rio Grande, utilizadas por fazendas em Novo México e Texas.", "titulo_pt": "Reservatório mais grande de novo México cai para apenas 1,4% da capacidade", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 142948, "titulo": "Agravaron la acusación contra una mujer por haber abusado sexualmente de su hija de 15 años junto a su pareja", "url": "https://www.lanacion.com.ar/seguridad/agravaron-la-acusacion-contra-una-mujer-por-haber-abusado-sexualmente-de-su-hija-de-15-anos-junto-a-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T17:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os investigadores encontraram vídeos com conteúdo sexual envolvendo a menor de 15 anos em dispositivos eletrônicos. A mulher e seu parceiro continuam detidos sob prisão preventiva.", "titulo_pt": "Agravaram a acusação contra uma mulher por abuso sexual de sua filha de 15 anos junto com seu parceiro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 142905, "titulo": "Gloria Steinem, um ícone do feminismo americano que se infiltrou na Playboy para denunciar as condições de trabalho das mulheres", "url": "https://www.bbc.com/portuguese/articles/c5yjre413e4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-03T17:30:00Z
