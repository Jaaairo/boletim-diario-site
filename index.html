 Brasil que mais ‘perderam’ moradores, conforme estudo do IBGE", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ba/quais-capitais-do-brasil-que-mais-perderam-moradores-conforme-estudo-do-ibge/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do IBGE apontou Salvador (BA) como uma das capitais que mais perderam moradores. A cidade, que é a quinta mais populosa do Brasil, conta com 2.559.945 habitantes.", "titulo_pt": "Quais capitais do Brasil que mais perderam moradores, de acordo com estudo do IBGE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132938, "titulo": "Rescatan con vida a una niña de seis años tras permanecer casi 60 horas bajo escombros en Nepal", "url": "https://www.latercera.com/mundo/noticia/rescatan-con-vida-a-una-nina-de-seis-anos-tras-permanecer-casi-60-horas-bajo-escombros-en-nepal/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T20:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma menina de seis anos foi resgatada com vida após passar quase 60 horas sob escombros em Timure, próximo à fronteira com a China. A tragédia deixou 675 mortos e 2.418 desaparecidos no Nepal.", "titulo_pt": "Resgate com vida de menina de seis anos após 60 horas sob escombros em Nepal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 132786, "titulo": "PMDF prende foragido com mandado de prisão por tentativa de feminicídio", "url": "https://www.metropoles.com/distrito-federal/pmdf-prende-foragido-com-mandado-de-prisao-por-tentativa-de-feminicidio", "fonte_id": "metropoles", "data_pub": "2026-08-29T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi preso pela PMDF em Ceilândia, DF, após cerca de 10 dias de uma tentativa de feminicídio. O foragido tinha um mandado de prisão em aberto.", "titulo_pt": "PMDF prende foragido com mandado de prisão por tentativa de feminicídio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132860, "titulo": "Estremecedor video: rescatan con vida a una niña de seis años en Nepal tras 60 horas atrapada entre los escombros", "url": "https://www.lanacion.com.ar/el-mundo/estremecedor-video-rescatan-con-vida-a-una-nina-de-seis-anos-en-nepal-tras-60-horas-atrapada-entre-nid29082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-29T20:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Polícia Fronteriza de Nepal resgatou viva uma menina de seis anos chamada Manisha Magar após 60 horas sob os escombros na região de Timure.", "titulo_pt": "Estremecedor vídeo: resgatam viva uma menina de seis anos em Nepal após 60 horas enterrada nos escombros", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 132751, "titulo": "Após AVC, Pirula reaparece nas redes e declara apoio a Lito: “Tamo junto”", "url": "https://www.cnnbrasil.com.br/pop/celebridades/apos-avc-pirula-reaparece-nas-redes-e-declara-apoio-a-lito-tamo-junto/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O influenciador digital Pirula reapareceu nas redes sociais após sofrer um AVC em maio de 2025. Ele declarou apoio ao Lito em sua segunda aparição pública desde o incidente.", "titulo_pt": "Pirula reaparece nas redes e apoia Lito após AVC", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132212, "titulo": "Homem é preso após dar duas facadas na companheira em praça de Taguatinga", "url": "https://www.metropoles.com/distrito-federal/na-mira/homem-e-preso-apos-dar-duas-facadas-na-companheira-em-praca-de-taguatinga", "fonte_id": "metropoles", "data_pub": "2026-08-29T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi preso após esfaquear sua companheira na Praça do Bicalho, em Taguatinga. A vítima foi levada ao Hospital Regional de Taguatinga em estado grave.", "titulo_pt": "Homem é preso após esfaquear companheira em praça de Taguatinga", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 133436, "titulo": "Nepal rescue effort intensifies as death toll passes 700", "url": "https://www.ft.com/content/32978145-d33e-4ee3-957b-39fcc722d2be?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-30T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades alertam para o aumento da água que pode complicar os esforços de resgate, enquanto mais de 3.000 pessoas permanecem desaparecidas. O número de mortos ultrapassou 700 no Nepal.", "titulo_pt": "Esforço de resgate intensifica no nepal com mortes passando de 700", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 133367, "titulo": "Nepal warns of more possible floods as communities grapple with devastation and death toll rises", "url": "http://www.euronews.com/2026/08/30/nepal-warns-of-more-possible-floods-as-communities-grapple-with-devastation", "fonte_id": "euronews", "data_pub": "2026-08-30T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas de inundações foram enviados por telefone aos residentes durante a manhã de domingo, enquanto trabalhadores de resgate tentavam evacuar uma rota principal que conecta Katmandu a uma área severamente afetada pelas inundações de quarta-feira.", "titulo_pt": "Nepal avisa sobre possíveis inundações adicionais enquanto comunidades lidam com destruição e aumento do número de mortos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 133084, "titulo": "Grileiros avançam sobre berço de nascentes em área de preservação do DF", "url": "https://www.metropoles.com/distrito-federal/grileiros-avancam-sobre-berco-de-nascentes-em-area-de-preservacao-do-df", "fonte_id": "metropoles", "data_pub": "2026-08-30T05:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região próxima ao Privê Lago Norte II e vizinha da Serrinha do Paranoá tem importante papel hídrico e é alvo de invasões há anos.", "titulo_pt": "Grileiros avançam sobre berço de nascentes em área de preservação do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132986, "titulo": "Sudan’s date palm trees under threat from drought and wildfires", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/29/sudans-date-palm-trees-under-threat-from-drought-and-wildfires?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-29T18:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Sudão, as palmeiras de dátilo são uma linha de subsistência econômica para os habitantes do Estado do Norte. Essas árvores estão em perigo devido à seca e incêndios florestais.", "titulo_pt": "Palmeiras de dátilo do sudão ameaçadas por seca e incêndios", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 132958, "titulo": "Will this summer's climate disasters push French politicians and citizens to act?", "url": "https://www.lemonde.fr/en/environment/article/2026/08/29/will-this-summer-s-climate-disasters-push-french-politicians-and-citizens-to-act_6756972_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forasteiras, incêndios florestais e secas, todos acentuados pelo aquecimento global, não causam mudanças nas atitudes públicas sem uma forte vontade política. No entanto, há uma sensação crescente de necessidade de proteção e medidas concretas.", "titulo_pt": "Esses desastres climáticos de verão irão empurrar os políticos e cidadãos franceses a agirem?", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 132214, "titulo": "Temporais deixam ao menos três mortos e causam estragos no Sul", "url": "https://www.metropoles.com/brasil/temporais-deixam-ao-menos-tres-mortos-e-causam-estragos-no-sul", "fonte_id": "metropoles", "data_pub": "2026-08-29T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais intensos causaram três mortes e deixaram estragos nos estados do Rio Grande do Sul e Santa Catarina. Uma frente fria está avançando para o Sudeste.", "titulo_pt": "Temporais deixam três mortos e causam estragos no Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132256, "titulo": "Inmet emite alerta para estados que podem ter “secura de deserto”; veja lista", "url": "https://www.cnnbrasil.com.br/nacional/brasil/inmet-emite-alerta-para-estados-que-podem-ter-secura-de-deserto-veja-lista/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) emitiu um alerta para estados que podem experimentar uma umidade relativa do ar muito baixa, comparável a desertos como o Saara. A umidade pode variar entre 20% e 12%, níveis muito baixos.", "titulo_pt": "Inmet emite alerta para estados com 'secura de deserto'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132168, "titulo": "Marina rebate Flávio Bolsonaro sobre clima: ‘Saneamento é importante, mas não resolve mudança do clima’", "url": "https://veja.abril.com.br/politica/marina-rebate-flavio-bolsonaro-sobre-clima-saneamento-e-importante-mas-nao-resolve-mudanca-do-clima/", "fonte_id": "veja", "data_pub": "2026-08-29T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva rebateu Flávio Bolsonaro ao afirmar que saneamento é importante, mas não resolve a mudança do clima. Durante uma agenda com Haddad em Osasco, ela acusou o candidato do PL de 'negacionista' após uma sabatina no Jornal Nacional.", "titulo_pt": "Marina rebate Flávio Bolsonaro sobre clima: 'saneamento é importante, mas não resolve mudança do clima'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132794, "titulo": "Em ano de El Niño forte, Brasil terá ao menos seis ondas de calor até dezembro", "url": "https://exame.com/esg/em-ano-de-el-nino-forte-brasil-tera-ao-menos-seis-ondas-de-calor-ate-dezembro/", "fonte_id": "exame", "data_pub": "2026-08-29T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Cemaden prevê que, com o fenômeno El Niño forte, o Brasil terá pelo menos seis ondas de calor até dezembro. O fenômeno, combinado com o aquecimento global, pode aumentar a frequência e intensidade de eventos extremos, com risco de incêndio em 35% do território.", "titulo_pt": "Em ano de El Niño forte, Brasil terá ao menos seis ondas de calor até dezembro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 132568, "titulo": "Man held after laundry capsules dumped into pond, killing catfish and injuring turtles", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3365720/man-held-after-laundry-capsules-dumped-pond-killing-catfish-and-injuring-turtles?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 42 anos foi preso após supostamente descartar cápsulas de lavagem em um lago, matando um tilápia e ferindo 30 tartarugas em Ma On Shan, na China. A polícia foi notificada por um vigilante que encontrou grande quantidade de espuma no lago, onde as tartarugas eram mantidas.", "titulo_pt": "Homem preso após descartar cápsulas de lavagem em lago, matando peixe e ferindo tartarugas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 132268, "titulo": "Após enchentes, Nepal estima que reconstrução custará até US$ 5 bilhões", "url": "https://www.cnnbrasil.com.br/internacional/apos-enchentes-nepal-estima-que-reconstrucao-custara-ate-us-5-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nepal estima que a reconstrução após as enchentes possa custar até US$ 5 bilhões. Prejuízos e danos ainda estão sendo avaliados pelo ministro das Finanças.", "titulo_pt": "Após enchentes, Nepal estima que reconstrução custará até US$ 5 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131638, "titulo": "A biodiversidade entrou no compliance", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-biodiversidade-entrou-no-compliance", "fonte_id": "jota", "data_pub": "2026-08-29T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A biodiversidade está se integrando na compliance corporativo com o Marco Global da Biodiversidade e o TNFD (Taskforce on Nature-related Financial Disclosures) incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza.", "titulo_pt": "A biodiversidade entrou no compliance", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131761, "titulo": "Plug-in solar panels could save households up to $370 a year – if Australia made them legal as in the UK", "url": "https://www.theguardian.com/environment/2026/aug/29/plug-in-solar-panels-could-save-households-370-a-year-and-experts-say-australia-should-copy-the-uk-in-legalising-them", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instalação de kits solares plugáveis, que custam aproximadamente $1.000, pode pagar-se em três anos, de acordo com um especialista. Uma organização de advocacy sugere que a legalização desses kits no Australia, como no Reino Unido, poderia economizar até $370 por ano nas contas de energia dos australianos e ajudar no combate às mudanças climáticas.", "titulo_pt": "Kit solar plugável poderia economizar até $370 por ano para os australianos se a austrália legalizasse como no reino unido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132004, "titulo": "US families hold out hope for relatives lost in Nepal floods", "url": "https://www.scmp.com/news/asia/south-asia/article/3365688/us-families-hold-out-hope-relatives-lost-nepal-floods?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T05:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mukti Patel está reunida com familiares e amigos em sua casa em Richmond, Virginia, desde que seu pai, irmã e outras duas relações desapareceram nas cheias catastróficas perto da fronteira entre Nepal e China. Ela ainda não fala em passado, pois não há informações sobre o paradeiro deles.", "titulo_pt": "Famílias americanas mantêm esperança por parentes desaparecidos nas cheias no Nepal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131765, "titulo": "‘Winter panic’: EU gas stores at their lowest level in 13 years", "url": "https://www.theguardian.com/business/2026/aug/29/european-gas-stores-lowest-13-years-eu-price", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa está prestes a entrar no inverno com seus estoques de gás em níveis historicamente baixos, com 63% de capacidade no final de agosto, abaixo da média de 80% registrada nos últimos anos. Especialistas advertiram que essa situação pode causar 'pânico de inverno' entre os comerciantes de energia.", "titulo_pt": "Pânico de inverno: estoques de gás da Europa estão nos níveis mais baixos em 13 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132038, "titulo": "Flood devastation", "url": "https://www.koreaherald.com/article/10856068", "fonte_id": "korea_herald", "data_pub": "2026-08-29T03:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre de enxurrada catastrófica atingiu a região Himalayense da fronteira entre Nepal e Tibet em 26 de agosto, causando mais de 600 mortes, destruindo casas, estradas e pontes, e deixando milhares de pessoas desaparecidas, incluindo mais de 500 estrangeiros de mais de 30 países.", "titulo_pt": "Desastre de enxurrada", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 133484, "titulo": "Pakistan suspends 8 officials after maternity ward fire kills 14 infants", "url": "https://www.scmp.com/news/asia/south-asia/article/3365749/pakistan-suspends-8-officials-after-maternity-ward-fire-kills-14-infants?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Paquistão suspendeu oito funcionários após um incêndio em uma unidade materna de um hospital na capital do país resultar na morte de 14 bebês. Um relatório preliminar indicou que o fogo consumiu a unidade em aproximadamente dois minutos após as 6h30 de quarta-feira, com apenas um dos 15 bebês sob cuidado salvo por uma enfermeira.", "titulo_pt": "Paquistão suspende 8 funcionários após incêndio em unidade materna matar 14 bebês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133454, "titulo": "Killing of Palestinian children and teens by Israel surges in West Bank", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/west-bank-palestinian-children-teens-israel/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezesseis meses após outubro de 2023, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses na Cisjordânia.", "titulo_pt": "Evolução no número de crianças e adolescentes palestinos mortos por forças israelenses na cisjordânia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 133105, "titulo": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "url": "https://www.cnnbrasil.com.br/politica/stf-julga-licenca-para-maes-adotivas-e-recusa-de-transfusao-em-setembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em setembro, o Supremo Tribunal Federal (STF) julgará questões relacionadas a licença para mães adotivas, recusa de transfusão sanguínea, planos de saúde de idosos, gratuidade na Justiça do Trabalho e recusa de tratamento médico.", "titulo_pt": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133277, "titulo": "A lone Black woman’s defiance of Swedish neo-Nazis, 10 years on", "url": "https://www.theguardian.com/world/2026/aug/30/sweden-neo-nazi-resistance-2016-tess-asplund-far-right", "fonte_id": "guardian_world", "data_pub": "2026-08-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2016, Tess Asplund, uma mulher negra sozinha, levantou o punho em protesto contra uma parada de neonazistas em Estocolmo. Dez anos depois, ela vê a foto como um sinal dos mudanças na sociedade sueca, especialmente com a ascensão do extremismo de direita nas eleições.", "titulo_pt": "A defesa sozinha de uma mulher negra contra neonazistas, 10 anos depois", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133269, "titulo": "Humanitarian crisis worsening in refuge for civilians fleeing Sudan’s civil war", "url": "https://www.theguardian.com/world/2026/aug/30/humanitarian-crisis-worsening-refuge-civilians-sudan-el-obeid", "fonte_id": "guardian_world", "data_pub": "2026-08-30T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As condições humanitárias na cidade de El Obeid e nas duas acampamentos próximos estão se agravando, com mais pessoas chegando todos os dias devido ao conflito entre as Forças Armadas Sudanêsas e a Milícia Rapid Support Forces (RSF). Segundo a ONU, mais de 15.000 famílias chegaram desde julho, somando-se a mais de 200.000 que chegaram no primeiro semestre do ano, de acordo com os dados do governo.", "titulo_pt": "Situação humanitária se agrava em refúgio para civis que fogem da guerra no sudão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133417, "titulo": "Amnesty urges action after Katz threatens expulsions over Gaza kites", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/amnesty-urges-action-after-katz-likens-gaza-kites-drones", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T05:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International pediu ação após Israel ameaçar expulsar palestinos por voar kites em Gaza. O ministro de Defesa israelense, Israel Katz, instruiu o exército a expulsar palestinos de áreas onde crianças estão voando kites e liberando balões.", "titulo_pt": "Amnistia pede ação após ameaças de expulsões por causa de kites em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133422, "titulo": "Amnesty calls for Dr Abu Safiya's release as he completes 600 days in Israeli detention", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/amnesty-calls-dr-abu-safiyas-release-he-completes-600-days-israeli", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T02:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International está pedindo a liberdade do pediatra palestino Hussam Abu Safiya, que foi detido israelense há 600 dias sem acusação ou julgamento. Ele é diretor do Hospital Kamal Adwan em Gaza e se tornou internacionalmente conhecido durante o genocídio israelense devido ao seu trabalho em auxiliar vítimas.", "titulo_pt": "Amnistia pede liberdade de Dr. Abu Safiya após 600 dias em detenção israelense", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133428, "titulo": "Israeli settlers beat two elderly Palestinian sisters in Ramallah", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-settlers-beat-two-elderly-palestinian-sisters-ramallah", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T00:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois irmãos palestinas idosas, de 75 e 65 anos, foram agredidas por colonos israelenses enquanto colhiam figos em Silwad, próximo a Ramallah. Além das agressões, as mulheres tiveram seus telefones celulares e chaves do veículo roubados.", "titulo_pt": "Colônios israelenses agredem duas irmãs idosas palestinas em silwad", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133403, "titulo": "Online anti-Muslim backlash collides with different reality in South Africa", "url": "https://www.aljazeera.com/news/2026/8/30/online-anti-muslim-backlash-collides-with-different-reality-in-south-africa?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T00:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A retórica anti-muçulmana online está se intensificando, mas a realidade no chão revela uma história mais complexa.", "titulo_pt": "Contradição entre retórica anti-muçulmana online e realidade no chão na áfrica do sul", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 132731, "titulo": "Quase 900 trabalhadores de usinas do Nepal estão desaparecidos", "url": "https://www.cnnbrasil.com.br/internacional/quase-900-trabalhadores-de-usinas-do-nepal-estao-desaparecidos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase 900 trabalhadores de usinas de energia no Nepal estão desaparecidos. Até o momento, 361 funcionários foram resgatados.", "titulo_pt": "Quase 900 trabalhadores de usinas de energia no Nepal estão desaparecidos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132735, "titulo": "Justiça manda soltar chileno preso após ofensas racistas e homofóbicas em voo da Latam", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/justica-manda-soltar-chileno-preso-apos-ofensas-racistas-e-homofobicas-em-voo-da-latam/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça decidiu soltar Germán Andrés Naranjo Maldini, um chileno preso por ofensas racistas e homofóbicas durante um voo da Latam. A decisão foi tomada após a Justiça considerar que houve alterações no processo.", "titulo_pt": "Justiça libera chileno após ofensas racistas e homofóbicas em voo da Latam", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132170, "titulo": "MPF investiga venda de mercúrio a garimpeiros da Amazônia por meio do TikTok", "url": "https://veja.abril.com.br/brasil/mpf-investiga-venda-de-mercurio-a-garimpeiros-da-amazonia-por-meio-do-tiktok/", "fonte_id": "veja", "data_pub": "2026-08-29T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria Federal da República investiga a venda de mercúrio a garimpeiros ilegais na Amazônia através do TikTok. A investigação se concentra em perfis que utilizam a plataforma para oferecer o produto de forma ilegal.", "titulo_pt": "MPF investiga venda de mercúrio a garimpeiros ilegais da Amazônia por meio do TikTok", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132521, "titulo": "Palestinian residents trapped as Israeli settlers surround home in occupied West Bank village", "url": "https://www.middleeasteye.net/news/israeli-settlers-lay-siege-palestinian-homes-occupied-west-bank-village", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinianos estão presos em sua casa no vilarejo ocupa do West Bank de Qusra, cercados por setitadores israelenses que incendiaram terras palestinas nas proximidades. Israelenes militares estão presentes no local, mas não interviram para liberar os residentes.", "titulo_pt": "Palestinos presos enquanto setitadores israelenses cercam sua casa no vilarejo ocupado de qusra, West Bank", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 132269, "titulo": "Caso Gisele: STJ nega habeas corpus de tenente-coronel réu por feminicídio de PM em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/caso-gisele-stj-nega-habeas-corpus-de-tenente-coronel-reu-por-feminicidio-de-pm-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tenente-coronel Geraldo Leite Rosa Neto, acusado do feminicídio da soldado Gisele Alves Santana, teve o habeas corpus negado pelo STJ e permanece detido no presídio militar Romão Gomes, na zona Norte de São Paulo.", "titulo_pt": "Caso Gisele: STJ nega habeas corpus de tenente-coronel réu por feminicídio de PM em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131927, "titulo": "Refugees International president trashes Israel's Gaza food claims", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/refugees-international-president-trashes-israels-gaza-nutrition-claims", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Refugees International, Jeremy Konyndyk, criticou as afirmações israelenses sobre a melhora nas estatísticas de malnutrição em Gaza, afirmando que isso não invalida a declaração de fome do ano anterior. Konyndyk explicou que a melhora nos níveis de malnutrição ocorreu porque Israel levantou o bloqueio de ajuda alimentar após a declaração de fome.", "titulo_pt": "Presidente da refugees International critica declarações israelenses sobre Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 131718, "titulo": "El fallo del TC: que no pague la gente", "url": "https://www.ciperchile.cl/2026/08/28/el-fallo-del-tc-que-no-pague-la-gente/?utm_source=rss&utm_medium=rss&utm_campaign=el-fallo-del-tc-que-no-pague-la-gente", "fonte_id": "ciper_chile", "data_pub": "2026-08-29T02:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
