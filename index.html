<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

re Washington e Pyongyang, com a Coreia do Norte negando a envio de tropas adicionais para a Ucrânia, conforme declarou a irmã do líder norte-coreano, Kim Yo-jong, também relatado pela Yonhap News. Em outro desenvolvimento, o STF discute a aplicação da Lei Maria da Penha em casos de violência de gênero fora do ambiente doméstico, em uma sessão ao vivo no dia 19 de agosto de 2026. Além disso, o presidente ucraniano, Volodymyr Zelenskyy, demitiu sua principal assistente em meio a acusações de corrupção, conforme relatado pelo CartaCapital. Por fim, um grupo parlamentar japonês fará uma visita à China na próxima semana, marcando a primeira reunião de um grupo de deputados japoneses com um oficial do Partido Comunista Chinês desde novembro, informado pelo The Japan Times.\n\nOs conflitos geopolíticos continuam a dominar o cenário internacional. A Ucrânia enfrenta intensos ataques aéreos russos, resultando em pelo menos cinco mortes. O conflito persiste, com Israel continuando a atacar zonas no sul do Líbano, apesar de um acordo de alto-fogão com os Estados Unidos. A Coreia do Norte criticou as manobras militares conjuntas entre EUA e Coreia do Sul, considerando-as uma ameaça à segurança regional. Em outro front, o Irã está avaliando possíveis ataques a alvos americanos na Europa, enquanto os Emirados Árabes Unidos impuseram um embargo comercial indefinido ao Irã em resposta a supostos ataques com mísseis. As tensões na região do Mar do Norte também aumentaram, com incidentes envolvendo grandes embarcações causando problemas de segurança em tentativas de travessias para a Inglaterra. Estes eventos refletem a complexidade e a instabilidade da atual situação geopolítica global.", "economia": "A SK hynix, gigante sul-coreana da indústria de chips, anunciou a compra de ações no valor recorde de US$ 28,9 bilhões, buscando tranquilizar os investidores em meio ao boom de investimentos em inteligência artificial. O Tesouro dos Estados Unidos anunciou que dobrará o volume de suas aquisições de títulos de longo prazo, em resposta a uma onda de vendas que elevou os custos de financiamento a níveis não vistos há 19 anos. O dólar recuou para R$ 5,16 nesta quarta-feira, impulsionado pela decisão do Tesouro dos EUA de dobrar o volume de aquisições de títulos de vencimento mais longo, enquanto a bolsa subiu mais de 2%.", "tecnologia": "A OpenAI parou os testes com a IA Astra quando ela atingiu um nível crítico de habilidades em cibersegurança, o que levou a uma pausa nas atividades de desenvolvimento de algumas tecnologias de inteligência artificial. A empresa enfrenta uma forte concorrência da Anthropic e ameaças de rivais chineses, o que a fez reavaliar suas estratégias de segurança. Em outro desenvolvimento, a Agência Nacional de Proteção de Dados (ANPD) começou uma nova fase de regulação das plataformas digitais, com uma decisão sobre o Discord, considerada importante por Pablo Ortellado, professor de Gestão de Políticas Públicas da USP. Na área de cibersegurança, a Roblox prometeu implementar mudanças em sua plataforma após a comissária de eSafety australiana descobrir que adultos ainda podiam ver contas de crianças e enviar solicitações de conexão sem o consentimento dos pais. Além disso, a Tria+, desenvolvida pelo Kaspper do Grupo Accesstage, realiza avaliações de perfil e compatibilidade cultural antes da triagem humana, reduzindo até 80% o tempo necessário para contratar novos funcionários através do WhatsApp.", "ciencia": "Um sistema de preservação de sementes auxilia na cultura de leguminosas, garantindo a conservação adequada das sementes. Em um avanço significativo na pesquisa anticâncer, um regime combinado de vacina anticâncer da Moderna e do medicamento Keytruda mostrou promessa em um estudo em fase avançada, estendendo o tempo de sobrevivência dos pacientes sem que o melanoma retornasse. A STAT iniciou uma nova iniciativa focada em fornecer jornalismo confiável e rigoroso, destacando a importância da confiança na ciência. A Regeneron obteve aprovação para um medicamento que trata uma ultra-rara doença causada pelo crescimento ósseo em locais inadequados. A NASA concedeu fundos para fortalecer e padronizar caminhos educacionais estatais para estudantes de tecnologia aeroespacial, visando acelerar o desenvolvimento de trabalhadores qualificados para a indústria aeroespacial. Um estudo recente mostrou que os 'minicérebros' de laboratório podem continuar funcionando por mais de cinco anos, imitando diversos estágios do desenvolvimento do sistema nervoso humano, o que pode ajudar na pesquisa sobre doenças cerebrais. Além disso, a NASA revelou imagens de uma cratera de 60 metros de largura na Lua causada por um fragmento de foguete SpaceX.", "cultura": "Angie Nixon, nascida em Jacksonville, com 42 anos e filiada ao Partido Democrata, surpreendeu ao vencer a primária do Senado da Flórida. Fundadora de uma livraria comunitária local chamada Café Resistance e co-autora de um gibi com sua filha, Nixon se destacou como uma defensora da cultura e do movimento negro. Em Gramado, o filme 'Leite em Pó', dirigido por Carlos Segundo, conquistou o público com seu humor inusitado e sua abordagem poética do luto e da música. A exposição Alice Oliveira, no Museu da Diversidade Sexual em São Paulo, reúne 30 fotografias que retratam os movimentos feministas, lésbicos e LGBTQ+ dos anos 1980 e 1990, celebrando o trabalho de quatro décadas da ativista e fotógrafa Alice Oliveira. Em outro evento cultural, o Theatro Municipal de São Paulo cancelou algumas óperas após a troca de gestão, agora administrada pelo Instituto Baccarelli.", "sociedade": "A sociedade enfrenta diversos desafios em diferentes regiões do mundo. Em primeiro lugar, uma situação de violência doméstica em Americana, São Paulo, chama a atenção. Um adolescente assistido pela Apae relatou ter sido vítima de violência por parte do próprio pai. Em outro incidente, Cláudio Rafael Landeiro, um homem de 37 anos, foi agredido por entregadores em Copacabana, Rio de Janeiro, após ter sido confundido com um ladrão. No Paraná, a Promotoria de Justiça denunciou uma médica por mortes em uma unidade de terapia intensiva pediátrica, acusando-a de homicídio culposo por negligência. No Chile, um conservador de bens imóveis foi condenado a pagar uma indenização de mais de 25 milhões de pesos chilenos por acidente sexual e laboral. No Brasil, o Grupo Casas Bahia teve suas demissões coletivas suspensas pelo Tribunal Regional do Trabalho da 10ª Região. Em Bangladesh, foi lançado um serviço de ônibus exclusivo para mulheres em Dhaka, chamado 'Pink Bus', visando oferecer transporte seguro. Em outro contexto, um tribunal laboral condenou o ex-padrasto de uma adolescente de 14 anos, Alice Nitz, que foi morta com marcas de esfaqueamento, preso após sua prisão na terça-feira. Finalmente, em Ansermanuevo, Colômbia, agricultores afetados por um terremoto de magnitude 7,4 estão em situação crítica, com a necessidade de ajuda e socorro sendo amplamente divulgada.", "meio_ambiente": "Um incidente grave ocorreu em uma área de ecossistema único na Argentina, onde um homem danificou o ecossistema da Pampa del Leoncito com seu caminhão, levantando preocupações ambientais. No Reino Unido, o governo está investindo em armazenamento de energia a longo prazo, conhecido como 'super baterias', para enfrentar desafios climáticos. No Brasil, a prefeitura de São Paulo planeja cobrir todos os passeios com sombra até 2028 para combater ondas de calor. Em um cenário mais preocupante, um grande incêndio em um centro de reciclagem em Londres, que envolveu 15 viaturas de bombeiros, destaca os riscos de segurança ambiental. Além disso, a reforma tributária no Brasil pode aumentar as emissões de gases do efeito estufa, enquanto a mineração ainda não se adaptou efetivamente às mudanças climáticas, com apenas 7% das comunidades próximas às operações mineradoras estarem preparadas para desastres climáticos.", "direitos_humanos": "Israel está abrindo investigações criminais em vários casos envolvendo mortes e violações de direitos humanos, incluindo a morte de uma menina palestiniana de cinco anos, Hind Rajab, e de médicos humanitários. De acordo com relatos, essas investigações, conduzidas pela Força Armada israelense, não resultam em condenações, o que tem levantado preocupações sobre a falta de justiça para as vítimas e suas famílias. Além disso, o Irã executou pelo menos 900 pessoas desde janeiro de 2026, incluindo 56 por crimes políticos ou de segurança nacional e 98 membros de minorias étnicas, conforme informado por um relatório do Centro Abdorrahman Boroumand. Em outro incidente, mais de 200 mulheres acusam um ex-funcionário do governo francês de ter drogado e humilhado, levando a uma investigação policial. Estes eventos refletem situações complexas e graves que afetam os direitos humanos em diferentes partes do mundo, desde conflitos militares até violações de direitos em territórios pacíficos."}, "resumo_do_dia": {"politica_nacional": [{"id": 111853, "titulo": "Entidades de imprensa reagem a declarações de Dino e Moraes sobre diploma para jornalistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/entidades-de-imprensa-reagem-a-declaracoes-de-dino-e-moraes-sobre-diploma-para-jornalistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades do jornalismo reagiram às declarações dos ministros Flávio Dino e Alexandre de Moraes sobre a possibilidade de rever a exigência de diploma para jornalistas. A obrigatoriedade do diploma foi derrubada pelo Supremo Tribunal Federal em 2009.", "titulo_pt": "Entidades do jornalismo reagem a declarações sobre possibilidade de rever diploma para jornalistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111977, "titulo": "Caiado sobre Marcola, alvo da PF: \"Crime da sala do presidente\"", "url": "https://www.metropoles.com/colunas/milena-teixeira/caiado-sobre-marcola-alvo-da-pf-crime-da-sala-do-presidente", "fonte_id": "metropoles", "data_pub": "2026-08-19T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, governador de Goiás, afirmou que Marcola, ex-braço direito de Lula, precisa esclarecer sobre joias e um empréstimo de R$ 250 mil. Caiado considera Marcola alvo de investigações da Polícia Federal.", "titulo_pt": "Caiado sobre Marcola, alvo da PF: 'crime da sala do presidente'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 111854, "titulo": "Reprovação de conta não significa inelegibilidade automática, diz presidente do TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/reprovacao-de-conta-nao-significa-inelegibilidade-automatica-diz-presidente-do-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, ministro Kassio Nunes Marques, afirmou que a reprovação de contas de um candidato que ocupou cargo público não implica automaticamente na inelegibilidade do candidato.", "titulo_pt": "Reprovação de contas não significa inelegibilidade automática, diz presidente do TSE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 112182, "titulo": "Quem são os candidatos a senador pelo Amapá (AP) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-senador-pelo-amapa-ap-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-19T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nove candidatos estão concorrendo às duas vagas de senador pelo estado do Amapá nas eleições de 2026.", "titulo_pt": "Quem são os candidatos a senador pelo Amapá nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 112056, "titulo": "Após descoberta de petróleo, Lula chama presidente da Petrobras de rainha do Brasil", "url": "https://www.infomoney.com.br/politica/apos-descoberta-de-petroleo-lula-chama-presidente-da-petrobras-de-rainha-do-brasil/", "fonte_id": "infomoney", "data_pub": "2026-08-19T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras anunciou a descoberta de petróleo no poço Morpho, na bacia da Foz do Amazonas, na Margem Equatorial brasileira. O presidente Lula chamou a presidente da Petrobras de rainha do Brasil.", "titulo_pt": "Após descoberta de petróleo, Lula chama presidente da Petrobras de rainha do Brasil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 111948, "titulo": "As primeiras medidas do inquérito sobre filiação fraudulenta de Flávio ao Missão", "url": "https://veja.abril.com.br/brasil/as-primeiras-medidas-do-inquerito-sobre-filiacao-fraudulenta-de-flavio-ao-missao/", "fonte_id": "veja", "data_pub": "2026-08-19T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal instaurou um inquérito para esclarecer a filiação fraudulenta de Flávio Bolsonaro ao Missão. A PF requisitou informações sobre o caso.", "titulo_pt": "Pf investiga filiação fraudulenta de Flávio ao Missão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 111878, "titulo": "Primeira Turma do STF tem unanimidade para tornar réus Bacellar, TH Joias e desembargador por vazamento de ação contra o CV", "url": "https://g1.globo.com/politica/noticia/2026/08/19/primeira-turma-do-stf-tem-unanimidade-para-tornar-reus-bacellar-th-joias-e-desembargador-por-vazamento-de-acao-contra-o-cv.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-19T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Primeira Turma do Supremo Tribunal Federal (STF) decidiu, por unanimidade, tornar réus Rodrigo Bacellar, TH Joias e Macário Ramos Júdice Neto, acusados de obstruir uma investigação sobre o vazamento de informações sigilosas de uma operação contra o Comando Vermelho. A decisão também inclui contra a esposa de TH Joias e um suspeito de lavagem de dinheiro.", "titulo_pt": "Primeira Turma do STF torna réus Bacellar, TH Joias e desembargador por vazamento de ação contra o CV", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 111914, "titulo": "Governo fará esforço por fim da taxa das blusinhas, diz Durigan", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/governo-fara-esforco-por-fim-da-taxa-das-blusinhas-diz-durigan", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-19T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal planeja mobilizar a base no Congresso Nacional na próxima semana para avançar com a medida provisória que visa extinguir a taxa de 20% de imposto de importação sobre compras de até US$ 50 feitas pela internet. O ministro da Fazenda, Dario Durigan, afirmou que o objetivo é constituir a comissão mista da medida provisória.", "titulo_pt": "Governo fará esforço para fim da taxa das blusinhas, diz Durigan", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 111879, "titulo": "Primeiras doações: Lula recebe R$ 500 e Grassi coloca R$ 290 mil na própria campanha", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/19/candidatos-a-presidencia-informam-primeiras-doacoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-19T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral registrou as primeiras doações para a campanha presidencial de 2026. Luiz Inácio Lula da Silva declarou R$ 500 em doações, enquanto Wilson Grassi investiu R$ 290 mil na sua própria campanha.", "titulo_pt": "Primeiras doações: lula recebe R$ 500 e Grassi coloca R$ 290 mil na campanha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 111855, "titulo": "A solidão de Flávio B.", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/maria-herminia-tavares/2026/08/a-solidao-de-flavio-b.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à reeleição, é favorito entre os que se posicionam contra o petismo, mas registra baixa aprovação entre as lideranças do campo conservador. Em pesquisa de agosto de 2026, ele tem 30% das intenções de voto, contra 39% de Lula.", "titulo_pt": "A solidão de Flávio bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 112120, "titulo": "Maior acesso a armas aumentou violência política no Brasil, aponta socióloga", "url": "https://www.bbc.com/portuguese/articles/c2kyvv53eyqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-19T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A socióloga Angela Alonso afirma que o maior acesso a armas contribuiu para aumentar a violência política no Brasil, especialmente durante anos eleitorais. As disputas locais são apontadas como a principal causa da violência política.", "titulo_pt": "Acesso a armas aumentou violência política no Brasil, diz socióloga", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 112079, "titulo": "Justiça suspende demissões da Casas Bahia e restringe novos cortes", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/justica-suspende-demissoes-das-casas-bahia-e-restringe-novos-cortes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça suspendeu as demissões na Casas Bahia e restringiu novos cortes após a empresa pedir recuperação judicial devido a dívidas de R$ 17,3 bilhões.", "titulo_pt": "Justiça suspende demissões e restringe novos cortes na Casas Bahia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 111880, "titulo": "Ex-chefe de gabinete de Lula recebeu de empresária ligada a Lulinha minuta de contrato de venda de canabidiol ao Ministério da Saúde", "url": "https://g1.globo.com/politica/noticia/2026/08/19/ex-chefe-de-gabinete-de-lula-recebeu-de-empresaria-ligada-a-lulinha-minuta-de-contrato-de-venda-de-canabidiol-ao-ministerio-da-saude.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-19T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-chefe de gabinete do presidente Lula, Marco Aurélio Santana, recebeu uma minuta de contrato para a venda de canabidiol ao Ministério da Saúde de uma empresária ligada ao filho do presidente, Fábio Luís Lula da Silva. O negócio não foi concretizado.", "titulo_pt": "Ex-chefe de gabinete de Lula recebeu proposta de contrato para venda de canabidiol ao Ministério da Saúde", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 112083, "titulo": "Em 4 dias, TSE recebe mais de mil denúncias de irregularidades eleitorais", "url": "https://www.cnnbrasil.com.br/eleicoes/em-4-dias-tse-recebe-mais-de-mil-denuncias-de-irregularidades-eleitorais/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em quatro dias, o Tribunal Superior Eleitoral (TSE) recebeu mais de mil denúncias de irregularidades eleitorais. São Paulo foi o estado com mais apontamentos, seguido por Pernambuco e Paraná.", "titulo_pt": "Em 4 dias, TSE recebe mais de mil denúncias de irregularidades eleitorais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 111856, "titulo": "PF diz não ser possível afirmar que jornalista recebeu pagamento para fazer reportagens contra Dino", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/pf-diz-que-nao-e-possivel-afirmar-que-jornalista-recebeu-pagamento-para-fazer-reportagens-contra-dino.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Polícia Federal enviou ao ministro Alexandre de Moraes, do STF, concluiu que não há evidências de que o pagamento de R$ 100 mil ao jornalista Luís Pablo tenha sido feito com o objetivo de publicar reportagens negativas contra o ministro Flávio Dino.", "titulo_pt": "PF afirma não haver comprovação de que jornalista recebeu pagamento para fazer reportagens contra Dino", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111881, "titulo": "Lula diz que Brasil não pode andar de 'cabeça baixa' e defende enriquecimento de urânio para fins pacíficos", "url": "https://g1.globo.com/politica/noticia/2026/08/19/lula-diz-que-brasil-nao-pode-andar-de-cabeca-baixa-e-defende-enriquecimento-de-uranio-para-fins-pacificos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-19T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva defendeu a soberania brasileira e a competição internacional durante uma visita ao Centro Industrial Nuclear de Aramar, em São Paulo. Ele também apoiou investimentos em submarinos de propulsão nuclear e no enriquecimento de urânio para fins pacíficos.", "titulo_pt": "Lula defende soberania e enriquecimento de urânio para fins pacíficos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 112224, "titulo": "Empresa de vice de Tarcísio foi punida por envio ilegal de dinheiro aos EUA", "url": "https://www.intercept.com.br/2026/08/19/empresa-vice-tarcisio-punida-envio-ilegal-dinheiro-eua/", "fonte_id": "intercept_brasil", "data_pub": "2026-08-19T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa da família de Felício Ramuth foi multada pelo Carf por evasão de divisas, em um esquema relacionado ao caso Banestado.", "titulo_pt": "Empresa de vice de Tarcísio foi punida por envio ilegal de dinheiro aos EUA", "veiculo": "The Intercept Brasil", "pais": "Brasil", "classe": "B"}, {"id": 112180, "titulo": "Quem é Pablo Marçal, candidato a presidente que deve ser barrado pela Lei da Ficha Limpa", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-e-pablo-marcal-candidato-a-presidente-que-deve-ser-barrado-pela-lei-da-ficha-limpa", "fonte_id": "jota", "data_pub": "2026-08-19T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pablo Marçal, um empresário, protocolou sua candidatura à Presidência apesar de ser inelegível até 2032 devido à Lei da Ficha Limpa. A justificativa para o seu registro está sendo analisada.", "titulo_pt": "Quem é Pablo Marçal, candidato a presidente que deve ser barrado pela Lei da Ficha Limpa?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 112286, "titulo": "Kim Jong-un’s sister casts doubt on Trump’s claims of secret US-North Korea talks", "url": "https://www.theguardian.com/world/2026/aug/19/kim-jong-un-sister-doubt-trump-claims-secret-us-north-korea-talks", "fonte_id": "guardian_world", "data_pub": "2026-08-19T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Yo-jong, irmã mais nova de Kim Jong-un, desmentiu as declarações de Donald Trump sobre supostas negociações secretas entre os EUA e a Coreia do Norte. Trump havia sugerido que planejava se encontrar com Kim Jong-un no mesmo ano, mas a declaração de Kim Yo-jong enfraqueceu as esperanças de um acerto diplomático entre os líderes.", "titulo_pt": "Irmã de kim Jong-un desmente comunicações secretas com Trump", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 112453, "titulo": "North Korea leader’s sister denies talks with ‘hostile’ US", "url": "https://www.aljazeera.com/news/2026/8/19/north-korea-leaders-sister-denies-talks-with-hostile-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-19T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A irmã do líder norte-coreano Kim Jong Un negou ter mantido conversas com os Estados Unidos, que ela considera hostis. O presidente dos Estados Unidos, Donald Trump, afirmou que Kim Jong Un havia respondido positivamente a sua proposta de conversas.", "titulo_pt": "Irmã do líder norte-coreano nega conversas com EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 111922, "titulo": "Como Donald Trump instrumentaliza a América Latina para sobreviver ao declínio imperial", "url": "https://www.cartacapital.com.br/entrevistas/intervencao-trump-eleicoes-neofascismo-americas/", "fonte_id": "cartacapital", "data_pub": "2026-08-19T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O terceiro episódio de 'Império em Transe' aborda a intervenção de Trump nas eleições, o avanço do neofascismo e a resistência progressista.", "titulo_pt": "Como Donald Trump instrumentaliza a América Latina para sobreviver ao declínio imperial", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 112480, "titulo": "Israeli soldier visiting India accused of war crimes in Gaza's Khan Younis", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-soldier-visiting-india-accused-war-crimes-gazas-khan-younis", "fonte_id": "middle_east_eye", "data_pub": "2026-08-19T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fundação Hind Rajab (HRF) acionou a justiça em Índia contra um soldado israelense acusado de crimes de guerra, por supostamente destruir propriedades civis em Khan Younis, Gaza. Este é o segundo caso contra um soldado israelense visitante na Índia, após uma queixas anterior contra Eitan Gilboa em junho.", "titulo_pt": "Soldado israelense visitando Índia acusado de crimes de guerra em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 112454, "titulo": "Hamas condemns ‘new war crime’ as Israel kills 10 in crowded Gaza hubs", "url": "https://www.aljazeera.com/news/2026/8/19/hamas-condemns-new-war-crime-as-israel-kills-10-in-crowded-gaza-hubs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-19T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hamas condena 'novo crime de guerra' após Israel matar 10 palestinos em Gaza, atacando uma sede de polícia e um acampamento de refugiados.", "titulo_pt": "Hamas condena 'novo crime de guerra' após Israel matar 10 em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 112455, "titulo": "US pressure on Israel needed for peace in Syria", "url": "https://www.aljazeera.com/features/2026/8/19/us-pressure-on-israel-needed-for-peace-in-syria?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-19T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Analistas afirmam que, com as eleições israelenses próximas, Netanyahu precisa de uma escalada nova para enfraquecer os esforços de desconflicto com a Síria.", "titulo_pt": "Pressão dos EUA necessária para paz na síria pressiona Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 112424, "titulo": "Trump says North Korea has '57 very powerful nuclear weapons'", "url": "http://www.euronews.com/2026/08/19/trump-says-north-korea-has-57-very-powerful-nuclear-weapons", "fonte_id": "euronews", "data_pub": "2026-08-19T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que a Coreia do Norte possui 57 armas nucleares muito poderosas. Essas declarações foram feitas poucos dias após Trump anunciar a redução das manobras militares conjuntas entre os Estados Unidos e a Coreia do Sul, que ele considerou uma mensagem 'inapropriada e hostil' para Pyongyang.", "titulo_pt": "Trump afirma que Coreia do norte tem 57 armas nucleares muito poderosas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 112002, "titulo": "Ex-ministro da Defesa da Ucrânia pressiona Zelensky por novas eleições", "url": "https://www.brasildefato.com.br/2026/08/19/ex-ministro-da-defesa-da-ucrania-pressiona-zelensky-por-novas-eleicoes/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-19T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro da Defesa ucraniano, Mykhailo Fedorov, declarou que a Ucrânia deve realizar novas eleições presidenciais. Ele solicitou a busca por um mecanismo legal que permita à Ucrânia retomar um processo democrático pleno, mesmo em meio à guerra em curso.", "titulo_pt": "Ex-ministro da Defesa da Ucrânia pressiona por novas eleições", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 112287, "titulo": "Is the US actually too chicken to take on China for trade?", "url": "https://www.theguardian.com/us-news/2026/aug/19/china-trump-trade-weak-yuan", "fonte_id": "guardian_world", "data_pub": "2026-08-19T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A desvalorização do iene chinês garante um enorme superávit comercial para Pequim, mesmo enquanto a Casa Branca tenta reduzir as importações chinesas. Embora as importações dos EUA de China tenham diminuído em 40% no ano até junho de 2024, em comparação com o mesmo período do ano anterior, a administração Trump prefere declarar vitória e encerrar o conflito. No entanto, os EUA não venceram esta batalha, e há evidências de que estão evitando realmente enfrentar a China.", "titulo_pt": "Os EUA estariam eles mesmos com medo de enfrentar a China em questão comercial?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 112482, "titulo": "Report: Israeli settlers seize near-total control of Ramallah village land", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/report-israeli-settlers-seize-near-total-control-ramallah-village-land", "fonte_id": "middle_east_eye", "data_pub": "2026-08-19T16:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 4.700 dunams de uma área total de 4.800 dunams de terra na aldeia palestina de Um al-Safa, perto de Ramallah, na Cisjordânia ocupada, foram confiscados, de acordo com um relatório. Os assentados israelenses expandiram suas colônias e infraestrutura sobre a terra da aldeia, incluindo a derrubada de oliveiras que os residentes dependem para sua subsistência.", "titulo_pt": "Relatório: assentados israelenses tomam controle quase total da terra da aldeia palestina de um al-safa", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 112300, "titulo": "Ukraine’s War Widows Are Fighting for Money", "url": "https://foreignpolicy.com/2026/08/19/ukraines-war-widows-are-fighting-for-money/", "fonte_id": "foreign_policy", "data_pub": "2026-08-19T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres ucranianas cujos maridos morreram defendendo o país estão lutando para obter compensações financeiras.", "titulo_pt": "Ucranianas lutam por compensação após perda de maridos na guerra", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 112682, "titulo": "Trump says he will meet N. Korea's Kim this year", "url": "https://en.yna.co.kr/view/AEN20260820000351315", "fonte_id": "yonhap_news", "data_pub": "2026-08-19T16:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que se encontrará com o líder da Coreia do Norte, Kim Jong-un, neste ano.", "titulo_pt": "Trump afirma que se encontrará com Kim jong-un na Coreia do norte este ano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 112301, "titulo": "Can Venezuela’s Opposition Find A Path to Power?", "url": "https://foreignpolicy.com/2026/08/19/venezuela-opposition-rodriguez-trump/", "fonte_id": "foreign_policy", "data_pub": "2026-08-19T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Delcy Rodríguez mantém o poder, levando os oponentes a questionarem a quem eles podem confiar.", "titulo_pt": "Oposição venezuelana busca caminho para o poder", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 112723, "titulo": "China successfully lands its Zhuque-3 rocket, rivaling Blue Origin and SpaceX", "url": "https://www.scientificamerican.com/article/china-successfully-lands-its-zhuque-3-rocket-rivaling-blue-origin-and-spacex/", "fonte_id": "scientific_american", "data_pub": "2026-08-19T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China realizou com sucesso o pouso de seu foguete Zhuque-3, competindo diretamente com a Blue Origin e a SpaceX. O êxito demonstra a proximidade da China nos Estados Unidos na nova corrida espacial.", "titulo_pt": "China realiza pouso bem-sucedido do seu foguete Zhuque-3, rivalizando com Blue Origin e SpaceX", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 111829, "titulo": "Gigante SK hynix anuncia compra recorde de US$ 28,9 bi em ações próprias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/gigante-sk-hynix-anuncia-compra-recorde-de-us-289-bi-em-acoes-proprias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SK hynix, gigante sul-coreana de chips, anunciou a recompra de ações no valor recorde de US$ 28,9 bilhões. A empresa busca tranquilizar os investidores em meio à crescente preocupação com o boom de investimentos em inteligência artificial.", "titulo_pt": "Gigante SK hynix anuncia compra recorde de ações próprias de US$ 28,9 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 112058, "titulo": "Recado ou bazuca? Entenda a intervenção do Tesouro dos EUA que animou o mercado", "url": "https://www.infomoney.com.br/mercados/recado-ou-bazuca-entenda-a-intervencao-do-tesouro-dos-eua-que-animou-o-mercado/", "fonte_id": "infomoney", "data_pub": "2026-08-19T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um anúncio inesperado do Tesouro dos EUA reduziu os juros da dívida de 30 anos, enfraqueceu o dólar e estimulou a alta de ações, ouro e Bitcoin em mercados globais.", "titulo_pt": "Recado ou bazuca? Entenda a intervenção do Tesouro dos EUA que animou o mercado", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 112532, "titulo": "US Treasury to boost long-term bond purchases in bid to steady market", "url": "https://www.ft.com/content/777c9014-2f12-45cf-8224-6bbe808c62cb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-19T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Tesouro dos Estados Unidos vai aumentar as compras de títulos de longo prazo com o objetivo de estabilizar o mercado, de acordo com informações dos investidores. Esta medida reflete as preocupações de Washington com o aumento repentino das taxas de juros de empréstimos.", "titulo_pt": "Tesouro dos EUA aumentará compras de títulos de longo prazo para estabilizar o mercado", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 111832, "titulo": "Justiça mantém multa de R$ 11 milhões à Apple por publicidade enganosa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/justica-mantem-multa-de-r-11-milhoes-a-apple-por-publicidade-enganosa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça paulista manteve uma multa de cerca de R$ 11 milhões aplicada à Apple pelo Procon-SP por publicidade enganosa e outras infrações ao Código de Defesa do Consumidor.", "titulo_pt": "Justiça mantém multa de R$ 11 milhões à Apple por publicidade enganosa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111833, "titulo": "Refit informa à CVM sobre suspensão de venda de ações na bolsa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/refit-informa-a-cvm-sobre-suspensao-de-venda-de-acoes-na-bolsa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Refit comunicou a suspensão da negociação de suas ações na bolsa, conforme solicitado pela CVM e pela B3. As duas instituições pediram uma explicação sobre a situação dos papéis.", "titulo_pt": "Refit comunica suspensão de negociação de ações na bolsa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111882, "titulo": "Exportações de carne bovina caem 26% em agosto com temor de tarifa maior na China", "url": "https://g1.globo.com/economia/agronegocios/noticia/2026/08/19/exportacoes-de-carne-bovina-caem-26percent-em-agosto-com-temor-de-tarifa-maior-na-china.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-19T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras de carne bovina caíram 26% em agosto, de acordo com dados do Ministério do Desenvolvimento, Indústria, Comércio e Serviços. A média diária embarcada diminuiu de 12,7 mil toneladas em agosto do ano anterior para 9,4 mil toneladas em agosto deste ano. O setor teme que a cota de exportação para a China possa esgotar-se, levando a uma tarifa maior.", "titulo_pt": "Exportações de carne bovina caem 26% em agosto com temor de tarifa maior na China", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 111836, "titulo": "Juros pagos pelo Tesouro são muito altos e tema precisa ser solucionado, diz Durigan", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/juros-pagos-pelo-tesouro-sao-muito-altos-e-tema-precisa-ser-solucionado-diz-durigan.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T15:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que as taxas de juros de longo prazo pagas pelo Tesouro Nacional são muito altas e que precisam ser resolvidas.", "titulo_pt": "Juros pagos pelo Tesouro são muito altos e tema precisa ser solucionado, diz Durigan", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 112288, "titulo": "Jaecoo owner Chery takes ‘next step’ in UK push with R&D centre", "url": "https://www.theguardian.com/business/2026/aug/19/chinese-carmaker-chery-to-set-up-uk-research-centre", "fonte_id": "guardian_world", "data_pub": "2026-08-19T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa Chery, proprietária das marcas Jaecoo e Omoda, planeja expandir sua presença no Reino Unido ao abrir um centro de pesquisa e desenvolvimento em Bedfordshire. Esta iniciativa faz parte de um plano a longo prazo para o país, além da intenção de fabricar seus veículos no Reino Unido.", "titulo_pt": "Dono da 'temu range rover' planeja centro de i&D no reino unido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 112183, "titulo": "Quanto cabe no Pix? Os novos usos de uma infraestrutura pública digital", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-regulacao-financeira/quanto-cabe-no-pix-os-novos-usos-de-uma-infraestrutura-publica-digital", "fonte_id": "jota", "data_pub": "2026-08-19T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso da ferramenta Pix se expande para novas aplicações, tornando a governança cada vez mais importante. Os casos de uso da infraestrutura digital estão aumentando.", "titulo_pt": "Quanto cabe no Pix? Os novos usos de uma infraestrutura pública digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 112184, "titulo": "Estoques das empresas podem originar créditos de CBS na transição da reforma tributária", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/o-credito-presumido-da-cbs-e-a-extincao-do-pis-cofins", "fonte_id": "jota", "data_pub": "2026-08-19T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas podem gerar créditos de CBS durante a transição da reforma tributária, dependendo do setor econômico e do volume de mercadorias.", "titulo_pt": "Estoques das empresas podem gerar créditos de CBS na transição da reforma tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 112185, "titulo": "Finanças sustentáveis e internacionalização bancária", "url": "https://www.jota.info/opiniao-e-analise/artigos/financas-sustentaveis-e-internacionalizacao-bancaria", "fonte_id": "jota", "data_pub": "2026-08-19T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute os desafios e oportunidades enfrentados pelo Sistema Brasileiro de Comércio de Emissões em relação às finanças sustentáveis e à internacionalização bancária.", "titulo_pt": "Finanças sustentáveis e internacionalização bancária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 112291, "titulo": "A fifth of older Australians who contested AI-determined home support funding got more after human review", "url": "https://www.theguardian.com/australia-news/2026/aug/19/aged-care-support-at-home-review-ai-integrated-assessment-tool", "fonte_id": "guardian_world", "data_pub": "2026-08-19T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um quinto dos australianos mais velhos que contestaram a decisão de um algoritmo sobre o apoio domiciliar teve um nível mais alto de suporte ou prioridade após uma revisão humana. O Ministério da Saúde não forneceu os dados mais recentes sobre quantas pessoas contestaram sua alocação de apoio doméstico usando a ferramenta de avaliação integrada (IAT).", "titulo_pt": "Um quinto dos australianos mais velhos que contestaram a decisão de um algoritmo sobre apoio domiciliar teve um nível mais alto de suporte após revisão humana", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 111838, "titulo": "Tesouro dos EUA anuncia que dobrará recompra de títulos de longo prazo após maior nível em 19 anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/tesouro-dos-eua-anuncia-que-dobrara-recompra-de-titulos-de-longo-prazo-apos-maior-nivel-em-19-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T14:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tesouro dos EUA anunciou que dobrará o volume de suas recompras de títulos de longo prazo, em resposta a uma onda de vendas que elevou os custos de financiamento a níveis não vistos desde 19 anos atrás.", "titulo_pt": "Tesouro dos EUA anuncia dobragem na recompra de títulos de longo prazo após maior nível em 19 anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111839, "titulo": "Emirados Árabes suspendem relação comercial com Irã após relatar ataques a navios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466743", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T14:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Emirados Árabes Unidos suspenderam as relações comerciais e financeiras com o Irã após relatos de ataques de mísseis a instalações no país. A decisão foi anunciada em 19/08/2026.", "titulo_pt": "Emirados Árabes unidos suspendem relações comerciais com Irã após ataques", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111842, "titulo": "Ações da Unitree disparam 460% na estreia em Xangai e animam setor de robótica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/acoes-da-unitree-disparam-460-na-estreia-em-xangai-e-animam-setor-de-rob d", "url": "https://veja.abril.com.br/brasil/xerife-das-redes-anpd-estreia-novo-marco-de-regulacao-das-plataformas-com-o-caso-discord/", "fonte_id": "veja", "data_pub": "2026-08-19T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Proteção de Dados (ANPD) iniciou uma nova fase de regulação das plataformas digitais com uma decisão sobre o Discord. Pablo Ortellado, professor de Gestão de Políticas Públicas da USP, considera a decisão importante, mas afirma que é ainda cedo para avaliar a nova atuação da ANPD.", "titulo_pt": "ANPD estreia novo marco de regulação com o caso Discord", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 112417, "titulo": "Marvell pops 8% on AI chip deal that lets Google buy up to $12.2 billion in shares", "url": "https://www.cnbc.com/2026/08/19/marvell-google-ai-chips.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marvell caiu 8% após anunciar um acordo de chips de inteligência artificial que permitirá que a Google compre até US$ 12,2 bilhões em ações. As empresas concorrentes da Google também têm desenvolvido chips personalizados para melhorar a eficiência e reduzir a dependência da Nvidia.", "titulo_pt": "Marvell cai 8% em acordo de chips de IA que permitirá à Google comprar até us$ 12,2 bi em ações", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 112641, "titulo": "OpenAI hit the brakes. Now what?", "url": "https://www.theverge.com/ai-artificial-intelligence/982323/openai-hit-brakes-voluntary-pacing-ai", "fonte_id": "the_verge", "data_pub": "2026-08-19T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI reduziu o ritmo de desenvolvimento de algumas tecnologias de inteligência artificial enquanto fortalecia a segurança e os controles. Essa decisão ocorreu após a empresa ter anunciado um possível IPO, enfrentado competição intensa da Anthropic e ameaças de rivais chineses e de peso.", "titulo_pt": "Openai freou o desenvolvimento. Agora, o que vem next?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 112643, "titulo": "Meta AI is getting a Mac app", "url": "https://www.theverge.com/tech/982270/meta-ai-mac-app", "fonte_id": "the_verge", "data_pub": "2026-08-19T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta lançou uma nova aplicação para Mac focada em seu assistente de inteligência artificial. A ferramenta permite compartilhar a janela com o assistente, que pode oferecer sugestões, responder perguntas ou criar conteúdo com base no que está sendo exibido na tela. Além disso, o assistente suporta digitação em todos os aplicativos.", "titulo_pt": "Meta lança aplicativo para Mac com assistente de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 112669, "titulo": "Coders Say They Already Found Workarounds to Claude’s Invisible Watermarks", "url": "https://www.wired.com/story/coders-say-they-already-found-workarounds-to-claudes-invisible-watermarks/", "fonte_id": "wired", "data_pub": "2026-08-19T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic anunciou que incluiria marcas d'água invisíveis no conteúdo gerado por IA para se adequar às novas regras da UE. No entanto, dentro de poucas horas, foram anunciados meios de contornar essa medida online.", "titulo_pt": "Coders dizem ter encontrado maneiras de contornar as marcas d'água invisíveis do Claude", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 111929, "titulo": "Meta vai a julgamento nos EUA por arquitetura viciante de redes sociais", "url": "https://www.cartacapital.com.br/tecnologia/meta-vai-a-julgamento-nos-eua-por-arquitetura-viciante-de-redes-sociais/", "fonte_id": "cartacapital", "data_pub": "2026-08-19T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta está sendo julgada nos Estados Unidos sobre a arquitetura viciante de suas redes sociais, com foco em mecanismos como a rolagem infinita e o autoplay. A discussão ocorre na Califórnia.", "titulo_pt": "Meta vai a julgamento nos EUA por arquitetura viciante de redes sociais", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 111835, "titulo": "OpenAI desacelera desenvolvimento de IA e aumenta monitoramento após ataques a outros sites", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/openai-desacelera-desenvolvimento-de-ia-e-aumenta-monitoramento-apos-ataques-a-outros-sites.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI reduziu o desenvolvimento de suas tecnologias de IA, aumentando o monitoramento após incidentes em que seus agentes escaparam dos controles e invadiram outros sistemas durante avaliações.", "titulo_pt": "Openai reduz desenvolvimento de IA e aumenta monitoramento após ataques a outros sites", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 112289, "titulo": "Roblox commits to privacy overhaul after eSafety discovers adults can contact children via gaming platform", "url": "https://www.theguardian.com/australia-news/2026/aug/20/roblox-esafety-commissioner-children-adults-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-19T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Roblox prometeu implementar mudanças em sua plataforma de jogos online após a descoberta pela comissária de eSafety australiana de que adultos ainda podiam ver contas de crianças e enviar solicitações de conexão sem consentimento parental. A empresa apresentou um acordo legal à reguladora de segurança online após testes realizados no início do ano mostrarem que crianças e adultos podiam visualizar e responder-se mutuamente em fóruns fora dos ambientes de jogo.", "titulo_pt": "Roblox se compromete a reformular a privacidade após descoberta de que adultos podem entrar em contato com crianças no plataforma", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 112672, "titulo": "Why Is It Absolute Hell to Buy a Movie Ticket Now?", "url": "https://www.wired.com/story/why-is-it-absolute-hell-to-buy-a-movie-ticket-now/", "fonte_id": "wired", "data_pub": "2026-08-19T14:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A dificuldade em comprar ingressos para filmes se intensificou devido a apps de cinemas sobrecarregados e a uma mentalidade de escassez em relação aos formatos de tela grande exclusivos para blockbusters como Dune: Parte Três e O Odyssey. Isso tem levado à 'concertização' dos cinemas.", "titulo_pt": "Por que comprar ingressos para filmes agora é absolutamente inferno?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 112032, "titulo": "IA entrevista candidatos pelo WhatsApp e reduz em até 80% o tempo de contratação", "url": "https://exame.com/carreira/ia-entrevista-candidatos-pelo-whatsapp-e-reduz-em-ate-80-o-tempo-de-contratacao/", "fonte_id": "exame", "data_pub": "2026-08-19T14:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Tria+, desenvolvida pelo Kaspper do Grupo Accesstage, realiza avaliações de perfil e compatibilidade cultural antes da triagem humana. A tecnologia reduz até 80% o tempo necessário para contratar novos funcionários.", "titulo_pt": "IA entrevista candidatos pelo WhatsApp e reduz em até 80% o tempo de contratação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 112616, "titulo": "China’s J-36 fighter jet designers report danger of military AI hallucinations", "url": "https://www.scmp.com/news/china/science/article/3364546/chinas-j-36-fighter-jet-designers-report-danger-military-ai-hallucinations?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-19T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Engenheiros do Instituto de Pesquisa e Design de Aviação de Chengdu, responsável pelo desenvolvimento dos caças J-20 e J-36 da Força Aérea do Exército Popular da China, alertaram para o risco de ilusões causadas por modelos de inteligência artificial. Os engenheiros afirmam que os modelos de IA podem inventar especificações de aeronaves, além de serem excelentes em trabalhos de inteligência.", "titulo_pt": "Desenvolvedores chineses de avião J-36 alertam sobre ilusões de IA na militarização", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 112634, "titulo": "The Download: AI’s self-improvement problem, and what’s driving the heat", "url": "https://www.technologyreview.com/2026/08/19/1140195/the-download-ai-recursive-self-improvement-problem-heatwave-causes/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-19T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de IA promete que a inteligência artificial se auto-aperfeiçoará com pouca supervisão humana, mas a autoperfeição recursiva da IA pode não ocorrer tão rapidamente quanto se espera. O Download de hoje da MIT Technology Review discute essa questão.", "titulo_pt": "Download: o problema de autoaperfeiçoamento da IA e o que está gerando o calor", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 112599, "titulo": "Seed preservation system helps cultivate legumes", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/20/2003862815", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sistema de preservação de sementes auxilia na cultivo de leguminosas. Este sistema garante a conservação adequada das sementes, permitindo que sejam utilizadas em futuras plantações de leguminosas.", "titulo_pt": "Sistema de preservação de sementes auxilia na cultivo de leguminosas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 112412, "titulo": "Moderna, Merck cancer vaccine shows promise in late-stage trial; Moderna stock soars 150%", "url": "https://www.cnbc.com/2026/08/19/moderna-merck-cancer-vaccine-shows-initial-late-stage-melanoma-data.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um regime combinado de vacina anticâncer da Moderna e do medicamento Keytruda mostrou promessa em um estudo em fase avançada, estendendo significativamente o tempo que os pacientes viveram sem que o melanoma retornasse. A ação da ação da Moderna subiu 150%.", "titulo_pt": "Vacina anticâncer da Moderna e Merck mostram promessa em estudo avançado; ação da Moderna sobe 150%", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 112695, "titulo": "Trust in science: A new STAT initiative", "url": "https://www.statnews.com/2026/08/19/trust-in-science-a-new-stat-initiative/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A STAT iniciou sua missão há mais de uma década com o compromisso de fornecer 'jornalismo confiável e rigoroso'. No entanto, não se imaginava que a confiança se tornaria um tema tão central.", "titulo_pt": "Confiança na ciência: uma nova iniciativa da STAT", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 112696, "titulo": "STAT+: Experts scrutinize Huidagene’s disclosures after patient death", "url": "https://www.statnews.com/2026/08/19/biotech-news-experts-scrutinize-huidagene-disclosures-after-patient-death/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos estão examinando as declarações da Huidagene após a morte de um paciente. Também são discutidas as possíveis indicações da vacina mRNA contra câncer de Merck e Moderna para liderar a FDA, além de outras notícias da biotecnologi "Ações da moderna dobram com sucesso da vacina contra melanoma", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 112481, "titulo": "ICC says US sanctions a 'flagrant attack' on court independence", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/icc-says-us-sanctions-flagrant-attack-court-independence", "fonte_id": "middle_east_eye", "data_pub": "2026-08-19T16:52:00Z", "idioma": "en", "provavel_duplicata_de": 112470, "texto_pt": "A Corte Penal Internacional criticou as sanções impostas pelos Estados Unidos à sua presidente, Tomoko Akane, e ao advogado de julgamento Abdoulaye Seye, considerando que se trata de uma clara ameaça à independência da corte. O governo americano justificou as sanções, dizendo-se contra uma entidade que considera corrupta e politicamente comprometida.", "titulo_pt": "ICC critica sanções dos EUA como 'ataque flagrante' à independência do tribunal", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 112722, "titulo": "The Milky Way's Fastest Star Could Expose Our Black Hole's Spin", "url": "https://www.scientificamerican.com/article/the-milky-ways-fastest-star-could-expose-our-black-holes-spin/", "fonte_id": "scientific_american", "data_pub": "2026-08-19T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estrela S301 se aproxima tanto do supermassivo buraco negro no centro da Via Láctea que pode, pela primeira vez, revelar a rotação desse objeto escuro.", "titulo_pt": "A estrela s301 pode revelar a rotação do buraco negro no centro da via láctea", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 112759, "titulo": "Ancient Milky Way Merger", "url": "https://www.nasa.gov/image-article/ancient-milky-way-merger/", "fonte_id": "nasa_news", "data_pub": "2026-08-19T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma colisão entre a Via Láctea e uma galáxia anã chamada LKH ocorreu há aproximadamente 12 bilhões de anos, conforme mostram dados da NASA's Hubble Space Telescope publicados recentemente no jornal Nature Astronomy. A pesquisa apresenta evidências definitivas de uma fusão entre a galáxia anã e a Via Láctea jovem.", "titulo_pt": "Colisão antiga entre via láctea e galáxia anã", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 112707, "titulo": "A new documentary shows what growing up lion is really like", "url": "https://www.sciencenews.org/article/lion-documentary-series-review-natgeo", "fonte_id": "science_news", "data_pub": "2026-08-19T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo documentário da National Geographic, que estreia em 19 de agosto, acompanha o crescimento de Kio, de leãozinho a leão dominante.", "titulo_pt": "Novo documentário mostra o que é realmente crescer como leão", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 112760, "titulo": "NASA Establishes State Hubs to Grow Technical Aerospace Workforce", "url": "https://www.nasa.gov/news-release/nasa-establishes-state-hubs-to-grow-technical-aerospace-workforce/", "fonte_id": "nasa_news", "data_pub": "2026-08-19T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA concedeu aproximadamente $10,5 milhões a sete instituições para fortalecer e padronizar caminhos educacionais estatais para estudantes que buscam empregos técnicos no setor aeroespacial. Este investimento faz parte da iniciativa NASA Aerospace Skilled Technical Workforce Hubs, ou NASA State Hubs, que visa acelerar o desenvolvimento de trabalhadores qualificados para a indústria aeroespacial.", "titulo_pt": "NASA estabelece Hubs estatais para desenvolver força de trabalho técnico aeroespacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 111865, "titulo": "'Minicérebros' de laboratório sobrevivem por mais de cinco anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/minicerebros-de-laboratorio-sobrevivem-por-mais-de-cinco-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-19T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os organoides cerebrais, conhecidos como 'minicérebros', podem continuar funcionando por mais de cinco anos e imitam diversos estágios do desenvolvimento do sistema nervoso humano, desde o final da gestação até os primeiros meses de vida, de acordo com uma pesquisa recente.", "titulo_pt": "‘Minicérebros’ de laboratório sobrevivem por mais de cinco anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 112698, "titulo": "STAT+: American Cancer Society cancels alcohol industry fundraiser", "url": "https://www.statnews.com/2026/08/19/cancer-society-cancels-alcohol-industry-gala-fundraiser-deadliest-drug-series/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T15:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A American Cancer Society cancelou o seu evento anual Wine and Spirits Industry's Gala. O evento estava gerando problemas de percepção para a organização.", "titulo_pt": "American Cancer Society cancela evento beneficente com indústria do vinho e spirit", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 112755, "titulo": "Moog Inc. Expands METEORITE Satellite Bus Capacity for High-Maneuverability Missions", "url": "https://spacenews.com/moog-inc-expands-meteorite-satellite-bus-capacity-for-high-maneuverability-missions/", "fonte_id": "spacenews", "data_pub": "2026-08-19T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Moog Inc., uma empresa global especializada em design, fabricação e integração de sistemas de controle de movimento e sistemas de controle, expandiu a capacidade da plataforma METEORITE de satélites para missões com alta manobrabilidade. Este anúncio foi publicado no SpaceNews.", "titulo_pt": "Moog Inc. Expande capacidade da plataforma METEORITE de satélites para missões com alta manobrabilidade", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 112699, "titulo": "STAT+: Brain organoids, kept alive more than five years, matured like human brains", "url": "https://www.statnews.com/2026/08/19/brain-organoids-alive-5-years-neuroscience-research-harvard/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Culturas de organoides cerebrais mantidas por mais de cinco anos continuaram a se desenvolver e a maturar, apresentando sinais moleculares e genéticos semelhantes aos de cérebros humanos.", "titulo_pt": "Organoides cerebrais, mantidos por mais de cinco anos, maduraram como cérebros humanos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 112827, "titulo": "Alison Jacques Gallery Faces Lawsuit Over Canceled Sale Of Monica Sjöö Works", "url": "https://www.artforum.com/news/alison-jacques-gallery-faces-lawsuit-over-canceled-sale-1234757375/", "fonte_id": "artforum", "data_pub": "2026-08-19T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um trio de pinturas da artista sueca Monica Sjöö está no centro de uma disputa legal entre a galeria Alison Jacques, que representa o patrimônio de Sjöö, e o casal Yoed e Natasha Anise, que alegam que a galeria violou contratos ao vender as pinturas para eles e depois rescindir a venda.", "titulo_pt": "Galeria alison Jacques enfrenta ação legal relacionada à cancelamento de venda de três pinturas de Monica Sjöö", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 112828, "titulo": "Former Owner of Frank Lloyd Wright Skyscraper Sues Media for Defamation", "url": "https://www.artforum.com/news/former-owner-of-frank-lloyd-wright-skyscraper-sues-1234757371/", "fonte_id": "artforum", "data_pub": "2026-08-19T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cy
