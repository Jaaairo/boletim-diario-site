<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 12/10/2026 15:25 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">

      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "12/10/2026 15:25", "stats": {"noticias_novas": 920, "resumos_gerados": 259}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta um cenário político tenso, com a reta final do segundo turno das eleições presidenciais. De acordo com uma pesquisa do Ipespe, Flávio Bolsonaro e Lula estão em uma disputa acirrada, com Flávio liderando nas intenções de voto. A Eurasia Group elevou para 80% a probabilidade de vitória de Flávio, indicando que Lula precisa reduzir a abstenção e convencer os eleitores que buscam mudança. Nesse contexto, o presidente Lula anunciou um pacote de medidas e crédito para empreendedores, enquanto Flávio Bolsonaro participou de uma missa e anunciou uma visita ao pai, Jair Bolsonaro, que cumpre prisão domiciliar. A decisão do ministro Alexandre de Moraes do STF permitiu que Flávio retome as visitas ao ex-presidente, mas mantém o veto a declarações políticas. Além disso, o arcebispo de Aparecida alertou sobre o cenário político carregado, enfatizando a necessidade de diálogo e lucidez.", "mundo": "O governo italiano está considerando prorrogar a data final para a implementação gradual do monitoramento de energia, que estava prevista para 31 de março de 2027, para 31 de dezembro de 2027. Em outro desenvolvimento, o embaixador sul-coreano nos Estados Unidos reconheceu as limitações na comunicação de alto nível com a Casa Branca. Na América do Sul, um político de centro-esquerda venceu as eleições para prefeito em uma cidade do Peru, derrotando seu adversário de extrema direita por apenas 25 votos. No Reino Unido, Andy Burnham, o atual prefeito de Manchester (e não primeiro-ministro), reabriu um debate sobre a interferência russa no referendo do Brexit de 2016, afirmando que foi informado sobre essa possibilidade após assumir o cargo. Além disso, o Ministério da Saúde do Líbano informou que, desde 8 de outubro de 2023, ataques israelenses causaram a morte de aproximadamente 8.965 pessoas e feriram 30.660 no Líbano. No cenário político, o empresário Alvaro Pulido, acusado nos Estados Unidos de corrupção na Venezuela, foi preso na Venezuela. Além disso, o Prêmio Nobel de Economia foi concedido a Robert E. Hall e Michael Woodford, cidadãos dos Estados Unidos, por suas contribuições microeconômicas na estabilização macroeconômica.\n\nA geopolítica global enfrenta diversos desafios e tensões em diferentes regiões. A Arábia Saudita está enfrentando ataques do grupo Houthis, que resultaram em mortes e ferimentos, incluindo mulheres e crianças, em várias cidades do país, como Sanaa. A Turquia, aliada da Arábia Saudita, declarou apoio ao país contra os ataques ilegítimos, e o Irã ofereceu mediação para a resolução do conflito. Em Israel, uma explosão no norte do país feriu pelo menos 19 pessoas. Em Taiwan, os aviões F-16 passaram por testes na fábrica. A Rússia foi criticada por um alto-comando da Otan, que afirmou que um possível ataque seria 'totalmente fútil'. Na Ucrânia, a situação militar e econômica continua incerta, com Washington mantendo uma posição ambígua. Em um desenvolvimento diplomático, a Coreia do Sul revogou o mandato de seu embaixador na Ucrânia, exigindo uma publicação de desculpas após a Ucrânia revelar a transferência de um prisioneiro norte-coreano sem o consentimento da Coreia do Sul. A Europa também enfrenta ameaças cibernéticas, com supermercados franceses relatando um ataque que causou o descongelamento de refrigeradores em várias lojas.", "economia": "O dólar atingiu um máximo de 18 meses, refletindo tensões no Oriente Médio e expectativas de alta da inflação nos Estados Unidos. A economia brasileira enfrenta pressões com a revisão de modelos pela Renault para competir com marcas chinesas, enquanto a reforma tributária promove um aquecimento no mercado de trabalho para profissionais fiscais e tributários. O Prêmio Nobel de Economia 2026 foi concedido a Robert E. Hall e Michael Woodford, reconhecendo suas contribuições para a macroeconomia. A Opep reduziu suas projeções de demanda para 2026, enquanto a Agência Nacional de Energia Elétrica pautou reajustes nas tarifas das distribuidoras EDP São Paulo e CPFL Piratininga. A União Europeia limitou a importação de veículos híbridos chineses a 350 mil unidades por ano, e a Strategy aumentou sua posição em bitcoins, alcançando um valor de mercado de US$ 70,3 bilhões.", "tecnologia": "A Meta lançou dois novos modelos de inteligência artificial (IA): o Muse Wonder e o Muse Wonder Full. Essa iniciativa representa uma tentativa da empresa de avançar na fronteira da IA. Zuckerberg afirmou que a Meta já atingiu a 'fronteira' da IA e rejeitou pedidos para reduzir o ritmo de investimentos. Por outro lado, a startup Blueprints AI, sediada em Santa Monica, desenvolveu um software que gera planilhas de projeto de construção a partir de uma foto, PDF ou esboço, utilizando IA. Em contraste, hackers atacaram centenas de lojas de supermercado na França, elevando a temperatura de vários refrigeradores para 50°C, causando prejuízos e incêndios. Este ataque, descrevendo-se como inédito, afetou várias grandes redes de varejo alimentício no país. Além disso, a China propôs regras mais rígidas para o design e segurança de veículos, proibindo porta-malas ocultos e controles virtuais para funções críticas, afetando fabricantes de automóveis buscando aprovações no país.", "ciencia": "Os economistas Robert E. Hall e Michael Woodford receberam o Nobel de Economia por suas contribuições significativas na gestão de crises financeiras, especialmente após a crise de 2008. Além disso, foi descoberta uma nova espécie de crocodilo do Jurássico, com dentes finos, sugerindo que a dieta desses animais incluía camarões e pequenos peixes. Um estudo sobre uma montanha de gelo de 1.800 km em Marte identificou um mecanismo para a formação diária dessa nuvem. Pesquisas sobre o câncer colorretal em jovens mostraram que a maioria dos casos não tem histórico familiar. As manguezais são cruciais para a proteção costeira, amortecendo ondas e surtos de tempestades. Estudos sobre a fotossíntese das sequóias em condições de calor extremo indicam que essas árvores podem estar em risco devido ao aquecimento global. Também foi descoberta uma forma única que preenche o espaço sem padrões repetitivos, com a ajuda da inteligência artificial, um avanço importante em geometria.", "cultura": "A procissão do Círio de Nazaré, com mais de 230 anos de tradição, percorreu 4 km pelas ruas de Belém, com uma estimativa de público superior a 2 milhões de pessoas, destacando-se como um importante evento cultural. O Bangkok Art Biennale anunciou os 72 artistas e coletivos que participarão da quinta edição do evento, que ocorrerá de 29 de outubro de 2026 a 28 de fevereiro de 2027, sob a curadoria de Apinan Poshyananda. A obra de Gabrielle Goliath, 'Elegy', é um vídeo e trabalho sonoro que lamenta mortes e genocídios com uma nota contínua, criando um impacto forte e duradouro, e foi considerada controversa para a Bienal de Veneza.", "sociedade": "Em Fortaleza, Ceará, um adolescente de 13 anos disparou uma arma do pai contra um colega de 14 anos, resultando em cirurgia para o ferido e internação provisória do suspeito. Em São Paulo, um jovem de 20 anos foi preso suspeito de esfaquear os avós e matar dois cães, ferindo-se durante o ataque. Em Minas Gerais, uma menina de 10 anos faleceu após afogamento em um parque aquático. No Distrito Federal, um casal foi morto a tiros, com o vizinho João Victor Rodrigues Alves de Oliveira sendo apontado como suspeito. Em Saquarema, um campeão sul-americano de surfe, Rickson Falcão, foi atingido por quatro tiros enquanto tomava açaí, mas já recebeu alta hospitalar. No Chile, a mortalidade de menores aumentou 23% nos primeiros seis meses do ano, com destaque para encerronas e robos, além de duplicação das ameaças no contexto escolar. No Brasil, a Companhia Metropolitana de Transportes Públicos registrou um boletim de ocorrência após o ato de Lula, com fornecimento das imagens das câmeras de monitoramento à polícia. No Ceará, um empresário, irmão de um deputado estadual do PT, morreu afogado em uma praia de Fortaleza. Na França, um adolescente disparou com uma espingarda contra um diretor e uma professora de uma escola, levando o governo a ativizar um comitê de gestão de crise. No Chile, a tendência é responder a desastres com atraso, enquanto no Brasil, a criação de uma via exclusiva para romeiros na Rodovia Dutra visa reforçar a segurança dos peregrinos. No Chile, o trabalho doméstico e de cuidados não remunerados equivale a 19,2% do PIB ampliado, com desafios em financiar e expandir esse direito. No Brasil, um estudo indica que as mulheres relatam dores mais intensas e frequentes em todo o corpo em comparação com os homens. No Chile, os povos originários marcharam em Santiago exigindo proteção da Lei Lafkenche, despenalização da hoja de coca e revitalização das línguas indígenas como direito. No Chile, o Plano Básico de Prevenção ao Suicídio de 6ª geração inclui medidas para prevenir suicídios. No Brasil, 33 escolas no Entorno do Distrito Federal funcionam sem inspeção dos bombeiros, enquanto no Chile, pais aguardam 18 meses por vagas em centros de creche pública. No Brasil, Rudmila Onha Cruz, ex-executiva de compliance, relata como o ABP-W, da Saint Paul, superou um receio e transformou-se em uma rede de apoio. No Chile, a mortalidade de menores aumentou 23% nos primeiros seis meses do ano, com destaque para encerronas e robos, além de duplicação das ameaças no contexto escolar.", "meio_ambiente": "Um incêndio na Amazônia, que atingiu mais de 30 cidades, registrou um aumento de 271% nos focos de incêndio nos dez primeiros dias de outubro de 2025, com 1.380 ocorrências, contra 372 no mesmo período do ano anterior, levantando preocupações sobre a degradação ambiental. Em outro desenvolvimento, a África registrou um recorde de instalação de painéis solares em 2026, com 17 GW previstos até o final do ano, um aumento de 45% em relação a 2025, apesar de esse avanço não ser refletido nas estatísticas oficiais. Além disso, centenas de milhares de pessoas marcharam por Bruxelas exigindo ações mais rápidas sobre o clima antes da COP31, que ocorrerá em Antalya, na Turquia, no mês seguinte, reforçando a importância da cooperação internacional na luta contra o aquecimento global.", "direitos_humanos": "O Conselho Nacional de Direitos Humanos da Coreia decidiu revogar sua recomendação anterior sobre a garantia do direito de defesa do ex-presidente Yoon Suk Yeol durante seu julgamento de impeachment no Tribunal Constitucional. Como compensação, o conselho planeja emitir uma nota de desculpas. Essa decisão ocorre após a abstenção do presidente do conselho, Ahn Chang-ho, que foi nomeado por Yoon. Em outro evento, a UNICEF emitiu uma declaração sobre a tragédia da capotagem de uma embarcação de migrantes perto da costa do Djibouti, que resultou em pelo menos 15 mortes, incluindo crianças, refletindo a crise humanitária em Gaza, onde o UNRWA alerta que as condições de higiene e a escassez de suprimentos médicos estão agravando a situação. Além disso, a diretora regional da UNICEF para a África Oriental e do Sul do África, Etleva Kadilli, expressou preocupação com a situação em Gaza. No contexto global, a pena de morte nos Estados Unidos continua a ser debatida, com a maioria da população ainda a favor dessa prática, mesmo em casos controversos como os de Christa Pike e Nidal Hasan."}, "resumo_do_dia": {"politica_nacional": [{"id": 210787, "titulo": "Rio tem ato de apoiadores de Lula em Copacabana durante feriado nacional", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/rio-tem-ato-de-apoiadores-de-lula-em-copacabana-durante-feriado-nacional.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-12T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apoiadores realizaram um ato em defesa da candidatura de Lula em Copacabana, na zona sul do Rio de Janeiro, durante o feriado nacional em 12 de dezembro de 2026.", "titulo_pt": "Ato de apoiadores de Lula em Copacabana durante feriado nacional", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 210843, "titulo": "A nova pesquisa Ipespe sobre a disputa Flávio x Lula na reta final do segundo turno", "url": "https://veja.abril.com.br/politica/a-nova-pesquisa-ipespe-sobre-a-disputa-flavio-x-lula-na-reta-final-do-segundo-turno/", "fonte_id": "veja", "data_pub": "2026-10-12T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Ipespe analisou a intenção de voto, rejeição, confiança e percepção sobre as campanhas dos candidatos Flávio e Lula na reta final do segundo turno.", "titulo_pt": "Nova pesquisa Ipespe sobre a disputa Flávio x Lula na reta final do segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 210788, "titulo": "Propaganda de Flávio Bolsonaro na TV é transmitida sem som e candidato reclama", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/propaganda-de-flavio-bolsonaro-na-tv-e-transmitida-sem-som-e-candidato-reclama.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-12T17:35:00Z", "idioma": "pt", "provavel_d adores e presidentes, além de participar de plebiscitos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210934, "titulo": "Arcebispo de Aparecida diz que \"cenário político está muito carregado\"", "url": "https://www.metropoles.com/sao-paulo/arcebispo-aparecida-cenario-politico-carregado", "fonte_id": "metropoles", "data_pub": "2026-10-12T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dom Mário Antônio da Silva, arcebispo de Aparecida (SP), afirmou que é necessário furar bolhas, buscar o diálogo e agir com lucidez no cenário político atual.", "titulo_pt": "Arcebispo de Aparecida diz que 'cenário político está muito carregado'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210937, "titulo": "MPF pede à Justiça para isentar até 265 empresas de ônibus de norma da ANTT", "url": "https://www.metropoles.com/colunas/tacio-lorran/mpf-pede-a-justica-para-isentar-ate-265-empresas-de-onibus-de-norma-da-antt", "fonte_id": "metropoles", "data_pub": "2026-10-12T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) solicitou à Justiça que isente até 265 empresas de ônibus de uma norma estabelecida pela Agência Nacional de Transportes Terrestres (ANTT). De acordo com o MPF, essa norma estaria impedindo a abertura do mercado de transporte de passageiros.", "titulo_pt": "MPF pede isenção de norma para 265 empresas de ônibus", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210779, "titulo": "Técnicos do TSE não encontram conteúdo falso no canal Exército do Lula", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/tecnicos-do-tse-nao-encontram-conteudo-falso-no-canal-exercito-do-lula", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-12T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da equipe técnica do TSE não encontrou conteúdo falso no canal 'Exército do Lula', criado no WhatsApp par ir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/militar-proximo-a-campanha-de-flavio-pazuello-defende-anistia-a-presos-do-golpe-e-a-quem-prendeu.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-12T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Militares que estavam próximos à campanha de Jair Bolsonaro e não foram condenados por tentativa de golpe de Estado se sentem descontentes com o alargamento da campanha de Flávio Bolsonaro. Esses militares se ressentem do fato de não estarem incluídos nessa nova fase da campanha.", "titulo_pt": "Militares não incluídos na campanha de Flávio se ressentem do alijamento", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 210859, "titulo": "Vídeo antigo de Alckmin com críticas a Lula e ao PT viraliza nas redes", "url": "https://veja.abril.com.br/politica/video-antigo-de-alckmin-com-criticas-a-lula-e-ao-pt-viraliza-nas-redes/", "fonte_id": "veja", "data_pub": "2026-10-12T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo antigo de Alckmin, no qual ele critica Lula e o PT, especialmente sobre corrupção envolvendo o partido, está circulando nas redes sociais.", "titulo_pt": "Vídeo antigo de Alckmin criticando Lula e PT viraliza nas redes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 210759, "titulo": "Ministro diz que Lula fará ajuste das contas em 4 anos e vê 'conversa fiada' de Flávio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/ministro-diz-que-lula-fara-ajuste-das-contas-em-4-anos-e-ve-conversa-fiada-de-flavio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento, Bruno Moretti, afirmou à Folha que, se reeleito, o governo de Lula fará um ajuste gradual nas contas públicas nos próximos quatro anos, diferentemente do que vem sendo sinal e?", "url": "https://www.theguardian.com/politics/2026/oct/12/andy-burnham-kremlin-eu-referendum-brexit", "fonte_id": "guardian_world", "data_pub": "2026-10-12T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Burnham, o atual primeiro-ministro, reabriu um debate antigo sobre a interferência russa no referendo do Brexit de 2016. Sua declaração inesperada de que foi informado sobre essa possibilidade após assumir o cargo trouxe o tema à tona novamente.", "titulo_pt": "Quão significativo são os comentários de Burnham sobre a interferência russa no referendo do Brexit?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 211376, "titulo": "Lebanese health ministry: Israeli attacks have killed nearly 9,000 people since October 2023", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/lebanese-health-ministry-israeli-attacks-have-killed-nearly-9000-people", "fonte_id": "middle_east_eye", "data_pub": "2026-10-12T16:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde do Líbano informou que, desde 8 de outubro de 2023, ataques israelenses causaram a morte de aproximadamente 8.965 pessoas e feriram 30.660 no Líbano.", "titulo_pt": "Ministério da saúde libanês: ataques israelenses desde outubro de 2023 mataram quase 9.000 pessoas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 211444, "titulo": "Machinery exports rising: industry group", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/13/2003865842", "fonte_id": "taipei_times", "data_pub": "2026-10-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de maquinário estão aumentando, de acordo com um grupo da indústria.", "titulo_pt": "Exportações de maquinário em alta: grupo da indústria", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 210842, "titulo": "Petróleo supera US$ 106 com ata e do dólar paralelo (blue) são baseados nos preços do último dia útil da semana passada.", "titulo_pt": "Dólar hoje e dólar blue, ao VIVO: a que valor estão cotados o oficial e o paralelo neste feriado de 12 de outubro, minuto a minuto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 210894, "titulo": "Aneel pauta reajustes das distribuidoras EDP São Paulo e a CPFL Piratininga", "url": "https://www.cnnbrasil.com.br/infra/aneel-pauta-reajustes-das-distribuidoras-edp-sao-paulo-e-a-cpfl-piratininga/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Energia Elétrica (Aneel) pautou reajustes nas tarifas das distribuidoras EDP São Paulo e CPFL Piratininga. Os reajustes médios previstos são de 3,16% para a EDP e 5,41% para a CPFL Piratininga, atendendo aproximadamente 4,2 milhões de imóveis.", "titulo_pt": "Aneel pauta reajustes das distribuidoras EDP São Paulo e CPFL Piratininga", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 211314, "titulo": "Higher rates could be needed to avoid 'inflationary mindset' taking hold, says Fed's Hammack", "url": "https://www.cnbc.com/2026/10/12/beth-hammack-fed-inflation-policy.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente do Federal Reserve de Cleveland, Loretta M. M. Hamak, afirmou que taxas de juros mais altas podem ser necessárias para evitar que um 'mindset inflacionário' se instale. Ela também disse que política monetária mais apertada seria necessária para reduzir a inflação.", "titulo_pt": "Taxas mais altas podem ser necessárias para evitar 'mindset inflacionário', diz Fed de cleveland", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 211393, "titulo": "The diesel crisis is testing the limits of globalisation", "url": "https://www.ft.com/content/076b9c64-d041-42f0-9abc-d7be75db9307", "fonte_id": "financial_times", "data_pub": "2026-10-12T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crise do diesel está testando os limites da globalização, com decisões individuais de estados parecendo enfraquecer a segurança energética coletiva e acelerar a fragmentação.", "titulo_pt": "A crise do diesel está testando os limites da globalização", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 211027, "titulo": "Dependência de diesel importado seguirá em 25% até 2036, prevê MME", "url": "https://www.jota.info/executivo/dependencia-de-diesel-importado-seguira-em-25-ate-2036-preve-mme", "fonte_id": "jota", "data_pub": "2026-10-12T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério de Minas e Energia projeta que a dependência de diesel importado manter-se-á em 25% até 2036, conforme consta na proposta do Plano Decenal de Expansão de Energia de 2026.", "titulo_pt": "Dependência de diesel importado permanecerá em 25% até 2036, prevê MME", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210756, "titulo": "Renault revisita a própria história e recorre até ao Twingo para ser competitiva diante do avanço chinês", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/renault-revisita-a-propria-historia-e-recorre-ate-ao-twingo-para-ser-competitiva-diante-do-avanco-chines.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Renault exibe modelos antigos em seu estande do Salão do Automóvel de Paris de 2026, incluindo o Twingo, para se posicionar diante do avanço das marcas chinesas. A empresa revisita sua história ao apresentar veículos lançados nas últimas quatro décadas do século 20.", "titulo_pt": "Renault revisita sua história e recorre ao Twingo para se posicionar diante do avanço chinês", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 211318, "titulo": "UnitedHealth shares are doing something unusual ahead of earnings", "url": "https://www.cnbc.com/2026/10/12/unitedhealth-shares-are-doing-something-unusual-ahead-of-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da UnitedHealth estão aumentando de preço de forma incomum antes da divulgação dos resultados financeiros. O custo mais alto é frequentemente a seguradora de saúde, seguida pelo custo de segurar as ações dessas seguradoras.", "titulo_pt": "Ações da unitedhealth estão em aumento incomum antes dos resultados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 211398, "titulo": "LVMH’s fashion and leather sales fall in luxury setback", "url": "https://www.ft.com/content/71003e2e-107b-4e87-adef-77e825a3aef4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-12T16:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O grupo listado na bolsa de Paris registrou uma queda nas vendas de moda e couro, apesar de ter celebrado o mercado americano em alta. As vendas foram impactadas pela diminuição da demanda na China.", "titulo_pt": "Vendas de moda e couro da lvmh caem em contraste com mercado americano forte", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 210758, "titulo": "Dólar ronda máxima em 18 meses, enquanto tensão no Golfo e inflação nos EUA mantêm investidores em alerta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467453", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar permaneceu próximo da sua máxima em 18 meses, devido à procura por ativos de proteção e à tensão no Oriente Médio, enquanto aguarda dados sobre a inflação nos Estados Unidos.", "titulo_pt": "Dólar mantém máximos em 18 meses devido à tensão no oriente médio e à expectativa de dados sobre inflação nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 210760, "titulo": "Ocupação de escritórios de alto padrão em SP atinge o dobro da média histórica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/ocupacao-de-escritorios-de-alto-padrao-em-sp-atinge-o-dobro-da-media-historica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T15:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ocupação de escritórios de alto padrão em São Paulo atingiu 118 mil m² no trimestre, o melhor resultado trimestral. No acumulado de nove meses, o saldo foi de 284 mil m², o dobro da média histórica anual de 139 mil m².", "titulo_pt": "Ocupação de escritórios de alto padrão em SP atinge o dobro da média histórica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 211028, "titulo": "Reforma tributária aquece mercado e amplia procura por profissionais qualificados", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/reforma-tributaria-aquece-mercado-e-amplia-procura-por-profissionais-qualificados", "fonte_id": "jota", "data_pub": "2026-10-12T14:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de trabalho para analistas fiscais e tributários aqueceu, com uma alta de 138,5% na contratação desses profissionais entre os períodos de 2025 e 2026, de acordo com um levantamento da Assigna.", "titulo_pt": "Reforma tributária impulsiona demanda por analistas fiscais e tributários", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210762, "titulo": "Chefe do FMI se diz alarmada com o tsunami em câmera lenta da IA sobre empregos e impostos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/chefe-do-fmi-se-diz-alarmada-com-o-tsunami-em-camera-lenta-da-ia-sobre-empregos-e-impostos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretora-geral do FMI alertou para os riscos que a inteligência artificial representa para o mercado de trabalho e a arrecadação tributária, incentivando políticas públicas que possam ajudar a sociedade a se adaptar. Ela enfatizou a necessidade de repensar a educação e agir imediatamente diante dessa ameaça em expansão.", "titulo_pt": "Chefe do FMI se alarmada com a ameaça em expansão da IA sobre empregos e impostos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 211105, "titulo": "More part-time bosses and co-CEOs could keep women in leadership and narrow Australia’s pay gap", "url": "https://www.theguardian.com/australia-news/2026/oct/13/more-part-time-bosses-and-co-ceos-could-keep-women-in-leadership-and-narrow-australias-pay-gap", "fonte_id": "guardian_world", "data_pub": "2026-10-12T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas indicam que responsabilidades desiguais de cuidado e a falta de opções flexíveis de trabalho têm impedido as mulheres de manterem posições de liderança. O Agência de Igualdade de Gênero no Trabalho do governo federal sugere que mais chefes parciais e 'co-CEO's' poderiam manter as mulheres em posições de liderança e reduzir o gap salarial de gênero em Austrália, onde as mulheres ganham em média 79 centavos a cada dólar que os homens ganham.", "titulo_pt": "Mais chefes parciais e co-ceo's podem manter mulheres em liderança e reduzir gap salarial em austrália", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 211488, "titulo": "Meta releases its first frontier model, Muse Wonder", "url": "https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta liberou dois novos modelos de inteligência artificial avançada, chamados Muse Wonder e Muse Wonder Full, na primeira tentativa da empresa em desenvolver um modelo de fronteira.", "titulo_pt": "Meta libera seus primeiros modelos de fronteira, Muse Wonder e Muse Wonder full", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 211497, "titulo": "Elon Musk Bragged About His Grok Lego Star Wars Haul. Then X Users Punked Him", "url": "https://www.wired.com/story/elon-musk-bragged-about-his-grok-lego-star-wars-haul-then-x-users-punked-him/", "fonte_id": "wired", "data_pub": "2026-10-12T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk exibiu uma coleção de Lego Star Wars, mas usuários do X (anteriormente conhecido como Twitter) o brincaram, provavelmente por questões de segurança. O comentário de Musk sobre a falta de segurança da coleção foi então usado contra ele.", "titulo_pt": "Elon Musk exibiu sua coleção de Lego Star Wars, mas foi brincado por usuários do X", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 211489, "titulo": "WindBorne wins a hefty US Air Force contract for its balloon data", "url": "https://techcrunch.com/2026/10/12/windborne-wins-a-hefty-us-air-force-contract-for-its-balloon-data/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup de Silicon Valley que utiliza balões meteorológicos e IA para prever o tempo ganhou um contrato militar dos Estados Unidos avaliado em quase 50 milhões de dólares.", "titulo_pt": "Windborne conquista contrato militar valioso com uso de balões meteorológicos e ai", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 210849, "titulo": "49% dos pacientes ouvidos em pesquisa já usaram IA em saúde", "url": "https://veja.abril.com.br/coluna/faria-lima-news/49-dos-pacientes-ouvidos-em-pesquisa-ja-usaram-ia-em-saude/", "fonte_id": "veja", "data_pub": "2026-10-12T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa revelou que 49% dos pacientes ouvidos já utilizaram inteligência artificial em contextos de saúde. Os principais temas abordados incluem sintomas, exames e medicamentos.", "titulo_pt": "49% Dos pacientes já usaram IA em saúde", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 211392, "titulo": "Zuckerberg says Meta has reached AI ‘frontier’ and rejects calls for slowdown", "url": "https://www.ft.com/content/fca23e77-be57-4d7e-ae61-74ff299e25cb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-12T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zuckerberg afirmou que a Meta atingiu a 'fronteira' da IA e rejeitou pedidos para reduzir o ritmo de investimentos. A empresa lançou recentemente o novo modelo de realidade aumentada Muse Wonder após um grande investimento na corrida pela liderança em IA.", "titulo_pt": "Zuckerberg diz que Meta atingiu 'fronteira' de IA e rejeita chamados para diminuir investimentos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 211498, "titulo": "Muse Wonder Puts Meta Back at the AI Frontier", "url": "https://www.wired.com/story/muse-wonder-puts-meta-back-at-the-ai-frontier/", "fonte_id": "wired", "data_pub": "2026-10-12T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O modelo mais grande da Meta é comparável com os melhores do mundo e inclui novas funcionalidades para evitar que os agentes se desviem do curso.", "titulo_pt": "Muse marvel coloca a Meta de volta na frente da IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 211112, "titulo": "Hackers force French supermarket fridges to heat up to 50C in ‘unprecedented’ cyber-attack", "url": "https://www.theguardian.com/world/2026/oct/12/cyber-attack-defrosts-refrigerators-france-supermarket-chains-intermarche-cooperative-u", "fonte_id": "guardian_world", "data_pub": "2026-10-12T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hackeres atingiram centenas de lojas de supermercado Intermarché e Coopérative U na França, elevando a temperatura de vários refrigeradores para 50°C, causando prejuízos e incêndios. O ataque, descrevido como inédito, afetou várias grandes redes de varejo alimentício no país.", "titulo_pt": "Hackers fazem freezers de supermercados franceses aquecerem a 50°C em ataque cibernético inédito", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 211471, "titulo": "Interview: Microsoft's Maia GM on Maia 300, Taiwan and HBM supply", "url": "https://www.digitimes.com/news/a20261012VL216/microsoft-taiwan-hbm-chips-copilot.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os chips Azure Maia desenvolvidos internamente pela Microsoft serão o principal plataforma para seus próprios serviços de inteligência artificial, como Microsoft 365 Copilot, GitHub Copilot e Microsoft Foundry. No entanto, a empresa continuará a usar GPUs da Nvidia e AMD, conforme declarado pelo gerente geral do programa Azure Maia, Andrew Wall, à DIGITIMES.", "titulo_pt": "Entrevista: gerente geral do programa azure Maia sobre chips Maia 300, Taiwan e suprimento de HBM", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 211484, "titulo": "Long-lost horror gaming cult classic P.T. gets a much-needed PC port", "url": "https://arstechnica.com/gaming/2026/10/long-lost-horror-gaming-cult-classic-p-t-gets-a-much-needed-pc-port/", "fonte_id": "ars_technica", "data_pub": "2026-10-12T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo de horror de culto 'P.T.', criado por Kojima, foi portado para PC após estar disponível apenas em alguns discos duros PS4 antigos. Este portátil é considerado uma melhoria significativa para os jogadores que desejam experimentar o jogo.", "titulo_pt": "Jogo de horror de culto P.T. Recebe portabilidade para PC", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 211490, "titulo": "Honeyjar offers AI tools to improve PR and comms at every company", "url": "https://techcrunch.com/2026/10/12/honeyjar-offers-ai-tools-to-improve-pr-and-comms-at-every-company/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Honeyjar oferece ferramentas de inteligência artificial para melhorar a relações públicas e comunicação em todas as empresas. O questionamento é sobre se a inteligência artificial pode realmente melhorar as relações públicas.", "titulo_pt": "Honeyjar oferece ferramentas de AI para melhorar PR e comunicação em todas as empresas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 211510, "titulo": "The Yandex outage probably didn’t blitz Russian bots", "url": "https://www.theverge.com/tech/1009594/russian-bots-yandex-outage-drone-strikes-debunk", "fonte_id": "the_verge", "data_pub": "2026-10-12T15:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma queda nos níveis de tráfego de bots foi observada, mas provavelmente não se trata dos bots associados à Rússia. Várias investidas aéreas ucranianas nos últimos dias causaram interrupções em data centers russos, levando a um declínio no tráfego online.", "titulo_pt": "A falha do Yandex provavelmente não diminuiu o tráfego de bots russos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 211491, "titulo": "Microsoft president says UK is best placed to drive AI regulation", "url": "https://techcrunch.com/2026/10/12/microsoft-president-says-uk-is-best-placed-to-drive-ai-regulation/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T15:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente da Microsoft, Brad Smith, defende a necessidade urgente de regulamentar a inteligência artificial, afirmando que a regulação de itens como leite e máquinas de lavar roupa é maior do que a regulação de empresas de IA.", "titulo_pt": "Vice-presidente da microsoft afirma que o reino unido está bem posicionado para impulsionar a regulação da IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 211492, "titulo": "This AI startup says it can generate permit-ready blueprints in minutes", "url": "https://techcrunch.com/2026/10/12/this-ai-startup-says-it-can-generate-permit-ready-blueprints-in-minutes/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Blueprints AI, sediada em Santa Monica e financiada por si mesma, desenvolveu um software que gera planilhas de projeto de construção conformes com o código de construção a partir de uma foto, PDF ou esboço.", "titulo_pt": "Esta startup de IA afirma poder gerar blueprints aprovados em minutos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 211493, "titulo": "Fitbit Edge is Google’s middle ground between Fitbit Air and Pixel Watch", "url": "https://techcrunch.com/2026/10/12/fitbit-edge-is-googles-middle-ground-between-fitbit-air-and-pixel-watch/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Google lançou o Fitbit Edge, um wearable que custa $179,99. Ele combina o design elegante do Fitbit Air com uma tela OLED.", "titulo_pt": "Fitbit Edge é a solução do Google entre Fitbit Air e Pixel Watch", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 211315, "titulo": "Microsoft to rely more on homegrown AI chips, reducing dependence on Nvidia", "url": "https://www.cnbc.com/2026/10/12/microsoft-will-mainly-use-its-maia-chips-for-ai-inference.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T14:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft planeja aumentar sua dependência de chips de inteligência artificial desenvolvidos internamente, reduzindo sua dependência da Nvidia. Isso pode expandir suas margens e fortalecer sua estrutura de inteligência artificial.", "titulo_pt": "Microsoft vai depender mais de chips de IA próprios, reduzindo dependência da Nvidia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 211499, "titulo": "They War-Gamed Dimming the Sun. It Went Even Worse Than You Think", "url": "https://www.wired.com/story/they-war-gamed-dimming-the-sun-it-went-even-worse-than-you-think/", "fonte_id": "wired", "data_pub": "2026-10-12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um simulacro inovador mostrou que a engenharia solar geoética poderia levar a um novo e perigoso conflito geopolítico, além de potencialmente comprar tempo para combater o aquecimento global ou causar uma corrida armamentista.", "titulo_pt": "Eles simularam diminuir a luz do sol. O resultado foi ainda mais ruim do que se pensa", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 211533, "titulo": "New Jurassic crocodile species had unusually slender teeth, suggesting it fed on shrimp and tiny fish", "url": "https://phys.org/news/2026-10-jurassic-crocodile-species-unusually-slender.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade de Portsmouth e da Hassan II de Casablanca, no Marrocos, descobriram uma nova espécie de parente de crocodilo do Jurássico que viveu há aproximadamente 170 milhões de anos. Essa espécie tinha dentes incomumente finos, sugerindo que se alimentava de camarões e pequenos peixes.", "titulo_pt": "Nova espécie de crocodilo do jurássico tinha dentes finos, indicando alimentação de camarões e pequenos peixes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211534, "titulo": "Alternative gravity theory offers possible explanation for dark energy changing over time", "url": "https://phys.org/news/2026-10-alternative-gravity-theory-explanation-dark.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas observações recentes estão questionando a ideia de que a energia escura permanece inalterada ao longo do tempo. Uma teoria alternativa da gravidade sugere que a energia escura poderia estar mudando ao longo da história cósmica.", "titulo_pt": "Teoria alternativa de gravidade oferece possível explicação para a energia escura mudar ao longo do tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211535, "titulo": "How much rain can a hurricane make, and does the storm size matter?", "url": "https://phys.org/news/2026-10-hurricane-storm-size.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hurricanes podem produzir enormes quantidades de chuva, acumulando trilhões de galões de água. No entanto, o principal risco não está na quantidade total de chuva, mas sim no quanto cai em cada localização.", "titulo_pt": "Quanto chuvoso pode ser um hurricano, e importa o tamanho da tempestade?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211008, "titulo": "Reid Wiseman, piloto de Artemis II: “Vimos cosas que ningún ser humano ha visto jamás”", "url": "https://www.lanacion.com.ar/el-mundo/reid-wiseman-piloto-de-artemis-ii-vimos-cosas-que-ningun-ser-humano-ha-visto-jamas-nid09102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-12T17:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Reid Wiseman, um dos astronautas da missão Artemis II, relatou ter visto coisas que nunca antes foram vistas por nenhum ser humano. O depoimento foi feito durante a missão, concluída em abril deste ano, antes do grupo perder a conexão com a Terra por 40 minutos.", "titulo_pt": "Reid Wiseman, astronauta da Artemis II: 'vimos coisas que nenhum ser humano jamais viu'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 211536, "titulo": "The dying sun could tear the solar system apart sooner than thought", "url": "https://phys.org/news/2026-10-dying-sun-solar-sooner-thought.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos publicados na revista The Astrophysical Journal Letters sugerem que o fim do sistema solar, particularmente dos planetas externos, pode ocorrer em cerca de um bilhão de anos, muito menos do que as estimativas anteriores de um quintilhão de anos.", "titulo_pt": "O sol moribundo poderia desintegurar o sistema solar em um bilhão de anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211537, "titulo": "Physics Nobel highlights Antarctica's role in exploring the cosmos", "url": "https://phys.org/news/2026-10-physics-nobel-highlights-antarctica-role.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Francis Halzen, um físico de partículas belgo-americano, foi premiado com o Prêmio Nobel de Física em 2026 por suas contribuições decisivas para o Observatório de Neutrinos IceCube e pela descoberta de neutrinos de alta energia de origem astrológica. Este prêmio reforça o papel de ambientes antárticos na exploração do cosmos há mais de um século.", "titulo_pt": "Prêmio Nobel destaca papel da antártida na exploração cósmica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210900, "titulo": "Navio antes usado para explorar petróleo agora faz pesquisa científica e já descobriu mais de cem espécies no oceano profundo", "url": "https://www.cnnbrasil.com.br/ciencia/navio-antes-usado-para-explorar-petroleo-agora-faz-pesquisa-cientifica-e-ja-descobriu-mais-de-cem-especies-no-oceano-profundo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um navio que anteriormente era usado para explorar petróleo agora realiza pesquisas científicas no oceano profundo e já descobriu mais de cem novas espécies. A CNN Brasil visitou a embarcação, que estava atracada em Fortaleza e retornará ao Brasil em 2027, ano em que o país sediará um evento da ONU sobre a Década do Oceano.", "titulo_pt": "Navio que antes explorava petróleo agora faz pesquisas científicas no oceano profundo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 211538, "titulo": "Ancient people relied on genetic variation already present in wild plants to domesticate crops like rice and corn", "url": "https://phys.org/news/2026-10-ancient-people-genetic-variation-wild.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oryza rufipogon é uma espécie de erva comum encontrada hoje em partes da China, Índia e Ásia Oriental. Mais de 8.000 anos atrás, as pessoas do Vale Inferior do Yangtze começaram a cultivar essa planta.", "titulo_pt": "Povos antigos utilizaram variação genética já presente em plantas silvestres para domesticar cultivos como arroz e milho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211539, "titulo": "A migration running out of time? New Zealand banded dotterels reach Australia later each year", "url": "https://phys.org/news/2026-10-migration-zealand-banded-dotterels-australia.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Banded dotterels, conhecidos como plovers duplamente-bandeados na Austrália, estão chegando à Austrália cada ano mais tarde. Esses pombos-estripados são uma vista comum nas praias abertas, nas areias dos rios e nos planaltos vulcânicos nus da Nova Zelândia, o único país onde eles se reproduzem.", "titulo_pt": "Migração em declínio? Banded dotterels chegam à austrália mais tarde a cada ano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211576, "titulo": "The Monte Verde controversy is back: who first lived in the Americas?", "url": "https://www.newscientist.com/article/2593162-the-monte-verde-controversy-is-back-who-first-lived-in-the-americas/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-12T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sítios arqueológicos de Monte Verde no Chile têm sido fonte de debates entre arqueólogos há décadas. O colunista Michael Marshall relata que o controvérsio está se intensificando novamente, o que poderia revolucionar nossa compreensão sobre os primeiros habitantes das Américas.", "titulo_pt": "Controvérsia de Monte Verde volta à tona: quem foi o primeiro a habitar as américas?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 211397, "titulo": "Two economists who transformed crisis management win Nobel Prize", "url": "https://www.ft.com/content/1d3b1c4f-823d-49eb-aaf5-b662a6281ac7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-12T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os economistas Robert E. Hall e Michael Woodford contribuíram para a maneira como os bancos centrais gerenciam crises financeiras, especialmente após a turbulência financeira de 2008.", "titulo_pt": "Dois economistas que transformaram a gestão de crises vencem prêmio Nobel", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 211540, "titulo": "This economist believes the system is broken. Maybe she has a point", "url": "https://phys.org/news/2026-10-economist-believes-broken.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economista Mariana Mazzucato argumenta em seu novo livro, 'A Economia do Bem Comum', que os governos devem trabalhar em colaboração com o setor privado, assumindo um papel mais ativo na governança dos mercados. Isso envolve se mover além da correção de falhas de mercado e falhas governamentais para moldar como os mercados são gerenciados.", "titulo_pt": "Esta economista acredita que o sistema está quebrado. Talvez ela tenha razão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211541, "titulo": "Letters reveal forgotten role of Baghdad antiquities dealers in early 20th-century Kish excavations", "url": "https://phys.org/news/2026-10-letters-reveal-forgotten-role-baghdad.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre 1880 e 1912, nenhuma escavação oficial ocorreu em Kish, no Iraque. No entanto, museus de Londres, Paris e Nova York estavam adquirindo tabletas antigas. De fato, iraquianos locais haviam estado escavando o local anos antes das escavações oficiais em Kish retomarem. No entanto, enquanto as escavações oficiais são lembradas e celebradas, os iraquianos locais foram esquecidos em sua própria história.", "titulo_pt": "Cartas revelam papel esquecido dos vendedores de antiguidades de bagdá nas escavações de Kish no início do século xx", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211542, "titulo": "What can free‑living Indian street dogs teach us about how to care for pet dogs?", "url": "https://phys.org/news/2026-10-freeliving-indian-street-dogs-pet.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute como os cães de rua indianos podem nos fornecer insights sobre como cuidar de cães de estimação. Os proprietários de cães de estimação fornecem abrigo, cuidados veterinários, afeto, treinamento e brincadeiras aos seus animais.", "titulo_pt": "O que os cães de rua indianos podem nos ensinar sobre como cuidar de cães de estimação?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211543, "titulo": "Franklin created famed 'Photo 51' after calculating key features of DNA's helix from an earlier image, study reveals", "url": "https://phys.org/news/2026-10-franklin-famed-photo-key-features.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem 'Photo 51' foi uma versão mais limpa de uma imagem X anterior, 'Photo 49', que Rosalind Franklin já havia usado para calcular características-chave da hélice do DNA. Isso desafia as anteriores suposições sobre o papel de Franklin na descoberta do duplo hélice.", "titulo_pt": "Franklin criou famosa 'Photo 51' após calcular características-chave do helice do DNA a partir de uma imagem anterior", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211544, "titulo": "Mangroves shield coasts from waves, but seedlings need calm waters to take root", "url": "https://phys.org/news/2026-10-mangroves-shield-coasts-seedlings-calm.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manguezais desempenham um papel crucial na proteção costeira, amortecendo as ondas e surtos de tempestades. Elas armazenam carbono no solo e abrigam uma ampla variedade de organismos vivos.", "titulo_pt": "Manguezais protegem as praias, mas as mudas precisam de águas calmas para se estabelecerem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 211440, "titulo": "Let culture bloom", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/13/2003865882", "fonte_id": "taipei_times", "data_pub": "2026-10-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância de cultivar a cultura em várias áreas, mas não fornece detalhes específicos sobre como isso será feit
