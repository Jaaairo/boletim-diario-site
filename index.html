lisou como as conversas entre colegas de trabalho afetam a saúde emocional. As conversas foram associadas a uma diminuição do bem-estar e a um aumento da ruminação.", "titulo_pt": "Peritos em psicologia concordam: desabafos com colegas de trabalho diminuem bem-estar e aumentam ruminação", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258075, "titulo": "Los voluntarios del Papa: 25.000 nombres para mejorar la Argentina", "url": "https://www.lanacion.com.ar/opinion/los-voluntarios-del-papa-25000-nombres-para-mejorar-la-argentina-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T21:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A visita do Papa Leão XIV destacou o potencial do voluntariado na Argentina, um movimento silencioso com poder transformador que, embora se fortaleça em ocasiões especiais, não se consolida como um hábito permanente e estruturado na sociedade.", "titulo_pt": "Os voluntários do Papa: 25.000 nomes para melhorar a Argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 257950, "titulo": "Cacique Raoni é internado com oscilações na pressão e infecção pulmonar", "url": "https://www.metropoles.com/brasil/cacique-raoni-e-internado-com-oscilacoes-na-pressao-e-infeccao-pulmonar", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cacique Raoni, de 94 anos, está internado desde domingo, 8 de novembro, em Mato Grosso, devido a oscilações na pressão e infecção pulmonar. Seu quadro de saúde é considerado estável.", "titulo_pt": "Cacique Raoni internado com oscilações na pressão e infecção pulmonar", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257954, "titulo": "Briga por assento termina com passageiros expulsos de voo", "url": "https://www.metropoles.com/brasil/briga-por-assento-termina-com-passageiros-expulsos-de-voo", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tumulto envolvendo passageiros disputando assentos ocorreu no voo da Gol que saía do aeroporto de Porto Seguro, Bahia, com destino ao Rio de Janeiro. Os envolvidos foram expulsos do avião.", "titulo_pt": "Briga por assento termina com passageiros expulsos de voo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257957, "titulo": "Policial penal morre, aos 45 anos, após colidir SUV na traseira de carreta", "url": "https://www.metropoles.com/distrito-federal/na-mira/policial-penal-morre-aos-45-anos-apos-colidir-suv-na-traseira-de-carreta", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ferdinando Gregório, de 45 anos, faleceu após um acidente na BR-101 onde seu veículo colidiu na traseira de uma carreta. Ele era presidente da Associação dos Policiais Penais.", "titulo_pt": "Policial penal morre em acidente na br-101", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257920, "titulo": "Greve geral na Espanha reúne movimentos populares contra exploração e desigualdade social; entenda", "url": "https://www.brasildefato.com.br/2026/11/11/greve-geral-na-espanha-reune-movimentos-populares-contra-exploracao-e-desigualdade-social-entenda/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-11T20:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Espanha está vivenciando uma greve geral de 24 horas, convocada por sindicatos e movimentos populares contra a especulação imobiliária, baixos salários e a precarização dos serviços públicos. A paralisação, impulsionada por organizações de defesa da moradia, reúne trabalhadores de diferentes setores.", "titulo_pt": "Greve geral na Espanha reúne movimentos populares contra exploração e desigualdade social", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 258109, "titulo": "Ministerios de la Mujer y Vivienda avanzan en soluciones habitacionales para mujeres víctimas de violencia grave o extrema", "url": "https://www.latercera.com/nacional/noticia/ministerios-de-la-mujer-y-vivienda-avanzan-en-soluciones-habitacionales-para-mujeres-victimas-de-violencia-grave-o-extrema/", "fonte_id": "la_tercera", "data_pub": "2026-11-11T20:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os ministros dos respectivos portfólios entregaram simbolicamente as soluções habitacionais para mulheres vítimas de violência grave ou extrema e assinaram a atualização do acordo de colaboração entre as duas pastas.", "titulo_pt": "Ministérios da mulher e da habitação avançam em soluções habitacionais para mulheres vítimas de violência grave ou extrema", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258110, "titulo": "Camioneros y diálogo con el gobierno por paro: “Hay buenas intenciones, pero no tenemos un acuerdo”", "url": "https://www.latercera.com/nacional/noticia/camioneros-y-dialogo-con-el-gobierno-por-paro-hay-buenas-intenciones-pero-no-tenemos-un-acuerdo/", "fonte_id": "la_tercera", "data_pub": "2026-11-11T20:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Durante as negociações em La Moneda, Cristián Sandoval enfatizou a necessidade de alcançar acordos concretos. Os camioneros e o governo estão em diálogo, mas ainda não chegaram a um acordo definitivo.", "titulo_pt": "Camioneros e diálogo com o governo por paro: 'há boas intenções, mas não temos um acordo'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258259, "titulo": "More than one million people in Lebanon face acute food shortages, UN says", "url": "https://www.aljazeera.com/news/2026/11/11/one-million-people-in-lebanon-facing-acute-food-insecurity-un-says?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) alerta que mais de a-parcialmente-em-nova-york-e-deixa-pessoas-soterradas", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um prédio desabou parcialmente no bairro de Flatbush, no Brooklyn, em Nova York, deixando pessoas soterradas. Bombeiros estão realizando uma operação de resgate no local.", "titulo_pt": "Prédio desaba parcialmente em Nova York e deixa pessoas soterradas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258018, "titulo": "UE está longe da meta de cortar emissões no transporte em 90% até 2050", "url": "https://www.dw.com/pt-br/ue-está-longe-da-meta-de-cortar-emissões-no-transporte-em-90-até-2050/a-79912043?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está longe de atingir a meta de reduzir as emissões no setor de transporte em 90% até 2050. Embora as frotas mais limpas estejam transformando a mobilidade no continente, muitas cidades ainda avançam devagar em direção à sustentabilidade.", "titulo_pt": "UE está longe da meta de cortar emissões no transporte em 90% até 2050", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257883, "titulo": "Brasil sobe seis posições em ranking de proteção do clima e supera Alemanha", "url": "https://veja.abril.com.br/agenda-verde/brasil-sobe-seis-posicoes-em-ranking-de-protecao-do-clima-e-supera-alemanha/", "fonte_id": "veja", "data_pub": "2026-11-11T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil subiu seis posições no ranking de proteção do clima, alcançando o 21º lugar entre 64 nações e a União Europeia, devido à redução de 16% nas emissões de gases de efeito estufa.", "titulo_pt": "Brasil avança seis posições em ranking de proteção climática e supera Alemanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 258127, "titulo": "‘The world we know is over’ without urgent climate action, leaders tell Cop31", "url": "https://www.theguardian.com/environment/2026/nov/11/the-world-we-know-is-over-marshall-islands-president-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-11T18:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente das Ilhas Marshall advertiu sobre agravamento das inundações, enquanto o secretário-geral da ONU propôs uma taxa sobre empresas de petróleo e gás. Sem ação urgente climática, os líderes afirmam que o mundo como conhecemos está em perigo.", "titulo_pt": "O mundo como conhecemos está acabado sem ação urgente sobre o clima, dizem líderes em Cop31", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 256982, "titulo": "Brasil extremo: seca atinge 59% do país e alagamentos, 49,5% dos municípios", "url": "https://www.metropoles.com/brasil/brasil-extremo-seca-atinge-59-do-pais-e-alagamentos-495-dos-municipios", "fonte_id": "metropoles", "data_pub": "2026-11-11T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa do IBGE mostra que 59% do Brasil está sob seca e 49,5% dos municípios enfrentam alagamentos. O relatório destaca o acentuado cenário climático extremo no país.", "titulo_pt": "Brasil extremo: seca atinge 59% do país e alagamentos, 49,5% dos municípios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256792, "titulo": "Setores de aço e cimento vão receber R$ 81 milhões para reduzir emissão de CO2", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/setores-de-aco-e-cimento-vao-receber-r-81-milhoes-para-reduzir-emissao-de-co2.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embrapii e a agência alemã GIZ lançaram uma chamada de financiamento no valor de R$ 81 milhões para projetos de pesquisa e desenvolvimento voltados à redução das emissões de CO2 na cadeia industrial do aço e do cimento no Brasil.", "titulo_pt": "Setores de aço e cimento vão receber R$ 81 milhões para reduzir emissão de CO2", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256923, "titulo": "Após clima de inverno, temporais voltam ao Centro-Sul; veja previsão", "url": "https://exame.com/brasil/apos-clima-de-inverno-temporais-voltam-ao-centro-sul-veja-previsao/", "fonte_id": "exame", "data_pub": "2026-11-11T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As massas de ar polar se afastam e as temperaturas começam a subir. Entre quarta e quinta-feira, áreas do Centro-Sul do país podem enfrentar chuva forte, granizo e ventos de até 80 km/h.", "titulo_pt": "Depois do inverno, temporais voltam ao Centro-Sul; confira a previsão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 257034, "titulo": "Brasil salta em ranking de proteção climática após queda do desmatamento na Amazônia", "url": "https://www.dw.com/pt-br/brasil-salta-em-ranking-de-proteção-climática-após-queda-do-desmatamento-na-amazônia/a-79919030?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil melhorou seu ranking de proteção climática devido à redução do desmatamento na Amazônia e ao aumento da utilização de energias renováveis. No entanto, a expansão do petróleo e gás e as emissões de gases de efeito estufa de setores poluentes continuam sendo obstáculos para um avanço maior.", "titulo_pt": "Brasil avança no ranking de proteção climática após queda do desmatamento na Amazônia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257400, "titulo": "Storm Charles: Heavy rain and strong winds batter Portugal", "url": "https://www.euronews.com/video/2026/11/11/storm-charles-heavy-rain-and-strong-winds-batter-portugal", "fonte_id": "euronews", "data_pub": "2026-11-11T13:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fortes chuvas e ventos fortes atingiram a Costa da Caparica em Portugal, fechando instalações costeiras e deixando as ruas alagadas.", "titulo_pt": "Tempo severo: chuvas intensas e ventos fortes castigam a costa da caparica, Portugal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 257456, "titulo": "‘Climate crisis is outrunning us,’ UN chief Guterres says at COP31", "url": "https://www.aljazeera.com/news/2026/11/11/climate-crisis-is-outrunning-us-un-chief-guterres-says-at-cop31?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T12:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da ONU, Guterres, afirma que a crise climática está avançando mais rápido do que as ações tomadas para enfrentá-la, acusando o lobby dos combustíveis fósseis de atrasar as ações críticas em negociações importantes.", "titulo_pt": "Crise climática está avançando mais rápido do que as ações tomadas, diz Guterres em COP31", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 257486, "titulo": "Japan, eight others get fossil award over leaders skipping climate talks", "url": "https://www.japantimes.co.jp/news/2026/11/11/japan/climate-talks-fossil-award/", "fonte_id": "japan_times", "data_pub": "2026-11-11T11:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão e oito outros países receberam um prêmio por líderes que não compareceram às negociações climáticas. Entre os países do G7, apenas o Primeiro Ministro do Reino Unido, Andy Burnham, está programado para participar do evento.", "titulo_pt": "Japão e outros nove países recebem prêmio por líderes que evitam conferências climáticas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 256082, "titulo": "Vinho de patauá contaminado provoca surto de Chagas e deixa 1 morto no Pará", "url": "https://www.metropoles.com/brasil/vinho-de-pataua-contaminado-provoca-surto-de-chagas-e-deixa-1-morto-no-para", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um surto de doença de Chagas foi causado por vinho de patauá contaminado em um município do Pará, com oito casos confirmados e 27 pessoas monitoradas. Até o momento, uma morte foi registrada.", "titulo_pt": "Vinho de patauá contaminado causa surto de Chagas e deixa uma morte no Pará", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256123, "titulo": "Começa Cúpula de Líderes na COP31; Lula vai discursar", "url": "https://www.cnnbrasil.com.br/internacional/cupula-lideres-cop31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados de aproximadamente 200 países estão se reunindo na cidade turística de Antália, na Turquia, para a COP31. As emissões de gases de efeito estufa globais não mostram sinais significativos de diminuição e outras crises, como guerras e inflação, estão competindo pela atenção política.", "titulo_pt": "Começa Cúpula de Líderes na COP31; Lula vai discursar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256558, "titulo": "World leaders begin UN climate talks amid concerns action on global warming too slow", "url": "https://www.scmp.com/news/world/africa/article/3374065/world-leaders-begin-un-climate-talks-amid-concerns-action-global-warming-too-slow", "fonte_id": "scmp", "data_pub": "2026-11-11T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes mundiais começaram a chegar para iniciar discussões formais na conferência das Nações Unidas sobre mudanças climáticas em Turquia, buscando acordar ações concretas para frear o aquecimento global após um ano de desastres climáticos, como inundações e ondas de calor. No entanto, o que será alcançado na conferência de 11 dias, chamada Cop31, ainda é incerto.", "titulo_pt": "Líderes mundiais iniciam discussões climáticas das nações unidas com temores de que ação sobre o aquecimento global seja lenta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 256085, "titulo": "Clima: pancadas de chuva, temporais isolados e rajadas de vento marcam a 4ª", "url": "https://www.metropoles.com/brasil/clima-pancadas-de-chuva-temporais-isolados-e-rajadas-de-vento-marcam-a-4a", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pancadas de chuva, temporais isolados e rajadas de vento marcam a quarta-feira. A combinação de calor, umidade elevada e sistemas meteorológicos favorecem a formação de nuvens carregadas.", "titulo_pt": "Pancadas de chuva, temporais isolados e rajadas de vento marcam a 4ª", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256129, "titulo": "Brasil apresenta controles ambientais para manter exportações à Europa", "url": "https://www.cnnbrasil.com.br/agro/brasil-apresenta-controles-ambientais-para-manter-exportacoes-a-europa/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo e entidades do setor agrícola apresentaram ferramentas de rastreabilidade e dados sobre propriedades rurais aos autoridades e compradores europeus para demonstrar que a produção brasileira pode atender às novas exigências ambientais do bloco europeu.", "titulo_pt": "Brasil apresenta controles ambientais para manter exportações à Europa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 258069, "titulo": "Rescatan a un bebé en Estados Unidos tras ser enterrado vivo en una jaula para perros", "url": "https://www.lanacion.com.ar/el-mundo/rescatan-a-un-bebe-en-estados-unidos-tras-ser-enterrado-vivo-en-una-jaula-para-perros-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T21:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um bebê foi resgatado nos Estados Unidos após ter sido enterrado vivo em uma jaula para cães em Carolina do Sul. A polícia deteve o pai do bebê, considerado o principal suspeito do caso.", "titulo_pt": "Resgate de bebê enterrado vivo em jaula para cães na carolina do sul", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258021, "titulo": "Vítimas polonesas do nazismo apelam à sociedade civil alemã", "url": "https://www.dw.com/pt-br/vítimas-polonesas-do-nazismo-apelam-à-sociedade-civil-alemã/a-79919393?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atualmente, menos de 50 mil pessoas vivem na Polônia que foram perseguidas pelo nazismo. Representantes das vítimas estão pedindo doações ao público alemão, diante da recusa de Berlim em pagar reparações.", "titulo_pt": "Vítimas polonesas do nazismo pedem doações à sociedade civil alemã", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 258301, "titulo": "Trump admin loses fight to spy on random journalists’ LinkedIn DMs", "url": "https://arstechnica.com/tech-policy/2026/11/trump-admin-loses-fight-to-spy-on-random-journalists-linkedin-dms/", "fonte_id": "ars_technica", "data_pub": "2026-11-11T18:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal determinou que as fontes confidenciais são o 'órgão vital' da liberdade de imprensa no caso envolvendo o DM do LinkedIn. O governo Trump perdeu a batalha para monitorar as conversas de jornalistas não-suspeitos nessa plataforma.", "titulo_pt": "Governo trump perde batalha para espionar DMs aleatórias de jornalistas no LinkedIn", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 256898, "titulo": "Família de cacique Raoni pede suspensão de documentário na COP31", "url": "https://veja.abril.com.br/mundo/familia-de-cacique-raoni-pede-suspensao-de-documentario-na-cop31/", "fonte_id": "veja", "data_pub": "2026-11-11T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças indígenas, incluindo o cacique Raoni, pediram a suspensão do documentário na COP31, alegando falta de autorização para a estreia. Eles argumentam que não foram consultados ou informados sobre o filme.", "titulo_pt": "Família de cacique Raoni pede suspensão de documentário na COP31", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 257399, "titulo": "Trinidad and Tobago highest court overturns gay sex ban", "url": "https://www.euronews.com/2026/11/11/trinidad-and-tobago-highest-court-overturns-gay-sex-ban", "fonte_id": "euronews", "data_pub": "2026-11-11T16:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal supremo da ilha de Trinidad e Tobago anulou uma lei de 1986 que proibia relações sexuais entre adultos do mesmo sexo consentidas.", "titulo_pt": "Tribunal supremo de trinidad e Tobago anula lei que proibia relações homossexuais", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 257217, "titulo": "Killing of journalist underscores deteriorating conditions in Ecuador", "url": "https://www.theguardian.com/world/2026/nov/11/ecuador-journalist-killing", "fonte_id": "guardian_world", "data_pub": "2026-11-11T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jornalista Tomás Beltrán foi morto a tiros durante uma guerra entre gangues em Ecuador. Este conflito relacionado ao tráfico de drogas transformou o país, uma vez considerado um dos mais seguros da América Latina, em um dos mais violentos.", "titulo_pt": "Morte de jornalista ilustra a deterioração das condições em Ecuador", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 257035, "titulo": "Corte britânica descriminaliza sexo gay em Trinidad e Tobago", "url": "https://www.dw.com/pt-br/corte-britânica-descriminaliza-sexo-gay-em-trinidad-e-tobago/a-79916807?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T13:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem de 61 anos teve sucesso após uma década de luta judicial. A última instância de apelação, que decidiu descriminalizar o sexo gay em Trinidad e Tobago, está localizada em Londres, refletindo o legado colonial.", "titulo_pt": "Corte britânica descriminaliza sexo gay em Trinidad e Tobago", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257458, "titulo": "African rights body raises alarm over treatment of Niger’s Mahamid Arabs", "url": "https://www.aljazeera.com/news/2026/11/11/african-rights-body-raises-alarm-over-treatment-of-nigers-mahamid-arabs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T12:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma comissão de direitos humanos pediu ao presidente da Nigéria que interceda sobre supostas violações cometidas contra os Mahamid, um grupo árabe na Nigéria.", "titulo_pt": "Organização de direitos humanos alerta para abusos contra os Mahamid, na nigéria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 256315, "titulo": "Ed Miliband says national security of all countries at risk from climate crisis", "url": "https://www.theguardian.com/environment/2026/nov/11/ed-miliband-national-security-climate-crisis-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-11T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado britânico para Assuntos Exteriores, Ed Miliband, alertará líderes mundiais na COP31 que a crise climática representa uma ameaça à segurança nacional de todos os países, com cenários de destruição aparentemente sci-fi se tornando realidade e choques econômicos causados por combustíveis fósseis se tornando a regra.", "titulo_pt": "Ed Miliband diz que segurança nacional de todos os países está em risco devido à crise climática", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 256198, "titulo": "Refugios para la incertidumbre", "url": "https://www.lanacion.com.ar/opinion/refugios-para-la-incertidumbre-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a criação de refúgios para lidar com a incerteza. Não há detalhes específicos sobre o conteúdo do texto, apenas o tema principal.", "titulo_pt": "Refúgios para a incerteza", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 256589, "titulo": "Presidential office discusses rights protection for Korean adoptees overseas", "url": "https://en.yna.co.kr/view/AEN20261111009600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-11T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gabinete presidencial realizou uma reunião para discutir a proteção dos direitos dos adotados coreanos no exterior. O encontro ocorreu em Seul no dia 11 de novembro.", "titulo_pt": "Gabinete presidencial discute proteção dos direitos de adotados coreanos no exterior", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 256398, "titulo": "Trinidad and Tobago's highest court strikes down colonial-era ban on gay sex", "url": "https://www.lemonde.fr/en/international/article/2026/11/11/trinidad-and-tobago-s-highest-court-strikes-down-colonial-era-ban-on-gay-sex_6777456_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-11T04:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal mais alto da Trinidad e Tobago derrubou uma lei colonial que proibia relações sexuais entre pessoas do mesmo sexo, considerando que ela violava direitos fundamentais à privacidade e liberdade individual. Esta decisão representa uma vitória significativa para os direitos da comunidade LGBTQ+ na Caribe.", "titulo_pt": "Tribunal mais alto da trinidad e Tobago anula lei colo const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
