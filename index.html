, "pais": "Brasil", "classe": "B"}, {"id": 205627, "titulo": "Banco de Alimentos Buenos Aires: un puente para ayudar a quienes más lo necesitan", "url": "https://www.clarin.com/informacion-general/banco-alimentos-buenos-aires-puente-ayudar-necesitan_0_dZAleqqMC9.html", "fonte_id": "clarin", "data_pub": "2026-10-09T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "No Brasil, é mais comum jogar alimentos fora do que doá-los. Diante desse problema, o Banco de Alimentos Buenos Aires sugere uma mudança na abordagem para auxiliar as pessoas em maior necessidade.", "titulo_pt": "Banco de Alimentos Buenos Aires: uma ponte para ajudar quem mais precisa", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 205489, "titulo": "PF investiga desvios na saúde por empresa que recebeu mais de R$ 1 bi no CE", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ce/pf-investiga-desvios-na-saude-por-empresa-que-recebeu-mais-de-r-1-bi-no-ce/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga possíveis desvios de verbas públicas federais relacionadas a uma empresa que recebeu mais de R$ 1 bilhão no estado do Ceará. Foram determinados sequestros de 38 imóveis e 82 veículos, bem como o bloqueio de sigilos bancário e fiscal dos investigados.", "titulo_pt": "PF investiga desvios na saúde por empresa que recebeu mais de R$ 1 bi no CE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 205558, "titulo": "Soraya Thronicke terá que indenizar Alfredo Gaspar por acusação falsa de estupro", "url": "https://veja.abril.com.br/brasil/soraya-thronicke-tera-que-indenizar-alfredo-gaspar-por-acusacao-falsa-de-estupro/", "fonte_id": "veja", "data_pub": "2026-10-09T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Soraya Thronicke terá que pagar R$ 50 mil a Alfredo Gaspar por ter acusado o deputado de estupro de forma falsa. O caso foi julgado pelo Senado.", "titulo_pt": "Soraya Thronicke terá que indenizar Alfredo Gaspar por acusação falsa de estupro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 205560, "titulo": "Justiça se manifesta após acusação de Soraya Thronicke contra vice na chapa de Flávio", "url": "https://veja.abril.com.br/politica/justica-se-manifesta-apos-acusacao-de-soraya-thronicke-contra-vice-na-chapa-de-flavio/", "fonte_id": "veja", "data_pub": "2026-10-09T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz decidiu que a acusação de estupro feita pela senadora Soraya Thronicke contra o vice na chapa de Flávio não tinha evidências suficientes e, portanto, revogou a imunidade parlamentar dela.", "titulo_pt": "Justiça se manifesta após acusação de Soraya Thronicke contra vice na chapa de Flávio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 205826, "titulo": "The surprising post-pandemic drop in income inequality", "url": "https://www.axios.com/2026/10/09/income-biden-pandemic-inflation", "fonte_id": "axios", "data_pub": "2026-10-09T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos ajustados pela inflação dos trabalhadores médios e baixos aumentaram durante os anos de Biden, enquanto os rendimentos dos altos rendimentos diminuíram. Essa é uma descoberta inesperada baseada nos dados mais detalhados sobre finanças domésticas americanas, divulgados pela Reserva Federal.", "titulo_pt": "A surpreendente queda da desigualdade de renda pós-pandemia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 205459, "titulo": "Perda de mão, dentes quebrados e centenas de feridos: violência policial marca 3ª semana de protestos estudantis na França", "url": "https://www.brasildefato.com.br/2026/10/09/perda-de-mao-dentes-quebrados-e-centenas-de-feridos-violencia-policial-marca-3a-semana-de-protestos-estudantis-na-franca/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-09T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A terceira semana de protestos estudantis na França registrou episódios de violência policial, incluindo perda de mão e centenas de feridos. O movimento, iniciado por estudantes secundaristas contra a precarização das escolas públicas e cortes orçamentários, enfrenta forte condenação de organizações internacionais de direitos humanos.", "titulo_pt": "Perda de mão, dentes quebrados e centenas de feridos: violência policial marca 3ª semana de protestos estudantis na França", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 205898, "titulo": "Spain: Madrid protesters mourn evicted pensioner Maricarmen Abascal", "url": "https://www.euronews.com/video/2026/10/09/spain-madrid-protesters-mourn-evicted-pensioner-maricarmen-abascal", "fonte_id": "euronews", "data_pub": "2026-10-09T12:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de milhares de pessoas marcharam em Madri para homenagear a idosa Maricarmen Abascal, cuja despejo se tornou símbolo da crise habitacional e gerou novas manifestações.", "titulo_pt": "Espanha: manifestantes em madri prestam homenagem à idosa despejada Maricarmen Abascal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 206097, "titulo": "Girl filmed carrying beer bags to be placed in temporary care with siblings", "url": "https://www.scmp.com/news/hong-kong/society/article/3370381/girl-filmed-carrying-beer-bags-be-placed-temporary-care-siblings?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T11:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma menina de 10 anos de Hong Kong, filmada carregando sacos pesados de cerveja, será colocada sob cuidados temporários com seus dois irmãos após avaliação social que determinou que não seria adequado para eles retornarem para casa após a prisão de seus pais por suspeita de maus-tratos a uma criança. Os três irmãos ainda estão em hospital para exames de saúde e devem ser liberados naquele mesmo dia ou no sábado.", "titulo_pt": "Menina de 10 anos, filmada carregando sacos de cerveja, será colocada em cuidados temporários com irmãos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 205874, "titulo": "French high school protests: What we know about the teenager whose hand was torn off by a grenade", "url": "https://www.lemonde.fr/en/videos/video/2026/10/09/french-high-school-protests-what-we-know-about-the-teenager-whose-hand-was-torn-off-by-a-grenade_6758418_108.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T11:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vídeos mostram uma adolescente de 15 anos tendo a mão cortada por uma granada durante protestos em uma escola de ensino médio no norte da França. Um testemunha do local conversou com o Le Monde.", "titulo_pt": "Protestos em escola da França: o que sabemos sobre a adolescente cuja mão foi cortada por uma granada", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 206101, "titulo": "Can the Philippines lead Southeast Asia’s fight against child labour?", "url": "https://www.scmp.com/week-asia/people/article/3370369/can-philippines-lead-southeast-asias-fight-against-child-labour?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T10:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Filipinas está desenvolvendo um plano nacional para combater o trabalho infantil como parte de uma iniciativa mais ampla na região do Sudeste Asiático, onde a pobreza e a instabilidade econômica continuam a levar crianças ao trabalho, apesar dos esforços governamentais para combater a prática. No entanto, analistas alertam que compromissos políticos sozinhos não serão suficientes sem um apoio mais forte às famílias vulneráveis, melhor acesso à educação e uma fiscalização mais eficaz das leis de proteção infantil.", "titulo_pt": "Pode as filipinas liderar a luta contra o trabalho infantil na ásia do sudeste?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 206206, "titulo": "Nepal: A long road to recovery", "url": "https://www.unicef.org/press-releases/nepal-long-road-recovery", "fonte_id": "unicef", "data_pub": "2026-10-09T10:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "UNICEF realizou uma coletiva de imprensa em Genebra, na sede das Nações Unidas, onde o porta-voz James Elder discursou sobre a recuperação no Nepal. O discurso abordou os esforços de recuperação no país após desastres naturais.", "titulo_pt": "Nepal: uma longa estrada para a recuperação", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 205162, "titulo": "A New Mexico Community Was a Place to Build a Life. Then a Hypersonic Missile Factory Showed Up", "url": "https://www.wired.com/story/a-new-mexico-community-was-a-place-to-build-a-life-then-a-hypersonic-missile-factory-showed-up/", "fonte_id": "wired", "data_pub": "2026-10-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Castelion, uma empresa de tecnologia de defesa avançada, está construindo uma instalação em Rio Rancho Estates que documentos mostram poder representar um grave perigo de incêndio e exposição a químicos para as comunidades vizinhas.", "titulo_pt": "Um novo México era um lugar para construir uma vida. Então uma fábrica de mísseis hipersônicos chegou", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 205106, "titulo": "Polish police arrest teens over ‘Bloody Friday’ school attack threats", "url": "https://www.scmp.com/news/world/europe/article/3370335/polish-police-arrest-teens-over-bloody-friday-school-attack-threats?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polonês: policiais prendem jovens por ameaças relacionadas a ataques escolares. Autoridades buscam acalmar temores causados por rumores online de uma suposta 'Bloody Friday', após dois episódios de facada em dias consecutivos. As investigações policiais não encontraram evidências de um suposto desafio online.", "titulo_pt": "Polícia polonesa prende jovens por ameaças de ataques escolares", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 206064, "titulo": "Environmental research academy honored by ARTDO", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865726", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acadêmica de pesquisa ambiental foi honrada pelo ARTDO.", "titulo_pt": "Academia de pesquisa ambiental homenageada pelo ARTDO", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 205499, "titulo": "Furacão Isaías avança e traz mais pressões nos preços dos combustíveis dos EUA", "url": "https://www.infomoney.com.br/economia/furacao-isaias-avanca-e-traz-mais-pressoes-nos-precos-dos-combustiveis-dos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-09T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaías está se movendo em direção à produção e ao refino de petróleo dos Estados Unidos, o que pode aumentar as pressões sobre os preços dos combustíveis no país.", "titulo_pt": "Furacão Isaías avança e aumenta pressões sobre preços dos combustíveis nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 205483, "titulo": "Estudo da Fiocruz detecta cocaína em cinco rios do Rio de Janeiro", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/estudo-da-fiocruz-detecta-cocaina-em-cinco-rios-do-rio-de-janeiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Fiocruz detectou cocaína em cinco rios do Rio de Janeiro, com contaminação que supera níveis encontrados em outros cinco países. Os ensaios indicaram que a substância causou mortes, deformações, alterações cardiovasculares e neurológicas em organismos aquáticos.", "titulo_pt": "Estudo da Fiocruz detecta cocaína em cinco rios do Rio de Janeiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206169, "titulo": "African antelopes spreading in New Mexico: How far could they go under climate change?", "url": "https://phys.org/news/2026-10-african-antelopes-mexico-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gemsbok, antílopes africanos introduzidos no Novo México nos anos 1960 e 1970, se estendem mais de 100 quilômetros desde o ponto de introdução. Pesquisadores da Universidade de Illinois Urbana-Champaign atribuem isso às adaptações excepcionais desses animais para condições áridas, que eles prevêem se expandir significativamente devido ao aquecimento global.", "titulo_pt": "Gemsbok africanos se espalhando no novo México: como o aquecimento global poderia afetar sua expansão?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205322, "titulo": "Menos de 5% das empresas cumprem lei de reciclagem de eletrônicos no Brasil, diz associação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/menos-de-5-das-empresas-cumprem-lei-de-reciclagem-de-eletronicos-no-brasil-diz-associacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei que obriga as empresas a fazer a logística reversa de eletrônicos no Brasil é cumprida por apenas 4,8% das empresas envolvidas. Segundo a Abree, apenas 192 das aproximadamente 4.000 empresas que vendem ou importam produtos eletrônicos atendem à exigência.", "titulo_pt": "Menos de 5% das empresas cumprem lei de reciclagem de eletrônicos no Brasil, diz associação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205895, "titulo": "Tornadoes sweep across Sicily, leaving flipped cars and damaged buildings", "url": "https://www.euronews.com/2026/10/09/tornadoes-sweep-across-sicily-leaving-flipped-cars-and-damaged-buildings", "fonte_id": "euronews", "data_pub": "2026-10-09T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tornados raramente observados formaram-se perto da costa de Marsala, na Sicília ocidental, em 9 de outubro, causando danos significativos quando se movimentaram para o interior.", "titulo_pt": "Tornados atingem sicília, causando danos significativos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205896, "titulo": "Indonesia: Baby orangutan saved from Borneo wildfires as habitat destruction escalates", "url": "https://www.euronews.com/video/2026/10/09/indonesia-baby-orangutan-saved-from-borneo-wildfires-as-habitat-destruction-escalates", "fonte_id": "euronews", "data_pub": "2026-10-09T13:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma jovem orangotango, de três a quatro anos, foi resgatada de incêndios florestais na Borneu. A fêmea, chamada Novita, estava presa em um árvore em Kalimantan Central, com queimaduras nas mãos e pés após ter passado por fogo.", "titulo_pt": "Indonésia: jovem orangotango resgatada de incêndios florestais na borneu enquanto destruição do habitat aumenta", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205578, "titulo": "Pré-COP termina com cobrança para destravar US$ 5 bi de financiamento climático para o Pacífico", "url": "https://exame.com/esg/pre-cop-termina-com-cobranca-para-destravar-us-5-bi-de-financiamento-climatico-para-o-pacifico/", "fonte_id": "exame", "data_pub": "2026-10-09T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encontro em Fiji e Tuvalu focou a situação crítica dos estados insulares do Pacífico em relação ao financiamento climático, exigindo US$ 5 bilhões para enfrentar os efeitos da crise climática. Os participantes criticaram os gastos bilionários dos países ricos com defesa em detrimento do financiamento para regiões mais vulneráveis.", "titulo_pt": "Pré-cop termina com exigência de US$ 5 bi em financiamento climático para o Pacífico", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 205897, "titulo": "Seals and sea lions undergo hearing tests in Australian research", "url": "https://www.euronews.com/video/2026/10/09/seals-and-sea-lions-undergo-hearing-tests-in-australian-research", "fonte_id": "euronews", "data_pub": "2026-10-09T12:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas australianos treinaram focas e lobos-marinhos para realizarem testes auditivos no Zoológico Taronga de Sydney, com o objetivo de melhor entender como o ruído humano afeta os mamíferos marinhos.", "titulo_pt": "Foca e lobos-marinhos passam por testes auditivos em pesquisa na austrália", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205784, "titulo": "Antarctica’s penguins are sending us a distress signal", "url": "https://www.vox.com/climate/505726/chinstrap-penguins-zavodovski-colony-collapse-ocean-warming", "fonte_id": "vox", "data_pub": "2026-10-09T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo revelou que a maior colônia de pinguins do mundo diminuiu em dois terços desde 2011, provavelmente devido à crise climática. Os cientistas atribuíram o rápido declínio das pinguins-cadeirinhas na ilha Zavodovski, a noroeste da Antártica, a este fator.", "titulo_pt": "Pinguins da antártica estão enviando um sinal de alerta", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 204606, "titulo": "Clima: calor predomina no Sudeste e Sul tem risco de temporais nesta 6ª", "url": "https://www.metropoles.com/brasil/clima-calor-predomina-no-sudeste-e-sul-tem-risco-de-temporais-nesta-6a", "fonte_id": "metropoles", "data_pub": "2026-10-09T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A previsão indica temperaturas elevadas em grande parte do Brasil, com risco de chuva forte, rajadas de vento e possibilidade de granizo no Sul.", "titulo_pt": "Clima: calor predomina no Sudeste e risco de temporais no Sul nesta sexta-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 205063, "titulo": "Walking through flames: Orangutan rescued in Indonesia fires", "url": "https://www.japantimes.co.jp/environment/2026/10/09/wildlife/indonesia-fire-orangutan-rescue/", "fonte_id": "japan_times", "data_pub": "2026-10-09T07:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Múltiplas orangotangos foram resgatados de incêndios florestais que estão queimando áreas de Sumatra e Borneo nos últimos meses.", "titulo_pt": "Perfurando o fogo: orangotangos resgatados nas chamas da indonésia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 204980, "titulo": "Chile: Santiago flooding turns streets to rivers as Kast declares state of catastrophe", "url": "https://www.euronews.com/video/2026/10/09/chile-santiago-flooding-turns-streets-to-rivers-as-kast-declares-state-of-catastrophe", "fonte_id": "euronews", "data_pub": "2026-10-09T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças de chuva torrencial causaram alagamentos severos em Santiago, Chile, deixando casas, clínicas e prédios da universidade submersos.", "titulo_pt": "Chile: santiago em alagamentos extensos após Kast decretar estado de catástrofe", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205238, "titulo": "Factcheck: UK Conservatives double the ‘cost of net-zero’ after spreadsheet blunder", "url": "https://www.carbonbrief.org/factcheck-uk-conservatives-double-the-cost-of-net-zero-after-spreadsheet-blunder", "fonte_id": "carbon_brief", "data_pub": "2026-10-09T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um panfleto publicado pelo partido de oposição Conservador do Reino Unido inclui um 'custo do neto-zero' que parece ter sido duplicado devido a um erro de planilha.", "titulo_pt": "Verificação de fatos: conservadores do reino unido dobram o 'custo do neto-zero' após erro de planilha", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 205087, "titulo": "Stench from Bosnia’s Ramici Landfill Indicates Mounting Waste Challenges", "url": "https://balkaninsight.com/2026/10/09/stench-from-bosnias-ramici-landfill-indicates-mounting-waste-challenges/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-09T05:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aterro sanitário de Ramici, próximo à cidade norte-bósnica de Banja Luka, está cheio e cheiroso, representando um perigo iminente, segundo relatos locais.", "titulo_pt": "Cheiro do aterro de Ramici na bósnia indica desafios ambientais acumulados", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 204987, "titulo": "Six injured as heavy rains batter Chile's capital, sweeping away cars and flooding homes", "url": "https://www.euronews.com/2026/10/09/six-injured-as-heavy-rains-batter-chiles-capital-sweeping-away-cars-and-flooding-homes", "fonte_id": "euronews", "data_pub": "2026-10-09T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis pessoas ficaram feridas devido a fortes chuvas na capital do Chile, que também causaram alagamentos e levaram carros embora. Autoridades colocaram outras 10 regiões chilenas em alerta elevado devido a riscos de deslizamentos de terra e emergências relacionadas com as chuvas.", "titulo_pt": "Seis feridos em fortes chuvas na capital do Chile, com riscos de deslizamentos de terra", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 205971, "titulo": "'Satanic:' Hegseth's move to live-stream execution shocks even pro-death penalty advocates", "url": "https://www.middleeasteye.net/news/satanic-hegseths-move-livestream-execution-shocks-even-pro-death-penalty-advocates", "fonte_id": "middle_east_eye", "data_pub": "2026-10-09T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pete Hegseth, Secretário de Guerra dos EUA, anunciou que o Pentágono vai transmitir ao vivo a execução por tiros de execução de Major Nidal Malik Hasan, condenado pelos assassinatos no Fort Hood. Esta decisão gerou surpresa, mesmo entre apoiadores da pena de morte.", "titulo_pt": "Diabólico: anúncio de hegseth sobre transmissão ao vivo da execução surpreende até apoiadores da pena de morte", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 205946, "titulo": "Palestinians seek protection from violent settlers during olive harvest", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/palestinians-seek-protection-from-violent-settlers-during-olive-harvest?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pecuaristas palestinos na Cisjordânia Ocidental estão pedindo a ativistas internacionais para protegê-los durante a colheita de oliveiras. Eles buscam apoio para se defenderem de violência cometida por colonos israelenses.", "titulo_pt": "Palestinos buscam proteção de ativistas durante colheita de oliveiras", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205464, "titulo": "Nobel da Paz vai para Navi Pillay, jurista que denunciou genocídio de Israel em Gaza", "url": "https://www.brasildefato.com.br/2026/10/09/nobel-da-paz-vai-para-navi-pillay-jurista-que-denunciou-genocidio-de-israel-em-gaza/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-09T14:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A jurista sul-africana Navi Pillay, de 85 anos, foi escolhida para receber o Prêmio Nobel da Paz de 2026. Sua atuação na defesa do direito internacional e na responsabilização por crimes contra a humanidade foi destacada.", "titulo_pt": "Nobel da Paz vai para Navi Pillay, jurista que denunciou genocídio de Israel em Gaza", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 205776, "titulo": "New spate of stabbings, overdoses and fires at Australian immigration detention centres run by ICE-linked US prison firm", "url": "https://www.theguardian.com/australia-news/2026/oct/09/australia-immigration-detention-centres-overdoses-fires-prison-ice-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-09T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos internos revelam que novos casos de agressões, overdose e incêndios ocorreram nos centros de detenção imigratória australianos gerenciados pela empresa de prisões com ligações americanas ICE. Isso levanta questionamentos sobre a segurança e o cumprimento das leis que protegem os funcionários e os detidos pelo governo australiano.", "titulo_pt": "Nova onda de agressões, overdose e incêndios em centros de detenção imigratória australianos gerenciados por empresa com ligações americanas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205966, "titulo": "Child flees as Israeli settlers hijack car during pogrom", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/child-flees-as-israeli-settlers-hijack-car-during-pogrom?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T13:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um garoto palestiniano foi visto fugindo após judeus settleres atacarem seu pai e roubarem seu carro em Ramallah.", "titulo_pt": "Menino palestiniano foge após judeus settleres atacarem seu pai e roubarem o carro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205900, "titulo": "‘I still want to verify this’: Nobel Peace Prize winner Navi Pillay’s first reaction", "url": "https://www.euronews.com/2026/10/09/i-still-want-to-verify-this-nobel-peace-prize-winner-navi-pillays-first-reaction", "fonte_id": "euronews", "data_pub": "2026-10-09T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, de 85 anos, disse que inicialmente achou a notícia de que havia ganhado o Prêmio Nobel da Paz de 2026 uma piada. Ela afirmou que queria verificar a notificação antes de acreditar nela.", "titulo_pt": "‘Ainda quero verificar isto’: primeira reação da vencedora do prêmio nobel da paz Navi Pillay", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205037, "titulo": "Nobel Peace Prize awarded to human rights ‘pioneer’ Navi Pillay", "url": "https://www.ft.com/content/3ae8dc9c-ee3a-4fe5-9749-b88390b5930b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-09T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, uma advogada dos direitos humanos sul-africana, recebeu o Prêmio Nobel da Paz por seus esforços para promover a paz e o direito internacional.", "titulo_pt": "Prêmio nobel da paz concedido à 'pioneira' Navi Pillay", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 204714, "titulo": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "url": "https://exame.com/mundo/quem-sao-as-21-mulheres-que-ja-ganharam-o-premio-nobel-da-paz/", "fonte_id": "exame", "data_pub": "2026-10-09T06:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay se tornou a 21ª mulher a ganhar o Prêmio Nobel da Paz. A lista de mulheres vencedoras começa em 1905, com a austríaca Bertha von Suttner.", "titulo_pt": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204839, "titulo": "Egyptian journalists plan weekend protest over detention of six colleagues", "url": "https://www.theguardian.com/global-development/2026/oct/09/egypt-six-journalists-matsadaash-protest-over-detentions", "fonte_id": "guardian_world", "data_pub": "2026-10-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jornalistas do Egito planejam uma nova protesto no fim de semana em Cairo após seis de seus colegas serem acusados de terrorismo e terem sido presos por supostamente trabalhar para o Irmão Muçulmano. Os funcionários do Matsadaash afirmam ter sofrido tortura e confissões forçadas durante a detenção.", "titulo_pt": "Jornalistas egípcios planejam protesto no fim de semana por detenção de seis colegas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205029, "titulo": "Christa Pike case underscores prevalence of botched executions in US", "url": "https://www.aljazeera.com/news/2026/10/9/christa-pike-case-underscores-prevalence-of-botched-executions-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que métodos como a injeção letal prometem uma forma mais humana de execução, mas são frequentemente comprometidos por erros. O caso de Christa Pike ilustra a prevalência de execuções mal-sucedidas nos Estados Unidos.", "titulo_pt": "Caso christa Pike evidencia a prevalência de execuções mal-sucedidas nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205184, "titulo": "Indian man alleges abuse by Korean immigration officers during deportation", "url": "https://www.koreaherald.com/article/10897732", "fonte_id": "korea_herald", "data_pub": "2026-10-09T02:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cidadão indiano acusa agentes de imigração de terem cometido abuso físico nele durante sua deportação, incluindo o uso de fita adesiva para cobrir a boca e sufocá-lo, conforme revelado por um parlamentar. O caso foi apresentado à Comissão Nacional de Direitos Humanos da Coreia.", "titulo_pt": "Indianos acusam agentes de imigração de abuso durante deportação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 203589, "titulo": "Laws inadequate to fight transnational repression: MAC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/09/2003865663", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comando de Operações de Inteligência (MAC) afirmou que as leis atuais são insuficientes para combater a repressão transnacional. A instituição destacou a necessidade de reformas legais mais robustas.", "titulo_pt": "Leis insuficientes para combater repressão transnacional, afirma MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "direitos_humanos__eventos": [{"titulo": "Gaza, Ruanda, Darfur e Myanmar: a luta contra os genocídios de Navi Pillay, a Nobel de Paz 2026", "sumario": "Navi Pillay, jurista sul-africana e ex-comissária das Nações Unidas para os Direitos Humanos, foi declarada vencedora do Prêmio Nobel de Paz de 2026 por seus esforços em promover a paz e o direito internacional. Navi Pillay, jurista sul-africana, recebeu um prêmio por sua atuação em defesa do direito internacional e na responsabilização por crimes de guerra e genocídio. Navi Pillay, sul-africana, ganhou o Nobel da Paz de 2026.", "artigos": [{"id": 205695, "titulo": "Gaza, Ruanda, Darfur y Myanmar: La lucha contra los genocidios de Navi Pillay, la Nobel de la Paz 2026", "url": "https://www.latercera.com/mundo/noticia/gaza-ruanda-darfur-y-myanmar-la-lucha-contra-los-genocidios-de-navi-pillay-la-nobel-de-la-paz-2026/", "fonte_id": "la_tercera", "data_pub": "2026-10-09T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, jurista sul-africana e ex-comissária das Nações Unidas para os Direitos Humanos, foi declarada vencedora do Prêmio Nobel de Paz de 2026 por seus esforços em promover a paz e o direito internacional. Ela dedica o prêmio aos sobreviventes de crimes internacionais.", function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
