<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "12/10/2026 19:15", "stats": {"noticias_novas": 492, "resumos_gerados": 230}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Luiz Inácio Lula da Silva, candidato do PT, tem ganhado apoio em atos de grande escala, como o realizado na praia de Copacabana, na Zona Sul do Rio de Janeiro, onde milhares de pessoas se reuniram para apoiar sua reeleição. O governador Tarcísio de Freitas criticou o vandalismo nas estações de metrô da Avenida Paulista. Na política, a pesquisa Quaest mostra que Celina Rocha está à frente no segundo turno no Distrito Federal, com 53% das intenções de voto, contra 33% de Lúcio Flávio Grass. A campanha de Lula destaca a manutenção das garantias de proteção para crianças e adolescentes, segundo especialistas, mas falta detalhes sobre a alocação orçamentária. O governo planeja 9,2 GW de armazenamento de energia, com 7,2 GW provenientes de sistemas de baterias e 2 GW de usinas hidrelétricas reversíveis, em meio à curtailment.", "mundo": "Os Estados Unidos e a OTAN prometeram impedir Moscou e alertaram Kiev sobre ataques a refinarias, em meio a tensões no mercado energético, conforme informou o Washington Post. Várias pessoas morreram em ataques aéreos perto da fronteira entre Sudão e Egito, em uma mina de ouro, distante das linhas de frente da guerra civil sudanesa, relatou o New York Times. O ex-presidente do Congo, Joseph Kabila, anunciou uma nova aliança política-militar com os rebeldes M23, apoiados pela Rússia, em desacordo com uma sentença de morte em sua ausência, informou o El País. O presidente dos Estados Unidos, Donald Trump, indicou que pode se encontrar com o líder norte-coreano, Kim Jong-un, durante sua próxima viagem à Ásia, em 12 de outubro, conforme declarou em Washington, segundo o New York Times. Além disso, a Coreia do Norte realizou um teste de lançamento de um míssil balístico tático, segundo a Yonhap News.\n\nA Arábia Saudita enfrenta uma escalada de ataques houthis, com o país interceptando um míssil em Riad e fechando o aeroporto após novos ataques. Como resultado, o preço do petróleo subiu para US$ 105 e voos na capital saudita foram paralisados. A Arábia Saudita rejeitou uma oferta israelense para participar das forças sauditas em Yemen, mantendo-se indiferente à mediação dos Estados Unidos. Além disso, Israel realizou uma operação em Qalqilyah, na Cisjordânia ocupada, e o Reino Unido acusou o Irã de planejar um ataque a uma base aérea, impondo sanções a dois cidadãos iranianos. Em outro front geopolítico, a Coreia do Norte disparou dois mísseis balísticos, reafirmando seu compromisso de defesa. Na região do Oriente Médio, o conflito entre Israel e os hutis continua, com ataques aéreos sauditas em Yemen que causaram mortes e ferimentos, incluindo mulheres e crianças. O Comandante Supremo Aliado da Otan alertou que um eventual ataque da Rússia seria 'totalmente fútil', em meio a crescente tensão entre as nações europeias e a Rússia.", "economia": "O dólar manteve sua cotação em seu nível mais alto em 18 meses, subindo 0,37% para 102,58, devido às tensões no Golfo Pérsico e à inflação nos Estados Unidos. Este cenário reflete a volatilidade do mercado financeiro diante de incertezas geopolíticas e econômicas. As exportações de maquinário estão aumentando, conforme informou um grupo da indústria. Além disso, o petróleo superou os US$106 por barril após ataques ao aeroporto de Riad no fim de semana e tensões entre Ucrânia e Rússia, refletindo a redução nos estoques de petróleo. O Ministério de Minas e Energia projeta que a dependência de diesel importado manter-se-á em 25% até 2036, conforme consta na proposta do Plano Decenal de Expansão de Energia de 2026. Essas notícias destacam a importância do planejamento de aposentadoria, que é mais crucial hoje do que há 40 anos, devido a mudanças na expectativa de vida, tamanho das famílias e planos de aposentadoria garantidos.", "tecnologia": "A tecnologia está em destaque com notícias que abrangem desde a inteligência artificial até a segurança cibernética. O relatório da OMS sobre a morte de um trabalhador em um laboratório russo destaca incertezas importantes. Paralelamente, o relatório apresentado na Cúpula Mundial da Saúde em Berlim, que lista ameaças à saúde e sobrevivência humana para os próximos 75 anos, inclui a inteligência artificial e a guerra nuclear como as maiores ameaças. A Meta, proprietária do Facebook, lançou a nova geração de agentes de inteligência artificial, chamada Muse Wonder, concorrendo com a OpenAI. A empresa também afirmou ter atingido a 'fronteira' da inteligência artificial, rejeitando pedidos para frear o desenvolvimento da tecnologia. Outros eventos importantes incluem o lançamento do No Man's Sky para iPhone e iPad, o gerador de conteúdo erótico pelo agente AI do Muse, o portátil do jogo de horror 'P.T.', e a expansão de chips de inteligência artificial internamente desenvolvidos pela Microsoft, reduzindo sua dependência da Nvidia. Além disso, a startup Blueprints AI desenvolveu um software que gera blueprints permit-ready em minutos, e a Ultrahuman e Abu Dhabi trabalham no desenvolvimento e validação clínica do modelo de avaliação da idade biológica.", "ciencia": "O telescópio Fast da China identificou um pulsar em um sistema estelar triplo em evolução, orbitado por uma anã branca. Este achado inédito pode desafiar modelos atuais de sistemas estelares. Em outro desenvolvimento, pesquisadores da National University of Singapore demonstraram como introduzir magnetismo em um semicondutor bidimensional não magnético e controlar suas propriedades magnéticas usando uma tensão elétrica, estabelecendo uma nova plataforma para investigar magnetismo controlável elétricamente em materiais ultrafinos. A revolução silenciosa no tratamento do diabetes é destacada, com o primeiro medicamento para diabetes que também protege os rins e o coração, impactando significativamente a saúde dos pacientes. Além disso, a missão SpaceX CRS-35 da NASA levantará experimentos relacionados à saúde humana, plantas e organismos resistentes a antibióticos para a Estação Espacial Internacional, aprimorando estudos que beneficiam a vida na Terra e a exploração espacial. Finalmente, a descoberta de uma nova espécie de crocodilo do Jurássico, com dentes incomumente finos, sugere que se alimentava de camarões e pequenos peixes, revelando novos aspectos sobre a vida marinha na era jurássica.", "cultura": "No encerramento de sua 28ª edição, o Festival do Rio se destacou com a vitória do filme 'A Margem do Rio' na categoria de melhor longa-metragem de ficção e 'Elza' como melhor longa-metragem documentário, atraindo mais de 150 mil pessoas. Em Nova York, a artista plástica Rosana Paulino recebeu uma homenagem e uma exposição por seu livro-manifesto 'História Natural', que completa dez anos. A Record adquiriu os direitos da novela turca 'Doutor Milagre', baseada na série 'The Good Doctor', para exibição em 2027. RJ Mitte, ator norte-americano conhecido por seu papel em 'Breaking Bad', faleceu aos 34 anos, deixando um legado significativo na representatividade de pessoas com deficiência. Além disso, a cidade de Nova York está oferecendo gratuitamente suprimentos de arte aos vencedores do prêmio para artistas, dobrando o valor do prêmio e fornecendo acesso ilimitado a materiais de arte através do Materials for the Arts.", "sociedade": "Um adolescente de 14 anos foi detido na França após abrir fogo contra professores em uma escola, usando uma espingarda de caça escondida em uma caixa de guitarra, em Aubagne, próximo a Marselha. O governo francês ativou um comitê de gestão de crise. No Brasil, o governador Tarcísio de Freitas anunciou a criação de uma via exclusiva para peregrinos na Rodovia Dutra, entre Arujá e Aparecida, reforçando a segurança dos devotos. Em Aparecida, Alckmin defendeu a liberdade religiosa e o respeito às crenças durante uma visita. No Chile, a morte de dois contratistas em El Teniente levou parlamentares a pedirem explicações à Codelco e a solicitar informações sobre os protocolos de segurança aplicados. Além disso, os delitos envolvendo menores aumentaram 23% nos primeiros seis meses do ano, com destaque para o aumento de 10% em encerrões e roubos, e as ameaças no contexto escolar se duplicaram em comparação com 2025, atingindo um pico em abril, um mês após o caso de Hernán Meneses.", "meio_ambiente": "O furacão Simon atingiu fortemente a costa do Pacífico do México, causando inundações e ameaçando fazer terra firme na região. No Brasil, intensas chuvas e granizo provocaram inundações em Curacautín, com pelo menos 20 residências afetadas. No Nepal, inundações repentinas levaram a deslizamentos de terra, com mais de 100 estrangeiros ilhados. No Amazonas, o número de focos de incêndio aumentou 271% nos dez primeiros dias de outubro de 2025, totalizando 1.380 ocorrências. O ministro João Paulo Capobianco indicou indícios de ação criminosa no incêndio na Amazônia, com a Força Aérea reforçando as operações de combate às chamas.", "direitos_humanos": "O Conselho Nacional de Direitos Humanos da Coreia decidiu revogar sua recomendação anterior sobre a garantia do direito de defesa do ex-presidente Yoon Suk Yeol durante seu julgamento de impeachment no Tribunal Constitucional. Como resultado, o conselho planeja publicar uma compensação por ter emitido a recomendação. A diretora regional da UNICEF para a África Oriental e do Sul do África, Etleva Kadilli, emitiu uma declaração sobre a tragédia da capotagem de uma embarcação de migrantes perto da costa do Djibouti, que resultou em pelo menos 15 mortes, incluindo crianças, destacando a situação dramática. Além disso, o UNRWA alertou que Gaza enfrenta persistentes escassezes de suprimentos médicos devido a restrições nas entregas, mantendo as condições de higiene ruins. Em outros eventos, a deputada democrata Ilhan Omar, alvo de buscas do ICE, declarou que não será silenciada após a operação de busca na sua residência. A situação dos direitos humanos em países com sistemas judiciais fracos, como a Coreia, continua preocupante. No caso dos Estados Unidos, a persistência da pena de morte, como nos casos de Christa Pike e Nidal Hasan, continua um tema de debate e protesto internacional."}, "resumo_do_dia": {"politica_nacional": [{"id": 211814, "titulo": "Haddad avalia que campanha de Lula deve dialogar com futuro na reta final", "url": "https://www.infomoney.com.br/politica/haddad-avalia-que-campanha-de-lula-deve-dialogar-com-futuro-na-reta-final/", "fonte_id": "infomoney", "data_pub": "2026-10-12T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro da Fazenda, Haddad, comentou sobre a campanha do candidato Lula durante uma entrevista à GloboNews. Ele avaliou que a campanha deve focar no futuro nas últimas etapas da campanha.", "titulo_pt": "Haddad acredita que campanha de Lula deve se concentrar no futuro na reta final", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 211759, "titulo": "Campanha de Lula ‘tem tônica de manutenção das garantias de proteção a crianças e adolescentes’, afirma especialista", "url": "https://www.brasildefato.com.br/2026/10/12/campanha-de-lula-tem-tonica-de-manutencao-das-garantias-de-protecao-a-criancas-e-adolescentes-afirma-especialista/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-12T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista afirma que a campanha de Lula enfatiza a manutenção das garantias de proteção a crianças e adolescentes. No entanto, falta detalhamento de destinação orçamentária nas duas campanhas.", "titulo_pt": "Campanha de Lula prioriza proteção a crianças e adolescentes, mas carece de detalhamento orçamentário", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 211710, "titulo": "Celina tem 53% contra 33% de Grass no DF, diz Quaest", "url": "https://www.poder360.com.br/poder-eleicoes-2026/celina-tem-53-contra-33-de-grass-no-df-diz-quaest/", "fonte_id": "poder360", "data_pub": "2026-10-12T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest mostrou que Celina Rocha tem 53% das intenções de voto contra 33% de Lúcio Flávio Grass para as eleições no Distrito Federal, com base em uma amostra de 1.104 eleitores entre 8 e 11 de outubro. A margem de erro é de 3 pontos percentuais.", "titulo_pt": "Celina lidera com 53% contra 33% de Grass no DF, aponta pesquisa Quaest", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 211742, "titulo": "Tarcísio critica ato do PT na Paulista: \"Vandalismo nunca é ferramenta\"", "url": "https://www.metropoles.com/sao-paulo/tarcisio-critica-ato-do-pt-na-paulista-vandalismo-nunca-e-ferramenta", "fonte_id": "metropoles", "data_pub": "2026-10-12T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas criticou o vandalismo nas estações de metrô da Avenida Paulista em um vídeo. O político afirma que o vandalismo nunca é uma ferramenta válida.", "titulo_pt": "Tarcísio critica vandalismo no metrô da av. Paulista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 211744, "titulo": "Entorno de Lula vê “manobras regimentais” de Kassio Nunes Marques no TSE", "url": "https://www.metropoles.com/colunas/ramiro-brites/lula-manobras-kassio", "fonte_id": "metropoles", "data_pub": "2026-10-12T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Decisões monocráticas do ministro André Mendonça no TSE seriam revertidas em plenário virtual, mas Kassio Nunes Marques optou por julgar presencialmente.", "titulo_pt": "Ambiente de Lula vê ‘manobras regimentais’ de Kassio Nunes Marques no TSE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 211711, "titulo": "EBC nega responsabilidade por falha de áudio em propaganda de Flávio", "url": "https://www.poder360.com.br/poder-midia/ebc-nega-responsabilidade-por-falha-de-audio-em-propaganda-de-flavio/", "fonte_id": "poder360", "data_pub": "2026-10-12T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A EBC negou a responsabilidade por uma falha de áudio em uma propaganda de Flávio. De acordo com a estatal, outra empresa do pool era responsável pelo sinal afetado, que atingiu todas as emissoras às 13h desta segunda-feira (12.out).", "titulo_pt": "EBC nega responsabilidade por falha de áudio em propaganda de Flávio", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 211816, "titulo": "Situação climática no Amazonas é “mais grave do que o imaginado”, diz ministro", "url": "https://www.infomoney.com.br/brasil/situacao-climatica-no-amazonas-e-mais-grave-do-que-o-imaginado-diz-ministro/", "fonte_id": "infomoney", "data_pub": "2026-10-12T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro João Paulo Capobianco alertou que a situação climática no Amazonas é mais grave do que se imaginava, com pontos de fogo em áreas preservadas e de difícil acesso.", "titulo_pt": "Situação climática no Amazonas é ‘mais grave do que o imaginado’, diz ministro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 211760, "titulo": "Milhares de apoiadores de Lula lotam Copacabana, na Zona Sul do Rio, nesta terça (12)", "url": "https://www.brasildefato.com.br/2026/10/12/milhares-de-apoiadores-de-lula-lotam-copacabana-na-zona-sul-do-rio-nesta-terca-12/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-12T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de apoiadores de Lula lotaram a Avenida Atlântica e a praia de Copacabana, na Zona Sul do Rio de Janeiro, no início da tarde desta segunda-feira. O ato faz parte de várias mobilizações pelo país em apoio à candidatura de Luiz Inácio Lula da Silva à reeleição.", "titulo_pt": "Milhares de apoiadores de Lula lotam Copacabana, na Zona Sul do Rio, nesta segunda (12)", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 211794, "titulo": "Análise: Pablo Marçal ganha força no ecossistema bolsonarista", "url": "https://www.cnnbrasil.com.br/politica/analise-pablo-marcal-ganha-forca-no-ecossistema-bolsonarista/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pedro Venceslau, em entrevista ao CNN 360º, destaca a atuação de Pablo Marçal como consultor informal de Flávio Bolsonaro e na formação do 'Ministério da Prosperidade'.", "titulo_pt": "Análise: pablo Marçal ganha destaque no ecossistema bolsonarista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 211712, "titulo": "Gusttavo Lima diz que deixou VaideBet para negociar com Vorcaro", "url": "https://www.poder360.com.br/poder-justica/gusttavo-lima-diz-que-deixou-vaidebet-para-negociar-com-vorcaro/", "fonte_id": "poder360", "data_pub": "2026-10-12T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gusttavo Lima afirmou que abandonou o projeto VaideBet para buscar oportunidades com a Vorcaro. O cantor também mencionou problemas com o Will Bank, alterações em sua agenda de shows e a criação de uma instituição financeira própria.", "titulo_pt": "Gusttavo Lima diz ter deixado VaideBet para negociar com Vorcaro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 211747, "titulo": "Quaest: No DF, Flávio tem 50% das intenções de voto, e Lula, 40%", "url": "https://www.metropoles.com/colunas/grande-angular/quaest-no-df-flavio-tem-50-das-intencoes-de-voto-e-lula-40", "fonte_id": "metropoles", "data_pub": "2026-10-12T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest, divulgada em 12 de outubro, indica que Flávio tem 50% das intenções de voto no Distrito Federal, enquanto Lula tem 40%. Para 94% dos entrevistados, não há possibilidade de mudar o voto.", "titulo_pt": "No DF, Flávio tem 50% das intenções de voto, e Lula, 40%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 211690, "titulo": "Flávio Bolsonaro participa de missa na Catedral de Brasília", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/flavio-bolsonaro-participa-de-missa-na-catedral-de-brasilia-0", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-12T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL à Presidência, participou de uma missa na Catedral de Brasília a convite do cardeal Dom Paulo Cezar Costa. Durante a campanha, Flávio Bolsonaro afirmou que 'gente de dentro da CNBB' teria ajudado na divulgação de informações sobre o título de padroeira de Nossa Senhora Aparecida.", "titulo_pt": "Flávio Bolsonaro participa de missa na Catedral de Brasília", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 211752, "titulo": "Master: deputados do PT pedem a Fachin investigação contra Nunes Marques", "url": "https://www.metropoles.com/brasil/master-deputados-do-pt-pedem-a-fachin-investigacao-contra-nunes-marques", "fonte_id": "metropoles", "data_pub": "2026-10-12T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputados do PT solicitaram à ministra do STF Rosa Weber que seja aberta uma investigação contra o ministro Nunes Marques. Os parlamentares suspeitam de um possível vínculo entre Marques e o banqueiro Daniel Vorcaro.", "titulo_pt": "Deputados do PT pedem investigação contra Nunes Marques", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 211753, "titulo": "Duda Salabert aciona MP após Nikolas usar crianças em vídeo político", "url": "https://www.metropoles.com/minas-gerais/duda-salabert-aciona-mp-apos-nikolas-usar-criancas-em-video-politico", "fonte_id": "metropoles", "data_pub": "2026-10-12T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nikolas usou crianças em um vídeo político de dois minutos, criticando Lula e pedindo que os eleitores não votem no PT. Especialistas questionam o uso da imagem dos menores nesse contexto.", "titulo_pt": "Duda Salabert aciona MP após Nikolas usar crianças em vídeo político", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 211684, "titulo": "A bancada feminina cresceu, a desigualdade continua", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/voto-a-voto/2026/10/a-bancada-feminina-cresceu-a-desigualdade-continua.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-12T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma candidata a deputada federal expressou preocupação com a possibilidade de uma bancada majoritariamente masculina. O autor menciona que parte do problema está relacionada ao suporte oferecido pelas lideranças partidárias.", "titulo_pt": "Bancada feminina cresce, mas desigualdade persiste", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 211757, "titulo": "Haddad diz que partidos não devem temer protagonismo de jovens na política", "url": "https://www.metropoles.com/sao-paulo/haddad-diz-que-partidos-nao-devem-temer-protagonismo-de-jovens-na-politica", "fonte_id": "metropoles", "data_pub": "2026-10-12T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernando Haddad, coordenador da campanha presi  Qalqilyah, na cisjordânia ocupada, relatam fontes locais", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 212162, "titulo": "U.S. and NATO commander vows to thwart Moscow, warns Kyiv over refinery strikes", "url": "https://www.washingtonpost.com/world/2026/10/12/top-us-general-vows-thwart-russia-he-warns-kyiv-stop-attacks/", "fonte_id": "washington_post_world", "data_pub": "2026-10-12T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comandante dos EUA e da OTAN prometeu impedir Moscou e alertou Kiev sobre os ataques a refinarias. As mensagens contraditórias refletem a divisão na abordagem de Donald Trump à Rússia, em meio a tensões no mercado energético.", "titulo_pt": "Comandante dos EUA e Otan promete impedir moscou e alerta kiev sobre ataques a refinarias", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 211894, "titulo": "Dozens Killed in Airstrikes Near Sudan-Egypt Border", "url": "https://www.nytimes.com/2026/10/12/world/africa/egypt-sudan-goldmine-strike.html", "fonte_id": "nyt_world", "data_pub": "2026-10-12T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias pessoas foram mortas em ataques aéreos perto da fronteira entre Sudão e Egito. Os ataques ocorreram em uma mina de ouro remota, distante das linhas de frente da devastadora guerra civil sudanesa. Vídeos mostraram munições que pareciam ser do Egito.", "titulo_pt": "Várias pessoas mortas em ataques aéreos próximos à fronteira entre sudão e egito", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 211955, "titulo": "Breaking Bad actor RJ Mitte dies aged 34", "url": "https://www.bbc.co.uk/news/articles/cmn045en7d88o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-12T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ator RJ Mitte, conhecido por interpretar o filho rebeldante do crime organizado Walter White na série dramática Breaking Bad, faleceu aos 34 anos.", "titulo_pt": "Ator de breaking Bad, RJ Mitte, morre aos 34 anos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 212081, "titulo": "(LEAD) Trump says he 'may' meet N. Korean leader Kim during upcoming Asia trip", "url": "https://en.yna.co.kr/view/AEN20261013000651315", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, indicou que pode se encontrar com o líder norte-coreano, Kim Jong-un, durante sua próxima viagem à Ásia. A declaração foi feita em 12 de outubro em Washington.", "titulo_pt": "Trump sugere possibilidade de se encontrar com líder norte-coreano durante viagem à ásia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 212007, "titulo": "Canada’s Carney calls for unity as Alberta prepares for secession vote", "url": "https://www.aljazeera.com/news/2026/10/12/canadas-carney-calls-for-unity-as-alberta-prepares-for-secession-vote?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-12T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Primeiro Ministro do Canadá, Mark Carney, emitiu um mensagem de agradecimento na véspera da realização de um referendo em Alberta sobre a possibilidade de secessão do estado.", "titulo_pt": "Carney do canadá pede unidade antes do referendo sobre secessão em Alberta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 211887, "titulo": "Muere RJ Mitte, el actor que era el hijo de Walter White en ‘Breaking Bad’, a los 34 años", "url": "https://elpais.com/us/entretenimiento/2026-10-12/muere-rj-mitte-el-actor-que-era-el-hijo-de-walter-white-en-breaking-bad-a-los-34-anos.html", "fonte_id": "elpais_america", "data_pub": "2026-10-12T21:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "RJ Mitte, conhecido por interpretar o filho de Walter White em 'Breaking Bad', faleceu aos 34 anos. Ele sofria de paralisia cerebral, como seu personagem no seriado.", "titulo_pt": "RJ Mitte, o filho de Walter White em 'Breaking Bad', morre aos 34 anos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 212008, "titulo": "Conflict, drought increasing risk of famine in Sudan: Monitor", "url": "https://www.aljazeera.com/news/2026/10/12/conflict-drought-increasing-risk-of-famine-in-sudan-monitor?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-12T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño está causando uma seca que afeta aproximadamente metade do país, enquanto um conflito de três anos continua a aumentar o risco de fome em Sudão.", "titulo_pt": "Conflito e seca aumentam risco de fome em sudão: monitor", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 211963, "titulo": "French supermarkets suffer refrigerator shutdown after 'unprecedented' cyberattack", "url": "https://www.france24.com/en/french-supermarkets-suffer-refrigerator-shutdown-after-unprecedented-cyberattack", "fonte_id": "france24", "data_pub": "2026-10-12T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Supermercados franceses relataram um ataque cibernético inédito que fez as temperaturas nos refrigeradores subirem drasticamente em centenas de lojas, levando a descarte de alimentos estragados e preocupações sobre a segurança alimentar.", "titulo_pt": "Supermercados franceses enfrentam falha de refrigeração após ataque cibernético inédito", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 211964, "titulo": "DR Congo's former president Joseph Kabila to lead new movement with M23 rebels", "url": "https://www.france24.com/en/africa/20261012-dr-congo-former-president-joseph-kabila-to-lead-new-movement-with-m23-rebels", "fonte_id": "france24", "data_pub": "2026-10-12T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente da República Democrática do Congo, Joseph Kabila, anunciou uma nova aliança política-militar com os rebeldes M23, apoiados pela Rússia, em desacordo com uma sentença de morte em sua ausência por supostas conexões com o grupo. O anúncio ocorre enquanto se debate a possibilidade de mudanças constitucionais antes do fim do mandato do presidente Félix Tshisekedi, em 2028.", "titulo_pt": "Ex-presidente do Congo Kabila liderará novo movimento com rebeldes M23", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 212082, "titulo": "N. Korea reports test-firing of 'tactical ballistic missile'", "url": "https://en.yna.co.kr/view/AEN20261013000700315", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte realizou um teste de lançamento de um míssil balístico táctico.", "titulo_pt": "Coreia do norte realiza teste de lançamento de míssil balístico táctico", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 211979, "titulo": "Elon Musk gives $276 million to Republican groups, becomes biggest known 2026 midterm donor", "url": "https://www.cnbc.com/2026/10/12/elon-musk-republican-donations-2026-midterm-election.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk destinou 276 milhões de dólares a grupos republicanos, se tornando o maior doador conhecido para as eleições intercaladas de 2026. Este aumento significativo na doação ocorre enquanto Musk reestabelece sua relação com Trump e mantém ligações de negócios com o governo federal.", "titulo_pt": "Elon Musk doa 276 milhões a grupos republicanos, se tornando maior doador conhecido para as eleições intercaladas de 2026", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 211952, "titulo": "Trump’s October Surprise", "url": "https://www.theatlantic.com/politics/2026/10/trump-ukraine-russia-oil/688975/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-12T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apenas alguns dias antes das eleições médias de 2018, o presidente Trump novamente ajuda a Rússia.", "titulo_pt": "Surpresa de outubro de trump", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 211957, "titulo": "Analysis: Trump's global headaches worsen weeks before crucial elections", "url": "https://www.bbc.co.uk/news/articles/cqgm087rkze2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-12T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diante das eleições, o presidente busca ajuda internacional para lidar com um problema doméstico urgente.", "titulo_pt": "Análise: problemas globais agravam semanas antes das eleições cruciais para trump", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 211444, "titulo": "Machinery exports rising: industry group", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/13/2003865842", "fonte_id": "taipei_times", "data_pub": "2026-10-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de maquinário estão aumentando, de acordo com um grupo da indústria.", "titulo_pt": "Exportações de maquinário em alta: grupo da indústria", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 211721, "titulo": "Mesmo sob sanções, Rússia diz ter vendido R$ 1,6 tri em combustível à Europa desde 2022", "url": "https://veja.abril.com.br/mundo/mesmo-sob-sancoes-russia-diz-ter-vendido-r-16-tri-em-combustivel-a-europa-desde-2022/", "fonte_id": "veja", "data_pub": "2026-10-12T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rússia afirmou ter vendido R$ 1,6 trilhão em combustível à Europa desde 2022, mesmo sob sanções. Este dado surge em meio a disputas d de inteligência artificial (IA) com foco inicial em desenvolvedores. Este lançamento visa competir com a OpenAI em termos de IA avançada.", "titulo_pt": "Meta lança versão mais poderosa de IA e entra na briga com OpenAI", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 211765, "titulo": "Modelos de IA da China reduzem a 3% a diferença de desempenho em relação aos EUA, a menor já registrada", "url": "https://www.brasildefato.com.br/colunista/noticias-da-china/2026/10/12/modelos-de-ia-da-china-reduzem-a-3-a-diferenca-de-desempenho-em-relacao-aos-eua-a-menor-ja-registrada/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-12T19:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Modelos de inteligência artificial da China reduziram a diferença de desempenho em relação aos Estados Unidos a 3%, o menor valor já registrado. A Huawei firmou um acordo de patentes com a Qualcomm, invertendo o fluxo de royalties, e uma parceria entre DeepSeek e Huawei desafia o domínio da Nvidia.", "titulo_pt": "Modelos de IA da China reduzem a 3% a diferença de desempenho em relação aos EUA, a menor já registrada", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 212078, "titulo": "WHO report on Russian lab worker death highlights \"key uncertainty\"", "url": "https://arstechnica.com/health/2026/10/who-report-on-russian-lab-worker-death-highlights-key-uncertainty/", "fonte_id": "ars_technica", "data_pub": "2026-10-12T18:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da OMS sobre a morte de um trabalhador em um laboratório russo destaca incertezas importantes. Sem saber a causa exata da morte, não se pode determinar se as precauções tomadas pela Rússia foram adequadas.", "titulo_pt": "Relatório da OMS sobre morte de trabalhador em laboratório russo destaca incertezas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 212079, "titulo": "Anthropic's Claude AI submitted false murder tip to Philadelphia police", "url": "https://arstechnica.com/tech-policy/2026/10/anthropics-claude-ai-submitted-false-murder-tip-to-philadelphia-police/", "fonte_id": "ars_technica", "data_pub": "2026-10-12T18:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O AI Claude enviou uma denúncia falsa de assassinato à polícia de Filadélfia.", "titulo_pt": "Claude AI da anthropic enviou dica falsa de assassinato à polícia de filadélfia", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 211678, "titulo": "Mark Zuckerberg afirma que Meta alcançou fronteira da IA e descarta pisar no freio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/mark-zuckerberg-afirma-que-meta-alcancou-fronteira-da-ia-e-descarta-pisar-no-freio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T18:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mark Zuckerberg afirmou que a Meta alcançou a 'fronteira' da inteligência artificial e planeja investir mais para competir com empresas como Anthropic e OpenAI. Ele rejeitou pedidos para desacelerar o desenvolvimento da tecnologia.", "titulo_pt": "Zuckerberg afirma que Meta alcançou fronteira da IA e descarta desacelerar desenvolvimento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 212099, "titulo": "Meet the Anthropic Engineer Keeping Its AI Agent Trustworthy", "url": "https://spectrum.ieee.org/anthropic-engineer-ai-agent", "fonte_id": "ieee_spectrum", "data_pub": "2026-10-12T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gurmeet Saran, engenheiro da Anthropic em São Francisco, trabalha no desenvolvimento de infraestrutura para entender e garantir a confiabilidade dos outputs do Claude, um assistente de IA. Saran é um membro sênior do IEEE e foca em garantir que a arquitetura subjacente produza respostas confiáveis.", "titulo_pt": "Conheça o engenheiro da Anthropic que garante a confiabilidade do AI claude", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 211488, "titulo": "Meta releases its first frontier model, Muse Wonder", "url": "https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta liberou dois novos modelos de inteligência artificial avançada, chamados Muse Wonder e Muse Wonder Full, na primeira tentativa da empresa em desenvolver um modelo de fronteira.", "titulo_pt": "Meta libera seus primeiros modelos de fronteira, Muse Wonder e Muse Wonder full", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 211497, "titulo": "Elon Musk Bragged About His Grok Lego Star Wars Haul. Then X Users Punked Him", "url": "https://www.wired.com/story/elon-musk-bragged-about-his-grok-lego-star-wars-haul-then-x-users-punked-him/", "fonte_id": "wired", "data_pub": "2026-10-12T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk exibiu uma coleção de Lego Star Wars, mas usuários do X (anteriormente conhecido como Twitter) o brincaram, provavelmente por questões de segurança. O comentário de Musk sobre a falta de segurança da coleção foi então usado contra ele.", "titulo_pt": "Elon Musk exibiu sua coleção de Lego Star Wars, mas foi brincado por usuários do X", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 211489, "titulo": "WindBorne wins a hefty US Air Force contract for its balloon data", "url": "https://techcrunch.com/2026/10/12/windborne-wins-a-hefty-us-air-force-contract-for-its-balloon-data/", "fonte_id": "techcrunch", "data_pub": "2026-10-12T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup de Silicon Valley que utiliza balões meteorológicos e IA para prever o tempo ganhou um contrato militar dos Estados Unidos avaliado em quase 50 milhões de dólares.", "titulo_pt": "Windborne conquista contrato militar valioso com uso de balões meteorológicos e ai", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 210849, "titulo": "49% dos pacientes ouvidos em pesquisa já usaram IA em saúde", "url": "https://veja.abril.com.br/coluna/faria-lima-news/49-dos-pacientes-ouvidos-em-pesquisa-ja-usaram-ia-em-saude/", "fonte_id": "veja", "data_pub": "2026-10-12T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa revelou que 49% dos pacientes ouvidos já utilizaram inteligência artificial em contextos de saúde. Os principais temas abordados incluem sintomas, exames e medicamentos.", "titulo_pt": "49% Dos pacientes já usaram IA em saúde", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 211425, "titulo": "Hall and Woodford win Nobel prize in economics", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/13/2003865861", "fonte_id": "taipei_times", "data_pub": "2026-10-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hall e Woodford ganharam o Prêmio Nobel de Economia.", "titulo_pt": "Hall e Woodford vencem prêmio Nobel de economia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 212100, "titulo": "Nanostructure-assisted ultrasound shows potential for Parkinson's treatment", "url": "https://phys.org/news/2026-10-nanostructure-ultrasound-potential-parkinson-treatment.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A doença de Parkinson é uma das doenças neurológicas mais comuns relacionadas à idade avançada, afetando os sistemas cerebrais que controlam o movimento e causando tremores, rigidez, lentidão e problemas de equilíbrio. A condição está principalmente associada à perda gradual de células nervosas produtoras de dopamina.", "titulo_pt": "Nanoestruturas auxiliam ultrassom no tratamento de Parkinson", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212101, "titulo": "Chemical disorder gives new ceramic film magnetic properties for potential low-power electronics", "url": "https://phys.org/news/2026-10-chemical-disorder-ceramic-magnetic-properties.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um material mais fino que o fio de cabelo humano pode promover dispositivos de computação mais rápidos que exigem menos energia e armazenam mais dados, de acordo com uma equipe multidisciplinar liderada por pesquisadores da Faculdade de Ciências da Terra e Minerais da Universidade Estadual de Pensilvânia.", "titulo_pt": "Desordem química confere novas propriedades magnéticas a filme cerâmico de potenciais dispositivos eletrônicos de baixo consumo de energia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211790, "titulo": "Telescópio Fast da China identifica pulsar como parte de um sistema estelar triplo primordial em evolução orbitado por uma anã branca", "url": "https://www.cnnbrasil.com.br/ciencia/telescopio-fast-da-china-identifica-pulsar-como-parte-de-um-sistema-estelar-triplo-primordial-em-evolucao-orbitado-por-uma-ana-branca/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O telescópio Fast da China identificou um pulsar em um sistema estelar triplo primordial em evolução, orbitado por uma anã branca. Diferente do único sistema conhecido anteriormente, este conjunto inclui uma estrela viva formada a partir da mesma nuvem de gás.", "titulo_pt": "Telescópio Fast da China identifica pulsar em sistema estelar triplo primordial orbitado por anã branca", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 212102, "titulo": "From nonmagnetic to magnetic: A 2D semiconductor with electrically tunable magnetism", "url": "https://phys.org/news/2026-10-nonmagnetic-magnetic-2d-semiconductor-electrically.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da National University of Singapore, em colaboração com cientistas de instituições na Suíça, República Tcheca e Alemanha, demonstraram como introduzir magnetismo em um semicondutor bidimensional não magnético e controlar suas propriedades magnéticas usando uma tensão elétrica. Os resultados estabelecem uma nova plataforma para investigar magnetismo controlável elétricamente em materiais ultrafinos.", "titulo_pt": "De não-magnético a magnético: um semicondutor 2D com magnetismo controlável elétricamente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212103, "titulo": "Data-driven cricket ratings could reveal undervalued batters and bowlers through peer comparisons", "url": "https://phys.org/news/2026-10-driven-cricket-reveal-undervalued-batters.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um método analítico pode auxiliar as franquias de críquete de alto nível na tomada de decisões mais informadas sobre a recrutamento, retenção e seleção de equipes, de acordo com uma pesquisa publicada na International Journal of Services and Operations Management. Este método utiliza análise de eficiência por envelopamento de dados (DEA) para comparar a eficiência usando múltiplos entradas e saídas, avaliando jogadores em relação aos seus pares.", "titulo_pt": "Classificações de críquete baseadas em dados podem revelar jogadores de bate e lançamento subvalorizados através de comparações entre pares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212104, "titulo": "Reinforced vertebrae allow plunge-diving seabirds to survive high-speed impact", "url": "https://phys.org/news/2026-10-vertebrae-plunge-seabirds-survive-high.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Veretébrulos reforçados permitem que águias-pescadoras de nordeste realizem mergulhos de alta velocidade sem se lesar o pescoço. Este comportamento ousado é comum em espécies de aves aquáticas que caçam nadando.", "titulo_pt": "Veretébrulos reforçados permitem mergulhos de alta velocidade em águias-pescadoras de nordeste", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212105, "titulo": "Global satellite data reveal widening recovery gap between urban and rural vegetation", "url": "https://phys.org/news/2026-10-global-satellite-reveal-widening-recovery.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa global mostrou uma diferença significativa na resposta da vegetação urbana e rural à estresse climático. O estudo, liderado por Jin Wu e Yuyu Zhou da Universidade de Hong Kong, revelou que as respostas das duas áreas são distintas.", "titulo_pt": "Dados de satélite global mostram divergência crescente entre vegetação urbana e rural", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212106, "titulo": "Measuring wildfire plumes to predict extreme fire behavior", "url": "https://phys.org/news/2026-10-wildfire-plumes-extreme-behavior.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo de Marc Castellnou, um pesquisador e bombeiro, e da equipe GRAF/Bombers Catalonia visa medir o atmosférico tanto dentro quanto fora das colunas de fumaça de incêndios florestais para compreender melhor a formação de incêndios extremos e as condições que os favorecem.", "titulo_pt": "Medindo colunas de fumaça de incêndios para prever comportamento extremo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212107, "titulo": "Cholesterol-linked drug boosts gene-targeting potency in early findings", "url": "https://phys.org/news/2026-10-cholesterol-linked-drug-boosts-gene.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Medicamentos relacionados ao colesterol aumentaram a eficácia do alvo genético em estudos iniciais, melhorando o potencial terapêutico de ácidos nucleicos, como oligonucleotídeos antisenso (ASOs), para o tratamento de doenças neurológicas e outras condições difíceis de tratar.", "titulo_pt": "Medicamento relacionado ao colesterol potencializa a eficácia da terapia genética em primeiros estudos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212108, "titulo": "Vapor-based method creates ultralight aerogels without conventional liquid-based chemistry", "url": "https://phys.org/news/2026-10-vapor-based-method-ultralight-aerogels.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Nacional da Tayu (NTU), em colaboração com a Faculdade de Engenharia, a Faculdade de Medicina e o Hospital Nacional da Tayu (NTUH), desenvolveram um novo método para produzir aerogéis, introduzindo o que descrevem como a primeira plataforma de fabricação de aerogéis nascida exclusivamente de gases. O estudo foi publicado na Nature Communications.", "titulo_pt": "Método baseado em vapor cria aerogéis ultralivres sem química líquida convencional", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212130, "titulo": "SpaceX launching 6,300 pounds of cargo to the ISS on Oct. 13: Watch it live", "url": "https://www.space.com/space-exploration/international-space-station/spacex-crs-35-cargo-launch-international-space-station", "fonte_id": "space_com", "data_pub": "2026-10-12T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançará mais de 3 toneladas de carga para a Estação Espacial Internacional na manhã de 13 de outubro, e o público pode assistir ao vivo.", "titulo_pt": "Spacex lançará mais de 3 toneladas de carga para a ISS no dia 13 de outubro: assista ao vivo", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 212109, "titulo": "Major cities worldwide are sinking, satellite data reveal", "url": "https://phys.org/news/2026-10-major-cities-worldwide-satellite-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados de satélite revelam que cidades de todo o mundo estão afundando gradualmente, o que pode causar danos a edifícios, fundações e sistemas de drenagem, e aumentar os riscos de inundações. No entanto, as informações sobre a dinâmica do afundamento do solo são limitadas, o que dificulta a identificação por parte dos policymaker de onde os riscos estão se intensificando e onde intervenções urgentes podem ser necessárias.", "titulo_pt": "Grandes cidades do mundo estão afundando, dados de satélite mostram", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 212110, "titulo": "High-speed microscopy captures sugar-building enzymes forming rigid pairs and flexible assemblies", "url": "https://phys.org/news/2026-10-high-microscopy-captures-sugar-enzymes.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microscopia de alta velocidade capturou as enzimas que construem cadeias de açúcares formando pares rígidos e agregados flexíveis. Essas enzimas exibem comportamentos notavelmente diferentes, variando de pares moleculares rígidos a agregados flexíveis com domínios em movimento.", "titulo_pt": "Microscopia de alta velocidade captura enzimas de construção de cadeias de açúcar em pares rígidos e agregados flexíveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211729, "titulo": "Revolução silenciosa: o comprimido que mandou o açúcar para o xixi e ainda salvou rins e coração", "url": "https://veja.abril.com.br/saude/revolucao-silenciosa-o-comprimido-que-mandou-o-acucar-para-o-xixi-e-ainda-salvou-rins-e-coracao/", " idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu o mercado coberto mais antigo de Paris, localizado no bairro do Marais, deixando os comerciantes desolados. A investigação está em andamento e o mercado pode permanecer fechado por meses.", "titulo_pt": "Incêndio destrói mercado coberto mais antigo de paris", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 211329, "titulo": "Video shows major fire ravaging 400-year-old Paris food market", "url": "https://www.euronews.com/2026/10/12/video-shows-major-fire-ravaging-400-year-old-paris-food-market", "fonte_id": "euronews", "data_pub": "2026-10-12T12:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma grande chama noturna destruiu o mercado coberto de alimentos mais antigo de Paris, que tem 400 anos de história. As imagens mostram o estado destruído do local após o incêndio.", "titulo_pt": "Vídeo mostra incêndio devastador no mercado de alimentos mais antigo de Paris, com 400 anos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 211330, "titulo": "Citroën revives its classic 2CV with a new electric concept", "url": "https://www.euronews.com/2026/10/12/citroen-revives-its-classic-2cv-with-a-new-electric-concept", "fonte_id": "euronews", "data_pub": "2026-10-12T11:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Citroën apresentou um conceito elétrico inspirado na icônica 2CV, planejando trazer o modelo clássico de volta às estradas nos próximos dois anos. O veículo compacto une o design retrô com tecnologia elétrica moderna, com preços esperados a partir de cerca de R$ 150 mil.", "titulo_pt": "Citroën renova sua icônica 2CV com um novo conceito elétrico", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 210157, "titulo": "Enchente e deslizamento no Nepal deixam mais de 100 estrangeiros ilhados", "url": "https://www.metropoles.com/mundo/enchente-e-deslizamento-no-nepal-deixam-mais-de-100-estrangeiros-ilha Yoon.", "titulo_pt": "Órgão de direitos humanos revoga recomendação sobre direito de defesa de Yoon e planeja compensação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 211524, "titulo": "Rights watchdog to offer public apology over recommendation on Yoon's right to defense", "url": "https://en.yna.co.kr/view/AEN20261012009300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T11:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instituição responsável pelos direitos humanos do estado decidiu oferecer uma compensação pública devido a uma recomendação sobre o direito de defesa de Yoon.", "titulo_pt": "Órgão de direitos humanos vai oferecer compensação pública por recomendação sobre direito de defesa de Yoon", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210142, "titulo": "Por que pena de morte persiste nos Estados Unidos? Americanos apoiam", "url": "https://veja.abril.com.br/coluna/mundialista/por-que-pena-de-morte-persiste-nos-estados-unidos-americanos-apoiam/", "fonte_id": "veja", "data_pub": "2026-10-12T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os casos de Christa Pike e Nidal Hasan têm agitado a discussão sobre a pena de morte nos Estados Unidos, mas a maioria da população ainda apoia essa prática.", "titulo_pt": "Por que a pena de morte persiste nos Estados Unidos? Americanos apoiam", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 210551, "titulo": "UNRWA warns Gaza is becoming an increasingly unlivable place", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/unrwa-health-chief-gaza/", "fonte_id": "japan_times", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O UNRWA alerta que Gaza enfrenta persistentes escassezes de suprimentos médicos devido a restrições nas entregas. As condições de higiene também permanecem ruins.", "titulo_pt": "UNRWA avisa que Gaza está se torna , um setor dominado por homens em que as vozes das mulheres frequentemente são ignoradas.", "titulo_pt": "Somos ainda da idade média: mulheres sobre violência sexual no e-sports", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 210571, "titulo": "Anti-sexual assault certification set for Japan’s cram schools", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/society/cram-schools-anti-sexual-assault-certification/", "fonte_id": "japan_times", "data_pub": "2026-10-12T02:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As escolas de preparação para exames no Japão estão prestes a implementar um certificado contra assédio sexual. A medida será lançada no dia 25 de dezembro, em uma versão adaptada do Serviço de Declaração e Exclusão do Reino Unido.", "titulo_pt": "Certificado contra assédio sexual para escolas de preparação no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 211421, "fonte_id": "taipei_times", "titulo": "Six of new F-16s complete factory test", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/13/2003865857", "data_pub": "2026-10-13T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Seis novos F-16 concluem testes de fábrica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 211425, "fonte_id": "taipei_times", "titulo": "Hall and Woodford win Nobel prize in economics", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/13/2003865861", "data_pub": "2026-10-13T00:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "Hall e Woodford vencem prêmio Nobel de economia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 211426, "fonte_id": "taipei_times", "titulo": "Taiwan closely monitoring China drills", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/13/2003865868", "data_pub": "2026-10-13T00:00:00Z", "topico": "geopolitica", "i function renderSecao(topico) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }

    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`

  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));

  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
