Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Familiares de pessoas com deficiências na Argentina denunciam que a rede de assistência, composta por terapeutas, lares de assistência e transportadores, entrou em colapso. Uma nova lei está sendo implementada para tentar resolver essa situação.", "titulo_pt": "O drama das pessoas com deficiências afetadas pela política de Milei na Argentina: 'estão presos em suas casas, sem futuro'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 275920, "titulo": "Nearly a quarter of the world’s children live in conflict zones, according to Save the Children", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/nearly-a-quarter-of-the-world-s-children-live-in-conflict-zones-according-to-save-the-children_6784615_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T18:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, 589 milhões de crianças viviam em zonas de conflito, com 44% delas localizadas em África.", "titulo_pt": "Quase uma quarta parte das crianças do mundo vivem em zonas de conflito, de acordo com Save the Children", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 275617, "titulo": "Geração Z do Brasil ocupa 2º lugar global em otimismo pessoal, diz pesquisa", "url": "https://exame.com/brasil/geracao-z-do-brasil-ocupa-2o-lugar-global-em-otimismo-pessoal-diz-pesquisa/", "fonte_id": "exame", "data_pub": "2026-11-19T18:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Oxford Scholastica Academy com 1.433 estudantes colocou o Brasil em segundo lugar global em otimismo pessoal. No entanto, o país ficou em 25º lugar quando avaliado em cinco critérios médios.", "titulo_pt": "Geração Z do Brasil ocupa 2º lugar global em otimismo pessoal, diz pesquisa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 275622, "titulo": "UNICEF: Banheiro na escola também é direito à educação", "url": "https://exame.com/esg/unicef-banheiro-na-escola-tambem-e-direito-a-educacao/", "fonte_id": "exame", "data_pub": "2026-11-19T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A UNICEF enfatiza que um banheiro adequado, com água, sabão, privacidade e higiene adequada, é essencial para a educação. O acesso a banheiros adequados é considerado um direito fundamental para a educação.", "titulo_pt": "Banheiro na escola é um direito à educação, afirma UNICEF", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274705, "titulo": "Empresário vira réu e tem prisão preventiva decretada por matar advogada", "url": "https://www.metropoles.com/sao-paulo/empresario-vira-reu-e-tem-prisao-preventiva-decretada-por-matar-advogada", "fonte_id": "metropoles", "data_pub": "2026-11-19T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Eric Conrado foi declarado réu e teve prisão preventiva decretada após ser acusado de matar a namorada, advogada, e o filho dela, de 6 anos.", "titulo_pt": "Empresário é declarado réu e tem prisão preventiva decretada por matar advogada e filho", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274707, "titulo": "Cleitinho é criticado nas redes por tirar mulher do comando da PM em Minas", "url": "https://www.metropoles.com/minas-gerais/cleitinho-e-criticado-nas-redes-por-tirar-mulher-do-comando-da-pm-em-minas", "fonte_id": "metropoles", "data_pub": "2026-11-19T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher criticou a decisão de Cleitinho de substituir a coronel Cleide, que era a primeira mulher a comandar a Polícia Militar em Minas Gerais. A internauta expressou tristeza com a saída da coronel.", "titulo_pt": "Cleitinho é criticado nas redes por tirar mulher do comando da PM em Minas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274711, "titulo": "Abandono em massa: dezenas de cães são largados na Granja do Torto", "url": "https://www.metropoles.com/distrito-federal/abandono-em-massa-dezenas-de-caes-sao-largados-na-granja-do-torto", "fonte_id": "metropoles", "data_pub": "2026-11-19T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dezenas de cães foram abandonados na Granja do Torto, segundo relatos de moradores. A comunidade busca pessoas interessadas em castrar e adotar os animais.", "titulo_pt": "Abandono em massa: dezenas de cães são largados na Granja do Torto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274762, "titulo": "Feriado da Consciência Negra: veja o que abre e fecha em São Paulo", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/feriado-da-consciencia-negra-veja-o-que-abre-e-fecha-em-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em São Paulo, o Poupatempo e as unidades do Detran não terão atendimento presencial durante o feriado da Consciência Negra. O transporte público funcionará com operação especial e os museus estaduais funcionarão em horários variados.", "titulo_pt": "Feriado da Consciência Negra: veja o que abre e fecha em São Paulo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274766, "titulo": "Cidade de Goiás terá que pagar indenização por morte de jovem com meningite", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/go/cidade-de-goias-tera-que-pagar-indenizacao-por-morte-de-jovem-com-meningite/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade de Goiás terá que pagar uma indenização por causa da morte de um jovem que teve meningite. A justiça também determinou o pagamento de uma pensão mensal. A perícia concluiu que houve falhas na investigação dos sintomas apresentados pelo jovem em uma unidade de saúde de Senador Canedo, Goiás.", "titulo_pt": "Cidade de Goiás terá que pagar indenização por morte de jovem com meningite", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 275297, "titulo": "Advocates ask candidates for clear climate policies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868073", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados pedem aos candidatos políticos que apresentem políticas claras sobre o clima. O objetivo é garantir que os candidatos estejam preparados para lidar com questões ambientais de forma transparente e eficaz.", "titulo_pt": "Advogados pedem políticos clareza sobre políticas climáticas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275740, "titulo": "Combustíveis fósseis: o que são e por que importam", "url": "https://www.dw.com/pt-br/combustíveis-fósseis-o-que-são-e-por-que-importam/a-79994658?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-19T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os combustíveis fósseis, como carvão, petróleo e gás natural, desempenharam um papel crucial na Revolução Industrial e no desenvolvimento moderno, mas cientistas argumentam que sua substituição é necessária para combater o aquecimento global.", "titulo_pt": "Combustíveis fósseis: o que são e por que importam", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 275943, "titulo": "How vaccine fears fuelled a major measles comeback in the US", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/19/how-vaccine-fears-fuelled-a-major-measles-comeback-in-the-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T20:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cobertura vacinal está diminuindo nos Estados Unidos, permitindo que a doença da rubéola ressurgisse. As preocupações com vacinas estão contribuindo para essa recuperação da rubéola no país.", "titulo_pt": "Medo de vacinas alimenta forte retorno da rubéola nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 274900, "titulo": "Dejaron un carnero suelto en una isla y 40 años después se volvió una amenaza para el ecosistema", "url": "https://www.lanacion.com.ar/lifestyle/dejaron-un-carnero-suelto-en-una-isla-y-40-anos-despues-se-volvio-una-amenaza-para-el-ecosistema-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T17:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um muflon foi introduzido em Tenerife com fins de caça, mas 40 anos depois, o animal se tornou uma ameaça ao ecossistema local, colocando em risco a sobrevivência de espécies vegetais endêmicas únicas.", "titulo_pt": "Deixaram um muflon solto em uma ilha e 40 anos depois ele se tornou uma ameaça ao ecossistema", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274587, "titulo": "Copel vê nova era para hidrelétricas com avanço da energia solar e eólica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/copel-ve-nova-era-para-hidreletricas-com-avanco-da-energia-solar-e-eolica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço da geração solar e eólica no Brasil criou novas oportunidades para o setor de hidrelétricas, conforme destacado no Copel Day, encontro de executivos da Copel com investidores e analistas em Nova York.", "titulo_pt": "Nova era para hidrelétricas com avanço de energia solar e eólica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 275023, "titulo": "Making Oil Companies Pay for Climate Damages", "url": "https://www.theatlantic.com/podcasts/2026/11/suing-our-way-out-of-climate-change/689500/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-19T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte decidiu se cidades e condados podem processar as grandes empresas de petróleo por danos climáticos.", "titulo_pt": "Suprema corte decidirá se cidades e condados podem processar as grandes empresas de petróleo por danos climáticos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 275240, "titulo": "COP31 negotiators publish revised deal text with no mention of fossil fuels", "url": "https://www.japantimes.co.jp/environment/2026/11/19/climate-change/cop-fossil-fuel-language/", "fonte_id": "japan_times", "data_pub": "2026-11-19T12:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira versão do acordo incluía duas referências a combustíveis fósseis e à limitação de seu uso, um tema que divide as nações nas negociações anuais. Os negociadores da COP31 publicaram uma nova proposta sem menção a combustíveis fósseis.", "titulo_pt": "Negociadores da COP31 publicam novo texto de acordo sem mencionar combustíveis fósseis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 275272, "titulo": "Indonesia’s forest protection plan praised by Leonardo DiCaprio. Will it work?", "url": "https://www.scmp.com/week-asia/health-environment/article/3375097/indonesias-forest-protection-plan-praised-leonardo-dicaprio-will-it-work", "fonte_id": "scmp", "data_pub": "2026-11-19T11:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia prometeu parar a desmatamento para produção de alimentos e reutilizar terras degradadas, ganhando elogios do ator Leonardo DiCaprio, que considerou a medida histórica. No entanto, especialistas em meio ambiente argumentam que o plano é vago e pode até enfraquecer os ecossistemas vulneráveis.", "titulo_pt": "Plano de proteção florestal da indonésia ganha elogios de Leonardo DiCaprio, mas especialistas têm dúvidas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274978, "titulo": "Race to replant five South African baobabs after export blocked", "url": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "fonte_id": "guardian_world", "data_pub": "2026-11-19T11:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco baobá de centenas de anos foram arrancados sem os permissoes necessárias e tentaram ser exportados para a Geórgia. Agora, ambientalistas sul-africanos estão empenhados em replantar as árvores e fornecer apoio para seu recuperação.", "titulo_pt": "Corrida para replantar cinco baobás sul-africanos após exportação bloqueada", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 274049, "titulo": "Morgan Freeman compró un campo de 50 hectáreas y lo transformó en un santuario gigante para salvar a las abejas", "url": "https://www.lanacion.com.ar/espectaculos/morgan-freeman-compro-un-campo-de-50-hectareas-y-lo-transformo-en-un-santuario-gigante-para-salvar-a-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2014, o ator Morgan Freeman adquiriu uma propriedade de 50 hectares e a transformou em um santuário para a proteção das abelhas. Ele iniciou esta iniciativa após desenvolver o interesse pela apicultura como novo hobby.", "titulo_pt": "Morgan Freeman compra propriedade de 50 hectares e transforma em santuário para salvar as abelhas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274337, "titulo": "Thai floods expose waste pollution in ‘garbage dump’ region", "url": "https://www.japantimes.co.jp/news/2026/11/19/asia-pacific/science-health/thai-floods-pollution-garbage-dump/", "fonte_id": "japan_times", "data_pub": "2026-11-19T07:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prachinburi, localizada entre Bangkok e a principal zona industrial do leste do país, tem enfrentado preocupações sobre a poluição por resíduos há muito tempo. As inundações recentes expuseram esses problemas ambientais na região conhecida como ‘área de descarte de lixo’.", "titulo_pt": "Inundações expõem poluição de resíduos na região de descarte de lixo do tailândia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 273825, "titulo": "COP31: penúltimo dia foca em implementação climática; negociações entram na reta final", "url": "https://exame.com/esg/cop31-penultimo-dia-foca-em-implementacao-climatica-negociacoes-entram-na-reta-final/", "fonte_id": "exame", "data_pub": "2026-11-19T06:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O penúltimo dia da COP31 focou em debates sobre investimentos, justiça climática e soluções práticas. As negociações estão na reta final e a conferência termina oficialmente na sexta-feira.", "titulo_pt": "COP31: penúltimo dia foca em implementação climática; negociações entram na reta final", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 273939, "titulo": "Titularidade compartilhada de licenças ambientais: novas veredas em Minas Gerais", "url": "https://www.jota.info/opiniao-e-analise/artigos/titularidade-compartilhada-de-licencas-ambientais-novas-veredas-em-minas-gerais", "fonte_id": "jota", "data_pub": "2026-11-19T04:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O decreto reconhece a compartilhada responsabilidade no licenciamento ambiental em Minas Gerais. Pode servir como modelo para outros estados.", "titulo_pt": "Titularidade compartilhada de licenças ambientais: novas veredas em Minas Gerais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 275293, "titulo": "Myanmar guilty of genocide: top UN court", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/20/2003868065", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal mais alto das Nações Unidas declarou que a Myanmarese é responsável por genocídio. O julgamento se referiu a acusações de violações graves dos direitos humanos cometidas pelo governo do país contra minorias étnicas.", "titulo_pt": "Myanmar condenada a genocídio: tribunal mais alto das nações unidas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275302, "titulo": "Indigenous groups call for consent rights to be upheld", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868078", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos indígenas estão pedindo que os direitos de consentimento sejam mantidos. A chamada ocorre em um contexto não especificado, mas destaca a importância do respeito às decisões indígenas.", "titulo_pt": "Grupos indígenas exigem manutenção de direitos de consentimento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275793, "titulo": "En una nueva redada contra la pedofilia detuvieron a 16 personas e identificaron a ocho víctimas", "url": "https://www.lanacion.com.ar/seguridad/en-una-nueva-redada-contra-la-pedofilia-detuvieron-a-16-personas-e-identificaron-a-ocho-victimas-nid19112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T21:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram realizados 136 mandados de busca e apreensão na província de Buenos Aires no âmbito da Operação Proteção de Infâncias VIII. Dezesseis pessoas foram detidas e oito vítimas de pedofilia foram identificadas.", "titulo_pt": "Em nova operação contra pedofilia, 16 pessoas são detidas e 8 vítimas identificadas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 275916, "titulo": "In the Rohingya refugee camps, watching Myanmar being found guilty of genocide: 'This is a time to remember those who are no longer with us'", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/in-the-rohingya-refugee-camps-watching-myanmar-being-found-guilty-of-genocide-this-is-a-time-to-remember-those-who-are-no-longer-with-us_6784780_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O julgamento do Tribunal Internacional de Justiça sobre a acusação de genocídio contra Myanmar foi assistido ao vivo nas vastas tendas de refugiados em Bangladesh, onde mais de um milhão de rohingyas vivem. Este momento histórico reabriu as feridas da traumática experiência de 2017.", "titulo_pt": "Nas tendas de refugiados rohingyas, assistindo ao julgamento que reconhece Myanmar como culpado de genocídio: 'é um momento para lembrar aqueles que não estão mais conosco'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 275899, "titulo": "El lado oscuro de la inteligencia artificial", "url": "https://www.ciperchile.cl/2026/11/19/el-lado-oscuro-de-la-inteligencia-artificial/?utm_source=rss&utm_medium=rss&utm_campaign=el-lado-oscuro-de-la-inteligencia-artificial", "fonte_id": "ciper_chile", "data_pub": "2026-11-19T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute os aspectos negativos da inteligência artificial. A entrada foi publicada originalmente no CIPER Chile.", "titulo_pt": "O lado escuro da inteligência artificial", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 275994, "titulo": "At least 300 children died in Gaza waiting for Israel's permission to get medical leave", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/least-300-children-died-gaza-waiting-israeli-medical-leave-permission", "fonte_id": "middle_east_eye", "data_pub": "2026-11-19T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 300 crianças morreram em Gaza esperando a permissão israelense para receber tratamento médico vital. Aproximadamente 5.400 crianças const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
