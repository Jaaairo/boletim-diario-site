<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

ção, o primeiro indicativo de que a economia japonesa pode estar finalmente alcançando a meta de inflação estabelecida há mais de uma década.", "tecnologia": "A Apple anunciou que reduzirá a taxa de comissão na App Store para 26%, em um esforço para aliviar as preocupações dos desenvolvedores de aplicativos com a alta taxa de 30% anterior. Em contraste, a empresa Anthropic enfrenta dúvidas sobre a obtenção de uma classificação de investimento de grau após a oferta inicial de ações, segundo a Blackstone. A tecnologia de inteligência artificial (IA) também está em foco, com o Papa Francisco chamando para a desarmamentização de sistemas de IA, considerando-as ferramentas e não seres humanos. A empresa Binance afirmou que as contas dos usuários brasileiros estão seguras após um roubo de criptomoedas de US$ 6,36 bilhões, atribuído a hackers norte-coreanos. Além disso, a Samsung adquiriu a participação da TCL CSOT na China para fortalecer suas relações de suprimento de painéis LCD, enquanto a Europa impõe novas obrigações para os desenvolvedores de IA, especialmente para os fornecedores de modelos de finalidade geral.", "ciencia": "A NASA's James Webb Space Telescope capturou imagens inéditas da Nebulosa do Gato, revelando detalhes intricados em uma visão infravermelha do meio-infravermelho. Estudos recentes indicam que outubro deste ano pode ser o mais quente já registrado, com uma temperatura 1,76 graus Celsius acima das médias pré-industriais. Em um desenvolvimento científico notável, cientistas da AstraZeneca anunciaram um programa de corte de custos de três anos com o objetivo de reduzir custos em US$ 1,5 bilhão anualmente, reinvestindo os recursos economizados em pesquisa e desenvolvimento. Outros avanços científicos incluem a descoberta de um novo padrão de transição evolutiva em larga escala em fósseis de um ecossistema marinho na Colômbia, que não envolve massas extinções, e a confirmação de que a pele de frutas e vegetais contém mais fibras do que as partes comestíveis desses alimentos, incluindo a casca de kiwi e as sementes de abóbora. Além disso, a NASA enviou uma solicitação de informações para explorar as capacidades da indústria de serviços espaciais em operação, com o objetivo de suportar a Estação Espacial Hubble da agência.", "cultura": "Gabriel Rolón, psicólogo e escritor, reflete sobre a complexidade da condição humana em entrevistas publicadas pela LA NACION. Segundo ele, a felicidade é um estado onde passado, presente desejado e medo coexistem, enquanto a esperança pode nos impedir de apreciar o presente. Essas reflexões, juntamente com a discussão sobre a finitude humana, destacam a natureza intrincada dos vínculos humanos e o impacto das opiniões alheias na identidade individual. Em outro contexto, a Cinemateca Brasileira apresenta uma mostra intitulada 'O Outro Cinema Americano', que destaca a trajetória de cineastas negros que trabalharam fora dos grandes estúdios de Hollywood, celebrando a diversidade e a riqueza do cinema americano.", "sociedade": "Mais de 15 milhões de brasileiros são afetados por doenças reumáticas, de acordo com um relatório da Organização Pan-Americana de Saúde (OPAS), que enfatiza a importância do diagnóstico precoce para evitar a perda de autonomia e capacidade funcional. Além disso, um acidente envolvendo trens na Espanha deixou pelo menos 69 mortos e diversos feridos. O planejamento urbano saudável deve se concentrar nas necessidades das pessoas, considerando as implicações das decisões urbanísticas para a saúde e o bem-estar dos cidadãos, conforme um estudo publicado pela Folha de S. Paulo.", "meio_ambiente": "O ministério da Indonésia aprovou a primeira exploração de sequestramento de carbono, um passo importante para o desenvolvimento de tecnologias de mitigação de gases de efeito estufa no país. No entanto, o país enfrenta uma crise ambiental significativa, com relatos de 3.560 mortes causadas pela fumaça de incêndios florestais em setembro. Em Papua Nova Guiné, um fenômeno El Niño está causando uma severa seca que afeta até 8 milhões de pessoas, levando a uma crise nacional devido à falta de alimentos, água e energia. O Brasil também enfrenta desafios ambientais, com cinco regiões de corais em estado crítico e o avanço de um front frio que pode causar temporais e calorão no centro-sul do país. Além disso, a Indonésia registrou 3.500 mortes devido à fumaça de incêndios florestais em setembro, afetando a saúde de 57,8 milhões de pessoas.", "direitos_humanos": "A Colômbia enfrenta preocupações com a redução orçamentária planejada para um tribunal de justiça transitória, o que pode comprometer o funcionamento de um órgão crucial para a proteção dos direitos humanos. Além disso, um relatório revela uma campanha que promoveu visões racistas, islamófobas e anti-qataris, com o objetivo de retratar o Qatar como a força por trás da imigração em massa para a Europa. No entanto, o cancelamento do Festival de Cinema Queer de Pequim, um dos mais antigos da China, devido à pressão do governo local, também é uma preocupação significativa, refletindo a censura e a limitação das liberdades de expressão e de associação. Em Gaza, há crescentes temores de limpeza étnica à medida que as forças israelenses avançam a linha amarela para o oeste, com a ONU relatando que essa área está sendo tratada como uma 'zona de morte'."}, "resumo_do_dia": {"politica_nacional": [{"id": 235177, "titulo": "STF aprova regra que aumenta contribuição de servidor aposentado por doença grave; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/stf-aprova-regra-que-aumenta-contribuicao-de-servidor-aposentado-por-doenca-grave-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF decidiu, por 4 votos a 3, que é constitucional a regra da reforma da Previdência de 2019 que aumenta a contribuição previdenciária dos servidores pú  perda do mandato", "url": "https://www.jota.info/legislativo/flavio-bolsonaro-se-aproxima-do-limite-de-faltas-que-pode-levar-a-perda-do-mandato", "fonte_id": "jota", "data_pub": "2026-10-30T15:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro está perto do limite de faltas que poderia levar à perda do seu mandato. A Constituição determina que parlamentares que deixarem de comparecer a 1/3 das sessões ordinárias podem perder o mandato.", "titulo_pt": "Flávio Bolsonaro se aproxima do limite de faltas que pode levar à perda do mandato", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 235367, "titulo": "STF afasta equiparação salarial entre MP de Contas e MP estadual no Espírito Santo", "url": "https://www.jota.info/stf/do-supremo/stf-afasta-equiparacao-salarial-entre-mp-de-contas-e-mp-estadual-no-espirito-santo", "fonte_id": "jota", "data_pub": "2026-10-30T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) invalidou uma lei que equiparava salarialmente o Ministério Público de Contas ao Ministério Público estadual no Espírito Santo, por 7 votos a 3.", "titulo_pt": "STF anula equiparação salarial entre MP de Contas e MP estadual no Espírito Santo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 235170, "titulo": "Lula planeja montar frente ampla com Alcolumbre e Motta e nova relação com base", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/lula-planeja-montar-frente-ampla-com-alcolumbre-e-motta-e-nova-relacao-com-base.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula planeja empoderar Davi Alcolumbre e Hugo Motta na formação da base aliada para o novo mandato e promete uma maior cooperação com o Legislativo.", "titulo_pt": "Lula planeja montar frente ampla com Alcolumbre e Motta e nova relação com base", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 235171, "titulo": "Governo Lula e relator querem aprovar regulação concorrencial das big techs até o fim do ano", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/governo-lula-e-relator-querem-aprovar-regulacao-concorrencial-das-big-techs-ate-o-fim-do-ano.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula e parlamentares buscam aprovar até dezembro o projeto de lei que regulamenta concorrentemente as grandes tecnológicas. Há a sensação de que a aprovação agora é mais fácil, mas a janela de oportunidade se estreitará no próximo ano.", "titulo_pt": "Governo Lula e relator querem aprovar regulação concorrencial das big techs até o fim do ano", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 235172, "titulo": "Trumpista que teria ajudado na fuga de Flávio se dizia defensor da liberdade de expressão e crítico das big techs", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/trumpista-que-teria-ajudado-na-fuga-de-flavio-se-dizia-defensor-da-liberdade-de-expressao-e-critico-das-big-techs.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jason Miller, conselheiro de Donald Trump, foi apontado como responsável por viabilizar a viagem de Flávio Bolsonaro aos EUA. Miller se apresentava como defensor da liberdade de expressão e crítico das grandes empresas de tecnologia.", "titulo_pt": "Trumpista que teria ajudado na fuga de Flávio se dizia defensor da liberdade de expressão e crítico das big techs", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 235849, "titulo": "Netanyahu’s bloc loses majority in Israeli parliament", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/31/2003866905", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bloco de Netanyahu perdeu a maioria no parlamento israelense. A coalizão liderada por Benjamin Netanyahu não conseguiu manter o apoio necessário para continuar governando majoritariamente.", "titulo_pt": "Bloco de netanyahu perde maioria no parlamento israelense", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 235454, "titulo": "Piletas para el verano: ¿puedo arrancar la construcción en octubre?", "url": "https://www.lanacion.com.ar/propiedades/construccion-y-diseno/piletas-para-el-verano-puedo-arrancar-la-construccion-en-octubre-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T17:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "É possível iniciar a construção das piscinas para o verão a partir de outubro, mas há vários aspectos a serem avaliados, como o tipo de piscina, os permisos necessários e os trabalhos adicionais.", "titulo_pt": "Piscinas para o verão: posso iniciar a construção em outubro?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 235154, "titulo": "Trump usa governo de forma 'flagrante' e 'indevida' para proteger Flávio Bolsonaro, diz senadora democrata à Folha", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/trump-usa-governo-de-forma-flagrante-e-indevida-para-proteger-flavio-bolsonaro-diz-senadora-democrata-a-folha.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-30T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora americana Jeanne Shaheen acusa o presidente Donald Trump de usar os recursos do governo americano de forma indevida para ajudar o senador Flávio Bolsonaro a fugir do Brasil e acolhê-lo em solo americano. Ela também afirma que Trump encampou as alegações infundadas de fraude eleitoral do filho do presidente brasileiro.", "titulo_pt": "Trump usa governo de forma 'flagrante' e 'indevida' para proteger Flávio Bolsonaro, diz senadora democrata", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 235203, "titulo": "Itamaraty convoca representante da Embaixada da Argentina após Flávio cruzar fronteira do Brasil com o país vizinho e fugir para EUA", "url": "https://g1.globo.com/politica/noticia/2026/10/30/itamaraty-convoca-representante-da-embaixada-da-argentina-apos-flavio-cruzar-fronteira-do-brasil-com-o-pais-vizinho-e-fugir-para-eua.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itamaraty convocou a representante da Embaixada da Argentina para esclarecer sobre a fuga do senador Flávio Bolsonaro para os Estados Unidos. O governo argentino confirmou que a família do senador embarcou em um avião particular partir da Argentina na noite de terça-feira.", "titulo_pt": "Itamaraty convoca representante da Embaixada da Argentina após Flávio bolsonaro fugir para EUA", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 235703, "titulo": "Putin courts guests at Russia-Africa summit by lashing out at Western 'neocolonialism'", "url": "https://www.lemonde.fr/en/international/article/2026/10/30/putin-courts-guests-at-russia-africa-summit-by-lashing-out-at-western-neocolonialism_6767488_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-30T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente russo, Vladimir Putin, prometeu aumentar as relações comerciais com África durante a cúpula realizada em Moscou nos dias 28 e 29 de outubro. Putin também criticou o que considerou neocolonialismo ocidental durante o evento.", "titulo_pt": "Putin conquista visitantes na cúpula rússia-afro ao atacar 'neocolonialismo' ocidental", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 235662, "titulo": "US tech stocks see sharp falls as AI spending nears $1tn", "url": "https://www.bbc.co.uk/news/articles/cvwy72e0n72yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-30T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Intel continuam em queda e o índice Nasdaq, que tem peso maior em tecnologia, abriu no nível mais baixo em mais de dois meses. O setor de tecnologia, especialmente em relação à inteligência artificial, está próximo de alcançar uma marca de 1 trilhão de dólares em gastos.", "titulo_pt": "Ações de tecnologia caem enquanto gastos com IA se aproximam de 1 trilhão de dólares", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 235618, "titulo": "ICE activity is surging ahead of midterms. So is voter turnout.", "url": "https://www.npr.org/2026/10/30/nx-s1-6023331/ice-activity-surge-midterms", "fonte_id": "npr_news", "data_pub": "2026-10-30T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há relatos de aumento da atividade da ICE em todo o país. Até o momento, o número de eleitores registrados para votar tem aumentado significativamente.", "titulo_pt": "Atividade da ICE está aumentando perto das eleições intermediárias. Ainda assim, o número de eleitores está crescendo.", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 235548, "titulo": "Police Investigate Former Prince Andrew and Epstein’s Time at Balmoral, Royal Estate in Scotland", "url": "https://www.nytimes.com/2026/10/30/world/europe/andrew-epstein-scotland-police-investigation-uk-balmoral.html", "fonte_id": "nyt_world", "data_pub": "2026-10-30T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigações policiais estão sendo realizadas sobre o tempo que o ex-príncipe Andrew e Jeffrey Epstein, um criminoso condenado por abuso sexual, passaram com Ghislaine Maxwell no Balmoral, a propriedade real escocesa dos reis britânicos.", "titulo_pt": "Polícia investigará tempo de ex-príncipe Andrew e Epstein em Balmoral, refúgio real escocês", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 235656, "titulo": "Crypto giant Binance attempting to recover $6.3bn stolen in hack linked to North Korea", "url": "https://www.bbc.co.uk/news/articles/cwe8lp7zy07zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-30T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Binance está tentando recuperar 6,3 bilhões de dólares roubados em um ataque cibernético complexo, que é considerado o maior desse tipo já registrado. O ataque, supostamente ligado ao Norte-Coreia, ocorreu em uma operação complexa.", "titulo_pt": "Gigante da criptomoeda Binance tenta recuperar 6,3 bi roubados em hack ligado ao norte-coreia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 235449, "titulo": "Trump retoma sus mítines en Iowa y Kansas, tras una abrupta cancelación casi a las puertas de las ‘midterms’", "url": "https://elpais.com/us/2026-10-30/trump-retoma-sus-mitines-en-iowa-y-kansas-tras-una-abrupta-cancelacion-casi-a-las-puertas-de-las-midterms.html", "fonte_id": "elpais_america", "data_pub": "2026-10-30T17:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump retomou seus mitings em Iowa e Kansas, após uma cancelação inesperada próximo às eleições intermedias. Embora tenha optado por reuniões virtuais com seus partidários, os republicanos estão em disputas apertadas em ambos os estados.", "titulo_pt": "Trump retoma seus mitings em Iowa e Kansas, após cancelamento inesperado antes das eleições intermedias", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 235558, "titulo": "Why Trump’s Hail Mary on Fuel Prices Fell Short", "url": "https://foreignpolicy.com/2026/10/30/trump-russia-diesel-deal-putin-prices-midterms-iran-war/", "fonte_id": "foreign_policy", "data_pub": "2026-10-30T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A abordagem do presidente Trump de agradar Moscou e adiar a questão do Irã não conseguiu estabilizar os mercados de petróleo ou aliviar os eleitores.", "titulo_pt": "Por que a jogada de risco de Trump sobre os preços do combustível não deu certo", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 235663, "titulo": "G20 'family photo' cancelled after protests over presence of Russian minister", "url": "https://www.bbc.co.uk/news/articles/cmd6dp2y576do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-30T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reunião do G20 em Atlanta foi cancelada a foto oficial com a presença do ministro russo Sergei Lavrov, após recusa de ministros europeus em serem fotografados com ele devido às protestos.", "titulo_pt": "Foto oficial do G20 cancelada devido a protestos contra presença do ministro russo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 235754, "titulo": "Tankers defy sharp escalation of Iranian attacks to keep crude oil flowing through Strait of Hormuz", "url": "https://www.cnbc.com/2026/10/30/tanker-attack-strait-hormuz-iran-war-oil.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-30T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Frete elevado está dando um grande incentivo financeiro para que tanques de petróleo passem pelo Estreito de Ormuz, apesar do aumento significativo das ameaças iranianas.", "titulo_pt": "Tanques enfrentam aumento abrupto de ameaças iranianas, mas continuam a fluir o petróleo pelo estreito de Ormuz", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 235440, "titulo": "Detenta americana Christa Pike afirma ter acordado 'confusa e com dores' após tentativa fracassada de execução", "url": "https://www.bbc.com/portuguese/articles/cqwy728wwky3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-30T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, uma detenta americana, afirmou ter acordado confusa e com dores após uma tentativa fracassada de execução por injeção letal em setembro. Esta é a sua primeira declaração pública desde o incidente.", "titulo_pt": "Detenta americana Christa Pike relata mal-estar após tentativa de execução", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 235555, "titulo": "Evacuation of civilians begins in besieged Ukrainian city of Oleshky", "url": "https://www.theguardian.com/world/2026/oct/30/evacuation-besieged-ukrainian-city-oleshky", "fonte_id": "guardian_world", "data_pub": "2026-10-30T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Civis foram evacuados da cidade de Oleshky, na Ucrânia, como parte de uma operação humanitária conjunta, após meses de escassez severa de alimentos e medicamentos. A cidade, controlada pela Rússia, está localizada no lado ocupado da Bacia do Dnipro, oposta a Kherson.", "titulo_pt": "Evasão de civis começa em cidade sitiada da Ucrânia de Oleshky", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 235763, "titulo": "EU diplomats object to G20 photo with Lavrov, prompting US cancellation", "url": "https://www.euronews.com/2026/10/30/eu-diplomats-object-to-g20-photo-with-lavrov-prompting-us-cancellation", "fonte_id": "euronews", "data_pub": "2026-10-30T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diplomatas da União Europeia se opuseram a uma foto com Lavrov durante uma reunião em Atlanta, levando os EUA a cancelar a participação. A reunião prevista em Atlanta continuará conforme programado, antes de um encontro do G20 em Miami, organizado pelo presidente Donald Trump.", "titulo_pt": "Diplomatas da ue se opõem a foto com Lavrov, resultando no cancelamento da participação dos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 235869, "titulo": "Q3 GDP growth hits 14.36%, highest in 48 years", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/31/2003866891", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PIB trimestral da economia de Taiwan cresceu 14,36% em relação ao mesmo período do ano anterior, o maior crescimento anual em 48 anos.", "titulo_pt": "Crescimento do pib trimestral atinge 14,36%, maior taxa em 48 anos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 235552, "titulo": "How crypto hacking funds isolated North Korea’s nuclear programme", "url": "https://www.theguardian.com/world/2026/oct/30/how-crypto-hacking-funds-isolated-north-korea-nuclear-programme", "fonte_id": "guardian_world", "data_pub": "2026-10-30T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A roubagem de criptomoedas é estimada para gerar metade dos receitos internacionais da Coreia do Norte. Especialistas atribuíram o roubo notável de $6,3 bilhões do Binance a um grupo de hackers norte-coreanos chamado TraderTraitor, também conhecido como Grupo Lazarus.", "titulo_pt": "Como roubos de criptomoedas financiam o programa nuclear da Coreia do norte", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 235393, "titulo": "US$ 6,3 bilhões: como aconteceu o maior roubo de criptomoedas da história", "url": "https://www.dw.com/pt-br/us-6-3-bilhões-como-aconteceu-o-maior-roubo-de-criptomoedas-da-história/a-79810808?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-30T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque hacker à Binance, a maior corretora de criptomoedas do mundo, pode ter sido realizado por um grupo de elite da Coreia do Norte. O Serviço Secreto e o FBI estão investigando o s a animais de estimação. Isso elevou para 721 o total de aberturas de mercado obtidas pelo agronegócio brasileiro desde o início de 2023.", "titulo_pt": "Brasil abre mercado em Bangladesh e Colômbia para pecuária", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 235329, "titulo": "Gigantes do agro faturam R$ 1,2 trilhão, com avanço de frigoríficos e exportadoras", "url": "https://veja.abril.com.br/economia/gigantes-do-agro-faturam-r-12-trilhao-com-avanco-de-frigorificos-e-exportadoras/", "fonte_id": "veja", "data_pub": "2026-10-30T16:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As maiores empresas do setor agrícola faturaram R$ 1,2 trilhão em 2025, registrando um crescimento de 11% nas receitas comparado ao ano anterior.", "titulo_pt": "Gigantes do agronegócio faturam R$ 1,2 trilhão com avanço de frigoríficos e exportadoras", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 235180, "titulo": "Vale afirma que é improvável pagar dividendos extraordinários em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/vale-afirma-que-e-improvavel-pagar-dividendos-extraordinarios-em-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A direção da Vale afirma que é improvável a distribuição de dividendos extraordinários em 2026 devido ao declínio da produção, menores preços e elevados custos operacionais, resultado da escalada das cotações do petróleo após a guerra no Irã.", "titulo_pt": "Vale afirma que é improvável pagar dividendos extraordinários em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235181, "titulo": "Binance Brasil suspende saques após ataque hacker de US$ 6,3 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/binance-brasil-suspende-saques-apos-ataque-hacker-de-us-63-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance Brasil suspendeu os saques de clientes após um ataque hacker que resultou no roubo de quase US$ 6,3 bilhões. Os saques estão temporariamente suspensos no país.", "titulo_pt": "Binance Brasil suspende saques após ataque hacker de US$ 6,3 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235700, "titulo": "Binance hack: What we know about the largest cryptocurrency theft in history", "url": "https://www.lemonde.fr/en/pixels/article/2026/10/30/binance-hack-what-we-know-about-the-largest-cryptocurrency-theft-in-history_6767471_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-30T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TRM Labs e Chainalysis, duas empresas especializadas em análise de criptoativos, atribuíram o ataque à hackers que agem a favor do governo norte-coreano. Este ataque é considerado o maior roubo de criptomoedas na história.", "titulo_pt": "Binance hack: o que sabemos sobre o maior roubo de criptomoedas na história", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 235182, "titulo": "Fundo de private equity compra subsidiária da Evergrande", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/fundo-de-private-equity-compra-subsidiaria-da-evergrande.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fundo de private equity de Hong Kong comprou uma subsidiária da China Evergrande por US$ 513 milhões, uma operação que representa uma vitória para credores na busca por recuperar perdas com a empresa imobiliária mais endividada do mundo.", "titulo_pt": "Fundo de private equity compra subsidiária da Evergrande", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235183, "titulo": "Economia de Milei divide Argentina entre boom do petróleo e perda de empregos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/economia-de-milei-divide-argentina-entre-boom-do-petroleo-e-perda-de-empregos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diego Esquivel ouvia histórias sobre o sul da Argentina, onde os salários eram altos, havia crescimento econômico acelerado e pequenos empresários com muito dinheiro. Esquivel contrastava essa situação com a estagnação de sua própria carreira em Buenos Aires.", "titulo_pt": "Economia de Milei divide Argentina entre altos salários e estagnação profissional", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235368, "titulo": "Carbon Majors e dano climático: um novo capítulo na litigância brasileira", "url": "https://www.jota.info/opiniao-e-analise/artigos/carbon-majors-e-dano-climatico-um-novo-capitulo-na-litigancia-brasileira", "fonte_id": "jota", "data_pub": "2026-10-30T14:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas devem responder pelo dano climático decorrente de suas atividades, seja diretamente ou indiretamente. Isso marca um novo capítulo na litigância brasileira relacionada ao clima.", "titulo_pt": "Empresas e dano climático: um novo capítulo na litigância brasileira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 235184, "titulo": "Empresa recebe R$ 880 mi do BNDES para renovar 100% da frota de São José dos Campos com ônibus elétricos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/empresa-recebe-r-880-mi-do-bndes-para-renovar-100-da-frota-de-sao-jose-dos-campos-com-onibus-eletricos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES aprovou um financiamento de R$ 879,4 milhões para a Green Energy S.A. adquirir 400 ônibus elétricos e renovar 100% da frota de transporte público de São José dos Campos, SP.", "titulo_pt": "Empresa recebe R$ 879,4 mi do BNDES para renovar 100% da frota de São José dos Campos com ônibus elétricos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235185, "titulo": "Big techs perdem quase US$ 900 bilhões após manterem investimentos bilionários em IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/big-techs-perdem-quase-us-900-bilhoes-apos-manterem-investimentos-bilionarios-em-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T14:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas de big tech perderam quase US$ 900 bilhões em valor de mercado após aumentarem significativamente seus investimentos em inteligência artificial no terceiro trimestre. Esses investimentos bilionários transformaram negócios lucrativos em grandes consumidores de caixa enquanto as empresas apostam no futuro da IA.", "titulo_pt": "Big techs perdem quase US$ 900 bilhões após aumentarem investimentos em IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235438, "titulo": "Binance sofre ataque hacker de US$ 6,3 bilhões: por que Coreia do Norte pode estar por trás do possível maior roubo da história das criptomoedas", "url": "https://www.bbc.com/portuguese/articles/c820v2x0zvqko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-30T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas empresas de análise de dados sugeriram que o ataque hacker que resultou em um prejuízo de US$ 6,3 bilhões na Binance pode ter sido cometido por hackers de um grupo norte-coreano chamado TraderTraitor.", "titulo_pt": "Binance sofre ataque hacker de US$ 6,3 bilhões: empresas sugerem que Coreia do Norte pode estar por trás", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 235860, "titulo": "Apple to lower App Store commission rate to 26% today", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/31/2003866922", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple reduzirá a taxa de comissão na App Store para 26% a partir de hoje. A decisão visa aliviar as preocupações sobre a alta taxa de 30% que tem sido criticada por desenvolvedores de aplicativos.", "titulo_pt": "Apple reduzirá comissão na App Store para 26%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 235793, "titulo": "Anthropic may not secure investment-grade rating after IPO, Blackstone says", "url": "https://www.ft.com/content/59383c7f-8d82-493f-bf01-d2e862a1018f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-30T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Blackstone afirma que a Anthropic pode não obter uma classificação de investimento de grau após a oferta inicial de ações. A empresa espera que a classificação seja 'alta' lixo, um ajuste de sua orientação anterior.", "titulo_pt": "Anthropic pode não conseguir classificação de investimento após IPO, diz Blackstone", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 235756, "titulo": "The AI investing story had a rough week. It may be time to take profits while you still can", "url": "https://www.cnbc.com/2026/10/30/ai-stocks-selloff-ai-spending-returns.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-30T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Traders e investidores estão expressando cautela em relação à tecnologia após uma semana cheia de notícias. A história da investimento em inteligência artificial teve uma semana difícil.", "titulo_pt": "A história dos investimentos em AI teve uma semana difícil. É hora de lucrar enquanto ainda pode?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 235178, "titulo": "Empresa chinesa cria aparelho com IA e laser para caçar mosquitos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/empresa-chinesa-cria-aparelho-com-ia-e-laser-para-cacar-mosquitos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma empresa chinesa desenvolveu um aparelho que combina inteligência artificial e laser para combater mosquitos. O dispositivo promete oferecer uma solução para quem sofre com as picadas de mosquitos durante a noite.", "titulo_pt": "Empresa chinesa desenvolve aparelho com IA e laser para combater mosquitos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235878, "titulo": "N. Korean hackers blamed for record US$6.36 bln Binance cryptocurrency theft: U.S. firm", "url": "https://en.yna.co.kr/view/AEN20261031000200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hackeras supostamente da Coreia do Norte foram acusadas de roubarem criptomoedas valendo US$6,36 bilhões da plataforma Binance, segundo uma empresa americana.", "titulo_pt": "Hackers da Coreia do norte acusados de roubar US$6,36 bilhões em criptomoedras da Binance", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 235920, "titulo": "People Are Creating ‘Survival Guides’ to Cope With the ‘AO3 Apocalypse’", "url": "https://www.wired.com/story/people-are-creating-survival-guides-to-cope-with-the-ao3-apocalypse/", "fonte_id": "wired", "data_pub": "2026-10-30T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O site de fanfics AO3 pode estar fora do ar por semanas devido a uma 'incidente de segurança'. Os usuários estão reagindo negativamente à situação.", "titulo_pt": "Pessoas estão criando 'guias de sobrevivência' para lidar com a 'apocalipse AO3'", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 235921, "titulo": "I Spent 30 Minutes With Apple’s CEO. Now I Know Why John Ternus Got the Job", "url": "https://www.wired.com/story/i-spent-30-minutes-with-apples-ceo-now-i-know-why-john-ternus-got-the-job/", "fonte_id": "wired", "data_pub": "2026-10-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Ternus, o novo líder de uma empresa que não precisa de reformas e não deseja causar drama, é um 'produtor' que ama seis cores.", "titulo_pt": "Eu passei 30 minutos com o CEO da Apple. Agora sei por que John Ternus obteve o cargo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 235942, "titulo": "Pope Leo calls for the disarmament of AI: ‘Machines are tools, not persons’", "url": "https://www.theverge.com/ai-artificial-intelligence/1023188/pope-leo-disarm-ai", "fonte_id": "the_verge", "data_pub": "2026-10-30T14:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Leo XIV chamou para a desarmamentização de sistemas de inteligência artificial, afirmando que as máquinas são ferramentas e não seres humanos. Ele incentivou os Estados membros das Nações Unidas a tomarem medidas concretas para banir armas autônomas letais durante sua reunião em Genebra no mês seguinte.", "titulo_pt": "Papa Leo chama para desarmamentização de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 235347, "titulo": "A disputa do mercado corporativo por executivos especializados em IA — e como fazer parte", "url": "https://exame.com/inteligencia-artificial/a-disputa-do-mercado-corporativo-por-executivos-especializados-em-ia-e-como-fazer-parte/", "fonte_id": "exame", "data_pub": "2026-10-30T14:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estão procurando líderes que possam integrar a inteligência artificial aos objetivos comerciais da organização. O mercado corporativo está em disputa por profissionais especializados em IA.", "titulo_pt": "A disputa do mercado corporativo por executivos especializados em IA — e como fazer parte", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 235554, "titulo": "Experts warn AI copyright changes could breach Australian constitution and spark huge compensation rights case", "url": "https://www.theguardian.com/law/2026/oct/31/experts-warn-ai-copyright-changes-could-breach-australian-constitution-and-spark-huge-compensation-rights-case", "fonte_id": "guardian_world", "data_pub": "2026-10-30T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peritos advertiram que alterações nas leis de direitos autorais para permitir que empresas de IA extraiam material protegido por direitos autorais da internet poderiam violar a Constituição australiana e levantar casos de compensação coletiva de grande escala. O departamento do Advogado-Geral admitiu estar 'extremamente atento' ao problema.", "titulo_pt": "Peritos alertam que mudanças nas leis de direitos autorais para IA poderiam violar a constituição australiana", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 235356, "titulo": "Binance diz que contas de usuários brasileiros estão seguras e segregadas após hack", "url": "https://exame.com/future-of-money/binance-diz-que-contas-de-usuarios-brasileiros-estao-seguras-e-segregadas-apos-hack/", "fonte_id": "exame", "data_pub": "2026-10-30T13:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance afirmou que as contas dos usuários brasileiros estão seguras e segregadas após sofrer um incidente de segurança que resultou em um prejuízo de US$ 6,3 bilhões, o maior da história do setor cripto.", "titulo_pt": "Binance afirma que contas de usuários brasileiros estão seguras após hack de us$ 6,3 bilhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 235945, "titulo": "Silicon Valley wants you to invest in miracles", "url": "https://www.theverge.com/ai-artificial-intelligence/1023070/anthropic-ipo-risk-factors-filing-miracles", "fonte_id": "the_verge", "data_pub": "2026-10-30T13:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investir em ações envolve apostar no futuro de uma empresa, mas como se deve investir em tecnologias que podem trazer benefícios ou riscos extremos para a humanidade? A indústria de tecnologia está buscando atrair investidores para esses tipos de tecnologias avançadas.", "titulo_pt": "Silicon Valley quer que você invista em milagres", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 235946, "titulo": "Sam Altman sympathizes with mathematicians, but says OpenAI’s math onslaught won’t stop", "url": "https://www.theverge.com/ai-artificial-intelligence/1023054/altman-cheeky-pint-ai-math-interview", "fonte_id": "the_verge", "data_pub": "2026-10-30T13:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO da OpenAI, expressou empatia pelos matemáticos sobrecarregados com resultados gerados por IA, mas declarou que a empresa não pretende parar de compartilhar esses resultados. Ele sinalizou que pode haver muito mais descobertas vindas do estoque de descobertas da OpenAI.", "titulo_pt": "Sam Altman se solidariza com matemáticos, mas OpenAI não parará de divulgar resultados de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 235191, "titulo": "Livro conta como internet virou shopping center e está tomada por robôs e cassinos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/10/livro-conta-como-internet-virou-shopping-center-e-esta-tomada-por-robos-e-cassinos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro \"A Internet Não Precisa Ser Assim\" explora como a internet se transformou em um shopping center, repleto de robôs e cassinos. A capa ilustrada pelo personagem TVnauta de ponta-cabeça sugere que, apesar das conexões, as pessoas ainda se sentem sozinhas e desorientadas online.", "titulo_pt": "Livro conta como a internet se tornou um shopping center cheio de robôs e cassinos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 235361, "titulo": "Como plataforma de turismo usa IA para transformar o trabalho de agentes de viagens", "url": "https://exame.com/bussola/como-plataforma-de-turismo-usa-ia-para-transformar-o-trabalho-de-agentes-de-viagens/", "fonte_id": "exame", "data_pub": "2026-10-30T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova plataforma utiliza inteligência artificial para conectar fornecedores e oferecer condições comerciais, permitindo que agentes de viagens obtenham cotações por texto e áudio no WhatsApp.", "titulo_pt": "Plataforma de turismo usa IA para facilitar trabalho de agentes de viagens", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 235794, "titulo": "Did Anthropic value itself at $1.2tn in August?", "url": "https://www.ft.com/content/60fb40ed-f1bf-416e-982b-1b9b80582ab4", "fonte_id": "financial_times", "data_pub": "2026-10-30T12:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Anthropic avaliou seu próprio valor em cerca de 1,2 trilhões de dólares em agosto. O Navier-Stokes, que não é mencionado diretamente, pode se referir a um conceito matemático ou a outro aspecto da empresa não detalhado no trecho.", "titulo_pt": "Anthropic avaliou seu próprio valor em 1,2 trilhões de dólares em agosto", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 235955, "titulo": "Global wildlife trade is twice previous species estimates, but major data gaps suggest true scale is even larger", "url": "https://phys.org/news/2026-10-global-wildlife-previous-species-major.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 107.000 espécies são utilizadas e comercializadas globalmente, o que representa mais do que o dobro das estimativas anteriores. No entanto, grandes lacunas nos dados de comércio e coleta de vida selvagem sugerem que o verdadeiro escopo possa ser ainda maior.", "titulo_pt": "Comércio mundial de vida selvagem é duas vezes as estimativas anteriores, mas lacunas significativas sugerem que o verdadeiro escopo pode ser ainda maior", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 235467, "titulo": "Christina Koch, astronauta y ganadora del premio Princesa de Asturias: “La gente se preocupa por si cambiaremos la Luna igual que hemos cambiado la Tierra; esa es nuestra elección”", "url": "https://www.lanacion.com.ar/el-mundo/christina-koch-astronauta-y-ganadora-del-premio-princesa-de-asturias-la-gente-se-preocupa-por-si-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A astronauta Christina Koch, ganhadora do prêmio Princesa de Asturias, expressou preocupação sobre a possibilidade de a humanidade alterar a Lua da mesma forma que modificou a Terra. Essa declaração foi feita após o completamento bem-sucedido de um sobrevoo lunar durante a missão Artemis II.", "titulo_pt": "Christina Koch, astronauta e vencedora do prêmio Princesa de Asturias: 'a humanidade pode mudar a lua da mesma forma que mudou a terra'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 235980, "titulo": "This Halloween, amateur astronomers may be in for a dwarf planet treat", "url": "https://www.sciencenews.org/article/halloween-astronomers-dwarf-planet", "fonte_id": "science_news", "data_pub": "2026-10-30T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amadores podem ter uma surpresa no Halloween com a observação de um planeta anão. A Observatória Vera Rubin está proporcionando novas informações sobre as regiões distantes além Netuno, incluindo possíveis blocos de construção do sistema solar.", "titulo_pt": "Neste Halloween, amadores podem ter uma surpresa com um planeta anão", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 235981, "titulo": "‘Exhumed’ recounts the true story of America’s first vampire", "url": "https://www.sciencenews.org/article/exhumed-aaron-mahnke-vampire-book", "fonte_id": "science_news", "data_pub": "2026-10-30T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo livro, criado pelo vencedor de prêmios Aaron Mahnke, explora a história verdadeira dos Estados Unidos em relação ao primeiro vampiro, misturando ciência, história e medo.", "titulo_pt": "Exumado", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 235991, "titulo": "‘Paleo lighting’ can fix your brain’s clock after daylight savings", "url": "https://www.scientificamerican.com/article/paleo-lighting-can-fix-your-brains-clock-after-daylight-savings/", "fonte_id": "scientific_american", "data_pub": "2026-10-30T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O horário de verão será ajustado este fim de semana, oferecendo a oportunidade de se adaptar ao ritmo de luz do período paleolítico. Isso pode ajudar a regular o relógio biológico do cérebro.", "titulo_pt": "Ajuste de horário pode regular o relógio biológico da sua mente", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 236012, "titulo": "NASA’s James Webb Space Telescope Captures Eerie Cat’s Head", "url": "https://www.nasa.gov/image-article/nasas-james-webb-space-telescope-captures-eerie-cats-head/", "fonte_id": "nasa_news", "data_pub": "2026-10-30T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's James Webb Space Telescope capturou estruturas intricadas dentro da Nebulosa do Gato, em uma visão infravermelha do meio-infravermelho divulgada em 29 de outubro de 2026. A forma característica de 'gato' da nebulosa foi provavelmente modelada ao longo do tempo pela radiação ultravioleta intensa e pelo vento de estrelas massivas na Nebulosa Carina.", "titulo_pt": "James Webb Space Telescope da nasa captura estruturas intricadas da nebulosa do gato", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 235992, "titulo": "This October is on track to be the hottest ever recorded", "url": "https://www.scientificamerican.com/article/this-october-is-on-track-to-be-the-hottest-ever-recorded/", "fonte_id": "scientific_american", "data_pub": "2026-10-30T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Projeções globais indicam que outubro deste ano pode ser o mais quente já registrado, com uma temperatura 1,76 graus Celsius acima das médias pré-industriais.", "titulo_pt": "Este outubro está no caminho para ser o mais quente já registrado", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 235982, "titulo": "NASA’s Swift telescope will face a fiery demise after a failed rescue", "url": "https://www.sciencenews.org/article/nasa-swift-telescope-gamma-ray-burst", "fonte_id": "science_news", "data_pub": "2026-10-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O telescópio Swift da NASA, projetado para estudar explosões poderosas, fez várias descobertas importantes. Agora, está prestes a enfrentar um fim em chamas.", "titulo_pt": "Telescópio Swift da nasa enfrentará fim em chamas após falha no resgate", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 236013, "titulo": "NASA Explores Potential Commercial Servicing for Hubble Telescope", "url": "https://science.nasa.gov/missions/hubble/nasa-explores-potential-commercial-servicing-for-hubble-telescope/", "fonte_id": "nasa_news" iencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/nova-tecnologia-de-dna-ligou-ted-bundy-a-morte-de-adolescente-em-1974.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-30T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Avanços recentes em ciência forense, incluindo um software que pode reconstruir DNA degradado, permitiram que as autoridades de Utah atribuíssem o assassinato de uma adolescente em 1974 a Ted Bundy. O caso, arquivado há 52 anos, foi encerrado nesta semana.", "titulo_pt": "Nova tecnologia de DNA ligou Ted Bundy ao assassinato de adolescente em 1974", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 235950, "titulo": "How Election Day can affect your heart", "url": "https://www.statnews.com/2026/10/30/election-stress-heart-attack-risk/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-30T14:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos associam o estresse decorrente das campanhas eleitorais a batimentos cardíacos irregulares e aumentos no número de infartos.", "titulo_pt": "Como o dia das eleições pode afetar o seu coração", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 235352, "titulo": "Cientistas ultrapassam limite da física ao gerar raios X com efeito quântico inesperado", "url": "https://exame.com/ciencia/cientistas-ultrapassam-limite-da-fisica-ao-gerar-raios-x-com-efeito-quantico-inesperado/", "fonte_id": "exame", "data_pub": "2026-10-30T14:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas realizaram um experimento que demonstrou que dois elétrons podem liberar energia simultaneamente, gerando fótons mais energéticos do que o modelo convencional de física previa.", "titulo_pt": "Cientistas superam limites da física ao gerar raios-x com efeito quântico inesperado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 235202, "titulo": "Armário oferece retrato da vid ", "provavel_duplicata_de": null, "texto_pt": "O psicólogo Gabriel Rolón, em entrevista para LA NACION, discutiu a complexidade dos vínculos humanos, a reinterpretação do presente e o risco de depositar a felicidade em promessas futuras. Ele descreveu a felicidade como um estado onde o passado, o presente desejado e o medo de coexistir se misturam.", "titulo_pt": "A reflexão de Gabriel Rolón sobre a felicidade: 'é aquele momento de eternidade onde o que você foi, quer ser, te atormenta e teme coexistem'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 235463, "titulo": "Gabriel Rolón, sobre la finitud: “Ser humano es vivir con el sentimiento trágico de la vida”", "url": "https://www.lanacion.com.ar/sociedad/gabriel-rolon-sobre-la-finitud-ser-humano-es-vivir-con-el-sentimiento-tragico-de-la-vida-nid28102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gabriel Rolón, psicoanalista e escritor, discute a natureza trágica da vida, o amor e a morte, e como o desejo causa desconforto. Essas reflexões foram feitas em uma entrevista exclusiva para LN+.", "titulo_pt": "Gabriel Rolón, sobre a finitude: 'ser humano é viver com o sentimento trágico da vida'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 235464, "titulo": "Gabriel Rolón, psicoanalista: “Estamos tan atravesados por opiniones ajenas que quedamos excéntricos a nosotros mismos”", "url": "https://www.lanacion.com.ar/sociedad/gabriel-rolon-psicoanalista-estamos-tan-atravesados-por-opiniones-ajenas-que-quedamos-excentricos-a-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gabriel Rolón, psicoanalista, afirma que as opiniões dos outros afastam o indivíduo de sua própria vontade. Segundo ele, estamos tão influenciados por opiniões alheias que nos tornamos excêntricos em relação a nós m asse": "B"}, {"id": 234879, "titulo": "DR Congo: MSF celebrates Ebola patient discharges in Ituri province", "url": "https://www.euronews.com/video/2026/10/30/dr-congo-msf-celebrates-ebola-patient-discharges-in-ituri-province", "fonte_id": "euronews", "data_pub": "2026-10-30T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Danzas e cantos eclodiram em um centro de tratamento de Ebola na República Democrática do Congo quando os últimos pacientes foram liberados. É a primeira vez desde maio que o centro administrado pela MSF não tem casos confirmados em tratamento, apesar da epidemia continuar em escala maior.", "titulo_pt": "República democrática do Congo: MSF comemora saídas de pacientes de Ebola na província de Ituri", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234581, "titulo": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "url": "https://www.cnnbrasil.com.br/ciencia/cinco-regioes-de-corais-no-brasil-estao-em-estado-critico-e-correm-risco-de-colapso/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso devido a poluição marinha, atividades de navegação e mudanças climáticas. A exploração de petróleo e gás também contribuem para o branqueamento dos corais.", "titulo_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234963, "titulo": "Fire pollution killed 3,560 people in Indonesia in September, report says", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-wildfire-toll/", "fonte_id": "japan_times", "data_pub": "2026-10-30T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que 3.560 pessoas morreram devido à poluição de fumaça em setembro na Indonésia. Cerca de 57,8 milhões de pessoas nesse mesmo mês estavam expostas a ar considerado inadequado ou perigoso.", "titulo_pt": "Incêndios causaram a morte de 3.560 pessoas na indonésia em setembro, relatório diz", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234995, "titulo": "Indonesia’s wildfire smoke crisis claims over 3,500 lives in September", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372692/indonesias-wildfire-smoke-crisis-claims-over-3500-lives-september", "fonte_id": "scmp", "data_pub": "2026-10-30T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que cerca de 3.560 mortes no arquipélago indonésio em setembro foram causadas pela poluição resultante de fumos emitidos por incêndios florestais que duraram meses. Cerca de 57,8 milhões de pessoas na Indonésia estavam expostas a ar nocivo ou perigoso no mesmo mês, de acordo com a CREA, um think tank baseado em Helsinhigi.", "titulo_pt": "Crise de fumaça de incêndios florestais na indonésia causa mais de 3.500 mortes em setembro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 233628, "titulo": "Informe oficial: ya se evacuaron 147.500 vacunos y búfalos de las zonas inundadas del Litoral", "url": "https://www.lanacion.com.ar/economia/campo/informe-oficial-ya-se-evacuaron-147500-bovinos-y-bufalos-de-las-zonas-inundadas-del-litoral-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço Nacional de Sanidade e Qualidade Agroalimentar (Senasa) informa que 147.500 animais de rebanho já foram evacuados das áreas afetadas pela inundação no Litoral. A quantidade de animais transferidos desde agosto aumentou 102% em comparação com o mesmo período de 2025.", "titulo_pt": "Relatório oficial: 147.500 animais foram evacuados das áreas inundadas no Litoral", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 234026, "titulo": "Indonesia rain set to ease toxic haze in Singapore and Malaysia", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-haze-rain/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A neblina tóxica causada pelas chamas da pior temporada de incêndios na história da Indonésia tem coberto cidades locais e se espalhado para países vizinhos durante semanas. A chuva prevista deve aliviar essa situação.", "titulo_pt": "Chuva deve amenizar neblina tóxica causada por incêndios na indonésia em singapura e malásia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233708, "titulo": "El Niño-driven drought in Papua New Guinea a ‘national crisis’ as rivers dry up and local farms fail", "url": "https://www.theguardian.com/world/2026/oct/30/png-el-nino-drought-papua-new-guinea", "fonte_id": "guardian_world", "data_pub": "2026-10-30T01:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um histórico fenômeno El Niño está causando uma severa escassez de alimentos, água e energia elétrica, afetando até 8 milhões de pessoas em Papua Nova Guiné. O país está enfrentando uma crise nacional devido à seca extrema, com encerramentos de clínicas de saúde e interrupções no ensino.", "titulo_pt": "Seca provocada pelo el niño em Papua nova Guiné se torna uma ‘crise nacional’", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233408, "titulo": "Equipe bate recorde ao capturar mais de 300 peixes-leão em Noronha", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/pe/equipe-bate-recorde-ao-capturar-mais-de-300-peixes-leao-em-noronha/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T01:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma equipe capturou mais de 300 peixes-leão em Fernando de Noronha durante uma operação para conter a espécie invasora q function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';

}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

(function () {

  }

  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
