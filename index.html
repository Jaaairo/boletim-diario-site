<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

las traições, incluindo uma suposta conexão com uma espiã chinesa. Em meio a isso, Donald Trump se prepara para uma cúpula trilateral histórica com Xi Jinping e Vladimir Putin na China, onde planeja discutir a redução das armas nucleares, sem tocar na guerra na Ucrânia. A reunião também será marcada por uma discussão sobre inteligência artificial, com os 27 membros da União Europeia se reunindo em Dublin para discutir o desafio de chegar a um consenso sobre o tema. No Brasil, Lula busca fortalecer os laços com o Sudeste Asiático, participando pela segunda vez consecutiva da cúpula de líderes da ASEAN. Em outro ponto do mundo, a Hungria enfrenta uma crise humanitária agravada por cortes no auxílio internacional, enquanto a República da Colômbia promove uma batalha cultural ultradireitista. Além disso, a detenção de um capitão da Força Aérea dos EUA em Okinawa por suposto direcionamento sob efeito de álcool e o cancelamento de declarações do presidente Lula nas Filipinas devido ao desgaste vocal também marcam a semana internacional.\n\nIsrael x Palestina: o secretário da Bahia, Felipe Freitas, prometeu uma resposta rápida e firme após incidentes entre turistas israelenses e ativistas palestinos. Na geopolítica internacional, líderes como Donald Trump, Xi Jinping e Vladimir Putin se reuniram pela primeira vez em uma cúpula tripartida na China, discutindo temas como a situação no Irã e armas nucleares. O Qatar e a Turquia assinaram um pacto de defesa mútua, fortalecendo sua parceria diante de crescentes tensões regionais. Além disso, a União Europeia enfrenta desafios na produção de chips, enquanto o Departamento de Comércio dos Estados Unidos é acusado de atrasar medidas contra exportações de chips para a China. O incidente no Estreito de Ormuz, com relatos de 25 marinheiros mortos, aumentou as tensões entre potências globais. O terremoto no Peru durante a visita do papa não afetou diretamente a geopolítica, mas destacou a instabilidade natural em regiões importantes para o mundo.", "economia": "O Conselho Administrativo de Recursos Fiscais (Carf) decidiu que não são aplicáveis IRPJ e CSLL sobre os incentivos de ICMS concedidos à Cervejaria Petrópolis, em um processo que envolve um valor de aproximadamente R$ 200 milhões. No entanto, dúvidas fiscais estão afetando o desempenho do Brasil em comparação com outros emergentes, como o sul-coreano e o mexicano, segundo analistas. O governo Lula está mobilizando esforços para desmistificar o discurso de censura em torno do projeto de regulação dos mercados digitais e planeja votar o PL 4.675/2025 na Câmara dos Deputados na próxima semana. O Nubank recebeu aval do Banco Central para obter a licença bancária e concluiu a compra do Banco Porto Real, permitindo-lhe usar a nomenclatura 'banco' conforme a legislação vigente. O dólar encerrou o dia cotado a R$ 5,65, atingindo o maior patamar desde junho de 2023, enquanto a Bolsa de valores subiu 0,66%. A confiança da indústria atingiu o menor nível desde maio de 2020, caindo para 40,2 pontos em novembro, refletindo um pessimismo prolongado no setor. Além disso, a Caixa Econômica Federal aumentou as provisões para perdas com empréstimos e reduziu a concessão de crédito ao agronegócio devido ao aumento da inadimplência, que atingiu 25,44% em setembro.", "tecnologia": "A inteligência artificial (IA) continua desempenhando um papel crucial em diversos setores. A polícia de Hong Kong planeja ativar o reconhecimento facial baseado em IA em sua rede de vigilância a partir de segunda-feira, permitindo a identificação de pessoas mesmo com máscaras ou métodos de evasão. Além disso, a China está utilizando big data para melhorar o recrutamento do Exército Popular da China, visando criar uma força militar focada na preparação para guerra. A Microsoft enfrentou uma interrupção global de seus serviços que durou mais de um dia, afetando empresas e agências governamentais em todo o mundo. A empresa se retratou após o incidente, que impactou a operação de voos e serviços de e-mail. A SpaceX também realizou um voo de teste para tentar capturar tanto o fogueto Super Heavy quanto a parte superior do fogueto Starship no local de lançamento em Starbase, Texas, mas o primeiro estágio do fogueto falhou e acabou no Golfo do México em vez de retornar ao pouso na base de Texas.", "ciencia": "A SpaceX realizou uma missão ousada com o Starship, lançando a espaçonave em uma órbita terrestre durante o 15º teste, mas a tentativa de capturar o foguete durante o retorno falhou. O evento mais impactante foi a demissão de cientistas envolvidos no primeiro experimento de edição genética no cérebro de uma criança, que resultou na morte de uma menina de seis anos em Shanghai. Este caso levou a uma investigação oficial que concluiu que os pesquisadores violaram regras de pesquisa e receberam dinheiro da família da menina. Em relação à medicina do futuro, a medicina preventiva é vista como essencial para a sustentabilidade dos sistemas de saúde, destacando-se a necessidade de ações preventivas antes do tratamento. Além disso, a descoberta de um novo dinossauro sul-africano, Nyana rooiwalensis, que pesava cerca de 400 quilogramas mesmo jovem, chama a atenção para a evolução dos dinossauros.", "cultura": "O Papa Francisco recebeu um acolhimento heroico de multidões massivas no Peru, em sua volta para sua diocese anterior. Cerca de um milhão de pessoas se reuniram ao longo do percurso do carro oficial do Papa, enquanto cerca de 500 mil fiéis assistiram à missa. Este evento marcou um momento histórico, com o Papa retornando a uma região que foi sua diocese anterior, recebendo um grande apoio e reconhecimento. Em outra notícia cultural, o Festival Estilo Brasil uniu as gerações de Samuel Rosa e Flávio Venturini, apresentando músicas de suas bandas ao público no dia 13 de novembro. Além disso, a artista coreana Paek Yun-ju expôs uma pintura em óleo intitulada 'Free Riders' no museu regional do Louvre em Lens, França, como parte de uma exposição que explora a ideia de fofura em arte. A exposição 'So Cute! O Arte da Felicidade' permanece aberta até 18 de janeiro.", "sociedade": "A sociedade brasileira enfrenta diversos desafios, como mostra os artigos. O caso de Douglas Ruas, que recebeu R$ 4 milhões de fornecedores da prefeitura do seu pai, chama a atenção para a corrupção na política. Além disso, a pesquisa 'Cuidar a democracia hoje', realizada no Chile, mostra que, embora os chilenos valorizem a democracia, poucos acreditam em sua capacidade de melhoria. No Brasil, o aumento previsto de 44% no número de adultos com diabetes até 2050, conforme dados da International Diabetes Federation, destaca a necessidade de ações preventivas. A Lei que aumentou o período de licença parental na Coreia do Sul, aprovada pelo parlamento, reflete a importância de políticas que beneficiam os trabalhadores. No Brasil, a fuga do senador Flávio Bolsonaro teve impacto negativo na sua imagem, conforme pesquisa do AtlasIntel, e a situação de greve dos médicos em unidades de saúde da zona sul do Rio de Janeiro revela as tensões no sistema de saúde. O aumento no registro de violência nas escolas estaduais de São Paulo, que subiu 73,83% em 2024, é outro problema emergente que preocupa os educadores e os pais. Ainda, a Doença de Chagas que levou à morte de uma mulher durante um voo de Brasília para Porto Velho, e o incêndio em uma indústria química em Salto que deixou nove feridos, mostram os riscos à saúde e segurança da população.", "meio_ambiente": "O Chile se prepara para enfrentar um verão extremo com alto risco de incêndios devido à seca prolongada causada pelo El Niño, estabelecendo uma meta de 7 mil km de cortafogo e utilizando tecnologias de informação satelital. No Brasil, a previsão é de um El Niño forte até 2027, aumentando o risco de agravamento da disponibilidade de água e possíveis cheias. No âmbito da COP31, o Brasil apresentará um plano para cidades mais resilientes, inspirado nos planos para o fim do desmatamento e a transição para energias renováveis. Em Portugal e no sul de Espanha, a tempestade Charles causou alagamentos e cancelamentos de voos, enquanto a Amazônia enfrenta incêndios que afetam a saúde e o bolso do Brasil inteiro. O Fundo Florestas Tropicais para Sempre, lançado por Lula, pode fracassar por falta de recursos, enquanto o programa de crédito climático do governo federal está sendo usado para financiar a construção de apartamentos de luxo, o que levanta questionamentos sobre a efetividade do uso dos fundos.", "direitos_humanos": "A situação humanitária em Gaza se agravou com a chegada do inverno e as chuvas, afetando milhares de palestinos, incluindo crianças e grávidas. A Fepal, em um discurso, afirmou que Gaza é uma prisão a céu aberto onde Israel promove uma limpeza étnica, reforçando a violência contra a população local. No Brasil, a maioridade penal no G20 é fixada em 18 anos, conforme a posição do Unicef de que nenhum país do bloco adota a responsabilização penal antes dessa idade. A jornalista Daphne Caruana Galizia, que investigava corrupção em Malta, foi assassinada em um atentado à bomba há nove anos, e seus filhos continuam lutando pela justiça."}, "resumo_do_dia": {"politica_nacional": [{"id": 263209, "titulo": "Vice de Nunes pediu investigação sobre servidor que usou camisa comunista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/vice-de-nunes-pediu-investigacao-sobre-servidor-que-usou-camisa-comunista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-prefeito de São Paulo, Ricardo Mello Araújo, denunciou à Controladoria Geral do Município a possibilidade de um servidor estar usando uma camisa com símbolos comunistas no prédio da prefeitura.", "titulo_pt": "Vice-prefeito denuncia servidor com camisa comunistas no gabinete", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 263327, "titulo": "Semana após o 2º turno teve 73% das denúncias de assédio eleitoral de 2026", "url": "https://www.metropoles.com/brasil/semana-apos-o-2o-turno-teve-73-das-denuncias-de-assedio-eleitoral-de-2026", "fonte_id": "metropoles", "data_pub": "2026-11-14T08:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No período de uma semana após o segundo turno das eleições de 2026, 73% das denúncias de assédio eleitoral foram registradas. Ao todo, foram contabilizadas 831 denúncias de assédio eleitoral durante as eleições de 2026.", "titulo_pt": "Semana após o 2º turno registrou 73% das denúncias de assédio eleitoral de 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263420, "titulo": "Reforma do Judiciário: a curva, a autoescola e o piloto automático", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/reforma-do-judiciario-a-curva-a-autoescola-e-o-piloto-automatico", "fonte_id": "jota", "data_pub": "2026-11-14T08:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Discute-se a reforma do Judiciário, focando-se em mandatos de ministros e em 'moralização', como se o problema estivesse restrito a essa instituição.", "titulo_pt": "Reforma do Judiciário: a curva, a autoescola e o piloto automático", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263355, "titulo": "Crise no BB pode dificultar aproximação de Lula com agro, diz especialista", "url": "https://www.cnnbrasil.com.br/agro/crise-no-bb-pode-dificultar-aproximacao-de-lula-com-agro-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista alertou que a crise no Banco do Brasil pode dificultar a aproximação do presidente Lula com o agronegócio. Ele também disse que responsabilizar o setor agrícola pela inadimplência pode aumentar o desgaste com a bancada ruralista no Congresso.", "titulo_pt": "Crise no BB pode dificultar aproximação de Lula com o agronegócio, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263329, "titulo": "Rachado, PL arrasta decisão sobre disputar comando da Câmara e pressão sobe", "url": "https://www.metropoles.com/brasil/rachado-pl-arrasta-decisao-sobre-disputar-comando-da-camara-e-pressao-sobe", "fonte_id": "metropoles", "data_pub": "2026-11-14T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A consulta interna do Partido Liberal (PL) adiou a decisão sobre a disputa pelo comando da Câmara até pelo menos 15 dias. Flávio, um dos líderes do partido, rejeitou o apoio ao candidato Motta. O partido ainda não definiu seu próprio candidato.", "titulo_pt": "PL adia decisão sobre disputar comando da Câmara e pressão aumenta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263331, "titulo": "Marinho aposta em desgaste de Alcolumbre para unir oposição no Senado", "url": "https://www.metropoles.com/brasil/marinho-aposta-em-desgaste-de-alcolumbre-para-unir-oposicao-no-senado", "fonte_id": "metropoles", "data_pub": "2026-11-14T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Marinho espera usar a pressão para desgastar o presidente do Senado, Davi Alcolumbre, com a intenção de unir a oposição no Senado. Aliados visam repetir a estratégia de 2019, quando a pressão sobre senadores contribuiu para a derrota de Renan Calheiros.", "titulo_pt": "Marinho aposta em desgaste de Alcolumbre para unir a oposição no Senado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263333, "titulo": "Em meio a crise com Nunes, vice-prefeito quer se encontrar com Bolsonaro", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/em-meio-a-crise-com-nunes-vice-prefeito-quer-se-encontrar-com-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-11-14T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-prefeito Mello Araújo (PL) declarou à Metrópoles que pode se candidatar em 2028 se houver o desejo de Jair Bolsonaro. Araújo está em meio a uma crise com o deputado federal Eduardo Nunes.", "titulo_pt": "Vice-prefeito quer se encontrar com Bolsonaro em meio a crise com Nunes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263361, "titulo": "Congresso rebate Dino e pede que STF barre ajustes sobre fim da escala 6×1", "url": "https://www.cnnbrasil.com.br/politica/congresso-rebate-dino-e-pede-que-stf-barre-ajustes-sobre-fim-da-escala-6x1/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional pediu ao Supremo Tribunal Federal (STF) que não confirme os pontos da decisão que permitiriam ajustes sobre o fim da escala 6×1. Quatro ministros já votaram com o relator em um julgamento virtual.", "titulo_pt": "Congresso pede ao STF que não confirme ajustes sobre fim da escala 6×1", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263363, "titulo": "Na 1ª visita de Estado após reeleição, Lula critica extremismo e ingerência", "url": "https://www.cnnbrasil.com.br/politica/na-1a-visita-de-estado-apos-reeleicao-lula-critica-extremismo-e-ingerencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula realizou sua primeira visita oficial após a reeleição em Manila, onde criticou o extremismo e a ingerência externa. Ele enfatizou que o Brasil escolheu a soberania e a democracia nas eleições de 25 de outubro.", "titulo_pt": "Na 1ª visita de Estado após reeleição, Lula critica extremismo e ingerência em manila", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263210, "titulo": "Raquel Lyra exonera comissionados do PL e se aproxima de aliados de Lula após eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/raquel-lyra-exonera-comissionados-do-pl-e-se-aproxima-de-aliados-de-lula-apos-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora reeleita de Pernambuco, Raquel Lyra (PSD), se reuniu com senadores eleitos do PT, Humberto Costa e Marília Arraes, do PDT, que são aliados do governo federal de Lula. Como resultado, ela exonerou comissionados do partido PL, indicando uma aproximação com a base governista após as eleições.", "titulo_pt": "Raquel Lyra exonera comissionados do PL e se aproxima de aliados de Lula após eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 263340, "titulo": "Moraes determina prisão de morador do DF condenado a 14 anos pelo 8/1", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-determina-prisao-de-morador-do-df-condenado-a-14-anos-pelo-8-1", "fonte_id": "metropoles", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) Alexandre Moraes determinou a prisão de um morador do Distrito Federal que foi condenado a 14 anos de prisão. O condenado gravou um vídeo durante os ataques, dizendo 'Tudo dominado'.", "titulo_pt": "Moraes determina prisão de condenado a 14 anos pelo 8/1", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263423, "titulo": "O PL da lei geral do controle concentrado e a reforma do processo constitucional", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-pl-da-lei-geral-do-controle-concentrado-e-a-reforma-do-processo-constitucional", "fonte_id": "jota", "data_pub": "2026-11-14T05:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute o PL da lei geral do controle concentrado e a reforma do processo constitucional, focando em aspectos de generalidade e abstração.", "titulo_pt": "Notas sobre generalidade e abstração", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263211, "titulo": "Ministério dos Direitos Humanos contabiliza 831 denúncias de assédio eleitoral e violência política", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/ministerio-dos-direitos-humanos-contabiliza-831-denuncias-de-assedio-eleitoral-e-violencia-politica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério dos Direitos Humanos e da Cidadania registrou 831 denúncias de violência política e assédio eleitoral entre 11 de setembro e 6 de novembro.", "titulo_pt": "Ministério dos Direitos Humanos registra 831 denúncias de assédio eleitoral e violência política", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 263212, "titulo": "Integrantes da PF veem disputa política em crise com delegados do Master e divergem sobre Andrei", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/integrantes-da-pf-veem-disputa-politica-em-crise-com-delegados-do-master-e-divergem-sobre-andrei.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise na Polícia Federal tem sido alimentada pelo afastamento de dois delegados que coordenavam as investigações sobre o Banco Master, segundo informações de integrantes da corporação. Essa situação tem intensificado a disputa interna na PF.", "titulo_pt": "Integrantes da PF veem disputa política em crise com delegados do Master e divergem sobre Andrei", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 263213, "titulo": "Entenda ação sobre cursos de medicina em que Moraes e Kassio votaram a favor do interesse de Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/entenda-acao-sobre-cursos-de-medicina-em-que-moraes-e-kassio-votaram-a-favor-do-interesse-de-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da Polícia Federal, rejeitado pela cúpula da corporação, menciona mensagens que sugerem que os ministros Alexandre de Moraes e Kassio Nunes Marques teriam antecipado seus votos a favor dos interesses de Daniel Vorcaro em uma ação no STF. Essa informação está relacionada a uma ação sobre cursos de medicina.", "titulo_pt": "Entenda ação sobre cursos de medicina em que Moraes e Kassio votaram a favor do interesse de Vorcaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 263224, "titulo": "Equipe econômica quer propor a Lula PEC para mirar gastos fora dos limites do arcabouço", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/equipe-economica-quer-propor-a-lula-pec-para-mirar-gastos-fora-dos-limites-do-arcabouco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe econômica do governo Lula está considerando a elaboração de uma PEC para controlar gastos que atualmente não estão sujeitos às restrições fiscais. Esta seria uma etapa adicional do plano de ajuste econômico, após a aprovação de um projeto de lei recentemente no Senado.", "titulo_pt": "Equipe econômica pretende propor PEC para controlar gastos fora dos limites fiscais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 263665, "titulo": "Netanyahu may fall, but his far-right legacy in Israel is going nowhere", "url": "https://www.aljazeera.com/news/2026/11/14/netanyahu-may-fall-but-his-far-right-legacy-in-israel-is-going-nowhere?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T09:43:00Z", "idioma": "en", "provavel_duplicata_de": nu
