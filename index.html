<html lang="pt-BR">
<head>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

ões sofrendo perdas de dois dígitos.", "mundo": "As eleições nos Estados Unidos, marcadas para o dia 3 de novembro, estão gerando tensão política. O presidente Donald Trump está tentando influenciar o processo de votação. O Papa Francisco, em sua primeira participação em eleições americanas, votou por correspondência no estado de Illinois, o que gerou controvérsias. Na Europa, a União Europeia e o Canadá detalharam medidas em um acordo histórico. A Polônia enfrenta uma crise política após o governo suspender o presidente do Tribunal Constitucional, o que levou à mobilização de manifestantes. No Brasil, houve uma convocação diplomática em resposta a uma viagem de Flávio Bolsonaro à Argentina. No Alasca, uma eleição foi tumultuada por um candidato com o mesmo nome que causou confusão entre os eleitores. As tensões entre os EUA e a Coreia do Norte sobre desnuclearização continuam, com especulações sobre uma possível reunião entre Trump e Kim Jong-un.\n\nA geopolítica global continua em movimento, com diversos conflitos e decisões políticas afetando regiões e países. O Conselho de Segurança da ONU rejeitou propostas conflitantes dos Estados Unidos e da Rússia sobre o Saara Ocidental, deixando a missão de manutenção da paz sem uma extensão aprovada. O conflito entre Rússia e Ucrânia está destruindo a vida marinha do Mar Negro, resultando na morte de mais de 120 mil golfinhos e causando danos ecológicos significativos. Além disso, o governo dos Estados Unidos aprovou a venda de mísseis Patriot para a Ucrânia, em um esforço para fornecer armas defensivas à Kyiv, embora a aprovação ainda dependa do Congresso americano. A Coreia do Norte criticou um comunicado conjunto que apoia sanções contra o país, enquanto a Coreia do Sul, EUA e Japão reafirmaram seu compromisso com a desnuclearização completa da Coreia do Norte durante conversas trilaterais.", "economia": "A surpreendente vitória de Lula nas eleições brasileiras teve um impacto significativo na economia, resultando em uma forte queda do real e maior competitividade nas exportações de agronegócios. A Bovespa, Bolsa de Valores de São Paulo, registrou uma queda de 17,5% na semana seguinte, seu pior resultado desde 2020. O dólar valorizou 1% no mesmo dia. O petróleo Brent encerrou outubro com o maior valor desde maio, refletindo a possibilidade de escalada do conflito no Irã após as eleições nos Estados Unidos. A Petrobras manteve a utilização de suas refinarias em 98% em outubro, buscando reduzir as importações, enquanto a Kalshi, uma plataforma de apostas criptográficas, foi avaliada em US$ 40 bilhões e se aproxima de uma possível oferta inicial de ações (IPO).", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia global, com empresas e governos explorando suas potencialidades em diversos setores. Executivos da Samsung se reuniram com Sam Altman, CEO da OpenAI, para discutir estratégias de IA, enquanto a Siemens apresentou planos para levar a tecnologia para pequenas empresas industriais. A produtividade nas empresas de tecnologia aumentou, mas há dúvidas sobre os impactos na força de trabalho. Em Hong Kong, os alunos estão usando IA para aprender sobre economia doméstica. Ainda assim, a IA enfrenta desafios, como a segurança cibernética e a ética, com especialistas chineses sugerindo padrões éticos universais. A Nvidia está considerando garantir um empréstimo para o Nscale, um centro de dados de IA, enquanto a Apple reduzirá a taxa de comissão na App Store. A indústria de semicondutores da Taiwan, que produz grande parte da infraestrutura física necessária para o boom da IA, enfrenta desafios de mão de obra. A IA também está transformando a construção civil, com tecnologias identificando riscos em canteiros de obras, mas sem evidências claras de redução de acidentes.", "ciencia": "Os cientistas estão fazendo descobertas significativas em diversos campos da ciência. Em paleontologia, foi identificado um anfíbio que vivia completamente no mar, desafiando a suposição de que a pele dos anfíbios não suporta a salinidade marinha. Em biotecnologia, um novo sistema chamado SmartPE foi desenvolvido para editar genomas em plantas, permitindo mudanças precisas em culturas como tomates e soja. O James Webb Space Telescope revelou um exoplaneta que reflete 75% da luz de sua estrela, sugerindo a possibilidade de um 'protetor solar' gigante neste planeta de lava, a 280 anos-luz da Terra. Essas descobertas podem abrir novos caminhos na compreensão do desenvolvimento de organismos e na busca por soluções tecnológicas para diversos desafios. Além disso, um estudo recente da NASA anunciou os eventos-chave para a exposição aeroespacial MAX POWER, que ocorrerá em novembro, no Centro Espacial Kennedy na Flórida, proporcionando uma oportunidade para o público se envolver com as últimas inovações espaciais.", "cultura": "O escritor sul-africano Damon Galgut, vencedor do 15º Prêmio Park Kyongni, expressou o desejo de escrever além das restrições históricas e políticas que moldaram a literatura sul-africana, reconhecendo a necessidade de refletir sobre o passado turbulento do país. Em outro projeto cultural, o documentário 'Never big enough' expõe a indústria de enriquecimento do pênis, retratando a obsessão masculina com o tamanho do pênis desde tempos antigos e a influência de uma indústria de bem-estar íntimo em crescimento. Por outro lado, o coletivo mexicano Tres, liderado por Ilana Boltvinik e Rodrigo Viñas, realiza projetos artísticos baseados em pesquisas sobre lixo, transformando 350.000 colillas em obras de arte que refletem sobre a ecologia. Estes projetos e outros destacam a diversidade e complexidade da cultura global, abrangendo desde literatura e música até arte e tecnologia, refletindo sobre questões sociais, históricas e ambientais.", "sociedade": "O sistema Smart Sampa, o maior sistema de videomonitoramento da América Latina, resultou em 3.600 prisões de foragidos e 7 mil detenções em flagrante em São Paulo, destacando-se como um importante aliado na segurança da capital. No Distrito Federal, 32 Unidades Básicas de Saúde (UBSs) foram inauguradas neste sábado para vacinação, atendendo pessoas de todas as idades, com exceção de um dia no domingo e durante o feriado de Finados. O novo Código Civil aborda os direitos das crianças e adolescentes, priorizando a garantia de suas infância e adolescência, enquanto a cobertura da vacina contra a meningite entre adolescentes é de apenas 67,1%.", "meio_ambiente": "Um relatório recente indica que a Costa Atlântica do Brasil terá verões mais frios e chuvosos, com novas chuvas previstas para o fim de semana, seguidas por um aumento gradual das temperaturas. Em setembro, a Indonésia registrou aproximadamente 3.560 mortes devido à poluição de fumaça causada por incêndios florestais, com 57,8 milhões de pessoas expostas a ar considerado inadequado ou perigoso. O Brasil enfrenta um novo foco de doença de Newcastle em aves, e o Ministério da Agricultura e Pecuária informa que 147.500 animais de rebanho já foram evacuados das áreas afetadas pela inundação no Litoral. Além disso, a neblina tóxica causada pelos incêndios na Indonésia tem se espalhado para cidades locais e países vizinhos, mas a chuva prevista deve aliviar essa situação.", "direitos_humanos": "Relatos recentes sobre direitos humanos em diversos países destacam violações e situações de preocupação. Na Rússia, as autoridades estão usando métodos coercitivos para recrutar homens para a guerra, em vez de oferecer incentivos financeiros, conforme relatado. No Cone Sul, a pressão dos Estados Unidos sobre os minerais críticos tem impactado os direitos humanos, levantando questões sobre a ética na extração de recursos. Em Mato Grosso do Sul, ameaças às comunidades indígenas Guarani e Kaiowá levaram a uma missão federal liderada por Sônia Guajajara, que inclui representantes de três ministérios, para investigar as denúncias. Além disso, um agente do ICE enfrenta acusações de agressão após supostamente atropelar deliberadamente um trabalhador mexicano, Miguel Parra Hernández, durante uma perseguição. Em outro caso, Christa Pike, que sobreviveu à execução por injeção letal nos Estados Unidos, relatou sequelas físicas e emocionais, bem como dificuldades para falar após a aplicação de pentobarbital."}, "resumo_do_dia": {"politica_nacional": [{"id": 236704, "titulo": "Lula quer indicar deputado de SP para seu governo para que Falcão assuma mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/lula-quer-indicar-deputado-de-sp-para-seu-governo-para-que-falcao-assuma-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula teria sinalizado a possibilidade de indicar o deputado federal Rui Falcão para seu governo, com o objetivo de que Falcão assuma o mandato novamente na próxima legislatura.", "titulo_pt": "Lula quer indicar deputado de SP para seu governo para que Falcão assuma mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 236791, "titulo": "Ministro do Trabalho responde se será chefe de gabinete de Lula; vídeo", "url": "https://www.metropoles.com/colunas/milena-teixeira/ministro-do-trabalho-responde-se-sera-chefe-de-gabinete-de-lula-video", "fonte_id": "metropoles", "data_pub": "2026-10-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Marinho, ministro do Trabalho, negou-se a assumir o cargo de chefe de gabinete no quarto mandato do presidente Lula.", "titulo_pt": "Ministro do Trabalho descarta ser chefe de gabinete de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236795, "titulo": "8/1: Cármen divergiu de pena fixada a eletricista que Moraes mandou prender", "url": "https://www.metropoles.com/colunas/manoela-alcantara/8-1-carmen-divergiu-de-pena-fixada-a-eletricista-que-moraes-mandou-pr
