<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "27/11/2026 07:30", "stats": {"noticias_novas": 722, "resumos_gerados": 228}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva nomeou Luiz Carlos Trabuco para o Ministério da Fazenda, um gesto considerado significativo para a economia, comparado à escolha de Geraldo Alckmin como vice-presidente na gestão anterior. Trabuco, presidente do Conselho de Administração do Bradesco, aceitou o convite para ser ministro da Fazenda em 2027, conforme anunciado pela Presidência da República. A nomeação é vista como um sinal de intenção de Lula de enfrentar os graves problemas econômicos do país. O Centrão busca mais influência no governo Lula, disputando ministérios importantes, enquanto o governo Tarcísio de Freitas está pressionado a liberar emendas parlamentares antes do fim do ano. Além disso, o setor de carne espera intervenção direta de Lula nas negociações para a retomada das exportações de frango para a União Europeia, que estão paralisadas desde setembro.", "mundo": "As eleições na Espanha, marcadas para 29 de novembro, estão sendo fortemente influenciadas pelo tema da imigração. A Espanha, com uma população de cerca de 50 milhões de habitantes, lida com uma taxa de mortalidade superior à taxa de natalidade. No contexto europeu, a União Europeia enfrenta desafios em suas negociações orçamentárias devido às eleições francesas, com Emmanuel Macron indicando que não haverá discussões após o fim do ano. A Ucrânia continua sendo um foco de tensões, com a NATO mobilizando recursos após um incidente envolvendo drones próximos à fronteira com a Rússia. Na América Latina, o chanceler da Venezuela, Yván Gil, visitará o Brasil para discutir questões comerciais, enquanto o governo brasileiro considera convidar a presidente venezuelana, Delcy Rodríguez, para a cerimônia de posse do presidente Lula em 5 de janeiro.\n\nAs tensões geopolíticas continuam a se intensificar em diversos cenários. A Coreia do Norte não se pronunciou sobre um sétimo pescador resgatado, enquanto a Coreia do Sul retornou os seis pescadores restantes. Em outro front, a China e o Camboja realizaram exercícios militares, com o envio de tanques de batalha por um navio de transporte amphibio pela primeira vez. Isso pode ter implicações estratégicas na região do Sudeste Asiático. A Ucrânia enfrenta críticas de Volodymyr Zelensky, que afirma que os Estados Unidos estão concentrados demais no Oriente Médio e não pressionam a Rússia suficientemente. Além disso, a China testou novas táticas de desembarque de tropas em exercícios marítimos, enquanto a Lituânia ameaça revogar o status de representação da Taiwan para melhorar suas relações com a China. Esses eventos refletem a complexidade e a instabilidade da geopolítica global atual, com diversos países e regiões enfrentando desafios significativos em suas relações internacionais.", "economia": "O Ibovespa registrou uma forte alta de 6% e atingiu seu maior ganho diário desde o primeiro turno das eleições de 2026, impulsionado pelas expectativas de que Luiz Carlos Trabuco aceite o convite para ser ministro da Fazenda pelo presidente Lula. O dólar caiu para R$ 5,74 pela primeira vez em quase duas semanas. Na economia internacional, a bolsa da China se recuperou fortemente após sinais de apoio do governo, enquanto a Coreia do Sul viu suas ações aumentarem 4% devido a esperanças de apoio político. A economia francesa encolheu 0,2% no terceiro trimestre, uma retração maior do que o esperado. No Brasil, a Usiminas projeta resultados menores no quarto trimestre devido à pressão cambial e à baixa rentabilidade das vendas de minério de ferro. A Petrobras registrou um princípio de incêndio causado por um raio no Campo de Búzios, mas sem vítimas ou danos aos equipamentos. O Banco Central planeja melhorias na segurança do Pix, focando em melhorias de bloqueio e identificação de fraudes, durante o Fórum Pix.", "tecnologia": "A tecnologia continua moldando o cenário global, com destaque para a expansão da inteligência artificial (IA) e suas implicações nas diversas indústrias. A SAP, gigante alemã de software, planeja cortar pelo menos 10.000 empregos em seu plano de reestruturação para fortalecer sua presença na IA, conforme relatos do Bloomberg. Em outro desenvolvimento, a JERA, maior produtora de energia do Japão, está em negociações com gigantes de tecnologia como Anthropic, Meta, Amazon, Microsoft e Google para construir centros de dados próximos às suas usinas de energia, visando aproveitar a infraestrutura energética da empresa para suportar a alta demanda de energia dos centros de dados de IA. A expansão da IA também tem impacto na segurança cibernética, desencadeando uma nova era de resiliência, apesar da persistente escassez de profissionais de segurança cibernética. Além disso, a expansão da IA na indústria de semicondutores está transformando a economia global, com a previsão de que o mercado de semicondutores duplique seu volume de saída para US$ 1,6 trilhão até o final de 2026, marcando o início da era do Silício 4.0, focada em integração de sistema e co-pacoteagem óptica-eletrônica, conforme afirmou Nicky Lu, presidente da Etron e professor da National Yang Ming Chiao Tung University (NYCU).", "ciencia": "Um estudo internacional, liderado pela Universidade de Bristol no Reino Unido, apresentou o Atlas Global da Canastra, que é a maior coleção integrada de mapas 3D de alta resolução de florestas, florestões e savanas já compilada. Em outro desenvolvimento, geólogos australianos encontraram evidências geológicas de cordilheiras gigantes sob o continente antártico, sugerindo a possibilidade de uma montanha comparável ao Monte Everest existir sob o gelo antártico. Além disso, pesquisadores descobriram que uma molécula natural liberada durante a atividade física ajuda os músculos a se tornarem mais fortes e resistirem à fadiga, o que pode ter implicações para o tratamento da degeneração muscular associada ao diabetes de tipo 2. Outro estudo importante questiona a suposição antiga sobre como o cérebro funciona, revelando que a maioria das neurônios são multitarefas em vez de trabalhadores altamente especializados. Finalmente, um grupo de pesquisadores dos Estados Unidos expressou preocupação sobre a possibilidade de interferências de redes 5G futuras afetarem as medições meteorológicas por satélite e potencialmente alterarem as previsões climáticas.", "cultura": "O debate sobre a incorporação de árvores em edifícios continua, enquanto a moda de rua se destaca com novas tendências relacionadas à comida. A retrospectiva do artista Carroll Dunham em Miami explora seu formalismo sujo, enquanto a artista Batima Zaurbekova, com 80 anos, apresenta uma importante exposição de tecidos que mesclam técnicas tradicionais kazacas com influências modernistas. A cultura do Natal ganha um novo elemento com a receita de pan dulce relleno de cookies para 2026, enquanto a série 'A Remarinha Imperatriz' de Disney+ apresenta a vilã Rashta, uma personagem manipuladora e cruel em um mundo fictício medieval. O Cristo Redentor, no Rio de Janeiro, foi cercado por uma impressionante cascata de nuvens, destacando-se contra o céu. A cultura do K-pop é analisada com o relatório do Global-K Chart, revelando que Rescene se destaca em seu mercado doméstico, enquanto Aespa lidera na China e BTS permanece inigualável no Japão. O documentário sobre o fotógrafo de guerra Bunyo Ishikawa, produzido por Atsunori Kawamura, foi dedicado a sete anos de trabalho. O romance 'Tinta da Bahia', de Luciany Aparecida, está programado para ser lançado em julho de 2027, enquanto o lexicógrafo Jeremy Butterfield explora as origens surpreendentes de expressões comuns que usam animais. O movimento DIY de dança 'mara' surgiu em Nigéria como resposta a um artista viralizado nas redes sociais, se tornando uma força cultural significativa. Mike Leigh, diretor aclamado, anunciou que seu último filme, 'Tender Loving Care', será sua despedida da direção cinematográfica, após 55 anos de carreira. O programa de TV 'Alan Carr’s Great Big Bucket List' apresenta Carr realizando experiências radicais com amigos famosos, proporcionando entretenimento relaxante. A CIExpo 2026 reforça o papel de Hong Kong como hub de inovação na construção civil global, enquanto a coleção de bonecas em Tóquio representa figuras notáveis de 2026. A agência Innocean, do Grupo Hyundai Motor, foi novamente eleita a agência criativa do ano da Coreia.", "sociedade": "Um servidor foi demitido e indiciado por perseguir e importunar colegas de trabalho, o que levou a uma investigação policial no Pronto-Atendimento de Marilândia (ES). Em outro caso, um terço das escolas na Coreia do Sul paralisou as refeições na sexta-feira devido a uma greve de trabalhadores pedindo aumento de salários e melhores condições de trabalho, com alternativas como pão e leite ou a permissão de trazer lanches de casa. Em Salvador, postos de saúde foram fechados 12 vezes devido à violência, afetando aulas e obras públicas. O Ministério Público Federal abriu um inquérito civil para verificar a regulamentação do transporte aéreo de animais de apoio emocional. As expectativas de vida no Brasil variam entre os estados, com uma média de 76,6 anos, segundo dados do IBGE. Um levantamento do Inep mostra que negros, pardos e indígenas representam mais da metade das matrículas nas universidades federais, com 50,1% das inscrições. Além disso, uma proposta visa unificar diversos programas sociais sem ampliar os gastos públicos, mantendo um orçamento de R$ 331 bilhões com o objetivo de melhorar a eficiência das despesas.", "meio_ambiente": "Inundações letais submergiram casas, negócios e estradas em várias partes do Equador, conforme informou o al Jazeera. Nas costas dos Estados Unidos, tempestades causaram inundações, interrompendo o tráfego de férias e adiando a Parada da Macy's no centenário, informou o euronews. No Brasil, intensas chuvas causaram transbordamento de rios e alagamentos em Americana, no interior de São Paulo. O governo federal considera fornecer um auxílio emergencial para cerca de 400 mil pescadores artesanais afetados pela seca nos rios da Amazônia, conforme informou a agência Brasil Economia. Além disso, o Brasil dobrou a área de restauração florestal, atingindo 262 mil hectares de vegetação nativa em recuperação, com um novo programa apoiado pela fundação de Jeff Bezos testando técnicas e tecnologias em até 5 mil hectares, conforme relatou o exame.", "direitos_humanos": "One year after the massive fire in Hong Kong, which resulted in 168 deaths and left around 4,600 people homeless, survivors are urging for justice. In the face of public outrage and trauma, authorities are suppressing these demands, avoiding an independent investigation. In another case, a Malaysian teacher was sentenced to 60 years in prison for sexually abusing eight girls aged between 7 and 12. This case is part of a series of accusations against educators, despite the government's firm stance against such crimes. In a recent report, Israel has approved special interrogation measures for Palestinian prisoners, which could lead to irreversible judicial errors. Additionally, Vietnam is accused of kidnapping Cambodian activists, with the UN requesting explanations. In a local case, the UK allegedly sent a Sri Lankan refugee convicted of rape to Eswatini, where he committed suicide in a secret agreement."}, "resumo_do_dia": {"politica_nacional": [{"id": 290260, "titulo": "Bradesco diz que sucessão de Trabuco na presidência do conselho seguirá regulamentação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/bradesco-diz-que-sucessao-de-trabuco-na-presidencia-do-conselho-seguira-regulamentacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T09:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bradesco confirmou que Luiz Carlos Trabuco aceitou o convite para ser ministro da Fazenda em 2027, conforme anunciado pela Presidência da República.", "titulo_pt": "Bradesco confirma que Trabuco aceitou convite para ministério em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 290319, "titulo": "Carlos Bolsonaro assume defesa de Jair, cutuca Michelle e se prepara para ser o porta-voz do clã no Congresso", "url": "https://veja.abril.com.br/politica/carlos-bolsonaro-assume-defesa-de-jair-cutuca-michelle-e-se-prepara-para-ser-o-porta-voz-do-cla-no-congresso/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Bolsonaro assumiu a defesa de seu pai, Jair Bolsonaro, e criticou Michelle, a esposa do ex-governador Flávio Bolsonaro. Ele está se preparando para desempenhar um papel de porta-voz do clã Bolsonaro no Congresso, após Flávio e Eduardo se exilarem nos Estados Unidos.", "titulo_pt": "Carlos Bolsonaro defende Jair e se prepara para ser porta-voz do clã no Congresso", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290325, "titulo": "Com Trabuco, Lula sinaliza que pretende enfrentar os graves problemas econômicos do país", "url": "https://veja.abril.com.br/economia/com-trabuco-lula-sinaliza-que-pretende-enfrentar-os-graves-problemas-economicos-do-pais/", "fonte_id": "veja", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula escolheu o presidente do Conselho de Administração do Bradesco para a pasta da Fazenda, sinalizando intenção de abordar os graves problemas econômicos do país. Este nome é apreciado pelo mercado financeiro.", "titulo_pt": "Com Trabuco, Lula sinaliza intenção de enfrentar problemas econômicos graves", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290391, "titulo": "E o banqueiro, hein?", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/e-o-banqueiro-hein", "fonte_id": "metropoles", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete se refere a um banqueiro, mas não fornece detalhes adicionais sobre o conteúdo ou resultados da enquete.", "titulo_pt": "E o banqueiro, então?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290392, "titulo": "Chegada de Trabuco ao governo é maior gesto de Lula desde Alckmin como vice", "url": "https://www.metropoles.com/colunas/igor-gadelha/chegada-de-trabuco-ao-governo-e-maior-gesto-de-lula-desde-alckmin-como-vice", "fonte_id": "metropoles", "data_pub": "2026-11-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula nomeou Luiz Carlos Trabuco para o Ministério da Fazenda, um movimento considerado significativo para a economia. Este gesto é comparado à escolha de Geraldo Alckmin como vice-presidente na gestão anterior.", "titulo_pt": "Chegada de Trabuco ao governo é maior gesto de Lula desde Alckmin como vice", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290394, "titulo": "Alckmin será ministro da Segurança e avalia convidar Gakiya para secretário", "url": "https://www.metropoles.com/colunas/igor-gadelha/alckmin-sera-ministro-da-seguranca-e-avalia-convidar-gakiya-para-secretario", "fonte_id": "metropoles", "data_pub": "2026-11-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Geraldo Alckmin deve convidar o promotor Lincoln Gakiya para assumir uma posição de liderança no Ministério da Segurança Pública. Alckmin também está avaliando a possibilidade de nomear Gakiya como secretário.", "titulo_pt": "Alckmin considera convidar Gakiya para cargo no ministério da Segurança", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290395, "titulo": "Os nomes que o PT de São Paulo defende para a Secom do Lula 4", "url": "https://www.metropoles.com/colunas/milena-teixeira/o-nome-que-o-pt-de-sao-paulo-tem-defendido-para-a-secom-de-lula", "fonte_id": "metropoles", "data_pub": "2026-11-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Petistas de São Paulo estão articulando nomes para substituir Sidônio Palmeira no cargo de secretário executivo da Secom, que será ocupado por João Alberto no governo do presidente eleito Luiz Inácio Lula da Silva. Além disso, o secretário nacional do PT também está concorrendo ao posto.", "titulo_pt": "Nomes petistas para substituir sidônio palmeira na Secom do Lula 4", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290397, "titulo": "Centrão quer mais poder no governo Lula e disputa ministérios estratégicos", "url": "https://www.metropoles.com/brasil/centrao-quer-mais-poder-no-governo-lula-e-disputa-ministerios-estrategicos", "fonte_id": "metropoles", "data_pub": "2026-11-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Centrão busca mais influência no governo Lula, disputando ministérios importantes. O Planalto pede apoio dos partidos no Congresso, enquanto os partidos reivindicam pastas com maior poder de recursos e controle de bancos públicos.", "titulo_pt": "Centrão quer mais poder no governo Lula e disputa ministérios estratégicos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290398, "titulo": "Fuga de Flávio completa 1 mês sem avanço na investigação e atuação política", "url": "https://www.metropoles.com/brasil/fuga-de-flavio-completa-1-mes-sem-avanco-na-investigacao-e-atuacao-politica", "fonte_id": "metropoles", "data_pub": "2026-11-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio, um senador dos Estados Unidos, tem participado de votações remotas e articulações políticas. A Polícia Federal ainda não divulgou informações sobre quem ajudou Flávio na fuga.", "titulo_pt": "Fuga de Flávio completa 1 mês sem avanço na investigação e atuação política", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290400, "titulo": "Podemos e PT sinalizam apoio e Franco se encaminha para comando da Alesp", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/podemos-e-pt-sinalizam-apoio-e-franco-se-encaminha-para-comando-da-alesp", "fonte_id": "metropoles", "data_pub": "2026-11-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os partidos Podemos e PT sinalizaram apoio a Franco, que se aproxima do comando da Assembleia Legislativa de São Paulo (Alesp). O apoio petista é visto como determinante para a viabilização de Franco na posição.", "titulo_pt": "Podemos e PT sinalizam apoio e Franco se encaminha para comando da Alesp", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290476, "titulo": "Vacâncias nas diretorias prejudicam autonomia das agências reguladoras", "url": "https://www.jota.info/opiniao-e-analise/artigos/vacancias-nas-diretorias-prejudicam-autonomia-das-agencias-reguladoras", "fonte_id": "jota", "data_pub": "2026-11-27T07:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento identificou 21 cargos vagos nas diretorias de 12 agências reguladoras federais, com uma média de vacância de 231 dias.", "titulo_pt": "Vacâncias nas diretorias prejudicam autonomia das agências reguladoras", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 290240, "titulo": "Governo Tarcísio c  "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro aposentado Celso de Mello concorda que juízes que viajam a convite de empresas privadas podem ser considerados suspeitos para julgar processos relacionados a essas empresas. Ele endossa a tese de que tais viagens comprometem a imparcialidade dos juízes.", "titulo_pt": "Celso de Mello critica caravanas de juízes a convite de empresas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 290261, "titulo": "Lula avalia criar ministério com foco em governo digital para centralizar políticas de tecnologia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-avalia-criar-ministerio-com-foco-em-governo-digital-para-centralizar-politicas-de-tecnologia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva está avaliando a criação de um ministério focado em governo digital, que unificará funções de diversos ministérios e secretarias federais. O objetivo é centralizar as políticas de tecnologia.", "titulo_pt": "Lula considera criar ministério de governo digital para centralizar políticas de tecnologia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 290421, "titulo": "Com Trabuco, Lula admite que base social da eleição não basta, diz analista", "url": "https://www.cnnbrasil.com.br/politica/com-trabuco-lula-admite-que-base-social-da-eleicao-nao-basta-diz-analista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T06:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cientista político analisou que a escolha do Trabuco como ministro tem uma natureza política. Lula terá o desafio de proteger o indicado do crítico interno do PT.", "titulo_pt": "Com Trabuco, Lula admite que base social da eleição não basta, diz especialista", "veiculo": "CNN Brasil", "pais":
