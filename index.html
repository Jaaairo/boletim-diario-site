<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

s da loja virtual Wildberries. Em Cuba, sucessivas interrupções de energia elétrica estão causando problemas à população e levantando preocupações sobre a crise energética no país. O governo dos Estados Unidos está financiando um projeto de drones de saúde em Rwanda, enquanto o governo do Reino Unido expressa preocupação com as novas regras de teste de sexo da WTA.\n\nA guerra entre os Estados Unidos e o Irã tem gerado preocupações sobre a preparação militar americana para futuros conflitos. De acordo com relatos, praticamente todo o arsenal de mísseis precisos dos EUA foi usado durante cinco meses. Paralelamente, o Japão está investindo em drones para conter a presença crescente da China no Oceano Pacífico. Israel intensificou os ataques em Gaza após um acordo com os Estados Unidos visando o desarmamento do Hamas. A Coreia do Norte denunciou a cooperação militar entre Coreia do Sul, EUA e Japão, advertindo sobre novas capacidades de detergência. Além disso, a Rússia está expandindo sua frota de navios não declarados para exportar gás natural liquefeito (LNG), o que deve permitir que Moscou continue suas exportações mesmo quando sanções se intensificarem no próximo ano.", "economia": "O IPC-Fipe registrou uma queda de 0,03% em julho, abaixo do esperado. A inflação acumulada nos últimos 12 meses ficou em 3,60%. O Copom iniciou nesta terça-feira (4) a quinta reunião de 2026 para definir a taxa básica de juros e espera-se anúncio dia 5. A MUFG registrou um lucro líquido de ¥809,4 bilhões no trimestre encerrado em 30 de junho, superando as estimativas dos analistas. O Banco Central sul-coreano enfrentou movimentos sísmicos recentes e a Senapred forneceu recomendações sobre as ações a serem tomadas em caso de terremoto. A produção de circuitos integrados industriais na China atingiu 484,28 bilhões em 2025, crescendo quase 350% desde os 108,72 bilhões em 2015. O HSBC retomou as aquisições de ações e registrou lucros trimestrais no valor de 10,1 bilhões de dólares. A Toyota anunciou um programa de compra de ações no valor de 1 trilhão de ienes e elevou suas perspectivas de lucro. O Banco Central sul-coreano cedeu ligeiramente em relação ao dólar americano devido às saídas de capitais estrangeiros, enquanto o won sul-coreano ganhou novos impulsos com a intervenção rara dos EUA e do Japão para apoiar o iene. O setor de fábricas registrou um crescimento devido ao boom da produção de chips.", "tecnologia": "Um incidente significativo ocorreu no setor de criptomoedas quando hackers roubaram 110 milhões de dólares em bitcoins, destacando a vulnerabilidade das moedas digitais e a importância da segurança do software. Paralelamente, a China lançou cinco modelos de inteligência artificial em oito semanas, superando as lideranças americanas, criando um 'buraco sem saída' para as empresas de modelagem de IA norte-americanas. Em resposta, as empresas chinesas continuam avançando nos EUA apesar das restrições impostas pela Casa Branca e pelo Congresso. Além disso, a NTT Data planeja investir 1,5 trilhão de ienes em centrais de dados no Japão para atender à crescente demanda por tecnologia de IA, enquanto a China reforça suas regulamentações sobre designs de circuitos integrados (IC) para fortalecer sua indústria de semicondutores.", "ciencia": "Um estudo da Universidade do Kansas sugere que as discussões sobre o movimento #MeToo tendem a se concentrar na punição e na pobreza forçada, em vez de investigar as causas subjacentes à violência baseada no gênero. De outra parte, pesquisadores do Conicet descobriram que os primeiros humanos na América se alimentavam principalmente de animais herbívoros grandes, contrariando a percepção anterior sobre sua dieta inicial. Um estudo revisou 24 ensaios clínicos e concluiu que a intensidade do exercício é mais importante do que a duração para estimular a formação de novo osso. Além disso, pesquisas recentes indicam que um meteorito responsável pela extinção dos dinossauros teria causado incêndios globais imediatamente após o impacto. Yurii Nesterov, matemático russo-nascido belga atuante na China, recebeu um prêmio importante em matemática aplicada por seu algoritmo de gradiente acelerado, que é crucial para o avanço da inteligência artificial moderna.", "cultura": "A oitava edição da Flipei, festival literário que acontecerá de 5 a 9 de outubro na região central de São Paulo, se destaca como um palco de resistência cultural e pensamento crítico. O evento contará com mais de 180 convidados e 65 mesas de debates, mantendo sua missão de promover discussões independentes. Em outro desenvolvimento cultural notável, a banda britânica Massive Attack enfrentou uma proibição para se apresentar em Singapura após exibir uma bandeira palestiniana durante seu show, o que dividiu opiniões na cidade-estado sobre as leis de controle do exibicionismo de emblemas estrangeiros.", "sociedade": "Um ator brasileiro chamado Marco Furlan foi preso por estupro de uma criança de 5 anos e permanece à disposição da justiça. No mesmo contexto, uma mulher denunciou Facundo Moyano por agressão em um apartamento de Belgrano, Buenos Aires, Argentina, levando-o à detenção pela Polícia da Cidade após um chamado ao 911. A violência contra professores no Brasil tem aumentado desde 2010, com cerca de 74% dos educadores relatando agressões físicas e ameaças em suas escolas, resultando em uma sensação de insegurança entre os profissionais da educação. Além disso, a assistência estatal Asignación Universal por Hijo (AUH) teve um ajuste de 1,89% para o mês de agosto e entrou em vigor no oitavo mês do ano, beneficiando famílias com filhos menores. No âmbito das políticas educacionais, a Lei 15.474/2026 ampliou o acesso a sprays de pimenta, mas limitou a parte prática da utilização, enquanto no exterior, o governo sul-coreano aprovou regras que podem levar ao fechamento de universidades privadas financeiramente debilitadas em Seul, Coreia do Sul.", "meio_ambiente": "A França registrou seu mês mais quente e seco desde o início do registro meteorológico, com julho sendo o terceiro mês mais seco. Isso indica um aumento nas temperaturas que contribui para a temporada de incêndios florestais na Europa. Paralelamente, fortes chuvas no Sri Lanka causaram deslizamentos de terra e inundações, resultando em pelo menos cinco mortes. Essas situações destacam o impacto das mudanças climáticas nos eventos naturais. Além disso, a iniciativa 'Grande Muralha Verde' na África e na China busca frear o avanço da desertificação e promover a biodiversidade, envolvendo governos, organizações não-governamentais e voluntários em seus esforços.", "direitos_humanos": "Um incidente crucial foi relatado na investigação interna sobre a explosão de Beirut, oito anos após o ocorrido. O relatório concluiu que ainda não houve acusação formal emitida, apesar do processo interno ter sido concluído. Em outro caso, a Shogakukan, uma editora japonesa, foi descoberta incentivando violações de direitos humanos ao contratar um artista-mangá sob pseudônimo para escrever uma nova série, após o artista ter cometido conduta sexual inadequada com outros homens. A situação das comunidades Rohingya em Bangladesh também merece destaque: refugiados estão afogando-se nos mares enquanto aguardam a chegada de barcos inseguros, preferindo essa opção ao risco de ficar para trás e enfrentar as consequências terríveis disso. Além disso, políticos alemães apresentaram propostas para proteger ex-pacientes do câncer de discriminação em diversos setores da sociedade."}, "resumo_do_dia": {"politica_nacional": [{"id": 86844, "titulo": "PCDF cria comitê permanente para combater lavagem de dinheiro", "url": "https://www.metropoles.com/distrito-federal/pcdf-cria-comite-permanente-para-combater-lavagem-de-dinheiro", "fonte_id": "metropoles", "data_pub": "2026-08-04T11:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PCDF (Polícia Civil do Distrito Federal) criou um comitê permanente para combater lavagem de dinheiro. A medida foi publicada no Diário Oficial do DF em 4 de agosto e visa fortalecer o enfrentamento a esse tipo de crime.", "titulo_pt": "PCDF cria comitê permanente para combater lavagem de dinheiro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86845, "titulo": "Milei volta a atacar Lula, e Flávio amarela na TV após mentir sobre urnas", "url": "https://www.metropoles.com/blog-do-noblat/milei-volta-a-atacar-lula-e-flavio-amarela-na-tv-apos-mentir-sobre-urnas", "fonte_id": "metropoles", "data_pub": "2026-08-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista argentino Milei criticou o presidente Lula, enquanto o filho do ex-presidente Bolsonaro foi retratado como mentiroso na televisão após fazer declarações sobre urnas.", "titulo_pt": "Milei ataca Lula e Flávio bolsonaro se envergonha na TV ao mentir sobre urnas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86847, "titulo": "Em palestra, Temer defende \"pacto\" entre Poderes e vê eleição apertada", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/em-palestra-temer-defende-pacto-entre-poderes-e-ve-eleicao-apertada", "fonte_id": "metropoles", "data_pub": "2026-08-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michel Temer, em uma palestra fechada, criticou a polarização política e propôs que o futuro presidente forme um 'pacto' com o Judiciário e o Legislativo.", "titulo_pt": "Em palestra, Temer defende 'pacto' entre Poderes e vê eleição apertada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86853, "titulo": "Farra do INSS: advogado alvo da PF é “amigo” de Flávio Bolsonaro", "url": "https://www.metropoles.com/colunas/igor-gadelha/farra-do-inss-advogado-amigo-de-flavio-e-senador-sao-alvos-da-pf", "fonte_id": "metropoles", "data_pub": "2026-08-04T10:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Willer Tomaz, advogado amigo do senador Flávio Bolsonaro, foi alvo de uma nova fase da operação Sem Desconto, que investiga a chamada Farra do INSS.", "titulo_pt": "Advogado amigo de Flávio Bolsonaro é alvo da operação sem desconto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86764, "titulo": "Polícia faz operação contra suspeitos de induzir adolescente a tirar a própria vida e transmitir em rede social", "url": "https://g1.globo.com/politica/noticia/2026/08/04/policia-faz-operacao-contra-suspeitos-de-induzir-adolescente-a-tirar-a-propria-vida-e-transmitir-em-rede-social.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T10:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais civis realizaram uma operação contra suspeitos envolvidos no suicídio de uma menina de 13 anos, ocorrido no mês passado em Naviraí, Mato Grosso do Sul. O incidente foi transmitido ao vivo via Discord. A investigação é conduzida pela Polícia Civil do estado.", "titulo_pt": "Polícia realiza operação contra suspeitos envolvidos no suicídio de adolescente e transmissão ao vivo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 86822, "titulo": "PF mira pessoas ligadas a vice-líder do governo Lula em nova ação sobre fraudes no INSS", "url": "https://veja.abril.com.br/brasil/pf-mira-pessoas-ligadas-a-vice-lider-do-governo-lula-em-nova-acao-sobre-fraudes-no-inss/", "fonte_id": "veja", "data_pub": "2026-08-04T10:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga pessoas associadas ao vice-líder do governo Lula em uma nova operação relacionada a fraudes no INSS. Weverton Rocha, do PDT maranhense, participou da campanha de Lula.", "titulo_pt": "PF alvo de pessoas próximas ao vice-líder do governo Lula em nova operação sobre fraudes no INSS", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 86688, "titulo": "Renan Santos propõe choque fiscal de R$ 250 bi com desvinculação de despesas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/renan-santos-propoe-choque-fiscal-de-r-250-bi-com-desvinculacao-de-despesas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-04T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato à Presidência pelo partido Missão, propõe desvincular a Previdência Social e outros benefícios do salário mínimo e eliminar os pisos constitucionais de saúde e educação para reduzir as despesas fiscais em R$ 250 bilhões.", "titulo_pt": "Renan Santos sugere choque fiscal de R$ 250 bi com desvinculação de despesas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 86765, "titulo": "Por que eleição de Pernambuco virou 'guerra digital' – e o que isso tem a ver com 'virada' da governadora", "url": "https://g1.globo.com/pe/pernambuco/eleicoes/2026/noticia/2026/08/04/por-que-eleicao-de-pernambuco-virou-guerra-digital-e-o-que-isso-tem-a-ver-com-virada-da-governadora.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora de Pernambuco, Raquel Lyra, obteve 43% das intenções de voto na última pesquisa, enquanto João Campos teve 37%. Uma cena dela correndo durante uma entrega de equipamentos a policiais em Recife foi vista mais de 3 milhões de vezes no Instagram.", "titulo_pt": "Por que a eleição de Pernambuco se tornou 'guerra digital' e o que isso tem a ver com a governadora?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 86767, "titulo": "Emendas PIX são menos transparentes e até 25% mais caras, aponta CGU", "url": "https://g1.globo.com/politica/blog/camila-bomfim/post/2026/08/04/emendas-sao-menos-transparentes-e-mais-caras-auditoria-cgu.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Controladoria-Geral da República (CGU) apontou que as emendas PIX resultam em compras mais caras e sem transparência. A auditoria analisou mais de 3 mil registros de maquinário e constatou que, se não fossem essas emendas, os custos seriam significativamente menores.", "titulo_pt": "Emendas PIX são menos transparentes e até 25% mais caras, aponta CGU", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 86689, "titulo": "Candidato, Datena diz que desta vez vai pedir votos, ao contrário da eleição de 2024", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/candidato-datena-diz-que-desta-vez-vai-pedir-votos-ao-contrario-da-eleicao-de-2024.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Luiz Datena, candidato a deputado federal pelo PSB, afirma que, diferente da eleição para prefeito de São Paulo em 2024, desta vez será mais proativo na busca por votos.", "titulo_pt": "Datena diz que desta vez vai pedir votos, ao contrário da eleição de 2024", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 87020, "titulo": "O STF e a moratória da soja: muito além dos benefícios fiscais", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-stf-e-a-moratoria-da-soja-muito-alem-dos-beneficios-fiscais", "fonte_id": "jota", "data_pub": "2026-08-04T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a decisão do STF sobre a moratória da soja, focando na legitimidade de sua decisão com base nas regras constitucionais.", "titulo_pt": "STF e a moratória da soja: muito além dos benefícios fiscais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 87021, "titulo": "Uso de IA nas convenções partidárias configura crime eleitoral?", "url": "https://www.jota.info/opiniao-e-analise/artigos/uso-de-ia-nas-convencoes-partidarias-configura-crime-eleitoral", "fonte_id": "jota", "data_pub": "2026-08-04T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso de inteligência artificial nas convenções partidárias pode configurar crime eleitoral, e os desafios eleitorais diante da modernidade tecnológica são evidentes.", "titulo_pt": "Uso de IA nas convenções partidárias configura crime eleitoral?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 86953, "titulo": "CNJ deve começar a analisar hoje processos contra juízes da Lava Jato", "url": "https://www.cnnbrasil.com.br/politica/cnj-deve-comecar-a-analisar-hoje-processos-contra-juizes-da-lava-jato/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Justiça (CNJ) deve iniciar a análise de processos contra juízes relacionados à Lava Jato. Um dos casos envolve a suspeita de participação da juíza substituta de Sérgio Moro em um esquema para desviar R$ 2,5 bilhões do estado brasileiro.", "titulo_pt": "CNJ deve começar a analisar hoje processos contra juízes da Lava Jato", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [{"titulo": "Correção: g1 errou ao informar que Weverton Rocha era alvo de nova fase da Operação Sem Desconto", "sumario": "O G1 errou ao informar que o senador Weverton Rocha (PDT-MA) foi alvo de uma nova fase da Operação Sem Desconto. A Polícia Federal iniciou uma nova fase da Operação Sem Desconto na manhã de terça-feira (4) para investigar suspeitas de lavagem de dinheiro relacionadas a fraudes no INSS. A Polícia Federal deflagrou uma nova fase da Operação Sem Desconto, focando em suspeitos de lavagem de dinheiro relacionada a fraudes no INSS.", "artigos": [{"id": 86763, "titulo": "Correção: senador Weverton Rocha (PDT-MA) e a Operação Sem Desconto", "url": "https://g1.globo.com/correcoes/noticia/2026/08/04/correcao-senador-weverton-rocha-pdt-ma-nao-e-alvo-de-nova-fase-da-operacao-sem-desconto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T10:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O G1 errou ao informar que o senador Weverton Rocha (PDT-MA) foi alvo de uma nova fase da Operação Sem Desconto. Na verdade, ele já havia sido alvo em dezembro de 2025 e não estava entre os alvos da fase mais recente.", "titulo_pt": "Correção: g1 errou ao informar que Weverton Rocha era alvo de nova fase da Operação Sem Desconto", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 86739, "titulo": "PF mira parentes de senador Weverton Rocha e advogado Willer Tomaz em nova fase de investigação sobre fraudes no INSS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/pf-mira-parentes-de-senador-weverton-rocha-e-advogado-willer-tomaz-em-nova-fase-de-investigacao-sobre-fraudes-no-inss.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-04T10:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal iniciou uma nova fase da Operação Sem Desconto na manhã de terça-feira (4) para investigar suspeitas de lavagem de dinheiro relacionadas a fraudes no INSS. O alvo inclui parentes do senador Weverton Rocha e o advogado Willer Tomaz.", "titulo_pt": "PF investiga parentes de senador Weverton Rocha e advogado em nova fase da operação sem desconto sobre fraudes no INSS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 86766, "titulo": "PF deflagra nova fase da Operação Sem Desconto e mira familiares do senador Weverton Rocha", "url": "https://g1.globo.com/politica/blog/camila-bomfim/post/2026/08/04/operacao-sem-desconto-fraude-inss-aposentadorias-pensoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal deflagrou uma nova fase da Operação Sem Desconto, focando em suspeitos de lavagem de dinheiro relacionada a fraudes no INSS. Entre os alvos estão familiares do senador Weverton Rocha (PDT-MA), mas o parlamentar não foi alvo desta fase.", "titulo_pt": "PF inicia nova fase da Operação Sem Desconto e mira familiares de Weverton Rocha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 87678, "titulo": "Arrest of ‘fake Filipino’ sharpens concerns over security risks in key sectors", "url": "https://www.scmp.com/week-asia/people/article/3362953/arrest-fake-filipino-sharpens-concerns-over-security-risks-key-sectors?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-04T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um chinês foi detido acusado de se passar por filipino durante mais de duas décadas, aumentando as preocupações na Filipinas sobre o risco de fraudes de identidade serem usadas para acessar setores cruciais à segurança nacional. As autoridades migratórias prendeceram Lawrence Ke Sy, presidente e maior acionista da Maxipro Development Corp., empresa envolvida em projetos nacionais.", "titulo_pt": "Detenção de 'chines falso' intensifica preocupações sobre riscos de segurança em setores vitais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 87399, "titulo": "More than 150 migrants rescued after boat catches fire in Channel", "url": "https://www.bbc.co.uk/news/articles/c4gkpeppjyqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-04T11:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 150 migrantes foram resgatados após o barco pegar fogo durante uma tentativa de atravessar para o Reino Unido. De acordo com as autoridades francesas, a embarcação estava em chamas quando tentava chegar ao país.", "titulo_pt": "Mais de 150 migrantes resgatados após barco pegar fogo na crossing do canal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 87400, "titulo": "Ukraine strikes more Wildberries sites as five killed in Moscow region", "url": "https://www.bbc.co.uk/news/articles/c151pkww79zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-04T11:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais infraestruturas da maior loja virtual russa, Wildberries, foram atingidas na Ucrânia. Cinco pessoas morreram quando um míssil atingiu uma instalação em uma região próxima a Moscou.", "titulo_pt": "Ucrânia atinge mais sites do Wildberries; cinco mortos em região de moscou", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 87679, "titulo": "US has used ‘virtually all’ of its long-range precision missiles in Iran war, sources say", "url": "https://www.scmp.com/news/us/politics/article/3362952/us-has-used-virtually-all-its-long-range-precision-missiles-iran-war-sources-say?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-04T11:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com fontes, o Exército dos Estados Unidos teria usado quase toda sua reserva de mísseis precisos e de longo alcance durante a guerra de cinco meses contra a Irã. Isso levanta preocupações sobre a preparação militar para futuros conflitos.", "titulo_pt": "EUA teriam usado 'quase tudo' dos seus mísseis precisos de longo alcance na guerra com a Irã, dizem fontes", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 87123, "titulo": "How the Mohegan Tribe Lost a Billion-Dollar Casino in South Korea", "url": "https://www.nytimes.com/2026/08/04/world/asia/mohegan-south-korea-casino-bain.html", "fonte_id": "nyt_world", "data_pub": "2026-08-04T11:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Inspire Entertainment Resort, um projeto alternativo ao Macau, capital mundial do jogo, deveria ser uma 'transformacional' para a tribo nativa americana Mohegan.", "titulo_pt": "Como o povo mohégan perdeu um Casino bilionário em Coreia do sul", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 86840, "titulo": "PCDF revela recrutamento interestadual para atentado em Brasília", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pcdf-revela-recrutamento-interestadual-para-atentado-em-brasilia", "fonte_id": "metropoles", "data_pub": "2026-08-04T11:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os investigadores descobriram a existência de um recrutamento interestadual envolvido em um atentado em Brasília e encontraram manuais para a fabricação de artefatos explosivos.", "titulo_pt": "PCDF revela recrutamento interestadual e manuais para fabricação de bombas no caso do atentado em Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86971, "titulo": "Governo do Japão indica investimento em drones para conter avanço da China", "url": "https://www.infomoney.com.br/mundo/governo-do-japao-indica-investimento-em-drones-para-conter-avanco-da-china/", "fonte_id": "infomoney", "data_pub": "2026-08-04T11:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Japão está indicando investimento em drones para combater a crescente presença de navios de guerra chineses no Oceano Pacífico. Este movimento reflete as preocupações japonesas com o avanço da China na região.", "titulo_pt": "Governo do Japão planeja investir em drones para contrarrestar avanço chinês", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 87431, "titulo": "Amid successive energy blackouts, frustration grows in cut-off Cuba", "url": "https://www.france24.com/en/amid-successive-energy-blackouts-frustration-grows-in-cut-off-cuba", "fonte_id": "france24", "data_pub": "2026-08-04T11:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 3 de agosto, alguns cubanos bateram em panelas nas varandas para expressar sua frustração após o sexto apagão elétrico nacional do ano. As sucessivas interrupções no fornecimento de energia estão causando desperdício de alimentos e comprometendo a disponibilidade da água tratada e os serviços públicos.", "titulo_pt": "Diante de sucessivos apagões, frustração cresce na Cuba cortada", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 87612, "titulo": "How migrants are fighting alone to leave ICE centers using a legal remedy Trump seeks to eliminate", "url": "https://english.elpais.com/usa/2026-08-04/how-migrants-are-fighting-alone-to-leave-ice-centers-using-a-legal-remedy-trump-seeks-to-eliminate.html", "fonte_id": "elpais_en", "data_pub": "2026-08-04T11:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organização está fornecendo instruções para que detentos possam apresentar desafios legais 'habeas corpus' por conta própria, sem precisarem pagar honorários de advogados inacessíveis economicamente.", "titulo_pt": "Como imigrantes estão lutando sozinhos para deixar centros ICE usando um recurso legal que Trump quer eliminar", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 87611, "titulo": "‘I had to travel, my life was in danger’: more Florida women seeking out-of-state abortions", "url": "https://english.elpais.com/usa/2026-08-04/i-had-to-travel-my-life-was-in-danger-more-florida-women-seeking-out-of-state-abortions.html", "fonte_id": "elpais_en", "data_pub": "2026-08-04T11:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde a introdução, em maio de 2024, de uma proibição de aborto após seis semanas de gestação, o número de grávidas buscando cuidados fora do estado triplicou.", "titulo_pt": "Eu tive que viajar, minha vida estava em perigo: mais mulheres grávidas da flórida buscam abortos fora do estado", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 87313, "titulo": "They're a world leader in using drones for healthcare. But drones can't do it all", "url": "https://www.npr.org/2026/08/04/g-s1-136906/drones-healthcare-trump-administration-rwanda", "fonte_id": "npr_news", "data_pub": "2026-08-04T11:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Rwanda, drones transportam constantemente suprimentos médicos pelos céus. O governo dos EUA está concedendo um grande financiamento para o projeto enquanto reduz a assistência ao país.", "titulo_pt": "Eles são líderes mundiais no uso de drones para saúde, mas os drones não fazem tudo", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 87501, "titulo": "Tennis star Sabalenka supports sport's new sex test policy", "url": "https://www.dw.com/en/tennis-star-sabalenka-supports-sport-s-new-sex-test-policy/a-78228069?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-04T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tenista número um do mundo feminino, Sabalenka, apoia as novas regras de teste de sexo da WTA. No entanto, outros são mais críticos em relação à política.", "titulo_pt": "Tenista líder mundial apoia novas regras de teste de sexo da wta", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 87643, "titulo": "Fuga di capitali dal mercato obbligazionario Russia, a luglio ritirati 965 milioni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/04/fuga-di-capitali-dal-mercato-obbligazionario-russia-a-luglio-ritirati-965-milioni_be00672a-0616-4118-8f04-d14d5a9a24e5.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-04T10:58:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Houve uma fuga de capitais do mercado obrigacionista russo, com cerca de 965 milhões de euros retirados até julho. Os investidores esperavam cortes mais rápidos nas taxas.", "titulo_pt": "Fuga de capitais do mercado obrigacionista da Rússia, até julho retiraram 965 milhões", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 87314, "titulo": "Authorities arrest arson suspect in connection with wildfires in Spokane", "url": "https://www.npr.org/2026/08/04/g-s1-137274/suspect-arrested-wildfires-spokane", "font _pub": "2026-08-04T11:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IPC-Fipe registrou uma queda de 0,03% em julho, abaixo do esperado. A inflação acumulada nos últimos 12 meses foi de 3,60%. Entre janeiro e julho, houve um acúmulo de 2,08% de inflação.", "titulo_pt": "Ipc-fipe cai 0,03% em julho, abaixo do esperado, e tem inflação de 3,60% em 12 meses", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 86738, "titulo": "Aviação elétrica avança com aposta em aviões híbridos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/aviacao-eletrica-avanca-com-aposta-em-avioes-hibridos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um correspondente observa um avião elétrico que decola sem o motor a funcionar, graças à tecnologia híbrida. Este sistema permite que o avião decolhe mesmo quando o motor principal está desligado.", "titulo_pt": "Aviação elétrica avança com híbridos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 87576, "titulo": "Bessent’s yen intervention signals new era of US ‘currency activism’", "url": "https://www.ft.com/content/1be83506-b897-4c26-97cc-445d7354ee6f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-04T10:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O intervencionismo de Bessent para apoiar o iene mostra que os EUA estão dispostos a interferir em negociações comerciais que contrariam seus interesses.", "titulo_pt": "Intervenção do iene de bessent sinaliza nova era de ‘ativismo cambial’ dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 87525, "titulo": "Palantir jumps 16% on 'otherworldly' commercial revenue — here's what's driving the demand", "url": "https://www.cnbc.com/2026/08/04/palantir-2q-earnings-ai-sovereign-tools.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-04T10:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas comerciais de Palantir aumentaram 16% no segundo trimestre, impulsionadas por uma declaração do CEO Alex Karp sobre a recusa dos clientes em se tornarem dependentes das linguagens de programação.", "titulo_pt": "Palantir registra aumento de 16% nas vendas comerciais - aqui está o que está gerando a demanda", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 87019, "titulo": "STF amplia benefício fiscal para compra de carro por PCDs", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/stf-amplia-beneficio-fiscal-para-compra-de-carro-por-pcds", "fonte_id": "jota", "data_pub": "2026-08-04T10:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) estendeu um benefício fiscal para pessoas com deficiência (PCDs) que compram carros. Este foi o primeiro caso da reforma tributária a ser julgado pelo STF.", "titulo_pt": "STF amplia benefício fiscal para compra de carro por PCDs", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 86741, "titulo": "Locação por temporada passa a ser tratada como hotelaria, mas nem todo anfitrião paga mais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/08/locacao-por-temporada-passa-a-ser-tratada-como-hotelaria-mas-nem-todo-anfitriao-paga-mais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-04T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária do consumo alterou a forma como o Estado tributa a locação por temporada, passando a ser tratada como hotelaria. Agora, a receita bruta é sujeita à incidência de IBS e CBS.", "titulo_pt": "Locação por temporada passa a ser tributada como hotelaria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 87308, "titulo": "Temblor hoy, martes 4 de agosto en Chile: consulta epicentro y magnitud", "url": "https://www.latercera.com/servicios/noticia/temblor-hoy-martes-4-de-agosto-en-chile-consulta-epicentro-y-magnitud/", "fonte_id": "la_tercera", "data_pub": "2026-08-04T09:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Centro Sismológico Nacional da Universidade de Chile registrou movimentos sísmicos recentes. A Senapred forneceu recomendações sobre as ações a serem tomadas em caso de terremoto.", "titulo_pt": "Terremoto hoje, 4 de agosto no Chile: consulte epicentro e magnitude", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 86788, "titulo": "Copom inicia reunião que definirá taxa básica de juros", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/copom-inicia-reuniao-que-definira-taxa-basica-de-juros", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-04T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Começa nesta terça-feira (4) a quinta reunião de 2026 do Comitê de Política Monetária (Copom) do Banco Central (BC). As expectativas são de que a decisão sobre a Taxa Selic seja anunciada dia 5 de agosto, após dois dias de discussões sobre o cenário econômico nacional e internacional.", "titulo_pt": "Comitê de política monetária inicia reunião para definir taxa básica de juros", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 87808, "titulo": "S. Korea, Bangladesh reach agreement in principle on CEPA", "url": "https://en.yna.co.kr/view/AEN20260804008700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-04T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul e Bangladesh chegaram a um acordo preliminar sobre um Acordo de Partenariado Econômico Complementar (CEPA). O anúncio foi feito em Seul no dia 4 de agosto.", "titulo_pt": "Coreia do sul e Bangladesh chegam a acordo preliminar sobre CEPA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 87828, "titulo": "China's chip output jumps nearly 350% in a decade as semiconductor supply chain expands", "url": "https://www.digitimes.com/news/a20260804VL208/industrial-capacity-equipment-production-cxmt.html", "fonte_id": "digitimes", "data_pub": "2026-08-04T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de circuitos integrados industriais na China atingiu 484,28 bilhões em 2025, crescendo quase 350% desde 108,72 bilhões em 2015. O país expandiu sua capacidade de fabricação para chips maduros, memória, embalagem e equipamentos de produção de semicondutores.", "titulo_pt": "Produção chinesa de chip cresce quase 350% em uma década com expansão da cadeia de suprimentos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 86742, "titulo": "Nova era da babá eletrônica? Mercado de monitoramento fatura US$ 100 mi com IA e observação 24 h", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/mercado-de-monitoramento-de-bebes-fatura-us-100-mi-com-ia-e-observacao-24-h.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema inteligente de monitoramento de bebês Nanit tem acompanhado o sono da filha mais velha do autor quase todas as noites. O mercado de monitoramento com inteligência artificial e observação 24 horas gerou faturamento de US$ 100 milhões.", "titulo_pt": "Nova era da babá eletrônica? Mercado de monitoramento fatura US$ 100 mi com IA e observação 24h", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 86743, "titulo": "EUA poupam de nova tarifa setores que lideram resgates por trabalho escravo no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/eua-poupam-de-nova-tarifa-setores-que-lideram-resgates-por-trabalho-escravo-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos EUA poupou de novas tarifas setores brasileiros que lideram resgates por trabalho escravo, contrariando o argumento de que a medida visa combater esse problema. Segundo as informações, os setores isentos da cobrança têm sido frequentemente autuados pela fiscalização trabalhista no Brasil.", "titulo_pt": "EUA poupam de nova tarifa setores que lideram resgates por trabalho escravo no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 87023, "titulo": "ICMS-ST na base de cálculo do PIS e da Cofins: o valor a ser excluído", "url": "https://www.jota.info/opiniao-e-analise/artigos/icms-st-na-base-de-calculo-do-pis-e-da-cofins-o-valor-a-ser-excluido", "fonte_id": "jota", "data_pub": "2026-08-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute qual valor deve ser excluído da base de cálculo do PIS e da Cofins, bem como o critério a ser utilizado para essa exclusão.", "titulo_pt": "ICMS-ST na base de cálculo do PIS e da Cofins: qual valor deve sair e por qual critério?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 87812, "titulo": "S. Korean won slightly falls against U.S. dollar on foreign outflows", "url": "https://en.yna.co.kr/view/AEN20260804007700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-04T07:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano cedeu ligeiramente em relação ao dólar americano devido a saídas de capitais estrangeiros.", "titulo_pt": "Won sul-coreano se desvaloriza levemente contra o dólar americano por causa de saídas de capitais estrangeiros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 87583, "titulo": "BP to sell $4bn US biogas business as profits more than double", "url": "https://www.ft.com/content/fa298199-b824-4ca9-a3a0-440eb320ac61?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-04T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A BP anunciou a intenção de vender sua empresa de biogás nos Estados Unidos por cerca de 4 bilhões de dólares. As lucras da empresa aumentaram mais do que o dobro.", "titulo_pt": "BP planeja vender negócio de biogás nos EUA por 4 bilhões de dólares, com lucros dobrados", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 87531, "titulo": "CNBC Daily Open: A U.S. yen intervention dressed in euros", "url": "https://www.cnbc.com/2026/08/04/cnbc-daily-open-yen-intervention-dollar-euro-fx.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-04T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que Washington vendeu euros para financiar sua intervenção no mercado de câmbio, evitando impactar o sensível mercado do Tesouro dos EUA.", "titulo_pt": "CNBC diário aberto: uma intervenção em ienes disfarçada em euros", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 87799, "titulo": "Is This Poker Player Bluffing? The AI Thinks So", "url": "https://www.wired.com/story/ai-tells-detection-world-series-of-poker-espn/", "fonte_id": "wired", "data_pub": "2026-08-04T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante a transmissão do World Series of Poker de 2026, a ESPN apresentou uma ferramenta chamada 'AI tells detection'. Essa ferramenta visa determinar se um jogador de poker está enganando. Não há informações adicionais sobre seu impacto no futuro do jogo.", "titulo_pt": "Este jogador de Poker está enganando? A IA pensa assim", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 87800, "titulo": "How One Startup Built a (Mostly) China-Free Robot", "url": "https://www.wired.com/story/how-one-startup-built-a-mostly-china-free-robot/", "fonte_id": "wired", "data_pub": "2026-08-04T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ati Robotics monta seus robôs na Índia e utiliza apenas alguns componentes chineses. Essa estratégia pode se beneficiar caso a administração de Trump implemente restrições sobre robôs chineses.", "titulo_pt": "Como uma Startup construiu um (quase) Robot sem produtos da china", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 86821, "titulo": "Nem as carteiras ‘invioláveis’ escapam: hackers roubam 110 milhões de dólares em bitcoins", "url": "https://veja.abril.com.br/economia/nem-as-carteiras-inviolaveis-escapam-hackers-roubam-110-milhoes-de-dolares-em-bitcoins/", "fonte_id": "veja", "data_pub": "2026-08-04T10:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hackers roubaram 110 milhões de dólares em bitcoins durante um ataque. O incidente ressalta a vulnerabilidade das criptomoedas e demonstra como falhas de software podem levar a perdas irreversíveis.", "titulo_pt": "Carteiras de bitcoin não são imunes: hackers roubam 110 milhões", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 87575, "titulo": "OpenAI hits back at Apple over ‘oddly personal’ trade secrets fight", "url": "https://www.ft.com/content/7da4af42-178d-431a-91db-7e82eecc98dd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-04T10:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conflito legal entre OpenAI e Apple intensificou-se após uma parceria de IA para dispositivos dar lugar a desavenças. A colaboração inicial sobre tecnologia de inteligência artificial em dispositivos se transformou em um litígio envolvendo segredos comerciais pessoais.", "titulo_pt": "Openai reage ao conflito com a Apple sobre 'segredos comerciais estranhamente pessois'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 87681, "titulo": "Has a Chinese physical AI start-up manipulated a global ranking to beat Nvidia?", "url": "https://www.scmp.com/tech/tech-war/article/3362923/has-chinese-physical-ai-start-manipulated-global-ranking-beat-nvidia?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-04T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup chinesa de inteligência artificial física, Spirit AI, teve um breve período de liderança global no RoboArena, uma plataforma de benchmarking para sistemas autônomos, superando a empresa americana Nvidia. Este evento levanta questionamentos sobre a competição entre Estados Unidos e China na desenvolvimento de tecnologias avançadas de IA.", "titulo_pt": "Startup chinesa de AI física teria manipulado ranking global para vencer Nvidia?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 87801, "titulo": "‘Everyone Is Doing It’: The Truth About AI in Hollywood", "url": "https://www.wired.com/story/the-big-interview-podcast-matthew-belloni-puck/", "fonte_id": "wired", "data_pub": "2026-08-04T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matthew Belloni, da Puck, afirma que a inteligência artificial já se tornou parte silenciosa do processo de produção cinematográfica. Agora, a luta não é mais sobre se Hollywood usará a tecnologia, mas sim sobre quem terá controle sobre seu futuro desenvolvimento.", "titulo_pt": "'Todos estão fazendo isso': a verdade sobre a IA no Hollywood", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 87527, "titulo": "Apple launches fresh legal challenge against UK encrypted data access demand", "url": "https://www.cnbc.com/2026/08/04/apple-encrypted-data-legal-challenge-uk.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-04T10:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple apresentou uma nova ação legal um ano após o Reino Unido abandonar sua demanda inicial de acesso aos dados dos usuários britânicos e americanos armazenados na Apple.", "titulo_pt": "Apple inicia novo desafio legal contra pedido do reino unido de acesso a dados criptografados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 87685, "titulo": "Is China’s DF-17 hypersonic glider ready to strike from anywhere at any time?", "url": "https://www.scmp.com/news/china/military/article/3362942/chinas-df-17-hypersonic-glider-ready-strike-anywhere-any-time?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-04T10:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documentário exibido na televisão estatal chinesa revelou detalhes sobre os testes envolvendo o sistema de guia hipersônico operacional DF-17, destacando sua flexibilidade. O programa Securing Victory, que marcou o 99º aniversário do Exército Popular da Libertação (EPL), focou no Rocket Force da EPL, responsável por mísseis terrestres e uma parte significativa do arsenal nuclear chinês.", "titulo_pt": "DF-17: está pronto para atacar de qualquer lugar a qualquer momento?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 87429, "titulo": "The global grassroots gatherings trying to humanize the AI boom", "url": "https://restofworld.org/2026/global-ai-salons-grassroots-silicon-valley/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-08-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos locais de tecnologia em Kenia, Índia e Estados Unidos estão construindo comunidades e discutindo sobre IA, mas também enfrentam perguntas sobre privilégio e alcance.", "titulo_pt": "Reuniões globais de base local tentando humanizar a expansão da IA", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 87802, "titulo": "How Data Centers Broke American Politics", "url": "https://www.wired.com/story/how-data-centers-broke-american-politics/", "fonte_id": "wired", "data_pub": "2026-08-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo explora como o Unabomber, um tecnólogo associado a Steve Bannon e Bernie Sanders ensinaram sobre a grande rebelião contra os centros de dados nos Estados Unidos em 2026.", "titulo_pt": "Como os centros de dados romperam a política americana", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 87803, "titulo": "The Real Story Behind the 2018 Google Walkout", "url": "https://www.wired.com/story/2018-google-walkout-dont-be-evil-claire-stapleton/", "fonte_id": "wired", "data_pub": "2026-08-04T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2018, mais de 20 mil funcionários saíram em protesto contra como a Google lidou com acusações de assédio sexual. Eles organizaram o movimento internamente dentro da empresa.", "titulo_pt": "A verdade por trás do greve na Google de 2018", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 87804, "titulo": "Mistral Is in the Right Place at the Right Time", "url": "https://www.wired.com/story/mistral-is-in-the-right-place-at-the-right-time/", "fonte_id": "wired", "data_pub": "2026-08-04T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mistral, um laboratório de IA francês, está aproveitando o momento atual de destaque das grandes modelagens de inteligência artificial. Isso ocorre no contexto de recentes turbulências nas gigantes da tecnologia dos Estados Unidos.", "titulo_pt": "Mistral está no lugar certo no tempo certo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 87741, "titulo": "Autonomous A2Z wins W11b UAE self-driving deal", "url": "https://www.koreaherald.com/article/10830867", "fonte_id": "korea_herald", "data_pub": "2026-08-04T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Autonomous A2Z firmou um contrato de exportação no valor de 11 bilhões de wones (aproximadamente US$7,7 milhões) com a Space42, uma companhia de inteligência artificial baseada nos Emirados Árabes Unidos, para fornecer veículos autônomos e soluções full-stack. O acordo visa expandir a presença da Autonomous A2Z no mercado de mobilidade inteligente dos Emirados Árabes.", "titulo_pt": "Autonomous A2Z vende 11 bi de wones em contrato de veículos autônomos para os emirados árabes", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 87829, "titulo": "China claims 8 in 10 robots worldwide are made at home", "url": "https://www.digitimes.com/news/a20260803PD230/robot-market-technology-industrial-supply-chain.html", "fonte_id": "digitimes", "data_pub": "2026-08-04T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Nacional de Desenvolvimento e Reforma da China afirmou que os robôs humanoides representam um símbolo importante do setor emergente de fabricação do país, com 80% dos robôs humanoides e quadrupedais vendidos globalmente sendo produzidos por empresas chinesas. O anúncio foi feito em uma coletiva de imprensa realizada no dia 31 de julho e mencionou avanços na designação de ICs, equipamentos de semicondutores, fabricação de wafers e embalagem e testes.", "titulo_pt": "China afirma que 8 em cada 10 robôs do mundo são fabricados no país", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 87379, "titulo": "Exclusive: College students want ethical AI", "url": "https://www.axios.com/2026/08/04/college-ai-use-kogod-american-university", "fonte_id": "axios", "data_pub": "2026-08-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de estudantes de negócios que usam regularmente IA aumentou de 6,2% para 29% nos últimos três anos, segundo pesquisa da Escola de Negócios Kogod da Universidade Americana. Embora haja preocupação sobre o uso responsável da IA, a maioria dos estudantes não está completamente evitando a tecnologia.", "titulo_pt": "Estudantes de negócios querem IA ética", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 87691, "titulo": "Chinese chip-tool maker AMEC says first-half profit to nearly quadruple amid soaring demand", "url": "https://www.scmp.com/tech/tech-trends/article/3362918/chinese-chip-tool-maker-amec-says-first-half-profit-nearly-quadruple-amid-soaring-demand?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A AMEC, principal fabricante chinesa de ferramentas para chips, projeta que seu lucro no primeiro semestre do ano quase quadruplicará devido à forte demanda por semicondutores domesticados, apesar das sanções dos Estados Unidos. Segundo relatório não auditado, o faturamento entre janeiro e junho foi pelo menos de 2,7 bilhões de yuanes (400 milhões de dólares), representando um crescimento anual de 282%.", "titulo_pt": "Fabricante chines de ferramentas para chips projeta lucro quase quadruplicado no primeiro semestre", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 87866, "titulo": "Research finds rhetoric around #MeToo often focused on punishment, not causes of violence", "url": "https://phys.org/news/2026-08-rhetoric-metoo-focused-violence.html", "fonte_id": "phys_org", "data_pub": "2026-08-04T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Universidade do Kansas indica que as conversas sobre o movimento #MeToo tendem a se concentrar na punição e na pobreza forçada como forma de justiça, em vez de investigar as razões subjacentes à violência baseada no gênero.", "titulo_pt": "Pesquisa mostra que discussões sobre #MeToo frequentemente se concentram na punição, não nas causas da violência", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 87082, "titulo": "Fin del mito: investigadores del Conicet revelaron la dieta extrema de los primeros humanos en América", "url": "https://www.lanacion.com.ar/sociedad/fin-del-mito-investigadores-del-conicet-revelaron-la-dieta-extrema-de-los-primeros-humanos-en-nid04082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-04T11:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Conicet descobriram que as primeiras populações humanas na América se alimentavam principalmente de herbívoros pesados. O trabalho demonstra que a dieta inicial dos primeiros habitantes era baseada em animais de grande porte.", "titulo_pt": "Fim do mito: investigadores do Conicet revelaram a dieta extrema dos primeiros humanos na América", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 86815, "titulo": "Exercícios para os ossos: estudo compara diferentes tipos de treino e mostra o que realmente faz diferença", "url": "https://veja.abril.com.br/saude/exercicios-para-os-ossos-estudo-compara-diferentes-tipos-de-treino-e-mostra-o-que-realmente-faz-diferenca/", "fonte_id": "veja", "data_pub": "2026-08-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revisou 24 ensaios clínicos e concluiu que a intensidade do exercício é mais importante do que a duração para estimular a formação de novo osso.", "titulo_pt": "Exercícios para os ossos: intensidade é mais crucial do que duração", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 87867, "titulo": "Aquarium sends shark eggs to bolster wild populations", "url": "https://phys.org/news/2026-08-aquarium-shark-eggs-bolster-wild.html", "fonte_id": "phys_org", "data_pub": "2026-08-04T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Aquário de Chicago enviou quatro ovos de tubarão-zebra para a Raja Ampat, na Indonésia, como parte de um esforço de conservação para essa espécie em perigo. Este é o primeiro envio do aquário à região e marca sua contribuição para o Projeto StAR (Augmentação e Recuperação de Stegostoma tigrinum) através da iniciativa ReShark.", "titulo_pt": "Aquário envia ovos de tubarão-zebra para fortalecer populações selvagens", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 87973, "titulo": "Canadian wildfires are reducing solar power generation in Europe", "url": "https://www.newscientist.com/article/2582931-canadian-wildfires-are-reducing-solar-power-generation-in-europe/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-04T10:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As chamas canadenses bloquearam a luz solar, reduzindo a geração de energia solar na Europa e em partes da América do Norte por um valor estimado próximo a 2 bilhões de dólares apenas em 2023.", "titulo_pt": "Incêndios no canadá estão diminuindo a geração de energia solar na Europa", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 88033, "titulo": "Are aliens running out of places to hide? It turns out we've searched much more of the galaxy than we realized", "url": "https://www.space.com/space-exploration/search-for-life/are-aliens-running-out-of-places-to-hide-it-turns-out-weve-searched-much-more-of-the-galaxy-than-we-realized", "fonte_id": "space_com", "data_pub": "2026-08-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos podem ter examinado milhões de estrelas a mais do que se imaginava, o que pode levar ao desenvolvimento de novos métodos para procurar sinais radiofônicos extraterrestres.", "titulo_pt": "Extraterrestres estão ficando sem lugares para esconder? Descobrimos que já examinamos muito mais estrelas do que pensávamos", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 88089, "titulo": "Towards an AI for Africa", "url": "https://aeon.co/essays/an-ai-for-africa-would-be-built-on-hunhu-ubuntu-ethics", "fonte_id": "aeon", "data_pub": "2026-08-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute como o desenvolvimento de inteligência artificial (IA) ocidental pode conflitar com os valores africanos de conexão e comunidade, conforme expressos no conceito Ubuntu.", "titulo_pt": "Para uma IA para áfrica", "veiculo": "Aeon Magazine", "pais": "Reino Unido", "classe": "A"}, {"id": 87910, "titulo": "Rocketdyne reemerges as standalone space company", "url": "https://spacenews.com/rocketdyne-reemerges-as-standalone-space-company/", "fonte_id": "spacenews", "data_pub": "2026-08-04T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AE Industrial, uma empresa de private equity, adquiriu 60% da Rocketdyne, que agora opera como uma companhia espacial independente. L3Harris mantém uma participação minoritária no negócio.", "titulo_pt": "Rocketdyne se torna empresa espacial independente", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 86802, "titulo": "Impacto de meteorito que levou ao fim de dinossauros teria gerado incêndios globais", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/impacto-de-meteorito-que-levou-ao-fim-de-dinossauros-teria-gerado-incendios-globais.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O impacto do meteorito que levou à extinção dos dinossauros não avianos, há 66 milhões de anos, pode ter causado uma onda de calor letal global nas primeiras horas após a colisão. A camada de poeira fina na atmosfera intensificou o pulso térmico, matando animais expostos e iniciando incêndios em diferentes regiões do mundo.", "titulo_pt": "Impacto de meteorito que levou ao fim dos dinossauros teria gerado incêndios globais", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 87692, "titulo": "Shenzhen-based AI mathematician Yurii Nesterov wins top prize in applied maths", "url": "https://www.scmp.com/news/china/science/article/3362465/shenzhen-based-ai-mathematician-yurii-nesterov-wins-top-prize-applied-maths?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": o": "US Northwest battles wildfires after Spokane neighborhoods scorched", "url": "https://phys.org/news/2026-08-northwest-wildfires-spokane-neighborhoods.html", "fonte_id": "phys_org", "data_pub": "2026-08-04T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos destrutivos, impulsionados por uma seca severa e calor intenso, devastaram as áreas urbanas de Spokane no norte da América do Norte, obrigando o deslocamento de 65 mil pessoas e causando danos a centenas de edifícios. Os bombeiros trabalhavam empenhadamente para conter as chamas.", "titulo_pt": "Noroeste dos estados unidos enfrenta incêndios após áreas residenciais de Spokane serem devastadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 86799, "titulo": "São Paulo: Flipei terá mais de 180 convidados e 65 mesas de debates", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-08/sao-paulo-flipei-tera-mais-de-180-convidados-e-65-mesas-de-debates", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-08-04T11:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A oitava edição da Festa Literária Pirata das Editoras Independentes (Flipei) ocorrerá de 5 a 9 de outubro na região central de São Paulo, com mais de 180 convidados e 65 mesas de debates. O evento se destaca como um palco de resistência cultural e pensamento crítico desde 2018.", "titulo_pt": "Flipei terá 180 convidados e 65 mesas de debates em sua oitava edição", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 87995, "titulo": "Ariana Grande expands on decision to ‘step back from visibility’, telling fans it was ‘not reactive or impulsive’", "url": "https://www.theguardian.com/music/2026/aug/04/ariana-grande-decision-to-step-back-from-visibility-chicago-petal", "fonte_id": "guardian_culture", "data_pub": "2026-08-04T10:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ariana Grande explicou que s
