pais": "Japão", "classe": "A"}, {"id": 188718, "titulo": "An optimist’s guide to the bond market", "url": "https://www.ft.com/content/4ab6df98-f14d-49d1-a170-8087dc517b08?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de títulos poderia estar muito pior. A situação atual é melhor do que poderia ser.", "titulo_pt": "Guia otimista para o mercado de títulos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 188337, "titulo": "Mensagens mostram que Campos Neto convidou Vorcaro para encontro em casa quando presidia BC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/mensagens-mostram-que-campos-neto-convidou-vorcaro-para-encontro-em-casa-quando-presidia-bc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T03:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mensagens do celular de Daniel Vorcaro, ex-banqueiro do Banco Master, mostram que Roberto Campos Neto, ex-presidente do Banco Central, convidou Vorcaro para um encontro em sua casa no interior de São Paulo.", "titulo_pt": "Mensagens mostram que Campos Neto convidou Vorcaro para encontro em casa quando presidia BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 188163, "titulo": "Seoul shares narrow losses late Thurs. morning amid inflation woes", "url": "https://en.yna.co.kr/view/AEN20261001005000320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T02:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul registraram perdas mais moderadas no final da manhã de quinta-feira, diante das preocupações relacionadas à inflação.", "titulo_pt": "Seul registra perdas mais moderadas no final da manhã de quinta-feira, diante das preocupações com a inflação", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 187263, "titulo": "Brasil gera quase 4,6 milhões de empregos para beneficiários do Bolsa Família desde 2023, diz FGV", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/brasil-gera-quase-46-milhoes-de-empregos-para-beneficiarios-do-bolsa-familia-desde-2023-diz-fgv.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil gerou um saldo de quase 4,6 milhões de empregos formais para beneficiários do Bolsa Família entre janeiro de 2023 e julho de 2026, segundo estudo da FGV. Este resultado ocorreu durante o terceiro governo de Lula, do PT.", "titulo_pt": "Brasil gera quase 4,6 milhões de empregos para beneficiários do Bolsa Família desde 2023, diz FGV", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187265, "titulo": "Caixa fez reunião com loteria uruguaia para trocar informações sobre monopólio estatal de bet", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/caixa-fez-reuniao-com-loteria-uruguaia-para-trocar-informacoes-sobre-monopolio-estatal-de-bet.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O alto escalão da Caixa Loterias realizou uma reunião com autoridades uruguaias para discutir o modelo de apostas online uruguaio, que envolve um monopólio da estatal Supermatch e a permissão apenas para apostas esportivas.", "titulo_pt": "Caixa realizou reunião com loteria uruguaia sobre modelo de apostas online", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 188170, "titulo": "Finance minister expects exports to top US$1 tln this year", "url": "https://en.yna.co.kr/view/AEN20261001003000320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T01:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Finanças da Coreia do Sul espera que as exportações ultrapassem 1 trilhão de dólares neste ano.", "titulo_pt": "Ministro das finanças da Coreia do sul espera que exportações ultrapassem 1 trilhão de dólares neste ano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 188662, "titulo": "Trump, CEOs try to shed AI's toxic branding", "url": "https://www.axios.com/2026/10/01/superintelligence-si-ai-trump", "fonte_id": "axios", "data_pub": "2026-10-01T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidente dos Estados Unidos, Donald Trump, e CEOs como Jensen Huang, CEO da Nvidia, estão liderando uma rebranding de IA, adotando o termo 'superinteligência' (SI) para tentar mudar o narrative público. Esta mudança visa mitigar o impacto negativo potencial da IA e dos centros de dados na sua desenvolvimento, considerados poderosos e perigosos para a existência humana.", "titulo_pt": "Trump e CEOs tentam desvincular a marca tóxica da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 188851, "titulo": "The Secrets of the US Spyware King", "url": "https://www.wired.com/story/the-secrets-of-the-us-spyware-king/", "fonte_id": "wired", "data_pub": "2026-10-01T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma entrevista exclusiva com a WIRED, o CEO da Paragon Solutions, Andrew Boyd, revela os limites da promessa da empresa de impedir que atores mal-intencionados abusem de sua poderosa ferramenta de espionagem.", "titulo_pt": "Os segredos do rei da espyware dos EUA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 188330, "titulo": "Google lança novo modelo Gemini com salvaguardas em meio ao debate sobre segurança da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/google-lanca-novo-modelo-gemini-com-salvaguardas-em-meio-ao-debate-sobre-seguranca-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google lançou o novo modelo de inteligência artificial Gemini 4 Argon em 30 de janeiro de 2026, em meio a debates sobre a segurança da IA. O objetivo é competir com concorrentes como OpenAI e Anthropic.", "titulo_pt": "Google lança novo modelo Gemini com salvaguardas em meio ao debate sobre segurança da IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 188852, "titulo": "Casio’s Crystal G-Shock Is the Most Expensive Ever Made", "url": "https://www.wired.com/story/casio-crystal-g-shock-is-the-most-expensive-ever-made/", "fonte_id": "wired", "data_pub": "2026-10-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O G-Shock MRG-D5000 com esmeralda azul completa foi lançado, sendo o G-Shock mais caro já produzido, superando o valor de relógios como a Patek Philippe e o carro Porsche Macan.", "titulo_pt": "Casio’s Crystal G-Shock é o mais caro já produzido", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 188900, "titulo": "China ramps up Micro OLED capacity ahead of proven smart glasses demand", "url": "https://www.digitimes.com/news/a20261001PD211/smart-glasses-capacity-demand-market-production.html", "fonte_id": "digitimes", "data_pub": "2026-10-01T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas como BOE, SeeYA Technology e Sidtek estão aumentando a produção de Micro OLED para óculos inteligentes, que estão ganhando maior atenção no mercado. No entanto, fontes da indústria alertam que a demanda por essas telas ainda é incerta e que a expansão da capacidade antes de uma demanda provada pode levar ao excesso de oferta no mercado.", "titulo_pt": "China intensifica produção de Micro OLED ante demanda crescente de óculos inteligentes", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 188332, "titulo": "Regulador dos EUA amplia investigação sobre Anthropic e OpenAI após invasões de agentes de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/regulador-dos-eua-amplia-investigacao-sobre-anthropic-e-openai-apos-invasoes-de-agentes-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A FTC está ampliando uma investigação sobre a Anthropic, a OpenAI e outras empresas de inteligência artificial em relação aos danos causados por seus produtos, após incidentes de invasão cibernética. A investigação visa avaliar os impactos negativos dos sistemas de IA dessas empresas.", "titulo_pt": "Regulador dos EUA amplia investigação sobre Anthropic e OpenAI após invasões de agentes de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 188400, "titulo": "Amazon x Meta: Quem controlará as compras feitas por IA?", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/amazon-x-meta-quem-controlara-as-compras-feitas-por-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon impôs uma restrição à Meta, impedindo o agente de inteligência artificial Muse de realizar compras na loja virtual da empresa. Especialistas indicam que há uma concorrência entre as empresas pelo acesso direto aos clientes.", "titulo_pt": "Amazon x Meta: quem controlará as compras feitas por IA?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 188831, "titulo": "Maxwell smart: new Chinese embodied model tops global AI ranking on physical tasks", "url": "https://www.scmp.com/news/china/science/article/3369420/maxwell-smart-new-chinese-embodied-model-tops-global-ai-ranking-physical-tasks?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-01T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo modelo de IA chamado Maxwell, desenvolvido pelo Instituto de Inteligência Artificial para Indústrias da Academia Chinesa de Ciências, alcançou o primeiro lugar no benchmark Meta-World para tarefas físicas de robôs. O Maxwell obteve uma pontuação de 91,9, a melhor já registrada no benchmark de simulação.", "titulo_pt": "Maxwell: novo modelo chinês de IA lidera ranking global em tarefas físicas de robôs", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 188867, "titulo": "Samsung Life-backed Hayfin opens Seoul office", "url": "https://www.koreaherald.com/article/10890737", "fonte_id": "korea_herald", "data_pub": "2026-10-01T06:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hayfin Capital Management, uma empresa de gestão de ativos de capital alternativo com sede na Europa, com ativos gerenciados de 40 bilhões de euros, abriu um escritório em Seul para fortalecer suas relações com investidores institucionais coreanos e aumentar suas investidas no país, especialmente no setor de finanças marítimas. Chris Choi, ex-chefe de private equity da Ásia-Pacífico da UBS Asset Management, foi nomeado para liderar a nova unidade.", "titulo_pt": "Hayfin, apoiada pela samsung life, abre escritório em seul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 188404, "titulo": "Copilot no Excel: 10 tarefas que a IA consegue fazer por você", "url": "https://exame.com/inteligencia-artificial/copilot-no-excel-10-tarefas-que-a-ia-consegue-fazer-por-voce/", "fonte_id": "exame", "data_pub": "2026-10-01T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O assistente da Microsoft no Excel pode realizar diversas tarefas, desde cálculos até análise de dados, através de comandos em linguagem natural.", "titulo_pt": "Copiloto no Excel: 10 tarefas que a IA consegue fazer por você", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 188877, "titulo": "Cho Hyun-joon sees bio-materials powering Hyosung’s next century", "url": "https://www.koreaherald.com/article/10890620", "fonte_id": "korea_herald", "data_pub": "2026-10-01T05:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyosung TNC iniciou a produção comercial em um planta de bio-BDO de US$ 1 bilhão em Ho Chi Minh City, Vietnã, completando uma cadeia de suprimento integrada que transforma matérias-primas baseadas em cana-de-açúcar em elastano. A planta pode produzir 50.000 toneladas anualmente, com infraestrutura para ampliar a capacidade para 200.000 toneladas conforme a demanda aumentar.", "titulo_pt": "Cho Hyun-joon vê materiais biológicos impulsionando o próximo século da Hyosung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 188878, "titulo": "Samsung to launch first AI glasses in November, taking aim at Meta", "url": "https://www.koreaherald.com/article/10890619", "fonte_id": "korea_herald", "data_pub": "2026-10-01T05:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung lançará suas primeiras óculos de realidade aumentada com inteligência artificial no mês de novembro. A empresa entrará em um mercado emergente de óculos AI, onde a Meta já possui uma liderança cedo conquistada com óculos inteligentes sem exibição de tela, mas equipados com câmeras.", "titulo_pt": "Samsung lançará primeiros óculos AI em novembro, competindo com a Meta", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 188413, "titulo": "Além do ChatGPT: as funções 'escondidas' do Claude e Gemini para análise de dados", "url": "https://exame.com/inteligencia-artificial/alem-do-chatgpt-as-funcoes-escondidas-do-claude-e-gemini-para-analise-de-dado/", "fonte_id": "exame", "data_pub": "2026-10-01T05:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os assistentes Claude e Gemini podem analisar arquivos, identificar padrões e converter dados em gráficos e outros materiais úteis.", "titulo_pt": "Além do ChatGPT: as funções 'escondidas' do Claude e Gemini para análise de dados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 188913, "titulo": "Analysis: China's AI data center buildout vaults to No. 2 as Big Tech capex races toward US$100 billion", "url": "https://www.digitimes.com/news/a20261001PD218/china-data-center-capex-capacity-expansion.html", "fonte_id": "digitimes", "data_pub": "2026-10-01T04:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão rápida de aplicações de inteligência artificial no China está impulsionando uma nova onda de construção de centros de dados. As estimativas indicam que o país já possui mais de 24GW de capacidade de centros de dados e manterá esse nível até o final de 2026, tornando-o o segundo maior mercado de centros de dados do mundo, atrás dos Estados Unidos.", "titulo_pt": "Análise: expansão rápida de AI No china eleva a construção de centros de dados para o segundo lugar", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 188914, "titulo": "China's chip-tool localization accelerates: ACM Research backlog jumps 88%", "url": "https://www.digitimes.com/news/a20261001VL211/acm-equipment-revenue-2026-expansion.html", "fonte_id": "digitimes", "data_pub": "2026-10-01T04:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estoque de pedidos da ACM Research (Shanghai) aumentou em consonância com a expansão dos equipamentos semicondutores na China, proporcionando uma base maior para futuras entregas. O investimento em capacidade relacionado à IA e a localização continuam a sustentar a demanda.", "titulo_pt": "Localização de ferramentas de chip da china avança: estoque de pedidos da ACM Research aumenta 88%", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 188916, "titulo": "China OSAT share in cloud AI accelerators to hit 13% in 2026 as local ASIC volume ramps up", "url": "https://www.digitimes.com/news/a20261001PD227/osat-packaging-cloud-ai-asic-2026.html", "fonte_id": "digitimes", "data_pub": "2026-10-01T04:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está acelerando o desenvolvimento de chips de computação de IA domesticados, com gigantes tecnológicos locais como Huawei, Cambricon e Alibaba entrando em produção em massa de aceleradores ASIC personalizados. Esses chips estão sendo direcionados para provedores de OSAT chineses como JCET Group, Tongfu Microeletrônica e SJ Semiconductor, levando a uma expansão constante da participação dos provedores de OSAT chineses no mercado global de aceleradores de IA em nuvem.", "titulo_pt": "Participação chinesa em aceleradores de IA em nuvem deve chegar a 13% em 2026 com aumento da produção de asics locais", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 188523, "titulo": "Los perros aprenden palabras de la misma forma que los bebés humanos, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/los-perros-aprenden-palabras-de-la-misma-forma-que-los-bebes-humanos-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo comparou a atividade cerebral de cães e humanos em relação a diferentes sequências sonoras, revelando que os cães aprendem palavras de maneira semelhante aos bebês humanos.", "titulo_pt": "Cães aprendem palavras da mesma forma que bebês humanos, sugere estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 188327, "titulo": "Borboletas podem enganar predadores com ilusão de ótica", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/borboletas-podem-enganar-predadores-com-ilusao-de-otica.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa recente indica que as asas de borboletas podem funcionar como um mecanismo de defesa, criando ilusões de ótica que enganam os predadores ao dificultar a avaliação da velocidade e direção durante o voo.", "titulo_pt": "Borboletas podem enganar predadores com ilusão de ótica", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 188925, "titulo": "STAT+: Can a top Republican from a bygone political era fix pharma’s woes in Washington?", "url": "https://www.statnews.com/2026/10/01/eric-cantor-phrma-populist-drug-policy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eric Cantor, um republicano influente, enfrentará uma reação bipartidária em Washington sobre os custos crescentes da saúde.", "titulo_pt": "Um republicano de outra era pode resolver os problemas da farmacêutica em Washington?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 188926, "titulo": "STAT+: Two key Senate health committees face major shake-ups", "url": "https://www.statnews.com/2026/10/01/midterm-election-health-care-policy-impact-senate-republican-turnover/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois importantes comitês do Senado que lidam com questões de saúde estão prestes a sofrer mudanças significativas no comando republicano. Isso significa que os trabalhos desses comitês serão influenciados por novos membros da maioria republicana.", "titulo_pt": "Dois comitês senadores de saúde enfrentam mudanças significativas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 188927, "titulo": "Opinion: I studied GLP-1 use in children. The results are reassuring", "url": "https://www.statnews.com/2026/10/01/glp-1-weight-loss-drugs-children-research-obesity-disease/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cirurgião de transplantes estudou o uso de medicamentos GLP-1 para perda de peso em crianças e concluiu que intervir na infância poderia evitar danos irreversíveis durante décadas.", "titulo_pt": "Opinião: estudamos o uso de GLP-1 em crianças. Os resultados são aliviadores", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 188928, "titulo": "Opinion: Claude analyzed my genome in 30 minutes. Now we need standards for the results", "url": "https://www.statnews.com/2026/10/01/claude-ai-genome-analysis-standards-ethics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2009, analisar o genoma completo do Euan Ashley exigiu 30 pessoas e quase um ano. Em 2026, Claude realizou a análise em 30 minutos por cerca de 5 dólares.", "titulo_pt": "Opinião: claude analisou meu genoma em 30 minutos. Agora precisamos de padrões para os resultados.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 188909, "titulo": "China's 'BEST' fusion reactor enters the engineering endgame", "url": "https://www.digitimes.com/news/a20261001VL210/plasma-supply-chain.html", "fonte_id": "digitimes", "data_pub": "2026-10-01T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de fusão nuclear avançado da China entrou em uma nova fase de engenharia com a abertura oficial do campus do Tokamak Supercondutor de Plasma Experimental (BEST) e o início da montagem das partes principais no Hefei, Anhui.", "titulo_pt": "Programa de fusão nuclear avançado da china entra na fase de engenharia final", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 188929, "titulo": "STAT+: Sanofi, Regeneron expand partnership after Dupixent success", "url": "https://www.statnews.com/2026/10/01/sanofi-regeneron-agreement-dupixent-antibodies-immunology/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T06:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanofi e Regeneron renovaram seu acordo de colaboração com o objetivo de aproveitar o sucesso comercial do medicamento Dupixent. A parceria visa expandir os esforços relacionados ao medicamento.", "titulo_pt": "Sanofi e Regeneron reúnem parceria após sucesso do Dupixent", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 188938, "titulo": "APOD: 2026 October 1 – Harvest Moon with Erupting Mount Etna", "url": "https://science.nasa.gov/image-article/apod-2026-october-1-harvest-moon-with-belt-of-venus-and-erupting-mount-etna/", "fonte_id": "nasa_news", "data_pub": "2026-10-01T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do APOD de 1º de outubro de 2026 exibe a Lua cheia, conhecida como Lua da Colheita, com o vulcão Etna em erupção no fundo.", "titulo_pt": "Lua da colheita com eruption do monte Etna", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188939, "titulo": "An Agricultural “Island” in the Saskatchewan River Delta", "url": "https://science.nasa.gov/earth/earth-observatory/an-agricultural-island-in-the-saskatchewan-river-delta/", "fonte_id": "nasa_news", "data_pub": "2026-10-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agricultura na região norte de Manitoba, perto de The Pas, muda de verde para amarelo ao longo da temporada de cultivo de 2026, devido à proximidade com várzeas.", "titulo_pt": "Um “ilha” agrícola na Delta do rio Saskatchewan", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188011, "titulo": "Expert gives grim warning after Swiss glaciers shrink 20% in 5 years", "url": "https://www.scmp.com/news/world/europe/article/3369404/expert-gives-grim-warning-after-swiss-glaciers-shrink-20-5-years?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-01T02:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os glaciares suíços perderam cerca de 20% de sua massa em cinco anos, de acordo com especialistas. Em 2026, eles registraram o segundo maior derretimento na história, com 5,5% do volume derretido durante o verão extremamente quente e o inverno com pouca neve.", "titulo_pt": "Especialista emite alerta sombrio após glaciares suíços diminuírem 20% em cinco anos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 188213, "titulo": "Galileo Space Is Building Satellites That Turn Signals Into Answers in Orbit", "url": "https://spacenews.com/galileo-space-is-building-satellites-that-turn-signals-into-answers-in-orbit/", "fonte_id": "spacenews", "data_pub": "2026-10-01T00:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Galileo Space está desenvolvendo satélites projetados para transformar sinais em respostas em órbita. Esses satélites fornecerão respostas rápidas sobre o que está acontecendo e onde, para operações militares e comerciais modernas.", "titulo_pt": "Galileo Space está construindo satélites que transformam sinais em respostas em órbita", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 188214, "titulo": "Curiosity Blog, Sols 5016–5021: Fantastic Minerals and How To Detect Them", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-5016-5021-fantastic-minerals-and-how-to-detect-them/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T23:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Curiosity detectou uma mudança no tipo de rochas no início da semana, passando de blocos de argilato finamente camadas para uma textura diferente. Os cientistas estão investigando essas novas rochas e como detectá-las.", "titulo_pt": "Curiosity Blog, Sols 5016–5021: minerais fantásticos e como detectá-los", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 188179, "titulo": "STAT+: UnitedHealth investor lawsuit moves forward on allegations it ‘manufactured earnings’ to hide declining profits", "url": "https://www.statnews.com/2026/09/30/unitedhealth-investor-lawsuit-moves-forward-allegations-of-manufactured-earnings-to-hide-declining-profits/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-30T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um processo de investidor contra a UnitedHealth Group será permitido a seguir, pois o juiz federal negou o pedido da empresa para descartar as acusações de que ela 'fabricou receitas' para ocultar lucros decrescentes.", "titulo_pt": "Ação de investidor contra unitedhealth avança com acusações de 'fabricação de lucros'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 187391, "titulo": "A evolução do voo contada a partir do fóssil de um dinossauro chinês com penas", "url": "https://veja.abril.com.br/ciencia/a-evolucao-do-voo-contada-a-partir-do-fossil-de-um-dinossauro-chines-com-penas/", "fonte_id": "veja", "data_pub": "2026-09-30T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fóssil encontrado na China levou a análises que revelaram uma história diferente na evolução da anatomia usada pelos dinossauros para o voo.", "titulo_pt": "Evolução do voo contada a partir do fóssil de um dinossauro chinês com penas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 188215, "titulo": "Help Overlap Zoo Reveal Cosmic Dust", "url": "https://science.nasa.gov/get-involved/citizen-science/help-overlap-zoo-reveal-cosmic-dust/", "fonte_id": "nasa_news", "data_pub": "2026-09-30T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Galáxias, grandes coleções de bilhões de estrelas, gás e poeira gravitacionalmente unidas, estão espalhadas pelo universo. Por vezes, duas galáxias alinham-se de tal forma que parecem se sobrepor no céu, formando galáxias que se sobrepõem de forma rara.", "titulo_pt": "Ajude a desvendar poeira cósmica", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 188819, "titulo": "Chinese hair embroidery uses human hair instead of silk thread to create ultra-fine portraits", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3369383/chinese-hair-embroidery-uses-human-hair-instead-silk-thread-create-ultra-fine-portraits?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-01T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A técnica chinesa de bordado com cabelo utiliza fios humanos em vez de fios de seda para criar retratos ultra-finos. Originária da província de Jiangsu, no oriente do país, durante o Tang (618-907), esta técnica exige grande habilidade e pode levar de vários meses a vários anos para concluir uma única peça complexa.", "titulo_pt": "Bordado com cabelo chinês usa fios humanos em vez de fios de seda para criar retratos ultra-finos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 188347, "titulo": "Vivo e ativo, a melhor vingança: o que aconteceu com Salman Rushdie", "url": "https://veja.abril.com.br/coluna/mundialista/vivo-e-ativo-a-melhor-vinganca-o-que-aconteceu-com-salman-rushdie/", "fonte_id": "veja", "data_pub": "2026-10-01T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O escritor indiano Salman Rushdie, que sofreu 15 facadas em um ataque bárbaro, está lançando um documentário sobre o incidente e continuando sua vida ativa.", "titulo_pt": "Vivo e ativo, a melhor vingança: o que aconteceu com Salman Rushdie", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 188324, "titulo": "Colegas de Gil do Vigor na Globo pedem providências contra repórter do Fantástico", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/colegas-de-gil-do-vigor-na-globo-pedem-providencias-contra-reporter-do-fantastico.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Colegas de Gil do Vigor na Globo apresentaram queixas pedindo que a emissora tome medidas contra o repórter Álvaro Pereira Júnior, do Fantástico, após ele chamá-lo de 'falso acadêmico' em uma publicação recente.", "titulo_pt": "Colaboradores de Gil do Vigor na Globo pedem ações contra repórter do Fantástico", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 188495, "titulo": "“Mafalda inmersiva”: un viaje por el universo de Quino con realidad virtual, maquetas, aroma a sopa y preguntas incómodas", "url": "https://www.lanacion.com.ar/cultura/mafalda-inmersiva-un-viaje-por-el-universo-de-quino-con-realidad-virtual-maquetas-aroma-a-sopa-y-nid01102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em Buenos Aires, uma grande exposição chamada 'Mafalda inmersiva' foi inaugurada no Centro Cultural Recoleta, com treze salas, esculturas e cenários em escala real. O sobrino de Guillermo Lavado, que inspirou o personagem Guille, relembra Quino, o criador do universo Mafalda.", "titulo_pt": "Mafalda imersiva: viagem pelo universo de Quino com realidade virtual, maquetes, aroma de sopa e perguntas incômodas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 188497, "titulo": "Alejandro González Iñárritu, sobre Digger: la idea que nació en Tierra del Fuego y la “generosidad” de Tom Cruise", "url": "https://www.lanacion.com.ar/espectaculos/cine/alejandro-gonzalez-inarritu-sobre-digger-la-idea-que-nacio-en-tierra-del-fuego-y-la-generosidad-de-nid30092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Alejandro González Iñárritu conversou com LA NACION sobre Digger, seu novo filme que estreia em breve. O filme é uma aposta arriscada que leva os espectadores à tela grande.", "titulo_pt": "Alejandro González Iñárritu sobre Digger: a ideia que nasceu em Tierra del Fuego e a 'generosidade' de Tom Cruise", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 188526, "titulo": "Los días de casetes, universidad y Sex Pistols de Zeta Bosio y Gustavo Cerati: el origen de Soda Stereo", "url": "https://www.latercera.com/culto/noticia/los-dias-de-casetes-universidad-y-sex-pistols-de-zeta-bosio-y-gustavo-cerati-el-origen-de-soda-stereo/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Recordam-se os anos universitários de Zeta Bosio e Gustavo Cerati, durante os quais o bajista conheceu o vocalista, compartilhando casetes e criando a banda Soda Stereo. Essa amizade surgiu nos cursos de Publicidade da universidade.", "titulo_pt": "Casamentos, universidade e Sex Pistols: o início de Soda Stereo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 188960, "titulo": "RSC embraces ‘hugely challenging’ task of staging Susanna Clarke’s Piranesi and Virginia Woolf’s Mrs Dalloway", "url": "https://www.theguardian.com/stage/2026/oct/01/rsc-new-season-mrs-dalloway-piranesi", "fonte_id": "guardian_culture", "data_pub": "2026-10-01T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Royal Shakespeare Company anunciou a adaptação de dois romances experimentais, de Susanna Clarke e Virginia Woolf, para a temporada que inclui as estreias de Elizabeth Debicki como Richard II e Damien Molony como Coriolanus. Os romances, escritos há quase 100 anos de diferença, apresentam desafios significativos para a adaptação teatral.", "titulo_pt": "Royal shakespeare company enfrenta tarefa ‘altamente desafiadora’ com adaptações de Piranesi e Mrs Dalloway", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 188860, "titulo": "Jang Se-yun wanted to be noticed. Now she wants more than Asian Games silver", "url": "https://www.koreaherald.co rk, centrais de dados de IA, pénis conscientes e o problema do bilionário", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 188956, "titulo": "Knife: The Attempted Murder of Salman Rushdie review – terrifying and inspiring story of survival", "url": "https://www.theguardian.com/film/2026/oct/01/knife-the-attempted-of-salman-rushdie-review-terrifying-and-inspiring-story-of-survival", "fonte_id": "guardian_culture", "data_pub": "2026-10-01T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentário de Alex Gibney segue a vida do autor Salman Rushdie antes e após o atentado a faca em Nova York em 2022, destacando a coragem de Rushdie. A obra é baseada em seu próprio memoir e inclui vídeos íntimos filmados por sua esposa, a poetisa Rachel Eliza Griffiths, no hospital.", "titulo_pt": "A tentativa de assassinato de Salman Rushdie - documentário terrível e inspirador", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 188359, "titulo": "Faccionado do Comando Vermelho morre em confronto com a PMDF na GO-547", "url": "https://www.metropoles.com/distrito-federal/na-mira/faccionado-do-comando-vermelho-morre-em-confronto-com-a-pmdf-na-go-547", "fonte_id": "metropoles", "data_pub": "2026-10-01T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um membro do Comando Vermelho foi morto em um confronto com a Polícia Militar do Distrito Federal (PMDF) na GO-547, entre Águas Lindas de Goiás e Brazlândia. Durante o incidente, foram apreendidos tabletes de maconha e uma pistola.", "titulo_pt": "Membro do Comando Vermelho morto em confronto com a PMDF na GO-547", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188362, "titulo": "Mulher que salvou brasileira de estupro em trem na França é homenageada", "url": "https://www.metropoles.com/mundo/mulher-que-salvou-brasileira-de-estupro-em-trem-na-franca-e-homenageada", "fonte_ "B"}, {"id": 187585, "titulo": "Registro nacional de médicos: hay más activos de los que se creía por arriba de los 65 años y menos por debajo de esa edad", "url": "https://www.lanacion.com.ar/sociedad/registro-nacional-de-medicos-hay-mas-activos-de-los-que-se-creia-por-arriba-de-los-65-anos-y-menos-nid30092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T01:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério de Saúde da Nação informou que há mais médicos ativos acima dos 65 anos do que se pensava, e menos médicos ativos abaixo dessa idade. Essa conclusão resultou da melhoria no controle de matrículas e do cruzamento de dados com outras organizações.", "titulo_pt": "Registro nacional de médicos: há mais ativos acima dos 65 anos e menos abaixo dessa idade", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 187428, "titulo": "Bombeiro é preso após matar estudante de medicina durante briga de trânsito", "url": "https://www.metropoles.com/sao-paulo/bombeiro-estudante-briga-transito", "fonte_id": "metropoles", "data_pub": "2026-10-01T00:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bombeiro foi preso após matar um estudante de medicina durante uma briga de trânsito em Taubaté, interior de São Paulo. Bruno Hashimura San Juliano, o estudante, morreu após ser baleado pelo bombeiro Marcos Paulo Fujarra de Oliveira.", "titulo_pt": "Bombeiro é preso após matar estudante de medicina em briga de trânsito", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188086, "titulo": "Agriculture ministry mulling parental leave for farmers", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/01/2003865180", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra da Agricultura está considerando a implementação de licença parental para agricultores. Atualmente, não há informações detalhadas sobre o escopo ou as possíveis mudanças na legislação.", "titulo_pt": "Agricultura ministério pensa em licença parental para agricultores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 188099, "titulo": "Doctor encourages people to stay active as they age", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/01/2003865199", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O médico incentiva as pessoas a permanecerem ativas à medida que envelhecem. Ele recomenda atividades físicas e outras formas de manter a atividade para a melhoria da qualidade de vida na idade avançada.", "titulo_pt": "Médico incentiva atividade para idosos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 187434, "titulo": "O que não pode faltar na alimentação de mulheres com 60 anos ou mais", "url": "https://www.metropoles.com/vida-e-estilo/o-que-nao-pode-faltar-na-alimentacao-de-mulheres-com-60-anos-ou-mais", "fonte_id": "metropoles", "data_pub": "2026-09-30T23:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A alimentação de mulheres acima de 60 anos deve incluir proteína, cálcio, vitamina B12 e água, que são componentes importantes para a saúde nessa fase da vida. O corpo feminino passa por mudanças que exigem ajustes na dieta.", "titulo_pt": "O que não pode faltar na alimentação de mulheres com 60 anos ou mais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 187659, "titulo": "Las tres vacunas que el Minsal busca sumar al sistema público", "url": "https://www.latercera.com/nacional/noticia/las-tres-vacunas-que-el-minsal-busca-sumar-al-sistema-publico/", "fonte_id": "la_tercera", "data_pub": "2026-09-30T23:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde tem um programa de Vacinação Especial (VE) para pessoas com condições médicas específicas. O governo busca incluir novas vacinas no sistema público para proteger contra o vírus respiratório sincicial em adultos, herpes zóster e neumococo.", "titulo_pt": "As três vacinas que o ministério da saúde busca incluir no sistema público", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 187386, "titulo": "Dupla é denunciada por vender bebida com metanol que causou cegueira em vítima", "url": "https://veja.abril.com.br/brasil/dupla-e-denunciada-por-vender-bebida-com-metanol-que-causou-cegueira-em-vitima/", "fonte_id": "veja", "data_pub": "2026-09-30T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois indivíduos foram denunciados por vender bebida adulterada com metanol, resultando em cegueira em uma vítima. O proprietário de um estabelecimento comprava produtos de fornecedores sem verificar a documentação fiscal sobre a origem.", "titulo_pt": "Dois são denunciados por vender bebida com metanol que causou cegueira", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 188368, "titulo": "Clima: outubro começa com temporais no Sudeste e calor de 40ºC no Nordeste", "url": "https://www.metropoles.com/brasil/clima-outubro-comeca-com-temporais-no-sudeste-e-calor-de-40oc-no-nordeste", "fonte_id": "metropoles", "data_pub": "2026-10-01T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de outubro, o Sudeste enfrenta temporais, enquanto o Nordeste experimenta temperaturas elevadas chegando a 40°C. No Sul, a frente fria continua trazendo chuvas intensas no Paraná e no leste de Santa Catarina.", "titulo_pt": "Clima: outubro começa com temporais no Sudeste e calor de 40°c no Nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188706, "titulo": "Swiss glaciers lose 5.5% of ice in second-largest melt on record", "url": "https://www.euronews.com/video/2026/10/01/swiss-glaciers-lose-55-of-ice-in-second-largest-melt-on-record", "fonte_id": "euronews", "data_pub": "2026-10-01T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas suíços relatam uma perda rápida de gelo no Glacier Rhône, devido a ondas de calor e um inverno seco, resultando na segunda maior derivação de gelo na história da Suíça.", "titulo_pt": "Suíça registra perda de 5,5% de gelo no glacier rhône, maior derretimento em duas décadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 188755, "titulo": "‘Catastrophic year’ as Swiss glaciers lose 5% of ice after heatwaves", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/1/catastrophic-year-as-swiss-glaciers-lose-5-of-ice-after-heatwaves?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas alertam que os gelos suíços perderam uma quantidade 'enorme' de gelo este ano. Isso ocorreu devido a ondas de calor.", "titulo_pt": "Ano catastrófico", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 188580, "titulo": "‘Explosion of melt rates’: 20% of Swiss glaciers lost in five years", "url": "https://www.theguardian.com/environment/2026/oct/01/switzerland-glacier-loss-fossil-fuel-pollution-europe", "fonte_id": "guardian_world", "data_pub": "2026-10-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suíça perdeu aproximadamente 20% de sua geleira em apenas cinco anos devido ao efeito de calor das emissões de poluentes de combustíveis fósseis. Em 2026, as geleiras suíças diminuíram 5,5% nos primeiros oito meses, após um verão de ondas de calor extremas que seguiram um inverno com pouca neve.", "titulo_pt": "Explodo de taxas de derretimento: Suíça perde 20% de suas geleiras em cinco anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 188107, "titulo": "People over AI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/01/2003865165", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância das pessoas em relação à inteligência artificial, enfatizando que os seres humanos devem ter prioridade sobre o desenvolvimento avançado de tecnologias de IA. O título 'People over AI' foi traduzido para 'Pessoas acima da IA' em português brasileiro.", "titulo_pt": "Pessoas acima da IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 187853, "titulo": "Tracking methane leaks to slow global warming: European regulation project weakened by France's reversal", "url": "https://www.lemonde.fr/en/environment/article/2026/09/30/tracking-methane-leaks-to-slow-global-warming-european-regulation-project-weakened-by-france-s-reversal_6758122_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emmanuel Macron propôs reduzir as emissões de metano do setor de combustíveis fósseis, mas acabou por pedir a postergação da implementação da legislação europeia sobre o tema, justificando com a crise energética.", "titulo_pt": "Rastreamento de vazamentos de metano para frear o aquecimento global: projeto de regulamentação europeu enfraquecido pela reversão da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 185987, "titulo": "Recuperación hídrica no es suficiente para dar término a la megasequía iniciada en 2010", "url": "https://www.latercera.com/pulso/noticia/recuperacion-hidrica-no-es-suficiente-para-dar-termino-a-la-megasequia-iniciada-en-2010/", "fonte_id": "la_tercera", "data_pub": "2026-09-30T15:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O biministro de Obras Públicas e de Transportes e Telecomunicaciones, Louis de Grange, afirmou que há garantia de disponibilidade para irrigação e abastecimento de água potável para a população até março de 2027. A recuperação hídrica não é considerada suficiente para pôr fim à megasequía iniciada em 2010.", "titulo_pt": "Recuperação hídrica não resolve megasequía iniciada em 2010", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 185779, "titulo": "Calor armazenado nos oceanos bate recorde em 2025; relatório aponta aquecimento acelerado, alta do nível do mar e perda de gelo polar", "url": "https://www.cnnbrasil.com.br/ciencia/calor-armazenado-nos-oceanos-bate-recorde-em-2025-relatorio-aponta-aquecimento-acelerado-alta-do-nivel-do-mar-e-perda-de-gelo-polar/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-30T14:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que o calor armazenado nos oceanos atingiu um recorde em 2025, com evidências de aquecimento acelerado, aumento do nível do mar e diminuição do gelo polar. O estudo abrange uma década de monitoramento e destaca mudanças na temperatura do Mediterrâneo, nos padrões do fitoplâncton e na extensão do gelo marinho no Ártico e na Antártida.", "titulo_pt": "Calor armazenado nos oceanos bate recorde em 2025; relatório aponta aquecimento acelerado, alta do nível do mar e perda de gelo polar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 185991, "titulo": "Tribunal ambiental confirma multa de más de $4 mil millones contra Albemarle por sobreexplotar el Salar de Atacama", "url": "https://www.latercera.com/pulso/noticia/tribunal-ambiental-confirma-multa-de-mas-de-4-mil-millones-contra-albemarle-por-sobreexplotar-el-salar-de-atacama/", "fonte_id": "la_tercera", "data_pub": "2026-09-30T14:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Ambiental confirmou a multa de mais de 4 bilhões de pesos chilenos para a empresa americana Albemarle, que foi acusada de sobreexplotar o Salar de Atacama. A companhia não conseguiu anular a penalização impuesta pela Superintendência de Meio Ambiente em outubro do ano anterior.", "titulo_pt": "Tribunal ambiental confirma multa de mais de 4 bilhões contra Albemarle por sobreexplotar o Salar de Atacama", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 185833, "titulo": "População de jumentos cai 94% no Brasil, e cientistas se mobilizam contra abate", "url": "https://veja.abril.com.br/agenda-verde/populacao-de-jumentos-cai-94-no-brasil-e-cientistas-fazem-mobilizacao-contra-abate/", "fonte_id": "veja", "data_pub": "2026-09-30T14:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A população de jumentos no Brasil diminuiu 94%, e cientistas estão se mobilizando para denunciar os impactos do comércio de peles e defender medidas de proteção.", "titulo_pt": "População de jumentos cai 94% no Brasil, e cientistas se mobilizam contra abate", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 185838, "titulo": "As previsões preocupantes de órgãos brasileiros para o Super El Niño", "url": "https://veja.abril.com.br/economia/as-previsoes-preocupantes-de-orgaos-brasileiros-para-o-super-el-nino/", "fonte_id": "veja", "data_pub": "2026-09-30T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O INMET considera plausível um episódio de El Niño extremo, com riscos para a produção de soja, milho, café e trigo. O MME admite a possibilidade de reforçar medidas de proteção.", "titulo_pt": "Previsões preocupantes de órgãos brasileiros para o Super El Niño", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 185839, "titulo": "Mudança climática pressiona preços de alimentos e ameaça inflação no Brasil", "url": "https://veja.abril.com.br/agenda-verde/mudanca-climatica-pressiona-precos-de-alimentos-e-ameaca-inflacao-no-brasil/", "fonte_id": "veja", "data_pub": "2026-09-30T14:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mudança climática está pressionando os preços dos alimentos e ameaçando a inflação no Brasil, com ondas de calor, secas e chuvas extremas reduzindo as safras. O Banco Central estima que o impacto do El Niño possa afetar a inflação até 2027.", "titulo_pt": "Mudança climática pressiona preços de alimentos e ameaça inflação no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 186977, "titulo": "Analysis: Wind and solar save UK from gas imports worth £5.9bn during Hormuz crisis", "url": "https://www.carbonbrief.org/analysis-wind-and-solar-save-uk-from-gas-imports-worth-5-9bn-during-hormuz-crisis", "fonte_id": "carbon_brief", "data_pub": "2026-09-30T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido evitou a necessidade de importações de gás com um valor de £5,9 bilhões desde o início da crise do Hormuz, graças à energia proveniente do vento e do sol.", "titulo_pt": "Análise: energia eólica e solar evitam importações de gás valendo £5,9 bilhões durante crise do Hormuz", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 185556, "titulo": "Brasil tem quase 10% mais gado do que gente em 2025", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/brasil-tem-quase-10-mais-gado-do-que-gente-em-2025.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-30T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil contava com 234,3 milhões de bovinos em 31 de dezembro de 2025, segundo a Pesquisa da Pecuária Municipal do IBGE. O efetivo de gado diminuiu 1,7% em comparação com o mesmo período de 2024.", "titulo_pt": "Brasil tem quase 10% a mais de gado do que de pessoas em 2025", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 186629, "titulo": "Kuala Lumpur is world’s most polluted city due to haze, Singapore third, index shows", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3369363/kuala-lumpur-worlds-most-polluted-city-due-haze-singapore-third-index-shows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T12:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kuala Lumpur foi classificada como a cidade mais poluída do mundo devido a uma névoa de fuligem, enquanto Singapura ficou em terceiro lugar, de acordo com um índice. A poluição foi causada por incêndios florestais na Indonésia.", "titulo_pt": "Kuala Lumpur é a cidade mais poluída do mundo devido a fuligem, diz índice; singapura em terceiro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 186391, "titulo": "Thousands of firefighters march in Paris demanding more resources", "url": "https://www.euronews.com/video/2026/09/30/thousands-of-firefighters-march-in-paris-demanding-more-resources", "fonte_id": "euronews", "data_pub": "2026-09-30T11:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 8.000 bombeiros franceses marcharam por Paris exigindo mais recursos e financiamento, criticando a falta de ação do governo conforme relatado pelas entidades sindicais.", "titulo_pt": "Milhares de bombeiros marcham em Paris exigindo mais recursos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 188376, "titulo": "“Ela sorriu”: testemunhas descrevem tentativa de execução de mulher nos EUA", "url": "https://www.cnnbrasil.com.br/internacional/ela-sorriu-testemunhas-descrevem-tentativa-de-execucao-de-mulher-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, a primeira mulher condenada à pena de morte no Tennessee em 200 anos, sobreviveu a uma tentativa de execução por injeção letal que falhou. Após receber duas doses de sedativo, ela foi levada para atendimento médico.", "titulo_pt": "Ela sorriu: primeira mulher condenada à pena de morte no tennessee em 200 anos sobrevive a falha na execução", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 188360, "titulo": "Kauan, dupla de Matheus, denuncia perseguição: \"Vida da família em risco\"", "url": "https://www.metropoles.com/celebridades/kauan-dupla-de-matheus-denuncia-perseguicao-vida-da-familia-em-risco", "fonte_id": "metropoles", "data_pub": "2026-10-01T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kauan, membro da dupla Matheus & Kauan, acusa a construtora de abandonar a obra de sua casa e relata perseguição, afirmando que a vida da sua família está em risco. Ele também menciona ter pago mais de R$ 7,5 milhões pela construção.", "titulo_pt": "Kauan denuncia perseguição e risco à família", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188349, "titulo": "Mulher no Tennessee condenada à morte é hospitalizada após sobreviver a duas injeções letais", "url": "https://veja.abril.com.br/mundo/mulher-no-tennessee-condenada-a-morte-e-hospitalizada-apos-sobreviver-a-duas-injecoes-letais/", "fonte_id": "veja", "data_pub": "2026-10-01T09:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, uma mulher, foi hospitalizada após sobreviver a duas injeções letais no Tennessee. Ela se tornaria a primeira mulher a ser executada no estado americano em 200 anos.", "titulo_pt": "Mulher no Tennessee sobrevive a duas injeções letais e é hospitalizada; se tornaria primeira a ser executada no estado em 200 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 188469, "titulo": "Mulher que seria executada no Tennessee sobrevive a duas injeções letais", "url": "https://www.bbc.com/portuguese/articles/cmqxvxez1exqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-01T08:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher que estava prevista para ser executada no Tennessee sobreviveu a duas injeções letais e está recebendo tratamento no hospital. Seu advogado afirma que ela está sendo submetida a 'medidas para salvar sua vida'.", "titulo_pt": "Mulher sobrevive a duas injeções letais e é atendida no hospital no Tennessee", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 188859, "titulo": "Court orders full review for asylum seeker claiming anti-gay persecution", "url": "https://www.koreaherald.com/article/10890951", "fonte_id": "korea_herald", "data_pub": "2026-10-01T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal sul-coreano anulou a decisão de um escritório de imigração que negou uma revisão completa de um pedido de asilo de um homem africano que se diz perseguido por sua orientação sexual. A decisão foi favorável ao homem em 22 de setembro e ele havia entrado com uma ação judicial contra o chefe do Escritório de Imigração do Aeroporto Incheon após as autoridades recusarem-se a referenciar seu pedido para um status formal de refugiado.", "titulo_pt": "Tribunal anula decisão de imigração em caso de asilo baseado em perseguição por orientação sexual", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 188511, "titulo": "Aseguran que Christa Pike sobrevivió a dos inyecciones letales durante su ejecución en Tennessee", "url": "https://www.lanacion.com.ar/estados-unidos/aseguran-que-christa-pike-sobrevivio-a-dos-inyecciones-letales-durante-su-ejecucion-en-tennessee-nid01102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-01T05:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Testemunhas relataram que Christa Pike ainda estava viva após duas injeções letais durante a execução em Tennessee. O procedimento havia sido interrompido por um tribunal, mas posteriormente ratificado pela Corte Suprema dos Estados Unidos.", "titulo_pt": "Alegam que Christa Pike sobreviveu a duas injeções letais durante sua execução em Tennessee", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 188813, "titulo": "U.S. death row inmate survives lethal execution attempt", "url": "https://www.japantimes.co.jp/news/2026/10/01/world/us-execution-attempt-death-row/", "fonte_id": "japan_times", "data_pub": "2026-10-01T05:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um preso da morte nos Estados Unidos sobreviveu a um tentativa de execução. Este foi o primeiro esforço do estado do Tennessee para executar uma mulher em dois séculos.", "titulo_pt": "Preso da morte dos EUA sobrevive a tentativa de execução; tennessee realiza primeiro enforcamento de mulher em 200 anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188708, "titulo": "US death row inmate Christa Pike in hospital after surviving two lethal injections, lawyers say", "url": "https://www.euronews.com/2026/10/01/us-death-row-inmate-christa-pike-in-hospital-after-surviving-two-lethal-injections-lawyers", "fonte_id": "euronews", "data_pub": "2026-10-01T05:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, uma condenada à morte nos Estados Unidos, foi hospitalizada após sobreviver a duas injeções letais. Ela cometeu o assassinato de Colleen Slemmer, uma jovem de 19 anos, quando tinha 18 anos, junto com seu namorado.", "titulo_pt": "Condenada à morte nos EUA, Christa Pike hospitalizada após duas injeções letais; ela matou jovem em 18 anos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 187646, "titulo": "Corte Suprema de EE.UU. anula la suspensión de la ejecución de mujer que estuvo 31 años en corredor de la muerte", "url": "https://www.latercera.com/mundo/noticia/corte-suprema-de-eeuu-anula-la-suspension-de-la-ejecucion-de-mujer-que-estuvo-31-anos-en-corredor-de-la-muerte/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T01:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema dos Estados Unidos anulou a suspensão da execução de Christa Pike, que estava há 31 anos no corredor da morte após ser condenada a morte em 1996 por assassinar uma colega de escola.", "titulo_pt": "Corte Suprema dos EUA anula suspensão da execução de mulher no corredor da morte", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 187846, "titulo": "US Supreme Court clears way for Tennessee woman's imminent execution", "url": "https://www.lemonde.fr/en/international/article/2026/10/01/us-supreme-court-clears-way-for-tennessee-woman-s-imminent-execution_6758127_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T01:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos permitiu a execução iminente de Christa Pike, uma mulher condenada ao assassinato há mais de 30 anos e a única mulher na prisão da morte do Tennessee. Após horas de disputas judiciais, o caminho para a aplicação da pena capital foi aberto.", "titulo_pt": "Suprema corte dos EUA autoriza execução iminente de mulher condenada ao assassinato no Tennessee", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 188100, "titulo": "Justice not done", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/01/2003865201", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda um tema relacionado à justiça não ser feita. Não há detalhes adicionais sobre o conteúdo do trecho fornecido.", "titulo_pt": "Justiça não feita", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 188020, "titulo": "Woman told Cornell police 2 years ago she was 100% sure she was raped, transcript shows", "url": "https://www.scmp.com/news/world/united-states-canada/article/3369397/woman-told-cornell-police-2-years-ago-she-was-100-sure-she-was-raped-transcript-shows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-30T23:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher que apresentou uma ação judicial afirmando ter sido sexualmente agredida por sete homens em uma casa de fraternidade da Universidade Cornell relatou à polícia, semanas após o incidente, que estava '100% certa' de que havia sido estuprada. O relato de uma transcrição da entrevista com os investigadores, que não foi divulgada publicamente, levanta novas dúvidas sobre a decisão do promotor local de não processar ninguém na época.", "titulo_pt": "Mulher diz à polícia que estava 100% certa de ter sido estuprada em fraternidade da Cornell, dois anos após incidente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 187849, "titulo": "After Marseille's Old Port roundup is recognized as a crime against humanity, victims express relief: 'This is the end of collective indifference'", "url": "https://www.lemonde.fr/en/france/article/2026/10/01/after-marseille-s-old-port-roundup-is-recognized-as-a-crime-against-humanity-victims-express-relief-this-is-the-end-of-collective-indifference_6758123_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-30T22:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França reconheceu oficialmente como crime contra a humanidade a operação conjunta nazista e do regime colaboracionista Vichy que afetou 20 mil moradores do Velho Port de Marselha em janeiro de 1943, após uma investigação de sete anos iniciada por campanha de vítimas.", "titulo_pt": "Reconhecimento oficial de crime contra a humanidade na operação do velho Port de marselha", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 187632, "titulo": "STF amplia alcance do direito de servidor optar por previdência complementar ou regime antigo", "url": "https://www.jota.info/stf/do-supremo/stf-amplia-alcance-do-direito-de-servidor-optar-por-previdencia-complementar-ou-regime-antigo", "fonte_id": "jota", "data_pub": "2026-09-30T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) estendeu o direito dos servidores públicos escolher entre o regime previdenciário complementar ou o antigo. O período de trabalho em outro ente federativo será considerado na determinação do sistema previdenciário a ser adotado.", "titulo_pt": "STF amplia direito de servidor escolher entre previdência complementar ou regime antigo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 187981, "titulo": "French court sentences 13 men over deadliest small-boat crossing to UK", "url": "https://www.aljazeera.com/news/2026/9/30/french-court-sentences-13-men-over-deadliest-small-boat-crossing-to-uk?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-30T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal francês condenou 13 homens por tráfico humano após a morte de 31 migrantes em uma travessia de barco pequeno para o Reino Unido em 2021. Seis dos condenados foram acusados de homicídio involuntário.", "titulo_pt": "French court sentences 13 men over deadliest small-boat crossing to UK", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 187790, "titulo": "944 children abused by Catholic clergy, Mass. AG says — but no new charges", "url": "https://www.axios.com/2026/09/30/massachusetts-catholic-clergy-sex-abuse-report", "fonte_id": "axios", "data_pub": "2026-09-30T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral da Massachusetts divulgou um relatório que documenta mais de 270 padres católicos acusados de abusar sexualmente de 944 crianças em três dioceses. No entanto, a investigação não resultará em novas acusações criminais.", "titulo_pt": "944 Crianças abusadas por clérigos católicos, mas sem novas acusações", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 188819, "fonte_id": "scmp", "titulo": "Chinese hair embroidery uses human hair instead of silk thread to create ultra-fine portraits", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3369383/chinese-hair-embroidery-uses-human-hair-instead-silk-thread-create-ultra-fine-portraits?utm_source=rss_feed", "data_pub": "2026-10-01T10:00:00Z", "topico": "cultura", " function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';
  });

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
