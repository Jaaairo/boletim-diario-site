o não revela sobre educação.", "titulo_pt": "O que o orçamento não revela sobre educação", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 263938, "titulo": "Menina de 13 anos é dopada e estuprada por amigo do pai no Entorno do DF", "url": "https://www.metropoles.com/distrito-federal/na-mira/menina-de-13-anos-e-dopada-e-estuprada-por-amigo-do-pai-no-entorno-do-df", "fonte_id": "metropoles", "data_pub": "2026-11-14T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma menina de 13 anos foi dopada e estuprada por um amigo do pai, no Entorno do Distrito Federal. Os abusos ocorreram com o conhecimento e consentimento do pai da vítima, que também foi detido.", "titulo_pt": "Menina de 13 anos é dopada e estuprada por amigo do pai no Entorno do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264075, "titulo": "Viajaban a un funeral y terminaron detenidos por el ICE: quiénes son los dos acróbatas argentinos arrestados en Estados Unidos", "url": "https://www.clarin.com/sociedad/viajaban-funeral-terminaron-detenidos-ice-acrobatas-argentinos-arrestados-estados-unidos_0_t29skALYWM.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gustavo Romanello e Agustín Baccega, acrobatas argentinos com permissões de trabalho válidas, foram detidos pelo ICE enquanto processavam seus pedidos de asilo. Eles serão submetidos ao processo legal e permanecerão sob custódia do ICE.", "titulo_pt": "Dois acrobatas argentinos são detidos pelo ICE enquanto viajavam para um funeral", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 264077, "titulo": "\"Preparó el hecho\": piden 14 años y medio de cárcel para el acusado de apuñalar a dos bailarinas en una escuela de danza en Palermo", "url": "https://www.clarin.com/policiales/preparo-hecho-piden-14-anos-medio-carcel-acusado-apunalar-bailarinas-em-escuela-danza-palermo_0_IyJP1iQ10a.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Sebastián Damián Villareal (36) está sendo julgado por um ataque que feriu duas bailarinas em uma escola de dança em Palermo em novembro de 2020. A fiscalia reconhece que o acusado tem um trastorno de personalidade, mas não é delirante nem psicótico.", "titulo_pt": "Preparou o fato: acusado de apuñalar duas bailarinas em escola de dança em Palermo pede 14 anos e meio de prisão", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 263855, "titulo": "'Há total desconexão entre discurso e prática', diz CEO sobre políticas de inclusão nas empresas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/ha-total-desconexao-entre-discurso-e-pratica-diz-ceo-sobre-politicas-de-inclusao-nas-empresas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wellington Vitorino, CEO do Instituto Four, afirma que há uma desconexão entre o discurso e a prática em relação às políticas de inclusão nas empresas. Segundo ele, isso se intensificou desde a eleição de Donald Trump, levando a um retrocesso nas políticas de inclusão no meio corporativo.", "titulo_pt": "Há total desconexão entre discurso e prática em políticas de inclusão nas empresas, diz CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263417, "titulo": "Onde está o preso? A pergunta que a família faz ao Google e o Estado ainda não responde", "url": "https://www.jota.info/opiniao-e-analise/artigos/onde-esta-o-preso-a-pergunta-que-a-familia-faz-ao-google-e-o-estado-ainda-nao-responde", "fonte_id": "jota", "data_pub": "2026-11-14T09:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Famílias buscam informações sobre presos em sistemas estaduais, enquanto o sistema nacional do CNJ não tem dados atualizados. O sistema do CNJ foi projetado para armazenar essas informações, mas ainda não responde adequadamente às necessidades das famílias.", "titulo_pt": "Onde está o preso? A pergunta que a família faz ao Google e ao Estado ainda não responde", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263419, "titulo": "Um movimento convergente pela alfabetização na América Latina", "url": "https://www.jota.info/opiniao-e-analise/artigos/um-movimento-convergente-pela-alfabetizacao-na-america-latina", "fonte_id": "jota", "data_pub": "2026-11-14T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A América Latina enfrenta o desafio de implementar políticas eficazes de alfabetização nas salas de aula e garantir sua implementação através dos diferentes níveis de governo.", "titulo_pt": "Movimento convergente pela alfabetização na América Latina", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263469, "titulo": "La paradoja de la democracia en Chile: ocho de cada diez valoran cuidarla, pero pocos creen que se contribuya a ello", "url": "https://www.latercera.com/nacional/noticia/la-paradoja-de-la-democracia-en-chile-ocho-de-cada-diez-valoran-cuidarla-pero-pocos-creen-que-se-contribuya-a-ello/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa intitulada 'Cuidar a democracia hoje', realizada por Mais para Chile e Tenemos que Hablar de Chile, explora como os chilenos percebem o sistema atual e como ele poderia ser melhor mantido. O levantamento revela que oito em cada dez chilenos valorizam a democracia, mas poucos acreditam que contribuem para seu cuidado.", "titulo_pt": "Paradoxo da democracia chilena: maioria valoriza, mas poucos acreditam em contribuição", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263476, "titulo": "El 55% de los jóvenes de entre 18 y 34 años del Biobío recomendaría irse a Santiago para buscar trabajo", "url": "https://www.latercera.com/esto-es-chile/noticia/el-55-de-los-jovenes-de-entre-18-y-34-anos-del-biobio-recomendaria-irse-a-santiago-para-buscar-trabajo/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que 55% dos jovens entre 18 e 34 anos da região do Biobío considerariam migrar para Santiago em busca de emprego. Além disso, 58% desses jovens avaliam negativamente as condições de emprego em sua região.", "titulo_pt": "55% Dos jovens biobenses de 18 a 34 anos considerariam migrar para Santiago por causa do mercado de trabalho", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263356, "titulo": "Alfabetização na idade certa pode beneficiar 1 milhão de jovens em 4 anos", "url": "https://www.cnnbrasil.com.br/educacao/alfabetizacao-na-idade-certa-pode-beneficiar-1-milhao-de-jovens-em-4-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Instituto Natura e da Lupa Social indica que aumentar o percentual de crianças alfabetizadas aos 7 anos para 95% poderia beneficiar 1 milhão de jovens ao concluir o Ensino Médio em quatro anos.", "titulo_pt": "Alfabetização na idade certa pode beneficiar 1 milhão de jovens em 4 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263218, "titulo": "Jovens avançam sobre renda e patrimônio antes concentrados nos idosos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/jovens-avancam-sobre-renda-e-patrimonio-antes-concentrados-nos-idosos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os protestos na França destacaram a reclamação de que as gerações mais jovens têm sido marginalizadas em comparação com os baby boomers, que supostamente monopolizaram as melhores oportunidades de carreira, aposentadorias e propriedades. Os jovens enfrentam desafios como moradia cara e empregos precários.", "titulo_pt": "Jovens avançam sobre renda e patrimônio antes concentrados nos idosos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263341, "titulo": "Douglas Ruas recebeu R$ 4 milhões de fornecedores da prefeitura do pai", "url": "https://www.metropoles.com/colunas/tacio-lorran/douglas-ruas-recebeu-r-4-milhoes-de-fornecedores-da-prefeitura-do-pai", "fonte_id": "metropoles", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Douglas Ruas recebeu R$ 4 milhões da VicBrita, uma empresa registrada no mesmo local de outra com contratos milionários em São Gonçalo.", "titulo_pt": "Douglas Ruas recebeu R$ 4 milhões de fornecedores da prefeitura do pai", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263364, "titulo": "Até 2050, Brasil pode ter aumento de 44% no número de adultos com diabetes", "url": "https://www.cnnbrasil.com.br/saude/ate-2050-brasil-pode-ter-aumento-de-44-no-numero-de-adultos-com-diabetes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil pode ver um aumento de 44% no número de adultos com diabetes até 2050, segundo dados da International Diabetes Federation. Atualmente, 16,6 milhões de adultos brasileiros convivem com a doença.", "titulo_pt": "Até 2050, Brasil pode ter aumento de 44% no número de adultos com diabetes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 262342, "titulo": "Legislature passes parental leave increase", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/14/2003867712", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamento aprovou um aumento no período de licença parental.", "titulo_pt": "Parlamento aprova aumento na licença parental", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 264366, "titulo": "Afghanistan’s olive groves give farmers hope", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/15/2003867744", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pomares de oliveiras em Afganistão estão dando esperança aos agricultores locais. Essa atividade agrícola está ajudando a melhorar as condições econômicas das comunidades rurais.", "titulo_pt": "Os pomares de oliveiras dão esperança aos agricultores afegãos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 263942, "titulo": "Mpox avança em outubro e novembro, e Brasil chega a 1.055 casos com 1 morte", "url": "https://www.metropoles.com/saude/mpox-avanca-em-outubro-e-novembro-e-brasil-chega-a-1-055-casos-com-1-morte", "fonte_id": "metropoles", "data_pub": "2026-11-14T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de outubro e até a metade de novembro, foram registrados 552 casos de mpox no Brasil, somando um total de 1.055 casos. A maioria desses casos não é considerada grave.", "titulo_pt": "Mpox avança em outubro e novembro, e Brasil chega a 1.055 casos com 1 morte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263906, "titulo": "Ceará decreta situação de emergência em 65 cidades por risco de seca com El Niño", "url": "https://veja.abril.com.br/agenda-verde/ceara-decreta-situacao-de-emergencia-em-65-cidades-por-risco-de-seca-com-el-nino/", "fonte_id": "veja", "data_pub": "2026-11-14T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará decretou situação de emergência em 65 cidades devido ao risco de seca associado ao fenômeno El Niño. A medida, válida por 180 dias, prevê a implementação de obras e serviços emergenciais para enfrentar ameaças ao abastecimento de água e à produção agropecuária.", "titulo_pt": "Ceará decreta situação de emergência em 65 cidades por risco de seca com El Niño", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 264078, "titulo": "La creciente escasez de salmones, un drama en Alaska", "url": "https://www.clarin.com/estados-unidos/la-creciente-escasez-de-salmones-un-drama-en-alaska_0_1piJw77Ozg.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em Alaska, a pesca de arrastre ameaça o salmão, essencial para as comunidades locais. O desequilíbrio causado pelo aquecimento global está agravando a escassez desta espécie. O debate sobre a pesca industrial está se intensificando, enquanto os residentes buscam medidas que protejam o ecossistema sem prejudicar a economia regional.", "titulo_pt": "A crescente escassez de salmão, um drama em Alaska", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 263948, "titulo": "Ceará decreta situação de emergência em 65 municípios diante dos riscos do El Niño", "url": "https://exame.com/brasil/ceara-decreta-situacao-de-emergencia-em-65-municipios-diante-dos-riscos-do-el-nino/", "fonte_id": "exame", "data_pub": "2026-11-14T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará decretou situação de emergência em 65 municípios para se preparar para possíveis impactos de uma seca intensa em 2027, devido ao El Niño. A medida tem validade de 180 dias.", "titulo_pt": "Ceará decreta situação de emergência em 65 municípios diante dos riscos do El Niño", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263950, "titulo": "Bomba é encontrada em usina de etanol nos EUA e provoca evacuação de mais de 5 mil pessoas", "url": "https://exame.com/mundo/bomba-e-encontrada-em-usina-de-etanol-nos-eua-e-provoca-evacuacao-de-mais-de-5-mil-pessoas/", "fonte_id": "exame", "data_pub": "2026-11-14T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um artefato explosivo foi encontrado em um complexo industrial de etanol em Illinois, Estados Unidos, resultando na evacuação de mais de 5 mil pessoas. O FBI e autoridades locais foram mobilizados para desativar o dispositivo, com buscas continuando na região.", "titulo_pt": "Bomba é encontrada em usina de etanol nos EUA e provoca evacuação de mais de 5 mil pessoas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263951, "titulo": "'Queimar a floresta é intencional', diz presidente do Ibama sobre incêndios no Pará", "url": "https://exame.com/esg/queimar-a-floresta-e-intencional-diz-presidente-do-ibama-sobre-incendios-no-para/", "fonte_id": "exame", "data_pub": "2026-11-14T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Ibama, Jair Schmitt, afirmou que os incêndios na floresta do Pará são intencionais. Segundo ele, invasores de terras públicas aproveitam as condições climáticas para eliminar a vegetação. O estado do Pará declarou situação de emergência por 180 dias.", "titulo_pt": "Queimar a floresta é intencional, diz presidente do Ibama sobre incêndios no Pará", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263956, "titulo": "Opinião: a COP31 foi um choque de realidade necessário", "url": "https://exame.com/bussola/opiniao-a-cop31-foi-um-choque-de-realidade-necessario/", "fonte_id": "exame", "data_pub": "2026-11-14T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na abertura da COP31 em Antalya, líderes enfatizaram que superar 1,5º C de aquecimento global é inevitável e destacaram a transição energética como um elemento central para a economia.", "titulo_pt": "Opinião: a COP31 foi um choque de realidade necessário", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264161, "titulo": "Choking fires, deadly heat and devastating floods: 2026 in extreme weather", "url": "https://www.theguardian.com/world/2026/nov/14/fires-heat-floods-extreme-weather-2026", "fonte_id": "guardian_world", "data_pub": "2026-11-14T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, pessoas ao redor do mundo enfrentaram eventos climáticos extremos e letais, resultado da catástrofe climática. O número de mortes devido a esses eventos já ultrapassa as 100.000, sendo uma estimativa conservadora que certamente aumentará. Durante todo o ano, houve secas, incêndios e inundações, lembrando que ações urgentes para reduzir as emissões de gases de efeito estufa são necessárias para evitar anos tão desastrosos.", "titulo_pt": "Asfixiando incêndios, calor letal e inundações devastadoras: 2026, ano de climatologia extremista", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 264429, "titulo": "Mexico's Parque del Jaguar protects jaguars with 18-kilometre limestone wall", "url": "https://www.dezeen.com/2026/11/14/parque-del-jaguar-colectivo-c733-tulum-mexico-ecological-park/", "fonte_id": "dezeen", "data_pub": "2026-11-14T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Colectivo C733 construiu uma parede de 18 quilômetros de limestone em Parque del Jaguar, na Tulum, México, permitindo a passagem de vida selvagem e protegendo mais de 1.000 hectares de floresta.", "titulo_pt": "México's Parque del Jaguar protege jaguatins com muralha de 18 quilômetros de limestone", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 263473, "titulo": "Chile bajo 0°C", "url": "https://www.latercera.com/opinion/noticia/chile-bajo-0c/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título original 'Chile bajo 0°C' sugere que o conteúdo aborda condições climáticas extremas em Chile, com temperaturas abaixo de 0°C. O texto não fornece detalhes adicionais sobre o conteúdo, então não é possível incluir mais informações.", "titulo_pt": "Chile com temperaturas abaixo de 0°C", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263478, "titulo": "Cómo se prepara Chile para evitar los incendios en un verano extremo", "url": "https://www.latercera.com/nacional/noticia/como-se-prepara-chile-para-la-temporada-de-incendios-forestales/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile se prepara para um verão extremo com alto risco de incêndios devido à seca prolongada causada pelo El Niño e à vegetação seca. A Conaf estabeleceu uma meta de 7 mil km de cortafuegos, duplicando o objetivo de anos anteriores, e os bombeiros contarão com novas tecnologias de informação satelital.", "titulo_pt": "Como o Chile se prepara para evitar incêndios no verão extremo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263332, "titulo": "El Niño \"muito forte\" até 2027 acende alerta de seca e cheias no Brasil", "url": "https://www.metropoles.com/brasil/el-nino-muito-forte-ate-2027-acende-alerta-de-seca-e-cheias-no-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-14T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A previsão é de um El Niño forte até 2027, o que aumenta o risco de agravamento da disponibilidade de água no Brasil nos próximos meses.", "titulo_pt": "El Niño 'muito forte' até 2027 acende alerta de seca e cheias no Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262345, "titulo": "Climate index unfairly ranks Taiwan: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/14/2003867722", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro taiwanês fez uma declaração afirmando que um índice climático está injustamente classificando Taiwan. Não foram fornecidos detalhes adicionais sobre o índice ou as razões específicas da classificação.", "titulo_pt": "Índice climático classifica injustamente Taiwan, afirma ministro", "veiculo": "Ta   const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
