<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

na Alemanha, o partido de centro-direita CDU sofreu derrotas significativas em duas eleições de estados, enquanto o partido de extrema-direita AfD obteve resultados importantes. Na França, o presidente Emmanuel Macron e o primeiro-ministro canadense Justin Trudeau, não Mark Carney, se reuniram em Saint Pierre e Miquelon para fortalecer as relações bilaterais, destacando valores compartilhados e cooperação em áreas como pesca e segurança. Além disso, o governo brasileiro anunciou a nomeação de três pessoas para liderar as embaixadas do país em Cairo, Port Moresby e Dili, além do consulado geral em Nova York. O presidente Lula viaja a Nova York para participar da Assembleia-Geral da ONU, potencialmente encontrando seu adversário político, o senador Flávio Bolsonaro.\n\nA Ucrânia intensificou suas operações militares contra a Rússia, lançando mais de 1,6 mil drones durante o último dia das eleições parlamentares russas. Este ataque, considerado o maior já registrado contra a capital russa, resultou em pelo menos três mortes e danos significativos em uma refinaria de petróleo. Em resposta, a Rússia declarou que intensificará seus ataques a Kyiv em resposta às incursões de drones ucranianos em Moscou. O cenário geopolítico se complica com a possibilidade de adiamento das vendas de armas para a Taiwan, o que pode afetar as relações entre os Estados Unidos e a China. Além disso, a Coreia do Norte disparou dois projéteis no Mar do Leste, rejeitando uma resolução da agência de vigilância nuclear da ONU que exigia o fim de suas atividades nucleares. Estas ações refletem a crescente tensão global e a complexa interação de interesses geopolíticos entre as principais potências mundiais.", "economia": "A terceira missão do Fundo Monetário Internacional (FMI) chegou à Argentina para revisar a meta fiscal, a estratégia de reservas e o rumo do programa econômico do país. Este evento depende de um giro financeiro de 867 milhões de dólares e envolve a participação de economistas como Luján Milei e Caputo em uma viagem a Nova York. Paralelamente, o Brasil enfrenta desafios econômicos, com a Petrobras negando qualquer impacto socioambiental na Foz do Amazonas, enquanto o Ministério Público Federal (MPF) discorda e pede a suspensão imediata da licença de perfuração de petróleo na região. Juntamente com a União Europeia, o Quênia e o Canadá, o Brasil publicou um manifesto no Financial Times defendendo o multilateralismo, apontando para um paradoxo atual: o mundo é mais interdependente, mas também mais fragmentado e polarizado. Além disso, a inflação global continua alta, com especialistas alertando para o risco de um fenômeno climático intenso, o El Niño, que pode afetar o preço global dos alimentos.", "tecnologia": "A Microsoft defendeu a adoção de medidas de controle para a inteligência artificial (IA), contrariando as preocupações com o progresso chinês nessa área, afirmando que a omissão não justifica as preocupações. Em relação à Lei de Segurança Online que protege menores de conteúdo nocivo, a Microsoft ingressou com um processo judicial contra a Ofcom no Reino Unido. A IA também foi utilizada para escolher touros, melhorando o rebanho de vacadas Brangus, mostrando a aplicação da tecnologia em áreas tradicionais. Na área empresarial, a Amazon oferece diversos gadgets tecnológicos em promoção, como smartwatches, smart speakers, caixas de som e impressoras, além de jogos Xbox. A Rockstar Games opera com doze estúdios espalhados por seis países, cada um especializado em uma função técnica específica para o desenvolvimento de um único jogo, uma abordagem única no setor de jogos. A segurança de veículos autônomos (AV) também foi debatida, com discussões sobre quando um AV é considerado seguro o suficiente. Além disso, a tecnologia de IA enfrenta críticas relacionadas a questões de privacidade e segurança, com hackers da OpenAI alertando sobre problemas de segurança na indústria de IA.", "ciencia": "Um estudo recente, publicado na revista científica Physical Review, revela que a Terra perdeu mais de 12 trilhões de toneladas de gelo nos glaciares da Groenlândia e da Antártica desde 1979, conforme dados de satélites. Essa perda de gelo é um sinal preocupante do aquecimento global. Em outro estudo, cientistas da NASA transformaram as emissões electromagnéticas da Terra e de outros corpos celestes em sons audíveis, criando uma melodia inquietante que pode ajudar a entender a atividade do planeta. Além disso, um estudo publicado no Exame sugere que a exposição pré-natal a elementos raras do território pode aumentar o risco de nascimento com baixo peso, com alguns compostos elevando o perigo mais de três vezes. Outro estudo, desta vez do Exame, indica que a exposição a certos conservantes comuns nos alimentos processados está associada à hipertensão arterial, apesar do estudo ser apenas observacional. Por fim, um estudo publicado no Science Daily sugere que a linguagem humana e o uso do fogo podem estar mais interligados na história da humanidade do que se pensava anteriormente, apontando para uma possível relação entre a evolução da linguagem e a domesticação do fogo.", "cultura": "O orçamento para cultura no Taiwan chegará a NT$65,9 bilhões, anunciou Lai. O Festival Cine Inclusão 60+ começou em São Paulo e segue até 27 de setembro, exibindo filmes sobre envelhecimento. O filme 'Se eu fosse vivo... viveria', dirigido por André Novais Oliveira, venceu o principal prêmio do 59º Festival de Brasília do Cinema Brasileiro. 'Feito Pipa', dirigido por Allan Deberton, será o representante do Brasil na corrida pelo Oscar de 2027. Além disso, a ópera 'Chica da Silva' em Belo Horizonte humaniza a personagem, desviando-se do mito tradicional. O filme 'La Bola Negra', dirigido por Alejandro Amenábar, venceu o People's Choice Award do Festival de Toronto e será representante da Espanha na categoria de Melhor Filme no Oscar 2027. O Festival de Brasília do Cinema Brasileiro também premiou o filme 'Angh', vencedor da mostra Platform.", "sociedade": "O Ministério Público Federal (MPF) está realizando uma investigação sobre homenagens a apoiadores da ditadura militar no Rio Grande do Sul, após um inquérito aberto na semana passada. Paralelamente, o Distrito Federal está oferecendo 1.200 vagas de emprego nas primeiras semanas, incluindo duas para supervisor de lavanderia em Ceilândia, com salários até R$ 3.500. Um pesquisador da FGV-Ibre alerta que o aumento do piso do Bolsa Família de R$ 600 para R$ 691 pode comprometer as contas públicas, pois este reajuste não estava previsto no orçamento fiscal. Além disso, a Itália planeja proibir o uso de véus nas escolas e limitar o número de alunos estrangeiros por turma, devido à sua localização no Mediterrâneo.", "meio_ambiente": "A Amazônia se torna o centro do planeta durante a temporada de chuvas, conforme medido pela NASA, refletindo diferentes ciclos naturais que movimentam bilhões de toneladas de água. Na Colômbia, a cidade turística de Villa de Leyva enfrenta ameaças de incêndios florestais devido a temperaturas recordistas causadas por El Niño e condições de seca. Além disso, a partir de 1º de julho, o maior aterro sanitário do país, em Luján, parou de receber resíduos, marcando uma mudança significativa na gestão do lixo, apesar de ainda haver trabalhos de remediação necessários.", "direitos_humanos": "O Papa Francisco expressou preocupação com a situação humanitária em partes da Somália, afetada por violência e fenômenos meteorológicos extremos. Cerca de 4,8 milhões de pessoas necessitam de assistência humanitária urgente, conforme informa o UNICEF. Diante dessa situação, a comunidade internacional é chamada a apoiar a Somália neste momento crítico, reforçando a importância dos direitos humanos e da assistência humanitária em regiões em conflito ou afetadas por desastres naturais."}, "resumo_do_dia": {"politica_nacional": [{"id": 172845, "titulo": "Vinculação de Lula e Alexandre de Moraes é escolha do governo, diz professor", "url": "https:// -stf", "fonte_id": "metropoles", "data_pub": "2026-09-20T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador e candidato à reeleição Carlos Viana protocolou um pedido de afastamento cautelar de Gonet no STF após mensagens de Vorcaro contradizerem declarações do Procurador-Geral da República.", "titulo_pt": "Carlos Viana protocola pedido de afastamento cautelar de Gonet no STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 172832, "titulo": "Governador da Bahia usou helicóptero que foi disponibilizado por ex-sócio do Master a Wagner", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/governador-da-bahia-usou-helicoptero-que-foi-disponibilizado-por-ex-socio-do-master-a-wagner.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador da Bahia, Jerônimo Rodrigues (PT), utilizou um helicóptero vinculado ao ex-sócio de Daniel Vorcaro, do Banco Master, durante um compromisso de campanha. A Polícia Federal identificou o helicóptero como sendo de Augusto Lima.", "titulo_pt": "Governador da Bahia usou helicóptero ligado a ex-sócio do banco Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 172939, "titulo": "Dino manda governo revisar regras da CVM e cita falhas reveladas pelo caso Master", "url": "https://www.infomoney.com.br/mercados/dino-manda-governo-revisar-regras-da-cvm-e-cita-falhas-reveladas-pelo-caso-master/", "fonte_id": "infomoney", "data_pub": "2026-09-20T20:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dino instruiu o governo a revisar as regras da CVM (Comissão de Valores Mobiliários) e apontou falhas reveladas pelo caso Master. Ele deu 90 dias para o governo apresentar conclusões sobre as mudanças necessárias.", "titulo_pt": "Dino ordena revisão das regras da CVM e cita falhas do caso Master", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172839, "titulo": "Jato de Vorcaro em que Moraes viajou transporta até 14 passageiros; conheça", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/jato-de-vorcaro-em-que-moraes-viajou-transporta-ate-14-passageiros-conheca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T19:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jato Legacy 650, fabricado pela Embraer, em que Alexandre de Moraes e sua esposa, Viviane Barci, foram filmados, é capaz de transportar até 14 passageiros. Este avião é um jato executivo.", "titulo_pt": "Jato legacy 650 em que Moraes viajou transporta até 14 passageiros; conheça", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 172833, "titulo": "Raquel Lyra sugere laqueadura sem aval de mulher; governadora pede desculpa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/raquel-lyra-sugere-laqueadura-sem-aval-de-mulher-governadora-pede-desculpa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T18:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora de Pernambuco, Raquel Lyra, sugeriu a realização de uma laqueadura sem o consentimento prévio de uma mulher em um hospital no agreste do estado durante um evento no ano anterior. Raquel Lyra pediu desculpas após a divulgação dos fatos.", "titulo_pt": "Raquel Lyra sugere laqueadura sem consentimento de mulher; governadora pede desculpa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 172834, "titulo": "Campanha de Lula aciona TSE contra suposto uso de perfis para impulsionar conteúdo de Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/campanha-de-lula-aciona-tse-contra-suposto-uso-de-perfis-para-impulsionar-conteudo-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T18:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula apresentou uma ação no TSE acusando Flávio Bolsonaro de usar perfis no Instagram para ampliar a propaganda eleitoral e monetizar conteúdo. O objetivo é investigar o suposto uso de perfis fictícios por parte da candidatura de Flávio Bolsonaro.", "titulo_pt": "Campanha de Lula denuncia uso de perfis no instagram por Flávio bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 172835, "titulo": "A crise além do Supremo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/lara-mesquita/2026/09/a-crise-alem-do-supremo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T18:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As suspeitas de relações impróprias entre ministros do Supremo e o ex-banqueiro Daniel Vorcaro devem ser investigadas. No entanto, durante a sessão do STF sobre as suspeitas envolvendo Alexandre de Moraes e André Mendonça, os ministros se concentraram mais em administrar a crise do que em esclarecer as suspeitas.", "titulo_pt": "A crise no Supremo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 172859, "titulo": "Pesquisa Real Time Big Data testa disputa Lula x Flávio no terceiro maior colégio eleitoral do Nordeste", "url": "https://veja.abril.com.br/politica/pesquisa-real-time-big-data-testa-disputa-lula-x-flavio-no-terceiro-maior-colegio-eleitoral-do-nordeste/", "fonte_id": "veja", "data_pub": "2026-09-20T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Real Time Big Data ouviu 1.600 eleitores do estado para testar a disputa entre Lula e Flávio no terceiro maior colégio eleitoral do Nordeste. O levantamento tem uma margem de erro de 2 pontos percentuais.", "titulo_pt": "Pesquisa testa disputa Lula x Flávio no terceiro maior colégio eleitoral do Nordeste", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 172634, "titulo": "Ukraine launches attack on Moscow", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/21/2003864611", "fonte_id": "taipei_times", "data_pub": "2026-09-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia lançou uma ofensiva contra Moscou. Este ataque é parte das operações militares em curso entre as duas nações.", "titulo_pt": "Ucrânia inicia ataque contra moscou", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 172639, "titulo": "US might postpone major Taiwan arms sales: report", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/21/2003864623", "fonte_id": "taipei_times", "data_pub": "2026-09-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório sugere que os Estados Unidos podem adiar a venda de armas para a Taiwan. Até o momento, não há confirmação oficial sobre essa possibilidade.", "titulo_pt": "Estados unidos podem adiar vendas de armas para a Taiwan: relatório", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 173115, "titulo": "Torres strikes again as PSG beat bitter rivals Marseille 2-1", "url": "https://www.france24.com/en/sport/20260920-torres-strikes-again-as-psg-beat-bitter-rivals-marseille-2-1", "fonte_id": "france24", "data_pub": "2026-09-20T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paris Saint-Germain venceu o rival Marselha por 2 a 1 em 'Le Classique', com o espanhol Ferran Torres marcando seu sétimo gol em seis partidas pelo novo clube.", "titulo_pt": "Torres marca novamente e PSG vence o rival marselha por 2 a 1", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 173099, "titulo": "Federal immigration agent shoots and injures man in Austin, Texas", "url": "https://www.npr.org/2026/09/20/nx-s1-5975517/ice-shooting-austin-texas", "fonte_id": "npr_news", "data_pub": "2026-09-20T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agente de imigração federal disparou e feriu uma pessoa em Austin, Texas. O ferido está em condição grave, mas estável, segundo o prefeito de Austin, Kirk Watson.", "titulo_pt": "Agente federal de imigração dispara e feri alguém em Austin, Texas", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 173140, "titulo": "Russia Unita mantiene il vantaggio nelle elezioni col 41,04% delle schede scrutinate", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/20/russia-unita-mantiene-il-vantaggio-nelle-elezioni-col-4104-delle-schede_725e5ef2-e0d6-4e23-ba3e-7f871326d5fa.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-20T21:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A União das Repúblicas Independentes (Unita) está na liderança nas eleições com 57,26% dos votos apurados. A Comissão Eleitoral informou que a Unita mantém o vantame com 41,04% das mesas contadas.", "titulo_pt": "Unita mantém vantagem nas eleições com 57,26% dos votos apurados", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 173096, "titulo": "Australia news live: former Murdoch executive named New York consul general; Albanese launches bid for UN security council seat", "url": "https://www.theguardian.com/australia-news/live/2026/sep/21/anthony-albanese-new-york-jim-chalmers-intergenerational-report-coalition-one-nation-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-20T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra das Relações Exteriores australiana, Penny Wong, anunciou as nomeações de três pessoas para liderar as embaixadas da Austrália em Cairo, Port Moresby e Dili, além do consulado geral em Nova York. O sistema diplomático australiano visa promover os interesses do país em áreas como paz, segurança, comércio e investimento.", "titulo_pt": "Notícias da austrália: ex-executivo Murdoch nomeado como cônsul-geral em nova York; Albanese inicia tentativa por assento no conselho de segurança da ONU", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 173064, "titulo": "On a Dot of France Off Canada, Carney and Macron Promote Shared Values", "url": "https://www.nytimes.com/2026/09/20/world/canada/carney-macron-saint-pierre-miquelon-canada-eu.html", "fonte_id": "nyt_world", "data_pub": "2026-09-20T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes do Canadá e da França se encontraram logo após a União Europeia convidar o Canadá para se tornar seu primeiro 'membro associado'. Durante esse encontro, os líderes promoveram valores compartilhados.", "titulo_pt": "Em um ponto da França fora do canadá, Carney e Macron promovem valores compartilhados", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 173100, "titulo": "Poison suspected in deaths of ten lions in game reserve in Tanzania", "url": "https://www.npr.org/2026/09/20/nx-s1-5975478/poison-suspected-in-deaths-of-ten-lions-in-game-reserve-in-tanzania", "fonte_id": "npr_news", "data_pub": "2026-09-20T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dez leões foram encontrados mortos dentro da Área de Conservação Ngorongoro, um importante reservatório de vida selvagem na Tanzânia. Os óbitos levantam preocupações sobre a possibilidade de envenenamento de animais selvagens na África Oriental.", "titulo_pt": "Envenenamento suspeito nas mortes de dez leões em reservatório de vida selvagem na tanzânia", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 173149, "titulo": "Pacific island states are trapped in Cold War 2.0", "url": "https://www.scmp.com/opinion/asia-opinion/article/3367734/pacific-island-states-are-trapped-cold-war-20?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em julho, China realizou um teste de míssil nuclear submarino no Pacífico Sul pela primeira vez. A reação dos Estados Unidos e da Austrália foi negativa, considerando o Pacífico como seu espaço de testes. A reação dos estados insulares do Pacífico foi mais moderada, com críticas vindas apenas de alguns líderes.", "titulo_pt": "Estados insulares do pacífico presos na segunda guerra fria 2.0", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 173121, "titulo": "Canada, France agree to closer ties in defense, economy", "url": "https://www.dw.com/en/canada-france-agree-to-closer-ties-in-defense-economy/a-79348843?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-20T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente francês Emmanuel Macron e o primeiro-ministro canadense Mark Carney anunciaram aprofundamento das relações econômicas e de defesa. Essa decisão ocorre em meio a tensas relações do Canadá com os Estados Unidos.", "titulo_pt": "Canadá e França acordam em aproximar relações em defesa e economia", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 173122, "titulo": "German state elections deal a blow to Chancellor Friedrich Merz", "url": "https://www.dw.com/en/german-state-elections-deal-a-blow-to-chancellor-friedrich-merz/a-79348585?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-20T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições em Berlim e Mecklenburgo-Volhácia resultaram em uma derrota histórica para o CDU, enquanto o AfD obteve um significativo ganho. A pressão sobre o chanceler alemão, desaprovado pela população, está aumentando.", "titulo_pt": "Eleições alemãs dão golpe no chanceler Friedrich Merz", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 173110, "titulo": "Man, 82, dies after beach fight with 76-year-old over sunlounger in Greece", "url": "https://www.bbc.co.uk/news/articles/cqm27pnyd294o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-20T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 82 anos morreu em uma briga na praia com um homem de 76 anos sobre uma cadeira de praia em Grécia. Um testemunho relatou que o incidente foi caótico, com gritos ouvidos de uma parte da praia para outra.", "titulo_pt": "Homem de 82 anos morre em briga de praia com homem de 76 anos por causa de cadeira de sol na Grécia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 172997, "titulo": "Ucrania lanzó el “mayor ataque de la historia” contra Moscú mientras los rusos votaban en unas elecciones sin sorpresa", "url": "https://www.lanacion.com.ar/el-mundo/ucrania-lanzo-el-mayor-ataque-de-la-historia-contra-moscu-mientras-los-rusos-votaban-en-unas-nid20092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-20T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 1600 drones ucranianos foram interceptados durante a última jornada de votação russa, onde a oposição praticamente não participou.", "titulo_pt": "Ucrânia realizou 'maior ataque de história' contra moscovo enquanto russos votavam em eleições sem surpresas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 173126, "titulo": "Qatar PM urges Gulf security framework with Iran", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/20/qatar-pm-urges-gulf-security-framework-with-iran?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-20T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Catar incentivou a criação de um marco de segurança para o Golfo que assegure que nenhum país seja uma ameaça para os outros. Segundo ele, o Golfo não será o mesmo sem tal framework.", "titulo_pt": "Catar incentiva marco de segurança para o golfo com Irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 172831, "titulo": "Lula vai à ONU acenar ao eleitor antes da eleição e pode encontrar Trump", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/lula-vai-a-onu-acenar-ao-eleitor-antes-da-eleicao-e-pode-encontrar-trump.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-20T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula viaja a Nova York para participar da Assembleia-Geral da ONU em uma visita breve aos Estados Unidos, no momento em que a relação entre Brasil e Estados Unidos é tensa e antes das eleições presidenciais no Brasil. O senador Flávio Bolsonaro é seu principal adversário.", "titulo_pt": "Lula viaja à ONU antes da eleição e pode encontrar Trump", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173124, "titulo": "Germany’s Merz stands his ground but for how long?", "url": "https://www.ft.com/content/a4901983-10a2-488d-8725-66177d6f9ea2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-20T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lição dos líderes europeus não populares indica que, uma vez que eles perdem o apoio do público, é raro que consigam se recuperar.", "titulo_pt": "Merz se mantém firme, mas por quanto tempo?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 172653, "titulo": "AI expected to help ease inflationary pressure", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/21/2003864600", "fonte_id": "taipei_times", "data_pub": "2026-09-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia artificial inteligente (IA) está prevista para auxiliar na alívio da pressão inflacionária.", "titulo_pt": "IA esperada para aliviar pressão inflacionária", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 173008, "titulo": "Llega la tercera misión del FMI a la Argentina: revisan la meta fiscal, la de reservas y el rumbo del programa", "url": "https://www.clarin.com/economia/llega-tercera-mision-fmi-argentina-revisan-meta-fiscal-reservas-rumbo-programa_0_7ENcCousk5.html", "fonte_id": "clarin", "data_pub": "2026-09-20T21:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A terceira missão do FMI chega à Argentina para revisar a meta fiscal, a estratégia de reservas e o rumo do programa econômico. O evento depende de um giro financeiro de 867 milhões de dólares e envolve a participação de Milei e Caputo em uma viagem a Nova York.", "titulo_pt": "Chega a terceira missão do FMI à Argentina: revisão de metas fiscais e reservas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 172938, "titulo": "Coligação de Lula aciona TSE contra uso de perfis para impulsionar campanha de Flávio", "url": "https://www.infomoney.com.br/politica/coligacao-de-lula-aciona-tse-contra-uso-de-perfis-para-impulsionar-campanha-flavio/", "fonte_id": "infomoney", "data_pub": "2026-09-20T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coligação apoiada por Lula apresentou uma petição ao TSE (Tribunal Superior Eleitoral) acusando a campanha de Flávio de usar perfis fictícios no Instagram para impulsionar sua campanha. De acordo com a petição, foram mapeadas 1.826 publicações em coautoria entre 492 perfis.", "titulo_pt": "Coligação de Lula denuncia uso de perfis fictícios para beneficiar campanha de Flávio ao TSE", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172940, "titulo": "Calendário econômico: ata do Copom, IPCA-15, Relatório de Política Monetária no radar", "url": "https://www.infomoney.com.br/mercados/calendario-economico-ata-do-copom-e-relatorio-de-politica-monetaria-como-destaques/", "fonte_id": "infomoney", "data_pub": "2026-09-20T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na próxima semana, os investidores terão acesso à ata do Copom, ao IPCA-15 e ao Relatório de Política Monetária. Estes eventos são importantes para a tomada de decisões no mercado financeiro.", "titulo_pt": "Calendário econômico: ata do Copom, IPCA-15, Relatório de Política Monetária no radar", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172942, "titulo": "Treasuries de curto prazo emergem como aposta popular de controle da inflação por Fed", "url": "https://www.infomoney.com.br/mercados/treasuries-de-curto-prazo-emergem-como-aposta-popular-de-controle-da-inflacao-por-fed/", "fonte_id": "infomoney", "data_pub": "2026-09-20T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores confiam na recuperação dos títulos de dívida dos Estados Unidos a curto prazo, de dois anos, como uma maneira de controlar a inflação. O Federal Reserve está considerando essa estratégia otimista.", "titulo_pt": "Títulos de curto prazo emergem como aposta popular de controle da inflação pelo Fed", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172838, "titulo": "EUA devem vender US$ 1 tri em títulos de curto prazo após alta recorde dos Treasuries", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/eua-devem-vender-us-1-tri-em-titulos-de-curto-prazo-apos-alta-recorde-dos-treasuries.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os bancos de Wall Street esperam que os EUA vendam títulos de curto prazo no valor de US$ 1 trilhão em 2027. Isso reflete a crescente dependência de títulos com vencimento rápido, tornando o governo vulnerável a flutuações de juros.", "titulo_pt": "EUA devem vender US$ 1 trilhão em títulos de curto prazo após alta recorde dos Treasuries", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 172944, "titulo": "FT: Brasil, UE, Quênia e Canadá escrevem manifesto em defesa do multilateralismo", "url": "https://www.infomoney.com.br/mundo/ft-brasil-ue-quenia-e-canada-escrevem-manifesto-em-defesa-do-multilateralismo/", "fonte_id": "infomoney", "data_pub": "2026-09-20T19:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil, a União Europeia, o Quênia e o Canadá publicaram um manifesto no Financial Times defendendo o multilateralismo. O documento destaca um paradoxo atual: o mundo é mais interdependente, mas também mais fragmentado e polarizado.", "titulo_pt": "Brasil, UE, Quênia e Canadá escrevem manifesto em defesa do multilateralismo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172945, "titulo": "Caiado: “Brasil tem estrutura para combater e libertar população do narcotráfico”", "url": "https://www.infomoney.com.br/politica/caiado-brasil-tem-estrutura-para-combater-e-libertar-populacao-do-narcotrafico/", "fonte_id": "infomoney", "data_pub": "2026-09-20T19:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Goiás, Ronaldo Caiado, afirmou que o Brasil possui a estrutura necessária para combater e libertar a população do narcotráfico. Ele enfatizou que a decisão é soberana e independente de outros países.", "titulo_pt": "Caiado: Brasil tem estrutura para combater e libertar população do narcotráfico", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172947, "titulo": "Importações chinesas de soja dos EUA caem 12% em agosto", "url": "https://www.infomoney.com.br/economia/importacoes-chinesas-de-soja-dos-eua-caem-12-em-agosto/", "fonte_id": "infomoney", "data_pub": "2026-09-20T19:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As importações de soja dos Estados Unidos pela China diminuíram em 12% em agosto, passando de 227.205 toneladas no mesmo mês de 2025 para 200.477 toneladas.", "titulo_pt": "Importações chinesas de soja dos EUA caem 12% em agosto", "veiculo": "InfoMoney", "pai duplicata_de": null, "texto_pt": "Uma pesquisa analisou 17 anos de dados sísmicos e identificou 1.399 terremotos locais na região do Monte Mantap, onde ocorreram os principais testes nucleares da Coreia do Norte. Estes testes podem ter provocado milhares de terremotos na região nos anos seguintes.", "titulo_pt": "Testes nucleares da Coreia do Norte podem ter causado milhares de terremotos na região nos anos seguintes", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 173166, "titulo": "Venus ate its moon: How Earth's 'twin' could have swallowed a rocky satellite", "url": "https://phys.org/news/2026-09-venus-ate-moon-earth-twin.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos científicos sugerem que Vênus, com tamanho, massa e estrutura semelhantes à Terra, poderia ter engolido um satélite rochoso ao longo do tempo. Pesquisas recentes da UC Riverside apontam para essa possibilidade.", "titulo_pt": "Vênus engoliu sua lua: por que o 'gêmeo' da terra não tem uma lua?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172755, "titulo": "To understand the solar cycle, notice how the sun sleeps", "url": "https://phys.org/news/2026-09-solar-sun.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atividade solar varia entre períodos turbulentos com muitos pontos solares e períodos calmos e inativos. Embora se saiba que isso ocorre em um ciclo de 11 anos, prever o pico solar exato e sua intensidade continua sendo um desafio mesmo após séculos de observação.", "titulo_pt": "Para compreender o ciclo solar, observe como o sol dorme", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172929, "titulo": "Esta galáxia registrada pelo Hubble parece normal, mas há algo estranho em seu centro; veja", "url": "https://exame.com/ciencia/esta-galaxia-registrada-pelo-hubble-parece-normal-mas-ha-algo-estranho-em-seu-centro-veja/", "fonte_id": "exame", "data_pub": "2026-09-20T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas acreditam que uma fusão galáctica antiga criou um novo disco de gás e estrelas no centro da galáxia. A galáxia, registrada pelo Hubble, parece normal, mas há algo estranho em seu centro.", "titulo_pt": "Esta galáxia registrada pelo Hubble parece normal, mas há algo estranho em seu centro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172756, "titulo": "Virtual cells built from 4D AI models and 'digital twins' could speed up drug discovery", "url": "https://phys.org/news/2026-09-virtual-cells-built-4d-ai.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mitocôndrias, estruturas que convertem nutrientes em energia, formam uma rede dinâmica e interconectada ao longo de todo o célula, se divinizando e fusindo rapidamente conforme são transportadas para onde a energia é mais necessária. Modelos de inteligência artificial em 4D podem ser usados para simular essas estruturas de forma virtual, acelerando o processo de descoberta de medicamentos.", "titulo_pt": "Células virtuais construídas a partir de modelos AI em 4D e 'gemelos digitais' podem acelerar a descoberta de medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172757, "titulo": "The story of Little Italy's Feast of San Gennaro is the story of how Italian immigrants became American", "url": "https://phys.org/news/2026-09-story-italy-feast-san-gennaro.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante duas semanas em setembro, multidões se aglomeram na Feira de São Gennaro em Little Italy, Nova York. Esta feira é vista como uma história da integração dos imigrantes italianos na América.", "titulo_pt": "A história da feira de são Gennaro em Little Italy é a história de como imigrantes italianos se tornaram americanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172933, "titulo": "Por que morcegos carregam vírus sem adoecer? Estudo pode ter encontrado resposta", "url": "https://exame.com/ciencia/por-que-morcegos-carregam-virus-sem-adoecer-estudo-pode-ter-encontrado-resposta/", "fonte_id": "exame", "data_pub": "2026-09-20T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que mais de 500 espécies de morcegos têm um sistema duplo de genes para produzir anticorpos, uma característica genética única não encontrada em outros mamíferos. Este sistema pode explicar por que os morcegos podem carregar vírus sem adoecer.", "titulo_pt": "Por que morcegos carregam vírus sem adoecer? Estudo pode ter encontrado resposta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172267, "titulo": "Científicos lograron recrear el sonido que produce la Tierra en el espacio y la melodía resulta inquietante", "url": "https://www.lanacion.com.ar/ciencia/cientificos-lograron-recrear-el-sonido-que-produce-la-tierra-en-el-espacio-y-la-melodia-resulta-nid20092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-20T15:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas da NASA conseguiram transformar as emissões electromagnéticas da Terra e de outros corpos celestes em sons audíveis. O resultado é uma melodia inquietante.", "titulo_pt": "Cientistas da nasa criam melodia com emissões elétricas da terra", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 172758, "titulo": "Magma influx explains short-lived bulge at Tanzania's Ol Doinyo Lengai volcano", "url": "https://phys.org/news/2026-09-magma-influx-short-bulge-tanzania.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2024, o time liderado por D. Sarah Stamps detectou e monitorou um breve enho-do-sus", "fonte_id": "jota", "data_pub": "2026-09-20T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prontuário único e a inteligência artificial unem os planos de saúde propostos pelos presidenciáveis, mas há divergências em relação ao financiamento e ao envolvimento do setor privado no Sistema Único de Saúde (SUS).", "titulo_pt": "Saúde em 2026: convergência digital esconde divergências sobre desenho do SUS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 172694, "titulo": "Not all harmful actions between students count as school violence: Supreme Court", "url": "https://www.koreaherald.com/article/10879660", "fonte_id": "korea_herald", "data_pub": "2026-09-20T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte da Coreia do Sul decidiu que uma ação prejudicial de um aluno do primeiro ano que empurrou um colega de classe do púlpito não constituiu violência escolar. A corte enfatizou que não se deve automaticamente classificar como violência escolar todo ato que cause danos físicos ou psicológicos entre alunos.", "titulo_pt": "Não todos os danos entre alunos são considerados violência escolar, decide suprema corte", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 172679, "titulo": "University calls for government funds for shared sites in Northern Metropolis", "url": "https://www.scmp.com/news/hong-kong/education/article/3368146/university-calls-government-funds-shared-sites-northern-metropolis?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T07:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Universidade Privada Saint Francis, professor Stephen Cheung Yan-leung, sugeriu que as autoridades de Hong Kong deveriam assumir uma maior parte dos custos das instalações compartilhadas entre as instituições nas cidades universitárias do Metrópole do Norte. Ele também propôs fundos dedicados à pesquisa para estimul function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');

    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
