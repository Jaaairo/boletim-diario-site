<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "08/08/2026 07:17", "stats": {"noticias_novas": 603, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A eleição presidencial no Brasil em 2026 será a primeira do século sem mulheres candidatas, com 13 chapas oficiais e apenas duas mulheres representando partidos que não têm presença significativa no Congresso Nacional. O Partido dos Trabalhadores (PT) apresentou um programa focado em temas como soberania nacional, reforma das emendas parlamentares e regulamentação de redes sociais. A campanha do presidente Lula priorizará projetos para idosos. Já o senador Flávio Bolsonaro direcionará suas emendas principalmente para segurança pública e defesa nacional, com menos foco em habitação e agricultura. A Advocacia-Geral da União (AGU) classificou a plataforma Discord como uma empresa de comunicação privada e estabeleceu prazos para medidas de segurança. O Tribunal Superior Eleitoral (TSE) criou um órgão consultivo para monitorar riscos relacionados à desinformação e inteligência artificial nas eleições de 2026.", "mundo": "A Espanha reimplantou controles de fronteira com a Itália, aumentando o desacordo entre os governos socialista e conservador dos dois países. Essa decisão reflete os crescentes tensionamentos relacionados à imigração irregular. Na sequência, a Itália planeja concentrar esforços para prevenir imigrações irregulares e mortes acidentais, após o sucesso em bloquear movimentos ilegais da Espanha. Em outros eventos internacionais, o presidente ucraniano Volodymyr Zelensky visitou a Sérvia, buscando apoio internacional enquanto Moscou intensifica os ataques a Kiev. Além disso, o Senado dos Estados Unidos confirmou Todd Blanche como novo procurador-geral do país em um processo contencioso, enquanto a Itália paralisou um centro de procriação assistida após um erro grave na implantação de embriões.\n\nOs Estados Unidos anunciaram uma investida de 400 milhões de dólares na mina de rares metais da terra na Austrália, com o objetivo de garantir a suprimento de escândio, enquanto a China reduz as exportações para fins militares. Em outro desenvolvimento geopolítico, o Japão planeja aumentar os investimentos em defesa para 2% do PIB, através de aumentos de impostos e reformas nos gastos públicos, diante das ameaças da China e Rússia. O governo americano também planeja enviar uma ajuda financeira no valor de um bilhão de dólares para a Colômbia após a posse do novo presidente Carlos Holmes Trujillo De la Espriella. No entanto, há disputas orçamentárias relacionadas ao plano japonês. O Conselho de Segurança da ONU alertou para uma escalada na situação no Iêmen e pediu aos hutíes que parem com os ataques, reafirmando seu apoio à soberania, independência, unidade e integridade territorial do país. Além disso, a Líbia tem estado dividida desde 2014, com governos rivais no leste e no oeste do país, gerando preocupações sobre a estabilidade regional.", "economia": "A economia brasileira enfrenta vários desafios e avanços. A Confederação Nacional de Comércio projeta que as vendas para o Dia dos Pais em 2026 movimentarão R$ 8,52 bilhões no varejo, mas alerta para a necessidade de cautela diante do cenário de crédito mais caro e endividamento. A carga tributária no Brasil atingiu um novo recorde, chegando a 32,4% do PIB, principalmente impulsionada por impostos sobre renda, consumo e folha de pagamento. O Banco Central estabeleceu novas regras para reter operações de criptomoedas acima de US$ 10 mil por 24 horas com o objetivo de prevenir fraudes no mercado de ativos virtuais. No cenário global, a China anunciou um projeto-piloto que permitirá usuários de aplicativos de pagamento chineses pagar por QR Code em estabelecimentos brasileiros conectados ao Pix, sinalizando uma integração financeira internacional. Além disso, o Brasil implementou uma portaria que permitiu leilões de baterias para armazenamento, avançando tecnologicamente na contratação de potência por armazenamento. O desenvolvimento da economia global também foi marcado pelo investimento americano em projetos minerais para fortalecer suas cadeias de suprimentos e a China planejou listar sua startup de inteligência artificial na Hong Kong Stock Exchange, buscando aprovação do governo chinês.", "tecnologia": "A Amazon anunciou que está investindo em um grande parque de gás no Texas, que pode se tornar a maior fonte de emissões de gases de efeito estufa dos Estados Unidos. Este movimento reflete o aumento das operações de inteligência artificial pelas grandes empresas tecnológicas. Por outro lado, a China enfrenta novos desafios na construção de modelos avançados de inteligência artificial, pois está se esgotando em dados de treinamento de qualidade chineses. A escassez de dados pode se tornar o próximo grande gargalo para os objetivos tecnológicos do país. Além disso, a Taiwan anunciou o desenvolvimento de um transistor unilayer de molybdenium disulfide (MoS2) com alto desempenho, projetado para resolver problemas existentes em semicondutores bidimensionais. Este avanço pode ter implicações significativas na indústria de semicondutores e tecnologia da informação.", "ciencia": "Um pequeno rã verde noturno foi descoberto no centro da região pacífica da Costa Rica, onde prospera nas plantações de café. No entanto, o animal enfrenta riscos devido ao uso de agrotóxicos na agricultura local. Em um avanço significativo para a xenotransplantação, pesquisadores do Centro de Ciência para Desenvolvimento de Xenotransplante da USP realizaram a eutanásia do primeiro porco clonado pelo projeto, que fazia parte de uma iniciativa para gerar clones geneticamente modificados com potencial para fornecer órgãos para transplantes em humanos. Um estudo chinês revelou que algumas intervenções humanas nas barragens do Rio Yangtze podem estar agravando os riscos de inundações, ao invés de mitigá-los, sugerindo que a frequência das inundações atingiu seu pico durante o Pequeno Inverno Medieval (1500-1850) antes dos sistemas de controle de cheias serem implementados.", "cultura": "A indústria de brinquedos está se reinventando através do uso de séries, consoles e redes sociais para manter-se relevante. O filme 'A Odisseia', dirigido por Christopher Nolan, critica a era dos trapaceiros como Donald Trump e Elon Musk, sugerindo uma possível saída para essa situação. No cenário cultural global, o Museu de Arte de São Paulo (Masp) busca um novo diretor-geral após Flávia Buarque de Almeida assumir a presidência, enquanto o Uffizi em Florença planeja uma transformação de 50 milhões de euros nos próximos dois anos. O livro 'As ruas ficaram em silêncio' reúne fotos inéditas de Cuba nos dias após a morte de Fidel Castro, destacando eventos culturais importantes.", "sociedade": "No Brasil, um caso chocante de violência doméstica levou à prisão do avô que estuprou sua neta de 5 anos durante uma ceia de Natal. O incidente ilustra o drama da violência intrafamiliar no país. Em Roma, autoridades enfrentam um desafio humanitário após a expulsão de cidadãos acampados em um prédio ocupado; centenas buscam abrigo durante uma onda de calor. Na Espanha, a cidade de Ceuta enfrenta uma crise migratória inédita, com milhares de pessoas chegando do Marrocos e desafiando as relações inter-religiosas da região há séculos. Em São Paulo, a polícia investiga um caso de tentativa de assassinato contra uma ex-companheira, levantando novos questionamentos sobre a segurança doméstica no estado. Além disso, o Brasil enfrenta um aumento do sarampo; um médico alerta para a facilidade de transmissão da doença, enquanto a sociedade busca soluções para a longevidade digna e a inclusão social de pessoas em situação de rua.", "meio_ambiente": "Um ciclone-bomba atingiu o Sul e Sudeste do Brasil, causando danos significativos. No Rio Grande do Sul, cerca de 250 mil pessoas ficaram sem luz e mais de 2.300 foram desalojadas. O fenômeno também resultou na morte de uma pessoa no estado. As rajadas de vento atingiram até 97,2 km/h em cidades do litoral sul, levando à suspensão das aulas e paralisação do Porto de Santos. No Paraná e Santa Catarina, vendavais e tempestades continuarão nos próximos dias. Em relação ao meio ambiente, o desmatamento na Amazônia diminuiu 36,87% no último ano, atingindo o menor nível desde 2016. Além disso, um incêndio florestal consumiu cerca de 100 hectares perto de Narbonne, França, e está sendo combatido com recursos aéreos. Em Tainan, Taiwan, as cidades costeiras enfrentam pressões climáticas crescentes, com ameaças de eventos extremos e níveis elevados de maré.", "direitos_humanos": "A Organização Mundial da Saúde (OMS) alerta que a epidemia de Ebola na República Democrática do Congo está ultrapassando as medidas de resposta internacionais, conforme relatado pelo Taipei Times. Em outro desenvolvimento importante, o presidente sul-coreano Lee Jae Myung se reuniu com sobreviventes historicamente negligenciados da violência estatal e ofereceu uma compensação formal, prometendo restaurar a dignidade dos cidadãos afetados e garantir um processo de cura significativo. O diretor da Organização Internacional do Trabalho (OIT), Vinícius Carvalho Pinheiro, afirmou que trabalhar em aplicativos para quitar dívidas pode ser considerado trabalho escravo, conforme informado pelo JOTA, destacando a Convenção 193 estabelecida para proteger esses trabalhadores. Além disso, o governo dos EUA permitiu que os tribunais encerrassem o Status Protegido Temporário (TPS) para cidadãos sudaneses do Sul e birmaneses, abrindo caminho para a deportação dessas pessoas, conforme informado pelo Al Jazeera."}, "resumo_do_dia": {"politica_nacional": [{"id": 94437, "titulo": "O que se sabe sobre o novo indiciamento do ex-presidente do INSS", "url": "https://www.cnnbrasil.com.br/politica/o-que-se-sabe-sobre-o-novo-indiciamento-do-ex-presidente-do-inss/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-08T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal concluiu um segundo inquérito sobre o esquema de desvio de aposentados e indiciou Alessandro Stefanutto, ex-presidente do INSS. Stefanutto chefiou o órgão durante o governo de Lula.", "titulo_pt": "Novo indiciamento envolve ex-presidente do INSS no esquema de desvio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94348, "titulo": "Embate entre PF e STF gera ambiente hostil, mas delegados não veem risco para investigações", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/embate-entre-pf-e-stf-gera-ambiente-hostil-mas-delegados-nao-veem-risco-para-investigacoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados da Polícia Federal avaliam que o conflito entre o diretor-geral Andrei Rodrigues e o ministro do STF André Mendonça não está interferindo nas investigações das fraudes do INSS, apesar de ter causado ruídos.", "titulo_pt": "Conflito entre PF e STF não ameaça investigações sobre fraudes do inss, dizem delegados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94559, "titulo": "A eleição presidencial e o comércio exterior", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-eleicao-presidencial-e-o-comercio-exterior", "fonte_id": "jota", "data_pub": "2026-08-08T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição presidencial no Brasil deve determinar como o país equilibrará suas relações com Estados Unidos e China. O pleito político terá implicações para as dinâmicas comerciais internacionais do Brasil.", "titulo_pt": "Eleição presidencial e equilíbrio nas relações comerciais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94560, "titulo": "Está formado o microssistema dos filtros de acesso aos tribunais superiores", "url": "https://www.jota.info/opiniao-e-analise/artigos/esta-formado-o-microssistema-dos-filtros-de-acesso-aos-tribunais-superiores", "fonte_id": "jota", "data_pub": "2026-08-08T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As regras e procedimentos podem ser transferidos entre os filtros dos tribunais superiores, incluindo o STF (Supremo Tribunal Federal), o STJ (Superior Tribunal de Justiça) e o TST (Tribunal Superior do Trabalho).", "titulo_pt": "Formado o microssistema dos filtros de acesso aos tribunais superiores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94393, "titulo": "Após encontrar Mendonça, ministro da Justiça se reúne com chefe da PF", "url": "https://www.metropoles.com/colunas/igor-gadelha/apos-encontrar-mendonca-ministro-da-justica-se-reune-com-chefe-da-pf", "fonte_id": "metropoles", "data_pub": "2026-08-08T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Justiça se reuniu com o diretor da Polícia Federal para preparar o terreno para uma futura conversa entre Andrei Rodrigues e André Mendonça.", "titulo_pt": "Depois de encontrar Mendonça, ministro da Justiça se reúne com chefe da PF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 94399, "titulo": "Aliado de Nunes articula para ter comando da Câmara de SP em 2027", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/aliado-nunes-comando-camara-sp", "fonte_id": "metropoles", "data_pub": "2026-08-08T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vereador João Jorge (MDB) é apontado como o favorito para assumir a Presidência da Câmara Municipal de São Paulo em 2027. Atualmente, o comando da câmara está nas mãos do União.", "titulo_pt": "Aliado de Nunes seria favorito para comandar a Câmara de SP em 2027", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 94400, "titulo": "PT mobiliza aliados, bases e redes para dar peso ao lançamento de Lula", "url": "https://www.metropoles.com/brasil/pt-mobiliza-aliados-bases-e-redes-para-dar-peso-ao-lancamento-de-lula", "fonte_id": "metropoles", "data_pub": "2026-08-08T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) está mobilizando aliados, bases e redes para fortalecer o lançamento de Lula como candidato. O ato inaugural da campanha ocorrerá no próximo domingo (16/8), no local onde iniciou a carreira política do ex-presidente.", "titulo_pt": "PT mobiliza aliados, bases e redes para dar peso ao lançamento de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 94461, "titulo": "Eleição de 2026 é a primeira do século sem mulheres em chapas competitivas", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicao-de-2026-e-a-primeira-do-seculo-sem-mulheres-em-chapas-competitivas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição de 2026 será a primeira do século sem mulheres em chapas competitivas. Das 13 candidaturas oficializadas, as únicas mulheres estão em partidos que não têm representatividade no Congresso Nacional.", "titulo_pt": "Eleição de 2026 é a primeira do século sem mulheres em chapas competitivas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94349, "titulo": "Campanha de Lula investirá em programas de cuidado com idosos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/campanha-de-lula-investira-em-programas-de-cuidado-com-idosos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tema do cuidado com idosos será um dos principais focos da campanha e programa de governo de Lula, conforme destacado durante sua fala na convenção partidária.", "titulo_pt": "Campanha de Lula destaca cuidado com idosos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94350, "titulo": "Flávio Bolsonaro concentrou emendas em segurança e defesa e deixou ciência e agricultura de fora", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-bolsonaro-concentrou-emendas-em-seguranca-e-defesa-e-deixou-ciencia-e-agricultura-de-fora.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador e candidato à Presidência pelo PL-RJ, direcionou suas emendas parlamentares para segurança pública e defesa nacional. As áreas de habitação e agricultura receberam pouca atenção, enquanto a saúde recebeu apenas 1% das emendas.", "titulo_pt": "Flávio Bolsonaro priorizou emendas em segurança e defesa, descuidando-se de ciência e agricultura", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94351, "titulo": "Coronel é condenado em ação penal por livro em que critica Exército e faz acusação de corrupção", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/coronel-e-condenado-em-acao-penal-por-livro-em-que-critica-exercito-e-faz-acusacao-de-corrupcao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T01:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O coronel da reserva do Exército Rubens Pierrotti Jr. foi condenado pela Justiça Militar por criticar o Exército em um romance que apresenta generais envolvidos com corrupção e malfeitos, além de fazer declarações em entrevistas a respeito.", "titulo_pt": "Coronel é condenado por livro que critica o Exército e acusa generais de corrupção", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94352, "titulo": "Congresso se fortaleceu afetando previsibilidade e transparência, diz estudo da Fundação FHC", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/congresso-se-fortaleceu-afetando-previsibilidade-e-transparencia-diz-estudo-da-fundacao-fhc.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T01:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo da Fundação Fernando Henrique Cardoso afirma que o fortalecimento recente do Congresso Nacional foi apoiado por regras informais que concentraram o poder nas presidências das Casas, reduzindo a previsibilidade e a transparência. As comissões foram esvaziadas de trabalho nesse processo.", "titulo_pt": "Congresso se fortaleceu em custo de previsibilidade e transparência, diz estudo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94353, "titulo": "Lula foca em soberania, propõe mudar emendas e cita 6x1 em plano de governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/campanha-de-lula-poe-soberania-como-eixo-de-programa-de-governo-para-se-contrapor-a-trump.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T01:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT apresentou o programa de governo do presidente Lula, focando em temas como soberania e mudanças nas emendas parlamentares. O plano também propõe regulamentar as redes e acabar com a escala 6x1.", "titulo_pt": "Lula destaca soberania e propõe mudanças em emendas no programa de governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94354, "titulo": "'Não o conheço', diz Gilmar Mendes sobre vice de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/nao-o-conheco-diz-gilmar-mendes-sobre-vice-de-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-08T01:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do STF, afirmou que não conhece o deputado Alfredo Gaspar, vice na chapa de Flávio Bolsonaro. Mendes é relator de um pedido de investigação sobre uma suspeita de estupro de vulnerável envolvendo Gaspar.", "titulo_pt": "Gilmar Mendes afirma não conhecer vice de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 94564, "titulo": "Cleitinho é anunciado candidato a governador de Minas Gerais pelo Republicanos", "url": "https://www.jota.info/eleicoes/eleicoes-2026/cleitinho-e-anunciado-candidato-a-governador-de-minas-gerais-pelo-republicanos", "fonte_id": "jota", "data_pub": "2026-08-08T01:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cleitinho foi anunciado como candidato a governador de Minas Gerais pelo Republicanos. Anteriormente, o presidente do partido havia divulgado um vídeo afirmando que Cleitinho havia desistido.", "titulo_pt": "Cleitinho é anunciado candidato a governador de Minas Gerais pelo Republicanos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94411, "titulo": "Em nova reviravolta, Cleitinho anuncia que será candidato ao governo de Minas", "url": "https://veja.abril.com.br/politica/em-nova-reviravolta-cleitinho-anuncia-que-sera-candidato-ao-governo-de-minas/", "fonte_id": "veja", "data_pub": "2026-08-08T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Cleitinho anunciou que será candidato ao governo de Minas Gerais, após convencer a direção do Republicanos.", "titulo_pt": "Cleitinho anuncia candidatura ao governo de Minas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 94789, "titulo": "Spain reinstates border controls on Italy as tensions rise over migrants", "url": "https://www.ft.com/content/f3050d94-6b78-4cf2-8b07-cf8903aacc7f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-08T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Espanha reimplantou controles de fronteira com a Itália, aumentando o desacordo entre o governo do socialista Pedro Sánchez e o premiê conservador Giorgia Meloni. A decisão reflete os crescentes tensionamentos relacionados aos imigrantes.", "titulo_pt": "Espanha reimplanta controles de fronteira com Itália por causa de tensões sobre imigrantes", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 94792, "titulo": "Meloni, grave e vergognoso gesto Cgil a commemorazione Marcinelle", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/08/meloni-grave-e-vergognoso-gesto-cgil-a-commemorazione-marcinelle_657d2bac-f5d4-4bca-9816-4ba26e8fcf00.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-08T09:42:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A frase 'Contestazione politica trasformata in un gesto di disprezzo verso le Istituzioni' sugere que uma contestação política foi transformada em um gesto de desdém para as instituições. O texto original não fornece mais detalhes.", "titulo_pt": "Reclamação política transformada em gesto de desprezo às instituições", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 94757, "titulo": "US announces $400m investment in Australian rare earth mine", "url": "https://www.aljazeera.com/news/2026/8/8/us-announces-400m-investment-in-australian-rare-earth-mine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-08T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos anunciam uma investida de 400 milhões de dólares na mina de rares metais da terra na Austrália com o objetivo de garantir a suprimento de escandio, enquanto a China reduz as exportações para produtos militares.", "titulo_pt": "EUA anunciam investimento de 400 milhões em mina australiana de metais raras", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 94793, "titulo": "Europei di nuoto,Paltrinieri'felice comunque dell'argento,è stata una bella staffetta'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/08/europei-di-nuotopaltrinierifelice-comunque-dellargentoe-stata-una-bella-staffetta_4847b038-09e9-4da4-a0ed-48789dc01487.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-08T09:28:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Paltrinieri se sente infeliz por não ter nadado a prova completa, mas está contente com o segundo lugar na staffeta. Ele deixará a competição com um pouco de arrependimento, pois não conseguiu fazer tudo que podia e não fará parte da última volta.", "titulo_pt": "Nadadores europeus felizes com o bronze,staffeta foi bela", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 94794, "titulo": "Ue, 'concentrare sforzi per prevenire ingressi irregolari e morti insensate'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/08/ue-concentrare-sforzi-per-prevenire-ingressi-irregolari-e-morti-insensate_99f39420-9f88-473d-bfb6-fb5695a8712e.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-08T09:20:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Itália planeja concentrar esforços para prevenir imigrações irregulares e mortes acidentais. Movimentos ilegais para a Europa foram bem-sucedidamente bloqueados pela Espanha.", "titulo_pt": "Europa, 'concentrar esforços para prevenir chegadas irregulares e mortes imprudentes'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 94524, "titulo": "Existe mesmo uma onda anti-Argentina no mundo, como diz Javier Milei?", "url": "https://www.bbc.com/portuguese/articles/c87ny9zq41go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-08T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto questiona a existência de uma onda anti-Argentina no mundo, afirmando que o fundamento dessa narrativa está mais de 100 anos atrás e se refere à imagem construída do país como supostamente superior.", "titulo_pt": "Existe realmente uma onda anti-argentina no mundo, como diz Javier Milei?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 94795, "titulo": "Spagna, controlli a campione su viaggiatori dall'Italia in vigore dalla mezzanotte", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/08/spagna-controlli-a-campione-su-viaggiatori-dallitalia-in-vigore-dalla-mezzanotte_689a0ffd-37b4-4f37-a229-62113539213e.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-08T09:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A partir da meia-noite, a Espanha implementou controles nos campiços para viajantes vindos da Itália. Esses controles visam garantir a segurança sanitária durante a pandemia de COVID-19.", "titulo_pt": "Espanha, controles em campiços para viajantes do Brasil à meia-noite", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 94796, "titulo": "Europei di nuoto, argento Italia nella staffetta mista 4 x 1.5 km", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/08/europei-di-nuoto-argento-italia-nella-la-staffetta-mista-4-x-1.5-km_79905cb9-184c-4397-91b6-c8ca7c89139b.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-08T09:06:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Itália conquistou a medalha de prata na staffeta mista de natação 4 x 1,5 km. A Alemanha ganhou a medalha de ouro e a Hungria ficou com o bronze.", "titulo_pt": "Natação: prata para Italia na staffeta mista 4 x 1,5 km", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 94629, "titulo": "Italy’s Heat Will Spread to Western Europe Ahead of Solar Eclipse", "url": "https://www.nytimes.com/2026/08/08/weather/heat-in-italy-will-spread-to-western-europe.html", "fonte_id": "nyt_world", "data_pub": "2026-08-08T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas vermelhos de altas temperaturas permaneceram em vigor para a maior parte do sul e oeste da Itália até sábado. Um eclipse solar está previsto para ocorrer, mas não há menção específica dele no trecho fornecido.", "titulo_pt": "Aquecimento na Itália se espalhará para a Europa ocidental antes de Eclipse Solar", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 94443, "titulo": "Japão detalha plano militar diante de ameaças da China e Rússia", "url": "https://www.cnnbrasil.com.br/internacional/japao-detalha-plano-militar-diante-de-ameacas-da-china-e-russia/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão planeja aumentar os investimentos em defesa para 2% do PIB, através de aumentos de impostos e reformas nos gastos públicos. No entanto, há disputas orçamentárias relacionadas a este plano.", "titulo_pt": "Japão detalha plano militar diante de ameaças da China e Rússia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94544, "titulo": "Pequeños tesoros ilustrados: veinte libros imperdibles para descubrir en la FED", "url": "https://www.lanacion.com.ar/cultura/pequenos-tesoros-ilustrados-veinte-libros-imperdibles-para-descubrir-en-la-fed-nid08082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A uma semana do Dia das Crianças, foi lançada uma lista de 20 livros recomendados para crianças de diferentes idades, com preços variando entre R$16.000 e R$35.000. O catálogo inclui novelas breves, contos, histórias em quadrinhos e obras não-ficcionais divertidas.", "titulo_pt": "Pequenos tesouros ilustrados: vinte livros imperdíveis para descobrir no dia das crianças", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 94689, "titulo": "Data centers are a political issue crossing party lines, driving voters to candidates", "url": "https://www.npr.org/2026/08/08/g-s1-137853/data-centers-primaries-midterms", "fonte_id": "npr_news", "data_pub": "2026-08-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Candidatas democrata Francesca Hong e o republicano Vivek Ramaswamy, que aspira ao governo de Ohio, ambos propuseram uma moratória sobre data centers. O assunto tem se tornado um ponto político relevante, transcendendo as divisões partidárias durante as campanhas.", "titulo_pt": "Data centers são questão política transpondo fronteiras partidárias, impulsionando votos para candidatos", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 94717, "titulo": "Vietnam's indigenous Hmong people forced to adapt to climate crisis", "url": "https://www.france24.com/en/tv-shows/focus/20260808-vietnam-s-indigenous-hmong-people-forced-to-adapt-to-climate-crisis", "fonte_id": "france24", "data_pub": "2026-08-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os hmong, um povo indígena que vive há séculos numa região montanhosa do norte da Vietnã, estão enfrentando os efeitos do clima instável. Aumento das temperaturas, precipitações inesperadas e deslizamentos de terra são problemas cotidianos, afetando as ladeiras de arroz cultivadas por gerações e levando à perda de plantas medicinais devido à desmatamento.", "titulo_pt": "Povos Hmong do vietnã enfrentam crise climática", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 94718, "titulo": "Spain to impose border checks on Italy", "url": "https://www.france24.com/en/video/20260808-spain-to-impose-border-checks-on-italy", "fonte_id": "france24", "data_pub": "2026-08-08T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Espanha implementou controles de fronteira para todos os voos e navegações vindas da Itália, em meio a uma crise diplomática que se agrava. Essa medida foi tomada após a Itália ter introduzido medidas semelhantes devido ao aumento no número de imigrantes chegando à região espanhola de Ceuta.", "titulo_pt": "Espanha impõe controles de fronteira na rota para a Itália", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 94719, "titulo": "US Senate narrowly confirms Trump loyalist Todd Blanche as attorney general", "url": "https://www.france24.com/en/americas/20260808-us-senate-confirms-trump-s-ex-lawyer-as-attorney-general", "fonte_id": "france24", "data_pub": "2026-08-08T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado dos Estados Unidos votou por 50-49 para confirmar Todd Blanche, ex-assessor pessoal de Donald Trump e seu advogado privado, como novo procurador-geral do país. A confirmação encerra um dos processos mais contenciosos para o gabinete durante a segunda gestão de Trump.", "titulo_pt": "Senado confirma Todd Blanche como novo procurador-geral por 50-49", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 94759, "titulo": "Typhoon Dolphin hits Japan, heads towards China", "url": "https://www.aljazeera.com/news/2026/8/8/typhoon-dolphin-hits-japan-heads-towards-china?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-08T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tufão chamado Dolphin atingiu o Japão e está se movendo para a China. Cinco idosos sofreram ferimentos leves devido ao vento forte.", "titulo_pt": "Tufão Dolphin atinge Japão e avança para China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 94557, "titulo": "PIS/Cofins sobre receitas de reservas técnicas de seguradoras é mantido pelo Carf", "url": "https://www.jota.info/tributos/pis-cofins-sobre-receitas-de-reservas-tecnicas-de-seguradoras-e-mantido-pelo-carf", "fonte_id": "jota", "data_pub": "2026-08-08T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os conselheiros do Carf (Conselho Administrativo de Recursos Fiscais) discutiram a tributação das receitas provenientes das reservas técnicas das seguradoras pelo PIS/Cofins. O tema também está sendo analisado pelo STF (Supremo Tribunal Federal) em uma repercussão geral.", "titulo_pt": "Tributação de receitas de reservas técnicas de seguradoras mantida pelo Carf", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94441, "titulo": "Após disparada, feijão começa a ficar mais barato nos supermercados", "url": "https://www.cnnbrasil.com.br/agro/apos-dispara-feijao-comeca-a-ficar-mais-barato-nos-supermercados/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A queda nas lavouras de feijão foi mais intensa do que o aumento observado nos preços nas gôndolas dos supermercados. O setor espera que em agosto haja um maior repasse desses custos para os consumidores.", "titulo_pt": "Feijão começa a baixar de preço nos supermercados após queda nas lavouras", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94558, "titulo": "O teto remuneratório constitucional e as funções de confiança", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/o-teto-remuneratorio-constitucional-e-as-funcoes-de-confianca", "fonte_id": "jota", "data_pub": "2026-08-08T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto reflete sobre um julgamento recente do Tribunal de Contas da União (TCU) envolvendo o teto remuneratório constitucional e as funções de confiança.", "titulo_pt": "Reflexões sobre o recente julgamento do tcu", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94561, "titulo": "As novas bases do crédito habitacional no Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/as-novas-bases-do-credito-habitacional-no-brasil", "fonte_id": "jota", "data_pub": "2026-08-08T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Regulamentações recentes fortaleceram o crédito imobiliário e expandiram as oportunidades de financiamento habitacional no Brasil.", "titulo_pt": "As novas bases do crédito habitacional no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94562, "titulo": "Constitucionalismo sustentável no WCCL-2026", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/constitucionalismo-sustentavel-no-wccl-2026", "fonte_id": "jota", "data_pub": "2026-08-08T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Mundial de Direito Constitucional enfatiza a importância do intercâmbio acadêmico entre constitucionalistas para a defesa das democracias.", "titulo_pt": "Constitucionalismo sustentável no WCCL-2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94563, "titulo": "Leilão de baterias e a Portaria MME 136", "url": "https://www.jota.info/opiniao-e-analise/artigos/leilao-de-baterias-e-a-portaria-mme-136", "fonte_id": "jota", "data_pub": "2026-08-08T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil implementou uma portaria que permitiu o leilão de baterias para armazenamento, avançando tecnologicamente na contratação de potência por armazenamento.", "titulo_pt": "Leilão de baterias e a Portaria MME 136", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 94397, "titulo": "Dia dos Pais deve movimentar R$ 8,52 bilhões no varejo em 2026", "url": "https://www.metropoles.com/brasil/dia-dos-pais-deve-movimentar-r-852-bilhoes-no-varejo-em-2026", "fonte_id": "metropoles", "data_pub": "2026-08-08T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Confederação Nacional de Comércio (CNC) projeta que as vendas para o Dia dos Pais em 2026 movimentarão R$ 8,52 bilhões no varejo. No entanto, os consumidores devem ser cautelosos diante do cenário de crédito mais caro e endividamento.", "titulo_pt": "Dia dos Pais deve movimentar R$ 8,52 bilhões no varejo em 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 94456, "titulo": "Com IR e IOF, carga tributária bate recorde e chega a 32,4% do PIB", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/com-ir-e-iof-carga-tributaria-bate-recorde-e-chega-a-324-do-pib/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-08T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A carga tributária no Brasil atingiu um novo recorde, chegando a 32,4% do PIB. A arrecadação cresceu acima da economia, impulsionada principalmente por impostos sobre renda, consumo e folha de pagamento.", "titulo_pt": "Com IR e IOF, carga tributária bate recorde e chega a 32,4% do PIB", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94357, "titulo": "Amazon investe em usina a gás nos EUA para data centers", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/amazon-investe-em-usina-a-gas-nos-eua-para-data-centers.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está investindo financeiramente em uma usina de gás no Texas que pode se tornar a maior fonte individual de emissões de gases de efeito estufa dos Estados Unidos.", "titulo_pt": "Amazon apoia usina de gás no texas, maior fonte individual de emissões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 94467, "titulo": "Atores ganham bônus quando o filme vai bem de bilheteria? Entenda como funciona", "url": "https://exame.com/pop/atores-ganham-bonus-quando-o-filme-vai-bem
