"fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O escritor gallego Manel Loureiro defende autores que enfrentam o desafio de entretê-los, usando um ritmo de suspense e pondo o apocalipse como cenário de fundo.", "titulo_pt": "A literatura foi o palco perfeito para escapar da minha vida", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222741, "titulo": "Flaubert contra la prisa de la IA", "url": "https://www.lanacion.com.ar/opinion/flaubert-contra-la-prisa-de-la-ia-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a obra de Flaubert e sua crítica à pressa na criação literária, em contraste com a atuação da inteligência artificial (IA).", "titulo_pt": "Flaubert contra a pressa da IA", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222745, "titulo": "“No estamos en un abismo; estamos en un camino con peligros”", "url": "https://www.lanacion.com.ar/conversaciones-de-domingo/no-estamos-en-un-abismo-estamos-en-un-camino-con-peligros-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Flavia Costa analisa os mudanças políticas e culturais que acompanham o desenvolvimento da inteligência artificial, entre anúncios de avanços e ameaças de crises.", "titulo_pt": "Não estamos em um abismo; estamos em um caminho com perigos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222760, "titulo": "Long Covid, las escasas huellas que quedan siete años después", "url": "https://www.latercera.com/nacional/noticia/long-covid-las-escasas-huellas-que-quedan-siete-anos-despues/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em dezembro, se comemora mais um l RIBA Nakshabid Architects", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 222897, "titulo": "Dónal Lunny, ‘colossus of Irish music’, dies aged 79", "url": "https://www.theguardian.com/music/2026/oct/24/donal-lunny-colossus-irish-music-dies-aged-79", "fonte_id": "guardian_world", "data_pub": "2026-10-24T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dónal Lunny, um músico tradicional irlandês e fundador do trio Rakes of Kildare, faleceu aos 79 anos de câncer. Ele atuou em várias bandas, incluindo Planxty, Moving Hearts, the Bothy Band e Coolfin, e tocou em todo o mundo.", "titulo_pt": "Dónal Lunny, 'colosso da música irlandesa', morre aos 79 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 222983, "titulo": "The Muslims finding belonging in southern Spain", "url": "https://www.aljazeera.com/features/longform/2026/10/24/the-muslims-finding-belonging-in-southern-spain?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-24T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns muçulmanos estão escolhendo Andaluzia, na Espanha, atraídos pelas reminiscências do passado islâmico da região. Este fenômeno ocorre mesmo após séculos desde o fim do domínio islâmico.", "titulo_pt": "Muçulmanos encontrando pertencimento na sul da Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 223125, "titulo": "‘Our third date was at Buckingham Palace’: Marlon James and Nicholas Boggs on life as a literary power couple", "url": "https://www.theguardian.com/books/2026/oct/24/our-third-date-was-at-buckingham-palace-marlon-james-and-nicholas-boggs-on-life-as-a-literary-power-couple", "fonte_id": "guardian_culture", "data_pub": "2026-10-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marlon James, um novelista, e Nicholas Boggs, um biógrafo, foram listados como finalistas para os prêmios Booker e Baillie Gifford. Eles conversam sobre trabalhar e viver juntos, bem como sobre dar voz à história do Black queer.", "titulo_pt": "Nosso terceiro encontro foi na casa de Buckingham: marlon James e Nicholas Boggs sobre vida e carreira como casal literário", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 222463, "titulo": "'Zona Zero', de Yeon Sang-ho, é filme atual, mas deixa a desejar", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/zona-zero-de-yeon-sang-ho-e-filme-atual-mas-deixa-a-desejar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2016, Yeon Sang-ho lançou 'Invasão Zumbi', que misturava ação, horror e crítica social, se tornando um clássico do gênero. O filme acompanhou passageiros de um trem tentando escapar de zumbis.", "titulo_pt": "Zona Zero, de Yeon Sang-ho, é filme atual, mas deixa a desejar", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 223092, "titulo": "K-pop's master of ceremonies", "url": "https://www.koreaherald.com/article/10911886", "fonte_id": "korea_herald", "data_pub": "2026-10-24T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "You Jae-phil é um anfitrião de eventos frequentemente encontrado em showcases de K-pop em Seul. Este ano, ele já realizou showcases para artistas populares como Ateez, Aespa e Tomorrow X Together. Antes de se tornar um anfitrião procurado, ele trabalhou por anos na indústria.", "titulo_pt": "O mestre de cerimônias do k-pop", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 222780, "titulo": "Esto es Chile: El Maule ama su naturaleza, pero le teme a la falta de trabajo", "url": "https://www.latercera.com/esto-es-chile/noticia/el-maule-ama-su-naturaleza-pero-le-teme-a-la-falta-de-trabajo/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estudo de 'Esto es Chile' revela que a região do Maule, no centro do Chile, experimenta uma tensão constante. De um lado, a região se orgulha de seus belos paisajes e tradições rurais, mas, do outro, não está satisfeita com a situação de emprego e teme a elevação do custo de vida.", "titulo_pt": "Isto é Chile: Maule ama sua natureza, mas teme a falta de emprego", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 222497, "titulo": "Metalúrgicos do ABC começam a negociar nova jornada após fim da escala 6x1", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/metalurgicos-do-abc-comecam-a-negociar-nova-jornada-apos-fim-da-escala-6x1.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sindicato dos Metalúrgicos do ABC está negociando alterações em convenções e acordos coletivos de trabalho para implementar uma nova jornada após o fim da escala 6x1. A entidade já havia enviado propostas às metalúrgicas em junho.", "titulo_pt": "Metalúrgicos do ABC começam a negociar nova jornada após fim da escala 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222620, "titulo": "Enem 2026 tem mais de 5 milhões de inscritos; mulheres são 64% do total", "url": "https://www.cnnbrasil.com.br/educacao/enem-2026-tem-mais-de-5-milhoes-de-inscritos-mulheres-sao-64-do-total/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Enem 2026 contou com mais de 5 milhões de inscritos, sendo que 64% são mulheres. O exame será aplicado nos dias 8 e 15 de novembro. Especialistas recomendam revisar erros, distribuir os estudos e treinar a administração do tempo na reta final.", "titulo_pt": "Enem 2026 tem mais de 5 milhões de inscritos; mulheres são 64% do total", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222752, "titulo": "Mamdani anunció que Nueva York dará comida gratis a perros y gatos en 22 puntos de la ciudad", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/mamdani-anuncio-que-nueva-york-dara-comida-gratis-a-perros-y-gatos-en-22-puntos-de-la-ciudad-nid23102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T06:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O programa de Mamdani fornecerá comida gratuita para cães e gatos em 22 pontos da cidade de Nova York, com uma investida municipal de 500 mil dólares. Os locais onde será oferecida a comida serão divulgados.", "titulo_pt": "Mamdani anuncia distribuição gratuita de comida para cães e gatos em 22 pontos de nova York", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222650, "titulo": "Mounjaro ou anorexia? Médicos alertam que canetas podem mascarar transtornos alimentares graves", "url": "https://exame.com/ciencia/mounjaro-ou-anorexia-medicos-alertam-que-canetas-podem-mascarar-transtornos-alimentares-graves/", "fonte_id": "exame", "data_pub": "2026-10-24T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Médicos alertam que a perda rápida de peso, tontura e redução extrema do apetite podem ser confundidos com efeitos das canetas emagrecedoras, o que dificulta o diagnóstico de transtornos alimentares graves.", "titulo_pt": "Mounjaro ou anorexia? Médicos alertam sobre confusão com transtornos alimentares", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 223065, "titulo": "Overseas Filipinos feel heartache over missing parcels for loved ones, demand answers", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3371982/overseas-filipinos-feel-heartache-over-missing-parcels-loved-ones-demand-answers", "fonte_id": "scmp", "data_pub": "2026-10-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fatima Ramos, uma filipina que trabalha como doméstica no Abu Dhabi, está buscando explicações sobre as caixas de presentes que enviou para o país no ano anterior. Normalmente, essas caixas, conhecidas como balikbayan boxes, são preenchidas com presentes, roupas, alimentos e itens domésticos para serem enviados a familiares durante o Natal.", "titulo_pt": "Filipinos no exterior sentem saudade de pacotes perdidos para parentes, pedem respostas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 223071, "titulo": "Pet custody disputes draw increasing attention in China, where pets are treated as property", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3371992/pet-custody-disputes-draw-increasing-attention-china-where-pets-are-treated-property", "fonte_id": "scmp", "data_pub": "2026-10-24T02:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No China, a população de cães e gatos urbanos atingiu 126 milhões em 2025, majoritariamente composta por geração Z e millennials. Com a crescente adoção de animais de estimação, os casais jovens tratam seus pets como filhos e as disputas sobre a guarda dos animais estão se tornando áreas legais incertas quando os relacionamentos românticos terminam.", "titulo_pt": "Conflitos sobre guarda de animais de estimação ganham destaque na China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 222510, "titulo": "Bolsa Família precisa do 'Oportunidade Família'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/laura-machado/2026/10/bolsa-familia-precisa-do-oportunidade-familia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A obtenção de emprego por famílias beneficiárias do Bolsa Família pode causar preocupação, pois a perda de parte da transferência de renda pode gerar incerteza sobre a segurança financeira a longo prazo. O 'Oportunidade Família' sugere uma alternativa para auxiliar na transição para o trabalho.", "titulo_pt": "Bolsa Família precisa do 'Oportunidade Família'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222566, "titulo": "Crise de falta de oxigênio em Manaus volta no debate entre Lula e Flávio", "url": "https://veja.abril.com.br/politica/crise-de-falta-de-oxigenio-em-manaus-volta-no-debate-entre-lula-e-flavio/", "fonte_id": "veja", "data_pub": "2026-10-24T01:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à presidência, Luiz Inácio Lula da Silva e Flávio Bolsonaro, se enfrentam em um debate na sexta-feira, 23, que será o último antes do segundo turno das eleições. O tema da crise de falta de oxigênio em Manaus volta a ser discutido durante o encontro.", "titulo_pt": "Crise de falta de oxigênio em Manaus volta a ser tema do debate entre Lula e Flávio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 222635, "titulo": "Cuba anuncia medidas sociais em meio à crise econômica e à crescente desigualdade", "url": "https://www.brasildefato.com.br/2026/10/23/cuba-anuncia-medidas-sociais-em-meio-a-crise-economica-e-a-crescente-desigualdade/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-24T00:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cuba anunciou medidas sociais para grupos vulneráveis, incluindo ferramentas de trabalho e auxílio financeiro, em meio à crise econômica e crescente desigualdade no país.", "titulo_pt": "Cuba anuncia medidas sociais durante crise econômica e desigualdade", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 221653, "titulo": "Military Police officer under probe over alleged abuse", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/24/2003866534", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": a Sanitária realizou uma inspeção nas unidades neonatal e pediátrica de um hospital em São Paulo, onde 36 bebês faleceram. A polícia está investigando o caso.", "titulo_pt": "Vigilância Sanitária faz inspeção em hospital de SP onde 36 bebês morreram", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222345, "titulo": "Asia’s baby-starved governments want people to date, but who has time?", "url": "https://www.scmp.com/opinion/asia-opinion/article/3371633/asias-baby-starved-governments-want-people-date-who-has-time", "fonte_id": "scmp", "data_pub": "2026-10-23T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, a comunidade do Reddit de Singapura reagiu ao novo aplicativo de relacionamento do governo chamado FirstDate. O autor do relato tentou se cadastrar no aplicativo, mas foi informado que só era permitido usar endereços de email institucionais.", "titulo_pt": "As governanças asiáticas que desejam estimular o namoro têm dificuldades para atrair usuários", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 221975, "titulo": "Prefeito é acusado de assédio eleitoral por exigir apoio a Xaropinho", "url": "https://www.metropoles.com/colunas/demetrio-vecchioli/prefeito-e-acusado-de-assedio-eleitoral-por-exigir-apoio-a-xaropinho", "fonte_id": "metropoles", "data_pub": "2026-10-23T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Cotia, Wellington Formiga, teria pressionado comissionados a apoiarem Xaropinho em sua campanha para deputado federal. Essa ação teria sido considerada como assédio eleitoral.", "titulo_pt": "Prefeito é acusado de assédio eleitoral por pressionar comissionados a apoiarem candidato", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 222727, "titulo": "Canadá produce soja cerca del Ártico, gracias al cambio climático", "url": "https://www.clarin.com/rural/canada-produce-soja-cerca-artico-gracias-cambio-climatico_0_r0W2rRO1jY.html", "fonte_id": "clarin", "data_pub": "2026-10-24T09:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A produção de soja no Canadá próxima ao Ártico aumentou devido ao aquecimento global. O impacto econômico do aquecimento atmosférico na agricultura mundial tem aspectos positivos.", "titulo_pt": "Canadá cultiva soja perto do Ártico graças ao aquecimento global", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 222775, "titulo": "El Niño no da tregua: de las lluvias atípicas al calor extremo", "url": "https://www.latercera.com/nacional/noticia/el-nino-no-da-tregua-de-las-lluvias-atipicas-al-calor-extremo/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As precipitações de outubro causaram danos a centenas de residências e provocaram deslizamentos de terra, marcando uma primavera excepcionalmente chuvosa. Em um curto período, temperaturas elevadas e ondas de calor podem antecipar outros riscos para o verão.", "titulo_pt": "O Niño não dá trégua: das chuvas atípicas ao calor extremo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223051, "titulo": "Thousands evacuated and flights grounded as Typhoon Champi hits eastern China", "url": "https://www.scmp.com/news/china/politics/article/3372015/thousands-evacuated-and-flights-grounded-typhoon-champi-hits-eastern-china", "fonte_id": "scmp", "data_pub": "2026-10-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Champi atingiu a costa leste da China, fazendo centenas de voos serem cancelados e levando autoridades a reloajar mais de 100 mil pessoas. O furacão está enfraquecendo à medida que se dirige para o Japão.", "titulo_pt": "Milhares evacuados e voos cancelados com o furacão Champi atingindo a costa leste da China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 222750, "titulo": "Inti Bonomo, experto en Ciencias Ambientales, sobre el avance del fenómeno del Súper Niño: “Va a seguir creciendo y el pico va a ser en diciembre”", "url": "https://www.lanacion.com.ar/sociedad/inti-bonomo-experto-en-ciencias-ambientales-sobre-el-avance-del-fenomeno-del-super-nino-va-a-seguir-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, especialista em Ciências Ambientais, prevê que o fenômeno do Súper Niño continuará crescendo e atingirá seu pico em dezembro. As condições de nubosidade persistente e temperaturas mais frescas de outubro serão prolongadas nos primeiros meses de 2027.", "titulo_pt": "Inti Bonomo, especialista em ciências ambientais, sobre o avanço do fenômeno do Súper Niño: 'vai seguir crescendo e o pico será em dezembro'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222992, "titulo": "COP17 puts Armenia’s environmental record in the spotlight", "url": "https://www.aljazeera.com/opinions/2026/10/24/cop17-puts-armenias-environmental-record-in-the-spotlight?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-24T06:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Yerevan sediou a COP17, uma conferência global sobre biodiversidade. As preocupações relacionadas à mineração e proteção ambiental merecem ser examinadas durante o evento.", "titulo_pt": "COP17 coloca o registro ambiental da armênia sob a lupa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 222753, "titulo": "Alerta en Neuquén: las intensas lluvias reactivaron cañadones secos y causaron estragos: Vaca Muerta, la zona más afectada", "url": "https://www.lanacion.com.ar/sociedad/alerta-en-neuquen-las-intensas-lluvias-reactivaron-canadones-secos-y-generaron-estragos-vaca-muerta-nid23102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T06:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Intensas chuvas reativaram cañadones secos na província de Neuquén, causando danos em estradas e desalojando famílias. A região de Vaca Muerta foi a mais afetada, com a crecida da estrada 5 arrastando materiais e veículos.", "titulo_pt": "Alerta em Neuquén: intensas chuvas reativaram cañadones secos e causaram estragos, com vaca Muerta sendo a região mais afetada", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222048, "titulo": "Carta Santarém: mineração responsável e transparência de dados na Amazônia", "url": "https://www.cnnbrasil.com.br/infra/carta-santarem-mineracao-responsavel-e-transparencia-de-dados-na-amazonia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anderson Baranov destaca a necessidade de transparência, rigor técnico e compromisso com a sustentabilidade na mineração contemporânea na Amazônia.", "titulo_pt": "Carta Santarém: mineração responsável e transparência na Amazônia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222051, "titulo": "Distribuidoras de energia reforçam plano para eleições por risco climático", "url": "https://www.cnnbrasil.com.br/infra/distribuidoras-de-energia-reforcam-plano-para-eleicoes-por-risco-climatico/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As distribuidoras de energia estão intensificando seus planos para as eleições devido a uma previsão de frente fria e ciclone extratropical que podem afetar o fornecimento de energia nas áreas votantes.", "titulo_pt": "Distribuidoras de energia reforçam plano para eleições por risco climático", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222720, "titulo": "Calor do verão europeu de 2026 foi o mais mortal da história", "url": "https://www.dw.com/pt-br/calor-do-verão-europeu-de-2026-foi-o-mais-mortal-da-história/a-79747501?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-23T20:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 mil pessoas morreram na Europa devido às temperaturas recordes em 2026. O mês de junho desse ano foi especialmente mortal, especialmente para idosos.", "titulo_pt": "Calor do verão europeu de 2026 foi o mais mortal da história", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 221114, "titulo": "Onda de calor brutal matou mais de 50 mil pessoas na Europa, indica análise", "url": "https://www.cnnbrasil.com.br/internacional/onda-de-calor-brutal-matou-mais-de-50-mil-pessoas-na-europa-indica-analise/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma análise indicou que o verão de 2026 foi provavelmente o mais perigosamente quente na Europa até hoje. Onda de calor brutal matou mais de 50 mil pessoas no continente.", "titulo_pt": "Onda de calor brutal matou mais de 50 mil pessoas na Europa, indica análise", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221251, "titulo": "Cómo los eventos climáticos extremos amenazan la seguridad alimentaria en Chile", "url": "https://www.latercera.com/sustentabilidad/noticia/como-los-eventos-climaticos-extremos-amenazan-la-seguridad-alimentaria-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em um contexto de Dia Internacional contra o Mudança Climática, Cheaf alerta sobre os efeitos dos eventos climáticos extremos na agricultura e na segurança alimentar. Um novo relatório da ONU prevê um aquecimento global superior a 2°C neste século.", "titulo_pt": "Como os eventos climáticos extremos ameaçam a segurança alimentar no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 221034, "titulo": "Bactérias estão se alimentando de combustível vazado de navios da 2ª Guerra", "url": "https://www.metropoles.com/ciencia/bacterias-estao-se-alimentando-de-combustivel-vazado-de-navios-da-2a-guerra", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bactérias estão se alimentando de combustível vazado de navios naufragados na Micronésia durante a 2ª Guerra Mundial. Os navios naufragaram em 1944 devido a ataques aéreos norte-americanos.", "titulo_pt": "Bactérias se alimentam de combustível de navios da 2ª Guerra em naufrágios da micronésia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221005, "titulo": "Cinco países suspendem compras de frango brasileiro após confirmação de doença em SC", "url": "https://veja.abril.com.br/economia/cinco-paises-suspendem-compras-de-frango-brasileiro-apos-confirmacao-de-doenca-em-sc/", "fonte_id": "veja", "data_pub": "2026-10-23T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco países, incluindo Arábia Saudita, Malásia, China, Chile e México, suspenderam as compras de frango brasileiro após a confirmação de uma doença em Santa Catarina.", "titulo_pt": "Cinco países suspendem importações de frango brasileiro após confirmação de doença em SC", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221772, "titulo": "Chart: A record two-thirds of car sales in China are now electric vehicles", "url": "https://www.carbonbrief.org/chart-a-record-two-thirds-of-car-sales-in-china-are-now-electric-vehicles", "fonte_id": "carbon_brief", "data_pub": "2026-10-23T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, as vendas de veículos elétricos e híbridos novos atingiram 67% do total de vendas de carros em China, um recorde.", "titulo_pt": "Gráfico: dois terços dos carros vendidos na China agora são veículos elétricos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 221525, "titulo": "Storm Austen batters France and UK with cion.com.ar/seguridad/detuvieron-en-esquel-a-un-bioquimico-que-tenia-en-cautiverio-dentro-de-la-casa-a-su-esposa-y-sus-nid23102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-23T21:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O juiz determinou a prisão preventiva do bioquímico Miguel Edgardo Battista, de 71 anos, acusado de privar ilegalmente sua esposa e filhos da liberdade e de abandoná-los em casa.", "titulo_pt": "Bioquímico de 71 anos é detido em Esquel após ter esposa e filhos em cárcere privado em casa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222300, "titulo": "'Everybody is terrorised': El-Fasher population drops to just seven percent of last year's high, Amnesty says", "url": "https://www.middleeasteye.net/news/everybody-terrorised-el-fasher-population-drops-just-7-percent-last-years-high-amnesty-says", "fonte_id": "middle_east_eye", "data_pub": "2026-10-23T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população de El Fasher, na região de Darfur, diminuiu para apenas 7% do número registrado no ano anterior, de acordo com a Amnesty International. A organização relatou que mortes, torturas e desaparições são comuns desde que as Forças de Suporte Rápidas, apoiadas pelos Emirados Árabes Unidos, tomaram o controle da cidade há um ano.", "titulo_pt": "Todo mundo está assustado: população de el fasher cai para apenas 7% do ano passado, diz Amnesty", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 221918, "titulo": "Argentina identifica restos mortais de oito desaparecidos da ditadura", "url": "https://www.cartacapital.com.br/mundo/argentina-identifica-restos-mortais-de-oito-desaparecidos-da-ditadura/", "fonte_id": "cartacapital", "data_pub": "2026-10-23T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Equipe Argentina de Antropologia Forense identificou restos mortais de oito desaparecidos durante a ditadura. O tr 272, "fonte_id": "bbc_world", "titulo": "Freed US citizen was tortured in Russian jail, former Ukrainian prisoners say", "url": "https://www.bbc.co.uk/news/articles/cx7vpmn6qzmlo?at_medium=RSS&at_campaign=rss", "data_pub": "2026-10-23T20:18:00Z", "topico": "politica_internacional", "idioma": "en", "titulo_pt": "Ex-cidadão americano foi torturado na prisão russa, dizem ex-prisioneiros ucranianos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 222294, "fonte_id": "financial_times", "titulo": "Trump moves to block certification of Alaska Senate election if Republican loses", "url": "https://www.ft.com/content/b68b8544-4ce9-45d4-b522-cd2f8150e4cc?syn-25a6b1a6=1", "data_pub": "2026-10-23T20:16:00Z", "topico": "politica_internacional", "idioma": "en", "titulo_pt": "Trump planeja bloquear certificação da eleição no senado de Alaska se republicano perder", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 221904, "fonte_id": "folha_ilustrada", "titulo": "Em quem Marília Mendonça votaria?", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/gustavo-alonso/2026/10/em-quem-marilia-mendonca-votaria.shtml", "data_pub": "2026-10-23T20:15:00Z", "topico": "cultura", "idioma": "pt", "titulo_pt": "Em quem Marília Mendonça votaria?", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "destaque": {"titulo_evento": "Debate Lula x Flávio Bolsonaro: tensões e propostas", "texto_pt": "O último debate entre Lula e Flávio Bolsonaro antes do segundo turno das eleições presidenciais de 2026 foi marcado por tensões e acusações recíprocas. Os candidatos discutiram temas como dívidas dos brasileiros, salário mínimo, SUS, endividamento e ensino integral, mas a troca de ofensas sobre corrupção e militância política também foi notável. Ainda assim, ambas as propostas foram apresentadas, com Lula enfatizando a necessidade de combater a corrupção e Flávio Bolsonaro reafirmando seu compromisso com a segurança pública. As pesquisas indicam um empate técnico entre os dois candidatos, com Lula liderando com 45,16% dos votos válidos e Flávio Bolsonaro com 47,03% no primeiro turno. O desempenho do debate pode influenciar significativamente a percepção do eleitorado sobre os candidatos, potencialmente alterando as intenções de voto. Em termos políticos, o desempenho dos candidatos no segundo turno será crucial para definir o futuro governo do Brasil, com implicações significativas para a economia, a segurança pública e a política interna. Em termos humanitários, o resultado das eleições pode afetar políticas sociais e econômicas que beneficiam milhões de brasileiros. Em termos científicos, a abordagem dos candidatos a questões ambientais e de tecnologia também merece atenção, pois podem influenciar a política pública no país.", "data_edicao": "2026-10-24", "artigos": [{"id": 222977, "titulo": "Brazil’s Lula and Bolsonaro debate policy proposals before run-off", "url": "https://www.aljazeera.com/news/2026/10/24/brazils-lula-and-bolsonaro-debate-policy-proposals-before-run-off?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-24T09:41:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "As pesquisas indicam que os candidatos à presidência do Brasil, Lula e Bolsonaro, estão empatados antes do segundo turno, marcado para domingo.", "titulo_pt": "Lula e Bolsonaro debatem propostas para segundo turno", "texto_pt": "As pesquisas indicam que os candidatos à presidência do Brasil, Lula e Bolsonaro, estão empatados antes do segundo turno, marcado para domingo.", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 222597, "titulo": "Eleições 2026: veja as agendas de Flávio e Lula neste sábado (24/10)", "url": "https://www.metropoles.com/brasil/eleicoes-2026-veja-as-agendas-de-flavio-e-lula-neste-sabado-24-10", "fonte_id": "metropoles", "data_pub": "2026-10-24T07:00:00Z", "topico": "politica_interna function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
