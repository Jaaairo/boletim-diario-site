_pt": "CEO da nvidia envolvido em caso de relacionamento com suposta espiã chinesa será investigado pela empresa", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 253727, "titulo": "Supreme Court says border wall construction can continue in west Texas", "url": "https://www.npr.org/2026/11/09/nx-s1-6019424/border-wall-big-bend-texas-trump", "fonte_id": "npr_news", "data_pub": "2026-11-09T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração Trump solicitou emergencialmente ao Supremo Tribunal Federal que permitisse a continuidade da construção da muralha na fronteira no Texas Ocidental, enquanto uma ação judicial sobre o projeto prossegue.", "titulo_pt": "Supremo autoriza continuidade da construção da muralha na fronteira no Texas ocidental", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 253768, "titulo": "What to expect as Russia, Ukraine and the US hold trilateral talks in Abu Dhabi", "url": "https://www.france24.com/en/europe/20261109-what-to-expect-as-russia-ukraine-and-us-hold-trilateral-talks-in-abu-dhabi", "fonte_id": "france24", "data_pub": "2026-11-09T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociadores da Ucrânia, Rússia e Estados Unidos se encontrarão em Abu Dhabí, capital dos Emirados Árabes Unidos, para novas negociações com o objetivo de encerrar quase cinco anos de guerra em larga escala iniciada pela invasão russa da vizinha. As garantias de segurança para as partes em conflito serão os principais itens na pauta.", "titulo_pt": "O que esperar das negociações tripartidas entre Rússia, Ucrânia e EUA em Abu dhabí", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 253412, "titulo": "Presidente do Paraguai pede que ministros renunciem", "url": "https://www.poder360.com.br/poder-internacional/presidente-do-paraguai-pede-que-ministros-renunciem/", "fonte_id": "poder360", "data_pub": "2026-11-09T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Paraguai, Pedro Alliana, solicitou que ministros e outros funcionários em cargos de confiança renunciassem. Ele também nomeou três novos membros para o governo.", "titulo_pt": "Presidente do Paraguai pede renúncia de ministros e funcionários", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 253857, "titulo": "(LEAD) N. Korea's nuclear power recognition demand could hinder prospects for Trump-Kim summit: ex-U.S. official", "url": "https://en.yna.co.kr/view/AEN20261110000551315", "fonte_id": "yonhap_news", "data_pub": "2026-11-09T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-funcionário dos Estados Unidos afirma que a exigência do Norte Coreão de ser reconhecido como uma potência nuclear pode dificultar as perspectivas para o encontro entre Trump e Kim. O evento ocorreu em Washington em 9 de novembro, conforme informado pela Yonhap News.", "titulo_pt": "Reconhecimento nuclear do norte coreão pode atrapalhar encontro Trump-Kim: ex-funcionário dos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 253763, "titulo": "Republican congressman to force impeachment vote on Defence Secretary Hegseth", "url": "https://www.bbc.co.uk/news/articles/cwr5y58jjp8ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-09T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O congressista republicano Thomas Massie planeja forçar um voto de impeachment contra o Secretário de Defesa Christopher Hegseth, embora essa ação provavelmente falhe. Massie deseja pressionar o presidente Trump a demitir Hegseth antes que os democratas possam iniciar seu próprio processo de impeachment.", "titulo_pt": "Congressista republicano planeja forçar voto de impeachment contra secretário de defesa", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 253385, "titulo": "Lula indica chefe de cerimonial do Planalto para cargo de embaixador do Brasil na Itália", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/lula-indica-chefe-de-cerimonial-do-planalto-para-cargo-de-embaixador-do-brasil-na-italia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) indicou Fernando Luis Lemos Igreja, chefe do cerimonial do Planalto, para ser embaixador do Brasil na Itália. A indicação foi comunicada ao Senado nesta segunda-feira (9).", "titulo_pt": "Lula indica chefe de cerimonial do Planalto para embaixador na Itália", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 253765, "titulo": "Judge denies motion to dismiss Lindsay Clancy's murder case", "url": "https://www.bbc.co.uk/news/articles/ck1l3le7q29vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-09T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O juiz negou o pedido para descartar o caso de assassinato de Lindsay Clancy, permitindo que os procuradores continuem com o processo. Isso pode levar a uma redução de acusações em um possível segundo julgamento ou até mesmo ao seu descarte.", "titulo_pt": "Juiz nega pedido para descartar caso de assassinato de Lindsay Clancy", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 253521, "titulo": "Após derrota nas Midterms, aprovação de Trump é de 32%, diz Reuters/Ipsos", "url": "https://www.cnnbrasil.com.br/internacional/apos-derrota-nas-midterms-aprovacao-de-trump-e-de-32-diz-reuters-ipsos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aprovação de Donald Trump caiu para 32% após sua derrota nas eleições médias (Midterms), segundo uma pesquisa da Reuters/Ipsos. O presidente manteve-se próximo ao nível mais baixo de sua carreira política.", "titulo_pt": "Aprovação de Trump após derrota nas Midterms é de 32%, diz pesquisa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253526, "titulo": "Petróleo cai mais de 5% após proposta de enriquecimento de urânio no Irã", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/petroleo-cai-mais-de-5-apos-proposta-de-enriquecimento-de-uranio-no-ira/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo caiu, com o Brent para janeiro caindo 5,85% para US$ 92,57 o barril e o WTI para dezembro caindo 4,38% para US$ 86,85 o barril. Essa queda ocorreu após a proposta de enriquecimento de urânio no Irã.", "titulo_pt": "Petróleo cai mais de 5% após proposta de enriquecimento de urânio no Irã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253800, "titulo": "COP31 opens amid energy crisis as activists demand climate action", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/9/cop31-opens-amid-energy-crisis-as-activists-demand-climate-action?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31 começou em Turquia durante uma crise energética causada por guerras e com uma nova dependência de combustíveis fósseis.", "titulo_pt": "COP31 abre em meio a crise energética e dependência de combustíveis fósseis", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 253528, "titulo": "Suprema Corte dos EUA autoriza obras para muro de Trump em parque nacional", "url": "https://www.cnnbrasil.com.br/internacional/suprema-corte-dos-eua-autoriza-obras-para-muro-de-trump-em-parque-nacional/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos autorizou a construção de um muro como parte de um controverso plano de controle anti-imigração no Parque Nacional Big Bend, localizado na fronteira do Texas com o México.", "titulo_pt": "Suprema Corte dos EUA autoriza construção de muro de Trump em parque nacional", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 253083, "titulo": "TIER forecasts GDP to grow 12.34% this year", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/10/2003867460", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TIER prevê que o PIB da Taiwan cresça 12,34% neste ano. Não há detalhes adicionais sobre as razões ou consequências da previsão.", "titulo_pt": "TIER projeta crescimento do pib de taiwan em 12,34% este ano", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253084, "titulo": "Exports expand 58.9% to record US$96.76 billion", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/10/2003867461", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações expandiram 58,9% e atingiram um recorde de US$96,76 bilhões.", "titulo_pt": "Exportações expandem 58,9% e alcançam novo recorde de US$96,76 bilhões", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253085, "titulo": "Firms to face cumulative fines for wage breaches", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/10/2003867462", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas enfrentarão multas acumulativas por infrações salariais.", "titulo_pt": "Empresas enfrentarão multas cumulativas por infrações salariais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253444, "titulo": "Preço da comida varia até 162% dependendo do supermercado em BH", "url": "https://www.metropoles.com/minas-gerais/preco-da-comida-varia-ate-162-dependendo-do-supermercado-em-bh", "fonte_id": "metropoles", "data_pub": "2026-11-09T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A variação de preços de alimentos em Belo Horizonte pode chegar a 162%, dependendo do supermercado. Produtos como ovos, fubá e algumas marcas de café tiveram redução de preço, enquanto outros ficaram mais caros.", "titulo_pt": "Preço da comida varia até 162% dependendo do supermercado em belo horizonte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 253555, "titulo": "“Petrobras tenta impedir a ANP de atuar”. O desabafo de um diretor da agência", "url": "https://braziljournal.com/petrobras-tenta-impedir-a-anp-de-atuar-o-desabafo-de-um-diretor-da-agencia", "fonte_id": "brazil_journal", "data_pub": "2026-11-09T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante uma reunião da diretoria da ANP, Pietro Mendes, um dos diretores da agência, fez um desabafo sobre as tentativas da Petrobras de interferir na agenda regulatória do setor de gás.", "titulo_pt": "Petrobras tenta impedir a ANP de atuar, diz diretor", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 253508, "titulo": "JBS tem lucro 72% menor no 3T, a US$ 164 mi, mas vê melhora em carne bovina nos EUA", "url": "https://www.infomoney.com.br/mercados/jbs-jbss32-resultados-terceiro-trimestre-2026/", "fonte_id": "infomoney", "data_pub": "2026-11-09T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lucro antes de juros, impostos, depreciação e amortização (Ebitda) ajustado da JBS caiu 35,6% no terceiro trimestre, somando US$ 1,181 bilhão. A empresa, no entanto, observa melhorias na carne bovina nos Estados Unidos.", "titulo_pt": "JBS registra lucro 72% menor no 3º trimestre, a US$ 164 milhões, mas vê melhora na carne bovina nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 253580, "titulo": "Anvisa proíbe emagrecedor UltraShape e fitoterápicos sem registro", "url": "https://www.jota.info/saude/anvisa-proibe-emagrecedor-ultrashape-e-fitoterapicos-sem-registro", "fonte_id": "jota", "data_pub": "2026-11-09T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa proibiu o emagrecedor UltraShape e exigiu o recolhimento de lotes de fitoterápicos sem registro. A agência também solicitou a retirada de medicamentos com problemas de qualidade.", "titulo_pt": "Anvisa proíbe emagrecedor UltraShape e fitoterápicos sem registro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 253352, "titulo": "Após quase quebrar no pós-pandemia, startup troca telemedicina por IA e se reinventa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/apos-quase-quebrar-no-pos-pandemia-startup-troca-telemedicina-por-ia-e-se-reinventa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vibe Saúde, que levantou R$ 50 milhões em 2020, teve seu negócio enfraquecido no pós-pandemia e quase quebrou. Após uma repaginação, a empresa aumentou sua base de clientes de 7 mil para cerca de 90 mil.", "titulo_pt": "Depois de quase falir no pós-pandemia, startup troca telemedicina por IA e se reinventa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 253353, "titulo": "ANP suspende revisão tarifária de dutos e expõe embate com Petrobras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/anp-suspende-revisao-tarifaria-de-dutos-e-expoe-embate-com-petrobras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ANP suspendeu o processo de revisão das tarifas dos gasodutos brasileiros após ameaças de judicialização e corte de investimentos da Petrobras. A decisão foi tomada nesta segunda-feira (9).", "titulo_pt": "ANP suspende revisão tarifária de gasodutos e expõe embate com Petrobras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 253520, "titulo": "JBS compra Flora por US$ 542 milhões e amplia uso de coprodutos bovinos", "url": "https://www.cnnbrasil.com.br/agro/jbs-compra-flora-por-us-542-milhoes-e-amplia-uso-de-coprodutos-bovinos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A JBS adquiriu a Flora por 542 milhões de dólares, entrando no mercado de beleza e cuidados pessoais. A aquisição reforça a estratégia da empresa de diversificar seus negócios além da produção de proteínas.", "titulo_pt": "JBS compra Flora por 542 milhões e expande uso de coprodutos bovinos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253523, "titulo": "Bitcoin opera em queda pressionado por saídas em ETFs", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bitcoin-opera-em-queda-pressionado-por-saidas-em-etfs/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin operava em queda, recuando 1,27% para US$ 74.910,01, enquanto o Ethereum caía 4,50% para US$ 2.128,21, de acordo com dados da Coinbase. Essas perdas são atribuídas às saídas em ETFs (Fundos de Investimento em Títulos de Mercado).", "titulo_pt": "Bitcoin opera em baixa pressionado por saídas em ETFs", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253354, "titulo": "Paraguai pede ajuda dos EUA, Luxemburgo e da Argentina para rastrear os recursos desviados do Ueno Bank", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/paraguai-pede-ajuda-dos-eua-luxemburgo-e-da-argentina-para-rastrear-os-recursos-desviados-do-ueno-bank.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central do Paraguai estendeu a devolução de depósitos do Ueno Bank e o Ministério Público buscou ajuda dos Estados Unidos, Luxemburgo e Argentina para rastrear possíveis recursos desviados no escândalo que levou à destituição do presidente Santiago Peña.", "titulo_pt": "Paraguai pede ajuda internacional para rastrear recursos desviados do Ueno Bank", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 253532, "titulo": "Log registra lucro líquido de R$ 121,6 milhões no 3º trimestre", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/log-registra-lucro-liquido-de-r-1216-milhoes-no-3o-trimestre/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Log registrou um lucro líquido de R$ 121,6 milhões no terceiro trimestre. A receita líquida foi de R$ 57,7 milhões e o Ebitda atingiu R$ 179,1 milhões, com uma absorção bruta recorde de 494,6 mil m² no período.", "titulo_pt": "Log registra lucro líquido de R$ 121,6 milhões no 3º trimestre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253355, "titulo": "Você pode investir em ETFs e continuar sendo um investidor ativo?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/voce-pode-investir-em-etfs-e-continuar-sendo-um-investidor-ativo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois investidores que decidiram investir em ETFs passivos obtiveram resultados diferentes ao final de alguns anos, com um acumulando ganhos expressivos e o outro enfrentando perdas consideráveis. Isso ocorreu apesar de ambos terem escolhido uma abordagem passiva de investimento.", "titulo_pt": "Você pode investir em ETFs e continuar sendo um investidor ativo?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 253581, "titulo": "Abrint aciona STF contra lei do MT que exige gráficos de velocidade de internet na fatura", "url": "https://www.jota.info/stf/do-supremo/abrint-aciona-stf-contra-lei-do-mt-que-exige-graficos-de-velocidade-de-internet-na-fatura", "fonte_id": "jota", "data_pub": "2026-11-09T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Abrint (Associação Brasileira das Empresas de Telecomunicações e de Informática) acionou o STF (Supremo Tribunal Federal) contra uma lei do Mato Grosso que exige gráficos de velocidade de internet na fatura. A associação pede uma liminar para suspender a norma que prevê multas de até R$ 4 milhões para provedores de internet.", "titulo_pt": "Abrint aciona STF contra lei do MT que exige gráficos de velocidade na fatura", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 253356, "titulo": "Petróleo cai mais de 5% após Trump dizer que novos ataques ao Irã são improváveis", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/petroleo-cai-mais-de-5-apos-trump-dizer-que-novos-ataques-ao-ira-sao-improvaveis.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo caíram mais de 5% após Donald Trump afirmar que novos ataques americanos contra o Irã são improváveis. O preço do barril chegou a US$ 92,78.", "titulo_pt": "Petróleo cai mais de 5% após Trump dizer que novos ataques ao Irã são improváveis", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 253082, "titulo": "Nvidia shares slide amid spy claims", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/10/2003867459", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Nvidia caíram devido a acusações de espionagem.", "titulo_pt": "Ações da nvidia caem em meio a acusações de espionagem", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253102, "titulo": "Huang’s gaffe unlikely to derail AI: sources", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/10/2003867445", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Informações indicam que um erro cometido por Huang não deve atrapalhar os planos de AI. Fontes não foram citadas explicitamente, mas a probabilidade de impacto negativo é considerada baixa.", "titulo_pt": "Gafe de huang não deve impedir avanços de AI, dizem fontes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253103, "titulo": "Qisda’s Q3 profit halved as staple tech sales decline", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/10/2003867446", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As receitas líquidas do trimestre de outono de 2023 da Qisda caíram pela metade em comparação com o mesmo período do ano anterior, devido a uma diminuição nas vendas de componentes de tecnologia básica.", "titulo_pt": "Lucro trimestral da qisda cai pela metade devido à queda nas vendas de componentes de tecnologia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253105, "titulo": "Msscorps profits surging with help from AI demand", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/10/2003867448", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As receitas da Msscorps estão aumentando rapidamente, graças à crescente demanda por tecnologia artificial inteligente (AI).", "titulo_pt": "Lucros da msscorps disparando graças à demanda por AI", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253755, "titulo": "What we know about the mystery woman at the center of Nvidia's spy scandal", "url": "https://www.axios.com/2026/11/09/alice-huang-nvidia-jensen-megaspeed", "fonte_id": "axios", "data_pub": "2026-11-09T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Huang, uma ex-executiva de uma empresa de computação de inteligência artificial baseada em Singapura, está no centro de uma suspeita de escândalo de espionagem chinesa após o CEO da Nvidia, Jensen Huang, reconhecer um caso extraconjugal. A investigação levanta questões sobre possíveis esforços de inteligência chinesa para acessar a tecnologia e o CEO da Nvidia através de Alice Huang, no contexto da corrida pelo domínio da inteligência artificial entre os Estados Unidos e China.", "titulo_pt": "O que sabemos sobre a mulher misteriosa no centro do escândalo de espionagem da Nvidia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 253512, "titulo": "Saúde e Einstein desenvolvem IA para identificar doenças de pele no SUS", "url": "https://www.cnnbrasil.com.br/saude/saude-e-einstein-desenvolvem-ia-para-identificar-doencas-de-pele-no-sus/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Saúde e o Instituto Einstein desenvolveram uma ferramenta de inteligência artificial chamada CUTIS-AI para auxiliar na identificação de doenças de pele no Sistema Único de Saúde (SUS). O programa encontra-se em fase de estudo, mas os resultados podem ser utilizados para solicitar a regularização junto à Anvisa.", "titulo_pt": "Saúde e Einstein desenvolvem IA para identificar doenças de pele no SUS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253429, "titulo": "Você já está usando a IA no seu planejamento financeiro?", "url": "https://veja.abril.com.br/coluna/o-seu-o-meu-o-nosso/voce-ja-esta-usando-a-ia-no-seu-planejamento-financeiro/", "fonte_id": "veja", "data_pub": "2026-11-09T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tecnologia pode aumentar o conhecimento, mas não deve substituir a prudência, pois o futuro não pode ser previsto ou controlado.", "titulo_pt": "Você já está usando a IA no seu planejamento financeiro?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253874, "titulo": "The global pledge to use AI for climate good is a cruel joke", "url": "https://www.theverge.com/science/1030252/ai-data-center-climate-pledge-united-nations-cop31", "fonte_id": "the_verge", "data_pub": "2026-11-09T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A iniciativa global de usar IA para o bem do meio ambiente é vista com desconfiança por muitos, comparada a beber cerveja não-alcoólica. O autor está disposto a dar uma chance, embora inicialmente cético sobre os benefícios reais.", "titulo_pt": "A promessa global de usar IA para o bem do meio ambiente é uma piada cruel", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 253865, "titulo": "Fervo now has $12B in orders for its geothermal power tech", "url": "https://techcrunch.com/2026/11/09/fervo-now-has-12b-in-orders-for-its-geothermal-power-tech/", "fonte_id": "techcrunch", "data_pub": "2026-11-09T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de geotermal Fervo está com pedidos de $12 bilhões para sua tecnologia de energia geotermal, enquanto reduz os custos de perfuração em sua fonte de 8,4 GW em Utah. A empresa também está se voltando para o natural gas como parte de sua estratégia.", "titulo_pt": "Fervo agora possui pedidos de $12 bilhões para sua tecnologia de energia geotermal", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 253758, "titulo": "Nvidia has no obvious successor to Jensen Huang — and that's a problem", "url": "https://www.axios.com/2026/11/09/nvidia-jensen-huang-succession-plan", "fonte_id": "axios", "data_pub": "2026-11-09T20:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia está enfrentando críticas por não ter um plano claro de sucessão para substituir Jensen Huang em caso de eventos imprevistos, como um incidente internacional envolvendo ele. Isso expõe as vulnerabilidades de uma grande empresa depender de um único executivo, gerando riscos para investidores e clientes.", "titulo_pt": "Nvidia carece de sucessor claro para Jensen Huang — e isso é um problema", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 253866, "titulo": "Jensen Huang pulls out of ElevenLabs Summit amid Nvidia controversy", "url": "https://techcrunch.com/2026/11/09/jensen-huang-pulls-out-of-elevenlabs-summit-amid-nvidia-controversy/", "fonte_id": "techcrunch", "data_pub": "2026-11-09T20:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, cancelou sua participação em eventos da ElevenLabs e da Anthropic.", "titulo_pt": "Jensen Huang se retira de eventos da ElevenLabs e da anthropic", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 253860, "titulo": "Vulnerability that lets hackers SSH into Linux devices is under active exploitation", "url": "https://arstechnica.com/security/2026/11/vulnerability-that-lets-hackers-ssh-into-linux-devices-is-under-active-exploitation/", "fonte_id": "ars_technica", "data_pub": "2026-11-09T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vulnerabilidade que permite que hackers acessem dispositivos Linux via SSH está sendo explorada ativamente. 'sshole' representa uma séria ameaça à segurança da internet.", "titulo_pt": "Vulnerabilidade que permite hackers SSH em dispositivos Linux é explorada ativamente", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 253867, "titulo": "YouTube streaming data returns to Billboard charts, ending major disagreement", "url": "https://techcrunch.com/2026/11/09/youtube-streaming-data-returns-to-billboard-charts-ending-major-disagreement/", "fonte_id": "techcrunch", "data_pub": "2026-11-09T19:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "YouTube voltará a compartilhar dados de streaming com o Billboard a partir de 2027, após mudanças na fórmula do ranking que dão mais peso aos streams gratuitos e com anúncios.", "titulo_pt": "Youtube volta a compartilhar dados de streaming com o Billboard a partir de 2027", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 253859, "titulo": "The backlash about data centers might really just be about electricity", "url": "https://www.technologyreview.com/2026/11/09/1148194/the-backlash-about-data-centers-might-really-just-be-about-electricity/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-09T19:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo original apareceu na newsletter The Algorithm, focada em Inteligência Artificial. O autor estava em Ashburn, Virginia, uma região conhecida como Data Center Alley, o maior hub de data centers do mundo, durante as eleições nos Estados Unidos.", "titulo_pt": "O contraponto sobre centrais de dados pode realmente ser sobre energia elétrica", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 253364, "titulo": "Google lança novos chips de IA e amplia disputa com a Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/google-lanca-novos-chips-de-ia-e-amplia-disputa-com-a-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T19:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google lançou duas novas versões de seus chips de processamento tensorial internamente desenvolvidos, aumentando a concorrência com a Nvidia no mercado de chips de inteligência artificial que está em expansão.", "titulo_pt": "Google lança novos chips de IA e intensifica disputa com a Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 253796, "titulo": "Anthropic releases first frontier models since Amodei's call for slowdown as IPO buzz builds", "url": "https://www.cnbc.com/2026/11/09/anthropic-claude-fable-5-2-mythos-5-2.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-09T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic lançou seus primeiros modelos fronteiriços desde que Amodei chamou para um desaceleramento, enquanto a expectativa é de que a empresa esteja prestes a realizar uma IPO bem-sucedida. O lançamento ocorre em um momento em que a Anthropic se prepara para uma oferta inicial de ações esperada para ser um grande sucesso.", "titulo_pt": "Anthropic lança modelos fronteiriços após chamado de Amodei para desaceleração e em meio a expectativa de IPO", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 253885, "titulo": "New synthesis strategy controls handedness in large, light-emitting molecular spirals", "url": "https://phys.org/news/2026-11-synthesis-strategy-handedness-large-emitting.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Helicenos são moléculas orgânicas formadas por anéis de benzeno dispostos em forma de espiral e que apresentam luminiscência polarizada circularmente, com emissão de luz com polaridade esquerda ou direita. Esta classe de moléculas, incluindo os carbohelicenos, compostos exclusivamente de carbono e hidrogênio, têm potencial para serem utilizados em exibições tridimensionais e tinta antifalsificação.", "titulo_pt": "Nova estratégia de síntese controla a direitação em moléculas de espiral luminosa de grande porte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253886, "titulo": "Alternative approach could reduce reliance on potentially toxic surfactants in pharmaceutical and food applications", "url": "https://phys.org/news/2026-11-alternative-approach-reliance-potentially-toxic.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores liderado pela Universidade de Sydney desenvolveu um método para formar microemulsões sem surfactantes tradicionais, que são frequentemente tóxicos e difíceis de separar dos produtos finais. Essa descoberta tem implicações importantes para aplicações farmacêuticas e aditivos alimentares.", "titulo_pt": "Novo método pode reduzir dependência de surfactantes potencialmente tóxicos em aplicações farmacêuticas e alimentares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253887, "titulo": "The supernova impostor: Chandra finds likely source of giant star's repeated outbursts", "url": "https://phys.org/news/2026-11-supernova-impostor-chandra-source-giant.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos usaram o telescópio Chandra da NASA para descobrir a origem das repetidas erupções de uma estrela gigante e instável.", "titulo_pt": "A impostora da supernova: chandra identifica provável causa de erupções repetidas de uma grande estrela", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253888, "titulo": "Sewers could hold the key to detecting deadly fungal infections", "url": "https://phys.org/news/2026-11-sewers-key-deadly-fungal-infections.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada ano, infecções fúngicas causam cerca de 2,5 milhões de mortes globalmente, mais do que a tuberculose e a malária juntas. No entanto, a maioria das pessoas nunca ouviu falar das espécies de fungos responsáveis e poucos sistemas de saúde os acompanham de forma organizada.", "titulo_pt": "Saneamento poderia ser a chave para detectar infecções fúngicas letais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253889, "titulo": "First known 'disappearing planet' has a neighbor that makes it wobble like a top", "url": "https://phys.org/news/2026-11-planet-neighbor.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos liderados pela UCLA descobriram o primeiro planeta 'desaparecido' conhecido a cerca de 1.000 luzes anos de distância. O planeta, TOI-2535 b, é um 'gigante quente', uma gigante gasosa que orbita muito perto de sua estrela-sol em apenas 8,25 dias.", "titulo_pt": "Primeiro planeta 'desaparecido' conhecido tem vizinho que o faz oscilar como um top", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253890, "titulo": "Researchers develop AI tool to improve crisis communication", "url": "https://phys.org/news/2026-11-ai-tool-crisis-communication.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores desenvolveram uma ferramenta de inteligência artificial para melhorar a comunicação em crises, ajudando os gerentes de emergências a tomar decisões rápidas com base em dados confiáveis. Durante uma catástrofe, a quantidade considerável e variável de informações pode dificultar a distinção entre fatos e ruído.", "titulo_pt": "Pesquisadores desenvolvem ferramenta de IA para melhorar comunicação em crises", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253891, "titulo": "CheMeleon model adapts to predict molecular properties from scant data", "url": "https://phys.org/news/2026-11-chemeleon-molecular-properties-scant.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O modelo CheMeleon é utilizado para prever propriedades moleculares com base em dados limitados. A descoberta de novos compostos para usos específicos é uma das principais impulsionadoras do progresso em várias indústrias, incluindo farmacêutica, eletrônicos e energia, mas o processo ainda é majoritariamente experimental, pois não há uma maneira perfeita de prever como um determinado composto químico se comportará em termos das diversas propriedades e respostas que os materiais podem apresentar.", "titulo_pt": "Modelo chemeleon se adapta para prever propriedades moleculares com dados escassos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253892, "titulo": "New review maps a 'structure-to-physiology' roadmap for functional fruit packaging", "url": "https://phys.org/news/2026-11-physiology-roadmap-functional-fruit-packaging.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fruta recém-colhida permanece metabolicamente ativa, respira vigorosamente e é altamente sensível a etileno. Isso a torna altamente suscetível a softening, manchas avermelhadas, perda de água e decomposição. Atualmente, cerca de 25% de toda a fruta é perdida na cadeia de fornecimento pós-colheita devido à preservação, transporte ou armazenamento inadequados.", "titulo_pt": "Nova revisão traça um mapa 'estrutura-funcional' para embalagem de frutas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253951, "titulo": "Are the James Webb Space Telescope's mysterious Little Red Dots actually tiny black holes left over from the Big Bang era?", "url": "https://www.space.com/astronomy/black-holes/are-the-james-webb-space-telescopes-mysterious-little-red-dots-actually-tiny-black-holes-left-over-from-the-big-bang-era", "fonte_id": "space_com", "data_pub": "2026-11-09T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos sugerem que as 'Pontas Vermelhas', que têm intrigado astrônomos desde que o Telescópio Espacial James Webb as começou a descobrir, podem abrigar buracos negros primitivos nascidos durante a era do Big Bang.", "titulo_pt": "As pontas vermelhas do telescópio espacial James Webb: buracos negros primitivos da era do Big Bang?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 253893, "titulo": "3-million-year-old Taung Child once again shakes up our human family tree", "url": "https://phys.org/news/2026-11-million-year-taung-child-human.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente datou o fóssil do Criança de Taung entre 2,96 e 3,03 milhões de anos, reafirmando sua importância na compreensão das origens humanas. O estudo, liderado por Gabriele Macho, da Vrije Universiteit Brussel, indica que a árvore genealógica humana na África do Sul era mais complexa do que se pensava.", "titulo_pt": "Criança de Taung de 3 milhões de anos volta a desafiar nossa árvore genealógica humana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253894, "titulo": "Canines could help anthropological studies, answering questions about human evolution", "url": "https://phys.org/news/2026-11-canines-anthropological-human-evolution.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kyle Smith, um pesquisador pós-doutorado na Faculdade de Medicina Veterinária da NC State, argumenta em uma revisão recente que os cães domésticos ou familiares podem ser igualmente informativos para estudos antropológicos sobre a evolução humana, além dos primatas como chimpanzés ou golfinhos.", "titulo_pt": "Cães podem auxiliar estudos antropológicos sobre a evolução humana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253895, "titulo": "Not a 'night owl' yet: Extraordinary bird fossil from Messel Pit suggests species still hunted by day", "url": "https://phys.org/news/2026-11-night-owl-extraordinary-bird-fossil.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fóssil de um gavião excepcionalmente bem preservado, datado de cerca de 47 milhões de anos, da área de patrimônio mundial UNESCO Messel, sugere que a espécie ainda era diurna. Os pesquisadores do Senckenberg especulam que o comportamento noturno dos gaviões só se desenvolveu entre o meio e o fim do Eoceno, cerca de 47 a 34 milhões de anos atrás.", "titulo_pt": "Ainda não uma 'noite-guaxinim': fóssil extraordinário de pássaro da cova de Messel oferece novas pistas sobre quando os gaviões se tornaram noturnos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253896, "titulo": "Our sun's undiscovered stellar nemesis is still out there, says physicist", "url": "https://phys.org/news/2026-11-sun-undiscovered-stellar-nemesis-physicist.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos sugerem que cometas de longo período e alta inclinação, que podem causar impactos de extinção na Terra, provêm de uma nuvem de Oort teórica, uma estrutura esférica composta por trilhões de objetos comais distante até 1,6 luzano.", "titulo_pt": "Nosso sol ainda tem um nemésio estelar não descoberto, diz físico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253897, "titulo": "Extended mathematical language captures symmetry in layered materials", "url": "https://phys.org/news/2026-11-mathematical-language-captures-symmetry-layered.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisadores internacional, liderado pelo Instituto Avançado para Pesquisas em Materiais da Universidade de Tohoku (WPI-AIMR), desenvolveu um quadro matemático para descrever a simetria em estruturas camadas complexas, permitindo uma melhor compreensão e design de materiais funcionais. Os resultados foram publicados recentemente.", "titulo_pt": "Linguagem matemática ampliada captura simetria em materiais camadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253898, "titulo": "Tiny beetle trapped in 53-million-year-old amber is named after Twenty One Pilots", "url": "https://phys.org/news/2026-11-tiny-beetle-million-year-amber.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um escaravelho preservado em âmbar há cerca de 53 milhões de anos foi descrito como uma nova espécie por pesquisadores da Espanha e França. O inseto, nomeado Cnopus twentyonepilotorum, é o primeiro escaravelho do gênero Aderidae a ser formalmente descrito a partir do âmbar de Oise na França do Norte.", "titulo_pt": "Cnopus twentyonepilotorum: novo escaravelho preservado há 53 milhões de anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 253899, "titulo": "Chimpanzees blowing raspberries offer first evidence of learned vocal conventions in great ape communication", "url": "https://phys.org/news/2026-11-chimpanzees-raspberries-evidence-vocal-conventions.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos realizados pelo Instituto de Ciências Cognitivas do CNRS, a Universidade de Warwick e o Projeto Chimpanzé Taï mostraram que chimpanzés podem aprender a usar algumas de suas chamadas observando os adultos, em paralelo com como as crianças humanas aprendem palavras.", "titulo_pt": "Chimpanzés fazendo risinhos oferecem primeiro indício de convenções vocais aprendidas na comunicação de grandes macacos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 253367, "titulo": "'O Assalto', de Fernando Meirelles, terá Denzel e Robert Pattinson; veja fotos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/o-assalto-de-fernando-meirelles-tera-denzel-e-robert-pattinson-veja-fotos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-09T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um assalto a um banco em Manhattan envolve Denzel Washington e Robert Pattinson em 'O Assalto', novo filme de suspense dirigido por Fernando Meirelles, conhecido por 'Cidade de Deus'.", "titulo_pt": "O Assalto", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 253926, "titulo": "Moab Petroglyphs Discovered Vandalized: ‘Irreplaceable Cultural Resources’", "url": "https://www.artnews.com/art-news/news/moab-petroglyphs-vandalized-utah-1234805350/", "fonte_id": "artnews", "data_pub": "2026-11-09T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Petroglifos em Moab, que retratam animais, foram vandalizados com a inscrição de grandes letras que formam a palavra 'Craig W'. Os petroglyphs são considerados recursos culturais irsubstituíveis.", "titulo_pt": "Petroglifos de moab vandalizados com inscrição", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 253587, "titulo": "El momento en que el papa León XIV se emocionó durante su visita al Cottolengo Don Orione", "url": "https://www.lanacion.com.ar/sociedad/el-momento-en-que-el-papa-leon-xiv-se-emociono-durante-su-visita-al-cottolengo-don-orione-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV foi recebido pelo governador Axel Kicillof durante sua visita ao Cottolengo Don Orione. Ele se emocionou ao cumprimentar jovens e adultos da instituição, percorrendo os últimos 700 metros em papamóvel ao lado de centenas de fiéis.", "titulo_pt": "O momento em que o papa leão XIV se emocionou durante sua visita ao Cottolengo Don Orione", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 253588, "titulo": "Reforzar la fe y la acción y valorar el compartir con otros: qué dejó la misa de León XIV para quienes participaron", "url": "https://www.lanacion.com.ar/sociedad/un-refuerzo-de-la-fe-y-de-la-accion-y-el-valor-de-compartir-con-otros-que-les-dejo-la-misa-de-leon-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T21:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A celebração foi vista como uma chance de reforçar as crenças e refletir sobre a vida diária, além de ressaltar o mensage do Papa sobre a família. Após a missa, os participantes saíram ao som de chacareras.", "titulo_pt": "Fortalecer a fé e a ação e valorizar o compartilhamento com os outros: o que a missa de leão XIV deixou para os participantes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 253927, "titulo": "Getty Pitches In on First-Ever Conservation of an Earthquake-Damaged 17th-Century Church in the Andean Highlands of Peru", "url": "https://www.artnews.com/art-news/news/getty-conservation-earthquake-damaged-church-peru-1234805336/", "fonte_id": "artnews", "data_pub": "2026-11-09T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A igreja de Rondocan sofreu danos por causa de um terremoto e suas estruturas e coleções de arte estão em risco. O Getty está contribuindo para a primeira conservação de uma igreja do século XVII danificada por terremoto nos altos Andes do Peru.", "titulo_pt": "Getty apoia conservação histórica de igreja do século xvii danificada por terremoto nos altos andes do Peru", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 253589, "titulo": "Encuentro con líderes de otros credos: con guiños a Juan Pablo II y Francisco, el Papa destacó el rol de las religiones", "url": "https://www.lanacion.com.ar/sociedad/encuentro-con-lideres-de-otros-credos-con-guinos-juan-pablo-ii-y-francisco-el-papa-destaco-el-rol-de-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T21:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa se reuniu com líderes de outras religiões no ministério das Relações Exteriores, com um forte esquema de segurança. Durante o encontro, ele fez menções a Juan Pablo II e Francisco, enfatizando o pa assassinadas a facadas dentro de casa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 252518, "titulo": "Morre atirador que matou seis pessoas em praça no centro de Cracóvia, na Polônia", "url": "https://veja.abril.com.br/mundo/morre-atirador-que-matou-seis-pessoas-em-praca-no-centro-de-cracovia-na-polonia/", "fonte_id": "veja", "data_pub": "2026-11-09T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem de 24 anos foi baleado durante um confronto com a polícia após ter matado seis pessoas em uma praça no centro de Cracóvia, na Polônia. O Ministério Público está investigando as motivações do massacre.", "titulo_pt": "Morreram atirador que matou seis pessoas em praça no centro de Cracóvia, na Polônia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 252519, "titulo": "A nova vitória de Erika Hilton em defesa de crianças intersexo", "url": "https://veja.abril.com.br/politica/a-nova-vitoria-de-erika-hilton-em-defesa-de-criancas-intersexo/", "fonte_id": "veja", "data_pub": "2026-11-09T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público acolheu denúncias sobre uma resolução do Conselho Federal de Medicina e ajuizou uma ação civil pública. Erika Hilton, que liderou a campanha, obteve uma nova vitória em defesa de crianças intersexo.", "titulo_pt": "Nova vitória de Erika Hilton em defesa de crianças intersexo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 252551, "titulo": "Polícia aponta superlotação de 217% no CDP de Pinheiros, em São Paulo", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/policia-aponta-superlotacao-de-217-no-cdp-de-pinheiros-em-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento do Sindicato dos Policiais Penais revelou que a unidade de CDP de Pinheiros, em São Paulo, estava superlotada com 1.722 presos, enquanto sua capacidade é de 793. Isso ocorreu após uma tentativa de fuga na unidade.", "titulo_pt": "Polícia aponta superlotação de 217% no CDP de Pinheiros, em São Paulo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 253091, "titulo": "Nuclear would slow down net zero transition: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/10/2003867475", "fonte_id": "taipei_times", "data_pub": "2026-11-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos afirmam que a adoção de tecnologias nucleares retardaria o processo de transição para um equilíbrio de zero em termos de emissões de carbono.", "titulo_pt": "Nuclear dificilmente aceleraria a transição para o equilíbrio de zero: grupos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253427, "titulo": "Sarampo: EUA registram mais de 5 mil casos da doença e batem recorde dos últimos 35 anos", "url": "https://veja.abril.com.br/saude/sarampo-eua-registram-mais-de-5-mil-casos-da-doenca-e-batem-recorde-dos-ultimos-35-anos/", "fonte_id": "veja", "data_pub": "2026-11-09T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos registraram mais de 5 mil casos de sarampo, batendo recorde dos últimos 35 anos. 96% dos casos ocorreram em pessoas que não foram vacinadas.", "titulo_pt": "Sarampo: EUA registram mais de 5 mil casos e batem recorde dos últimos 35 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253790, "titulo": "Turkey: Delegates arrive in Antalya as COP31 climate talks begin", "url": "https://www.euronews.com/video/2026/11/09/turkey-delegates-arrive-in-antalya-as-cop31-climate-talks-begin", "fonte_id": "euronews", "data_pub": "2026-11-09T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31, cúpula climática das Nações Unidas, começou em Antalya após um ano marcado por ondas de calor letais e inundações devastadoras. Os delegados enfrentam novos desafios devido à guerra na Irã, que está perturba as suprimentos globais de energia.", "titulo_pt": "Turquia: delegados chegam a Antalya para as negociações climáticas COP31", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 253533, "titulo": "CNA defende critérios climáticos que considerem o agro tropical na COP31", "url": "https://www.cnnbrasil.com.br/agro/cna-defende-criterios-climaticos-que-considerem-o-agro-tropical-na-cop31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CNA defende critérios climáticos que incluam o agro tropical na COP31, argumentando que isso respeita as realidades produtivas e reconhece os esforços dos produtores rurais, evitando barreiras comerciais injustificadas de outros países.", "titulo_pt": "CNA defende critérios climáticos que considerem o agro tropical na COP31", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253552, "titulo": "Roteiro brasileiro para transição energética testa influência na COP31", "url": "https://www.dw.com/pt-br/roteiro-brasileiro-para-transição-energética-testa-influência-na-cop31/a-79903647?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-09T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento elaborado sob a presidência brasileira da COP30 propõe caminhos para a transição energética e aguarda a aprovação da nova liderança da conferência.", "titulo_pt": "Roteiro brasileiro para transição energética aguarda aprovação na COP31", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 252521, "titulo": "‘O tempo está acabando’, alerta Johan Rockström sobre o futuro da Amazônia", "url": "https://veja.abril.com.br/agenda-verde/o-tempo-esta-acabando-alerta-johan-rockstrom-sobre-o-futuro-da-amazonia/", "fonte_id": "veja", "data_pub": "2026-11-09T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O climatologista Johan Rockström alerta para o acelerado aquecimento global e o risco de transformações irreversíveis na Amazônia brasileira.", "titulo_pt": "O tempo está se esgotando", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 252675, "titulo": "COP31 começa sob alerta de que 2026 pode ser ano mais quente da história", "url": "https://www.bbc.com/portuguese/articles/cwgkvk10rpk3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-09T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na abertura da COP31, cientistas preveem que este pode ser o ano mais quente já registrado. O evento alerta para a possibilidade de 2026 ser o ano mais quente da história.", "titulo_pt": "COP31 começa sob alerta de que 2026 pode ser o ano mais quente da história", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 252470, "titulo": "Agronegócio amplia perdas com mudanças climáticas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/prejuizos-com-eventos-climaticos-extremos-sobem-67-no-primeiro-semestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T12:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os prejuízos causados por eventos climáticos extremos no agronegócio brasileiro aumentaram 67,4% no primeiro semestre de 2026, passando de R$ 31 bilhões para R$ 51,9 bilhões. O número de eventos extremos também dobrou, passando de 10 para 24 ocorrências.", "titulo_pt": "Agronegócio amplia perdas com mudanças climáticas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 252627, "titulo": "No primeiro dia de COP31, Noruega investe R$ 350 mi no Fundo Amazônia", "url": "https://exame.com/esg/no-primeiro-dia-de-cop31-noruega-investe-r-350-mi-no-fundo-amazonia/", "fonte_id": "exame", "data_pub": "2026-11-09T12:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro dia da COP31, a Noruega investiu R$ 350 milhões no Fundo Amazônia. Este aporte demonstra o compromisso do país com a redução do desmatamento na Amazônia, que atingiu o menor nível desde 1988.", "titulo_pt": "No primeiro dia de COP31, Noruega investe R$ 350 mi no Fundo Amazônia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 252964, "titulo": "Gaza residents despair after torrential rains flood tens of thousands of makeshift shelters", "url": "https://www.lemonde.fr/en/international/article/2026/11/09/gaza-residents-despair-after-torrential-rains-flood-tens-of-thousands-of-makeshift-shelters_6775837_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T11:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cheia no Gaza revela o grau de destruição causado pela guerra israelense desde 7 de outubro de 2023. Israel continua a impedir a entrega de ajuda humanitária e materiais necessários para a reconstrução.", "titulo_pt": "Residentes do gaza desesperados após fortes chuvas inundaarem centenas de moradias improvisadas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 252834, "titulo": "Deadly floods hit Iraq as thunderstorms sweep across region", "url": "https://www.theguardian.com/environment/2026/nov/09/deadly-floods-iraq-thunderstorms-iran-portugal-japan-snow", "fonte_id": "guardian_world", "data_pub": "2026-11-09T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods hit o norte da Irak e partes da Irã, causando danos significativos a residências e empresas em Erbil. A chuva torrencial que caiu superou as previsões, resultando em pelo menos duas mortes.", "titulo_pt": "Inundações letais atingem o irak com tempestades violentas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 253003, "titulo": "Gaza storm kills five and leaves 70,000 displaced people's tents flooded", "url": "https://www.euronews.com/2026/11/09/storm-killed-five-in-gaza-as-sandstone-slab-collapsed-onto-tents", "fonte_id": "euronews", "data_pub": "2026-11-09T10:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um temporal em Gaza resultou em cinco mortes, incluindo três crianças e duas mulheres, e deixou 70.000 pessoas com suas tendas alagadas.", "titulo_pt": "Temporal em gaza mata cinco e deixa 70.000 pessoas com suas tendas alagadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 251479, "titulo": "Clima: chuvas e temporais atingem várias regiões do Brasil nesta 2ª", "url": "https://www.metropoles.com/brasil/clima-chuvas-e-temporais-atingem-varias-regioes-do-brasil-nesta-2a", "fonte_id": "metropoles", "data_pub": "2026-11-09T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instabilidades atmosféricas estão afetando principalmente o Sul, Centro-Oeste e Sudeste do Brasil. Oito estados e o Distrito Federal estão sob alerta amarelo para temporais.", "titulo_pt": "Clima: chuvas e temporais atingem várias regiões do Brasil nesta segunda-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 251967, "titulo": "Russia: HIV spreads beyond risk groups in 27 regions, epidemiologists say", "url": "https://www.euronews.com/2026/11/09/russia-hiv-spreads-beyond-risk-groups-in-27-regions-epidemiologists-say", "fonte_id": "euronews", "data_pub": "2026-11-09T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com os dados mais recentes do Rospotrebnadzor, o vírus HIV está se espalhando em 27 regiões da Federação Russa, atingindo a população em geral e não apenas grupos de risco. Pessoas infectadas estão transmitindo o vírus sem se dar conta de que estão infectadas.", "titulo_pt": "Rússia: HIV se espalha em 27 regiões, afetando a população em geral, dizem epidemiologistas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 251409, "titulo": "Bacia do Alto Paraguai perde milhões de hectares de vegetação em 40 anos", "url": "https://veja.abril.com.br/agenda-verde/bacia-do-alto-paraguai-perde-milhoes-de-hectares-de-vegetacao-em-40-anos/", "fonte_id": "veja", "data_pub": "2026-11-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mapeamento do MapBiomas mostrou que 61% do bioma da Bacia do Alto Paraguai sofreu avanço de queimadas entre 1985 e 2025, resultando na perda de milhões de hectares de vegetação.", "titulo_pt": "Bacia do Alto Paraguai perde milhões de hectares de vegetação em 40 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 251923, "titulo": "'A supersized El Niño is colliding with a planet already superheated': 2026 will be among hottest years on record", "url": "https://www.lemonde.fr/en/environment/article/2026/11/09/a-supersized-el-nino-is-colliding-with-a-planet-already-superheated-2026-will-be-among-hottest-years-on-record_6775606_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Supersíndice El Niño está colidindo com um planeta já superaquecido. O relatório anual do estado do clima da Organização Meteorológica Mundial foi lançado durante a COP31, que se abre na Turquia em 2026.", "titulo_pt": "A supersíndice El Niño colide com um planeta já superaquecido: 2026 será um dos anos mais quentes da história", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 253597, "titulo": "Zohran Mamdani, alcalde de Nueva York: “El ICE no tiene derecho a usar nuestra propiedad como base para separar a las familias”", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/zohran-mamdani-alcalde-de-nueva-york-el-ice-no-tiene-derecho-a-usar-nuestra-propiedad-como-base-para-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Zohran Mamdani, prefeito de Nova York, enviou uma carta ao DHS afirmando que o ICE não tem o direito de usar propriedades municipais no Bronx e Queens como base para separar famílias. Isso se baseia em uma ordem executiva de fevereiro que já vedava esse uso a forças não municipais.", "titulo_pt": "Prefeito de nova York: ICE não tem direito de usar propriedades municipais para separar famílias", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 253630, "titulo": "Revista Time incluye entre sus 100 líderes climáticos más influyentes al exministro de Transporte Juan Carlos Muñoz", "url": "https://www.latercera.com/nacional/noticia/revista-time-incluye-entre-sus-100-lideres-climaticos-mas-influyentes-al-exministro-de-transporte-juan-carlos-munoz/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T20:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A revista Time incluiu o ex-ministro de Transporte Juan Carlos Muñoz entre os 100 líderes climáticos mais influentes, destacando sua liderança na transição de Chile para o transporte público elétrico. Além disso, Santiago foi mencionada como a única cidade fora da China a contar com uma frota superior a 4.400 ônibus elétricos.", "titulo_pt": "Time inclui ex-ministro de Transporte chileno entre líderes climáticos mais influentes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 253851, "titulo": "Suspect in 1994 Rwandan genocide deported from US", "url": "https://www.scmp.com/news/world/united-states-canada/article/3373849/suspect-1994-rwandan-genocide-deported-us", "fonte_id": "scmp", "data_pub": "2026-11-09T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem ruandês preso nos Estados Unidos por falsificar sua envolvência no genocídio de 1994 foi deportado para seu país de origem. Jean Leonard Teganya, de 55 anos, foi condenado em 2019 por dois crimes de fraude imigratória e três de perjúrio após mentir sobre seu suposto papel no genocídio para obter asilo nos Estados Unidos.", "titulo_pt": "Suspeito do genocídio ruandês de 1994 deportado dos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 252520, "titulo": "Jornal independente russo ‘Novaya Gazeta’ fecha após pressão do Kremlin", "url": "https://veja.abril.com.br/mundo/jornal-independente-russo-novaya-gazeta-fecha-apos-pressao-do-kremlin/", "fonte_id": "veja", "data_pub": "2026-11-09T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jornal independente russo 'Novaya Gazeta', fundado em 1993, encerrou suas atividades após enfrentar pressão do Kremlin. O veículo registrou o assassinato de seis de seus funcionários ao longo dos últimos anos.", "titulo_pt": "Jornal independente russo 'Novaya Gazeta' fecha após pressão do Kremlin", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253033, "titulo": "Senegal human rights group demands government action after deadly sinking", "url": "https://www.aljazeera.com/news/2026/11/9/senegal-human-rights-group-demands-government-action-after-deadly-sinking?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organização de direitos humanos em Senegal pediu ação do governo após um naufrágio fatal. Milhares de pessoas morreram nos últimos anos ao tentar chegar às ilhas Canárias da Espanha partindo da África Ocidental.", "titulo_pt": "Grupão de direitos humanos em senegal pede ação após naufrágio fatal", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 252836, "titulo": "‘Exceedingly heavy-handed’: ACT police criticised by magistrate for Tasering disabled Aboriginal woman", "url": "https://www.theguardian.com/australia-news/2026/nov/10/exceedingly-heavy-handed-act-police-officers-criticised-by-magistrate-for-taser-arrest-of-disabled-aboriginal-woman-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-09T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz criticou policiais do ACT por usarem um Taser em uma mulher indígena com deficiência intelectual durante uma prisão em janeiro. A mulher pediu aos policiais que não usassem o esticão elétrico, afirmando estar sem armas.", "titulo_pt": "‘Muito pesado’: juiz critica policiais do ACT por usar taser em mulher indígena com deficiência intelectual", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 252876, "titulo": "Después de la Teletón: la inclusión no se construye, se vive", "url": "https://www.ciperchile.cl/2026/11/09/despues-de-la-teleton-la-inclusion-no-se-construye-se-vive/?utm_source=rss&utm_medium=rss&utm_campaign=despues-de-la-teleton-la-inclusion-no-se-construye-se-vive", "fonte_id": "ciper_chile", "data_pub": "2026-11-09T12:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo explora a questão da inclusão, sugerindo que ela não é construída de forma mecânica, mas vivida de fato. O título original em espanhol é 'Después de la Teletón: la inclusión no se construye, se vive'.", "titulo_pt": "Depois da Teletón: a inclusão não se constrói, se vive", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 253048, "titulo": "At least 21 migrants and refugees die trying to reach Greece’s Crete", "url": "https://www.aljazeera.com/news/2026/11/9/at-least-21-migrants-and-refugees-die-trying-to-reach-greeces-crete?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T12:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos 21 migrantes e refugiados morreram tentando chegar à Grécia, na ilha de Creta. A guarda costeira grega relatou a resolução de várias operações que salvaram mais de 100 pessoas na costa sul de Creta.", "titulo_pt": "Ao menos 21 migrantes e refugiados morrem tentando chegar à Grécia, em creta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 253140, "titulo": "Death toll rises to 39 after migrant boat capsizes off Senegal", "url": "https://www.koreaherald.com/article/10931212", "fonte_id": "korea_herald", "data_pub": "2026-11-09T12:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos aumentou para 39 após a capotagem de uma embarcação transportando migrantes perto de Senegal. Segundo as autoridades, novos corpos foram encontrados na segunda-feira. A embarcação partiu de Saint-Louis, no norte de Senegal, com destino à costa espanhola e capotou perto da cidade de Kébémer, no norte da capital Dakar.", "titulo_pt": "Contagem de mortos sobe para 39 após barco com migrantes se virar perto de Senegal", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 251935, "titulo": "20 migrants die trying to reach Greece's Crete, authorities say", "url": "https://www.lemonde.fr/en/international/article/2026/11/09/20-migrants-die-trying-to-reach-greece-s-crete-authorities-say_6775672_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 28 sobreviventes e um corpo, todos nacionais do Sudão, foram resgatados por outro barco que passava por perto. A ilha de Creta é um destino principal para imigrantes que tentam chegar à Europa.", "titulo_pt": "20 Migrantes morrem tentando chegar a creta, Grécia, autoridades relatam", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 251787, "titulo": "French police officers face trial over beating of black man not wearing mask during Covid", "url": "https://www.theguardian.com/world/2026/nov/09/french-police-officers-face-trial-over-beating-of-black-man-not-wearing-mask-during-covid", "fonte_id": "guardian_world", "data_pub": "2026-11-09T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses irão se submeter a julgamento por terem batido em Michel Zecler, um produtor musical negro, em 2020, durante a pandemia de coronavírus. Este é um caso raro de violência policial que chegou ao tribunal, ocorrendo em um momento de tensões aumentadas.", "titulo_pt": "Policiais franceses enfrentarão julgamento por agressão a homem negro não usando máscara durante a pandemia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 251708, "titulo": "Al menos ocho migrantes muertos en un naufragio frente a las costas de Creta, Grecia", "url": "https://www.latercera.com/mundo/noticia/al-menos-ocho-migrantes-muertos-en-un-naufragio-frente-a-las-costas-de-creta-grecia/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T08:21:00Z", "idioma": "es", "provavel_duplicata_de": 251650, "texto_pt": "Ao menos oito migrantes morreram em um naufrágio de uma embarcação que teria virado no dia anterior às costas de Creta, Grécia. Durante a noite de domingo para segunda-feira, os resgatistas localizaram a embarcação naufragada.", "titulo_pt": "Ao menos oito migrantes mortos em naufrágio frente às costas de Creta, Grécia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 251687, "titulo": "La tarifa de US$70.000 que el DHS quiere aplicar a inmigrantes que van a universidades en Estados Unidos", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/la-tarifa-de-us70000-que-el-dhs-quiere-aplicar-a-inmigrantes-que-aplican-a-universidades-en-estados-nid08112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T07:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A tarifa de 70.000 dólares por OPT é uma proposta do DHS ainda não implementada. A proposta ainda está em discussão e não está clara sobre quem pagaria, a quem afetaria e até quando as opiniões podem ser apresentadas.", "titulo_pt": "Taxa de US$70.000 proposta pelo DHS para estudantes imigrantes em universidades americanas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 252032, "titulo": "‘Tents don’t protect us’: Rains flood displaced Palestinians in Gaza", "url": "https://www.aljazeera.com/features/2026/11/9/tents-dont-protect-us-rains-flood-displaced-palestinians-in-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T05:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hundreds of thousands of palestinos estão vulneráveis a inundações devido à continuação da proibição israelense de entrada de casas móveis. As tendas não oferecem proteção adequada contra a chuva.", "titulo_pt": "Tendas não nos protegem: chuvas inundaam palestinos deslocados em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 251924, "titulo": "French policemen stand trial over beating of Black man in emblematic case", "url": "https://www.lemonde.fr/en/france/article/2026/11/09/french-policemen-stand-trial-over-beating-of-black-man-in-emblematic-case_6775540_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir de segunda-feira, 9 de novembro, três policiais franceses comparecerão em julgamento em Paris por um violento ataque a um produtor musical negro chamado Michel Zecler em 2020, que foi filmado.", "titulo_pt": "Policiais franceses são julgados por agressão a homem negro em caso emblemático", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 253082, "fonte_id": "taipei_times", "titulo": "Nvidia shares slide amid spy claims", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/10/2003867459", "data_pub": "2026-11-10T00:00:00Z", "topico": "tecnologia", "idioma": "en", "titulo_pt": "Ações da nvidia caem em meio a acusações de espionagem", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 253083, "fonte_id": "taipei_times", "titulo": "TIER forecasts GDP to grow 12.34% this year", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/10/2003867460", "data_pub": "2026-11-10T00:00:00Z", "topico": "economia", "idioma": "en", "titulo_p
