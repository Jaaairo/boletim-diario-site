ent finds", "url": "https://phys.org/news/2026-08-scented-cleaners-nanoparticles-deep-lungs.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma equipe de pesquisa liderada por Brandon Boor descobriu que compostos de aroma em produtos de limpeza, tanto convencionais quanto à base de óleos essenciais, rapidamente reagem no ar, formando nanopartículas que podem chegar profundamente nos pulmões se inaladas. Os pesquisadores sugerem o uso de produtos sem aroma, a utilização de ventiladores de exaustão e a evitação de dispositivos que geram ozônio durante a limpeza para reduzir a exposição a esta poluição invisível.", "titulo_pt": "Limpeza perfumada pode criar nanopartículas que atingem os pulmões rapidamente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 127447, "titulo": "Heat makes emergency rooms busier. Study shows which illness and injuries rise during hot spells", "url": "https://phys.org/news/2026-08-emergency-rooms-busier-illness-injuries.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo baseado nos registros de hospitais e cuidados de saúde imediatos em Chicago demonstrou que os serviços de emergência se tornam mais ocupados durante períodos quentes, com aumento de casos de ferimentos acidentais por armas de fogo, problemas renais, problemas cutâneos, varizes e até mesmo problemas de saúde mental relacionados ao uso de maconha.", "titulo_pt": "Aumento de atendimentos em emergências durante períodos quentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 127448, "titulo": "Light particles reveal critical scaling in a two-dimensional photon gas", "url": "https://phys.org/news/2026-08-particles-reveal-critical-scaling-dimensional.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisadores da Universidade de Bonn, da Universidade de Heidelberg e da Universidade Nacional Autônoma do México estudou o comportamento crítico de partículas de luz (fotões) próximas a uma transição de fase. Esta escala crítica, que vê quantidades termodinâmicas crescerem enormemente ou divergirem imediatamente antes da condensação de Bose-Einstein, nunca havia sido observada em gases de fotões até que os pesquisadores conseguiram demonstrá-la com precisão.", "titulo_pt": "Partículas de luz revelam comportamento crítico em um gás fotônico bidimensional", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 127467, "titulo": "STAT+: The mystery of Moderna’s magic algorithm", "url": "https://www.statnews.com/2026/08/27/moderna-merck-cancer-vaccine-secret-ingredient-an-algorithm/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vacina personalizada contra câncer desenvolvida pela Moderna e Merck pode ser um êxito de imunologia e biologia do câncer. No entanto, também pode ser o resultado de um algoritmo avançado.", "titulo_pt": "O mistério do algoritmo mágico da Moderna", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 127468, "titulo": "A state gave sheriffs 20% of its opioid settlement cash. We followed the money", "url": "https://www.statnews.com/2026/08/27/opioid-settlement-funds-enforcement-or-treatment-louisiana-sheriff-investigation/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa do KFF Health News descobriu que os sheriffs estão gastando milhões de dólares dos fundos de acordos com ópio em equipamentos policiais.", "titulo_pt": "Um estado destinou 20% dos fundos de acordos com ópio aos sheriffs. Pesquisa mostra como o dinheiro está sendo usado.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 127469, "titulo": "Hospitals are plotting a long-shot push to roll back $1 trillion in Medicaid cuts", "url": "https://www.statnews.com/2026/08/27/hospitals-lobby-reverse-medicaid-cuts-part-2-unraveled-series/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospitais estão planejando uma tentativa de reversão de cortes bilionários no financiamento do Medicaid, um esforço de longo prazo com chances consideradas baixas de sucesso. Internamente, sistemas de saúde estão buscando mitigar significativamente as grandes reduções de financiamento.", "titulo_pt": "Hospitais planejam uma tentativa de reverter cortes bilionários no Medicaid", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 127470, "titulo": "Opinion: STAT+: A bill is supposed to protect U.S. biotech from Chinese competition. But there’s a loophole", "url": "https://www.statnews.com/2026/08/27/binsa-biotech-china-eurowashing-geography-clinical-trials/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos da Optimapharm alertam que a indústria biotecnológica deve definir uma nova abordagem geográfica, pois uma legislação mais rígida pode forçar o assunto.", "titulo_pt": "Opinião: uma lei visa proteger a biotecnologia americana da concorrência chinesa, mas há uma brecha", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 127471, "titulo": "Opinion: I studied Reddit forums on menopause — and found what doctors are missing", "url": "https://www.statnews.com/2026/08/27/menopause-perimenopause-symptoms-reddit-clinical-data-study/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisadora Yulin Hswen escreve que os sintomas da menopausa discutidos online devem ser incluídos nas perguntas que os pesquisadores farão no futuro.", "titulo_pt": "Opinião: pesquisadora estuda fóruns do Reddit sobre menopausa e identifica o que os médicos estão deixando de lado", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 126791, "titulo": "Para lembrar com sorriso nos lábios: a filosofia de vida de Dolly Parton", "url": "https://veja.abril.com.br/coluna/mundialista/para-lembrar-com-sorriso-nos-labios-a-filosofia-de-vida-de-dolly-parton/", "fonte_id": "veja", "data_pub": "2026-08-27T10:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, conhecida por estereótipos, ria dessas ideias pré-concebidas e demonstrava grande inteligência e senso de humor.", "titulo_pt": "Para lembrar com sorriso nos lábios: a filosofia de vida de Dolly Parton", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 127112, "titulo": "Cómo la postura al sentarse puede mejorar el estado de ánimo y la toma de decisiones, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/como-la-postura-al-sentarse-puede-mejorar-el-estado-de-animo-y-la-toma-de-decisiones-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-08-27T10:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada por um time da Universidade McGill envolveu cerca de 200 participantes e demonstrou que a postura ao sentar pode afetar o estado de ánimo e a tomada de decisões. Os autores do estudo enfatizam a influência do corpo no humor e no comportamento.", "titulo_pt": "Como a postura ao sentar pode melhorar o estado de ánimo e a tomada de decisões, de acordo com um estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 126792, "titulo": "Justiça arrombou imóvel onde vivia viúva de Erasmo Carlos em busca de espólio", "url": "https://veja.abril.com.br/brasil/justica-arrombou-imovel-onde-vivia-viuva-de-erasmo-carlos-em-busca-de-espolio/", "fonte_id": "veja", "data_pub": "2026-08-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça realizou uma busca em um apartamento localizado em São Conrado, no Rio de Janeiro, onde morava a viúva de Erasmo Carlos. A diligência durou três horas.", "titulo_pt": "Justiça arrombou imóvel onde vivia viúva de Erasmo Carlos em busca de espólio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 127513, "titulo": "Share your tributes and memories of Tim Curry", "url": "https://www.theguardian.com/film/2026/aug/27/share-your-tributes-and-memories-of-performer-tim-curry", "fonte_id": "guardian_culture", "data_pub": "2026-08-27T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Curry, ator conhecido por seu papel como Dr Frank-N-Furter em 'The Rocky Horror Show', faleceu aos 80 anos. Ele também ganhou indicações ao Tony por suas performances no palco, incluindo 'Amadeus', 'My Favorite Year' e 'Monty Python's Spamalot'.", "titulo_pt": "Compartilhe suas homenagens e memórias de Tim Curry", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 126733, "titulo": "Globo faz novas mudanças no esporte e recontrata Rembrandt Júnior após três anos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/08/globo-faz-novas-mudancas-no-esporte-e-recontrata-rembrandt-junior-apos-tres-anos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo recontratou Rembrandt Júnior como narrador esportivo após três anos de sua saída, em setembro. Ele havia trabalhado na emissora por 23 anos antes de deixar em 2023.", "titulo_pt": "Globo recontrata Rembrandt Júnior após três anos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 127512, "titulo": "‘We’re at a crisis point’: Chappell Roan, Shirley Manson and Eli on playing Olivia Rodrigo’s female-only festival", "url": "https://www.theguardian.com/music/2026/aug/27/olivia-rodrigo-daisy-chain-fields-preview-chappell-roan-interview-eli-shirley-manson", "fonte_id": "guardian_culture", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes do festival Daisy Chain Fields, inaugurado por Olivia Rodrigo, artistas explicam a importância de festivais com foco em mulheres. O evento, que incluiu artistas como Chappell Roan, Doechii, Mitski e Garbage, gerou surpresa devido à presença de tantas mulheres no line-up.", "titulo_pt": "‘Estamos em um ponto de crise’: chappell Roan, Shirley Manson e Eli sobre o festival exclusivo para mulheres de Olivia Rodrigo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 127423, "titulo": "Seoul resets tourism record with 1.61m foreign visitors in July", "url": "https://www.koreaherald.com/article/10854569", "fonte_id": "korea_herald", "data_pub": "2026-08-27T07:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul recebeu um recorde de 1,61 milhão de turistas internacionais em julho, com gastos que superaram 1 trilhão de wons por mês pela quarta vez consecutiva. O número de turistas internacionais aumentou 20,8% em comparação com o mesmo mês do ano anterior e 5,2% em relação ao mês anterior.", "titulo_pt": "Seul estabelece novo recorde de turistas internacionais em julho com 1,61 milhão", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 126877, "titulo": "As duas coleções que uniram Yayoi Kusama e a Louis Vuitton", "url": "https://exame.com/casual/as-duas-colecoes-que-uniram-yayoi-kusama-e-a-louis-vuitton/", "fonte_id": "exame", "data_pub": "2026-08-27T07:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A artista Yayoi Kusama, falecida aos 97 anos, criou uma das colaborações mais reconhecidas entre moda e arte, que envolveu a Louis Vuitton. Sua obra, marcada por bolinhas, foi fundamental para essa parceria.", "titulo_pt": "As duas coleções que uniram Yayoi Kusama e a Louis Vuitton", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 126734, "titulo": "Fitas esquecidas em Nashville revelam fase inicial feroz dos Cramps", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/fitas-esquecidas-em-nashville-revelam-fase-inicial-feroz-dos-cramps.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "The Cramps, grupo de rock alternativo que fez seu último show há 20 anos e encerrou definitivamente as atividades em 2009 com a morte do vocalista Lux Interior, criou o subgênero psychobilly, que mistura rockabilly dos anos 1950 com punk e psicodelia.", "titulo_pt": "Gravações esquecidas em Nashville revelam fase inicial feroz dos Cramps", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 127510, "titulo": "‘It’s sad to lose a really nice person’: mourners flock to Dollywood after death of Dolly Parton", "url": "https://www.theguardian.com/music/2026/aug/27/dolly-parton-dollywood", "fonte_id": "guardian_culture", "data_pub": "2026-08-27T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas se reuniram em Dollywood, parque temático inspirado em Dolly Parton, para prestar homenagem à cantora após sua morte. Uma memória no portão do parque contava com buquês e um criança perguntou à mãe por que tantas pessoas estavam chorando.", "titulo_pt": "É triste perder uma pessoa realmente boa: multidão se reúne em Dollywood após morte de Dolly Parton", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 127514, "titulo": "‘The technique was revolutionary’: Ha Chong-Hyun, the 91-year-old South Korean artist who turned painting inside out", "url": "https://www.theguardian.com/artanddesign/2026/aug/27/ha-chong-hyun-artist-interview-conjunction-lisson-gallery-exhibition-london", "fonte_id": "guardian_culture", "data_pub": "2026-08-27T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ha Chong-Hyun, um artista sul-coreano de 91 anos, criou uma técnica inovadora aplicando tinta a óleo por trás de uma superfície de cânhamo. Ele usava uma única cor neutra ou suave em cada obra, resultando em pinturas minimalistas e impactantes.", "titulo_pt": "A técnica foi revolucionária: ha Chong-Hyun, o artista sul-coreano de 91 anos que virou a pintura de cabeça para baixo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 126885, "titulo": "SP-Arte Rotas vai além do Brasil e traz obras de Carybé, La Chola Poblete e Warhol", "url": "https://exame.com/casual/sp-arte-rotas-vai-alem-do-brasil-e-traz-obras-de-carybe-la-chola-poblete-e-warhol/", "fonte_id": "exame", "data_pub": "2026-08-27T06:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SP-Arte Rotas apresenta obras de artistas como Carybé, La Chola Poblete e Warhol em uma exposição com 66 galerias, que ocupa o galpão da Arca até o dia 30. O foco é na arte latino-americana e produções fora do eixo Rio-SP.", "titulo_pt": "Sp-arte Rotas traz obras de Carybé, La Chola Poblete e Warhol", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "cultura__eventos": [{"titulo": "Yayoi Kusama, artista japonesa famosa por obras com bolinhas e visual ousado, morre aos 97 anos", "sumario": "A artista japonesa Yayoi Kusama, conhecida por suas obras com bolinhas e estilos ousados, faleceu aos 97 anos. Yayoi Kusama, considerada a 'rainha dos pontos' do Japão, faleceu aos 97 anos. Yayoi Kusama, artista japonesa conhecida por suas obras com bolinhas e padrões repetitivos, faleceu aos 97 anos.", "artigos": [{"id": 126938, "titulo": "Yayoi Kusama, artista japonesa famosa por obras com bolinhas e visual ousado, morre aos 97 anos", "url": "https://www.bbc.com/portuguese/articles/c7v462yvnlzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-27T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A artista japonesa Yayoi Kusama, conhecida por suas obras com bolinhas e estilos ousados, faleceu aos 97 anos. Suas criações coloridas atraíram multidões e alcançaram recordes de venda para obras de artistas femininas.", "titulo_pt": "Yayoi Kusama, artista japonesa famosa por obras com bolinhas e visual ousado, morre aos 97 anos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 127272, "titulo": "Yayoi Kusama, Japan’s ‘queen of polka dots’, dies at 97", "url": "https://www.aljazeera.com/news/2026/8/27/yayoi-kusama-japans-queen-of-polka-dots-dies-at-97?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-27T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yayoi Kusama, considerada a 'rainha dos pontos' do Japão, faleceu aos 97 anos. Sua obra incluía pinturas com pontos e quartos infinitos refletivos.", "titulo_pt": "Yayoi Kusama, a 'rainha dos pontos' do Japão, morre aos 97 anos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 126879, "titulo": "Yayoi Kusama, ícone da arte pop japonesa, morre aos 97 anos", "url": "https://exame.com/casual/yayoi-kusama-icone-da-arte-pop-japonesa-morre-aos-97-anos/", "fonte_id": "exame", "data_pub": "2026-08-27T07:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Yayoi Kusama, artista japonesa conhecida por suas obras com bolinhas e padrões repetitivos, faleceu aos 97 anos. Ela se tornou um ícone da arte pop internacional com instalações imersivas.", "titulo_pt": "Yayoi Kusama, ícone da arte pop japonesa, morre aos 97 anos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 127192, "titulo": "Yayoi Kusama, Japanese polka dot artist and global superstar, dies aged 97", "url": "https://www.lemonde.fr/en/obituaries/article/2026/08/27/yayoi-kusama-japanese-polka-dot-artist-and-global-superstar-dies-aged-97_6756897_15.html", "f 27/democratic-primary-black-voters", "fonte_id": "axios", "data_pub": "2026-08-27T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na primária democrata para o Senado em Michigan, jovens eleitores negros, liderados por Abdul El-Sayed, superaram a influência dos líderes negros mais velhos, como Jim Clyburn, demonstrando que não se deixam influenciar por fatores como idade, credenciais de direitos civis ou recomendações.", "titulo_pt": "Jovens eleitores negros desafiam o establishment democrata", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 127426, "titulo": "Woman sentenced to life over fatal drug-laced drinks", "url": "https://www.koreaherald.com/article/10854543", "fonte_id": "korea_herald", "data_pub": "2026-08-27T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim So-young, uma mulher de 20 anos, foi condenada a prisão perpétua por fornecer bebidas envenenadas a seis homens, resultando em duas mortes e quatro feridos. O tribunal de Seul considerou que ela tinha intenção de matar os vítimas, rejeitando sua alegação de que pretendia apenas deixá-los adormecidos.", "titulo_pt": "Mulher condenada a prisão perpétua por bebidas envenenadas que resultaram em duas mortes", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 127313, "titulo": "Rescuers seek nearly 1,500 still missing in Nepal and China after flash flood", "url": "https://www.japantimes.co.jp/news/2026/08/27/asia-pacific/society/flood-nepal-tibet-border-missing-dead/", "fonte_id": "japan_times", "data_pub": "2026-08-27T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatistas buscam cerca de 1.500 pessoas ainda desaparecidas após uma cheia em Nepal e China. Imagens de televisão mostraram casas derrubadas, carros flutuantes e um puente metálico levado pela água, enquanto testemunhas relataram que as águas englobaram entire vilas.", "titulo_pt": "Resgatistas buscam quase 1.500 desaparecidos após cheia em Nepal e China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 126919, "titulo": "Lito está lutando pela vida. Seu drama está unindo o Brasil", "url": "https://braziljournal.com/lito-esta-lutando-pela-vida-seu-drama-esta-unindo-o-brasil/", "fonte_id": "brazil_journal", "data_pub": "2026-08-26T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lito Sousa, de 59 anos, está passando por um quadro médico grave de perda de coordenação. Sua situação tem unido o Brasil em torno de sua causa, apesar da polarização política do país.", "titulo_pt": "Lito está lutando pela vida. Seu drama está unindo o Brasil", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 126245, "titulo": "PM que baleou jovem na saída do cinema é denunciado por homicídio tentado", "url": "https://www.metropoles.com/distrito-federal/entorno/pm-que-baleou-jovem-na-saida-do-cinema-e-denunciado-por-tentativa-homicidio", "fonte_id": "metropoles", "data_pub": "2026-08-26T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial militar foi denunciado por homicídio tentado após balear um jovem na saída de um cinema. O Ministério Público do Estado de Goiás (MPGO) pediu que o policial seja julgado pelo Tribunal do Júri e que pague R$ 100 mil por danos morais e materiais à vítima.", "titulo_pt": "PM denunciado por homicídio tentado após balear jovem na saída do cinema", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126246, "titulo": "Instituto Pró-Vítima pede à PGR federalização do caso Mariana Ferrer", "url": "https://www.metropoles.com/sao-paulo/instituto-pro-vitima-pede-a-pgr-federalizacao-do-caso-mariana-ferrer", "fonte_id": "metropoles", "data_pub": "2026-08-26T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Pró-Vítima solicitou à Procuradoria-Geral da República (PGR) a federalização do caso Mariana Ferrer para evitar revitimização e constrangimentos à vítima.", "titulo_pt": "Instituto Pró-Vítima pede federalização do caso Mariana Ferrer à PGR", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126219, "titulo": "Livro escancara relação entre a prática da misoginia e o avanço da extrema-direita no país", "url": "https://veja.abril.com.br/cultura/livro-escancara-relacao-entre-a-pratica-da-misoginia-e-o-avanco-da-extrema-direita-no-pais/", "fonte_id": "veja", "data_pub": "2026-08-26T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisadora Bruna Camilo, em seu livro, expõe como o comportamento misógino se transformou em uma estratégia política organizada. O trabalho revela a relação entre a prática da misoginia e o avanço da extrema-direita no país.", "titulo_pt": "Livro desvenda relação entre misoginia e ascensão da extrema-direita", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126375, "titulo": "'Minha casa desabou e minha irmã está desaparecida': o relato de sobreviventes da enxurrada no Nepal", "url": "https://www.bbc.com/portuguese/articles/c14d8mj5ld6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-26T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BBC relatou os depoimentos de sobreviventes da enxurrada no Nepal, que deixou pelo menos 157 mortos e centenas desaparecidos.", "titulo_pt": "Minha casa desabou e minha irmã está desaparecida: relato de sobreviventes da enxurrada no Nepal", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 126316, "titulo": "Você não pode tratar o cachorro da mesma maneira que um gato: médica veterinária explica o perigo de achar que ambos são iguais", "url": "https://www.cnnbrasil.com.br/curiosidades/voce-nao-pode-tratar-o-cachorro-da-mesma-maneira-que-um-gato-medica-veterinaria-explica-o-perigo-de-achar-que-ambos-sao-iguais/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A obre lo normal en Chile hasta octubre: revisa las regiones afectadas", "url": "https://www.latercera.com/tendencias/noticia/centro-internacional-confirma-lluvia-sobre-lo-normal-en-chile-hasta-octubre-revisa-las-regiones-afectadas/", "fonte_id": "la_tercera", "data_pub": "2026-08-27T10:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O pronóstico estacional sugere que haverá uma maior probabilidade de precipitação acima do normal para agosto-outubro em grande parte do Chile. O centro internacional que fez a previsão confirmou que a precipitação será superior ao normal nas regiões afetadas.", "titulo_pt": "Centro internacional confirma chuva acima do normal no Chile até outubro", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 126857, "titulo": "Deslizamentos no Nepal criam novo lago que pode causar segundo desastre", "url": "https://www.cnnbrasil.com.br/internacional/deslizamentos-no-nepal-criam-novo-lago-que-pode-causar-segundo-desastre/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chuvas de três dias e desmoronamentos de barragens de terra instáveis criaram um novo lago no Nepal, aumentando a ameaça de deslizamentos, inundações e fluxos de lama.", "titulo_pt": "Deslizamentos no Nepal criam novo lago que pode causar segundo desastre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 127064, "titulo": "Nearly 1,400 missing, mostly tourists, after Nepal-Tibet flash flood kills at least 270", "url": "https://www.theguardian.com/world/2026/aug/27/what-caused-nepal-flash-flood-glacial-collapse-tibet-border", "fonte_id": "guardian_world", "data_pub": "2026-08-27T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um flash flood devastador atingiu regiões montanhosas na fronteira entre Nepal e Tibet, destruindo aldeias inteiras e matando pelo menos 270 pessoas. Cerca de 1.400 pessoas, principalmente turistas, estão desaparecidas e estão sendo buscadas por resgatadores.", "titulo_pt": "Quase 1.400 desaparecidos, principalmente turistas, após flash flood em fronteira entre nepal e tibet mata pelo menos 270", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 126794, "titulo": "As causas da inundação repentina que matou ao menos 270 pessoas no Nepal e Tibete", "url": "https://veja.abril.com.br/mundo/as-causas-da-inundacao-repentina-que-matou-ao-menos-270-pessoas-no-nepal-e-tibete/", "fonte_id": "veja", "data_pub": "2026-08-27T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma inundação repentina matou ao menos 270 pessoas no Nepal e Tibete, e deixou 1.300 desaparecidos, conforme informaram as autoridades dos dois países.", "titulo_pt": "Causas da inundação repentina que matou ao menos 270 pessoas e deixou 1.300 desaparecidos no Nepal e Tibete", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126861, "titulo": "Carbono Oculto: MPSP denuncia 16 por adulteração de combustível e lavagem", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/carbono-oculto-mpsp-denuncia-16-por-adulteracao-de-combustivel-e-lavagem/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público de São Paulo denunciou 16 pessoas por adulteração de combustível e lavagem de dinheiro através de fintechs. A investigação envolve mais de 350 alvos e aponta para uma organização criminosa que teria desviado metanol e adulterado combustíveis.", "titulo_pt": "MPSP denuncia 16 por adulteração de combustível e lavagem", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 127195, "titulo": "'After a summer of heatwaves and fires, awareness remains low and preparedness is virtually nonexistent'", "url": "https://www.lemonde.fr/en/opinion/article/2026/08/27/after-a-summer-of-heatwaves-and-fires-awareness-remains-low-and-preparedness-is-virtually-nonexistent_6756896_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-27T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma historiadora ambiental criticou os líderes políticos franceses por sua incapacidade de responder à emergência climática. Ela afirma que é hora de 'politicizar os desastres que nos pesam'.", "titulo_pt": "Depois de veranicos de calor e incêndios, a conscientização é baixa e a preparação quase inexistente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 126893, "titulo": "A conta do clima", "url": "https://exame.com/revista-exame/a-conta-do-clima/", "fonte_id": "exame", "data_pub": "2026-08-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lisa Sachs afirma que a transição energética será alcançada por todos quando as regras de distribuição de dinheiro mudarem.", "titulo_pt": "A conta do clima", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 127283, "titulo": "Wildfires on Indonesia’s Borneo island turn the air toxic", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/27/wildfires-on-indonesias-borneo-island-turn-the-air-toxic?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-27T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moradores da ilha de Borneo, na Indonésia, estão enfrentando dificuldades para respirar devido à poluição do ar causada por incêndios florestais.", "titulo_pt": "Incêndios florestais na ilha de Borneo tornam o ar tóxico", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 127231, "titulo": "Around 1,300 people missing in Nepal and Tibet after catastrophic floods caused by a glacial collapse", "url": "http://www.euronews.com/2026/08/27/around-1000-people-missing-in-nepal-and-tibet-after-catastrophic-floods-caused-by-a-glacia", "fonte_id": "euronews", "data_pub": "2026-08-27T04:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 1.300 pessoas estã res in Algeria leave at least 12 dead", "url": "https://www.lemonde.fr/en/international/article/2026/08/27/wildfires-in-algeria-leave-at-least-12-dead_6756890_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-27T00:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em regiões nordeste de Argélia, bombeiros combatem mais de 60 incêndios que se espalharam devido a ventos fortes, levando a pelo menos 12 mortes e a evacuações de muitos residentes.", "titulo_pt": "Incêndios na argélia deixam pelo menos 12 mortos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 127201, "titulo": "In DR Congo, healthcare workers on the front lines of Ebola face anger and exhaustion as they remain unpaid", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/27/in-dr-congo-healthcare-workers-on-the-front-lines-of-ebola-face-anger-and-exhaustion-as-they-remain-unpaid_6756889_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-27T00:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde julho, profissionais de saúde que combatem a epidemia têm realizado greves esporádicas para exigir seus salários. O governo reconheceu o desvio de fundos, o que comprometeu a resposta à doença Ebola.", "titulo_pt": "Em Congo democrático, profissionais de saúde na linha de frente contra a Ebola enfrentam raiva e exaustão ao permanecerem sem receber", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 126374, "titulo": "As imagens de satélite do Nepal que mostram o antes e depois das áreas destruídas pela enxurrada", "url": "https://www.bbc.com/portuguese/articles/c3d7vn1l3zgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-26T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imagens de satélite mostram o impacto das enxurradas no Nepal, onde mais de 150 pessoas morreram e centenas de turistas desapareceram.", "titulo_pt": "Imagens de satélite do Nepal mostram o antes e depois das áreas afetadas pelas enxurradas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 126670, "titulo": "Climate change exposes 580 million children to 20 extra ‘heat-stress days’ every year", "url": "https://www.carbonbrief.org/climate-change-exposes-580-million-children-to-20-extra-heat-stress-days-every-year", "fonte_id": "carbon_brief", "data_pub": "2026-08-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 40% dos crianças abaixo dos 10 anos de idade em todo o mundo já estão experimentando, em média, 20 dias a mais de exposição a calor estressante a cada ano devido ao aquecimento global. Isso afeta aproximadamente 580 milhões de crianças.", "titulo_pt": "Clima quente expõe 580 milhões de crianças a 20 dias a mais de estresse por calor a cada ano", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 125456, "titulo": "Enchentes no Nepal e no Tibete: o que se sabe sobre a tragédia que deixou mortos e centenas de desaparecidos", "url": "https://www.bbc.com/portuguese/articles/ce3rz25qeqdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-26T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma enxurrada repentina na fronteira entre Nepal e Tibete deixou ao menos 31 mortos e centenas de desaparecidos, incluindo quase 400 viajantes. Autoridades apontam terremoto seguido de avalanche como possível causa.", "titulo_pt": "Enchentes no Nepal e no Tibete: o que se sabe sobre a tragédia que deixou mortos e centenas de desaparecidos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 127100, "titulo": "The Campaign to Create Second-Class Citizens", "url": "https://www.theatlantic.com/politics/2026/08/naturalized-citizens-ban-elected-office-trump/688415/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Legisladores do GOP estão propugnando por restrições aos direitos de cidadãos naturalizados e de dupla nacionalidade, incluindo a sua capacidade de concorrer a cargos públicos.", "titulo_pt": "Campanha para criar cidadãos de segunda classe", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 127067, "titulo": "Queensland concedes law imposing mandatory jail on some offenders as young as 10 breaches human rights", "url": "https://www.theguardian.com/australia-news/2026/aug/27/queensland-concedes-law-imposing-mandatory-jail-on-some-offenders-as-young-as-10-breaches-human-rights-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Queensland admitiu que a lei que impõe uma sentença obrigatória de um ano de prisão para alguns infratores, incluindo crianças de 10 anos, viola direitos humanos e aumenta o risco de congestionamento nos presídios. Especialistas alertam que essa lei pode levar a resultados cruéis.", "titulo_pt": "Governo do queensland reconhece que lei de prisão obrigatória para infratores, incluindo crianças de 10 anos, viola direitos humanos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 127068, "titulo": "Albanese vows refugee intake won’t be slashed after earlier reports of Coalition-level cut", "url": "https://www.theguardian.com/australia-news/2026/aug/27/australia-refugees-slashed-labor-migration-pressure-one-nation", "fonte_id": "guardian_world", "data_pub": "2026-08-27T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Anthony Albanese garantiu que o número anual de refugiados em Australia não será cortado no próximo ano financeiro, encerrando planos de reduzir a quota de chegadas em um terço para níveis da era Coalition. Isso veio após relatos de que o ministro de Assuntos Internos, Tony Burke, planejava reduzir o número de 20.000 para 13.750.", "titulo_pt": "Albanese assegura que intake de refugiados não será cortado após relatos de redução", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 127422, "titulo": "Chinese lecturer detained after confessing to murder", "url": "https://www.koreaherald.com/article/10854056", "fonte_id": "korea_herald", "data_pub": "2026-08-27T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor chinês de universidade, de aproximadamente 30 anos, confessou ter assassinado uma estudante chinesa de 25 anos em Gyeongsan, província de Gyeongsang do Norte. Ele admitiu ter matado a vítima e ter mutilado e desfeito o corpo dela. A polícia emitiu um mandado de prisão contra ele.", "titulo_pt": "Professor chinês detido após confessar assassinato", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 126880, "titulo": "7 iniciativas contra a violência à mulher que marcaram este Agosto Lilás", "url": "https://exame.com/bussola/7-iniciativas-contra-a-violencia-a-mulher-que-marcaram-este-agosto-lilas/", "fonte_id": "exame", "data_pub": "2026-08-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Projetos implementados em agosto utilizaram tecnologia, capacitação, transporte público e canais de apoio para aumentar a proteção às mulheres. Estas iniciativas visaram expandir a segurança e o apoio às mulheres em diferentes aspectos.", "titulo_pt": "7 Iniciativas contra a violência à mulher que marcaram este Agosto Lilás", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 127490, "titulo": "State agency fined for leaking personal info of adoptees, missing children", "url": "https://en.yna.co.kr/view/AEN20260827008600315", "fonte_id": "yonhap_news", "data_pub": "2026-08-27T06:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma agência governamental que cuida dos direitos das crianças foi multada por divulgar informações pessoais de adotados e crianças desaparecidas.", "titulo_pt": "Agência governamental multada por divulgar informações pessoais de adotados e crianças desaparecidas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 127366, "titulo": "‘Panic’ as US immigrant visa interview pause hits at least 100 Hong Kong applicants", "url": "https://www.scmp.com/news/hong-kong/society/article/3365428/panic-us-immigrant-visa-interview-pause-hits-least-100-hong-kong-applicants?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T06:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 100 aplicantes de Hong Kong tiveram suas entrevistas de vistos imigrantes postergadas indefinidamente, causando preocupação entre eles. O hiato global nas entrevistas, sinalizando uma restringição mais rigorosa de imigração legal sob o governo Trump, afetou também aplicantes de vistos de estudo e viagem.", "titulo_pt": "Pânico entre aplicantes de Hong Kong com pausa indefinida em entrevistas de vistos nos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127433, "titulo": "[Legal updates in Korea] Educational protections strengthened for abused children", "url": "https://www.koreaherald.com/article/10854436", "fonte_id": "korea_herald", "data_pub": "2026-08-27T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei de Assistência à Criança da Coreia foi atualizada para proteger os direitos educacionais das crianças abusadas e fortalecer as revisões governamentais sobre mortes suspeitas de abuso infantil. Essas mudanças entraram em vigor em 4 de agosto.", "titulo_pt": "Atualizações legais na Coreia fortalecem proteções educacionais para crianças abusadas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 127370, "titulo": "Hong Kong privacy watchdog arrests boxer for allegedly doxxing opponent", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3365420/hong-kong-privacy-watchdog-arrests-boxer-29-allegedly-doxxing-opponent?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vigilante da privacidade de Hong Kong prendeu um boxeador suspeito de divulgar informações pessoais e o local de trabalho do seu adversário sem consentimento nas redes sociais. O suspeito teria atacado o mesmo vítima duas vezes após um torneio de boxe em 2025.", "titulo_pt": "Vigilante de privacidade de hong Kong prende boxeador suspeito de doxxing oponente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127197, "titulo": "Evyatar David, former hostage in Gaza: 'I wake up at night with nightmares, and it haunts me all day long'", "url": "https://www.lemonde.fr/en/international/article/2026/08/27/evyatar-david-former-hostage-in-gaza-i-wake-up-at-night-with-nightmares-and-it-haunts-me-all-day-long_6756887_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-26T23:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Evyatar David, libertado em outubro de 2025 após 738 dias em captivity em Gaza, foi filmado pelos hamás enterrando-se vivo. Ele discutiu as marcas psicológicas deixadas pelo seu trauma em uma entrevista com a CNN.", "titulo_pt": "Evyatar David, ex-refém em Gaza: 'acordo à noite com pesadelos e isso me assombra durante todo o dia'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 127105, "titulo": "Remembering a Genocide: The View From the Rohingya Camps", "url": "https://thediplomat.com/2026/08/remembering-a-genocide-the-view-from-the-rohingya-camps/", "fonte_id": "the_diplomat", "data_pub": "2026-08-26T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove anos após o genocídio, refugiados rohingya ainda aguardam justiça e a volta para suas casas. No entanto, eles não perderam a esperança.", "titulo_pt": "Lembrando um genocídio: a visão dos acampamentos Rohingya", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 126674, "titulo": "Ex-Pussy Riot Member Says She Was Recruited by Russia to Spy on Artists", "url": "https://hyperallergic.com/ex-pussy-riot-member-says-she-was-recruited-by-russia-to-spy-on-artists/", "fonte_id": "hyperallergic", "data_pub": "2026-08-26T19:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Margarita Konovalova, que se apresentou na coletiva artística sob o pseudônimo Rita Flores, fugiu da Rússia recentemente com a ajuda de seu advogado.", "titulo_pt": "Ex-membro do pussy Riot diz que foi recrutada pela Rússia para espionar artistas", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 125365, "titulo": "Brasil tem quase 29 milhões de mulheres vítimas de violência em 12 meses", "url": "https://www.cnnbrasil.com.br/nacional/brasil/brasil-tem-quase-29-milhoes-de-mulheres-vitimas-de-violencia-em-12-meses/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Mapa Nacional da Violência de Gênero indica que quase 29 milhões de mulheres no Brasil relataram ter passado por situações de violência em um período de 12 meses, mas apenas 13% delas reconheceram essas situações espontaneamente como violência.", "titulo_pt": "Brasil tem quase 29 milhões de mulheres vítimas de violência em 12 meses", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125519, "titulo": "¿Puede haber justicia sin acceso a tu propia lengua? La exclusión sistemática de la comunidad sorda", "url": "https://www.ciperchile.cl/2026/08/26/puede-haber-justicia-sin-acceso-a-tu-propia-lengua-la-exclusion-sistematica-de-la-comunidad-sorda/?utm_source=rss&utm_medium=rss&utm_campaign=puede-haber-justicia-sin-acceso-a-tu-propia-lengua-la-exclusion-sistematica-de-la-comunidad-sorda", "fonte_id": "ciper_chile", "data_pub": "2026-08-26T12:10:00Z", "idioma": "es", "provavel_dupli           return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {

    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;

      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>

  noticias: { rotulo: "Todas as Notícias", render() {

    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {

function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
