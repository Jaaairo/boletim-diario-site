d/de-un-vaso-descartable-a-una-bota-los-inesperados-residuos-humanos-hallados-a-miles-de-metros-bajo-nid13102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-13T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Conicet analisaram 240 horas de imagens obtidas durante a missão Talud Continental IV, descobrindo inesperados resíduos humanos a milhares de metros abaixo do Mar Argentino.", "titulo_pt": "De um copo descartável a uma bota: os inesperados resíduos humanos encontrados a milhares de metros no Mar Argentino", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 212468, "titulo": "Hurricane Simon and Tropical Storm Rachel kill five people on Mexico’s Pacific coast", "url": "https://www.theguardian.com/world/2026/oct/13/mexico-hurricane-simon-tropical-storm-rachel-kill-five-pacific-coast", "fonte_id": "guardian_world", "data_pub": "2026-10-13T04:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hurricane Simon e a Tropical Storm Rachel mataram cinco pessoas na costa do Pacífico do México, causando alagamentos que derrubaram árvores e postes de eletricidade, bloquearam estradas e inundaram casas. Forças de segurança usaram helicópteros para resgatar dezenas de pessoas.", "titulo_pt": "Cyclone Simon e tempestade Tropical Rachel matam cinco pessoas na costa do pacífico do México", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 212244, "titulo": "Juíza dá vitória a ambientalistas e manda Trump suspender corte de árvores em campo de golfe", "url": "https://veja.abril.com.br/mundo/juiza-da-vitoria-a-ambientalistas-e-manda-trump-suspender-corte-de-arvores-em-campo-de-golfe/", "fonte_id": "veja", "data_pub": "2026-10-12T22:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A juíza determinou que o governo de Donald Trump deve suspender a corte de árvores em um campo de golfe. Cerca de 500 árvores caíram no fim de semana, parte de projetos semelhantes aos propostos pelo presidente nos arredores de Washington, D.C.", "titulo_pt": "Juíza veta corte de árvores em campo de golfe e mantém decisão ambientalista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 211903, "titulo": "Intensas lluvias y granizos provocan inundaciones en Curacautín: hay al menos 20 viviendas afectadas", "url": "https://www.latercera.com/nacional/noticia/intensas-lluvias-y-granizos-provocan-inundaciones-en-al-menos-20-viviendas-de-curacautin/", "fonte_id": "la_tercera", "data_pub": "2026-10-12T21:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Intensas chuvas e granizo causaram inundações em Curacautín, com pelo menos 20 residências afetadas. O aumento repentino do nível dos esteros locais foi atribuído à precipitação intensa.", "titulo_pt": "Intensas chuvas e granizo causam inundações em Curacautín: pelo menos 20 casas afetadas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 212111, "titulo": "Hurricane Simon lashes Mexico's Pacific coast, threatens landfall", "url": "https://phys.org/news/2026-10-hurricane-simon-lashes-mexico-pacific.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Simon atingiu fortemente a costa do Pacífico do México com ventos violentos e chuvas intensas na segunda-feira. O Centro Nacional de Furacões dos Estados Unidos informou que o furacão ameaça fazer terra firme na região esta semana.", "titulo_pt": "Furacão Simon castiga costa do pacífico do México e ameaça tocar terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 211823, "titulo": "Furacão Simon causa inundações na costa do México no Pacífico", "url": "https://www.infomoney.com.br/mundo/furacao-simon-causa-inundacoes-na-costa-do-mexico-no-pacifico/", "fonte_id": "infomoney", "data_pub": "2026-10-12T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Simon causou inundações na costa do México no Oceano Pacífico.", "titulo_pt": "Furacão Simon causa inundações na costa do México no Pacífico", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 211016, "titulo": "Jueza ordena detener tala de árboles en campo de golf que Trump quiere renovar", "url": "https://www.clarin.com/estados-unidos/jueza-ordena-detener-tala-de-arboles-en-campo-de-golf-que-trump-quiere-renovar_0_gMG6BFfzYA.html", "fonte_id": "clarin", "data_pub": "2026-10-12T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma juíza ordenou a paralisação da derrubada de árvores em um campo de golfe em Washington, após alertas ambientalistas sobre a remoção em massa de árvores. O presidente Trump está promovendo projetos de renovação na capital, enfrentando críticas por supostos gastos desnecessários, incluindo a reforma do salão de baile da Casa Branca.", "titulo_pt": "Juíza suspende derrubada de árvores em campo de golfe onde Trump quer renovar", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 211017, "titulo": "Hackers atacaron supermercados en Francia y llevaron las heladeras a 50 grados: hubo incendios y pérdidas de alimentos", "url": "https://www.clarin.com/tecnologia/hackers-atacaron-supermercados-francia-llevaron-heladeras-50-grados-incendios-perdidas-alimentos_0_SJ5fjZuGbz.html", "fonte_id": "clarin", "data_pub": "2026-10-12T17:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um ciberataque afetou os sistemas de refrigeração de centenas de supermercados franceses, causando a elevação da temperatura das geladeiras para 50 graus durante seis horas em cerca de 150 lojas da rede Intermarché, resultando no descarte de alimentos. Em Países Bajos, ocorreram ataques semelhantes.", "titulo_pt": "Hackers atacaram supermercados na França e nos países baixos, elevando as temperaturas das geladeiras a 50 graus", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 210755, "titulo": "África bate recorde de energia solar, mas dados oficiais não registram avanço, diz relatório", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/africa-bate-recorde-de-energia-solar-mas-dados-oficiais-nao-registram-avanco-diz-relatorio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A África registrou um recorde de instalação de painéis solares em 2026, com 17 GW previstos até o final do ano, um aumento de 45% em relação a 2025. No entanto, esse avanço não é refletido nas estatísticas oficiais devido a limitações nos dados nacionais, segundo relatório das organizações Ember e African Tech Futures Lab.", "titulo_pt": "África bate recorde de energia solar, mas dados oficiais não registram avanço, diz relatório", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 210912, "titulo": "Furacão Simon é rebaixado para categoria 2, mas ainda ameaça México", "url": "https://www.cnnbrasil.com.br/internacional/furacao-simon-e-rebaixado-para-categoria-2-mas-ainda-ameaca-mexico/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Simon foi rebaixado para categoria 2, mas ainda representa uma ameaça para o México. A tempestade está na costa do país com ventos sustentados de 175 quilômetros por hora. Uma pessoa morreu no estado de Guerrero, segundo autoridades.", "titulo_pt": "Furacão Simon rebaixado para categoria 2, mas ainda ameaça México", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 211566, "titulo": "Interactive: Tracking negotiating texts at the COP17 biodiversity summit", "url": "https://www.carbonbrief.org/interactive-tracking-negotiating-texts-at-the-cop17-biodiversity-summit", "fonte_id": "carbon_brief", "data_pub": "2026-10-12T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diplomatas de todo o mundo se reunirão na cidade de Yerevan, Armênia, na próxima semana para negociar uma série de decisões sob o acordo da COP17 sobre biodiversidade.", "titulo_pt": "Interativo: monitorando os textos de negociação na COP17 de biodiversidade", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 210864, "titulo": "Foco de incêndio na Amazônia indica ação intencional, diz ministro", "url": "https://exame.com/esg/foco-de-incendio-na-amazonia-indica-acao-intencional-diz-ministro/", "fonte_id": "exame", "data_pub": "2026-10-12T14:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro João Paulo Capobianco indicou que há indícios de ação criminosa no incêndio na Amazônia. A Força Aérea enviou aeronaves KC-390 para reforçar as operações de combate às chamas.", "titulo_pt": "Foco de incêndio na Amazônia indica ação intencional, diz ministro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 211106, "titulo": "Rescued turtles return home after NSW government cut flows to wetland", "url": "https://www.theguardian.com/australia-news/2026/oct/13/rescued-turtles-return-home-after-nsw-government-cut-flows-to-wetland", "fonte_id": "guardian_world", "data_pub": "2026-10-12T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tartarugas resgatadas de um buraco seco na região ocidental de New South Wales foram devolvidas à natureza após a liberação de água ambiental no Gingham water hole. A medida foi tomada após uma reclamação de um proprietário de terra privada, resultando na morte de animais e ovelhas.", "titulo_pt": "Tartarugas resgatadas retornam à casa após estado cortar fluxo d'água na área", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 211326, "titulo": "Paris’s oldest covered food market gutted by major overnight fire", "url": "https://www.euronews.com/video/2026/10/12/pariss-oldest-covered-food-market-gutted-by-major-overnight-fire", "fonte_id": "euronews", "data_pub": "2026-10-12T13:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu o mercado coberto mais antigo de Paris, localizado no bairro do Marais, deixando os comerciantes desolados. A investigação está em andamento e o mercado pode permanecer fechado por meses.", "titulo_pt": "Incêndio destrói mercado coberto mais antigo de paris", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 211329, "titulo": "Video shows major fire ravaging 400-year-old Paris food market", "url": "https://www.euronews.com/2026/10/12/video-shows-major-fire-ravaging-400-year-old-paris-food-market", "fonte_id": "euronews", "data_pub": "2026-10-12T12:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma grande chama noturna destruiu o mercado coberto de alimentos mais antigo de Paris, que tem 400 anos de história. As imagens mostram o estado destruído do local após o incêndio.", "titulo_pt": "Vídeo mostra incêndio devastador no mercado de alimentos mais antigo de Paris, com 400 anos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 212625, "titulo": "Dozens of journalists in India detained while covering anti-gov’t protests", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/13/dozens-of-journalists-in-india-detained-while-covering-anti-govt-protests?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-13T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Policiais indianos detiveram pelo menos 35 jornalistas que estavam cobrindo protestos contra o governo em Nova Deli por um período de 48 horas.", "titulo_pt": "Várias jornalistas detidas na Índia enquanto cobriam protestos contra o governo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 212388, "titulo": "Leila Guerriero, finalista del Premio PEN–Inge Feltrinelli por su trayectoria en defensa de la dignidad humana", "url": "https://www.lanacion.com.ar/cultura/leila-guerriero-finalista-del-premio-peninge-feltrinelli-por-su-trayectoria-en-defensa-de-la-nid13102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-13T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A jornalista argentina Leila Guerriero foi nomeada finalista para o Premio PEN–Inge Feltrinelli, junto com a escritora nicaraguense Gioconda Belli, um escritor exilado chino e quatro autores eritreos desaparecidos há 25 anos. O vencedor será anunciado em novembro.", "titulo_pt": "Leila Guerriero, finalista para o Premio PEN–Inge Feltrinelli por sua trajetória em defesa da dignidade humana", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 212572, "titulo": "After ban of one stun grenade, French police continue to use a different model", "url": "https://www.lemonde.fr/en/france/article/2026/10/13/after-ban-of-one-stun-grenade-french-police-continue-to-use-a-different-model_6758546_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Interior da França suspendeu o uso da granada de choque EF-SON após um estudante de 15 anos perder a mão em 5 de outubro. Na seguinte noite, em 6 de outubro, uma granada de choque diferente, a GL-304, foi usada na Place de la Bastille, resultando em ferimentos leves em duas pessoas.", "titulo_pt": "Após proibição de uma granada de choque, polícia francesa continua a usar modelo diferente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 212336, "titulo": "Violência processual de gênero: quando o processo fere", "url": "https://www.jota.info/opiniao-e-analise/colunas/juizo-de-valor/violencia-processual-de-genero-quando-o-processo-fere", "fonte_id": "jota", "data_pub": "2026-10-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um contributo do Intervid ao CNJ propõe a criação de uma categoria específica para identificar casos de violência processual de gênero, distingindo-a da litigância abusiva.", "titulo_pt": "Violência processual de gênero: quando o processo fere", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 212752, "titulo": "Hong Kong police arrest 20 over prostitution syndicate that trapped women in debt", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3370704/hong-kong-police-arrest-20-over-prostitution-syndicate-trapped-women-debt?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-13T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong prendeu 20 pessoas relacionadas a uma quadrilha de prostituição transfronteiriça que supostamente recrutava mulheres da Ásia Oriental e as obrigava a fornecer serviços sexuais não remunerados para pagar dívidas de viagem. As mulheres tinham que fornecer entre 30 e 45 atos sexuais sem remuneração antes de poderem ganhar dinheiro com a prostituição, e tinham que entregar metade dos lucros obtidos.", "titulo_pt": "Polícia de hong Kong prende 20 pessoas em escala de prostituição com dívida de viagem", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 212477, "titulo": "Same-sex couple sue over Slovakia’s refusal to register marriage", "url": "https://www.theguardian.com/world/2026/oct/13/same-sex-couple-sue-slovakia-refusal-register-austrian-marriage-eu", "fonte_id": "guardian_world", "data_pub": "2026-10-13T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um casal gay está processando autoridades na Eslováquia por não registrarem sua união legalmente realizada na Áustria. O caso expõe a contradição entre uma decisão da Corte Europeia de Justiça e as restrições nacionais, e suas implicações para as pessoas LGBTQ+ sob o governo populista e nacionalista de Robert Fico.", "titulo_pt": "Casal gay processa eslováquia por não registrar casamento realizado na áustria", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 212683, "titulo": "HR doesn’t need to be the CIA", "url": "https://www.ft.com/content/16e1d29b-3680-4712-b8e7-ed4a4125041a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-13T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso fraudulento de inteligência artificial no processo de contratação está obrigando os setores tradicionalmente focados em pessoas e relacionamentos a trabalharem mais de perto com as áreas mais suspeitas e analíticas.", "titulo_pt": "Rh não precisa ser a CIA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 212882, "titulo": "Over 8,000 children in need of humanitarian assistance following the Panama earthquake", "url": "https://www.unicef.org/press-releases/over-8000-children-need-humanitarian-assistance-following-panama-earthquake", "fonte_id": "unicef", "data_pub": "2026-10-13T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 8.000 crianças necessitam de assistência humanitária após o terremoto na Panamá. A UNICEF e o governo panamenho estão fornecendo suprimentos de emergência para atender às necessidades em saúde, água e saneamento, educação e proteção infantil.", "titulo_pt": "Mais de 8.000 crianças precisam de assistência humanitária após terremoto na panamá", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 211801, "titulo": "“Não serei silenciada”, diz deputada democrata alvo de buscas do ICE", "url": "https://www.cnnbrasil.com.br/internacional/nao-serei-silenciada-diz-deputada-democrata-alvo-de-buscas-do-ice/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes do ICE realizaram uma operação de busca na residência da deputada democrata Ilhan Omar na madrugada desta segunda-feira. Omar declarou que não será silenciada.", "titulo_pt": "‘Não seremos silenciadas’, diz deputada democrata alvo de buscas do ICE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 211529, "titulo": "Woman in her 20s dies after collapsing during Seoul Race half-marathon", "url": "https://www.koreaherald.com/article/10900181", "fonte_id": "korea_herald", "data_pub": "2026-10-12T13:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de vinte e poucos anos morreu após cair próximo ao final da linha de chegada durante a metade da maratona Seoul Race em 2026. Ela recebeu atendimento cardíopulmonar de ressuscitação no local, mas não recuperou a consciência e faleceu em um hospital próximo.", "titulo_pt": "Mulher de vinte e poucos anos morre após cair durante metade da maratona Seoul Race", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 211530, "titulo": "Rights watchdog scraps recommendation on Yoon's right to defense, plans apology", "url": "https://www.koreaherald.com/article/10900178", "fonte_id": "korea_herald", "data_pub": "2026-10-12T13:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselho nacional de direitos humanos da Coreia decidiu revogar sua recomendação anterior sobre a garantia do direito de defesa do ex-presidente Yoon Suk Yeol durante seu julgamento de impeachment no Tribunal Constitucional. O conselho também aprovou uma proposta de publicar uma compensação por ter emitido a recomendação. O presidente do conselho, Ahn Chang-ho, absteve-se do voto, pois foi nomeado por Yoon.", "titulo_pt": "Órgão de direitos humanos revoga recomendação sobre direito de defesa de Yoon e planeja compensação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 211524, "titulo": "Rights watchdog to offer public apology over recommendation on Yoon's right to defense", "url": "https://en.yna.co.kr/view/AEN20261012009300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T11:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instituição responsável pelos direitos humanos do estado decidiu oferecer uma compensação pública devido a uma recomendação sobre o direito de defesa de Yoon.", "titulo_pt": "Órgão de direitos humanos vai oferecer compensação pública por recomendação sobre direito de defesa de Yoon", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210142, "titulo": "Por que pena de morte persiste nos Estados Unidos? Americanos apoiam", "url": "https://veja.abril.com.br/coluna/mundialista/por-que-pena-de-morte-persiste-nos-estados-unidos-americanos-apoiam/", "fonte_id": "veja", "data_pub": "2026-10-12T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os casos de Christa Pike e Nidal Hasan têm agitado a discussão sobre a pena de morte nos Estados Unidos, mas a maioria da população ainda apoia essa prática.", "titulo_pt": "Por que a pena de morte persiste nos Estados Unidos? Americanos apoiam", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 210551, "titulo": "UNRWA warns Gaza is becoming an increasingly unlivable place", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/unrwa-health-chief-gaza/", "fonte_id": "japan_times", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O UNRWA alerta que Gaza enfrenta persistentes escassezes de suprimentos médicos devido a restrições nas entregas. As condições de higiene também permanecem ruins.", "titulo_pt": "UNRWA avisa que Gaza está se tornando um lugar cada vez menos habitável", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 210704, "titulo": "Statement by Etleva Kadilli, UNICEF Regional Director for Eastern and Southern Africa, on the tragic loss of lives, including at least 15 children, after migrant boat capsized off the coast of Djibouti", "url": "https://www.unicef.org/press-releases/statement-etleva-kadilli-unicef-regional-director-eastern-and-southern-africa-tragic", "fonte_id": "unicef", "dat const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
