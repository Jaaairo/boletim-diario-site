<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

os Unidos considera impor sanções contra um juiz brasileiro, representando um novo desafio nas relações diplomáticas entre os países. O Irã ofereceu uma recompensa de US$ 30 mil por morte ou captura de soldados americanos, oferecendo o dobro para mulheres. Em outro incidente, quatro obras de arte renascentistas foram roubadas de um museu na Sicília, Itália. Na Ucrânia, ataques russos destruíram um mercado de livros em Kiev, causando feridos e mortos. O Palio di Siena, um evento cultural, foi adiado devido à chuva. No Afeganistão, o Taliban comemorou o aniversário de cinco anos de seu retorno ao poder, com preocupações sobre possíveis abusos de direitos humanos. Na Romênia, um drone russo foi abatido por um caça da Otan.\n\nOs Estados Unidos têm intensificado suas medidas geopolíticas, pressionando seus aliados a escolher entre alinhamento com os EUA ou com a China. O governo americano impôs tarifas sobre drones chineses, aprofundando o desacoplamento econômico. O israelense Rom Braslavski, que já esteve preso, pediu ao ministro da Segurança Pública de Israel, Bezalel Ben Gvir, que permitisse a execução de prisioneiros palestinos. O Irã ofereceu uma recompensa de 30.000 dólares para a captura ou morte de soldados americanos, em resposta a pedidos para participar de operações. O conflito entre Israel e Gaza continua, com o ministro de Segurança Nacional de Israel, Itamar Ben-Gvir, chamando para assassinatos noturnos de palestinos em Gaza. Na Ucrânia, ataques com drones e mísseis causaram mortes em Moscou, enquanto a Rússia realizou ataques aéreos noturnos contra uma fábrica de aço na Ucrânia. O Irã e Omã trabalham em um roteiro marítimo temporário pelo Estreito de Ormuz, enquanto o presidente dos Estados Unidos ameaça tornar o estreito uma área americana. A Alemanha escolheu Israel sobre a lei internacional, de acordo com um artigo publicado recentemente.", "economia": "O rendimento pessoal anual médio atingiu um novo recorde, indicando um avanço econômico. No entanto, várias empresas enfrentam dificuldades. O Grupo Toky registrou um prejuízo de R$ 232,7 milhões no segundo trimestre. A Casas Bahia também enfrenta problemas financeiros, com um prejuízo de R$ 10,1 bilhões, e está avaliando uma nova recuperação extrajudicial ou judicial. O cenário macroeconômico afeta o varejo, com a Renner reduzindo suas projeções de crescimento. O Brasil busca alternativas para exportar gado para os EUA devido às tarifas elevadas na China. Em um projeto chamado Futuros Verdes no Nordeste, o setor produtivo busca oportunidades econômicas para a transição para uma economia de baixo carbono. O empreendedorismo após os 60 anos está crescendo no Brasil, redefinindo o conceito de trabalho para essa faixa etária. Além disso, a economia está se tornando mais inovadora e baseada em dados, mas há dúvidas sobre a replicabilidade e o uso da inteligência artificial nesse campo.", "tecnologia": "A tecnologia tem sido um tema central em diversos aspectos, desde a inteligência artificial até os gadgets domésticos. A Alibaba lidera o setor de inteligência artificial (IA) com mais de 3 bilhões de downloads de seus modelos de IA, superando concorrentes como a Meta e a Alphabet. Por outro lado, a Nvidia reduziu a garantia de financiamento para o centro da OpenAI, sinalizando mudanças no financiamento de projetos de IA. Na área de IA, o aplicativo desktop do ChatGPT registra cliques e teclas para criar um perfil de atividades, sugerindo automações, enquanto a IA de uma empresa fundada por Elon Musk foi acusada de transformar imagens antigas em conteúdo sexual explícito. Em outro desenvolvimento, a Nvidia prometeu manter os preços dos componentes estáveis durante esta semana, enquanto a Porsche apresentou o Porsche Connect, um ecossistema que conecta o veículo ao smartphone do motorista, oferecendo mais de 150 funcionalidades para conveniência, segurança e gestão do automóvel. Além disso, a Exame destacou a importância de quem controla a infraestrutura para o futuro da inovação, apontando para a dificuldade de atrair investimentos de venture capital.", "ciencia": "A China enviou um navio-container pelo Ártico, reduzindo o tempo de viagem para a Europa pela metade, mas levantando preocupações ambientais sobre o acelerado derretimento da geleada polar. De acordo com a NASA, protótipos de 'aerobots' esféricos estão sendo financiados para explorar as cavernas de Titã, satélite de Saturno, em uma missão semelhante à missão Ingenuity em Marte. Astrônomos do MIT descobriram um novo tipo de objeto astrológico que emite 100 bilhões de vezes mais energia do que qualquer estrela conhecida, revelando uma estrutura vermelha brilhante no universo primitivo. Além disso, um medicamento cardíaco antigo, com custo inferior a dez centavos por dia, pode reduzir hospitalizações de pacientes com insuficiência cardíaca em cerca de 25%, conforme pesquisas recentes.", "cultura": "Em 2026, o cinema tem sido palco de importantes lançamentos, como 'Feito Pipa', que emocionou o público em Gramado, com a participação do ator Lázaro Ramos. A novela 'Por Você', exibida pela Globo, apresenta uma trama inusitada: médicas que se envolvem em uma briga em um supermercado durante um parto. No âmbito da arte, a exposição 'Território Inventivo Pequena África', no Rio de Janeiro, celebra a resistência da Pequena África no Cais do Valongo. O Museu do Samba no Rio de Janeiro comemora 25 anos, destacando seu trabalho de preservação e projetos sociais. No cenário internacional, quatro pinturas renascentistas de Antonello da Messina foram roubadas de um museu na Sicília, levantando preocupações sobre a segurança de obras de arte valiosas. A série 'Lanterna Verde' na HBO explora mitos dos super-heróis, enquanto a novela 'Por Você' na Globo oferece um novo formato para a novela brasileira, misturando drama com comédia em um cenário inusitado.", "sociedade": "O Ministério da Educação (MOE) planeja expandir o treinamento em primeiros socorros para os professores nas escolas, com o objetivo de melhorar a resposta a emergências. Em outra notícia, Flávio Bolsonaro criticou o governo federal, afirmando que o presidente deixou um legado de incompetência e corrupção. Várias situações de violência e desigualdade social foram relatadas, incluindo a morte de uma criança autista em um tanque de dejetos e a prisão de um grupo suspeito de envolvimento no sequestro e cárcere privado de uma menina de 14 anos. Além disso, a justiça ordenou a reparação de corredores nacionais no Chile, mas a implementação enfrenta dificuldades. A Tailândia, por outro lado, enfrenta um exílio de trabalhadores migrantes após conflitos com o Camboja. Em Hong Kong, a desigualdade de renda aumenta e a população envelhece, ameaçando a estrutura social da cidade.", "meio_ambiente": "Um terremoto de magnitude 7,7 na Indonésia causou 53 mortos e deixou mais de 5 mil desabrigados na ilha de Flores. As buscas por sobreviventes continuam, com 135 feridos e trabalhos de busca, resgate e atendimento às vítimas em andamento. Por outro lado, um climatologista alerta para a aceleração dos eventos climáticos extremos devido às mudanças climáticas, mantendo uma postura otimista. A seca afeta metade da Europa, com rios como o Danúbio e o Reno em estado crítico, enquanto novas imagens de satélite mostram a desova desses rios. No Brasil, um estudante de 14 anos criou bandejas biodegradáveis a partir de cáscaras de yuca para reduzir a poluição plástica. Equipes de bombeiros combatem incêndios em áreas naturais na Bélgica e na Grécia, com dois mortos em uma ilha perto de Atenas. Em Indiana, inundações deixaram pelo menos seis mortos, e em Chiba, no Japão, o número de mortos devido às fortes chuvas aumentou para nove, com quase 500 pessoas evacuadas.", "direitos_humanos": "A Comissão Nacional de Direitos Humanos criticou recentemente uma proposta de chicotear, expressando preocupações sobre as potenciais consequências da medida. Cinco anos após o retorno do governo do Taliban ao Afeganistão, uma repórter especial do Le Monde conversou com mulheres afegãs sobre suas experiências de opressão, incluindo medos diários, casamentos forçados e a perda de sonhos. Em Hong Kong, um adolescente de 14 anos foi preso suspeito de maus-tratos após levar um gato gravemente ferido a um clínico veterinário, que posteriormente morreu. Um médico relatou a amputação de uma menina de uma perna em Gaza sem anestesia, enquanto colonos israelenses continuaram a atacar palestinos no Território Ocidental, causando ferimentos e danos a veículos. O texto sobre os direitos dos privados de liberdade discute as garantias e proteções legais para pessoas detidas, mas não fornece detalhes adicionais sobre o conteúdo."}, "resumo_do_dia": {"politica_nacional": [{"id": 105482, "titulo": "Deputado aciona Justiça contra número dado a irmão de Michelle Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/deputado-aciona-justica-contra-numero-dado-a-irmao-de-michelle-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado distrital Roosevelt Vilela acionou a Justiça Eleitoral contra o número do candidato Eduardo Torres, irmão de Michelle Bolsonaro, no Partido Liberal (PL).", "titulo_pt": "Deputado aciona Justiça contra número dado a irmão de Michelle Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 105625, "titulo": "A escolha do Novo sobre a disputa ao Senado no Rio", "url": "https://veja.abril.com.br/politica/a-escolha-do-novo-sobre-a-disputa-ao-senado-no-rio/", "fonte_id": "veja", "data_pub": "2026-08-16T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido anunciará sua posição sobre a disputa ao Senado no Rio na segunda-feira.", "titulo_pt": "A escolha do Novo sobre a disputa ao Senado no Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 105550, "titulo": "‘Toda a direita vai estar unida no 2º turno’, diz Romeu Zema no 1º dia de campanha", "url": "https://www.infomoney.com.br/mercados/toda-a-direita-vai-estar-unida-no-2o-turno-diz-romeu-zema-no-1o-dia-de-campanha/", "fonte_id": "infomoney", "data_pub": "2026-08-16T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema afirmou que toda a direita estará unida no segundo turno das eleições. Durante o primeiro dia de campanha, ele enfatizou sua atuação em atrair investimentos e criticou a política internacional do governo Lula.", "titulo_pt": "Toda a direita estará unida no segundo turno, diz Romeu Zema no primeiro dia de campanha", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 105599, "titulo": "Flávio inicia campanha no berço do bolsonarismo, em ato mais esvaziado do que os do pai", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-inicia-campanha-no-berco-do-bolsonarismo-em-ato-mais-esvaziado-do-que-os-do-pai", "fonte_id": "jota", "data_pub": "2026-08-16T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro iniciou sua campanha em São Paulo, enfrentando o desafio de reduzir a distância para Lula nas pesquisas. Michelle Bolsonaro não participou do evento.", "titulo_pt": "Flávio inicia campanha no berço do bolsonarismo, em ato mais esvaziado do que os do pai", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 105611, "titulo": "José Roberto Arruda começa campanha em disputa pelo GDF", "url": "https://www.metropoles.com/distrito-federal/jose-roberto-arruda-comeca-campanha-em-disputa-pelo-gdf", "fonte_id": "metropoles", "data_pub": "2026-08-16T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Roberto Arruda participou de uma missa no comitê político pela manhã e havia planejado uma caminhada com Caiado em Novo Gama, mas a agenda foi cancelada. O candidato está em disputa pelo cargo de governador do Distrito Federal.", "titulo_pt": "José Roberto Arruda inicia campanha pelo GDF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 105483, "titulo": "Mar de lama ou instituições funcionando?", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcus-melo/2026/08/mar-de-lama-ou-instituicoes-funcionando.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A realização de muitas operações policiais no país está criando uma crise de confiança entre a sociedade e um aumento da percepção de capacidade institucional. A corrupção se torna mais visível à medida que o sistema de controle funciona, o que pode levar a conclusões negativas sobre a integridade do sistema.", "titulo_pt": "Mar de lama ou capacidade institucional?", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 105457, "titulo": "Eleições 2026: veja a agenda de Lenilda Luna neste domingo (16)", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/16/eleicoes-2026-veja-a-agenda-de-lenilda-luna-neste-domingo-16.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lenilda Luna, candidata ao Governo de Alagoas pelo partido UP, iniciou sua campanha eleitoral neste domingo (16) com um ato no bairro do Vergel do Lago, em Maceió, às 16h. A propaganda eleitoral está permitida a partir deste dia, conforme o calendário estabelecido pelo Tribunal Superior Eleitoral (TSE).", "titulo_pt": "Lenilda Luna inicia campanha eleitoral no vergel do lago neste domingo (16)", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 105600, "titulo": "Ato de campanha no ABC enaltece história de Lula, mas aponta pouco para o futuro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/ato-de-campanha-no-abc-enaltece-historia-de-lula-mas-aponta-pouco-para-o-futuro", "fonte_id": "jota", "data_pub": "2026-08-16T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente participou de um evento no estádio da Vila Euclides, no ABC, onde reforçou sua história política. O discurso, no entanto, ofereceu poucas perspectivas sobre o futuro.", "titulo_pt": "Ato de campanha no ABC reforça história de Lula, mas esboça pouco para o futuro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 105458, "titulo": "Ao lado de Lula, Haddad faz primeiro ato de campanha ao governo de SP em São Bernardo do Campo", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/16/haddad-lanca-campanha-ao-governo-de-sp-em-comicio-de-lula-em-sao-bernardo-do-campo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernando Haddad (PT) participou do primeiro ato de sua campanha ao governo de São Paulo, durante o comício de início da campanha à reeleição de Luiz Inácio Lula da Silva (PT) em São Bernardo do Campo, no ABC Paulista. O evento foi escolhido por ser a cidade onde Lula iniciou sua trajetória política.", "titulo_pt": "Ao lado de Lula, Haddad faz primeiro ato de campanha ao governo de SP em São Bernardo do Campo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 105518, "titulo": "TSE determina remoção de vídeo que associa Lula ao PCC e ao CV", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/tse-determina-remocao-de-video-que-associa-lula-ao-pcc-e-ao-cv", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-16T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral determinou a remoção de um vídeo publicado por Flávio Bolsonaro que associa Lula ao PCC e ao CV. A decisão foi tomada após uma ação movida pela Federação Brasil da Esperança, que acusou Flávio de propaganda antecipada e associação falsa do presidente a organizações criminosas.", "titulo_pt": "TSE determina remoção de vídeo que associa Lula ao PCC e ao CV", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 105484, "titulo": "Michelle Bolsonaro dá largada à candidatura ao Senado: 'Missão que meu marido me confiou'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/michelle-bolsonaro-da-largada-a-candidatura-ao-senado-missao-que-meu-marido-me-confiou.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro anunciou sua candidatura ao Senado pelo Distrito Federal, afirmando que é a missão confiada por seu marido, o ex-presidente Jair Bolsonaro.", "titulo_pt": "Michelle Bolsonaro lança candidatura ao Senado: 'missão que meu marido me confiou'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 105485, "titulo": "Flávio começa campanha em Copacabana, reproduz áudio de Bolsonaro e diz que país olha para Brasília 'com nojo'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-comeca-campanha-em-copacabana-reproduz-audio-de-bolsonaro-e-diz-pais-olha-para-brasilia-com-nojo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro iniciou sua campanha eleitoral em Copacabana, no Rio de Janeiro, criticando o governo Lula. Durante o discurso, ele reproduziu um áudio do pai, Jair Bolsonaro, e afirmou que o país olha para Brasília com nojo.", "titulo_pt": "Flávio inicia campanha em Copacabana, reproduz áudio de Bolsonaro e critica governo lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 105459, "titulo": "Tarcísio inicia campanha em Osasco com presença de 9 prefeitos e lideranças partidárias", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/16/tarcisio-da-pontape-inic lish", "pais": "Catar", "classe": "B"}, {"id": 105888, "titulo": "Israeli army besieges Palestinian homes in occupied West Bank", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/16/israeli-army-besieges-palestinian-homes-in-occupied-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-16T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças do Exército israelense cercaram casas palestinas na aldeia de Qusra, localizada sul de Nablus, na Cisjordânia ocupada.", "titulo_pt": "Exército israelense cercou casas palestinas em qusra, sul de nablus, cisjordânia ocupada", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 105826, "titulo": "Two dead and hundreds evacuated as twin fires break out on Greek island", "url": "https://www.bbc.co.uk/news/articles/c87nnwlpe5no?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-16T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois pessoas morreram e centenas foram evacuadas devido a dois incêndios que eclodiram na ilha grega de Salamina. Cerca de 200 bombeiros estão tentando manter os dois focos de fogo separados.", "titulo_pt": "Dois mortos e centenas evacuadas em incêndios duplos na Grécia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 105524, "titulo": "Chefe do comando central dos EUA visita porta-aviões USS Abraham Lincoln", "url": "https://www.cnnbrasil.com.br/internacional/chefe-do-comando-central-dos-eua-visita-porta-avioes-uss-abraham-lincoln/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe do comando central dos Estados Unidos visitou o porta-aviões USS Abraham Lincoln. A viagem ocorreu em um momento de crescente preocupação com a saúde mental dos tripulantes devido à longa mobilização no Oriente Médio.", "titulo_pt": "Chefe do comando central dos EUA visita porta-aviões USS Abraham Lincoln", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 105851, "titulo": "UAE, Saudi Arabia, others condemn Israel's rejection of Trump Gaza plan", "url": "https://www.dw.com/en/uae-saudi-arabia-others-condemn-israel-s-rejection-of-trump-gaza-plan/a-78389399?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-16T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel rejeitou o plano de paz proposto por Donald Trump para Gaza. Representantes do Emirados Árabes Unidos, Arábia Saudita e outros condenaram essa rejeição. Enviados dos EUA Jared Kushner e Nickolay Mladenov estavam negociando um cessar-fogo e a implementação do plano em Cairo, Egito.", "titulo_pt": "Emirados árabes unidos, arábia saudita, outros condenam rejeição de Israel ao plano de paz de Trump para Gaza", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 105926, "titulo": "Report: US envoy Kushner meets Hamas leaders in Egypt", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/report-us-envoy-kushner-meets-hamas-leaders-egypt", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jared Kushner, enviado especial de Donald Trump, se reuniu com líderes do Hamas em Egito. Durante a reunião, o Hamas reafirmou seu compromisso com um acordo, enquanto Kushner pressionou por fortes medidas de desarmamento e pelo fim de qualquer papel futuro do Hamas na administração de Gaza.", "titulo_pt": "Relatório: enviado americano Kushner se reúne com líderes do Hamas no egito", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 105885, "titulo": "US considers sanctions on Brazil judge in new test of diplomatic ties", "url": "https://www.ft.com/content/4bfa3d64-cf64-448d-823e-44c4577370b4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-16T17:26:00Z", "idioma": "en", "provavel_duplicata_de": n direita regresse ao poder'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 105927, "titulo": "Israeli military attacks strategic hill in southern Lebanon", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-military-attacks-southern-lebanon", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército israelense realizou uma explosão em uma colina estratégica chamada Ali al-Taher, na região sul do Líbano. Este ponto elevado, localizado próximo a Nabatieh al-Fawqa, tem sido o cenário de intensas operações militares israelenses.", "titulo_pt": "Exército israelense ataca colina estratégica no sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 105948, "titulo": "Average annual personal income rises to record level", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/17/2003862615", "fonte_id": "taipei_times", "data_pub": "2026-08-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento pessoal anual médio atingiu um novo recorde. Não há detalhes adicionais sobre o aumento ou o período específico em que isso ocorreu.", "titulo_pt": "Rendimento pessoal anual médio atinge novo recorde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 105548, "titulo": "Grupo Toky, dona da Tok&Stok e da Mobly, tem prejuízo de R$ 232,7 milhões no 2T", "url": "https://www.infomoney.com.br/mercados/toky-toky3-resultados-segundo-trimestre-2026/", "fonte_id": "infomoney", "data_pub": "2026-08-16T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Toky, proprietário das marcas Tok&Stok e Mobly, registrou um prejuízo de R$ 232,7 milhões no segundo trimestre. Durante o período, o grupo encerrou 12 lojas e observou uma queda de 37,3% na receita.", "titulo_pt": "Grupo Toky, dona da Tok&Stok e da Mobly, registra amante-para-entender-interior-de-outros-planetas", "fonte_id": "metropoles", "data_pub": "2026-08-16T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas submeteram diamante a altas pressões e observaram que sua estrutura resistiu até o início da fusão, fornecendo insights sobre o interior de planetas.", "titulo_pt": "Cientistas derretem diamante para entender interior de outros planetas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 106017, "titulo": "Strain flips Hall signal in altermagnetic manganese telluride, suggesting a path to practical spintronics", "url": "https://phys.org/news/2026-08-strain-flips-hall-altermagnetic-manganese.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A simetria de reversão do tempo é um comportamento exótico encontrado em sistemas cuja física interna parece diferente ao ser observada em direção ao passado ou ao futuro. Pesquisadores têm procurado esse comportamento em sistemas com magnetização quase nula, que são altamente valorizados para o spintrônico, onde as informações são transmitidas usando os spins quânticos dos elétrons.", "titulo_pt": "Estranho inverte sinal de Hall em manganês tellurido, sugerindo caminho para spintrônica prática", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106018, "titulo": "Chinese ship sets off for Europe through Arctic, halving travel time", "url": "https://phys.org/news/2026-08-chinese-ship-europe-arctic-halving.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio-container chinês partiu para a Europa pelo Ártico como parte de um novo serviço semanal em uma rota que reduz os tempos de transporte pela metade, mas grupos ambientais alertam que isso pode acelerar o derretimento da geleada polar.", "titulo_pt": "Navio chinês parte para Europa pelo ártico, reduzindo metade o tempo de viagem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106019, "titulo": "Firefighters battle second day of blaze on Greek island", "url": "https://phys.org/news/2026-08-firefighters-day-blaze-greek-island.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os bombeiros continuaram a luta contra um incêndio florestal na ilha grega de Skyros por mais um dia, enquanto o prefeito local expressou esperança de que a situação poderia ser controlada em breve.", "titulo_pt": "Bombeiros lutam contra segundo dia de incêndio na ilha grega de skyros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 105466, "titulo": "Mineral reforça hipótese sobre origem de cratera de Colônia, na zona sul de São Paulo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/mineral-reforca-hipotese-sobre-origem-de-cratera-de-colonia-na-zona-sul-de-sao-paulo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-16T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cratera de Colônia, na zona sul de São Paulo, foi formada pelo impacto de um corpo celeste há milhões de anos, conforme constatado por um estudo publicado em abril de 2026.", "titulo_pt": "Mineral confirma hipótese sobre origem de cratera de Colônia, na zona sul de São Paulo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 106045, "titulo": "NASA funds spherical 'Aerobots' that could explore the caves of Saturn's moon Titan", "url": "https://www.space.com/technology/nasa-funds-spherical-aerobots-that-could-explore-the-caves-of-saturns-moon-titan", "fonte_id": "space_com", "data_pub": "2026-08-16T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está financiando protótipos de 'Aerobots' esféricos que podem explorar as cavernas de Titã, satélite de Saturno, em uma missão demonstrativa semelhante à missão Ingenuity em Marte.", "titulo_pt": "NASA financia 'Aerobots' esféricos para explorar as cavernas de titã", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 106020, "titulo": "Shrinking water bodies can turn drought into disease hotspots or dead ends", "url": "https://phys.org/news/2026-08-bodies-drought-disease-hotspots-dead.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prolongadas secas podem reduzir a ocorrência de doenças aquáticas, que afetam muitas pessoas. No entanto, em outras ocasiões, a escassez de água pode inesperadamente aumentar o número de doenças dependentes de água.", "titulo_pt": "Bacias aquáticas reduzidas podem transformar secas em focos de doenças ou em dead ends", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106021, "titulo": "Einstein Probe catches rare X-ray flash from an exploding star", "url": "https://phys.org/news/2026-08-einstein-probe-rare-ray-star.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos associaram um relâmpago de raios-X descoberto pelo Einstein Probe a um supernova conhecido com características incomuns, indicando a formação de um ultra-densamente compactado e rapidamente girante magnetoide. O artigo descrevendo essa descoberta foi publicado na The Astrophysical Journal Letters em 22 de julho.", "titulo_pt": "Einstein Probe registra raro flash de raios-x de uma estrela explodindo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106046, "titulo": "On this day in space! Aug. 16, 1963: Wingless M2-F1 completes 1st glide flight", "url": "https://www.space.com/space-exploration/human-spaceflight/on-this-day-in-space-aug-16-1963-wingless-m2-f1-completes-1st-glide-flight", "fonte_id": "space_com", "data_pub": "2026-08-16T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 16 de agosto de 1963, o protótipo de avião M2-F1 da NASA realizou seu primeiro voo de deslizamento. Este voo marcou o início das testes desse protótipo sem asas, destinado a pesquisas aeronáuticas.", "titulo_pt": "16 De agosto de 1963: protótipo M2-F1 da nasa realiza seu primeiro voo de deslizamento", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 106022, "titulo": "Active particles could make stable glasses stronger without catastrophic brittle failure", "url": "https://phys.org/news/2026-08-particles-stable-glasses-stronger-catastrophic.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Partículas ativas podem tornar vidros mais resistentes sem causar falhas catastróficas. Os vidros mais resistentes têm uma fraqueza que os faz falhar instantaneamente quando excedem seu limite.", "titulo_pt": "Partículas ativas podem fortalecer vidros estáveis sem falhas catastróficas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106047, "titulo": "Artemis II pilot thanks NASA for letting him fly Orion by hand: 'I'm still blown away by that trust'", "url": "https://www.space.com/space-exploration/artemis/artemis-ii-pilot-thanks-nasa-for-letting-him-fly-orion-by-hand-im-still-blown-away-by-that-trust", "fonte_id": "space_com", "data_pub": "2026-08-16T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tripulação da Artemis II agradeceu à NASA e aos contratantes em frente a uma plateia de mais de 8.000 pessoas em agosto de 2026, no Red Rocks Amphitheatre no Colorado.", "titulo_pt": "Piloto da artemis II agradece à NASA por permitir que ele voasse o Orion manualmente: 'eu ainda fico impressionado com essa confiança'", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 106035, "titulo": "This 10-cent heart drug cuts hospitalizations by 25%", "url": "https://www.sciencedaily.com/releases/2026/08/260814235858.htm", "fonte_id": "science_daily", "data_pub": "2026-08-16T12:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um medicamento cardíaco antigo, com custo inferior a dez centavos por dia, pode reduzir hospitalizações de pacientes com insuficiência cardíaca em cerca de 25%. Novas pesquisas indicam que a digoxina em dose baixa pode ser uma opção importante no tratamento desta condição.", "titulo_pt": "Este medicamento cardíaco de 10 centavos reduz hospitalizações por insuficiência cardíaca em 25%", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 106023, "titulo": "Why AI training can backfire for older workers", "url": "https://phys.org/news/2026-08-ai-backfire-older-workers.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T12:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empregadores estão cada vez mais investindo em treinamento para preparar seus funcionários para a inteligência artificial (IA). Orçamentos de treinamento estão crescendo e 'recalibragem' se tornou uma resposta comum à rápida mudança tecnológica.", "titulo_pt": "Por que o treinamento de IA pode falhar para os trabalhadores mais velhos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 105624, "titulo": "João Marcelo Bôscoli fala da nova versão de álbum de Elis Regina", "url": "https://veja.abril.com.br/coluna/veja-gente/joao-marcelo-boscoli-fala-da-nova-versao-de-album-de-elis-regina/", "fonte_id": "veja", "data_pub": "2026-08-16T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "João Marcelo Bôscoli discute a remasterização do álbum clássico de Elis Regina. O projeto está gerando debates na família.", "titulo_pt": "João Marcelo Bôscoli fala da remasterização do álbum de Elis Regina", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 106054, "titulo": "Dave Marsh, Veteran Rock Critic and Biographer, Dies at 76", "url": "https://pitchfork.com/story/dave-marsh-veteran-rock-critic-and-biographer-dies-at-76/", "fon const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
