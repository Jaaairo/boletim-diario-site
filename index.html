<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 04/10/2026 10:00 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

      <option value="resumo_impreciso">Resumo impreciso</option>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "04/10/2026 10:00", "stats": {"noticias_novas": 712, "resumos_gerados": 216}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva, candidato à reeleição, expressou confiança em sua vitória nas eleições, reafirmando a escolha entre democracia e autoritarismo. Lula votou no ABC paulista, defendendo a democracia e criticando a 'quadrilha do Master'. As pesquisas eleitorais indicam um empate técnico entre Lula e Flávio Bolsonaro, com Lula tendo uma pequena vantagem. O candidato do PL, Flávio Bolsonaro, afirmou estar bem preparado para governar o país e buscará o voto útil. O presidente do Tribunal Superior Eleitoral, Nunes Marques, acompanhou a abertura da votação em Brasília, afirmando que a eleição deve ocorrer com normalidade. A apuração dos votos começará às 17h no horário de Brasília, com a divulgação dos resultados em tempo real.", "mundo": "No Brasil, as eleições presidenciais ocorrem em um cenário polarizado, com o presidente Luiz Inácio Lula da Silva e o senador Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro, empatados nas pesquisas de opinião para o primeiro turno. A última pesquisa divulgada indica que Lula tem 45% das intenções de voto, enquanto Bolsonaro tem 42%. A votação, que ocorre das 8h às 17h, envolve mais de 158 milhões de eleitores brasileiros. Em outros países, a situação política também é complexa: a Alemanha apoia a Ucrânia durante um ataque aéreo russo em Kyiv, enquanto a Coreia do Norte afirma que um lançamento de míssil de alcance médio voou 1,000 km, superando as estimativas de Tóquio e Seul. No Leste Europeu, o primeiro-ministro letão, Andris Kablergs, venceu uma eleição realizada sob a sombra da guerra na Ucrânia, com seu partido obtendo 35,3% dos votos, um resultado inédito desde 1990.\n\nMais navios-pipa foram atacados no Oriente Médio, enquanto Teerã reitera as condições para a reabertura do Estreito de Ormuz, incluindo a cessação de ações agressivas dos EUA e o fim do bloqueio naval. Paralelamente, a Rússia intensificou os ataques a instalações energéticas ucranianas e atingiu a Ponte Norte em Kiev durante a visita do chanceler alemão, Friedrich Merz, prometendo forte apoio à Ucrânia. A Coreia do Norte realizou um teste de míssil, aumentando as tensões na península coreana, enquanto a Rússia enfrenta custos elevados para desativar suas usinas nucleares. Essas ações geopolíticas refletem a instabilidade na região e as complexas relações entre as potências mundiais.", "economia": "A economia global enfrenta diversos desafios, com destaque para o comportamento do mercado de ações nos Estados Unidos. A euforia das novas listagens de ações na Wall Street está diminuindo devido a uma demanda fraca e preocupações com a avaliação, com várias listagens sendo pausadas recentemente, incluindo a estreia pública da Anthropic. No Brasil, a economia enfrenta pressões, com a indústria automotiva em um equilíbrio difícil entre os mercados chineses e europeus, e a indústria de saneamento enfrentando incertezas em relação à definição da alíquota tributária. Além disso, a China encerrou mais de 670 bancos no ano passado, reforçando a fragilidade do sistema financeiro local, enquanto a indústria naval japonesa e coreana está investindo em robôs para competir com a China. No mercado de petróleo, 325 milhões de barris foram liberados pelas reservas dos membros da Agência Internacional de Energia (IEA).", "tecnologia": "A OpenAI anunciou a descontinuação de todas as versões do ChatGPT, incluindo os planos gratuitos, Plus e Enterprise, em favor de uma arquitetura baseada em plugins. A empresa enfrenta múltiplos riscos legais devido a várias brechas de segurança em suas ferramentas de IA. Em outro desenvolvimento, a OpenAI, junto com os negociadores climáticos, busca estabelecer um objetivo para a transição da economia para uma base elétrica, focando em eletrificação, mas abordando os desafios práticos. Na área de tecnologia, a Inteligência Artificial está sendo usada para ajudar a estabelecer conexões com o passado, como no caso do Smithsonian, que busca utilizar tecnologias avançadas para melhorar suas pesquisas e compreensão histórica.", "ciencia": "A SpaceX, líder no mercado de lançamentos espaciais comerciais, decidiu priorizar o desenvolvimento do foguete Starship, o que afetou os clientes de lançamento de satélites. Pesquisadores do Brasil e do Reino Unido estudaram a complexidade da interferência de luz em materiais opacos, permitindo focar a luz nessas superfícies. Um novo estudo sugere a possibilidade de câmaras escondidas no complexo funerário de Tutancâmon, reavivando rumores antigos sobre estruturas não descobertas. Na China, um fóssil indica que o uso de penas para voar não foi um desenvolvimento exclusivo das aves, mas também ocorreu em parentes não-aves que evoluíram nessa direção. Além disso, uma nova espécie de lagarto foi descoberta nos Andes peruanos, contribuindo para o conhecimento sobre a biodiversidade da região.", "cultura": "O documentário humorístico 'The History of Concrete', dirigido por John Wilson e distribuído pela Magnolia, é o lançamento de plataforma de documentários mais bem-sucedido do ano, arrecadando mais de um milhão de dólares. Em Milão, uma exposição resgata as incursões visionárias de Salvador Dalí no mundo da moda, mostrando que a criação de roupas e acessórios pode ser considerada uma forma de arte. A Rádio Nacional estreia a nova temporada do programa Música do Mundo no próximo domingo às 22h, com 11 episódios explorando a música global. O Festival Gangnam de 2026 em Seul marcará o início do evento no distrito de Gangnam, com uma grande parada cívica de 2.000 moradores de 22 bairros administrativos, onde Psy popularizou o hit 'Gangnam Style' em 2012.", "sociedade": "A ministra da Educação da França anunciou que entre 300 e 500 escolas podem permanecer parcial ou totalmente fechadas na próxima segunda-feira devido às manifestações estudantis. Além disso, pelo menos 5.000 pessoas, principalmente adolescentes, foram presas e dezenas ficaram feridas. Em contrapartida, a governadora de Nova York, Hochul, anunciou um pagamento de US$16,8 milhões para agricultores de seu estado. O arcebispo de Buenos Aires fez uma homilia contra a violência física e verbal durante uma missa após a peregrinação à Virgem de Luján, afirmando que se a Virgem nos abraça, não devemos olhar o outro com desdém. Um homem de 36 anos morreu após receber pelo menos quatro ferimentos cortopunzantes na espalda e um no pescoço, e seu irmão e o suposto autor do ataque ficaram com lesões graves. Em Senegal, voluntários e estudantes preparam salas de aula mais seguras e limpas em Dakar, capital do país, antes do início do ano letivo. O governo de Singapura lançou uma aplicação de relacionamento oficial para jovens funcionários públicos como parte de esforços para combater uma crise demográfica. Um policial foi preso acusado de fabricar e distribuir imagens de exploração sexual em Seul, Coreia do Sul, em 4 de outubro. O editorial discute a resiliência, tanto localmente quanto em escala global.", "meio_ambiente": "A Alemanha está avançando na produção de energia elétrica com o lançamento de um aerogerador de 365 metros de altura, o mais alto do mundo. Este equipamento, que supera a altura da Torre Eiffel, foi instalado perto da Torre de TV de Berlim, o edifício mais alto do país. Em outro desenvolvimento, uma ovelha selvagem libertada em 1971 no Parque Nacional do Teide, na ilha de Tenerife, está se tornando uma ameaça ao ecosistema local após quatro décadas. Cinco casos recentes de baleias e tubarões-baleias se aproximando da costa indonésia nas últimas três semanas levantaram a possibilidade de que esses incidentes estejam se tornando mais frequentes, com especialistas apontando para mudanças ambientais, atividade humana e melhor reportagem como possíveis razões. Finalmente, um tsunami lento ameaça causar mais danos à costa oeste dos Estados Unidos, com especialistas monitorando a situação com atenção, pois a onda pode levar algum tempo para atingir o litoral americano.", "direitos_humanos": "Em Ceuta, o acampamento de imigrantes está sendo removido antes da visita do Rei Felipe VI e da Rainha Letizia, agendada para o dia 13 de outubro. Em Louisiana, um bebê de um ano enfrenta um julgamento migratório sem advogado, enquanto sua mãe, com 17 anos, busca asilo para ambos. A mãe corre risco de deportação, apesar do governo de Trump ter tentado cortar fundos para serviços legais para menores migrantes, o que foi parcialmente mantido por organizações. Em outro desenvolvimento, a comunidade vietnamita no Japão está preocupada com a desinformação e as mudanças nas regras de vistos, o que levanta preocupações sobre o alvo potencial desses imigrantes. Finalmente, a ONU alerta sobre as condições em Mianmar, em guerra civil desde 2021, onde não há garantias de retornos seguros para os migrantes retornados da Malásia, conforme exigido pela lei internacional."}, "resumo_do_dia": {"politica_nacional": [{"id": 194124, "titulo": "Ao votar, Lula diz estar confiante em vitória e volta a falar em escolha entre democracia e barbárie", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ao-votar-lula-diz-estar-confiante-em-vitoria-e-volta-a-falar-em-escolha-entre-democracia-e-barbarie.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-04T12:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva, candidato à reeleição, expressou confiança em sua vitória nas eleições e reafirmou a escolha entre democracia e barbárie. Durante o voto, Lula também fez críticas indiretas ao seu principal adversário, Flávio Bolsonaro.", "titulo_pt": "Lula vota confiante em vitória e reitera escolha entre democracia e barbárie", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 194304, "titulo": "Lula vota no ABC, fala em democracia contra “barbárie” e ataca “quadrilha do Master”", "url": "https://www.infomoney.com.br/politica/lula-vota-no-abc-se-diz-confiante-na-vitoria-e-ataca-quadrilha-do-banco-master/", "fonte_id": "infomoney", "data_pub": "2026-10-04T12:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula votou no ABC paulista, defendendo a democracia e criticando o que chamou de 'quadrilha do Master'. Ele também apelou para que eleitores acima de 70 anos compareçam às urnas.", "titulo_pt": "Lula vota no ABC, defende democracia e critica 'quadrilha do Master'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194260, "titulo": "Eleições 2026: Lula vota em São Paulo", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicoes-2026-lula-vota-em-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-04T12:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva votou na cidade de São Bernardo do Campo, São Paulo, durante as eleições para a presidência da República de 2026.", "titulo_pt": "Eleições 2026: lula vota em São Paulo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 194305, "titulo": "Fui convocado para ser mesário, mas faltei: o que acontece agora?", "url": "https://www.infomoney.com.br/brasil/mesario-convocado-ausente/", "fonte_id": "infomoney", "data_pub": "2026-10-04T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mesários são fundamentais para o funcionamento das eleições no Brasil. O artigo discute as consequências de um convocado para o cargo de mesário que decide faltar ao seu dever.", "titulo_pt": "Fui convocado para ser mesário, mas faltei: o que acontece agora?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194324, "titulo": "Quando o resultado da eleição será divulgado e onde acompanhar a apuração do TSE em tempo real", "url": "https://www.bbc.com/portuguese/articles/cme3reppxv7zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-04T11:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BBC News Brasil vai acompanhar a apuração do primeiro turno das Eleições 2026 em 4 de outubro com um programa ao vivo que trará os resultados e análise em tempo real conforme os votos forem contados.", "titulo_pt": "Quando e onde acompanhar a apuração do primeiro turno das eleições 2026 em tempo real", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 194306, "titulo": "Flávio Bolsonaro vota no Rio e diz estar “muito preparado” para governar o país", "url": "https://www.infomoney.com.br/politica/flavio-bolsonaro-vota-no-rio-e-diz-estar-muito-preparado-para-governar-o-pais/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL à Presidência, votou no Rio de Janeiro e afirmou estar muito preparado para governar o país. Durante o voto, ele criticou o governo Lula e expressou a expectativa de vencer nas eleições ainda no primeiro turno.", "titulo_pt": "Flávio Bolsonaro vota no Rio e se declara 'muito preparado' para governar o país", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194340, "titulo": "Nunes Marques acompanha abertura da votação em Brasília", "url": "https://veja.abril.com.br/brasil/nunes-marques-acompanha-abertura-da-votacao-e-vota-em-brasilia/", "fonte_id": "veja", "data_pub": "2026-10-04T11:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, Nunes Marques, acompanhou a abertura da votação em Brasília. Ele afirmou que a eleição deve ocorrer com normalidade.", "titulo_pt": "Nunes Marques acompanha abertura da votação em Brasília", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 194415, "titulo": "Lista de quem são todos os candidatos a deputado estadual pelo Rio Grande do Sul (RS) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lista-quem-sao-todos-os-candidatos-a-deputado-estadual-pelo-rio-grande-do-sul-rs-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-04T11:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os 8,5 milhões de eleitores do Rio Grande do Sul irão escolher 55 candidatos a deputado estadual no dia das eleições deste domingo (4/10).", "titulo_pt": "Lista de candidatos a deputado estadual pelo Rio Grande do Sul nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194416, "titulo": "Quem são e os números dos candidatos ao governo de Minas Gerais (MG) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-e-os-numeros-dos-candidatos-ao-governo-de-minas-gerais-mg-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-04T11:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Onze candidatos estão concorrendo ao cargo de governador do estado de Minas Gerais nas eleições de 2026. A lista completa dos candidatos foi apresentada.", "titulo_pt": "Quem são e os números dos candidatos ao governo de Minas Gerais em 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194342, "titulo": "Pesquisas eleitorais mostram a distância entre Lula e Flávio após últimos números da semana", "url": "https://veja.abril.com.br/politica/pesquisas-eleitorais-mostram-a-distancia-entre-lula-e-flavio-apos-ultimos-numeros-da-semana/", "fonte_id": "veja", "data_pub": "2026-10-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas eleitorais indicam um empate técnico entre Lula e Flávio no primeiro turno, segundo os institutos Datafolha e Quaest, enquanto o instituto AtlasIntel registra uma vantagem para Lula que está fora da margem de erro.", "titulo_pt": "Pesquisas mostram empate técnico entre Lula e Flávio no primeiro turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 194419, "titulo": "Flávio Bolsonaro chega ao 1º turno resiliente às crises e em busca do voto útil", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-chega-ao-1o-turno-resiliente-as-crises-e-em-busca-do-voto-util", "fonte_id": "jota", "data_pub": "2026-10-04T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro está no primeiro turno das eleições e busca o voto útil, mantendo o antipetismo como principal fator para avançar ao segundo turno contra Lula.", "titulo_pt": "Flávio Bolsonaro chega ao 1º turno resiliente às crises e em busca do voto útil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194420, "titulo": "Ofuscado por crises no STF, Lula tenta retomar as rédeas da agenda com medidas populares", "url": "https://www.jota.info/eleicoes/eleicoes-2026/ofuscado-por-crises-no-stf-lula-tenta-retomar-as-redeas-da-agenda-com-medidas-populares", "fonte_id": "jota", "data_pub": "2026-10-04T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula tenta recuperar sua agenda com medidas populares, mas encontra dificuldades devido às crises no STF. O governo apostou em reajustes do Bolsa Família, fim das bets e anúncio de um novo programa Desenrola para tentar melhorar suas pesquisas de opinião.", "titulo_pt": "Oculto por crises no STF, Lula busca retomar agenda com medidas populares", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194227, "titulo": "Lula vota em São Bernardo do Campo neste domingo", "url": "https://exame.com/brasil/lula-vota-em-sao-bernardo-do-campo-neste-domingo/", "fonte_id": "exame", "data_pub": "2026-10-04T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula votou na Escola Estadual João Firmino Correia de Araújo, localizada no bairro Assunção, em São Bernardo do Campo. Ele acompanha a apuração dos votos em um hotel na capital paulista.", "titulo_pt": "Lula vota em São Bernardo do Campo neste domingo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [{"titulo": "Quem são todos os candidatos a deputado federal por Santa Catarina (SC) nas eleições 2026", "sumario": "Os mais de cinco milhões de eleitores de Santa Catarina irão eleger 16 candidatos a deputado federal pelo estado. Os 5,7 milhões de eleitores de Santa Catarina irão eleger 40 candidatos a deputado estadual nas eleições de outubro. Tarcísio de Freitas (Republicanos) é favorito à reeleição em São Paulo, enfrentando Fernando Haddad (PT) e candidatos com menor destaque.", "artigos": [{"id": 194412, "titulo": "Quem são todos os candidatos a deputado federal por Santa Catarina (SC) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-deputado-federal-por-santa-catarina-sc-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-04T11:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mais de cinco milhões de eleitores de Santa Catarina irão eleger 16 candidatos a deputado federal pelo estado. O texto original lista e descreve todos os candidatos a deputado federal por Santa Catarina nas eleições de 2026.", "titulo_pt": "Quem são todos os candidatos a deputado federal por Santa Catarina (SC) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194413, "titulo": "Quem são todos os candidatos a deputado estadual por Santa Catarina (SC) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-deputado-estadual-por-santa-catarina-sc-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-04T11:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os 5,7 milhões de eleitores de Santa Catarina irão eleger 40 candidatos a deputado estadual nas eleições de outubro. O artigo discute os candidatos a essas vagas.", "titulo_pt": "Quem são todos os candidatos a deputado estadual por Santa Catarina (SC) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194414, "titulo": "Veja quem são todos os candidatos a governador de São Paulo (SP) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/veja-quem-sao-todos-os-candidatos-a-governador-de-sao-paulo-sp-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-04T11:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas (Republicanos) é favorito à reeleição em São Paulo, enfrentando Fernando Haddad (PT) e candidatos com menor destaque.", "titulo_pt": "Veja quem São todos os candidatos a governador de São Paulo (SP) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 194617, "titulo": "More tankers struck in the Middle East as Iran reiterates conditions for reopening the Strait of Hormuz", "url": "https://www.cnbc.com/2026/10/04/more-tankers-struck-in-gulf-waters-as-iran-reiterates-conditions.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-04T12:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais navios-pipa foram atacados no Oriente Médio enquanto Teerã reitera as condições para reabertura do Estreito de Ormuz. Estas condições incluem a cessação de ações agressivas dos EUA, o fim do bloqueio naval e da guerra econômica, e a libertação de ativos iranianos.", "titulo_pt": "Mais navios-pipa atacados no oriente médio enquanto Irã reitera condições para reabertura do estreito de Ormuz", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 194546, "titulo": "Elecciones en Brasil 2026, en vivo | Abren los colegios electorales: los brasileños eligen entre Lula y Bolsonaro", "url": "https://elpais.com/america/2026-10-04/elecciones-en-brasil-2026-en-vivo.html", "fonte_id": "elpais_america", "data_pub": "2026-10-04T12:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A última pesquisa divulgada no sábado indica que o presidente tem 45% das intenções de voto, enquanto o candidato ultradireitista Bolsonaro tem 42%.", "titulo_pt": "Eleições no Brasil 2026, em tempo real | abrem os mesários: brasileiros escolhem entre Lula e Bolsonaro", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 194726, "titulo": "How the ‘G2’ effect of Trump-Xi summit is reverberating through Asia", "url": "https://www.scmp.com/opinion/asia-opinion/article/3369358/how-g2-effect-trump-xi-summit-reverberating-through-asia?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-04T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cobertura da mídia chinesa do encontro entre Xi Jinping e Donald Trump foi extremamente positiva, enfatizando a importância do encontro entre as duas potências e a criação de um novo capítulo nas relações entre eles. Em contraste, o ponto de vista dos Estados Unidos e da China é muito diferente.", "titulo_pt": "Como o 'efeito G2' do encontro entre trump e xi está ecoando pela ásia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 194691, "titulo": "Renzi, 'appello a centristi e ai riformisti di Forza Italia, venite con noi'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/04/renzi-appello-a-centristi-e-ai-riformisti-di-forza-italia-venite-con-noi_50a57f36-e904-4450-8c73-fae58e36775f.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-04T12:27:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Renzi convoca centro-escritos e reformistas da Forza Italia a unirem-se a ele. O discurso destaca a importância de não se aliar com aqueles que negam a Europa.", "titulo_pt": "Renzi, 'chamado aos centro-escritos e reformistas da Forza Italia, venham conosco'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 194701, "titulo": "Russia vows to step up strikes and warns diplomats to avoid Kyiv", "url": "https://www.japantimes.co.jp/news/2026/10/04/world/russia-vows-increased-strikes/", "fonte_id": "japan_times", "data_pub": "2026-10-04T12:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moscou intensificou os ataques a instalações energéticas ucranianas antes e durante o inverno durante o conflito que já dura mais de quatro anos. A Rússia ameaçou diplomatas a evitar Kyiv.", "titulo_pt": "Rússia promete intensificar ataques e avisa diplomatas para evitar Kyiv", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 194588, "titulo": "Rwandan genocide suspect 'hunter' Dafroza Gauthier dies at 72", "url": "https://www.france24.com/en/africa/20261004-rwandan-genocide-hunter-dafroza-gauthier-dies-at-72", "fonte_id": "france24", "data_pub": "2026-10-04T12:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dafroza Gauthier, que trabalhou por cerca de 30 anos para localizar refugiados rwandenses suspeitos de terem participado do genocídio tutsi em 1994, morreu aos 72 anos em Reims. Ela dedicou sua vida a buscar justiça pelos supostos responsáveis pelo massacre de mais de 800 mil pessoas naquele ano.", "titulo_pt": "Suspeita de genocídio rwandês Dafroza Gauthier morre aos 72 anos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 194575, "titulo": "Kyiv bridge hit in further Russian drone attack as German chancellor makes surprise visit", "url": "https://www.bbc.co.uk/news/articles/ckreyjzzzywqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-04T12:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone russo atingiu o Pivnichyi (Northern) Bridge em Kyiv, gerando um grande incêndio. A chanceler alemã fez uma visita inesperada à cidade.", "titulo_pt": "Ponte em kyiv é atingida por drone russo em novo ataque; chanceler alemã visita surpresa", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 194385, "titulo": "Elecciones en Brasil 2026, EN VIVO: Lula vs. Flávio Bolsonaro y las últimas noticias, voto a voto", "url": "https://www.lanacion.com.ar/el-mundo/elecciones-en-brasil-2026-en-vivo-lula-vs-flavio-bolsonaro-y-las-ultimas-noticias-voto-a-voto-nid04102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-04T12:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os últimos levantamentos indicam uma disputa apertada entre o atual presidente e seu principal adversário nas eleições de 2026. Mais de 158 milhões de eleitores brasileiros estão aptos a votar.", "titulo_pt": "Eleições no Brasil 2026, ao VIVO: lula x flávio Bolsonaro e as últimas notícias, voto a voto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 194387, "titulo": "¿Quién va ganando las elecciones en Brasil? Así miden las encuestas entre Lula y Bolsonaro Jr. hoy, domingo 4 de octubre", "url": "https://www.lanacion.com.ar/el-mundo/quien-va-ganando-las-elecciones-en-brasil-asi-miden-las-encuestas-entre-lula-y-bolsonaro-jr-hoy-nid04102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-04T12:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mais recente mostra uma diferença de quatro pontos percentuais entre os candidatos principais; a eleição provavelmente resultará em um segundo turno no dia 25 de outubro.", "titulo_pt": "Quem está à frente nas eleições no Brasil? As pesquisas entre Lula e Bolsonaro Jr. No dia 4 de outubro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 194589, "titulo": "West Bank: Palestinians ‘harassed’ by settlers’ increasing use of drones", "url": "https://www.france24.com/en/middle-east/20261004-occupied-west-bank-palestinians-harassed-settlers-drones", "fonte_id": "france24", "data_pub": "2026-10-04T12:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos e ativistas relatam um aumento no uso de drones na Cisjordânia ocupada, principalmente por soldados e colonos, que recebem os drones diretamente do governo. Os drones são usados para intimidar, monitorar, destruir e tornar a vida diária insuportável.", "titulo_pt": "Cisjordânia: palestinos 'assediados' pelo uso crescente de drones por colonos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 194647, "titulo": "Russia hits Kyiv bridge as Germany’s Merz visits Ukraine’s capital", "url": "https://www.aljazeera.com/news/2026/10/4/russian-strike-hits-kyiv-bridge-as-german-chancellor-visits-ukraine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-04T11:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chanceler alemão visitou Kiev durante um alerta de bombardeio, prometendo forte apoio. Ataques russos interromperam a capital ucraniana.", "titulo_pt": "Alemanha: Merz visita kiev enquanto sirenes de alerta de bombardeio soam", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 194590, "titulo": "Lula and Bolsonaro face off in Brazil presidential race", "url": "https://www.france24.com/en/lula-and-bolsonaro-face-off-in-brazil-presidential-race", "fonte_id": "france24", "data_pub": "2026-10-04T11:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doze candidatos concorrem à presidência do Brasil, mas a principal disputa envolve Luiz Inácio Lula da Silva e Flávio Bolsonaro. Lula busca um quarto mandato, alertando sobre a ameaça à soberania brasileira, enquanto Bolsonaro enfatiza suas relações com o governo dos Estados Unidos, buscando melhores acordos, especialmente sobre recursos minerais raros.", "titulo_pt": "Lula e Bolsonaro se enfrentam na corrida presidencial do Brasil", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 194504, "titulo": "Russia strikes Kyiv bridge as German chancellor visits Ukraine in show of support", "url": "https://www.theguardian.com/world/2026/oct/04/russia-strikes-kyiv-bridge-german-chancellor-merz-visits-ukraine", "fonte_id": "guardian_world", "data_pub": "2026-10-04T11:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone russo atingiu a principal ponte norte de Kiev sobre o rio Dnipro, no mesmo dia em que o chanceler alemão, Friedrich Merz, visitou a cidade para mostrar o apoio da Alemanha à Ucrânia. Este ataque ocorreu em um dia de quatro consecutivos em que a Rússia tem atacado pontes usadas por milhares de residentes para se locomover entre os dois bancos da cidade.", "titulo_pt": "Rússia atinge ponte de kiev durante visita do chanceler alemão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 194648, "titulo": "Brazil votes in deeply polarised election pitting Lula against Bolsonaro", "url": "https://www.aljazeera.com/news/2026/10/4/brazil-votes-in-deeply-polarised-election-pitting-lula-against-bolsonaro?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-04T11:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Brasil realiza eleições em um cenário polarizado, com o líder da esquerda, Lula, concorrendo pelo quarto mandato não consecutivo contra o representante da direita, Flavio Bolsonaro.", "titulo_pt": "Brasil vota em eleição polarizada entre Lula e flavio Bolsonaro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 194649, "titulo": "Iran says Hormuz to remain closed until US meets conditions", "url": "https://www.aljazeera.com/news/2026/10/4/iran-says-strait-of-hormuz-to-remain-closed-until-us-meets-conditions?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-04T11:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Téhéran afirma que o Estreito de Ormuz permanecerá fechado até que os Estados Unidos atendam às condições estabelecidas. O principal objetivo da República Islâmica é reabrir o estreito, enquanto os Estados Unidos continuam se concentrando nas negociações nucleares.", "titulo_pt": "Irã afirma que estreito de Ormuz permanecerá fechado até que EUA atendam condições", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 194650, "titulo": "Ethiopian government forces seize Tigray capital Mekelle as TPLF withdraws", "url": "https://www.aljazeera.com/news/2026/10/4/government-forces-seize-capital-of-ethiopias-tigray-region-from-rebels?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-04T11:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças do governo etíope e seus aliados assumiram o controle da capital da região de Tigray, Mekelle, após capturar o principal aeroporto regional. O grupo TPLF teria se retirado da cidade.", "titulo_pt": "Forças do governo etíope tomam Mekelle após captura do aeroporto regional", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 194683, "titulo": "The US is looking more like Italy", "url": "https://www.ft.com/content/a2711e64-145b-4df6-baf7-56a3da7ed0b0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-04T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os EUA estão se tornando menos excepcionais e o Novo Mundo está se aproximando do Velho Mundo em termos econômicos e sociais.", "titulo_pt": "Os EUA estão parecendo mais com a Itália", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 194688, "titulo": "Investors look to shelter portfolios from rising AI concentration risks", "url": "https://www.ft.com/content/3302fd5c-8b92-425b-9523-673b2565bb10?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-04T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gestores de fundos consideram fundos de hedge e ativos de mercados emergentes como proteção contra um possível repentino desinteresse em inteligência artificial.", "titulo_pt": "Investidores buscam proteger portfólios contra riscos crescentes de concentração em inteligência artificial", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 194307, "titulo": "Suspeita de bomba fecha estação Higienópolis-Mackenzie do metrô em São Paulo", "url": "https://www.infomoney.com.br/brasil/suspeita-de-bomba-fecha-estacao-higienopolis-mackenzie-do-metro-em-sao-paulo/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estação Higienópolis-Mackenzie do metrô em São Paulo foi fechada após a suspeita de uma bomba ser encontrada perto da linha de bloqueio. A Polícia Militar e o Grupo de Ações Táticas Especiais (GATE) foram chamados para verificar o objeto.", "titulo_pt": "Suspeita de bomba fecha estação Higienópolis-Mackenzie do metrô em São Paulo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194308, "titulo": "Mãe de Flávio Bolsonaro diz que família está esperançosa", "url": "https://www.infomoney.com.br/politica/mae-de-flavio-bolsonaro-diz-que-familia-esta-esperancosa/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mãe de Flávio Bolsonaro afirmou que a família está esperançosa. Ela destacou a 'garra' e 'disposição' de Flávio durante a campanha eleitoral.", "titulo_pt": "Mãe de Flávio Bolsonaro diz que família está esperançosa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194309, "titulo": "TSE: Eleitores no exterior enviaram 124 mil justificativas até às 7h", "url": "https://www.infomoney.com.br/politica/tse-eleitores-no-exterior-enviaram-124-mil-justificativas-ate-as-7h/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) informou que só começará a divulgar os resultados eleitorais após o fechamento das urnas no Brasil. Até às 7h, 124 mil justificativas de eleitores no exterior já haviam sido enviadas.", "titulo_pt": "TSE: eleitores no exterior enviaram 124 mil justificativas até às 7h", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194341, "titulo": "As discussões econômicas que o Congresso eleito vai encontrar em 2027", "url": "https://veja.abril.com.br/economia/as-discussoes-economicas-que-o-congresso-eleito-vai-encontrar-em-2027/", "fonte_id": "veja", "data_pub": "2026-10-04T11:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo Congresso enfrentará uma economia com uma dívida pública em crescimento e limitações para aumentar gastos. A reforma tributária avançará para uma fase decisiva.", "titulo_pt": "Discussões econômicas que o Congresso eleito em 2027 encontrará", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 194159, "titulo": "Veto no Brasil distorce projeções eleitorais de Kalshi e Polymarket, dizem empresas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/veto-no-brasil-distorce-projecoes-eleitorais-de-kalshi-e-polymarket-dizem-empresas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As plataformas de mercado de previsão, como Kalshi e Polymarket, continuam a fornecer projeções sobre as eleições brasileiras, mesmo estando proibidas no país. No entanto, o bloqueio no Brasil prejudica os resultados das empresas.", "titulo_pt": "Veto no Brasil distorce projeções eleitorais t": "A Comissão de Valores Mobiliários (CVM) decidiu que a ausência de subconta não impõe a tributação imediata de ganhos com operações de hedge. A companhia registrou variações relacionadas a essas operações em contas segregadas no patrimônio líquido.", "titulo_pt": "Ausência de subconta não implica em tributação imediata de ganhos com hedge, decide cvm", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194460, "titulo": "Jorge Selaive: “La economía chilena va a tener una recesión este año”", "url": "https://www.latercera.com/pulso/noticia/jorge-selaive-la-economia-chilena-va-a-tener-una-recesion-este-ano/", "fonte_id": "la_tercera", "data_pub": "2026-10-04T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O economista jefe da Scotiabank, Jorge Selaive, prevê uma recessão econômica no Chile em 2026, após três contractions anteriores desde 1999. Ele espera uma recuperação no último trimestre de 2026 e um crescimento de 3,5% em 2027. Além disso, há um risco de aumento do desemprego e de inflação desancrada, levando o Banco Central a aumentar as taxas de juros, se isso acontecer.", "titulo_pt": "Jorge Selaive: economia chilena terá recessão em 2026", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 194687, "titulo": "Why the IPO market is booming and busting", "url": "https://www.ft.com/content/8b7e2800-3e36-4d0c-9016-32deaae67b62", "fonte_id": "financial_times", "data_pub": "2026-10-04T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As flutuações de ações têm se estabilizado e os retornos das novas listagens têm sido fracos.", "titulo_pt": "Por que o mercado de ipos está em alta e baixa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 194161, "titulo": "Maverick se sai melhor em consumo e desempenho entre picapes a gasolina no Ranking Folha Mauá 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/maverick-se-sai-melhor-em-consumo-e-desempenho-entre-picapes-a-gasolina-no-ranking-folha-maua-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ford Maverick foi testada com duas motorizações diferentes no Ranking Folha Mauá 2026. A versão Lariat Black 2.0 turbo obteve melhores resultados em aceleração e retomada, enquanto a versão 2.5 híbrida foi mais eficiente em consumo de gasolina.", "titulo_pt": "Maverick se destaca em consumo e desempenho entre picapes a gasolina no Ranking Folha Mauá 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 194162, "titulo": "Ranking Folha Mauá: GWM Wey 07 e BMW X5 se destacam ao conciliar gasolina, eletricidade e luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/ranking-folha-maua-gwm-wey-07-e-bmw-x5-se-destacam-ao-conciliar-gasolina-eletricidade-e-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BMW X5 M Sport PHEV é o carro mais caro produzido no Brasil e o mais rápido entre os SUVs premium híbridos plug-in. Ele ganhou na prova de aceleração e na medição de consumo urbano com gasolina.", "titulo_pt": "BMW X5 m sport phev destaca-se no ranking Folha Mauá ao combinar velocidade, economia e luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 194422, "titulo": "Reforma tributária no saneamento: um teste à resiliência dos contratos no setor", "url": "https://www.jota.info/opiniao-e-analise/artigos/reforma-tributaria-no-saneamento-um-teste-a-resiliencia-dos-contratos-no-setor", "fonte_id": "jota", "data_pub": "2026-10-04T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de saneamento não possui uma definição clara da alíquota tributária, o que dificulta o reequilíbrio dos contratos. Isso represe icial/o-desafio-de-construir-a-proxima-geracao-da-inteligencia-artificial/", "fonte_id": "olhar_digital", "data_pub": "2026-10-04T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O verdadeiro desafio na corrida pela AGI é determinar se a inteligência pode ser ampliada indefinidamente. O artigo discute os obstáculos na construção da próxima geração da inteligência artificial.", "titulo_pt": "O desafio de construir a próxima geração da inteligência artificial", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 194775, "titulo": "Rural Data Centers Are in for a Big Federal Tax Break", "url": "https://www.wired.com/story/rural-data-centers-are-in-for-a-big-federal-tax-break/", "fonte_id": "wired", "data_pub": "2026-10-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei One Big Beautiful Bill oferecerá vantagens fiscais significativas para projetos de centros de dados em áreas rurais a partir do próximo ano. Algumas grandes empresas de tecnologia não parecem ansiosas para aproveitar esses benefícios fiscais gratuitos.", "titulo_pt": "Centros de dados rurais podem receber graciosas vantagens fiscais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 194755, "titulo": "Personal data of some 24,000 KEPCO employees leaked", "url": "https://en.yna.co.kr/view/AEN20261004002800315", "fonte_id": "yonhap_news", "data_pub": "2026-10-04T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A informação pessoal de aproximadamente 24.000 funcionários da KEPCO foi vazada. O incidente ocorreu em Seul, Coreia do Sul, em 4 de outubro.", "titulo_pt": "Informações pessoais de cerca de 24 mil funcionários da KEPCO vazadas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 194776, "titulo": "Keurig Alta First-Look: No More Plastic K-Cups", "url": "https://www.wired.com/story/keurig-alta-coffee-brewer/", "fonte_id": "wired", "data_pub": "2026-10-04T09:30 dir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/10/spacex-deixa-nasa-e-clientes-a-beira-da-estrada.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-04T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX se tornou líder no mercado de lançamentos espaciais comerciais e decidiu priorizar o desenvolvimento do foguete Starship, enquanto promete manter suas cápsulas Dragon para transportar astronautas à Estação Espacial Internacional até 2030. Os clientes de lançamento de satélites serão afetados pela decisão de focar no Starship, que realizou seu primeiro voo orbital recentemente.", "titulo_pt": "Spacex deixa Nasa e clientes de lançamento de satélites à beira da estrada", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 194788, "titulo": "Giant fluctuations of focused light reveal hidden correlations in opaque materials", "url": "https://phys.org/news/2026-09-giant-fluctuations-focused-reveal-hidden.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Através do uso de técnicas de moldagem de ondas, é possível controlar a complexa interferência de luz que viaja por materiais altamente dispersivos, como tecidos biológicos ou outros meios opacos desordenados, permitindo focar a luz através desses materiais.", "titulo_pt": "Flutuações gigantes da luz focada revelam correlações ocultas em materiais opacos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 194156, "titulo": "Nossa senhora, a decência desaparecida", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/marceloleite/2026/10/nossa-senhora-a-decencia-desaparecida.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-04T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No dia 4 de outubro de 2026, ocorreu a missa do galo republicano, um evento comum nte_id": "phys_org", "data_pub": "2026-10-04T11:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O lago das Brenets, localizado entre França e Suíça, secou após um verão extremamente quente, levando os locais a pedirem ajuda para salvar o lago.", "titulo_pt": "Chamado de ajuda à medida que o lago franco-suiço seca", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 194347, "titulo": "Novo estudo reaviva uma hipótese fascinante sobre complexo funerário de Tutancâmon", "url": "https://veja.abril.com.br/ciencia/novo-estudo-reaviva-uma-hipotese-fascinante-sobre-complexo-funerario-de-tutancamon/", "fonte_id": "veja", "data_pub": "2026-10-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo sugere a possibilidade de existirem câmaras escondidas no complexo funerário de Tutancâmon. Essa hipótese reaviva antigos rumores sobre estruturas não descobertas no local.", "titulo_pt": "Novo estudo reaviva hipótese sobre câmaras escondidas no complexo funerário de Tutancâmon", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 194731, "titulo": "Beijing fights invasive moths with parasitic wasps and caterpillar-catching contests", "url": "https://www.scmp.com/news/china/science/article/3369693/beijing-fights-invasive-moths-parasitic-wasps-and-caterpillar-catching-contests?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-04T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades de Beijing estão liberando mais de um bilhão de vespa parasitária e incentivando concursos de captura de lagartas para controlar a expansão da lagarta invasiva da cipreste americana do outono. As lagartas têm coberto as árvores na capital chinesa e áreas circunvizinhas neste verão, formando nuvens de teias cinzentas enquanto se alimentam das folhas.", "titulo_pt": "Pequim combate lagartas invasoras com vespa parasitária e concursos de captura de lagartas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 194792, "titulo": "How attachment theory can help us understand AI relationships", "url": "https://www.scientificamerican.com/article/how-attachment-theory-can-help-us-understand-ai-relationships/", "fonte_id": "scientific_american", "data_pub": "2026-10-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A teoria do apego é utilizada por psicólogos para descrever as relações mais significativas que mantêm as vidas das pessoas unidas. Este artigo explora como essa teoria pode ajudar a compreender as relações com inteligência artificial.", "titulo_pt": "Como a teoria do apego pode nos ajudar a entender as relações com IA", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 194157, "titulo": "Fóssil chinês indica origem dupla para o voo pré-origem das aves", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/fossil-chines-indica-origem-dupla-para-o-voo-pre-origem-das-aves.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo dinossauro emplumado descoberto na China sugere que o uso das penas para voar não foi um desenvolvimento exclusivo das aves, mas também ocorreu em parentes não-aves que evoluíram nessa direção.", "titulo_pt": "Fóssil chinês indica origem dupla para o voo pré-origem das aves", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 194158, "titulo": "Nova espécie de lagarto é descoberta nos Andes peruanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/nova-especie-de-lagarto-e-descoberta-nos-andes-peruanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-04T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram uma nova espécie de lagarto nos Andes peruanos. A informação foi div provavel_duplicata_de": null, "texto_pt": "Min Jin Lee, autora de 'Pachinko', publica um novo livro que novamente explora as dificuldades da imigração coreana. Ela se estabelece como a principal voz da diáspora coreana.", "titulo_pt": "Autora de 'Pachinko' retorna ao tema da imigração em novo livro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 194810, "titulo": "Avengers: Doomsday, PlayStation, Downton Abbey, Star Wars Executor Super Star Destroyer LEGO Sets Released", "url": "https://consequence.net/2026/10/lego-avengers-doomsday-playstation-downton-abbey/", "fonte_id": "consequence_sound", "data_pub": "2026-10-04T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 2026, foram lançados conjuntos de LEGO inspirados em batalhas do Avengers, a propriedade icônica de Crawley de Downton Abbey, e o Super Star Destroyer Star Wars Executor. Estes conjuntos incluem o tema Avengers: Doomsday, PlayStation, Downton Abbey e o Star Wars Executor Super Star Destroyer, com um conjunto do Star Wars Executor Super Star Destroyer custando US$ 800.", "titulo_pt": "Conjuntos LEGO de avengers, Downton Abbey, Star Wars Executor e PlayStation lançados", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 194800, "titulo": "Antigone Exits review – emotions run high in experimental reworking of Greek tragedy", "url": "https://www.theguardian.com/stage/2026/oct/04/antigone-exits-review-minerva-theatre-chichester-nina-segal-jeff-james", "fonte_id": "guardian_culture", "data_pub": "2026-10-04T10:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nina Segal oferece uma versão experimental de Antígona, de Sófocles, no Minerva Theatre em Chichester. A produção, que quebra o quarto muro, apresenta elementos visuais que sugerem perigo, como uma substância preta derramada em um palco amarelo, simbolizando a tensão na história de Creonte e Antígona.", "titulo_pt": "Avaliação de antígona existe – emoções altas em uma reinterpretação experimental da trágédia grega", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 194794, "titulo": "Museum Vonk is \"a testing ground for affordable bio-based construction\"", "url": "https://www.dezeen.com/2026/10/04/museum-vonk-studio-marco-vermeulen/", "fonte_id": "dezeen", "data_pub": "2026-10-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Museu Vonk, em Eindhoven, Holanda, é um museu de história interativo que usa placas de cal pigmentada e hempcrete para suas fachadas. O projeto, do estúdio Marco Vermeulen, serve como um teste para materiais biodegradáveis e econômicos.", "titulo_pt": "Museu Vonk é 'um teste para construção biodegradável e acessível'", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 194795, "titulo": "Five innovative and practical modular furniture designs", "url": "https://www.dezeen.com/2026/10/04/innovative-practical-modular-furniture-designs/", "fonte_id": "dezeen", "data_pub": "2026-10-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo apresenta cinco designs de mobiliário modular inovadores e práticos, incluindo uma alternativa para armários sob medida e um sistema de mobiliário composto por bolas macias. Amoreba, do Golem Amoreba, é formado por centenas de bolas acolchoadas que podem ser combinadas em diversas configurações.", "titulo_pt": "Cinco designs inovadores e práticos de mobiliário modular", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 194797, "titulo": "‘It’s OK to love somebody when they’re not perfect’: how John Cena conquered Hollywood – and why he refuses to abandon Vince McMahon", "url": "https://www.theguardian.com/film/2026/oct/04/john-cena-interview-matchbox-movie-wwe-peacemaker", "fonte_id": "guardian_culture", "data_pub": "2026-10-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Cena, ex- function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

  flags[_fUrl] = {
