retraso/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T01:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A espera em odontologia acumula mais de 537 mil atendimentos atrasados, segundo especialistas. Atrasos na consulta podem agravar problemas odontológicos e causar consequências em outras áreas, além de afetar a autoestima.", "titulo_pt": "Outra lista de espera: odontologia acumula mais de 537 mil atendimentos em atraso", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 145361, "titulo": "Brasil pode sentir efeitos do 'super El Niño' na primavera; veja previsões para diferentes regiões", "url": "https://www.bbc.com/portuguese/articles/c93eg21nz8jo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-04T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas indicam que o 'super El Niño' pode trazer chuvas acima da média para São Paulo, temperaturas mais elevadas no Norte e Nordeste, e um aumento do risco de novos temporais na região Sul.", "titulo_pt": "Brasil pode enfrentar efeitos do 'super El Niño' na primavera; veja previsões regionais", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 145221, "titulo": "Às vésperas do Super El Niño, só 4 estados têm planos de manejo do fogo", "url": "https://veja.abril.com.br/agenda-verde/as-vesperas-do-super-el-nino-so-4-estados-tem-planos-de-manejo-do-fogo/", "fonte_id": "veja", "data_pub": "2026-09-04T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apenas quatro estados têm planos de gestão do fogo à beira do Super El Niño, que pode ser intenso até o início de 2027. O diagnóstico indica baixa adesão a estratégias preventivas de combate ao fogo.", "titulo_pt": "Aos cuidados com Super El Niño, apenas 4 estados têm planos de gestão do fogo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 145330, "titulo": "Ibama autoriza Petrobras a perfurar novos poços na Margem Equatorial", "url": "https://www.cnnbrasil.com.br/infra/ibama-autoriza-petrobras-a-perfurar-novos-pocos-na-margem-equatorial/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibama autorizou a Petrobras a perfurar novos poços na Margem Equatorial, com prazo de 30 dias para a empresa apresentar um cronograma atualizado.", "titulo_pt": "Ibama autoriza Petrobras a perfurar novos poços na Margem Equatorial", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 145422, "titulo": "Patagonia salvaje: en busca de pumas en la estepa inhóspita de Santa Cruz", "url": "https://www.lanacion.com.ar/salud/patagonia-salvaje-en-busca-de-pumas-en-la-estepa-inhospita-de-santa-cruz-nid04092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T16:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A partir da cidade de Perito Moreno, na rota 40, uma viagem de safari busca avistar de perto o maior felino da Patagonia, o puma, em uma região desolada de Santa Cruz.", "titulo_pt": "Patagonia selvagem: safari em busca de pumas na desolada estepa de Santa Cruz", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 145252, "titulo": "Reino Unido anuncia 400 milhões de libras em Fundo para Florestas Tropicais", "url": "https://exame.com/esg/reino-unido-anuncia-400-milhoes-de-libras-em-fundo-para-florestas-tropicais/", "fonte_id": "exame", "data_pub": "2026-09-04T11:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido anunciou um fundo de 400 milhões de libras para florestas tropicais, que será concedido como empréstimo, mas a liberação ainda depende da definição das regras de governança, da estrutura financeira e das condições da operação.", "titulo_pt": "Reino Unido anuncia 400 milhões de libras em Fundo para Florestas Tropicais", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 145987, "titulo": "Analysis: UK solar power hits record high over summer 2026", "url": "https://www.carbonbrief.org/analysis-uk-solar-power-hits-record-high-over-summer-2026", "fonte_id": "carbon_brief", "data_pub": "2026-09-04T11:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A geração de energia solar no Reino Unido atingiu um novo recorde durante o verão de 2026, coincidindo com temperaturas elevadas no país.", "titulo_pt": "Análise: geração solar no reino unido atinge novo recorde no verão de 2026", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 145713, "titulo": "Malaysia declares air quality emergency as haze linked to Indonesia fires reaches critical level", "url": "http://www.euronews.com/2026/09/04/malaysia-declares-air-quality-emergency-as-haze-linked-to-indonesia-fires-reaches-critical", "fonte_id": "euronews", "data_pub": "2026-09-04T11:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Malásia declarou uma emergência ambiental devido à neblina causada por fumos de incêndios florestais e de turfe em Indonésia, que atingiu o nível crítico e afetou também Brunei e Singapura. A neblina é um problema recorrente na região, especialmente durante a estação seca.", "titulo_pt": "Malásia declara emergência ambiental devido à neblina associada a incêndios em indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 145598, "titulo": "In Cambodia, Floating Houses Are Stuck Aground as Climate Change Takes Hold", "url": "https://thediplomat.com/2026/09/in-cambodia-floating-houses-are-stuck-aground-as-climate-change-takes-hold/", "fonte_id": "the_diplomat", "data_pub": "2026-09-04T10:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores estão observando mudanças nos padrões climáticos no Camboja devido ao avanço do aquecimento global na região.", "titulo_pt": "No camboja, casas flutuantes ficam presas no solo à medida que o clima muda", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 145988, "titulo": "How this summer’s heat and drought impacted crops in Europe – in six charts", "url": "https://www.carbonbrief.org/how-this-summers-heat-and-drought-impacted-crops-in-europe-in-six-charts", "fonte_id": "carbon_brief", "data_pub": "2026-09-04T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agrícolas europeus enfrentam os efeitos de um verão extremamente quente, seco e com incêndios florestais que agravaram as condições. Este impacto nas culturas foi ilustrado por meio de seis gráficos.", "titulo_pt": "Como o calor e a seca deste verão afetaram as culturas na Europa - em seis gráficos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 145869, "titulo": "Malaysia declares emergency in Sarawak town as haze pollution level hits 521", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366397/malaysia-declares-emergency-sarawak-town-haze-pollution-level-hits-521?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T10:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia declarou uma emergência em uma cidade de Sarawak após a poluição do ar ultrapassar o nível de emergência do país, relacionado a incêndios na Indonésia. A cidade de Serian registrou um índice de poluição do ar de 521, enquanto Kuching, a maior cidade de Sarawak, teve uma leitura perigosa de 311.", "titulo_pt": "Malásia declara emergência em cidade de Sarawak devido a poluição do ar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 144347, "titulo": "Clima: sexta terá chuva forte no Sul e baixa umidade no Nordeste", "url": "https://www.metropoles.com/brasil/clima-sexta-tera-chuva-forte-no-sul-e-baixa-umidade-no-nordeste", "fonte_id": "metropoles", "data_pub": "2026-09-04T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Esta sexta-feira (4/9) espera-se chuva forte no Sul do Brasil e baixa umidade no Nordeste. A influência de uma frente fria e de baixa umidade está prevista para marcar as condições climáticas do país.", "titulo_pt": "Clima: sexta terá chuva forte no Sul e baixa umidade no Nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 144872, "titulo": "Nepal floods ruin merchants, traders ahead of crucial festival season", "url": "https://www.japantimes.co.jp/news/2026/09/04/asia-pacific/society/nepal-floods-merchants-traders-festival/", "fonte_id": "japan_times", "data_pub": "2026-09-04T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As enchentes caíram no momento crucial entre setembro e novembro, período em que as celebrações hindus costumam impulsionar a atividade econômica através de um aumento significativo nas vendas.", "titulo_pt": "Flooding na nepal prejudica comerciantes e comerciantes antes da temporada festiva crucial", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 144378, "titulo": "Mercado de alimentos da Amazônia cresce com produção sustentável", "url": "https://www.cnnbrasil.com.br/agro/mercado-de-alimentos-da-amazonia-cresce-com-producao-sustentavel/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região amazônica está investindo em modelos de produção sustentável que combinam o uso da terra com a preservação do bioma. Este mercado valoriza produtos como açaí e castanha.", "titulo_pt": "Mercado de alimentos da Amazônia cresce com produção sustentável", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144619, "titulo": "Australian ski resorts to close up to a month early due to global heating and El Niño", "url": "https://www.theguardian.com/environment/2026/sep/04/australian-ski-resorts-to-close-up-to-a-month-early-due-to-global-heating-and-el-nino", "fonte_id": "guardian_world", "data_pub": "2026-09-04T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resort de esqui em grandes áreas da Austrália estão encerrando suas operações de esqui até um mês antes do esperado devido a condições climáticas desafiadoras e falta de neve. O inverno registrou múltiplos recordes de calor e a neve existente foi rapidamente derretida pela chuva.", "titulo_pt": "Resorts de esqui australianos fecharão até um mês mais cedo devido ao aquecimento global e El Niño", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 144990, "titulo": "2 rescued from tunnel 9 days after Nepal floods", "url": "https://www.koreaherald.com/article/10863002", "fonte_id": "korea_herald", "data_pub": "2026-09-04T05:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatados dois trabalhadores de um túnel hidrelétrico no Nepal noito dias após as cheias, provavelmente causadas pelo colapso de um glaciar, que devastaram cidades e levaram a villages no dia 26 de agosto. As equipes de emergência continuam buscando outros possivelmente presos no local.", "titulo_pt": "Dois resgatados de túnel hidrelétrico no Nepal nove dias após cheias", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 144671, "titulo": "Alerta alimentaria por Listeria: Minsal llama a no consumir pasta de jamón de conocido supermercado", "url": "https://www.latercera.com/nacional/noticia/alerta-alimentaria-por-listeria-minsal-llama-a-no-consumir-pasta-de-jamon-de-conocido-supermercado/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T02:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A autoridade sanitária chilena emitiu uma alerta relacionado a Listeria, recomendando que os consumidores não consumam uma pasta de jamón específica da marca Líder, proveniente de um supermercado conhecido, devido ao risco potencial para a saúde.", "titulo_pt": "Alerta sanitário por Listeria: minsal orienta não consumir pasta de jamón de marca líder", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 145195, "titulo": "ONU denuncia Israel por ‘possível limpeza étnica’ na Cisjordânia", "url": "https://www.cartacapital.com.br/mundo/onu-denuncia-israel-por-possivel-limpeza-etnica-na-cisjordania/", "fonte_id": "cartacapital", "data_pub": "2026-09-04T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Alto Comissariado das Nações Unidas denunciou que forças israelenses deslocaram toda a população palestina de três campos de refugiados na Cisjordânia. A ONU afirma que isso pode ser considerado uma possível limpeza étnica.", "titulo_pt": "ONU denuncia Israel por 'possível limpeza étnica' na Cisjordânia", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 145332, "titulo": "Duda Salabert diz ter sido agredida por grupo de homens em agenda em MG", "url": "https://www.cnnbrasil.com.br/eleicoes/duda-salabert-diz-ter-sido-agredida-por-grupo-de-homens-em-agenda-em-mg/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Duda Salabert afirmou ter sido agredida por um grupo de homens durante uma visita a uma mineradora suspeita de extração irregular em Minas Gerais. Ela estava em uma agenda de trabalho com o objetivo de verificar as atividades da empresa.", "titulo_pt": "Duda Salabert diz ter sido agredida por grupo de homens em visita a mineradora em MG", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 145767, "titulo": "Palestinian rights group condemns Israeli minister’s Gaza forced displacement remarks", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/palestinian-rights-group-condemns-israeli-ministers-gaza-forced", "fonte_id": "middle_east_eye", "data_pub": "2026-09-04T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Palestinian Centre for Human Rights condenou declarações do ministro de Defesa israelense Israel Katz sobre um plano para forçar o deslocamento de grandes números de palestinos de Gaza. Katz afirmou que um plano para mover palestinos 'por mar, terra e ar' estava pronto e aguardava a aprovação dos Estados Unidos.", "titulo_pt": "O grupo de direitos palestinos condena declarações do ministro israelense sobre deslocamento forçado em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 145547, "titulo": "Woman, 45, killed in Florence in seventh alleged femicide in Italy since mid-August", "url": "https://www.theguardian.com/world/2026/sep/04/lorena-isceri-killed-in-florence-femicide-italy", "fonte_id": "guardian_world", "data_pub": "2026-09-04T13:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 45 anos, Lorena Isceri, foi morta após ser jogada de um viaduto próximo a Florença, na Itália. Isso tornou-a a sétima suposta vítima de feminicídio na Itália desde meados de agosto.", "titulo_pt": "Mulher de 45 anos morta em florença na sétima suposta ocorrência de feminicídio na Itália desde agosto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 145541, "titulo": "Colombia president provokes disgust by posing with bodies of ‘terrorists’", "url": "https://www.theguardian.com/world/2026/sep/04/colombia-president-posts-video-guerrillas-body-bags-abelardo-de-la-espriella", "fonte_id": "guardian_world", "data_pub": "2026-09-04T13:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Colômbia, Abelardo De La Espriella, causou indignação ao publicar um vídeo em redes sociais mostrando uma fila de sacos de cadáveres, afirmando que contêm os corpos de 23 'neutralizados' guerrilheiros. Ele assumiu o poder há um mês prometendo uma 'guerra total' contra grupos armados ilegais e publicou o vídeo como forma de demonstrar que está cumprindo essa promessa.", "titulo_pt": "Presidente da colômbia causa indignação ao publicar vídeo com sacos de cadáveres", "veiculo": "T function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
