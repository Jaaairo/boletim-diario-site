": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 80876, "titulo": "'Não consigo mudar de cor assim', diz candidato a concurso com declaração racial aceita e rejeitada por mesma fundação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/nao-consigo-mudar-de-cor-assim-diz-candidato-a-concurso-com-declaracao-racial-aceita-e-rejeitada-por-mesma-fundacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação Carlos Chagas deferiu a autodeclaração racial de um candidato em um concurso e a indeferiu em outro, ocorrendo isso em menos de quatro meses.", "titulo_pt": "‘Não consigo mudar de cor assim’, diz candidato a concursos com declarações raciais aceitas e rejeitadas pela mesma fundação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 81751, "titulo": "Filhotes de arara exclusiva do Nordeste brasileiro nascem na Bélgica; veja", "url": "https://www.cnnbrasil.com.br/ciencia/filhotes-de-arara-exclusiva-do-nordeste-brasileiro-nascem-na-belgica-veja/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas araras-de-lear, uma espécie ameaçada de extinção localizada na Caatinga da Bahia, foram nascidas em um zoológico belga. Este é agora o único centro público no mundo a ter conseguido reproduzir as três espécies de araras-azuis.", "titulo_pt": "Filhotes de arara-de-lear, exclusiva do Nordeste brasileiro, nascem na Bélgica; veja", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81921, "titulo": "Promessa de gás a US$ 5 põe ANP e PPSA sob pressão máxima", "url": "https://veja.abril.com.br/coluna/radar-economico/promessa-de-gas-a-us-5-poe-anp-e-ppsa-sob-pressao-maxima/", "fonte_id": "veja", "data_pub": "2026-07-30T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço de gás anunciado pelo governo é mais baixo do que o valor cobrado pela Petrobras para escoar e processar o produto, colocando a ANP e PPSA sob pressão. A promessa de gás a US$ 5 põe as agências reguladoras em situação delicada.", "titulo_pt": "Promessa de gás a US$ 5 coloca ANP e PPSA sob pressão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82455, "titulo": "Correcting climate ‘misperceptions’ may not boost climate action", "url": "https://www.carbonbrief.org/correcting-climate-misperceptions-may-not-boost-climate-action", "fonte_id": "carbon_brief", "data_pub": "2026-07-30T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que o público geral subestima o apoio à ação climática e sobreestima as ações reais tomadas por outras pessoas para abordar o clima. Corrigir essas percepções incorretas pode não necessariamente aumentar a ação climática.", "titulo_pt": "Corrigir 'percepções errôneas' sobre o clima pode não melhorar as ações climáticas", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 81843, "titulo": "Quando os rios adoecem", "url": "https://www.jota.info/opiniao-e-analise/colunas/em-clima-de-justica/quando-os-rios-adoecem", "fonte_id": "jota", "data_pub": "2026-07-30T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O garimpo e a degradação silenciosa dos sistemas aquáticos da Amazônia descrevem como atividades ilegais e o uso inadequado estão afetando os rios e lagos da região amazônica, causando danos sutis mas significativos ao ecossistema.", "titulo_pt": "Quando os rios adoecem", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81973, "titulo": "Firefighters race to extinguish blazes across EU as fire weather breaks records", "url": "https://www.theguardian.com/world/2026/jul/30/fire-weather-eu-wildfires-data", "fonte_id": "guardian_world", "data_pub": "2026-07-30T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Condições quentes, secas e ventosas na Europa estão 43% mais severas do que a média dos últimos 20 anos. Incêndios florestais em todo o Mediterrâneo são controlados por bombeiros enquanto as condições climáticas extremas batem recordes de severidade para esta época do ano.", "titulo_pt": "Bombeiros correm contra o tempo para apagar incêndios na Europa com condições meteorológicas recorde", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 82152, "titulo": "Unprecedented drought hits central France: 'Nothing grows anymore, it has become a desert'", "url": "https://www.lemonde.fr/en/environment/article/2026/07/30/unprecedented-drought-hits-central-france-nothing-grows-anymore-it-has-become-a-desert_6756006_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma seca sem precedentes atinge o centro da França, com apenas três dos 35 riachos monitorados pelo Serviço Francês de Biodiversidade ainda fluindo. As condições são as mais baixas desde que o monitoramento começou em 2012.", "titulo_pt": "Seca sem precedentes atinge centro da França: 'nada cresce mais, tornou-se um deserto'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 82456, "titulo": "Factcheck: No, Europe is not having its ‘quietest’ year for wildfires", "url": "https://www.carbonbrief.org/factcheck-no-europe-is-not-having-its-quietest-year-for-wildfires", "fonte_id": "carbon_brief", "data_pub": "2026-07-30T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na última semana, críticos do clima e comentaristas de direita compartilharam gráficos nas redes sociais sugerindo erroneamente que a Europa está experimentando seu ano mais calmo em termos de incêndios florestais. O Carbon Brief refuta essa afirmação, indicando que não é verdade que este seja o ano menos propício a incêndios na região.", "titulo_pt": "Verificação de fatos: não, Europa não está tendo seu ‘ano mais calmo’ em termos de incêndios florestais", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 82180, "titulo": "Drone footage captures massive Castellon wildfire in eastern Spain", "url": "http://www.euronews.com/video/2026/07/30/drone-footage-captures-massive-castellon-wildfire-in-eastern-spain", "fonte_id": "euronews", "data_pub": "2026-07-30T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos selvagens continuam a queimar em Espanha, com equipes lutando contra incêndios em Castellón e Zamora. Milhares de pessoas foram evacuadas e aviões estão auxiliando nos esforços de combate aos incêndios.", "titulo_pt": "Vídeo por drone captura grande incêndio em castellón, Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 81966, "titulo": "Fifteen elephant deaths at Kenya park may be due to cyanide poisoning", "url": "https://www.theguardian.com/environment/2026/jul/30/elephant-deaths-kenya-park-cyanide-poisoning-wildlife", "fonte_id": "guardian_world", "data_pub": "2026-07-30T12:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Kenya Wildlife Service (KWS) informou que a morte de 15 elefantes perto de um parque na região sul do país, ocorrida recentemente, pode ter sido causada pelo consumo de pesticidas usados em plantações de tomates próximas. Análises realizadas nos corpos dos animais detectaram traços de cianeto, substância utilizada no controle predatório e como fumigante na agricultura, que também é empregada por caçadores ilegais.", "titulo_pt": "Dezessete mortes de elefantes em parque da kenia podem ser resultado de envenenamento com cianeto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 82184, "titulo": "Crete wildfire kills two firefighters as fierce flames spread in Greece", "url": "http://www.euronews.com/video/2026/07/30/crete-wildfire-kills-two-firefighters-as-fierce-flames-spread-in-greece", "fonte_id": "euronews", "data_pub": "2026-07-30T11:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogo selvagem continua a queimar na ilha de Creta, Grécia, onde dois bombeiros morreram com ventos fortes alimentando as chamas e aviões participando dos esforços de resgate.", "titulo_pt": "Incêndio em creta mata dois bombeiros", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 82390, "titulo": "A Civilian Plane Crashed in New Mexico. Was the Military’s Tech to Blame?", "url": "https://www.wired.com/story/a-civilian-plane-crashed-in-new-mexico-was-the-militarys-tech-to-blame/", "fonte_id": "wired", "data_pub": "2026-07-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião civil caiu no Novo México, e a tecnologia militar de drones pode ter contribuído para o incidente. O uso de drones está aumentando os riscos no céu, mesmo para aviões longe das zonas de conflito.", "titulo_pt": "Acidente com avião civil em novo México: a tecnologia militar de drones culpa?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 81297, "titulo": "Hundreds evacuated as wildfires sweep Turkey's western and southern coasts", "url": "http://www.euronews.com/2026/07/30/hundreds-evacuated-as-wildfires-sweep-turkeys-western-and-southern-coasts", "fonte_id": "euronews", "data_pub": "2026-07-30T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas foram evacuadas e estradas fechadas nas regiões costeiras ocidentais e sul do Turquia devido a incêndios ativos em distritos como Kaş e Muğla, que se espalharam para seis províncias sob o efeito do calor extremo.", "titulo_pt": "Centenas evacuadas por incêndios na costa ocidental e sul do Turquia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 81287, "titulo": "How firefighters and volunteers supported by water planes imposed a major setback to the Gironde fire as it was about to swallow more homes", "url": "https://www.lemonde.fr/en/environment/article/2026/07/30/how-firefighters-and-volunteers-supported-by-water-planes-imposed-a-major-setback-to-the-gironde-fire-as-it-was-about-to-swallow-more-homes_6755990_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O incêndio na região de Gironde, no sul da França, avançou rapidamente para uma área residencial. No entanto, com a ajuda dos bombeiros e moradores locais, juntamente com o apoio do ar, foi possível conter o fogo no último momento.", "titulo_pt": "Bombeiros e voluntários com auxílio de aviões de água impuseram um forte revés ao incêndio na Gironde", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 81301, "titulo": "Germany heatwave sees Cologne residents cool off in mist", "url": "http://www.euronews.com/video/2026/07/30/germany-heatwave-sees-cologne-residents-cool-off-in-mist", "fonte_id": "euronews", "data_pub": "2026-07-30T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Colônia, Alemanha, os moradores se refrescam com chuveiros públicos enquanto as temperaturas chegam a 35°C. Os níveis baixos do Rio Rin reflectem o impacto da estação seca.", "titulo_pt": "Calor intenso em colônia: moradores se refrescam com chuveiros públicos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 80978, "titulo": "As hidrelétricas estão preparadas para os eventos climáticos extremos?", "url": "https://exame.com/esg/as-hidreletricas-estao-preparadas-para-os-eventos-climaticos-extremos/", "fonte_id": "exame", "data_pub": "2026-07-30T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As usinas hidrelétricas dependem de um cálculo que considera o pior cenário climático possível, ignorando probabilidades mais comuns. Este método é crucial para garantir a operação das usinas mesmo em eventos extremos.", "titulo_pt": "As hidrelétricas estão preparadas para os eventos climático function renderSecao(topico) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
