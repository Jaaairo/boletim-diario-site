const D = {"gerado_em": "04/09/2026 07:24", "stats": {"noticias_novas": 890, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A crise no Supremo Tribunal Federal (STF) continua aprofundando-se, com o ministro Alexandre de Moraes acusando o colega André Mendonça de abuso de autoridade, favorecimento a grupos políticos e outras irregularidades, agravando a situação já instável do tribunal. A investigação foi solicitada ao presidente do STF, Luís Roberto Barroso, no âmbito de um inquérito sobre fake news. Em meio a esse caos, a campanha de Lula decidiu usar a questão para incluí-la na propaganda eleitoral, enquanto aliados do ex-presidente defendem Roberta Luchsinger, amiga de Lula, contra os ataques. Segundo a pesquisa do Datafolha, Lula lidera com 38% das intenções de voto no primeiro turno, seguido por Flávio Bolsonaro com 33%, e Augusto Cury em terceiro com 8%. A campanha de Lula admitiu que a disputa está indefinida, enquanto os bolsonaristas defendem Mendonça contra as acusações de Moraes.", "mundo": "Giorgia Meloni lidera o governo italiano mais longo desde a Segunda Guerra Mundial, um marco que seus apoiantes comemoram, mas analistas alertam sobre a instabilidade potencial. Em outro desenvolvimento, novos temores de interrupção na suprimento de petróleo surgiram com a retomada das hostilidades entre Estados Unidos e Irã, levando os preços do petróleo a registrar o maior ganho semanal desde julho. A Holanda retirou 12 bilhões de dólares em ouro de depósitos nos EUA e no Canadá, transferindo-os para um banco em Londres. O governo Trump propôs uma regra que retiraria o status imune à tributação para escolas privadas e colégios se eles fornecessem assistência direcionada a estudantes com base em sua raça. Além disso, o presidente argentino, Javier Milei, ameaçou impor sanções a empresas de petróleo operando nas águas do Falklands. A Holanda retirou 12 bilhões de dólares em ouro dos EUA e do Canadá, transferindo-os para um banco em Londres. O presidente dos Estados Unidos, Donald Trump, afirmou que o Reino Unido está 'al borde do desastre', citando preocupações sobre imigração e energia. Em outro evento, o governo Trump lançou um jogo chamado Rio Run que apresenta um agente de fronteira americano perseguiendo migrantes de diferentes corpos de pele ao longo do Rio Grande na fronteira com o México.\n\nOs desafios geopolíticos continuam a dominar o cenário internacional, com foco em tensões regionais e questões econômicas. O presidente argentino Javier Milei reafirmou a reivindicação do país sobre as Ilhas Malvinas, o que levou o Reino Unido a reafirmar seu compromisso inabalável com o território. As tensões entre Estados Unidos e Irã aumentaram com ataques iranianos a alvos militares na região, impactando o preço do petróleo. Diante das sanções, a União Europeia se juntou formalmente à campanha de sanções contra o Irã, enquanto a Coreia do Sul considera uma presença militar para ajudar a reabrir o Estreito de Ormuz. As tensões entre Israel e Palestina continuam, com Israel expandindo o uso de tecnologia de inteligência artificial em sua campanha. Apesar das destruições causadas por ataques israelenses, cidadãos do sul do Líbano estão retornando às suas casas. Em outro front, a Alemanha enfrenta preocupações com os baixos níveis de gás, enquanto a Rússia busca um papel de 'gateway' para a Indonésia no Mercosul.", "economia": "A Volkswagen planeja reduzir 100.000 postos de trabalho até o final da década, incluindo 50.000 adicionalmente, como parte de um esforço para se reestruturar e enfrentar a concorrência intensa de fabricantes chineses. A empresa também anunciou a encerramento gradual da produção em quatro plantas alemãs entre 2031 e 2034, o que pode afetar significativamente a economia local. Em outro destaque, a NBS Petróleo e Gás, uma junior oil fundada por ex-funcionários da Petrobras, iniciará a produção em seus dois primeiros campos no Espírito Santo, após autorização da Agência Nacional do Petróleo, e planeja explorar oportunidades de crescimento por meio de fusões e aquisições (M&A). O Scotiabank estima que a Margem Equatorial precisará de investimentos no valor de 36 bilhões de dólares, com o primeiro óleo previsto para 2033. Além disso, o Banco Central da Argentina (BCRA) compartilhará informações com administradores de transferências para detectar contas relacionadas a fraude e jogo ilegal, enquanto a Anvisa planeja iniciar um processo para regularizar a venda de medicamentos em plataformas online.", "tecnologia": "A Nvidia se tornou a empresa mais valiosa do mundo, avaliada em 5,4 trilhões de dólares, graças à alta demanda global por suas tecnologias que alimentam a inteligência artificial (IA). A OpenAI lançou seu mais recente modelo de IA, considerado o mais avançado do mundo, em uma tentativa de superar a rival Anthropic. A empresa treina 90% de seus funcionários em IA e destaca a importância de competências humanas nas decisões, relações e liderança, acreditando que essas habilidades se tornarão cada vez mais relevantes à medida que a tecnologia avança. A Nvidia está adquirindo a plataforma de IA Hugging Face por 12,9 bilhões de dólares, enquanto a OpenAI promete investir 1 bilhão de dólares para subsidiar o acesso às suas ferramentas de segurança digital baseadas em IA. Além disso, a projeção é que o gasto com data centers chegue a 3,16 trilhões de dólares até 2050, refletindo o crescimento contínuo da importância dos centros de dados em diversos setores.", "ciencia": "Em 2026, a França registrou sua estação mais quente na história, com ondas de calor extremas, seca severa e grandes incêndios florestais, conforme informou o ministro do Meio Ambiente. Este evento climático extremo, causado pelo fenômeno El Niño, levou o Canal do Panamá a limitar o número de navios que transitam pela rota crucial. Na área da saúde, dois receptores de rins editados geneticamente de porcos realizaram transplantes de órgãos humanos com sucesso, marcando um avanço significativo na xenotransplantação. Além disso, estudos científicos estão explorando novas maneiras de projetar casas para abrigar espécies de animais selvagens, como cangurus sem nariz e marsupiais como os possums, e desenvolvendo adesivos resistentes à luz que podem ser desligados e reutilizados.", "cultura": "O Rock in Rio 2026 começou sua programação nesta sexta-feira (4), com apresentações de artistas como Elton John, Foo Fighters, Avenged Sevenfold e Calvin Harris. O evento oferece transmissões ao vivo e apresentações em seis espaços diferentes. A Globo anunciou a demissão de três diretores após erros na cobertura da Copa do Brasil, com Paulo Marinho sendo o responsável pela comunicação das saídas. A Bienal do Livro de São Paulo começa no Distrito Anhembi, com uma programação variada de autores nacionais e estrangeiros. Entre as novidades, a Netflix revelou que possui 35 milhões de assinantes brasileiros no plano com anúncios, gerando faturamento de R$ 500 milhões no país. O Festival de Veneza de 2026 também se destacou, exibindo a película 'Ink', que aborda a rápida ascensão de um tabloide. Além disso, a Pinacoteca de São Paulo exibe 'Ismael Nery: Armadilha Moderna', uma retrospectiva com 230 obras do artista, e a Netflix apresenta o MO6, um material de construção capaz de armazenar carbono.", "sociedade": "Axel Starke, um corredor de 48 anos, teve um colapso cardíaco a 300 metros da meta da Meia Maratona de Buenos Aires e faleceu cinco dias depois, apesar da internação. A família alega que o atleta não recebeu assistência adequada no momento certo. No Brasil, o Supremo Tribunal Federal decidiu que o acesso à Justiça do Trabalho gratuita está limitado a trabalhadores com salários até R$ 5.000, restringindo o acesso a cerca de 235 mil pedidos. Em Goiás, a Polícia Rodoviária Federal apreendeu 2 mil cigarros eletrônicos e 150 perfumes em um ônibus. Em Suzano, um homem foi encontrado morto minutos após roubar uma farmácia. Além disso, o governo chileno aprovou um novo bono de 30 mil pesos por filho para famílias de baixa renda, e a China enviou o terceiro lote de ajuda ao Nepal após a avalanche, incluindo materiais, especialistas e assistência financeira.", "meio_ambiente": "O verão de 2026 foi o mais quente já registrado na França, com a temperatura superando o recorde por quase 1°C, conforme informou a ministra do Meio Ambiente. Este aumento é atribuído ao aquecimento global. Em outro desenvolvimento climático, o Bureau of Meteorology prevê que o El Niño será o mais forte já registrado, com a temperatura do Pacífico superando 2°C em seis meses. A Indonésia enfrenta incêndios florestais que ameaçam liberar grandes quantidades de carbono, lembrando a crise de 2015. O Reino Unido planeja investir 2,7 bilhões de reais em um mecanismo financeiro para incentivar a preservação das florestas tropicais no Brasil. Além disso, o Nepal enfrenta desafios climáticos, com as enchentes causando danos econômicos significativos, enquanto o Chile implementa medidas para ajudar pinguins feridos com coletes especiais.", "direitos_humanos": "A Romênia denunciou Andrew Tate e seu irmão Tristan por tráfico de menores e lavagem de dinheiro após a extradição dos dois do Reino Unido. Em junho de 2025, a brasileira Alice foi deportada dos Estados Unidos devido a uma operação de busca e captura de imigrantes ilegais. A Amnistia Internacional denunciou que o Exército israelense intensificou a confiscação de terras no norte de Cisjordânia com o objetivo de acelerar a anexação do Território Palestino. A UNICEF alertou que mais de 20 milhões de crianças enfrentam abuso sexual online anualmente, com mais de um quinto das crianças entre 12 e 17 anos sendo alvo em plataformas digitais. Além disso, o governo sul-africano é processado por vítimas do massacre de Sharpeville em 1960, que ocorreu durante o apartheid."}, "resumo_do_dia": {"politica_nacional": [{"id": 144460, "titulo": "'Não tem ninguém certo nessa história': analistas apontam crise sem precedentes e enraizada no STF", "url": "https://www.bbc.com/portuguese/articles/cgrvgd7j7k8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-04T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Analistas apontam que a crise no Supremo Tribunal Federal (STF) é sem precedentes e enraizada, com a percepção pública de que o tribunal está em crise. Uma cientista política comentou que, para a sociedade, o STF parece estar implodindo, após novos capítulos de crise envolvendo ministros do tribunal.", "titulo_pt": "Não tem ninguém certo nessa história: crise no STF é sem precedentes e enraizada", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 144328, "titulo": "Mulher de Lulinha defende Roberta Luchsinger, após Lula chamá-la de pilantra: ‘Sério?’", "url": "https://veja.abril.com.br/brasil/mulher-de-lulinha-defende-roberta-luchsinger-apos-lula-chama-la-de-pilantra-serio/", "fonte_id": "veja", "data_pub": "2026-09-04T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renata Moreira, esposa de Lula, discutiu com um membro de grupo de WhatsApp após esse atacar Roberta Luchsinger, amiga do marido de Lula, que está sendo investigada pela Polícia Federal.", "titulo_pt": "Renata moreira defende Roberta Luchsinger, após Lula chamá-la de pilantra: ‘sério?’", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 144498, "titulo": "Presunção de relevância da questão federal e o Regimento Interno do STJ", "url": "https://www.jota.info/opiniao-e-analise/artigos/presuncao-de-relevancia-da-questao-federal-e-o-regimento-interno-do-stj", "fonte_id": "jota", "data_pub": "2026-09-04T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A emenda regimental da Corte pode ter revogado tacitamente a presunção de relevância da questão federal. Isso pode indicar uma mudança nas práticas internas do STJ.", "titulo_pt": "Emenda regimental do STJ pode ter revogado presunção de relevância da questão federal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144357, "titulo": "Campanha avalia se Lula levará crise do STF ao horário eleitoral", "url": "https://www.metropoles.com/colunas/milena-teixeira/campanha-avalia-se-lula-levara-crise-do-stf-ao-horario-eleitoral", "fonte_id": "metropoles", "data_pub": "2026-09-04T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do ex-presidente Lula estão discutindo se ele deve incluir em seu horário eleitoral uma declaração sobre a crise no Supremo Tribunal Federal.", "titulo_pt": "Campanha decide se Lula trará crise do STF aos horários eleitorais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 144501, "titulo": "MP 1.376/26 e limites da política agrícola brasileira", "url": "https://www.jota.info/opiniao-e-analise/artigos/mp-1-376-26-e-limites-da-politica-agricola-brasileira", "fonte_id": "jota", "data_pub": "2026-09-04T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A renegociação de dívidas é necessária, mas destaca a assimetria na política agrícola prevista na Constituição.", "titulo_pt": "MP 1.376/26 e limites da política agrícola brasileira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144206, "titulo": "Ronaldo Caiado participa de sabatina da Folha/UOL nesta sexta (4)", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ronaldo-caiado-participa-de-sabatina-da-folhauol-nesta-sexta-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidenciável Ronaldo Caiado, do PSD, participa nesta sexta-feira (4) de uma sabatina organizada pela Folha e pelo UOL.", "titulo_pt": "Ronaldo Caiado participa de sabatina da Folha/UOL nesta sexta (4)", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 144273, "titulo": "O contra-ataque de Moraes a Mendonça: a crise inédita na história do Supremo - O Assunto #1798", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/09/04/o-contra-ataque-de-moraes-a-mendonca-a-crise-inedita-na-historia-do-supremo-o-assunto-1798.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T06:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministro Alexandre de Moraes encaminhou ao presidente do STF, Edson Fachin, um pedido de investigação contra André Mendonça no âmbito do inquérito das fake news. O pedido acusa Mendonça de improbidade administrativa, abuso de autoridade, crime de responsabilidade e favorecimento a grupos políticos.", "titulo_pt": "O contra-ataque de Moraes a Mendonça: a crise inédita no Supremo - O Assunto #1798", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 144458, "titulo": "Moraes acusa Mendonça de agir para favorecer 'grupos políticos', pede providências de Fachin e agrava crise no STF", "url": "https://www.bbc.com/portuguese/articles/cly457vr0nro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-04T05:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre de Moraes acusou Luís Roberto Mendonça de agir para favorecer grupos políticos e pediu providências de Fachin. Moraes usou o Inquérito das Fake News para requisitar relatórios de inteligência contra Mendonça, agravando a crise no STF.", "titulo_pt": "Moraes acusa Mendonça de favorecer grupos políticos e pede providências de Fachin, agravando crise no STF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 144207, "titulo": "Segurança bloqueia acesso a fachada de vidro do STF após foto de ministros às gargalhadas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/seguranca-bloqueia-acesso-a-fachada-de-vidro-do-stf-apos-foto-de-ministros-as-gargalhadas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T03:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF limitou o acesso de fotógrafos à fachada do edifício-sede após um flagrante de ministros sorrindo durante uma crise envolvendo mensagens de um ex-banqueiro.", "titulo_pt": "Segurança bloqueia acesso à fachada do STF após foto de ministros sorrindo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 144208, "titulo": "Datafolha: Lula mantém dianteira entre nordestinos, e Flávio entre sulistas; Cury avança entre jovens", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/datafolha-lula-mantem-dianteira-entre-nordestinos-e-flavio-entre-sulistas-cury-avanca-entre-jovens.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T03:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nova pesquisa do Datafolha, divulgada em 3 de abril, indica que Lula mantém a vantagem entre os nordestinos e Flávio Bolsonaro entre os sulistas. O levantamento também mostra que Cury ganhou apoio entre os jovens.", "titulo_pt": "Datafolha: lula mantém liderança entre nordestinos, Flávio entre sulistas; Cury avança com jovens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 144274, "titulo": "Arruda pode seguir fazendo campanha no DF? Pode recorrer? Entenda o que acontece agora", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/09/04/arruda-pode-seguir-fazendo-campanha-no-df-pode-recorrer-entenda-o-que-acontece-agora.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T03:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral do Distrito Federal rejeitou o registro da candidatura do ex-governador José Roberto Arruda ao governo do DF por unanimidade. Arruda anunciou que recorreria ao Tribunal Superior Eleitoral.", "titulo_pt": "Arruda pode recorrer após rejeição do registro de candidatura no DF?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 144275, "titulo": "Ministério da Saúde admite ‘fragilidades’ e ‘deficiências’ na execução de emendas, mas diz que problemas foram corrigidos", "url": "https://g1.globo.com/politica/noticia/2026/09/04/ministerio-da-saude-admite-fragilidades-e-deficiencias-na-execucao-de-emendas-mas-diz-que-problemas-foram-corrigidos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde admitiu fragilidades e deficiências na execução de emendas, mas informou que os problemas foram corrigidos. A nota técnica foi enviada ao Supremo Tribunal Federal em resposta a uma decisão do ministro Flávio Dino.", "titulo_pt": "Ministério da Saúde admite 'fragilidades' e 'deficiências' na execução de emendas, mas afirma que problemas foram corrigidos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 144276, "titulo": "Datafolha, 1º turno: veja intenção de voto por região, gênero, idade, identificação política, cor e religião no cenário sem Pablo Marçal", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/04/datafolha-1o-turno-segmentos-cenario-2.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada nesta quinta-feira (3), indica que Lula (PT) lidera com 38% das intenções de voto no 1º turno, seguido por Flávio Bolsonaro (PL) com 33%. A pesquisa exclui o candidato Pablo Marçal (PRTB), que está inelegível.", "titulo_pt": "Datafolha, 1º turno: veja intenção de voto por região, gênero, idade, identificação política, cor e religião no cenário sem Pablo Marçal", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 144277, "titulo": "Eleições 2026: O que faz um senador?", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/04/eleicoes-2026-o-que-faz-um-senador.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador representa um estado ou o Distrito Federal no Senado Federal, com mandato de oito anos, e tem como principais funções criar e revisar leis federais, fiscalizar o governo federal e exercer atribuições constitucionais. O Senado é composto por 81 senadores, com três por estado e um para o Distrito Federal, em eleições alternadas.", "titulo_pt": "O que faz um senador?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 144278, "titulo": "Nikolas e Vorcaro: ouça ÁUDIO, leia transcrição e veja o que deputado falou sobre as mensagens", "url": "https://g1.globo.com/politica/noticia/2026/09/04/nikolas-e-vorcaro-ouca-audio-leia-transcricao-e-veja-o-que-ex-deputado-falou-sobre-as-mensagens.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas Ferreira (PL-MG) enviou mensagens a Daniel Vorcaro pedindo ajuda para o ex-assessor Thiago Rodrigues de Faria na liberação de um ativo minerário. A informação foi revelada inicialmente pelo 'ICL Notícias' e confirmada pela GloboNews.", "titulo_pt": "Nikolas e Vorcaro: ouça ÁUDIO, leia transcrição e veja o que deputado falou sobre as mensagens", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 144279, "titulo": "Datafolha, 1º turno: veja intenção de voto por região, gênero, idade, identificação política, cor e religião no cenário com Pablo Marçal", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/04/datafolha-1o-turno-segmentos-cenario-1.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada nesta quinta-feira (3), indica que Lula (PT) lidera com 38% das intenções de voto no 1º turno, seguido por Flávio Bolsonaro (PL) com 33%. Pablo Marçal (PRTB), inelegível, aparece com 2%. Os demais candidatos obtiveram menores porcentagens.", "titulo_pt": "Datafolha, 1º turno: veja intenção de voto por região, gênero, idade, identificação política, cor e religião no cenário com Pablo Marçal", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 144749, "titulo": "Investigation into Air India flight plunge highlights triple hydraulic failure and pilot drug test", "url": "http://www.euronews.com/2026/09/04/investigation-into-air-india-flight-plunge-highlights-triple-hydraulic-failure-and-pilot-d", "fonte_id": "euronews", "data_pub": "2026-09-04T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A investigação da Agência de Investigação de Acidentes Aeronáuticos da Índia revelou que o avião da Air India sofreu uma falha hidráulica tripla, com o piloto automático desligado e um aviso de estagnação ativado por dois segundos.", "titulo_pt": "Investigação do voo da Air India destaca falha hidráulica tripla e teste de drogas do piloto", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 144601, "titulo": "Live Updates: Rescuers Search Nepal Tunnel for Survivors After Finding 2 Alive", "url": "https://www.nytimes.com/live/2026/09/04/world/nepal-flash-floods-rescue-tunnels", "fonte_id": "nyt_world", "data_pub": "2026-09-04T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias pessoas ainda estão supostamente presas em um túnel de um projeto hidrelétrico desde a última semana após um desastre fatal de inundações. Não está claro quantas pessoas ainda estão vivas.", "titulo_pt": "Atualizações em tempo real: resgatadores buscam sobreviventes em túnel de Nepal após encontrar 2 vivos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 144763, "titulo": "New fears of oil supply disruption as US-Iran hostilities resume", "url": "https://www.france24.com/en/video/20260904-new-fears-of-oil-supply-disruption-as-us-iran-hostilities-resume", "fonte_id": "france24", "data_pub": "2026-09-04T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos temores de interrupção na suprimento de petróleo surgiram com a retomada das hostilidades entre Estados Unidos e Irã. Os preços do petróleo estão registrando o maior ganho semanal desde julho, com alta de 7,6%, enquanto a guerra entre os dois países, que começou há sete meses, bloqueou o Estreito de Ormuz, por onde passa 25% da produção mundial de petróleo.", "titulo_pt": "Novos temores de interrupção na suprimento de petróleo com retomada das hostilidades entre EUA e Irã", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 144762, "titulo": "The case that shocked Mexico: The investigation into the murders of Jonathan Meléndez and his family", "url": "https://english.elpais.com/international/2026-09-04/the-case-that-shocked-mexico-the-investigation-into-the-murders-of-jonathan-melendez-and-his-family.html", "fonte_id": "elpais_en", "data_pub": "2026-09-04T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário argentino Diego Sebastián Rosen Ferlini foi detido, mas sua prisão não esclareceu os assassinatos do músico Camilo Séptimo, sua namorada grávida, sua filha e uma empregada doméstica.", "titulo_pt": "O caso que chocou o México: a investigação sobre os assassinatos de Jonathan Meléndez e sua família", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 144805, "titulo": "Meloni sets a record, leading Italy’s longest-serving government since WWII", "url": "https://www.aljazeera.com/news/2026/9/4/meloni-sets-a-record-leading-italys-longest-serving-government-since-wwii?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-04T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Giorgia Meloni lidera o governo italiano mais longo desde a Segunda Guerra Mundial. Os apoiantes comemoram o marco, enquanto analistas alertam que a longevidade não garante estabilidade.", "titulo_pt": "Meloni bate recorde, liderando governo italiano mais longo desde a segunda guerra mundial", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144764, "titulo": "From forced labour to World Heritage: Sao Tome's colonial plantations", "url": "https://www.france24.com/en/video/20260904-from-forced-labour-to-world-heritage-sao-tome-s-colonial-plantations", "fonte_id": "france24", "data_pub": "2026-09-04T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As plantações coloniais conhecidas como 'Rocas' em São Tomé e Príncipe foram incluídas na Lista do Patrimônio Mundial da UNESCO em julho de 2026, em reconhecimento à sua arquitetura e importância histórica para o país. Apesar de grande parte delas estar em estado de abandono, elas estão ganhando interesse de investidores que buscam desenvolver o potencial turístico desses edifícios carregados de história.", "titulo_pt": "De trabalho forçado a patrimônio mundial: as plantações coloniais de são tomé", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 144806, "titulo": "Israel takes its war on Palestine into the AI age", "url": "https://www.aljazeera.com/opinions/2026/9/4/israel-takes-its-war-on-palestine-into-the-ai-age?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-04T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O incidente em Hanover revela uma nova frente na longa campanha israelense de moldar como os palestinos são percebidos.", "titulo_pt": "Israel leva sua guerra contra os palestinos para a era da IA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144605, "titulo": "Nigel Farage to Speak at Reform UK Conference Amid Scrutiny Over Party Finances", "url": "https://www.nytimes.com/2026/09/04/world/europe/farage-reform-uk-conference-donations.html", "fonte_id": "nyt_world", "data_pub": "2026-09-04T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advisers do líder do Reform U.K., Nigel Farage, foram filmados supostamente organizando contribuições de um homem que se passava por um doador estrangeiro. Há uma investigação sobre as finanças do partido.", "titulo_pt": "Nigel Farage vai falar na conferência Reform u.K. Sob investigação sobre finanças", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 144623, "titulo": "Romanian prosecutors indict Andrew Tate for trafficking minors, money laundering – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/04/russia-ukraine-eu-ministers-migration-hubs-meloni-bardella-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-04T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador romeno apresentou acusações formais contra Andrew Tate e seu irmão por supostos crimes de tráfico de menores e lavagem de dinheiro. Um advogado dos Tate afirmou que eles examinarão cuidadosamente as acusações e buscarão desafiar quaisquer deficiências evidenciais, procedimentais ou legais através do processo judicial adequado.", "titulo_pt": "Procuradores romenos indiciam Andrew Tate por tráfico de menores e lavagem de dinheiro", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 144898, "titulo": "How natural disasters are putting China’s neighbourhood diplomacy to the test", "url": "https://www.scmp.com/news/china/diplomacy/article/3366345/how-natural-disasters-are-putting-chinas-neighbourhood-diplomacy-test?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desastres naturais na fronteira entre China e Nepal estão testando a diplomacia da vizinhança chinesa, devido a crescentes choques climáticos que expõem vulnerabilidades estratégicas. Um colapso repentina de geleiras no Himalaia causou inundações e destruição em vilas próximas e no porto de Gyirong, resultando em mais de 1.250 mortos na Nepal e 21 mortos na região autônoma do Tibete.", "titulo_pt": "Como desastres naturais estão testando a diplomacia da vizinhança da China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 144809, "titulo": "Why has the Philippine peso plunged to a record low?", "url": "https://www.aljazeera.com/economy/2026/9/4/why-has-the-philippines-peso-plunged-to-a-record-low?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-04T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O câmbio da moeda filipina atingiu um novo baixo histórico devido aos efeitos da guerra com a Irã e desafios econômicos internos.", "titulo_pt": "Por que o peso filipino atingiu um novo baixo histórico?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144725, "titulo": "Europe seeks to deter Russia after attempted attack in Leipzig", "url": "https://www.lemonde.fr/en/international/article/2026/09/04/europe-seeks-to-deter-russia-after-attempted-attack-in-leipzig_6757151_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-04T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Atos hostis atribuídos a Moscou estão se multiplicando na Europa. Em 3 de setembro, Copenhague acusou Moscou de preparar 'ações de sabotagem' contra a indústria de defesa da Dinamarca. No entanto, os países europeus permanecem divididos sobre como responder.", "titulo_pt": "Europa busca dissuadir Rússia após tentativa de ataque em Leipzig", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 144853, "titulo": "Romania Opens New Human Trafficking Case Against Tate Brothers", "url": "https://balkaninsight.com/2026/09/04/romania-opens-new-human-trafficking-case-against-tate-brothers/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-04T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Bucareste expandiram a investigação contra os influenciadores controversos Andrew e Tristan Tate, agora levantando acusações de tráfico humano.", "titulo_pt": "Romênia abre novo caso de tráfico humano contra os Tate Brothers", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 144873, "titulo": "Panel may consider restricting evidence use in civil trials in Japan", "url": "https://www.japantimes.co.jp/news/2026/09/04/japan/crime-legal/justice-ministry-civil-trials/", "fonte_id": "japan_times", "data_pub": "2026-09-04T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Código de Processo Civil atualmente não proíbe o uso de evidências e informações confidenciais para fins não relacionados a julgamentos ou a fornecimento de cópias a terceiros. Pode haver considerações sobre a possibilidade de limitar o uso dessas provas em futuros julgamentos civis no Japão.", "titulo_pt": "Comitê pode avaliar restrições no uso de provas em processos civis no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 144787, "titulo": "Argentina's Milei escalates Falklands dispute as Trump questions U.S. support for Britain", "url": "https://www.cnbc.com/2026/09/04/argentina-milei-falklands-oil-uk-trump.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente argentino Javier Milei reafirmou a reivindicação do país sobre as Ilhas Malvinas e ameaçou impor sanções às empresas de petróleo. O ex-presidente dos Estados Unidos, Donald Trump, questionou o apoio dos EUA à Grã-Bretanha em relação ao conflito.", "titulo_pt": "Milei reforça reivindicação das ilhas malvinas e Trump questiona apoio dos EUA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 144617, "titulo": "South Korea pushes back on reports it is readying Hormuz deployment amid US pressure", "url": "https://www.theguardian.com/world/2026/sep/04/south-korea-pushes-back-reports-hormuz-deployment-us-pressure", "fonte_id": "guardian_world", "data_pub": "2026-09-04T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul estaria buscando aprovação parlamentar para enviar ativos militares para o Oriente Médio, mas o gabinete da presidência desmente que Seul esteja revisando uma possível mobilização militar para o Estreito de Ormuz, sob pressão de Donald Trump devido à relutância de Seul em fornecer apoio na região.", "titulo_pt": "Coreia do sul rechaça relatórios sobre preparação para deslocamento no estreito de Ormuz", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 144443, "titulo": "Esta ‘junior oil’ levantou milhões com pessoas físicas – e quer crescer com M&As", "url": "https://braziljournal.com/esta-junior-oil-levantou-milhoes-com-pessoas-fisicas-e-quer-crescer-com-mas/", "fonte_id": "brazil_journal", "data_pub": "2026-09-04T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NBS Petróleo e Gás, uma junior oil fundada por ex-funcionários da Petrobras, vai iniciar a produção em seus dois primeiros campos, no Espírito Santo, após autorização da Agência Nacional do Petróleo. A empresa, que opera apenas em campos onshore, planeja explorar oportunidades de crescimento por meio de fusões e aquisições (M&A).", "titulo_pt": "Esta ‘junior oil’ levantou milhões com pessoas físicas – e quer crescer com M&a", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 144497, "titulo": "CNJ prepara acordos com SP e RJ para mapear e extinguir execuções fiscais antigas", "url": "https://www.jota.info/tributos/cnj-prepara-acordos-com-sp-e-rj-para-mapear-e-extinguir-execucoes-fiscais-antigas", "fonte_id": "jota", "data_pub": "2026-09-04T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CNJ (Conselho Nacional de Justiça) está preparando acordos com os estados de São Paulo e Rio de Janeiro para mapear e extinguir execuções fiscais antigas. A iniciativa segue um modelo já estabelecido com a PGFN (Procuradoria-Geral da Fazenda Nacional) que encontrou meio milhão de ações já prescritas.", "titulo_pt": "CNJ prepara acordos com SP e RJ para mapear e extinguir execuções fiscais antigas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144622, "titulo": "Volkswagen to cut further 50,000 jobs as it ends row with union over revival plan", "url": "https://www.theguardian.com/business/2026/sep/03/volkswagen-confirms-100000-job-cuts-by-2030", "fonte_id": "guardian_world", "data_pub": "2026-09-04T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen aprovou planos para cortar 100.000 empregos, incluindo 50.000 adicionais, em um esforço para se reestruturar e enfrentar a concorrência intensa de fabricantes chineses. A empresa também concordou com a encerramento gradual da produção em quatro plantas alemãs entre 2031 e 2034.", "titulo_pt": "Volkswagen aprova cortes de 100.000 postos de trabalho em reestruturação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 144785, "titulo": "Nvidia's investments grow to $99 billion as chip giant becomes major backer of AI companies", "url": "https://www.cnbc.com/2026/09/04/nvidia-ai-investments-99-billion.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia aumentou suas investidas para US$ 99 bilhões, tornando-se um importante apoiador de empresas de inteligência artificial, laboratórios de IA, provedores de nuvem e empresas de infraestrutura no setor.", "titulo_pt": "Investimentos da nvidia chegam a 99 bilhões de dólares, tornando-a importante apoiadora de empresas de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 144371, "titulo": "Margem Equatorial vai exigir US$ 36 bi em investimentos, diz Scotiabank", "url": "https://www.cnnbrasil.com.br/infra/margem-equatorial-vai-exigir-us-36-bi-em-investimentos-diz-scotiabank/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Scotiabank estima que a Margem Equatorial precisará de investimentos no valor de 36 bilhões de dólares. O banco projeta cinco projetos de produção na Foz do Amazonas, com o primeiro óleo previsto para 2033 e picos de gastos anuais de 4 bilhões de dólares.", "titulo_pt": "Margem Equatorial vai exigir 36 bi em investimentos, diz Scotiabank", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144782, "titulo": "Volkswagen jumps 6% on plans to cut 50,000 jobs amid tariffs, China competition", "url": "https://www.cnbc.com/2026/09/04/volkswagen-job-cuts-tariffs-china.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Volkswagen subiram 6% na sexta-feira após a empresa anunciar planos de cortar mais 50.000 postos de trabalho como parte de sua estratégia de transformação.", "titulo_pt": "Volkswagen sobe 6% com planos de cortar 50.000 postos de trabalho", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 144373, "titulo": "Ações de empresas com terras raras no Brasil desabam em semana de nova lei", "url": "https://www.cnnbrasil.com.br/infra/acoes-de-empresas-com-terras-raras-no-brasil-desabam-em-semana-de-nova-lei/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações de empresas com terras raras no Brasil caíram até 17% em cinco pregões. O declínio é atribuído tanto ao aumento da incerteza regulatória quanto a fatores globais.", "titulo_pt": "Ações de empresas com terras raras no Brasil caem em semana de nova lei", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144468, "titulo": "Payroll nos EUA, balança comercial no Brasil, varejo na Europa e mais destaques hoje", "url": "https://www.infomoney.com.br/mercados/payroll-balanca-comercial-brasil-varejo-europa-agenda-04092026/", "fonte_id": "infomoney", "data_pub": "2026-09-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vão ser divulgados dados sobre o payroll nos Estados Unidos, balança comercial no Brasil e varejo na Europa, movimentando os mercados nesta sexta-feira (4).", "titulo_pt": "Payroll nos EUA, balança comercial no Brasil, varejo na Europa e outros destaques desta sexta-feira", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 144499, "titulo": "O crédito tributário entrou na agenda das operadoras de planos de saúde", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-credito-tributario-entrou-na-agenda-das-operadoras-de-planos-de-saude", "fonte_id": "jota", "data_pub": "2026-09-04T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O crédito tributário está sendo incorporado à agenda das operadoras de planos de saúde, com a introdução de CBS e IBS. Compras, fornecedores e investimentos passam a ser considerados não apenas questões operacionais.", "titulo_pt": "Crédito tributário entra na agenda das operadoras de planos de saúde", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144710, "titulo": "Diesel price surges to all-time high, fueled by wars", "url": "https://www.axios.com/2026/09/04/diesel-prices-record-iran-truckers-farmers", "fonte_id": "axios", "data_pub": "2026-09-04T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço médio do diesel atingiu seu recorde de 2022, chegando a $5,85 por galão, de acordo com a AAA. A subida dos preços está afetando agricultores, caminhoneiros e empresas de frete desde o início da guerra no Irã, o que pode aumentar ainda mais os custos de transporte e gerar pressão inflacionária sobre bens transportados por caminhão, incluindo uma grande parte dos produtos vendidos nos Estados Unidos.", "titulo_pt": "Preço do diesel atinge novo recorde histórico", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 144502, "titulo": "São Paulo, uma cidade além dos negócios", "url": "https://www.jota.info/opiniao-e-analise/artigos/sao-paulo-uma-cidade-alem-dos-negocios", "fonte_id": "jota", "data_pub": "2026-09-04T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "São Paulo se destaca pela diversidade, inovação e qualidade urbana, elementos essenciais para o seu futuro.", "titulo_pt": "São Paulo, uma cidade além dos negócios", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144503, "titulo": "O desafio de ir além do ‘regular ou não regular’ no caso da Anvisa", "url": "https://www.jota.info/opiniao-e-analise/colunas/reg/o-desafio-de-ir-alem-do-regular-ou-nao-regular-no-caso-da-anvisa", "fonte_id": "jota", "data_pub": "2026-09-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa tem explorado diferentes graus de intervenção nas alternativas regulatórias. Este é um desafio na forma como a agência opera.", "titulo_pt": "O desafio de ir além do 'regular ou não regular' na Anvisa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144504, "titulo": "Anvisa abrirá processo para regulamentar venda de medicamentos em plataformas", "url": "https://www.jota.info/opiniao-e-analise/artigos/anvisa-abrira-processo-para-regulamentar-venda-de-medicamentos-em-plataformas", "fonte_id": "jota", "data_pub": "2026-09-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa (Agência Nacional de Vigilância Sanitária) planeja iniciar um processo para regularizar a venda de medicamentos em plataformas online. A decisão visa atualizar as regras atuais, mas ainda há incertezas sobre como a venda de remédios pela internet será regulamentada.", "titulo_pt": "Anvisa abrirá processo para regulamentar venda de medicamentos em plataformas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144959, "titulo": "(2nd LD) Seoul stocks rise for 2nd session on export strength, easing Fed rate concerns", "url": "https://en.yna.co.kr/view/AEN20260904008552320", "fonte_id": "yonhap_news", "data_pub": "2026-09-04T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas subiram por duas sessões consecutivas devido à força nas exportações e à alívio das preocupações com a redução das taxas de juros pela Federação Americana.", "titulo_pt": "Seoul: ações subem por segunda sessão seguida devido a exportações fortes e alívio com a federação americana", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 144786, "titulo": "The inflation genie could be out of the bottle — and bond markets are sounding the alarm", "url": "https://www.cnbc.com/2026/09/04/global-bond-selloff-inflation-risk.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos globais das dívidas têm aumentado enquanto investidores avaliam se a elevação da dívida, tarifas, gastos em defesa e choques de energia poderiam manter a inflação mais alta por um período mais longo.", "titulo_pt": "O gênio da inflação pode estar solto — e os mercados de títulos estão dando sinais de alerta", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 144781, "titulo": "World's biggest sovereign wealth fund plans to cut U.S. Treasury holdings", "url": "https://www.cnbc.com/2026/09/04/worlds-biggest-sovereign-wealth-fund-plans-to-cut-treasury-holdings.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T06:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maior reserva de renda do mundo, fundo de investimento norueguês com valor de $2,3 trilhões, planeja reduzir suas posições em títulos do Tesouro dos EUA para diversificar seus investimentos em áreas com maior risco e retorno.", "titulo_pt": "Grande fundo de renda soberana planeja reduzir investimentos em títulos do tesouro dos EUA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 145077, "titulo": "Upend the trickle-down", "url": "https://aeon.co/essays/why-western-democracy-is-ailing-and-how-to-fix-it", "fonte_id": "aeon", "data_pub": "2026-09-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neoliberais políticas têm esvaziado democracias e gerado oligarquias sem controle. Entender sua estrutura pode indicar uma solução.", "titulo_pt": "Inverter a abordagem de cima para baixo", "veiculo": "Aeon Magazine", "pais": "Reino Unido", "classe": "A"}, {"id": 144871, "titulo": "Almost anyone can make money selling electricity with AI, batteries and solar panels", "url": "https://www.japantimes.co.jp/business/2026/09/04/markets/energy-selling-electricity-ai-batteries/", "fonte_id": "japan_times", "data_pub": "2026-09-04T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Millhões de pessoas estão utilizando seus painéis solares e baterias para gerar energia e vender a sobra de volta para a rede elétrica. A tecnologia de inteligência artificial está facilitando essa prática.", "titulo_pt": "Praticamente qualquer pessoa pode ganhar dinheiro vendendo energia elétrica com AI, baterias e painéis solares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 144944, "titulo": "What the Heck? Another Perfect Geometric Shape Has Been Detected on Saturn", "url": "https://www.wired.com/story/another-perfect-geometric-shape-detected-on-saturn/", "fonte_id": "wired", "data_pub": "2026-09-04T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais um formato geométrico perfeito foi detectado na atmosfera de Saturno, acrescentando a história do planeta de fenômenos atmosféricos estranhos que os cientistas ainda não compreendem completamente.", "titulo_pt": "O que diabo? Outro formato geométrico perfeito foi detectado em saturno", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 144932, "titulo": "Data from drones in Ukraine is fueling a new Wild West marketplace", "url": "https://www.technologyreview.com/2026/09/04/1143452/drone-data-wild-west/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-04T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Drones usados nos campos de batalha da Ucrânia estão gerando dados que se tornarão uma fonte valiosa para o setor de defesa, mesmo após as guerras terminarem. Esses dados estão criando uma nova oportunidade comercial para o setor de defesa.", "titulo_pt": "Dados de drones na Ucrânia alimentam uma nova corrida do oeste selvagem do setor de defesa", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 144945, "titulo": "Silicon Valley Is Having a ‘Hot Girl Renaissance’", "url": "https://www.wired.com/story/silicon-valley-is-having-a-hot-girl-renaissance/", "fonte_id": "wired", "data_pub": "2026-09-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um 'Hot List' de São Francisco está tentando combater estereótipos sobre relacionamentos no ambiente de tecnologia durante debates mais amplos sobre a importância de ser considerado atraente.", "titulo_pt": "Silicon Valley experiencia um 'renascimento das garotas atraentes'", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 144874, "titulo": "Corporate venture capital develops in Japan", "url": "https://www.japantimes.co.jp/business/2026/09/04/companies/corporate-venture-capital/", "fonte_id": "japan_times", "data_pub": "2026-09-04T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atuação de venture capital por empresas japonesas que era vista como uma má combinação está agora sendo percebida como uma necessidade.", "titulo_pt": "Capital de risco corporativo se desenvolve no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 144956, "titulo": "Naver founder, Brookfield chief meet for follow-up talks on AI factory", "url": "https://en.yna.co.kr/view/AEN20260904010100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-04T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundador e presidente do Naver Corp., Lee Hae-jin, se reuniu com o chefe da Brookfield, para conversas subsequentes sobre a fabricação de inteligência artificial.", "titulo_pt": "Fundador do naver e chefe da Brookfield se reúnem para discussões sobre fábrica de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 144244, "titulo": "OpenAI diz ter superado a Anthropic com seu mais recente modelo de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/openai-diz-ter-superado-a-anthropic-com-seu-mais-recente-modelo-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI lançou seu mais recente modelo de IA, classificado como o mais inteligente do mundo, em uma tentativa de superar a rival Anthropic antes de uma possível abertura de capital. O lançamento ocorreu nesta quinta-feira (3).", "titulo_pt": "Openai lança novo modelo de IA, considerado o mais inteligente do mundo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 144247, "titulo": "Nvidia se torna peça central da economia com avanço da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/nvidia-se-torna-peca-central-da-economia-com-avanco-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia, empresa americana conhecida por seus chips de processamento gráfico (GPUs), se tornou a empresa mais valiosa do mundo, avaliada em US$ 5,4 trilhões (R$ 27,5 trilhões), devido à alta demanda global por suas tecnologias que alimentam a inteligência artificial.", "titulo_pt": "Nvidia se torna peça central da economia com avanço da IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 144935, "titulo": "Aqara goes all in on smart lighting", "url": "https://www.theverge.com/tech/989581/aqara-smart-lighting-ifa-2026", "fonte_id": "the_verge", "data_pub": "2026-09-04T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aqara lançou uma linha significativa de iluminação inteligente compatível com Zigbee e Thread no IFA, incluindo a Floor Lamp T1, que é um poste LED conectado a uma base.", "titulo_pt": "Aqara investe totalmente na iluminação inteligente", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 144966, "titulo": "Hanwha Aerospace nearing deal to export Chunmoo rocket launchers to Croatia: sources", "url": "https://en.yna.co.kr/view/AEN20260904008800320", "fonte_id": "yonhap_news", "data_pub": "2026-09-04T06:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de defesa Hanwha Aerospace está próxima de fechar um acordo para exportar os lançadores de foguetes Chunmoo para a Croácia, de acordo com fontes.", "titulo_pt": "Hanwha Aerospace perto de exportar lançadores de foguetes Chunmoo para a croácia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 144968, "titulo": "S. Korea, British chip firm Arm open training school in southwestern city of Gwangju", "url": "https://en.yna.co.kr/view/AEN20260904008300320", "fonte_id": "yonhap_news", "data_pub": "2026-09-04T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul e a empresa britânica de design de chips Arm abriram uma escola de treinamento na cidade de Gwangju, localizada no sudoeste do país.", "titulo_pt": "Coreia do sul e Arm britânica abrem escola de treinamento em Gwangju", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 144420, "titulo": "AGI não é ChatGPT: entenda o que é inteligência artificial geral", "url": "https://exame.com/inteligencia-artificial/agi-nao-e-chatgpt-entenda-o-que-e-inteligencia-artificial-geral/", "fonte_id": "exame", "data_pub": "2026-09-04T06:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conceito de inteligência artificial geral (AGI) se refere a uma IA capaz de realizar uma variedade de tarefas, aprender com diferentes situações e adaptar seu comportamento sem precisar de treinamento específico para cada atividade.", "titulo_pt": "AGI não é ChatGPT: entenda o que é inteligência artificial geral", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 144986, "titulo": "Shinsegae chief joins US-led AI supply chain push", "url": "https://www.koreaherald.com/article/10863043", "fonte_id": "korea_herald", "data_pub": "2026-09-04T05:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do grupo Shinsegae, Chung Yong-jin, participou do lançamento de um programa de expertise em AI, junto com o vice-presidente dos EUA JD Vance e executivos tecnológicos, em Washington. O Shinsegae está expandindo seu papel em uma iniciativa de cadeia de suprimentos de AI liderada pelos EUA.", "titulo_pt": "Presidente do shinsegae participa do lançamento de programa de AI dos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 144988, "titulo": "Dyson bets on AI vision with Nurovi robots, oral-care debut", "url": "https://www.koreaherald.com/article/10863014", "fonte_id": "korea_herald", "data_pub": "2026-09-04T05:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dyson está expandindo a inteligência artificial, sistemas de visão e automação baseada em sensores para sua linha de produtos, lançando uma nova família de robôs aspiradores, um dispositivo de cuidado bucal e atualizações em seus produtos de tratamento de ar e beleza. O foco da empresa está mudando de apenas desempenho mecânico para produtos que podem interpretar e responder aos dados sobre seu ambiente.", "titulo_pt": "Dyson investe em visão artificial com robôs Nurovi e estreia em cuidados bucais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 144971, "titulo": "(LEAD) S. Korean firms unveil plans for gov't-led AI project", "url": "https://en.yna.co.kr/view/AEN20260904005951320", "fonte_id": "yonhap_news", "data_pub": "2026-09-04T05:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três consórcios, liderados por SK Telecom Co. e KT Corp., apresentaram planos para um projeto de IA governamental em Seoul, Coreia do Sul, em 4 de setembro.", "titulo_pt": "Coreias do sul anunciam planos para projeto de IA governamental", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 144261, "titulo": "Espécies de abelhas veem o mundo de maneiras surpreendentemente diferentes", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/especies-de-abelhas-veem-o-mundo-de-maneiras-surpreendentemente-diferentes.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes demonstram que diferentes espécies de abelhas percebem o mundo de maneiras distintas. O zangão da abelha melífera (Apis mellifera) é frequentemente usado como referência para o desempenho visual, mas novas pesquisas sugerem que outras espécies podem ter visões muito diferentes.", "titulo_pt": "Espécies de abelhas veem o mundo de maneiras surpreendentemente diferentes", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 145021, "titulo": "Molecular snapshots reveal how bacteria assemble outer membrane proteins", "url": "https://phys.org/news/2026-09-molecular-snapshots-reveal-bacteria-outer.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa revela como bactérias gram-negativas montam proteínas da membrana externa, um processo crucial para a sua resistência a antibióticos. A membrana externa contém proteínas especializadas que desempenham funções como transporte de nutrientes e detecção do ambiente.", "titulo_pt": "Câmeras moleculares mostram como bactérias montam proteínas da membrana externa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145035, "titulo": "Opinion: Make infectious disease data boring again", "url": "https://www.statnews.com/2026/09/04/pennsylvania-measles-deaths-data-cdc-director-rfk-jr/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-04T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ex-oficiais do CDC questionam se a agência agora está aplicando padrões diferentes para os dados de estados dependendo da governança ou do resultado das eleições.", "titulo_pt": "Opinião: faça com que os dados sobre doenças contagiosas sejam novamente banais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 145036, "titulo": "STAT+: Lindsay Clancy case exposes dangers of fragmented U.S. health system, experts say", "url": "https://www.statnews.com/2026/09/04/lindsay-clancy-health-care-silos-postpartum-care-failures/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-04T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lindsay Clancy buscava ajuda para sua saúde mental deteriorada nos meses antes de matar seus filhos. Especialistas dizem que o caso expõe as ameaças do sistema de saúde fragmentado dos Estados Unidos.", "titulo_pt": "Caso lindsay Clancy expõe riscos do sistema de saúde fragmentado dos EUA, dizem especialistas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 145037, "titulo": "Opinion: The FDA removed the red tape around one of the best drugs for children with schizophrenia. But the fear remains", "url": "https://www.statnews.com/2026/09/04/clozapine-children-schizophrenia-neutrophil-fda-monitoring/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-04T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA removeu as restrições burocráticas ao medicamento clozapina, que é uma das melhores opções para o tratamento de crianças com esquizofrenia. No entanto, a preocupação persiste sobre seu uso.", "titulo_pt": "Opinião: a FDA removedou a burocracia em torno de um dos melhores medicamentos para crianças com esquizofrenia, mas o medo permanece", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 144380, "titulo": "Pets fortalecem o nosso sistema imunológico, dizem cientistas", "url": "https://www.cnnbrasil.com.br/comportamento/pets/pets-fortalecem-o-nosso-sistema-imunologico-dizem-cientistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Crianças que vivem com cães têm menor probabilidade de desenvolver doenças autoimunes, como asma e alergias, de acordo com estudos científicos. O contato com animais de estimação pode fortalecer o sistema imunológico das crianças.", "titulo_pt": "Cães fortalecem o sistema imunológico das crianças, dizem estudos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144910, "titulo": "Could Roman concrete have clues on how Pyramid of Giza was built – and saved?", "url": "https://www.scmp.com/news/china/science/article/3366293/could-roman-concrete-have-clues-how-pyramid-giza-was-built-and-saved?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Grande Pirâmide de Gizé, com seus 2,3 milhões de blocos de pedra pesando toneladas, continua sendo um mistério para os pesquisadores há séculos. Uma teoria alternativa científica sugere que os blocos podem ter sido feitos de concreto antigo, mas essa ideia enfrenta a questão de como tal material artificial poderia ter sido usado.", "titulo_pt": "Seria o concreto romano o segredo da construção da pirâmide de gizé?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 145040, "titulo": "A Trio of Tropical Cyclones in the Pacific", "url": "https://science.nasa.gov/earth/earth-observatory/a-trio-of-tropical-cyclones-in-the-pacific/", "fonte_id": "nasa_news", "data_pub": "2026-09-04T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Havia três ciclones tropicais no Pacífico, enquanto o Atlântico estava particularmente calmo.", "titulo_pt": "Tríade de ciclones tropicais no pacífico", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 144920, "titulo": "China’s solar, wind innovations amid rapid green power buildout", "url": "https://www.scmp.com/plus/news/china/science/article/3366302/chinas-solar-wind-innovations-amid-rapid-green-power-buildout?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China está instalando capacidade de energia solar e eólica mais rapidamente do que qualquer outro país. Além disso, empresas e pesquisadores chineses estão estabelecendo novos padrões através de inovações, como a geração de energia de ventos altos a 4.000 metros acima do nível do mar e o início de testes de turbinas de vento offshore fixas e flutuantes.", "titulo_pt": "Inovações chinesas em energia solar e eólica durante expansão rápida de energia verde", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 145022, "titulo": "Your house may be a haven for wildlife. It's time we design homes with nature in mind", "url": "https://phys.org/news/2026-09-house-haven-wildlife-homes-nature.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há espécies de animais selvagens que podem se hospedar em casas humanas, como cangurus sem nariz e marsupiais como os possums. É proposto que devemos projetar casas de maneira a considerar a natureza.", "titulo_pt": "Sua casa pode ser um refúgio para a natureza. É hora de projetarmos casas pensando na natureza.", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145023, "titulo": "France recorded 'hottest summer ever': Environment minister", "url": "https://phys.org/news/2026-09-france-hottest-summer-environment-minister.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, França registrou sua estação mais quente na história, marcada por ondas de calor, seca extrema e grandes incêndios florestais, conforme informou o ministro do Meio Ambiente.", "titulo_pt": "França registrou 'verão mais quente de sempre', diz ministro do meio ambiente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145024, "titulo": "How El Nino is choking the Panama Canal", "url": "https://phys.org/news/2026-09-el-nino-panama-canal.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir desta sexta-feira, o Canal do Panamá limitará o número de navios transitando pela via crucial devido à seca causada pelo fenômeno El Niño. Esta é a segunda vez que a restrição ocorre.", "titulo_pt": "Como El niño está limitando o tráfego no Canal do panamá", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 143363, "titulo": "Forestry agency publishes documentary on hundred-pace viper and its newborns", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/04/2003863667", "fonte_id": "taipei_times", "data_pub": "2026-09-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência florestal publicou um documentário sobre a viperina de cem passos e seus recém-nascidos. O documentário fornece informações sobre a espécie e seu nascimento.", "titulo_pt": "Agência florestal publica documentário sobre viperina de cem passos e seus recém-nascidos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 144954, "titulo": "Body parts used for ancient Egyptian artworks traced to surprising source", "url": "https://www.nature.com/articles/d41586-026-02739-3", "fonte_id": "nature_news", "data_pub": "2026-09-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Artigos antigos do Egito faraônico foram decorados com tecidos extraídos de uma ampla variedade de organismos.", "titulo_pt": "Partes do corpo usadas em obras de arte antiga do egito trazem surpresa", "veiculo": "Nature News", "pais": "Reino Unido", "classe": "A"}, {"id": 145025, "titulo": "Light-triggered interface lets adhesive peel cleanly and rebond through 15 cycles", "url": "https://phys.org/news/2026-09-triggered-interface-adhesive-rebond.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um protótipo de adesivo respon­sivo à luz foi desenvolvido por uma equipe de pesquisa liderada pela Universidade de Osaka. O adesivo pode ser desligado de uma superfície iluminada sem deixar resíduos visíveis e pode ser reutilizado após ser aquecido e reconfigurado com uma luz ultravioleta de comprimento de onda diferente.", "titulo_pt": "Interface iluminada permite que o adesivo seja removido limpa e reutilizado por 15 ciclos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145026, "titulo": "Soft nanoscale confinement prevents ice, exposing water's liquid-to-glass transition", "url": "https://phys.org/news/2026-09-soft-nanoscale-confinement-ice-exposing.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores utilizou as instalações do ANSTO para descobrir novas propriedades da água e responder a uma questão científica importante. Os achados, publicados na Nature Communications, têm implicações práticas para o entendimento da água em baixas temperaturas, relevantes para a preservação biológica, tecnologias de congelamento de alimentos e o entendimento da água em células vivas.", "titulo_pt": "Confinamento nanoescalar suave impede o congelamento, revelando a transição líquido-garrafa da água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 144327, "titulo": "Saiba os horários dos shows do primeiro final de semana do Rock In Rio", "url": "https://veja.abril.com.br/cultura/saiba-os-horarios-dos-shows-do-primeiro-final-de-semana-do-rock-in-rio/", "fonte_id": "veja", "data_pub": "2026-09-04T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rock In Rio terá shows de Elton John, Foo Fighters, Avenged Sevenfold e Calvin Harris nos dias 4 a 7 de setembro.", "titulo_pt": "Saiba os horários dos shows do primeiro final de semana do Rock In Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 145050, "titulo": "Ann Patchett and Crying at The Met", "url": "https://hyperallergic.com/ann-patchett-and-crying-at-the-met/", "fonte_id": "hyperallergic", "data_pub": "2026-09-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Ann Patchett explorou arte e luto em seu novo romance, 'Whistler', e o artigo menciona exposições a serem visitadas no Upstate New York neste mês.", "titulo_pt": "Ann Patchett e o luto no metropolitan museum", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 144520, "titulo": "Las primeras reacciones de la prensa inglesa al discurso de Milei: “Es algo del pasado”", "url": "https://www.lanacion.com.ar/politica/la-primera-reaccion-de-la-prensa-inglesa-al-discurso-de-milei-es-algo-del-pasado-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T09:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Prensa inglesa reagiu com pouca importância às declarações de Milei, considerando-as como parte do passado. Vários meios, incluindo Sky News, The Guardian, The Telegraph e BBC News, avaliaram que o discurso não trouxe novidades significativas.", "titulo_pt": "Primeiras reações da imprensa inglesa ao discurso de Milei: 'é algo do passado'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 145046, "titulo": "Finnish company launches \"world's most carbon-storing building material\"", "url": "https://www.dezeen.com/2026/09/04/mo6-carbon-storing-material-elementic/", "fonte_id": "dezeen", "data_pub": "2026-09-04T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa finlandesa Elementic lançou o MO6, um material para revestimento de paredes produzido a partir de resíduos da indústria madeireira, quase totalmente composto por carbono. Este material, em forma de largas e leves tijolos com textura irregular e cor off-black, foi apresentado como o 'mais capaz de armazenar carbono' entre os materiais de construção.", "titulo_pt": "Finlandês lança 'mais material de construção capaz de armazenar carbono'", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 144226, "titulo": "SBT faz proposta de R$ 150 milhões para retomar direitos da Copa do Brasil até 2030", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/sbt-faz-proposta-de-r-150-milhoes-para-retomar-direitos-da-copa-do-brasil-ate-2030.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O SBT apresentou uma proposta de R$ 150 milhões para exibir jogos da Copa do Brasil de 2027 a 2030. Se a negociação com a CBF for concluída, o contrato permitirá a transmissão de um a dois jogos por rodada da competição.", "titulo_pt": "SBT oferece R$ 150 milhões para transmitir Copa do Brasil até 2030", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 144372, "titulo": "Rock in Rio 2026: veja o line-up e horários dos shows desta sexta (4)", "url": "https://www.cnnbrasil.com.br/pop/musica/rock-in-rio-2026-veja-o-line-up-e-horarios-dos-shows-desta-sexta-4/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rock in Rio 2026 iniciou sua programação nesta sexta-feira (4), com um line-up de artistas renomados. O evento oferece transmissão ao vivo e apresentações em seis diferentes espaços.", "titulo_pt": "Rock in Rio 2026: confira line-up e horários dos shows desta sexta-feira", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144530, "titulo": "Falsos dilemas", "url": "https://www.lanacion.com.ar/cultura/falsos-dilemas-nid04092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute falsos dilemas, que são situações em que as pessoas são levadas a acreditar que têm apenas duas opções, quando na verdade existem alternativas intermediárias ou múltiplas soluções possíveis.", "titulo_pt": "Falsos dilemas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 144533, "titulo": "De gatopardos, chacales y hienas", "url": "https://www.lanacion.com.ar/cultura/de-gatopardos-chacales-y-hienas-nid04092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto se refere a comparações entre animais, possivelmente em um contexto analítico ou literário. Não há detalhes específicos sobre o conteúdo do artigo que possam ser resumidos sem mais contexto.", "titulo_pt": "De guepardos, chacais e hienas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 145055, "titulo": "Founding editor of Ms magazine on Gloria Steinem: ‘The least egomaniacal person’", "url": "https://www.theguardian.com/books/2026/sep/04/founding-editor-ms-magazine-on-gloria-steinem", "fonte_id": "guardian_culture", "data_pub": "2026-09-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Letty Cottin Pogrebin, editora-fundadora da revista Ms, afirma que Gloria Steinem ensinou a jovem feminista a mudar o 'mundo masculino' em vez de se adaptar a ele. Steinem, ativista feminista pioneira que faleceu aos 92 anos, foi influente na abordagem de Pogrebin para o movimento feminista.", "titulo_pt": "Editora-fundadora da Ms sobre Gloria Steinem: 'a pessoa menos egocêntrica'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 145057, "titulo": "Kevin Powers: ‘I was ready to abandon Infinite Jest a thousand times’", "url": "https://www.theguardian.com/books/2026/sep/04/kevin-powers-i-was-ready-to-abandon-infinite-jest-a-thousand-times", "fonte_id": "guardian_culture", "data_pub": "2026-09-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kevin Powers, autor americano, menciona sua memória de leitura mais antiga, onde os personagens Old Dan e Little Ann de 'Onde os Rios Cantam Vermelho' de Wilson Rawls marcaram profundamente sua infância. Ele também destaca que sua p jetivo era conter disputas entre facções criminosas.", "titulo_pt": "Base do Bope busca conter disputas de facções no Rio de Janeiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 143641, "titulo": "Supremo derruba tese do TST e limita acesso a Justiça do Trabalho gratuita a quem ganha até R$ 5.000", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/fachin-vota-por-ampliar-justica-do-trabalho-gratuita-e-gilmar-mendes-quer-limitar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do STF decidiram que o acesso à Justiça do Trabalho gratuita está limitado a trabalhadores com salários até R$ 5.000. A decisão foi tomada no julgamento da ADC 80 nesta quinta-feira (3).", "titulo_pt": "Stf restringe acesso gratuito à Justiça do Trabalho a trabalhadores com até R$ 5.000 de salário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 143961, "titulo": "El sedentarismo podría aumentar el riesgo de muerte por cáncer, según una investigación", "url": "https://www.latercera.com/tendencias/noticia/el-sedentarismo-podria-aumentar-el-riesgo-de-muerte-por-cancer-segun-una-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-09-03T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores descobriram que o sedentarismo pode aumentar o risco de morte por câncer, e que os efeitos do sedentarismo na saúde podem depender tanto do tempo total de inatividade quanto da forma como esse tempo é distribuído.", "titulo_pt": "O sedentarismo pode aumentar o risco de morte por câncer, sugere pesquisa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 143887, "titulo": "Terminó la secundaria hace tres años y todavía no consigue su primer trabajo: “Quiero una oportunidad”", "url": "https://www.lanacion.com.ar/comunidad/termino-la-secundaria-ha
