o aos integrantes da instituição após uma deterioração durante o período social.", "titulo_pt": "Diretor geral da Carabineros: 'notamos apoio sincero do governo'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 71999, "titulo": "India's education minister resigns amid countrywide 'cockroach' protests", "url": "https://www.lemonde.fr/en/international/article/2026/07/25/india-education-minister-announces-resignation-after-countrywide-protests_6755822_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-25T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Educação da Índia, Dharmendra Pradhan, renunciou após semanas de protestos que exigiam sua demissão por supostas faltas nas provas de admissão mais concorridas do país e irregularidades no sistema educacional.", "titulo_pt": "Ministro da educação da Índia renuncia diante de protestos contra 'pragas'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 71819, "titulo": "Summit Mulheres nas Profissões: 'Não é só um evento, é um movimento', diz Trajano", "url": "https://exame.com/carreira/summit-mulheres-nas-profissoes-nao-e-so-um-evento-e-um-movimento-diz-trajano/", "fonte_id": "exame", "data_pub": "2026-07-25T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Summit Mulheres nas Profissões ocorrerá nos dias 4 e 5 de agosto em São Paulo, abordando temas como inteligência artificial, empregabilidade, liderança e empreendedorismo.", "titulo_pt": "Summit Mulheres nas Profissões: 'não é só um evento, é um movimento', diz Trajano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 72301, "titulo": "Ao menos uma pessoa morre na Espanha por causa dos incêndios florestais", "url": "https://www.cnnbrasil.com.br/internacional/ao-menos-uma-pessoa-morre-na-espanha-por-causa-dos-incendios-florestais/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na costa leste da Espanha resultaram na morte de pelo menos uma pessoa. O fogo foi controlado pelas equipes de emergência.", "titulo_pt": "Pelo menos uma pessoa morre nos incêndios florestais na Espanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72432, "titulo": "Huracán Fausto en vivo: trayectoria de la tormenta que se intensifica rumbo a territorio estadounidense", "url": "https://www.lanacion.com.ar/estados-unidos/huracan-fausto-en-vivo-trayectoria-de-la-tormenta-que-se-intensifica-rumbo-a-territorio-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T21:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O huracán Fausto, de categoria 2, está se movendo pelo Pacífico central em direção a Hawái e trará ondas perigosas e chuvas na próxima semana, conforme informado pelo NHC.", "titulo_pt": "Huracan Fausto em tempo real: trajetória da tormenta que se intensifica rumo ao território americano", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 72325, "titulo": "China emite alerta máximo para Tufão Noul; 340 mil pessoas são retiradas de província", "url": "https://www.infomoney.com.br/mundo/china-emite-alerta-maximo-para-tufao-noul-340-mil-pessoas-sao-retiradas-de-provincia/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Centro Meteorológico Nacional da China emitiu o alerta máximo para o Tufão Noul, que deve atingir a costa entre Shenzhen e Haifeng na província de Guangdong durante a madrugada de domingo. Aproximadamente 340 mil pessoas foram retiradas da região como medida preventiva.", "titulo_pt": "China emite alerta máximo para Tufão Noul; 340 mil pessoas são retiradas de província", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72314, "titulo": "Incêndio florestal deixa casas em ruínas e carros destruídos na França", "url": "https://www.cnnbrasil.com.br/internacional/incendio-florestal-deixa-casas-em-ruinas-e-carros-destruidos-na-franca/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal causou danos significativos, deixando casas em ruínas e carros destruídos na França. O presidente francês, Emmanuel Macron, mobilizou as Forças Armadas para auxiliar os bombeiros.", "titulo_pt": "Incêndio florestal causa destruição em casas e veículos na França", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72736, "titulo": "China evacuates 340,000 people as Typhoon Noul approaches", "url": "https://phys.org/news/2026-07-china-evacuates-people-typhoon-noul.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 340 mil pessoas foram evacuadas e serviços ferroviários suspensos na China devido à aproximação do Furacão Noul. Voo cancelados foram anunciados em Hong Kong.", "titulo_pt": "China evaza mais de 340 mil pessoas diante da aproximação do furacão Noul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72350, "titulo": "China: passagem de tufão causa cancelamento de voos e mais de 340.000 evacuações", "url": "https://veja.abril.com.br/mundo/china-passagem-de-tufao-causa-cancelamento-de-voos-e-mais-de-340-000-evacuacoes/", "fonte_id": "veja", "data_pub": "2026-07-25T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tufão com ventos de até 145 km/h causou cancelamentos de voos e mais de 340.000 evacuações na China, incluindo Hong Kong.", "titulo_pt": "Tufão causa cancelamento de voos e mais de 340.000 evacuações na china", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 72269, "titulo": "Nem a fauna escapou: como a guerra pode ter mudado a rotina de animais em Chernobyl", "url": "https://exame.com/ciencia/nem-a-fauna-escapou-como-a-guerra-pode-ter-mudado-a-rotina-de-animais-em-chernobyl/", "fonte_id": "exame", "data_pub": "2026-07-25T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores observaram mudanças no comportamento de cervos, corços, raposas e lebres durante a ocupação russa da zona de exclusão em 2022.", "titulo_pt": "Nem a fauna escapou: como a guerra alterou a rotina de animais em Chernobyl", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 72376, "titulo": "'Tivemos que fazer rifa para pagar o tratamento da minha filha': como sistema de saúde do Paraguai leva pacientes a se endividarem", "url": "https://www.bbc.com/portuguese/articles/cn0n1442g27o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-25T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Paraguai, 70% das pessoas não têm plano de saúde e dependem de um sistema público com escassez de recursos para acesso aos cuidados médicos. Isso faz com que pacientes tenham que se endividar para pagar tratamentos.", "titulo_pt": "Tivemos que fazer rifa para pagar o tratamento da minha filha': como o sistema de saúde do Paraguai leva pacientes a se endividarem", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 72596, "titulo": "Venezuela’s twin earthquakes: the toll one month later", "url": "http://www.euronews.com/2026/07/25/the-toll-of-the-tragedy-one-month-after-venezuelas-double-earthquake", "fonte_id": "euronews", "data_pub": "2026-07-25T15:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um mês após os terremotos duplos que afetaram a Venezuela, o número oficial de mortos ultrapassou 5.500, com mais de 16.700 pessoas feridas. Os danos são estimados em cerca de 19,6 bilhões de dólares e milhares permanecem sem casa, sem atualização da contagem de desaparecidos desde junho.", "titulo_pt": "Venezuela: os impactos dos terremotos duplos um mês depois", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 71705, "titulo": "Eventos climáticos extremos põem em risco patrimônios da cozinha mundial", "url": "https://veja.abril.com.br/gastronomia/eventos-climaticos-extremos-poem-em-risco-patrimonios-da-cozinha-mundial/", "fonte_id": "veja", "data_pub": "2026-07-25T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eventos climáticos extremos estão colocando em risco os patrimônios culinários globais. As ondas de calor na Europa, por exemplo, afetaram o terroir de produtos nobres.", "titulo_pt": "Eventos climáticos extremos ameaçam patrimônios gastronômicos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71889, "titulo": "Incendios descontrolados en España: Pedro Sánchez admite que \"la situación es compleja\"", "url": "https://www.clarin.com/mundo/incendios-descontrolados-espana-pedro-sanchez-admite-situacion-compleja_0_0v1WT53U7b.html", "fonte_id": "clarin", "data_pub": "2026-07-25T10:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Incêndios descontrolados devastaram mais de 25 mil hectares em Madrid e Ávila, Espanha. Mais de 63 mil pessoas foram evacuadas e um prefeito declarou que a situação já se assemelha a uma catástrofe.", "titulo_pt": "Incêndios descontrolados na Espanha: pedro Sánchez admite que 'a situação é complexa'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 71735, "titulo": "Clima: ciclone extratropical e frente fria atingem Brasil neste sábado", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-e-frente-fria-atingem-brasil-neste-sabado", "fonte_id": "metropoles", "data_pub": "2026-07-25T10:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ciclone extratropical e frente fria atingem pelo menos oito estados brasileiros, intensificando os contrastes típicos do inverno.", "titulo_pt": "Ciclone extratropical e frente fria afetam Brasil neste sábado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 72018, "titulo": "Red sun, orange const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length

       <div class="drill-lista" id="${drillId}">

           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  }).join("");
  return `<div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

}

}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
