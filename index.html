<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 06/09/2026 07:22 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">

</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "06/09/2026 07:22", "stats": {"noticias_novas": 567, "resumos_gerados": 222}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios em diferentes frentes, com destaque para a aprovação de projetos de interesse do governo Lula e as mobilizações para o 7 de Setembro. A Câmara dos Deputados aprovou um projeto que permitirá a identificação de aptidões dos estudantes do ensino médio, auxiliando na orientação educacional e profissional. As pesquisas indicam um 'novo momento' para a campanha de Lula, enquanto o Palácio do Planalto mobiliza movimentos sociais para garantir uma grande participação no evento em Brasília. Durante essas movimentações, o Congresso Nacional aprovou cinco projetos de interesse do governo antes das eleições, mas a Proposta de Emenda Constitucional (PEC) que trata do fim da escala 6x1 e a PEC da Segurança Pública ainda não foram votadas.", "mundo": "Em um cenário geopolítico volátil, a Alemanha enfrenta um momento histórico. O partido de direita radical AfD pode governar um estado alemão pela primeira vez desde a Segunda Guerra Mundial, após a eleição deste domingo. Além disso, o Irã alega ter atingido um navio dos Estados Unidos no Estreito de Ormuz, o que contribui para a escalada de tensões entre os países. No entanto, o Egito condenou 11 pessoas, incluindo uma apresentadora de televisão, à morte por tráfico de drogas, sinalizando uma tendência preocupante de punições severas em alguns países.\n\nAs tensões geopolíticas continuam a dominar o cenário internacional. Primeiramente, os Estados Unidos e a Rússia enfrentam impasses nas negociações de paz na Ucrânia, com os Estados Unidos retornando a Moscou sem avanços significativos. Em seguida, Israel intensifica sua presença militar no Líbano, com ataques aéreos e confrontos que já resultaram em dezenas de mortes. O Irã reage a ataques americanos, alvejando navios dos EUA no Estreito de Ormuz. Além disso, a situação nas Malvinas ganha novo fôlego com a presença de empresas petrolíferas israelenses e britânicas, levantando novas tensões regionais. Na Síria, a guerra civil continua com confrontos intensificados, resultando em mortes civis. Enquanto isso, a Alemanha enfrenta a possibilidade de um partido de extrema-direita governando em seu estado oriental, com as eleições na Saxônia-Anhalt. Finalmente, a situação no Líbano continua instável, com ataques israelenses que já causaram mais de 9.000 mortes desde 2023, além de conflitos internos que resultaram em desastres como a explosão em uma base militar boliviana que deixou 14 pessoas desaparecidas.", "economia": "O Conselho Administrativo de Recursos Fiscais (Carf) rejeitou a cobrança bilionária de Imposto de Renda e Contribuição Social sobre Lucros e Dividendos (CSLL) contra a Petrobras, anulando uma multa significativa para a empresa. Em outro destaque, a Apple foi excluída de recomendações de ações globais, coincidindo com a saída de Tim Cook da liderança da empresa. A China está incentivando as montadoras a cumprir mais rigorosamente as normas locais, visando coibir uma possível guerra de preços. A CVM perdeu credibilidade e estrutura, enquanto o Brasil se tornou líder global em número de fundos regulados. A Petrobras teve a cobrança bilionária de IRPJ e CSLL rejeitada pelo Carf, e a Apple foi excluída de recomendações de ações globais, coincidindo com a saída de Tim Cook da liderança da empresa. A China está incentivando as montadoras a cumprir mais rigorosamente as normas locais, visando coibir uma possível guerra de preços. A China está incentivando as montadoras a cumprir mais rigorosamente as normas locais, visando coibir uma possível guerra de preços. A China está incentivando as montadoras a cumprir mais rigorosamente as normas locais, visando coibir uma possível guerra de preços. A China está incentivando as montadoras a cumprir mais rigorosamente as normas locais, visando coibir uma possível guerra de preços. A China está incentivando as montadoras a cumprir mais rigorosamente as normas locais, visando coibir uma possível guerra de preços.", "tecnologia": "A Nvidia enfrenta gigantes tecnológicos com PCs equipados em superchips de IA, apesar de preços elevados, conforme anunciado pela empresa. Na área de tecnologia de inteligência artificial, a I-Chiun está se preparando para uma mudança significativa em sua estratégia, criando uma nova startup focada em resfriamento de chips de IA, visando um mercado de US$19,2 bilhões. Na indústria de manufatura, a SK Innovation co-organizará um fórum focado em AI no próximo ano, enquanto a LG Electronics prepara-se para um novo crescimento através de actuadores robóticos. O Partido Trabalhista do Reino Unido planeja legislar sobre algoritmos de mídias sociais, enquanto a UBS exige que jovens profissionais demonstrem competência em AI. Em outro contexto, a LOUD, uma equipe brasileira de eSports, venceu a NRG em uma série de cinco mapas e avançou à final do VCT Americas, garantindo uma vaga no Champions. Ainda em tecnologia espacial, um foguete alemão atingiu a órbita espacial, marcando um novo capítulo na corrida espacial entre a Europa e os Estados Unidos.", "ciencia": "Um estudo publicado em uma das revistas científicas mais influentes do mundo indicou que a expansão da energia solar, incentivada pelo governo na China, estava prejudicando a diversidade de aves, levantando debates acalorados nas redes sociais. No entanto, surgiram acusações de que a análise pode ter contabilizado 2,1 bilhões de gaivotas-pé-branco em um único parque, número maior que a população global da espécie. Paralelamente, a empresa alemã Isar Aerospace lançou um foguete em órbita a partir da Noruega, enquanto a Europa se esforça para aumentar sua capacidade de enviar satélites ao espaço de forma econômica e independente dos Estados Unidos. A descoberta de um rastejar na Colômbia e Equador, que foi finalmente reconhecido como uma espécie separada após mais de um século de identidades equivocadas, destaca a importância da precisão na identificação de espécies. Além disso, cientistas identificaram uma nova estratégia que pode enfraquecer as defesas do glioblastoma contra o tratamento, ao bloquear uma proteína chamada SET, o que impede a formação de tumores em modelos pré-clínicos. Este avanço pode auxiliar no diagnóstico precoce e na prevenção de complicações graves.", "cultura": "O Rock in Rio 2026 foi um dos eventos mais destacados, com várias atrações importantes. A banda Sepultura fez sua última apresentação sob chuva, encerrando sua turnê 'Celebrating Life Through Death'. O Bring Me the Horizon também se apresentou, com o vocalista Oliver Sykes pedindo um grande mosh pit, que foi atendido pelos fãs. Mesmo sem esgotar os ingressos para os dias dedicados ao rock e heavy metal, o festival mostrou que ainda tem muita música rock para oferecer. Durante a edição, a atriz Vanessa Giácomo estreou-se como escritora, lançando seu livro 'Hotel Cativeiro'. A cantora Poppy apresentou seu show no Palco Sunset, mostrando sua versatilidade musical, embora o show tenha sido considerado um pouco morno. Já o rapper Major RD, com sua mochila nas costas, se apresentou no Palco Favela, reuniu centenas de jovens e enfatizou o trap na programação do evento. Além disso, o documentário 'O Sorveteiro' foi lançado, retratando a violência com humor. A ex-presidente Michelle Bachelet, o ex-presidente Eduardo Frei e o ex-ministro José García Ruminot encabeçaram a guarda de honra do féretro de Camilo Escalona, durante seu velório.", "sociedade": "A morosidade nas dívidas tem aumentado, especialmente entre as pessoas com idades entre 30 e 70 anos, conforme estudos mostram. Por outro lado, jovens estão mais presentes nas carteiras virtuais. No Brasil, a vacinação durante a gestação tem sido debatida, com especialistas explicando que ela transfere anticorpos ao bebê e reforça a imunidade materna. O caso de Flávio Bolsonaro envolvendo Daniel Vorcaro tem impactado negativamente a campanha presidencial, mas não alterou a previsão de segundo turno. Em Goiás, um homem foi preso por arremessar pedras na sogra, o que levou à sua prisão por violência doméstica. A sociedade enfrenta diversos desafios, como a psicose pós-parto, surtos de doenças como sarampo no Bangladesh e a falta de regulamentação do setor de velórios para animais no Brasil. Além disso, a falta de imóveis está elevando os preços da compra de casas em Illinois, EUA, e a falta de segurança pública em Port-au-Prince, Haiti, continua a aumentar.", "meio_ambiente": "A cidade de Atafona, no Brasil, enfrenta a erosão costeira que está destruindo casas e serve como um laboratório para adaptações climáticas. De acordo com dados da CNN Brasil, quase 80% das pequenas e médias empresas do Rio Grande do Sul não se sentem preparadas para lidar com eventos climáticos relacionados ao El Niño. No exterior, o vulcão Anak Krakatoa na Indonésia causou a suspensão de voos e interrompeu atividades em várias áreas, incluindo a pesca, conforme informado pelo jornal japonês Japan Times. Em paralelo, a Suíça testou uma técnica inovadora para frear o derretimento de geleiras usando mantas feitas de lã de ovelha, obtendo resultados positivos, conforme relatado pelo Exame.", "direitos_humanos": "Uma coalizão de organizações cívicas pediu à UNESCO que incluísse os documentos relacionados às 'mulheres de conforto' em sua lista de bens da memória humana, visando reconhecer e preservar a história dessas vítimas. Em Hong Kong, legisladores e um conselheiro governamental estão pedindo a criação de uma lei contra assédio para preencher uma lacuna legal que dificulta processos judiciais de casos de assédio repetido. A Polícia Civil do Rio de Janeiro iniciou uma investigação sobre possíveis casos de homofobia envolvendo João Victor Gonçalves, ator de 'Quem Ama Cuida', sem uma denúncia oficial. A deputada Natália Bonavides recebeu ameaças de estupro e esquartejamento por e-mail, com informações pessoais de sua família, e as provas foram encaminhadas para investigação das autoridades. Em Florida, EUA, dois ex-guardas de um centro de detenção para migrantes enfrentam acusações de agressão a um migrante cubano em janeiro. Além disso, um grupo formado por 23 mulheres atendeu 53 mil pessoas e removeu mais de um milhão de conteúdos sexuais ilícitos da internet na Coreia do Sul, combatendo deepfakes sexuais. Em Gujarat, Índia, uma mulher foi morta por espancamento em uma estação de ônibus lotada, com testemunhas presentes durante o incidente. A família de Joris Laurencin, de 21 anos, acredita que sua morte por suicídio esteve relacionada a insultos racistas e bullying repetido por um jovem e seu grupo, levando as autoridades a investigar práticas de hazing, abusos verbais, ameaças de morte baseadas em racismo, assédio psicológico e incitação ao suicídio. O filme 'Tijuana, Todavía', dirigido por Gabriel Gutiérrez Morales, foi selecionado para a 83ª edição do Festival de Veneza, concorrendo a um prêmio LGBTQ+ e focando na história de um gay refugiado que foge da perseguição. Um child palestino ficou ferido por tiros de soldados israelenses perto da cidade de Gaza, em um acampamento de deslocados na área de al-Sudaniya, no noroeste da Faixa de Gaza, por volta do amanhecer, com o ferimento considerado moderado."}, "resumo_do_dia": {"politica_nacional": [{"id": 148298, "titulo": "Câmara aprova projeto para orientação vocacional no ensino médio", "url": "https://www.poder360.com.br/poder-congresso/camara-aprova-projeto-para-orientacao-vocacional-no-ensino-medio/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto que visa permitir que os estudantes do ensino médio identifiquem suas aptidões e competências relevantes para a orientação educacional e profissional.", "titulo_pt": "Câmara aprova projeto para orientação vocacional no ensino médio", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148299, "titulo": "Por que ainda não temos carros dirigindo sozinhos no Brasil?", "url": "https://www.poder360.com.br/poder-tech/por-que-ainda-nao-temos-carros-dirigindo-sozinhos-no-brasil/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma de testes é crucial para assegurar a segurança dos veículos autônomos, que enfrentam desafios significativos para serem adotados no Brasil.", "titulo_pt": "Por que ainda não temos carros autônomos no Brasil?", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148300, "titulo": "Treine para votar: simulador permite testar a urna antes das eleições", "url": "https://www.poder360.com.br/poder-eleicoes-2026/treine-para-votar-simulador-permite-testar-a-urna-antes-das-eleicoes/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O simulador de votação fornecido pela Justiça Eleitoral permite aos eleitores testar o processo de votação com a urna eletrônica antes das eleições. Essa ferramenta ajuda a prevenir erros no dia do pleito.", "titulo_pt": "Treine para votar: simulador da justiça eleitoral permite testar a urna antes das eleições", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148301, "titulo": "Câmara muda regra do tempo de serviço de PMs e bombeiros", "url": "https://www.poder360.com.br/poder-congresso/camara-muda-regra-do-tempo-de-servico-de-pms-e-bombeiros/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara alterou a regra do tempo de serviço para a inatividade dos policiais militares e bombeiros, reduzindo o período de 30 para 25 anos.", "titulo_pt": "Câmara reduz regra do tempo de serviço de PMs e bombeiros", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148302, "titulo": "Trânsito para 7 de Setembro tem bloqueios na Esplanada neste domingo", "url": "https://www.poder360.com.br/poder-brasil/transito-para-7-de-setembro-tem-bloqueios-na-esplanada-neste-domingo/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Restrições de tráfego começaram no sábado e novos fechamentos entram em vigor às 16h e às 23h em Brasília. O bloqueio na Esplanada dos Ministérios está em vigor neste domingo para o evento do 7 de Setembro.", "titulo_pt": "Trânsito para 7 de Setembro tem bloqueios na Esplanada neste domingo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148303, "titulo": "Motta e Alcolumbre confirmam presença no 7 de Setembro em Brasília", "url": "https://www.poder360.com.br/poder-congresso/motta-e-alcolumbre-confirmam-presenca-no-7-de-setembro-em-brasilia/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidentes da Câmara dos Deputados e do Senado, Motta e Alcolumbre, confirmaram presença no desfile do Dia da Independência em Brasília, mesmo durante a campanha eleitoral. Lula também participará do evento na Esplanada dos Ministérios.", "titulo_pt": "Motta e Alcolumbre confirmam presença no 7 de Setembro em Brasília", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148304, "titulo": "Desfile de 7 de Setembro em Brasília começa às 9h; veja programação", "url": "https://www.poder360.com.br/poder-brasil/desfile-de-7-de-setembro-em-brasilia-comeca-as-9h-veja-programacao/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desfile militar do Dia do Exército em Brasília começa às 9h. As arquibancadas serão abertas às 6h e haverá transporte gratuito. A Esplanada dos Ministérios terá um esquema especial de segurança.", "titulo_pt": "Desfile de 7 de Setembro em Brasília começa às 9h; veja programação", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148276, "titulo": "Planalto mobiliza militância para lotar 7 de Setembro, mas proíbe propaganda política", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/planalto-mobiliza-militancia-para-lotar-7-de-setembro-mas-proibe-propaganda-politica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Palácio do Planalto está coordenando uma mobilização para que movimentos sociais e apoiadores do presidente Lula compareçam em massa ao evento do 7 de Setembro, na Esplanada dos Ministérios. O evento visa lotar o local com apoiantes do governo.", "titulo_pt": "Planalto mobiliza militância para 7 de Setembro, mas proíbe propaganda política", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 148306, "titulo": "Lula leva 5 vitórias no Congresso antes da eleição, mas 6 X 1 é adiada", "url": "https://www.poder360.com.br/poder-congresso/lula-leva-5-vitorias-no-congresso-antes-da-eleicao-mas-6-x-1-e-adiada/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional aprovou cinco propostas de interesse do governo Lula antes das eleições. No entanto, a Proposta de Emenda Constitucional (PEC) que trata do fim da escala 6 X 1 e a PEC da Segurança Pública ainda não foram votadas.", "titulo_pt": "Lula conquista 5 vitórias no Congresso antes da eleição, mas 6 X 1 e segurança ficam pendentes", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148340, "titulo": "Campanha de Lula vê “novo momento” em pesquisas; Flávio mira virada pós-7/9", "url": "https://www.cnnbrasil.com.br/eleicoes/campanha-de-lula-ve-novo-momento-em-pesquisas-flavio-mira-virada-pos-7-9/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T07:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma semana marcada por novas revelações em escândalos policiais, as pesquisas indicaram uma aproximação nas intenções de voto entre os candidatos. A campanha de Lula registrou um 'novo momento' de acordo com as pesquisas.", "titulo_pt": "Campanha de Lula vê 'novo momento' em pesquisas; Flávio mira virada pós-7/9", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148371, "titulo": "Alckmin pede investigação sobre Tarcísio e Master: \"Traga a verdade\"", "url": "https://www.metropoles.com/sao-paulo/alckmin-pede-investigacao-sobre-tarcisio-e-master-traga-a-verdade", "fonte_id": "metropoles", "data_pub": "2026-09-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente Geraldo Alckmin pediu investigação sobre Tarcísio e Master, afirmando que 'traga a verdade'. Ele classificou a crise no STF como 'muito triste'.", "titulo_pt": "Alckmin pede investigação sobre Tarcísio e Master: 'traga a verdade'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148374, "titulo": "Sangue no asfalto, crise no STF: fantasmas que assombram Lula", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/sangue-no-asfalto-crise-no-stf-fantasmas-que-assombram-lula", "fonte_id": "metropoles", "data_pub": "2026-09-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto compara um crime violento ocorrido em 1997 com a situação atual de tensão no Palácio do Planalto, 28 dias antes das eleições.", "titulo_pt": "Sangue no asfalto, crise no STF: fantasmas que assombram Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148375, "titulo": "Governo busca acordos no Congresso esvaziado para não depender do Centrão", "url": "https://www.metropoles.com/brasil/governo-busca-acordos-no-congresso-esvaziado-para-nao-depender-do-centrao", "fonte_id": "metropoles", "data_pub": "2026-09-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula busca acordos no Congresso em sessões esvaziadas para evitar depender do Centrão. Prioridades já foram discutidas com Motta e Alcolumbre, mas outros pontos como a PEC da Segurança e o Orçamento ficarão para um Congresso pós-eleição mais incerto.", "titulo_pt": "Governo busca acordos no Congresso esvaziado para não depender do Centrão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148343, "titulo": "Entenda a crise no STF e o que pode acontecer a partir de agora", "url": "https://www.cnnbrasil.com.br/politica/entenda-a-crise-no-stf-e-o-que-pode-acontecer-a-partir-de-agora/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T07:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise no Supremo Tribunal Federal (STF) está relacionada a um esquema que visa limitar as investigações sobre o Banco Master. A tensão institucional envolve disputas sobre o controle das investigações.", "titulo_pt": "Entenda a crise no STF e o que pode acontecer a partir de agora", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148344, "titulo": "Fachin defende fim do inquérito das fake news, aberto há 7 anos", "url": "https://www.cnnbrasil.com.br/politica/fachin-defende-fim-do-inquerito-das-fake-news-aberto-ha-7-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Ministro Fachin, defendeu o encerramento do inquérito sobre fake news, que foi aberto há sete anos. Ele afirma que a atual crise reforça a urgência de finalizar essa investigação, inicialmente relatada pelo Ministro Moraes.", "titulo_pt": "Fachin defende fim do inquérito das fake news, aberto há 7 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148345, "titulo": "5 medidas provisórias perderão a validade antes do 1º turno das eleições", "url": "https://www.cnnbrasil.com.br/politica/5-medidas-provisorias-perderao-a-validade-antes-do-1o-turno-das-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco medidas provisórias que foram editadas pelo governo estão prestes a perder a validade antes do primeiro turno das eleições. As MPs tratam de subvenção para produtores de combustíveis e financiamento para compra de veículos.", "titulo_pt": "5 Medidas provisórias perderão a validade antes do 1º turno das eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 148612, "titulo": "Volcano eruption leaves 150,000 passengers stranded in Indonesia", "url": "https://www.bbc.co.uk/news/articles/cvgy5k4n07ko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-06T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 150 mil passageiros aéreos ficaram estagnados após a detecção de cinzas vulcânicas no espaço aéreo próximo a Jakarta, devido a erupções vulcânicas.", "titulo_pt": "Eruption deixa mais de 150 mil passageiros aéreos estagnados em Indonesia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 148605, "titulo": "US envoys Witkoff and Kushner set for talks in Kyiv after meeting with Putin in Moscow", "url": "https://www.npr.org/2026/09/06/nx-s1-5959657/us-envoys-witkoff-kushner-talks-in-kyiv-putin-moscow", "fonte_id": "npr_news", "data_pub": "2026-09-06T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enviados dos Estados Unidos Steve Witkoff e Jared Kushner planejam visitar Kiev neste domingo, em sua primeira viagem à capital ucraniana desde que começaram negociações de paz com a Rússia em Moscou.", "titulo_pt": "Enviados dos EUA Witkoff e Kushner se preparam para conversas em kiev após reunião com Putin em moscou", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 148648, "titulo": "Israeli flags become the latest weapon of settlers in West Bank domination", "url": "https://www.aljazeera.com/features/2026/9/6/israeli-flags-become-the-latest-weapon-of-settlers-in-west-bank-domination?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-06T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os bandeiras israelenses estão sendo usadas como uma forma de colonização visual para fazer os palestinos se sentirem como visitantes em seu próprio território.", "titulo_pt": "Bandeiras israelenses se tornam a última arma dos colonizadores na dominação do vale do jordão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 148621, "titulo": "Putin reiterates demands to Trump's two envoys who came to Kremlin with 'ideas' for peace", "url": "https://www.lemonde.fr/en/international/article/2026/09/06/putin-reiterates-demands-to-trump-s-two-envoys-who-came-to-kremlin-with-ideas-for-peace_6757212_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-06T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os enviados dos Estados Unidos, Steve Witkoff e Jared Kushner, retornaram a Moscou após uma reunião de três horas com o presidente russo, Vladimir Putin, sem alcançar avanços nas negociações de paz. Eles voltarão em seguida a Kiev.", "titulo_pt": "Putin reitera demandas a enviados dos EUA que vieram a moscou com 'ideias' para paz", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 148396, "titulo": "Como direita radical da Alemanha planeja chegar ao poder com eleição deste domingo e mudar história do país", "url": "https://www.bbc.com/portuguese/articles/cjrx7xl1pvwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-06T09:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um partido de direita radical na Alemanha pode conquistar a maioria absoluta na Saxônia-Anhalt, o que seria a primeira vez que um partido de extrema-direita governa em um estado alemão desde a Segunda Guerra Mundial. A eleição deste domingo pode marcar um momento histórico significativo no cenário político alemão.", "titulo_pt": "Como direita radical da Alemanha planeja chegar ao poder com eleição deste domingo e mudar história do país", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 148636, "titulo": "Iranian forces target US naval drone attempting to enter Strait of Hormuz", "url": "http://www.euronews.com/2026/09/06/iranian-forces-target-us-naval-drone-attempting-to-enter-strait-of-hormuz", "fonte_id": "euronews", "data_pub": "2026-09-06T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças iranianas alvejaram um drone naval dos EUA que tentava entrar no Estreito de Ormuz. Antes disso, as forças armadas dos EUA haviam atacado três navios-petróleo iranianos em resposta a supostos lançamentos de mísseis balísticos do IRGC contra dois navios de guerra norte-americanos.", "titulo_pt": "Forças iranianas alvejam drone naval dos EUA no estreito de Ormuz", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 148649, "titulo": "Israeli air attacks on Lebanon kill at least four", "url": "https://www.aljazeera.com/news/2026/9/6/israeli-air-attacks-on-lebanon-kill-at-least-four?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-06T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses realizaram ataques aéreos em duas localidades libanesas, resultando em pelo menos quatro mortes. Duas mulheres morreram em um ataque em Arab Salim, e duas pessoas em outro em Nabatieh al-Fawqa.", "titulo_pt": "Bombardamentos israelenses em líbano causam ao menos quatro mortes", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 148629, "titulo": "Iran claims strike on US ship in Strait of Hormuz as fighting escalates", "url": "https://www.france24.com/en/video/20260906-iran-claims-strike-on-us-ship-in-strait-of-hormuz-as-fighting-escalates", "fonte_id": "france24", "data_pub": "2026-09-06T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã afirmou que atingiu uma embarcação não tripulada dos Estados Unidos que tentava entrar no Estreito de Ormuz. Este incidente ocorre em meio a uma escalada recente de tensões entre os dois países.", "titulo_pt": "Irã afirma ter atacado navio não tripulado dos EUA no estreito de Ormuz", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 148630, "titulo": "Nepal floods: Search operations enter 12th day", "url": "https://www.france24.com/en/video/20260906-nepal-floods-search-operations-enter-12th-day", "fonte_id": "france24", "data_pub": "2026-09-06T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As operações de busca no Nepal entraram em sua 12ª dia, enfrentando condições desafiadoras devido às inundações catastróficas. A ressalva positiva é o resgate extraordinário de quatro sobreviventes.", "titulo_pt": "Nepal: operações de busca chegam ao 12º dia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 148540, "titulo": "Trump Envoys Expected to Make First Visit to Kyiv", "url": "https://www.nytimes.com/2026/09/06/world/europe/ukraine-zelensky-witkoff-kushner-russia-putin.html", "fonte_id": "nyt_world", "data_pub": "2026-09-06T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steve Witkoff e Jared Kushner se encontraram com o Presidente Vladimir V. Putin da Rússia em Moscou no sábado com o objetivo de reativar as negociações de paz.", "titulo_pt": "Envio de trump planeja primeira visita a kiev", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 148542, "titulo": "A Bad Year for Bees Gets Worse as Trump’s Tariffs Hit Canada’s Honey Belt", "url": "https://www.nytimes.com/2026/09/06/world/canada/a-bad-year-for-bees-gets-worse-as-trumps-tariffs-hit-canadas-honey-belt.html", "fonte_id": "nyt_world", "data_pub": "2026-09-06T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alberta, que produz 40% da mel da Canadá, enfrenta ameaças à indústria devido a chuvas excessivas e a guerra comercial entre Estados Unidos e Canadá, iniciada por Trump.", "titulo_pt": "Um ano ruim para abelhas Gets Worse com tarifas de Trump atingindo a região da mel do canadá", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 148545, "titulo": "What Secret Audits Tell Us About How Ukraine’s Military Is Spending Its Money", "url": "https://www.nytimes.com/2026/09/06/world/europe/ukraine-military-audits-spending-weapons.html", "fonte_id": "nyt_world", "data_pub": "2026-09-06T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os documentos revelam um exame detalhado do processo de contratação de armas na Ucrânia.", "titulo_pt": "O que as auditorias secretas nos dizem sobre como o exército ucraniano está gastando seu dinheiro", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 148606, "titulo": "QUIZ: Ugh, I'll do it later. How much do you know about procrastination?", "url": "https://www.npr.org/2026/09/06/nx-s1-5957512/quiz-ugh-ill-do-it-later-how-much-do-you-know-about-procrastination", "fonte_id": "npr_news", "data_pub": "2026-09-06T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O quiz apresenta fatos surpreendentes sobre procrastinaçã
