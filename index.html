klf", "fonte_id": "guardian_culture", "data_pub": "2026-11-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um monumento está sendo construído em Birkenhead usando 34.592 tijolos, cada um contendo cinzas glasificadas de uma pessoa falecida, apoiado pelo KLF. Centenas de pessoas marcham através do Parque Birkenhead, usando roupas de alta visibilidade, com uma carrinho de compras em chamas liderando a procissão.", "titulo_pt": "‘Meu irmão foi seu primeiro corpo’: você adicionaría seu cadáver à pirâmide de mortos de Birkenhead?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 288811, "titulo": "‘She was so not regretful about killing her husband’: the Iranian film that shines a light on blood money and retributive justice", "url": "https://www.theguardian.com/film/2026/nov/26/an-eye-for-an-eye-tanaz-eshaghian", "fonte_id": "guardian_culture", "data_pub": "2026-11-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A co-diretora do documentário An Eye for an Eye, Tanaz Eshaghian, relata como ela chegou a criar um filme sobre uma mulher ameaçada de execução por familiares do marido, conforme estabelecido pela lei sharia. O filme explora a questão da 'sangue por sangue' e a justiça retributiva no Irã.", "titulo_pt": "Ela não se arrependia de matar o marido: o filme iraniano que ilumina o 'sangue por sangue' e a justiça retributiva", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 288812, "titulo": "‘When I cut these women out I feel like I’m freeing them’: the feminist collage artists taking scissors to the patriarchy", "url": "https://www.theguardian.com/artanddesign/2026/nov/26/what-rose-from-the-cut-exhibition-graces-mews-gallery-feminist-collage", "fonte_id": "guardian_culture", "data_pub": "2026-11-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição celebra artistas feministas que recortaram obras existentes para criar peças impactantes. Valerie Solanas vendeu seu manifesto SCUM por 10 centavos para mulheres e um dólar para homens, enquanto a artista Justine Kurland considerou vender seus livros baratos para reduzir seu peso cultural, mas acabou recortando-os para abordar problemas de linguagem, história e herança.", "titulo_pt": "Quando cortei essas mulheres, senti que as libertava: as artistas feministas que cortam o patriarcado com tesouras", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 288814, "titulo": "O come, all ye faithful! Why theatres are bringing audiences on stage, from Jesus Christ Superstar to Cloud 9", "url": "https://www.theguardian.com/stage/2026/nov/26/theatres-audience-on-stage-jesus-christ-superstar-cloud-9-high-school-musical-rent", "fonte_id": "guardian_culture", "data_pub": "2026-11-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Teatros estão adotando novas abordagens, como High School Musical e Rent, que colocam o público no palco, ao lado dos atores. Esta tendência começou durante a pandemia em 2020, quando Jesus Christ Superstar foi apresentado no Regent’s Park, Londres, com o público distanciado de dois metros dos atores.", "titulo_pt": "Come, todos os fiéis! Por que teatros estão levando o público para o palco", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 288316, "titulo": "El nuevo giro por la orden final del TPS venezolano y por qué el Gobierno retiró su pedido de suspensión ante la Corte Suprema", "url": "https://www.lanacion.com.ar/estados-unidos/el-nuevo-giro-por-la-orden-final-del-tps-venezolano-y-por-que-el-gobierno-retiro-su-pedido-de-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T07:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo retirou o pedido de suspensão do TPS (Programa de Proteção Temporária) para venezuelanos em 2023 na Corte Suprema. O benefício permanece suspenso à espera do julgamen ", "classe": "B"}, {"id": 288309, "titulo": "Trabajar después de los 100 años: en Japón hay personas que nunca se jubilan y siguen activas", "url": "https://www.lanacion.com.ar/lifestyle/trabajar-despues-de-los-100-anos-en-japon-hay-personas-que-nunca-se-jubilan-y-siguen-activas-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em Japão, há pessoas que trabalham após os 100 anos, motivadas pela necessidade econômica e pelo conceito de ikigai. Eles demonstram que a velhice pode ser uma fase de atividade produtiva.", "titulo_pt": "Trabalhar após os 100 anos: em Japão, há pessoas que nunca se jubilam e permanecem ativas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 288349, "titulo": "Chile está cambiando: ¿estamos preparados para su futuro demográfico?", "url": "https://www.latercera.com/opinion/noticia/chile-esta-cambiando-estamos-preparados-para-su-futuro-demografico/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute o processo de mudança demográfica no Chile e questiona se a sociedade está preparada para essas mudanças. Não há informações adicionais sobre conteúdos específicos do texto.", "titulo_pt": "Chile está mudando: estamos preparados para seu futuro demográfico?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 288736, "titulo": "(LEAD) Unionized rail workers launch work-to-rule campaign; 3 train services canceled", "url": "https://en.yna.co.kr/view/AEN20261126002451315", "fonte_id": "yonhap_news", "data_pub": "2026-11-26T07:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores sindicalizados da Coréia Ferroviária (KORAIL) iniciaram uma campanha de trabalho regrado, resultando no cancelamento de três serviços ferroviários. A informação foi divulgada em Seul, 26 de novembro, pela Yonhap.", "titulo_pt": "Trabalhadores sindicalizados da ferrovia lançam campanha de trabalho regrado; três serviços cancelados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 288599, "titulo": "Gaza meningitis cases surge as collapsing infrastructure fuels health fears", "url": "https://www.aljazeera.com/news/2026/11/26/gaza-meningitis-cases-surge-as-collapsing-infrastructure-fuels-health-fears?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T06:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A meningite está causando preocupação em Gaza, devido ao sobrepovoamento e ao sistema de saneamento danificado, que estão colocando as crianças em risco.", "titulo_pt": "Meningite aumenta em gaza devido a infraestrutura danificada e sobrepovoamento", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 288722, "titulo": "Teen drinking falls, but risky drinking rises among girls", "url": "https://www.koreaherald.com/article/10950478", "fonte_id": "korea_herald", "data_pub": "2026-11-26T05:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Menos jovens sul-coreanos estão beber álcool, mas entre as meninas o consumo de álcool em doses altas aumentou 2,5 pontos percentuais para 54,5% este ano. Entre os meninos, a proporção diminuiu para 40,7%.", "titulo_pt": "Consumo de álcool cai entre jovens, mas risco aumenta entre garotas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 288653, "titulo": "Community cafeterias for kids in Japan hit record 13,800", "url": "https://www.japantimes.co.jp/news/2026/11/26/japan/society/children-cafeteria-record-high/", "fonte_id": "japan_times", "data_pub": "2026-11-26T02:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento revelou que mais de 40% dos distritos escolares do Japão têm pelo menos um café comunitário para crianças. O número total de cafeterias comunitárias para crianças atingiu um recorde de 13.800.", "titulo_pt": "Cafeterias comunitárias para crianças no Japão atingem marca recorde de 13.800", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 288654, "titulo": "Young Kumamoto officials use 2016 quake lessons in current relief efforts", "url": "https://www.japantimes.co.jp/news/2026/11/26/japan/young-kumamoto-officials-quake-lessons/", "fonte_id": "japan_times", "data_pub": "2026-11-26T02:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários jovens de Kumamoto estão utilizando as lições aprendidas com o terremoto de 2016 para auxiliar na atual assistência às vítimas. Eles estão determinados a ajudar pessoas que enfrentam situações semelhantes às que eles passaram como sobreviventes de desastre.", "titulo_pt": "Funcionários jovens de Kumamoto usam lições do terremoto de 2016 em esforços atuais de auxílio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 287200, "titulo": "Educator parental leaves expanded", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868421", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A política de licenças parentais para educadores foi ampliada. A medida visa oferecer mais tempo de licença para os educadores que se tornam pais ou mães.", "titulo_pt": "Licenças parentais para educadores ampliadas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 288161, "titulo": "Covid-19: o único estado em alerta para casos graves", "url": "https://veja.abril.com.br/saude/covid-19-o-unico-estado-em-alerta-para-casos-graves/", "fonte_id": "veja", "data_pub": "2026-11-25T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Outros vírus respiratórios estão aumentando as internações no estado, enquanto a situação nacional do coronavírus permanece em nível de baixo risco. O estado está em alerta para casos graves de coronavírus.", "titulo_pt": "Covid-19: único estado em alerta para casos graves", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 288212, "titulo": "Mau tempo atrasa mais de 6 mil voos na véspera de Ação de Graças nos EUA", "url": "https://www.cnnbrasil.com.br/internacional/mau-tempo-atrasa-mais-de-6-mil-voos-na-vespera-de-acao-de-gracas-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tempestades nas duas costas dos Estados Unidos causaram atrasos em mais de 6 mil voos na véspera de Ação de Graças. A Parada de Ação de Graças da Macy's em Nova York foi adiada pela primeira vez devido às condições meteorológicas adversas.", "titulo_pt": "Mau tempo adia mais de 6 mil voos e parada de Ação de Graças na véspera do feriado nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288592, "titulo": "DR Congo Ebola cases surpass 12,000 as fighting disrupts response in east", "url": "https://www.aljazeera.com/news/2026/11/26/dr-congo-ebola-cases-surpass-12000-as-fighting-disrupts-response-in-east?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T07:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de Ebola na República Democrática do Congo ultrapassou 12.000. A situação se agrava devido a conflitos no leste do país que deslocam trabalhadores de saúde e civis.", "titulo_pt": "Casos de Ebola na república democrática do Congo superam 12.000, enquanto conflitos dificultam a resposta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 288593, "titulo": "At least 13 dead in Indonesia gold mine flood as rescue efforts intensify", "url": "https://www.aljazeera.com/news/2026/11/26/at-least-13-dead-in-indonesia-gold-mine-flood-as-rescue-efforts-intensify?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 13 pessoas morreram em uma inundação em uma mina de ouro na Indonésia, enquanto os esforços de resgate intensificaram. Os trabalhadores de resgate enfrentam condições difíceis, com buracos estreitos, profundos e escorregadios, além de iluminação fraca.", "titulo_pt": "Pelo menos 13 mortos em inundação de mina de ouro na indonésia, com intensificação dos esforços de resgate", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 288556, "titulo": "King tides and powerful waves destroy pier and flood homes in California", "url": "https://www.euronews.com/video/2026/11/26/king-tides-and-powerful-waves-destroy-pier-and-flood-homes-in-california", "fonte_id": "euronews", "data_pub": "2026-11-26T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marés reais e ondas poderosas destruíram parte do pier de Pacifica e inundações afetaram casas costeiras em California, EUA, levando autoridades a emitir avisos.", "titulo_pt": "Marés reais e ondas poderosas destruem pier e inunda casas em California", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 288559, "titulo": "Indonesia: rescuers race to find 13 miners trapped in flooded illegal gold mine", "url": "https://www.euronews.com/2026/11/26/indonesia-rescuers-race-to-find-13-miners-trapped-in-flooded-illegal-gold-mine", "fonte_id": "euronews", "data_pub": "2026-11-26T05:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre ocorreu na última segunda-feira quando chuvas intensas fizeram o rio Ciseureuh transbordar e inundar uma mina ilegal com cerca de 100 metros de profundidade, deixando 13 mineradores presos.", "titulo_pt": "Indonésia: resgatistas correm para encontrar 13 mineradores presos em mina ilegal inundação", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 288560, "titulo": "Moment fuel truck fire engulfs traffic on Cairo highway", "url": "https://www.euronews.com/2026/11/26/moment-fuel-truck-fire-engulfs-traffic-on-cairo-highway", "fonte_id": "euronews", "data_pub": "2026-11-26T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acidente envolvendo um caminhão tanque de combustível causou um incêndio que resultou em pelo menos 31 mortes e 21 feridos na rodovia anel da cidade de Giza, perto do Cairo. O fogo consumiu mais de duas dúzias de veículos no final da noite de quarta-feira.", "titulo_pt": "Acidente com caminhão tanque de combustível causa incêndio e vários mortos na rodovia anel do Cairo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 287202, "titulo": "Five new dengue cases reported in Kaohsiung: CDC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868423", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatados cinco novos casos de dengue em Kaohsiung: o Centro de Controlo e Prevenção de Doenças (CDC) fez o anúncio.", "titulo_pt": "Cinco novos casos de dengue relatados em Kaohsiung: CDC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 287697, "titulo": "Mais de dois milhões de testes por ano: saiba como a Sabesp garante a qualidade da água", "url": "https://veja.abril.com.br/saude/mais-de-dois-milhoes-de-testes-por-ano-saiba-como-a-sabesp-garante-a-qualidade-da-agua/", "fonte_id": "veja", "data_pub": "2026-11-25T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sabesp realiza mais de dois milhões de testes por ano para garantir a qualidade da água. A companhia monitora todas as etapas do abastecimento, desde a captação nos mananciais até a chegada aos imóveis.", "titulo_pt": "Mais de dois milhões de testes por ano: saiba como a Sabesp garante a qualidade da água", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 287583, "titulo": "Chuva deve favorecer plantio da soja no Sul e no Sudeste nos próximos dias", "url": "https://www.cnnbrasil.com.br/agro/chuva-deve-favorecer-plantio-da-soja-no-sul-e-no-sudeste-nos-proximos-dias/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As previsões meteorológicas indicam chuvas acima de 100 mm nos próximos quatro dias em áreas do Paraná, que são favoráveis para o plantio da soja. O sul do Rio Grande do Sul, no entanto, ainda apresenta baixa umidade no solo e deve esperar chuvas significativas apenas em dezembro.", "titulo_pt": "Chuva deve favorecer plantio da soja no Sul e no Sudeste nos próximos dias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287620, "titulo": "Por que o Brasil vive surto de mpox? O que se sabe — e o que não se sabe — sobre os novos casos da doença", "url": "https://www.bbc.com/portuguese/articles/cq70269ke8l4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-25T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de casos de mpox aumentou 40% neste ano no Brasil, mas ainda é menor que o registrado em 2022, quando ocorreu o último grande surto da doença no país.", "titulo_pt": "Por que o Brasil vive surto de mpox? O que se sabe — e o que não se sabe — sobre os novos casos da doença", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 287624, "titulo": "Desmatamento e fogo transformam a Amazônia em vilã do clima", "url": "https://www.dw.com/pt-br/desmatamento-e-fogo-transformam-a-amazônia-em-vilã-do-clima/a-80052197?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista \"Nature\" indica que ações humanas, acentuadas pela crise climática, fizeram a Amazônia emitir mais carbono do que absorve, transformando-a em uma fonte de emissões que contribuem para o aquecimento global.", "titulo_pt": "Desmatamento e fogo transformam a Amazônia em fonte de emissões de carbono", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287932, "titulo": "Elderly man with Alzheimer’s rescued after 11 days in Amazon jungle", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/25/aje-onl-nf_man-with-alzheimers-rescued-after-11-days-in-amazon-251126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 74 anos, diagnosticado com Alzheimer, foi encontrado vivo após 11 dias desaparecido na floresta amazônica do Brasil.", "titulo_pt": "Idoso com Alzheimer resgatado após 11 dias no amazonas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 286748, "titulo": "RADAR LT: El Niño: lluvias y calor podrían aumentar el riesgo de enfermedades infecciosas en Chile", "url": "https://www.latercera.com/videos/noticia/radar-lt-el-nino-lluvias-y-calor-podrian-aumentar-el-riesgo-de-enfermedades-infecciosas-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T17:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Instituto Milenio em Inmunología e Inmunoterapia (IMII) alertam que as chuvas intensas e as altas temperaturas associadas ao El Niño podem aumentar o risco de doenças infecciosas como dengue, hantavirus e infecções alimentares. Eles enfatizam a necessidade de reforçar as medidas de prevenção.", "titulo_pt": "RADAR LT: el Niño: chuvas e calor podem aumentar o risco de doenças infecciosas no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 286562, "titulo": "Mpox: número de casos passa de 1 500 no Brasil e São Paulo inicia vacinação com novas doses", "url": "https://veja.abril.com.br/saude/mpox-numero-de-casos-passa-de-1-500-no-brasil-e-sao-paulo-inicia-vacinacao-com-novas-doses/", "fonte_id": "veja", "data_pub": "2026-11-25T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de casos de mpox no Brasil ultrapassou 1.500. A cidade de São Paulo recebeu 600 doses de vacina enviadas pelo Ministério da Saúde.", "titulo_pt": "Número de casos de mpox no Brasil passa de 1.500 e São Paulo inicia vacinação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 287320, "titulo": "Media reaction: Who is to blame for COP31 ‘failure’?", "url": "https://www.carbonbrief.org/media-reaction-who-is-to-blame-for-cop31-failure", "fonte_id": "carbon_brief", "data_pub": "2026-11-25T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31 chegou a um fim dramático no final de semana quando uma coalizão de países rejeitou o 'Pacto de Antalya', citando suas falhas. O post discute a reação da mídia sobre quem deve ser culpado pelo 'fracasso' da COP31.", "titulo_pt": "Reação da mídia: quem deve ser culpado pelo 'fracasso' da COP31?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 287185, "titulo": "9 dead, 17 trapped in Indonesia after illegal gold mine floods", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375778/3-dead-23-trapped-indonesia-after-illegal-gold-mine-floods", "fonte_id": "scmp", "data_pub": "2026-11-25T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove pessoas morreram e 17 estão desaparecidas após uma mina ilegal de ouro se encher em uma região montanhosa da Indonésia. O acidente ocorreu quando a chuva forte fez o rio Ciseureuh transbordar e inundar uma mina localizada na província de Java Ocidental.", "titulo_pt": "9 Mortos, 17 desaparecidos após mina ilegal de ouro se encher na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 288432, "titulo": "New defence laws could have ‘significant’ implications for human rights, Labor-led inquiry finds", "url": "https://www.theguardian.com/australia-news/2026/nov/26/new-defence-laws-could-have-significant-implications-for-human-rights-labor-led-inquiry-finds", "fonte_id": "guardian_world", "data_pub": "2026-11-26T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um inquérito liderado pelo Partido Laborista alertou que as novas leis de defesa podem ter 'significativas' implicações para os direitos humanos. O inquérito também expressou preocupações sobre a falta de exigências para garantir que as pessoas detidas sob as novas leis tenham acesso a água potável e condições humanas.", "titulo_pt": "Novas leis de defesa podem ter 'significativas' implicações para os direitos humanos, diz inquérito", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 288672, "titulo": "Nepal starts legal process to declare 4,000 dead 3 months after fatal floods", "url": "https://www.scmp.com/news/asia/south-asia/article/3375910/nepal-starts-legal-process-declare-4000-dead-3-months-after-fatal-floods", "fonte_id": "scmp", "data_pub": "2026-11-26T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal iniciou o processo legal de declarar mortos milhares de pessoas ainda desaparecidas três meses após as inundações catastróficas de verão. Uma geleira de alta altitude que desabou na fronteira entre Nepal e China em 26 de agosto causou uma enxurrada de água, gelo, rochas e detritos, matando mais de 1.400 pessoas e deixando mais de 5.500 desaparecidos no Nepal.", "titulo_pt": "Nepal inicia processo legal para declarar mortos 4.000 desaparecidos três meses após inundações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288277, "titulo": "Direito Internacional e o racismo estrutural", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/direito-internacional-e-o-racismo-estrutural", "fonte_id": "jota", "data_pub": "2026-11-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É necessário uma educação jurídica antirracista.", "titulo_pt": "Direito Internacional e o racismo estrutural", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 288591, "titulo": "Photos: Rallies around the world denounce violence against women", "url": "https://www.aljazeera.com/gallery/2026/11/26/photos-rallies-around-the-world-denounce-violence-against-women?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T07:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ressaltam manifestações em todo o mundo contra violência contra mulheres. O relatório da ONU indica que cerca de 47.000 mulheres e meninas foram mortas intencionalmente por parceiros íntimos ou familiares no ano passado.", "titulo_pt": "Imagens: manifestações em todo o mundo denunciam violência contra mulheres", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 288430, "titulo": "‘Trapped in grief’: wife of Japanese journalist detained by Russia pleads for his release", "url": "https://www.theguardian.com/world/2026/nov/26/japanese-journalist-yuki-imai-detained-in-russia-wife-pleads-his-release", "fonte_id": "guardian_world", "data_pub": "2026-11-26T05:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A esposa do jornalista japonês Yuki Imai, detido na Rússia há mais de um mês sob acusações de espionagem, pede por sua liberdade. Imai, que trabalhava para o Hokkaido Shimbun em Sakhalin, foi preso em outubro enquanto se preparava para retornar ao Japão.", "titulo_pt": "Travada no luto”: esposa do jornalista japonês detido na Rússia pede por sua liberdade", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 288473, "titulo": "Las Mirabal y los derechos de las mujeres: una memoria que interpela al presente", "url": "https://www.ciperchile.cl/2026/11/25/las-mirabal-y-los-derechos-de-las-mujeres-una-memoria-que-interpela-al-presente/?utm_source=rss&utm_medium=rss&utm_campaign=las-mirabal-y-los-derechos-de-las-mujeres-una-memoria-que-interpela-al-presente", "fonte_id": "ciper_chile", "data_pub": "2026-11-26T01:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda os direitos das mulheres e a memória das Mirabal. Não há detalhes adicionais sobre o conteúdo do artigo.", "titulo_pt": "Las Mirabal e os direitos das mulheres: uma memória que interpela o presente", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 288131, "titulo": "Estudo aponta 356 religiosos acusados de abuso sexual na Itália em 20 anos", "url": "https://www.cartacapital.com.br/mundo/estudo-aponta-356-religiosos-acusados-de-abuso-sexual-na-italia-em-20-anos/", "fonte_id": "cartacapital", "data_pub": "2026-11-25T22:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou 356 religiosos acusados de abuso sexual na Itália entre 2001 e 2021, com 57 decisões judiciais resultando em condenações definitivas à prisão. O levantamento registrou 385 vítimas nesse período.", "titulo_pt": "Estudo aponta 356 religiosos acusados de abuso sexual na Itália em 20 anos", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 287589, "titulo": "Itália prendeu 57 padres por abuso sexual infantil entre 2001 e 2021", "url": "https://www.cnnbrasil.com.br/internacional/italia-prendeu-57-padres-por-abuso-sexual-infantil-entre-2001-e-2021/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entre 2001 e 2021, 57 padres foram presos na Itália por abuso sexual infantil. Um relatório encomendado pela Conferência Episcopal Italiana registra 880 incidentes de abuso envolvendo 356 supostos agressores e 385 vítimas nesse período.", "titulo_pt": "Itália prendeu 57 padres por abuso sexual infantil entre 2001 e 2021", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287700, "titulo": "ONG acusa Israel de dificultar nascimentos em Gaza", "url": "https://veja.abril.com.br/mundo/ong-acusa-israel-de-dificultar-nascimentos-em-gaza/", "fonte_id": "veja", "data_pub": "2026-11-25T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ONG acusa Israel de limitar os nascimentos em Gaza através de restrições à saúde reprodutiva das mulheres palestinas. A ONU alerta para violações cada vez mais sistemáticas no território.", "titulo_pt": "ONG acusa Israel de dificultar nascimentos em Gaza", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 287627, "titulo": "Brasil lidera ranking de feminicídios na América Latina e Caribe", "url": "https://www.dw.com/pt-br/brasil-lidera-ranking-de-feminicídios-na-américa-latina-e-caribe/a-80052515?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T19:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil lidera o ranking de feminicídios na América Latina e Caribe, com 1.453 casos em um ano. Em 26 países e territórios analisados, pelo menos 11 mulheres são mortas por dia por motivos de gênero.", "titulo_pt": "Brasil lidera ranking de feminicídios na América Latina e Caribe", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287905, "titulo": "Tortured into confessing: Report exposes abusive Israeli interrogation of Palestinians", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/tortured-confessing-report-exposes-abusive-israeli-interrogation", "fonte_id": "middle_east_eye", "data_pub": "2026-11-25T19:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2021, a polícia israelense prendeu um homem palestiniano conhecido como R, que após várias sessões de tortura assinou um documento de confissão por um crime que não cometeu. Segundo um relatório do Public Committee Against Torture in Israel (PCATI), centenas de palestinos passaram por processos criminais com base em confissões extraídas sob coação.", "titulo_pt": "Forçado a confessar: relatório denuncia tortura na interrogatória de palestinos por parte da israelense", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 287681, "titulo": "Ministra Marín anuncia proyecto de ley para fortalecer la protección frente a la violencia sexual digital", "url": "https://www.latercera.com/nacional/noticia/ministra-marin-anuncia-proyecto-de-ley-para-fortalecer-la-proteccion-frente-a-la-violencia-sexual-digital/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T18:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra Marín anunciou um projeto de lei para fortalecer a proteção contra a violência sexual digital, incluindo penas mais severas para o compartilhamento não consentido de conteúdo íntimo. O ministério também lançou uma campanha para prevenir a violência de gênero.", "titulo_pt": "Ministra Marín anuncia projeto de lei para fortalecer proteção contra violência sexual digital", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 287120, "titulo": "Why did Israel arrest human rights defender Ghassan Al Najjar?", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/25/why-did-israel-arrest-human-rights-defender-ghassan-al-najjar?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agricultor palestino e defensor dos direitos humanos Ghassan Al Najjar foi detido pelas forças israelenses.", "titulo_pt": "Por que Israel deteve o defensor dos direitos humanos Ghassan Al Najjar?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 286664, "titulo": "Execuções, chibatadas, perseguição: Arábia Saudita redobra repressão a dissidentes", "url": "https://www.dw.com/pt-br/execuções-chibatadas-perseguição-arábia-saudita-redobra-repressão-a-dissidentes/a-80044727?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita intensificou a repressão a dissidentes em 2026, com mais de 200 execuções, aplicações de chibatadas e uma perseguição crescente contra vozes críticas. A situação dos direitos humanos no país se deteriorou, ocorrendo no contexto de conflitos no Irã.", "titulo_pt": "Execuções, chicotadas e perseguição: arábia Saudita intensifica repressão a dissidentes", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287292, "titulo": "PAHO calls for stronger health sector response to violence against women and girls", "url": "https://www.paho.org/en/news/25-11-2026-paho-calls-stronger-health-sector-response-violence-against-women-and-girls", "fonte_id": "paho", "data_pub": "2026-11-25T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO está pedindo uma resposta mais forte do setor de saúde para lidar com a violência contra mulheres e meninas. O chamado foi feito em 25 de novembro de 2026.", "titulo_pt": "PAHO solicita resposta mais forte do setor de saúde para violência contra mulheres e meninas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 287321, "titulo": "Three months on from Nepal's devastating floods, thousands of children face a new threat: winter", "url": "https://www.unicef.org/press-releases/three-months-nepals-devastating-floods-thousands-children-face-new-threat-winter", "fonte_id": "unicef", "data_pub": "2026-11-25T12:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três meses após as devastadoras inundações em Nepal, milhares de crianças enfrentam um novo risco: o inverno. O UNICEF pede apoio urgente para ajudar crianças e famílias a permanecerem quentes, saudáveis e seguras à medida que as temperaturas caem.", "titulo_pt": "Três meses após inundações devastadoras em Nepal, crianças enfrentam novo risco: inverno", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 288755, "fonte_id": "phys_org", "titulo": "Some miniature Cas12m proteins can cut DNA after all", "url": "https://phys.org/news/2026-11-miniature-cas12m function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      <div class="dmeta">

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {

    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';

      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
