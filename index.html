<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "09/11/2026 07:26", "stats": {"noticias_novas": 1158, "resumos_gerados": 259}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios políticos e econômicos, com destaque para a disputa pelo comando do Senado em 2027. Davi Alcolumbre, do União Brasil, busca se reeleger, enfrentando a divisão da direita entre Rogério Marinho e Tereza Cristina. O presidente Luiz Inácio Lula da Silva, do PT, reiterou seu compromisso com a responsabilidade fiscal, prometendo criar condições para a redução da dívida pública e a queda da taxa de juros. O novo Congresso, com maioria do PL na Câmara e no Senado, pode influenciar o futuro do presidencialismo, enquanto o governo Lula terá que lidar com atrasos em projetos bilionários de infraestrutura. Além disso, a Polícia Federal investiga ameaças contra a deputada Ana Elisa, eleita pelo PT, após denúncias de Flávio Bolsonaro.", "mundo": "Um inquérito foi aberto sobre o tiroteio em Cracóvia, na Polônia, que resultou em mortes e na morte do suspeito no hospital. Em outro incidente, um ataque aéreo com drones ucranianos causou um incêndio em uma refinaria de petróleo na Rússia. Na França, o primeiro-ministro Sébastien Lecornu reuniu representantes de sindicatos, empresários e estudantes durante protestos significativos. Na América do Sul, o Partido Socialista da Sérvia deixou o parlamento pela primeira vez, enquanto o ex-comandante militar Gadi Eisenkot foi nomeado para formar o próximo governo israelense após eleições inconclusivas. No Brasil, a pesquisa Quaest revelou que 62% dos brasileiros reprovam a viagem de Flávio Bolsonaro aos EUA, com 56% acreditando que ele viajou para fugir da Justiça. Além disso, a Conferência das Nações Unidas sobre Mudanças Climáticas (COP31) na Turquia enfrenta pressões devido à guerra e à inteligência artificial, enquanto o presidente dos EUA, Donald Trump, admite ter sido 'demasiado rígido' com imigrantes e nomeia seu arquiteto de política migratória como chefe de gabinete.\n\nA geopolítica global está em destaque com diversos eventos importantes. Um encontro planejado entre o presidente dos Estados Unidos, Donald Trump, e o presidente russo, Vladimir Putin, na China, para discutir questões como a 'denuclearização' e a guerra no Irã, é um ponto central. Além disso, o Irã propôs duas dias de negociações com os Estados Unidos, mediadas pelo Qatar, e essa proposta está sendo analisada. Na região balcânica, um empresário ucraniano venceu uma sentença judicial contra a Rússia em um tribunal civil ucraniano, embora a Rússia não reconheça esse tribunal. O conflito geopolítico também se reflete na Ásia, com a China estendendo a suspensão de tarifas adicionais de 24% sobre importações dos EUA, e no Oriente Médio, com o Egito reabrindo sua embaixada em Trípoli após 12 anos. Esses desenvolvimentos refletem a complexidade e a instabilidade da atual ordem mundial, marcada por tensões entre potências e crises regionais que podem ter implicações globais.", "economia": "A China prorrogou a suspensão de uma tarifa de 24% sobre produtos dos Estados Unidos por dois meses, conforme anunciado na segunda-feira, 9 de novembro. Este movimento ocorre no contexto de preocupações com a inflação, que serão monitoradas através do Índice de Preços ao Consumidor (CPI) na terça-feira e do Índice de Preços ao Produtor (PPI) na sexta-feira. O Dow Jones Futuro subiu no início da semana, mas as ações estenderam a sequência negativa por mais três dias devido às incertezas relacionadas à inteligência artificial. A economia filipina está se deteriorando devido à guerra no Irã e ao mau tempo, levantando dúvidas sobre a rota de aumento de taxas de juros da banca central e aumentando a pressão sobre o presidente Ferdinand Marcos Jr. A reeleição de Lula alterou as perspectivas para as ações de small caps, pressionadas por juros e risco fiscal, enquanto a CSN assinou um contrato para vender a CSN Cimentos ao grupo chinês Huaxin por R$ 12,7 bilhões. Além disso, uma trufa branca foi arrematada por R$ 613 mil em um leilão na Itália, e a Anthropic fechou um acordo de US$ 3,4 bilhões para comprar geradores a gás para data centers.", "tecnologia": "A China está testando a utilização de borracha de baixo polímero de butadieno raro em veículos elétricos e pneus pesados, com potencial de valorização superior à borracha sintética convencional. Paralelamente, empresas chinesas como MiniMax e Moonshot estão estabelecendo bases nos Estados Unidos, mas enfrentam desafios relacionados a salários, prestígio e tensões de segurança nacional. As ações globais estabilizaram após a queda causada pelo AI, com a Nvidia enfrentando investigações sobre supostas atividades de espionagem chinesa. A China também apresentou um cronograma para missões lunares tripuladas, com o primeiro pouso previsto antes de 2030. Em outro desenvolvimento, a Nvidia está desenvolvendo um aplicativo de idiomas que usa personagens de anime e inteligência artificial para ensinar japonês a jovens no exterior. Além disso, a indústria de ativos digitais se prepara para enfrentar ameaças quânticas, enquanto a computação heterogênea para inteligência artificial é alvo de investimentos de empresas como Nvidia e SK Telecom.", "ciencia": "A ciência avança em vários campos, destacando-se a pesquisa sobre a atividade interna de vulcões, que pode prever erupções futuras, e o desenvolvimento de um purificador de sangue inovador capaz de remover células tumorais, potencialmente combatendo o câncer. Em outro avanço, cientistas japoneses desenvolveram uma técnica que faz com que células cancerígenas produzam substâncias letais, explorando características únicas dessas células. Além disso, uma nova técnica de simulação clínica enfatiza a autonomia dos profissionais de enfermagem, enquanto pesquisas em radiocarbono revelam possíveis sinais de terremotos antigos no Japão. Na biologia, estudos sobre o DNA de chihuahuas e a inteligência animal mostram novos aspectos sobre a evolução e comportamento dos animais. Por fim, a NASA anunciou um desafio para estudantes: desenhar uma base lunar com prêmio de 1 milhão de dólares, incentivando a inovação tecnológica e espacial.", "cultura": "A cultura global está passando por uma transformação significativa, com jovens de diversos países se mobilizando em protestos contra o autoritarismo, refletindo uma nova onda política. No Brasil, eles se uniram online, compartilhando vídeos e memes, enquanto em outros locais realizaram ciclos transfronteiriços e ultramaratonas. Em 2027, a atriz Any Gabrielly estreará na série 'Habeas Corpus' da Netflix e, posteriormente, participará de novelas da Globo, após o lançamento de sua novela 'Paraíso Proibido' no Globoplay. No entanto, a indústria criativa enfrenta desafios significativos, com 27 profissionais consultados pela Creative Lives in Progress prevendo dificuldades para iniciantes, como a crescente tendência de contratações temporárias e a necessidade de se adaptar a novas tecnologias, como o ChatGPT, que está alterando a dinâmica de carreiras criativas. Além disso, a obra 'Two Women', de Jacqueline Rose, explora as conexões entre a autora e a filósofa judia alemã Edith Stein, enquanto o documentário 'Look at Me' revela o fascínio de Dustin Hoffman pela atuação ao longo de sua carreira, com 89 anos. Por fim, o U2, liderado por Bono, se prepara para shows no Brasil em março de 2027, com a nova música 'Silêncio' inspirada no Rio de Janeiro, e a região metropolitana de Delhi, na Índia, continua a ser um dos lugares mais poluídos do mundo, refletindo questões ambientais globais.", "sociedade": "Um psiquiatra foi morto em Seul, Coreia do Sul, há quase oito anos, o que levou à aprovação de uma lei que aumentou as penas para agressões a profissionais de saúde. No entanto, um ataque recente em um hospital da capital fez os médicos questionarem a segurança ainda insuficiente nos hospitais do país. Em outro evento notável, um traumatoologista tucumano e uma radiologista suíça deixaram seus empregos confortáveis na Europa para trabalhar no norte da Argentina. Eles enfrentaram desafios na adaptação, mas justificaram sua decisão pelo ambiente de trabalho em um país que ainda tem características do 'Far West'. Na questão da segurança, um entregador de comida foi morto em Melbourne, Austrália, e seu acusador, Roberto Urbano, de 51 anos, apareceu em uma audiência judicial por videoconferência, despir-se e expôs-se no tribunal. Na agricultura, a falta de jovens nas áreas rurais leva a uma perda de geração capaz de adotar tecnologias modernas, com apenas 63% da população nas zonas rurais utilizando internet. Além disso, a violência contra crianças aumentou em Malásia, Indonésia e Singapura, o que pode indicar progresso na conscientização e reporte de casos. Por fim, a política de ensino gratuito em escolas privadas de ensino médio na Coreia do Sul ainda enfrenta dificuldades financeiras para muitas famílias.", "meio_ambiente": "Clima: chuvas e temporais afetam várias regiões do Brasil nesta segunda-feira, com instabilidades atmosféricas impactando principalmente o Sul, Centro-Oeste e Sudeste. Oito estados e o Distrito Federal estão sob alerta amarelo para temporais. Paralelamente, líderes do COP31, um summit sobre clima, pediram que o mundo acelerasse as ações contra o aquecimento global, diante do aumento das temperaturas e dos desastres climáticos que ameaçam vidas e a economia mundial. A Bacia do Alto Paraguai perdeu milhões de hectares de vegetação em 40 anos, com 61% do bioma sofrendo avanço de queimadas entre 1985 e 2025. Além disso, a Turquia planeja zerar as emissões de carbono de um porto em Istambul até 2031, através da eletrificação de rebocadores, enquanto produtores de bananas na América Latina pedem melhores condições de pagamento para lidar com a redução na produção causada pelo clima extremo.", "direitos_humanos": "Três policiais franceses irão a julgamento em Paris a partir de segunda-feira, 9 de novembro, por terem agredido Michel Zecler, um produtor musical negro, em 2020, durante a pandemia de coronavírus. Este é um dos raros casos de violência policial que chegou ao tribunal, ocorrendo em um momento de tensões crescentes. Além disso, pelo menos oito migrantes morreram em um naufrágio de uma embarcação que virou perto de Creta, Grécia, enquanto cerca de 28 sobreviventes e um corpo, todos do Sudão, foram resgatados por outro barco. Em outro desenvolvimento, ativistas afirmam que a deportação de dois uigures para a China por parte da Tailândia colocaria suas vidas em grande risco, com um dos homens dizendo que seria 'como um escravo' se fosse devolvido. Por fim, a proposta do Departamento de Segurança Nacional dos Estados Unidos de cobrar 70.000 dólares por permissão de trabalho para estudantes estrangeiros também está em discussão, sem definição sobre quem pagaria, a quem afetaria e até quando as opiniões podem ser apresentadas."}, "resumo_do_dia": {"politica_nacional": [{"id": 251262, "titulo": "Vencedora de licitação para trens na Bahia foi condenada por cartel em contratos de metrô", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/vencedora-de-licitacao-para-trens-na-bahia-foi-condenada-por-cartel-em-contratos-de-metro.shtml" "folha_mercado", "data_pub": "2026-11-09T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NTS (Nova Transportadora do Sudeste), responsável pelos principais gasodutos do Rio de Janeiro, São Paulo e Minas Gerais, ameaça ir à Justiça contra a ANP (Agência Nacional do Petróleo, Gás Natural e Biocombustíveis) para reverter o processo de revisão tarifária. A empresa está preocupada com possíveis ameaças de judicialização e cortes de investimentos.", "titulo_pt": "Nts ameaça judicializar processo de revisão tarifária de gasodutos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 251535, "titulo": "ESG ao longo do tempo: marcos e transformações", "url": "https://www.jota.info/opiniao-e-analise/colunas/praticas-esg/esg-ao-longo-do-tempo-marcos-e-transformacoes", "fonte_id": "jota", "data_pub": "2026-11-09T06:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os marcos do ESG em 2016 e 2026 mostram avanços na padronização, mas também indicam recuos regulatórios e desafios políticos.", "titulo_pt": "ESG ao longo do tempo: marcos e transformações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 252242, "titulo": "(URGENT) Stocks extend losing streak to 3rd consecutive session on AI uncertainties", "url": "https://en.yna.co.kr/view/AEN20261109006300320", "fonte_id": "yonhap_news", "data_pub": "2026-11-09T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações estendem a sequência negativa por terceiro dia consecutivo devido às incertezas relacionadas à inteligência artificial.", "titulo_pt": "Ações estendem perdas por terceiro dia consecutivo devido a incertezas sobre a inteligência artificial", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 252084, "titulo": "Airlines bet that more premium offerings will boost profits", "url": "https://www.japantimes.co.jp/business/2026/11/09/companies/airlines-premium-profits/", "fonte_id": "japan_times", "data_pub": "2026-11-09T06:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As companhias aéreas estão apostando em oferecimentos premium para aumentar os lucros, e isso deve acelerar a redução da participação da classe econômica em muitos voos.", "titulo_pt": "Companhias aéreas apostam em ofertas premium para aumentar lucros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 251536, "titulo": "CBS de 11,3%: as premissas do cálculo e os limites da alíquota de referência", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-da-abdf/cbs-de-113-as-premissas-do-calculo-e-os-limites-da-aliquota-de-referencia", "fonte_id": "jota", "data_pub": "2026-11-09T06:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cálculo do TCU (Tribunal de Contas da União) orienta as projeções para 2027, mas tem levantado discussões metodológicas. Este cálculo é usado para estimar as premissas do cálculo da alíquota de referência, mas enfrenta críticas em termos de metodologia.", "titulo_pt": "CBS de 11,3%: as premissas do cálculo e os limites da alíquota de referência", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 252087, "titulo": "Mitsui Chemicals to take over chip linchpin JSR for $12 billion", "url": "https://www.japantimes.co.jp/business/2026/11/09/companies/mitsui-chemicals-jsr-takeover/", "fonte_id": "japan_times", "data_pub": "2026-11-09T06:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mitsui Chemicals está adquirindo a JSR, uma empresa-chave no setor de materiais para chips, por 12 bilhões de dólares. O acordo visa consolidar a indústria de materiais semicondutores fragmentada no Japão, conforme apoiado pelo governo.", "titulo_pt": "Mitsui Chemicals adquirirá JSR por 12 bilhões de dólares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 251537, "titulo": "Tema 1.484: quanto custa ao credor aplicar o IPCA mais 2% antes do requisitório", "url": "https://www.jota.info/opiniao-e-analise/artigos/tema-1-484-quanto-custa-ao-credor-aplicar-o-ipca-mais-2-antes-do-requisitorio", "fonte_id": "jota", "data_pub": "2026-11-09T05:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tema 1.484 discute a diferença entre aplicar o IPCA mais 2% antes do requisitório e o IPCA, resultando em uma diferença de R$ 6.922 para cada R$ 100 mil de condenação nos últimos 12 meses.", "titulo_pt": "Tema 1.484: qual a diferença na aplicação do IPCA mais 2% antes do requisitório", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 251539, "titulo": "Meta fiscal estrutural e segurança jurídica tributária", "url": "https://www.jota.info/coberturas-especiais/jurisprudente/meta-fiscal-estrutural-e-seguranca-juridica-tributaria", "fonte_id": "jota", "data_pub": "2026-11-09T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Substituir o resultado convencional pelo estrutural como meta da Lei Complementar 200 tornaria a regra menos pró-cíclica. Este ajuste afetaria como a economia é fiscalmente gerenciada durante ciclos econômicos.", "titulo_pt": "Meta fiscal estrutural e segurança jurídica tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 252010, "titulo": "The great British sell-off", "url": "https://www.ft.com/content/805f0c1d-795b-4ee0-8fbd-e08ab1be1193?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas avaliadas em quinhentos bilhões de libras foram adquiridas por compradores estrangeiros nos últimos dez anos.", "titulo_pt": "A grande venda britânica", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 252014, "titulo": "EU sues IBM and partners over troubled border system", "url": "https://www.ft.com/content/eacea609-d571-4725-b795-a1afd5c3c301?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia processou a IBM e parceiros em Estonia devido a atrasos repetidos no desenvolvimento do sistema de entrada/saída de fronteiras.", "titulo_pt": "Ue processa IBM e parceiros por atrasos no sistema de fronteiras", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 252015, "titulo": "BA parent says onerous green charges will ‘kill’ Europe’s aviation industry", "url": "https://www.ft.com/content/4330a15b-f91d-4095-909f-92617b9caf1e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luis Gallego, pai de uma empresa aérea, afirma que as taxas ambientais planejadas, mais onerosas para as companhias aéreas do Reino Unido, aumentarão os preços dos voos e prejudicarão o setor. Gallego acredita que essas taxas poderão 'matar' o setor de aviação na Europa.", "titulo_pt": "Pai de empresa aérea diz que taxas ambientais 'matarão' indústria de aviação europeia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 252017, "titulo": "ECB contender Klaas Knot ‘won’t hesitate’ to act in a debt crisis", "url": "https://www.ft.com/content/4dfbc7b0-1add-4bc3-ab5e-78c18b2ca87a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Klaas Knot, um candidato ao cargo de presidente do Banco Central Europeu, afirmou que não hesitará em tomar ações em caso de crise de dívida. Ele também disse estar disposto a criar novas ferramentas para combater crises se necessário.", "titulo_pt": "Candidato ao bce, Klaas Knot promete agir em caso de crise de dívida", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 251540, "titulo": "Restrições do CMN à compra de sentenças arbitrais por FIDCs premia quem perdeu", "url": "https://www.jota.info/opiniao-e-analise/artigos/restricoes-do-cmn-a-compra-de-sentencas-arbitrais-por-fidcs-premia-quem-perdeu", "fonte_id": "jota", "data_pub": "2026-11-09T04:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A norma do CMN que condiciona a venda do crédito ao fim da anulatória concede ao devedor uma vantagem que a lei anteriormente não lhe concedia. Essa mudança premia os que perderam na arbitragem ao lhes proporcionar uma saída financeira.", "titulo_pt": "Restrições do CMN à compra de sentenças arbitrais por FIDCs beneficiam os que perderam", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 252191, "titulo": "China eyes new grip on EV sector with high-performance rare-earth rubber", "url": "https://www.scmp.com/news/china/science/article/3373791/china-eyes-new-grip-ev-sector-high-performance-rare-earth-rubber", "fonte_id": "scmp", "data_pub": "2026-11-09T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está testando o uso comercial de borracha de baixo polímero de butadieno raro em veículos elétricos (VE) e pneus pesados, com preços indicando que ela pode valer mais do que a borracha sintética convencional. Os dados do mercado mostram que a borracha ND9106 custa 22.500 yuan por tonelada, enquanto a BR9000 convencional custa 16.660 yuan por tonelada.", "titulo_pt": "China testa novo controle no setor de ve com borracha de baixo polímero de butadieno raro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 252227, "titulo": "(2nd LD) Nvidia, SKT, Rebellions to jointly establish heterogeneous computing system for AI", "url": "https://en.yna.co.kr/view/AEN20261109005452320", "fonte_id": "yonhap_news", "data_pub": "2026-11-09T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia Corp., SK Telecom Co. e outras empresas locais planejam criar um sistema de computação heterogênea para inteligência artificial.", "titulo_pt": "Nvidia, sk telecom e outras empresas locais planejam criar sistema de computação heterogênea para IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 251678, "titulo": "Sorpresa en una feria gigantesca: la IA, los robots y su impacto no son un cuento chino", "url": "https://www.lanacion.com.ar/economia/campo/sorpresa-en-una-feria-gigantesca-la-ia-los-robots-y-su-impacto-no-son-un-cuento-chino-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "China alcançou avanços tecnológicos que podem beneficiar a Argentina. O país também encontra oportunidades de negócios no mercado chinês.", "titulo_pt": "Surpresa em feira gigantesca: IA, robôs e seu impacto não são chineses", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 252009, "titulo": "Global stocks steady after AI rout", "url": "https://www.ft.com/content/b8644327-86e7-4d1c-a71f-3fb1d552723b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações globais estabilizaram após a queda causada pelo AI. As baixas da semana passada levaram muitos índices a entrar na zona de bear market.", "titulo_pt": "Ações globais se estabilizam após queda motivada por AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 252008, "titulo": "Nvidia shares slide as it probes alleged Chinese spy scandal", "url": "https://www.ft.com/content/fa3b0a35-1aa9-4f31-97b4-e4c599e3e654?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-09T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está investigando um suposto escândalo de espionagem chinesa. O conselho da empresa iniciou uma investigação após o CEO Jensen Huang admitir um caso amoroso.", "titulo_pt": "Ações da nvidia caem após investigação sobre suposto escândalo de espionagem chinesa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 252070, "titulo": "Environmental groups embrace AI, even as they warn of data center impacts", "url": "https://www.japantimes.co.jp/environment/2026/11/09/environmental-groups-ai-data-centers/", "fonte_id": "japan_times", "data_pub": "2026-11-09T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações ambientalistas estão adotando a inteligência artificial, mesmo alertando sobre os impactos das centrais de dados. Essa contradição está forçando essas organizações a justificar o uso da IA em suas missões para combater o aquecimento global ou proteger os recursos naturais.", "titulo_pt": "Organizações ambientalistas abraçam AI, mas alertam sobre impactos das centrais de dados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 251845, "titulo": "Chinese AI firms want Silicon Valley’s top minds. Poaching them won’t be easy", "url": "https://restofworld.org/2026/chinese-ai-labs-hire-silicon-valley-engineers-openai-anthropic/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-11-09T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Startups chinesas como MiniMax e Moonshot estão estabelecendo bases nos Estados Unidos, mas as grandes diferenças salariais, menor prestígio e tensões de segurança nacional dificultam a atração de talentos das empresas como OpenAI e Anthropic.", "titulo_pt": "Empresas chinesas querem mentes de ponta da Valley americana. Atraí-las será difícil.", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 252169, "titulo": "[WDAF 2026] Lawmakers call for clearer crypto rules, tax reforms", "url": "https://www.koreaherald.com/article/10931104", "fonte_id": "korea_herald", "data_pub": "2026-11-09T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Parlamentares sul-coreanos estão pedindo por regras mais claras para empresas de ativos digitais e reformas fiscais para investidores. Durante o World Digital Assets Forum em Seul, um legislador propôs uma lei que forneceria um alicerce para instituições financeiras e empresas de ativos digitais expandirem na Ásia.", "titulo_pt": "Parlamentares pedem regras claras e reformas fiscais para ativos digitais em conferência", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 252077, "titulo": "Government betting on language app powered by anime and AI", "url": "https://www.japantimes.co.jp/news/2026/11/09/japan/media/mofa-japanese-app/", "fonte_id": "japan_times", "data_pub": "2026-11-09T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo está desenvolvendo uma aplicativo de idiomas que usa personagens de anime e inteligência artificial para permitir conversas em japonês com jovens no exterior. O aplicativo visa auxiliar na aprendizagem do japonês por meio de interações com personagens populares de anime.", "titulo_pt": "Governo aposta em aplicativo de idiomas alimentado por anime e IA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 252232, "titulo": "Samsung hosts Hyundai Motor Group executives for large-scale networking event", "url": "https://en.yna.co.kr/view/AEN20261109009000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-09T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung realizou um evento de networking em grande escala com executivos da Hyundai Motor Group. O evento ocorreu em Seul no dia 9 de novembro.", "titulo_pt": "Samsung anfitriã de executivos da Hyundai Motor Group em grande evento de networking", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 252170, "titulo": "[WDAF 2026] Digital asset industry must prepare for quantum threats: DFNS", "url": "https://www.koreaherald.com/article/10931097", "fonte_id": "korea_herald", "data_pub": "2026-11-09T08:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rápido avanço da computação quântica e da inteligência artificial representa uma ameaça à segurança dos sistemas criptográficos, alertou um especialista em custódia de ativos digitais. Durante o World Digital Assets Forum, Felix Eigelshoven, diretor gerente e chefe da Ásia-Pacífico da DFNS, discursou sobre os perigos quânticos para os ativos digitais, questionando a segurança desses ativos no futuro.", "titulo_pt": "Indústria de ativos digitais deve se preparar para ameaças quânticas: especialista", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 252171, "titulo": "[WDAF 2026] WDAF 2026 draws 1,000 as digital assets reshape finance", "url": "https://www.koreaherald.com/article/10931095", "fonte_id": "korea_herald", "data_pub": "2026-11-09T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro Fórum Mundial de Ativos Digitais 2026, organizado pelo Grupo Herald Media, reuniu cerca de 1.000 participantes em Seul, trazendo juntos líderes financeiros globais para discutir a nova arquitetura financeira. O evento abordou temas relacionados ao impacto dos ativos digitais na estrutura financeira global.", "titulo_pt": "WDAF 2026 reúne 1.000 participantes para discutir a nova arquitetura financeira", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 252248, "titulo": "Bikers and Bug-Lovers Join Forces to Fight a New Google Data Center", "url": "https://www.wired.com/story/bug-activists-and-biker-gang-members-are-teaming-up-to-protest-data-centers/", "fonte_id": "wired", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Campanhas contra data centers se espalham pela Europa, enquanto uma aliança não convencional de ativistas tenta impedir a construção de uma nova instalação gigante da Google, localizada a leste de Londres.", "titulo_pt": "Motoqueiros e amantes de insetos unem-se para frear novo Data Center da Google", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 252239, "titulo": "(LEAD) Stocks close lower as investors search for directions amid AI sector uncertainties", "url": "https://en.yna.co.kr/view/AEN20261109006151320", "fonte_id": "yonhap_news", "data_pub": "2026-11-09T07:03:00Z", "idioma": "en", "provavel_duplicata_de": 252164, "texto_pt": "As ações sul-coreanas fecharam em baixa na segunda-feira, enquanto investidores avaliavam incertezas no setor de inteligência artificial.", "titulo_pt": "Ações sul-coreanas fecham em baixa diante de incertezas no setor de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 252204, "titulo": "Can DeepSeek challenge OpenAI, Anthropic in AI agents as Harness adoption takes off?", "url": "https://www.scmp.com/tech/big-tech/article/3373757/can-deepseek-challenge-openai-anthropic-ai-agents-harness-adoption-takes", "fonte_id": "scmp", "data_pub": "2026-11-09T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma DeepSeek lançou seu framework de agente de inteligência artificial, chamado Harness, há menos de três meses e já conta com 1,54 milhão de usuários ativos diariamente. Os usuários estão consumindo cerca de 92 trilhões de tokens por dia, equivalente a aproximadamente 1,1 bilhão de tokens.", "titulo_pt": "DeepSeek pode desafiar OpenAI e Anthropic em agentes de IA com crescimento rápido de Harness", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 252249, "titulo": "Welcome to Weed Island", "url": "https://www.wired.com/story/welcome-to-weed-island-jersey/", "fonte_id": "wired", "data_pub": "2026-11-09T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jersey, uma pequena ilha britânica com governo autônomo, se tornou acidentalmente a vanguarda europeia da indústria multibilionária do cannabis global.", "titulo_pt": "Bem-vindo à ilha do cannabis", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 252276, "titulo": "Crystals hint at a volcano's ability to erupt", "url": "https://phys.org/news/2026-11-crystals-hint-volcano-ability-erupt.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Queensland demonstraram que cristais pequenos podem fornecer informações sobre a atividade interna dos vulcões e possivelmente indicar quando eles podem erupcionar.", "titulo_pt": "Crystais indicam a capacidade de erupção de um vulcão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 252270, "titulo": "Opinion: STAT+: CVS’ split doesn’t fix its fundamental problem", "url": "https://www.statnews.com/2026/11/09/cvs-health-split-pbm-conflict-examined-anthony-loiacono-judi-health/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A divisão da CVS em duas empresas não resolve seu problema fundamental, de acordo com o CEO da A.J. Health, Judi Loiacono.", "titulo_pt": "Divisão da CVS não resolve seu problema fundamental, afirma ceo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 252271, "titulo": "Liver experts finally agree on what acute-on-chronic liver failure is", "url": "https://www.statnews.com/2026/11/09/acute-on-chronic-liver-failure-new-definition/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos em fígado finalmente concordaram sobre a definição de falência hepática aguda crônica. Pacientes sofrem com uma condição para a qual não há um entendimento uniforme.", "titulo_pt": "Peritos em fígado finalmente se entendem sobre falência hepática aguda crônica", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 252272, "titulo": "STAT+: Democrats begin asking: How far can we go on health care?", "url": "https://www.statnews.com/2026/11/09/democrat-healthcare-agenda-new-lawmakers-weigh-popular-vs-possible/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos democratas estão pressionando para que os legisladores democratizantes adotem reformas significativas no sistema de saúde, mas seus sonhos podem colidir com a realidade política.", "titulo_pt": "Democratas começam a perguntar: até onde podemos ir com a saúde?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 252273, "titulo": "AI chatbots aren’t therapists. But can they finally get men to open up?", "url": "https://www.statnews.com/2026/11/09/ai-chatbots-can-overcome-mental-health-barriers-in-men/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-09T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os chatbots baseados em inteligência artificial não são terapeutas perfeitos, mas podem eventualmente incentivar os homens a se abrirem mais.", "titulo_pt": "Os chatbots de IA não são terapeutas, mas podem finalmente fazer os homens se abrirem?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 251698, "titulo": "La prometedora terapia de investigadores chilenos para reparar el cartílago tras una lesión", "url": "https://www.latercera.com/tendencias/noticia/la-prometedora-terapia-de-investigadores-chilenos-para-reparar-el-cartilago-tras-una-lesion/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores chilenos exploraram a possibilidade de usar células-mãe para reparar o cartilágem danificado no tornozelo e acelerar a recuperação dos pacientes. Os resultados do estudo são apresentados.", "titulo_pt": "Terapia com células-mãe promete reparar cartilágem danificado no tornozelo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 251702, "titulo": "Estudio revela qué pasa en los cerebros de los niños que comen muchos alimentos ultraprocesados", "url": "https://www.latercera.com/tendencias/noticia/estudio-revela-que-pasa-en-los-cerebros-de-los-ninos-que-comen-muchos-alimentos-ultraprocesados/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A pesquisa foi liderada por cientistas da Faculdade de Medicina Keck da Universidade do Sur de California, que analisaram imagens por ressonância magnética, informações sobre a dieta e dados sobre a composição corporal dos participantes.", "titulo_pt": "Estudo revela o que acontece nos cérebros de crianças que consumem muitos alimentos ultraprocessados", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 251352, "titulo": "Contaminação por mercúrio atingiu mais áreas ocupadas pelos maias", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/contaminacao-por-mercurio-atingiu-mais-areas-ocupadas-pelos-maias.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A contaminação por mercúrio afetou áreas ocupadas pelos maias, que usavam o cinábrio, um mineral vermelho com alto teor de mercúrio, em rituais e cerimônias, sem saber da sua toxicidade.", "titulo_pt": "Contaminação por mercúrio atingiu áreas maias", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 252201, "titulo": "Chinese ‘black-hole’ purifier catches tumour cells in blood to stop cancer spread", "url": "https://www.scmp.com/news/china/science/article/3373756/chinese-black-hole-purifier-catches-tumour-cells-blood-stop-cancer-spread", "fonte_id": "scmp", "data_pub": "2026-11-09T07:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses desenvolveram um purificador inovador capaz de remover células tumorais que circulam no sangue, potencialmente prevenindo a recorrência e a disseminação de alguns cânceres. O dispositivo, liderado pela Universidade Jiao Tong de Shanghai, foi testado com sucesso em modelos de câncer de mama em animais.", "titulo_pt": "Purificador chinês de 'buraco negro' remove células tumorais do sangue para prevenir a disseminação do câncer", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 251504, "titulo": "Cientistas fazem células cancerígenas produzirem o próprio 'veneno'", "url": "https://exame.com/ciencia/cientistas-fazem-celulas-cancerigenas-produzirem-o-proprio-veneno/", "fonte_id": "exame", "data_pub": "2026-11-09T06:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas japoneses desenvolveram uma técnica que faz células cancerígenas produzirem substâncias que as matam. Este método explora uma característica das células tumorais para criar uma nova forma de combater o câncer.", "titulo_pt": "Cientistas fazem células cancerígenas produzirem o próprio 'veneno'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 251509, "titulo": "Cientistas prendem antimatéria por meses para investigar mistério do Universo", "url": "https://exame.com/ciencia/cientistas-prendem-antimateria-por-meses-para-investigar-misterio-do-universo/", "fonte_id": "exame", "data_pub": "2026-11-09T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas congelaram antimatéria por meses para realizar medições mais precisas e investigar o predomínio da matéria no universo.", "titulo_pt": "Cientistas prendem antimatéria por meses para investigar mistério do Universo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 252322, "titulo": "APOD: 2026 November 9 – Rigel and the Witch Head Nebula", "url": "https://science.nasa.gov/image-article/apod-2026-november-9-rigel-and-the-witch-head-nebula/", "fonte_id": "nasa_news", "data_pub": "2026-11-09T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 9 de novembro de 2026 apresenta Rigel e a Névoa da Bruxa. Este é um registro astronômico que combina duas estruturas celestes notáveis.", "titulo_pt": "APOD: 9 de novembro de 2026 – Rigel e a névoa da bruxa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 252277, "titulo": "Despite sacrificing people after catastrophic El Niño flooding, ancient societies were generally peaceful", "url": "https://phys.org/news/2026-11-sacrificing-people-catastrophic-el-nio.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos estudaram as reações sociais a eventos climáticos extremos no passado, como a sacrifício ritual humano associado a inundações catastróficas causadas pelo El Niño. No entanto, uma nova pesquisa no Vale do Lambayeque sugere que a violência foi extremamente rara, mesmo durante períodos de instabilidade ecológica.", "titulo_pt": "Embora tenham praticado sacrifícios humanos após inundações catastróficas do El Niño, sociedades antigas geralmente foram pacíficas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 252323, "titulo": "Ozone Hole Reaches Its 2026 Maximum", "url": "https://science.nasa.gov/earth/earth-observatory/ozone-hole-reaches-its-2026-maximum/", "fonte_id": "nasa_news", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O buraco de ozônio atingiu o sétimo maior tamanho em 48 anos de monitoramento, mas não foi tão profundo quanto outros buracos grandes registrados.", "titulo_pt": "Buraco de ozônio atinge seu máximo de 2026 como o sétimo maior em 48 anos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 251353, "titulo": "Por que o corpo humano pode estar esfriando", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/por-que-o-corpo-humano-pode-estar-esfriando.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-09T02:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na década de 1860, o médico alemão Carl Wunderlich se deparou com a questão de se a febre seria uma doença em si ou apenas um sintoma de uma enfermidade subjacente.", "titulo_pt": "Por que o corpo humano pode estar esfriando", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 252278, "titulo": "A new clinical simulation model strengthens the empowerment and autonomy of nursing staff", "url": "https://phys.org/news/2026-11-clinical-simulation-empowerment-autonomy-nursing.html", "fonte_id": "phys_org", "data_pub": "2026-11-09T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O modelo de simulação clínica recentemente desenvolvido enfatiza a autonomia e o poder de decisão dos profissionais de enfermagem, além de avaliar habilidades técnicas e conformidade com os padrões médicos. Este novo método aborda aspectos importantes da prática de enfermagem que anteriormente foram negligenciados, como ética do cuidado, presença relacional com os pacientes e gestão emocional.", "titulo_pt": "Novo modelo de simulação clínica fortalece a autonomia e o poder de decisão dos profissionais de enfermagem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 252069, "titulo": "‘Burning’: life under the world’s dirtiest skies", "url": "https://www.japantimes.co.jp/news/2026/11/09/asia-pacific/science-health/india-dirtiest-skies-air-pollution/", "fonte_id": "japan_times", "data_pub": "2026-11-09T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Loni, uma das cinco áreas da região metropolitana de Delhi, figura entre as áreas mais poluídas do mundo em uma lista anual publicada por uma empresa de monitoramento suíça chamada IQAir.", "titulo_pt": "‘Queimando’: vida sob os vales mais poluídos do mundo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 251311, "titulo": "Destaque de série da Netflix, Any Gabrielly vai estrear nas novelas da Globo em 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/destaque-de-serie-da-netflix-any-gabrielly-vai-estrear-nas-novelas-da-globo-em-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz e cantora Any Gabrielly, uma das protagonistas da série 'Habeas Corpus' na Netflix, vai estrear em novelas da Globo em 2027. Ela participa do elenco da novela 'Paraíso Proibido', que será lançada no Globoplay no segundo semestre do ano seguinte.", "titulo_pt": "Any Gabrielly estreia em novelas da Globo em 2027", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 252356, "titulo": "Two Women by Jacqueline Rose review – a memorial to Gillian Rose", "url": "https://www.theguardian.com/books/2026/nov/09/two-women-by-jacqueline-rose-review-a-memorial-to-gillian-rose", "fonte_id": "guardian_culture", "data_pub": "2026-11-09T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Two Women, de Jacqueline Rose, é uma biografia fictícia que explora as conexões entre a autora e a filósofa judia alemã Edith Stein. A obra combina elementos biográficos e autobiográficos com análise psicanalítica e temas políticos.", "titulo_pt": "Dois homens: uma memória em homenagem a Gillian Rose", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 252074, "titulo": "China’s hard power keeps undermining its soft power", "url": "https://www.japantimes.co.jp/commentary/2026/11/09/japan/chinas-hard-power-undermines-soft-power/", "fonte_id": "japan_times", "data_pub": "2026-11-09T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China possui efetivamente poder macio, mas seu comportamento frequentemente o desacredita.", "titulo_pt": "Poder macio chinês se contradiz
