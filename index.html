úblico: a melhor homenagem é aprimorar a gestão de pessoas", "url": "https://www.jota.info/opiniao-e-analise/artigos/dia-do-servidor-publico-a-melhor-homenagem-e-aprimorar-a-gestao-de-pessoas", "fonte_id": "jota", "data_pub": "2026-10-28T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal, estados e municípios comemoram o servidor público ao assegurar as condições necessárias para o bom desempenho do serviço público.", "titulo_pt": "Dia do Servidor Público: a melhor homenagem é aprimorar a gestão de pessoas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 231762, "titulo": "A US woman feared dead was reported alive in Mexico. But police now say that isn’t true", "url": "https://www.theguardian.com/us-news/2026/oct/28/shayna-feinman-missing-arizona-woman-mexico", "fonte_id": "guardian_world", "data_pub": "2026-10-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia mexicana havia anunciado que encontrou Shayna Feinman em Tijuana, o que aumentou as esperanças da família da mulher, que havia desaparecido em 2024. No entanto, autoridades arizonenses afirmam que os mexicanos estavam equivocados e que a informação não é verdadeira, causando confusão e tristeza para a irmã de Feinman.", "titulo_pt": "Mulher americana declarada morta foi encontrada viva no México, mas agora a informação foi rejeitada", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 230671, "titulo": "“Senhores e escravas”: PCERJ investiga rede de escravidão sexual de menores", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/senhores-e-escravas-pcerj-investiga-rede-de-escravidao-sexual-de-menores", "fonte_id": "metropoles", "data_pub": "2026-10-28T09:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil do Estado do Rio de Janeiro (PCERJ) investiga uma rede de escravidão sexual envolvendo menores. A operação foi deflagrada nesta quarta-feira e os suspeitos produziam vídeos de abusos que eram usados para ameaçar as vítimas.", "titulo_pt": "Senhores e escravas: PCERJ desbarata rede de escravidão sexual de menores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 230679, "titulo": "Metrópoles Talks aborda a conexão entre saneamento e desenvolvimento social", "url": "https://www.metropoles.com/conteudo-especial/metropoles-talks-saneamento", "fonte_id": "metropoles", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encontro discute como saneamento, arte, esporte, educação e lazer podem contribuir para transformar territórios e expandir oportunidades.", "titulo_pt": "Metrópoles Talks explora a conexão entre saneamento e desenvolvimento social", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 230730, "titulo": "Teca Pereira diz que pensou em desistir da carreira: “A etnia sofria”", "url": "https://www.cnnbrasil.com.br/pop/cinema/teca-pereira-diz-que-pensou-em-desistir-da-carreira-a-etnia-sofria/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz Teca Pereira, conhecida por seu papel em 'Feito Pipa', relatou em entrevista à CNN Brasil ter pensado em desistir da carreira devido à falta de representatividade. Ela celebrou as mudanças recentes na indústria audiovisual que visam melhorar a diversidade etnica no setor.", "titulo_pt": "Teca Pereira diz ter pensado em desistir da carreira por falta de representatividade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 230995, "titulo": "Why is the system failing France’s younger generation?", "url": "https://www.aljazeera.com/video/money-works/2026/10/28/why-is-the-system-failing-frances-younger-generation?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T08:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A juventude francesa está em rebelião. O motivo das manifestações não é detalhado no trecho fornecido.", "titulo_pt": "Por que o sistema falha com a juventude francesa?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 230740, "titulo": "Vendas de flores devem crescer 5,2% no dia de Finados", "url": "https://www.cnnbrasil.com.br/agro/vendas-de-flores-devem-crescer-52-no-dia-de-finados/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas de flores devem aumentar 5,2% no dia de Finados, representando 8% do comércio anual. Crisântemos, orquídeas e rosas são as espécies mais procuradas neste dia.", "titulo_pt": "Vendas de flores devem crescer 5,2% no dia de Finados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 230683, "titulo": "\"Merecemos viver com dignidade\", diz mulher que superou 2 cânceres de mama", "url": "https://www.metropoles.com/distrito-federal/merecemos-viver-com-dignidade-diz-mulher-que-superou-2-canceres-de-mama", "fonte_id": "metropoles", "data_pub": "2026-10-28T07:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fátima, mãe de dois filhos, relata ter superado dois cânceres de mama e vê a cura como uma nova oportunidade. Ela agradece à rede de apoio, à perseverança e ao diagnóstico precoce.", "titulo_pt": "Nós merecemos viver com dignidade", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 231502, "titulo": "Brasil perdeu 45% da vegetação e ‘fragmentou’ florestas nos últimos 38 anos", "url": "https://www.cnnbrasil.com.br/nacional/brasil/brasil-perdeu-45-da-vegetacao-e-fragmentou-florestas-nos-ultimos-38-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T01:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo realizado pelo MapBiomas indica que o Brasil perdeu 45% de sua vegetação e fragmentou florestas nos últimos 38 anos, com redução no tamanho médio das áreas conservadas e avanço do desmembramento do território por lavouras e urbanização. O relatório foi divulgado durante a COP17 da Biodiversidade.", "titulo_pt": "Brasil perdeu 45% da vegetação e 'fragmentou' florestas nos últimos 38 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231595, "titulo": "Los Ángeles pone fin a la producción de petroleo después de más de una década de lucha", "url": "https://www.clarin.com/estados-unidos/los-angeles-pone-fin-a-la-produccion-de-petroleo-despues-de-mas-de-una-decada-de-lucha_0_EiGuHw3rAI.html", "fonte_id": "clarin", "data_pub": "2026-10-29T01:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O conselho municipal de Los Angeles votou unânimemente para proibir a extração de petróleo, afetando mais de 1.800 poços ativos e inativos. A medida visa proteger a saúde pública e alcançar a neutralidade de carbono para 2035, após anos de pressão comunitária.", "titulo_pt": "Los angeles encerra produção de petróleo após década de luta", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 232142, "titulo": "Advocates call for protecting grassland for owls in Shalun science park project", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/29/2003866820", "fonte_id": "taipei_times", "data_pub": "2026-10-29T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados estão pedindo a proteção de pastos para abrigar búfalos-pé-de-galinha no projeto de parque científico Shalun. O objetivo é garantir um habitat adequado para essas aves.", "titulo_pt": "Advogados pleiteiam proteção de pastos para búfalos-pé-de-galinha no projeto do parque científico Shalun", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 231765, "titulo": "Menindee Lakes water levels drop to lowest in five years as experts warn of mass fish deaths", "url": "https://www.theguardian.com/australia-news/2026/oct/28/menindee-lakes-water-levels-drop-mass-fish-death-fears", "fonte_id": "guardian_world", "data_pub": "2026-10-28T23:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os níveis d'água nos Lagos Menindee, na Austrália Ocidental, atingiram o nível mais baixo em cinco anos, levando o governo do estado a implementar restrições de uso d'água. Especialistas alertam para o risco potencial de mortes em massa de peixes durante o verão.", "titulo_pt": "Níveis de água nos lagos menindee caem a nível mais baixo em cinco anos, com alerta de mortes em massa de peixes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 231807, "titulo": "Bangladesh Measles Outbreak Is a ‘Warning Sign’", "url": "https://foreignpolicy.com/2026/10/28/bangladesh-measles-outbreak-vaccination-crisis-health/", "fonte_id": "foreign_policy", "data_pub": "2026-10-28T22:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório de especialistas alerta sobre a crise vacinal no Bangladesh. O surto de sarampo no país é considerado um sinal de advertência.", "titulo_pt": "Surto de sarampo no bangladesh é um 'sinal de advertência'", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 232417, "titulo": "UK budget 2026: Key climate and energy announcements", "url": "https://www.carbonbrief.org/uk-budget-2026-key-climate-and-energy-announcements", "fonte_id": "carbon_brief", "data_pub": "2026-10-28T18:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Chancellor John Healey anunciou uma 'nova direção no energy' para o Reino Unido, com foco em manter as contas baixas diante dos desafios atuais. O orçamento de 2026 inclui importantes declarações sobre clima e energia.", "titulo_pt": "Orçamento do reino unido de 2026: anúncios-chave sobre clima e energia", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 231771, "titulo": "Second fatal train collision this year casts doubt over Spain’s high-speed rail network", "url": "https://www.theguardian.com/world/2026/oct/28/analysis-fatal-collision-doubt-over-spain-high-speed-rail", "fonte_id": "guardian_world", "data_pub": "2026-10-28T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve um segundo acidente fatal de trem na Espanha este ano, levantando dúvidas sobre a segurança do seu extenso sistema de trem de alta velocidade, o mais amplo da Europa e o segundo maior do mundo após a China. No incidente, ocorrido em Toledo, pelo menos 68 pessoas morreram quando um trem de alta velocidade colidiu com outro que estava parado nas trilhas, resultando na deriva de vários vagões.", "titulo_pt": "Segundo acidente fatal de trem neste ano abala segurança da malha ferroviária de alta velocidade da Espanha", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 231588, "titulo": "Cientistas pedem que crise climática seja declarada emergência de saúde global", "url": "https://www.dw.com/pt-br/cientistas-pedem-que-crise-climática-seja-declarada-emergência-de-saúde-global/a-79785180?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-28T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo mostra que mortes por calor, secas e insegurança alimentar estão aumentando mais rápido do que há uma década. Cientistas de 30 países estão pedindo uma ação coordenada em relação à crise climática.", "titulo_pt": "Cientistas pedem que crise climática seja declarada emergência de saúde global", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 231972, "titulo": "Trump rolls back methane rules for US oil and gas industry", "url": "https://www.euronews.com/2026/10/28/trump-rolls-back-methane-rules-for-us-oil-and-gas-industry", "fonte_id": "euronews", "data_pub": "2026-10-28T13:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump está buscando reduzir os custos energéticos antes das eleições gerais da próxima semana, em meio a uma frustração crescente dos eleitores devido a preços de petróleo que aumentaram devido à guerra do Irã.", "titulo_pt": "Trump revoga regras sobre metano para a indústria de petróleo e gás dos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 231940, "titulo": "Climate change: Scientists call for declaration of 'global health emergency' after new report", "url": "https://www.lemonde.fr/en/environment/article/2026/10/28/climate-change-scientists-call-for-declaration-of-global-health-emergency-after-new-report_6765877_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T11:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 10º relatório da Lancet Countdown mostra que os impactos da elevação da temperatura global na saúde, como mortes relacionadas ao calor, pioraram significativamente desde a assinatura do Acordo de Paris em 2015.", "titulo_pt": "Clima: cientistas pedem declaração de 'emergência global de saúde' após novo relatório", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 231973, "titulo": "Spain: First footage reveals wreckage of deadly high-speed train crash", "url": "https://www.euronews.com/video/2026/10/28/spain-first-footage-reveals-wreckage-of-deadly-high-speed-train-crash", "fonte_id": "euronews", "data_pub": "2026-10-28T11:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tren tômbio de alta velocidade colidiu com outro perto de Toledo, Espanha, causando pelo menos 10 mortes. Duas carragens tombaram, e os resgatistas estão buscando nas ruínas, com o número de vítimas fatais possivelmente aumentando.", "titulo_pt": "Espanha: primeira imagens revelam destroços do trágico acidente ferroviário de alta velocidade", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 231975, "titulo": "First aerial images show scene of deadly train crash in Toledo, Spain", "url": "https://www.euronews.com/2026/10/28/first-aerial-images-show-scene-of-deadly-train-crash-in-toledo-spain", "fonte_id": "euronews", "data_pub": "2026-10-28T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens aéreas mostram o cenário após um acidente envolvendo duas trens de alta velocidade perto de Urda, na província de Toledo, Espanha, enquanto equipes de emergência continuam as operações de resgate e resposta.", "titulo_pt": "Primeiras imagens aéreas mostram cenário do trágico acidente ferroviário em Toledo, Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 230677, "titulo": "Fibras ganham espaço no prato e viram aliadas de uma nova rotina alimentar", "url": "https://www.metropoles.com/conteudo-especial/canetas-emagrecedoras-fibras", "fonte_id": "metropoles", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alimentos ricos em fibras estão ganhando espaço no cardápio, auxiliando na diversificação das refeições, especialmente entre pessoas que reduziram o volume das refeições usando canetas emagrecedoras.", "titulo_pt": "Fibras ganham espaço no prato e se tornam aliadas de uma nova rotina alimentar", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 230680, "titulo": "Hotéis incorporam agenda climática aos negócios e redesenham a hospedagem", "url": "https://www.metropoles.com/vida-e-estilo/turismo/hoteis-agenda-climatica", "fonte_id": "metropoles", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empreendimentos brasileiros estão incorporando práticas climáticas aos negócios do setor hoteleiro, investindo em energia limpa e eficiência energética para reduzir a pegada de carbono. Isso inclui a adoção de novas práticas que visam avançar na descarbonização dos hotéis.", "titulo_pt": "Hotéis brasileiros integram agenda climática aos negócios e redesenharam a hospedagem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 231066, "titulo": "Three arrested over smuggling endangered tortoises from Thailand", "url": "https://www.japantimes.co.jp/news/2026/10/28/japan/crime-legal/endangered-tortoises-smuggling/", "fonte_id": "japan_times", "data_pub": "2026-10-28T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram presas suspeitas de conspirar para introduzir três tartarugas-estrela indianas e 13 caranguejos-rosa no Japão pelo Aeroporto Internacional de Kansai, em Osaka.", "titulo_pt": "Três pessoas presas por tráfico de tartarugas endêmicas de thailândia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 231207, "titulo": "Revealed: UK relied on £2bn of ‘questionable accounting’ to hit its climate-aid goal", "url": "https://www.carbonbrief.org/revealed-uk-relied-on-2bn-of-questionable-accounting-to-hit-its-climate-aid-goal", "fonte_id": "carbon_brief", "data_pub": "2026-10-28T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido atingiu seu objetivo de fornecer 11,6 bilhões de libras de ajuda climática para países em desenvolvimento até 2026, mas isso dependeu em parte de contabilização questionável no valor de 2 bilhões de libras.", "titulo_pt": "Revelado: reino unido dependeu de 2 bilhões de libras de contabilidade questionável para atingir seu objetivo de ajuda climática", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 232201, "titulo": "Rights commission calls for leniency for ex-Coupang workers indicted in 'blacklist' case", "url": "https://en.yna.co.kr/view/AEN20261029003300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Anticorrupção e de Direitos Civis pediu clemência para os ex-funcionários da Coupang acusados no caso da 'lista negra'.", "titulo_pt": "Comissão de direitos civis pede clemência para ex-funcionários da coupang acusados no caso da 'lista negra'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231768, "titulo": "Albania imposes $6,000 fine for demonstrators present at a protest that turns violent", "url": "https://www.theguardian.com/world/2026/oct/29/albania-protest-attendance-fine-law", "fonte_id": "guardian_world", "data_pub": "2026-10-29T00:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Albânia introduziu multas de mais de $6.000 para demonstrantes que participam de protestos violentos, mesmo que não cometam atos violentos pessoais. A medida visa reprimir as manifestações que exigem o renúncia do primeiro-ministro, após meses de protestos anti-governo na capital Tirana que recentemente se deterioraram em confrontos entre forças de segurança e manifestantes.", "titulo_pt": "Albânia impõe multa de mais de $6.000 para demonstrantes em protestos violentos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 232042, "titulo": "UN experts sound alarm at excessive use of force in French student protests", "url": "https://www.aljazeera.com/news/2026/10/28/un-experts-sound-alarm-at-excessive-use-of-force-in-french-student-protests?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T22:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Obras-úteis das Nações Unidas condenaram as repressão policial excessiva durante as manifestações estudantis na França, advertindo que isso desestimula os manifestantes de exercerem seus direitos.", "titulo_pt": "Obras-úteis das nações unidas alertam sobre uso excessivo de força nas manifestações estudantis na França", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 232099, "titulo": "Seven Israeli attacks against West Bank farmers in 12 hours reported", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/seven-israeli-attacks-against-west-bank-farmers-12-hours-reported", "fonte_id": "middle_east_eye", "data_pub": "2026-10-28T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Colonização e Resistência ao Muro (CWRC) relatou sete ataques israelenses contra agricultores no último dia, em 12 horas, em quatro governos do Vale do Jordão. Os ataques incluíram derrubada de terras agrícolas, arrancamento de árvores, demolição de estruturas e destruição de tanques de água, detenção de agricultores e negação do acesso à terra, além do lançamento de animais em pomares de oliveira.", "titulo_pt": "Sete ataques israelenses contra agricultores palestinos no vale do jordão em 12 horas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 231758, "titulo": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "url": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "fonte_id": "guardian_world", "data_pub": "2026-10-28T14:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A editora-chefe Lina Attalah, de destaque no Egito, foi solta após ser condenada por administrar um site não licenciado, e a sua publicação Mada Masr foi fechada por um tribunal. Isso ocorre num contexto de intensificação da repressão ao jornalismo independente no país.", "titulo_pt": "Egito condena editora-chefe e fecha jornal independente", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 231103, "titulo": "Chinese anti-scam blogger killed by contractors hired online to silence his work", "url": "https://www.scmp.com/news/china/politics/article/3372403/chinese-anti-scam-blogger-killed-contractors-hired-online-silence-his-work", "fonte_id": "scmp", "data_pub": "2026-10-28T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um blogueiro investigativo chinês, conhecido por expor fraudes em telecomunicações e outras atividades ilegais, foi morto por criminosos contratados online. O corpo de Wu Kai, que usava o nome 'Huijian' nas redes sociais, foi encontrado em novembro de 2024. A morte dele levou a pedidos por maiores punições para o caso.", "titulo_pt": "Blogueiro chinês contra-fraude morto por contratantes online", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 231076, "titulo": "Bereaved family of Kurdish man who died in custody sues Tokyo government", "url": "https://www.japantimes.co.jp/news/2026/10/28/japan/crime-legal/kurdish-man-custody-lawsuit/", "fonte_id": "japan_times", "data_pub": "2026-10-28T05:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família do homem kurdo que faleceu em custódia acionou o governo de Tóquio em uma ação judicial. O advogado da família afirma que a morte reflete uma profunda falta de conscientização sobre os direitos humanos dentro da organização policial.", "titulo_pt": "Família do homem kurdo que morreu em custódia processa governo de tóquio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 229961, "titulo": "\"Tuve más afecto en prisión que por parte de mis vecinos\": habló el bioquímico de Esquel detenido por mantener encerrada a su familia", "url": "https://www.clarin.com/sociedad/afecto-prision-parte-vecinos-hablo-bioquimico-esquel-detenido-mantener-encerrada-familia_0_KyzhvxOaHv.html", "fonte_id": "clarin", "data_pub": "2026-10-28T01:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Miguel Battista, de 71 anos, foi imputado em Esquel por privação ilegítima de liberdade e abandono de pessoa, acusado de ter mantido sua família em cárcere privado. Ele foi transferido para uma comisaria em Trevelin.", "titulo_pt": "Tive mais afeto em prisão que com meus vizinhos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 229724, "titulo": "Jafar Panahi, que disputou Oscar, é condenado a cinco anos de prisão pelo Irã", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/jafar-panahi-que-disputou-oscar-e-condenado-a-cinco-anos-de function toggleDrill(id) {

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
