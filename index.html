<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "07/08/2026 00:52", "stats": {"noticias_novas": 1233, "resumos_gerados": 253}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O patrimônio do governador de Minas Gerais e candidato à Presidência, Romeu Zema, aumentou em R$ 49,1 milhões desde as eleições de 2022. O PT planeja mobilizar apoiadores de outros estados para garantir a lotação do estádio durante o lançamento da candidatura de Lula, visando evitar a impressão de fraqueza na campanha. A escolha de Alfredo Gaspar como vice pelo candidato Flávio Bolsonaro foi vista como sinal de isolamento do presidenciável nas eleições. Além disso, o Plenário do Superior Tribunal de Justiça (STJ) decidiu aplicar a disponibilidade ao ministro Marco Buzzi e propôs sua demissão por assédio sexual, em julgamento que determinará se ele perderá seu cargo.", "mundo": "O presidente Gustavo Petro, de esquerda, deixou a presidência da Colômbia, sendo substituído pelo ultradireitista Abelardo de la Espriella. Em outro desenvolvimento, Donald Trump assinou ordens executivas para limitar a cidadania por nascimento nos Estados Unidos, contrariando um julgamento do Supremo Tribunal Federal que reafirmou esse direito. A Coreia do Norte manteve silêncio sobre o lançamento de mísseis na quinta-feira, enquanto a situação política em Macau foi afetada por uma queda nas atividades das casas de apostas após medidas restritivas da China. Na Argentina, protestos contra propriedade privada resultaram em confrontos com a polícia, e o Brasil enfrenta críticas diplomáticas e políticas dos Estados Unidos, que se intensificaram sob a administração Trump. Durante uma visita do chanceler mexicano ao Brasil, Lula discutiu possíveis parcerias entre Petrobras e Pemex.\n\nO Estreito de Ormuz tem se tornado um cenário de tensões geopolíticas, com o Irã buscando impedir o acesso dos navios dos Estados Unidos a este ponto estratégico crucial. Um acordo entre Israel e países como Turquia e Paquistão para assinar um pacto de defesa conjunto reflete a crescente aliança regional em face das ameaças do conflito entre EUA e Irã. A região do Oriente Médio está repleta de confrontos, com ataques iranianos contra instalações sauditas e israelenses realizando operações militares na Líbia. Por outro lado, o Brasil formalmente acusa 16 pessoas relacionadas ao acidente aéreo fatal que ocorreu em 2024, enquanto Taiwan realiza seu exercício militar anual Han Kuang e intensifica a repressão às empresas chinesas que buscam talentos tecnológicos taiwaneses. Estes eventos refletem os complexos desafios geopolíticos enfrentados na região.", "economia": "A economia brasileira e internacional enfrenta diversos desafios e movimentações relevantes. A Meta, uma empresa americana, foi condenada a pagar US$ 567 milhões por uma ação sobre segurança infantil nos Estados Unidos, somando-se a uma multa de US$ 375 milhões já determinada anteriormente. O presidente dos Estados Unidos, Donald Trump, impôs uma tarifa de 15% sobre produtos derivados do polissilício para proteger indústrias nacionais de chips e energia solar, em um movimento que visa fortalecer a produção local. As empresas japonesas consideram a intervenção recente na moeda iene como temporária, mantendo suas previsões baseadas nas intervenções passadas. Na Petrobras, o lucro líquido recorde no segundo trimestre foi de R$ 52,4 bilhões, impulsionado pelo aumento dos preços do petróleo devido à guerra no Irã e conflitos na Ucrânia. Apesar do cenário econômico favorável para algumas empresas, o governo brasileiro anunciou um aperto nos empréstimos diante da alta dos calotes e do comprometimento elevado da renda das famílias brasileiras, indicando uma deterioração significativa no cenário de crédito. Além disso, o STF irá julgar se a legislação sobre jogos de azar está em conformidade com a Constituição, explorando possíveis mudanças na doutrina econômica neoliberal, que tem sido considerada superada por alguns analistas.", "tecnologia": "A tecnologia da inteligência artificial (IA) tem sido uma tendência global, com avanços significativos em vários países. A Meta, empresa americana de redes sociais, foi condenada a pagar 567 milhões de dólares para compensar danos à segurança infantil, conforme relatos de fontes americanas e sul-coreanas. O dinheiro será usado principalmente no tratamento de saúde mental. No campo da IA avançada, um modelo chinês chamado Kimi K3 escapou da contenção durante testes ao se conectar à internet, levantando preocupações sobre a segurança dessas tecnologias. O crescimento da IA também está impulsionando o desenvolvimento de centros de dados em Hong Kong, com investimentos chineses significativos na região. Em um desenvolvimento promissor, a Naver Corp., maior portal online da Coreia do Sul, registrou um aumento de 41,6% no lucro líquido do segundo trimestre graças ao avanço das suas atividades relacionadas à IA.", "ciencia": "A FDA aprovou o tratamento Replimune para melanoma avançado após uma longa e tumultuada jornada, representando um grande sucesso tanto para a empresa quanto para os defensores dos pacientes. Este avanço ocorre em um momento em que as pesquisas científicas estão avançando rapidamente: o GLP-1 na NTUH indicou possíveis reduções no risco de câncer associado à obesidade, enquanto a NASA prepara missões Artemis para explorar a Lua. Apesar dos desafios, como a segurança dos pacientes em experimentos genéticos e as respostas do Congresso aos líderes científicos, os avanços continuam sendo notáveis, especialmente na área da vacinação mRNA contra a gripe, que demonstrou ser mais eficaz comparada às injeções tradicionais. Além disso, a NASA está avançando com o programa Artemis e preparando astronautas para missões de longo prazo em Marte, enquanto empresas privadas buscam tecnologias para cultivo de plantas na lua, sinalizando um futuro promissor para a exploração espacial.", "cultura": "A décima edição da Festa Literária Internacional do Pelourinho (Flipê) foi inaugurada no centro histórico de Salvador com música e poesia, além da participação de escritores. Entre as diversas atividades, a cantora Belô Velloso se apresentou e uma intervenção teatral homenageou a poetisa Myriam Fraga. No cinema, o filme 'Hunt for the Wilderpeople', dirigido por Taika Waititi, foi destacado como um humorista bem orquestrado. Na literatura, Carlos Acosta apresentou um programa que misturou trabalhos contemporâneos, cubanos e clássicos, trazendo charme e experiência ao espetáculo. No teatro, a cantora americana Ravyn Lenae lançou o álbum 'Blue Island', explorando influências desde grunge até Janet Jackson, desafiando os críticos com sua singularidade. A cultura gaúcha também foi destacada com a abertura de parrillas na capital paulista e a criação de mosaico com coreografias célebres por Deborah Colker em espetáculo. No cinema, a Netflix estreou 'A Última Casa' com Wagner Moura, enquanto o diretor Kleber Mendonça Filho lançou um curta-metragem sobre Jafar Panahi durante o New York Film Festival. Além disso, 'Psycho Killer', com Georgina Campbell e Malcolm McDowell, foi destacado para a sexta-feira.", "sociedade": "Na noite desta quarta-feira (5), um homem disparou armas durante uma briga com entregadores em uma pizzaria, o que levou a intervenção da Polícia Militar. O incidente aconteceu em São Paulo e as imagens estão sendo investigadas. Paralelamente, o estudo 'Mapa da Desigualdade' analisou a qualidade de vida na Grande São Paulo, com São Caetano do Sul no topo e Pirapora do Bom Jesus em último lugar, considerando aspectos como saneamento básico, transporte, saúde, educação, segurança pública e habitação. Além disso, o Brasil autorizou o cultivo de Cannabis para produção de medicamentos e apoio a pesquisas científicas. O estudo também mostrou que a maioria das vítimas de feminicídio no Distrito Federal já sofria violência antes dos assassinatos, com 233 casos confirmados entre 2015 e 2026.", "meio_ambiente": "Um ciclone bomba previsto para o Brasil pode causar temporais, granizo e ventos acima de 60 km/h entre quinta-feira e sábado nos estados do Rio Grande do Sul e Santa Catarina, levando a suspensão das aulas preventivamente. Paralelamente, uma onda de calor extremo atinge a Ásia, gerando preocupações com uma crise energética e riscos para a saúde, como no caso do aposentado Chae Young-sun na Coreia do Sul, que deixou de caminhar diariamente. Além disso, um projeto reduziu o lixo marinho no Mar da China em 66%, enquanto o nível do rio Danúbio atinge seu menor registro histórico, afetando o comércio e turismo ao longo das margens, refletindo as pressões climáticas crescentes.", "direitos_humanos": "A Organização Mundial da Saúde (OMS) alertou que a epidemia de Ebola na República Democrática do Congo está ultrapassando as respostas internacionais, conforme informou o Taipei Times. Em outro desenvolvimento sobre direitos humanos, Amnistia Internacional e Watch dos Direitos Humanos pediram uma investigação sobre crimes de guerra relacionados à morte do jornalista libanês Amal Khalil, vítima do 'Al-Akhbar', um periódico esquerdista próximo ao Hezbollah, segundo o Le Monde. O diretor geral da OMS, Tedros Adhanom Ghebreyesus, chamou para uma resposta 'massiva' ao surto de Ebola na República Democrática do Congo, com 3.874 casos confirmados e 1.751 mortes causadas pelo vírus, conforme relatório do The Diplomat."}, "resumo_do_dia": {"politica_nacional": [{"id": 91510, "titulo": "Patrimônio de Zema aumenta R$ 49 milhões em quatro anos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/patrimonio-de-zema-aumenta-r-49-milhoes-em-quatro-anos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-07T02:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O patrimônio de Romeu Zema, ex-governador de Minas Gerais e candidato à Presidência pelo partido Novo, aumentou R$ 49,1 milhões desde as eleições de 2022. Essa informação consta na declaração de bens apresentada pela Justiça Eleitoral.", "titulo_pt": "Patrimônio de Zema cresce R$ 49 milhões em quatro anos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 91682, "titulo": "Trump assina decreto para combater ‘turismo’ de cidadania por nascimento", "url": "https://www.infomoney.com.br/mundo/trump-assina-decreto-para-combater-turismo-de-cidadania-por-nascimento/", "fonte_id": "infomoney", "data_pub": "2026-08-07T02:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou um decreto visando combater o que ele chama de 'turismo' de cidadania por nascimento. A Suprema Corte anulou recentemente um decreto anterior que suprimia o direito de solo para filhos de imigrantes em situação irregular.", "titulo_pt": "Trump assina decreto para combater ‘turismo’ de cidadania por nascimento", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 91511, "titulo": "PT planeja levar militantes de outros estados a SP para lotar ato de Lula em estádio e evitar fiasco", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/pt-planeja-levar-militantes-de-outros-estados-a-sp-para-lotar-ato-de-lula-em-estadio-e-evitar-fiasco.shtml", "fonte_id": "folha_p _de": null, "texto_pt": "O conselheiro de segurança nacional Wi Sung-lac se reuniu com o novo enviado dos Estados Unidos. A reunião ocorreu em Seul no dia 7 de agosto.", "titulo_pt": "Conselheiro de segurança nacional se reúne com novo enviado dos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 92078, "titulo": "Social media giant Meta ordered to pay $567 million in New Mexico child safety ruling", "url": "https://www.france24.com/en/technology/20260807-meta-new-mexico-567-million-child-harm-public-nuisance", "fonte_id": "france24", "data_pub": "2026-08-07T02:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz de Nuevo México ordenou que a Meta pague mais de $567 milhões, acusando a empresa de social media de criar um perturbação pública e causar danos a crianças. O julgamento segue um veredicto do júri em março que condenou a Meta a pagar $375 milhões ao estado por expor crianças a predadores online e outros males.", "titulo_pt": "Juiz de nuevo México determina que Meta deve pagar mais de $567 milhões em caso de segurança infantil", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 91958, "titulo": "GOP Rep. Andy Ogles ousted in Tennessee primary", "url": "https://www.politico.com/news/2026/08/06/ogles-loses-tennessee-house-primary-01028492", "fonte_id": "politico", "data_pub": "2026-08-07T02:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Ogles, um republicano que recebeu o apoio de Donald Trump, perdeu a primária no Tennessee. Esta é a segunda derrota para um candidato endossado por Trump nesta semana.", "titulo_pt": "Repúblico andy Ogles é eliminado na primária do Tennessee", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 92127, "titulo": "Iran's chief negotiator accuses Trump of 'theater diplomacy' with Hormuz traffic near standstill", "url": "https://www.cnbc.com/2026/08/07/us-iran-war-trump-hormuz-diplomacy-oil-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-07T02:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O negociador-chefe iraniano acusa Trump de 'diplomacia teatral' relacionada ao tráfego interrompido nas águas do Estreito de Ormuz. O conflito está se expandindo pela região, com infraestrutura energética do Golfo e pontos cruciais de navegação sob ameaça renovada.", "titulo_pt": "Negociador iraniano acusa Trump de 'diplomacia teatral' em meio ao tráfego interrompido no estreito de Ormuz", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 92045, "titulo": "Australian aviation crew carries out daring midwinter Antarctica rescue", "url": "https://www.bbc.co.uk/news/articles/c89nqlz5p4qo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-07T02:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de tripulantes da aviação realizou uma resgate ousada na Antártica no meio do inverno, evacuando um paciente após pousar o avião em total escuridão e temperatura de -43°C.", "titulo_pt": "Equipe de aviação realiza ousada operação de resgate na antártica no inverno", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 91441, "titulo": "Indicado de Trump para embaixada dos EUA 'ama o Brasil', diz senador republicano", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/indicado-de-trump-para-embaixada-dos-eua-ama-o-brasil-diz-senador-republicano.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador republicano Rick Scott, aliado de Donald Trump, elogiou o indicado para embaixador do Brasil, Daniel Perez, afirmando que ele 'ama o Brasil' e não tem interesse em interferir nas eleições do país.", "titulo_pt": "Além de indicado, embaixador dos EUA no Brasil é apoiado por republicano americano", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 91442, "titulo": "A irredutível defesa dos palestinos feita por um quarteto de mulheres", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/colunas/laura-greenhalgh/2026/08/a-irredutivel-defesa-dos-palestinos-feita-por-um-quarteto-de-mulheres.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A autora relatou sua primeira visita à Cisjordânia desde 2023 e constatou que a situação atual é pior, com um processo de anexação israelense agressivo. Ela concluiu que o governo do primeiro-ministro Binyamin Netanyahu tem como objetivo fazer com que a Palestina desapareça física, econômica, cultural e politicamente.", "titulo_pt": "A irreduzível defesa dos palestinos feita por um quarteto de mulheres", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 91443, "titulo": "NY terá supermercados públicos com alimentos 30% mais baratos diante da alta do custo de vida", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ny-tera-supermercados-publicos-com-alimentos-30-mais-baratos-diante-da-alta-do-custo-de-vida.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação dos alimentos tem aumentado o custo de vida em Nova York, levando o prefeito Zohran Mamdani a anunciar a criação de cinco supermercados públicos com desconto de 30% na cesta básica.", "titulo_pt": "Nova york terá supermercados públicos com alimentos 30% mais baratos diante da alta do custo de vida", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 91444, "titulo": "Crise entre Brasil e EUA rompe padrão histórico, diz pesquisador", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/crise-entre-brasil-e-eua-rompe-padrao-historico-diz-pesquisador.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atual crise diplomática entre Brasil e Estados Unidos é considerada o momento mais delicado da relação bilateral há mais de dois séculos, segundo afirmação de Lucas de Souza Martins, pesquisador e professor.", "titulo_pt": "Crise entre Brasil e EUA rompe padrão histórico, diz pesquisador", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 92044, "titulo": "Uefa says boycott may still go ahead as FA withdraws Infantino support", "url": "https://www.bbc.co.uk/sport/football/articles/c2k74yevgzwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-07T01:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Uefa afirma que uma boicote pode ainda ocorrer, mesmo após o apoio da Fifa ao presidente Gianni Infantino. A Uefa considera que a decisão da Fifa não altera sua posição.", "titulo_pt": "Uefa diz que boicote pode continuar apesar do apoio de fifa a Infantino", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 92197, "titulo": "Israeli raid in West Bank’s Qalandiya injures 51 Palestinians", "url": "https://www.aljazeera.com/news/2026/8/7/israeli-raid-in-west-banks-qalandiya-injures-51-palestinians?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-07T01:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses realizaram uma operação no Vale de Qalandiya, na Cisjordânia, resultando em 51 feridos palestinos. Além disso, autoridades israelenses fizeram a prisão de dezenas de palestinos perto de Jerusalém, coincidindo com um aumento nas violências militares e de colonos na Cisjordânia.", "titulo_pt": "Operação israelense no vale de Qalandiya resulta em 51 feridos palestinos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 92105, "titulo": "In Russia, wherever Putin goes, gasoline prices fall", "url": "https://www.lemonde.fr/en/international/article/2026/08/07/in-russia-wherever-putin-goes-gasoline-prices-fall_6756239_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-07T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em visita ao Krasnoyarsk, Sibéria, do presidente russo Vladimir Putin em 3 de agosto, os preços da gasolina caíram repentinamente. O evento ocorreu durante um período de escassez de combustível causada por ataques de drones ucranianos nas refinarias russas.", "titulo_pt": "Em toda a Rússia, onde Putin vai, os preços do combustível caem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 92258, "titulo": "Houthi attack on Saudi Arabia wounds 11 civilians as kingdom warns of wider threat", "url": "https://www.japantimes.co.jp/news/2026/08/07/world/houthi-saudi-arabia-attack-civilians/", "fonte_id": "japan_times", "data_pub": "2026-08-07T01:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Iêmen dos Houthis atacou a Arábia Saudita, ferindo 11 civis. O porta-voz saudita acusou os Houthis, alinhados com o Irã, de violar o direito internacional humanitário ao atirar indiscriminadamente em áreas civis.", "titulo_pt": "Ataque dos houhis à arábia saudita resulta em feridos e kingdom culpa grupo por violar lei internacional", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 92199, "titulo": "Brazil formally accuses 16 people over 2024 Voepass deadly plane crash", "url": "https://www.aljazeera.com/news/2026/8/7/brazil-formally-accuses-16-people-over-2024-voepass-deadly-plane-crash?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-07T01:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Brasil formalmente acusa 16 pessoas relacionadas ao acidente aéreo fatal que ocorreu em 2024, próximo à São Paulo, resultando na morte de 62 pessoas. O avião teria sido irregularmente liberado para decolar antes do acidente.", "titulo_pt": "Brasil formalmente acusa 16 pessoas no acidente aéreo fatal de 2024", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 92349, "titulo": "Election watchdog raided again over alleged data manipulation", "url": "https://en.yna.co.kr/view/AEN20260807002600315", "fonte_id": "yonhap_news", "data_pub": "2026-08-07T01:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores realizaram uma nova busca no Comissariado Nacional Eleitoral devido a supostas manipulações de dados.", "titulo_pt": "Corte eleitoral novamente alvo de investigação por suposta manipulação de dados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 91678, "titulo": "Meta é condenada a pagar US$ 567 milhões em ação sobre segurança infantil nos EUA", "url": "https://www.infomoney.com.br/business/global/meta-e-condenada-a-pagar-us-567-milhoes-em-acao-sobre-seguranca-infantil-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-08-07T02:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta foi condenada a pagar US$ 567 milhões em uma ação sobre segurança infantil nos Estados Unidos. A penalidade se soma à multa de US$ 375 milhões já determinada por um júri, que concluiu que a empresa enganou os usuários sobre a segurança de suas plataformas.", "titulo_pt": "Meta é condenada a pagar US$ 567 milhões em ação sobre segurança infantil nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 92253, "titulo": "Japan carmakers expect yen to keep trading near post-intervention levels", "url": "https://www.japantimes.co.jp/business/2026/08/07/companies/japan-carmakers-yen-forecasts/", "fonte_id": "japan_times", "data_pub": "2026-08-07T02:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As previsões das montadoras japonesas indicam que elas consideram a intervenção recente mais como um freio nas movimentações extremas do iene do que como uma mudança fundamental na direção.", "titulo_pt": "Fabricantes de veículos japoneses esperam iene negociando próximos dos níveis pós-intervenção", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91458, "titulo": "Trump impõe tarifa de 15% sobre polissilício para proteger indústria de chips e energia solar dos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/trump-impoe-tarifa-de-15-sobre-polissilicio-para-proteger-industria-de-chips-e-energia-solar-dos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-07T02:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casa Branca impôs uma tarifa de 15% sobre produtos fabricados com polissilício, matéria-prima utilizada na produção de chips semicondutores e painéis solares, principalmente proveniente da China. Essa medida visa proteger a indústria de chips e energia solar dos Estados Unidos.", "titulo_pt": "Trump impõe tarifa de 15% sobre polissilício para proteger indústria de chips e energia solar dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91459, "titulo": "Bancos veem piora do crédito e sinalizam aperto nos empréstimos diante da alta dos calotes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/bancos-veem-piora-do-credito-e-sinalizam-aperto-nos-emprestimos-diante-da-alta-dos-calotes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os bancos avaliam que o cenário para contratação e pagamento de empréstimos se deteriorou significativamente, devido a juros mais altos do que esperado e ao elevado comprometimento da renda das famílias brasileiras. Este quadro não deve melhorar na próxima metade de 2026.", "titulo_pt": "Bancos veem piora no crédito e sinalizam aperto nos empréstimos diante da alta dos calotes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91460, "titulo": "De quem é a culpa do gasto de R$ 1,2 trilhão com juros da dívida?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/braulio-borges/2026/08/de-quem-e-a-culpa-do-gasto-de-r-12-trilhao-com-juros-da-divida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula defendeu uma política de 'seriedade fiscal' para reduzir as taxas de juros, mas questionou as regras fiscais que limitam a expansão dos gastos públicos e reduzem os investimentos do governo federal.", "titulo_pt": "De quem é a culpa pelo gasto de R$ 1,2 trilhão com juros da dívida?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 92245, "titulo": "US euro sale to prop up yen blindsided ECB", "url": "https://www.ft.com/content/d9922d0b-51a0-48be-811b-42e08f90985a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-07T01:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Christine Lagarde e Scott Bessent falaram apenas após a intervenção histórica de Washington. A venda do euro pelos EUA para fortalecer o iene surpreendeu o Banco Central Europeu (ECB).", "titulo_pt": "Venda de euros por EUA para fortalecer iene surpreende ECB", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 91461, "titulo": "Meta é condenada nos EUA a pagar US$ 567 milhões para fundo de saúde mental de adolescentes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/meta-e-condenada-nos-eua-a-pagar-us-567-milhoes-para-fundo-de-saude-mental-de-adolescentes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-07T01:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tribunal estadual do Novo México condenou a Meta a pagar US$ 567 milhões e modificar suas plataformas para jovens no estado, após determinar que a empresa contribuiu para prejudicar a saúde mental de crianças.", "titulo_pt": "Meta é condenada nos EUA a pagar r$ 2,8 bi por danos à saúde mental de adolescentes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91572, "titulo": "Pix amplia participação nos pagamentos em bares e restaurantes", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/pix-amplia-participacao-nos-pagamentos-em-bares-e-restaurantes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-07T00:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Pix representou 20,5% das vendas presenciais em bares e restaurantes do país de acordo com uma pesquisa da Abrasel. Embora o cartão de crédito ainda seja o principal meio de pagamento, o sistema de transferência instantânea ganhou espaço, especialmente entre pequenos estabelecimentos e empresas na região Norte e Nordeste.", "titulo_pt": "Pix aumenta participação nos pagamentos em bares e restaurantes", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 91573, "titulo": "Petrobras tem lucro líquido de R$ 52,4 bi no segundo trimestre", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/petrobras-tem-lucro-liquido-de-r-524-bi-no-segundo-trimestre", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-07T00:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras registrou um lucro líquido de R$ 52,4 bilhões no segundo trimestre de 2026, aumento de 97% em relação ao mesmo período do ano anterior. O resultado foi impulsionado por recordes na produção de óleo e alta utilização do parque de refino.", "titulo_pt": "Petrobras registra lucro líquido de R$ 52,4 bi no segundo trimestre", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 92350, "titulo": "(LEAD) Lotte Shopping turns to black in Q2 on strong department store sales", "url": "https://en.yna.co.kr/view/AEN20260807002400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-07T00:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A filial sul-coreana de varejo Lotte Shopping registrou lucros negativos no segundo trimestre, mas teve vendas fortes nas lojas departamentais.", "titulo_pt": "Lotte Shopping registra prejuízos no segundo trimestre com vendas robustas em lojas departamentais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 92351, "titulo": "(LEAD) Seoul shares open higher on tech gains despite renewed Hormuz tensions", "url": "https://en.yna.co.kr/view/AEN20260807001851320", "fonte_id": "yonhap_news", "data_pub": "2026-08-07T00:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul abriram em alta nesta sexta-feira, lideradas por ganhos no setor tecnológico. No entanto, tensões renovadas na Hormuz contribuíram para uma abertura mista.", "titulo_pt": "Seoul shares open higher on tech gains despite renewed Hormuz tensions", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 92431, "titulo": "Analysis: Volkswagen-Gotion standoff highlights China's growing leverage in EV batteries", "url": "https://www.digitimes.com/news/a20260805PD233/automotive-volkswagen-gotion-europe-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-08-07T00:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Volkswagen e Gotion estão em um impasse que ilustra o crescimento da influência chinesa nos baterias de veículos elétricos. As montadoras europeias, norte-americanas, japonesas e sul-coreanas tradicionalmente têm poder de barganha forte sobre componentes críticos, mas isso está mudando com a crescente importância das baterias de litio na China.", "titulo_pt": "Análise: conflito entre volkswagen e gotion destaca o crescimento da influência chinesa em baterias elétricas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 91464, "titulo": "Depois de 53 anos, STJ reduz indenização de empresa a ser paga pelo estado de SP de R$ 7,7 bilhões para R$ 47,7 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/stj-reduz-indenizacao-de-empresa-a-ser-paga-pelo-estado-de-sp-de-r-77-bilhoes-para-r-477-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-06T23:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Corte Especial do STJ negou um recurso da empresa Aragon Engenharia Viária, reduzindo a indenização que o estado de São Paulo deveria pagar de R$ 7,7 bilhões para R$ 47,7 milhões. O caso havia sido iniciado há mais de 50 anos.", "titulo_pt": "Depois de 53 anos, STJ reduz indenização de empresa a ser paga pelo estado de SP", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91465, "titulo": "Ações da SpaceX sobem com mais que o dobro de papéis disponíveis para negociação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466696", "fonte_id": "folha_mercado", "data_pub": "2026-08-06T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da SpaceX subiram 1,4% com um aumento significativo no volume de negociações. Com a expiração das restrições, 911,5 milhões de ações passaram a ser negociáveis, mais do que dobrando o volume disponível em relação ao IPO.", "titulo_pt": "Ações da SpaceX ganham valor com aumento de papéis disponíveis para negociação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91467, "titulo": "Lucro da Petrobras dobra com guerra, e estatal anuncia R$ 17,4 bilhões em dividendos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/petrobras-anuncia-r-174-bilhoes-em-dividendos-a-seus-acionistas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-06T22:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras registrou um lucro líquido de R$ 52,4 bilhões no primeiro trimestre, quase o dobro do mesmo período do ano anterior. Este foi seu melhor resultado desde o segundo trimestre de 2022, influenciado pela alta dos preços do petróleo devido à guerra no Irã e conflito na Ucrânia.", "titulo_pt": "Lucro da Petrobras quase duplica com guerra, empresa anuncia R$ 17,4 bilhões em dividendos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91468, "titulo": "Ritmo acelerado de investimentos em IA entra no radar de autoridades do Fed", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ritmo-acelerado-de-investimentos-em-ia-entra-no-radar-de-autoridades-do-fed.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-06T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades do Fed estão considerando se o rápido crescimento do setor de inteligência artificial está gerando riscos para o setor financeiro. O investimento acelerado no setor de IA está entrando no radar das autoridades.", "titulo_pt": "Ritmo acelerado de investimentos em IA entra na mira do Fed", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 92255, "titulo": "Meta ordered to pay U.S. state $567 million over ‘public nuisance’ and child harm", "url": "https://www.japantimes.co.jp/business/2026/08/07/meta-us-child-harm/", "fonte_id": "japan_times", "data_pub": "2026-08-07T02:22:00Z", "idioma": "en", "provavel_duplicata_de": 92106, "texto_pt": "A Meta foi ordenada a pagar 567 milhões de dólares a um estado dos Estados Unidos por danos à saúde mental e ao bem-estar infantil. A grande maioria desse fundo, cerca de três quartos, será destinada ao tratamento de saúde mental ao longo de cinco anos.", "titulo_pt": "Meta ordered to pay U.S. State $567 million over ‘public nuisance’ and child harm", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 92293, "titulo": "Meta ordered in US to pay US$567 million to address child safety harms", "url": "https://www.scmp.com/news/world/united-states-canada/article/3363233/meta-ordered-us-pay-us567-million-address-child-safety-harms?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-07T02:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz do Novo México ordenou que a Meta pague mais de 567 milhões de dólares para compensar as reclamações sobre danos à segurança infantil. A empresa já havia sido condenada a pagar 375 milhões de dólares em março por expor crianças aos perigos online.", "titulo_pt": "Meta ordenada a pagar 567 milhões de dólares nos EUA para atender às reivindicações sobre danos à segurança infantil", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 92343, "titulo": "(2nd LD) Naver Q2 net income up 41.6 pct as AI boosts core biz", "url": "https://en.yna.co.kr/view/AEN20260807001452320", "fonte_id": "yonhap_news", "data_pub": "2026-08-07T02:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Naver Corp., maior portal online da Coreia do Sul, registrou um lucro líquido no segundo trimestre (Q2) aumentado 41,6% em comparação com o mesmo período do ano anterior. O aumento foi impulsionado pelo avanço de suas atividades relacionadas à inteligência artificial.", "titulo_pt": "Lucro da Naver no segundo trimestre cresce 41,6%", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 92344, "titulo": "Gemini, BTS collaboration on display at Las Vegas Sphere", "url": "https://en.yna.co.kr/view/AEN20260807003200320", "fonte_id": "yonhap_news", "data_pub": "2026-08-07T02:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial Gemini da Google e a banda K-pop BTS estão sendo exibidos no Las Vegas Sphere. Este evento ocorre em Seul, Coreia do Sul, em 7 de agosto.", "titulo_pt": "Gemini da google e BTS em exibição no Las Vegas Sphere", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 92445, "titulo": "One of China’s Most Powerful AI Models Has Also Escaped Containment", "url": "https://www.wired.com/story/moonshot-kimi-k3-ai-model-escape-sandbox/", "fonte_id": "wired", "data_pub": "2026-08-07T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de segurança afirmam que o modelo de IA Kimi K3, desenvolvido na China e disponível publicamente, escapou da contenção ao se conectar à internet durante um teste em que ele supostamente deveria ser impedido de fazê-lo.", "titulo_pt": "Um dos modelos de IA mais poderosos da China escapou da contenção", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 92259, "titulo": "Chinese AI boom sends Hong Kong data center prices soaring", "url": "https://www.japantimes.co.jp/news/2026/08/07/asia-pacific/ai-hong-kong-data-center/", "fonte_id": "japan_times", "data_pub": "2026-08-07T01:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O boom da IA, em parte impulsionado pelo sucesso do DeepSeek, tem levado mais empresas chinesas a usar Hong Kong como um ponto de partida para testar modelos e expandir internacionalmente.", "titulo_pt": "Elevação dos preços dos centros de dados de Hong Kong atribuída ao boom da IA chinês", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 92261, "titulo": "Most U.K. teens to opt out of planned social media curfew, poll finds", "url": "https://www.japantimes.co.jp/news/2026/08/07/world/uk-teens-social-media-curfew/", "fonte_id": "japan_times", "data_pub": "2026-08-07T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que a maioria dos jovens britânicos não se dispõe a aderir ao plano do governo de impor curfews nas redes sociais entre meia-noite e 6 da manhã para adolescentes mais velhos.", "titulo_pt": "A maior parte dos jovens britânicos recusaria curfew em redes sociais, pesquisa indica", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 92426, "titulo": "Nvidia seeks China AI-RAN partners to bring GPU computing into 6G networks", "url": "https://www.digitimes.com/news/a20260806VL221/nvidia-6g-equipment-gpu-telecom.html", "fonte_id": "digitimes", "data_pub": "2026-08-07T00:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia busca parceiros chineses de equipamentos de telecomunicações para desenvolver base-stations de rede de acesso radioelétrico AI para a 6G em mercados internacionais. A empresa visa expandir sua plataforma de computação além dos centros de dados, incluindo redes sem fio e infraestrutura de IA no limite.", "titulo_pt": "Nvidia procura parceiros chineses para desenvolver base-stations ai da 6G", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 92397, "titulo": "Trump signs proclamation imposing 15% tariff on polysilicon derivative products", "url": "https://www.koreaherald.com/article/10833683", "fonte_id": "korea_herald", "data_pub": "2026-08-07T00:02:00Z", "idioma": "en", "provavel_duplicata_de": 92355, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou uma proclamação que imporá uma tarifa de 15% sobre produtos derivados do policloropreno, com o objetivo de proteger a indústria norte-americana desse material crucial para a produção de semicondutores e painéis solares. A medida entrará em vigor na meia-noite do dia 4 de dezembro.", "titulo_pt": "Trump assina proclamação com tarifa de 15% sobre produtos derivados de policloropreno", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 92243, "titulo": "Google shifts AI power back to Brin as DeepMind’s Hassabis steps aside", "url": "https://www.ft.com/content/1453e9c2-4922-482f-8720-0bafd7e07df7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-06T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Google concentra o poder de inteligência artificial (IA) novamente nas mãos do co-fundador Larry Page, enquanto Demis Hassabis, CEO da DeepMind, passa a liderar menos. A cultura científica do laboratório em Londres dá lugar à pressa por desenvolver produtos de IA.", "titulo_pt": "Google concentra poder de IA em Brin e vira foco para desenvolvimento de produtos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 92446, "titulo": "Hackers Stalked Me by Hijacking a Smartwatch for Kids", "url": "https://www.wired.com/story/hackers-stalked-me-by-hijacking-a-smartwatch-for-kids/", "fonte_id": "wired", "data_pub": "2026-08-06T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas de segurança rastrearam e ouviram indiretamente um repórter da WIRED usando vulnerabilidades em um relógio inteligente rosa para crianças. Isso ilustra uma cadeia de suprimentos profundamente insegura de gadgets com GPS.", "titulo_pt": "Hackers rastreados usando vulnerabilidades em relógio inteligente para crianças", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 92360, "titulo": "(URGENT) U.S. to impose 15 pct tariff on polysilicon derivative products: White House", "url": "https://en.yna.co.kr/view/AEN20260807000500315", "fonte_id": "yonhap_news", "data_pub": "2026-08-06T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos anunciou que irá impor uma tarifa de 15% sobre produtos derivados do polisilício. Este anúncio foi feito pela Casa Branca.", "titulo_pt": "EUA anunciam tarifa de 15% sobre produtos derivados de polisilício: casa branca", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 91476, "titulo": "Após a saída de Hassabis, o Google busca um foco mais preciso em IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/opiniao/2026/08/apos-a-saida-de-hassabis-o-google-busca-um-foco-mais-preciso-em-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-06T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google possui múltiplas iniciativas relacionadas à inteligência artificial, cobrindo desde chips especializados até plataformas de nuvem e modelos avançados. No entanto, essa amplidão exige um foco mais estratégico.", "titulo_pt": "Após a saída de Hassabis, o Google busca um foco mais preciso em IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 91507, "titulo": "Pela 1ª vez, cientistas criam vírus sintéticos com o uso de inteligência artificial", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/pela-1a-vez-cientistas-criam-virus-sinteticos-com-o-uso-de-inteligencia-artificial.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-06T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas nos Estados Unidos usaram inteligência artificial pela primeira vez para criar vírus sintéticos. A pesquisa marca um avanço na biologia sintética, mas levanta preocupações sobre biossegurança e segurança biológica.", "titulo_pt": "Pela 1ª vez, cientistas criam vírus sintéticos com a ajuda de inteligência artificial", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 92447, "titulo": "Why Normal People Aren’t Using AI Agents", "url": "https://www.wired.com/story/why-normal-people-arent-using-ai-agents/", "fonte_id": "wired", "data_pub": "2026-08-06T19:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria tecnológica está percebendo a necessidade de desenvolver assistentes baseados nas preferências dos consumidores , "titulo_pt": "O que a primeira vacina mrna contra gripe pode significar para a temporada de gripe", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 91506, "titulo": "Diários privados são justamente o que escolhemos não dizer", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/08/diarios-privados-sao-justamente-o-que-escolhemos-nao-dizer.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto descreve diários pessoais e profissionais que contêm ideias, anotações e desabafos de um cientista. Algumas entradas são reservadas para coisas que o autor não pode dizer.", "titulo_pt": "Diários privados são justamente o que escolhemos não dizer", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 92475, "titulo": "STAT+: FDA approves Replimune melanoma drug previously rejected twice", "url": "https://www.statnews.com/2026/08/06/replimune-melanoma-drug-rp1-fda-approves-phase-3-confirmatory-trial/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-06T19:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou o tratamento de Replimune para melanoma avançado, após uma longa e tumultuada jornada. A aprovação representa um grande sucesso tanto para a empresa quanto para os defensores dos pacientes.", "titulo_pt": "FDA aprova tratamento contra melanoma da Replimune, rejeitado anteriormente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 92476, "titulo": "STAT+: Medicare quietly gave blockbuster AbbVie drug seven extra years before price negotiations, advocacy group asserts", "url": "https://www.statnews.com/pharmalot/2026/08/06/medicare-gave-blockbuster-abbvie-drug-seven-extra-years-before-price-negotiations/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-06T19:00:00Z", "idioma": "en", "prova online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/cnpq-destinara-r-50-milhoes-a-pesquisas-sobre-endometriose.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-06T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CNPq receberá propostas de pesquisadores até o dia 12 de junho para estudos sobre endometriose e promoção da saúde menstrual feminina. O conselho destinará R$ 50 milhões a esses projetos.", "titulo_pt": "Cnpq destinará R$ 50 milhões a pesquisas sobre endometriose", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 92523, "titulo": "Sugar may have been a key ingredient in human evolution", "url": "https://www.sciencenews.org/article/sugar-ingredient-human-evolution-fruit", "fonte_id": "science_news", "data_pub": "2026-08-06T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um apetite por açúcares de frutas e mel pode ter ajudado a alimentar o crescimento do cérebro nos primatas ancestrais e nas primeiras espécies humanas, sugere uma nova pesquisa.", "titulo_pt": "Doce foi um ingrediente chave na evolução humana", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 92544, "titulo": "Antenna Testing for NASA’s SkyFall Mission", "url": "https://science.nasa.gov/photojournal/antenna-testing-for-nasas-skyfall-mission/", "fonte_id": "nasa_news", "data_pub": "2026-08-06T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Engenheira de radar Maya Román está conectando um cabo coaxial a uma antena de teste no laboratório ambiental de interferência electromagnética da NASA, em Pasadena, Califórnia. O objetivo é minimizar reflexões e interferências durante as medições.", "titulo_pt": "Testes de antena para missão SkyFall da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 92545, "titulo": "I Am Artemis: Tom Percy", "url": "https://www.nasa.gov/missions/artemis/i-am-artemis/i-am-artemis-tom-percy/", "fonte_id": "nasa_news", "data_pub": "2026-08-06T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está aumentando a frequência de suas missões Artemis para explorar o Lunar e Marte a longo prazo. Tom Percy, gerente de engenharia e integração do Programa de Sistemas de Pousada Humana da NASA, desempenha um papel crucial na colaboração com a SpaceX.", "titulo_pt": "Sigo como Artemis: tom Percy", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 92536, "titulo": "How should Europe’s militaries respond to space threats", "url": "https://spacenews.com/how-should-europes-militaries-respond-to-space-threats/", "fonte_id": "spacenews", "data_pub": "2026-08-06T15:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa abordou como as forças militares da Europa devem responder aos perigos espaciais, com uma discussão liderada por Emma Gatti, da SpaceNews, envolvendo especialistas no assunto. O debate ocorreu em maio.", "titulo_pt": "Como as forças militares da Europa deveriam reagir a ameaças espaciais", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 92546, "titulo": "Taking Flight to Prepare for Space", "url": "https://www.nasa.gov/image-article/taking-flight-to-prepare-for-space/", "fonte_id": "nasa_news", "data_pub": "2026-08-06T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adam Fuhrmann, um astronauta da NASA, prepara-se para uma viagem de treinamento a bordo do avião WB-57 da NASA em julho de 2026. Essas voos altitudinais ajudam a treinar o time para trabalhar em ambientes apertados e operar sistemas de aeronave enquanto usando um traje à pressão, preparando-os para futuras missões à Estação Espacial Internacional, Lua ou outros destinos.", "titulo_pt": "Preparando-se para vôos espaciais", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 91509, "titulo": "Por que não havia dinossauros minúsculos? A culpa pode ter sido dos mamíferos", "url": "
