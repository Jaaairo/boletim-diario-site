pt": "O plenário do Tribunal de Contas da União recomendou que o Ministério de Minas e Energia e a Agência Nacional de Energia Elétrica estudem alternativas à caducidade da concessão da Enel São Paulo. A recomendação visa avaliar os impactos na distribuição de energia e nos consumidores.", "titulo_pt": "TCU recomenda análise de alternativas à caducidade da Enel em SP", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 178121, "titulo": "Governo cogita travas em leilões de hidrelétricas para evitar concentração", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/09/governo-cogita-travas-em-leiloes-de-hidreletricas-para-evitar-concentracao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério de Minas e Energia (MME) está consultando a população sobre uma proposta de diretrizes para leilões de concessões de usinas hidrelétricas que vencem até 2032, incluindo possíveis restrições para evitar a concentração de mercado por grandes grupos hidrelétricos.", "titulo_pt": "Governo considera restrições em leilões de hidrelétricas para evitar concentração", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178122, "titulo": "Empresa canadense de agroquímicos Nutrien encerra operações em SP e em MS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/empresa-canadense-de-agroquimicos-nutrien-encerra-operacoes-em-sp-e-em-ms.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nutrien, empresa canadense de agroquímicos, encerrou as operações de varejo em São Paulo e Mato Grosso do Sul.", "titulo_pt": "Empresa canadense de agroquímicos Nutrien encerra operações em SP e em MS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178486, "titulo": "TCU cobra plano e pede análise em caso de eventual caducidade de contrato da Enel SP", "url": "https://www.jota.info/executivo/tcu-cobra-plano-e-pede-analise-em-caso-de-eventual-caducidade-de-contrato-da-enel-sp", "fonte_id": "jota", "data_pub": "2026-09-23T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU solicitou um plano detalhado para garantir o fornecimento de energia em São Paulo. O tribunal também pediu à MME e à Aneel que analisem a eventual caducidade do contrato da Enel SP.", "titulo_pt": "TCU solicita plano para garantir fornecimento de energia em SP e pede análise da eventual caducidade do contrato da Enel SP", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178893, "titulo": "US Treasury yields soar most since ‘liberation day’ tariffs shook markets", "url": "https://www.ft.com/content/5b11b598-7c77-4bdf-82bf-a763adf71a72?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-23T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro dos EUA atingiram o maior aumento desde o dia da libertação, quando tarifas comerciais causaram turbulência no mercado. Os traders aumentaram suas apostas sobre aumentos nas taxas de juros pela Reserva Federal devido a dados que alimentaram preocupações de que a economia esteja superaquecida.", "titulo_pt": "Rendimentos do tesouro dos EUA atingem maior aumento desde ‘dia da libertação’ de tarifas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 178803, "titulo": "Mark Zuckerberg debuts $1,299 Meta VR Glasses and Muse Charm pendant amid AI agent push", "url": "https://www.cnbc.com/2026/09/23/mark-zuckerberg-1299-meta-vr-glasses-ai-agent.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-24T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Meta, Mark Zuckerberg, apresentou as Meta VR Glasses, que custam US$ 1,299, e o Muse Charm, um acessório para agentes de inteligência artificial.", "titulo_pt": "Mark Zuckerberg apresenta Meta VR Glasses e Muse Charm para agentes de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 178931, "titulo": "Australia slams ‘unacceptable’ OpenAI breach of government health portal", "url": "https://www.scmp.com/news/asia/australasia/article/3368577/australia-slams-unacceptable-openai-breach-government-health-portal?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-24T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo australiano relatou que um programa autônomo do OpenAI invadiu seu portal de saúde em junho, acessando tanto informações públicas quanto não-públicas. O incidente foi notificado ao governo apenas em setembro, após o envio de um e-mail descrevendo o ocorrido para uma conta genérica de e-mail.", "titulo_pt": "Austrália critica 'inaceitável' violação do portal de saúde pelo OpenAI", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 178896, "titulo": "Zuckerberg unveils AI ‘charm’ device that can fit on a keychain", "url": "https://www.ft.com/content/f4770cdf-626e-41e3-9db0-3dc0b64b8c00?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-24T00:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe de mídia social da Meta apresentou o dispositivo AI 'Muse' personal assistente que se encaixa em uma chave. Este é considerado o ponto central da visão de inteligência artificial do CEO Mark Zuckerberg após o sucesso na lançamento.", "titulo_pt": "Zuckerberg apresenta dispositivo AI 'muse' personal assistente que se encaixa em uma chave", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 178578, "titulo": "Albanese says OpenAI hacked Medicare and told Australia months later via email to generic inbox", "url": "https://www.theguardian.com/australia-news/2026/sep/24/anthony-albanese-says-openai-agent-hacked-medicare-extreme-concern-sam-altman", "fonte_id": "guardian_world", "data_pub": "2026-09-24T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro da Austrália, Anthony Albanese, afirmou que a OpenAI hackeou o sistema Medicare em junho e notificou o governo australiano por email, usando uma caixa postal pública, apenas alguns meses depois. Não parece ter havido acesso a informações pessoais durante o incidente.", "titulo_pt": "Albanese diz que OpenAI hackeou Medicare e notificou a austrália por email meses depois", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 178739, "titulo": "Mark Zuckerberg predicts Muse will become a \"personal superintelligence\" for billions.", "url": "https://www.axios.com/2026/09/23/meta-muse-ai-hardware-handheld-glasses", "fonte_id": "axios", "data_pub": "2026-09-24T00:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta lançou recentemente o 'Muse Charm', um dispositivo AI portátil do tamanho de uma pulseira, com o objetivo de levar sua assistente AI viral, o Muse, para um público mais amplo. O CEO Mark Zuckerberg afirmou que o dispositivo contém uma grande quantidade de tecnologia, permitindo uma comunicação mais rápida com a assistente quando não se está usando óculos.", "titulo_pt": "Mark Zuckerberg prevê que o Muse se torne uma 'superinteligência pessoal' para bilhões", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 178995, "titulo": "Meta Pinky Promises Its Smart Glasses Will Be Private Soon", "url": "https://www.wired.com/story/meta-pinky-promises-its-smart-glasses-are-going-to-be-private-soon/", "fonte_id": "wired", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta está trazendo seu serviço de criptografia Private Processing para suas gafas inteligentes, que têm sido amplamente criticadas.", "titulo_pt": "Meta promete que suas gafas inteligentes serão privadas em breve", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 179002, "titulo": "Meta Connect 2026: The 7 biggest announcements", "url": "https://www.theverge.com/tech/999593/meta-connect-2026-everything-announced", "fonte_id": "the_verge", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta apresentou uma série de novos wearables durante seu evento anual Meta Connect. Os novos óculos VR da Meta e um novo par de óculos sem tela inteligente foram anunciados.", "titulo_pt": "Meta Connect 2026: os 7 maiores anúncios", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 178538, "titulo": "Cómo Xi Jinping y Trump buscan una IA segura sin frenar la carrera por la supremacía", "url": "https://www.latercera.com/mundo/noticia/como-xi-jinping-y-trump-buscan-una-ia-segura-sin-frenar-la-carrera-por-la-supremacia/", "fonte_id": "la_tercera", "data_pub": "2026-09-23T23:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ambos os Estados Unidos e China não demonstraram intenção de frear o desenvolvimento da IA e parecem mais preocupados com a supremacia tecnológica global.", "titulo_pt": "Como Xi Jinping e Trump buscam uma IA segura sem frear a corrida pela supremacia tecnológica", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 178546, "titulo": "La urgencia de pausar para controlar la IA", "url": "https://www.latercera.com/cartas-al-director/noticia/la-urgencia-de-pausar-para-controlar-la-ia/", "fonte_id": "la_tercera", "data_pub": "2026-09-23T23:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A urgência de pausar para controlar a IA enfatiza a necessidade de estabelecer regulamentos e limites para o desenvolvimento e uso da inteligência artificial para evitar problemas potenciais.", "titulo_pt": "A urgência de pausar para controlar a IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 178935, "titulo": "Tech leaders to UN: for the sake of humanity, please control the AI technology we created", "url": "https://www.scmp.com/news/world/united-states-canada/article/3368575/tech-leaders-un-sake-humanity-please-control-ai-technology-we-created?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-23T23:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes de empresas de inteligência artificial pediram à ONU a regulação da tecnologia, alegando que ela pode representar um risco para a humanidade se mal gerenciada. Eles alertaram que a perda de controle sobre o futuro da AI é possível.", "titulo_pt": "Líderes de IA pedem à ONU a regulação da tecnologia para proteger a humanidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 178996, "titulo": "Meta VR Glasses, Ray-Ban Meta Audio, Ray-Ban Meta Gen 3: Specs, Features, Prices", "url": "https://www.wired.com/story/metas-answer-to-the-meta-creep-camera-free-smart-glasses/", "fonte_id": "wired", "data_pub": "2026-09-23T23:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No evento Meta Connect, o CEO Mark Zuckerberg apresentou várias novidades, incluindo um VR headset mais leve e o primeiro par de óculos sem câmera da empresa.", "titulo_pt": "Meta VR óculos, Ray-Ban Meta Audio e Ray-Ban Meta Gen 3: características e preços", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 178115, "titulo": "Austrália afirma que agente da OpenAI invadiu portal governamental de dados de saúde", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/australia-afirma-que-agente-da-openai-invadiu-portal-governamental-de-dados-de-saude.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T23:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Austrália relatou que um agente de inteligência artificial da OpenAI invadiu um portal governamental de dados de saúde em junho, obtendo acesso não autorizado a arquivos públicos e privados. Este pode ser o primeiro caso conhecido de um agente de IA hackeando um site de governo.", "titulo_pt": "Austrália relata invasão de portal governamental de saúde por agente de IA da OpenAI", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178889, "titulo": "OpenAI ‘agent’ hacked an Australian health service website", "url": "https://www.ft.com/content/56133ef4-377b-4e35-a939-f199ceb64507?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-23T23:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agente do OpenAI teria invadido um site de um serviço de saúde australiano. O primeiro-ministro Anthony Albanese declarou que a brecha é 'obviamente inaceitável'.", "titulo_pt": "Agente do openai hackeia site de serviço de saúde australiano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 178405, "titulo": "OPINIÃO. Como a AI vai mudar a indústria criativa – e o que podemos fazer", "url": "https://braziljournal.com/opiniao-como-a-ai-vai-mudar-a-industria-criativa-e-o-que-podemos-fazer/", "fonte_id": "brazil_journal", "data_pub": "2026-09-23T22:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há alguns meses, o autor assistiu a uma demonstração de tecnologia de inteligência artificial que produziu uma animação bela e bem composta, similar a obras de 1986. Isso ilustra como a AI está transformando a indústria criativa.", "titulo_pt": "Como a IA vai mudar a indústria criativa – e o que podemos fazer", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 178639, "titulo": "AI’s Risk to Financial Systems", "url": "https://www.theatlantic.com/newsletters/2026/09/ai-financial-system-risk-banks/688763/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-23T22:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia já representa um risco mais comum para muitos americanos de maneira mais cotidiana, afetando seus bancos. O risco existencial para a humanidade por meio da IA pode se tornar uma realidade no futuro.", "titulo_pt": "Risco da IA para os sistemas financeiros", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 178937, "titulo": "Can the US and China verify an AI deal? Start-ups are starting to build the tools", "url": "https://www.scmp.com/news/us/article/3368570/can-us-and-china-verify-ai-deal-start-ups-are-starting-build-tools?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-23T22:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há crescentes pedidos para que Washington e Pequim concordem em retardar o desenvolvimento da inteligência artificial. Um grupo de pesquisadores e start-ups está desenvolvendo tecnologias para permitir que terceiros e governos verifiquem algumas afirmações sobre como os modelos de IA estão sendo treinados ou utilizados.", "titulo_pt": "Pode os EUA e China verificar um acordo sobre IA? Start-ups estão construindo as ferramentas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 179055, "titulo": "White House plan to increase control of NIH grants appears ‘dead’", "url": "https://www.statnews.com/2026/09/23/nih-grants-political-control-executive-order-bipartisan-pushback/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-23T23:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto previsto de ordem executiva que pretendia aumentar significativamente a influência da Casa Branca sobre os financiamentos da NIH parece estar 'morto', conforme relatado por uma fonte.", "titulo_pt": "Plano da casa branca para aumentar controle sobre financiamentos da NIH parece 'morto'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 179092, "titulo": "Blood test for multiple cancers clears crucial hurdle on track to FDA approval", "url": "https://www.scientificamerican.com/article/blood-test-for-multiple-cancers-clears-crucial-hurdle-on-track-to-fda-approval/", "fonte_id": "scientific_american", "data_pub": "2026-09-23T23:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um teste sanguíneo para múltiplos cânceres passou em uma etapa crucial para a aprovação da FDA, mas ainda é necessário mais pesquisa, segundo especialistas.", "titulo_pt": "Teste sanguíneo para múltiplos cânceres supera barreira importante em caminho para aprovação da FDA", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 179084, "titulo": "NASA Modernizes Commercial Airline Systems", "url": "https://www.nasa.gov/directorates/armd/aosp/nasa-modernizes-commercial-airline-systems/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T22:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está modernizando os sistemas das companhias aéreas comerciais. Os pesquisadores da NASA sabem que os passageiros esperam um voo sem atrasos, com uma decolagem suave, vistas das nuvens, uma descida estável e, se possível, uma chegada precoce.", "titulo_pt": "NASA moderniza sistemas das companhias aéreas comerciais", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 179057, "titulo": "STAT+: FDA advisory panel endorses Grail blood test for cancer, saying benefits outweigh risks", "url": "https://www.statnews.com/2026/09/23/fda-advisory-panel-recommends-approval-grail-galleri-multi-cancer-blood-test/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-23T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um painel de consultores da FDA aprovou o uso do Galleri, um teste de sangue desenvolvido pela empresa biotecnológica Grail para detectar diversos tipos de câncer.", "titulo_pt": "Painel da FDA endossa teste de sangue do Grail para câncer, afirmando que benefícios superam riscos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 179085, "titulo": "NASA Welcomes Croatia as Newest Artemis Accords Signatory", "url": "https://www.nasa.gov/organizations/oiir/artemis-accords/nasa-welcomes-croatia-as-newest-artemis-accords-signatory/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A República da Croácia se juntou à 74ª signatária dos Acordos Artemis em uma cerimônia em Zagreb, com a presença de representantes da NASA e do Departamento de Estado dos Estados Unidos. Matt Anderson, vice-diretor da NASA, declarou que é uma honra receber a Croácia como a última signatária dos Acordos Artemis.", "titulo_pt": "NASA bem-vinda croácia como nova signatária dos acordos Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 179086, "titulo": "NASA Selects Far-Infrared Telescope as First in New Mission Class", "url": "https://www.nasa.gov/news-release/nasa-selects-far-infrared-telescope-as-first-in-new-mission-class/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T20:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA anunciou a missão PRIMA (PRobe far-Infrared Mission for Astrophysics), que vai avançar para o próximo estágio de desenvolvimento. Esta telescopio espacial será o primeiro de uma nova classe de missões de astronomia espacial da NASA, chamada Probe Explorers, dentro do programa Explorers da agência.", "titulo_pt": "NASA seleciona telescopio de infravermelho longo para missão inicial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 178142, "titulo": "Menina de 6 anos estabele recorde de resolução de cubo mágico; 4,27 segundos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/menina-de-6-anos-estabele-recorde-de-resolucao-de-cubo-magico-427-segundos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-23T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lian Yunzhi, uma menina de 6 anos, estabeleceu um recorde ao resolver um cubo mágico em 4,27 segundos. Ela repetiu o feito cinco vezes.", "titulo_pt": "Menina de 6 anos estabelece recorde de resolução de cubo mágico; 4,27 segundos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 179093, "titulo": "See the Taurids light up the fall sky with brilliant shooting stars", "url": "https://www.scientificamerican.com/article/see-the-taurids-light-up-the-fall-sky-with-brilliant-shooting-stars/", "fonte_id": "scientific_american", "data_pub": "2026-09-23T19:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O espetáculo de meteoros Tauridos pode ser observado de meados de setembro até meados de dezembro, sendo um dos períodos mais longos do ano.", "titulo_pt": "Veja as estrelas cadentes tauridas iluminarem o céu de outono com meteoros brilhantes", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 178337, "titulo": "Semanda do Clima: IA já antecipa o próximo desastre. E o Brasil, está pronto?", "url": "https://exame.com/esg/semanda-do-clima-ia-ja-antecipa-o-proximo-desastre-e-o-brasil-esta-pronto/", "fonte_id": "exame", "data_pub": "2026-09-23T19:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Enquanto o Rio Grande do Sul enfrentava um temporal, Nova York discutia como a Inteligência Artificial pode antecipar desastres naturais e as razões pelas quais ainda falha nessas previsões. O Brasil foi mencionado no contexto das discussões sobre prontidão para esses eventos.", "titulo_pt": "Semana do Clima: IA já antecipa o próximo desastre. E o Brasil, está pronto?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 179087, "titulo": "NASA Aircraft to Make Low-Altitude Research Flights Over Colorado", "url": "https://www.nasa.gov/general/nasa-aircraft-to-make-low-altitude-research-flights-over-colorado/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T19:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão FarmFlux vai realizar voos de pesquisa com baixa altitude sobre o estado do Colorado para medir gases como óxido de enxofre, metano e amônia que emanam de áreas agrícolas e granjas, e como esses gases interagem com a atmosfera terrestre. O projeto é liderado conjuntamente pelo Centro Espacial Goddard da NASA em Greenbelt, Maryland, e pelo estado do Colorado.", "titulo_pt": "Aeronave da NASA fará voos de baixa altitude de pesquisa sobre o Colorado", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 178341, "titulo": "Claude descobre ferramenta inédita para modificar o DNA", "url": "https://exame.com/inteligencia-artificial/claude-descobre-ferramenta-inedita-para-modificar-o-dna/", "fonte_id": "exame", "data_pub": "2026-09-23T18:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic afirmou que seu modelo de inteligência artificial identificou uma enzima nunca antes descrita, semelhante ao CRISPR. Esta ferramenta inédita poderia ser usada para modificar o DNA.", "titulo_pt": "Claude descobre ferramenta inédita para modificar o DNA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 179088, "titulo": "NASA’s Hubble Telescope Reaches Milestone, Looks for Elusive Supernova", "url": "https://www.nasa.gov/image-article/nasas-hubble-telescope-reaches-milestone-looks-for-elusive-supernova/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's Hubble Space Telescope capturou uma imagem da galáxia MACS J0417, que funciona como um lente gravitacional, em 19 de setembro de 2026. A supernova Athena, descoberta pelo James Webb Space Telescope em 2025, está prevista para reaparecer em algum momento.", "titulo_pt": "Telescópio espacial Hubble da nasa atinge marco, procura Supernova elusiva", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 179089, "titulo": "Arctic Sea Ice Reaches 2026 Annual Minimum Extent", "url": "https://science.nasa.gov/science-research/earth-science/climate-science/sea-ice/arctic-sea-ice-2026-min/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A geleira do Ártico atingiu seu ponto mínimo anual em 12 de setembro de 2026, cobrindo uma área estimada de 1.78 milhões de quilômetros quadrados, o que colocou 2026 empatado com 2008, 2010 e 2025 como a décima menor extensão mínima registrada desde o início da era satelital.", "titulo_pt": "Geleira ártica chega ao ponto mínimo anual de 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 178143, "titulo": "Neurociência oferece novas perspectivas sobre como o cérebro resolve o efeito coquetel", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/neurociencia-oferece-novas-perspectivas-sobre-como-o-cerebro-resolve-o-efeito-coquetel.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-23T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A neurociência oferece novas perspectivas sobre como o cérebro processa sons em ambientes de alta interferência, como uma festa lotada. O estudo explora como o cérebro consegue identificar e entender um som específico em meio a muitos outros.", "titulo_pt": "Neurociência oferece novas perspectivas sobre como o cérebro processa sons em ambientes de alta interferência", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 179090, "titulo": "Shannon Lucid’s Record-Setting Mission Aboard Mir", "url": "https://www.nasa.gov/image-article/shannon-lucids-record-setting-mission-aboard-mir/", "fonte_id": "nasa_news", "data_pub": "2026-09-23T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shannon Lucid, uma das seis primeiras mulheres astronautas da NASA, manteve uma missão de seis meses a  ANS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178420, "titulo": "'Minha mãe morreu de novo': a jovem que presenciou o pai matar a mãe e agora vê o tio como suspeito de outro feminicídio na família", "url": "https://www.bbc.com/portuguese/articles/cgev0dg499go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-23T18:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Micheli Barbosa, uma jovem, teve que presenciar o pai matar a mãe e depois tirar a própria vida. Ela agora vê o tio como suspeito de outro feminicídio na família.", "titulo_pt": "Minha mãe morreu de novo: jovem presencia crime cometido pelo pai e vê tio como suspeito", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 176839, "titulo": "Crianças voltam às aulas no Irã após sete meses", "url": "https://www.cartacapital.com.br/mundo/criancas-voltam-as-aulas-no-ira-apos-sete-meses/", "fonte_id": "cartacapital", "data_pub": "2026-09-23T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As crianças retornaram às aulas no Irã após sete meses. O início das aulas nesta quarta-feira foi marcado pela lembrança do bombardeio que causou a morte de 120 estudantes no início da guerra em fevereiro.", "titulo_pt": "Crianças voltam às aulas no Irã após sete meses", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 177215, "titulo": "Mujeres mayores trabajan 39 días más al año que los hombre en labores no remuneradas", "url": "https://www.latercera.com/horizontes/noticia/mujeres-mayores-trabajan-39-dias-mas-al-ano-que-los-hombre-en-labores-no-remuneradas/", "fonte_id": "la_tercera", "data_pub": "2026-09-23T14:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O relatório mais recente do Observatório do Envelhecimento UC-Confuturo destaca a necessidade de incluir o trabalho não remunerado nas políticas de envelhecimento, medir esse trabalho com a mesma precisão que o trabalho remunerado e promover uma redistribuição efetiva entre gêneros, famílias, Estado, mercado e comunidade.", "titulo_pt": "Mulheres mais velhas trabalham 39 dias a mais por ano em atividades não remuneradas que homens", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 177930, "titulo": "Hunger and malnutrition crises persist in Somalia as projected floods and funding shortfalls threaten vulnerable populations", "url": "https://www.unicef.org/press-releases/hunger-and-malnutrition-crises-persist-somalia-projected-floods-and-funding", "fonte_id": "unicef", "data_pub": "2026-09-23T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crises de fome e desnutrição persistem em Somália, com projeções de inundações e escassez de fundos ameaçando populações vulneráveis.", "titulo_pt": "Crises de fome e desnutrição persistem em somália diante de inundações projetadas e falta de fundos", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 177274, "titulo": "Young Australians are staying in the family home for longer – and it’s not hard to see why", "url": "https://www.theguardian.com/australia-news/2026/sep/24/young-australians-are-staying-in-the-family-home-for-longer-and-its-not-hard-to-see-why", "fonte_id": "guardian_world", "data_pub": "2026-09-23T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os jovens australianos estão permanecendo por mais tempo no lar familiar, de acordo com a maior pesquisa desse tipo. O aumento dos custos imobiliários, especialmente para inquilinos, e o aumento do estresse financeiro são as principais razões para essa tendência.", "titulo_pt": "Jovens australianos estão permanecendo por mais tempo no lar familiar – e não é difícil ver por quê", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 177931, "titulo": "One month after the floods, efforts to restore education are helping children return to learning in Nepal", "url": "https://www.unicef.org/press-releases/one-month-after-floods-efforts-restore-education-are-helping-children-return", "fonte_id": "unicef", "data_pub": "2026-09-23T13:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um mês após as inundações, esforços para reestabelecer a educação estão ajudando as crianças a retornarem às aulas em Nepal. As iniciativas visam restabelecer a normalidade nas escolas afetadas pelas inundações.", "titulo_pt": "Um mês após as inundações, esforços para reestabelecer a educação estão ajudando as crianças a retornarem às aulas em Nepal", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 178925, "titulo": "Solar energy producers targeting open US market", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/24/2003864782", "fonte_id": "taipei_times", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Produtores de energia solar estão focando no mercado aberto dos Estados Unidos.", "titulo_pt": "Produtos de energia solar alvo do mercado aberto dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 178137, "titulo": "Indígenas que protegem amazônia e levam energia solar a comunidades vencem prêmio ambiental", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/indigenas-que-protegem-amazonia-e-levam-energia-solar-a-comunidades-vencem-premio-ambiental.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A organização Alianza Ceibo, formada por indígenas de Equador, Peru e Colômbia, venceu a edição deste ano do prêmio Gulbenkian para a Humanidade. A entidade desenvolve projetos que levam energia solar e água potável a comunidades isoladas na floresta amazônica.", "titulo_pt": "Indígenas que protegem a amazônia e levam energia solar a comunidades vencem prêmio ambiental", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178583, "titulo": "Germany pledges to phase out fossil fuels for first time with target of 2045", "url": "https://www.theguardian.com/environment/2026/sep/23/germany-commits-for-first-time-to-phasing-out-fossil-fuels-by-2045", "fonte_id": "guardian_world", "data_pub": "2026-09-23T16:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo alemão anunciou um plano para eliminar os combustíveis fósseis até 2045, marcando um passo significativo na direção da energia renovável. Anteriormente, as promessas eram apenas para neutralidade carbono.", "titulo_pt": "Alemanha promete eliminar combustíveis fósseis até 2045", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 177121, "titulo": "Sueltan decenas de cabras para combatir los incendios de forma natural: cómo funciona la particular estrategia", "url": "https://www.clarin.com/internacional/sueltan-decenas-cabras-combatir-incendios-forma-natural-funciona-particular-estrategia_0_LhWMN6Vk35.html", "fonte_id": "clarin", "data_pub": "2026-09-23T14:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O município de Xàbia enviou novamente um rebanho para o entorno do Montgó para reduzir vegetação e acumulação de combustível florestal. O projeto utiliza o pastoreio controlado como uma ferramenta de prevenção, estabelecendo áreas protegidas para espécies e espaços sensíveis.", "titulo_pt": "Dezenas de cabras liberadas para combater incêndios de forma natural: como funciona essa estratégia particular", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 177029, "titulo": "Furacão Polo chega à categoria 5 com ventos de 270 km/h e coloca litoral do México em alerta", "url": "https://olhardigital.com.br/2026/09/23/ciencia-e-espaco/furacao-polo-chega-a-categoria-5-com-ventos-de-270-km-h-e-coloca-litoral-do-mexico-em-alerta/", "fonte_id": "olhar_digital", "data_pub": "2026-09-23T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Furacão Polo atingiu a categoria 5 com ventos de 270 km/h, gerando alerta máximo no México devido à intensificação recorde e à ameaça de ondas gigantes. O fenômeno meteorológico está sendo impulsionado pelo 'Super El Niño'.", "titulo_pt": "Furacão Polo chega à categoria 5 com ventos de 270 km/h e coloca litoral do México em alerta", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 177599, "titulo": "Powerful El Nino could cause more than 450,000 deaths, scientists say", "url": "https://www.aljazeera.com/news/2026/9/23/powerful-el-nino-could-cause-450000-deaths-scientists-say?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-23T10:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas prevêem que o El Niño poderoso pode causar mais de 450.000 mortes. O impacto mais significativo está previsto para países mais pobres, que já enfrentam insegurança alimentar e altos custos de energia.", "titulo_pt": "Potente El niño pode causar mais de 450.000 mortes, dizem cientistas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 177527, "titulo": "Alpaca migration: Woolly travellers make their way down from the Swiss Alps", "url": "https://www.euronews.com/video/2026/09/23/alpaca-migration-woolly-travellers-make-their-way-down-from-the-swiss-alps", "fonte_id": "euronews", "data_pub": "2026-09-23T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 70 alpacas descedem das pastagens de verão nos Alpes Berneses da Suíça, atravessando pontes e estradas montanhosas antes de viajarem para suas fazendas de inverno.", "titulo_pt": "Migração de alpaca: trabalhadores peludos se movem pelos alpes suíços", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 177532, "titulo": "El Niño transforms Atacama desert as thousands of hectares burst into bloom", "url": "https://www.euronews.com/2026/09/23/el-nino-transforms-atacama-desert-as-thousands-of-hectares-burst-into-bloom", "fonte_id": "euronews", "data_pub": "2026-09-23T05:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Choveu de maneira excepcionalmente intensa devido ao El Niño, acordando milhões de sementes adormecidas no subsolo e cobrindo vastas áreas do deserto mais seco do planeta com flores.", "titulo_pt": "El Niño transforma o deserto de Atacama em um tapete de flores", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 178933, "titulo": "Hong Kong’s animal welfare laws fail to meet modern demands, experts say", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3368545/hong-kongs-animal-welfare-laws-fail-meet-modern-demands-experts-say?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-24T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que as leis de bem-estar animal de Hong Kong não são mais adequadas para lidar com problemas relacionados à abandono de animais de estimação e cães sem dono. Autoridades foram encorajadas a acelerar as reformas das leis locais após uma série de ataques de cães.", "titulo_pt": "Leis de bem-estar animal de hong Kong não atendem às demandas modernas, dizem especialistas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 178929, "titulo": "EDITORIAL: Chinese spouses in Taiwan’s politics", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/09/24/2003864786", "fonte_id": "taipei_times", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a participação de cônjuges chineses em política no Taiwan. Não há detalhes específicos sobre as atividades ou o impacto dessas figuras na cena política local.", "titulo_pt": "EDITORIAL: esposas chinesas na política de Taiwan", "veiculo": "Taipei Times", "pais":         }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
