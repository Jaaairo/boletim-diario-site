ir com o Thor da Nvidia", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 264482, "titulo": "Starship completa pouso inédito após voo de mais de 22 horas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/starship-completa-pouso-inedito-apos-voo-de-225-horas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-14T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa SpaceX realizou pela primeira vez a recuperação de um segundo estágio de foguete na plataforma, após um voo de mais de 22 horas. Este é um passo importante para a rápida reutilização do veículo Starship.", "titulo_pt": "Starship realiza pouso inédito após voo de mais de 22 horas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 264802, "titulo": "A dead star is flashing radio waves every 8 minutes, and its partner looks a lot like the sun", "url": "https://phys.org/news/2026-11-dead-star-radio-minutes-partner.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde 2022, astrônomos têm estudado objetos cósmicos chamados transientes de rádio de longo período, que emitem flashes de rádio a cada 8 minutos. Esses objetos são encontrados em sistemas binários com uma pequena e fria estrela chamada rédula em órbita com um restos estelar conhecido como branco-dwarf.", "titulo_pt": "Estrela morta está emitindo ondas de rádio a cada 8 minutos e seu parceiro lembra muito o sol", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264525, "titulo": "Gatos têm \"miado estratégico\" para pedir ajuda a humanos, diz estudo da USP", "url": "https://www.metropoles.com/sao-paulo/gatos-tem-miado-estrategico-para-pedir-ajuda-a-humanos-diz-estudo-da-usp", "fonte_id": "metropoles", "data_pub": "2026-11-14T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadoras da USP analisaram o comportamento de 38 gatos e constataram que eles emitem um 'miado estratégico' para pedir ajuda aos humanos em situações específicas.", "titulo_pt": "Gatos têm 'miado estratégico' para pedir ajuda a humanos, diz estudo da USP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264571, "titulo": "Duelo de fenômenos: embate entre “Super El Niño” e vórtice polar intriga cientistas e promete surpresas durante o inverno no Hemisfério Norte", "url": "https://www.cnnbrasil.com.br/ciencia/duelo-de-fenomenos-embate-entre-super-el-nino-e-vortice-polar-intriga-cientistas-e-promete-surpresas-durante-o-inverno-no-hemisferio-norte/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T19:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um 'Super El Niño' global de aquecimento contrasta com o deslocamento de ar congelante para regiões da América do Norte e Europa, criando uma situação inusitada durante o inverno no Hemisfério Norte que intriga os cientistas.", "titulo_pt": "Duelo de fenômenos: embate entre 'Super El Niño' e vórtice polar intriga cientistas e promete surpresas durante o inverno no Hemisfério Norte", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264803, "titulo": "Does your culture shape how you look at art? What an eye‑tracking study in Sudan revealed", "url": "https://phys.org/news/2026-11-culture-art-eyetracking-sudan-revealed.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O antigo Dongola era uma localização habitada em um dos rios do norte do Sudão há centenas de anos. Hoje, Dongola é um assentamento abandonado às margens do Nilo.", "titulo_pt": "Sua cultura molda sua percepção de arte? O que um estudo de rastreamento ocular no sudão revelou", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264804, "titulo": "NASA's Voyager 1 closes in on a light-day in interstellar space for a new distance record", "url": "https://phys.org/news/2026-11-nasa-voyager-day-interstellar-space.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T18:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1 da NASA está prestes a se tornar o primeiro objeto humano a atingir uma distância de um dia-luz da Terra, enquanto se move cada vez mais para dentro do espaço interestelar.", "titulo_pt": "Voyager 1 da nasa se aproxima de um dia-luz de distância da terra em seu novo recorde de distância", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264805, "titulo": "A cosmic magnifying glass could reveal the same supernova two more times in roughly 70 years", "url": "https://phys.org/news/2026-11-cosmic-magnifying-glass-reveal-supernova.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Através do efeito de lente gravitacional causado por uma galáxia cluster e imagens de alta resolução do Telescópio Espacial James Webb, astrônomos descobriram uma supernova que ocorreu quando o universo tinha 4,9 bilhões de anos. A previsão é que outras imagens distorcidas da supernova Ares sejam observadas em aproximadamente 70 anos.", "titulo_pt": "Um telescópio espacial poderia revelar a mesma supernova duas vezes mais ao longo de 70 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264408, "titulo": "Some of the oldest rocks ever discovered shed light on Earth's early history", "url": "https://phys.org/news/2026-11-oldest-earth-early-history.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estimativas indicam que a Terra tem cerca de 4,5 bilhões de anos. Recentes descobertas de rochas na China datam de 3,95 bilhões de anos, sendo as mais antigas já conhecidas, e estão fornecendo novas informações sobre a formação e evolução da crosta terrestre.", "titulo_pt": "Algumas das rochas mais antigas já descobertas oferecem novos insights sobre a história inicial da terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264403, "titulo": "Do ice baths help muscles recover after a workout? A new study suggests not", "url": "https://www.scientificamerican.com/article/do-ice-baths-help-muscles-recover-after-a-workout-a-new-study-suggests-not/", "fonte_id": "scientific_american", "data_pub": "2026-11-14T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo sugere que banhos de água fria não são necessariamente a melhor maneira de se recuperar após o exercício. Não está claro que banhos de água fria sejam realmente a melhor opção para a recuperação pós-exercício.", "titulo_pt": "Banhos de água fria não são necessariamente a melhor maneira de se recuperar após o exercício, sugere novo estudo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 264437, "titulo": "This Week In Space podcast: Episode 236 — Alienspotting", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-236-alienspotting", "fonte_id": "space_com", "data_pub": "2026-11-14T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 236ª episódio do This Week In Space, Tariq Malik, Rod Pyle e Mikhail Tikhonov discutem sobre como a vida pode assumir formas mais incomuns, que podem não ser reconhecidas facilmente.", "titulo_pt": "Episódio 236 do this Week In Space: Alienspotting", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 264409, "titulo": "World's largest freshwater lake is recovering after decades of decline", "url": "https://phys.org/news/2026-11-world-largest-freshwater-lake-recovering.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O maior lago de água doce do mundo, o Lago Baikal na Sibéria, está se recuperando após décadas de declínio. O lago abriga cerca de 20% das águas doces do planeta e é um importante ambiente para a biodiversidade, tendo sido declarado Patrimônio Mundial da UNESCO em 1996.", "titulo_pt": "O maior lago de água doce do mundo está se recuperando após décadas de declínio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264309, "titulo": "NASA’s Voyager 1 to hit new space distance record of one light-day", "url": "https://www.aljazeera.com/news/2026/11/14/nasas-voyager-1-to-hit-new-space-distance-record-of-one-light-day?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1 foi lançado em 1977 e continua a enviar dados espaciais para uma equipe de cientistas da NASA.", "titulo_pt": "Voyager 1 deve bater novo recorde de distância no espaço de um dia-luz", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 263845, "titulo": "O que a relação entre um jumento e um touro revela sobre sexualidade", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/o-que-a-relacao-entre-um-jumento-e-um-touro-revela-sobre-sexualidade.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-14T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um planalto etíope, um touro chamado Aquiles estabeleceu uma relação incomum com um jumento chamado Pátroclo, passando tempo juntos, se lambendo e praticando sexo com penetração repetidamente.", "titulo_pt": "O que a relação entre um touro e um jumento revela sobre sexualidade", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 264438, "titulo": "'Alien: Fireteam Elite 2' is a good old-fashioned bug hunt, ironically plagued by bugs", "url": "https://www.space.com/entertainment/space-games/alien-fireteam-elite-2-is-a-good-old-fashioned-bug-hunt-ironically-plagued-by-bugs", "fonte_id": "space_com", "data_pub": "2026-11-14T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo 'Aliens: Fireteam Elite 2' é uma busca tradicional pelos Xenomorfos, mas enfrenta problemas técnicos. Os jogadores novamente sentem medo dos Xenomorfos, lembrando que as antigas buscas por inimigos devem continuar sendo relevantes.", "titulo_pt": "Aliens: fireteam Elite 2 é uma boa caça aos insetos tradicional, ironicamente assolada por bugs", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 264545, "titulo": "O que as pessoas veem em experiências de quase morte? Estudo encontra 4 padrões", "url": "https://exame.com/ciencia/o-que-as-pessoas-veem-em-experiencias-de-quase-morte-estudo-encontra-4-padroes/", "fonte_id": "exame", "data_pub": "2026-11-14T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores analisaram desenhos de 50 participantes que relataram experiências de quase morte, classificando 108 representações em diferentes categorias geométricas. O estudo identificou 4 padrões comuns nessas experiências.", "titulo_pt": "O que as pessoas veem em experiências de quase morte? Estudo encontra 4 padrões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264439, "titulo": "Why did Starship Flight 15 booster abort 'chopsticks' landing catch? SpaceX still investigating (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-says-starship-flight-15-booster-aborted-chopsticks-landing-catch-after-launch-due-to-guidance-issue-video", "fonte_id": "space_com", "data_pub": "2026-11-14T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX está investigando o motivo pelo qual o foguete Starship da missão 15 falhou no primeiro dos dois pousos planejados durante o teste realizado em 13 de novembro.", "titulo_pt": "Por que o Starship da missão 15 falhou no primeiro pouso planejado? Spacex ainda investigando", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 264468, "titulo": "Bao de polvo e onigiri de salmão estão entre os pratos mais vendidos do Folha Gourmet Festival", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/restaurantes/2026/11/bao-de-polvo-e-onigiri-de-salmao-estao-entre-os-pratos-mais-vendidos-do-folha-gourmet-festival.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-14T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os pratos mais vendidos do Folha Gourmet Festival neste sábado incluíram receitas tradicionais, como o bolinho de carne do Bar do Luiz Fernandes e a pizza marguerita da Veridiana, além de pratos criados para o evento, como o bao de polvo do Brisa do Barú.", "titulo_pt": "Bao de polvo e onigiri de salmão são alguns dos pratos mais vendidos no Folha Gourmet Festival", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 264636, "titulo": "Concluyó el Festival de Mar del Plata: un film iraní rodado en la clandestinidad ganó el premio mayor y Andrew Scott se llevó el galardón como actor", "url": "https://www.lanacion.com.ar/espectaculos/cine/concluyo-el-festival-de-mar-del-plata-un-film-irani-rodado-en-la-clandestinidad-gano-el-premio-mayor-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A película 'A Noite em que Arezou Desapareceu', dirigida por Arian Vazirdaftari, ganhou o prêmio principal do Festival de Mar del Plata. O ator Andrew Scott foi premiado na categoria de melhor ator. O festival terminou com 75.000 espectadores em 10 dias.", "titulo_pt": "Festival de Mar del Plata encerrou: filme iraniano venceu e ator britânico foi premiado", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264637, "titulo": "Por qué recomiendan ponerle canela y arena a la lengua de suegra", "url": "https://www.lanacion.com.ar/lifestyle/por-que-recomiendan-ponerle-canela-y-arena-a-la-lengua-de-suegra-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma técnica de jardim que se tornou viral nas redes sociais sugere o uso de canela e areia para proteger contra larvas de mosquitos. Este método é econômico e pode ser aplicado como uma alternativa para evitar infestações.", "titulo_pt": "Por que recomendam usar canela e areia na língua de sapo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264490, "titulo": "Circuito Cultural começa no Rio com celebração da Consciência Negra", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/circuito-cultural-comeca-no-rio-com-celebracao-da-consciencia-negra", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-14T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Circuito Cultural Instituto 12 – Conexões Criativas começou no Rio de Janeiro com uma série de eventos gratuitos, incluindo exposições, palestras, shows e espetáculos de dança, focando na relação entre arte, meio ambiente, sociedade e cidade. A curadoria é de João Vergara, doutor em Arte.", "titulo_pt": "Circuito Cultural começa no Rio com celebração da Consciência Negra", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 264809, "titulo": "Is ‘Club Kid’ a ‘Conservative’ Movie? Only If You’re Still Living in the ’60s", "url": "https://variety.com/2026/film/columns/is-club-kid-a-conservative-movie-jordan-firstman-1236947691/", "fonte_id": "variety", "data_pub": "2026-11-14T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Club Kid' pode ter múltiplos significados, o que torna difícil definir seu tema principal. A profundidade do filme pode levar a descobertas inesperadas sobre sua essência.", "titulo_pt": "É 'Club Kid' um filme conservador? Apenas se você ainda vive nos anos 60", "veiculo": "Variety", "pais": "EUA", "cla h, não foi avançado pela empresa.", "titulo_pt": "Adam Driver critica decisão da Disney sobre filme de Ben Solo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 264674, "titulo": "Movilh cifra en 80 mil asistentes a Santiago Parade y anuncia posible demanda internacional por multa", "url": "https://www.latercera.com/nacional/noticia/movilh-cifra-en-80-mil-asistentes-a-santiago-parade-y-anuncia-posible-demanda-internacional-por-multa/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T19:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A organização Movilh anunciou que cerca de 80 mil pessoas participaram da Santiago Parade, onde exigiram avanços na reforma da Lei Zamudio. A entidade ameaçou recorrer à Comissão Interamericana de Direitos Humanos se a justiça não anular uma multa aplicada durante a Marcha do Orgulho.", "titulo_pt": "Movilh estima 80 mil participantes na Santiago Parade e ameaça demanda internacional", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264818, "titulo": "Hoobastank, Simple Plan Play Mid-Flight Concert Aboard Warped Tour-Bound Plane", "url": "https://www.rollingstone.com/music/music-news/hoobastank-simple-plan-concert-warped-tour-plane-1235658405/", "fonte_id": "rolling_stone_music", "data_pub": "2026-11-14T19:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Used e LØLØ também se apresentaram durante o concerto ao vivo às 35.000 pés organizado pela Southwest Airlines, que ocorreu simultaneamente a um encerramento nacional das viagens aéreas.", "titulo_pt": "Hoobastank e Simple Plan performem concertos em voo durante encerramento nacional das viagens aéreas", "veiculo": "Rolling Stone - Música", "pais": "EUA", "classe": "C"}, {"id": 264473, "titulo": "Turistas viajam 10 mil km para jantar no Evvai após 3ª estrela Michelin, diz chef em festival da Folha", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com o-y-quedo-en-bancarrota-el-actor-de-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Larry Fine foi um comediante famoso como parte do trio 'Os Três Chiflados', mas enfrentou problemas financeiros após o sucesso diminuir, chegando a ficar em um asilo de idosos. Ele perdeu seu filho, seus amigos não devolveram o dinheiro emprestado e acabou em situação de bancarrota.", "titulo_pt": "Seu filho morreu, seus amigos nunca lhe devolveram o dinheiro emprestado e ele ficou em um asilo: o comediante que se tornou bancarrota", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264240, "titulo": "Lo que el presupuesto no dice en educación", "url": "https://www.ciperchile.cl/2026/11/14/lo-que-el-presupuesto-no-dice-en-educacion/?utm_source=rss&utm_medium=rss&utm_campaign=lo-que-el-presupuesto-no-dice-en-educacion", "fonte_id": "ciper_chile", "data_pub": "2026-11-14T16:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute aspectos da educação que não são abordados no orçamento. O título traduzido para português brasileiro é: O que o orçamento não revela sobre educação.", "titulo_pt": "O que o orçamento não revela sobre educação", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 263938, "titulo": "Menina de 13 anos é dopada e estuprada por amigo do pai no Entorno do DF", "url": "https://www.metropoles.com/distrito-federal/na-mira/menina-de-13-anos-e-dopada-e-estuprada-por-amigo-do-pai-no-entorno-do-df", "fonte_id": "metropoles", "data_pub": "2026-11-14T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma menina de 13 anos foi dopada e estuprada por um amigo do pai, no Entorno do Distrito Federal. Os abusos ocorreram com o conhecimento e consentimento do pai da vítima, que também foi detido.", "titulo_pt": "Menina de 13 anos é dopada e estuprada por amigo do pai no Entorno do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264075, "titulo": "Viajaban a un funeral y terminaron detenidos por el ICE: quiénes son los dos acróbatas argentinos arrestados en Estados Unidos", "url": "https://www.clarin.com/sociedad/viajaban-funeral-terminaron-detenidos-ice-acrobatas-argentinos-arrestados-estados-unidos_0_t29skALYWM.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gustavo Romanello e Agustín Baccega, acrobatas argentinos com permissões de trabalho válidas, foram detidos pelo ICE enquanto processavam seus pedidos de asilo. Eles serão submetidos ao processo legal e permanecerão sob custódia do ICE.", "titulo_pt": "Dois acrobatas argentinos são detidos pelo ICE enquanto viajavam para um funeral", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 264077, "titulo": "\"Preparó el hecho\": piden 14 años y medio de cárcel para el acusado de apuñalar a dos bailarinas en una escuela de danza en Palermo", "url": "https://www.clarin.com/policiales/preparo-hecho-piden-14-anos-medio-carcel-acusado-apunalar-bailarinas-em-escuela-danza-palermo_0_IyJP1iQ10a.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Sebastián Damián Villareal (36) está sendo julgado por um ataque que feriu duas bailarinas em uma escola de dança em Palermo em novembro de 2020. A fiscalia reconhece que o acusado tem um trastorno de personalidade, mas não é delirante nem psicótico.", "titulo_pt": "Preparou o fato: acusado de apuñalar duas bailarinas em escola de dança em Palermo pede 14 anos e meio de prisão", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 263855, "titulo": "'Há total desconexão entre discurso e prática', diz CEO sobre políticas de inclusão nas empresas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/ha-total-desconexao-entre-discurso-e-pratica-diz-ceo-sobre-politicas-de-inclusao-nas-empresas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wellington Vitorino, CEO do Instituto Four, afirma que há uma desconexão entre o discurso e a prática em relação às políticas de inclusão nas empresas. Segundo ele, isso se intensificou desde a eleição de Donald Trump, levando a um retrocesso nas políticas de inclusão no meio corporativo.", "titulo_pt": "Há total desconexão entre discurso e prática em políticas de inclusão nas empresas, diz CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263417, "titulo": "Onde está o preso? A pergunta que a família faz ao Google e o Estado ainda não responde", "url": "https://www.jota.info/opiniao-e-analise/artigos/onde-esta-o-preso-a-pergunta-que-a-familia-faz-ao-google-e-o-estado-ainda-nao-responde", "fonte_id": "jota", "data_pub": "2026-11-14T09:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Famílias buscam informações sobre presos em sistemas estaduais, enquanto o sistema nacional do CNJ não tem dados atualizados. O sistema do CNJ foi projetado para armazenar essas informações, mas ainda não responde adequadamente às necessidades das famílias.", "titulo_pt": "Onde está o preso? A pergunta que a família faz ao Google e ao Estado ainda não responde", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263419, "titulo": "Um movimento convergente pela alfabetização na América Latina", "url": "https://www.jota.info/opiniao-e-analise/artigos/um-movimento-convergente-pela-alfabetizacao-na-america-latina", "fonte_id": "jota", "data_pub": "2026-11-14T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A América Latina enfrenta o desafio de implementar políticas eficazes de alfabetização nas salas de aula e garantir sua implementação através dos diferentes níveis de governo.", "titulo_pt": "Movimento convergente pela alfabetização na América Latina", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263469, "titulo": "La paradoja de la democracia en Chile: ocho de cada diez valoran cuidarla, pero pocos creen que se contribuya a ello", "url": "https://www.latercera.com/nacional/noticia/la-paradoja-de-la-democracia-en-chile-ocho-de-cada-diez-valoran-cuidarla-pero-pocos-creen-que-se-contribuya-a-ello/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa intitulada 'Cuidar a democracia hoje', realizada por Mais para Chile e Tenemos que Hablar de Chile, explora como os chilenos percebem o sistema atual e como ele poderia ser melhor mantido. O levantamento revela que oito em cada dez chilenos valorizam a democracia, mas poucos acreditam que contribuem para seu cuidado.", "titulo_pt": "Paradoxo da democracia chilena: maioria valoriza, mas poucos acreditam em contribuição", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263476, "titulo": "El 55% de los jóvenes de entre 18 y 34 años del Biobío recomendaría irse a Santiago para buscar trabajo", "url": "https://www.latercera.com/esto-es-chile/noticia/el-55-de-los-jovenes-de-entre-18-y-34-anos-del-biobio-recomendaria-irse-a-santiago-para-buscar-trabajo/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que 55% dos jovens entre 18 e 34 anos da região do Biobío considerariam migrar para Santiago em busca de emprego. Além disso, 58% desses jovens avaliam negativamente as condições de emprego em sua região.", "titulo_pt": "55% Dos jovens biobenses de 18 a 34 anos considerariam migrar para Santiago por causa do mercado de trabalho", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263356, "titulo": "Alfabetização na idade certa pode beneficiar 1 milhão de jovens em 4 anos", "url": "https://www.cnnbrasil.com.br/educacao/alfabetizacao-na-idade-certa-pode-beneficiar-1-milhao-de-jovens-em-4-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Instituto Natura e da Lupa Social indica que aumentar o percentual de crianças alfabetizadas aos 7 anos para 95% poderia beneficiar 1 milhão de jovens ao concluir o Ensino Médio em quatro anos.", "titulo_pt": "Alfabetização na idade certa pode beneficiar 1 milhão de jovens em 4 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263218, "titulo": "Jovens avançam sobre renda e patrimônio antes concentrados nos idosos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/jovens-avancam-sobre-renda-e-patrimonio-antes-concentrados-nos-idosos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os protestos na França destacaram a reclamação de que as gerações mais jovens têm sido marginalizadas em comparação com os baby boomers, que supostamente monopolizaram as melhores oportunidades de carreira, aposentadorias e propriedades. Os jovens enfrentam desafios como moradia cara e empregos precários.", "titulo_pt": "Jovens avançam sobre renda e patrimônio antes concentrados nos idosos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 264366, "titulo": "Afghanistan’s olive groves give farmers hope", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/15/2003867744", "fonte_id": "taipei_times", "data_pub": "2026-11-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pomares de oliveiras em Afganistão estão dando esperança aos agricultores locais. Essa atividade agrícola está ajudando a melhorar as condições econômicas das comunidades rurais.", "titulo_pt": "Os pomares de oliveiras dão esperança aos agricultores afegãos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 264629, "titulo": "El generoso gesto de Harrison Ford: donó 150 hectáreas de su rancho en Wyoming para proteger la naturaleza", "url": "https://www.lanacion.com.ar/espectaculos/el-generoso-gesto-de-harrison-ford-dono-150-hectareas-de-su-rancho-en-wyoming-para-proteger-la-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Harrison Ford doou 150 hectares de seu rancho em Wyoming para proteger a natureza. O ator blindou legalmente parte de sua propriedade para preservar a biodiversidade local contra especulações comerciais.", "titulo_pt": "A generosa ação de Harrison Ford: doou 150 hectares de seu rancho em Wyoming para proteger a natureza", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264663, "titulo": "Crecida del río El Carmen: gobernador de Atacama pide a Kast decretar estado de emergencia por deshielos", "url": "https://www.latercera.com/nacional/noticia/crecida-del-rio-el-carmen-gobernador-de-atacama-pide-a-kast-decretar-estado-de-emergencia-tras-deshielos/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T21:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma crescente no rio El Carmen levou o governador de Atacama a pedir ao presidente Kast que decretasse estado de emergência devido a deshielos. O fenômeno causou danos em infraestruturas hídricas e deixou famílias isoladas na comuna de Alto do Carmen. A Senapred ativou avisos de alerta SAE e recomendou evitar aproximações à margem do rio.", "titulo_pt": "Crescida no rio El Carmen: governador de Atacama solicita estado de emergência a Kast", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264665, "titulo": "Armada emite aviso por probables trombas marinas entre Arauco y Los Ríos", "url": "https://www.latercera.com/servicios/noticia/armada-emite-aviso-por-probables-trombas-marinas-entre-arauco-y-los-rios/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T21:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Marinha emitiu um aviso para trombas marinas entre as regiões de Arauco e Los Ríos. A alerta está em vigor de 11h00 às 21h00 deste domingo, 15 de novembro.", "titulo_pt": "Marinha emite aviso para trombas marinas entre Arauco e Los Ríos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 264786, "titulo": "For Bangladesh and others, climate disasters should not add to debt burdens", "url": "https://www.scmp.com/opinion/asia-opinion/article/3374115/bangladesh-and-others-climate-disasters-should-not-add-debt-burdens", "fonte_id": "scmp", "data_pub": "2026-11-14T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões da COP31, a conferência de mudanças climáticas da ONU realizada em Antalya, Turquia, são cruciais para os países vulneráveis ao clima na Global South, incluindo o Bangladesh, que sofre as consequências das mudanças climáticas sem ter contribuído significativamente para as emissões globais. É fundamental que o financiamento para ação climática chegue a tempo, alcance os destinatários corretos e não aprofunde as dívidas.", "titulo_pt": "Para Bangladesh e outros, desastres climáticos não devem aumentar a carga de dívidas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264596, "titulo": "Agropecuária aposta em solo compartilhado com painéis solares", "url": "https://www.dw.com/pt-br/agropecuária-aposta-em-solo-compartilhado-com-painéis-solares/a-79950021?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-14T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agricultura e a produção solar estão explorando uma nova estratégia chamada agrivoltaica, que promete beneficiar tanto as culturas quanto a geração de energia renovável. No entanto, a adoção dessa técnica ainda é lenta e não é sempre bem-sucedida.", "titulo_pt": "Agropecuária investe em solo compartilhado com painéis solares", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 264574, "titulo": "Amazonas tem 39 cidades sob alerta para qualidade do ar em meio à estiagem", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/amazonas-tem-39-cidades-sob-alerta-para-qualidade-do-ar-em-meio-a-estiagem/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T19:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Amazonas registra 39 cidades sob alerta para a qualidade do ar devido à estiagem. Parintins é a cidade com o pior índice, classificado como péssimo. O estado também declarou emergência em 50 municípios devido à seca, que afetou mais de 165 mil famílias.", "titulo_pt": "Amazonas tem 39 cidades sob alerta para qualidade do ar em meio à estiagem", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263942, "titulo": "Mpox avança em outubro e novembro, e Brasil chega a 1.055 casos com 1 morte", "url": "https://www.metropoles.com/saude/mpox-avanca-em-outubro-e-novembro-e-brasil-chega-a-1-055-casos-com-1-morte", "fonte_id": "metropoles", "data_pub": "2026-11-14T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de outubro e até a metade de novembro, foram registrados 552 casos de mpox no Brasil, somando um total de 1.055 casos. A maioria desses casos não é considerada grave.", "titulo_pt": "Mpox avança em outubro e novembro, e Brasil chega a 1.055 casos com 1 morte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264078, "titulo": "La creciente escasez de salmones, un drama en Alaska", "url": "https://www.clarin.com/estados-unidos/la-creciente-escasez-de-salmones-un-drama-en-alaska_0_1piJw77Ozg.html", "fonte_id": "clarin", "data_pub": "2026-11-14T16:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em Alaska, a pesca de arrastre ameaça o salmão, essencial para as comunidades locais. O desequilíbrio causado pelo aquecimento global está agravando a escassez desta espécie. O debate sobre a pesca industrial está se intensificando, enquanto os residentes buscam medidas que protejam o ecossistema sem prejudicar a economia regional.", "titulo_pt": "A crescente escassez de salmão, um drama em Alaska", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 263950, "titulo": "Bomba é encontrada em usina de etanol nos EUA e provoca evacuação de mais de 5 mil pessoas", "url": "https://exame.com/mundo/bomba-e-encontrada-em-usina-de-etanol-nos-eua-e-provoca-evacuacao-de-mais-de-5-mil-pessoas/", "fonte_id": "exame", "data_pub": "2026-11-14T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um artefato explosivo foi encontrado em um complexo industrial de etanol em Illinois, Estados Unidos, resultando na evacuação de mais de 5 mil pessoas. O FBI e autoridades locais foram mobilizados para desativar o dispositivo, com buscas continuando na região.", "titulo_pt": "Bomba é encontrada em usina de etanol nos EUA e provoca evacuação de mais de 5 mil pessoas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263951, "titulo": "'Queimar a floresta é intencional', diz presidente do Ibama sobre incêndios no Pará", "url": "https://exame.com/esg/queimar-a-floresta-e-intencional-diz-presidente-do-ibama-sobre-incendios-no-para/", "fonte_id": "exame", "data_pub": "2026-11-14T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Ibama, Jair Schmitt, afirmou que os incêndios na floresta do Pará são intencionais. Segundo ele, invasores de terras públicas aproveitam as condições climáticas para eliminar a vegetação. O estado do Pará declarou situação de emergência por 180 dias.", "titulo_pt": "Queimar a floresta é intencional, diz presidente do Ibama sobre incêndios no Pará", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263956, "titulo": "Opinião: a COP31 foi um choque de realidade necessário", "url": "https://exame.com/bussola/opiniao-a-cop31-foi-um-choque-de-realidade-necessario/", "fonte_id": "exame", "data_pub": "2026-11-14T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na abertura da COP31 em Antalya, líderes enfatizaram que superar 1,5º C de aquecimento global é inevitável e destacaram a transição energética como um elemento central para a economia.", "titulo_pt": "Opinião: a COP31 foi um choque de realidade necessário", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264161, "titulo": "Choking fires, deadly heat and devastating floods: 2026 in extreme weather", "url": "https://www.theguardian.com/world/2026/nov/14/fires-heat-floods-extreme-weather-2026", "fonte_id": "guardian_world", "data_pub": "2026-11-14T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, pessoas ao redor do mundo enfrentaram eventos climáticos extremos e letais, resultado da catástrofe climática. O número de mortes devido a esses eventos já ultrapassa as 100.000, sendo uma estimativa conservadora que certamente aumentará. Durante todo o ano, houve secas, incêndios e inundações, lembrando que ações urgentes para reduzir as emissões de gases de efeito estufa são necessárias para evitar anos tão desastrosos.", "titulo_pt": "Asfixiando incêndios, calor letal e inundações devastadoras: 2026, ano de climatologia extremista", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [{"titulo": "Ceará declara situação de emergência em 65 cidades por efeitos do El Niño", "sumario": "O estado do Ceará declarou situação de emergência em 65 cidades devido aos efeitos do El Niño. O Ceará decretou situação de emergência em 65 cidades devido ao risco de seca associado ao fenômeno El Niño. O Ceará decretou situação de emergência em 65 municípios para se preparar para possíveis impactos de uma seca intensa em 2027, devido ao El Niño.", "artigos": [{"id": 264564, "titulo": "Ceará declara situação de emergência em 65 cidades por efeitos do El Niño", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ce/ceara-declara-situacao-de-emergencia-em-65-cidades-por-efeitos-do-el-nino/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado do Ceará declarou situação de emergência em 65 cidades devido aos efeitos do El Niño. O governo intensificou o monitoramento hidrológico e planeja parcerias com as prefeituras para garantir a segurança hídrica.", "titulo_pt": "Ceará declara situação de emergência em 65 cidades por efeitos do El Niño", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263906, "titulo": "Ceará decreta situação de emergência em 65 cidades por risco de seca com El Niño", "url": "https://veja.abril.com.br/agenda-verde/ceara-decreta-situacao-de-emergencia-em-65-cidades-por-risco-de-seca-com-el-nino/", "fonte_id": "veja", "data_pub": "2026-11-14T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará decretou situação de emergência em 65 cidades devido ao risco de seca associado ao fenômeno El Niño. A medida, válida por 180 dias, prevê a implementação de obras e serviços emergenciais para enfrentar ameaças ao abastecimento de água e à produção agropecuária.", "titulo_pt": "Ceará decreta situação de emergência em 65 cidades por risco de seca com El Niño", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263948, "titulo": "Ceará decreta situação de emergência em 65 municípios diante dos riscos do El Niño", "url": "https://exame.com/brasil/ceara-decreta-situacao-de-emergencia-em-65-municipios-diante-dos-riscos-do-el-nino/", "fonte_id": "exame", "data_pub": "2026-11-14T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará decretou situação de emergência em 65 municípios para se preparar para possíveis impactos de uma seca intensa em 2027, devido ao El Niño. A medida tem validade de 180 dias.", "titulo_pt": "Ceará decreta situação de emergência em 65 municípios diante dos riscos do El Niño", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}]}], "direitos_humanos": [{"id": 264633, "titulo": "Arrestaron a un comisario por matar a un policía durante un operativo para atrapar a cuatro extranjeros", "url": "https://www.lanacion.com.ar/seguridad/arrestaron-a-un-comisario-por-matar-a-un-policia-durante-un-operativo-para-atrapar-a-cuatro-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T21:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um comissário foi preso por matar um sargento durante uma operação policial. O sargento Federico Colarusso foi baleado no peito quando os quatro suspeitos já haviam sido capturados e estavam amarrados.", "titulo_pt": "Delegado é preso por matar policial durante operação para capturar quatro estrangeiros", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 264277, "titulo": "Trial of French police beating of Black man: Witnesses believed 'if we don't intervene, Michel will die'", "url": "https://www.lemonde.fr/en/france/article/2026/11/14/trial-of-french-police-beating-of-black-man-witnesses-believed-if-we-don-t-intervene-michel-will-die_6780886_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-14T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco jovens que estavam no estúdio de gravação subterrâneo do produtor musical quando ele foi espancado por três policiais em 2020 se juntaram à ação judicial como demandantes. Eles testificaram sobre a violência que sofreram e o trauma que ainda sentem.", "titulo_pt": "Processo sobre espancamento policial de homem negro: testemunhas relataram trauma após incidente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 264004, "titulo": "Política de detenção de imigrantes de Trump sobrecarrega tribunais dos EUA", "url": "https://www.cnnbrasil.com.br/internacional/politica-de-detencao-de-imigrantes-sobrecarrega-tribunais-americanos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades de direitos humanos criticam o desvio de recursos públicos para defender prisões consideradas ilegais pelo setor. A política de detenção de imigrantes de Trump sobrecarrega os tribunais dos EUA.", "titulo_pt": "Política de detenção de imigrantes de Trump sobrecarrega tribunais dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263704, "titulo": "6-year-old Gaza burn victim caught in Israeli dispute over aid", "url": "https://www.japantimes.co.jp/news/2026/11/14/world/society/gaza-6-year-old-burn-victim/", "fonte_id": "japan_times", "data_pub": "2026-11-14T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Masa Yassin, uma menina de 6 anos que sofreu queimaduras em Gaza, precisa de um novo protetor facial para controlar as cicatrizes, mas Israel está impedindo a importação do plástico necessário para o tratamento.", "titulo_pt": "Menina de 6 anos com queimaduras em Gaza precisa de tratamento, mas israel impede importação de material necessário", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 263590, "titulo": "El proyecto sobre denuncias falsas y la cifra que nadie ha medido", "url": "https://www.ciperchile.cl/2026/11/14/el-proyecto-sobre-denuncias-falsas-y-la-cifra-que-nadie-ha-medido/?utm_source=rss&utm_medium=rss&utm_campaign=el-proyecto-sobre-denuncias-falsas-y-la-cifra-que-nadie-ha-medido", "fonte_id": "ciper_chile", "data_pub": "2026-11-14T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda um projeto sobre denuncias falsas, mas não fornece detalhes sobre o conteúdo ou resultados. A cifra associada a essas denuncias falsas não foi medida ou divulgada.", "titulo_pt": "O projeto sobre denuncias falsas e a cifra que ninguém mediu", "vei               ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
