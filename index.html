<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "30/10/2026 19:16", "stats": {"noticias_novas": 555, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente do Senado, Davi Alcolumbre, pautou para a próxima terça-feira (3) a votação da Proposta de Emenda à Constituição (PEC) que trata da segurança pública, reabrindo o debate sobre a redução da maioridade penal. O projeto também visa proteger os cidadãos contra práticas fraudulentas, especialmente o golpe do falso advogado no Distrito Federal. Em outro desenvolvimento, o CNJ (Conselho Nacional de Justiça) firmará um acordo com registradoras de ativos financeiros para melhorar o rastreamento de precatórios no país. Além disso, o STF (Supremo Tribunal Federal) está sanando investigações relacionadas ao bolsonarismo, enquanto o True Story Award 2027 recebe inscrições até o próximo sábado (31).", "mundo": "O bloco de Benjamin Netanyahu perdeu a maioria no parlamento israelense, desafiando a coalizão governamental liderada pelo primeiro-ministro. Em outro desenvolvimento, os Estados Unidos estão se preparando para investigar ações de Donald Trump que beneficiaram Flávio Bolsonaro, que fugiu para os EUA, e a influência da Meta nas eleições brasileiras. Na Ucrânia, cidadãos de Oleshky, uma cidade ocupada pela Rússia, estão sendo evacuados sob um cessar-fogo raro, mediado pelos Estados Unidos. Em um desenvolvimento diplomático, o Canadá se comprometeu a se tornar o primeiro membro associado da União Europeia, buscando diversificar suas relações internacionais. Além disso, o principal jornal independente da Rússia, Novaya Gazeta, anunciou seu fechamento, atribuindo o fechamento à pressão estatal após anos de repressão.\n\nOs Estados Unidos autorizaram a venda de 500 mísseis Patriot à Ucrânia por cerca de US$ 2,1 bilhões, aumentando a tensão com a Rússia, que não compareceu a uma reunião do G20 em Atlanta devido a desacordos entre os europeus. O Canadá e a União Europeia anunciaram uma aliança estratégica com foco em maior integração comercial, cooperação em inteligência artificial e acesso a supercomputadores europeus. O Irã planeja usar inteligência artificial em caso de ataque dos EUA, enquanto o presidente russo, Vladimir Putin, criticou o que considerou neocolonialismo ocidental durante uma cúpula com África. A região do Golfo não está preparada para um novo conflito com o Irã, e a Rússia rompeu com o Ocidente, liberando um mundo mais caótico, segundo o Foreign Policy.", "economia": "A economia global e brasileira registrou vários movimentos significativos nas últimas semanas. Taiwan registrou um crescimento do PIB de 14,36% no trimestre, o maior em 48 anos, refletindo um forte desempenho econômico. No Brasil, a Aneel manteve a bandeira tarifária verde em novembro, sem aumento adicional nas contas de luz. No entanto, a bolsa de valores sofreu uma queda de 17,5% na semana após a reeleição de Lula, com o dólar subindo 9% durante o período. A Binance, a maior corretora de criptomoedas do mundo, foi alvo de um ataque hacker, resultando em um roubo de US$ 6,3 bilhões em apenas 30 minutos. A Arm, empresa de semicondutores, expandiu sua oferta para incluir CPUs de servidores, com potencial de crescimento no mercado chinês. Por outro lado, a CD&R está negociando a aquisição de Global Payments, um processador de cartões de pagamento avaliado em US$ 40 bilhões, em uma transação que se classificará entre as maiores operações de buyout na história.", "tecnologia": "A Apple anunciou que reduzirá a taxa de comissão na App Store para 26%, em um esforço para aliviar as preocupações dos desenvolvedores de aplicativos sobre a alta taxa de 30%. Essa decisão visa manter a competitividade do ecossistema da App Store. A MediaTek ganhou um novo cliente para suas tecnologias de inteligência artificial (AI), expandindo sua presença no mercado. No entanto, a Intel enfrenta dificuldades devido ao aumento dos preços dos componentes, especialmente de memória, que estão prejudicando suas vendas. A Binance, plataforma de troca de criptomoedas, sofreu um furto de US$ 6,3 bilhões, destacando os riscos associados ao setor. A Blackstone prevê que a Anthropic, empresa de IA, possa não obter uma classificação de investimento de grau após sua oferta inicial de ações, sinalizando cautela no mercado de investimentos em IA.", "ciencia": "A Anvisa aprovou o comprimido Evrysdi (risdiplam) para o tratamento da atrofia muscular espinhal 5q em adultos e crianças acima de 2 anos, um avanço significativo na medicina. Em um desenvolvimento ambiental, conservacionistas soltaram uma orangotango e seu bebê em uma floresta de Bornéu, na Indonésia, após serem resgatados de áreas afetadas por incêndios. Um estudo liderado pela Universidade da Massachusetts Amherst mostrou que rochas mais fracas em paisagens montanhosas erodem três vezes mais rápido do que rochas mais duras, com implicações climáticas significativas. Além disso, a Índia lançou o satélite de navegação NVS-03 em órbita, o quarto lançamento orbital do país este ano. Um pequeno chip de vidro desenvolvido por pesquisadores da Universidade Heriot-Watt conectou duas telescópias, permitindo que elas operem como um único instrumento poderoso, um avanço importante para a próxima geração de tecnologia astronômica.", "cultura": "A 12ª edição da Dubai Design Week, que acontecerá de 3 a 8 de novembro de 2026, celebra o design vibrante do Oriente Médio, destacando formas geométricas e instalações de renomados arquitetos. O evento, realizado no Dubai Design District, promete apresentar uma variedade de exposições que homenageiam a rica cultura e arte da região. Paralelamente, a Igreja Universal do Reino de Deus anunciou que não renovou o contrato de compra de horários das madrugadas e parte das manhãs da Band, mantendo apenas a Record, devido a problemas financeiros. Em outro destaque, a série 'Celebrity Traitors' ficou imprevisível após as revelações de James Acaster e as investigações de Michael Sheen, com a próxima etapa do jogo prestes a ser revelada. Além disso, a produtora Rodrigo Teixeira anunciou a adaptação do romance 'Os Imortais', de Paulliny Tort, para o cinema. O cantor Belchior, que completaria 80 anos em 2026, teria uma série e livros sobre sua vida lançados, após sua morte em 2017. O psicólogo Gabriel Rolón, em entrevistas, discutiu a complexidade dos vínculos humanos, a reinterpretação do presente e o risco de depositar a felicidade em promessas futuras, refletindo sobre a natureza trágica da vida e o amor.", "sociedade": "A Argentina enfrenta uma crise no sistema de saúde, com milhões de cidadãos precisando de atendimento urgente, apesar da política se concentrar em ganhar eleições, de acordo com um artigo publicado na La Nación. Em Misiones, um produtor relatou a morte de 22 ovelhas em ataques de cães, refletindo um problema recorrente na região. Em um caso de violência contra a mulher, uma adolescente foi estuprada após ser convidada a dormir na casa de parentes, e o suspeito foi preso. O Brasil enfrenta diversos desafios sociais, incluindo uma cobertura vacinal insatisfatória contra a meningite, a eliminação da transmissão de HIV da mãe para o filho em Barbados, e a percepção de que a justiça está sendo questionada, com advogados criticando o manejo do problema de acumulação de sedimentos em rios. Além disso, a proposta de emenda à Constituição da Segurança Pública entra na pauta do Senado, enquanto a justiça reconhece o vínculo trabalhista de um atleta de e-sports, e a cobertura da vacina contra a meningite entre adolescentes é de apenas 67,1%.", "meio_ambiente": "A Indonésia enfrenta um grave problema ambiental devido à morte de 3.560 pessoas causada pela fumaça de incêndios florestais em setembro, de acordo com relatórios recentes. O fumo tóxico cobriu grande parte do país, afetando cerca de 57,8 milhões de pessoas, levando a uma crise ambiental sem precedentes. No Brasil, cinco regiões de corais estão em estado crítico, ameaçadas pelo colapso devido à poluição marinha, atividades de navegação e mudanças climáticas. Além disso, o Serviço Nacional de Sanidade e Qualidade Agroalimentar (Senasa) informou que 147.500 animais de rebanho já foram evacuados das áreas afetadas pela inundação no Litoral, com a quantidade de animais transferidos aumentando 102% em comparação com o mesmo período de 2025. No entanto, há sinais de esperança para os golfinhos sagrados do Irrawaddy, com tentativas de conservação começando a dar resultados positivos apesar da pesca ilegal e da construção de usinas hidrelétricas no Mekong.", "direitos_humanos": "Um agente do ICE enfrenta acusações de agressão após supostamente atropelar deliberadamente Miguel Parra Hernández, um trabalhador mexicano, atingindo suas duas pernas. A vítima está sendo assistida em um hospital local, e a investigação está em andamento. O agente do ICE, Morales, agora está sendo processado por este incidente. Em Mato Grosso do Sul, ameaças a indígenas, incluindo um caso onde servidores sugeriram envenenar a água de uma aldeia Guarani Kaiowá, reacenderam um conflito centenário. Uma comitiva liderada por Sônia Guajajara, composta por representantes de três ministérios, chegou a Dourados com o objetivo de investigar relatos de ameaças enfrentadas por comunidades indígenas Guarani e Kaiowá. As autoridades locais estão tomando medidas para garantir a segurança dos indígenas, incluindo a implementação de um plano de proteção e a criação de um centro de apoio. Além disso, a lei antirrepresão transnacional está sendo debatida, e há relatos de supostas forçadas a se desculpar. No Festival de Cinema Queer de Pequim, este ano foi cancelado devido à pressão das autoridades locais, que temem a exposição de temas considerados sensíveis. O Festival de Cinema Queer de Beijing foi cancelado após uma campanha de hostilidade persistente por parte das autoridades, que temem a exposição de temas considerados anti-nacionais."}, "resumo_do_dia": {"politica_nacional": [{"id": 236111, "titulo": "CNJ vai firmar acordo com registradoras de ativos para rastrear precatórios após caso Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/cnj-vai-firmar-acordo-com-registradoras-de-ativos-para-rastrear-precatorios-apos-caso-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CNJ (Conselho Nacional de Justiça) vai firmar um acordo de cooperação técnica com registradoras de ativos financeiros, como a B3, na próxima terça-feira (3), para monitorar o sistema de precatórios no país. O objetivo é utilizar o conhecimento dessas empresas para melhorar o rastreamento desses títulos de crédito.", "titulo_pt": "CNJ vai firmar acordo com registradoras de ativos para rastrear precatórios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236144, "titulo": "É #FAKE que Lula anunciou corte de R$ 6 bilhões na Saúde e na Educação após eleição de 2026; vídeo foi exibido no ano retrasado", "url": "https://g1.globo.com/fato-ou-fake/noticia/2026/10/30/e-fake-que-lula-anunciou-corte-de-r-6-bilhoes-na-saude-e-na-educacao-apos-eleicao-de-2026-video-foi-exibido-no-ano-retrasado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Não houve anúncio de corte de gastos no governo Lula após a eleição de 2026. Circulam nas redes sociais publicações falsas alegando que houve um corte 'de quase R$ 6 bilhões' na Saúde e na Educação.", "titulo_pt": "É #FAKE que Lula anunciou corte de R$ 6 bilhões na Saúde e na Educação após eleição de 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 236145, "titulo": "Alcolumbre pauta votação da PEC da Segurança Pública para a próxima terça-feira", "url": "https://g1.globo.com/politica/noticia/2026/10/30/alcolumbre-pauta-votacao-da-pec-da-seguranca-publica-para-a-proxima-terca-feira.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, incluiu a votação da PEC da Segurança Pública na pauta para a próxima terça-feira. A proposta precisa de pelo menos 49 votos favoráveis para ser aprovada.", "titulo_pt": "Alcolumbre pauta votação da PEC da Segurança Pública para próxima terça-feira", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 236276, "titulo": "Alcolumbre pauta PEC da Segurança para sessão de terça-feira (3) no Senado", "url": "https://www.cnnbrasil.com.br/politica/alcolumbre-pauta-pec-da-seguranca-para-sessao-de-terca-feira-3-no-senado/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Renan Calheiros, incluiu a Proposta de Emenda à Constituição (PEC) que trata da segurança na pauta da sessão terça-feira (3). A análise da proposta foi adiada antes do segundo turno das eleições presidenciais devido a divergências na base governista sobre a redução da maioridade penal.", "titulo_pt": "Alcolumbre pauta PEC da Segurança para sessão de terça-feira no Senado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236208, "titulo": "Projeto de lei prevê proteção de dados contra golpe do falso advogado no DF", "url": "https://www.metropoles.com/colunas/grande-angular/projeto-de-lei-preve-protecao-de-dados-contra-golpe-do-falso-advogado-no-df", "fonte_id": "metropoles", "data_pub": "2026-10-30T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei visa proteger os cidadãos contra práticas fraudulentas, especialmente o golpe do falso advogado no Distrito Federal. Ele inclui mecanismos para segurança digital e prevenção de golpes.", "titulo_pt": "Projeto de lei visa proteção contra golpe do falso advogado no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236282, "titulo": "Lula cita Deus 12 vezes após vitória em 2026; recorde segue sendo 2022", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-cita-deus-12-vezes-apos-vitoria-em-2026-recorde-segue-sendo-2022/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento dos discursos de vitória de Lula após a eleição de 2026 revelou que ele mencionou Deus 12 vezes, um recorde que segue sendo o maior desde 2022.", "titulo_pt": "Lula cita Deus 12 vezes após vitória em 2026; recorde mantido desde 2022", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236339, "titulo": "Pós-eleições, STF busca sanear investigações que geram desgaste com o bolsonarismo", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-flavia-maia/pos-eleicoes-stf-busca-sanear-investigacoes-que-geram-desgaste-com-o-bolsonarismo", "fonte_id": "jota", "data_pub": "2026-10-30T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) está buscando sanear as investigações que têm gerado desgaste relacionadas ao bolsonarismo. Ainda não se sabe por quanto tempo essa estratégia será mantida pelo ministro Alexandre de Moraes.", "titulo_pt": "Pós-eleições, STF tenta sanear investigações que causam desgaste com o bolsonarismo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 236217, "titulo": "Alcolumbre pauta PEC da Segurança e reabre debate sobre maioridade penal", "url": "https://www.metropoles.com/brasil/alcolumbre-pauta-pec-da-seguranca-e-reabre-discussao-sobre-maioridade", "fonte_id": "metropoles", "data_pub": "2026-10-30T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de emenda à constituição (PEC) sobre a segurança foi pautada para votação na terça-feira (3/11). O debate sobre a redução da maioridade penal continua travado, impulsionando a reabertura desse tema na tramitação da PEC.", "titulo_pt": "Alcolumbre pauta PEC da Segurança e reabre debate sobre maioridade penal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 236140, "titulo": "True Story Award 2027 recebe inscrições até sábado (31)", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/10/true-story-award-2027-recebe-inscricoes-ate-sabado-31.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jornalistas de todo o mundo podem inscrever reportagens no True Story Award até o próximo sábado (31). O prêmio reconhece trabalhos publicados entre outubro de 2025 e setembro de 2026 em jornais, revistas e na internet.", "titulo_pt": "Inscrições para true Story Award 2027 encerram no sábado (31)", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 236141, "titulo": "Alcolumbre pauta PEC da Segurança para terça e governo costura acordo sobre maioridade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/alcolumbre-pauta-pec-da-seguranca-para-terca-e-governo-costura-acordo-sobre-maioridade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T20:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, pautou para a próxima terça-feira a votação da Proposta de Emenda à Constituição (PEC) da Segurança Pública. Durante esse período, o governo está negociando um acordo sobre a redução da maioridade penal.", "titulo_pt": "Alcolumbre pauta PEC da Segurança para terça e governo discute redução da maioridade penal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 236341, "titulo": "Nem fraude, nem milagre: a aritmética da virada de Lula", "url": "https://www.jota.info/eleicoes/eleicoes-2026/nem-fraude-nem-milagre-a-aritmetica-da-virada-de-lula", "fonte_id": "jota", "data_pub": "2026-10-30T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo indica que o aumento nas votações de Lula resulta de uma combinação de fatores, incluindo uma recuperação da economia, um aumento no comparecimento às urnas e uma redução no número de votos brancos e nulos.", "titulo_pt": "Nem fraude, nem milagre: a aritmética da virada de Lula", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 236142, "titulo": "Senadores rejeitam anistia a Bolsonaro até que STF decida sobre redução de penas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/senadores-rejeitam-anistia-a-bolsonaro-ate-que-stf-decida-sobre-reducao-de-penas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores se opõem a uma anistia para Jair Bolsonaro até que o STF decida sobre a redução de penas já aprovada pelo Congresso. O presidente do Senado, Davi Alcolumbre, está articulando essa medida.", "titulo_pt": "Senadores rejeitam anistia a Bolsonaro até que STF decida sobre redução de penas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 236146, "titulo": "Governo diz que CNU 2027 pode ofertar até 3 mil vagas; realização de provas depende da aprovação do Orçamento de 2027", "url": "https://g1.globo.com/trabalho-e-carreira/noticia/2026/10/30/governo-diz-que-cnu-2027-pode-ofertar-ate-3-mil-vagas-realizacao-do-de-provas-depende-da-aprovacao-do-orcamento-de-2027.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Gestão e da Inovação informou que um possível concurso público nacional unificado em 2027 pode oferecer entre 2 mil e 3 mil vagas, mas a realização dependerá da aprovação do orçamento para o próximo ano. A proposta orçamentária foi enviada ao Congresso Nacional no fim de agosto.", "titulo_pt": "Governo prevê até 3 mil vagas para concurso em 2027, mas depende de aprovação do Orçamento", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 236147, "titulo": "Após críticas de aliados, Michelle diz que Bolsonaro pediu para direita se unir e não buscar culpados", "url": "https://g1.globo.com/df/distrito-federal/noticia/2026/10/30/apos-criticas-michelle-bolsonaro-faz-agradecimento-a-politicos-que-atuaram-na-campanha-de-flavio.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro afirmou que Jair Bolsonaro pediu união da direita e que o grupo deve evitar buscar culpados após críticas de aliados. A senadora eleita também pediu para que os aliados não caiam em enganações de opositores.", "titulo_pt": "Michelle Bolsonaro diz que Bolsonaro pediu união da direita e não busca culpados", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 236143, "titulo": "Em busca da política perdida", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/demetriomagnoli/2026/10/em-busca-da-politica-perdida.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T18:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, em suas cartas do exílio, qualifica-se como 'presidente eleito' e compara-se a figuras históricas, o que pode reforçar sua imagem de 'golpista' para a direita democrática brasileira.", "titulo_pt": "Em busca da política perdida", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 235303, "titulo": "Com pós-eleição, XP revela onde prefere investir em fundos imobiliários", "url": "https://www.infomoney.com.br/onde-investir/com-pos-eleicao-xp-revela-onde-prefere-investir-em-fundos-imobiliarios/", "fonte_id": "infomoney", "data_pub": "2026-10-30T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reavaliação dos ativos imobiliários após as eleições criou um cenário mais desafiador para os fundos imobiliários. A XP informou onde prefere investir nesses fundos após o período pós-eleitoral.", "titulo_pt": "Com pós-eleição, XP define onde prefere investir em fundos imobiliários", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 235855, "titulo": "Czechia eyes drone assembly in Taiwan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/31/2003866917", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A República Tcheca está considerando a possibilidade de montagem de drones em Taiwan. A iniciativa visa explorar oportunidades na indústria de drones nesses dois países.", "titulo_pt": "República tcheca avalia montagem de drones em Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 235849, "titulo": "Netanyahu’s bloc loses majority in Israeli parliament", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/31/2003866905", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bloco de Netanyahu perdeu a maioria no parlamento israelense. A coalizão liderada por Benjamin Netanyahu não conseguiu manter o apoio necessário para continuar governando majoritariamente.", "titulo_pt": "Bloco de netanyahu perde maioria no parlamento israelense", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 236576, "titulo": "US Democrats prepare to counter any Trump claim of foreign meddling in midterms", "url": "https://www.scmp.com/news/us/us-elections/article/3372799/us-democrats-prepare-counter-any-trump-claim-foreign-meddling-midterms", "fonte_id": "scmp", "data_pub": "2026-10-30T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Democratas no Comitê de Inteligência do Congresso dos EUA estão se preparando para verificar e responder a qualquer acusação de que o presidente Donald Trump fez sobre interferência de potências estrangeiras nas eleições de meios-períodos de novembro, apesar de não terem encontrado evidências de interferência. Essa preocupação surge em um cenário em que os democratas lideram com oito pontos entre eleitores prováveis na disputa pelo controle do Congresso, de acordo com uma pesquisa da PBS News/NPR/Marist de 27 de outubro.", "titulo_pt": "Democratas se preparam para contrariar acusações de interferência estrangeira nas eleições de meios-períodos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236528, "titulo": "Residents leave Russian-occupied Oleshky in evacuation operation", "url": "https://www.france24.com/en/europe/20261030-residents-leave-russian-occupied-oleshky-in-evacuation-operation", "fonte_id": "france24", "data_pub": "2026-10-30T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidadãos evacuados da cidade ucraniana de Oleshky, ocupada pela Rússia, viajaram para a cidade de Anapa, na Rússia, acompanhados por uma delegação ucraniana. Eles devem voar para Belarus e depois retornar à Ucrânia durante um cessar-fogo raro, mediado pelos Estados Unidos.", "titulo_pt": "Cidadãos de Oleshky, na Ucrânia ocupada pela Rússia, são evacuados", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 236398, "titulo": "“Lo que yo no quiero es verlo”: la impotencia de las víctimas de los 56 pederastas a los que el Gobierno de Kast rebajó las condenas", "url": "https://elpais.com/chile/2026-10-30/lo-que-yo-no-quiero-es-verlo-la-impotencia-de-las-victimas-de-los-56-pederastas-a-los-que-el-gobierno-de-kast-rebajo-las-condenas.html", "fonte_id": "elpais_america", "data_pub": "2026-10-30T21:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os abusados sexualmente reagem com raiva e medo à libertação dos 56 criminosos sexuais cuas penas foram reduzidas pelo governo de Kast. O conflito político está aumentando, com a saída do vice-ministro de Justiça, Luis Silva, e o ministro Fernando Rabat ainda em cargo.", "titulo_pt": "O que eu não quero é vê-lo: a impotência das vítimas dos 56 pedófilos cujas condenações foram reduzidas pelo governo de Kast", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236402, "titulo": "El cruce de vetos entre Rusia y EE UU deja en el aire la misión de la ONU en el Sáhara", "url": "https://elpais.com/internacional/2026-10-30/el-cruce-de-vetos-entre-rusia-y-ee-uu-deja-en-el-aire-la-mision-de-la-onu-en-el-sahara.html", "fonte_id": "elpais_america", "data_pub": "2026-10-30T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Rússia vetou um plano dos Estados Unidos e do Marrocos para apoiar a autonomia do Saara Ocidental, mantendo o conflito em aberto. Moscou desafiou a aliança entre Washington e Rabat sobre a solução unívoca do conflito.", "titulo_pt": "Conflito no saara ocidental permanece incerto devido a veto russo", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236404, "titulo": "Estados Unidos detiene a Inés Gómez Mont, prófuga de la justicia mexicana por lavado de activos", "url": "https://elpais.com/mexico/2026-10-30/estados-unidos-detiene-a-ines-gomez-mont-profuga-de-la-justicia-mexicana-por-lavado-de-activos.html", "fonte_id": "elpais_america", "data_pub": "2026-10-30T21:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inés Gómez Mont, apresentadora de televisão e atriz, foi detida pelos Estados Unidos após cinco anos de fuga. Ela é acusada, junto com seu marido Víctor Álvarez Puga, de emitir facturas falsas e de delinquência organizada no México.", "titulo_pt": "Estados Unidos detém Inés Gómez Mont, prófuga da justiça mexicana por lavagem de dinheiro", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 236135, "titulo": "Deputada aposta em maioria democrata após midterms para investigar ajuda de Trump a Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/deputada-aposta-em-maioria-democrata-apos-midterms-para-investigar-ajuda-de-trump-a-flavio-bolsonaro.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-30T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputados democratas dos Estados Unidos planejam investigar ações de Donald Trump que protegeram Flávio Bolsonaro, que fugiu para os EUA, e a influência da Meta nas eleições brasileiras. A deputada Pramila Jayapal informou à Folha de São Paulo esses planos.", "titulo_pt": "Deputada democrata prevê investigação sobre proteção de Trump a Flávio Bolsonaro e influência da meta nas eleições brasileiras", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 236277, "titulo": "Irã planeja atingir alvos de IA no caso de ataque dos EUA, diz autoridade", "url": "https://www.cnnbrasil.com.br/internacional/ira-planeja-atingir-alvos-de-ia-no-caso-de-ataque-dos-eua-diz-autoridade/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã planeja atingir alvos de inteligência artificial (IA) em caso de ataque dos EUA, segundo uma autoridade. A fonte afirmou que, se o conflito for retomado, será uma 'guerra de surpresas' que evita comportamentos previsíveis.", "titulo_pt": "Irã planeja atingir alvos de IA no caso de ataque dos EUA, diz autoridade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236308, "titulo": "Como a fuga de Flávio Bolsonaro pode impactar o bolsonarismo", "url": "https://www.dw.com/pt-br/como-a-fuga-de-flávio-bolsonaro-pode-impactar-o-bolsonarismo/a-79809715?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-30T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fuga de Flávio Bolsonaro do Brasil enfraquece sua posição dentro do bolsonarismo e cria oportunidades para lideranças alternativas, incluindo aquelas fora do clã familiar.", "titulo_pt": "Como a fuga de Flávio Bolsonaro pode impactar o bolsonarismo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 236309, "titulo": "Miami, a base de políticos conservadores da América Latina", "url": "https://www.dw.com/pt-br/miami-a-base-de-políticos-conservadores-da-américa-latina/a-79812552?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-30T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro fugiu para a Flórida, Estados Unidos, seguindo uma rota iniciada há cerca de um século por líderes políticos e ex-ditadores de direita da América Latina. A cidade de Miami, com uma população majoritariamente latina, tem se tornado cada vez mais favorável a Donald Trump, contrariamente às suas políticas anti-imigração.", "titulo_pt": "Miami, a base de políticos conservadores da América Latina", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 236422, "titulo": "Carney Commits Canada to Becoming European Union’s First ‘Associate Member’", "url": "https://www.nytimes.com/2026/10/30/world/canada/carney-canada-european-union.html", "fonte_id": "nyt_world", "data_pub": "2026-10-30T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Carney se comprometeu a tornar Canadá o primeiro membro associado da União Europeia, como parte do esforço do primeiro-ministro canadense para reduzir a influência dos Estados Unidos sobre o Canadá e expandir as relações comerciais para outras partes do mundo.", "titulo_pt": "Carney cometa canadá como primeiro membro associado da união europeia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 236570, "titulo": "Tennis: Vienna; Berrettini ko, in semifinale va De Minaur", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/30/tennis-vienna-berrettini-ko-in-semifinale-va-de-minaur_f82df0e2-e7e9-4ad1-b2c3-bbb970f418e5.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-30T21:06:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Berrettini perdeu para De Minaur nas semifinais do torneio de tênis emViena. A Itália foi derrotada pelo Australia em duas parciais.", "titulo_pt": "Tenis: viena; Berrettini derrotado, De Minaur avança às semifinais", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 236578, "titulo": "Russia’s top independent newspaper Novaya Gazeta ‘killed’ by Kremlin pressure", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3372798/russias-top-independent-newspaper-novaya-gazeta-shuts-under-kremlin-pressure", "fonte_id": "scmp", "data_pub": "2026-10-30T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O principal jornal independente da Rússia, Novaya Gazeta, anunciou seu fechamento, afirmando que foi 'assassinado' pela pressão estatal após anos de repressão contra jornalistas que relatavam criticamente sobre o Kremlin e sua guerra na Ucrânia. Este fechamento, um dos últimos de uma publicação que criticava abertamente a ofensiva russa, marca o último resultado de uma campanha moscovita contra vozes dissidentes que se intensificou após a invasão da Ucrânia.", "titulo_pt": "O maior jornal independente da Rússia é 'assassinado' pela pressão do Kremlin", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236379, "titulo": "Subsecretario de Justicia Luis Silva es removido de su cargo en medio de polémica por rebajas de condenas y tras publicar video sin informar", "url": "https://www.latercera.com/politica/noticia/subsecretario-de-justicia-luis-silva-es-removido-de-su-cargo-en-medio-de-polemica-por-rebajas-de-condenas-y-tras-publicar-video-sin-informar/", "fonte_id": "la_tercera", "data_pub": "2026-10-30T21:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O subsecretário de Justiça Luis Silva foi removido de seu cargo devido a polêmicas relacionadas a reduções de condenações e a publicação de um vídeo sem informar a pessoa devido a isso. Silva explicou que não considerou necessário consultar o indivíduo, pois o objetivo do vídeo era informar.", "titulo_pt": "Subsecretário de justiça Luis Silva é demitido em meio a polêmicas por reduções de condenações e publicação de vídeo sem autorização", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 236549, "titulo": "Swiss supreme court upholds Liberian ex-rebel commander’s 20-year sentence", "url": "https://www.aljazeera.com/news/2026/10/30/swiss-supreme-court-upholds-liberian-ex-rebel-commanders-20-year-sentence?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Suíço confirmou a sentença de 20 anos de prisão para o ex-comandante de rebeldes liberianos Alieu Kosiah. Ele foi condenado por assassinar civis e soldados não armados, bem como por ordenar roubos e outros crimes contra a humanidade.", "titulo_pt": "Tribunal suíço mantém sentença de 20 anos para ex-comandante de rebeldes liberianos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 235869, "titulo": "Q3 GDP growth hits 14.36%, highest in 48 years", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/31/2003866891", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PIB trimestral da economia de Taiwan cresceu 14,36% em relação ao mesmo período do ano anterior, o maior crescimento anual em 48 anos.", "titulo_pt": "Crescimento do pib trimestral atinge 14,36%, maior taxa em 48 anos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 236112, "titulo": "Aneel mantém bandeira verde na conta de luz em novembro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/aneel-mantem-bandeira-verde-na-conta-de-luz-em-novembro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Aneel anunciou que a bandeira tarifária para o mês de novembro será verde, mantendo assim a conta de luz sem custo extra por segundo mês consecutivo.", "titulo_pt": "Aneel mantém bandeira verde na conta de luz em novembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236113, "titulo": "Blackstone vê risco de Anthropic ficar sem grau de investimento após IPO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/blackstone-ve-risco-de-anthropic-ficar-sem-grau-de-investimento-apos-ipo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Blackstone informou a investidores que a Anthropic pode não receber uma classificação de grau de investimento logo após o seu IPO, o que pode dificultar o financiamento dos altos gastos da empresa de IA. A empresa de inteligência artificial enfrenta um risco de não obter a classificação necessária após a oferta pública inicial.", "titulo_pt": "Blackstone avisa risco de Anthropic ficar sem grau de investimento após IPO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236114, "titulo": "Por que investir nos EUA se os juros brasileiros são maiores?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/por-que-investir-nos-eua-se-os-juros-brasileiros-sao-maiores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil oferece juros mais altos em comparação com os Estados Unidos. Muitos investidores consideram que não há sentido em aplicar em renda fixa nos EUA devido à diferença de juros.", "titulo_pt": "Por que investir nos EUA se os juros brasileiros são maiores?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 236338, "titulo": "Muito além de um nome: por que a marca importa na segurança do botijão", "url": "https://www.jota.info/coberturas-especiais/energia-e-inclusao/muito-alem-de-um-nome-por-que-a-marca-importa-na-seguranca-do-botijao", "fonte_id": "jota", "data_pub": "2026-10-30T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gravação no botijão de gás auxilia na identificação da distribuidora responsável e fortalece a segurança na cadeia de distribuição do GLP.", "titulo_pt": "Muito além de um nome: por que a marca importa na segurança do botijão", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 236288, "titulo": "Bolsas da Europa caem pressionadas por techs e avanço do petróleo", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bolsas-da-europa-caem-pressionadas-por-techs-e-avanco-do-petroleo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas da Europa apresentaram variações mistas, com o DAX e o FTSE MIB registrando perdas, enquanto o Ibex 35, o CAC 40, o FTSE 100 e o PSI 20 registraram movimentos levemente diferentes. O Ibex 35 e o FTSE MIB tiveram maiores quedas, enquanto o FTSE 100 foi o único a fechar em alta.", "titulo_pt": "Bolsas da Europa caem com pressão de tecnológicas e avanço do petróleo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236291, "titulo": "Ouro recua e bate mínima em mais de um ano com preocupações com IA", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/ouro-recua-e-bate-minima-em-mais-de-um-ano-com-preocupacoes-com-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ouro e a prata registraram quedas no mercado, com o ouro atingindo seu nível mais baixo em mais de um ano, enquanto a prata registrou uma queda de 5,9%. Essas quedas ocorreram em meio a preocupações relacionadas à inteligência artificial.", "titulo_pt": "Ouro e prata recuam com preocupações sobre IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236148, "titulo": "Aneel mantém bandeira tarifária verde em novembro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/aneel-mantem-bandeira-tarifaria-verde-em-novembro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-30T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Energia Elétrica (Aneel) manteve a bandeira tarifária verde para novembro, o que significa que não haverá cobrança adicional nas contas de luz. A decisão foi tomada devido às condições favoráveis de geração de energia.", "titulo_pt": "Aneel mantém bandeira tarifária verde em novembro", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 236115, "titulo": "Acionistas da Raízen aprovam plano de recuperação extrajudicial da companhia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/acionistas-da-raizen-aprovam-plano-de-recuperacao-extrajudicial-diz-agencia.sht
