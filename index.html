<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "26/08/2026 07:25", "stats": {"noticias_novas": 870, "resumos_gerados": 252}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário político brasileiro continua agitado com diversos candidatos se movimentando em diferentes estados. Flávio Bolsonaro, do PL, iniciou sua campanha no Nordeste em Alagoas, apesar do isolamento significativo. Por outro lado, Lula, do PT, mantém força nos grandes centros eleitorais, estando tecnicamente empatado com Flávio Bolsonaro no Rio de Janeiro, conforme uma pesquisa da Quaest. O presidente Lula também se reuniu com lideranças políticas para discutir questões relacionadas à taxa das blusinhas e outras prioridades. Em outra frente, a Polícia Federal investiga o financiamento do filme sobre Bolsonaro, com autorização de Alexandre de Moraes para compartilhar dados da Polícia Civil de São Paulo com a PF. Além disso, a campanha de João Campos, do PSB, está intensificando o apelo para que Lula participe de atos de campanha em Pernambuco, onde a candidata Raquel Lyra tem uma desvantagem crescente.", "mundo": "O evento mais importante destes artigos é a dissolução anunciada pelas Forças Democráticas Sírias (FDS), um grupo liderado por forças kurdas apoiadas pelos Estados Unidos, que lutaram contra o Estado Islâmico. De acordo com o líder das FDS, essas forças serão integradas ao exército sírio, marcando um novo capítulo na guerra civil síria. Em outro desenvolvimento, um novo ataque militar dos Estados Unidos no Caribe resultou na morte de quatro pessoas. Esta é a segunda operação militar em três dias que já resultou em 229 vítimas desde o início da campanha. Além disso, a Suíça votará sobre fortalecer sua neutralidade e encerrar a cooperação com a OTAN, enquanto o Canadá enfrenta tensões econômicas devido às novas tarifas impostas pelos Estados Unidos, o que pode afetar negócios canadenses. Na Ásia, o Japão planeja solicitar um orçamento maior para políticas relacionadas a imigrantes, e o governo sul-coreano aprovou uma resolução pedindo a expulsão de um deputado da oposição. Em outros locais, a inteligência artificial dobrou seu uso no setor corporativo italiano, mas metade dos funcionários ainda não o utiliza. Por fim, a China e o Irã continuam em um conflito econômico, com os EUA tentando estrangular a economia iraniana.\n\nA geopolítica global enfrenta diversos desafios e tensões, especialmente devido à escalada de medidas econômicas e militares entre países. O Irã e os Estados Unidos mantêm um impasse, com a China sendo advertida sobre sanções potenciais. O Irã também está desenvolvendo novos mísseis, enquanto o presidente ucraniano Zelensky pressiona a China para uma intervenção diplomática. Em Israel, o governo continua ocupando instalações da ONU em Jerusalém Oriental, levando críticas da ONU. A Rússia intensifica seus ataques híbridos na Europa, enquanto o presidente sul-coreano enfatiza o desenvolvimento regional equilibrado. A situação de segurança no Haiti permanece alarmante, com a ONU relatando um aumento de mortes e sequestros. O presidente americano Donald Trump enfrenta críticas por sua abordagem à segurança na fronteira, com mais de 49.500 prisões realizadas em julho. A situação no Oriente Médio continua volátil, com Israel ocupando um centro de treinamento da ONU em Jerusalém Oriental e o primeiro-ministro israelense Netanyahu criticando o regime iraniano.", "economia": "As cotações do petróleo caíram na sessão de ontem, refletindo a mudança dos Estados Unidos em relação às sanções econômicas em vez de operações militares contra o Irã. A maior cadeia de churrascaria de hotpot da China, Haidilao, tem visto o delivery se tornar seu segmento de maior crescimento, com um aumento significativo na demanda por pratos individuais. O índice de produção industrial aumentou, enquanto as vendas no varejo e no setor de alimentos e bebidas registraram recordes em julho, refletindo a recuperação econômica. O tribunal permitiu que liquidadores possam processar a PwC globalmente em relação à falência da gigante imobiliária chinesa, o que tem o potencial de ameaçar o modelo de rede de parcerias das grandes empresas de auditoria. A renda média do trabalho nas unidades da Federação, no segundo trimestre de 2026, variou de R$ 2.284 no Maranhão a R$ 6.171 no Distrito Federal. O Banco do Brasil foi acionado judicialmente pelo Grupo Casas Bahia para devolver R$ 422 milhões debitados unilateralmente da conta da empresa, enquanto a CVM aprovou uma oferta pública de aquisição de ações da Oncoclínicas por 3 votos a zero, contrariando os pareceres técnicos da autarquia. O índice de serviço da dívida do Japão pode atingir um recorde de 230 bilhões de dólares no próximo ano, destacando o crescente encargo das taxas de juros mais altas.", "tecnologia": "A inteligência artificial (IA) está ganhando destaque como um tema central na tecnologia, com diversos players do setor se posicionando. Sam Altman, CEO da OpenAI, defendeu que a IA ainda não teve um 'momento iPhone', indicando que o desenvolvimento da tecnologia está apenas no começo. Em outro desenvolvimento, Stanley Druckenmiller, investidor de renome, admitiu ter usado IA para escrever um artigo publicado no Wall Street Journal, destacando a crescente integração da IA na produção de conteúdo. Além disso, a China está investindo significativamente na IA, buscando estabelecer infraestrutura digital em regiões rurais, enquanto a indústria de semicondutores sul-coreana também se prepara para um futuro marcado por avanços tecnológicos. A SK Innovation, por exemplo, planeja reduzir custos e retornar a lucratividade através da fusão com a unidade SK IE Technology, enquanto a Nvidia prepara novos processadores de data center para impulsionar o mercado de AI. Em outro desenvolvimento, a Embraer certificou o jato Phenom 300EV, que pode pousar sozinho em caso de incapacitação do piloto, destacando a inovação tecnológica no setor aeronáutico.", "ciencia": "Cientistas da Universidade de Oxford exploraram o vulcão ativo Soufrière Hills na ilha de Montserrat e detectaram fluidos ricos em metais a uma profundidade de dois a três quilômetros, descobrindo um inesperado tesouro. Paralelamente, um eclipse lunar parcial poderá ser observado de todo o Brasil na noite desta quinta-feira (27) e madrugada desta sexta-feira (28), com o auge da visualização ocorrendo às 1h13 da sexta-feira, horário de Brasília. Além disso, a NASA lançou uma sonda para analisar a composição atmosférica de mais de 20 exoplanetas fora do nosso sistema solar, com o objetivo de identificar possíveis condições para a habitação. Estudos mostram que a vacina contra herpes zóster pode reduzir o risco de doenças cardíacas e demência, além de novos tratamentos para o nível elevado de Lp(a) estarem próximos de serem lançados no mercado, com potencial de gerar bilhões de dólares. A SK Biopharmaceuticals investiu cerca de 800 milhões de dólares nos direitos para um tratamento de epilepsia desenvolvido pela Biohaven, com o objetivo de criar um segundo medicamento de grande sucesso para complementar seu remédio existente para epilepsia. A imageria atômica em 3D revelou um novo caminho para a formação de cristais, enquanto pesquisas sobre a formação de planetas e a sobrevivência de abelhas nativas de Fiji destacam a importância do entendimento científico em diversos campos.", "cultura": "Dolly Parton, a lendária cantora country de 80 anos, faleceu após ser diagnosticada com câncer, conforme informou sua equipe. Celebridades como Beyoncé, Taylor Swift e Dionne Warwick prestaram homenagens a ela. Paralelamente, a editora Ubu comemora seus dez anos com um festival gratuito em São Paulo. A artista Anna Maria Maiolino expõe uma exposição na galeria Luisa Strina, na zona oeste da cidade, com cerca de 25 trabalhos que exploram o corpo. No âmbito cultural, um movimento comunitário em Ghana promove alimentos locais e nutritivos, em vez de importados ocidentais. A banda Adam and the Ants, famosa no mundo inteiro, descreveu-se como responsável por popularizar o hábito de se fantasiar e de se comportar de forma exagerada. O artista contemporâneo Do Ho Suh está exibindo obras no MMCA em Seul, Coreia do Sul, que reconstituem conceitos de lar, memória e família. Por fim, a coreógrafa americana Lucinda Childs, que revolucionou a dança com movimentos simplificados e repetitivos, prepara uma peça para marcar o 90º aniversário de Philip Glass.", "sociedade": "A Coreia do Sul está enfrentando uma crise no tratamento de casos de desaparecidos, após um escândalo em Jeju que levou o ministro do Interior a ordenar uma revisão nacional. O número de estudantes de origem imigrante em ensino fundamental, médio e superior atingiu um novo recorde na Coreia do Sul. Em contraste, no Paquistão, um incêndio no principal hospital público resultou na morte de 14 bebês, destacando preocupações com a segurança hospitalar. No Brasil, o estado de São Paulo registrou mais de 122 mil multas por uso de celular ao volante no primeiro semestre, enquanto uma influenciadora digital esfaqueou um suspeito de abusar da filha de 5 anos em Franca. Estudos e relatos sobre saúde mental, vício digital e violência de gênero também foram destacados, mostrando a complexidade das questões sociais contemporâneas.", "meio_ambiente": "As temperaturas globais têm aumentado constantemente, com a Europa registrando pelo menos 35.000 mortes adicionais devido ao calor extremo. Além disso, os oceanos estão batendo recordes históricos de temperatura devido ao Super El Niño, levando a níveis nunca vistos, conforme alerta o Copernicus. Paralelamente, a Suíça testa uma técnica antiga para proteger contra incêndios florestais, promovendo condições mais frescas e maior biodiversidade. No Brasil, a Embrapa mapeou a expansão sustentável do cacau na Amazônia, com expansão em áreas já consolidadas sem desmatamento após 2008. No Paquistão, um incêndio em um hospital matou 14 bebês recém-nascidos, destacando a baixa aplicação de regras de segurança construtivas no país. Além disso, o Japão anuncia o fim dos subsídios para painéis solares, enquanto a Coreia do Sul prepara seu primeiro festival musical com foco na neutralidade de carbono. No Chile, o ex-ministro de Meio Ambiente Marcelo Mena discute os desafios para limitar o aquecimento global.", "direitos_humanos": "Os direitos humanos estão em foco em diversos países, com destaque para a situação em Myanmar, onde as violações atingiram um novo nível, de acordo com a ONU, devido a atividades ilegais de mineração e centros de estelionato, além de um relatório sobre o abuso brutal agravado contra a minoria rohingya. Em um evento separado, mais de 3.900 crianças foram mortas ou feridas em ataques em todo o território ucraniano, atingindo o maior nível dos últimos quatro anos. O conflito que levou à crise dos refugiados rohingya durou nove anos, com os Rohingya continuando a ser forçados a fugir do Myanmar devido ao genocídio. A ICE nos Estados Unidos modificou sua regra de uso de força letal, permitindo o uso de armas letais em situações que antes eram consideradas de baixa intensidade. Além disso, os romenos na Bulgária enfrentam dificuldades significativas, com relatos de discriminação e preconceito. A UNICEF emitiu uma declaração sobre as mortes de 14 bebês recém-nascidos após um incêndio em um hospital em Islamabad, Paquistão, que foi causado por uma falha nos sistemas de ar-condicionado. A ONU e a Cruz Vermelha também pediram a proibição de armas autônomas após relatos de que um drone russo usou inteligência artificial na Ucrânia para escolher alvos em um ataque que resultou em mortes. A China condenou o artista Gao Zhen a três anos de prisão por satirizar o ex-líder Mao Tsé-Tung, acusado de atentar contra a honra dos heróis nacionais."}, "resumo_do_dia": {"politica_nacional": [{"id": 124301, "titulo": "Zema faz campanha contra bets, mas Novo tem posição mais flexível sobre apostas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/zema-faz-campanha-contra-bets-mas-novo-tem-posicao-mais-flexivel-sobre-apostas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema, candidato do Novo à Presidência, tem feito campanha contra as bets, prometendo proibi-las se eleito. No entanto, o partido Novo adotou posições mais flexíveis em relação às casas de apostas.", "titulo_pt": "Zema campanha contra bets, mas Novo tem posição mais flexível sobre apostas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124302, "titulo": "Pastor pede bênção para Flávio Bolsonaro em culto e ora por Brasil livre das 'garras de Satanás'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/08/pastor-pede-bencao-para-flavio-bolsonaro-em-culto-e-ora-por-brasil-livre-das-garras-de-satanas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pastor José Wellington Costa Júnior, presidente da Convenção Geral dos Ministros das Igrejas Evangélicas Assembleias de Deus do Brasil, convidou o senador Flávio Bolsonaro para o altar em um culto e oro t": "Lula está programado para se reunir com Motta e Alcolumbre na tarde de 26 de agosto no Palácio da Alvorada, após uma reaproximação entre as partes. O encontro visa discutir questões relacionadas à taxa das blusinhas e outras prioridades.", "titulo_pt": "Lula se reúne com Motta e Alcolumbre sobre taxas e prioridades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 124439, "titulo": "Raquel Lyra x João Campos: mapa indica quem \"controla\" cada cidade de PE", "url": "https://www.metropoles.com/brasil/raquel-lyra-x-joao-campos-mapa-indica-quem-controla-cada-cidade-de-pe", "fonte_id": "metropoles", "data_pub": "2026-08-26T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento realizado pelo Metrópoles indica que Raquel Lyra tem apoio em 139 municípios pernambucanos, João Campos em 40, e apenas cinco cidades ainda não têm seu apoio definido.", "titulo_pt": "Raquel Lyra x João Campos: mapa mostra apoio em cidades de PE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 124303, "titulo": "Flávio Bolsonaro faz primeira visita ao Nordeste com centrão ausente e aposta em apoio no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-bolsonaro-faz-primeira-visita-ao-nordeste-com-centrao-ausente-e-aposta-em-apoio-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T07:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro realizou sua primeira visita ao Nordeste durante a campanha, demonstrando um isolamento significativo, pois foi recebido apenas por políticos e militantes de direita, enquanto aliados de outros partidos evitaram o palanque. A campanha apostou no apoio de líderes religiosos para tentar reverter essa situação no 2º turno.", "titulo_pt": "Flávio Bolsonaro realiza primeira visita ao Nordeste com isolamento e aposta em apoio religioso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124304, "titulo": "Kassio avalia desistir de selo para instituto de pesquisas na eleição de 2026 após críticas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/kassio-avalia-desistir-de-selo-para-instituto-de-pesquisas-na-eleicao-de-2026-apos-criticas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, Kassio Nunes Marques, está considerando desistir da ideia de criar um selo para institutos de pesquisas nas eleições de 2026 após enfrentar várias críticas à proposta de premiar as empresas mais precisas.", "titulo_pt": "Kassio considera desistir do selo para institutos de pesquisas nas eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124305, "titulo": "Entenda regras do TSE sobre IA e propaganda eleitoral na internet", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/entenda-regras-do-tse-sobre-ia-e-propaganda-eleitoral-na-internet.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As regras sobre o conteúdo na internet relacionado às eleições têm se tornado mais complexas a cada pleito, com novas camadas sendo adicionadas. O texto original discute as regras do TSE sobre inteligência artificial e propaganda eleitoral na internet.", "titulo_pt": "Entenda regras do TSE sobre IA e propaganda eleitoral na internet", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124349, "titulo": "Renda fica estável após recorde no governo Lula; alta desde 2022 é de 13%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/renda-fica-estavel-apos-recorde-no-governo-lula-alta-desde-2022-e-de-13.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A renda média do trabalho no Brasil manteve-se estável nos últimos meses após atingir um recorde durante o governo Lula (PT), conforme dados do IBGE. A renda aumentou em 13% desde 2022.", "titulo_pt": "Renda média do trabalho fica estável após recorde no governo Lula; alta desde 2022 é de 13%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124488, "titulo": "Análise WW: Guerra de escândalos testa campanhas de Lula e Flávio", "url": "https://www.cnnbrasil.com.br/politica/analise-ww-guerra-escandalos-lula-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha do petista Lula espera beneficiar-se com o próximo vazamento de escândalos, enquanto a campanha de Flávio Bolsonaro se encontra em meio a uma crise de imagem, com ambas as partes focadas na pauta anticorrupção.", "titulo_pt": "Análise WW: guerra de escândalos testa campanhas de Lula e Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 124554, "titulo": "Flávio Bolsonaro estreia campanha no Nordeste em Alagoas sem JHC e com Lira apenas em culto", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-estreia-campanha-no-nordeste-em-alagoas-sem-jhc-e-com-lira-apenas-em-culto", "fonte_id": "jota", "data_pub": "2026-08-26T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro iniciou sua campanha no Nordeste em Alagoas, excluindo JHC, e participou apenas de um culto com Lira. Durante uma fala a empresários, ele citou um versículo bíblico para criticar a alta carga de impostos e a reforma tributária.", "titulo_pt": "Flávio Bolsonaro estreia campanha no Nordeste em Alagoas sem JHC e com Lira apenas em culto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 124306, "titulo": "Aliados de João Campos intensificam apelo por Lula em Pernambuco", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/aliados-de-joao-campos-intensificam-apelo-por-lula-em-pernambuco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T02:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de João Campos está intensificando o apelo para que Lula participe de atos de campanha em Pernambuco, em um cenário onde a candidata Raquel Lyra tem uma desvantagem crescente.", "titulo_pt": "Aliados de João Campos intensificam apelo por Lula em Pernambuco", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124307, "titulo": "Rinha de políticos radicais em podcasts gera cortes e engajamento e invade campanhas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/rinha-de-politicos-radicais-em-podcasts-gera-cortes-e-engajamento-e-invade-campanhas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 22 de julho, dois pré-candidatos a deputado federal em Pernambuco, Jones Manoel (PSOL) e Eduardo Moura (Novo), protagonizaram um debate extremo. Este encontro, que ocorreu no espectro político radical, gerou controvérsia e engajamento, invadindo campanhas e debates públicos.", "titulo_pt": "Rinha de políticos radicais em podcasts gera cortes e engajamento e invade campanhas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124308, "titulo": "Casas Bahia... Braskem...", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/08/casas-bahia-braskem.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rede varejista Casas Bahia e a petroquímica Braskem anunciaram recuperação judicial ou extrajudicial para repactuar dívidas. A Casas Bahia deve R$ 17,3 bilhões e a Braskem, aproximadamente R$ 56,5 bilhões. A situação econômica do Brasil está precária.", "titulo_pt": "Casas Bahia e braskem em recuperação judicial", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 124350, "titulo": "C-Level lança série de entrevistas sobre propostas dos presidenciáveis para a economia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/c-level-lanca-serie-de-entrevistas-sobre-propostas-dos-presidenciaveis-para-a-economia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir desta semana, o programa C-Level Entrevista, do jornal Folha, dedicará episódios semanais aos programas econômicos dos candidatos à Presidência nas eleições de 2026.", "titulo_pt": "C-level lança série de entrevistas sobre propostas dos presidenciáveis para a economia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 124858, "titulo": "Israel occupying East Jerusalem UNRWA for second day", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-occupying-east-jerusalem-unrwa-second-day", "fonte_id": "middle_east_eye", "data_pub": "2026-08-26T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel continua ocupando um centro da UNRWA em Jerusalém Oriental por segundo dia, com relatos de soldados elevando a bandeira israelense no local. O governo local informou que equipes municipais israelenses entraram no prédio para trabalhos de manutenção e renovação, preparando-o para receber estudantes israelenses, o que foi condenado pela ONU.", "titulo_pt": "Israel ocupando centro da UNRWA em jerusalém oriental por segundo dia", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 124823, "titulo": "Deadly flash flood wipes away villages in Nepal, Tibet", "url": "https://www.dw.com/en/deadly-flash-flood-wipes-away-villages-in-nepal-tibet/a-78505576?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-26T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods devastaram vilas na Nepália e Tibet, impedindo os helicópteros de resgate de aterrissar devido à elevada água. Os líderes de Nepal e China ordenaram operações de resgate majorizadas.", "titulo_pt": "Inundações letais atingem vilas na nepália e Tibet", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 124894, "titulo": "Bce, raddoppia l'uso dell'Ia ma la metà dei dipendenti è frenata", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/26/bce-raddoppia-luso-dellia-ma-la-meta-dei-dipendenti-e-frenata_877fed1f-b06a-44ba-8efc-19da95535a90.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-26T09:43:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O uso da inteligência artificial dobrou, mas apenas metade dos funcionários a utiliza. Os funcionários economizam três horas semanais de tempo graças ao uso da IA.", "titulo_pt": "Bce, uso da IA duplica mas metade dos funcionários não a utiliza", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 124810, "titulo": "Putin signs decree allowing state seizure of businesses hit by drone strikes", "url": "http://www.euronews.com/2026/08/26/putin-signs-decree-allowing-state-seizure-of-businesses-hit-by-drone-strikes", "fonte_id": "euronews", "data_pub": "2026-08-26T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Putin assinou um decreto que permite que o estado se apropriar de empresas afetadas por ataques com drones, abrangendo setores como energia, transporte e logística, bem como qualquer instalação considerada crucial para a segurança nacional. Especialistas chamaram isso de 'nacionalização híbrida', alertando que seria usado para apreender ativos sob o pretexto de falhas de segurança.", "titulo_pt": "Putin assina decreto permitindo apropriação estatal de empresas afetadas por ataques com drones", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124630, "titulo": "Eight Dead, Others Missing as Floods Sweep Away Villages in Nepal", "url": "https://www.nytimes.com/2026/08/26/world/asia/nepal-floods-tibet-missing.html", "fonte_id": "nyt_world", "data_pub": "2026-08-26T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oito pessoas morreram e outras estão desaparecidas após inundações que afetaram vilas em um vale do rio Himalaia compartilhado entre Nepal e Tibet, uma região da China.", "titulo_pt": "Oito mortos, outras desaparecidas em inundações que destruíram vila em Nepal", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 124895, "titulo": "Borsa: Milano migliora (+0,25%), volumi record per A2a, cede Eni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/26/borsa-milano-migliora-025-volumi-record-per-a2a-cede-eni_54ade9df-9f26-4e4b-98ae-f95daebd7198.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-26T09:27:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Bolsa de Milão teve uma leve alta de 0,25%. A empresa A2a registrou volumes de negócios recorde. A Eni cedeu valor. Houveram compras em ações de Buzzi, Azimut e Cucinelli. As bancas operaram de forma irregular.", "titulo_pt": "Bolsa: milão melhora (+0,25%), volumes recorde para A2a, cede Eni", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 124493, "titulo": "Irã e Omã discutem corredor temporário em Ormuz enquanto impasse com EUA se prolonga", "url": "https://www.infomoney.com.br/mercados/ira-e-oma-discutem-corredor-temporario-em-ormuz-enquanto-impasse-com-eua-se-prolonga/", "fonte_id": "infomoney", "data_pub": "2026-08-26T09:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã e o Omã vêm mantendo negociações intermitentes sobre o controle temporário do tráfego pelo estreito de Ormuz, enquanto o impasse com os Estados Unidos se prolonga. Essas discussões visam controlar o tráfego marítimo por essa via estratégica.", "titulo_pt": "Irã e Omã discutem corredor temporário em Ormuz enquanto impasse com EUA persiste", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 124859, "titulo": "Netanyahu denounces Iran as 'savages' who cannot be dealt with", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/netanyahu-denounces-iran-savages-who-cannot-be-dealt", "fonte_id": "middle_east_eye", "data_pub": "2026-08-26T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Netanyahu declarou que um acordo diplomático não é possível com os 'sauageros' que governam a Irã, após uma reunião com Trump sobre pressões econômicas. O premiê israelense expressou dúvidas sobre a possibilidade de um acordo com o regime iraniano.", "titulo_pt": "Netanyahu denuncia Irã como 'sauageros' que não podem ser negociados", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 124941, "titulo": "US pulls China punches in Iran ‘economic D-Day’ sanctions", "url": "https://www.scmp.com/plus/news/us/diplomacy/article/3365321/us-pulls-china-punches-iran-economic-d-day-sanctions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China foi advertida sobre possíveis represálias em caso de sanções dos Estados Unidos contra o Irã. O governo chinês afirmou que fará tudo o que for necessário para proteger seus direitos e interesses, e que a guerra econômica só aumentará tensões e riscos.", "titulo_pt": "EUA ameaçam China em sanções econômicas contra o Irã", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124824, "titulo": "Germany: Carnivalgoers rescued after being trapped on ride", "url": "https://www.dw.com/en/germany-carnivalgoers-rescued-after-being-trapped-on-ride/a-78504830?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-26T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Viajantes ficaram presos a uma altura considerável após o funcionamento falhar em uma roda-gigante em Hamburgo.", "titulo_pt": "Alemanha: passageiros resgatados após ficarem presos em montanha-russa em hamburgo", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 124896, "titulo": "Chernobyl: Inside the Meltdown, viaggio nel disastro nucleare 40 anni dopo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/26/chernobyl-inside-the-meltdown-viaggio-nel-disastro-nucleare-40-anni-dopo_7b61e399-298f-4a9a-822e-2a0be6fafa32.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-26T09:08:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A docuserie 'Chernobyl: Inside the Meltdown, viaggio nel disastro nucleare 40 anni dopo' foi lançada no Disney+. O documentário destaca que os russos modernos tentam evocar o medo que sentiram na época do desastre.", "titulo_pt": "Chernobyl: dentro do colapso, viagem no desastre nuclear 40 anos depois", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 124943, "titulo": "Chinese navy fires new radar-absorbing YJ-18A anti-ship missile in sea trial: expert", "url": "https://www.scmp.com/news/china/military/article/3365317/chinese-navy-fires-new-radar-absorbing-yj-18a-anti-ship-missile-sea-trial-expert?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China testou uma nova variante do míssil anti-navio YJ-18A com revestimento de absorção de radar preto, segundo especialistas. Durante o teste, um míssil foi disparado de um sistema de lançamento vertical de uma embarcação da marinha para testar suas performances.", "titulo_pt": "Marinha chinesa testa novo míssil anti-navio YJ-18A com revestimento de absorção de radar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124631, "titulo": "Canadians Stand Their Ground as Trump’s New Tariffs Endanger Jobs", "url": "https://www.nytimes.com/2026/08/26/world/canada/carney-canada-trump-tariffs-retaliate.html", "fonte_id": "nyt_world", "data_pub": "2026-08-26T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negócios canadenses estão se preparando para um possível prejuízo financeiro devido à falência das últimas negociações de comércio entre Estados Unidos e Canadá. No entanto, muitos canadenses estão adotando uma postura de resistência.", "titulo_pt": "Canadenses se preparam para prejuízos com novas tarifas de Trump", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 124632, "titulo": "Ukraine’s Most Potent Weapon: The Software Orchestrating Its Drone Army", "url": "https://www.nytimes.com/2026/08/26/world/europe/ukraine-delta-battlefield-management.html", "fonte_id": "nyt_world", "data_pub": "2026-08-26T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sistema Delta integra dados de campo para identificar alvos, criando uma zona de ataque de quilômetros quadrados. A tecnologia é creditada por ter ajudado a frear as avanços russos quase paralisadamente.", "titulo_pt": "Ucrânia’s mais potente arma: o Software orquestrando seu exército de drones", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 124906, "titulo": "Justice Ministry eyes budget boost for policies on foreign nationals", "url": "https://www.japantimes.co.jp/news/2026/08/26/japan/politics/justice-ministry-budget-boost-foreigner/", "fonte_id": "japan_times", "data_pub": "2026-08-26T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério da Justiça planeja solicitar um orçamento total de aproximadamente 985,6 bilhões de ienes para o ano que começa em abril do próximo ano, representando um aumento de 15,7% em comparação com o orçamento inicial previsto para 2026.", "titulo_pt": "Ministério da justiça considera aumento no orçamento para políticas sobre estrangeiros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124633, "titulo": "Ancient Lebanese Treasures Take a Journey From Modern-Day Conflict", "url": "https://www.nytimes.com/2026/08/26/world/middleeast/lebanon-byblos-israel.html", "fonte_id": "nyt_world", "data_pub": "2026-08-26T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antigas tesouros libaneses estão sendo exibidos em Paris, destacando como conflitos modernos na região do Oriente Médio ameaçam o patrimônio cultural da área.", "titulo_pt": "Tesouros antigos do líbano realizam viagem de volta do conflito moderno", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 124798, "titulo": "U.S. crude hovers around $80 as oil prices sink on Hormuz deal hopes", "url": "https://www.cnbc.com/2026/08/26/oil-falls-as-the-us-pivots-to-economic-pressure-on-iran-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-26T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As cotações do petróleo caíram na sessão de ontem, enquanto investidores avaliam a mudança dos Estados Unidos em relação às sanções econômicas em vez de operações militares contra o Irã.", "titulo_pt": "Crúteis norte-americanos flutuam perto de $80 com preços do petróleo caindo diante das esperanças de acordo no estreito de Ormuz", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 124801, "titulo": "Haidilao shares jump as delivery growth and new restaurant brands boost outlook", "url": "https://www.cnbc.com/2026/08/26/haidilao-shares-delivery-restaurant-growth.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-26T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Haidilao subiram após os resultados mostrarem um crescimento forte no delivery e nas novas formas de restaurantes, embora as receitas das restaurantes de churrasco tradicionais tenham diminuído.", "titulo_pt": "Ações da haidilao sobem com crescimento do delivery e novas marcas de restaurantes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 124343, "titulo": "É cliente de uma varejista que pediu recuperação judicial? Veja riscos e como agir", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/e-cliente-de-uma-varejista-que-pediu-recuperacao-judicial-veja-riscos-e-como-agir.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Senacon começou a monitorar as empresas Casas Bahia, Marabraz e Tok&Stok após eles pedirem recuperação judicial. O objetivo é identificar possíveis problemas que possam afetar os consumidores.", "titulo_pt": "É cliente de uma varejista que pediu recuperação judicial? Veja riscos e como agir", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124344, "titulo": "Recuperação extrajudicial da Braskem põe Petrobras no foco", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/recuperacao-extrajudicial-da-braskem-poe-petrobras-no-foco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem anunciou sua recuperação extrajudicial de uma dívida de US$ 11 bilhões, evitando uma crise imediata que teria levado a empresa a pedir recuperação judicial. No entanto, as partes ainda estão distantes em questões fundamentais, incluindo os termos do apoio dos acionistas e a renegociação da dívida existente.", "titulo_pt": "Recuperação extrajudicial da Braskem coloca Petrobras no foco", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124944, "titulo": "Chinese hotpot chain Haidilao bets on takeaway, new brands, lower-tier reach for growth", "url": "https://www.scmp.com/business/companies/article/3365314/chinese-hotpot-chain-haidilao-bets-takeaway-new-brands-lower-tier-reach-growth?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maior cadeia de churrascaria de hotpot da China, Haidilao International Holding, tem visto o delivery se tornar seu segmento de maior crescimento, com um aumento significativo na demanda por pratos individuais como pratos de arroz. A receita do delivery da empresa listada em Hong Kong atingiu 2,05 bilhões de yuans (US$ 305 milhões) nos primeiros seis meses, aumentando 121,2% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Haidilao aposta em delivery, novas marcas e alcance de baixa linha para crescimento", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 125060, "titulo": "(2nd LD) Hyundai Motor to expand global production capacity, launch over 100 models by 2030", "url": "https://en.yna.co.kr/view/AEN20260826005652320", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T08:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hyundai Motor planeja expandir sua capacidade de produção global e lançar mais de 100 modelos até 2030. A empresa anunciou esses planos em Seul, em 26 de agosto.", "titulo_pt": "Hyundai Motor vai expandir produção global e lançar mais de 100 modelos até 2030", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 124550, "titulo": "Quando o desconto custa caro: os riscos concorrenciais no delivery", "url": "https://www.jota.info/opiniao-e-analise/artigos/quando-o-desconto-custa-caro-os-riscos-concorrenciais-no-delivery", "fonte_id": "jota", "data_pub": "2026-08-26T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A competição entre aplicativos de à falência da gigante imobiliária chinesa, o que tem o potencial de ameaçar o modelo de rede de parcerias das grandes empresas de auditoria.", "titulo_pt": "Liquidadores podem processar PwC globalmente após colapso da gigante imobiliária chinesa, decide tribunal", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 125067, "titulo": "(2nd LD) Stocks close nearly 1 pct higher on chip gains ahead of Nvidia earnings release", "url": "https://en.yna.co.kr/view/AEN20260826005952320", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados de Seul fecharam com alta de quase 1% em virtude das gananciosas ações de chips, antes do lançamento dos resultados financeiros da Nvidia.", "titulo_pt": "Ações de chips impulsionam mercados de seul, fechando com alta de quase 1% antes do relatório da Nvidia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 125068, "titulo": "S. Korean won gains slightly against U.S. dollar ahead of BOK's rate decision", "url": "https://en.yna.co.kr/view/AEN20260826007700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano valorizou-se levemente em relação ao dólar americano antes da decisão da BOK sobre a taxa de juros.", "titulo_pt": "Won sul-coreano valoriza-se levemente antes da decisão da BOK sobre a taxa de juros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 124346, "titulo": "Meta mandou apagar evidências sobre abuso sexual infantil, diz ex-funcionário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/meta-mandou-apagar-evidencias-sobre-abuso-sexual-infantil-diz-ex-funcionario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-funcionário da Meta afirmou que a empresa apagou evidências sobre abuso sexual infantil em mais de uma ocasião. Jason Sattizahn, ex-pesquisador de integridade e segurança da unidade de realidade virtual da empresa, fez a acusação.", "titulo_pt": "Ex-funcionário diz que meta apagou evidências sobre abuso sexual infantil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124347, "titulo": "Fiesp lança simulador da reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/08/fiesp-lanca-simulador-da-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiesp lançou uma ferramenta de simulador para ajudar micro, pequenas e médias empresas a se prepararem para a reforma tributária, que também pode ser utilizada por contribuintes de outros portes. O simulador foi lançado nesta quarta-feira (26).", "titulo_pt": "Fiesp lança simulador para reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124348, "titulo": "Veja como evoluiu a renda média do trabalho no seu e nos outros estados desde 2012", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/veja-como-evoluiu-a-renda-media-do-trabalho-no-seu-e-nos-outros-estados-desde-2012.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A renda média mensal do trabalho nas unidades da Federação, no segundo trimestre de 2026, variou de R$ 2.284 no Maranhão a R$ 6.171 no Distrito Federal.", "titulo_pt": "Veja como evoluiu a renda média do trabalho no seu e nos outros estados desde 2012", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124645, "titulo": "Fears grow for fourth rate hike after Australia sees higher-than-expected July inflation", "url": "https://www.theguardian.com/australia-news/2026/aug/26/fears-grow-for-fourth-rate-hike-after-higher-than-expected-july-inflation-rate", "fonte_id": "guardian_world", "data_pub": "2026-08-26T06:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação no mês de julho no Australia foi de 3,5%, abaixo do esperado, mas ainda acima de 2,5%, o que alimenta a preocupação de que o Banco Reserve possa aumentar a taxa de juros pela quarta vez este ano. O Australian Bureau of Statistics informou que os preços do consumidor subiram 3,5% no ano, contra 3,8% no mês anterior.", "titulo_pt": "Medo de quarto aumento de juros após inflação australiana ser maior do que o esperado em julho", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 124512, "titulo": "AI precisa de um ‘iPhone moment’, diz Sam Altman", "url": "https://braziljournal.com/ai-precisa-de-um-iphone-moment-diz-sam-altman/", "fonte_id": "brazil_journal", "data_pub": "2026-08-26T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sam Altman afirma que a inteligência artificial ainda não teve um momento revolucionário como o iPhone, que transformou completamente a forma como as pessoas interagem com dispositivos.", "titulo_pt": "AI precisa de um ‘momento iphone’, diz Sam Altman", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 124904, "titulo": "‘Tech-gemony’ will determine who shapes the next global order", "url": "https://www.japantimes.co.jp/commentary/2026/08/26/world/tech-gemony-global-order/", "fonte_id": "japan_times", "data_pub": "2026-08-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China representa um desafio que exige mudanças fundamentais nas políticas tanto do governo quanto das empresas, bem como alterações de comportamento por parte dos cidadãos comuns.", "titulo_pt": "Domínio tecnológico determinará quem moldará o próximo ordenamento global", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124764, "titulo": "Stanley Druckenmiller makes AI writing a billionaire flex", "url": "https://www.axios.com/2026/08/26/stanley-druckenmiller-ai-writing-wsj-op-ed", "fonte_id": "axios", "data_pub": "2026-08-26T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O investidor Stanley Druckenmiller admitiu ter usado AI para escrever um artigo publicado no Wall Street Journal. A adição de AI na escrita não foi o foco principal da atenção recebida pelo artigo, que criticou o Secretário do Tesouro Scott Bessent.", "titulo_pt": "Stanley Druckenmiller revela uso de AI na escrita para artigo no wall street journal", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 125077, "titulo": "Hyundai Motor to launch over 100 vehicle models by 2030", "url": "https://www.koreaherald.com/article/10853297", "fonte_id": "korea_herald", "data_pub": "2026-08-26T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyundai Motor planeja lançar mais de 100 modelos de veículos globalmente até 2030, com 58 desses modelos destinados ao mercado norte-americano. A empresa visa usar essa ampla expansão de produtos para impulsionar sua transformação em uma empresa de tecnologia física com IA.", "titulo_pt": "Hyundai Motor planeja lançar mais de 100 modelos de veículos até 2030", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 124965, "titulo": "Raised on AI", "url": "https://www.technologyreview.com/2026/08/26/1141949/editors-letter-september-2026/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor criou contas de e-mail e redes sociais para seu filho recém-nascido e compartilhou sua foto em várias plataformas. Ele começou a criar a presença digital do filho muito antes que ele pudesse se manter sozinho.", "titulo_pt": "Educado com AI", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124966, "titulo": "AI models flub these intelligence tests. Can you fare any better?", "url": "https://www.technologyreview.com/2026/08/26/1141952/puzzles-ai-models-flub-these-tests/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Testes de inteligência, como quebra-cabeças e jogos, têm sido utilizados desde o início do desenvolvimento da IA para avaliar o progresso dos modelos. Um artigo de 1959 publicado pelo cientista da IBM Arthur Samuel popularizou o termo 'aprendizado de máquina'.", "titulo_pt": "Modelos de IA falham nessas provas de inteligência. Você consegue se sair melhor?", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124999, "titulo": "A Mutation Is Making It Easier for Drug-Resistant Malaria to Spread", "url": "https://www.wired.com/story/genetic-mutation-drug-resistant-malaria-spread/", "fonte_id": "wired", "data_pub": "2026-08-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos achados iluminam o que está tornando o parasita menos tratável com a droga considerada a primeira linha de defesa.", "titulo_pt": "Mutação facilita a propagação do Malaria resistente ao medicamento", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 124907, "titulo": "China goes rural with data centers in quest to power AI", "url": "https://www.japantimes.co.jp/news/2026/08/26/asia-pacific/china-rural-data-centers-power-ai/", "fonte_id": "japan_times", "data_pub": "2026-08-26T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estratégia de Beijing prevê que a maior parte da infraestrutura digital para o desenvolvimento de inteligência artificial em todo o país seja estabelecida nas regiões rurais do oeste, enquanto a costa leste, mais populosa, se concentra em outras áreas.", "titulo_pt": "China adota ruralização para centros de dados em busca de impulsionar a IA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124969, "titulo": "Bioteq lifts Yilan plant output as it shifts production and eyes 2027 growth", "url": "https://www.digitimes.com/news/a20260826PD212/plant-2027-production-growth-equipment.html", "fonte_id": "digitimes", "data_pub": "2026-08-26T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bioteq está aumentando a produção em sua fábrica do Parque Científico de Yilan, o que pode afetar cadeias de suprimento em várias regiões, incluindo Ásia, África e Américas. A empresa está transferindo mais produtos e modernizando equipamentos com o objetivo de melhorar a eficiência, gerenciar geopolítica e apoiar a demanda em mercados em desenvolvimento.", "titulo_pt": "Bioteq aumenta produção na fábrica de Yilan e impacta cadeias de suprimento", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 124971, "titulo": "South Korea, US clash over reactor choice in US$350B nuclear deal", "url": "https://www.digitimes.com/news/a20260826PD228/nuclear-investment-design-cost-westinghouse.html", "fonte_id": "digitimes", "data_pub": "2026-08-26T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul e Estados Unidos estão em conflito sobre o design da usina nuclear e a gestão do projeto no pacote de investimentos nuclear sul-coreanos no valor de 350 bilhões de dólares.", "titulo_pt": "Coreia do sul e EUA em disputa sobre escolha do reator em acordo nuclear de 350 bilhões de dólares", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 124974, "titulo": "Hot Chips 2026: Nvidia pushes deeper into server CPUs with Vera", "url": "https://www.digitimes.com/news/a20260826VL218/nvidia-2026-cpu-processor-amd.html", "fonte_id": "digitimes", "data_pub": "2026-08-26T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Hot Chips 2026, a Nvidia divulgou mais detalhes sobre a Vera, sua próxima geração de processadores de dados-center, enquanto avança no mercado de processadores de servidores independentes, tradicionalmente dominado por Intel e AMD.", "titulo_pt": "Hot Chips 2026: nvidia avança com a Vera em processadores de servidores", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 124975, "titulo": "Driving the future: Malaysia's strategic automotive evolution at GATE 2026", "url": "https://www.digitimes.com/news/a20260826VL217/2026-automotive-expo-market-vehicle.html", "fonte_id": "digitimes", "data_pub": "2026-08-26T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Global Automotive and Technology Expo 2026 (GATE 2026) abriu oficialmente em 26 de agosto, destacando esforços para aprofundar a cadeia de suprimentos locais do setor automotivo, acelerar a adoção de tecnologia e posicionar o país como o principal hub de automóveis e mobilidade inteligente da ASEAN. A cooperação entre China, Malásia e outros países da ASEAN foi particularmente notada no evento.", "titulo_pt": "Dirigindo o futuro: a evolução estratégica automotiva da malásia no GATE 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 124553, "titulo": "O banimento de contas empresariais pelas big techs", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-banimento-de-contas-empresariais-pelas-big-techs", "fonte_id": "jota", "data_pub": "2026-08-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O banimento de contas empresariais pelas grandes tecnológicas está limitado por leis como o CDC, o Marco Civil e a eficácia horizontal dos direitos fundamentais.", "titulo_pt": "Banimento de contas empresariais pelas grandes tecnológicas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 124947, "titulo": "Brain tech push gains pace as China draws up standards and firms challenge Neuralink", "url": "https://www.scmp.com/economy/china-economy/article/3365298/brain-tech-push-gains-pace-china-draws-standards-and-firms-challenge-neuralink?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está elaborando um conjunto amplo de padrões para a tecnologia de interface cérebro-computador, buscando acelerar a comercialização de um campo em que startups chinesas competem cada vez mais com a Neuralink de Elon Musk por liderança global. Sob diretrizes em projeto do Ministério da Indústria e Tecnologia da Informação (MIIT), Beijing planeja formular ou revisar mais de 40 padrões até 2028 e incentivar pelo menos 100 empresas a adotá-los.", "titulo_pt": "Tecnologia de interface cérebro-computador avança na China com novos padrões e competição com a Neuralink", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 125087, "titulo": "Stocks close nearly 1% higher on chip gains ahead of Nvidia earnings release", "url": "https://www.koreaherald.com/article/10853189", "fonte_id": "korea_herald", "data_pub": "2026-08-26T07:55:00Z", "idioma": "en", "provavel_duplicata_de": 125067, "texto_pt": "As ações sul-coreanas encerraram o dia com alta de cerca de 1%, impulsionadas por compras de ações de gigantes da indústria dos semicondutores e condições externas mais favoráveis, enquanto os investidores aguardam o relatório de resultados de lucros da Nvidia. O won sul-coreano caiu em relação ao dólar americano.", "titulo_pt": "Ações sul-coreanas fecham com alta de quase 1% com avanços nos chips e expectativa de resultados da Nvidia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 124891, "titulo": "Bill Gates calls for ‘human reserved’ jobs to protect labour force from AI", "url": "https://www.ft.com/content/42c449c6-03f6-4097-9eae-e119447e8aa5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Gates escreveu um ign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-26T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peritos em saúde feminina sugerem uma abordagem 'reverse pitch' para endometriose, osteoporose e tratamentos de doenças autoimunes, enfatizando o potencial de lucro.", "titulo_pt": "Quando o assunto é saúde feminina, o lucro fala mais alto", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 125056, "titulo": "Opinion: Many post-Dobbs abortion fears have not come to pass. What does that mean for advocates?", "url": "https://www.statnews.com/2026/08/26/dobbs-abortion-predictions-infant-mortality-data-freedom/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-26T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor David N. Hackney argumenta que a oposição às restrições ao aborto deve se concentrar em valores morais, em vez de se basear em estatísticas. Ele escreveu um livro intitulado 'Impossible Choices'.", "titulo_pt": "Opinião: a oposição às restrições ao aborto deve se concentrar em valores, não em estatísticas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 125057, "titulo": "Opinion: Medical aid in dying and the burden of choosing to live", "url": "https://www.statnews.com/2026/08/26/medical-aid-in-dying-new-york-choice-burden-philosophy-ethics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-26T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Monika Piotrowska afirma que, uma vez que o auxílio médico para a morte se torne disponível, o status quo muda.", "titulo_pt": "Opinião: auxílio médico para a morte e o peso da escolha de continuar vivendo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 124973, "titulo": "China fusion consortium targets 25T superconducting magnet prototype by 2030", "url": "https://www.digitimes.com/news/a20260826PD230/2030-shanghai-nuclear-fusion-supply-chain-technology.html", "fonte_id": "digitimes", "data_pub": "2026-08-26T08:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma consortium formada por empresas e instituições chinesas está trabalhando em tecnologia de supercondutores de alta temperatura para um protótipo de 25T de magnetização. O objetivo é desenvolver e engenhar essa tecnologia para o projeto China Circulation No. 4 até 2030.", "titulo_pt": "Consortium chinês almeja protótipo de magnetização supercondutora de 25T para 2030", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 124946, "titulo": "‘Smart’ diabetes probiotic; Chinese missile AI with 90% accuracy: 7 science highlights", "url": "https://www.scmp.com/news/china/science/article/3365295/smart-diabetes-probiotic-chinese-missile-ai-90-accuracy-7-science-highlights?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time chinês está desenvolvendo uma probiótica 'inteligente' para o tratamento do diabetes que pode ser comercializada nos EUA em duas anos. Além disso, um sistema de inteligência artificial chinês é capaz de rastrear heat signatures semelhantes às das aeronaves F-22 e F-35 com mais de 90% de precisão.", "titulo_pt": "Probiótico inteligente para diabetes e AI chinesa com 90% de precisão no rastreamento de heat signatures", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124483, "titulo": "20 Exoplanetas começam a ser observados pela Nasa para possível habitação", "url": "https://www.cnnbrasil.com.br/ciencia/missao-pandora-da-nasa-vai-determinar-a-presenca-de-agua-em-exoplanetas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou uma sonda para analisar a composição atmosférica de mais de 20 exoplanetas fora do nosso sistema solar, com o objetivo de identificar possíveis condições para a habitação.", "titulo_pt": "20 Exoplanetas passam a ser observados pela Nasa para possível habitação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125072, "titulo": "Gov't research facilities can be used by private firm to produce ASF vaccines", "url": "https://en.yna.co.kr/view/AEN20260826006400315", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Instalações de pesquisa governamentais podem ser utilizadas por uma empresa privada para produzir vacinas contra a febre aftosa em animais.", "titulo_pt": "Instalações de pesquisa podem ser usadas por empresa privada para produzir vacinas contra febre aftosa em animais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 124918, "titulo": "Japan’s hotter summers trigger heavier rainfall, too", "url": "https://www.japantimes.co.jp/environment/2026/08/26/climate-change/hotter-summer-more-rain/", "fonte_id": "japan_times", "data_pub": "2026-08-26T06:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os temporais intensos vivenciados no Präfektura de Chiba mais cedo neste mês são um exemplo de eventos precipitativos extremos causados pelo aquecimento global.", "titulo_pt": "Estações mais quentes no Japão levam a precipitações mais intensas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 125098, "titulo": "SK Biopharm bets $800m on new epilepsy blockbuster", "url": "https://www.koreaherald.com/article/10852996", "fonte_id": "korea_herald", "data_pub": "2026-08-26T06:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Biopharmaceuticals investiu cerca de 800 milhões de dólares nos direitos para um tratamento de epilepsia desenvolvido pela Biohaven, com o objetivo de criar um segundo medicamento de grande sucesso para complementar seu remédio existente para epilepsia. A empresa fechou um acordo exclusivo global com a Biohaven Bioscience Ireland par
