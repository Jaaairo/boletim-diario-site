<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "09/09/2026 15:19", "stats": {"noticias_novas": 1014, "resumos_gerados": 243}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A crise no Supremo Tribunal Federal (STF) continua aprofundando-se, com ministros em conflito sobre a reintegração de Andrei Rodrigues ao comando da Polícia Federal e Leandro Almada à direção de inteligência. O ministro Flávio Dino, que reintegrou os dois, justificou a decisão com o impacto nas investigações do caso 'Dark Horse', que envolve o ex-presidente Jair Bolsonaro. A crise institucional, que também envolve o ministro André Mendonça, está afetando a confiança nas instituições brasileiras e levando especialistas a alertar para a 'metástase' da crise. O presidente Luiz Inácio Lula da Silva defendeu a quebra completa de sigilo das investigações do caso Master, considerando-o o maior crime financeiro da história do Brasil. Paralelamente, o governo autorizou a abertura de créditos para financiar subsídios de combustíveis e fortalecer a agricultura familiar. Além disso, uma pesquisa Meio/Ideia mostrou que Lula e Tarcísio de Freitas empataram no primeiro e no segundo turno, com 46% de intenções de voto cada um.", "mundo": "As relações diplomáticas entre os Estados Unidos e o Brasil estão passando por um período atípico, conforme relatado pela embaixadora brasileira em Washington. A União Europeia destinou 115 milhões de euros em ajuda emergencial para reforçar a segurança na fronteira de Ceuta, em resposta a uma invasão de mais de 70.000 migrantes. Os ataques de 11 de setembro de 2001 tiveram parte de sua planificação realizada em Hamburgo, e o governo de Israel reagiu com intensidade às novas restrições impostas pelo Reino Unido às colônias na Cisjordânia. Na Colômbia, o secretário de Estado dos Estados Unidos, Marco Rubio, prometeu eleições 'o mais rápido possível' na Venezuela, sob certas condições. O governo de Benjamin Netanyahu reagiu com intensidade às novas restrições impostas pelo Reino Unido às colônias na Cisjordânia, enquanto Marine Le Pen, líder do Rassemblement National, manteve-se em silêncio sobre a vitória da Alternative für Deutschland nas eleições alemães. A Alemanha, que enfrentou o ressurgimento do fascismo, registrou uma vitória esmagadora da extrema-direita na Saxônia-Anhalt. Na Coreia do Sul, o presidente Lee Jae Myung encerrou sua visita à França, enquanto a União Europeia busca simplificar e 'europeizar' a contratação pública. O governo dos EUA anunciou a intenção de negociar acordos comerciais com a Colômbia, o Peru e o Equador, enquanto a China acusou oficiais filipinos de 'exagerar e mentir' após o secretário de Defesa filipino ler publicamente uma nota chinesa sobre o Mar da China Meridional.\n\nA China intensificou suas operações militares na direção de Taiwan, movimentando uma brigada de canhões autopropelidos de 155mm PLZ-05, o que aumentou a tensão na região. Paralelamente, o Reino Unido impôs sanções contra os assentamentos israelenses, o que levou a uma deterioração nas relações diplomáticas entre Israel e o Reino Unido, bem como com outros países europeus. A Coreia do Norte recebeu tecnologia de drones da Rússia, o que potencializou suas capacidades militares. Além disso, o Irã aumentou suas atividades na Jordânia, com a base Al-Azraq sendo alvo de operações. Em outro front, a Nicarágua acusou a Alemanha de colaborar com o genocídio israelense, levando a um caso no Tribunal Internacional de Justiça.", "economia": "As exportações taiwanesas aumentaram 41% e atingiram um novo recorde, enquanto as vendas globais de notebooks devem diminuir 8%, segundo a MIC. O Tesouro dos EUA planeja comprar US$ 6 bilhões em títulos de dívida a prazo, o que pode levar os juros a subirem. As exportações brasileiras para os EUA, até agosto, foram as menores desde 2023, totalizando US$ 24,1 bilhões. A China enfrentou uma inflação acelerada em agosto, impulsionada por altos custos de energia, enquanto o petróleo atingiu US$ 100 por barril pela primeira vez desde maio de 2026, devido a tensões no Oriente Médio. O petróleo Brent superou os US$ 100 por barril, refletindo preocupações sobre a interrupção do suprimento global devido a ataques entre Estados Unidos e Irã. O Banco da Reserva Australiana enfrenta dificuldades em controlar a inflação, que permanece acima de seu alvo de 2,5%, levando a uma crise de custo de vida. O Departamento do Tesouro dos EUA anunciou a compra de até US$ 6 bilhões em dívida a prazo, triplicando o nível normal de operações.", "tecnologia": "Em um evento na Apple Park, na Califórnia, o CEO Tim Cook abriu a cerimônia com aplausos prolongados, destacando a expectativa pela próxima atualização do iOS 27, que será lançada na próxima segunda-feira, 14 de setembro. A principal novidade foi o Siri AI, que será integrado ao sistema. A Apple também apresentou o iPhone Duo, o primeiro smartphone dobrável da empresa, e o relógio inteligente Apple Watch Series 12, que recebeu um chip mais rápido e novas funcionalidades, incluindo um always-on Siri com reconhecimento de voz. Além disso, a empresa anunciou a chegada de um modelo dobrável com preço de US$ 2.000. Em outro desenvolvimento, a TSMC, líder global em fabricação de chips semicondutores, viu sua participação de mercado aumentar gradualmente. Por outro lado, a OpenAI nomeou um dos principais responsáveis pela segurança do AI dos EUA para seu conselho de administração, enquanto pesquisadores da Anthropic alertaram que a corrida para desenvolver uma superinteligência auto-aprimorável pode destruir a humanidade até o fim desta década. Esses eventos refletem a crescente integração da IA em nossa vida cotidiana e as preocupações crescentes sobre seus potenciais riscos.", "ciencia": "Em Paris, representantes da indústria espacial se reuniram para a cúpula do setor, sob a liderança do presidente francês Emmanuel Macron. Cerca de 120 países participaram, exceto Rússia, Irã e Coreia do Norte. O objetivo da reunião é manter a Europa no centro da corrida espacial. Em outra pesquisa científica, a vacina Shingrix, usada para prevenir o herpes zóster, foi descoberta para possivelmente proteger o coração, reduzindo o risco de doenças cardíacas. A NASA e seus parceiros europeus lançaram o Sentinel-6B para melhorar as previsões de furacões durante o El Niño, fornecendo medições precisas do nível do mar. Outro estudo revelou que os pássaros-cachorros mais inteligentes permanecem inteligentes à medida que envelhecem, produzem mais jovens e possuem uma microbiota intestinal mais saudável, mostrando a importância da inteligência em aves.", "cultura": "Em Veneza, o filme 'Dau', dirigido por Ilya Khrzhanovsky, foi exibido no Festival de Veneza. O filme retrata a vida na União Soviética durante o auge do stalinismo. Este projeto ambicioso durou duas décadas e envolveu a construção de um grande estúdio onde pessoas viviam por mais de um ano para criar uma imersão na sociedade soviética do século XX. No campo da televisão, a Globo renovou a série 'Arcanjo Renegado' para uma sétima temporada, que será produzida para o Globoplay. O documentário 'Dau' também merece destaque, explorando a vida na União Soviética sob o stalinismo. Finalmente, a música de Curaçao é preservada através do tambú e da tumba, ritmos que refletem a identidade sonora da ilha.", "sociedade": "A cidade de Taipei planeja aumentar o número de inspeções de segurança alimentar para melhorar a monitorização e garantir a qualidade dos alimentos na região. Em contraste, um jovem de 18 anos foi baleado na cabeça durante um primeiro encontro no Rio de Janeiro, levando a preocupações sobre a segurança desses encontros. No Paraná, um pai matou sua filha de 5 anos em um ato de vingança contra a mãe, resultando em uma investigação intensa. No Nepal, drones estão sendo usados para distribuir ajuda humanitária após as enchentes, onde pelo menos 1.367 pessoas morreram e mais de 5.000 continuam desaparecidas. Em Bangladesh, uma crise de sarampo matou mais de 1.000 crianças desde março, tornando este ano o mais letal para a doença no país em décadas.", "meio_ambiente": "O verão nos Estados Unidos registrou a maior temperatura média desde 1910, conforme informa a NOAA, devido a ondas de calor recordes. Em contraste, a Indonésia enfrenta um aumento significativo de emissões de gases de efeito estufa devido a incêndios florestais nas ilhas de Bornéu e Sumatra, superando até mesmo a Rússia em termos de emissão de dióxido de carbono. No Brasil, o Deserto do Atacama pode experimentar uma das maiores florações em duas décadas, com as primeiras flores já aparecendo. Além disso, o Chile criou um novo conselho ambiental onde jovens de 14 a 20 anos podem participar das decisões da Agência de Proteção Ambiental, sem necessidade de experiência prévia. No Sul e Sudeste do Brasil, temporais estão avançando, trazendo chuva intensa, raios, ventos fortes e a possibilidade de granizo. Por fim, a Escócia enfrenta preocupações sobre a segurança hídrica devido à seca.", "direitos_humanos": "Sete suspeitos foram detidos por supostamente traficar pessoas com o intuito de extração de órgãos, conforme informado pelo Taipei Times. Em outro destaque, a ex-esposa de Elon Musk, Justine Wilson, relatou em entrevista para um novo documentário que sofreu manipulação psicológica durante o casamento, conhecida como 'gaslighting'. A primeira cerimônia de casamento gay foi realizada na Bolívia, apesar de o casamento entre pessoas do mesmo sexo não estar legalizado no país, informou a BBC Brasil. Esses eventos refletem a complexidade e diversidade dos desafios relacionados aos direitos humanos em diferentes partes do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 154187, "titulo": "Operação na casa de César Rincon apreendeu 329 cartuchos de munição, diz PC", "url": "https://www.metropoles.com/celebridades/operacao-na-casa-de-cesar-rincon-apreendeu-329-cartuchos-de-municao-diz-pc", "fonte_id": "metropoles", "data_pub": "2026-09-09T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil realizou uma busca em um rancho pertencente a César Rincon em Santa Catarina, apreendendo 329 cartuchos de munição.", "titulo_pt": "Operação na propriedade de César Rincon apreendeu 329 cartuchos de munição, diz PC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 154092, "titulo": "Em carta a cristãos, Zema diz que uso medicinal do canabidiol não pode ser 'pretexto' para liberar drogas e defende ensino em casa", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/09/zema-carta-cristaos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema, candidato do Novo à Presidência, enviou uma carta a cristãos afirmando que o uso medicinal do canabidiol não pode ser usado como 'pretexto' para a liberação de drogas. Ele também defendeu o ensino em casa e o ensino cívico.", "titulo_pt": "Zema defende uso medicinal do canabidiol e ensino em casa em carta a cristãos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 154093, "titulo": "Delator do caso Master detalha pagamentos a fundo de 'Dark Horse' e revela uso de empresa nas Bahamas", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/09/delator-do-caso-master-detalha-pagamentos-a-fundo-de-dark-horse.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Antonio Carlos Freixo Junior, que assinou um acordo de delação premiada, afirmou ter feito sete repasses para o fundo Havengate, usado para financiar o filme 'Dark Horse' sobre Jair Bolsonaro, totalizando US$ 12,333 milhões entre janeiro e setembro de 2025.", "titulo_pt": "Delator detalha pagamentos a fundo de 'Dark Horse' e revela uso de empresa nas Bahamas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 154033, "titulo": "Flávio Bolsonaro critica decisão de Dino no STF e diz que Lula quer vencer no tapetão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-bolsonaro-critica-decisao-de-dino-no-stf-e-diz-que-lula-quer-vencer-no-tapetao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro criticou a decisão do ministro Flávio Dino no STF que reintegrou Andrei Rodrigues e Leandro Almada ao comando da PF. Eles haviam sido afastados por André Mendonça na terça-feira.", "titulo_pt": "Flávio Bolsonaro critica decisão de Dino no STF e afirma que Lula quer vencer no tapetão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 154094, "titulo": "Empresários, economistas e intelectuais lançam manifesto cobrando reação do STF diante de crise institucional", "url": "https://g1.globo.com/politica/noticia/2026/09/09/manifesto-empresarios-economistas-e-intelectuais-crise-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de empresários, economistas e intelectuais lançou um manifesto pedindo uma reação do STF diante da crise institucional relacionada às investigações sobre a fraude do Banco Master e Daniel Vorcaro. O documento se soma a outros que também pressionam o STF para que apure os fatos e estabeleça um código de ética.", "titulo_pt": "Empresários, economistas e intelectuais lançam manifesto pedindo reação do STF diante de crise institucional", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 154095, "titulo": "Impasse no STF: por que a decisão de Dino que reconduziu chefe da PF é a que está valendo? Entenda o conflito", "url": "https://g1.globo.com/politica/noticia/2026/09/09/impasse-no-stf-por-que-a-decisao-de-dino-que-reconduziu-chefe-da-pf-e-a-que-esta-valendo-entenda-o-conflito.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A recondução do delegado Andrei Rodrigues ao comando da Polícia Federal gerou um debate sobre os poderes dos ministros do STF e a validade das suas decisões. A decisão do ministro Flávio Dino sobre a recondução passou a valer sobre a determinação anterior de afastamento do ministro André Mendonça.", "titulo_pt": "Impasse no STF: por que a decisão de Dino que reconduziu chefe da PF é a que está valendo? Entenda o conflito", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 154325, "titulo": "'Metástase' da crise entre ministros do STF ameaça instituições brasileiras, dizem especialistas", "url": "https://www.bbc.com/portuguese/articles/clyk143m6ymo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-09T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas avaliam que o conflito entre ministros do STF e os vazamentos subsequentes ameaçam a credibilidade das instituições brasileiras. O conflito envolve a PF, Ministério Público, Congresso e governo.", "titulo_pt": "Metástase' da crise entre ministros do STF ameaça instituições brasileiras, dizem especialistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 154089, "titulo": "Lula pede quebra completa de sigilo do caso Master \"doa a quem doer\"", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/lula-pede-quebra-completa-de-sigilo-do-caso-master-doa-quem-doer", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-09T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva defendeu a quebra completa do sigilo das investigações do caso Master, classificando-o como o maior crime financeiro da história do Brasil. Lula pediu que a medida seja tomada de forma urgente.", "titulo_pt": "Lula defende quebra completa de sigilo no caso Master", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 154116, "titulo": "Combustíveis e agricultura familiar recebem quase R$ 7 bi em créditos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/combustiveis-e-agricultura-familiar-recebem-quase-r-7-bi-em-creditos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-09T16:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal autorizou a abertura de créditos no valor de R$ 6,98 bilhões para financiar subsídios de combustíveis e fortalecer a agricultura familiar por meio do Pronaf. A maior parte dos recursos, R$ 6,605 bilhões, será destinada ao Ministério de Minas e Energia, por intermédio da ANP.", "titulo_pt": "Combustíveis e agricultura familiar recebem quase R$ 7 bi em créditos", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 154034, "titulo": "Dino cita encontro de Mendonça e Vorcaro e questiona se colega age como 'juiz de si mesmo'; entenda", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/dino-cita-encontro-de-mendonca-e-vorcaro-e-questiona-se-colega-age-como-juiz-de-si-mesmo-entenda.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, reintegrou o diretor-geral da Polícia Federal e seu chefe de inteligência às suas funções. Ambos haviam sido afastados por André Mendonça, também ministro do Supremo, um dia antes.", "titulo_pt": "Dino cita encontro de Mendonça e Vorcaro e questiona se colega age como 'juiz de si mesmo'; entenda", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 154035, "titulo": "Ministros do STF veem Fachin sem senso de urgência para lidar com escalada da crise", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ministros-do-stf-veem-fachin-sem-senso-de-urgencia-para-lidar-com-escalada-da-crise.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do STF consideram que o presidente da corte, Edson Fachin, não está agindo com senso de urgência para resolver a crise, que se agravou com a disputa entre os ministros André Mendonça e Flávio Dino sobre o diretor-geral da PF, Andrei Rodrigues.", "titulo_pt": "Ministros do STF veem Fachin sem senso de urgência para lidar com escalada da crise", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 154036, "titulo": "Mendonça procura Fachin e vê decisão de Dino como ilegal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/mendonca-procura-fachin-e-ve-decisao-de-dino-como-ilegal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do STF, foi surpreendido com a decisão de Flávio Dino de reintegrar o diretor-geral da PF, Andrei Rodrigues, ao cargo. Mendonça não planeja reagir formalmente à decisão.", "titulo_pt": "Mendonça surpreendido com decisão de Dino e não pretende reagir", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 154037, "titulo": "Cálculos estratégicos de ministros em guerra enfraquecem Fachin na crise do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/calculos-estrategicos-de-ministros-em-guerra-enfraquecem-fachin-na-crise-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T15:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal têm adotado um comportamento estratégico que está aprofundando a crise na corte, dificultando os esforços do ministro Edson Fachin para encontrar uma solução com apoio do colegiado.", "titulo_pt": "Cálculos estratégicos dos ministros aprofundam crise no STF, enfraquecem Fachin", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 154038, "titulo": "'Rei do biodiesel' doa R$ 1 milhão às campanhas de Lula e Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/rei-do-biodiesel-doa-r-1-milhao-as-campanhas-de-lula-e-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário gaúcho Erasmo Carlos Battistella, conhecido como 'Rei do Biodiesel', doou R$ 1 milhão para as campanhas de Luiz Inácio Lula da Silva (PT) e Flávio Bolsonaro (PL). Segundo dados do TSE, ele contribuiu com R$ 500 mil para cada candidatura.", "titulo_pt": "‘Rei do biodiesel’ doa R$ 1 milhão às campanhas de Lula e Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 154096, "titulo": "Guerra de liminares no STF: ministros ligam para Fachin e cobram providências; Mendonça vê ilegalidade em decisão de Dino", "url": "https://g1.globo.com/politica/noticia/2026/09/09/guerra-de-liminares-eleva-pressao-sobre-fachin-por-anuncio-de-medida-concreta-para-conter-crise-master-no-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do Supremo Tribunal Federal entraram em contato com o presidente da Corte, Luiz Edson Fachin, após a decisão de Flávio Dino que reativou o diretor-geral da Polícia Federal, Andrei Rodrigues, e o diretor de inteligência, Leandro Almada. André Mendonça, um dos ministros, fez um dos contatos telefônicos, apontando ilegalidade na decisão de Dino.", "titulo_pt": "Guerra de liminares no STF: ministros ligam para Fachin e cobram providências", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 154039, "titulo": "Flávio Bolsonaro lidera doações eleitorais com R$ 44 mi; Lula recebeu R$ 35,9 mi", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-bolsonaro-lidera-doacoes-eleitorais-com-r-44-mi-cury-recebe-menos-entre-melhores-colocados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro é o candidato com maior arrecadação de doações eleitorais, totalizando R$ 44,3 milhões. Augusto Cury, outro candidato, é o que menos arrecadou, com apenas R$ 317 mil, grande parte vindo dele mesmo.", "titulo_pt": "Flávio Bolsonaro lidera doações eleitorais com R$ 44 mi; Lula recebeu R$ 35,9 mi", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 154822, "titulo": "Taiwan, U.S. must counter China gray-zone pressure: Stanford scholar", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864022", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um scholar da Stanford University afirma que Taiwan e os Estados Unidos devem combater a pressão da China no 'grau cinza'.", "titulo_pt": "Taiwan e EUA devem contrabalançar pressão cinza-china, diz scholar da stanford", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 154702, "titulo": "New Israeli air attacks hit southern Lebanon", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/new-israeli-air-attacks-hit-southern-lebanon", "fonte_id": "middle_east_eye", "data_pub": "2026-09-09T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas ataques aéreos israelenses atingiram duas áreas no sul do Líbano. As bombas caíram nos municípios de Mansouri, no distrito de Tyre, e Sarbine, no distrito de Bint Jbeil.", "titulo_pt": "Novos ataques aéreos israelenses atingem sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 154062, "titulo": "Relações com os EUA passam por período incomum que contradiz séculos de amizade, diz embaixadora em Washington", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/relacoes-com-os-eua-passam-por-periodo-incomum-que-contradiz-seculos-de-amizade-diz-embaixadora-em-washington.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-09T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A embaixadora do Brasil em Washington, Maria Luiza Ribeiro Viotti, declarou que o Brasil e os Estados Unidos estão passando por um período atípico que questiona mais de dois séculos de relações diplomáticas. Ela afirmou que este é um momento desafiador para as relações entre os dois países.", "titulo_pt": "Relações entre Brasil e EUA passam por período atípico, diz embaixadora", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 154622, "titulo": "Ceuta: EU grants Spain €115 million in emergency aid", "url": "https://www.dw.com/en/ceuta-eu-grants-spain-€115-million-in-emergency-aid/a-79206505?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-09T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia destinou 115 milhões de euros em ajuda de emergência para reforçar a segurança da fronteira e retornar migrantes para o Marrocos. Essa medida foi tomada em resposta a uma crise em julho, quando mais de 70.000 migrantes invadiram o exclave espanhol de Ceuta.", "titulo_pt": "Ue concede 115 milhões de euros em ajuda de emergência a Espanha para ceuta", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 154623, "titulo": "Germany's connection to the September 11, 2001 attacks", "url": "https://www.dw.com/en/germany-s-connection-to-the-september-11-2001-attacks/a-79202918?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-09T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os ataques de 11 de setembro de 2001 tiveram uma parte de sua planificação realizada em Hamburgo, através da chamada célula de Hamburgo, cujos membros desempenharam papéis cruciais no plano. Este evento marcou um momento que alterou a abordagem da Alemanha para a segurança nacional.", "titulo_pt": "A ligação da Alemanha aos ataques de 11 de setembro de 2001", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 154456, "titulo": "Police Expand Investigation Into Reform U.K. After Undercover Sting", "url": "https://www.nytimes.com/2026/09/09/world/europe/reform-uk-investigation-nigel-farage.html", "fonte_id": "nyt_world", "data_pub": "2026-09-09T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Polícia Metropolitana está investigando o partido de Nigel Farage, um partido de extrema-direita, após a divulgação de vídeos que parecem mostrar que membros do partido estavam organizando contribuições secretas de um doador estrangeiro.", "titulo_pt": "Polícia expande investigação no reino unido após gravação involvendo partido de farage", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 154474, "titulo": "Uganda to withdraw from Invictus Games ‘out of respect for King Charles’, says military chief", "url": "https://www.theguardian.com/world/2026/sep/09/uganda-withdraws-invictus-games-out-of-respect-king-charles", "fonte_id": "guardian_world", "data_pub": "2026-09-09T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O general Muhoozi Kainerugaba, chefe das forças armadas ugandenses, anunciou que Uganda está se retirando dos Jogos Invictus, citando respeito pelo rei Carlos e divisões sobre o caso 'Harry-Meghan'.", "titulo_pt": "Uganda se retirará dos jogos Invictus em respeito ao rei carlos, diz chefe militar", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 154520, "titulo": "Special education head at Education Department abruptly resigns", "url": "https://www.npr.org/2026/09/09/nx-s1-5962899/special-education-kelly-rogers-resigns", "fonte_id": "npr_news", "data_pub": "2026-09-09T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe da divisão de educação especial do Departamento de Educação anunciou sua renúncia após menos de quatro meses no cargo, enquanto a agência como um todo está passando por transformações e reduções.", "titulo_pt": "Chefe de educação especial do departamento de educação renuncia de forma abrupta", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 154070, "titulo": "Anthropic restringe acesso de nova IA a norte-americanos e preocupa britânicos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/anthropic-restringe-acesso-de-novo-ia-a-norte-americanos-e-preocupa-britanicos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic restringiu o acesso de seu modelo de IA mais recente aos norte-americanos. Isso levou a preocupações no governo britânico de que as empresas de tecnologia estejam adotando uma postura protecionista em inteligência artificial, similar à do governo de Donald Trump.", "titulo_pt": "Anthropic restringe acesso de nova IA a norte-americanos e preocupa britânicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154208, "titulo": "Na Colômbia, Marco Rubio promete eleições ‘o mais rápido possível’ na Venezuela, sob condições", "url": "https://www.brasildefato.com.br/2026/09/09/na-colombia-marco-rubio-promete-eleicoes-o-mais-rapido-possivel-na-venezuela-sob-condicoes/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-09T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado dos Estados Unidos, Marco Rubio, visitou a Colômbia, onde prometeu eleições 'o mais rápido possível' na Venezuela, sob certas condições. Durante a viagem pela América do Sul, ele também passou por Equador e Peru.", "titulo_pt": "Em Colômbia, Marco Rubio promete eleições 'o mais rápido possível' na Venezuela, sob condições", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 154706, "titulo": "Explosion heard in southern Iran near Hormuz", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/explosion-heard-southern-iran-near-hormuz", "fonte_id": "middle_east_eye", "data_pub": "2026-09-09T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi ouvida uma explosão nas áreas sul do porto de Jask, perto do Estreito de Ormuz, de acordo com relatos da mídia iraniana. O estado da origem ou natureza do incidente ainda não foi anunciada.", "titulo_pt": "Explosão ouvida perto do estreito de Ormuz no sul da Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 154063, "titulo": "Principal partido de oposição do Japão entra em colapso 8 meses após criação", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/principal-partido-de-oposicao-do-japao-entra-em-colapso-8-meses-apos-criacao.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-09T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O principal partido de oposição do Japão anunciou que vai se dissolver após falhar em desafiar a administração popular da primeira-ministra Sanae Takaichi. A fragmentada oposição política do país entrou em maior desordem nesta quarta-feira.", "titulo_pt": "Principal partido de oposição do Japão entra em colapso 8 meses após criação", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 154521, "titulo": "Andrew Tate is denied bail and will remain in jail during his extradition fight", "url": "https://www.npr.org/2026/09/09/nx-s1-5954174/andrew-tate-bail-extradition-jail", "fonte_id": "npr_news", "data_pub": "2026-09-09T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Tate foi negada a liberdade condicional e permanecerá preso durante sua batalha de extradição. Advogados dos Tates argumentaram que seus clientes apenas estavam jogando um papel para seus fãs, mas promotores disseram que eles se gabaram de ter vários passaportes e de viajar em jatos privados.", "titulo_pt": "Andrew Tate é negado ao direito ao bálc e permanecerá preso durante a batalha de extradição", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 154459, "titulo": "Video Shows Grocery Store Manager Saving Toddler From Oncoming Traffic", "url": "https://www.nytimes.com/2026/09/09/world/americas/video-mexico-toddler-traffic-rescue.html", "fonte_id": "nyt_world", "data_pub": "2026-09-09T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luis Cruz correu para uma rua movimentada em Puebla, México, para resgatar uma menina do caminho de um S.U.V. que se aproximava. O vídeo da salvamento o tornou uma figura localmente famosa.", "titulo_pt": "Vídeo mostra gerente de supermercado salvando criança de tráfego venenoso", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 154329, "titulo": "Eleições 2026: o que os candidatos propõem para a Educação?", "url": "https:/ "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para os EUA no período de janeiro a agosto de 2026 totalizaram US$ 24,1 bilhões, representando uma diminuição de 9,7% em comparação com o mesmo período de 2025. Este é o menor volume desde 2023.", "titulo_pt": "Exportações do Brasil para os EUA até agosto são as menores desde 2023", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 154071, "titulo": "Brasil vê China como potencial compradora de créditos de carbono", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/brasil-ve-china-como-potencial-compradora-de-creditos-de-carbono.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A secretária extraordinária do Mercado de Carbono, Cristina Reis, planeja avaliar a possibilidade de a China se tornar compradora de créditos de carbono brasileiros durante uma missão àquele país. As negociações visam um acordo bilateral sobre mercados de carbono, que as autoridades esperam anunciar na COP31 em novembro.", "titulo_pt": "Brasil vê China como potencial compradora de créditos de carbono", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154644, "titulo": "Treasury Department to buy back up to $6 billion in longer-term debt, triple the normal level", "url": "https://www.cnbc.com/2026/09/09/treasury-department-to-buy-back-6-billion-in-longer-term-debt-triple-the-normal-level.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-09T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento do Tesouro dos Estados Unidos anunciou a compra de até $6 bilhões em dívida a prazo, triplicando o nível normal de operações. Este anúncio segue uma declaração do Secretário do Tesouro Scott Bessent.", "titulo_pt": "Tesouro americano vai comprar até $6 bilhões em dívida a prazo, triplicando o nível normal", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 154117, "titulo": "Novo computador quântico educacional passa a ser usado no Senai", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/novo-computador-quantico-educacional-passa-ser-usado-no-senai", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-09T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo computador quântico educacional, o Triangulum II, da empresa chinesa SpinQ, começou a ser usado no Senai para formar estudantes, pesquisadores e professores. Este é um dos três computadores quânticos educacionais existentes no Brasil e o mais moderno do país.", "titulo_pt": "Novo computador quântico educacional começa a ser usado no Senai", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 154475, "titulo": "The RBA hoped this year’s three interest rate rises would tame inflation – but nothing is going their way", "url": "https://www.theguardian.com/business/2026/sep/10/the-rba-hoped-this-years-three-interest-rate-rises-would-tame-inflation", "fonte_id": "guardian_world", "data_pub": "2026-09-09T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco Reserve Australiano (RBA) esperava que três aumentos de juros este ano controlassem a inflação, mas esses fatores — a quebra do cessar-fogo entre EUA e Irã, a elevação dos preços do petróleo e a expansão do investimento em centros de dados — estão dificultando a tarefa da instituição. Por cinco anos, o RBA tem tentado controlar a inflação, que permanece acima de seu alvo de 2,5%, levando a uma crise de custo de vida que gerou grande insatisfação na comunidade.", "titulo_pt": "Aumentos de juros não estão controlando a inflação na austrália", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 154073, "titulo": "Secretário do Tesouro dos EUA desafia quem apostar contra o iene: 'Agora, a banca sou eu'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/secretario-do-tesouro-dos-eua-desafia-quem-apostar-contra-o-iene-agora-a-banca-sou-eu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, advertiu os operadores financeiros contra apostas contra o iene, afirmando que 'agora, a banca sou eu', após uma intervenção em julho para sustentar a moeda japonesa.", "titulo_pt": "Secretário do Tesouro dos EUA desafia apostadores contra o iene: 'agora, a banca sou eu'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154075, "titulo": "Atlas Lithium contrata 71% do orçamento do Projeto Neves; 16% abaixo do previsto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/atlas-lithium-contrata-71-do-orcamento-do-projeto-neves-16-abaixo-do-previsto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T13:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Atlas Lithium contratou 71% dos investimentos diretos previstos para o Projeto Neves, um empreendimento de lítio localizado no Vale do Jequitinhonha, em Minas Gerais. O orçamento do projeto está 16% abaixo do previsto.", "titulo_pt": "Atlas Lithium contrata 71% do orçamento do Projeto Neves; 16% abaixo do previsto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154076, "titulo": "Magnata dos videogames terá de pagar R$ 8 bilhões em acordo recorde de divórcio, decide tribunal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/magnata-dos-videogames-tera-de-pagar-r-8-bilhoes-em-acordo-recorde-de-divorcio-decide-tribunal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Seul determinou que Kwon Hyuk-Bin, magnata sul-coreano dos videogames, deve pagar mais de 8 bilhões de reais em um acordo de divórcio, que é a maior divisão de patrimônio já concedida no país.", "titulo_pt": "Magnata dos videogames terá de pagar R$ 8 bilhões em acordo recorde de divórcio, decide tribunal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154079, "titulo": "O gargalo da infraestrutura agora é gente", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/mauricio-portugal-ribeiro/2026/09/o-gargalo-da-infraestrutura-agora-e-gente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil conseguiu, em duas décadas, financiar a infraestrutura através de leilões de concessões e parcerias público-privadas, que contrataram R$ 183 bilhões em investimentos em 2025. No entanto, o novo desafio é encontrar e manter pessoas para executar esses projetos.", "titulo_pt": "O gargalo da infraestrutura agora é a mão de obra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154080, "titulo": "Daycoval automatiza crédito consignado CLT com IA e escala operação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/daycoval-automatiza-credito-consignado-clt-com-ia-e-escala-operacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Daycoval está utilizando inteligência artificial para automatizar a venda de crédito consignado a trabalhadores com carteira assinada. A iniciativa visa escalar a operação de crédito consignado CLT.", "titulo_pt": "Daycoval automatiza crédito consignado CLT com IA e escala operação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154083, "titulo": "Inflação na China acelera em agosto impulsionada por custos de energia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/09/01/6558-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466798", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T12:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação na China aumentou para 3,8% no acumulado dos últimos 12 meses em agosto, acima dos 3,5% registrados em julho. O índice de preços ao consumidor teve um avanço de 0,8% em comparação com agosto do ano anterior.", "titulo_pt": "Inflação na China acelera em agosto, impulsionada por custos de energia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 154650, "titulo": "AI data centers won't create as many UK jobs as the tech sector projects, think tank warns", "url": "https://www.cnbc.com/2026/09/09/ai-data-centers-jobs-tech-buildout.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-09T12:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo questiona as previsões sobre o número de empregos permanentes que o setor de data centers do Reino Unido criará com a investimento bilionário em infraestrutura de inteligência artificial.", "titulo_pt": "Centrais de dados de IA não criarão tantos empregos permanentes no reino unido quanto a indústria projeta, think tank avisa", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 154803, "titulo": "Brace for new AI threats ahead of elections, AIT head says", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/10/2003863996", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do AIT alertou para novos ameaças de inteligência artificial antes das eleições. Ele recomendou que as pessoas estejam preparadas tps://www.theverge.com/news/992408/ios-27-release-date-features", "fonte_id": "the_verge", "data_pub": "2026-09-09T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançará a próxima atualização do iOS 27 na próxima segunda-feira, 14 de setembro. A principal funcionalidade é o Siri AI, uma atualização AI-potencializada do assistente Siri, que será lançada inicialmente apenas para dispositivos em inglês.", "titulo_pt": "Ios 27 lança no dia 14 de setembro com Siri AI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 154154, "titulo": "Apple anuncia nova linha de iPhones 18 Pro e iPhones 18 Pro Max", "url": "https://veja.abril.com.br/tecnologia/apple-anuncia-nova-linha-de-iphones-18-pro-e-iphones-18-pro-max/", "fonte_id": "veja", "data_pub": "2026-09-09T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Apple lançou a nova linha de iPhones 18 Pro e 18 Pro Max, melhorando as câmeras e a integração com a inteligência da Apple.", "titulo_pt": "Apple anuncia nova linha de iphones 18 Pro e 18 Pro Max", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 154839, "titulo": "Apple Watch Series 12 has an always-on Siri that makes AI recaps of your day", "url": "https://www.theverge.com/tech/991812/apple-watch-series-12-announcement", "fonte_id": "the_verge", "data_pub": "2026-09-09T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançou o Apple Watch Series 12 em seu evento de lançamento de produtos em 9 de setembro, um ano após o lançamento do Series 11, Ultra 3 e SE 3. Um dos principais recursos é a inteligência artificial do Siri com reconhecimento de som, incluindo uma função de 'replay em tempo real' que permite aos usuários regravar e transcrever áudio recentemente detectado.", "titulo_pt": "Apple Watch Series 12 tem Siri sempre ligado e recapitulações de AI do dia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 154051, "titulo": "Prime Video terá inteligência artificial para ajustar bocas de atores em dublagens", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/prime-video-tera-inteligencia-artificial-para-ajustar-bocas-de-atores-em-dublagens.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-09T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon anunciou uma tecnologia que usa inteligência artificial para sincronizar os movimentos da boca dos atores com o áudio dublado no Prime Video, tornando a dublagem mais natural.", "titulo_pt": "Amazon anuncia tecnologia de inteligência artificial para sincronizar dublagens", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 154843, "titulo": "Apple’s John Ternus era begins: ‘It is great to be here’", "url": "https://www.theverge.com/tech/991273/john-ternus-first-apple-product-launch-as-ceo", "fonte_id": "the_verge", "data_pub": "2026-09-09T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Ternus, o novo CEO da Apple, abriu o evento de lançamento de produtos, recebendo aplausos prolongados. Ele expressou agradecimento e entusiasmo pelo futuro da empresa durante a abertura do evento.", "titulo_pt": "Chegada do novo ceo da apple: 'é ótimo estar aqui'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 154690, "titulo": "OpenAI names top US AI safety official to foundation board", "url": "https://www.ft.com/content/d73e188f-b906-42ec-8b91-db9729c9d2d9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-09T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI nomeou um dos principais responsáveis pela segurança do AI dos EUA para o conselho de administração da empresa. Ao mesmo tempo, laboratórios de IA estão sendo acusados de tentar se apropriar do regulamento.", "titulo_pt": "Openai nomeia chefe de segurança do AI dos EUA para conselho de administração", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 154850, "titulo": "You Can Now Destroy Flock Cameras for Cash in GTA V", "url": "https://www.wired.com/story/you-can-now-destroy-flock-cameras-for-cash-in-gta-v/", "fonte_id": "wired", "data_pub": "2026-09-09T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo mod para GTA V permite que os jogadores quebram e destruam os leitores de placas automaticos da Flock em Los Santos, a cidade fictícia do jogo.", "titulo_pt": "Você agora pode destruir câmeras de placas automáticas da Flock em GTA V", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 154551, "titulo": "Here's how AI could kill us all (if the worst fears come true)", "url": "https://www.axios.com/2026/09/09/ai-doom-pdoom-kill-all-humans-anthropic", "fonte_id": "axios", "data_pub": "2026-09-09T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de IA alertaram publicamente que existe um risco não-negligenciável de inteligência artificial destruir a humanidade no próximo decênio. Essa preocupação reflete a crescente poderosa integração da IA em nossas vidas, levando a advertências que estão se tornando mais comuns no mainstream.", "titulo_pt": "Aqui está como a IA poderia nos exterminar (se os piores temores se concretizarem)", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 154689, "titulo": "New Apple CEO to unveil $2,000 folding iPhone", "url": "https://www.ft.com/content/dea481e8-d30b-4cbb-b535-5ff219c4e546?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-09T15:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo CEO da Apple está prestes a apresentar um novo modelo de iPhone dobrável com preço de US$ 2.000. Investidores esperam aumentos de preço em toda a linha de smartphones da empresa devido ao aumento dos custos de memória.", "titulo_pt": "Novo CEO da Apple deve apresentar iphone dobrável por us$ 2.000", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 154874, "titulo": "An Engineer’s Guide to Surviving a Layoff", "url": "https://spectrum.ieee.org/how-to-survive-a-layoff", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-09T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor perdeu um emprego de gerenciamento de engenharia bem remunerado no mesmo momento em que comprou um negócio, com hipoteca, três filhos e outras obrigações financeiras adultas. Este foi um dos períodos mais estressantes da sua vida.", "titulo_pt": "Guia de engenheiro para sobreviver a um corte de postos", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 154242, "titulo": "Abin regulamenta MSG Gov, alternativa ao WhatsApp para comunicação entre órgãos do governo", "url": "https://exame.com/tecnologia/abin-regulamenta-msg-gov-app-de-mensagens-para-funcionarios-publicos-deixarem-o-whatsapp/", "fonte_id": "exame", "data_pub": "2026-09-09T14:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O App Gov, alternativa ao WhatsApp para comunicação entre órgãos do governo, combina criptografia comercial com um algoritmo desenvolvido pelo próprio Estado. O aplicativo já foi distribuído a órgãos como Casa Civil, Itamaraty e Polícia Federal.", "titulo_pt": "Abin regulamenta Gov, alternativa ao WhatsApp para comunicação entre órgãos do governo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 154250, "titulo": "OpenAI aprofunda parceria com Samsung para desenvolver chips de IA", "url": "https://exame.com/inteligencia-artificial/openai-aprofunda-parceria-com-samsung-para-desenvolver-chips-de-ia/", "fonte_id": "exame", "data_pub": "2026-09-09T13:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "OpenAI estende sua parceria com a Samsung para o desenvolvimento de chips de inteligência artificial e serviços corporativos relacionados. O acordo abrange pesquisas e a produção de chips de próxima geração.", "titulo_pt": "Openai intensifica parceria com Samsung para desenvolvimento de chips de IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 154884, "titulo": "Body-related TikTok content linked to self-objectification and mood", "url": "https://phys.org/news/2026-09-body-tiktok-content-linked-objectification.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A visualização de conteúdo 'thinspiration' no TikTok aumenta a auto-objetoificação e piora o humor, enquanto o conteúdo positivo sobre o corpo também aumenta a auto-objetoificação, mas está associado a um humor mais positivo, de acordo com uma nova pesquisa publicada no PLOS One.", "titulo_pt": "Conteúdo relacionado ao corpo no TikTok ligado a auto-objetoificação e humor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154885, "titulo": "'Here, There and Everywhere': The Beatles have permeated research papers across academic disciplines", "url": "https://phys.org/news/2026-09-beatles-permeated-papers-academic-disciplines.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 3.000 títulos de artigos científicos de diversas disciplinas utilizaram títulos ou letras de músicas dos Beatles, de acordo com um estudo publicado no PLOS One. Este análise abrange uma ampla gama de campos acadêmicos e demonstra o impacto duradouro dos Beatles na escrita científica.", "titulo_pt": "Aqui, ali e cada lugar: os Beatles permearam o vocabulário científico em diversas disciplinas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154886, "titulo": "Fossils from embryo to adult suggest how an enigmatic, bird-like troodontid dinosaur grew", "url": "https://phys.org/news/2026-09-fossils-embryo-adult-enigmatic-bird.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos de fósseis de dinossauros troodontídeos mostram como as pernas e ossos pélvicos de uma espécie podem ter evoluído ao longo da vida, do embrião ao adulto, com possíveis implicações para resolver desafios taxonômicos antigos. Os pesquisadores David Varricchio e Heath Caldwell, da Montana State University e da North Carolina State University, respectivamente, publicaram seus resultados no Journal of PLOS One em 9 de setembro de 2026.", "titulo_pt": "Fossis de embrião a adulto revelam o crescimento de um dinossauro troodontídeo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154887, "titulo": "Asian elephants can resist impulsive behavior, researchers find", "url": "https://phys.org/news/2026-09-asian-elephants-resist-impulsive-behavior.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da CUNY Graduate Center e Hunter College descobriram que os elefantes asiáticos podem suprimir comportamentos impulsivos e ajustar suas ações quando as circunstâncias mudam. Este tipo de cognição pode ajudar a explicar as habilidades sofisticadas de resolução de problemas e o comportamento social dos animais.", "titulo_pt": "Elefantes asiáticos podem resistir a comportamentos impulsivos, encontram os pesquisadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154888, "titulo": "JWST discovers that Chariklo's invisible rings are changing", "url": "https://phys.org/news/2026-09-jwst-chariklo-invisible.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Até há cerca de uma década, os anéis eram considerados exclusivos dos gigantes gasosos do sistema solar, como Júpiter, Saturno, Urano e Netuno. Em 2013, o corpo interestelar Chariklo, com apenas 250 quilômetros de diâmetro, foi descoberto com dois anéis.", "titulo_pt": "JWST descobre que os anéis invisíveis de Chariklo estão mudando", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154889, "titulo": "Ice Age origins of one of humanity's oldest drug habits discovered", "url": "https://phys.org/news/2026-09-ice-age-humanity-oldest-drug.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de arqueólogos da Universidade Griffith descobriu evidências de que os humanos estavam usando substâncias que alteram a mente muito mais cedo do que se supunha anteriormente.", "titulo_pt": "Origens do idade de gelo das mais antigas hábitos de drogas humanos descobertas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154928, "titulo": "Bursts of ‘pink noise’ during sleep seem to help clear waste from brain", "url": "https://www.newscientist.com/article/2588451-bursts-of-pink-noise-during-sleep-seem-to-help-flush-waste-from-brain/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cérebro humano libera resíduos durante o sono, e agora parece que certos sons podem aumentar esse processo. Bursts de 'ruído rosa' durante o sono parecem auxiliar na remoção de resíduos do cérebro.", "titulo_pt": "Bursts de 'ruído rosa' durante o sono parecem ajudar na remoção de resíduos do cérebro", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 154929, "titulo": "Heat spikes over Tibet may help explain severe Californian flooding", "url": "https://www.newscientist.com/article/2588424-heat-spikes-over-tibet-may-be-to-blame-for-catastrophic-californian-flooding/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas anormalmente altas na região montanhosa do Tibete podem desencadear uma cadeia de eventos que resultam em intensas chuvas na costa oeste dos Estados Unidos.", "titulo_pt": "Aumento das temperaturas no tibete pode explicar chuvas severas na califórnia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 154930, "titulo": "Earliest evidence of habitual drug use found in teeth in Indonesia", "url": "https://www.newscientist.com/article/2588277-earliest-evidence-of-habitual-drug-use-found-in-teeth-in-indonesia/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Descobriu-se estranhas e arredondadas grooves em dentes pré-históricos que são supostamente resultado do hábito de sugar betel inteiros para extrair um composto aliviador de dores. Isso marca o mais antigo exemplo conhecido de possivelmente dependência de substâncias.", "titulo_pt": "Menor evidência de uso habitual de drogas encontrada em dentes na indonésia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 154890, "titulo": "Decades-old DNA mystery solved after strands are captured zipping together for the first time", "url": "https://phys.org/news/2026-09-decades-dna-mystery-strands-captured.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas capturaram pela primeira vez o momento em que duas moléculas de DNA se unem, revelando um mecanismo que intrigou os cientistas há mais de 20 anos. Usando microscopia de força atômica de alta resolução, os pesquisadores da Universidade de Sheffield e da Universidade de York visualizaram diretamente a união de duas hélices de DNA duplas.", "titulo_pt": "Mistério antigo sobre DNA resolvido após moléculas serem capturadas se unindo pela primeira vez", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154891, "titulo": "Liquid gold: Could we turn our urine into fertilizer?", "url": "https://phys.org/news/2026-09-liquid-gold-urine-fertilizer.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A urina humana contém nutrientes valiosos, como nitrogênio, fósforo e potássio, que são essenciais para o crescimento das plantas. Ao longo de milênios, a urina tem sido considerada valiosa devido à sua riqueza em nutrientes.", "titulo_pt": "Ouro líquido: poderíamos transformar nossa urina em fertilizante?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154892, "titulo": "Survey shows public confidence in Fauci declines since spring but still exceeds RFK Jr.", "url": "https://phys.org/news/2026-09-survey-confidence-fauci-declines-exceeds.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A confiança dos americanos em Dr. Anthony Fauci como uma fonte confiável de informações de saúde pública diminuiu entre abril e agosto de 2026, após ele comparecer ante a Comissão de Segurança Nacional do Senado dos EUA e se recusar a responder às perguntas, invocando sua proteção do Quinto Emendamento.", "titulo_pt": "Pesquisa mostra que confiança no dr. Fauci diminuiu desde o verão, mas ainda supera a de RFK Jr.", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154893, "titulo": "The Anthropocene was rejected as a geological epoch—but the idea is still changing how we see the world", "url": "https://phys.org/news/2026-09-anthropocene-geological-epoch-idea-world.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ideia da Era do Antropoceno se tornou parte do pensamento dominante após o laureado com o Prêmio Nobel Paul Crutzen lançar a proposta em 2000. Essa ideia sugere que a intensificação dos impactos humanos recentemente levou a Terra fora das condições climáticas estáveis do Holoceno, durante o qual a civilização humana se desenvolveu e floresceu, para uma nova era planetária.", "titulo_pt": "O antropoceno foi rejeitado como uma época geológica, mas a ideia continua a transformar como vemos o mundo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154921, "titulo": "The shingles vaccine may protect the heart", "url": "https://www.sciencenews.org/article/shingles-vaccine-protect-heart-shingrix", "fonte_id": "science_news", "data_pub": "2026-09-09T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vacina Shingrix, usada para prevenir o herpes zóster (sarampo dos velhos ou shingles), pode também reduzir o risco de doenças cardíacas.", "titulo_pt": "A vacina contra shingles pode proteger o coração", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 154277, "titulo": "Cientistas criam os primeiros ‘cães hipoalergênicos’ do mundo; entenda", "url": "https://www.cnnbrasil.com.br/ciencia/cientistas-criam-os-primeiros-caes-hipoalergenicos-do-mundo-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram os primeiros cães hipoalergênicos através da edição genética. Essa inovação visa reduzir a reação alérgica em humanos, evitando episódios de rinite alérgica e asma.", "titulo_pt": "Cientistas criam os primeiros cães hipoalergênicos do mundo; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 154047, "titulo": "Cúpula em Paris expõe desafio da Europa para manter protagonismo na corrida espacial", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/cupula-em-paris-expoe-desafio-da-europa-para-manter-protagonismo-na-corrida-espacial.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-09T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes da indústria espacial se reúnem em Paris para fech
