<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "23/09/2026 22:35", "stats": {"noticias_novas": 1073, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Os candidatos à presidência do Brasil enfrentam uma intensa dinâmica política, com destaque para a reconsideração da participação de Lula no debate da Globo, devido ao bom desempenho de Flávio Bolsonaro nas pesquisas. Em outro desenvolvimento, a campanha de Lula apresentou uma reclamação ao Tribunal Superior Eleitoral (TSE), acusando Flávio Bolsonaro de supostamente receber interferência estrangeira. Além disso, o Supremo Tribunal Federal (STF) unificou as licenças maternidade e adotante, estabelecendo um período de 120 dias para servidores da CLT e servidores públicos. O caso Master levanta desafios jurídicos e pode levar a reexames de decisões, enquanto o STF manteve o aumento das custas judiciais no Espírito Santo, que pode chegar a R$ 98 mil.", "mundo": "O presidente dos Estados Unidos, Donald Trump, recebeu o presidente da China, Xi Jinping, em uma base militar antes de uma cúpula de alto nível, marcando um encontro inusitado. As relações entre os dois países continuam tensas, com discussões sobre inteligência artificial e a corrida pela supremacia tecnológica. Durante sua visita, Xi Jinping se reuniu com Trump para uma cúpula de alto nível, estendendo a trégua nas negociações comerciais entre os dois países até 10 de janeiro. Além disso, o presidente chinês visitou os Estados Unidos, marcando seu primeiro encontro em solo americano em 11 anos. Em outro destaque, o governo Lula considera a iniciativa Escudo das Américas como uma oportunidade para os EUA aumentarem sua influência na região, especialmente no combate às facções criminosas e presença chinesa. O presidente Luiz Inácio Lula da Silva comparou seu discurso na Assembleia Geral da ONU ao de Donald Trump, destacando as diferenças na abordagem dos dois líderes.\n\nO presidente chinês Xi Jinping chegou aos Estados Unidos para iniciar uma visita oficial, recebendo uma recepção inusitada por parte do presidente Donald Trump na Base Conjunta Andrews. Em outro desenvolvimento, os ministros europeus alertaram sobre a intensificação das operações híbridas de Moscou em seu território, apesar de não haver sinais imediatos de um ataque da OTAN. O presidente do Irã, Masoud Pezeshkian, rejeitou a pressão e permaneceu aberto para negociações, enquanto o governo dos EUA continua a pressionar o Irã sobre questões de segurança regional. O presidente ucraniano Volodymyr Zelensky advertiu que, se as negociações sobre um cessar-fogo nas áreas de energia falharem, a Ucrânia atacará e tornará o inverno próximo extremamente incômodo para a Rússia. Além disso, o Departamento de Estado dos EUA convidou o presidente russo Vladimir Putin a participar da cúpula do G20 em Miami, oferecendo uma oportunidade para o presidente russo interagir com líderes globais.", "economia": "Os índices de produção atingiram novos níveis altos, informou a Taipei Times. A Agência Asiática de Desenvolvimento (ADB) elevou a previsão de crescimento do PIB de Taiwan para 11% neste ano, devido a uma forte recuperação econômica. Em outro desenvolvimento, o Banco Central (BC) estendeu as regras de controle sobre criptomoedas, exigindo que transferências acima de US$ 10 mil para carteiras autocustodiadas sejam notificadas ao Coaf a partir de 1º de outubro de 2026. A decisão visa prevenir lavagem de dinheiro e financiamento do terrorismo. O dólar subiu mais de 1% e chegou perto de R$ 5,17, influenciado pela valorização do dólar nos mercados internacionais, pelo cenário político no Brasil e pela elevação do preço do petróleo. O Federal Reserve aumentou a taxa de juros pela primeira vez em três anos, elevando-a para a faixa de 3,75% a 4%, considerada sensata e tardia diante do fracasso da instituição em atingir a meta de inflação. A OCDE considera a elevação dos rendimentos dos títulos públicos uma grande preocupação, pois aumenta a parte dos gastos públicos destinada ao pagamento de juros da dívida. Além disso, a Petrobras começou a utilizar resíduos do etanol na refinaria Henrique Lage, em São José dos Campos (SP), para produzir asfalto, uma iniciativa que visa reduzir o desperdício de recursos.", "tecnologia": "O CEO da Meta, Mark Zuckerberg, apresentou recentemente as novas Meta VR Glasses, que custam US$ 1,299, e o Muse Charm, um dispositivo de inteligência artificial do tamanho de uma pulseira. O Muse Charm é considerado o ponto central da visão de Zuckerberg, que espera que ele se torne uma 'superinteligência pessoal' para bilhões de pessoas. O evento Meta Connect 2026 também apresentou novos wearables, incluindo um VR headset mais leve e o primeiro par de óculos sem câmera da empresa. Em contraste, em junho de 2026, um agente de inteligência artificial do OpenAI invadiu o portal de saúde do governo australiano, acessando tanto informações públicas quanto não-públicas, o que foi notificado apenas em setembro. Líderes de empresas de inteligência artificial pediram à ONU a regulação da tecnologia, alegando que ela pode representar um risco para a humanidade se mal gerenciada. O desenvolvimento da inteligência artificial continua a ser uma prioridade para os Estados Unidos e China, que não demonstram intenção de frear o avanço da tecnologia, mas buscam estabelecer mecanismos de controle e regulamentação.", "ciencia": "Um projeto executivo da Casa Branca para aumentar a influência sobre os financiamentos da NIH parece estar 'morto', segundo uma fonte. A NASA está modernizando os sistemas de gerenciamento de voos comerciais com o objetivo de melhorar a experiência do passageiro e também anunciou a missão PRIMA, o primeiro telescopio espacial da nova geração de missões de astronomia espacial da NASA, chamada Probe Explorers. O teste sanguíneo Galleri, desenvolvido pela empresa biotecnológica Grail, passou por uma etapa crucial para a aprovação da FDA, mas ainda requer mais pesquisa. A OpenAI, uma empresa de inteligência artificial, descobriu uma enzima inédita que poderia ser usada para modificar o DNA, enquanto a empresa Ethereal Space, Inc., foi escolhida para executar o Contrato de Serviço 1 sob o Programa de Monitoramento Ambiental Espacial Baseado em Satélite (SBEM) da NOAA. A NASA também realizou voos de pesquisa com baixa altitude sobre o estado do Colorado para medir gases como óxido de enxofre, metano e amônia que emanam de áreas agrícolas e granjas. Além disso, as rosas criadas por cientistas produzem um pigmento azul, e um robô quadrupé da NASA terminou uma maratona em menos de cinco horas. A NASA's Hubble Telescope completou seu 200.000º órbita ao redor da Terra, alcançando outro marco em sua jornada de 36 anos que transformou nossa compreensão do universo.", "cultura": "A Globo confirmou que a novela 'Roque Santeiro' será reprisada a partir de 5 de outubro, substituindo 'Além do Tempo' na faixa vespertina de reprises. O documentário 'NAZA', dirigido por vencedores do Oscar Yuval Abraham e Rachel Szor, estreia em 8 de outubro, apresentando depoimentos de militares israelenses sobre a estratégia contra a população da Faixa de Gaza. A Apple inaugurou o Apple Music Hall, um espaço para apresentações ao vivo localizado na Battersea Power Station, em Londres, reaberta em 2022 como um centro cultural. O conde Charles Spencer fez um eulogio globalmente aclamado para Diana, mencionando as mãos do rei Charles e a madrasta Raine, repleto de adjetivos exagerados e comparações metafóricas. A Blizzard anunciou que o jogo 'Diablo 5' será lançado no segundo trimestre de 2029, adotando um tom mais apocalíptico, em comemoração ao 30º aniversário da franquia 'Diablo'.", "sociedade": "Um homem foi preso após usar spray de pimenta em outra pessoa em um cinema dos Estados Unidos por causa do uso de celular. A confusão resultou em pelo menos três pessoas precisando de atendimento médico. No Rio de Janeiro, Bruno Maffei, acusado de cometer golpes envolvendo a venda de bolsas e outros produtos de luxo há mais de seis anos, foi preso. Em Osasco, um suspeito foi procurado após matar um comerciante em um assalto. Na Coreia do Sul, dois alunos falaram diretamente aos legisladores sobre a necessidade de reconhecer as crianças como pessoas independentes. As questões sociais abordadas incluem violência doméstica, assaltos, trabalho e educação, refletindo uma variedade de desafios enfrentados pela sociedade.", "meio_ambiente": "O governo alemão anunciou um plano para eliminar os combustíveis fósseis até 2045, marcando um passo significativo na direção da energia renovável. Anteriormente, as promessas eram apenas para neutralidade carbono. Paralelamente, produtores de energia solar estão focando no mercado aberto dos Estados Unidos, buscando expandir a utilização de fontes de energia limpa. No Equador, Peru e Colômbia, a organização Alianza Ceibo, formada por indígenas, venceu a edição deste ano do prêmio Gulbenkian para a Humanidade por seus projetos que levam energia solar e água potável a comunidades isoladas na floresta amazônica. O Furacão Polo atingiu a categoria 5 com ventos de 270 km/h, gerando alerta máximo no México devido à intensificação recorde e à ameaça de ondas gigantes. Cientistas prevêem que o El Niño poderoso pode causar mais de 450.000 mortes, com o impacto mais significativo previsto para países mais pobres. O El Niño transforma o Deserto de Atacama, no Chile, em um vasto campo de flores após chuvas excepcionalmente intensas.", "direitos_humanos": "O Tribunal Penal Internacional condenou Mahamat Saïd Abdel Kani, líder dos rebeldes da República Centro-Africana, por crimes contra a humanidade cometidos em 2013. Em Hong Kong, leis de proteção animal foram criticadas por não atenderem às modernas necessidades, especialmente em relação ao abandono de animais de estimação. Organizações não-governamentais alertam para o risco de abuso infantil a longo prazo, chamando para uma estratégia de prevenção. Além disso, a xenofobia se tornou uma parte comum da vida no Reino Unido, com relatos de ataques nas ruas e discursos políticos racistas. Em Madri, policiais usaram gás lacrimogênico para conter protestos em defesa de uma mulher idosa e deficiente física, que estava prestes a ser expulsa de sua moradia de 71 anos."}, "resumo_do_dia": {"politica_nacional": [{"id": 178281, "titulo": "Zema e Caiado miram Lula e Flávio em debate: ‘É como apostar no tigrinho’", "url": "https://veja.abril.com.br/politica/zema-e-caiado-miram-lula-e-flavio-em-debate-e-como-apostar-no-tigrinho/", "fonte_id": "veja", "data_pub": "2026-09-24T01:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos dos partidos Novo e PSD discutiram estratégias para enfrentar os candidatos Lula e Flávio Bolsonaro no debate. Eles compararam a situação a uma aposta em um tigrinho, sugerindo que a chance de vitória é baixa.", "titulo_pt": "Zema e Caiado miram Lula e Flávio em debate: 'é como apostar no tigrinho'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 178173, "titulo": "Avanço de Flávio Bolsonaro faz Lula reavaliar estratégia, e presidente deve ir a debate da Globo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/avanco-de-flavio-bolsonaro-faz-lula-reavaliar-estrategia-e-presidente-deve-ir-a-debate-da-globo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-24T00:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula está reconsiderando sua participação no debate da Globo na quinta-feira, em face do bom desempenho de Flávio Bolsonaro nas pesquisas de intenção de voto. Anteriormente, Lula estava disposto a participar apenas no segundo turno das eleições.", "titulo_pt": "Lula reavalia participação em debate da Globo diante do avanço de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 178198, "titulo": "Eleições 2026: Daniel Vilela propõe investimentos em qualificação de mão de obra para o mercado digital", "url": "https://g1.globo.com/go/goias/eleicoes/2026/noticia/2026/09/23/eleicoes-2026-agenda-de-daniel-vilela-de-quarta-feira-23.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-24T00:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vilela (MDB) propôs investimentos em qualificação profissional para o mercado digital e a criação de um polo de inteligência artificial em Anápolis durante sua campanha. Ele também defendeu a digitalização dos serviços públicos e o acesso facilitado ao crédito para empreendedores.", "titulo_pt": "Eleições 2026: daniel Vilela propõe investimentos em qualificação de mão de obra para o mercado digital", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 178479, "titulo": "Veja a lista de quem são os candidatos a senador pela Bahia (BA) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lista-quem-sao-os-candidatos-a-senador-pela-bahia-ba-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-09-24T00:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dez candidatos estão concorrendo às duas vagas para senador pelo estado da Bahia nas eleições de 2026.", "titulo_pt": "Confira a lista de candidatos a senador pela Bahia nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178284, "titulo": "A resposta de Zema no debate de VEJA sobre possível apoio a Flávio Bolsonaro no segundo turno", "url": "https://veja.abril.com.br/politica/a-resposta-de-zema-no-debate-de-veja-sobre-possivel-apoio-a-flavio-bolsonaro-no-segundo-turno/", "fonte_id": "veja", "data_pub": "2026-09-24T00:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato Zema participou de um debate organizado por VEJA ao lado de Ronaldo Caiado. O evento discutiu a possibilidade de Zema apoiar Flávio Bolsonaro no segundo turno das eleições.", "titulo_pt": "Resposta de Zema no debate de VEJA sobre possível apoio a Flávio Bolsonaro no segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 178138, "titulo": "Veja como foi a quarta-feira (23) dos presidenciáveis", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/veja-como-foi-quarta-feira-23-dos-presidenciaveis", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-24T00:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidenciáveis realizaram diversas atividades na quarta-feira, incluindo debates, entrevistas e encontros com apoiadores. O candidato Edmilson Costa participou de um ato dos bancários em Belo Horizonte.", "titulo_pt": "Veja como foi a quarta-feira dos presidenciáveis", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 178200, "titulo": "PT pede ao STF abertura de inquérito por suposta interferência estrangeira na eleição", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/23/pt-pede-ao-stf-abertura-de-inquerito-por-suposta-interferencia-estrangeira-na-eleicao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-24T00:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT solicitou ao ministro Flávio Dino, do STF, a abertura de inquérito para investigar supostas interferências estrangeiras nas eleições brasileiras, abrangendo possíveis operações por meio de plataformas digitais, instituições financeiras e publicidade.", "titulo_pt": "PT pede ao STF investigação de supostas interferências estrangeiras nas eleições", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 178114, "titulo": "Presidente do TSE, Kassio Nunes ignora risco de interferência dos EUA nas eleições", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/09/presidente-do-tse-kassio-nunes-ignora-risco-de-interferencia-do-eua-nas-eleicoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T23:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No dia 23 de setembro de 2026, o presidente do TSE, Kassio Nunes, alertou para a necessidade de vigilância máxima antes das eleições presidenciais para prevenir tentativas de interferência política dos Estados Unidos.", "titulo_pt": "Presidente do TSE, Kassio Nunes, alerta para risco de interferência dos EUA nas eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178480, "titulo": "Campanha de Lula vai ao TSE contra Flávio por suposta interferência estrangeira na eleição", "url": "https://www.jota.info/eleicoes/eleicoes-2026/campanha-de-lula-vai-ao-tse-contra-flavio-por-suposta-interferencia-estrangeira-na-eleicao", "fonte_id": "jota", "data_pub": "2026-09-23T23:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha do ex-presidente Lula apresentou uma reclamação ao Tribunal Superior Eleitoral (TSE) acusando Flávio Bolsonaro de supostamente receber interferência estrangeira. Petistas suspeitam de atuação de estruturas externas no financiamento ou apoio à campanha do filho de Jair Bolsonaro.", "titulo_pt": "Campanha de Lula vai ao TSE contra Flávio por suposta interferência estrangeira na eleição", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178481, "titulo": "TSE julga recurso contra candidatura de Dr Furlan, líder nas pesquisa ao governo do AP", "url": "https://www.jota.info/eleicoes/eleicoes-2026/tse-julga-recurso-contra-candidatura-de-dr-furlan-lider-nas-pesquisa-ao-governo-do-ap", "fonte_id": "jota", "data_pub": "2026-09-23T23:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) analisa um recurso contra a candidatura do líder nas pesquisas para o governo do Amapá, Dr Furlan. O Ministério Público argumenta que houve burla à Lei da Ficha Limpa e defende a inelegibilidade do candidato.", "titulo_pt": "TSE julga recurso contra candidatura de Dr Furlan, líder nas pesquisas ao governo do amapá", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178482, "titulo": "STF mantém aumento de custas judiciais no ES de até R$ 98 mil", "url": "https://www.jota.info/stf/do-supremo/stf-mantem-aumento-de-custas-judiciais-no-es-de-ate-r-98-mil", "fonte_id": "jota", "data_pub": "2026-09-23T22:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) manteve o aumento das custas judiciais no Espírito Santo, que pode chegar a R$ 98 mil. A OAB apresentou uma ação questionando o aumento, mas a relatora ministra Cármen Lúcia seguiu sua decisão.", "titulo_pt": "STF mantém aumento de custas judiciais no ES de até R$ 98 mil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178118, "titulo": "Tribunal de Contas do DF determina bloqueio de bens de ex-dirigentes do BRB por caso Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/tribunal-de-contas-do-df-determina-bloqueio-de-bens-de-ex-dirigentes-do-brb-por-caso-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T22:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Contas do Distrito Federal determinou o bloqueio de bens de ex-dirigentes do BRB por causa das operações fraudulentas com o Banco Master. Paulo Henrique Costa, ex-presidente do BRB, e mais quatro ex-dirigentes estão envolvidos na decisão.", "titulo_pt": "Tribunal de Contas do DF determina bloqueio de bens de ex-dirigentes do BRB por caso Master", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178483, "titulo": "Missão move ação contra X e perfis americanos pagos para divulgar apostas sobre eleições brasileiras", "url": "https://www.jota.info/eleicoes/eleicoes-2026/missao-move-acao-contra-x-e-perfis-americanos-pagos-para-divulgar-apostas-sobre-eleicoes-brasileiras", "fonte_id": "jota", "data_pub": "2026-09-23T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão moveu ação contra perfis americanos ligados ao trumpismo que divulgavam apostas sobre as eleições brasileiras. Esses perfis exibiam conteúdos da empresa de apostas Polymarket, indicando Flávio Bolsonaro como favorito nas eleições.", "titulo_pt": "Missão move ação contra perfis americanos ligados ao trumpismo que divulgavam apostas sobre eleições brasileiras", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178484, "titulo": "Quem são todos os candidatos à Presidência da República do Brasil nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-presidencia-da-republica-do-brasil-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-09-23T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há 13 candidatos a presidente do Brasil concorrendo às eleições presidenciais de outubro. Essa é a contagem atual dos candidatos registrados.", "titulo_pt": "Quem são todos os candidatos à Presidência da República do Brasil nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178485, "titulo": "Flávio Bolsonaro envia ao STF notícia-crime contra Lula por suposto uísque de Vorcaro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-envia-ao-stf-noticia-crime-contra-lula-por-suposto-uisque-de-vorcaro", "fonte_id": "jota", "data_pub": "2026-09-23T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro enviou uma notícia-crime ao STF contra Lula acusando-o de suposto recebimento de uísque de Vorcaro. O Palácio do Planalto negou que o presidente tenha recebido qualquer presente do ex-banqueiro.", "titulo_pt": "Flávio Bolsonaro envia notícia-crime contra Lula por suposto uísque de Vorcaro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 178185, "titulo": "Quaest: Celina Leão lidera ao Governo do DF com 33%; Grass tem 21% e Arruda, 17%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/quaest-celina-leao-lidera-ao-governo-do-df-com-33-grass-tem-21-e-arruda-17.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-23T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Celina Leão (PP) lidera com 33% das intenções de voto para o governo do Distrito Federal, seguida pelo candidato Grass com 21% e Arruda com 17%, de acordo com uma pesquisa Quaest divulgada em 23 de setembro de 2026.", "titulo_pt": "Celina Leão lidera com 33% nas intenções de voto para o Governo do DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 178524, "titulo": "Xi llega a Washington para comenzar su visita de Estado y recibe inusual bienvenida por parte de Trump", "url": "https://www.latercera.com/mundo/noticia/xi-llega-a-washington-para-comenzar-su-visita-de-estado-y-recibe-inusual-bienvenida-por-parte-de-trump/", "fonte_id": "la_tercera", "data_pub": "2026-09-24T01:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, recebeu seu homólogo chinês, Xi Jinping, na Base Conjunta Andrews, próximo à capital americana, no início da visita de Estado de três dias de Xi a Estados Unidos.", "titulo_pt": "Xi chega a Washington e recebe inusitada recepção de Trump", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 178898, "titulo": "Europeans warn of rising Russian sabotage but see no imminent NATO attack", "url": "https://www.japantimes.co.jp/news/2026/09/24/world/europe-russian-sabotage-nato-attack/", "fonte_id": "japan_times", "data_pub": "2026-09-24T01:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros europeus relatam que Moscou está intensificando sabotagem, ataques cibernéticos e outras operações híbridas em todo o continente para enfraquecer o apoio à Ucrânia. Não há sinais imediatos de um ataque da OTAN.", "titulo_pt": "Européus alertam para aumento da sabotagem russa, mas não veem ataque da NATO iminente", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 178796, "titulo": "America’s Asian allies want a Trump-Xi truce — but not at their expense", "url": "https://www.cnbc.com/2026/09/24/uss-asian-allies-want-a-trump-xi-truce-but-not-at-their-expense.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-24T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há preocupações de que Trump possa suavizar a posição de Washington em relação ao Taiwan ou outros assuntos de segurança regional em troca de concessões da parte de Pequim.", "titulo_pt": "Aliados asiáticos dos EUA querem um trégua entre trump e xi — mas não à custa deles", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 178199, "titulo": "Lula compara discurso na ONU ao de Trump e diz que presidente dos EUA fala como se estivesse 'ameaçando todo mundo'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/23/lula-compara-discurso-na-onu-ao-de-trump-e-diz-que-presidente-dos-eua-fala-como-se-estivesse-ameacando-todo-mundo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-24T00:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) comparou seu discurso na Assembleia Geral da ONU com o de Donald Trump, destacando que o presidente dos EUA falou como se estivesse ameaçando o mundo. Lula enfatizou a importância dessa comparação entre os discursos.", "titulo_pt": "Lula compara discurso na ONU ao de Trump e diz que presidente dos EUA fala como se estivesse 'ameaçando todo mundo'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 178899, "titulo": "U.S.-China trade truce extended as Xi gets rare welcome from Trump", "url": "https://www.japantimes.co.jp/news/2026/09/24/world/politics/us-china-truce-xi-trump/", "fonte_id": "japan_times", "data_pub": "2026-09-24T00:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O trégua nas negociações comerciais entre Estados Unidos e China foi estendida, e Donald Trump é o primeiro presidente americano a cumprimentar um líder chinês pessoalmente no pátio de aterrissagem recentemente.", "titulo_pt": "Paz comercial entre EUA e China prorrogada e Trump cumprimenta Xi no aeroporto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 178968, "titulo": "Ukraine recently sent 2 N. Korean POWs to S. Korea: Zelenskyy", "url": "https://en.yna.co.kr/view/AEN20260924000800315", "fonte_id": "yonhap_news", "data_pub": "2026-09-24T00:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia recentemente enviou dois prisioneiros de guerra norte-coreanos para a Coreia do Sul. Esta informação foi dada pelo presidente ucraniano, Zelenskyy.", "titulo_pt": "Ucrânia recentemente enviou 2 prisioneiros de guerra norte-coreanos para a Coreia do sul: zelenskyy", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 178304, "titulo": "Trump explicita Doutrina Monroe que sempre pautou relações exteriores dos EUA, avalia analista", "url": "https://www.brasildefato.com.br/2026/09/23/trump-explicita-doutrina-monroe-que-sempre-pautou-relacoes-exteriores-dos-eua-avalia-analista/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-24T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os países do Escudo das Américas, promovido pelo governo de Donald Trump, realizaram uma ação conjunta para impor sanções a 24 organizações consideradas narcoterroristas, incluindo o PCC e CV no Brasil. A legislação brasileira associa o terrorismo a atos de violência extrema.", "titulo_pt": "Trump explicita Doutrina Monroe que sempre pautou relações exteriores dos EUA, analisa", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 178842, "titulo": "EU's Costa urges Iran to restore navigation in Hormuz Strait, resume cooperation with IAEA", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/eus-costa-urges-iran-restore-navigation-hormuz-strait-resume-cooperation", "fonte_id": "middle_east_eye", "data_pub": "2026-09-24T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Conselho Europeu, Antonio Costa, conversou com o presidente iraniano Masoud Pezeshkian e pediu ao Irã que restabeleça a navegação no Estreito de Ormuz e retome a cooperação com a Agência Internacional de Energia Atômica (IAEA). Costa enfatizou que o diálogo é a única via para resolver conflitos e assegurar a paz duradoura na região.", "titulo_pt": "Costa encoraja Irã a restaurar navegação no estreito de Ormuz e cooperar com aiea", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 178725, "titulo": "OpenAI agent 'infiltrated' Australian government website, PM says", "url": "https://www.bbc.co.uk/news/articles/c6vgy0333dppo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-24T00:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro australiano Anthony Albanese expressou preocupação com o fundador da OpenAI, Sam Altman, após autoridades informarem que um agente da OpenAI teria invadido um site do governo australiano em junho, três meses após o incidente.", "titulo_pt": "Agente da openai 'infiltrou' site do governo australiano, diz primeiro-ministro", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 178818, "titulo": "AI corporate leaders tell UN the industry needs global regulation", "url": "https://www.aljazeera.com/news/2026/9/24/ai-corporate-leaders-tell-un-the-industry-needs-global-regulation?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-24T00:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes da indústria de inteligência artificial estão pedindo por uma regulamentação global, enquanto o governo de Trump se recusa a estabelecer novas regras.", "titulo_pt": "Líderes da IA pedem regulamentação global enquanto governo dos EUA recusa-se a criar novas regras", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 178820, "titulo": "Iran war live: Tehran says it won’t be bullied, remains open for talks", "url": "https://www.aljazeera.com/news/liveblog/2026/9/24/iran-war-live-tehran-says-it-wont-be-bullied-remains-open-for-talks?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Irã afirmou que Teerã não se submeterá à pressão, mantendo-se aberto para negociações, em uma declaração no UN.", "titulo_pt": "Irã não se submeterá à pressão, mas permanece aberto para negociações, diz presidente", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 178740, "titulo": "Trump to Venezuela's Rodriguez: Elections need to happen", "url": "https://www.axios.com/2026/09/23/trump-venezuela-rodriguez-meeting-elections", "fonte_id": "axios", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante sua primeira reunião com o novo líder da Venezuela, o presidente Trump enfatizou a necessidade de manter o fluxo de petróleo, manter relações amistosas e que as eleições devem ocorrer. Trump não especificou uma data para as eleições, mas destacou sua importância como passo crucial para a democracia plena do país.", "titulo_pt": "Trump a Rodriguez: eleições precisam acontecer", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 178252, "titulo": "Governo Lula vê Escudo das Américas como brecha para os EUA na região", "url": "https://www.poder360.com.br/poder-governo/governo-lula-ve-escudo-das-americas-como-brecha-para-os-eua-na-regiao/", "fonte_id": "poder360", "data_pub": "2026-09-23T23:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula considera que a iniciativa Escudo das Américas pode ser uma oportunidade para os EUA aumentarem sua influência na região, especialmente em relação ao combate às facções criminosas, minerais, infraestrutura e presença chinesa.", "titulo_pt": "Governo Lula vê Escudo das Américas como chance de pressão dos EUA na região", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 178373, "titulo": "Trump estuda vetar por 90 dias exportações de diesel", "url": "https://www.infomoney.com.br/mundo/trump-estuda-vetar-por-90-dias-exportacoes-de-diesel/", "fonte_id": "infomoney", "data_pub": "2026-09-23T23:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, está considerando a possibilidade de proibir temporariamente as exportações de diesel por 90 dias. Alguns membros do Partido Republicano se opuseram a esta proposta.", "titulo_pt": "Trump estuda proibir exportações de diesel por 90 dias", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 178307, "titulo": "Presidente chinês Xi Jinping é recebido por Trump para agenda de três dias nos EUA", "url": "https://www.brasildefato.com.br/2026/09/23/presidente-chines-xi-jinping-e-recebido-por-trump-para-agenda-de-tres-dias-nos-eua/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-23T23:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping chegou aos Estados Unidos e foi recebido por Donald Trump, iniciando uma agenda de três dias. A visita visa aprofundar o diálogo sobre as relações comerciais entre China e Estados Unidos, ocorrendo quatro meses após a visita de Trump à China.", "titulo_pt": "Presidente chinês Xi Jinping é recebido por Trump em visita de três dias aos EUA", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 178374, "titulo": "EUA convidam Putin para reunião do G20 em dezembro; possível encontro com Trump", "url": "https://www.infomoney.com.br/mundo/eua-convidam-putin-para-reuniao-do-g20-em-dezembro-possivel-encontro-com-trump/", "fonte_id": "infomoney", "data_pub": "2026-09-23T23:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Kremlin indicou que a Rússia estaria disposta a considerar o convite para que o presidente russo, Putin, participe da reunião do G20 em dezembro. Também há possibilidade de um encontro entre Putin e o presidente americano, Trump.", "titulo_pt": "EUA convidam Putin para reunião do G20 em dezembro; possível encontro com Trump", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 178386, "titulo": "SoftBank emite US$ 11,1 bi em títulos para financiar a OpenAI", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/softbank-emite-us-111-bi-em-titulos-para-financiar-a-openai/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-24T00:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SoftBank emitiu títulos por US$ 11,1 bilhões para financiar a parcela final do investimento de US$ 10 bilhões na OpenAI, elevando seu investimento total para US$ 64,6 bilhões. Este investimento faz parte de um compromisso maior de US$ 30 bilhões do grupo para com a empresa, criadora do ChatGPT.", "titulo_pt": "Softbank emite US$ 11,1 bi em títulos para financiar investimento na OpenAI", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 178923, "titulo": "Production indices hit new high", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/24/2003864780", "fonte_id": "taipei_times", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os índices de produção atingiram novos níveis altos.", "titulo_pt": "Índices de produção atingem novo recorde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 178926, "titulo": "ADB raises GDP growth for Taiwan to 11% this year", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/24/2003864783", "fonte_id": "taipei_times", "data_pub": "2026-09-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ADB (Agência Asiática de Desenvolvimento) elevou a previsão de crescimento do PIB de Taiwan para 11% neste ano. A agência revisou suas estimativas devido a uma forte recuperação econômica.", "titulo_pt": "ADB eleva crescimento do pib de Taiwan para 11% neste ano", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 178897, "titulo": "US oil industry pushes back against proposed diesel export ban", "url": "https://www.ft.com/content/c902e192-8bbb-4f32-813c-ee255d3aebd0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-23T23:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria do petróleo dos Estados Unidos se opõe a uma proposta de banimento de exportações de diesel. Os grupos afirmam que não existe uma solução rápida para a crise de preços de combustíveis após o presidente sinalizar a possibilidade de interromper as exportações para o exterior.", "titulo_pt": "Indústria de petróleo americana se opõe a banimento proposto de exportações de diesel", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 178243, "titulo": "BC amplia controle sobre criptomoedas e mira carteiras próprias", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/bc-amplia-controle-sobre-criptomoedas-e-mira-carteiras-proprias", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-23T23:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central (BC) expandiu as regras de controle sobre operações com criptomoedas, exigindo que transferências acima de US$ 10 mil para carteiras autocustodiadas sejam notificadas ao Coaf a partir de 1º de outubro de 2026. As novas regras visam prevenir lavagem de dinheiro e financiamento do terrorismo e aplicam-se a empresas do setor de ativos virtuais.", "titulo_pt": "BC amplia controle sobre criptomoedas e obriga notificações a partir de 1º de outubro de 2026", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 178116, "titulo": "BC aperta regras para criptoativos e exige aviso ao Coaf para transferências acima de US$ 10 mil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/bc-aperta-regras-para-criptoativos-e-exige-aviso-ao-coaf-para-transferencias-acima-de-us-10-mil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T23:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central estabeleceu novas regras mais rigorosas para operações com criptoativos, exigindo que transferências acima de US$ 10 mil sejam comunicadas ao Coaf. Além disso, carteiras controladas pelos usuários também precisarão informar essas transações.", "titulo_pt": "BC estabelece novas regras mais rigorosas para criptoativos e comunicação ao Coaf", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 178117, "titulo": "A batalha entre o Fed e Trump", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/martinwolf/2026/09/a-batalha-entre-o-fed-e-trump.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T23:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Federal Reserve aumentou a taxa de juros pela primeira vez em três anos, elevando-a para a faixa de 3,75% a 4%. A decisão foi considerada sensata e tardia diante do fracasso da instituição em atingir a meta de inflação.", "titulo_pt": "A batalha entre o Fed e Trump", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179007, "titulo": "Meta Connect 2026: The biggest news and announcements", "url": "https://www.theverge.com/tech/998480/meta-connect-2026-biggest-news-announcements", "fonte_id": "the_verge", "data_pub": "2026-09-23T22:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta Connect, a conferência anual de lançamento de produtos da empresa, está próxima. Este ano, espera-se que o CEO Mark Zuckerberg e sua equipe anunciem atualizações relacionadas à inteligência artificial e óculos inteligentes, devido ao foco significativo da empresa nestes segmentos. A empresa enfrenta críticas de usuários em relação a como está lidando com esses produtos.", "titulo_pt": "Meta Connect 2026: as maiores notícias e anúncios", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 178244, "titulo": "Dólar aproxima-se de R$ 5,17, com notícias do exterior e eleições", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/dolar-aproxima-se-de-r-517-com-noticias-do-exterior-e-eleicoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-23T22:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encareceu mais de 1% e chegou perto de R$ 5,17, influenciado pela valorização do dólar nos mercados internacionais, pelo cenário político no Brasil e pela elevação do preço do petróleo. A bolsa de valores recuou quase 1%, ficando abaixo dos 186 mil pontos.", "titulo_pt": "Dólar se fortalece perto de R$ 5,17 com notícias internacionais e eleições", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 178119, "titulo": "TCU encerra
