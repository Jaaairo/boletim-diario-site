<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

ios desafios, com destaque para a guerra no Irã, que elevou os preços do petróleo e impactou o mercado de ações. Isso levou a um aumento de 34% no preço da gasolina nos Estados Unidos em apenas uma semana. No Brasil, a reforma tributária está sendo reescrita para tornar o novo sistema fiscal mais acessível aos contribuintes. A Aneel manteve a bandeira tarifária amarela em setembro, resultando em um acréscimo de R$ 1,885 a cada 100 kWh consumidos. O Ibovespa encerrou a semana em recuperação após um aumento do apetite ao risco, acompanhando a decisão mais dura do Federal Reserve. O governo Lula planeja incluir um aporte de R$ 6 bilhões nos Correios na proposta de Orçamento de 2027 para fortalecer a empresa estatal. Além disso, a produção de gasolina na Rússia caiu para 70% da demanda interna devido a ataques com drones, enquanto a China realiza uma inspeção nacional para avaliar a qualidade dos carros fabricados no país. O mercado de trabalho brasileiro apresentou o pior resultado do ano em julho, com um saldo positivo de 58.568 vagas, e o trigo em Chicago alcançou seu maior nível em três anos devido a restrições no Mar Negro.", "tecnologia": "O Brasil e outros países estão buscando regulamentar a inteligência artificial (IA) de forma adequada às realidades nacionais. A plataforma Anthropic permite que a IA controle dispositivos físicos, com aplicações potenciais em medicina e computadores quânticos. Por outro lado, a China se destaca na geração de vídeo, aproveitando um amplo ecossistema de mídia curta e regras de direitos autorais mais flexíveis. O uso de IA na medicina também avança, com um robô chinês realizando uma cirurgia de próstata a 3 mil quilômetros de distância. No entanto, a China enfrenta desafios, como a necessidade de aperfeiçoar as traduções de IA para evitar um tom mais ameaçador para o exterior. Além disso, a corrida por memórias de alto banda para IA intensifica, com Qualcomm envolvendo fabricantes como Samsung e SK hynix em uma nova competição. O uso de IA na produção de robôs humanóides também avança, com empresas chinesas investindo na produção desses robôs, seguindo o exemplo da Tesla.", "ciencia": "O estudo mais importante destaca a cerimônia em que o presidente Donald J. Trump concedeu a Medalha Espacial Congresional aos astronautas da missão Artemis II, incluindo Victor Glover, Christina Koch, Jeremy Hansen e Reid Wiseman, reconhecendo suas contribuições significativas para a exploração espacial. Em outro destaque, cientistas da DGIST desenvolveram um sensor vestível inteligente para a detecção em tempo real de gases perigosos, potencialmente aplicável em ambientes industriais e em máscaras. Além disso, um novo estudo revela que a exposição de abelhas-douradas a contaminantes pode ser usada como indicador do bem-estar ambiental, destacando a importância das abelhas como sentinelas ecológicas.", "cultura": "O Rock in Rio 2026, que acontecerá de 4 a 13 de setembro, promete ser um evento cultural de grande porte, com mais de 7.600 agentes de segurança garantindo a segurança de mais de 700 mil pessoas. Entre as atrações, destaque para o show de Péricles, que incluirá um tributo à música negra da Motown, e para a turnê de Ney Matogrosso, que comemora 50 anos de carreira com apresentações em estádios. A 11ª edição do festival equilibra o rock e o pop, com dias dedicados a artistas brasileiros, mulheres e trap, enquanto Elton John retorna após uma recepção hostil há 15 anos. O Stray Kids também lidera a estreia do k-pop no evento, após lotar estádios brasileiros desde sua formação. A programação do Rock in Rio 2026 inclui ainda shows de artistas nacionais como Gilberto Gil, Luísa Sonza e João Gomes, além de uma data especial para a música brasileira.", "sociedade": "O Brasil enfrenta dificuldades em medir a quantidade de entregadores que se acidentam no trabalho, devido à falta de dados oficiais. Em Nova York, jovens estão buscando formas não convencionais de moradia para reduzir custos, como viver com freiras ou dividir casas com idosos. A Europa lidera os casos de violência doméstica contra brasileiras no exterior, com 45% dos registros provenientes do continente. Estima-se que 93,6% das vítimas de violência doméstica não estejam registradas oficialmente, e três em dez brasileiras foram vítimas de violência doméstica ou familiar nos últimos 12 meses. Um experimento em Kamala, Malawi, está mostrando como a futura assistência poderia funcionar ao fornecer $700 a todos, com o resultado de um fortalecimento da economia local. No Brasil, Flávio Bolsonaro anunciou Claudio Lottenberg para a pasta da Saúde em caso de sua eleição, com o hospital Albert Einstein expandindo parcerias com o setor público e aumentando os atendimentos pelo SUS. Um zelador agredido na Asa Norte sofreu parada cardíaca e está desde então internado na UTI, enquanto um homem foi preso em Planaltina de Goiás após importunar sexualmente mulheres na rodoviária. Um projeto de lei proposto por Romário visa incluir exames de sangue no SUS para o diagnóstico precoce do Alzheimer, visando democratizar o acesso a esse teste. Uma servidora do Ministério Público mantinha material relacionado a exploração sexual infantil em um e-mail particular, e uma influenciadora digital compartilhou ensinamentos que recebeu da mãe, incluindo a lição de que nunca deve depender de um homem. A presença feminina na magistratura está aumentando, mas a Corte do Supremo Tribunal Federal (STF) teve apenas três mulheres em sua história. Íris Abravanel, viúva de Silvio Santos, está incluída na lista dos maiores bilionários do Brasil. Um homem foi detido no Espírito Santo após filmar uma dança antes de incendiar um veículo da Polícia Militar e explodir uma viatura. Um novo levantamento nacional sobre nutrição mostra que a malnutrição aguda entre crianças aumentou em Haiti, com quase um em cada treze crianças abaixo dos cinco anos sofrendo de malnutrição aguda. A comunidade nepalesa na Austrália planeja vigílias para lembrar as vítimas do desastre de inundações devastador em Nepal, que resultou em 579 mortes. O estado do Rio Grande do Sul ainda tem lacunas em planos contra enchentes, com os municípios sendo o elo mais fraco na adaptação para enfrentar as enchentes. Mais de 500.000 jovens abaixo dos 24 anos já são devedores em mora, de acordo com um estudo, e o vício em pornografia tem causado danos à saúde que são comparáveis aos causados pelo uso de drogas. Uma série de feiras de emprego em Seul conectará mais de 160 empresas com cerca de 3.000 vagas a candidatos de meia-idade, oferecendo informações sobre emprego, consultas individuais e entrevistas presenciais. Um professor no Distrito Federal transformou seu estúdio em um local onde agia como predador sexual, estuprando uma de suas vítimas, uma garota de 16 anos, dez vezes e gravando os atos. A Kia Corp. informou que seu sindicato de trabalhadores aprovou um acordo salarial, marcando o sexto ano consecutivo sem greve.", "meio_ambiente": "Em 26 de agosto, uma enxurrada catastrófica atingiu a região Himalayense na fronteira entre Nepal e Tibet, causando danos significativos à biodiversidade local. A mudança climática está contribuindo para a frequência e intensidade desses eventos, com especialistas acreditando que desastres semelhantes ocorrerão com maior frequência no futuro. Além disso, o novo lago formado na fronteira entre Nepal e China está causando preocupações devido à possibilidade de mais inundações, refletindo as ameaças ambientais globais. A biodiversidade está se integrando na compliance corporativa com o Marco Global da Biodiversidade e o TNFD (Taskforce on Nature-related Financial Disclosures), incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza. No Brasil, a extração ilegal de madeira em uma área indígena em Rondônia foi combatida por uma operação da Polícia Federal, destacando a importância da proteção ambiental. A mudança climática também está afetando economias, com a Europa enfrentando um severo período de estiagem, levando a problemas com rios secos e culturas afetadas. Estes eventos reforçam a necessidade de ações ambientais mais rigorosas e transparentes.", "direitos_humanos": "Os principais eventos abordados nos artigos incluem a situação de direitos humanos em Gaza, conforme relatado pela UNICEF e pela Refugees International. Quatro crianças morreram em ataques separados que destruíram suprimentos humanitários e danificaram a infraestrutura crítica de água no Gaza, segundo a UNICEF. Por outro lado, o presidente da Refugees International, Jeremy Konyndyk, criticou as afirmações israelenses sobre a melhora nas estatísticas de malnutrição em Gaza, argumentando que a situação humanitária permanece crítica. Em Hong Kong, a situação de direitos humanos também é abordada, com a prisão de Chow Hang-tung, uma das presidiárias políticas mais proeminentes, por mais de cinco anos, e a possibilidade de uma sentença adicional de 10 anos. Além disso, a ONU relatou que 160 mil mulheres e meninas foram afetadas por uma enchente no Nepal, enfrentando riscos maiores de violência e empobrecimento. Uma comissão de verdade será estabelecida para investigar o esquema de controle reprodutivo em massa na Groenlândia, que violou os direitos das mulheres, de acordo com especialistas."}, "resumo_do_dia": {"politica_nacional": [{"id": 131439, "titulo": "PEC da Segurança pode tirar R$ 500 milhões do esporte, dizem entidades", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/pec-da-seguranca-pode-tirar-r-500-milhoes-do-esporte-dizem-entidades.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades ligadas ao esporte afirmam que a PEC da Segurança Pública pode retirar até R$ 500 milhões destinados a áreas sociais, incluindo esportes.", "titulo_pt": "PEC da Segurança pode cortar R$ 500 milhões para o esporte, dizem entidades" res de energia, representando cerca de 5% do total de consumidores. A geração distribuída, que inclui residências, estabelecimentos comerciais e propriedades rurais gerando energia solar, tem alterado a matriz energética brasileira.", "titulo_pt": "Energia de telhado: geração distribuída avança e desafia o equilíbrio do sistema elétrico", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131440, "titulo": "Faculdade, agronegócio, empreendimento imobiliário; veja bens de candidatos a governador", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/faculdade-agronegocio-empreendimento-imobiliario-veja-bens-de-candidatos-a-governador.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Mato Grosso, Otaviano Pivetta (Republicanos), que disputa a reeleição em 2026, é o candidato com maior patrimônio declarado, totalizando R$ 575,6 milhões em bens. Ele concorre ao Poder Executivo em 2026.", "titulo_pt": "Faculdade, agronegócio, empreendimento imobiliário; veja bens de candidato a governador otaviano pivetta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 131441, "titulo": "'Dark Horse' tem contradições para justificar dinheiro de Vorcaro e falta de prestação de contas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/dark-horse-tem-contradicoes-para-justificar-dinheiro-de-vorcaro-e-falta-de-prestacao-de-contas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três meses após a revelação de que o filme 'Dark Horse' foi financiado pelo banqueiro Daniel Vorcaro, do Master, ainda não foram apresentadas a prestação de contas do longa nem o contrato com Vorcaro.", "titulo_pt": "Filme 'dark Horse' tem contradições para justificar financiamento de Vorcaro e falta de prestação de contas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 131474, "titulo": "Liderança de Moro no Paraná combina Lava Jato, polarização e dificuldade de Ratinho Junior em emplacar sucessor; entenda", "url": "https://g1.globo.com/pr/parana/eleicoes/2026/noticia/2026/08/29/lideranca-de-moro-no-parana-combina-lava-jato-polarizacao-e-dificuldade-de-ratinho-junior-em-emplacar-sucessor-entenda.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest indica que Sergio Moro lidera as intenções de voto para as eleições de 2026 no Paraná, com cerca de 49% dos votos válidos, seguido pelo segundo colocado, Requião Filho. Moro, ex-juiz da Lava Jato, tem chances de se eleger ainda no primeiro turno.", "titulo_pt": "Liderança de Moro no Paraná combina Lava Jato, polarização e dificuldade de Ratinho Junior em emplacar sucessor; entenda", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131583, "titulo": "PEC 6x1: entenda mudanças na jornada de trabalho e a tramitação no Senado", "url": "https://exame.com/brasil/pec-6x1-entenda-mudancas-na-jornada-de-trabalho-e-a-tramitacao-no-senado/", "fonte_id": "exame", "data_pub": "2026-08-29T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto proposto prevê uma jornada de trabalho de 40 horas semanais, com dois dias de descanso, e exceções para algumas categorias, com uma transição gradual. A proposta pode avançar no Senado.", "titulo_pt": "PEC 6x1: entenda mudanças na jornada de trabalho e tramitação no Senado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 131475, "titulo": "Voto para senador também escolhe dois substitutos; 42 suplentes assumiram o mandato desde 2019", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/29/voto-para-senador-tambem-escolhe-dois-substitutos-42-suplentes-assumiram-o-mandato-desde-2019.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ao votar em um senador, o eleitor escolhe também dois suplentes que podem assumir o mandato. Desde 2019, 42 suplentes já assumiram o mandato de senador, com 10 ainda em exercício.", "titulo_pt": "Voto para senador inclui escolha de dois suplentes; 42 assumiram o mandato desde 2019", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131476, "titulo": "Augusto Cury participa de entrevista da Globo neste sábado; saiba como assistir", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/29/augusto-cury-entrevista-globo-como-assistir.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato pelo partido Avante às eleições presidenciais de 2026, participará de uma entrevista na TV Globo neste sábado às 21h20 (de Brasília). A conversa será exibida logo após o Jornal Nacional, diretamente dos Estúdios Globo no Rio de Janeiro.", "titulo_pt": "Augusto Cury participa de entrevista da Globo neste sábado; saiba como assistir", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131477, "titulo": "MPT recebe 223 denúncias de assédio eleitoral em 2026; registros mais que dobram no mês de início da campanha", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/29/mpt-denuncias-de-assedio-eleitoral-em-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Trabalho (MPT) registrou 223 denúncias de assédio eleitoral no ambiente de trabalho em 2026, com 95 registros concentrados em agosto, o que representa mais de dobro em comparação com julho. O número de denúncias também aumentou em relação a eleições anteriores, sendo 25,5% maiores que em 2024 e 16 vezes maiores que em 2022.", "titulo_pt": "MPT recebe 223 denúncias de assédio eleitoral em 2026; registros mais que dobram no início da campanha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131478, "titulo": "VÍDEO: De onde sai o dinheiro das campanhas políticas?", "url": "https://g1.globo.com/politica/eleicoes/2026/videos/noticia/2026/08/29/video-de-onde-sai-o-dinheiro-das-campanhas-politicas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nas eleições de 2026, cerca de R$ 5 bilhões serão utilizados para financiar as campanhas políticas no Brasil. A principal fonte desse dinheiro é o Fundo Especial de Financiamento de Campanha, conhecido como Fundo Eleitoral, que neste ano receberá R$ 4,9 bilhões do Orçamento da União.", "titulo_pt": "De onde sai o dinheiro das campanhas políticas?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131479, "titulo": "Patrimônio de candidatos do PL tem o maior aumento em quatro anos; veja o ranking dos partidos", "url": "https://g1.globo.com/politica/noticia/2026/08/29/patrimonio-de-candidatos-do-pl-tem-o-maior-aumento-em-quatro-anos-veja-o-ranking-dos-partidos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PL teve o maior aumento no patrimônio de seus candidatos nas eleições de 2026 em comparação com 2022. A soma total do patrimônio dos candidatos em todas as eleições de 2026 é de R$ 31,1 bilhões, 30% maior do que em 2022.", "titulo_pt": "Patrimônio de candidatos do PL tem o maior aumento em quatro anos; veja o ranking dos partidos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 132062, "titulo": "Sliman Mansour has died. His art became a symbol of Palestinian resilience.", "url": "https://www.washingtonpost.com/obituaries/2026/08/29/sliman-mansour-towering-figure-palestinian-art-dies-79/", "fonte_id": "washington_post_world", "data_pub": "2026-08-29T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sliman Mansour era um pintor que retratou a vida e a história palestina por mais de 50 anos. Sua obra se tornou mais politicamente engajada após um período na prisão.", "titulo_pt": "Sliman Mansour faleceu. Sua arte se tornou símbolo da resiliência palestina.", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 131990, "titulo": "Russian drone strike near Kyiv kills at least 27", "url": "https://www.scmp.com/news/world/europe/article/3365705/russian-drone-strike-near-kyiv-kills-least-27?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone russo atingiu uma warehouse perto dos subúrbios ocidentais de Kyiv durante a noite, causando pelo menos 27 mortes, um incêndio e explosões. A promotora ucraniana abriu uma investigação sobre supostas negligências criminais, mas não forneceu detalhes sobre o tipo de instalação.", "titulo_pt": "Ataque de drone russo perto de Kyiv causa ao menos 27 mortes", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131616, "titulo": "Ataque russo próximo a Kiev deixa pelo menos 27 mortos", "url": "https://www.metropoles.com/mundo/ataque-russo-proximo-a-kiev-deixa-pelo-menos-27-mortos", "fonte_id": "metropoles", "data_pub": "2026-08-29T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque com drones atingiu um depósito em Myla, próximo a Kiev, deixando pelo menos 27 mortos. Pelo menos 370 pessoas foram evacuadas.", "titulo_pt": "Ataque russo próximo a Kiev deixa pelo menos 27 mortos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132049, "titulo": "Minor Justice Party elects new leader", "url": "https://en.yna.co.kr/view/AEN20260829002100315", "fonte_id": "yonhap_news", "data_pub": "2026-08-29T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 29 de agosto, o Partido Justiça, um partido político menor e progressista, elegeram um novo líder.", "titulo_pt": "Partido justiça elege novo líder", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 131825, "titulo": "At least 27 dead and hundreds evacuated after strikes near Kyiv", "url": "https://www.bbc.co.uk/news/articles/c86xwqez4npo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-29T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 27 pessoas morreram e centenas foram evacuadas após ataques perto de Kyiv na noite passada. Uma garota de 14 anos está entre as vítimas.", "titulo_pt": "Pelo menos 27 mortos e centenas evacuados após ataques perto de Kyiv", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 131945, "titulo": "Autorità Nepal, fino a 5 miliardi per la ricostruzione dopo le alluvioni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/29/autorita-nepal-fino-a-5-miliardi-per-la-ricostruzione-dopo-le-alluvioni_963424b8-22d9-44bc-ab24-188dd342b5e3.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-29T09:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A autoridade nepalesa estima um investimento inicial de até 5 bilhões de rupias para a reconstrução após as inundações. Trata-se ainda de uma estimativa inicial.", "titulo_pt": "Autoridades nepalesas, até 5 bilhões para a reconstrução após as inundações", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 131946, "titulo": "MotoGp: Aragon, Bezzecchi in pole, secondo Marc Marquez", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/29/motogp-aragon-bezzecchi-in-pole-secondo-marc-marquez_d37e9d1f-22e8-4578-b012-833016d08883.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-29T09:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Em Aragão, Italy, Francesco Bezzecchi conquistou a pole position na MotoGP, seguido por Marc Marquez em segundo. Jorge Martin, líder do Mundial pilotando uma Aprilia, largará em quinto, enquanto Fabio Bagnaia partirá em oitava posição.", "titulo_pt": "Motogp: aragão, Bezzecchi em pole, segundo Marquez", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 131543, "titulo": "Ataque russo deixa ao menos 27 mortos na região de Kiev, diz governador", "url": "https://www.cnnbrasil.com.br/internacional/ataque-russo-deixa-ao-menos-27-mortos-na-regiao-de-kiev-diz-governador/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque russo causou ao menos 27 mortes na região de Kiev, de acordo com o governador local. Outras 42 pessoas ficaram feridas.", "titulo_pt": "Ataque russo deixa ao menos 27 mortos na região de Kiev, diz governador", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131898, "titulo": "US campaign to isolate Iran closes in on Dubai", "url": "https://www.ft.com/content/930386eb-b5d4-4a62-a258-f7ab46401655?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-29T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A campanha dos Estados Unidos para isolar o Irã está se aproximando de Dubai, uma cidade do Golfo que, ao longo das décadas, funcionou como um hub offshore para serviços financeiros, comércio e acesso a mercados globais necessários ao regime iraniano.", "titulo_pt": "Campanha dos EUA para isolar o Irã se aproxima de Dubai", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 131926, "titulo": "France's nuclear tests in Algeria: A colonial legacy that still radiates 60 years later", "url": "https://www.middleeasteye.net/news/frances-nuclear-tests-algeria-colonial-legacy-still-radiates-60-years-later", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algeria iniciou esforços de descontaminação de áreas radioativas, devido aos testes nucleares franceses realizados no país durante a colonização, já que a França não fornece mapas ou ajuda para limpar os locais radioativos no Saara. Um engenheiro de 30 anos chamado Mokhtar Benabdelkader, que vive em Adrar, a cerca de 1.500 km de Algiers, lembra das histórias contadas por seu avô sobre os testes nucleares.", "titulo_pt": "Testes nucleares da França em álgeria: legado colonial que ainda se manifesta 60 anos depois", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 131640, "titulo": "O Conselho Constitucional francês e a proibição de acesso de menores a redes sociais", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-conselho-constitucional-frances-e-a-proibicao-de-acesso-de-menores-a-redes-sociais", "fonte_id": "jota", "data_pub": "2026-08-29T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Constitucional francês considerou desproporcional a proibição de acesso de menores de 15 anos a redes sociais.", "titulo_pt": "Conselho Constitucional francês considera proibição de acesso de menores a redes sociais desproporcional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131999, "titulo": "US envoy’s Kashmir ‘part of India’ remark rattles Pakistan ties", "url": "https://www.scmp.com/week-asia/politics/article/3365621/us-envoys-kashmir-part-india-remark-rattles-pakistan-ties?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um diplomata dos Estados Unidos, Sergio Gor, afirmou que o Caxemira é 'uma parte importante da Índia' durante uma visita recente a Srinagar. Em resposta, Pakistan imediatamente protestou formalmente.", "titulo_pt": "Comentário de diplomata dos EUA sobre caxemira pertencer à Índia causa tensão com Pakistan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131928, "titulo": "Israeli forces carry out two explosions in southern Lebanon, set fire to homes", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-carry-out-two-explosions-southern-lebanon-set-fire-homes", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses realizaram duas explosões perto da cidade de Aita al-Jabal no sul do Líbano e incendiaram várias casas em Beit Yahoun. Além disso, um ataque com drone foi registrado nas imediações de Nabatieh al-Fawqa no sul do país.", "titulo_pt": "Forças israelenses realizam explosões e incêndios no sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 131760, "titulo": "Statins can safely cut risk of heart attacks or strokes in healthy people aged over 70, world-first clinical trial shows", "url": "https://www.theguardian.com/australia-news/2026/aug/29/statins-reduce-risk-heart-attack-stroke-over-70s-clinical-trial", "fonte_id": "guardian_world", "data_pub": "2026-08-29T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo clínico liderado pela Austrália mostrou que os estatinas podem reduzir o risco de ataques cardíacos ou AVC em pessoas acima de 70 anos de forma segura, com um baixo risco de efeitos colaterais graves. Até então, essas medicações eram geralmente prescritas para pessoas abaixo dos 75 anos que apresentavam certos critérios de risco.", "titulo_pt": "Estatinas podem reduzir risco de ataques cardíacos ou avc em pessoas acima de 70 anos, com baixo risco de efeitos colaterais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 131929, "titulo": "West Bank attacks: Two Palestinians shot, entry to village closed", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/west-bank-attacks-two-palestinians-shot-entry-village-closed-0", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T06:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois palestinos, incluindo um adolescente de 15 anos, foram baleados por forças israelenses durante uma operação no campo de refugiados al-Amari, em al-Bireh, no sábado pela manhã. A entrada da aldeia de Al-Mughayir, próxima a Ramallah, foi fechada pelas forças israelenses.", "titulo_pt": "Ataques na cisjordânia: dois palestinos baleados, entrada de aldeia fechada", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 131907, "titulo": "Six months into the Iran war, a new Gulf security architecture is emerging", "url": "https://www.aljazeera.com/opinions/2026/8/29/six-months-into-the-iran-war-a-new-gulf-security-architecture-is-emerging?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-29T06:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os estados do Golfo estão construindo parcerias interligadas que complementam, em vez de substituírem, o papel de segurança dos Estados Unidos.", "titulo_pt": "Seis meses da guerra iraniana: uma nova arquitetura de segurança do golfo está emergindo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 131425, "titulo": "Como seis meses de guerra no Irã abalaram mercado de petróleo, preço dos combustíveis e ações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/como-seis-meses-de-guerra-no-ira-abalaram-mercado-de-petroleo-preco-dos-combustiveis-e-acoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 28 de fevereiro, os Estados Unidos e Israel atacaram o Irã, levando a um aumento imediato do preço do petróleo, aumento dos juros e queda nas ações. Os motoristas americanos já pagavam 34% a mais pela gasolina em apenas uma semana.", "titulo_pt": "Como seis meses de guerra no Irã abalaram mercado de petróleo, preço dos combustíveis e ações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 131993, "titulo": "Reality check for China’s carmakers as authorities tell them to focus on quality, not tech", "url": "https://www.scmp.com/business/china-business/article/3365597/reality-check-chinas-carmakers-authorities-tell-them-focus-quality-not-tech?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades chinesas estão realizando uma inspeção nacional para avaliar a qualidade dos carros fabricados no país, em resposta ao mercado de carros que está se contraindo. Esta ação visa focar mais na qualidade dos veículos do que em tecnologias avançadas.", "titulo_pt": "Verificação de realidade para fabricantes de carros chineses: qualidade em foco", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131637, "titulo": "A importância da regulamentação da profissão dos agentes de viagens", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-importancia-da-regulamentacao-da-profissao-dos-agentes-de-viagens", "fonte_id": "jota", "data_pub": "2026-08-29T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação da profissão de agentes de viagens promove segurança jurídica, transparência e profissionalização no mercado.", "titulo_pt": "A importância da regulamentação da profissão de agentes de viagens", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131573, "titulo": "Virando emergente? Por que os EUA podem precisar “imitar o Brasil” para domar dívida", "url": "https://www.infomoney.com.br/economia/virando-emergente-por-que-os-eua-podem-precisar-imitar-o-brasil-para-domar-divida/", "fonte_id": "infomoney", "data_pub": "2026-08-29T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos podem precisar adotar uma tática semelhante à do Brasil para gerenci
