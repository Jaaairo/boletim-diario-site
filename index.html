<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "02/08/2026 18:08", "stats": {"noticias_novas": 1240, "resumos_gerados": 257}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Luiz Inácio Lula da Silva (Lula), oficialmente candidato à reeleição pelo Partido dos Trabalhadores (PT), terá como vice Geraldo Alckmin do PSB. A chapa, que será repetida da eleição anterior, busca o quarto mandato de Lula e está focada em estratégias para a campanha, incluindo comitês populares, brigadas de agitação, plataformas digitais e a consolidação do apoio feminino. O presidente, que completou 80 anos recentemente, declarou estar 'em ótima forma' ao lançar sua candidatura em um evento em São Paulo. Lula criticou emendas e fundo partidário, afirmando que seu quarto mandato será para promover mudanças. Na convenção nacional do PT, ele convidou Janja para discursar, destacando a necessidade de incluir mulheres no palanque. A campanha do candidato à Assembleia Legislativa de São Paulo, Renato Battista, seguiu a estratégia nacional adotada pelo partido. O Congresso Nacional retornou das férias sem previsão de plenários deliberativos durante o período eleitoral, com os trabalhos limitados a duas semanas. Manifestações contra o PL da Misoginia foram convocadas em diversas cidades brasileiras para pressionar a Câmara dos Deputados a aprovar o texto já aprovado no Senado. Deputados apresentaram representações contra o prefeito de São Paulo, Ricardo Nunes (MDB), após ele chamar Fernando Haddad (PT) de 'professorzinho' durante uma convenção do Republicanos, pedindo retratação ao político.", "mundo": "Chou Ling-wen foi eleita a primeira presidente feminina da CTBA, marcando um momento histórico para a organização. Em seguida, uma nevasca intensa na Argentina obrigou a retirada de emergência de mais de 200 turistas em Mendoza. O governo da Austrália anunciou planos para aumentar e taxar as grandes tecnológicas que não pagarem por conteúdo local de imprensa, visando incentivar negociações com a mídia local. Um ataque suicida durante uma manifestação no Paquistão resultou em 14 mortes, incluindo policiais, e mais de 18 feridos. No Irã, planejaram-se estratégias para intensificar a guerra contra os Estados Unidos se as forças americanas atacassem novamente, com o apoio de seus proxyes. Na Rússia, um incidente em Moscou foi declarado como um atentado terrorista, resultando na morte de duas pessoas e ferindo 21. Bernarda Rosalba Vera Contardo, uma chilena desaparecida durante o governo Pinochet, foi encontrada viva após 50 anos. O Partido dos Trabalhadores oficializou a sétima candidatura de Lula à Presidência do Brasil, enquanto o presidente minimizava pesquisas apontando uma disputa acirrada com Flávio Bolsonaro e pedindo aos agressores que não votem nele. A Justiça Eleitoral brasileira estabeleceu regras para limitar o uso de deepfakes durante as eleições, proibindo o uso de conteúdo falso e manipulação de imagens. Além disso, a Índia foi novamente classificada como o mercado externo mais promissor pelo quarto ano consecutivo, levando o Japão a buscar apoio diplomático para empresas japonesas entrarem no país.\n\nOs Estados Unidos expressaram preocupação com os patrulhamentos militares da China, considerados profundamente instabilizadores. Em outro desenvolvimento geopolítico, Israel realizou ataques em Gaza, resultando na morte de 15 pessoas. A Casa Branca pressiona o Israel para alcançar uma trégua com os palestinos. Além disso, o Irã anunciou que as negociações com Omã sobre o Estreito de Ormuz estão na fase final, embora Trump tenha afirmado que os Estados Unidos iriam adiar um novo ataque ao Irã em esperança de chegar a um acordo rápido. Em meio a esses eventos, Taiwan é considerada crucial para os esforços liderados pelos Estados Unidos no campo da inteligência artificial. O conflito na Ucrânia continua com ataques de drones ucranianos matando oito pessoas na Rússia e vice-versa. A situação na fronteira espanhola de Ceuta também é alarmante, com 72 mortes registradas em um caos de migrantes após cerca de 50 mil pessoas entrarem pelo território com o Marrocos.", "economia": "As maiores empresas dos Estados Unidos estão registrando lucros sólidos, enquanto os consumidores enfrentam aumentos nos custos. O grupo S&P 500 está prestes a ter os melhores resultados financeiros em cinco anos (Financial Times). Em outro desenvolvimento econômico global, a Arábia Saudita, Rússia e outros membros da Opep+ decidiram aumentar a produção de petróleo em 188 mil barris por dia a partir do mês de setembro como resposta ao conflito entre Estados Unidos e Irã (Agência Brasil Economia). No Brasil, o Rio Grande do Sul e o Rio de Janeiro apresentaram os menores crescimentos do PIB na média anual entre 2002 e 2023. A população mais envelhecida representa um desafio para essas regiões (Folha Mercado). Além disso, a Morgan Stanley gerou um valor de US$ 74 bilhões em ativos de gestão de riquezas no segundo trimestre, graças à assinatura com SpaceX e outras novas emissões (Financial Times).", "tecnologia": "A União Europeia aprovou o AI Act em fevereiro de 2024, reforçando as regulamentações sobre inteligência artificial. Este marco legal visa garantir que a IA seja usada de forma ética e responsável, incluindo novas regras para a divulgação clara quando as pessoas interagirem com sistemas de IA ou visualizarem conteúdo gerado por ela. Por outro lado, o México encerrou recentemente a Network School, uma comunidade tecnológica liderada por Balaji Srinivasan, após intervenções do governo local. No setor automotivo, a Hyundai Motor Group planeja se transformar em uma empresa de inteligência artificial física, expandindo suas operações para veículos autônomos e fábricas inteligentes além da fabricação de carros. A Samsung está prevista para superar a SK hynix no mercado de memória de alta largura de banda (HBM) em 2027, com uma fatia estimada de 41% das embarcações de bits HBM, contra 39% da SK hynix e 20% para a Micron Technology. Além disso, o volume total de stablecoins aumentou significativamente, saltando de menos de US$ 7 bilhões em 2020 para mais de US$ 315 bilhões na primeira metade de 2026, explorando os paradoxos e riscos associados a esse crescimento acelerado.", "ciencia": "O Eclipse do Século, previsto para ocorrer em uma data específica e ser visível em diversos países da África e Oriente Médio, será o evento astronômico mais fotografiado na história. Este fenômeno causará impactos significativos na vida diária, como a necessidade de proteção contra os raios solares, prometendo ser um marco histórico para a ciência e para a cultura popular. Paralelamente, pesquisadores do Instituto Tecnológico de Massachusetts (MIT) desenvolveram uma nova técnica de microscopia que permite visualizar estruturas moleculares com precisão em escala angstrômica, superando limites nanométricos tradicionais. Este avanço tecnológico tem potencial para revolucionar diversos campos da ciência, desde biologia molecular até materiais nanoestruturados. Além disso, a resistência antimicrobiana está se espalhando nos sistemas de água na África do Sul, um problema que requer urgente atenção e intervenção, conforme estudos recentes indicam.", "cultura": "O ator Paulo Betti participou da cerimônia de encerramento do festival Bonito CineSur e defendeu a regulamentação das plataformas de streaming no Brasil, argumentando sobre a necessidade de remuneração pelos direitos autorais. O filme paraguaio '¿Quién Mató a Narciso?' venceu o prêmio de melhor longa sul-americano no festival Bonito CineSur. Em outro evento cultural, o ator britânico Richard E. Grant está explorando a obra de Homero em uma viagem inspirada, focando na obra 'A Odisseia'. A segunda temporada da série animada 'Batman: Caped Crusader' é destacada como uma sucessora masterful que enraíza o herói em uma compaixão evoluída, apropriada tanto para audiências jovens quanto para adultos conscientes dos eventos atuais. Além disso, o festival de Glastonbury retornou aos seus originais no castelo onde foi realizado pela primeira vez há 850 anos, celebrando sua tradição cultural com bardos e músicos competindo sob a patrocínio do príncipe medieval Lord Rhys ap Gruffydd.", "sociedade": "Um influenciador do Ceará anunciou sua candidatura a deputado federal pelo PSB, com o apoio do senador Cid Gomes. O atleta Reinier, que é reserva em um clube, xingou explicitamente um torcedor na Arena MRV e se desculpou nas redes sociais. Em Minas Gerais, o Programa Reforço Escolar será lançado com um investimento de R$ 8 milhões para atender até 5.800 estudantes da rede municipal. O governo federal realizará inspeções em todas as escolas do país para garantir a cobertura mínima de profissionais, exigindo a presença de 75% dos docentes. Além disso, o Ministério Público do Rio Grande do Sul denunciou um proprietário de clínica e seu engenheiro de manutenção por mortes de idosos em um elevador prensado, enquanto Israel enfrenta uma crise médica com fechamentos de passagens e destruição de hospitais que paralisam a formação de médicos gêmeos.", "meio_ambiente": "Incêndios florestais e eventos climáticos intensos têm se tornado preocupantes no mundo. Em Atenas, Grécia, fortes ventos empurravam as chamas para os bairros ocidentais da capital, com dois helicópteros de combate a incêndios colidindo perto do local. Na França, aproximadamente 3 mil bombeiros estavam em operação nas duas frentes, enquanto temperaturas elevadas e ventos ameaçavam reacender as chamas. No estado de Washington, Estados Unidos, incêndios florestais atingiram mais de 100 mil hectares, levando a evacuações. Além disso, uma onda de calor na Hungria obrigou a interrupção da operação da maior usina nuclear do país e níveis baixos no Danúbio interferiram no sistema de resfriamento. A seca está causando uma 'catástrofe' na produção de legumes em várias regiões, especialmente na França ocidental.", "direitos_humanos": "O número de mortes no massivo influxo de imigrantes para a cidade espanhola de Ceuta, na África do Norte, subiu para pelo menos 72, com cinco corpos adicionais encontrados nas praias da localidade. Este evento é descrito como um surto inédito que teve início na quinta-feira e mais de 50 mil pessoas entraram em Ceuta por terra e mar. Em outro desenvolvimento, ativistas dos direitos das pessoas com deficiência planejam realizar uma série de protestos durante o horário de pico na linha 4 do metrô de Seul, coincidindo com a votação do governo sobre a proposta de orçamento para 2027. O primeiro protesto está programado para ocorrer em 8 de agosto. Além disso, ativistas tibetanos realizaram um protesto contra a lei de unidade étnica da China em frente a um banco local. Em Israel, um vídeo da CCTV registrou o momento exato em que um menino palestino de nove anos foi baleado durante uma operação agrícola realizada por setentristas israelenses."}, "resumo_do_dia": {"politica_nacional": [{"id": 85173, "titulo": "Mulheres vão às ruas pela votação do PL da Misoginia", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/mulheres-vao-ruas-pela-votacao-do-pl-da-misoginia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-02T19:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Levante Mulheres Vivas convoca manifestações em diversas cidades brasileiras neste domingo para pressionar a Câmara dos Deputados a aprovar o Projeto de Lei 896/2023, conhecido como PL da Misoginia. O texto já foi aprovado no Senado e aguarda a decisão do presidente da Câmara para ser votado.", "titulo_pt": "Mulheres às ruas pela aprovação do PL da Misoginia", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 85183, "titulo": "Deputados acionam MP contra Nunes e pedem retratação após ele chamar Haddad de 'professorzinho'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/deputados-acionam-mp-contra-nunes-e-pedem-retratacao-apos-ele-chamar-haddad-de-professorzinho.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputados apresentaram representações contra o prefeito de São Paulo, Ricardo Nunes (MDB), após ele chamar Fernando Haddad (PT) de 'professorzinho' durante uma convenção do Republicanos. Os parlamentares pediram a retratação do político.", "titulo_pt": "Deputados acionam MP e pedem retratação contra Nunes por chamar Haddad de 'professorzinho'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 85174, "titulo": "PT oficializa candidatura de Lula à Presidência", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/pt-oficializa-candidatura-de-lula-presidencia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-02T18:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) oficializou a candidatura de Luiz Inácio Lula da Silva à Presidência da República, com Geraldo Alckmin do PSB como vice. A chapa será repetida da eleição anterior.", "titulo_pt": "PT oficializa candidatura de Lula à Presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 86061, "titulo": "Brazil’s President Lula, 80, says ‘in great shape’ as he launches bid for a fourth term", "url": "https://www.scmp.com/news/world/americas/article/3362729/brazils-president-lula-80-says-great-shape-he-launches-bid-fourth-term?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-02T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Brasil, Luiz Inácio Lula da Silva, de 80 anos, declarou estar 'em ótima forma' ao lançar sua candidatura para uma quarta eleição. Durante um evento em São Paulo, Lula enfatizou seu vigor físico e boa saúde.", "titulo_pt": "Lula, de 80 anos, diz estar 'em ótima forma' ao lançar campanha para quarto mandato", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 85290, "titulo": "Escala 6x1, voto feminino, brigadas de agitação e ranking de porta-vozes: as estratégias de campanha para reeleição de Lula", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/02/escala-6x1-voto-feminino-brigadas-de-agitacao-e-ranking-de-porta-vozes-as-estrategias-de-campanha-para-reeleicao-de-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-02T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) lançou a candidatura de Luiz Inácio Lula da Silva à presidência e apresentou estratégias para a campanha, incluindo o uso de comitês populares, brigadas de agitação, plataformas digitais e a consolidação do apoio feminino. Além disso, o partido defende um projeto de lei que aboliu a escala 6x1.", "titulo_pt": "Escalas 6x1, voto feminino, brigadas de agitação e ranking de porta-vozes: as estratégias do pt para reeleição de Lula", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 85291, "titulo": "PCB oficializa Carlos Machado como candidato ao governo de SP", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/02/pcb-oficializa-carlos-machado-como-candidato-ao-governo-de-sp.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-02T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PCB oficializou Carlos Machado como candidato a governador de São Paulo e Felipe de Oliveira Queiroz para vice-governador. Petter Maahs da Silva foi indicado para o Senado, mas o partido não lançará candidatos para os cargos de deputado federal e estadual.", "titulo_pt": "PCB oficializa Carlos Machado como candidato ao governo de SP", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 85184, "titulo": "Lula expõe dilemas do legado e da sucessão em discurso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-expoe-dilemas-do-legado-e-da-sucessao-em-discurso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Naquele que pode ser considerado seu último discurso aceitando uma candidatura à Presidência, Lula abordou os desafios de manter a relevância da esquerda brasileira enquanto lida com o legado e a falta de uma sucessão organizada.", "titulo_pt": "Lula expõe dilemas do legado e da sucessão em discurso final", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 85292, "titulo": "'Invenção eleitoral', 'fogo de palha': aliados de Lula diminuem peso de investigações da PF contra Lulinha na campanha presidencial", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/02/aliados-de-lula-diminuem-peso-de-investigacoes-da-pf-contra-lulinha-na-campanha-presidencial.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-02T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do PT minimizaram o impacto das investigações da Polícia Federal contra Fábio Luís Lula da Silva, conhecido como Lulinha, durante a campanha presidencial. Segundo eles, as investigações são consideradas uma 'invenção eleitoral' e um 'fogo de palha'.", "titulo_pt": "Pt minimiza impacto das investigações contra Lulinha na campanha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 85354, "titulo": "Lula critica emendas e fundo partidário: ‘Meu quarto mandato será para mudar’", "url": "https://veja.abril.com.br/politica/lula-critica-emendas-e-fundo-partidario-meu-quarto-mandato-sera-para-mudar/", "fonte_id": "veja", "data_pub": "2026-08-02T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente teve sua candidatura à reeleição confirmada em um evento em São Paulo neste domingo. Lula criticou emendas e fundo partidário, afirmando que seu quarto mandato será para promover mudanças.", "titulo_pt": "Lula critica emendas e fundo partidário: 'meu quarto mandato será para mudar'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 85293, "titulo": "Lula 'quebra protocolo' e convida Janja para discursar em convenção nacional do PT em São Paulo", "url": "https://g1.globo.com/politica/noticia/2026/08/02/lula-quebra-protocolo-e-convida-janja-para-discursar-em-convencao-nacional-do-pt-em-sao-paulo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-02T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula interrompeu a convenção nacional do PT para convidar Janja a discursar, afirmando que havia uma falha na organização ao não incluir uma mulher entre os oradores.", "titulo_pt": "Lula 'quebra protocolo' e convida Janja para discursar em convenção nacional do PT", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 85294, "titulo": "Lula promete 'salto além do básico' se for reeleito e diz que, aos 80 anos, está 'infinitamente melhor'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/02/lula-discursa-convencao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-02T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva, candidato à reeleição pelo PT, discursou na convenção partidária que o oficializou como candidato. l": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/brasil-e-quarto-pais-que-mais-ampliou-turismo-internacional-diz-ocde", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-02T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil foi o quarto país que mais aumentou o número de turistas internacionais entre 2019 e 2025, conforme relatório da OCDE. Durante esse período, o fluxo de visitantes estrangeiros cresceu 46%, passando de 6,3 milhões para 9,3 milhões.", "titulo_pt": "Brasil é quarto país que mais ampliou turismo internacional, segundo OCDE", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 85727, "titulo": "House prices slide across Australia as Middle East conflict and tax changes begin to bite", "url": "https://www.theguardian.com/australia-news/2026/aug/03/house-prices-slide-across-australia-as-middle-east-conflict-and-tax-changes-begin-to-bite", "fonte_id": "guardian_world", "data_pub": "2026-08-02T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços das casas caíram em Brisbane, Adelaide e Perth conforme a baixa no mercado se espalha pela Austrália. De acordo com dados da Cotality divulgados na segunda-feira, os preços médios de casas ao redor do país diminuíram desde maio.", "titulo_pt": "Preços das casas caem em brisbane, adelaide e perth diante da queda no mercado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 85246, "titulo": "Agência analisa licitação contestada e que pode gerar custo bilionário para a Petrobras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/agencia-analisa-licitacao-contestada-e-que-pode-custar-r-700-milhoes-para-a-petrobras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-02T13:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretoria da Antaq deve se reunir para discutir o resultado de u  no EUA incluem aumentos significativos na Europa e Reino Unido, com elevações que podem chegar a 200 euros ou 170 libras esterlinas. O modelo 1TB do Xbox Series X com leitor de discos é um dos afetados por esses aumentos.", "titulo_pt": "Preços do xbox aumentam até 200 euros ou 170 libras na Europa", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 86178, "titulo": "TechCrunch Mobility: Two roads diverged — for robotaxis", "url": "https://techcrunch.com/2026/08/02/techcrunch-mobility-two-roads-diverged-for-robotaxis/", "fonte_id": "techcrunch", "data_pub": "2026-08-02T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O TechCrunch Mobility retorna com foco na futura mobilidade e no papel cada vez mais importante que a inteligência artificial está desempenhando nesse setor. O artigo destaca como diferentes abordagens estão emergindo para os táxis robóticos.", "titulo_pt": "Techcrunch mobilidade: dois caminhos se separaram — para táxis robóticos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 85244, "titulo": "União Europeia reforça regulação de inteligência artificial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/uniao-europeia-reforca-regulacao-de-inteligencia-artificial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-02T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia entrou em vigor, a partir de 2 de fevereiro, novas regras para a regulamentação da inteligência artificial com base na 'AI Act'.", "titulo_pt": "União Europeia fortalece regulação de inteligência artificial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 85438, "titulo": "Opinião: O e-commerce atacado ainda depende do WhatsApp para vender", "url": "https://exame.com/bussola/opiniao-o-e-commerce-atacado-ainda-depende-do-whatsapp-para-vender/", "fonte_id": "exame", "data_pub": "2026-08-02T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comércio atacadista ainda depende do WhatsApp para suas vendas, mesmo que os compradores busquem maior autonomia. As regras comerciais complexas mantêm o setor preso ao atendimento humano no aplicativo.", "titulo_pt": "Opinião: o e-commerce atacadista ainda depende do WhatsApp para vender", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 86147, "titulo": "Is paying artists enough to convince them to embrace AI?", "url": "https://www.theverge.com/ai-artificial-intelligence/974018/pippa-seedance-artist-royalties", "fonte_id": "the_verge", "data_pub": "2026-08-02T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ilustradores vêm alertando há anos sobre as startups de inteligência artificial gerativa que treinam seus modelos usando trabalhos de artistas sem autorização. Eles argumentam que isso é equivalente a roubo, o que levou a disputas legais contenciosas.", "titulo_pt": "Pagar os artistas será suficiente para fazê-los aceitar a IA?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 86254, "titulo": "This Hi-Fi Tape Recorder Changed Radio Forever", "url": "https://spectrum.ieee.org/magnetophon-laugh-track", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-02T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Magnetophon foi um gravador de fita magnética de alta fidelidade desenvolvido pela empresa alemã AEG e apresentado no Berlin Radio Show em 1935. Sua invenção teve origens interessantes, envolvendo engenheiros alemães que buscavam economizar dinheiro e cantores populares como Bing Crosby que desejavam férias.", "titulo_pt": "Este gravador de som de alta fidelidade mudou a rádio para sempre", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 85839, "titulo": "AI's manifesto war", "url": "https://www.axios.com/2026/08/02/ai-manifesto-open-weight-models", "fonte_id": "axios", "data_pub": "2026-08-02T12:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gigantes de inteligência artificial da Vale do Silício estão enviando blueprints competitivos para Washington sobre superinteligência, discutindo se a segurança vem de disseminar ou conter a IA poderosa. Essa disputa influenciará o acesso aos melhores modelos de IA, a competição entre os Estados Unidos e China, e a capacidade do governo em frear corridas em emergências.", "titulo_pt": "Guerra dos manifestos da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 85999, "titulo": "‘Crush this lady’: how eBay harassment campaign led to $56mn payout", "url": "https://www.ft.com/content/06ec1b03-d4af-40cf-b12a-4ba5a410f6d2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um casal de Boston foi vítima de uma campanha de chantagem cibernética envolvendo entregas macabras, que resultou em prisão e um acordo financeiro no valor de 56 milhões de dólares.", "titulo_pt": "‘Quebre esta mulher’: como campanha de chantagem na ebay levou a um pagamento de 56 milhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 85447, "titulo": "Recomendações de investimento avançam com IA, mas assessores esbarram em regulação", "url": "https://exame.com/future-of-money/recomendacoes-de-investimento-avancam-com-ia-mas-assessores-esbarram-em-regulacao/", "fonte_id": "exame", "data_pub": "2026-08-02T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Assessorias e consultorias de investimento no Brasil podem avançar com a adoção de inteligência artificial sem aguardar a regulamentação completa. No entanto, eles enfrentam restrições regulatórias atuais.", "titulo_pt": "Recomendações de investimento com IA avançam no Brasil, mas enfrentam regulação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 86267, "titulo": "How simple amber lights could make nights safer for insects", "url": "https://phys.org/news/2026-07-simple-amber-nights-safer-insects.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 40% das espécies de insetos no mundo estão em declínio e sob ameaça de extinção. Pesquisadores sugerem que a substituição simples de iluminação artificial, como lâmpadas de estaleiro e segurança, poderia reduzir esta ameaça específica.", "titulo_pt": "Como as simples luzes âmbar podem tornar as noites mais seguras para insetos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85561, "titulo": "El Eclipse del Siglo ya tiene fecha: “Será el evento astronómico más fotografiado de la historia”", "url": "https://www.lanacion.com.ar/ciencia/el-eclipse-del-siglo-ya-tiene-fecha-sera-el-evento-astronomico-mas-fotografiado-de-la-historia-nid01082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-02T19:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O eclipse solar total conhecido como o 'Eclipse do Século' ocorrerá em uma data específica e será visível de vários países da África e do Oriente Médio. Este será o evento astronômico mais fotografiado na história.", "titulo_pt": "O Eclipse do século já tem data: ‘será o evento astronômico mais fotografiado da história’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 86268, "titulo": "Climate change could dramatically reduce water flowing from the West's headwaters", "url": "https://phys.org/news/2026-07-climate-west-headwaters.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que os pequenos rios montanhosos que alimentam muitos dos rios do oeste dos Estados Unidos podem enfrentar um futuro mais seco. A base de fluxo das nascentes, que é alimentada por águas subterrâneas, tem diminuído consistentemente desde 1950 e pode reduzir em 45% a 65% até o final do século se as tendências climáticas atuais continuarem.", "titulo_pt": "Mudanças climáticas podem drasticamente reduzir a água nas nascentes do oeste", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85462, "titulo": "Dinossauros foram “assados vivos” após asteroide atingir a Terra", "url": "https://www.cnnbrasil.com.br/ciencia/dinossauros-foram-assados-vivos-apos-asteroide-atingir-a-terra/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T18:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A combinação de radiação térmica com elementos rochosos teria causado calor excessivo e incendiado a superfície terrestre após o impacto do asteroide. Os dinossauros foram 'assados vivos' nesse processo.", "titulo_pt": "Dinossauros foram 'assados vivos' após impacto de asteroide", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 85568, "titulo": "Relámpagos bajo el mar: el fenómeno que orientó a los polinesios y que la ciencia no termina de explicar", "url": "https://www.lanacion.com.ar/ciencia/relampagos-bajo-el-mar-el-fenomeno-que-oriento-a-los-polinesios-y-que-la-ciencia-no-termina-de-nid02082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-02T18:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O te lapa é um relâmpago submarino misterioso que era usado pelos navegantes polinésios para orientação, mas ainda não tem uma explicação científica satisfatória.", "titulo_pt": "Relâmpagos sob a água: o fenômeno que guiava os polinesios e que a ciência ainda não explica", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 86266, "titulo": "STAT+: Michigan Supreme Court ruling allows probe into Lilly insulin pricing", "url": "https://www.statnews.com/pharmalot/2026/08/02/michigan-supreme-court-ruling-allows-probe-into-lilly-insulin-pricing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-02T18:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corte supreme do Michigan permitiu uma investigação sobre os preços cobrados pela Lilly para diferentes produtos de insulina, que foram acusados de serem exageradamente altos e terem forçado alguns pacientes a limitarem ou abandonarem o uso do medicamento.", "titulo_pt": "Julgamento do supremo tribunal de michigan autoriza investigação sobre preços da Lilly para insulinas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 86269, "titulo": "New microscopy method achieves angstrom-scale localization precision with one laser", "url": "https://phys.org/news/2026-07-microscopy-method-angstrom-scale-localization.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da laboratório de Sam Peng, professor adjunto associado de Química na MIT e membro do instituto core do Broad Institute de MIT e Harvard, desenvolveram uma tecnologia de microscopia super-resolução que permite visualizar estruturas moleculares com precisão localização em escala de angströms, muito além dos limites nanométricos da fluorescência convencional, simplificando o processo de imagens.", "titulo_pt": "Novo método de microscopia atinge precisão em escala de angströms com um único laser", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86270, "titulo": "Antibiotic resistance is spreading through South Africa's water systems. This study explains how", "url": "https://phys.org/news/2026-07-antibiotic-resistance-south-africa.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A resistência antimicrobiana está se espalhando pelos sistemas de água na África do Sul, conforme este estudo explica. A resistência antimicrobiana é a capacidade de microorganismos patogênicos sobreviverem a tratamentos como antibióticos.", "titulo_pt": "Resistência antimicrobiana se espalha nos sistemas de água da áfrica do sul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86271, "titulo": "Webb reveals warped structure in nearby TW Hydrae's protoplanetary disk", "url": "https://phys.org/news/2026-07-webb-reveals-warped-nearby-tw.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos usaram a Telescópio Espacial James Webb para obter imagens coronográficas de alta contraste do disco protoplanetário ao redor da jovem estrela TW Hydrae. Os resultados, publicados em 27 de julho no servidor de pré-impressão arXiv, oferecem mais insights sobre a natureza desse disco.", "titulo_pt": "Webb revela estrutura distorcida no disco protoplanetário próximo à estrela TW Hydrae", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86272, "titulo": "Supergene solves evolutionary puzzle of mirror-image flowers", "url": "https://phys.org/news/2026-07-supergene-evolutionary-puzzle-mirror-image.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A assimetria esquerda-direita das liliáceas da África do Sul (gênero Wachendorfia) era considerada um enigma evolutivo há mais de um século. Uma equipe internacional, liderada pela Universidade de Potsdam, descobriu o base molecular que explica essa disposição simétrica nos pétalos.", "titulo_pt": "Supergene ressolve enigma evolutivo das flores espelhadas sul-africanas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86273, "titulo": "Why some nitrogen-processing enzymes are more efficient than others", "url": "https://phys.org/news/2026-07-nitrogen-enzymes-efficient.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos organismos vivos não pode utilizar o gás nitrogênio, que é abundante na atmosfera terrestre. Somente um subconjunto de microrganismos com enzimas conhecidas como nitrogenases são capazes de quebrar o gás nitrogênio e convertê-lo em amônia.", "titulo_pt": "Por que algumas enzimas de processamento de nitrogênio são mais eficientes do que outras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86399, "titulo": "Gears of War: E-Day: Release date, platforms & everything else we know about Marcus Fenix's return", "url": "https://www.space.com/entertainment/space-games/gears-of-war-e-day-release-date-platforms-and-everything-else-we-know-about-marcus-fenixs-return", "fonte_id": "space_com", "data_pub": "2026-08-02T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo Gears of War: E-Day permitirá aos jogadores retornar às origens do universo da série com um pré-sequel que foi desenvolvido do zero.", "titulo_pt": "Gears of War: e-day: data de lançamento, plataformas e tudo o que sabemos sobre a volta de Marcus Fenix", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 86274, "titulo": "Laid to rest with care: Ancient infants, perhaps twins, found in 1,200-year-old latrine", "url": "https://phys.org/news/2026-07-laid-rest-ancient-infants-twins.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi descoberto o corpo de dois bebês, possivelmente gêmeos, há mais de 1.000 anos dentro de um antigo canal sanitário romano. Embora a localização sugira descarte, os bebês parecem ter sido cuidadosamente colocados lá, indicando que foram considerados preciosos.", "titulo_pt": "Descanso com cuidado: bebês antigos, possivelmente gêmeos, encontrados em canal sanitário de 1.200 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85233, "titulo": "Caçadores de mamutes na Era do Gelo atacavam mais as fêmeas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/cacadores-de-mamutes-na-era-do-gelo-atacavam-mais-as-femeas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-02T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista Current Biology mostrou que os caçadores de mamutes-lanosos durante a Era do Gelo preferiam atacar as fêmeas. A pesquisa se baseia em dados genéticos de ossos encontrados em sítios arqueológicos na Polônia, Áustria, República Tcheca, Alemanha e Rússia.", "titulo_pt": "Caçadores de mamutes na Era do Gelo preferiam atacar as fêmeas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 86275, "titulo": "AI use mirrors student schedules in study of 77,000 online learners", "url": "https://phys.org/news/2026-07-ai-mirrors-student-online-learners.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da International University of Applied Sciences analisou os dados de uso anônimos de aproximadamente 77.000 estudantes online que utilizavam o assistente de aprendizagem baseado em AI, o Learning Companion Syntea. O estudo forneceu respostas robustas sobre como os alunos realmente utilizam esses assistentes de aprendizado automatizados.", "titulo_pt": "AI utiliza horários dos estudantes em estudo com 77 mil aprendizes online", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86069, "titulo": "Chinese rocket scientists find ‘most effective’ way to nuke a doomsday asteroid", "url": "https://www.scmp.com/news/china/science/article/3362361/chinese-rocket-scientists-find-most-effective-way-nuke-doomsday-asteroid?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-02T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chinese pesquisadores sugerem que podem ter encontrado a maneira mais eficaz para destruir ou desviar um asteroide ameaçador à Terra, colocando uma bomba nuclear abaixo da superfície do asteroide e detonando-a. O método envolve primeiro atingir o asteroide com um penetrador metálico para criar um buraco profundo, seguido pelo lançamento de uma segunda espaçonave que depositaria a bomba nuclear no buraco.", "titulo_pt": "Cientistas chineses acham forma mais eficaz de destruir ou desviar asteroide apocalíptico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 85209, "titulo": "'Quem Ama Cuida': Não chamo minha mãe de mãe e tenho dificuldade de abraçá-la, diz MC Carol", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/08/quem-ama-cuida-nao-chamo-minha-mae-de-mae-e-tenho-dificuldade-de-abraca-la-diz-mc-carol.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-02T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "MC Carol está feliz por estar no elenco da novela 'Quem Ama Cuida', exibida pela Globo. Ela recebeu vários elogios nas redes sociais por sua atuação na trama.", "titulo_pt": "'Quem Ama Cuida': MC Carol é celebrada no elenco de sucesso", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 85210, "titulo": "Musical '7 Mulheres e um Mistério' ri dos enigmas que fazem a natureza feminina", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/musical-7-mulheres-e-um-misterio-ri-dos-enigmas-que-fazem-a-natureza-feminina.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-02T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O musical '7 Mulheres e um Mistério' se refere à presença feminina no gênero de mistérios, destacando a influência de Agatha Christie na literatura de crime do século XX. A obra aborda tanto detetives brilhantes quanto criminosas calculistas, retratadas em contextos domésticos.", "titulo_pt": "Musical '7 Mulheres e um Mistério' ri dos enigmas que fazem a natureza feminina", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 85211, "titulo": "Como a crítica de tradutora contra 'A Odisseia' de Nolan incendiou um debate", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/como-a-critica-de-tradutora-contra-a-odisseia-de-nolan-incendiou-um-debate.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-02T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crítica de uma das principais tradutoras da obra de Homero ao filme 'A Odisseia', dirigido por Christopher Nolan, gerou um debate. Enquanto o filme se aproxima de US$ 1 bilhão em bilheteria, a crítica destaca que ele é superficial e afasta-se das interpretações clássicas.", "titulo_pt": "Como A crítica de tradutora contra 'A Odisseia' de Nolan incendiou um debate", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 86338, "titulo": "Listen to Tom Waits’ New Spoken-Word Track “The Fly”", "url": "https://pitchfork.com/story/listen-to-tom-waits-new-spoken-word-track-the-fly/", "fonte_id": "pitchfork", "data_pub": "2026-08-02T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É o lado B da colaboração recente entre Tom Waits e Massive Attack, intitulada 'Boots on the Ground'.", "titulo_pt": "Escute a nova faixa de palavras livres do Tom Waits chamada ‘a mosca’", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 86326, "titulo": "New York loft renovation by Studio Vural comprises \"pods in a box\"", "url": "https://www.dezeen.com/2026/08/02/studio-vural-herring-factory-loft-renovation-west-village-new-york/", "fonte_id": "dezeen", "data_pub": "2026-08-02T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estúdio de arquitetura Studio Vural realizou uma reforma em um loft localizado na West Village, Nova York. A reforma incluiu a adição de acordes verdes ao espaço dentro de um edifício de 1920s que anteriormente era uma fábrica de conservas a_de": null, "texto_pt": "Um influenciador conhecido por defender a legalização da cannabis anunciou sua candidatura a deputado federal pelo PSB do Ceará. Ele já recebeu apoio do senador Cid Gomes.", "titulo_pt": "Influenciador que defende legalização da maconha concorre à câmara federal", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 85375, "titulo": "Dono de clínica é denunciado por morte de idosos prensados em elevador", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/dono-de-clinica-e-denunciado-por-morte-de-idosos-prensados-em-elevador", "fonte_id": "metropoles", "data_pub": "2026-08-02T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um proprietário de clínica foi denunciado pelo Ministério Público do Rio Grande do Sul por ser responsável pela morte de idosos que foram prensados em um elevador. O engenheiro que cuidava da manutenção do equipamento também foi alvo de uma denúncia.", "titulo_pt": "Dono de clínica é denunciado por morte de idosos prensados em elevador", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 85626, "titulo": "Angol suspende clases en establecimientos municipales tras afectaciones por sistema frontal", "url": "https://www.latercera.com/nacional/noticia/angol-suspende-clases-en-establecimientos-municipales-tras-afectaciones-por-sistema-frontal/", "fonte_id": "la_tercera", "data_pub": "2026-08-02T17:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A cidade de Angol suspendeu as aulas nas instituições municipais devido às danificações causadas pelo sistema frontal. Segundo o Senapred, 76 pessoas foram afetadas e 25 casas tiveram danos graves.", "titulo_pt": "Angol suspenso aulas em estabelecimentos municipais após impacto do sistema frontal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 85632, "titulo": "Senapred eleva a 461 cifra de damnificados y a 6.183 la de aislados por sistema frontal", "url": "https://www.latercera.com/nacional/noticia/senapred-eleva-a-461-cifra-de-damnificados-y-a-6183-la-de-aislados-por-sistema-frontal/", "fonte_id": "la_tercera", "data_pub": "2026-08-02T15:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred aumentou para 461 o número de pessoas declaradas como desalojadas e elevou para 6.183 a contagem de pessoas isoladas por causa do sistema frontal. A Região de Ñuble tem o maior número de desalojados, enquanto La Araucanía registra o maior percentual de pessoas isoladas. O número de mortes permanece em duas.", "titulo_pt": "Senapred eleva para 461 número de desalojados e para 6.183 a de isolados por sistema frontal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 85726, "titulo": "A record number of First Nations people died in NSW prison custody last year. Advocates fear this year will be worse", "url": "https://www.theguardian.com/australia-news/2026/aug/03/rising-indigenous-deaths-custody-nsw-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-02T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados First Nations alertam para o risco de ultrapassar o recorde de mortes indígenas em custódia prisional no estado da Nova Gales do Sul, após dois homens morrerem recentemente. Matthew Roberts, um homem de 27 anos, com origens nas comunidades Bundjalung, Yaegl e Gamilaroi, faleceu por suicídio durante seu mandato carcerário.", "titulo_pt": "Advogados First Nations temem que este ano ultrapasse o recorde de mortes indígenas em custódia prisional no NSW", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 85962, "titulo": "Israel's genocide has frozen a generation of Gaza's young doctors", "url": "https://www.middleeasteye.net/opinion/israels-genocide-has-frozen-generation-gazas-young-doctors", "fonte_id": "middle_east_eye", "data_pub": "2026-08-02T14:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aos fechamentos de passagens e destruição de hospitais, os jovens médicos de Gaza estão parados na sua formação. Isso pode resultar na falta de especialistas necessários para a reconstrução da área.", "titulo_pt": "Genocídio do israel congelou uma geração de médicos jovens em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 86133, "titulo": "More than 5,200 drug offenders nabbed in H1", "url": "https://en.yna.co.kr/view/AEN20260802001000315", "fonte_id": "yonhap_news", "data_pub": "2026-08-02T02:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 5.200 infratores de drogas foram presos no primeiro semestre do ano.", "titulo_pt": "Mais de 5.200 infratores de drogas capturados no primeiro semestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 85365, "titulo": "Criminosos armados em carro passam atirando e matam três pessoas no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/criminosos-armados-em-carro-passam-atirando-e-matam-tres-pessoas-no-rj", "fonte_id": "metropoles", "data_pub": "2026-08-02T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criminosos armados em um carro efetuaram disparos de arma de fogo e resultaram na morte de três pessoas no estado do Rio de Janeiro. As vítimas, duas homens e uma mulher, ainda não foram identificadas. A Polícia Civil está investigando o caso.", "titulo_pt": "Criminosos armados em carro passam atirando e matam três pessoas no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 85921, "titulo": "Helicopters and firefighters fight fast-moving wildfire near Athens", "url": "http://www.euronews.com/video/2026/08/02/helicopters-and-firefighters-fight-fast-moving-wildfire-near-athens", "fonte_id": "euronews", "data_pub": "2026-08-02T19:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Firefighters e helicópteros lutavam contra um incêndio florestal rápido a oeste de Atenas, enquanto ventos fortes alimentavam as chamas e obrigaram operações de emergência na área.", "titulo_pt": "Caminhões de bombeiros e helicópteros combatem incêndio rápido perto de atenas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 85538, "titulo": "Expertos en climatización coinciden: \"Poner un ventilador de techo tiene un consumo medio de 0,10 € por noche\"", "url": "https://www.clarin.com/estados-unidos/expertos-climatizacion-coinciden-poner-ventilador-techo-consumo-medio-010-noche_0_UKGXW7LpAS.html", "fonte_id": "clarin", "data_pub": "2026-08-02T18:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os especialistas em climatização concordam que o uso de um ventilador de teto durante a noite custa aproximadamente 0,10 euros. Manter o quarto fresco nas noites quentes pode variar significativamente na conta de energia elétrica dependendo do dispositivo escolhido.", "titulo_pt": "Especialistas em climatização concordam: ventilador de teto custa médio de 0,10 euros por noite", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 85731, "titulo": "Two helicopters collide outside Athens as Greece battles to control wildfires", "url": "https://www.theguardian.com/world/2026/aug/02/western-europe-wildfire-crisis-retreats-greece-evacuates-hundreds-athens", "fonte_id": "guardian_world", "data_pub": "2026-08-02T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois helicópteros de combate a incêndios colidiram perto de Atenas, resultando na morte da tripulação de um dos aviões. O incidente ocorreu durante fortes ventos galeanos que empurravam as chamas para os bairros ocidentais da capital grega.", "titulo_pt": "Dois helicópteros colidem perto de atenas em meio às tentativas de controlar incêndios", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 85429, "titulo": "SP Climate Week começa com meta de transformar compromissos em ação rumo à COP31", "url": "https://exame.com/esg/sp-climate-week-comeca-com-meta-de-transformar-compromissos-em-acao-rumo-a-cop31/", "fonte_id": "exame", "data_pub": "2026-08-02T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entre 3 e 7 de agosto, a SP Climate Week apresenta mais de 230 eventos sobre financiamento, cidades resilientes e bioeconomia. O evento inicia na Terra Indígena com a estreia da Climate House.", "titulo_pt": "SP Climate Week começa com meta de transformar compromissos em ação rumo à COP31", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 85989, "titulo": "Heatwave forces nuclear shutdown in Hungary", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/2/08-02-2026-hungary-nuclear-plant-sv?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-02T14:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma onda de calor obrigou a interrupção da operação da maior usina nuclear da Hungria, enquanto os níveis baixos do Danúbio interferem no sistema de resfriamento.", "titulo_pt": "Onda de calor força parada na usina nuclear maior da hungria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 86276, "titulo": "Forever chemicals and pesticides under Trump: what to know", "url": "https://phys.org/news/2026-07-chemicals-pesticides.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o retorno ao poder, a administração do presidente Donald Trump aprovou cinco pesticidas considerados por muitos como químicos 'forever' (PFAS), uma classe de substâncias tóxicas que estão enfrentando proibições e restrições crescentes em todo o mundo.", "titulo_pt": "Químicos permanentes e pesticidas sob Trump: o que saber", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85898, "titulo": "French wildfire near Bordeaux contained as 1,500 firefighters battle separate blaze in Provence", "url": "https://www.lemonde.fr/en/france/article/2026/08/02/french-wildfire-near-bordeaux-contained-as-1-500-firefighters-battle-separate-blaze-in-provence_6756084_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-02T12:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 3 mil bombeiros permaneciam em operação nas duas frentes, apagando focos de calor, cortando faixas de segurança e protegendo áreas de floresta queimada enquanto temperaturas elevadas e vento ameaçavam reacender as chamas.", "titulo_pt": "Incêndio em Bordeaux contido, mas 1,5 mil bombeiros lutam contra outro fogo na Provence", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 85924, "titulo": "At least five dead and 41 missing after an Indonesian ferry caught fire at sea", "url": "http://www.euronews.com/2026/08/02/at-least-five-dead-and-41-missing-after-an-indonesian-ferry-caught-fire-at-sea", "fonte_id": "euronews", "data_pub": "2026-08-02T11:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos cinco pessoas morreram e 41 estão desaparecidas após um ferry indonésio pegar fogo no mar. Segundo a Basarnas, agência nacional de buscas e resgate da Indonésia, 225 passageiros foram resgatados e alguns pularam para o mar para escapar do incêndio.", "titulo_pt": "Pelo menos cinco mortos e 41 desaparecidos após ferry indonésio pegar fogo no mar", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 85249, "titulo": "Como mudanças climáticas e tarifas ajudam a China a criar mais gado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/como-mudancas-climaticas-e-tarifas-ajudam-a-china-a-criar-mais-gado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-02T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tongliao, uma região anteriormente desértica no extremo leste do Deserto de Gobi, se transformou em pastagens férteis e se tornou o centro da crescente indústria pecuária chinesa.", "titulo_pt": "Como mudanças climáticas e tarifas ajudam a China a criar mais gado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 86031, "titulo": "Europe’s key rivers are drying up as extreme heat impact widens", "url": "https://www.japantimes.co.jp/news/2026/08/02/world/europes-rivers-dry-up/", "fonte_id": "japan_times", "data_pub": "2026-08-02T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Níveis nos rios Rhine e Danube diminuíram durante um verão extremamente quente e seco, com períodos repetidos de alta pressão impedindo a recarga das bacias hidrográficas.", "titulo_pt": "Rios-chave da Europa estão secando devido ao impacto do calor extremo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 86042, "titulo": "Fires on more than 100,000 hectares of Washington state prompt evacuations", "url": "https://www.japantimes.co.jp/environment/2026/08/02/fires-washington-state-evacuations/", "fonte_id": "japan_times", "data_pub": "2026-08-02T04:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais atingiram mais de 100 mil hectares do estado de Washington, levando a evacuações. Cerca de 4.000 pessoas estavam lutando contra mais de uma dúzia de incêndios.", "titulo_pt": "Incêndios em mais de 100 mil hectares de Washington causam evacuações", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 85903, "titulo": "Drought causes a 'collapse' in vegetable production: 'Even with irrigation, young plants have not survived'", "url": "https://www.lemonde.fr/en/economy/article/2026/08/02/drought-causes-a-collapse-in-vegetable-production-even-with-irrigation-young-plants-have-not-survived_6756076_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-02T02:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seca está causando uma 'catástrofe' na produção de legumes, com colheitas de couve-flor, ervilha e alface sendo afetadas pela falta d'água e sucessivas ondas de calor. A indústria descreve a situação como um 'desastre', especialmente na França ocidental, onde até mesmo o plantio para as próximas estações está sendo prejudicado.", "titulo_pt": "Seca causa 'catástrofe' na produção de legumes: 'situação é uma desgraça'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 86093, "titulo": "Tibetan activists protest China ethnic unity law at bank", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/03/2003861843", "fonte_id": "taipei_times", "data_pub": "2026-08-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ativistas tibetanos protestaram contra a lei de unidade étnica da China em frente a um banco.", "titulo_pt": "Ativistas tibetanos se manifestam contra lei de unidade étnica da China em frente a um banco", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 85562, "titulo": "“Usted fracasó”: condenan a 15 años de prisión al padre del adolescente que mató a cuatro personas en una escuela", "url": "https://www.lanacion.com.ar/estados-unidos/georgia/usted-fracaso-condenan-a-15-anos-de-prision-al-padre-de-un-adolescente-que-mato-a-cuatro-personas-en-nid02082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-02T19:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Colin Gray foi condenado a 15 anos de prisão por fornecer o armamento utilizado pelo filho em um tiroteio escolar que resultou na morte de quatro pessoas em Georgia.", "titulo_pt": "‘Você falhou’: pai do adolescente acusado de matar quatro pessoas em uma escola é condenado a 15 anos de prisão", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 86063, "titulo": "Death toll from migrant rush into Spain’s Ceuta rises to 72", "url": "https://www.scmp.com/news/world/africa/article/3362727/death-toll-migrant-rush-spains-ceuta-rises-72?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-02T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos no massivo influxo de imigrantes para a cidade espanhola de Ceuta, na África do Norte, subiu para pelo menos 72. Cinco corpos adicionais foram encontrados nas praias de Ceuta. Mais de 50 mil pessoas entraram em Ceuta por terra e mar durante um surto inédito que começou na quinta-feira.", "titulo_pt": "Óbitos no rush migratório para Ceuta atingem 72", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 85502, "titulo": "Condenados à morte na Arábia Saudita ligam para a BBC pedindo ajuda", "url": "https://www.bbc.com/portuguese/articles/cj36lkkvmgko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-02T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dezenas de etíopes condenados à morte na Arábia Saudita, acusados de tráfico de drogas e fugidos da guerra e da pobreza em seu país, ligaram para a BBC pedindo ajuda.", "titulo_pt": "Condenados à morte na Arábia Saudita ligam para a BBC pedindo ajuda", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 85986, "titulo": "Israeli settlers shoot Palestinian child during farm raid", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/2/israeli-settlers-shoot-palestinian-child-during-farm-raid?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-02T15:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vídeo da CCTV registrou o momento em que um menino palestino de nove anos foi baleado no lado esquerdo durante uma operação agrícola realizada por setentristas israelenses.", "titulo_pt": "Setentristas israelenses atiram em criança palestiniana durante operação agrícola", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 85505, "titulo": "Adolescentes recrutados para matar: como rede criminosa transforma jovens em assassinos d
