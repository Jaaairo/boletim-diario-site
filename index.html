has.", "titulo_pt": "Tartarugas resgatadas retornam à casa após estado cortar fluxo d'água na área", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 211326, "titulo": "Paris’s oldest covered food market gutted by major overnight fire", "url": "https://www.euronews.com/video/2026/10/12/pariss-oldest-covered-food-market-gutted-by-major-overnight-fire", "fonte_id": "euronews", "data_pub": "2026-10-12T13:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu o mercado coberto mais antigo de Paris, localizado no bairro do Marais, deixando os comerciantes desolados. A investigação está em andamento e o mercado pode permanecer fechado por meses.", "titulo_pt": "Incêndio destrói mercado coberto mais antigo de paris", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 211329, "titulo": "Video shows major fire ravaging 400-year-old Paris food market", "url": "https://www.euronews.com/2026/10/12/video-shows-major-fire-ravaging-400-year-old-paris-food-market", "fonte_id": "euronews", "data_pub": "2026-10-12T12:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma grande chama noturna destruiu o mercado coberto de alimentos mais antigo de Paris, que tem 400 anos de história. As imagens mostram o estado destruído do local após o incêndio.", "titulo_pt": "Vídeo mostra incêndio devastador no mercado de alimentos mais antigo de Paris, com 400 anos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 211330, "titulo": "Citroën revives its classic 2CV with a new electric concept", "url": "https://www.euronews.com/2026/10/12/citroen-revives-its-classic-2cv-with-a-new-electric-concept", "fonte_id": "euronews", "data_pub": "2026-10-12T11:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Citroën apresentou um conceito elétrico inspirado na icônica 2CV, planejando trazer o modelo clássico de volta às estradas nos próximos dois anos. O veículo compacto une o design retrô com tecnologia elétrica moderna, com preços esperados a partir de cerca de R$ 150 mil.", "titulo_pt": "Citroën renova sua icônica 2CV com um novo conceito elétrico", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 210157, "titulo": "Enchente e deslizamento no Nepal deixam mais de 100 estrangeiros ilhados", "url": "https://www.metropoles.com/mundo/enchente-e-deslizamento-no-nepal-deixam-mais-de-100-estrangeiros-ilhados", "fonte_id": "metropoles", "data_pub": "2026-10-12T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de socorro no Nepal resgataram 96 pessoas, das quais nove eram estrangeiras, e autoridades pediram a evacuação de áreas de risco devido a enchente e deslizamento de terra. Até o momento, mais de 100 estrangeiros estão ilhados.", "titulo_pt": "Enchente e deslizamento deixam mais de 100 estrangeiros ilhados no Nepal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210472, "titulo": "Tens of thousands march in Brussels demanding urgent climate action", "url": "https://www.euronews.com/video/2026/10/12/tens-of-thousands-march-in-brussels-demanding-urgent-climate-action", "fonte_id": "euronews", "data_pub": "2026-10-12T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de milhares de pessoas marcharam por Bruxelas no domingo, 11 de outubro, exigindo ações mais rápidas sobre o clima antes da COP31, que ocorrerá em Antalya, Turquia, no mês seguinte.", "titulo_pt": "Centenas de milhares marcham em bruxelas exigindo ação climática urgente", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 210215, "titulo": "O que sabemos sobre incêndios que atingem mais de 30 cidades do Amazonas", "url": "https://www.cnnbrasil.com.br/nacional/norte/am/o-que-sabemos-sobre-incendios-que-atingem-mais-de-30-cidades-do-amazonas/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T07:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Amazonas registrou um aumento de 271% nos focos de incêndio nos dez primeiros dias de outubro de 2025, com 1.380 ocorrências registradas, contra 372 no mesmo período do ano anterior.", "titulo_pt": "O que sabemos sobre incêndios que atingem mais de 30 cidades do Amazonas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210593, "titulo": "Singapore tops global air pollution ranks again, rolls out haze subsidies", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3370563/singapore-tops-global-air-pollution-ranks-again-rolls-out-haze-subsidies?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Singapura foi novamente classificada como a cidade mais poluída do mundo de acordo com o monitor de qualidade do ar da Suíça, IQAir, devido às fogueiras nas ilhas de Borneo e Sumatra, intensificadas pelo fenômeno El Niño. A cidade fez subsídios para tratamentos médicos relacionados à névoa tóxica e fechou algumas escolas em áreas vizinhas da Malásia, enquanto ambos os países lidam com a qualidade do ar persistente e insaudável devido aos incêndios na Indonésia.", "titulo_pt": "Singapura é novamente a cidade mais poluída do mundo por causa da névoa tóxica", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210175, "titulo": "Brasil sob extremos: chuvas de até 300 mm e inundações ameaçam o Centro-Sul", "url": "https://www.metropoles.com/brasil/brasil-sob-extremos-chuvas-de-ate-300-mm-e-inundacoes-ameacam-o-centro-sul", "fonte_id": "metropoles", "data_pub": "2026-10-12T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As áreas de instabilidade se estendem por pelo menos cinco estados do Centro-Sul do Brasil nos próximos 10 dias, levando a chuvas intensas e inundações.", "titulo_pt": "Brasil sob extremos: chuvas de até 300 mm e inundações ameaçam o Centro-Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210561, "titulo": "Five people missing after Nepal flash floods sweep away houses", "url": "https://www.japantimes.co.jp/news/2026/10/12/asia-pacific/nepal-new-flash-floods/", "fonte_id": "japan_times", "data_pub": "2026-10-12T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns 45 casas foram levadas pelas águas, além de três projetos hidrelétricos e quatro pontes que sofreram danos. Cinco pessoas estão desaparecidas após inundações repentinas em Nepal.", "titulo_pt": "Cinco pessoas desaparecidas após inundações em Nepal arruinar casas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 211529, "titulo": "Woman in her 20s dies after collapsing during Seoul Race half-marathon", "url": "https://www.koreaherald.com/article/10900181", "fonte_id": "korea_herald", "data_pub": "2026-10-12T13:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de vinte e poucos anos morreu após cair próximo ao final da linha de chegada durante a metade da maratona Seoul Race em 2026. Ela recebeu atendimento cardíopulmonar de ressuscitação no local, mas não recuperou a consciência e faleceu em um hospital próximo.", "titulo_pt": "Mulher de vinte e poucos anos morre após cair durante metade da maratona Seoul Race", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 211530, "titulo": "Rights watchdog scraps recommendation on Yoon's right to defense, plans apology", "url": "https://www.koreaherald.com/article/10900178", "fonte_id": "korea_herald", "data_pub": "2026-10-12T13:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselho nacional de direitos humanos da Coreia decidiu revogar sua recomendação anterior sobre a garantia do direito de defesa do ex-presidente Yoon Suk Yeol durante seu julgamento de impeachment no Tribunal Constitucional. O conselho também aprovou uma proposta de publicar uma compensação por ter emitido a recomendação. O presidente do conselho, Ahn Chang-ho, absteve-se do voto, pois foi nomeado por Yoon.", "titulo_pt": "Órgão de direitos humanos revoga recomendação sobre direito de defesa de Yoon e planeja compensação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 211524, "titulo": "Rights watchdog to offer public apology over recommendation on Yoon's right to defense", "url": "https://en.yna.co.kr/view/AEN20261012009300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T11:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instituição responsável pelos direitos humanos do estado decidiu oferecer uma compensação pública devido a uma recomendação sobre o direito de defesa de Yoon.", "titulo_pt": "Órgão de direitos humanos vai oferecer compensação pública por recomendação sobre direito de defesa de Yoon", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210142, "titulo": "Por que pena de morte persiste nos Estados Unidos? Americanos apoiam", "url": "https://veja.abril.com.br/coluna/mundialista/por-que-pena-de-morte-persiste-nos-estados-unidos-americanos-apoiam/", "fonte_id": "veja", "data_pub": "2026-10-12T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os casos de Christa Pike e Nidal Hasan têm agitado a discussão sobre a pena de morte nos Estados Unidos, mas a maioria da população ainda apoia essa prática.", "titulo_pt": "Por que a pena de morte persiste nos Estados Unidos? Americanos apoiam", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 210551, "titulo": "UNRWA warns Gaza is becoming an increasingly unlivable place", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/unrwa-health-chief-gaza/", "fonte_id": "japan_times", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O UNRWA alerta que Gaza enfrenta persistentes escassezes de suprimentos médicos devido a restrições nas entregas. As condições de higiene também permanecem ruins.", "titulo_pt": "UNRWA avisa que Gaza está se tornando um lugar cada vez menos habitável", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 210704, "titulo": "Statement by Etleva Kadilli, UNICEF Regional Director for Eastern and Southern Africa, on the tragic loss of lives, including at least 15 children, after migrant boat capsized off the coast of Djibouti", "url": "https://www.unicef.org/press-releases/statement-etleva-kadilli-unicef-regional-director-eastern-and-southern-africa-tragic", "fonte_id": "unicef", "data_pub": "2026-10-12T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora regional da UNICEF para a África Oriental e do Sul do África, Etleva Kadilli, emitiu uma declaração sobre a tragédia da capotagem de uma embarcação de migrantes perto da costa do Djibouti, que resultou em pelo menos 15 mortes, incluindo crianças.", "titulo_pt": "Declaração da diretora Regional da UNICEF para a áfrica oriental e do sul do áfrica sobre a tragédia marítima que resultou em pelo menos 15 mortes, incluindo crianças, perto da costa do Djibouti", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 210473, "titulo": "Opposition figures and journalists allege police abuses during India protests", "url": "https://www.euronews.com/2026/10/12/opposition-figures-and-journalists-allege-police-abuses-during-india-protests", "fonte_id": "euronews", "data_pub": "2026-10-12T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Figuras da oposição e jornalistas acusam a polícia de abusos durante protestos em India. Os protestos foram iniciados por acusações de manipulação de listas eleitorais durante uma revisão nacional que os críticos alegam beneficiar o Partido Bharatiya Janata, do primeiro-ministro Narendra Modi.", "titulo_pt": "Figuras da oposição e jornalistas acusam abusos policiais durante protestos em India", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 210617, "titulo": "‘Bring an interpreter’: Migrant workers struggle to seek justice", "url": "https://www.koreaherald.com/article/10899819", "fonte_id": "korea_herald", "data_pub": "2026-10-12T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Migrantes enfrentam dificuldades por causa de barreiras linguísticas em escritórios de trabalho, impedindo-os de apresentar reclamações ou acompanhar seus casos. Alguns trabalhadores aguardam anos para receber respostas.", "titulo_pt": "Leve um intérprete: trabalhadores migrantes lutam para buscar justiça", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 210603, "titulo": "‘Just a little spark’: disability advocate on inclusion, belonging in Hong Kong", "url": "https://www.scmp.com/news/hong-kong/society/article/3370532/just-little-spark-disability-advocate-inclusion-belonging-hong-kong?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T03:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Faride Shroff, uma advogada de pessoas com deficiência, afirma que a maior conscientização sobre deficiência em Hong Kong não necessariamente facilitou o emprego para pessoas com deficiência. Ela destaca que orçamentos corporativos mais apertados e um mercado de trabalho difícil tornam a inclusão adicional mais desafiadora.", "titulo_pt": "Apenas um pequeno fósforo: defensora de pessoas com deficiência sobre inclusão e pertencimento em Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210429, "titulo": "'We are still in the Middle Ages': Women on sexual violence in e-sports", "url": "https://www.lemonde.fr/en/pixels/article/2026/10/12/we-are-still-in-the-middle-ages-women-on-sexual-violence-in-e-sports_6758495_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-12T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma streamer e comentadora famosa de League of Legends foi acusada de estupro em julho. O caso ilustra o problema de violência sexual no e-sports, um setor dominado por homens em que as vozes das mulheres frequentemente são ignoradas.", "titulo_pt": "Somos ainda da idade média: mulheres sobre violência sexual no e-sports", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 210571, "titulo": "Anti-sexual assault certification set for Japan’s cram schools", "url": "https://www.japantimes.co.jp/news/2026/10/12/japan/society/cram-schools-anti-sexual-assault-certification/", "fonte_id": "japan_times", "data_pub": "2026-10-12T02:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As escolas de preparação para exames no Japão estão prestes a implementar um certificado contra assédio sexual. A medida será lançada no dia 25 de dezembro, em uma versão adaptada do Serviço de Declaração e Exclusão do Reino Unido.", "titulo_pt": "Certificado contra assédio sexual para escolas de preparação no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 211421, "fonte_id": "taipei_times", "titulo": "Six of new F-16s complete factory test", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/13/2003865857", "data_pub": "2026-10-13T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Seis novos F-16 concluem testes de fábrica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 211426, "fonte_id": "taipei_times", "titulo": "Taiwan closely monitoring China drills", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/13/2003865868", "data_pub": "2026-10-13T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Taiwan monitora de perto exercícios militares da China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 211440, "fonte_id": "taipei_times", "titulo": "Let culture bloom", "url": "https://www.taipeitimes.com/News/taiwan/archives/2 const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
