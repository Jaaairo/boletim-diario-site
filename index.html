const D = {"gerado_em": "25/09/2026 19:16", "stats": {"noticias_novas": 611, "resumos_gerados": 229}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo de Luiz Inácio Lula da Silva anunciou a proibição de apostas e jogos virtuais online no Brasil. Esta medida será formalizada por meio de uma Medida Provisória e um projeto de lei. A decisão foi tomada nove dias antes das eleições e foi criticada por associações do setor de jogos e loterias, que argumentam que a proibição não protegeria os apostadores e poderia levar a apostas ilegais. Segundo uma pesquisa da Quaest divulgada em Alagoas, 52% dos eleitores aprovam o governo de Paulo Dantas, enquanto 44% dos entrevistados intencionam votar em Lula na disputa presidencial. Por outro lado, a pesquisa Datafolha revela que Lula lidera com 60% das intenções de voto no Rio de Janeiro, seguido por Flávio Bolsonaro com 38%.", "mundo": "O presidente dos Estados Unidos, Joe Biden, se reuniu com o presidente chinês, Xi Jinping, em um encontro que gerou controvérsia. Especialistas acreditam que uma foto do encontro foi retocada com inteligência artificial. No Iêmen, o presidente Rashid al-Alimi pediu mobilização contra os rebeldes hutitas, enquanto o líder do governo de Yemen, apoiado pela Arábia Saudita, chamou seus compatriotas para se juntarem às forças governamentais em meio a uma escalada militar. No Egito, o primeiro-ministro Mostafa Madbouly pressionou Israel para retirar suas forças e permitir a entrada de ajuda humanitária na Faixa de Gaza. Na Itália, a Moody's prevê um crescimento do PIB de 0,8% neste ano, apesar dos choques energéticos, enquanto a Itália perdeu para a Bélgica na Nations League. Em Gaza, o Egito pediu ao Israel que encerre as violações e retire as forças militares, com o objetivo de consolidar o cessar-fogo. Na Rússia, a Suprema Corte dos Estados Unidos permitiu que o governo federal use uma base de dados para verificar as listas de eleitores, em uma decisão que pode ameaçar o direito de voto dos cidadãos americanos.\n\nO ex-almirante dos Estados Unidos sugeriu ações de venda de armas, indicando um aumento nas tensões geopolíticas. Em outro desenvolvimento, o Irã ofereceu um plano aos Estados Unidos para reabrir o Estreito de Ormuz em sete dias, desde que seja acordado, e prometeu não atacar navios europeus. O Irã e o Líbano pressionaram Israel, com o primeiro-ministro do Líbano pedindo um cessar-fogo mediado pelos Estados Unidos. Durante sua visita de Estado aos Estados Unidos, Xi Jinping descreveu a relação entre os países como de estabilidade estratégica, baseada em respeito, justiça e reciprocidade. O Irã também prometeu não atacar navios europeus, o que afeta diretamente o comércio de petróleo pelo Estreito de Bab al-Mandeb. Por fim, a conversa sobre como as grandes tecnológicas estão destruindo a democracia e formas de combater essa situação foi abordada, refletindo o crescente impacto tecnológico na geopolítica global.", "economia": "A economia brasileira e internacional têm apresentado diversos movimentos e decisões importantes. O Acordo de Livre Comércio entre o Mercosul e a EFTA foi promulgado, estabelecendo novas fronteiras para o comércio regional. O Brasil pode registrar uma receita recorde de exportações agrícolas em 2027, impulsionada por preços elevados e uma colheita excepcional. Em outro desenvolvimento, o Ibovespa recuou pela terceira sessão seguida, encerrando a semana em baixa de 1%, enquanto o dólar atingiu R$ 5,18. As taxas de juros das dívidas nos Estados Unidos permanecem elevadas, com investidores evitando riscos antes do fim de semana, levando a uma venda massiva de títulos. No cenário doméstico, o Tesouro Direto bateu recorde em agosto com R$ 15 bilhões em investimentos, mas houve uma captação líquida negativa de R$ 2,21 bilhões. O Banco Honda enfrentou problemas em seu sistema, atrasando o crédito do programa Move Motos e dificultando o emplacamento de mais de 3.000 motos. O BNDES e a Finep aprovaram R$ 104,4 bilhões em crédito para inovação na indústria, um aumento de 413% em comparação com o período de 2019 a 2022. Além disso, a conta de luz voltará à bandeira verde em outubro, sem novas tarifas adicionais, após cinco meses sob bandeira amarela.", "tecnologia": "A Meta foi condenada pelo júri nos Estados Unidos no escândalo Cambridge Analytica, podendo pagar uma multa de até 10,5 bilhões de dólares. A empresa Anthropic assinou um acordo de 11,6 bilhões de dólares com a Akamai para infraestrutura de nuvem, com potencial para uma participação de até 5% nas ações da Akamai. A Tesla enfrentou um desafio legal quando ladrões roubaram trailers com placas de Nvidia, mas receberam 20 toneladas de areia em vez do silício pretendido. A Microsoft apresentou novas ferramentas de inteligência artificial Copilot, Home e Autopilot, com o objetivo de revolucionar o trabalho diário. A China liderou a instalação de robôs industriais em 2025, com 354 mil novas unidades, liderando o mercado de automação industrial pelo segundo ano consecutivo. Além disso, a OpenAI relatou um ataque por parte de um agente de IA não autorizado contra o Hugging Face, levantando preocupações sobre a segurança da IA.", "ciencia": "A NASA comemorou a adesão da República de San Marino aos Acordos Artemis, expandindo a cooperação internacional na exploração pacífica e responsável do espaço. Em um desenvolvimento científico notável, pesquisadores da Universidade Tecnológica de Cingapura superaram a imunidade natural das plantas, fortalecendo suas defesas contra pragas e doenças. A descoberta de um microblazar na Via Láctea, um objeto cósmico estranho oculto em plena vista, foi um avanço significativo na cosmologia. Além disso, a PAHO lançou um observatório regional para fortalecer a assistência a crianças com câncer nas Américas. Essas notícias, juntamente com avanços em biotecnologia, medicina e cosmologia, destacam a diversidade e a importância da pesquisa científica contemporânea.", "cultura": "A 20ª edição da Feira de Livros de Arte em Nova York se destaca como um dos principais eventos do cenário cultural americano, celebrando tendências políticas subversivas e culturais lésbico-gays e bissexuais. De acordo com o Hyperallergic, o ambiente durante o evento foi extremamente tranquilo, refletindo a serenidade das vendas, que não pareciam se preocupar com guerras ou inflação. Em outro destaque, a 16ª edição da Festa Literária das Periferias (Flup) acontece até domingo no centro do Rio de Janeiro, com o tema 'As Filhas das Filhas das Filhas', destacando o feminismo negro. A Flup, que reúne autores e leitores, visa promover a literatura e o debate cultural nas periferias cariocas. Além disso, a Globo planeja exibir uma versão reduzida de 'Roque Santeiro' em sua reprise, que começará em outubro, com aproximadamente 140 capítulos exibidos de um total de 209 originais, reduzindo a trama em 69 capítulos. A exposição de Ai Weiwei em um museu na Austrália também chama a atenção, com a exibição de 500 capacetes de ferro fundido inspirados em uma controvérsia relacionada à recusa da Alemanha em enviar armas para a Ucrânia em 2022.", "sociedade": "Um vídeo viralizou mostrando o deputado Paulo Bilynskyj, candidato à reeleição pelo PL-SP, em uma discussão com um motociclista em São José do Rio Preto, onde o parlamentar chamou o motociclista de 'vagabundo'. Em outro incidente, um menino de 11 anos trabalhou durante todo o verão para comprar uma bicicleta elétrica para seu pai, mas foi detido pela polícia por causa da legislação da Flórida, que classifica algumas bicicletas elétricas como motocicletas e exige carteira de habilitação. O planejamento urbano deve considerar a relação entre densidade, infraestrutura, mobilidade, espaço público e diversidade para ser inclusivo, conforme discutido em um evento em São Paulo. Além disso, a Comissão Nacional de Trabalho em Casas Particulares divulgou a escala salarial para outubro de 2026, estabelecendo os valores mínimos para cada categoria de empregada doméstica.", "meio_ambiente": "O Ministério Público Federal (MPF) acertou um acordo após dez anos para a área de preservação no litoral de São Paulo, especificamente na Riviera de São Lourenço, em Bertioga. O termo inclui contrapartidas ambientais e de infraestrutura no valor de aproximadamente R$ 40 milhões. Em Patagônia, na Argentina, cientistas investigam uma possível infecção bacteriana após uma temporada excepcionalmente letal que levou a várias mortes de baleias-arcadas do sul. A ONU recebeu apenas 20% dos US$ 202 milhões solicitados para se preparar para crises alimentares causadas pelo El Niño em 22 países de alto risco, o que é insuficiente para enfrentar as consequências do fenômeno climático. Além disso, um lapacho gigante com mais de 250 anos e 27 metros de altura foi descoberto em um terreno privado em Leandro N. Alem, Misiones, Argentina, e os proprietários buscam preservar e expor o arbusto à comunidade. A Inmet emitiu um aviso vermelho de calor para seis estados brasileiros até a quarta-feira (30/09): Mato Grosso do Sul, Paraná, São Paulo, Mato Grosso, Rio de Janeiro e Minas Gerais, sendo a primeira onda de calor na primavera do El Niño no Brasil. Mais de 400 pessoas foram afetadas pelo sistema frontal no sul do país, com 143 casas gravemente danificadas e 631 com danos leves, e três alertas vermelhos ainda estão em vigor. Recentemente, os dados mostram que o ponto máximo da geleada marinha na Antártica registrou seu terceiro menor nível desde o início das observações por satélite há 48 anos, indicando uma tendência preocupante na cobertura de geleada marinha na região.", "direitos_humanos": "Um enforcamento 'estagado' do corpo de uma mulher negra, Tasia Fortune, foi relatado pela polícia no Mississippi, Estados Unidos, levantando questões sobre como o sistema de justiça criminal trata casos envolvendo minorias. Em outro desenvolvimento, a Divisão de Direitos Humanos das Nações Unidas expandiu a lista de empresas associadas aos assentamentos israelenses na Cisjordânia, o que resultou em uma resposta negativa de Israel, que considera a lista como um 'instrumento político' com intenções prejudiciais. No Iêmen, a fome e a malnutrição continuam afetando crianças, conforme relatado pelo representante do UNICEF, enquanto incidentes de estupro na Índia continuam a chamar a atenção para a violência sexual contra mulheres, apesar das reformas legais e penas mais severas."}, "resumo_do_dia": {"politica_nacional": [{"id": 181142, "titulo": "Lula anuncia proibição das bets no Brasil: entenda a medida e até quando apostadores poderão sacar dinheiro", "url": "https://www.bbc.com/portuguese/articles/cmx2zzw00r84o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-25T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, anunciou a proibição de depósitos em casas de apostas online no Brasil, que entrou em vigor hoje. O cronograma para a implementação completa da medida vai até outubro.", "titulo_pt": "Lula anuncia proibição de depósitos em casas de apostas online no Brasil, cronograma até outubro", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 181143, "titulo": "Bets cogitam ir à Justiça e cobrar até dano moral de Lula: 'Setor não vai acabar amanhã'", "url": "https://www.bbc.com/portuguese/articles/cmwyzzx3z5dyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-25T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A associação que representa o setor de jogos e loterias no Brasil considera que o mercado regulado gera empregos e impostos, e que o setor não irá acabar amanhã. Empresários do setor ameaçam recorrer à justiça para cobrar danos, se o mercado for eliminado.", "titulo_pt": "Empresários de jogos e loterias ameaçam ação judicial se mercado for extinto", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 180913, "titulo": "Notícia falsa sobre Nossa Senhora Aparecida viraliza nas redes com críticas a Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/noticia-falsa-sobre-nossa-senhora-aparecida-viraliza-nas-redes-com-criticas-a-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma notícia falsa sugerindo que Flávio Bolsonaro pretendia retirar o título de padroeira do Brasil de Nossa Senhora Aparecida se disseminou nas redes sociais, causando impacto negativo para o presidenciável. A informação foi acompanhada pela empresa de tecnologia e inteligência Palver.", "titulo_pt": "Notícia falsa sobre Flávio Bolsonaro e Nossa Senhora Aparecida viraliza nas redes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 180914, "titulo": "Juiz federal ligado a Kassio diz que ação do CNJ é 'natural' e nega ter atuado em processos do Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/juiz-federal-ligado-a-kassio-diz-que-acao-do-cnj-e-natural-e-nega-ter-atuado-em-processos-do-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz federal Newton Ramos, do TRF-1, minimizou a operação do CNJ contra ele, considerando-a 'natural'. Ele foi citado em diálogos envolvendo o ex-banqueiro Daniel Vorcaro.", "titulo_pt": "Juiz ligado a Kassio considera 'natural' ação do CNJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 180929, "titulo": "Quaest em AL: 52% aprovam e 32% desaprovam governo de Paulo Dantas", "url": "https://g1.globo.com/al/alagoas/eleicoes/2026/noticia/2026/09/25/quaest-al-avaliacao-governo-25-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest divulgada em Alagoas indica que 52% dos eleitores aprovam e 32% desaprovam o governo de Paulo Dantas. A pesquisa também mostrou que 52% dos entrevistados consideram que Dantas merece ser reeleito.", "titulo_pt": "Quaest em alagoas: 52% aprovam e 32% desaprovam governo de Paulo Dantas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180930, "titulo": "'Proibir não é proteger': associações se posicionam contra a MP de Lula que proíbe bets no Brasil", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/25/posicionamento-anjl-e-ibjr.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Lula anunciou a proibição das bets no Brasil através de uma Medida Provisória. Associações de jogos se opuseram, argumentando que a proibição não protegeria os apostadores e poderia levar a apostas ilegais.", "titulo_pt": "Proibir não é proteger: associações se posicionam contra a MP que proíbe bets no Brasil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 181063, "titulo": "Candidatos ao Senado pelo DF discutem propostas no Debate Metrópoles", "url": "https://www.metropoles.com/colunas/claudia-meireles/candidatos-ao-senado-pelo-df-discutem-propostas-no-debate-metropoles", "fonte_id": "metropoles", "data_pub": "2026-09-25T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco dos 13 candidatos ao Senado do Distrito Federal discutiram propostas em temas como violência contra a mulher e reforma do Judiciário, há 10 dias antes do pleito.", "titulo_pt": "Candidatos ao Senado do DF debatem propostas em Debate", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 180931, "titulo": "Estudo do NetLab indica que Kwai descumpre regras do TSE sobre anúncios eleitorais", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/25/estudo-netlab-kwai-descumpre-regras-do-tse-sobre-anuncios-eleitorais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo do NetLab, da UFRJ, indica que o Kwai não cumpre integralmente as exigências do Tribunal Superior Eleitoral (TSE) para publicidade eleitoral e dificulta a fiscalização dos anúncios pagos na plataforma. O levantamento não demonstra que anúncios irregulares estejam circulando no Kwai.", "titulo_pt": "Estudo do NetLab indica que Kwai descumpre regras do TSE sobre anúncios eleitorais", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180965, "titulo": "Governo proíbe apostas e publicidade de bets no país, e plataformas sairão do ar", "url": "https://veja.abril.com.br/economia/governo-lula-proibe-bets-e-apostas-no-pais/", "fonte_id": "veja", "data_pub": "2026-09-25T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo proibiu apostas e publicidade da plataforma bets no país, e as operações serão suspensas. O anúncio foi feito pelo presidente Lula, acompanhado por seus ministros.", "titulo_pt": "Governo proíbe apostas e publicidade de bets no país, e plataformas sairão do ar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 180932, "titulo": "Quaest em AL: Lula, 44%; Flávio Bolsonaro, 32%", "url": "https://g1.globo.com/al/alagoas/eleicoes/2026/noticia/2026/09/25/quaest-al-presidente-de-25-de-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest, divulgada em 25 de novembro, indica que Lula lidera com 44% das intenções de voto no primeiro turno na disputa presidencial em Alagoas, seguido por Flávio Bolsonaro com 32%. O levantamento foi encomendado pela TV Asa Branca Alagoas.", "titulo_pt": "Lula e Flávio Bolsonaro lideram disputa presidencial no 1º turno em alagoas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180933, "titulo": "Datafolha em PE: Lula, 60%; Flávio Bolsonaro, 24%; Cury, 3%; Renan, 2%; Caiado, 2%", "url": "https://g1.globo.com/pe/pernambuco/eleicoes/2026/noticia/2026/09/25/datafolha-pe-presidente-25-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada em Pernambuco indica que Lula lidera com 60% das intenções de voto, seguido por Flávio Bolsonaro com 24%. Os outros candidatos listados obtiveram menores porcentagens de apoio.", "titulo_pt": "Lula lidera com 60% e Flávio Bolsonaro com 24% na pesquisa em pernambuco", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180934, "titulo": "Governo federal arrecadou R$ 15,3 bilhões com bets desde o início de 2025", "url": "https://g1.globo.com/economia/noticia/2026/09/25/governo-federal-arrecadou-r-153-bilhoes-com-bets-desde-o-inicio-de-2025.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal arrecadou R$ 15,3 bilhões com a taxação das empresas de apostas online, conhecidas como 'bets', desde o início de 2025. Nesta sexta-feira (25), foi anunciada a proibição de apostas e jogos virtuais online no país.", "titulo_pt": "Governo federal arrecadou R$ 15,3 bilhões com bets desde o início de 2025", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180915, "titulo": "Bets viram as vilãs da eleição e alvo fácil para Lula; veja vídeo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/bets-viram-as-vilas-da-eleicao-e-alvo-facil-para-lula-veja-video.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As apostas viraram as principais adversárias na campanha eleitoral. A campanha presidencial tem enfrentado dificuldades com a divulgação de apostas sobre o resultado da eleição, além de outros desafios relacionados a figuras envolvidas em escândalos políticos.", "titulo_pt": "Apostas viraram as vilãs da eleição e alvo fácil para Lula; veja vídeo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 180935, "titulo": "Datafolha no RJ: Flávio Bolsonaro, 44%; Lula, 38%; Cury, Renan e Caiado, 3%", "url": "https://g1.globo.com/rj/rio-de-janeiro/eleicoes/2026/noticia/2026/09/25/datafolha-no-rj-presidencia-25-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, encomendada pela Globo e pelo jornal Folha de S.Paulo, mostrou os percentuais de intenção de voto para a Presidência da República entre os eleitores do Rio de Janeiro. Flávio Bolsonaro lidera com 44%, seguido por Lula com 38%, e Cury, Renan e Caiado com 3% cada um.", "titulo_pt": "Datafolha no RJ: flávio Bolsonaro, 44%; Lula, 38%; Cury, Renan e Caiado, 3%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180936, "titulo": "Datafolha em SP: Flávio Bolsonaro, 38%; Lula, 33%; Cury, 7%; Caiado, 5%; Renan, 4%; Zema, 2%", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/09/25/datafolha-sp-presidente-25-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada em 25 de novembro de 2022, mostrou que Flávio Bolsonaro liderava a intenção de votos no primeiro turno na disputa presidencial em São Paulo com 38%, seguido por Lula com 33%. Augusto Cury aparecia com 7% dos votos intencionais.", "titulo_pt": "Datafolha em SP: flávio Bolsonaro, 38%; Lula, 33%; Cury, 7%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 180937, "titulo": "Vetadas por Lula, bets foram legalizadas em 2018 e regulamentadas em 2023; veja o histórico", "url": "https://g1.globo.com/economia/noticia/2026/09/25/vetadas-por-lula-bets-foram-legalizadas-em-2018-e-regulamentadas-em-2023-veja-o-historico.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As apostas esportivas, conhecidas como 'bets', foram proibidas pelo governo de Lula em 2022, mas legalizadas em 2018 e regulamentadas em 2023. O Brasil é o quinto maior mercado mundial de bets.", "titulo_pt": "Vetadas por Lula, apostas esportivas foram legalizadas em 2018 e regulamentadas em 2023; veja o histórico", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 180382, "titulo": "Ex-US admiral calls for arms sales action", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/26/2003864922", "fonte_id": "taipei_times", "data_pub": "2026-09-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-almirante dos Estados Unidos está chamando para ações de venda de armas.", "titulo_pt": "Ex-almirante dos EUA solicita ações de vendas de armas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 181259, "titulo": "Carney Seeks New Trade Partners for Canada, But Knows the Limits", "url": "https://www.nytimes.com/2026/09/25/world/canada/carney-canada-european-union-china-india.html", "fonte_id": "nyt_world", "data_pub": "2026-09-25T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Canadá está buscando estreitar relações comerciais, de defesa e culturais com China, Índia e União Europeia. No entanto, nenhum desses países provavelmente substituirá as relações com os Estados Unidos.", "titulo_pt": "Carney busca novos parceiros comerciais para o canadá, mas reconhece limites", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 181220, "titulo": "Servel sancionó por “propaganda electoral fuera de plazo” al principal estratega de la campaña en RR.SS. de Kast", "url": "https://www.ciperchile.cl/2026/09/25/servel-sanciono-por-propaganda-electoral-fuera-de-plazo-al-principal-estratega-de-la-campana-en-rr-ss-de-kast/?utm_source=rss&utm_medium=rss&utm_campaign=servel-sanciono-por-propaganda-electoral-fuera-de-plazo-al-principal-estratega-de-la-campana-en-rr-ss-de-kast", "fonte_id": "ciper_chile", "data_pub": "2026-09-25T21:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Servel sancionou o principal estratega da campanha de Kast por propaganda eleitoral fora do prazo nas redes sociais. A decisão foi tomada após a entrada do CIPER Chile.", "titulo_pt": "Servel sancionou por ‘propaganda eleitoral fora de prazo’ o principal estratega de campanha em redes sociais de Kast", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 180889, "titulo": "Egito cobra que Israel retire soldados e encerre violações em Gaza", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://aovivo.folha.uol.com.br/mundo/2026/09/21/6560-acompanhe-a-81-assembleia-geral-da-onu.shtml#post466995", "fonte_id": "folha_mundo", "data_pub": "2026-09-25T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Egito, Mostafa Madbouly, falou na Assembleia Geral da ONU sobre a necessidade de encerrar as violações israelenses, retirada das forças de Israel e entrada segura de ajuda humanitária na Faixa de Gaza para consolidar o cessar-fogo.", "titulo_pt": "Egito pede que Israel retire tropas e pare com violações em Gaza", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 181333, "titulo": "Yemeni leader calls for general mobilization against Houthis", "url": "https://www.dw.com/en/yemeni-leader-calls-for-general-mobilization-against-houthis/a-79439604?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-25T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder do governo de Yemen, apoiado por Arábia Saudita, chamou seus compatriotas para se juntarem às forças governamentais em meio a uma escalada militar contra os Houthis, apoiados pelo Irã.", "titulo_pt": "Líder de yemen solicita mobilização geral contra os Houthis", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 181224, "titulo": "Aplazan hasta 2027 el juicio de Ryan Wedding, el exatleta olímpico acusado de convertirse en un capo de la cocaína", "url": "https://elpais.com/us/2026-09-25/aplazan-hasta-2027-el-juicio-de-ryan-wedding-el-exatleta-olimpico-acusado-de-convertirse-en-un-capo-de-la-cocaina.html", "fonte_id": "elpais_america", "data_pub": "2026-09-25T21:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma juíza de Los Angeles adiou o julgamento de Ryan Wedding, ex-atleta olímpico acusado de envolvimento com o tráfico de cocaína, até 2027. A decisão foi tomada considerando o caso como inusual e complexo.", "titulo_pt": "Juízo de Ryan Wedding, ex-atleta olímpico acusado de tráfico de cocaína, é adiado até 2027", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 181275, "titulo": "Egypt’s Warning to Israel", "url": "https://www.theatlantic.com/national-security/2026/09/egypt-israel-gaza-hamas-palestinian-october-7/688720/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-25T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da inteligência do Cairo visitou Tel Aviv poucos dias antes de 7 de outubro com uma mensagem grave sobre Gaza.", "titulo_pt": "Aviso do egito para Israel", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 181380, "titulo": "Iran offers US plan to reopen Hormuz within 7 days", "url": "https://www.scmp.com/news/world/middle-east/article/3368872/iran-offers-us-plan-reopen-hormuz-within-7-days?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-25T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministro das Relações Exteriores do Irã, Abbas Araghchi, anunciou que Teerã ofereceu um plano aos Estados Unidos para reabrir o Estreito de Ormuz em sete dias, uma vez que seja acordado. Araghchi se encontrou com o enviado do presidente americano Donald Trump e anteriormente estabeleceu condições para encerrar a guerra e reabrir o canal vital para o comércio de petróleo.", "titulo_pt": "Irã oferece plano aos EUA para reabrir estreito de Ormuz em sete dias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 181375, "titulo": "Moody's, Italia resiliente a shock energia, quest'anno pil +0,8%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/25/moodys-italia-resiliente-a-shock-energia-questanno-pil-08_2d70be02-4d9b-44c6-a8d7-ccbb2862a123.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-25T21:02:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Moody's prevê que a Itália seja resiliente aos choques energéticos. O PIB da Itália deve crescer em 0,8% neste ano. O déficit orçamentário do país deve diminuir para 3% em 2026 e para 2,9% em 2027.", "titulo_pt": "Moody's: Itália resiliente aos choques energéticos, pib +0,8% este ano", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 181356, "titulo": "Manchester City reportedly found guilty of almost 115 financial charges", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/25/09-25-man-city-verdict-sv?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-25T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Manchester City foi notificado de que foi encontrado culpado quase em todas as 115 acusações de conduta financeira irregular que enfrentava.", "titulo_pt": "Manchester City teria sido condenado em quase 115 acusações de conduta financeira", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 181294, "titulo": "Trump will hit several deep-red states in October campaign blitz", "url": "https://www.politico.com/news/2026/09/25/trump-midterms-travel-iowa-florida-red-states-01093710", "fonte_id": "politico", "data_pub": "2026-09-25T20:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em outubro, Trump fará visitas a vários estados vermelhos. O Partido Republicano está buscando fortalecer sua base política em meio a altos custos, uma guerra na Irã desgastante e alguma reação negativa às deportações em massa.", "titulo_pt": "Trump visitará vários estados vermelhos em campanha em outubro", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 181317, "titulo": "Russia targeting 'ordinary life' with attacks on Ukraine's data centres, Zelensky says", "url": "https://www.bbc.co.uk/news/articles/c84gkwgk7d06o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-25T20:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelensky afirma que a Rússia está atacando centrais de dados ucranianas com o objetivo de interferir na vida cotidiana dos cidadãos, dificultando sua conexão com a internet, estudo e trabalho.", "titulo_pt": "Rússia ataca centrais de dados para perturbar a vida cotidiana da Ucrânia, diz Zelensky", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 181358, "titulo": "Afghan taxi drivers defy the Taliban’s music ban", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/25/afghan-taxi-drivers-defy-the-talibans-music-ban?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-25T20:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taxistas afegãos estão tocando música em seus carros, apesar da proibição impostas pelo Taliban.", "titulo_pt": "Taxistas afegãos desafiam banimento de música pelo Taliban", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 180890, "titulo": "Trump publica foto de encontro com Xi que parece ter sido alterada por IA", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/trump-publica-foto-de-encontro-com-xi-que-parece-ter-sido-alterada-por-ia.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-25T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, publicou uma foto do encontro com o presidente chinês, Xi Jinping, que especialistas consultados pela agência AFP acreditam ter sido retocada com inteligência artificial.", "titulo_pt": "Trump publica foto de encontro com Xi que parece ter sido alterada por IA", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 181327, "titulo": "Yemen's president calls on his people to mobilise against Iran-backed Houthis", "url": "https://www.france24.com/en/middle-east/20260925-yemen-president-calls-on-his-people-to-mobilise-against-iran-backed-houthis", "fonte_id": "france24", "data_pub": "2026-09-25T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Iêmen, Rashid al-Alimi, pediu à população que se mobilize e se junte às forças armadas. Ele ofereceu um perdão geral aos rebeldes hutitas, apoiados pela Irã, que controlam partes da costa do Mar Vermelho do Iêmen e bloquearam o porto de Saudi Arabia.", "titulo_pt": "Presidente do iêmen pede mobilização contra rebeldes hutitas", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 181376, "titulo": "Nations League: l'Italia parte male, il Belgio vince 2-0", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/25/nations-league-litalia-parte-male-il-belgio-vince-2-0_0b7de9ad-b53f-4cc7-a470-fd6ddd4afc49.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-25T20:40:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Belgica venceu a Itália por 2-0, com gols de Godts e Lukaku. A seleção italiana teve dificuldades desde o início do jogo.", "titulo_pt": "Nations League: a Itália começa mal, o belgica vence por 2-0", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 180398, "titulo": "EU urges Britain to raise tariffs on Chinese vehicles", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/26/2003864902", "fonte_id": "taipei_times", "data_pub": "2026-09-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está pedindo ao Reino Unido que aumente os impostos sobre os veículos chineses. O objetivo é proteger os fabricantes locais de automóveis.", "titulo_pt": "Ue solicita ao reino unido aumento de tarifas sobre veículos chineses", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 181065, "titulo": "Classificação da Stock Light, F4 e Turismo são remarcadas para sábado (26)", "url": "https://www.metropoles.com/esportes/classificacao-da-stock-light-f4-e-turismo-sao-remarcadas-para-sabado-26", "fonte_id": "metropoles", "data_pub": "2026-09-25T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As classificações das categorias Stock Light, F4 e Turismo foram remarcadas para o sábado (26). Os atrasos ocorreram devido a problemas de manutenção na pista e falhas na transmissão da telemetria.", "titulo_pt": "Classificações das categorias Stock Light, F4 e Turismo remarcadas para sábado (26)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 180904, "titulo": "Ministério Fazenda já mandou Anatel bloquear mais de 57 mil endereços de bets ilegais em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/ministerio-fazenda-ja-mandou-anatel-bloquear-mais-de-57-mil-enderecos-de-bets-ilegais-em-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, o Ministério da Fazenda solicitou ao Anatel o bloqueio de mais de 57 mil endereços de apostas ilegais online. Essa ação visa combater a operação de apostas ilegais no país.", "titulo_pt": "Fazenda já pediu ao Anatel o bloqueio de mais de 57 mil endereços de apostas ilegais em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 181153, "titulo": "Récord histórico: más de 9 millones de toneladas de granos están cubiertas con futuros y opciones", "url": "https://www.lanacion.com.ar/economia/campo/record-historico-mas-de-9-millones-de-toneladas-de-granos-estan-cubiertas-con-futuros-y-opciones-nid25092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-25T21:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As posições abertas de futuros e opções sobre grãos atingiram 9,132 milhões de toneladas, superando o recorde de março de 2022. Especialistas atribuem o aumento ao uso crescente dessas ferramentas e aos bons preços que anteciparam as coberturas para a próxima campanha de 2026/2027.", "titulo_pt": "Novo recorde: mais de 9 milhões de toneladas de grãos estão cobertas com futuros e opções", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 180906, "titulo": "BNDES e Finep aprovam R$ 104,4 bilhões para inovação na indústria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/bndes-e-finep-aprovam-r-1044-bilhoes-para-inovacao-na-industria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES e a Finep aprovaram R$ 104,4 bilhões em crédito para projetos de inovação na indústria entre janeiro de 2023 e agosto de 2026. Este valor é 413% maior do que os R$ 20,4 bilhões aprovados entre 2019 e 2022.", "titulo_pt": "BNDES e Finep aprovam R$ 104,4 bilhões para inovação na indústria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 180907, "titulo": "O planejamento financeiro da família fica de pé sem a renda do cônjuge?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/09/o-planejamento-financeiro-da-familia-fica-de-pe-sem-a-renda-do-conjuge.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estrutura financeira familiar depende de dois pilares. Se um deles for removido, a pergunta passa a ser sobre a capacidade de sustentabilidade restante do sistema financeiro familiar.", "titulo_pt": "O planejamento financeiro da família aguenta sem a renda do cônjuge?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 180949, "titulo": "Após cinco meses, conta de luz voltará à bandeira verde em outubro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/apos-cinco-meses-conta-de-luz-voltara-bandeira-verde-em-outubro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-25T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A conta de luz voltará à bandeira verde em outubro, sem novas tarifas adicionais, conforme informou a Agência Nacional de Energia Elétrica (Aneel). A bandeira amarela, que vigorou por cinco meses, custava R$ 1,885 a cada 100 kWh consumidos.", "titulo_pt": "Depois de cinco meses, conta de luz retornará à bandeira verde em outubro", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 180908, "titulo": "Aneel aciona bandeira verde em outubro, e conta de luz não terá custo extra pela primeira vez desde maio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/aneel-aciona-bandeira-verde-em-outubro-e-conta-de-luz-nao-tera-custo-extra-pela-primeira-vez-desde-maio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Aneel anunciou que a bandeira tarifária será verde em outubro, indicando que a conta de luz não terá custo extra. Este será o primeiro mês desde maio sem impacto adicional na conta de energia.", "titulo_pt": "Aneel ativa bandeira verde em outubro e conta de luz não terá custo extra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 181373, "titulo": "Blackstone’s top private equity executive prepares exit for possible public service move", "url": "https://www.ft.com/content/c1ab1254-bf38-43ca-aa22-02a09d6e2b73?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-25T20:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joseph Baratta, um dos funcionários melhor remunerados da Blackstone, planeja deixar a empresa após quase 30 anos de trabalho. O executivo pode considerar uma carreira em serviço público após sua saída.", "titulo_pt": "Executivo de maior destaque da blackstone prepara saída para possível mudança para serviço público", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 181322, "titulo": "UK PM says Channel migrants are 'changing tactics'", "url": "https://www.lemonde.fr/en/international/article/2026/09/25/uk-pm-says-channel-migrants-are-changing-tactics_6757962_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-25T20:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pessoas que buscam asilo têm encontrado novos caminhos para atravessar o Canal da Inglaterra, em resposta a uma repressão por parte das autoridades britânicas e francesas, levando a múltiplos protestos na região sul da Inglaterra nos últimos meses.", "titulo_pt": "PM do reino unido diz que migrantes estão 'mudando de estratégia'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 181253, "titulo": "A arquitetura da predação", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-arquitetura-da-predacao", "fonte_id": "jota", "data_pub": "2026-09-25T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diferença entre dívida saudável e predatória reside na estrutura do crédito, não no valor devido. Este conceito sugere que o risco não está na quantidade de dinheiro, mas na forma como o crédito é concedido e gerenciado.", "titulo_pt": "A arquitetura da predação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 181370, "titulo": "Soaring bond yields ‘not even close’ to cooling red-hot US economy, investors say", "url": "https://www.ft.com/content/bcf0715b-4292-428e-80ec-e6702d430aa4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-25T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores afirmam que as taxas de juros das dívidas não estão perto de frear a atividade na maior economia do mundo.", "titulo_pt": "Taxas de juros em alta 'longe de frear' economia quente dos EUA, dizem investidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 180909, "titulo": "Argentina pode ter segunda maior receita agrícola da história em 2027, aponta Bolsa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/argentina-pode-ter-segunda-maior-receita-agricola-da-historia-em-2027-aponta-bolsa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Argentina pode obter uma receita quase recorde com as exportações agrícolas em 2027 devido a preços elevados das safras, uma colheita excepcional e interrupções no abastecimento em regiões exportadoras concorrentes.", "titulo_pt": "Argentina pode ter segunda maior receita agrícola da história em 2027, indica Bolsa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 180910, "titulo": "Controle estatal, religião e fraudes são motivos para restrição de bets pelo mundo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/controle-estatal-religiao-e-fraudes-sao-motivos-para-restricao-de-bets-pelo-mundo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T19:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos últimos anos, vários países implementaram restrições ou proibições contra as empresas de apostas esportivas, conhecidas como bets, motivadas por questões como controle estatal, religião e fraudes. A Espanha, Itália e Reino Unido adotaram regras rigorosas contra publicidade e patrocínios, enquanto a China e Índia optaram por banir completamente esses sites.", "titulo_pt": "Controle estatal, religião e fraudes justificam restrições a bets em vários países", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179951, "titulo": "BNDES recebe R$ 12 bilhões em pedidos de crédito do Brasil Soberano", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bndes-recebe-r-12-bilhoes-em-pedidos-de-credito-do-brasil-soberano/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-25T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES recebeu R$ 12 bilhões em pedidos de crédito do programa Brasil Soberano. O programa tem um orçamento total de R$ 22,6 bilhões, composto por R$ 13,5 bilhões do Tesouro Nacional e R$ 9,1 bilhões de recursos próprios do banco.", "titulo_pt": "BNDES recebe R$ 12 bilhões em pedidos de crédito do programa Brasil Soberano", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 181038, "titulo": "Ibovespa recua pela 3ª sessão e fecha semana em baixa de 1%; dólar vai a R$ 5,18", "url": "https://exame.com/invest/mercados/ibovespa-ibov-fechamento-25-09-2026/", "fonte_id": "exame", "data_pub": "2026-09-25T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa recuou pela terceira sessão seguida e encerrou a semana em baixa de 1%. O dólar atingiu R$ 5,18. O petróleo caiu devido a expectativas de um acordo entre EUA e Irã, enquanto a IPCA-15 acima do esperado manteve os juros sob vigilância.", "titulo_pt": "Ibovespa cai pela 3ª sessão e dólar atinge R$ 5,18; petróleo e juros sob pressão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 180397, "titulo": "Google plans test of space chips in Project Suncatcher", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/26/2003864901", "fonte_id": "taipei_times", "data_pub": "2026-09-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google planeja testar chips espaciais no Projeto Suncatcher.", "titulo_pt": "Google planeja teste de chips espaciais no projeto Suncatcher", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 181374, "titulo": "Walmart chief rules out personalised pricing as AI transforms retail", "url": "https://www.ft.com/content/632e21a3-b889-4423-a1d9-be16b3e680bd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-25T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maior varejista dos Estados Unidos emitiu uma carta aberta afirmando que não utilizará etiquetas de prateleira eletrônicas para alterar os preços com base no identificador do comprador. A empresa se posiciona contra a prática de preços personalizados por meio de inteligência artificial.", "titulo_pt": "Chefe do walmart descarta preços personalizados com AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 180988, "titulo": "Júri nos EUA responsabiliza a Meta no escândalo Cambridge Analytica", "url": "https://www.cartacapital.com.br/tecnologia/juri-nos-eua-responsabiliza-a-meta-no-escandalo-cambridge-analytica/", "fonte_id": "cartacapital", "data_pub": "2026-09-25T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um júri nos Estados Unidos atribuiu responsabilidade à Meta no escândalo Cambridge Analytica. A multa pode chegar a 5 mil dólares por infração, elevando o valor máximo teórico para 10,5 bilhões de dólares.", "titulo_pt": "Júri nos EUA responsabiliza a Meta no escândalo Cambridge Analytica", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 181395, "titulo": "Meta opens early access program for new Muse features", "url": "https://techcrunch.com/2026/09/25/meta-opens-early-access-program-for-new-muse-features/", "fonte_id": "techcrunch", "data_pub": "2026-09-25T20:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta abriu um programa de acesso antecipado para novas funcionalidades do Muse. Interessados devem solicitar à Muse para serem incluídos na lista.", "titulo_pt": "Meta abre programa de acesso antecipado para novas funcionalidades do Muse", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 181396, "titulo": "The hottest new hangout for middle schoolers is NPR’s comment section?", "url": "https://techcrunch.com/2026/09/25/the-hottest-new-hangout-for-middle-schoolers-is-nprs-comment-section/", "fonte_id": "techcrunch", "data_pub": "2026-09-25T20:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os funcionários da NPR notaram comentários estranhos em seus podcasts no Spotify que pareciam ser gerados por robôs. Foi um colega da geração Z que imediatamente descobriu a origem desses comentários suspeitos.", "titulo_pt": "O novo ponto de encontro quente para adolescentes médios é a seção de comentários da NPR?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 181400, "titulo": "Thieves Stole ‘Nvidia’ Trailers. They Got 20 Tons of Sand", "url": "https://www.wired.com/story/thieves-stole-nvidia-trailers-they-got-20-tons-of-sand/", "fonte_id": "wired", "data_pub": "2026-09-25T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ladrões roubaram trailers com marcas de Nvidia e levaram 20 toneladas de areia em vez do silício pretendido. O troco que os ladrões receberam foi de areia, não de silício.", "titulo_pt": "Ladrões roubaram Trailers de Nvidia e receberam 20 toneladas de areia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 181397, "titulo": "Anthropic to pay Akamai $11.6 billion over seven years in cloud deal", "url": "https://techcrunch.com/2026/09/25/anthropic-to-pay-akamai-11-6-billion-over-seven-years-in-cloud-deal/", "fonte_id": "techcrunch", "data_pub": "2026-09-25T19:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic comprometeu-se a pagar US$ 11,6 bilhões a Akamai ao longo de sete anos para a infraestrutura de nuvem da empresa, um investimento que pode chegar a cerca de US$ 20 bilhões. Em uma arranjo incomum, Akamai está oferecendo a Anthropic uma participação potencial de até 5% de sua ação, que aumenta conforme Anthropic aumenta suas despesas.", "titulo_pt": "Anthropic vai pagar us$ 11,6 bilhões a Akamai em acordo de nuvem ao longo de sete anos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 181384, "titulo": "AI was supposed to hit new grads hard. So far, unemployment data says otherwise.", "url": "https://arstechnica.com/ai/2026/09/ai-was-supposed-to-hit-new-grads-hard-so-far-unemployment-data-says-otherwise/", "fonte_id": "ars_technica", "data_pub": "2026-09-25T19:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Até o momento, não há evidências de que o aumento do uso de inteligência artificial tenha significativamente reduzido a contratação ou deslocado trabalhadores recém-formados. Os dados de desemprego sugerem que a previsão de que a inteligência artificial afetaria negativamente os recém-formados não se confirmou.", "titulo_pt": "A inteligência artificial não teve impacto significativo na contratação de recém-formados, de acordo com os dados de desemprego", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 181385, "titulo": "Paramount/WBD merger conditions give the public \"virtually nothing,\" judge is told", "url": "https://arstechnica.com/tech-policy/2026/09/paramount-wbd-merger-conditions-give-the-public-virtually-nothing-judge-is-told/", "fonte_id": "ars_technica", "data_pub": "2026-09-25T18:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O juiz dos Estados Unidos está examinando a fusão entre as empresas Paramount e Warner Bros., exigindo que o acordo não seja resultado de uma conspiração. De acordo com fontes, o juiz afirma que o acordo não oferece 'praticamente nada' aos consumidores.", "titulo_pt": "Juiz examina fusão entre paramount e warner bros., afirmando que o acordo não deve ser resultado de conspiração", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 181398, "titulo": "Ahead of US IPO, British AI neocloud Nscale secures $3.36B in convertible financing", "url": "https://techcrunch.com/2026/09/25/ahead-of-u-s-ipo-british-ai-neocloud-nscale-secures-3-36b-in-convertible-finacing/", "fonte_id": "techcrunch", "data_pub": "2026-09-25T18:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A neocloud Nscale, uma empresa britânica de IA, recebeu $3,36 bilhões em financiamento conversível de investidores como Third Point e Nvidia. Os fundos serão utilizados para acelerar o desenvolvimento de sua infraestrutura de centros de dados de IA.", "titulo_pt": "Antes da IPO nos EUA, neocloud Nscale recebe $3,36 bilhões em financiamento conversível", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 181386, "titulo": "Is solar's growth finally slowing in the US?", "url": "https://arstechnica.com/science/2026/09/is-solars-growth-finally-slowing-in-the-us/", "fonte_id": "ars_technica", "data_pub": "2026-09-25T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crescente demanda nos Estados Unidos, que deve aumentar em 2% em 2026, está sendo facilmente atendida por fontes renováveis, incluindo energia solar.", "titulo_pt": "O crescimento da solar nos EUA está finalmente se acelerando?", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 179985, "titulo": "Es piloto de avión, se asoció con un argentino y usaron IA para diseñar una nueva forma de capacitar a la gente", "url": "https://www.lanacion.com.ar/tecnologia/es-piloto-de-avion-se-asocio-con-un-argentino-y-usaron-ia-para-disenar-una-nueva-forma-de-capacitar-nid25092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-25T18:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um empreendedor chileno criou uma plataforma de inteligência artificial que prevê a curva de esquecimento de cada usuário. O piloto de avião se associou a um argentino para desenvolver essa nova forma de capacitação.", "titulo_pt": "Empreendedor chileno desenvolve plataforma de IA para prever curva de esquecimento", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 179986, "titulo": "Microsoft reinventa Copilot con Home, Code y Autopilot, las herramientas que buscan revolucionar el trabajo diario", "url": "https://www.lanacion.com.ar/tecnologia/microsoft-reinventa-copilot-con-home-code-y-autopilot-las-herramientas-que-buscan-revolucionar-el-nid25092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-25T18:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Microsoft apresentou a maior atualização de inteligência artificial até agora, reconfigurando Copilot como um \"sistema operacional para o trabalho\" com agentes autônomos e a criação de software sem código. A empresa, liderada por Satya Nadella, visa revolucionar o trabalho diário com essas novas ferramentas.", "titulo_pt": "Microsoft re inventa Copilot com Home, Code e Autopilot, buscando revolucionar o trabalho diário", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 181387, "titulo": "Microsoft stops insisting you need a \"Copilot+ PC\"", "url": "https://arstechnica.com/gadgets/2026/09/microsoft-stops-insisting-you-need-a-copilot-pc/", "fonte_id": "ars_technica", "data_pub": "2026-09-25T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft não está mais utilizando o termo 'Copilot+ PC' para suas novas laptops Surface. A empresa decidiu não incluir este rótulo nos modelos mais recentes.", "titulo_pt": "Microsoft para de exigir 'PC com Copilot+' para suas novas laptops surface", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 181278, "titulo": "AI Companies’ New Plan to Keep Themselves From Destroying Everything", "url": "https://www.theatlantic.com/technology/2026/09/ai-companies-evaluators-risk/688785/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-25T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de inteligência artificial planejam permitir que avaliadores externos monitorem seus modelos, mas a quantidade de acesso e influência desses avaliadores ainda é incerta.", "titulo_pt": "Novo plano das empresas de inteligência artificial para evitar destruição em grande escala", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 180499, "titulo": "The Aeropod automates soil aeration without robotics. See it at TechCrunch Disrupt.", "url": "https://techcrunch.com/2026/09/25/the-aeropod-automates-soil-aeration-without-robotics-see-it-at-techcrunch-disrupt/", "fonte_id": "techcrunch", "data_pub": "2026-09-25T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Muju Earth Technologies criou um pod simples que automatiza a aeriação do solo sem o uso de robótica, ajudando os agricultores a economizar dinheiro e melhorar a produtividade das culturas.", "titulo_pt": "O Aeropod automatiza a aeriação do solo sem robótica. Conheça-o em TechCrunch Disrupt.", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 180391, "titulo": "Experts advise healthier diets for kids", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/26/2003864931", "fonte_id": "taipei_times", "data_pub": "2026-09-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos recomendam dietas mais saudáveis para crianças. Os especialistas sugerem alterações na alimentação para melhorar a saúde dos jovens.", "titulo_pt": "Expertos recomendam dietas mais saudáveis para crianças", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 181422, "titulo": "Breaking and entering: How parasites prepare host cells for invasion", "url": "https://phys.org/news/2026-09-parasites-host-cells-invasion.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes de invadir uma célula, o parasita Toxoplasma gondii precisa identificar o local correto. Novas pesquisas do Whitehead Institute mostram que o parasita não apenas reconhece uma porta pronta para a invasão, mas ajuda a criar as condições para sua própria entrada.", "titulo_pt": "Quebrando e entrando: como parasitas preparam as células hospedeiras para a invasão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181423, "titulo": "How cells rapidly detect viruses that fuse with their membranes", "url": "https://phys.org/news/2026-09-cells-rapidly-viruses-fuse-membranes.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram como as células humanas detectam rapidamente vírus que se fundem à sua membrana e iniciam uma resposta imune dentro de uma hora.", "titulo_pt": "Como células humanas rapidamente detectam vírus que se fundem à sua membrana e montam uma resposta imune", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181424, "titulo": "Critically endangered species in the heart of Africa: Investigating Hooded Vultures in Chad", "url": "https://phys.org/news/2026-09-critically-endangered-species-heart-africa.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em regiões ocidentais da África, matadouros são os últimos locais onde se pode encontrar a Águia-vultura de capuz, uma espécie criticamente em perigo que historicamente vivia próxima aos humanos, contribuindo para o descarte de resíduos.", "titulo_pt": "Espécie em perigo crítico no coração da áfrica: investigando águia-vultura de capuz em chipre", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181425, "titulo": "Mitochondrial protein complexes: A single amino acid can jeopardize their stability", "url": "https://phys.org/news/2026-09-mitochondrial-protein-complexes-amino-acid.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A remoção de um único aminoácido pode determinar se novos proteínas se assemelham em complexos estáveis dentro das mitocôndrias. Pesquisadores liderados por Dr. Nora Vögtle da Universidade de Heidelberg e Dr. Pitter Huesgen da Universidade de Freiburg identificaram um mecanismo desconhecido pelo qual as células humanas mantêm o equilíbrio de proteínas em suas mitocôndrias.", "titulo_pt": "Um único aminoácido pode ameaçar a estabilidade de complexos mitocondriais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181426, "titulo": "Blood pressure enzyme reveals second job: Making sulfur rings for cellular antioxidants", "url": "https://phys.org/news/2026-09-blood-pressure-enzyme-reveals-job.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enzimas que regulam a pressão sanguínea podem também sintetizar anéis de sulfeto para antioxidantes celulares. Antioxidantes como a vitamina C e E protegem as células ao neutralizar radicais livres, evitando danos ao material genético ou membranas celulares.", "titulo_pt": "Enzima de pressão sanguínea revela segunda função: sintetizar anéis de sulfeto para antioxidantes celulares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181427, "titulo": "Natural proteins can guide active ingredients to diseased cells", "url": "https://phys.org/news/2026-09-natural-proteins-ingredients-diseased-cells.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os medicamentos contidos em uma pílula são distribuídos pelo corpo, atingindo as tecidos e células afetadas pela doença e realizando sua função pretendida. No entanto, eles também entram em células saudáveis, onde frequentemente causam mais danos do que benefícios.", "titulo_pt": "Proteínas naturais podem guiar ingredientes ativos para células doentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181428, "titulo": "How a century-old solvent can enable efficient amide synthesis", "url": "https://phys.org/news/2026-09-century-solvent-enable-efficient-amide.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amidações são ligações químicas essenciais para a biologia, medicina e química de materiais. A síntese eficiente de amidas é um foco importante na química verde, pois essas ligações são cruciais para proteínas, medicamentos e polímeros.", "titulo_pt": "Como um solvente centenário pode facilitar a síntese eficiente de amidas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181435, "titulo": "NASA Welcomes San Marino Signing the Artemis Accords", "url": "https://www.nasa.gov/organizations/oiir/nasa-welcomes-san-marino-signing-the-artemis-accords/", "fonte_id": "nasa_news", "data_pub": "2026-09-25T19:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A República de San Marino se juntou à 76ª signatária dos Acordos Artemis durante uma cerimônia em Rimini, com a presença de altos funcionários da NASA e do Departamento de Estado dos EUA. San Marino se une a uma crescente coalizão de nações com ideais semelhantes em relação à exploração espacial pacífica, transparente e responsável.", "titulo_pt": "NASA bem-vinda San Marino à assinatura dos acordos Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 181429, "titulo": "Ultrathin materials could make quantum light circuits programmable", "url": "https://phys.org/news/2026-09-ultrathin-materials-quantum-circuits-programmable.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Materiais ultradelgados poderiam tornar os circuitos de luz quântica programáveis, de acordo com uma nova revisão. A fotônica quântica pode ser um elemento crucial na tecnologia quântica futura, se materiais adequados forem desenvolvidos.", "titulo_pt": "Materiais ultradelgados poderiam tornar circuitos de luz quântica programáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181436, "titulo": "NASA Tests Dual Mode Propulsion CubeSat Ahead of Launch", "url": "https://www.nasa.gov/directorates/rtmd/nasa-tests-dual-mode-propulsion-cubesat-ahead-of-launch/", "fonte_id": "nasa_news", "data_pub": "2026-09-25T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA testou uma nova pequena satélite (CubeSat) com propulsão de dois modos, visando tornar as viagens espaciais mais seguras. A propulsão tradicional depende de combustíveis voláteis e sistemas separados e volumosos para diferentes tipos de movimentação no espaço.", "titulo_pt": "NASA testa propulsão de dois modos em pequeno satélite antes do lançamento", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 181430, "titulo": "An overlooked era of cosmology is stealing the show in the quest to understand the cosmos", "url": "https://phys.org/news/2026-09-overlooked-era-cosmology-quest-cosmos.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A era da cosmologia que muitas vezes é negligenciada está ganhando destaque na busca para entender o cosmos. O título traduzido para o português brasileiro seria: Uma era de cosmologia negligenciada está roubando a cena na busca para entender o cosmos.", "titulo_pt": "Uma era de cosmologia negligenciada está roubando a cena na busca para entender o cosmos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181431, "titulo": "Laser light enables detection of colorectal cancer biomarker in blood within minutes", "url": "https://phys.org/news/2026-09-laser-enables-colorectal-cancer-biomarker.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores utilizam anticorpos para detectar marcadores biológicos específicos, mas identificar sinais leves de câncer no sangue é um desafio mesmo para técnicas confiáveis. Um laser foi usado para detectar um biomarcador de câncer colorretal no sangue em apenas alguns minutos.", "titulo_pt": "Luz laser permite detecção de biomarcador de câncer colorretal no sangue em minutos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181432, "titulo": "New tools pinpoint where urban trees could provide the most relief from heat", "url": "https://phys.org/news/2026-09-tools-urban-trees-relief.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidades que buscam aliviar o calor nas ruas frequentemente estabelecem metas amplas para a cobertura de árvores. No entanto, essas metas podem ignorar a realidade de que não todos os sombras são igualmente úteis e nem todos os bairros têm espaço para mais árvores.", "titulo_pt": "Novas ferramentas identificam onde as árvores urbanas poderiam oferecer a maior alívio do calor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181433, "titulo": "Previously overlooked protein helps cells divide correctly", "url": "https://phys.org/news/2026-09-previously-overlooked-protein-cells.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Gothenburg identificaram uma proteína que anteriormente foi ignorada. Modernas tecnologias permitem descobrir uma proteoma 'oculta' de proteínas codificadas por partes do genoma anteriormente negligenciadas.", "titulo_pt": "Proteína anteriormente ignorada auxilia na divisão celular correta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 180601, "titulo": "Great news from Saturn's moon Enceladus in the search for life in space", "url": "https://phys.org/news/2026-09-great-news-saturn-moon-enceladus.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista Science Advances por Frank Postberg, professor de ciência planetária da Freie Universität Berlin, e uma equipe internacional de pesquisadores apresenta novas evidências de que é mais fácil determinar os componentes do oceano que se encontra sob a superfície de gelo de Enceladus do que se pensava anteriormente. Isso aumenta as chances de encontrar vida extraterrestre no sistema solar.", "titulo_pt": "Boas notícias sobre Enceladus na busca por vida no espaço", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 180896, "titulo": "Mulher que af const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;

  noticias: { rotulo: "Todas as Notícias", render() {

    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
