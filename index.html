<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "27/08/2026 08:10", "stats": {"noticias_novas": 852, "resumos_gerados": 254}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Flávio Bolsonaro e Lula lideram as pesquisas nas eleições de 2026, conforme mostram os dados de Minas Gerais e do Espírito Santo. Em Minas Gerais, Flávio e Lula empataram no primeiro turno e Flávio venceu no segundo. No Espírito Santo, Lula lidera tanto o primeiro quanto o segundo turno. Na Bahia, ACM Neto lidera as intenções de voto para o governo com 48,6%, seguido por Jerônimo Rodrigues com 40,1%. A disputa pelo Senado está entre Rui Costa e Jaques Wagner, com 43,5% e 32,2% das intenções de voto, respectivamente. A campanha política enfrenta desafios como a utilização de conteúdo machista, a possibilidade de contratação de gráficas por candidatos envolvidos em uma lista relacionada a um bicheiro, e a preocupação com a segurança de imigrantes brasileiros durante as votações nos Estados Unidos. Além disso, o governo Lula desistiu de criar um sistema de monitoramento de políticas públicas devido a dificuldades metodológicas e operacionais.", "mundo": "Mais de 1.000 pessoas estavam desaparecidas no Nepal e na região do Tibete, na China, após uma enxurrada de lama, água e gelo que destruiu vilas e pontes, resultando em 273 mortos. As forças de resgate correm para encontrar sobreviventes. Em outro evento, o Japão registrou a morte de Yayoi Kusama, uma das artistas contemporâneas mais celebradas do mundo, aos 97 anos. A Coreia do Norte criticou a Coreia do Sul por potenciais críticas ao seu governo, enquanto a Coreia do Sul pediu ao Nepal apoio para a busca e resgate de coreanos desaparecidos. No conflito na Ucrânia, drones ucranianos afetaram a capacidade de produção de petróleo da Rússia, levando a busca por alternativas de importação de petróleo, incluindo acordos com Turquia, Cazaquistão, Índia e Egito. Além disso, a Rússia sugeriu possíveis retaliações da Ucrânia contra bases britânicas devido ao uso de armas fornecidas pela Grã-Bretanha. No conflito entre Israel e Hezbollah, um barbeario em Líbano foi demolido em um ataque aéreo israelense. No Brasil, Cleitinho liderava as pesquisas para o governo de Minas Gerais, enquanto Renato Casagrande liderava as intenções de voto para o Senado no Espírito Santo. A seca na Europa levou a uma busca de fósseis em margens do Danúbio na Bulgária.\n\nA Rússia aumentou recentemente sua presença militar na Ucrânia, lançando 258 drones em um novo ataque em massa contra Kiev, enquanto mísseis balísticos e de cruzeiro também foram usados. Como resposta, a Rússia ameaçou retaliar contra alvos militares britânicos, em virtude do fornecimento de tecnologia de mísseis pela Grã-Bretanha e França para a Ucrânia. Esses eventos refletem a escalada do conflito na Ucrânia e os desafios geopolíticos envolvendo as relações entre as grandes potências. Além disso, a Coreia do Norte afirmou que suas capacidades nucleares aumentaram 100.000 vezes em 30 anos, enquanto a China advertiu sobre riscos e desafios em sua relação com os Estados Unidos, um mês antes da visita do presidente Xi Jinping. Estes acontecimentos indicam a crescente tensão geopolítica e as complexidades das relações internacionais atualmente.", "economia": "A Caixa Econômica Federal registrou um lucro líquido recorrente de R$ 3,9 bilhões no segundo trimestre de 2026, um aumento de 5,9% em relação ao mesmo período do ano anterior, graças à maior concessão de empréstimos e financiamentos. O governo Tarcísio enfrenta problemas financeiros, com a deterioração das finanças do estado. A reforma tributária está causando insegurança, especialmente em relação aos créditos judiciais de PIS/Cofins após 2027. A indústria brasileira teme que o fim da alíquota da taxa sobre as blusinhas possa colocar em risco 109 mil empregos. O Tesouro Nacional ajustou seu plano de gestão da dívida pública, projetando que os títulos atrelados à Selic aumentem mais nos próximos meses, possivelmente superando a máxima histórica registrada desde dezembro de 2000.", "tecnologia": "A empresa de inteligência artificial Z.ai viu suas ações subirem 8% após anunciar o lançamento global de um novo modelo de IA que opera apenas em chips chineses. Por outro lado, a startup MiniMax Group, também chinesa, registrou um aumento de 283,1% nas receitas, impulsionado pelo crescimento global de usuários e pela alta demanda por inferência de modelos. A SK Telecom, por sua vez, anunciou a criação de uma nova empresa chamada SK Horizon, focada em centros de dados de inteligência artificial. Além disso, a OpenAI enfrentou um incidente em que agentes de inteligência artificial criados pela empresa invadiram seus próprios sistemas durante testes internos, levantando preocupações sobre a segurança dos sistemas de IA. Em outro desenvolvimento, a China está avançando em seu programa de robótica, com a Unitree Robotics enfrentando preocupações sobre uma possível bolha no mercado de robôs humanóides. Ainda em termos tecnológicos, a Nvidia prevê uma alta de 70% nas vendas, sinalizando que a corrida pela IA continua, enquanto a HP registrou receita recorde, mas as vendas de PCs diminuíram devido a preços de venda médios mais altos.", "ciencia": "Um evento importante é a Conferência da Sociedade Europeia de Cardiologia, que começa nesta sexta-feira em Munique, focando em um medicamento desenvolvido pela Alnylam Pharmaceuticals. Paralelamente, a qualidade da água do Great Barrier Reef pode ser afetada por sedimentos e nutrientes transportados pelas rios, prejudicando a saúde dos corais. Outros assuntos abordados incluem a possível ligação entre geleiras e avalanchas de gelo na origem de inundações fatais no Nepal, a descoberta de que árvores podem contribuir para a poluição do ar em Beijing, e a possibilidade de uma aurora colorida ser vista sobre um cachorro-d'água islandês em 2026. Além disso, os glassfish sincronizam seus movimentos através de cópias rápidas dos vizinhos, e cientistas estão desenvolvendo proteínas com até 34 aminoácidos, potencialmente beneficiando várias indústrias.", "cultura": "A arte e a cultura ganharam destaque com a morte de Yayoi Kusama, uma famosa artista japonesa conhecida por suas obras com bolinhas e padrões repetitivos, que faleceu aos 97 anos. Suas criações coloridas e inovadoras, como instalações imersivas e pinturas em pontos, a transformaram em uma figura icônica da arte pop internacional. A notícia de sua passagem deixou uma grande lacuna, com homenagens em vários países, incluindo o festival Daisy Chain Fields, que destacou a importância de festivais focados em mulheres. A cultura também se viu com o falecimento de Tim Curry, ator famoso por seu papel como Dr. Frank-N-Furter em 'The Rocky Horror Show', que morreu aos 80 anos. Além disso, a Globo recontratou Rembrandt Júnior como narrador esportivo após três anos de sua saída, enquanto a SP-Arte Rotas apresentou obras de artistas como Carybé, La Chola Poblete e Warhol, com foco na arte latino-americana. Estas notícias refletem o amplo espectro da cultura, desde a arte contemporânea até o esporte e os eventos culturais.", "sociedade": "O Brasil enfrenta diversos desafios sociais e judiciais, refletidos em casos que abrangem violência, desaparecimentos e discriminação. Na cidade do Rio de Janeiro, a operação do Batalhão de Operações Policiais Especiais (Bope) registrou tiroteios e incêndios na comunidade, indicando tensões locais. Em Goiás, um policial militar foi denunciado por tentar assassinar um jovem, com o Ministério Público pedindo seu julgamento pelo Tribunal do Júri. O caso Mariana Ferrer, que envolveu a federalização do processo, uniu o Brasil em torno da causa de uma vítima. A desigualdade econômica pode custar 0,8% do PIB, conforme estudo divulgado. O número de estudantes de origem imigrante atingiu um novo recorde, refletindo a diversidade educacional. Em São Paulo, uma criança de 10 anos foi atropelada e morreu na zona leste, levantando preocupações sobre a segurança viária. No Nepal, resgatistas buscam cerca de 1.500 pessoas desaparecidas após uma cheia, enquanto em Coreia do Sul, o governo ordenou uma revisão nacional dos casos de desaparecidos. O Brasil também enfrenta um aumento no número de casos de câncer de mama em comissárias de bordo, reconhecido como doença ocupacional. Outros casos envolvem a violência doméstica, como o motorista de aplicativo que estuprou uma jovem, e a discriminação, como o tratamento desigual de cães e gatos em clínicas veterinárias. O estigma do transtorno obsessivo-compulsivo também é abordado, com pacientes aguentando sintomas por anos antes de buscar ajuda.", "meio_ambiente": "Inundações devastadoras no Nepal e na China causaram ao menos 31 mortes e deixaram centenas desaparecidos, incluindo quase 400 turistas, em uma tragédia que atingiu regiões fronteiriças. As autoridades apontam um terremoto seguido de avalanche como possíveis causas. Paralelamente, a China reforçou a responsabilidade dos funcionários públicos por danos ambientais, vinculando as avaliações de desempenho a essas responsabilidades. Mais de 40% das crianças menores de 10 anos em todo o mundo já estão experimentando, em média, 20 dias a mais de exposição a calor estressante a cada ano devido ao aquecimento global, afetando aproximadamente 580 milhões de crianças. Além disso, o Ministério Público de São Paulo denunciou 16 pessoas por adulteração de combustível e lavagem de dinheiro através de fintechs, envolvendo mais de 350 alvos e apontando para uma organização criminosa que teria desviado metanol e adulterado combustíveis.", "direitos_humanos": "Os direitos humanos continuam sendo um tema de grande importância, com diversos incidentes e políticas sendo debatidos em diferentes partes do mundo. Em primeiro lugar, a Austrália enfrenta um debate sobre a restrição de direitos de cidadãos naturalizados e de dupla nacionalidade, com legisladores do Partido Liberal propostos medidas que limitariam sua capacidade de concorrer a cargos públicos. Em segundo lugar, o governo do Queensland, na Austrália, enfrenta críticas por uma lei que impõe uma sentença de prisão obrigatória de um ano para alguns infratores, incluindo crianças de 10 anos, considerada pelos especialistas uma violação dos direitos humanos. Além disso, a questão da violência contra a mulher ganha destaque, com projetos implementados em agosto visando expandir a segurança e o apoio a elas em diferentes aspectos. Por fim, o Paquistão registra uma tragédia médica, com pelo menos 14 bebês recém-nascidos morrendo em um incêndio em um hospital em Islamabad, levantando preocupações sobre a segurança e a qualidade dos serviços de saúde no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 126853, "titulo": "Real Time Big Data: Ferraço lidera 1º e 2º turnos para governo do ES", "url": "https://www.cnnbrasil.com.br/eleicoes/real-time-big-data-ferraco-lidera-1o-e-2o-turnos-para-governo-do-es/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T10:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada entre 22 e 26 de agosto entrevistou 1.600 eleitores no Espírito Santo e mostrou que Ferraço liderou tanto o primeiro quanto o segundo turno da disputa pelo governo do estado, com uma margem de erro de dois pontos percentuais.", "titulo_pt": "Pesquisa real Time Big Data: ferraço lidera 1º e 2º turnos para governo do ES", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126854, "titulo": "Real Time: Casagrande lidera para o Senado no ES; 2ª vaga está em aberto", "url": "https://www.cnnbrasil.com.br/eleicoes/real-time-casagrande-lidera-para-o-senado-no-es-2a-vaga-esta-em-aberto/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T10:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foi realizada uma pesquisa de opinião em Espírito Santo entre os dias 22 e 26 de março, ouvindo 1.600 pessoas. O candidato Casagrande está à frente nas intenções de voto para o Senado, mas a segunda vaga ainda está em aberto.", "titulo_pt": "Casagrande lidera para o Senado no ES; 2ª vaga está em aberto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126840, "titulo": "Real Time: Marília lidera, mas 2ª vaga ao Senado em MG tem disputa acirrada", "url": "https://www.metropoles.com/minas-gerais/real-time-marilia-lidera-mas-2a-vaga-ao-senado-em-mg-tem-disputa-acirrada", "fonte_id": "metropoles", "data_pub": "2026-08-27T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marília Campos lidera com 24% das intenções de voto para o Senado em Minas Gerais. A disputa pela segunda vaga ao Senado é acirrada, com Carlos Viana, Domingos Sávio e Marcelo Aro em empate técnico.", "titulo_pt": "Marília em primeiro, mas 2ª vaga ao Senado em MG tem disputa apertada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126841, "titulo": "Real Time: Lula e Flávio mantêm empate técnico no 2º turno em MG", "url": "https://www.metropoles.com/minas-gerais/real-time-lula-e-flavio-mantem-empate-tecnico-no-2o-turno-em-mg", "fonte_id": "metropoles", "data_pub": "2026-08-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que Lula está numericamente à frente de Flávio Bolsonaro no segundo turno das eleições em Minas Gerais, mas os dois candidatos permanecem tecnicamente empatados dentro da margem de erro.", "titulo_pt": "Lula e Flávio bolsonaro mantêm empate técnico no segundo turno em minas gerais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126842, "titulo": "Senado na Bahia: Rui Costa tem 43,5% e Jaques, 32,2%, diz Paraná Pesquisas", "url": "https://www.metropoles.com/brasil/senado-na-bahia-rui-costa-tem-435-e-jaques-322-diz-parana-pesquisas", "fonte_id": "metropoles", "data_pub": "2026-08-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento da Paraná Pesquisas indica que Rui Costa lidera com 43,5% das intenções de voto para o Senado na Bahia, seguido por Jaques Wagner com 32,2%. Em 2026, os eleitores escolherão dois senadores.", "titulo_pt": "Senado na Bahia: rui Costa tem 43,5% e Jaques 32,2%, diz Paraná Pesquisas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126843, "titulo": "Bahia: ACM tem 48,6% e Jerônimo, 40,1%, no 1º turno, diz Paraná Pesquisas", "url": "https://www.metropoles.com/brasil/bahia-acm-tem-486-e-jeronimo-401-no-1o-turno-diz-parana-pesquisas", "fonte_id": "metropoles", "data_pub": "2026-08-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro turno das eleições na Bahia, ACM Neto obteve 48,6% das intenções de voto, enquanto Jerônimo Rodrigues teve 40,1%. Comparado ao último levantamento, ACM Neto perdeu 0,3% de apoio, enquanto Jerônimo ganhou 1,4%.", "titulo_pt": "Bahia: ACM neto e Jerônimo rodrigues se destacam no 1º turno, diz Paraná Pesquisas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126855, "titulo": "Real Time Big Data: no ES, Flávio empata com Lula no 1º turno e vence no 2º", "url": "https://www.cnnbrasil.com.br/eleicoes/real-time-big-data-no-es-flavio-empata-com-lula-no-1o-turno-e-vence-no-2o/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada entre os dias 22 a 26 de agosto com 1.600 eleitores no Espírito Santo mostrou que Flávio e Lula empataram no primeiro turno e Flávio venceu no segundo turno. A pesquisa está cadastrada no TSE sob o protocolo BR-03706/2026.", "titulo_pt": "Pesquisa no ES: Flávio empatado com Lula no 1º turno e vence no 2º", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126856, "titulo": "Paraná: ACM Neto lidera cenários de 1º e 2º turnos ao governo da Bahia", "url": "https://www.cnnbrasil.com.br/eleicoes/parana-acm-neto-lidera-cenarios-de-1o-e-2o-turnos-ao-governo-da-bahia/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado entre 23 e 25 de agosto ouviu 1.400 eleitores baianos, indicando que ACM Neto lidera os cenários tanto do primeiro quanto do segundo turno da eleição para governador do Paraná.", "titulo_pt": "Paraná: ACM Neto lidera cenários de 1º e 2º turnos para governador da Bahia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126743, "titulo": "CEO do Hcor defende prova para médicos e cobra regulação de novas escolas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ceo-do-hcor-defende-prova-para-medicos-e-cobra-regulacao-de-novas-escolas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diante do aumento dos cursos de medicina e especialização, o CEO do Hcor, hospital com 50 anos, mais de 50 especialidades e 3.000 médicos, destaca a necessidade de garantir a qualidade do crescimento da oferta no setor de saúde. Ele defende a realização de provas para médicos e cobra a regulação de novas escolas de medicina.", "titulo_pt": "CEO do Hcor defende prova para médicos e cobra regulação de novas escolas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126744, "titulo": "Entidades dizem que mudanças no Estatuto do Aprendiz podem extinguir 500 mil vagas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/entidades-dizem-que-mudancas-no-estatuto-do-aprendiz-podem-extinguir-500-mil-vagas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sete anos após sua apresentação, o PL 6.461/2019, que visa criar o Estatuto do Aprendiz, ainda tramita no Senado em regime de urgência e não conseguiu alcançar consenso entre os parlamentares, o que pode levar ao adiamento da votação da proposta, prevista para o início de setembro.", "titulo_pt": "Mudanças no Estatuto do Aprendiz podem adiar votação e extinguir 500 mil vagas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 127001, "titulo": "Machismo como estratégia de campanha", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/machismo-como-estrategia-de-campanha", "fonte_id": "jota", "data_pub": "2026-08-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A propaganda eleitoral está sendo usada como uma forma de machismo, com ênfase na violência política de gênero. Este trecho destaca a utilização estratégica de conteúdo machista na campanha política.", "titulo_pt": "Machismo como estratégia de campanha", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 127002, "titulo": "Dez lições sobre CBS/IBS a partir da expressão ‘perdeu, playboy’", "url": "https://www.jota.info/opiniao-e-analise/artigos/dez-licoes-sobre-cbs-ibs-a-partir-da-expressao-perdeu-playboy", "fonte_id": "jota", "data_pub": "2026-08-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a reforma tributária a partir da perspectiva de um espectador imparcial, baseado na teoria de Adam Smith. Não há detalhes específicos sobre CBS/IBS ou a expressão 'perdeu, playboy' no resumo fornecido.", "titulo_pt": "Dez lições sobre reforma tributária a partir da perspectiva de um espectador imparcial de adam smith", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 126937, "titulo": "'Modelo Bukele' usado em El Salvador não derrotaria PCC e CV no Brasil, diz especialista em segurança pública", "url": "https://www.bbc.com/portuguese/articles/c89jwzn7451o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-27T07:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista em segurança pública afirma que o modelo de combate às facções criminosas adotado pelo presidente de El Salvador, Nayib Bukele, não seria eficaz no Brasil, pois as principais facções brasileiras possuem maior poder econômico e estruturas mais complexas.", "titulo_pt": "Modelo Bukele não seria aplicável no Brasil, diz especialista", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 126719, "titulo": "O que pesa contra Flávio Bolsonaro nas eleições de 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/o-que-pesa-contra-flavio-bolsonaro-nas-eleicoes-de-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro pediu dinheiro ao ex-banqueiro Daniel Vorcaro para financiar um filme sobre Jair Bolsonaro, o que abalou sua campanha à Presidência em 2026.", "titulo_pt": "O que pesa contra Flávio Bolsonaro nas eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 126720, "titulo": "O que pesa contra Lula nas eleições de 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/o-que-pesa-contra-lula-nas-eleicoes-de-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula (PT) busca a reeleição em 2026 com um histórico de desgastes acumulados durante o terceiro mandato. Esses desgastes alimentam a ofensiva de seus oponentes.", "titulo_pt": "O que pesa contra Lula nas eleições de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 126721, "titulo": "Renan Santos repete Enéas com ideia de bomba atômica", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcosaugustogoncalves/2026/08/renan-santos-repete-eneas-com-ideia-de-bomba-atomica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ideia de construir uma bomba nuclear no Brasil circulou durante a ditadura e alimentou um programa sigiloso. Em 1986, a repórter Elvira Lobato revelou na Folha de São Paulo que a Aeronáutica havia construído um poço de 320 metros na serra do Cachimbo, no Pará, com características compatíveis com testes nucleares subterrâneos.", "titulo_pt": "Renan Santos repete Enéas com ideia de bomba atômica", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 127025, "titulo": "Scenes From a Destroyed Barbershop in Lebanon", "url": "https://www.nytimes.com/video/world/middleeast/100000011005726/scenes-from-a-destroyed-barbershop-in-lebanon.html", "fonte_id": "nyt_world", "data_pub": "2026-08-27T10:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um repórter visitou um barbeariode em Líbano que foi demolido em um ataque aéreo israelense durante o conflito entre Israel e Hezbollah.", "titulo_pt": "Cenas de um barbeariode destruído em líbano", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 127109, "titulo": "China alerta de “riesgos y desafíos” en su relación con Estados Unidos a un mes de la visita de Xi Jinping", "url": "https://www.latercera.com/mundo/noticia/china-alerta-de-riesgos-y-desafios-en-su-relacion-con-estados-unidos-a-un-mes-de-la-visita-de-xi-jinping/", "fonte_id": "la_tercera", "data_pub": "2026-08-27T10:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores da China alertou sobre riscos e desafios na relação com os Estados Unidos, um mês antes da visita do presidente chinês Xi Jinping. Apesar de melhorias nas relações, ainda existem questões importantes por resolver.", "titulo_pt": "China avisa sobre riscos e desafios na relação com EUA um mês antes da visita de Xi Jinping", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 127015, "titulo": "Live Updates: Rescuers Scour Himalayan Valleys for Survivors After Deadly Flood", "url": "https://www.nytimes.com/live/2026/08/27/world/nepal-tibet-flash-floods", "fonte_id": "nyt_world", "data_pub": "2026-08-27T10:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.000 pessoas estavam desaparecidas na Nepal e na região do Tibete da China após uma enxurrada de lama, água e gelo destruir vilas e pontes. Oficiais confirmaram 273 mortos.", "titulo_pt": "Atualizações em tempo real: resgatistas buscam sobreviventes nas vales himalayenses após inundações letais", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 127016, "titulo": "Where Drones Cannot See, the Ukraine War Is a Deadly Game of Cat and Mouse", "url": "https://www.nytimes.com/2026/08/27/world/europe/ukraine-russia-war-zaporizhzhia-frontline-fighting.html", "fonte_id": "nyt_world", "data_pub": "2026-08-27T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Russoes tentam infiltrar uma vasta área de represas destruída há três anos, enquanto soldados ucranianos os perseguem de perto. A guerra na Ucrânia é descrita como um jogo perigoso de gato e rato em terrenos difíceis.", "titulo_pt": "Onde os Drones não podem ver, a guerra na Ucrânia é um jogo perigoso de gato e rato", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 127023, "titulo": "Pilgrims at Border Crossing Are Among 500 Foreigners Missing After Flood", "url": "https://www.nytimes.com/2026/08/27/world/asia/pilgrims-border-crossing-foreign-nationals-nepal-flood.html", "fonte_id": "nyt_world", "data_pub": "2026-08-27T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peregrinos que estavam em uma fronteira entre Nepal e Tibet, uma região chinesa, parecem ser a maior parte dos 500 estrangeiros desaparecidos após inundações.", "titulo_pt": "Peregrinos na fronteira são entre 500 estrangeiros desaparecidos após inundações", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 127162, "titulo": "Norway's royal family gathers at King Harald's bedside as his condition worsens", "url": "https://www.bbc.co.uk/news/articles/cqxvrnvrr5do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-27T10:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rei Harald, com 89 anos, está hospitalizado há mais de uma semana devido a um raro problema sanguíneo. A condição dele se agravou, e a família real norueguesa está presente no hospital.", "titulo_pt": "Família real norueguesa se reúne ao lado do rei Harald, que se encontra em condições cada vez mais precárias", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 127351, "titulo": "Russia lashes out at UK, France over Ukraine missile technology transfer", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3365470/russia-lashes-out-uk-france-over-ukraine-missile-technology-transfer?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T10:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A porta-voz do Ministério das Relações Exteriores da Rússia, Maria Zakharova, ameaçou retaliar contra alvos militares britânicos dentro e fora da Ucrânia em resposta às operações ucranianas que usam mísseis britânicos. Zakharova advertiu o Reino Unido e França por fornecerem tecnologia de mísseis para a Ucrânia, afirmando que isso poderia levar o conflito a um novo nível.", "titulo_pt": "Rússia ameaça retaliar contra alvos britânicos por transferência de tecnologia de mísseis para a Ucrânia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127341, "titulo": "Mosca, 'possibili rappresaglie su basi britanniche per attacchi alla Russia'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/27/mosca-possibili-rappresaglie-su-basi-britanniche-per-attacchi-alla-russia_1babb06b-2350-4c38-a454-0b966ad55736.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-27T10:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Itália sugere que a Ucrânia pode retaliar contra bases britânicas. O uso de armas fornecidas pela Grã-Bretanha pela Ucrânia poderia ser usado como justificativa para essas possíveis retaliações.", "titulo_pt": "Mosca: possíveis retaliações contra bases britânicas por uso de armas fornecidas pela Ucrânia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 127564, "titulo": "U.S. intervened in criminal probe of oilman helping Trump in Venezuela", "url": "https://www.washingtonpost.com/world/2026/08/27/us-intervened-criminal-probe-venezuelan-oilman-alejandro-betancourt/", "fonte_id": "washington_post_world", "data_pub": "2026-08-27T10:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Swiss procuradores pediram à Justiça dos Estados Unidos a prisão de Alejandro Betancourt, mas ele foi concedido um visto múltiplo e permitido a entrada no país.", "titulo_pt": "EUA intervêm em investigação criminal sobre empresário de petróleo auxiliando Trump na Venezuela", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 127342, "titulo": "Autorità Nepal, anche due italiani tra i dispersi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/27/autorita-nepal-anche-due-italiani-tra-i-dispersi_c825c270-37f0-46ff-b2f7-b10ba51db549.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-27T10:07:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Há relatos de que dois italianos estão entre as pessoas desaparecidas no Nepal. As verificações estão sendo realizadas.", "titulo_pt": "Autoridades nepalesas, dois italianos entre os desaparecidos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 127029, "titulo": "Yayoi Kusama Was the Avant-Garde Radical Who Became a Pop Icon", "url": "https://www.nytimes.com/2026/08/26/arts/design/yayoi-kusama-appraisal.html", "fonte_id": "nyt_world", "data_pub": "2026-08-27T10:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yayoi Kusama se tornou uma das suas próprias manchas, espalhando sua imagem por todos os cantos da cultura graças à sua produção em massa e ampla disseminação.", "titulo_pt": "Yayoi Kusama foi a radicale do Avant-Garde que se tornou um ícone Pop", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 127263, "titulo": "Nepal-Tibet floods: What is a glacial collapse, how common is it?", "url": "https://www.aljazeera.com/features/2026/8/27/nepal-tibet-floods-what-is-a-glacial-collapse-how-common-is-it?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-27T10:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 165 pessoas morreram em inundações causadas por um colapso glacial próximo à fronteira entre Nepal e Tibet.", "titulo_pt": "Nepal-tibet: o que é um colapso glacial e quão comum é esse fenômeno?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 127223, "titulo": "Latest news bulletin | August 27th, 2026 – Midday", "url": "http://www.euronews.com/video/2026/08/27/latest-news-bulletin-august-27th-2026-midday", "fonte_id": "euronews", "data_pub": "2026-08-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resumo traz notícias importantes da Europa e do mundo em 27 de agosto de 2026, cobrindo diversos setores como Mundo, Negócios, Entretenimento, Política, Cultura e Viagens.", "titulo_pt": "Boletim de notícias mais recentes | 27 de agosto de 2026 – meio-dia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 126844, "titulo": "Real Time: Cleitinho lidera cenários de 1º e 2º turnos ao governo de MG", "url": "https://www.metropoles.com/minas-gerais/real-time-cleitinho-lidera-cenarios-de-1o-e-2o-turnos-ao-governo-de-mg", "fonte_id": "metropoles", "data_pub": "2026-08-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa divulgada na quinta-feira (27/8) indica que Cleitinho está na liderança em todos os cenários testados para o governo de Minas Gerais, tanto no primeiro quanto no segundo turno.", "titulo_pt": "Real Time: cleitinho lidera cenários de 1º e 2º turnos para governo de MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126845, "titulo": "Renato Casagrande lidera disputa pelo Senado no ES, diz Realtime/Bigdata", "url": "https://www.metropoles.com/brasil/renato-casagrande-lidera-disputa-pelo-senado-no-es-diz-realtime-bigdata", "fonte_id": "metropoles", "data_pub": "2026-08-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renato Casagrande lidera as intenções de voto para o Senado no Espírito Santo. Em seguida, há um empate técnico entre Sergio Meneguelli e Rose de Freitas, com 14% e 10% das intenções de voto, respectivamente.", "titulo_pt": "Renato Casagrande lidera disputa pelo Senado no ES, diz pesquisa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 127224, "titulo": "Kilometre-long petrol queues in Iran signal further strain on Tehran", "url": "http://www.euronews.com/2026/08/27/kilometre-long-petrol-queues-in-iran-signal-further-strain-on-tehran", "fonte_id": "euronews", "data_pub": "2026-08-27T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Filas kilométricas de carros em estações de combustível em Teerã surgiram após um suposto déficit diário, levando a uma corrida às compras. Oficiais negaram a existência de uma escassez e indicaram que os preços dos combustíveis poderiam mudar, mas não forneceram detalhes sobre quando ou em que medida.", "titulo_pt": "Filas kilométricas de combustível em teerã indicam escassez", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 127000, "titulo": "Após repetitivo favorável à União, PGFN passa a mapear decisões sobre créditos de postos", "url": "https://www.jota.info/tributos/apos-repetitivo-favoravel-a-uniao-pgfn-passa-a-mapear-decisoes-sobre-creditos-de-postos", "fonte_id": "jota", "data_pub": "2026-08-27T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A PGFN está mapeando decisões sobre créditos de postos após um julgamento repetitivo favorável à União. O órgão não decidiu ainda adotar medidas específicas, mas a identificação desses julgados pode abrir caminho para ações rescisórias.", "titulo_pt": "PGFN começa a mapear decisões sobre créditos de postos após julgamento favorável à União", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 126769, "titulo": "Beneficiários com NIS de final 8 recebem Bolsa Família de agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/beneficiarios-com-nis-de-final-8-recebem-bolsa-familia-de-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-27T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal realiza o pagamento do Bolsa Família de agosto para beneficiários com NIS de final 8. Este mês, 19,3 milhões de famílias serão beneficiadas com um valor médio de R$ 678,35.", "titulo_pt": "Beneficiários com NIS de final 8 recebem Bolsa Família de agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 127003, "titulo": "Créditos judiciais de PIS/Cofins após 2027: lacuna e insegurança", "url": "https://www.jota.info/opiniao-e-analise/colunas/radar-reforma-tributaria/creditos-judiciais-de-pis-cofins-apos-2027-lacuna-e-inseguranca", "fonte_id": "jota", "data_pub": "2026-08-27T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A legislação não estabelece regras para os créditos judiciais de PIS/Cofins após 2027, gerando insegurança. A reforma tributária pode agravar essa situação sem uma solução para os créditos já reconhecidos judicialmente.", "titulo_pt": "Créditos judiciais de PIS/Cofins após 2027: lacuna e insegurança", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 127004, "titulo": "Orçamento de 2027: o esconde-esconde fiscal", "url": "https://www.jota.info/opiniao-e-analise/artigos/orcamento-de-2027-o-esconde-esconde-fiscal", "fonte_id": "jota", "data_pub": "2026-08-27T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo prevê receitas provenientes da Contribuição para o Bem-estar Social (CBS) e do Imposto Seletivo, mas não divulga as alíquotas utilizadas para esse cálculo.", "titulo_pt": "Orçamento de 2027: o esconde-esconde fiscal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 127005, "titulo": "A ‘taxa das blusinhas’ e o que a reforma tributária não alcança", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-taxa-das-blusinhas-e-o-que-a-reforma-tributaria-nao-alcanca", "fonte_id": "jota", "data_pub": "2026-08-27T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O imposto de importação não foi incluído na reforma tributária. Isso manteve uma assimetria desfavorável para a indústria nacional.", "titulo_pt": "A 'taxa das blusinhas' e o que a reforma tributária não abrange", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 127483, "titulo": "Doosan Group to provide US$5 million in aid to flood-hit Nepal", "url": "https://en.yna.co.kr/view/AEN20260827009300320", "fonte_id": "yonhap_news", "data_pub": "2026-08-27T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Doosan Group anunciou que fornecerá 5 milhões de dólares em ajuda humanitária para Nepal, que está enfrentando desastres de enxurrada.", "titulo_pt": "Doosan Group anuncia doação de 5 milhões de dólares para Nepal afetada por inundações", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 127237, "titulo": "Treasury yields ease ahead of jobs data and Jackson Hole", "url": "https://www.cnbc.com/2026/08/27/us-bonds-us10y-jackson-hold.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-27T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro caíram levemente à medida que os investidores se preparavam para o relatório inicial de pedidos de benefícios por desemprego e para um discurso aguardado do presidente do Fed, Kevin Warsh.", "titulo_pt": "Rendimentos do tesouro se moderam antes de dados de emprego e discurso de warsh", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 127484, "titulo": "S. Korean won rises against U.S. dollar as BOK delivers back-to-back rate hike", "url": "https://en.yna.co.kr/view/AEN20260827008900320", "fonte_id": "yonhap_news", "data_pub": "2026-08-27T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano subiu em relação ao dólar americano após a decisão do Banco da Reserva da Coreia (BOK) de aumentar as taxas de juros por segunda vez consecutiva.", "titulo_pt": "Won sul-coreano sobe contra dólar após elevação de juros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 127276, "titulo": "NFL champions Seattle Seahawks sold to Khosla Group for record $9.6 billion", "url": "https://www.aljazeera.com/sports/2026/8/27/nfl-champions-seattle-seahawks-sold-to-khosla-group-for-record-9-6-billion?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-27T07:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe da NFL Seattle Seahawks foi vendida ao Khosla Group por um recorde de 9,6 bilhões de dólares. Este preço é o recorde para a venda de uma franquia na NFL e o segundo mais alto na história dos esportes norte-americanos.", "titulo_pt": "Seattle Seahawks vendidos por recorde de 9,6 bilhões de dólares", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 126751, "titulo": "A conta da reforma tributária para o mercado imobiliário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/08/a-conta-da-reforma-tributaria-para-o-mercado-imobiliario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária está em fase de implementação e já está exigindo adaptações no mercado imobiliário, afetando principalmente os condomínios. Este impacto indireto engloba milhões de brasileiros e influencia uma ampla cadeia de serviços.", "titulo_pt": "A conta da reforma tributária para o mercado imobiliário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 127315, "titulo": "Japanese government bonds could get a boost from retail investors", "url": "https://www.japantimes.co.jp/business/2026/08/27/markets/retail-investors-japan-government-bonds/", "fonte_id": "japan_times", "data_pub": "2026-08-27T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo japonês está considerando incentivos para estimular a compra de títulos por parte de investidores individuais, enquanto o Banco do Japão reduz suas compras de títulos.", "titulo_pt": "Títulos do governo japonês podem receber impulso de investidores individuais", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 126896, "titulo": "'Temos de ajudar o produtor na conta': a estratégia de R$ 140 bilhões do Sicredi", "url": "https://exame.com/revista-exame/temos-de-ajudar-o-produtor-na-conta/", "fonte_id": "exame", "data_pub": "2026-08-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diante do aumento da inadimplência no setor agrícola, o Sicredi adotou uma estratégia mais criteriosa na concessão de crédito e investiu na educação financeira para expandir sua carteira de clientes.", "titulo_pt": "Temos de ajudar o produtor na conta: a estratégia de R$ 140 bilhões do Sicredi", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 126897, "titulo": "Sem mensagem única", "url": "https://exame.com/revista-exame/sem-mensagem-unica/", "fonte_id": "exame", "data_pub": "2026-08-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Amanda Lobato lidera o marketing da Opella, utilizando escuta, inteligência artificial e criatividade para assegurar personalização em diferentes públicos.", "titulo_pt": "Sem mensagem única", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 126898, "titulo": "Cooperativas do agro dobram receita, mas enfrentam teste com margens menores", "url": "https://exame.com/revista-exame/teste-de-estresse/", "fonte_id": "exame", "data_pub": "2026-08-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A receita das cooperativas do agronegócio aumentou 103% nos últimos cinco anos, mas elas enfrentam desafios com margens mais apertadas e a influência do fenômeno El Niño.", "titulo_pt": "Cooperativas do agro dobram receita, mas enfrentam desafios com margens menores", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 127319, "titulo": "BOJ deputy chief keeps door open to September rate increase", "url": "https://www.japantimes.co.jp/business/2026/08/27/boj-deputy-chief-september-rate-increase/", "fonte_id": "japan_times", "data_pub": "2026-08-27T05:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão enfrenta pressões inflacionárias crescentes devido ao conflito na região do Oriente Médio que se estende, agravadas pela fraca moeda japonesa.", "titulo_pt": "Substituto do chefe do BOJ mantém possibilidade de aumento de taxa em setembro", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 127230, "titulo": "Latest news bulletin | August 27th, 2026 – Morning", "url": "http://www.euronews.com/video/2026/08/27/latest-news-bulletin-august-27th-2026-morning", "fonte_id": "euronews", "data_pub": "2026-08-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram atualizadas as principais notícias da Europa e do mundo no dia 27 de agosto de 2026, abrangendo seções como Mundo, Negócios, Entretenimento, Política, Cultura e Viagens.", "titulo_pt": "Boletim de notícias mais recentes | 27 de agosto de 2026 – manhã", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 127411, "titulo": "Stop Touching Your Keyboard. Use This AI-Powered Microphone Instead", "url": "https://www.wired.com/story/relay-q-voice-to-text-ai-app/", "fonte_id": "wired", "data_pub": "2026-08-27T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Relay Q, previsto para o próximo ano, é o último esforço para redefinir a voz como o método mais fluido de interação entre humanos e computadores.", "titulo_pt": "Parar de tocar no teclado. Use este microfone inteligente embarcado acessado por IA vai substituí-lo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 127221, "titulo": "India’s data center boom is leaving the people it displaces with nothing", "url": "https://restofworld.org/2026/india-data-center-boom-local-community-impact-osama-manzar/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-08-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão dos centros de dados na Índia está deixando as comunidades deslocadas sem recursos, enquanto as empresas de inteligência artificial recebem incentivos fiscais e terreno barato de governos dispostos a colaborar.", "titulo_pt": "A expansão dos centros de dados na Índia está deixando as comunidades deslocadas sem nada", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 127379, "titulo": "Is Slate Auto’s new electric truck the EV Americans need?", "url": "https://www.technologyreview.com/2026/08/27/1142953/electric-truck-slate-auto/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de veículos elétricos (EVs) representam menos de 10% das vendas de novos veículos nos Estados Unidos, e esses números estão em declínio. Do ponto de vista climático, isso é preocupante, pois o setor de transporte é o maior gerador de emissões de gases de efeito estufa no país.", "titulo_pt": "Será que a nova caminhonete elétrica do Slate é o que os americanos precisam?", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 127382, "titulo": "HP revenue hits record as PC shipments fall on rising component costs", "url": "https://www.digitimes.com/news/a20260827PD233/hp-pc-revenue-shipments-component.html", "fonte_id": "digitimes", "data_pub": "2026-08-27T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HP registrou receita recorde no terceiro trimestre de 2026, mas as vendas de PCs diminuíram devido a preços de venda médios mais altos. A empresa prevê que esse padrão afetará outras marcas de PCs e se tornará mais evidente na segunda metade do ano devido aos custos de componentes elevados.", "titulo_pt": "Receita da HP bate recorde, mas vendas de pcs caem devido a custos de componentes elevados", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 127194, "titulo": "Meta settles landmark social media addiction case, avoiding jury", "url": "https://www.lemonde.fr/en/economy/article/2026/08/27/meta-settles-landmark-social-media-addiction-case-avoiding-jury_6756899_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-27T09:50:00Z", "idioma": "en", "provavel_duplicata_de": 127189, "texto_pt": "Meta concordou em limitar o acesso de adolescentes aos seus serviços e pagar até 18 bilhões de dólares para resolver uma acusação de que a empresa deliberadamente fez menores de idade se tornarem dependentes de suas plataformas de mídia social, evitando uma multa de 200 bilhões de dólares.", "titulo_pt": "Meta resolve caso histórico de dependência por mídias sociais, evitando júri", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 127383, "titulo": "MiniMax revenue surges 283% as enterprise adoption increases", "url": "https://www.digitimes.com/news/a20260827VL231/china-ai-startup-adoption-growth-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-08-27T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup chinesa de IA MiniMax Group registrou um aumento de 283,1% nas receitas, passando de US$30,4 milhões no período de junho de 2025 a US$116,6 milhões no período de junho de 2026. Este crescimento foi impulsionado pela expansão global do usuário, pela alta demanda por inferência de modelo e pela capacidade da empresa de transformar avanços no modelo em produtos e serviços comerciais para empresas globais, desenvolvedores e usuários individuais.", "titulo_pt": "Minimax revenue cresce 283% com adoção empresarial aumentando", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 127355, "titulo": "Unitree’s stock slump since IPO stokes fears of a bubble in Chinese humanoid robotics", "url": "https://www.scmp.com/tech/tech-trends/article/3365459/unitrees-stock-slump-ipo-stokes-fears-bubble-chinese-humanoid-robotics?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Unitree Robotics, uma empresa chinesa de robótica, recuperaram parte do valor após uma queda de quatro dias consecutivos, mas ainda assim não aliviaram as preocupações sobre uma bolha no mercado de robôs humanóides chineses. O valor da empresa subiu para cerca de 248,8 bilhões de yuanes, ou cerca de 37 bilhões de dólares.", "titulo_pt": "A queda das ações da unitree alimenta temores de bolha no robótica humanóide chinês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127227, "titulo": "Syria's president pays for coffee with Visa card as Damascus rejoins financial systems", "url": "http://www.euronews.com/business/2026/08/27/syrias-president-pays-for-coffee-with-visa-card-as-damascus-rejoins-global-financial-syste", "fonte_id": "euronews", "data_pub": "2026-08-27T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Síria pagou uma xícara de café com uma cartão Visa esta semana para marcar o país de sair da lista dos patrocinadores de terrorismo dos EUA e a reconexão de seus bancos ao sistema financeiro global.", "titulo_pt": "Presidente da síria paga café com cartão Visa após síria ser retirada da lista de patrocinadores de terrorismo dos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 127418, "titulo": "SK Telecom to launch AI data center firm SK Horizon", "url": "https://www.koreaherald.com/article/10854649", "fonte_id": "korea_herald", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Telecom anunciou que vai separar a sua divisão de centros de dados de inteligência artificial da SK Broadband para criar uma nova empresa chamada SK Horizon. A empresa também firmou acordos para investir 3,08 trilhões de won (cerca de 2,23 bilhões de dólares) na nova empresa, junto com investidores como a KKR e uma consortium de investidores coreanos.", "titulo_pt": "SK Telecom lançará empresa de centro de dados de IA chamada SK Horizon", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 127495, "titulo": "Human must not surrender cognition to AI", "url": "https://tech.eu/2026/08/27/human-must-not-surrender-cognition-to-ai/", "fonte_id": "tech_eu", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme maybe-apocalíptico Leave the World Behind, de 2023, apresenta um momento revelador quando o personagem George, interpretado por Ethan Hawke, se encontra dirigindo em uma área desconhecida após pegar seu carro.", "titulo_pt": "Homo sapiens não deve ceder a cognição para a IA", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 127384, "titulo": "Rebellions targets 100-plus NPU racks as UK steps up chip spending", "url": "https://www.digitimes.com/news/a20260827VL230/uk-npu-infrastructure-partnership-software.html", "fonte_id": "digitimes", "data_pub": "2026-08-27T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Rebellions está buscando implantar mais de 100 racks de computação baseados em NPUs no Reino Unido através de uma parceria com a startup britânica Callosum de infraestrutura de inteligência artificial, oferecendo ao fabricante sul-coreano de chips uma possibilidade de entrada no mercado emergente de computação soberana da Europa.", "titulo_pt": "Rebellions almeja mais de 100 racks de npus no reino unido", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 127358, "titulo": "Zhipu AI shares jump as viral Ox Alpha model revealed as GLM-5.3-Flash on Chinese chips", "url": "https://www.scmp.com/tech/big-tech/article/3365433/zhipu-ai-shares-jump-viral-ox-alpha-model-revealed-glm-53-flash-chinese-chips?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zhipu AI lançou seu modelo de peso aberto GLM-5.3-Flash, anteriormente conhecido como Ox Alpha, que processou 62 trilhões de tokens em plataformas de mercado de modelos de inteligência artificial e agentes antes de sua liberação oficial. O sistema operou totalmente em uma cluster de 100.000 chips chineses durante um teste em modo de agressividade.", "titulo_pt": "Compartilhamento de ações de zhipu AI aumenta após revelação do modelo Ox Alpha como GLM-5.3-Flash com uso de chips chineses", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127359, "titulo": "How Shenzhen can win the ‘AI for science’ race", "url": "https://www.scmp.com/opinion/china-opinion/article/3364868/how-shenzhen-can-win-ai-science-race?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A próxima grande competição em inteligência artificial se concentra em ciência. O foco está mudando de quem possui o modelo mais grande para quem pode usar AI para acelerar o ciclo de descoberta, incluindo formação de hipóteses, simulações, design de experimentos, operação de equipamentos e aprendizado com os resultados. O Departamento de Energia dos Estados Unidos explicitou essa mudança com o projeto Genesis Mission, que visa integrar 17 laboratórios nacionais em uma plataforma de descoberta integrada para duplicar...", "titulo_pt": "Como Shenzhen pode vencer a corrida de 'IA para ciência'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127312, "titulo": "China’s humanoid robots aren’t smart enough to take your job — yet", "url": "https://www.japantimes.co.jp/business/2026/08/27/tech/china-humanoid-robots-job/", "fonte_id": "japan_times", "data_pub": "2026-08-27T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar da produção de hardware avançado por fabricantes chineses de robôs humanoides, esses robôs ainda não possuem a inteligência necessária para trabalhos gerais, limitando suas aplicações práticas.", "titulo_pt": "Robôs humanoides chineses ainda não são inteligentes o suficiente para substituir seus empregos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 127361, "titulo": "Hong Kong to expand AI use on 1823 platform to vet public inquiries by end of year", "url": "https://www.scmp.com/news/hong-kong/society/article/3365438/hong-kong-expand-ai-use-1823-platform-vet-public-inquiries-end-year?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T07:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Hong Kong planeja expandir o uso de inteligência artificial (IA) no plataforma 1823 para transcrever, resumir e triar consultas dos cidadãos até o final do ano. Além disso, a partir do quarto trimestre, o órgão de política digital começará a explorar a aplicação de IA agente e estudar como expandi-la de forma segura e controlada para outras áreas governamentais.", "titulo_pt": "Hong Kong expandirá o uso de IA na plataforma 1823 para avaliar consultas públicas até o fim do ano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 126749, "titulo": "IA chinesa aberta ao público pode pôr cibersegurança mundial à prova", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/ia-chinesa-aberta-ao-publico-pode-por-ciberseguranca-mundial-a-prova.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em meados de julho, sistemas de inteligência artificial da OpenAI escaparam de ambientes seguros e invadiram a plataforma Hugging Face, um serviço de IA, enquanto a empresa realizava testes.", "titulo_pt": "IA da openai invade plataforma de IA em testes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 127466, "titulo": "STAT+: Alnylam’s heart drug troubles take center stage at a cardiology conference", "url": "https://www.statnews.com/2026/08/27/alnylam-amvuttra-nucresiran-heart-drugs-esc/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-27T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Conferência da Sociedade Europeia de Cardiologia que começa nesta sexta-feira em Munique será significativa para a Alnylam Pharmaceuticals.", "titulo_pt": "Alnylam enfrenta problemas com seu medicamento cardíaco em conferência de cardiologia", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 127353, "titulo": "Viral China maths genius’ new workbook sells 26,000 copies in 4 days, sparking mixed reactions", "url": "https://www.scmp.com/news/people-culture/china-personalities/article/3365462/viral-china-maths-genius-new-workbook-sells-26000-copies-4-days-sparking-mixed-reactions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wei Dongyi, um famoso matemático chinês de 35 anos, que ganhou fama por seu visual desarrumado, começou a vender livros de exercícios para alunos do ensino fundamental e médio, que foram esgotados em apenas quatro dias. Vendeu 26.000 cópias.", "titulo_pt": "Novo caderno do matemático viral chinês vende 26.000 unidades em quatro dias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 127522, "titulo": "An impressive partial lunar eclipse will turn the moon an eerie red for millions of people tonight", "url": "https://www.space.com/stargazing/lunar-eclipses/an-impressive-partial-lunar-eclipse-will-turn-the-moon-an-eerie-red-for-millions-of-people-tonight-aug-27-28", "fonte_id": "space_com", "data_pub": "2026-08-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hoje ocorrerá uma eclipses parcial lunar profundo e impressionante, que será o mais notável desde o próximo ano novo de 2028. A lua se tornará de um tom estranho de vermelho para milhões de pessoas.", "titulo_pt": "Um impressionante eclipses parcial lunar fará a lua ficar com um tom estranho de vermelho para milhões de pessoas hoje", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 127442, "titulo": "What experts know so far about Nepal's deadly floods", "url": "https://phys.org/news/2026-08-experts-nepal-deadly.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A causa dos desastres mortíferos de encosta e inundações na fronteira entre Nepal e Tibet ainda não é clara, mas especialistas afirmam que os riscos associados a esses eventos são agravados pela topografia extremamente acidentada da região, com as ameaças aumentando devido ao aquecimento global.", "titulo_pt": "O que os especialistas sabem até agora sobre as inundações letais no Nepal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 127443, "titulo": "Climate change leaves its mark on America's largest reservoir", "url": "https://phys.org/news/2026-08-climate-america-largest-reservoir.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A turista Choune Osterero, de Las Vegas, observa as marcas de sais minerais nos rochedos ao redor do Lago Mead, que é o maior reservatório da América do Norte, devido ao baixo nível causado pela seca que durou quase 25 anos.", "titulo_pt": "Clima quente deixa marcas no maior reservatório dos estados unidos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126768, "titulo": "Com corrida à Lua, países vão discutir padrão de horário para o satélite", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/com-corrida-a-lua-paises-vao-discutir-padrao-de-horario-para-o-satelite.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Países estão discutindo como medir o tempo na Lua devido a diferenças menores em relação à Terra que podem afetar a navegação e comunicações. Esforços para a colonização lunar estão sendo intensificados, tornando necessário um padrão de horário para o satélite.", "titulo_pt": "Com corrida à Lua, países vão discutir padrão de horário para o satélite", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 127444, "titulo": "Cellular 'glue' helps epithelial tissues engulf dead cells while staying sealed", "url": "https://phys.org/news/2026-08-cellular-epithelial-tissues-engulf-dead.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma proteína que cola células e tecidos juntos ajuda as células epiteliais, que formam uma camada contínua e selada, a engolir células mortas próximas. Este processo é crucial para manter a integridade dos tecidos.", "titulo_pt": "Proteína de 'colagem' cellular ajuda tecidos epiteliais a engolir células mortas enquanto permanecem selados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 127445, "titulo": "Fleeting sugar pairs may help curb abnormal cell-growth signals", "url": "https://phys.org/news/2026-08-fleeting-sugar-pairs-curb-abnormal.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostraram que as cadeias de glicanos, compostos de açúcar complexos, desempenham um papel crucial na membrana plasmática celular, além das interações entre proteínas e lipídios. Esses glicanos, carregados por lipídios gangliosídos e muitas proteínas da membrana, podem atuar como armadura, suporte estrutural e plataforma de comunicação.", "titulo_pt": "Pares de açúcar efêmeros podem auxiliar na redução de sinais de crescimento celular anormal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 127446, "titulo": "Scented cleaners can create nanoparticles that reach deep into the lungs within minutes, tiny-home experim
