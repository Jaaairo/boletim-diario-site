<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "10/08/2026 19:16", "stats": {"noticias_novas": 551, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente dos Estados Unidos, Donald Trump, assinou um decreto com o objetivo de simplificar a lista de vacinas infantis no país. Paralelamente, o governador de Goiás, Ronaldo Caiado (PSD), tem realizado encontros com empresários paulistas para arrecadar doações para sua campanha presidencial. Durante um almoço em São Paulo, ele brincou com outro político sobre o Pix. O governo Lula planeja desenvolver uma política para minerais críticos e terras raras com o objetivo de agregar valor a esses recursos, visando reduzir a dependência de outros países. Este plano visa transformar o Brasil em um país não apenas exportador de minerais, mas também gerador de valor desses recursos.", "mundo": "Um terremoto de magnitude significativa atingiu a Colômbia no início do mês, causando 111 mortes e danos consideráveis. O evento representa um grande desafio para o presidente Gustavo Petro, que assumiu recentemente o cargo, exigindo uma rápida e eficaz resposta. Em outros desenvolvimentos internacionais, o governo turco aprovou uma lei de amnistia limitada para militantes do PKK kurdo, um passo importante no processo de paz visando ao fim de décadas de conflito. No entanto, a legislação não inclui Abdullah Ocalan, fundador do PKK, cuja libertação é uma demanda central do grupo. Além disso, o Partido Laborista dos EUA está tentando negociar com o governo para aprovar várias leis no Congresso, enquanto o governo Trump revisa sua abordagem de vacinação infantil, sugerindo a separação da vacina MMR em três doses individuais administradas em visitas diferentes. Esses eventos refletem os desafios políticos e sociais atuais em diversos países ao redor do mundo.\n\nUm terremoto de magnitude 7,4 atingiu o oeste da Colômbia no dia 28 de maio, causando pelo menos 69 mortes e danos significativos em edifícios nas cidades colombianas de Cali, Pereira e Manizales. O sismo também foi sentido em Equador, Panamá e Venezuela, levantando preocupações com a segurança regional. Em outro desenvolvimento geopolítico, Israel rejeitou um plano de paz proposto pelo presidente dos Estados Unidos, Donald Trump, para Gaza, enquanto o primeiro-ministro Benjamin Netanyahu expressou dúvidas sobre a viabilidade política do projeto. Além disso, o governo americano revogou mais de 175 mil vistos em uma medida que visa aumentar a pressão econômica sobre outros países sem recorrer a novos ataques militares. No contexto da guerra na Ucrânia, drones ucranianos atingiram uma refinaria na Rússia no dia 29 de maio, resultando em pelo menos 13 mortes e intensificando os ataques longinquos contra alvos distantes da linha de frente.", "economia": "A Shein está realizando seu IPO com uma avaliação inferior a US$ 30 bilhões, representando um decréscimo de cerca de 70% em comparação com o valor máximo do mercado da empresa. O setor de petróleo alertou o governo Lula sobre o risco de escassez de combustíveis no Norte do Brasil, devido à seca no Rio Tapajós e a entraves burocráticos. A JBS registrou um prejuízo líquido de US$ 102 milhões no segundo trimestre de 2026, impulsionado pelo crescimento em diversas unidades e mercados externos. O Banco Central do Brasil está estudando a possibilidade de interligar o sistema Pix com sistemas de pagamentos internacionais e mecanismos multilaterais para reduzir tarifas e expandir o acesso às transações internacionais. A United Way, com quase 14 décadas de história, está ampliando sua operação no Brasil como parte de suas estratégias globais.", "tecnologia": "Um dos principais eventos mencionados no relatório é a aprovação do protocolo de inteligência artificial parlamentar na China. Esse protocolo exige que os deputados e seus auxiliares declarem o uso de tecnologia de IA. O protocolo utiliza cores para indicar o nível de utilização: verde para conteúdo sem AI, amarelo para uso parcial, vermelho para uso predominante e azul para intervenção humana total. Além disso, a Nvidia anunciou um pacote de financiamento de US$ 500 bilhões em colaboração com grandes investidores do Wall Street para projetos de infraestrutura de IA. Esse acordo envolve gigantes como Apollo Global Management, Blackstone e Goldman Sachs, e pode ser oficializado na próxima segunda-feira. A Meta também lançou um novo modelo de IA chamado Glimmer, que oferece uma visão do projeto de superinteligência pessoal de Mark Zuckerberg, gerando divisões entre os usuários.", "ciencia": "Em julho, o Estados Unidos registrou a temperatura média mais alta entre todos os meses da série histórica da NOAA, agência climática dos EUA. Segundo dados remontando a 1895, a temperatura média do mês foi de 76,89°F, superando o recorde anterior de 76,77°F em julho de 1936. A NASA+ está expandindo suas transmissões ao vivo para novas plataformas de streaming, incluindo o Discovery+ e o HBO Max. Em Taiwan, o Biobanco de Taiwan planeja a próxima fase de sua pesquisa, envolvendo coleta e análise de amostras biológicas para estudar a saúde da população taiwanesa. Além disso, um estudo liderado pelos professores Jimmy Jiujiu Jiao e Meng Li identificou a fermentação microbiana como o principal caminho para a produção de amônio nos sedimentos sob a Delta do Rio Pearl, explicando os níveis excepcionalmente altos de amônio na água subterrânea da região.", "cultura": "Um naufrágio romano de 2.000 anos foi descoberto na costa da Itália, cheio de vasos de barro e considerado uma das mais importantes descobertas arqueológicas subaquáticas recentes, conforme relato do Hyperallergic. Em Brasília, o 59º Festival de Cinema foi cancelado por falta de recursos financeiros, refletindo os ajustes fiscais realizados pelo governo local para salvar o BRB, em crise após um escândalo financeiro, como relatado pela Folha Ilustrada. O Museu de Arte do Rio (MAR) está com inscrições abertas até a próxima quarta-feira para seu Curso de Formação de Mediadores Culturais 2026, oferecendo aulas teóricas e práticas nos dias 21, 22, 28 e 29 deste mês.", "sociedade": "A população de Taiwan registrou uma diminuição por 31 meses consecutivos, um período recorde de declínio populacional nas estatísticas recentes. Em São Paulo, a Justiça manteve a prisão de Breno de Souza Castro, acusado do assassinato das suas duas filhas sufocadas no Dia dos Pais, após ameaçar sua ex-companheira. O Bazar do Bem será realizado em Belo Horizonte nos dias 13, 14 e 15 de agosto, com toda a renda arrecadada destinada ao Hospital Mário Pena. Estudantes superdotados podem apresentar baixo rendimento escolar por diversos motivos; as mulheres tendem a esconder seu desempenho para se adequarem ao ambiente, conforme uma pesquisa recente. A cidade de Los Angeles oferece um exemplo do sistema imobiliário americano quebrado, com altos preços de casas em relação aos rendimentos das famílias. Para aliviar os preços, a cidade precisa construir mais casas permitindo maior densidade residencial nos bairros.", "meio_ambiente": "As temperaturas globais atingiram recordes no mês de julho, com os oceanos registrando as maiores leituras de temperatura já medidas. Como resultado, a Europa enfrenta ondas de calor extremas e incêndios florestais intensos. No Reino Unido, 71,3% do território inglês entrou em estado de seca. No Brasil, ocorreram incêndios na Serra do Gandarela e um terremoto na Colômbia que causou mais de 70 mortes, destacando os desafios enfrentados pelo meio ambiente.", "direitos_humanos": "No Rio Grande do Norte, um tribunal manteve a prisão preventiva de Marco Antônio Heredia Viveros, ex-marido de Maria da Penha, após ele ter violado as restrições de medida protetiva ao conceder uma entrevista. Em Hong Kong, oito pessoas foram presas por participar de um esquema de estelionato chamado 'sugar baby', que enganou mais de 80 vítimas e arrecadou cerca de HK$6,2 milhões. Além disso, a Agência Nacional de Polícia da Coreia anunciou planos para fortalecer as medidas de proteção aos denunciantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia."}, "resumo_do_dia": {"politica_nacional": [{"id": 97475, "titulo": "Trump assina decreto para diminuir lista de vacinas infantis", "url": "https://veja.abril.com.br/mundo/trump-assina-decreto-para-diminuir-lista-de-vacinas-infantis/", "fonte_id": "veja", "data_pub": "2026-08-10T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou um decreto com o objetivo de reduzir a lista de vacinas infantis. A medida inclui a separação das vacinas contra sarampo, caxumba e rubéola, bem como a ampliação do intervalo entre as doses.", "titulo_pt": "Trump assina decreto para diminuir lista de vacinas infantis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 97478, "titulo": "Após o fim da chapa ao Senado com mãe de Flávio, Canella faz dobradinha com Rueda na eleição do Rio", "url": "https://veja.abril.com.br/brasil/apos-o-fim-da-chapa-ao-senado-com-mae-de-flavio-canella-faz-dobradinha-com-rueda-na-eleicao-do-rio/", "fonte_id": "veja", "data_pub": "2026-08-10T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Canella encerrou sua chapa para o Senado com a votar o texto nesta quarta-feira.", "titulo_pt": "CCJ do Senado pode votar projeto que dá poder a cartórios para cobrar dívidas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 97434, "titulo": "Dois imóveis de R$ 1 milhão parecem uma aposentadoria segura; mas são?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/08/dois-imoveis-de-r-1-milhao-parecem-uma-aposentadoria-segura-mas-sao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas desejam se aposentar de maneira que não precisem se preocupar com como o dinheiro chegará à conta todos os meses. Investimentos que ofereçam renda passiva, sem exigir decisões ou acompanhamento, são frequentemente alvos desses sonhos.", "titulo_pt": "Dois imóveis de R$ 1 milhão parecem uma aposentadoria segura; mas são?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97435, "titulo": "IA impulsionará mais a produção de petróleo e gás do que a energia limpa, aponta relatório", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/ia-impulsionara-mais-a-producao-de-petroleo-e-gas-do-que-a-energia-limpa-aponta-relatorio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório liderado por dois ex-funcionários da Microsoft indica que a inteligência artificial (IA) pode aumentar substancialmente as emissões globais de petróleo e gás, superando os potenciais benefícios da energia limpa.", "titulo_pt": "IA impulsionará mais a produção de petróleo e gás do que a energia limpa, aponta relatório", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97490, "titulo": "Setor de petróleo faz alerta ao governo Lula sobre risco de apagão de combustíveis no Norte", "url": "https://veja.abril.com.br/brasil/setor-de-petroleo-faz-alerta-ao-governo-lula-sobre-risco-de-apagao-de-combustiveis-no-norte/", "fonte_id": "veja", "data_pub": "2026-08-10T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um documento do IBP alertou os ministérios sobre o risco de um apagão de combustíveis no Norte do Brasil, devido à seca no Rio Tapajós e a entraves burocráticos. O abastecimento de 7,5 milhões de pessoas está em perigo.", "titulo_pt": "Setor de petróleo avisa governo Lula sobre risco de apagão de combustíveis no Norte", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 97603, "titulo": "Venda de remédios nos marketplaces fica mais perto. Qual o impacto nas farmácias?", "url": "https://braziljournal.com/venda-de-remedios-nos-marketplaces-fica-mais-perto-qual-o-impacto-nas-farmacias/", "fonte_id": "brazil_journal", "data_pub": "2026-08-10T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa revogou as resoluções que proibiam a venda de medicamentos por marketplaces como Shoppe, Rappi e Mercado Livre. Esta medida aproxima ainda mais a liberação definitiva da venda de remédios por essas plataformas.", "titulo_pt": "Venda de remédios nos marketplaces fica mais perto", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 97679, "titulo": "De criptomoedas a aeronaves: Mendonça bloqueia bens em apuração sobre fraude na previdência de Maceió", "url": "https://www.jota.info/stf/do-supremo/de-criptomoedas-a-aeronaves-mendonca-bloqueia-bens-em-apuracao-sobre-fraude-na-previdencia-de-maceio", "fonte_id": "jota", "data_pub": "2026-08-10T20:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Economia, Paulo Guedes, através do secretário especial de Fazenda, Waldery Rodrigues, bloqueou bens relacionados a uma investigação sobre fraude na previdência em Maceió. A suspeita é que R$ 97 milhões tenham sido aplicados fraudulentamente em ativos do Banco Master.", "titulo_pt": "De criptomoedas a aeronaves: mendonça bloqueia bens em apuração sobre fraude na previdência de Maceió", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 97437, "titulo": "Consultoria atuou para favorecer o Master em fundo de previdência de Maceió, diz PF", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/consultoria-atuou-para-favorecer-o-master-em-fundo-de-previdencia-de-maceio-diz-pf.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal informou que a consultoria de investimentos Crédito e Mercado atuou para favorecer a compra de R$ 97 milhões em letras financeiras do Banco Master pelo fundo de previdência dos servidores de Maceió. A informação foi confirmada por uma decisão do ministro André Mendonça, do STF.", "titulo_pt": "Consultoria atuou para favorecer a compra de r$ 97 milhões em letras financeiras do banco Master pelo fundo de previdência de Maceió, diz PF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97459, "titulo": "Banco Central estuda interligar Pix com sistemas de outros países", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/banco-central-estuda-interligar-pix-com-sistemas-de-outros-paises", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-10T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central do Brasil está estudando a possibilidade de interligar o sistema Pix com sistemas de pagamentos internacionais e mecanismos multilaterais, com o objetivo de reduzir tarifas e expandir o acesso às transações internacionais.", "titulo_pt": "Banco Central considera ligar Pix a sistemas de outros países", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 97460, "titulo": "PF apura aporte de R$ 97 milhões de previdência de Maceió no Master", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/pf-apura-aporte-de-97-milhoes-de-instituto-de-previdencia-de-maceio-no-master", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-10T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal e a Controladoria-Geral da União realizaram uma operação para investigar supostas irregularidades na aplicação de R$ 97 milhões do Instituto de Previdência dos Servidores Públicos de Maceió em operações financeiras do Banco Master. O banco foi liquidado extrajudicialmente em novembro de 2025, devido a uma grave crise e violação às normas do Sistema Financeiro Nacional.", "titulo_pt": "PF investiga aporte de R$ 97 milhões da previdência de Maceió no Master", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 97439, "titulo": "Transporte interestadual perde 17% das rotas e acirra disputa no setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/transporte-interestadual-perde-17-das-rotas-e-acirra-disputa-no-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O transporte rodoviário interestadual de passageiros perdeu 17% das rotas desde o período pré-pandemia da Covid-19, há aproximadamente oito anos. Essa redução foi baseada em dados da ANTT e estatísticas do mercado.", "titulo_pt": "Transporte rodoviário interestadual perde 17% das rotas e acirra disputa no setor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97441, "titulo": "Nvidia e gigantes de Wall Street negociam pacote de US$ 500 bi para expandir infraestrutura de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/nvidia-e-gigantes-de-wall-street-negociam-pacote-de-us-500-bi-para-expandir-infraestrutura-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T18:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os maiores bancos do mundo estão negociando com a Nvidia para criar um pacote de financiamento de US$ 500 bilhões para o desenvolvimento de infraestrutura de inteligência artificial. Este é uma das iniciativas mais ambiciosas em crédito de Wall Street até agora.", "titulo_pt": "Nvidia e gigantes de Wall Street negociam pacote de US$ 500 bi para expandir infraestrutura de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97442, "titulo": "Expo Center Norte movimenta R$ 2,1 bilhões em São Paulo, estimam entidade e SPTuris", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/expo-center-norte-movimenta-r-21-bilhoes-em-sao-paulo-estimam-entidade-e-spturis.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T18:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Expo Center Norte gerou movimentação econômica de R$ 2,1 bilhões na economia de São Paulo no primeiro semestre deste ano. Isso inclui gastos dos visitantes com alimentação, compras, hospedagem e transporte.", "titulo_pt": "Expo Center Norte injetou R$ 2,1 bi na economia de sp no primeiro semestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 97323, "titulo": "China humanoid robot makers hold 97% of shipments in H1, report says", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/11/2003862265", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com o relatório, as empresas chinesas de robôs humanóides dominaram 97% das exportações no primeiro semestre de 2023. O relatório não fornece detalhes adicionais sobre a participação de outras empresas nesse mercado.", "titulo_pt": "Fabricantes chineses de robôs humanóides detêm 97% das exportações no primeiro semestre, diz relatório", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 97899, "titulo": "Google co-founder Sergey Brin has now spent $100 million to fight the billionaire tax", "url": "https://techcrunch.com/2026/08/10/google-co-founder-sergey-brin-has-now-spent-100-million-to-fight-the-billionaire-tax/", "fonte_id": "techcrunch", "data_pub": "2026-08-10T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sergey Brin, cofundador do Google, gastou $100 milhões para combater a Prop 40, que propõe uma taxa única de 5% sobre o patrimônio líquido dos bilionários da Califórnia.", "titulo_pt": "Co-fundador do google gasta 100 milhões para lutar contra imposto de billionaires na califórnia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 97900, "titulo": "Mark Zuckerberg’s AI manifesto is exactly why people don’t like AI", "url": "https://techcrunch.com/2026/08/10/mark-zuckerbergs-ai-manifesto-is-exactly-why-people-dont-like-ai/", "fonte_id": "techcrunch", "data_pub": "2026-08-10T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mark Zuckerberg publicou um manifesto de 6,500 palavras sobre IA pessoal, focado nas possibilidades das 'superinteligências individuais' que o Meta AI está desenvolvendo.", "titulo_pt": "Manifesto de IA do mark Zuckerberg é exatamente por que as pessoas não gostam de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 97887, "titulo": "AI professors are negotiating the new realities of academic research", "url": "https://www.technologyreview.com/2026/08/10/1141597/ai-professors-are-negotiating-the-new-realities-of-academic-research/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-10T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor viajou cerca de 30 milhas ao sul da cidade de São Francisco para se encontrar com alguns dos mais proeminentes e promissores professores de IA em Mountain View, Califórnia. O encontro visava discutir as novas realidades do pesquisador acadêmico na era da inteligência artificial.", "titulo_pt": "Professores de IA estão negociando as novas realidades da pesquisa acadêmica", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 97884, "titulo": "US court allows thousands of lawsuits against tech firms over social media addiction", "url": "https://www.scmp.com/news/world/united-states-canada/article/3363578/us-court-allows-thousands-lawsuits-against-tech-firms-over-social-media-addiction?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de apelações dos Estados Unidos permitiu que milhares de ações judiciais contra empresas de tecnologia, como Meta Platforms (Facebook), Google e TikTok, avançassem. Essas empresas são acusadas de terem projetado seus produtos para serem viciantes entre os jovens.", "titulo_pt": "Tribunal americano permite prosseguimento de milhares de ações contra empresas de tecnologia por designação viciante de redes sociais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 97902, "titulo": "Aptoide becomes the first rival app store to return to Google Play in the US", "url": "https://techcrunch.com/2026/08/10/aptoide-becomes-the-first-rival-app-store-to-return-to-google-play-in-the-us/", "fonte_id": "techcrunch", "data_pub": "2026-08-10T18:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aptoide reintegrou sua loja de jogos no Google Play após mais de uma década, graças a mudanças judiciais que permitiram o acesso de lojas concorrentes ao Android.", "titulo_pt": "Aptoide retorna como primeira loja de aplicativos rival ao Google Play nos EUA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 97903, "titulo": "Social media platforms still facing thousands of user addiction lawsuits after failed appeals", "url": "https://techcrunch.com/2026/08/10/social-media-platforms-still-facing-thousands-of-user-addiction-lawsuits-after-failed-appeals/", "fonte_id": "techcrunch", "data_pub": "2026-08-10T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Plataformas de mídia social como Meta, TikTok, Snapchat e Google estão enfrentando uma longa batalha judicial por acusações de dependência de usuários. Embora tenham tido apelos negados, as ações legais continuam.", "titulo_pt": "Plataformas de mídia social ainda enfrentam milhares de ações de adicção de usuário após falhas nos recursos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 97904, "titulo": "YouTube now requires creators to have twice as many watch hours to start earning money", "url": "https://techcrunch.com/2026/08/10/youtube-now-requires-creators-to-have-twice-as-many-watch-hours-to-start-earning-money/", "fonte_id": "techcrunch", "data_pub": "2026-08-10T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Criadores que desejam começar a ganhar dinheiro no YouTube precisarão ter pelo menos 8.000 horas de visualizações qualificadas no último ano ou 20 milhões de visualizações qualificadas de Shorts nas últimas 90 dias.", "titulo_pt": "Youtube agora exige que criadores tenham duais o número de horas de visualização para começar a ganhar dinheiro", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 97886, "titulo": "Nvidia to team with Wall Street on US$500 billion package for AI infrastructure projects", "url": "https://www.scmp.com/news/article/3363577/nvidia-team-wall-street-us500-billion-package-ai-infrastructure-projects?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T18:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma série de gigantes do investimento americano, incluindo Apollo Global Management, Blackstone, BlackRock’s Global Infrastructure Partners, Brookfield Asset Management, Goldman Sachs e KKR, estão em negociações com a Nvidia para um pacote de financiamento de US$ 500 bilhões para projetos de infraestrutura de inteligência artificial. O Financial Times relatou que o acordo pode ser anunciado na próxima segunda-feira.", "titulo_pt": "Nvidia se associará a Wall Street em pacote de US$ 500 bilhões para projetos de infraestrutura de IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96892, "titulo": "Inteligencia Artificial parlamentaria: Cámara obligará a diputados y equipos a transparentar uso de IA", "url": "https://www.latercera.com/politica/noticia/inteligencia-artificial-parlamentaria-camara-obligara-a-diputados-y-equipos-a-transparentar-uso-de-ia/", "fonte_id": "la_tercera", "data_pub": "2026-08-10T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O parlamento aprovou um protocolo para declarar o uso de inteligência artificial pelos deputados e seus equipes, utilizando selos de cores: verde para conteúdo sem IA, amarelo para uso parcial, vermelho para uso predominante e azul indicando intervenção humana total.", "titulo_pt": "Inteligência Artificial parlamentar: câmara obligará deputados e equipes a transparentar uso de IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 97122, "titulo": "Wall Street giants partner with Nvidia on $500bn AI financing deal", "url": "https://www.ft.com/content/98a8fd17-15b6-4f67-9cb4-825722b11348?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-10T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grandezas de Wall Street, como Apollo, Blackstone e Goldman Sachs, estão colaborando com a Nvidia para arrecadar capital para o boom das centrais de dados.", "titulo_pt": "Gigantes de wall Street se associam à Nvidia em acordo de financiamento de AI por us$ 500 bilhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 97888, "titulo": "Has Ford got cheap car fever? A $25K crossover is supposedly on the way.", "url": "https://arstechnica.com/cars/2026/08/has-ford-got-cheap-car-fever-allegedly-a-25k-crossover-is-on-the-way/", "fonte_id": "ars_technica", "data_pub": "2026-08-10T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ford estaria desenvolvendo um novo modelo de crossover com tamanho similar ao da Ford Escape, estimado em cerca de R$ 25.000. Os vendedores foram informados sobre a novidade.", "titulo_pt": "Ford teria febre de lançar carros baratos? Novo crossover de r$ 25 mil estaria por vir.", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 97542, "titulo": "Como a geração demitida devido à IA pode ser a próxima a comandar", "url": "https://exame.com/bussola/como-a-geracao-demitida-devido-a-ia-pode-ser-a-proxima-a-comandar/", "fonte_id": "exame", "data_pub": "2026-08-10T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Profissionais desligados devido à adoção de inteligência artificial estão sendo empregados para modernizar empresas tradicionais e da economia convencional. Essa geração, com experiência em tecnologia, está auxiliando na transformação dessas organizações.", "titulo_pt": "Como a geração demitida pela IA pode ser a próxima a comandar", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 97544, "titulo": "Vagas que exigem inteligência artificial disparam no Brasil; veja onde estão as oportunidades", "url": "https://exame.com/inteligencia-artificial/vagas-que-exigem-inteligencia-artificial-disparam-no-brasil-veja-onde-estao-as-oportunidades/", "fonte_id": "exame", "data_pub": "2026-08-10T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registra um aumento na procura por profissionais especializados em inteligência artificial, com empresas alterando as competências necessárias. Vagas relacionadas a essa área estão se expandindo.", "titulo_pt": "Vagas de inteligência artificial crescem no Brasil; confira onde há oportunidades", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 97889, "titulo": "Taylor Farms recalls jalapeño products for Salmonella amid Cyclospora outbreak", "url": "https://arstechnica.com/health/2026/08/taylor-farms-recalls-jalapeno-products-for-salmonella-amid-cyclospora-outbreak/", "fonte_id": "ars_technica", "data_pub": "2026-08-10T16:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taylor Farms está realizando uma recall de produtos à base de jalapeños que se espalhou por 26 estados e envolve varejistas maiores, diversos alimentos. O recall ocorre em meio a uma epidemia de Cyclospora.", "titulo_pt": "Taylor Farms recua produtos com jalapeño por risco de Salmonella durante surto de Cyclospora", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 97545, "titulo": "Fórum no Rio focará em blockchain com reguladores, bancos e empresas", "url": "https://exame.com/future-of-money/forum-no-rio-focara-em-blockchain-com-reguladores-bancos-e-empresas/", "fonte_id": "exame", "data_pub": "2026-08-10T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fórum Blockchain.RIO terá encontros com reguladores, bancos e empresas focados na tecnologia blockchain. O evento marca a abertura de uma semana de debates sobre criptomoedas no Rio de Janeiro, com ênfase na experiência da América Latina.", "titulo_pt": "Fórum no Rio se concentra em blockchain com participantes do setor", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 97318, "titulo": "Taiwan Biobank planning next research phase", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/11/2003862298", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Biobanco de Taiwan está planejando a próxima fase de sua pesquisa, que envolverá coleta e análise de amostras biológicas para estudar a saúde da população taiwanesa.", "titulo_pt": "Plano para próxima fase do biobanco de taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 97907, "titulo": "The sediment story: A journey that impacts India's rivers and surrounding landscapes", "url": "https://phys.org/news/2026-08-sediment-story-journey-impacts-india.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada monção, os rios da Índia ficam esverdeados. Contidos na água suja estão nutrientes que formam planaltos férteis, criam ilhas fluviais, nutrem deltas e moldam costaças.", "titulo_pt": "A história do sedimento: uma jornada que afeta rios e paisagens circundantes da Índia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97909, "titulo": "Water quality, not just scarcity, may shape future competition for a limited resource", "url": "https://phys.org/news/2026-08-quality-scarcity-future-competition-limited.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade da água, não apenas a escassez, pode influenciar futuros conflitos por um recurso limitado. As baixas níveis nas rios europeus este verão refletem o impacto do aquecimento global na disponibilidade hídrica.", "titulo_pt": "Qualidade da água, não só a escassez, podem moldar futuras disputas pelo recurso limitado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97476, "titulo": "Agrupamento de grandes terremotos no mundo é fruto do acaso, diz cientista", "url": "https://veja.abril.com.br/ciencia/agrupamento-de-grandes-terremotos-no-mundo-e-fruto-do-acaso-diz-cientista/", "fonte_id": "veja", "data_pub": "2026-08-10T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Susanne Maciel, professora de pós-graduação em Geociências da UnB, avaliou que agrupamentos de grandes terremotos no mundo são resultado do acaso.", "titulo_pt": "Agrupamento de grandes terremotos no mundo é fruto do acaso, diz cientista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 97910, "titulo": "Common carp relatives blunt koi herpesvirus infections, offering clues to outbreak control", "url": "https://phys.org/news/2026-08-common-carp-blunt-koi-herpesvirus.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A carpola é uma das espécies de peixes de água doce mais cultivadas no mundo, fornecendo alimentos e sustento para milhões de pessoas. No entanto, ela enfrenta um perigo significativo em razão de um vírus altamente contagioso que pode causar surtos devastadores e exterminar populações inteiras rapidamente.", "titulo_pt": "Parentes da carpola reduzem infecções pelo herpesvírus do koi, oferecendo pistas para o controle de surtos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97911, "titulo": "Photosynthetic microorganisms achieve long-lasting and renewable chemical production", "url": "https://phys.org/news/2026-08-photosynthetic-microorganisms-renewable-chemical-production.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microorganismos fotossintéticos podem converter dióxido de carbono em compostos úteis usando energia luminosa sob condições suaves e compatíveis com o ambiente. No entanto, muitos sistemas atuais de produção fotossintética dependem de células crescendo livremente em grandes volumes líquidos, criando uma demanda significativa por água e exigindo mistura extensa para manter as células distribuídas uniformemente e expostas à luz.", "titulo_pt": "Microorganismos fotossintéticos alcançam produção química duradoura e renovável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97815, "titulo": "Trump signs executive order to split up MMR vaccine", "url": "https://www.axios.com/2026/08/10/trump-order-split-up-mmr-vaccine", "fonte_id": "axios", "data_pub": "2026-08-10T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump assinou um decreto executivo pedindo a redução do número de vacinações infantis, sugerindo o uso de três injeções separadas para o vacina MMR em vez de uma dose combinada. Além disso, ele quer que todas as vacinas infantis sejam administradas em consultas médicas separadas.", "titulo_pt": "Trump assina ordem executiva para dividir vacina MMR", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 97942, "titulo": "Rocket Lab builds deployable infrastructure for Electron launches", "url": "https://spacenews.com/rocket-lab-builds-deployable-infrastructure-for-electron-launches/", "fonte_id": "spacenews", "data_pub": "2026-08-10T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rocket Lab desenvolveu uma infraestrutura móvel chamada 'GHOST' para apoiar lançamentos orbital e suborbital do foguete Electron. Este containerizado sistema foi projetado para facilitar operações de lançamento.", "titulo_pt": "Rocket Lab constrói infraestrutura desmontável para lançamentos do Electron", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 97912, "titulo": "Uncovering how Cryptococcus shifts from silent infection to killer fungus", "url": "https://phys.org/news/2026-08-uncovering-cryptococcus-shifts-silent-infection.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cryptococcus é geralmente inofensivo para pessoas saudáveis, permanecendo inativo no sistema imunológico. No entanto, em indivíduos com sistemas imunológicos comprometidos, como pacientes com câncer em tratamento com quimioterapia, transplantados de órgãos, portadores do HIV ou consumidores de medicamentos imunosupressores para doenças autoimunes, o fungo pode ativar-se e se espalhar para o cérebro, causando meningite.", "titulo_pt": "Desvendando como Cryptococcus muda de infecção silenciosa a fungo letal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97913, "titulo": "Rocket debris crashed into the moon—why this could threaten future lunar bases", "url": "https://phys.org/news/2026-08-rocket-debris-moon-threaten-future.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No início da madrugada de quarta-feira, 5 de agosto, os restos do estágio superior de um foguete Falcon 9 colidiram com a lua em uma colisão não controlada.", "titulo_pt": "Fragmentos de foguete atingiram a lua—por que isso pode ameaçar futuras bases lunares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97914, "titulo": "Fermentation emerges as key pathway for ammonium production beneath the Pearl River Delta", "url": "https://phys.org/news/2026-08-fermentation-emerges-key-pathway-ammonium.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado por professores Jimmy Jiujiu Jiao e Meng Li identificou a fermentação microbiana como o principal caminho para a produção de amônio nos sedimentos sob a Delta do Rio Pearl, explicando os níveis excepcionalmente altos de amônio na água subterrânea da região.", "titulo_pt": "Fermentação emerge como principal caminho para produção de amônio sob a Delta do rio Pearl", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97506, "titulo": "Dieta rica em batata pode ter moldado DNA de povos indígenas andinos", "url": "https://www.metropoles.com/saude/dieta-rica-em-batata-dna-indigenas", "fonte_id": "metropoles", "data_pub": "2026-08-10T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo descobriu uma adaptação genética relacionada à digestão do amido que se fortaleceu há aproximadamente 10 mil anos. Essa adaptação está associada a uma dieta rica em batata, comum entre os povos indígenas andinos.", "titulo_pt": "Dieta rica em batata pode ter moldado DNA de povos indígenas andinos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 97561, "titulo": "Estudantes criam carro elétrico que gera mais energia do que consome", "url": "https://www.cnnbrasil.com.br/auto/estudantes-criam-carro-eletrico-que-gera-mais-energia-do-que-consome/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes desenvolveram um carro elétrico que gera mais energia do que consome, utilizando painéis solares. O projeto foi realizado em colaboração com a BMW e visa garantir autonomia para deslocamentos urbanos.", "titulo_pt": "Estudantes criam carro elétrico que gera mais energia do que consome", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 97915, "titulo": "Mars could have carried liquid water more recently than we thought", "url": "https://phys.org/news/2026-08-mars-liquid-thought.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos têm suposto que a superfície de Marte congelou há cerca de 3 bilhões de anos e permaneceu assim desde então. Se isso fosse verdade, qualquer água líquida teria se esgotado ou evaporado há muito tempo.", "titulo_pt": "Marte poderia ter mantido água líquida mais recentemente do que pensávamos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 97943, "titulo": "Kepler books Neutron for 2028 optical relay launch", "url": "https://spacenews.com/kepler-books-neutron-for-2028-optical-relay-launch/", "fonte_id": "spacenews", "data_pub": "2026-08-10T20:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Kepler Communications planeja lançar satélites de relé óptico na próxima geração no foguetão Neutron da Rocket Lab, em uma das várias missões programadas para 2028.", "titulo_pt": "Kepler agendou lançamento de relés ópticos com o Neutron em 2028", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 97932, "titulo": "Scientists are using AI to design new viruses. Should they be?", "url": "https://www.scientificamerican.com/article/scientists-are-using-ai-to-design-new-viruses-should-they-be/", "fonte_id": "scientific_american", "data_pub": "2026-08-10T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estão utilizando inteligência artificial para projetar novos vírus, mas a regulação ainda não acompanha essa pesquisa avançada. Estudos sobre biologia projetada por IA estão progredindo mais rapidamente do que as medidas regulatórias.", "titulo_pt": "Cientistas usam AI para projetar novos vírus: devemos permitir?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 97950, "titulo": "Divers Stumble Upon 2,000-Year-Old Roman Shipwreck in Italy", "url": "https://hyperallergic.com/divers-stumble-upon-2-000-year-old-roman-shipwreck-in-italy/", "fonte_id": "hyperallergic", "data_pub": "2026-08-10T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um naufrágio romano de 2.000 anos foi descoberto na costa da Itália, repleto de vasos de barro, e está sendo considerado uma das mais importantes descobertas arqueológicas subaquáticas recentes.", "titulo_pt": "Divers descobrem naufrágio romano de 2.000 anos na costa da Itália", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 97964, "titulo": "A 639-Year-Long John Cage Performance Had Its First Chord Change In Two Years", "url": "https://www.artforum.com/news/639-year-john-cage-piece-first-chord-change-in-900-days-1234756726/", "fonte_id": "artforum", "data_pub": "2026-08-10T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 5 de agosto, ocorreu o primeiro acorde alterado após dois anos na performance musical que tem durado 639 anos e está sendo realizada na Igreja St. Burchardi em Halberstadt, Alemanha. A performance apresenta a composição 'Organ² / ASLSP – As Slow as Possible' de John Cage.", "titulo_pt": "Performance musical de 639 anos experimentou seu primeiro acorde em dois anos", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 97451, "titulo": "Festival de Cinema de Brasília é cancelado por falta de repasses de verba", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/festival-de-cinema-de-brasilia-e-cancelado-por-falta-de-repasses-de-verba.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-10T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 59ª edição do Festival de Brasília do Cinema Brasileiro foi cancelada por falta de recursos, devido ao ajuste fiscal realizado pelo governo do Distrito Federal para salvar o BRB, em crise após escândalo financeiro.", "titulo_pt": "Festival de Cinema de Brasília é cancelado por falta de verba", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 97956, "titulo": "Could ‘Spider-Man: Brand New Day’ Be the First Film to Surpass $1 Billion Domestic?", "url": "https://www.indiewire.com/news/box-office/could-spider-man-brand-new-day-surpass-1-billion-domestic-1235209822/", "fonte_id": "indiewire", "data_pub": "2026-08-10T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme já ultrapassou os $655 milhões de bilheteria doméstica e arrecadou cerca de $1,67 bilhões mundialmente.", "titulo_pt": "Poderia 'Spider-Man: brand New Day' ser o primeiro filme a supera $1 bilhão doméstico?", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 97651, "titulo": "Vuelve el Campeonato Mundial del Alfajor: cuándo y dónde es, cuánto salen las entradas y cómo comprarlas", "url": "https://www.lanacion.com.ar/que-sale/el-fin-de-semana-largo-de-agosto-vuelve-el-campeonato-mundial-del-alfajor-donde-es-cuanto-salen-las-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T21:20:00Z", "idioma": "es", "provavel_duplicat  "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As águas do mundo registraram a temperatura mais alta para o mês de julho desde que os registros começaram. O recorde foi alcançado durante o mês passado, refletindo um aquecimento global crescente.", "titulo_pt": "Mares globais atingem temperatura recorde em julho", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 97843, "titulo": "Europe braces for another heatwave after record-breaking temperatures", "url": "https://www.aljazeera.com/news/2026/8/10/europe-braces-for-another-heatwave-after-record-breaking-temperatures?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Exames de calor extremo foram emitidos na Grã-Bretanha e França, com previsões de temperaturas chegando a 35 graus Celsius nesta semana.", "titulo_pt": "Europa se prepara para outra onda de calor após registros de temperatura recordes", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 97553, "titulo": "BH registra segundo incêndio após 10 dias na região da Serra do Gandarela", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/mg/bh-registra-segundo-incendio-apos-10-dias-na-regiao-da-serra-do-gandarela/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ocorrência de incêndio na região da Serra do Gandarela mobilizou 19 bombeiros e brigadistas. As chamas avançam em direção às copas das árvores.", "titulo_pt": "BH registra segundo incêndio após 10 dias na região da Serra do Gandarela", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 97844, "titulo": "Wildfires burn across Indonesia as officials cite El Nino as a cause", "url": "https://www.aljazeera.com/news/2026/8/10/wildfires-burn-across-indonesia-as-officials-cite-el-nino-as-a-cause?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de bombeiros e várias helicópteros estão lutando contra incêndios florestais que se alastram por toda a Indonésia. O El Niño é citado como uma das causas pelos órgãos governamentais.", "titulo_pt": "Incêndios florestais assolam a indonésia com El niño apontado como causa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 97825, "titulo": "UK government declares drought in 'almost three-quarters' of England", "url": "https://www.lemonde.fr/en/environment/article/2026/08/10/uk-government-declares-drought-in-almost-three-quarters-of-england_6756351_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-10T18:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Reino Unido declarou um estado de seca em aproximadamente 71,3% da Inglaterra após o mês de julho ser o mais seco registrado no país. Nenhuma região do Reino Unido relata uma situação normal em relação aos recursos hídricos.", "titulo_pt": "Governo do reino unido declara estado de seca em quase três quartos da inglaterra", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 96794, "titulo": "“Tengo placas solares en casa; consumo 1800 Wh al día y con seis horas de sol una sola placa cubre mis necesidades”", "url": "https://www.lanacion.com.ar/lifestyle/tengo-placas-solares-en-casa-consumo-1800-wh-al-dia-y-con-seis-horas-de-sol-una-sola-placa-cubre-mis-nid07082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T17:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Íker mostrou que é possível viver de forma alternativa, utilizando placas solares para abastecer suas necessidades diárias. Ele consome 1800 Wh por dia e com apenas seis horas de sol, uma única placa solar já atende às suas demandas.", "titulo_pt": "Tenho placas solares em casa; consumo 1800 Wh ao dia e com seis horas de sol uma só placa abastece minhas necessidades", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96911, "titulo": "More than 70 dead and buildings collapsed after 7.4-magnitude earthquake shakes Colombia – latest news", "url": "https://www.theguardian.com/world/live/2026/aug/10/74-magnitude-earthquake-shakes-colombia-causing-serious-damage-latest-news", "fonte_id": "guardian_world", "data_pub": "2026-08-10T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 70 pessoas morreram e mais de duas dúzias de edifícios caíram após um terremoto de magnitude 7,4 na Colômbia. Em Cali, uma das maiores cidades do país, o prefeito Alejandro Eder informou que estruturas continuam colapsadas e pessoas estão presas.", "titulo_pt": "Mais de 70 mortos e prédios colapsados após terremoto de magnitude 7,4 na colômbia - notícias atualizadas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 96632, "titulo": "Colômbia declara “desastre nacional” após terremoto de magnitude 7,4", "url": "https://www.cnnbrasil.com.br/internacional/colombia-declara-desastre-nacional-apos-terremoto-de-magnitude-74/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Colômbia declarou 'desastre nacional' após um terremoto de magnitude 7,4 que deixou mais de 70 mortos em várias regiões do país. A medida visa agilizar os esforços de socorro e avaliação dos danos causados pelo tremor.", "titulo_pt": "Colômbia declara 'desastre nacional' após terremoto de magnitude 7,4", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 97171, "titulo": "Drought declared in ‘almost three-quarters’ of England, government says", "url": "https://www.scmp.com/news/world/europe/article/3363575/drought-declared-almost-three-quarters-england-government-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "71,3% de Inglaterra está em estado de seca, segundo o governo do Reino Unido. O país registrou seu julho mais seco na história e uma quinta onda de calor está prevista para a semana próxima, levando a níveis baixos nos rios e preocupações com possíveis escassezes alimentares.", "titulo_pt": "Quase três quartos de inglaterra estão em estado de seca, diz governo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96774, "titulo": "Florida crea un corredor marino para proteger sus costas: el ambicioso proyecto que busca recuperar arrecifes, manglares y otras especies", "url": "https://www.clarin.com/estados-unidos/florida-crea-corredor-marino-proteger-costas-ambicioso-proyecto-busca-recuperar-arrecifes-manglares-especies_0_wEBJBRt6lX.html", "fonte_id": "clarin", "data_pub": "2026-08-10T17:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Flórida está implementando um corredor marinho que conectará projetos de conservação ao longo das costas do Atlântico e do Golfo de México, incluindo arrecifes artificiais, restauração de bancos de ostras e recuperação de pastos marinhos. O objetivo é proteger a biodiversidade e aumentar a resistência frente a fenômenos extremos.", "titulo_pt": "Flórida cria corredor marinho para proteger suas costas: projeto ambicioso busca recuperar arrecifes, manguezais e outras espécies", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 96769, "titulo": "Sarampo volta a acender alerta no Brasil: quem precisa se vacinar? Veja perguntas e respostas sobre a doença", "url": "https://www.bbc.com/portuguese/articles/cm2g4kmvpxjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-10T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sarampo tem voltado a circular no Brasil, com aumento de casos em São Paulo e surtos na região das Américas. Especialistas explicam sobre os grupos que devem se vacinar e as razões para o ce to strengthen whistleblower protections following investigative authority reform", "url": "https://www.koreaherald.com/article/10836507", "fonte_id": "korea_herald", "data_pub": "2026-08-10T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Polícia da Coreia anunciou que vai fortalecer as medidas para incentivar denúncias e proteger os informantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia. O objetivo é reforçar o controle interno e aumentar a confiança dos policiais em relatar irregularidades.", "titulo_pt": "Polícia coreana vai fortalecer proteção a denunciantes após reforma", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 96263, "titulo": "De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas", "url": "https://www.jota.info/opiniao-e-analise/artigos/de-tabu-individual-a-dever-coletivo-o-direito-a-dignidade-menstrual-de-meninas", "fonte_id": "jota", "data_pub": "2026-08-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de políticas e debates contribui para a naturalização do sofrimento de meninas e mulheres em relação ao direito à dignidade menstrual. O título traduzido é: 'De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas.'", "titulo_pt": "De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96201, "titulo": "Encontraron ocho cuerpos desmembrados en una mina ilegal de oro en Ecuador", "url": "https://www.lanacion.com.ar/el-mundo/encontraron-ocho-cuerpos-desmembrados-en-una-mina-ilegal-de-oro-en-ecuador-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T06:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Oito corpos desmembrados foram encontrados em duas fossas, a cerca de dois metros de profundidade, em uma mina ilegal de ouro no Equad function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
