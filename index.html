<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "09/10/2026 19:16", "stats": {"noticias_novas": 569, "resumos_gerados": 238}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A Polícia Federal negou a existência de um suposto depoimento em que o ex-banqueiro Daniel Vorcaro teria fornecido dinheiro para financiar um documentário sobre o presidente Luiz Inácio Lula da Silva, conforme relatado pela revista Veja. Durante o segundo turno das eleições, a campanha de Lula se concentrará em Minas Gerais, São Paulo e Rio de Janeiro. O senador Flávio Bolsonaro lidera com 49% das intenções de voto no segundo turno no Distrito Federal, enquanto Lula tem 43%, segundo a pesquisa Datafolha. Cerca de 78% dos brasileiros consideram muito importante que Flávio e Lula participem de debates no segundo turno da eleição presidencial. O presidente do Supremo Tribunal Federal, Edson Fachin, indicou que vai arquivar definitivamente o inquérito das fake news, que completou 7 anos em março. O grupo Lide, liderado pelo empresário João Doria, realizará um almoço para cerca de 400 empresários com o candidato à Presidência Flávio Bolsonaro no dia 19, no hotel W, em São Paulo, nove dias antes das eleições.", "mundo": "Um terremoto de magnitude 7,7 ocorreu no Panamá, causando danos a edifícios e levando autoridades a emitirem alertas de tsunami para países vizinhos. Em meio a tensões geopolíticas, Donald Trump anunciou um acordo com Vladimir Putin permitindo que a Rússia venda diesel para os Estados Unidos e mercados globais, o que enfureceu a Ucrânia. O presidente ucraniano, Volodymyr Zelensky, criticou a decisão, chamando-a de indecente e desonesta. No âmbito interno, Katie Zacharia foi escolhida para ser a nova secretária de imprensa da Casa Branca, substituindo Karoline Leavitt. Além disso, o presidente dos Estados Unidos impôs sanções ao Tribunal Penal Internacional em resposta à premiação do ex-juiz Navi Pillay com o Prêmio Nobel da Paz.\n\nO risco de guerra na região do Estreito de Taiwan foi reduzido por um oficial dos Estados Unidos, que indicou uma percepção de tensão excessiva na área. Em outro front, o furacão Isaias se aproxima da costa do Golfo dos Estados Unidos, levando a evacuações obrigatórias e alertas sobre a ameaça de ondas de maremotão e inundações. No Oriente Médio, a coalisão liderada por Arábia Saudita lançou uma operação abrangente contra os hutitas no Iêmen, destruindo 136 alvos militares. Além disso, o presidente dos Estados Unidos, Donald Trump, anunciou um acordo com a Rússia para fornecimento de diesel, em meio a altos preços de combustível no país, devido à guerra com o Irã. Vários aliados dos Estados Unidos, incluindo Canadá, Japão e a ONU, apelaram para 'defender' e 'proteger' o TPIU após a decisão de Washington de sancionar o órgão judicial. No Iêmen, dois ataques aéreos sauditas no aeroporto de Sanaa resultaram em mortes, enquanto o Tribunal Penal Internacional reagiu às sanções impostas pelos Estados Unidos, considerando-as uma agressão ao direito internacional.", "economia": "A economia global enfrenta diversos desafios, incluindo a reação positiva de GlobalFoundries após fechar um acordo de US$2 bilhões com TSMC. O presidente dos Estados Unidos, Donald Trump, anunciou um acordo com o presidente russo, Vladimir Putin, para a exportação de mais de 300.000 toneladas de diesel russo ao mercado global e americano, com o objetivo de conter os preços dos combustíveis antes das eleições legislativas americanas. O Brasil enfrenta uma desaceleração do PIB em 2026 e 2027, conforme a Unctad, devido à inflação e juros elevados, mas o consumo das famílias e as exportações agrícolas devem continuar a sustentar a atividade. O Banco Central informou que, em setembro, os brasileiros retiraram R$ 9,3 bilhões da poupança, enquanto a empresa australiana de data centers apoiada pela Nvidia desistiu de uma oferta pública inicial de US$ 5 bilhões, indicando uma crescente cautela dos investidores em relação às altas avaliações de empresas de inteligência artificial.", "tecnologia": "A OpenAI espera gerar uma receita anual de US$70 bilhões, o que levanta preocupações sobre uma avaliação exagerada e volatilidade nos mercados acionários, conforme relatou a Financial Times. A empresa TypeSafe AI, que desenvolve modelos de inteligência artificial não-texto, foi avaliada em 7,5 bilhões de dólares após uma rodada de financiamento de 870 milhões de dólares, liderada pela a16z, apenas algumas semanas após o lançamento, informou o TechCrunch. A Tesla renomeou sua função 'Full Self-Driving' para 'Assisted Driving' na Europa em resposta a críticas, conforme noticiou o Wired. Além disso, a Nikon desqualificou o vídeo vencedor de sua competição Small World in Motion por não cumprir as regras relacionadas à inteligência artificial gerativa, conforme relatou o The Verge.", "ciencia": "Um terremoto de magnitude significativa atingiu Panamá, levantando preocupações sobre possíveis réplicas fortes. De acordo com a PAHO, o risco de propagação da rubéola está alto antes das grandes reuniões religiosas na América. Uma série de estudos científicos em áreas como biotecnologia, astrofísica, ecologia e inteligência artificial foram publicados, destacando avanços em nanotecnologia, conservação ambiental, detecção de câncer e segurança cibernética. Além disso, a NASA anunciou um chamamento para propostas de novas estações espaciais comerciais, enquanto pesquisas sobre buracos negros e asteroides revelam novas compreensões sobre a estrutura do universo.", "cultura": "O Dia Nacional de Taiwan foi comemorado em várias embaixadas e consulados estrangeiros, onde foi exibida uma grande bandeira do país. O artigo 'Celebrando Taiwan' destaca a rica cultura e história do país, enfatizando seus aspectos únicos. A atriz Elisabeth Moss e a atriz Kate Hudson são as protagonistas do suspense 'Segredo Obscuro', dirigido por Max Minghella, que está disponível para ser assistido na televisão e no streaming no próximo sábado. Além disso, a atriz Evelyn Castro assinou um contrato com a Globo para participar da continuação de 'Avenida Brasil', intitulada 'Avenida Brasil 2', enquanto a atriz Lívia Silva prepara um grande choque para a personagem Dalila em 'Por Você', que envolve um segredo familiar. O filme 'Cabeças Cortadas', de Glauber Rocha, está sendo restaurado digitalmente e será exibido no Festival Lumière em Lyon, França, em outubro de 2026, após um período de ostracismo.", "sociedade": "Um homem armado invadiu uma escola infantil em Curitiba, fazendo as crianças reféns, levando a uma situação de alta tensão no local. O caso ocorreu na escola infantil Centro Municipal de Educação Infantil São Braz e chama a atenção para a segurança e a necessidade de medidas preventivas em estabelecimentos educacionais. Em outro evento, a Polônia registrou a prisão de jovens por ameaças relacionadas a ataques escolares, refletindo crescentes preocupações sobre violência nas escolas. No âmbito social, o Brasil assistiu a um aumento significativo na procura por atendimento psiquiátrico, com o projeto Sabará prevendo um investimento de R$ 10 milhões, mas limitado por incertezas sobre pagamentos de planos de saúde. O Instituto Nacional do Seguro Social (INSS) começou a pagar auxílio para mulheres vítimas de violência doméstica, disponibilizando o benefício para aquelas que tenham sido afastadas do trabalho por medida judicial. Em um contexto mais amplo, a Filipinas busca liderar a luta contra o trabalho infantil na região do Sudeste Asiático, apesar de desafios políticos e sociais, enquanto a França enfrenta protestos estudantis marcados por episódios de violência policial, incluindo relatos de feridos.", "meio_ambiente": "O Chile emitiu um alerta vermelho após um deslizamento de terra em Santiago, causando danos a casas e veículos. As chuvas estão ligadas ao fenômeno El Niño. Estudantes inspirados por uma exposição de fotografia transformaram lãs que seriam descartadas em uma manta gigante, que cobriu uma geleira, reduzindo em 50% o derretimento da geleira. Isso visa preservar a neve durante o verão. Em outro desenvolvimento, fortes chuvas causaram alagamentos severos na capital, ferindo seis pessoas e levando alguns carros embora. O Chile também decretou um estado de catástrofe devido aos alagamentos.", "direitos_humanos": "Navi Pillay, jurista sul-africana, foi premiada com o Prêmio Nobel da Paz em 2026 por seus esforços em promover a paz e o direito internacional. Sua atuação como Alta Comissária das Nações Unidas para os Direitos Humanos e sua luta contra crimes internacionais foram destacadas. Inicialmente, ela achou a notícia uma piada, mas confirmou a informação. Em contraste, a Arábia Saudita e o governo reconhecido de Yemen pediram à ONU que tomasse medidas contra os hutitas, acusando-os de ataques a civis e recrutamento de soldados menores de idade. Além disso, novos casos de agressões, overdose e incêndios foram relatados em centros de detenção imigratória australianos, levantando questionamentos sobre a segurança e o cumprimento das leis que protegem os detidos."}, "resumo_do_dia": {"politica_nacional": [{"id": 206312, "titulo": "PF nega existência de depoimento envolvendo Vorcaro e Lula", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/pf-nega-existencia-de-depoimento-envolvendo-vorcaro-e-lula", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-09T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal negou a existência de um suposto depoimento no qual o ex-banqueiro Daniel Vorcaro teria fornecido dinheiro para financiar um documentário sobre o presidente Luiz Inácio Lula da Silva, conforme relatado pela revista Veja.", "titulo_pt": "PF nega depoimento de Vorcaro sobre financiamento de documentário para Lula", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 206328, "titulo": "Alcolumbre pauta votação de PEC que prevê fim da escala 6 x 1 para a próxima quarta-feira", "url": "https://g1.globo.com/politica/noticia/2026/10/09/alcolumbre-pauta-votacao-de-pec-que-preve-fim-da-escala-6-x-1-para-a-proxima-quarta-feira.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, anunciou que a proposta de emenda à Constituição para o fim da escala 6 x 1 será votada na próxima quarta-feira (14).", "titulo_pt": "Alcolumbre agendará votação de PEC que acaba com escala 6 x 1 para próxima quarta-feira", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 206347, "titulo": "Fachin nega acesso imediato a Fux e indica arquivamento definitivo do inquérito das fake news", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/fachin-nega-acesso-imediato-a-fux-e-indica-arquivamento-definitivo-do-inquerito-das-fake-news.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, indicou que vai arquivar definitivamente o inquérito das fake news, que estava sob a relatoria do ministro Alexandre de Moraes. O inquérito completou 7 anos em março e tem sido objeto de controvérsias desde sua criação.", "titulo_pt": "Fachin indica arquivamento definitivo do inquérito das fake news", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206348, "titulo": "Datafolha: 13% citam desinteresse como motivo para abstenção no 1º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-13-citam-desinteresse-como-motivo-para-abstencao-no-1o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A abstenção no primeiro turno das eleições deste ano atingiu 21,08%, com mais de 33 milhões de pessoas que não votaram. Uma nova pesquisa Datafolha apontou que 13% dos não votantes citaram desinteresse como motivo para a abstenção.", "titulo_pt": "13% Dos não votantes no 1º turno citam desinteresse como motivo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206349, "titulo": "Datafolha: 78% consideram muito importante que Flávio e Lula participem de debates no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-78-consideram-muito-importante-que-flavio-e-lula-participem-de-debates-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa do Datafolha indica que 78% dos brasileiros consideram muito importante que Flávio Bolsonaro e Lula participem dos debates no segundo turno da eleição presidencial.", "titulo_pt": "78% Consideram muito importante que Flávio e Lula participem de debates no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206329, "titulo": "Ibaneis agiu de forma direta para expandir BRB e validar tentativa de compra do Master, diz PF", "url": "https://g1.globo.com/df/distrito-federal/noticia/2026/10/09/ibaneis-agiu-de-forma-direta-para-expandir-brb-e-validar-tentativa-de-compra-do-master-diz-pf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novos relatórios da Polícia Federal ao Supremo Tribunal Federal indicam que o ex-governador do Distrito Federal Ibaneis Rocha atuou diretamente na estratégia financeira do Banco de Brasília (BRB) para tentar comprar o Banco Master, entre 2024 e 2025. Segundo os documentos, Ibaneis não se limitou ao exercício regular de suas prerrogativas.", "titulo_pt": "Ibaneis atuou diretamente para expandir BRB e validar compra do Master, diz PF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 206443, "titulo": "Veja quanto a gasolina deve ficar mais barata após intervenção do governo", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/meu-dinheiro/veja-quanto-a-gasolina-deve-ficar-mais-barata-apos-intervencao-do-governo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo implementou uma desoneração que deve reduzir até R$ 0,26 no preço médio dos combustíveis.", "titulo_pt": "Veja quanto a gasolina deve ficar mais barata após intervenção do governo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206480, "titulo": "Campanha de Lula priorizará agendas em MG, SP e Rio no 2º turno", "url": "https://www.metropoles.com/brasil/campanha-de-lula-priorizara-agendas-em-mg-sp-e-rio-no-2o-turno", "fonte_id": "metropoles", "data_pub": "2026-10-09T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula planeja priorizar agendas em Minas Gerais, São Paulo e Rio de Janeiro no segundo turno das eleições. Além disso, a campanha afirmou que Lula participará de pelo menos três debates antes do segundo turno.", "titulo_pt": "Campanha de Lula priorizará agendas em MG, SP e Rio no 2º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 206447, "titulo": "Análise: Decisão de Luiz Fux amplia tensão no Supremo", "url": "https://www.cnnbrasil.com.br/politica/analise-decisao-de-luiz-fux-amplia-tensao-no-supremo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Luiz Fux solicitou acesso a processos sigilosos contra Bolsonaro, o que pode afetar a condenação do presidente por tentativa de golpe. Essa decisão aumenta a tensão no Supremo Tribunal Federal.", "titulo_pt": "Análise: decisão de Luiz Fux amplia tensão no Supremo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206351, "titulo": "Novo porta-voz da campanha promete viagens, contato com imprensa e Lula em debates", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/10/novo-porta-voz-da-campanha-promete-viagens-contato-com-imprensa-e-lula-em-debates.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Camilo Santana, novo porta-voz da campanha de Lula, promete intensificar contatos com a imprensa e viagens do presidente pelo Nordeste, além de presença dele em debates.", "titulo_pt": "Novo porta-voz da campanha promete viagens, contato com imprensa e Lula em debates", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 206448, "titulo": "Petrobras vê Belém como base de apoio a possível polo petrolífero no Amapá", "url": "https://www.cnnbrasil.com.br/infra/petrobras-ve-belem-como-base-de-apoio-a-possivel-polo-petrolifero-no-amapa/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras considera Belém como base para potencial desenvolvimento de um polo petrolífero no Amapá. A presidente da estatal, Magda Chambriard, destaca a necessidade de melhorar a logística no Pará e que a viabilidade comercial das descobertas depende de novas perfurações.", "titulo_pt": "Petrobras vê Belém como base para possível polo petrolífero no Amapá", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206334, "titulo": "Conta conjunta evita inventário no Brasil?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/conta-conjunta-evita-inventario-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Colocar um filho ou cônjuge como cotitular de uma conta bancária é uma prática comum no Brasil, facilitando pagamentos e a administração do dinheiro. No entanto, essa prática pode esconder problemas de sucessão, pois a morte de um titular pode exigir um inventário.", "titulo_pt": "Conta conjunta e sucessão no Brasil: uma prática comum com implicações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206331, "titulo": "Fachin nega acesso imediato de Fux a inquérito das fake news e diz que caso segue para arquivamento definitivo", "url": "https://g1.globo.com/politica/noticia/2026/10/09/fachin-fux-fake-news.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal (STF), Edson Fachin, negou o acesso imediato do ministro Luiz Fux ao inquérito das fake news, afirmando que ainda há procedimentos pendentes. O inquérito deve seguir para arquivamento após a análise desses procedimentos.", "titulo_pt": "Fachin nega acesso imediato de Fux ao inquérito das fake news e diz que caso segue para arquivamento definitivo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Datafolha: Flávio lidera com 49% no segundo turno no DF; Lula soma 43%", "sumario": "A pesquisa Datafolha indica que Flávio lidera com 49% dos votos no segundo turno no Distrito Federal, enquanto Lula tem 43%. Uma pesquisa Datafolha divulgada no Distrito Federal indica que Flávio Bolsonaro lidera com 49% das intenções de voto, enquanto Lula tem 43%. O senador Flávio Bolsonaro lidera com 54% das intenções de votos válidos no segundo turno da eleição presidencial no Distrito Federal, contra 46% do presidente Lula, que tenta a reeleição.", "artigos": [{"id": 206469, "titulo": "Datafolha: no DF, Flávio lidera com 49% no segundo turno; Lula soma 43%", "url": "https://www.metropoles.com/distrito-federal/datafolha-no-df-flavio-lidera-com-49-no-segundo-turno-lula-soma-43", "fonte_id": "metropoles", "data_pub": "2026-10-09T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que Flávio lidera com 49% dos votos no segundo turno no Distrito Federal, enquanto Lula tem 43%. 6% dos eleitores pretendem votar em branco ou nulo e 2% ainda não se decidiram.", "titulo_pt": "Datafolha: Flávio lidera com 49% no segundo turno no DF; Lula soma 43%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 206330, "titulo": "Datafolha no DF, 2º turno: Flávio Bolsonaro, 49%; Lula, 43%", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/10/09/datafolha-df-presidente-segundo-turno-8-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-09T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Datafolha divulgada no Distrito Federal indica que Flávio Bolsonaro lidera com 49% das intenções de voto, enquanto Lula tem 43%. Este é o primeiro levantamento após o segundo turno entre os dois ser confirmado.", "titulo_pt": "Datafolha no DF, 2º turno: flávio Bolsonaro, 49%; Lula, 43%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 206350, "titulo": "Datafolha: No Distrito Federal, Flávio tem 54%, e Lula, 46% em votos válidos no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-no-distrito-federal-flavio-tem-54-e-lula-46-em-votos-validos-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-09T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro lidera com 54% das intenções de votos válidos no segundo turno da eleição presidencial no Distrito Federal, contra 46% do presidente Lula, que tenta a reeleição.", "titulo_pt": "Flávio bolsonaro lidera com 54% e Lula com 46% em votos válidos no 2º turno no Distrito Federal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 206057, "titulo": "Strait war risk exaggerated: US official", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/10/2003865713", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial dos Estados Unidos afirmou que o risco de guerra na região do Estreito de Taiwan foi exagerado. O comentário sugere que há uma percepção de tensão excessiva na área, mas não fornece detalhes adicionais sobre a natureza ou a origem dessas preocupações.", "titulo_pt": "Risco de guerra no estreito de taiwan exagerado, diz oficial dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206725, "titulo": "Three men found guilty of murdering two Australian surfer brothers and US friend", "url": "https://www.bbc.co.uk/news/articles/cj5ynwnye009o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T21:55:00Z", "idioma": "en", "provavel_duplicata_de": 206652, "texto_pt": "Três homens foram condenados pelo assassinato de dois irmãos australianos de surfe e seu amigo americano. Os corpos de Jake, Callum Robinson e Carter Rhoad foram encontrados no fundo de uma poça.", "titulo_pt": "Três homens condenados pelo assassinato de dois irmãos australianos de surfe e seu amigo americano", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 206722, "titulo": "Trump announces deal for Russian diesel as Zelensky criticises 'gift to Putin'", "url": "https://www.bbc.co.uk/news/articles/cm1dwgr666wno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano criticou o acordo que permitiria à Rússia vender produtos diesel, afirmando que isso prolongaria uma guerra que precisa ser encerrada. O presidente dos Estados Unidos anunciou um acordo para permitir que a Rússia venda diesel.", "titulo_pt": "Trump anuncia acordo para venda de diesel russo enquanto Zelensky critica 'presente para Putin'", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 206723, "titulo": "JD Vance casts doubt on firing squad execution and says he will not watch it", "url": "https://www.bbc.co.uk/news/articles/ck20r39nl3qzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "JD Vance expressou dúvidas sobre a execução planejada de Nidal Hasan por fusilamento e declarou que não assistirá ao evento. Esta seria a primeira execução militar nos Estados Unidos desde há mais de 60 anos.", "titulo_pt": "JD Vance questiona execução por fusilamento de nidal hasan e afirma não assistir ao evento", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 206817, "titulo": "U.S. expects S. Korea to 'uphold' alliance standards amid intelligence cooperation concerns: senior official", "url": "https://en.yna.co.kr/view/AEN20261010000200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-09T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um alto funcionário dos Estados Unidos declarou que Washington espera que a Coreia do Sul 'mantenha' os padrões da aliança devido às preocupações sobre a cooperação intelectual.", "titulo_pt": "EUA espera que Coreia do sul 'mantenha' padrões da aliança devido a preocupações sobre cooperação intelectual", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 206719, "titulo": "Hurricane Isaias bears down on US Gulf Coast", "url": "https://www.lemonde.fr/en/international/article/2026/10/09/hurricane-isaias-bears-down-on-us-gulf-coast_6758437_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias está se aproximando da costa do Golfo dos Estados Unidos, levando a evacuações obrigatórias e avisos sobre a ameaça de ondas de maremotão letais, ventos destrutivos e inundações. É o primeiro furacão a atingir a costa continental dos Estados Unidos desde 2024.", "titulo_pt": "Furacão Isaias se aproxima da costa do golfo dos EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 206784, "titulo": "Trump, 'grande rapporto con Meloni, andiamo d'accordo'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/09/trump-grande-rapporto-con-meloni-andiamo-daccordo_cfade861-f73f-408a-b776-7a4dba971f90.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-09T21:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, tem uma boa relação com a líder da Liga Italiana, Giorgia Meloni, e provavelmente se encontrarão durante o G20.", "titulo_pt": "Trump, grande relação com Meloni, concordamos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 206795, "titulo": "The EU is its own worst enemy", "url": "https://www.scmp.com/opinion/china-opinion/article/3370176/eu-its-own-worst-enemy?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia votou por uma posição mais rígida em relação à China, apesar das lobbying prolongados de Pequim. O relatório classifica a China como um 'decisivo facilitador' da Rússia, sugere uma presença naval europeia contínua e exercícios conjuntos na região do Estreito da Taiwan, e descreve a política industrial chinesa como uma 'ameaça existencial' para a União Europeia.", "titulo_pt": "A união europeia é a pior inimiga dela mesma", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 206751, "titulo": "How the Red Sea came to the brink of a new regional war", "url": "https://www.middleeasteye.net/news/how-red-sea-came-brink-new-regional-war", "fonte_id": "middle_east_eye", "data_pub": "2026-10-09T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A região do Mar Vermelho está prestes a entrar em uma nova guerra regional, com a possibilidade de uma guerra entre Etiopía e Eritréia que não seria isolada e provavelmente envolveria potências regionais. Os governos de ambos os países estão sobrecarroçados, o que aumenta o risco de um conflito aberto.", "titulo_pt": "Como o mar vermelho chegou ao limite de uma nova guerra regional", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 206420, "titulo": "ONU rechaça sanções de Trump contra TPI após juíza sul-africana ganhar Nobel da Paz", "url": "https://www.brasildefato.com.br/2026/10/09/onu-rechaca-sancoes-de-trump-contra-tpi-apos-juiza-sul-africana-ganhar-nobel-da-paz/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-09T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O alto comissário da ONU para os Direitos Humanos, Volker Türk, considerou as sanções impostas pelo governo dos EUA contra o Tribunal Penal Internacional como inaceitáveis. Essas sanções foram uma resposta às premiações da ex-juíza Navi Pillay com o Nobel da Paz.", "titulo_pt": "ONU rechaça sanções de Trump contra TPI após juíza sul-africana ganhar Nobel da Paz", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 206489, "titulo": "EUA emitem licença geral para fornecimento de diesel russo ao mercado global", "url": "https://www.infomoney.com.br/mundo/eua-emitem-licenca-geral-para-fornecimento-de-diesel-russo-ao-mercado-global/", "fonte_id": "infomoney", "data_pub": "2026-10-09T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos emitiram uma licença geral que permite a venda, entrega, descarregamento e importação de diesel russo no mercado global até 7 de abril de 2027.", "titulo_pt": "EUA emitem licença geral para fornecimento de diesel russo ao mercado global", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 206690, "titulo": "Fired OpenAI employees question the company's commitment to safety", "url": "https://www.npr.org/2026/10/09/nx-s1-5996890/openai-safety-firings", "fonte_id": "npr_news", "data_pub": "2026-10-09T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três ex-funcionários da OpenAI foram demitidos por questionar a segurança da empresa, segundo eles. A empresa nega as acusações e afirma que os funcionários foram demitidos por manipular informações confidenciais de forma inadequada.", "titulo_pt": "Ex-funcionários da OpenAI questionam compromisso da empresa com a segurança", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 206724, "titulo": "Powerful magnitude 7.7 earthquake hits Panama, damaging buildings", "url": "https://www.bbc.co.uk/news/articles/c620r39zdp9wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-09T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,7 atingiu a Panamá, causando danos a edifícios. Alertas de tsunami foram emitidos para países vizinhos e vídeos de destruição circulam na internet.", "titulo_pt": "Terremoto de magnitude 7,7 atinge panamá, causando danos a edifícios", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 206691, "titulo": "Trump says U.S. to get diesel from Russia, relaxing pressure on Moscow to ease prices before midterms", "url": "https://www.npr.org/2026/10/09/nx-s1-5996912/trump-says-u-s-to-get-diesel-from-russia-relaxing-pressure-on-moscow-to-ease-prices-before-midterms", "fonte_id": "npr_news", "data_pub": "2026-10-09T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que o país vai obter diesel da Rússia, diminuindo a pressão dos Estados Unidos sobre Moscou para reduzir os preços de combustíveis antes das eleições gerais. Trump fez o acordo com o presidente russo, Vladimir Putin, por telefone.", "titulo_pt": "Trump anuncia importação de diesel da Rússia, relaxando pressão sobre moscou", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 206626, "titulo": "7.7-Magnitude Panama Earthquake Sets Off Series of Aftershocks", "url": "https://www.nytimes.com/2026/10/09/world/americas/panama-earthquake-tsunami.html", "fonte_id": "nyt_world", "data_pub": "2026-10-09T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,7 ocorreu na região sul do Panamá, gerando uma série de réplicas. As autoridades cancelaram o alerta de tsunami para a região afetada.", "titulo_pt": "Terremoto de 7,7 graus no panamá gera série de réplicas", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 206752, "titulo": "Saudi-led coalition launches wide-ranging operation against Houthis", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/saudi-led-coalition-says-it-launches-wide-ranging-operation-against", "fonte_id": "middle_east_eye", "data_pub": "2026-10-09T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A coalisão liderada por Arábia Saudita lançou uma operação abrangente contra os hutitas em Yemen, destruindo 136 alvos militares em áreas sob controle hutita. A coalisão também fornecia apoio aéreo contínuo às forças do governo yemenita.", "titulo_pt": "Coalisão liderada por arábia saudita inicia operação ampla contra hutitas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 206074, "titulo": "GlobalFoundries rallies after US$2bn TSMC deal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/10/2003865697", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "GlobalFoundries reagiu positivamente após fechar um acordo de US$2 bilhões com TSMC.", "titulo_pt": "Globalfoundries reage positivamente após acordo de US$2 bilhões com TSMC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206604, "titulo": "Trump anuncia que Rusia suministrará más de 300.000 toneladas de diésel al mercado global y de EE.UU.", "url": "https://www.latercera.com/mundo/noticia/trump-anuncia-que-rusia-suministrara-mas-de-300000-toneladas-de-diesel-al-mercado-global-y-de-eeuu/", "fonte_id": "la_tercera", "data_pub": "2026-10-09T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou um acordo com o presidente russo, Vladimir Putin, para a exportação de mais de 300.000 toneladas de diesel russo ao mercado global e americano. O acordo prevê o fornecimento de três milhões de toneladas de diesel russo a curto prazo.", "titulo_pt": "Trump anuncia que Rússia fornecerá mais de 300.000 toneladas de diesel ao mercado global e americano", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 206361, "titulo": "Reforma Tributária: 86% das notas fiscais destacam a CBS", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/reforma-tributaria-86-das-notas-fiscais-destacam-cbs", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-09T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 86% das notas fiscais emitidas nas últimas 30 dias por empresas obrigadas pela Reforma Tributária a destacar a Contribuição sobre Bens e Serviços (CBS) cumpriram a determinação. Foram emitidos 3,7 bilhões de notas com a informação do tributo, enquanto 600 milhões não a apresentaram.", "titulo_pt": "86% Das notas fiscais destacam a CBS na reforma Tributária", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 206335, "titulo": "Justiça argentina restabelece limites para a venda de terras a estrangeiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/justica-argentina-restabelece-limites-para-a-venda-de-terras-a-estrangeiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte argentina restabeleceu, de forma provisória, os limites à compra de terras por estrangeiros. A decisão reverte uma anterior que havia eliminado essas restrições.", "titulo_pt": "Justiça argentina reestabelece limites para venda de terras a estrangeiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206336, "titulo": "Departamento de Agricultura dos EUA mantém projeções para safras de soja e milho do Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/departamento-de-agricultura-dos-eua-mantem-projecoes-para-safras-de-soja-e-milho-do-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Agricultura dos EUA manteve as projeções das safras de soja e milho do Brasil para os ciclos 2025/26 e 2026/27, enquanto o país inicia o plantio no novo ciclo.", "titulo_pt": "Departamento de Agricultura dos EUA mantém projeções para safras de soja e milho do Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206337, "titulo": "Pilgrim's Pride forma comitê para analisar proposta de aquisição pela JBS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/pilgrims-pride-forma-comite-para-analisar-proposta-de-aquisicao-pela-jbs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Pilgrim's Pride Corp formou um comitê de conselheiros independentes para avaliar a proposta de aquisição não solicitada da JBS. O objetivo é analisar a oferta para adquirir as ações restantes da empresa de carne de frango norte-americana.", "titulo_pt": "Pilgrim's Pride forma comitê para analisar proposta de aquisição da JBS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206766, "titulo": "Rising fuel costs slashed Delta’s profit outlook despite strong demand", "url": "https://www.aljazeera.com/economy/2026/10/9/rising-fuel-costs-slashed-deltas-profit-outlook-despite-strong-demand?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T20:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento dos preços do combustível fez com que as despesas anuais com combustível da Delta subissem em US$ 6 bilhões, afetando a previsão de lucro da empresa para 2026.", "titulo_pt": "Aumento dos preços do combustível reduz previsão de lucro da Delta para 2026, apesar da forte demanda", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 206739, "titulo": "Verizon posts worst day since 2002 as SpaceX U.S. network plans whack cell provider stocks", "url": "https://www.cnbc.com/2026/10/09/verizon-att-tmobile-stocks-spacex-network.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-09T20:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Verizon registrou sua pior performance desde 2002, enquanto a SpaceX anunciou um acordo de espectro, visando expandir sua presença no mercado de telecomunicações através do serviço Starlink.", "titulo_pt": "Verizon registra pior dia desde 2002 enquanto SpaceX expande planos de mercado de telecomunicações", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 206338, "titulo": "ANP proíbe venda de biodiesel entre distribuidoras por mais dois anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/anp-proibe-venda-de-biodiesel-entre-distribuidoras-por-mais-dois-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretoria da ANP aprovou a proibição da venda de biodiesel entre distribuidoras de combustíveis por mais dois anos, com o objetivo de aumentar a rastreabilidade do produto usado na mistura obrigatória ao diesel.", "titulo_pt": "ANP proíbe venda de biodiesel entre distribuidoras por mais dois anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206339, "titulo": "Inadimplência cai em setembro, mas famílias comprometem mais renda com dívidas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/inadimplencia-cai-em-setembro-mas-familias-comprometem-mais-renda-com-dividas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O percentual de famílias brasileiras com dívidas em atraso diminuiu em setembro, mas elas comprometeram uma maior parte da renda com dívidas, de acordo com a Peic divulgada pela CNC.", "titulo_pt": "Inadimplência diminui, mas renda familiar dedicada a dívidas aumenta em setembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206340, "titulo": "Trump fecha acordo com Putin para liberar diesel russo no mercado global", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/trump-fecha-acordo-com-putin-para-liberar-diesel-russo-no-mercado-global.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que fechou um acordo com o presidente da Rússia, Vladimir Putin, para permitir que a Rússia disponibilize até 4,8 milhões de toneladas de diesel no mercado global. O objetivo é ajudar a conter os preços dos combustíveis antes das eleições legislativas americanas de novembro.", "titulo_pt": "Trump fecha acordo com Putin para liberar diesel russo no mercado global", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206341, "titulo": "Garibaldi projeta faturamento de R$ 350 milhões com aposta em uvas exóticas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/garibaldi-projeta-faturamento-de-r-350-milhoes-com-aposta-em-uvas-exoticas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T19:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cooperativa Vinícola Garibaldi, localizada no Rio Grande do Sul, projeta faturar R$ 350 milhões em 2026, com um crescimento de 15% em comparação com os anos anteriores. A empresa está investindo na pesquisa e no lançamento de vinhos com uvas exóticas, respondendo ao interesse crescente dos consumidores por produtos diferentes.", "titulo_pt": "Garibaldi projeta faturamento de R$ 350 milhões com uvas exóticas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206745, "titulo": "Oil and gas production disrupted as Hurricane Isaias barrels towards Gulf", "url": "https://www.ft.com/content/f7d90625-0d78-44b2-927f-d63f4dbc5e8d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-09T18:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro furacão do Atlântico desta temporada se dirige para Florida, Alabama, Georgia e Mississippi, disruptando a produção de petróleo e gás nessas hões de dólares, liderada pela a16z, apenas algumas semanas após o lançamento.", "titulo_pt": "A empresa criadora do modelo não-texto Jev, avaliada em 7,5 bilhões de dólares, concluiu uma rodada de financiamento de 870 milhões de dólares semanas após o lançamento", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 206799, "titulo": "Anthropic’s AI gave Philadelphia police a fake tip about an unsolved homicide", "url": "https://www.theverge.com/ai-artificial-intelligence/1009090/anthropic-fake-homicide-information-philadelphia-pd-tip", "fonte_id": "the_verge", "data_pub": "2026-10-09T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um modelo de inteligência artificial da Anthropic forneceu informações falsas sobre um homicídio não resolvido para uma central de denúncias da Polícia de Filadélfia, segundo relatório da 6abc. A polícia não revisou o relatório porque ele foi marcado como falso.", "titulo_pt": "IA da anthropic envia dica falsa sobre crime não resolvido para polícia de filadélfia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 206451, "titulo": "Essas rodas para veículos exploradores, inspiradas em origami, podem ajudar a explorar os tubos de lava da Lua", "url": "https://www.cnnbrasil.com.br/ciencia/essas-rodas-para-veiculos-exploradores-inspiradas-em-origami-podem-ajudar-a-explorar-os-tubos-de-lava-da-lua/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tecnologia desenvolvida por pesquisadores do KAIST permitirá que as rodas para veículos exploradores mudem de tamanho, facilitando a exploração de tubos de lava na Lua até 2030. Inspiradas em origami, essas rodas podem auxiliar nas missões de exploração lunar previstas para o futuro.", "titulo_pt": "Rodas inspiradas em origami podem auxiliar na exploração de tubos de lava na Lua até 2030", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206747, "titulo": "The hazy OpenAI growth metric driving Wall Street", "url": "https://www.ft.com/content/62653892-2333-4953-a8d5-cfd760ae3257?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-09T20:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Revelações sobre as receitas anualizadas da gigante de IA serem $20 bilhões menores do que anteriormente informado causaram volatilidade nos mercados acionários dos Estados Unidos.", "titulo_pt": "A incerta métrica de crescimento da OpenAI agitando o Wall Street", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 206811, "titulo": "Tesla’s ‘Full Self-Driving’ Becomes ‘Assisted Driving’ in Europe", "url": "https://www.wired.com/story/tesla-full-self-driving-becomes-assisted-driving-in-europe/", "fonte_id": "wired", "data_pub": "2026-10-09T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tesla está renomeando sua função 'Full Self-Driving' para 'Assisted Driving' na Europa em resposta a críticas sobre o nome do recurso. A mudança foi feita para atender às regulamentações europeias.", "titulo_pt": "Tesla renomeia 'Full Self-Driving' para 'Assisted Driving' na Europa", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 206805, "titulo": "AI coding agents generate more code, but not more software", "url": "https://arstechnica.com/ai/2026/10/ai-coding-agents-generate-more-code-but-not-more-software/", "fonte_id": "ars_technica", "data_pub": "2026-10-09T19:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa descobriu que a eficiência na geração de código por agentes de inteligência artificial aumenta, mas esses ganhos são compensados pela revisão humana mais lenta.", "titulo_pt": "Agentes de IA geram mais código, mas ganhos de eficiência são absorvidos por gargalos de revisão humana", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 206815, "titulo": "An Anthropic AI model sent a false homicide tip to Philadelphia police", "url": "https://techcrunch.com/2026/10/09/an-anthropic-ai-model-sent-a-false-homicide-tip-to-philadelphia-police/", "fonte_id": "techcrunch", "data_pub": "2026-10-09T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um modelo de IA da Anthropic enviou uma denúncia falsa de homicídio à polícia de Philadelphia. A Anthropic não se deu conta desse comportamento até mais de dois meses após o AI ter enviado a denúncia.", "titulo_pt": "Modelo de IA da Anthropic envia denúncia falsa de homicídio à polícia de Philadelphia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 206812, "titulo": "Book Publishers Are Quietly Using More AI. Staff Are Revolting", "url": "https://www.wired.com/story/book-publishers-are-quietly-using-more-ai-staff-are-revolting/", "fonte_id": "wired", "data_pub": "2026-10-09T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores de três grandes editoras relataram para a WIRED que sistemas de inteligência artificial estão sendo utilizados para publicidade, arte da capa, cópias de rodapé e e-mails, enquanto alguns executivos incentivam o pessoal mais jovem a apoiar a tecnologia.", "titulo_pt": "Editoras estão silenciosamente utilizando mais IA. Funcionários estão revoltados.", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 206806, "titulo": "Outrage grows as CDC reportedly poised to fund \"unethical\" vaccine trial", "url": "https://arstechnica.com/health/2026/10/rfk-jr-still-eager-to-fund-vaccine-trial-that-would-expose-babies-to-deadly-virus/", "fonte_id": "ars_technica", "data_pub": "2026-10-09T19:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CDC (Centers for Disease Control and Prevention) teria destinado $1,6 milhão para um estudo sobre supostos danos causados pelo vacina contra hepatite B. Isso gerou crescente indignação.", "titulo_pt": "Ira cresce após CDC ser acusado de financiar 'estudo éticamente duvidoso' sobre vacina contra hepatite b", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 206801, "titulo": "‘Pure insanity’: Mathematicians will need years to make sense of OpenAI’s latest drop", "url": "https://www.theverge.com/ai-artificial-intelligence/1008726/openai-mathematics-solutions-chaos", "fonte_id": "the_verge", "data_pub": "2026-10-09T19:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de trinta matemáticos expressaram surpresa e incerteza em relação aos resultados matemáticos recentemente divulgados pela OpenAI. Os resultados são considerados impressionantes e inéditos pela comunidade científica.", "titulo_pt": "‘Pura loucura’: matemáticos precisarão de anos para entender os últimos lançamentos da OpenAI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 206820, "titulo": "Three quantum-inspired cores leave opposite fingerprints on the ringing of black holes", "url": "https://phys.org/news/2026-10-quantum-cores-fingerprints-black-holes.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três núcleos inspirados pela quântica deixam impressões opostas no som do relógio de um buraco negro. A teoria de Einstein prediz que qualquer coisa que caia em um buraco negro é comprimida em um singularidade, um ponto de infinita densidade onde a teoria se desintegra. Os físicos esperam que a gravidade quântica substitua esse ponto por algo finito, mas o centro permanece oculto atrás do horizonte de eventos.", "titulo_pt": "Três núcleos inspirados pela quântica deixam impressões opostas no som do relógio de buracos negros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206651, "titulo": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "url": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "fonte_id": "guardian_world", "data_pub": "2026-10-09T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo controverso que irá withhold a vacina contra hepatite B para alguns recém-nascidos africanos foi aprovado para prosseguir. O secretário dos EUA para Saúde e Serviços Humanos, Robert F Kennedy Jr, que é um oponente histórico da vacina, é um dos principais promotores deste estudo.", "titulo_pt": "Estudo controverso que withholds vacina contra hepatite b de recém-nascidos em guiné-bissau é aprovado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 206390, "titulo": "Entenda por que nuvem de gelo gigante em Marte surge e desaparece diariamente; veja imagens", "url": "https://veja.abril.com.br/ciencia/entenda-por-que-nuvem-de-gelo-gigante-em-marte-surge-e-desaparece-diariamente-veja-imagens/", "fonte_id": "veja", "data_pub": "2026-10-09T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nuvem de gelo gigante chamada Nuvem Alongada de Arsia Mons (AMEC) surge e desaparece diariamente em Marte. Ela tem quase o dobro do tamanho do Reino Unido.", "titulo_pt": "Entenda por que nuvem de gelo gigante em Marte surge e desaparece diariamente; veja imagens", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206818, "titulo": "STAT+: Biotech leader, leading lab leak theorist no longer in consideration for top infectious disease role", "url": "https://www.statnews.com/2026/10/09/steven-quay-no-longer-in-consideration-for-top-infectious-disease-role/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-09T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steven Quay, um executivo da biotecnologia sem formação em doenças infecciosas, não está mais sendo considerado para o cargo de diretor da National Institute for Allergy and Infectious Diseases.", "titulo_pt": "Líder da biotecnologia e principal teórico da fuga do laboratório não são mais em consideração para cargo de liderança em doenças infecciosas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 206834, "titulo": "Major earthquake strikes Panama—damage and injuries are expected", "url": "https://www.scientificamerican.com/article/major-earthquake-strikes-panama-damage-and-injuries-are-expected/", "fonte_id": "scientific_american", "data_pub": "2026-10-09T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de natureza de deslizamento lateral ocorreu em Panamá, e é esperado que possam seguir fortes réplicas.", "titulo_pt": "Grande terremoto atinge panamá—danos e feridos são esperados", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 206821, "titulo": "Aspens 'remember' past drought in their leaves, 3-year experiment finds", "url": "https://phys.org/news/2026-10-aspens-drought-year.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um experimento de três anos descobriu que aspenes podem criar 'memórias funcionais' das secas anteriores através da química de suas folhas. As secas aparecem como faixas finas em anéis de crescimento anuais dos árvores.", "titulo_pt": "Aspenes 'memorizam' secas passadas nas suas folhas, diz estudo de 3 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206822, "titulo": "Plant-bacteria partnership reveals how roots access iron locked in soil", "url": "https://phys.org/news/2026-10-bacteria-partnership-reveals-roots-access.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa liderada por Paul Schulze-Lefert, do Instituto Max Planck para a Pesquisa de Crípsida Vegetal em Colônia, em colaboração com Ricardo F.H. Giehl, do Instituto Leibniz de Genética Vegetal e Pesquisa em Plantas de Culti, descobriu como as plantas Arabidopsis adaptam sua comunicação química com a microbiota bacteriana das raízes para maximizar a obtenção de ferro inutilizável do solo ácido ou calcário. O estudo foi publicado na revista Cell.", "titulo_pt": "Parceria planta-bactéria revela como as raízes acessam ferro preso no solo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206833, "titulo": "PAHO assesses risk of measles spread as very high ahead of religious mass gatherings in the Americas", "url": "https://www.paho.org/en/news/9-10-2026-paho-assesses-risk-measles-spread-very-high-ahead-religious-mass-gatherings-americas", "fonte_id": "paho", "data_pub": "2026-10-09T20:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO avaliou o risco de propagação da rubéola como muito alto antes das grandes reuniões religiosas na América. Essa avaliação foi feita em 9 de outubro de 2026.", "titulo_pt": "PAHO considera risco de propagação da rubéola muito alto antes das grandes reuniões religiosas na américa", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 206835, "titulo": "How Hurricane Isaias got so dangerously strong so fast", "url": "https://www.scientificamerican.com/article/how-hurricane-isaias-got-so-dangerously-strong-so-fast/", "fonte_id": "scientific_american", "data_pub": "2026-10-09T20:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias intensificou-se rapidamente para uma categoria 3 e está se dirigindo para a costa do Golfo dos Estados Unidos.", "titulo_pt": "Como o furacão Isaias se tornou tão perigosamente forte tão rápido", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 206823, "titulo": "Adjustable nanosensors turn water pressure into fluorescent signals, with stiffness shaping sensitivity", "url": "https://phys.org/news/2026-10-adjustable-nanosensors-pressure-fluorescent-stiffness.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo plataforma baseada em nanovesículas desenvolvida pelo Instituto de Ciência de Tóquio pode medir a pressão hidrostática convertendo mudanças moleculares induzidas pela pressão em sinais fluorescentes.", "titulo_pt": "Nanosensores ajustáveis transformam pressão da água em sinais fluorescentes, com rigidez moldando a sensibilidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206654, "titulo": "America’s good hurricane luck is about to run out", "url": "https://www.vox.com/today-explained-newsletter/505981/hurricane-isaias-storm-forecast-disaster-relief-el-nino", "fonte_id": "vox", "data_pub": "2026-10-09T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro furacão da temporada outonal está previsto para atingir a costa do Golfo durante a noite, marcando o início mais tardio da temporada de furacões em memória recente. Até a tarde de sexta-feira, o Furacão Isaias havia se intensificado.", "titulo_pt": "A boa sorte dos estados unidos com furacões está prestes a acabar", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 206824, "titulo": "Climate change drives new species combinations, prompting calls to rethink conservation goals", "url": "https://phys.org/news/2026-10-climate-species-combinations-prompting-rethink.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os ecossistemas estão mudando, mas o que é novo é a velocidade e a escala com que novas comunidades de espécies estão surgindo devido ao aquecimento global. Processos que antes demoravam séculos ou até milênios agora estão sendo observados em apenas algumas décadas.", "titulo_pt": "Mudanças climáticas impulsionam combinações de novas espécies, exigindo uma reavaliação dos objetivos de conservação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206825, "titulo": "Polar oceans store carbon—but policy is not yet ready to count it", "url": "https://phys.org/news/2026-10-polar-oceans-carbon-policy-ready.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As oceanos polares podem desempenhar um papel importante na armazenamento de carbono e na manutenção da biodiversidade, mas os atualizações científicas e os quadros políticos não estão ainda preparados para reconhecer plenamente esse potencial.", "titulo_pt": "Oceanos polares armazenam carbono e biodiversidade, mas a política ainda não está pronta para reconhecê-lo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206826, "titulo": "Fluorescent imaging tracks metabolism of cells in real time", "url": "https://phys.org/news/2026-10-fluorescent-imaging-tracks-metabolism-cells.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Cornell University desenvolveram uma nova técnica de fluorescência de dois fotôneos mais rápida para observar a metabolização de células em tempo real. O método permitirá um screening mais rápido de novos tratamentos terapêuticos.", "titulo_pt": "Imagem fluorescente rastreia metabolismo de células em tempo real", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206827, "titulo": "Cyberbullying rarely occurs in isolation—it functions as an extension of school violence, say researchers", "url": "https://phys.org/news/2026-10-cyberbullying-rarely-isolation-functions-extension.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa com 4.200 adolescentes mostrou que o cyberbullying geralmente ocorre em conjunto com agressões físicas e verbais no ambiente escolar. O estudo, realizado pela Universidade Federal de São Paulo (Unifesp), demonstrou que a linha entre vítimas e agressores se confunde em um ciclo de violência que abrange tanto o mundo físico quanto o digital.", "titulo_pt": "Cyberbullying raramente ocorre em isolamento - ele funciona como uma extensão da violência escolar, afirmam os pesquisadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206828, "titulo": "What a swordfish washing up on British Columbia's coast says about our changing oceans", "url": "https://phys.org/news/2026-10-swordfish-british-columbia-coast-oceans.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documentarista e entusiasta de natureza, Quinn Barabash, recentemente notou um corpo de espada de peixe de quase dois metros de comprimento na praia remota de Haida Gwaii, no norte da Colúmbia Britânica.", "titulo_pt": "O que um espada-de-peixe encontrado na costa da colúmbia britânica diz sobre nossos oceanos em mudança", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 206065, "titulo": "Overseas offices celebrate Double Ten", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865727", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As delegações estrangeiras comemoraram o Dia Nacional de Taiwan. O evento ocorreu em vários escritórios no exterior.", "titulo_pt": "Delegações estrangeiras celebram dia nacional de taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206066, "titulo": "Giant Taiwan flag flies freely on National Day", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865728", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um enorme bandeira de Taiwan foi voando livremente durante o Dia Nacional da República. O evento ocorreu em comemoração ao Dia Nacional, mas não há detalhes adicionais sobre o local ou as circunstâncias específicas da exibição da bandeira.", "titulo_pt": "Gigantesca bandeira de Taiwan voa livremente no dia nacional", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 20606
