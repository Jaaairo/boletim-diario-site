<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 25/10/2026 15:21 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "25/10/2026 15:21", "stats": {"noticias_novas": 674, "resumos_gerados": 220}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Mais de 158 milhões de eleitores brasileiros participaram das eleições deste domingo, 25, em uma disputa acirrada entre Flávio Bolsonaro e Luiz Inácio Lula da Silva. O Tribunal Superior Eleitoral (TSE) informou que 900 urnas foram substituídas até o meio-dia, e o presidente do TSE, Alexandre de Moraes, estima que os resultados sejam conhecidos até 21h. Além disso, o ministro Alexandre de Moraes, que também esteve atento ao transporte público em Salvador, determinou a prisão de um secretário municipal por crime eleitoral. Em São Paulo, o PT acionou a Justiça Eleitoral sobre a utilização de ônibus da Prefeitura durante a campanha. Por fim, o ex-presidente Jair Bolsonaro pode retornar a receber visitas semanais de um grupo de oração após decisão do ministro Alexandre de Moraes.", "mundo": "Nos últimos dias, o mundo assistiu a uma série de eventos importantes. Na Venezuela, a líder oposicionista María Corina Machado retornou do exílio, desafiando o governo chavista. Em seguida, os brasileiros votaram no segundo turno das eleições presidenciais, com candidatos como Lula e Flávio Bolsonaro buscando o apoio dos eleitores. O presidente Lula obteve vitórias significativas em países como a Síria, Arábia Saudita e Kuwait, enquanto Flávio Bolsonaro liderava nas eleições na Ásia, incluindo o Japão. Além disso, a Europa enfrentou intensos temporais que causaram problemas de infraestrutura e deslocaram voos. Na Colômbia, a direita radical venceu, influenciando a estratégia de Lula. Na França, protestos pacíficos continuaram, com cerca de 410.000 pessoas marchando em todo o país, enquanto na Colômbia, a Lista do Estudante, que surgiu dos protestos, desafiou o partido governamental.\n\nAs tensões geopolíticas aumentam em várias regiões do mundo. Na Arábia Saudita, as defesas aéreas interceptaram mísseis e drones dos hutíes, que são apoiados pelo Irã. Os hutíes reivindicaram ataques a aeroportos e instalações energéticas, aumentando os riscos de interrupção de suprimentos na região. Em Israel, o primeiro-ministro Netanyahu considera a utilização de criptomoedas como uma alternativa para contornar as sanções econômicas impostas a Israel, mas sua proposta gerou reações negativas. Em Taiwan, o exército adotou treinamentos não padronizados para aumentar a preparação. O Irã advertiu que responderia de forma 'inimaginável' a qualquer agressão dos Estados Unidos, conforme as tensões aumentam em torno do Estreito de Ormuz. Além disso, a Arábia Saudita acusa o Irã de violar os termos do acordo Starlink, e o presidente russo Putin acusa a Europa de culpar a Rússia pelas manifestações e afirma que seu país mantém a venda de gás natural liquefeito para o mercado europeu. No entanto, a corrida eleitoral brasileira de 2026 entre Lula e Bolsonaro está em uma disputa acirrada, com o presidente americano influenciando o resultado ao apoiar o candidato incumbente.", "economia": "A Federação está para liderar uma pausa hawkish de três entidades, mantendo a taxa de juros estável com uma postura mais conservadora. As despesas com combustível da Taipower aumentaram devido às tensões geopolíticas, enquanto os preços dos combustíveis permaneceram estáveis por mais uma semana, apesar do aumento nos preços do petróleo. O Brasil caiu do 28º para o 62º lugar em ranking de crescimento da indústria, com o desempenho da indústria de transformação brasileira continuando fraco. A Audi defendeu os planos para a construção de uma fábrica de US$ 4 bilhões em Georgia, mesmo com cortes de empregos no país. A Coreia do Sul está emergindo como uma liderança econômica global com um superávit comercial recorde, enquanto o valor das empresas de luxo europeias caiu em torno de 250 bilhões de euros devido ao enfraquecimento da demanda chinesa. A Coreia do Sul planeja aumentar o número de voos internacionais durante a temporada invernal. A inteligência artificial tem o potencial de transformar o trabalho no futuro, com lições valiosas vindas do passado, como a Revolução Industrial e a Grande Depressão, sendo analisadas para entender as mudanças futuras.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia, com diversos aspectos sendo debatidos. A MODA está trabalhando para melhorar a transparência sobre a utilização de IA em suas plataformas de mídia social, buscando fornecer informações mais claras aos usuários. No entanto, a adoção de IA não se traduziu em ganhos financeiros significativos para a maioria das empresas, conforme afirmou um economista da Apollo. Além disso, a crise nas memórias e a globalização da produção de semicondutores levaram a um aumento nos preços dos processadores, afetando diversos componentes de hardware. As preocupações com a IA também se estendem à sua possibilidade de aprofundar a desigualdade global, conforme alertou um funcionário das Nações Unidas. Em um cenário mais otimista, a Inteligência Artificial está sendo aplicada em diversos campos, como na navegação autônoma da NASA na Lua, no desenvolvimento de robôs humanoides que executam movimentos de kung fu, e na melhoria do design de veículos, como o ressuscitado SUV Freemont da Fiat. A indústria de jogos também está prestes a ver o lançamento do GTA 6, que pode quebrar recordes de indicações e premiações no The Game Awards.", "ciencia": "Um estudo da Universidade do Novo México aponta que os métodos de triagem governamentais podem ignorar comunidades rurais, o que pode afetar o acesso a fundos públicos. Em outro avanço científico, um grupo de cientistas do HZB descobriu vórtices polares em superlattices (BaTiO₃/SrTiO₃)₁₀ sobre silício, o que amplia o espectro de materiais e substratos em que podem ocorrer texturas polares topológicas. Além disso, a Imagem do Dia da Astronomia de 25 de outubro de 2026, mostra a matéria escura em um universo simulado, destacando a distribuição da matéria escura em um cenário de simulação cósmica. Outros assuntos relevantes incluem a descoberta de um novo tipo de fungo que faz as pessoas verem pequenas figuras humanas, bem como a possibilidade de que um ingrediente comum em gomas para dormir de cânhamo possa ser mais viciante do que se pensava. A descoberta de três buracos negros ativamente alimentados em uma única galáxia a mais de 12,5 bilhões de anos-luz da Terra também merece destaque, revelando um cenário notável do início do universo.", "cultura": "A cultura global continua em destaque com diversos eventos e lançamentos. O filme 'Cara-de-Barro', do universo Batman, liderou as bilheterias nos EUA, arrecadando US$ 24 milhões. Em outro destaque, o produtor coreano Shin Chun-soo e a diretora Julie Taymor colaboraram na produção de 'The Grand Delusion', uma nova musical que terá sua estreia mundial em Nova York em 2027. No Brasil, a turnê do músico Nailson Vieira levou a cultura popular de Pernambuco para o Japão, realizando sete apresentações que incluirão cortejos de maracatu rural. Um evento cultural importante é a exposição no Palácio Capanema, que apresenta 12 murais de Candido Portinari, ilustrando os 'Ciclos Econômicos Brasileiros', do período colonial à industrialização, baseados em uma palestra sobre o tema. No entanto, este evento não inspira grande entusiasmo, conforme avaliação da Folha de S. Paulo.", "sociedade": "Protestos contra desigualdade e altos custos de vida em França mobilizaram cerca de 410 mil pessoas em todo o país, segundo relatos iniciais. No entanto, as manifestações, que inicialmente foram pacíficas, se transformaram em confrontos em várias cidades no segundo fim de semana consecutivo. Em outro evento, um jovem de 19 anos morreu durante uma carreata em apoio a Flávio Bolsonaro em Goianésia, Goiás, após ser atropelado. O Ministério da Igualdade Racial classificou como inaceitável uma cena em que um homem negro estava acorrentado, comparando-a ao período da escravidão no Brasil. Em outro desenvolvimento, o percentual de estudantes de ensino médio coreanos que experimentaram sentimentos de depressão ultrapassou o de estudantes de ensino superior pela terceira vez consecutiva, com 26,2% dos alunos de ensino médio se declarando depressivos no ano anterior, contra 25,1% dos alunos de ensino superior. Por fim, um tiroteio perto de um estádio na Flórida deixou 11 feridos, seis dos quais são menores de idade, incluindo uma criança de 11 anos, com um dos feridos em estado crítico.", "meio_ambiente": "Comunidades indígenas brasileiras expressaram preocupações sobre como o resultado das eleições poderia afetar as proteções ambientais. Eles temem que, em caso de vitória de um candidato menos propenso a defender o meio ambiente, as medidas de preservação possam ser reduzidas, o que poderia impactar significativamente a biodiversidade e o bem-estar das populações locais. Essa preocupação é justificada pelo histórico de mudanças nas políticas ambientais que acompanham as mudanças de administração federal. As comunidades indígenas têm sido importantes aliadas na luta pela conservação do meio ambiente e buscam garantir que suas vozes sejam ouvidas no processo eleitoral.", "direitos_humanos": "A Arquidiocese de Nova York concordou em pagar 800 milhões de dólares a mais de 1.300 sobreviventes de abuso sexual, em um acordo que se torna o segundo maior envolvendo um arcebispo católico nos Estados Unidos. Este é o segundo caso em que a arquidiocese se comprometeu a indenizar vítimas de abuso sexual, após o acordo de 880 milhões de dólares fechado pela Arquidiocese de Los Angeles em 2024. Em outro desenvolvimento, o Departamento de Segurança Nacional dos Estados Unidos alterou uma regra, reduzindo o prazo para responder a notificações importantes para refugiados de 30 para 10 dias, o que pode impactar negativamente quem busca asilo no país. Além disso, o ICE investiu 100 milhões de dólares em um programa que analisa dados pessoais de migrantes, levantando preocupações sobre a vigilância em massa. Em Israel, forças militares expulsaram cerca de 2.000 moradores de Hebron após um ataque que resultou na morte de dois soldados palestinos, como parte de uma linha mais dura contra a militância. Finalmente, uma reguladora de fertilização in vitro em Hong Kong encaminhou um caso à polícia após suspeitar que uma influenciadora chinesa estivesse oferecendo serviços de maternidade de substituição comercial para casais LGBTQ+ em Hong Kong, levantando questões sobre a discriminação e os direitos humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 225090, "titulo": "Que horas os eleitores devem saber o resultado da eleição no domingo? Veja a previsão", "url": "https://www.infomoney.com.br/politica/que-horas-os-eleitores-devem-saber-o-resultado-da-eleicao-no-domingo-veja-a-previsao/", "fonte_id": "infomoney", "data_pub": "2026-10-25T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores do Brasil votam entre Flávio Bolsonaro e Lula neste domingo (25). A previsão é que os resultados da eleição sejam conhecidos após o encerramento das apurações.", "titulo_pt": "Quando os eleitores devem saber o resultado da eleição no domingo? Confira a previsão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 225091, "titulo": "Nunes Marques diz não haver registro de votação em cédula de papel até agora", "url": "https://www.infomoney.com.br/politica/nunes-marques-diz-nao-haver-registro-de-votacao-em-cedula-de-papel-ate-agora/", "fonte_id": "infomoney", "data_pub": "2026-10-25T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nunes Marques concedeu uma entrevista coletiva ao lado dos presidentes da Câmara dos Deputados e do Senado. Ele afirmou que não há registro de votação em cédulas de papel até o momento.", "titulo_pt": "Nunes Marques diz não haver registro de votação em cédula de papel até agora", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 225212, "titulo": "Nunes Marques diz que avalia situação sobre transporte em Salvador antes de decidir", "url": "https://www.jota.info/eleicoes/eleicoes-2026/nunes-marques-diz-que-avalia-situacao-sobre-transporte-em-salvador-antes-de-decidir", "fonte_id": "jota", "data_pub": "2026-10-25T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz federal Nunes Marques está avaliando a situação sobre o transporte em Salvador antes de tomar uma decisão. Um pedido do PT está solicitando a prorrogação do prazo para 19h.", "titulo_pt": "Nunes Marques avaliará situação sobre transporte em Salvador antes de decidir sobre pedido do pt", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 224999, "titulo": "Nunes Marques sobre ampliar horário de votação: será analisado no seu tempo", "url": "https://www.metropoles.com/brasil/nunes-marques-sobre-ampliar-horario-de-votacao-sera-analisado-no-seu-tempo", "fonte_id": "metropoles", "data_pub": "2026-10-25T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eleitores em diversos locais do país, especialmente em Salvador, estão enfrentando dificuldades devido à falta de frota de ônibus. O juiz Nunes Marques afirmou que a possibilidade de ampliar o horário de votação será analisada quando o momento for adequado.", "titulo_pt": "Nunes Marques sobre ampliar horário de votação: será analisado no seu tempo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225004, "titulo": "“Corta quem fez o L”: juiz manda excluir vídeo sobre \"consequência do voto\"", "url": "https://www.metropoles.com/colunas/grande-angular/corta-quem-fez-o-l-juiz-manda-excluir-video-sobre-consequencia-do-voto", "fonte_id": "metropoles", "data_pub": "2026-10-25T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um juiz determinou que um vídeo publicado pelo médico Marcelo Sostena, que orientava empresários a mostrar a 'consequência do voto', seja excluído. O vídeo incluía retaliação a eleitores do presidente Lula.", "titulo_pt": "Exclusão do vídeo sobre 'consequência do voto'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224978, "titulo": "Os números das últimas pesquisas eleitorais sobre a disputa entre Flávio Bolsonaro e Lula", "url": "https://veja.abril.com.br/politica/os-numeros-das-ultimas-pesquisas-eleitorais-sobre-a-disputa-entre-flavio-bolsonaro-e-lula/", "fonte_id": "veja", "data_pub": "2026-10-25T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nove pesquisas eleitorais divulgadas recentemente indicam um empate técnico, com o senador Flávio Bolsonaro tendo ligeira vantagem nas medidas.", "titulo_pt": "Números das últimas pesquisas mostram empate técnico entre Flávio Bolsonaro e Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 225014, "titulo": "Boulos diz que pedirá prisão de Nunes por frota reduzida em SP no 2º turno", "url": "https://www.metropoles.com/sao-paulo/boulos-diz-que-pedira-prisao-de-nunes-por-frota-reduzida-em-sp-no-2o-turno", "fonte_id": "metropoles", "data_pub": "2026-10-25T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Boulos afirmou que solicitará a prisão de Ricardo Nunes, secretário municipal de Transporte, e do presidente da SPTrans durante o segundo turno das eleições. O pedido se refere à frota reduzida de ônibus em São Paulo.", "titulo_pt": "Boulos anuncia pedido de prisão de Nunes por frota reduzida em SP no 2º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225015, "titulo": "Prefeito defende secretário alvo do TRE e diz que ele volta de Paris na 2ª", "url": "https://www.metropoles.com/colunas/igor-gadelha/prefeito-defende-secretario-alvo-do-tre-e-diz-que-ele-volta-de-paris-na-2a", "fonte_id": "metropoles", "data_pub": "2026-10-25T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Salvador defendeu o secretário que teve prisão decretada, afirmando que ele está na França a convite do presidente Emmanuel Macron e retornará na segunda-feira.", "titulo_pt": "Prefeito defende secretário e diz que ele volta de Paris na segunda", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225016, "titulo": "Janones é tietado por fila de \"soldados\" em aeroporto no domingo de eleição", "url": "https://www.metropoles.com/minas-gerais/janones-e-tietado-por-fila-de-soldados-em-aeroporto-no-domingo-de-eleicao", "fonte_id": "metropoles", "data_pub": "2026-10-25T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado André Janones, que se tornou um importante cabo eleitoral para Lula no segundo turno das eleições, foi cercado por apoiadores no aeroporto no domingo de eleição.", "titulo_pt": "Janones é tietado por fila de 'soldados' no aeroporto no domingo de eleição", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225213, "titulo": "Presidente do TRE-BA manda prender secretário de Mobilidade de Salvador após retenção de ônibus", "url": "https://www.jota.info/eleicoes/eleicoes-2026/presidente-do-tre-ba-manda-prender-secretario-de-mobilidade-de-salvador-apos-retencao-de-onibus", "fonte_id": "jota", "data_pub": "2026-10-25T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal Regional Eleitoral da Bahia (TRE-BA) autorizou a prisão do secretário de Mobilidade Urbana de Salvador após uma operação de retenção de ônibus. A Federação Brasil da Esperança, formada por PT, PCdoB e PV, denunciou que a operação tinha uma frota reduzida em mais de 50%.", "titulo_pt": "Presidente do TRE-BA autoriza prisão de secretário após retenção de ônibus com frota reduzida", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 225095, "titulo": "Eduardo Bolsonaro diz confiar na vitória de Flávio: “Não subestimamos adversários”", "url": "https://www.infomoney.com.br/politica/eduardo-bolsonaro-diz-confiar-na-vitoria-de-flavio-nao-subestimamos-adversarios/", "fonte_id": "infomoney", "data_pub": "2026-10-25T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro expressou confiança na vitória do irmão Flávio Bolsonaro nas eleições. O ex-parlamentar não votou devido à suspensão de seus direitos políticos após condenação pelo STF.", "titulo_pt": "Eduardo Bolsonaro afirma confiar na vitória de Flávio: 'não subestimamos adversários'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 225058, "titulo": "PT aciona Justiça Eleitoral por ônibus em SP; Prefeitura diz que cumprirá", "url": "https://www.cnnbrasil.com.br/eleicoes/pt-aciona-justica-eleitoral-por-onibus-em-sp-prefeitura-diz-que-cumprira/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT acionou a Justiça Eleitoral sobre a utilização de ônibus da Prefeitura de São Paulo durante a campanha. A gestão de Bruno Nunes, da base de Bolsonaro, argumenta que cumpre as exigências e que o prazo para adaptação do plano foi curto.", "titulo_pt": "PT denuncia uso de ônibus da Prefeitura em SP; Prefeitura diz que cumpre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 225063, "titulo": "TRE-BA determina prisão de secretário em Salvador por crime eleitoral", "url": "https://www.cnnbrasil.com.br/eleicoes/tre-ba-determina-prisao-de-secretario-em-salvador/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T16:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRE-BA determinou a prisão de um secretário em Salvador por um crime eleitoral. O PT acusa a prefeitura de reduzir a circulação de ônibus com o objetivo de dificultar a participação dos eleitores.", "titulo_pt": "TRE-BA determina prisão de secretário em Salvador por crime eleitoral", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 225099, "titulo": "Autoridades votam pelo país; aliados de Lula e Flávio reforçam campanhas", "url": "https://www.infomoney.com.br/mercados/autoridades-votam-segundo-turno-eleicoes-2026/", "fonte_id": "infomoney", "data_pub": "2026-10-25T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades de diversos níveis do governo, incluindo presidentes da Câmara, Senado, STF e TSE, votaram neste domingo. Aliados dos candidatos à presidência intensificaram suas campanhas.", "titulo_pt": "Autoridades votam pelo país; aliados de Lula e Flávio reforçam campanhas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 224887, "titulo": "Moraes autoriza que Bolsonaro volte a receber visitas semanais de grupo de oração", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/moraes-autoriza-que-bolsonaro-volte-a-receber-visitas-semanais-de-grupo-de-oracao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-25T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, permitiu que o ex-presidente Jair Bolsonaro retome as visitas semanais de um grupo de oração. A decisão foi tomada em 10 de outubro de 2026.", "titulo_pt": "Moraes autoriza Bolsonaro a receber visitas semanais de grupo de oração", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 224910, "titulo": "TSE informa que 900 urnas foram substituídas até o meio-dia", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/tse-informa-que-900-urnas-foram-substituidas-ate-o-meio-dia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-25T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral informou que 900 urnas eletrônicas foram substituídas entre as 8h e o meio-dia deste domingo, durante o segundo turno das eleições. O número corresponde a 0,18% das urnas empregadas na votação deste ano.", "titulo_pt": "TSE informa que 900 urnas foram substituídas até o meio-dia", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 225428, "titulo": "HK agents risk losing Taiwan status", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/26/2003866611", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agentes de Hong Kong podem correr o risco de perder o estatuto de Taiwan. O texto sugere que há uma possibilidade de alteração no status desses agentes.", "titulo_pt": "Agentes de hong kong podem perder estatuto de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225429, "titulo": "Claims of vote-buying across Taiwan being probed", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/26/2003866612", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações estão sendo tomadas para investigar possíveis casos de compra de votos em todo o território de Taiwan. As autoridades estão examinando relatos de atividades suspeitas relacionadas ao voto.", "titulo_pt": "Investigações sobre compra de votos em Taiwan estão em andamento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225431, "titulo": "Musk accuses Ukraine of violating Starli Blanche defends DOJ lawsuit blocking Alaska Senate results if Republican loses", "url": "https://www.npr.org/2026/10/25/nx-s1-6016212/blanche-defends-doj-lawsuit-blocking-alaska-senate-results-if-republican-loses", "fonte_id": "npr_news", "data_pub": "2026-10-25T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral Todd Blanche defendeu a ação do Departamento de Justiça que questiona os resultados da corrida pelo Senado de Alaska, caso o republicano seja derrotado.", "titulo_pt": "Blanche defende ação do DOJ sobre resultados do senado de Alaska", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 225332, "titulo": "Brazil: long queues and river journeys mark decisive presidential vote", "url": "https://www.euronews.com/video/2026/10/25/brazil-long-queues-and-river-journeys-mark-decisive-presidential-vote", "fonte_id": "euronews", "data_pub": "2026-10-25T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os brasileiros foram às urnas no domingo para escolher entre Lula e Flávio Bolsonaro. Votantes de diferentes regiões, desde o Amazonas até Rio de Janeiro, demonstraram seu apoio, com canoas no rio e longas filas nas cidades.", "titulo_pt": "Brasil: filas longas e viagens pelo rio marcam segundo turno presidencial", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 225234, "titulo": "Serbia votes as strongman Vučić faces grassroots challenge to 12-year rule – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/25/europe-serbia-elections-aleksander-vucic-student-list-protests-bulgaria-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-25T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Serbácia está votando em um líder autoritário, Aleksandar Vučić, que enfrenta uma desafio de movimento estudantil após dois anos de protestos contra corrupção governamental e institucional. As projeções sugerem um recorde de 60,8% de comparecimento, o maior desde o meio dos anos 2000.", "titulo_pt": "Serbácia vota contra líder autoritário Vučić, que enfrenta desafio de movimento estudantil", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 225302, "titulo": "Marine Le Pen vows to restore 'rule of law' at presidential campaign kickoff", "url": "https://www.lemonde.fr/en/france/article/2026/10/25/marine-le-pen-vows-to-restore-rule-of-law-at-presidential-campaign-kickoff_6763891_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-25T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marine Le Pen, líder nas pesquisas de intenção de voto para a presidência na França, acusou o governo de Emmanuel Macron de ser indulgente com os protestos violentos e de falta de autoridade em sua primeira palestra de campanha no sábado em Orléans.", "titulo_pt": "Le Pen promete restaurar 'lei e ordem' no lançamento da campanha presidencial", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 224870, "titulo": "Voto no exterior: veja os resultados por país e a apuração de Lula x Flávio no 2º turno das eleições 2026", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/voto-no-exterior-veja-os-resultados-por-pais-e-a-apuracao-de-lula-x-flavio-no-2o-turno-das-eleicoes-2026.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-25T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Países da Ásia, África e Oceania já terminaram a votação do segundo turno da eleição presidencial. Os resultados internacionais e a apuração do confronto entre Lula e Flávio estão sendo monitorados.", "titulo_pt": "Voto no exterior: veja os resultados por país e a apuração de Lula x Flávio no 2º turno das eleições 2026", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 225348, "titulo": "AI’s ‘opportunity divide’ could deepen global inequality, UN official warns", "url": "https://www.aljazeera.com/news/2026/10/25/ais-opportunity-divide-could-deepen-global-inequality-un-official-warns?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial da agência das Nações Unidas para as Tecnologias da Informação e Comunicação alerta que a desigualdade no acesso à inteligência artificial pode aprofundar as desigualdades globais. O vice-secretário-geral da agência afirma que países mais pobres podem ficar para trás por causa do acesso desigual a esta tecnologia.", "titulo_pt": "Divisão de oportunidades da IA poderia aprofundar a desigualdade global, avisa oficial da ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 224871, "titulo": "Eduardo Bolsonaro diz não ter medo de Moraes e que Lula 'foi malandro' após perder dedo", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/poder/2026/10/eduardo-bolsonaro-sugere-que-flavio-saia-do-brasil-se-for-derrotado-e-que-lula-foi-malandro-apos-perder-dedo.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-25T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro, irmão do presidente, esteve em Miami e avaliou positivamente o desempenho de Jair Bolsonaro em um debate recente. Ele ironizou críticas a uma fala do senador sobre o número de dedos do ex-presidente Lula.", "titulo_pt": "Eduardo Bolsonaro não tem medo de Moraes e ironiza fala sobre dedos de Lula", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 225291, "titulo": "Peltola postpones campaign stops after Saturday car crash", "url": "https://www.politico.com/news/2026/10/25/peltola-car-crash-postpones-campaign-stops-01134902", "fonte_id": "politico", "data_pub": "2026-10-25T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A candidata ao Senado de Alaska e sua família sofreram ferimentos leves após  "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225094, "titulo": "TRE-BA manda prender secretário por falta de ônibus em Salvador; entenda", "url": "https://www.infomoney.com.br/politica/tre-ba-prisao-secretario-onibus-salvador/", "fonte_id": "infomoney", "data_pub": "2026-10-25T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral do Estado da Bahia (TRE-BA) ordenou a prisão de um secretário por falta de ônibus em Salvador. O governador Jerônimo Rodrigues (PT) disponibilizou policiais militares para conduzir ônibus na capital baiana.", "titulo_pt": "TRE-BA determina prisão de secretário por falta de ônibus em Salvador; entenda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 224918, "titulo": "Brasil despenca do 28º para o 62º lugar em ranking de crescimento da indústria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/brasil-despenca-do-28o-para-o-62o-lugar-em-ranking-de-crescimento-da-industria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-25T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria de transformação brasileira continua com crescimento inferior ao global, ocupando atualmente o 62º lugar no ranking, uma queda significativa desde 2024 quando estava na metade superior do ranking. Apesar de uma pequena recuperação recente, o desempenho da indústria permanece fraco.", "titulo_pt": "Brasil cai do 28º para o 62º lugar em ranking de crescimento da indústria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 225096, "titulo": "Alckmin lamenta violência política e cita agressão a vereadora do PT em MG", "url": "https://www.infomoney.com.br/mercados/alckmin-lamenta-violencia-politica-e-cita-agressao-a-vereadora-do-pt-em-mg/", "fonte_id": "infomoney", "data_pub": "2026-10-25T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_p s econômicos para o futuro da Infraero a médio e longo prazo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 225362, "titulo": "Bangladesh per capita GDP forecast to outstrip India’s: What does it mean?", "url": "https://www.aljazeera.com/news/2026/10/25/bangladesh-per-capita-gdp-forecast-to-outstrip-indias-what-does-it-mean?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T14:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bangladesh está previsto para ultrapassar o PIB per capita da Índia neste ano, mas isso não é a imagem completa da situação econômica.", "titulo_pt": "Bangladesh deve superar o pib per capita da Índia este ano: o que isso significa?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 225236, "titulo": "Volkswagen to build $4bn Audi SUV factory in US despite job cuts at home", "url": "https://www.theguardian.com/business/2026/oct/25/volkswagen-to-build-4bn-audi-suv-factory-in-us-despite-job-cuts-at-home", "fonte_id": "guardian_world", "data_pub": "2026-10-25T13:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Audi investirá US$ 4 bilhões para construir uma fábrica de SUVs em Georgia, Estados Unidos, criando 4.500 empregos. Este investimento ocorre no contexto de tarifas drenantes de Trump, intensa concorrência chinesa e transição para veículos elétricos.", "titulo_pt": "Volkswagen investirá 4 bi de dólares em fábrica de suvs da Audi nos EUA, criando 4.500 postos de trabalho", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 225221, "titulo": "CNJ discute política nacional para precatórios que incentiva acordos diretos", "url": "https://www.jota.info/justica/cnj-discute-politica-nacional-para-precatorios-que-incentiva-acordos-diretos", "fonte_id": "jota", "data_pub": "2026-10-25T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A resolução proposta tem como função complementar as normas de gestão e bjetivo é fornecer informações mais transparentes sobre como a tecnologia é utilizada.", "titulo_pt": "MODA trabalha com melhorias na divulgação de IA nas redes sociais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225198, "titulo": "O que acontece quando envio uma foto minha para uma IA?", "url": "https://canaltech.com.br/inteligencia-artificial/o-que-acontece-quando-envio-uma-foto-minha-para-uma-ia/", "fonte_id": "canaltech", "data_pub": "2026-10-25T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Muitas tendências nas redes sociais incentivam os usuários a enviar fotos pessoais para chatbots de IA, como para criar caricaturas ou ilustrações. Após o envio, as imagens podem ser armazenadas temporariamente, analisadas por sistemas de visão computacional e usadas para melhorar os modelos da empresa.", "titulo_pt": "O que acontece quando envio uma foto minha para uma IA?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 225199, "titulo": "Redmi Note 14 Pro: 7 erros comuns que destroem a bateria do celular", "url": "https://canaltech.com.br/smartphone/redmi-note-14-pro-7-erros-comuns-que-destroem-a-bateria-do-celular/", "fonte_id": "canaltech", "data_pub": "2026-10-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Redmi Note 14 Pro é um smartphone do segmento intermediário premium com uma bateria de 5.110 mAh. No entanto, há erros comuns que podem prejudicar a bateria, como aquecimento durante recargas e uso intensivo de recursos como jogos e câmera.", "titulo_pt": "Redmi Note 14 Pro: 7 erros comuns que destroem a bateria do celular", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 224917, "titulo": "Executivos estão otimistas com IA, mas funcionários temem substituição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/executivos-estao-otimistas-com-ia-mas-funcionarios-temem-substituicao.shtml", "fonte_i h Mobility: Blue-green is the color of autonomy", "url": "https://techcrunch.com/2026/10/25/techcrunch-mobility-blue-green-is-the-color-of-autonomy/", "fonte_id": "techcrunch", "data_pub": "2026-10-25T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TechCrunch Mobility continua sendo o centro de informações sobre o futuro do transporte, destacando o papel da inteligência artificial nesse setor. O tema desta edição aborda a cor azul-verde como símbolo da autonomia no transporte.", "titulo_pt": "Techcrunch Mobility: azul-verde é a cor da autonomia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 225356, "titulo": "UN official warns AI could ‘deepen’ global inequality", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/25/un-official-warns-ai-could-deepen-global-inequality?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um funcionário das Nações Unidas alerta que a inteligência artificial poderia aprofundar a desigualdade global.", "titulo_pt": "Funcionário das nações unidas avisa que AI pode aprofundar desigualdades globais", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 225202, "titulo": "Fiat quer ressuscitar SUV icônico para encarar chineses", "url": "https://canaltech.com.br/carros/fiat-quer-ressuscitar-suv-iconico-para-encarar-chineses/", "fonte_id": "canaltech", "data_pub": "2026-10-25T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiat está considerando a possibilidade de ressuscitar o modelo SUV Freemont, que foi vendido no Brasil entre 2011 e 2016. Projetos digitais sugerem uma nova versão do veículo, combinando design moderno com elementos do modelo original.", "titulo_pt": "Fiat pode trazer de volta SUV icônico para competir com chineses", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 225203, "titulo": "Fone com ANC pode prejudicar sua audição? Especialista responde", "url": "https://canaltech.com.br/fone-de-ouvido/fone-com-anc-pode-prejudicar-sua-audicao-especialista-responde/", "fonte_id": "canaltech", "data_pub": "2026-10-25T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os fones de ouvido com cancelamento de ruído auxiliam na redução de sons externos, permitindo que se ouça música, podcasts e chamadas com mais clareza em ambientes barulhentos. De acordo com o médico otorrinolaringologista Alexandre Camilotti Gasperin, esses fones podem contribuir para a proteção da audição ao permitir a reprodução de conteúdo em volumes mais baixos.", "titulo_pt": "Fone com ANC pode prejudicar sua audição? Especialista responde", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 225084, "titulo": "Unitree apresenta robô humanoide “guarda-costas” que executa movimentos de kung fu; veja", "url": "https://olhardigital.com.br/2026/10/25/pro/unitree-apresenta-robo-humanoide-guarda-costas-que-executa-movimentos-de-kung-fu-veja/", "fonte_id": "olhar_digital", "data_pub": "2026-10-25T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O robô humanoide 'Kung Fu Legend: Guardian', desenvolvido pela Unitree, pode reagir a situações de risco, como confrontos com invasores armados. O robô executa movimentos de kung fu para defesa.", "titulo_pt": "Unitree apresenta robô humanoide ‘guarda-costas’ que executa movimentos de kung fu; veja", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 225204, "titulo": "Como tirar a barra do Google da tela inicial na One UI 9", "url": "https://canaltech.com.br/apps/como-tirar-a-barra-do-google-da-tela-inicial-na-one-ui-9/", "fonte_id": "canaltech", "data_pub": "2026-10-25T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atualização One UI 9 da Samsung coloca uma barra de pesquisa do Google ou do Samsung Finder na tela inicial do celular. É possível removê-la para liberar espaço na tela.", "titulo_pt": "Como remover a barra de pesquisa do Google na tela inicial da One UI 9", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 225479, "titulo": "The hottest AI wearables and gadgets you should know about", "url": "https://techcrunch.com/2026/10/25/the-hottest-ai-wearables-and-gadgets-you-should-know-about/", "fonte_id": "techcrunch", "data_pub": "2026-10-25T14:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lista inclui vários dispositivos de inteligência artificial (AI) para uso wearable, como o Muse Charm, Bee, Friend e Plaud.", "titulo_pt": "Os dispositivos de IA wearables mais quentes que você deve conhecer", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 225205, "titulo": "GTA 6 pode quebrar o recorde de Clair Obscur: Expedition 33 no The Game Awards?", "url": "https://canaltech.com.br/games/gta-6-pode-quebrar-o-recorde-de-clair-obscur-expedition-33-no-the-game-awards/", "fonte_id": "canaltech", "data_pub": "2026-10-25T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2025, Clair Obscur: Expedition 33 quebrou todos os recordes de indicações no The Game Awards. A Rockstar Games está prestes a lançar o GTA 6, que pode quebrar todos os recordes de indicações e premiações já estabelecidos.", "titulo_pt": "GTA 6 pode quebrar recorde de Clair Obscur: expedition 33 no The Game Awards?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 225085, "titulo": "NASA quer levar supercomputador com IA para testar navegação autônoma na Lua", "url": "https://olhardigital.com.br/2026/10/25/ciencia-e-espaco/nasa-quer-levar-supercomputador-com-ia-para-testar-navegacao-autonoma-na-lua/", "fonte_id": "olhar_digital", "data_pub": "2026-10-25T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Spaceborne Computer-4 será levado para a Lua para testar a navegação autônoma, analisando imagens e evitando crateras sem a dependência do GPS. O objetivo é verificar a capacidade do supercomputador com IA para realizar tarefas de navegação em ambiente lunar.", "titulo_pt": "NASA quer levar supercomputador com IA para testar navegação autônoma na Lua", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 225206, "titulo": "10 momentos mais importantes de Bleach", "url": "https://canaltech.com.br/entretenimento/bleach-momentos-mais-importantes/", "fonte_id": "canaltech", "data_pub": "2026-10-25T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O anime de Bleach está prestes a terminar, levantando sentimentos de nostalgia entre os fãs. A série, que durou mais de 20 anos, contém muitos arcos importantes e batalhas intensas.", "titulo_pt": "10 Momentos mais importantes de Bleach", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 225491, "titulo": "How screening tools measure disadvantage may leave rural communities overlooked for public support", "url": "https://phys.org/news/2026-10-screening-tools-disadvantage-rural-communities.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo da Universidade do Novo México revela que a priorização de comunidades para receber apoio público pode depender das formas como suas necessidades são medidadas. A pesquisa apontou diferenças significativas nas formas como os instrumentos de triagem governamentais identificam comunidades, especialmente nas áreas rurais, o que pode afetar o acesso a fundos.", "titulo_pt": "Como ferramentas de triagem medem a desvantagem pode deixar comunidades rurais de lado no apoio público", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225492, "titulo": "Patterns of polar vortices discovered in lead-free superlattices on silicon", "url": "https://phys.org/news/2026-10-patterns-polar-vortices-free-superlattices.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de cientistas do HZB descobriu, pela primeira vez, vórtices polares em superlattices (BaTiO₃/SrTiO₃)₁₀ sobre silício. Esses resultados ampliam o espectro de materiais e substratos em que podem ocorrer texturas polares topológicas e abrem novas possibilidades para incorporar estados ferroelétricos complexos em tecnologias baseadas em silício.", "titulo_pt": "Padrões de vórtices polares descobertos em superlattices livres de halogênios sobre silício", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225490, "titulo": "STAT+: At ESMO, AstraZeneca’s cancer pursuits get a showcase", "url": "https://www.statnews.com/2026/10/25/esmo-astrazeneca-adcs-lung-gastric-cancer/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-25T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AstraZeneca tem experimentado grande impulso na oncologia nos últimos anos. A empresa teve uma grande exposição na principal conferência de câncer da Europa.", "titulo_pt": "AstraZeneca apresenta avanços na oncologia na principal conferência europeia", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 225061, "titulo": "Rios de gelo: entenda como se formam as geleiras e onde elas estão localizadas pelo planeta", "url": "https://www.cnnbrasil.com.br/curiosidades/rios-de-gelo-entenda-como-se-formam-as-geleiras-e-onde-elas-estao-localizadas-pelo-planeta/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Geleiras são grandes massas de neve comprimida que contêm informações sobre a última Era Glacial e ajudam a monitorar o aquecimento global. Elas estão localizadas em várias regiões do planeta, incluindo a Antártida, Groenlândia e montanhas.", "titulo_pt": "Rios de gelo: entenda como se formam as geleiras e onde elas estão localizadas pelo planeta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 225493, "titulo": "Protecting children from harm isn't enough—welfare systems must support healing through quality mental health care", "url": "https://phys.org/news/2026-10-children-isnt-welfare-quality-mental.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sistemas de assistência à criança no Quebec e no Canadá realizam um trabalho notável para proteger crianças e jovens de maus-tratos e para apoiar famílias que enfrentam desafios complexos. No entanto, a proteção dos crianças não é suficiente; os sistemas precisam também promover a recuperação através de cuidados de saúde mental de qualidade.", "titulo_pt": "Proteger crianças de maltrato não basta—sistemas de assistência social devem promover o processo de cura através de cuidados de saúde mental de qualidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225494, "titulo": "A few seconds of loading time can push online learners off track", "url": "https://phys.org/news/2026-10-seconds-online-learners-track.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que uma pausa adicional de um segundo no carregamento de uma lição online pode levar a menores taxas de conclusão de tarefas, notas mais baixas e menos tempo gasto no site.", "titulo_pt": "Vários segundos de carregamento podem desviar os estudantes online", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 224876, "titulo": "Histórias podem ter ajudado a ampliar cooperação entre humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/historias-podem-ter-ajudado-a-ampliar-cooperacao-entre-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-25T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma caverna da ilha de Sulawesi, na Indonésia, foi encontrada uma imagem narrativa de pelo menos 51,2 mil anos, que retrata humanos interagindo com animais. Este painel é considerado a primeira história visual conhecida.", "titulo_pt": "Histórias podem ter ajudado a ampliar cooperação entre humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 225517, "titulo": "On this day in space! Oct. 25, 1671: Astronomer Giovanni Cassini discovers Iapetus, Saturn's 'yin-yang' moon", "url": "https://www.space.com/space-exploration/on-this-day-in-space-oct-25-1671-astronomer-giovanni-cassini-discovers-iapetus-saturns-yin-yang-moon", "fonte_id": "space_com", "data_pub": "2026-10-25T13:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 25 de outubro de 1671, o astrônomo italiano Giovanni Cassini descobriu a lua de Saturno Iapetus. Este achado foi significativo porque Iapetus apresenta um aspecto incomum, com um lado muito mais escuro do que o outro.", "titulo_pt": "25 De outubro de 1671: astrônomo italiano Giovanni Cassini descobre a lua Iapetus, de saturno", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 225495, "titulo": "Microorganisms show promise for reducing emissions from manure", "url": "https://phys.org/news/2026-10-microorganisms-emissions-manure.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microorganismos mostram potencial para reduzir as emissões de detritos bovinos. As emissões de substâncias como amônia ocorrem quando urina e fezes misturam-se no chão das instalações de criação. Os agricultores de leite querem aumentar o valor fertilizante do esterco quando aplicado à terra agrícola.", "titulo_pt": "Microorganismos mostram potencial para reduzir emissões de detritos bovinos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225496, "titulo": "Southern Africa's first known stenciled rock art found hiding in plain sight", "url": "https://phys.org/news/2026-10-southern-africa-stenciled-art-plain.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A África do Sul é o primeiro local na região sul da África a ter sido descoberto com arte rupestre estencilada. Antes disso, a região não possuía exemplos conhecidos de arte rupestre estencilada.", "titulo_pt": "Primeira arte rupestre estencilada da áfrica do sul sul descoberta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225500, "titulo": "Scientists reveal the hidden danger of missing blood pressure medication", "url": "https://www.sciencedaily.com/releases/2026/10/261024222028.htm", "fonte_id": "science_daily", "data_pub": "2026-10-25T12:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise de mais de 91.000 pessoas revelou que omissão na medicação anticonvulsivante pode diminuir significativamente a proteção contra ataques cardíacos e derrames. Pacientes que tomaram consistentemente a medicação tiveram uma redução de 11% nos eventos cardíacos maiores, enquanto aqueles que deixaram de tomar muitas doses não obtiveram quase nenhum benefício mensurável.", "titulo_pt": "Cientistas revelam perigo oculto da omissão de medicação anticonvulsivante", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 225499, "titulo": "Just two drinks a day may be far riskier than you think", "url": "https://www.sciencedaily.com/releases/2026/10/261024222030.htm", "fonte_id": "science_daily", "data_pub": "2026-10-25T12:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma ampla pesquisa indica que beber duas bebidas alcoólicas por dia está associado a um risco de 1 em 25 de morte por causas relacionadas ao álcool ao longo da vida, desafiando a ideia de que o consumo moderado é inofensivo. Os pesquisadores não encontraram benefícios significativos para a saúde geral com o consumo de álcool, com os riscos aumentando à medida que a ingestão aumenta.", "titulo_pt": "Apenas duas bebidas por dia podem ser muito mais perigosas do que você imagina", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 225503, "titulo": "Three giant black holes discovered in a galaxy from the dawn of time", "url": "https://www.sciencedaily.com/releases/2026/10/261024222000.htm", "fonte_id": "science_daily", "data_pub": "2026-10-25T12:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram três buracos negros ativamente alimentados dentro de uma única galáxia a mais de 12,5 bilhões de anos-luz da Terra, revelando um cenário notável do início do universo. Um desses buracos negros pesa 80 milhões de massas solares e está crescendo mais rapidamente do que as teorias convencionais preveem.", "titulo_pt": "Três buracos negros gigantes descobertos em uma galáxia do início do universo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 224877, "titulo": "Medo e terror", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/10/medo-e-terror.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-25T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão robótica MMX do Japão partiu em 20 de outubro de 2026, às 16h41 (horário de Brasília), com destino ao Marte. Após chegar ao planeta em agosto de 2027, a missão realizará sensoriamentos remotos da luva marciana Fobos.", "titulo_pt": "Mmx: missão japonesa de retorno de amostras do marte", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 225392, "titulo": "Measles surge exposes Republicans’ vulnerability on vaccines", "url": "https://www.ft.com/content/86e2ad4c-4a19-4221-8043-1c26e3354936?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-25T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um surto de sarampo expôs a vulnerabilidade dos republicanos em relação às vacinas, uma vez que o secretário de saúde Robert F Kennedy Jr expressa ceticismo sobre elas, enquanto a maioria dos americanos não compartilha essa visão.", "titulo_pt": "Surto de sarampo destaca vulnerabilidade dos republicanos em relação às vacinas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 225497, "titulo": "Global underground CO₂ storage hit record 43.6 million metric tons in 2024 alone", "url": "https://phys.org/news/2026-10-global-underground-storage-million-metric.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram armazenados 43,6 milhões de toneladas métricas de dióxido de carbono subterrâneo em 2024, um novo recorde anual. Ao longo dos últimos trinta anos, foram armazenadas 421,7 milhões de toneladas métricas de dióxido de carbono subterrâneo.", "titulo_pt": "Armazenamento subterrâneo global de CO₂ atinge recorde de 43,6 milhões de toneladas em 2024", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 225141, "titulo": "\"No tenemos por qué encajar en los encorsetados cánones que dictan que solo es posible florecer en la juventud\": los \"late bloomers\" reivindican que el mejor momento puede llegar en la madurez", "url": "https://www.clarin.com/internacional/encajar-encorsetados-canones-dictan-solo-posible-florecer-juventud-late-bloomers-reivindican-mejor-momento-puede-llegar-madurez_0_WdKjkaV5HW.html", "fonte_id": "clarin", "data_pub": "2026-10-25T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os 'late bloomers' atingem o sucesso ou a plenitude vital mais tarde do que o esperado. O artigo aborda os fatores que contribuem para esses desenvolvimentos, incluindo o passar dos anos e a aposentadoria.", "titulo_pt": "Não precisamos nos encaixar nos padrões enrijecidos que dizem que o sucesso só é possível na juventude: os 'late bloomers' defendem que o melhor momento pode chegar na madurez", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 225534, "titulo": "Watch Jay-Z Bring Out Dr. Dre and Snoop Dogg at LA Tour Closer", "url": "https://pitchfork.com/story/watch-jay-z-bring-out-dr-dre-and-snoop-dogg-at-la-tour-closer/", "fonte_id": "pitchfork", "data_pub": "2026-10-25T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jay-Z encerrou sua turnê de 30 shows no SoFi Stadium com a participação de Too $hort, John Legend, Scarface e Blue Ivy Carter. Dr. Dre e Snoop Dogg também se apresentaram no final da turnê.", "titulo_pt": "Veja Jay-Z trazer Dr. Dre e Snoop Dogg no encerramento da turnê em LA", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 225519, "titulo": "‘Clayface’ Tops the Box Office with $24 Million. What Does It Signal About DC Studios Latest Reboot?", "url": "https://www.indiewire.com/news/box-office/clayface-tops-box-office-24-million-dc-studios-reboot-james-gunn-1235223683/", "fonte_id": "indiewire", "data_pub": "2026-10-25T16:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Clayface liderou as bilheterias com US$ 24 milhões. James Gunn e Peter Safran foram contratados para revitalizar a marca de quadrinhos da DC, com resultados mistos.", "titulo_pt": "Clayface lidera bilheteria com $24 milhões: o que isso significa para o Reboot da DC Studios?", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 225511, "titulo": "‘He’s not going to punk me. I’ll trick him’: Ali G: Who Iz I? stooge says he was in on joke but didn’t tell Sacha Baron Cohen", "url": "https://www.theguardian.com/film/2026/oct/25/ali-g-who-iz-i-stooge-joshua-loudermilk-sacha-baron-cohen", "fonte_id": "guardian_culture", "data_pub": "2026-10-25T16:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joshua Loudermilk, um dos dois homens descredenciados pelo novo filme de Ali G, afirmou que estava ciente do plano, mas os produtores não sabiam. Durante o filme, Loudermilk reconheceu Sacha Baron Cohen, o ator que interpreta Ali G, no início da filmagem.", "titulo_pt": "Ele não vai me punkear. Vou me divertir com ele: joshua loudermilk diz que estava ciente do plano em ali G: quem sou eu, mas os produtores não sabiam", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 224903, "titulo": "Nova exposição no Palácio Capanema revela bastidores dos murais de Portinari", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/nova-exposicao-no-palacio-capanema-revela-bastidores-dos-murais-de-portinari.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-25T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A exposição no Palácio Capanema apresenta um conjunto de 12 murais de Candido Portinari que ilustram os 'Ciclos Econômicos Brasileiros', do período colonial à industrialização, baseados em uma palestra sobre o tema. A série não inspira grande entusiasmo.", "titulo_pt": "Nova exposição no Palácio Capanema revela murais de Portinari sobre a economia brasileira", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 225303, "titulo": "Trappes attack: From racism to terrorism, a collective responsibility", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/25/trappes-attack-from-racism-to-terrorism-a-collective-responsibility_6763825_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-25T15:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem suspeito de matar uma pessoa e ferir outras cinco em vilas ao oeste de Paris em uma rampa de violência ocorreu durante uma campanha presidencial profundamente polarizada, onde insultos e uma corrida para superar o extremismo da direita dominaram o cenário político.", "titulo_pt": "Passeio letal de violência: da racismo à terrorismo, uma responsabilidade coletiva", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 224904, "titulo": "'Cara-de-Barro', filme sobre vilão do Batman, lidera bilheterias nos EUA", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/cara-de-barro-filme-sobre-vilao-do-batman-lidera-bilheterias-nos-eua.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-25T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Cara-de-Barro', do universo Batman, liderou as bilheterias na América do Norte na última sexta-feira, arrecadando US$ 10,4 milhões. No fim de semana de estreia, a arrecadação total foi de US$ 24 milhões.", "titulo_pt": "Cara-de-barro lidera bilheterias nos EUA", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 225535, "titulo": "Turnstile Pack Out Washington Monument for Palestine, Sudan, and Lebanon Benefit Show", "url": "https://pitchfork.com/story/turnstile-pack-out-washington-monument-for-palestine-sudan-and-lebanon-benefit-show/", "fonte_id": "pitchfork", "data_pub": "2026-10-25T14:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A banda hardcore de Baltimore, Turnstile, arrecadou mais de 220 mil dólares para os esforços de ajuda humanitária da Human Concern International nos três regionais de Palestina, Sudão e Líbano.", "titulo_pt": "Turnstile lotam mais de 220 mil dólares para benefício em palestina, sudão e líbano", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 224906, "titulo": "'Quem Ama Cuida': Pilar manda Ingrid seduzir Heitor para não ir morar na rua", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/quem-ama-cuida-pilar-manda-ingrid-seduzir-heitor-para-nao-ir-morar-na-rua.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-25T14:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos próximos capítulos de 'Quem Ama Cuida', Pilar vai mandar Ingrid seduzir He
